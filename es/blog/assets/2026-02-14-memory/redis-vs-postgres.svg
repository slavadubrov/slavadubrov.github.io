<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">Comparativa de backends de checkpoints: Redis y PostgreSQL</title>
  <desc id="rp-desc">Comparativa alineada de Redis y PostgreSQL en tiempo de acceso, durabilidad, historial, modelo de consulta y adecuación operativa. PostgreSQL se destaca como opción predeterminada durable; Redis es la opción orientada a la latencia cuando se puede recuperar el estado reciente perdido.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .rule { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">STORE · LATENCIA PRIMERO</text>
  <text class="name" x="92" y="136">Checkpoint saver de Redis</text>
  <text class="note" x="92" y="156" style="font-size: 11px;">Elígelo cuando la latencia de reanudación sea el cuello de botella.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">FOCUS · PREDETERMINADO DURABLE</text>
  <text class="name focus-text" x="540" y="136">Checkpoint saver de PostgreSQL</text>
  <text class="note" x="540" y="156" style="font-size: 12.5px;">Elígelo cuando sea inaceptable perder trabajo completado.</text>

  <text class="kind" x="72" y="206">TIEMPO DE ACCESO</text>
  <text class="value" x="72" y="230">Inferior a un milisegundo</text>
  <text class="note" x="72" y="250">lecturas y escrituras en memoria</text>
  <text class="kind" x="520" y="206">TIEMPO DE ACCESO</text>
  <text class="value" x="520" y="230">Pocos milisegundos</text>
  <text class="note" x="520" y="250">escritura en la base de datos en cada límite</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">DURABILIDAD</text>
  <text class="value" x="72" y="318">Configurado con AOF o RDB</text>
  <text class="note" x="72" y="338">se pueden perder o expulsar escrituras recientes</text>
  <text class="kind" x="520" y="294">DURABILIDAD</text>
  <text class="value" x="520" y="318">Transacciones ACID y WAL</text>
  <text class="note" x="520" y="338">el checkpoint sobrevive a una escritura confirmada</text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">HISTORIAL · MODELO DE CONSULTA</text>
  <text class="value" x="72" y="406">Retención más índices de claves/búsqueda</text>
  <text class="note" x="72" y="426">el historial depende del saver y de la política de expulsión</text>
  <text class="kind" x="520" y="382">HISTORIAL · MODELO DE CONSULTA</text>
  <text class="value" x="520" y="406">Historial durable más SQL y JSONB</text>
  <text class="note" x="520" y="426">reanudar, inspeccionar y depurar con time travel</text>

  <text class="note" x="72" y="462"><tspan x="72">Mejor opción: estado de sesión recuperable y sensible a la</tspan><tspan x="72" dy="1.2em">latencia.</tspan></text>
  <text class="note" x="520" y="462">Mejor opción: tareas largas y recuperación reproducible.</text>
  <text class="note" x="48" y="510"><tspan x="48">Mide el tamaño de tu estado serializado y la frecuencia de escritura; los benchmarks genéricos de bases de datos no predicen el coste de los</tspan><tspan x="48" dy="1.2em">checkpoints.</tspan></text>
</svg>
