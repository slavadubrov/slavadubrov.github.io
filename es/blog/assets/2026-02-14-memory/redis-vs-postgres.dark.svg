<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rpd-title rpd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rpd-title">Comparativa de backends de checkpoints: Redis y PostgreSQL</title>
  <desc id="rpd-desc">Comparativa alineada de Redis y PostgreSQL en tiempo de acceso, durabilidad, histórico, modelo de consultas y adecuación operativa. PostgreSQL se destaca como opción predeterminada durable; Redis es la opción centrada en la latencia cuando perder el estado reciente es recuperable.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
    .rule { stroke: #2B3B33; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">STORE · LATENCIA PRIMERO</text>
  <text class="name" x="92" y="136">Checkpoint saver de Redis</text>
  <text class="note" x="92" y="156">Elígelo cuando la latencia de reanudación sea el cuello de botella.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">FOCUS · OPCIÓN PREDETERMINADA DURABLE</text>
  <text class="name focus-text" x="540" y="136">Checkpoint saver de PostgreSQL</text>
  <text class="note" x="540" y="156">Elígelo cuando sea inaceptable perder trabajo completado.</text>

  <text class="kind" x="72" y="206">TIEMPO DE ACCESO</text>
  <text class="value" x="72" y="230">Inferior a un milisegundo</text>
  <text class="note" x="72" y="250">lecturas y escrituras en memoria</text>
  <text class="kind" x="520" y="206">TIEMPO DE ACCESO</text>
  <text class="value" x="520" y="230">Pocos milisegundos</text>
  <text class="note" x="520" y="250">escritura en la base de datos en cada límite</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">DURABILIDAD</text>
  <text class="value" x="72" y="318">Configurado con AOF o RDB</text>
  <text class="note" x="72" y="338">se pueden perder o desalojar escrituras recientes</text>
  <text class="kind" x="520" y="294">DURABILIDAD</text>
  <text class="value" x="520" y="318">Transacciones ACID y WAL</text>
  <text class="note" x="520" y="338">el checkpoint sobrevive a una escritura confirmada</text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">HISTÓRICO · MODELO DE CONSULTAS</text>
  <text class="value" x="72" y="406">Retención más índices de claves y búsquedas</text>
  <text class="note" x="72" y="426">el histórico depende del saver y de la política de desalojo</text>
  <text class="kind" x="520" y="382">HISTÓRICO · MODELO DE CONSULTAS</text>
  <text class="value" x="520" y="406">Histórico durable más SQL y JSONB</text>
  <text class="note" x="520" y="426">reanudación, inspección y depuración con time travel</text>

  <text class="note" x="72" y="462">Adecuado para: estado de sesión recuperable y sensible a la latencia.</text>
  <text class="note" x="520" y="462">Adecuado para: tareas largas y recuperación reproducible.</text>
  <text class="note" x="48" y="510">Mide el tamaño de tu estado serializado y la frecuencia de escritura; los benchmarks genéricos de bases de datos no predicen el coste de los checkpoints.</text>
</svg>
