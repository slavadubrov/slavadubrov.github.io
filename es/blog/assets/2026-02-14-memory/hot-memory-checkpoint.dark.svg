<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hcd-title hcd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hcd-title">Se escribe un checkpoint después de cada super-step completado</title>
  <desc id="hcd-desc">Un nodo de LangGraph termina, su estado se serializa en un checkpoint y comienza el siguiente nodo. Tras reiniciar el proceso o recibir la aprobación humana, el grafo carga el último checkpoint completado y reanuda la ejecución en el siguiente límite de nodo, no en una línea de Python arbitraria.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="392" rx="14" fill="#0C1210" />

  <circle cx="62" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="62" y="63" text-anchor="middle">1</text>
  <circle cx="366" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="366" y="63" text-anchor="middle">2</text>
  <circle cx="670" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="670" y="63" text-anchor="middle">3</text>

  <rect class="process" x="48" y="88" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="122">PROCESO · SUPER-STEP</text>
  <text class="name" x="68" y="150">El nodo termina</text>
  <text class="note" x="68" y="170">mensajes · plan · datos recopilados</text>

  <rect class="focus" x="352" y="88" width="256" height="96" rx="10" />
  <text class="kind focus-text" x="372" y="122">FOCUS · CHECKPOINT</text>
  <text class="name focus-text" x="372" y="150">Persistir el estado completo del grafo</text>
  <text class="note" x="372" y="170">thread · namespace · versión</text>

  <rect class="process" x="656" y="88" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="122">PROCESO · GRAFO</text>
  <text class="name" x="676" y="150">Entrar en el siguiente nodo</text>
  <text class="note" x="676" y="170">el único límite seguro para reanudar</text>

  <path class="edge" d="M304 136h40" marker-end="url(#hcd-arrow)" />
  <path class="edge" d="M608 136h40" marker-end="url(#hcd-arrow)" />
  <text class="note" x="320" y="212">serializar el estado</text>
  <text class="note" x="624" y="212">cargar el último</text>

  <rect class="external" x="48" y="248" width="256" height="62" rx="10" />
  <text class="kind" x="68" y="272">EXTERNO · INTERRUPCIÓN</text>
  <text class="name" x="68" y="296">Reinicio o aprobación humana</text>
  <path class="edge" d="M304 279h96a80 80 0 0 0 80-80v-7" stroke-dasharray="7 6" marker-end="url(#hcd-arrow)" />
  <text class="note" x="336" y="267">solicitud de reanudación</text>

  <path d="M48 344h864" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="48" y="336">LÍMITE, NO TRAZA</text>
  <text class="note" x="236" y="365">La recuperación vuelve al último límite completado del grafo, no a la línea de Python donde se detuvo el worker.</text>

  <defs>
    <marker id="hcd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
