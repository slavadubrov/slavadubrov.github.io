<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">README.md explica el directorio a una persona; PROGRESS.md entrega el trabajo pendiente a la siguiente sesión del modelo.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Git registra cada cambio que hace el agente aquí: un aprendizaje incorrecto está a un revert de desaparecer.</text>
