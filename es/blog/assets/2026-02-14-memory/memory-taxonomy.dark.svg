<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mtd-title mtd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mtd-title">Seis tipos de memoria de agentes agrupados en tres niveles de almacenamiento</title>
  <desc id="mtd-desc">La memoria caliente contiene la memoria de trabajo y a corto plazo; la memoria fría contiene la memoria episódica y semántica; y la memoria documental almacena el conocimiento del proyecto. La memoria procedimental queda fuera de los niveles de almacenamiento, en las instrucciones del sistema y las definiciones de herramientas. La memoria de trabajo se resalta como el contexto que el modelo puede usar ahora.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">NIVEL CALIENTE · HILO ACTUAL</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">FOCO · TRABAJO</text>
  <text class="name focus-text" x="92" y="174">Contexto actual</text>
  <text class="note" x="92" y="194">un paso del modelo · no persistente</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">ALMACÉN · CORTO PLAZO</text>
  <text class="name" x="92" y="310">Checkpoint del hilo</text>
  <text class="note" x="92" y="330">minutos–horas · pausar y reanudar</text>
  <text class="note" x="72" y="408"><tspan x="72">Utilizable ahora; los checkpoints permiten</tspan><tspan x="72" dy="1.2em">recuperarlo.</tspan></text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">NIVEL FRÍO · ENTRE HILOS</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">ALMACÉN · EPISÓDICO</text>
  <text class="name" x="444" y="174">Interacciones pasadas</text>
  <text class="note" x="444" y="194">días–meses · eventos e historial</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">ALMACÉN · SEMÁNTICO</text>
  <text class="name" x="444" y="310">Hechos y preferencias</text>
  <text class="note" x="444" y="330">meses–permanente · vectorial o KV</text>
  <text class="note" x="424" y="408"><tspan x="424">Recuperación por significado o clave en el</tspan><tspan x="424" dy="1.2em">siguiente hilo.</tspan></text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94"><tspan x="776">NIVEL DOCUMENTAL · CONOCIMIENTO DEL</tspan><tspan x="776" dy="1.2em">PROYECTO</tspan></text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">ALMACÉN · DOCUMENTAL</text>
  <text class="name" x="796" y="174">Archivos inspeccionables</text>
  <text class="note" x="796" y="194" style="font-size: 12.5px;">notas · investigación · patrones aprendidos</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="800" y="246">ARCHIVOS</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Legible, editable y versionado.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">EXTERNO · PROCEDIMENTAL</text>
  <text class="name" x="420" y="520">System prompt y herramientas</text>
  <text class="note" x="420" y="544"><tspan x="420">Se incluye con el agente; no es un nivel</tspan><tspan x="420" dy="1.2em">recuperado.</tspan></text>
</svg>
