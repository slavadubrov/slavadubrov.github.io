<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="fullmem-title fullmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fullmem-title">La memoria caliente, fría y documental se conectan alrededor de un único harness del agente mediante rutas síncronas con la solicitud o aplazadas en segundo plano.</title><desc id="fullmem-desc">Una solicitud de usuario entra en el harness del agente, que escribe y restaura checkpoints en la ruta crítica, recupera hechos a largo plazo de forma síncrona antes de planificar y aplaza la escritura de hechos nuevos a un trabajo en segundo plano; además, lee la memoria documental al iniciar y también aplaza allí las nuevas escrituras. Las conexiones continuas forman parte de la ruta de ejecución o recuperación; las discontinuas son actualizaciones en segundo plano que nunca deben bloquear el reasoning loop.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fullmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="fullmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Tres rutas de memoria, un harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El harness decide qué llega al modelo; los almacenes solo conservan el estado hasta entonces.</text>
<path d="M42 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">EXTERNO · USUARIO</text><text x="46" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E">Solicitud de usuario</text><text x="46" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">la respuesta vuelve aquí</text>
