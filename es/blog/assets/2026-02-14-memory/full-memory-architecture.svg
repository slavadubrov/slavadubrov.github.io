<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">La recuperación desde la memoria fría bloquea la planificación; extraer y almacenar hechos nuevos no.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El harness, no un almacén concreto, decide qué llega realmente a la ventana de contexto del modelo.</text>
