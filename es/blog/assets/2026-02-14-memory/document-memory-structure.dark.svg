<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Git registra cada cambio que hace el agente aquí: un aprendizaje incorrecto está a un revert de desaparecer.</text>
