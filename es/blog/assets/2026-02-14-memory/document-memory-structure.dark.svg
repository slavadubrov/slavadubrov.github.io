<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">El directorio de memoria de documentos contiene cuatro carpetas temáticas bajo una raíz compartida, y cuatro operaciones —read, write, list y search— actúan sobre todas ellas.</title><desc id="docmem-desc">El directorio compartido .agent-memory contiene user-profiles, research, conventions y learnings como archivos Markdown. Una pequeña interfaz de file-memory expone cuatro operaciones que resuelven su ruta de destino dentro de esa misma raíz: read devuelve el contenido de un documento, write lo crea o sustituye, list encuentra rutas mediante un patrón glob y search devuelve los párrafos que coinciden con una palabra clave.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
