<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="xgrammar-title xgrammar-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="xgrammar-title">XGrammar generates a CPU bitmask and applies it on the logits device</title>
  <desc id="xgrammar-desc">The GPU produces raw logits. XGrammar's CPU grammar matcher generates a bitmask, the engine moves it to the logits device and applies it there, then sampling chooses an eligible token and advances the grammar state.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .mono { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #17211B; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="480" rx="14" fill="#F7F7F4"/>
  <text class="kind" x="48" y="48">ENFORCEMENT · POST-FORWARD, PRE-SAMPLING</text>

  <rect class="box" x="48" y="88" width="144" height="96" rx="10"/>
  <text class="kind" x="68" y="122">PROCESS · GPU</text>
  <text class="name" x="68" y="151">Forward pass</text>
  <path class="edge" d="M192 136h24" marker-end="url(#xgrammar-arrow)"/>
  <rect class="store" x="224" y="88" width="144" height="96" rx="10"/>
  <text class="kind" x="244" y="122">STORE · SCORES</text>
  <text class="name" x="244" y="151">Raw logits</text>
  <path class="edge" d="M368 136h24" marker-end="url(#xgrammar-arrow)"/>
  <rect class="box" x="400" y="88" width="144" height="96" rx="10"/>
  <text class="kind" x="420" y="122">PROCESS · GPU</text>
  <text class="name" x="420" y="151">Apply bitmask</text>
  <path class="edge" d="M544 136h24" marker-end="url(#xgrammar-arrow)"/>
  <rect class="box" x="576" y="88" width="144" height="96" rx="10"/>
  <text class="kind" x="596" y="122">PROCESS · GPU</text>
  <text class="name" x="596" y="151">Sampling</text>
  <path class="edge" d="M720 136h24" marker-end="url(#xgrammar-arrow)"/>
  <rect class="store" x="752" y="88" width="144" height="96" rx="10"/>
  <text class="kind" x="772" y="122">STORE · STATE</text>
  <text class="name" x="772" y="151">Accepted token</text>

  <rect x="400" y="224" width="144" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="420" y="258" fill="#C50E72">FOCUS · CPU</text>
  <text class="name" x="420" y="287" fill="#C50E72">Grammar matcher</text>
  <path class="edge" d="M472 224v-32" marker-end="url(#xgrammar-arrow)"/>
  <rect x="552" y="216" width="168" height="24" rx="6" fill="#F7F7F4"/>
  <text class="note" x="636" y="233" text-anchor="middle">bitmask moved to GPU</text>

  <path class="edge" d="M824 184v152a12 12 0 0 1-12 12H484a12 12 0 0 1-12-12v-8" stroke-dasharray="2 6" marker-end="url(#xgrammar-arrow)"/>
  <rect x="404" y="328" width="136" height="24" rx="6" fill="#F7F7F4"/>
  <text class="note" x="472" y="345" text-anchor="middle">advance and repeat</text>

  <path d="M48 392h416" stroke="#D8DDD9"/>
  <text class="kind" x="48" y="420">EXAMPLE · NUMERIC FIELD</text>
  <text class="note" x="48" y="448">At the start: digit or minus.</text>
  <text class="note" x="48" y="472">After a digit: decimal or exponent may be valid.</text>

  <path d="M496 392h416" stroke="#D8DDD9"/>
  <text class="kind" x="496" y="420">BOUNDARY · WHAT REMAINS</text>
  <text class="name" x="496" y="448">The mask guarantees shape.</text>
  <text class="note" x="496" y="472">It does not decide whether 15 is correct or allowed.</text>
  <defs>
    <marker id="xgrammar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
