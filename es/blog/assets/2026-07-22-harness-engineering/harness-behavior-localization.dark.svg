<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 352" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hbld-title hbld-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hbld-title">Enrutar un cambio de comportamiento mediante un manual de harness</title>
  <desc id="hbld-desc">Una solicitud centrada únicamente en el comportamiento entra en el manual, que enruta desde una visión general del sistema, pasando por una fase de ejecución, hasta entradas fundamentadas en el código fuente. Cada localizador candidato se verifica en el repositorio activo antes de aplicar un plan de edición. Un diff no vacío vuelve a sincronizar el manual para la siguiente solicitud.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="352" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">LOCALIZACIÓN DEL COMPORTAMIENTO — ENRUTAR, VERIFICAR, CAMBIAR, RESINCRONIZAR</text><text class="note" x="48" y="60">El manual acota la búsqueda. El repositorio activo determina qué es real.</text>
  <rect class="box" x="48" y="96" width="160" height="96" rx="10" /><text class="kind" x="68" y="130">SOLICITUD</text><text class="name" x="68" y="158" style="font-size: 13.5px;">Enmascarar secretos</text><text class="note" x="68" y="178" style="font-size: 11px;">comportamiento, sin archivo</text>
  <rect class="store" x="248" y="96" width="160" height="96" rx="10" /><text class="kind" x="268" y="130">MANUAL</text><text class="name" x="268" y="158">Enrutar búsqueda</text><text class="note" x="268" y="178">visión general → fase</text>
  <rect x="448" y="96" width="160" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="468" y="130" fill="#FF6FB6">ENFOQUE</text><text class="name" x="468" y="158" fill="#FF6FB6" style="font-size: 13px;">Verificar localizadores</text><text class="note" x="468" y="178" style="font-size: 11px;">funciones + archivos activos</text>
  <rect class="box" x="648" y="96" width="160" height="96" rx="10" /><text class="kind" x="668" y="130">PROCESO</text><text class="name" x="668" y="158" style="font-size: 12.5px;">Aplicar plan de edición</text><text class="note" x="668" y="178" style="font-size: 11px;">solo ubicaciones verificadas</text>
  <rect class="store" x="848" y="96" width="160" height="96" rx="10" /><text class="kind" x="868" y="130">ALMACÉN</text><text class="name" x="868" y="158" style="font-size: 14.5px;">Resincronizar mapa</text><text class="note" x="868" y="178">después de cada diff</text>
  <path class="edge" d="M208 144h32" marker-end="url(#hbld-arrow)" /><path class="edge" d="M408 144h32" marker-end="url(#hbld-arrow)" /><path class="edge" d="M608 144h32" marker-end="url(#hbld-arrow)" /><path class="edge" d="M808 144h32" marker-end="url(#hbld-arrow)" />
  <path d="M928 192v56a12 12 0 0 1-12 12H340a12 12 0 0 1-12-12v-48" class="edge" stroke-dasharray="7 6" marker-end="url(#hbld-arrow)" /><rect x="532" y="248" width="204" height="24" rx="6" fill="#0C1210" /><text class="note" x="634" y="265" text-anchor="middle" style="font-size: 11px;">la siguiente solicitud usa entradas actualizadas</text>
  <path d="M48 292h1024" stroke="#2B3B33" stroke-width="1" /><text class="kind" x="48" y="320">ORDEN DE AUTORIDAD</text><text class="name" x="194" y="321">Mapa de comportamiento → código fuente candidato → repositorio activo</text><text class="note" x="48" y="342">Congela una entrada obsoleta; nunca inventes su sustituta.</text>
  <defs><marker id="hbld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
