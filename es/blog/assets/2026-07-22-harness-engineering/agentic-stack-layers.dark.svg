<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 694" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asld-title asld-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asld-title">Dónde encaja cada parte del stack agentic</title>
  <desc id="asld-desc">El modelo propone y el reasoning loop elige el siguiente paso. Dentro del harness, la memoria proporciona contexto, el tool use define el contrato, la seguridad controla los permisos y la Parte 6 gestiona el acceptance gate. El runtime ejecuta los tool calls aceptados y almacena el estado de la sesión, el sandbox, el checkpoint y las trazas. Los resultados vuelven como contexto para el siguiente turno.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="694" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">UN TURNO — RESPONSABILIDAD DE LA PROPUESTA A LA EJECUCIÓN</text>
  <rect class="box" x="48" y="64" width="1024" height="62" rx="10" /><text class="kind" x="68" y="89">MODELO</text><text class="name" x="168" y="90">Proponer texto, un tool call o una respuesta final</text><path class="edge" d="M560 126v32" marker-end="url(#asld-arrow)" />
  <rect class="box" x="48" y="166" width="1024" height="62" rx="10" /><text class="kind" x="68" y="191">PARTE 1</text><text class="name" x="168" y="192">El reasoning loop elige el siguiente paso</text><path class="edge" d="M560 228v32" marker-end="url(#asld-arrow)" /><text class="note" x="576" y="250">tool call propuesto</text>
  <rect x="48" y="268" width="1024" height="200" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" /><text class="kind" x="68" y="296">HARNESS — UN PROGRAMA, CUATRO RESPONSABILIDADES</text>
  <rect class="store" x="68" y="320" width="216" height="96" rx="10" /><text class="kind" x="88" y="354">PARTE 2 · MEMORIA</text><text class="name" x="88" y="382">Construir contexto</text>
  <rect class="box" x="324" y="320" width="216" height="96" rx="10" /><text class="kind" x="344" y="354">PARTE 3 · TOOLS</text><text class="name" x="344" y="382">Definir el contrato</text>
  <rect class="box" x="580" y="320" width="216" height="96" rx="10" /><text class="kind" x="600" y="354">PARTE 4 · SEGURIDAD</text><text class="name" x="600" y="382">Controlar los permisos</text>
  <rect x="836" y="320" width="216" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="856" y="354" fill="#FF6FB6">FOCO · PARTE 6</text><text class="name" x="856" y="382" fill="#FF6FB6">Aceptar evidencias</text>
  <path class="edge" d="M284 368h32" marker-end="url(#asld-arrow)" /><path class="edge" d="M540 368h32" marker-end="url(#asld-arrow)" /><path class="edge" d="M796 368h32" marker-end="url(#asld-arrow)" /><text class="note" x="68" y="448">El contexto entra aquí; los contratos y los permisos rigen la propuesta; solo el acceptance gate puede finalizar la ejecución.</text><path class="edge" d="M944 468v32" marker-end="url(#asld-arrow)" /><text class="note" x="960" y="490">tool call aceptado</text>
  <rect x="48" y="508" width="1024" height="136" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" /><text class="kind" x="68" y="536">PARTE 5 · RUNTIME</text>
  <rect class="box" x="68" y="556" width="472" height="62" rx="10" /><text class="kind" x="88" y="581">PROCESAR</text><text class="name" x="198" y="582">Ejecutar los tool calls aceptados</text>
  <rect class="store" x="580" y="556" width="472" height="62" rx="10" /><text class="kind" x="600" y="581">ALMACENAR</text><text class="name" x="680" y="582">Sesión · sandbox · checkpoint · trazas</text><path class="edge" d="M540 587h32" marker-end="url(#asld-arrow)" />
  <path class="edge" d="M68 587H24V95h16" marker-end="url(#asld-arrow)" /><rect x="12" y="286" width="24" height="196" rx="6" fill="#0C1210" /><text class="note" x="28" y="384" text-anchor="middle" transform="rotate(-90 28 384)">los resultados y las trazas se convierten en contexto para el siguiente turno</text>
  <path d="M48 658h1024" stroke="#2B3B33" stroke-width="1" /><text class="note" x="48" y="680">El runtime ejecuta y almacena. El harness decide.</text>
  <defs><marker id="asld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
