<rect x="220" y="656" width="280" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="360" y="696" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">DECISIÓN</text><text x="360" y="720" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" text-anchor="middle">¿La mejora compensa el coste?</text>
