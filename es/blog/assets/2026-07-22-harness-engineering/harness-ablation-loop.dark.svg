<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hal-title">Una prueba de ablación emparejada de la transferencia de progreso</title><desc id="hal-desc">Un modelo, conjunto de tareas, entorno, evaluador y presupuesto total fijos alimentan dos ejecuciones emparejadas desde el mismo checkpoint de migración de pagos con seed. El control desactiva la transferencia de progreso y el tratamiento focalizado activa únicamente esa transferencia. La comparación mide las acciones duplicadas de herramientas tras reanudar la ejecución, y el componente solo se conserva cuando la mejora compensa su coste.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hal-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="hal-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1040" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Una ablación emparejada de la transferencia de progreso</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Fallo observado: las migraciones de pagos reanudadas repiten trabajo que la sesión anterior ya había</tspan><tspan x="32" dy="1.2em">completado.</tspan></text>
