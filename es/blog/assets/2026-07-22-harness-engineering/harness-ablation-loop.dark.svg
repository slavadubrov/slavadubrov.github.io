<text x="32" y="962" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">Un componente solo se justifica cuando la mejora del tratamiento en la métrica objetivo compensa el coste adicional.</text>
<text x="32" y="984" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ejecuta una ablación por hipótesis; no acumules guardas sin medirlas.</text>
