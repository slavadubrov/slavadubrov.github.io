<path d="M596 308h-14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcl-arrow-flow)" />
<path d="M408 308h-14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcl-arrow-flow)" /><rect x="379" y="230" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="400" y="246.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">sí</text>
<path d="M220 308h-14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcl-arrow-flow)" />
<path d="M494 256v-44H306v-28" fill="none" stroke="#FF6FB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hcl-arrow-fail)" /><rect x="302" y="200" width="196" height="24" rx="6" fill="#0C1210" stroke="#FF6FB6" stroke-width="1" /><text x="400" y="216.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FF6FB6" text-anchor="middle">fallo → evidencias al modelo</text>
<path d="M32 400h736" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="426" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ambas comprobaciones se superaron en el commit registrado.</text>
<text x="32" y="448" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El modelo propone. El harness controla los permisos y la finalización.</text>
