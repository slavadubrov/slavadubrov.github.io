<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ctx-title ctx-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ctx-title">Cuatro políticas deciden qué entra en el contexto de trabajo</title>
  <desc id="ctx-desc">Los equipos destilaron reglas de la wiki, precargaron registros empresariales, recuperaron reglas mediante tres modos de búsqueda o comprimieron turnos anteriores. Cada política filtra una entrada distinta antes de incorporarla al contexto de trabajo del agente.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#0C1210" />
  <rect class="box" x="48" y="64" width="188" height="96" rx="10" /><text class="kind" x="68" y="98">REGLAS DE LA WIKI</text><text class="name" x="68" y="126">Destilar restricciones</text>
  <rect class="box" x="272" y="64" width="188" height="96" rx="10" /><text class="kind" x="292" y="98">REGISTROS EMPRESARIALES</text><text class="name" x="292" y="126">Precargar entidades</text>
  <rect class="box" x="496" y="64" width="188" height="96" rx="10" /><text class="kind" x="516" y="98">BÚSQUEDA EN LA WIKI</text><text class="name" x="516" y="126">Recuperar de 3 formas</text>
  <rect class="box" x="720" y="64" width="188" height="96" rx="10" /><text class="kind" x="740" y="98">HISTORIAL DE TURNOS</text><text class="name" x="740" y="126">Comprimir turnos anteriores</text>
  <path class="edge" d="M142 160v60a12 12 0 0 0 12 12h266v32" marker-end="url(#ctx-arrow)" /><path class="edge" d="M366 160v44a12 12 0 0 0 12 12h82v48" marker-end="url(#ctx-arrow)" /><path class="edge" d="M590 160v44a12 12 0 0 1-12 12h-78v48" marker-end="url(#ctx-arrow)" /><path class="edge" d="M814 160v60a12 12 0 0 1-12 12H540v32" marker-end="url(#ctx-arrow)" />
  <rect x="384" y="272" width="192" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="404" y="306">FOCO</text><text class="name-focus" x="404" y="334">Contexto de trabajo</text>
  <text class="note" x="48" y="400">No existe un valor predeterminado neutral: todo sistema decide qué conservar, recuperar, resumir u omitir.</text>
  <defs><marker id="ctx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
