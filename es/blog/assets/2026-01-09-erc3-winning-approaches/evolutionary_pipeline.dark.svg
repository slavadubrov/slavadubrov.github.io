<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="evo-title evo-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="evo-title">Los traces fallidos del benchmark hacen evolucionar el prompt de producción</title>
  <desc id="evo-desc">El agente principal ejecuta el benchmark y almacena los traces fallidos. Un analizador convierte los fallos en hipótesis y, después, un versionador genera el siguiente system prompt. El prompt revisado vuelve al agente principal; este bucle ha producido la versión 80 del prompt.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="360" rx="14" fill="#0C1210" />
  <circle cx="62" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="57" text-anchor="middle">1</text>
  <circle cx="286" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="57" text-anchor="middle">2</text>
  <circle cx="510" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="57" text-anchor="middle">3</text>
  <circle cx="734" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="57" text-anchor="middle">4</text>
  <rect class="box" x="48" y="80" width="188" height="96" rx="10" /><text class="kind" x="68" y="114">AGENT</text><text class="name" x="68" y="142">Ejecutar benchmark</text>
  <rect class="store" x="272" y="80" width="188" height="96" rx="10" /><text class="kind" x="292" y="114">TRACE STORE</text><text class="name" x="292" y="142">Tareas fallidas</text>
  <rect class="box" x="496" y="80" width="188" height="96" rx="10" /><text class="kind" x="516" y="114">ANALYZER</text><text class="name" x="516" y="142">Diagnosticar causas</text>
  <rect x="720" y="80" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="740" y="114">VERSIONER</text><text class="name-focus" x="740" y="142">Revisar prompt</text>
  <path class="edge" d="M236 128h28" marker-end="url(#evo-arrow)" /><path class="edge" d="M460 128h28" marker-end="url(#evo-arrow)" /><path class="edge" d="M684 128h28" marker-end="url(#evo-arrow)" />
  <path d="M814 176v48a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-48" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#evo-signal)" />
  <rect x="362" y="224" width="232" height="24" rx="6" fill="#0C1210" /><text class="note" x="478" y="241" text-anchor="middle" fill="#FF6FB6">nuevo system prompt · v1 → v80</text>
  <text class="note" x="48" y="324">El bucle solo cambia el prompt después de convertir los traces fallidos en hipótesis explícitas.</text>
  <defs><marker id="evo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="evo-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
