<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 746" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="cff-title cff-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cff-title">Elige un contenedor de modelo mediante un gate de compatibilidad con prioridad al runtime</title><desc id="cff-desc">Una decisión sobre el runtime deriva a llama.cpp, a un servidor o loader para GPU, o a un runtime para edge o móvil. Cada rama conduce a su artifact compatible —una conversión a GGUF, un artifact del repositorio o una exportación compatible— y todas las rutas convergen en un único gate de compatibilidad antes del benchmarking.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cff-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="cff-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="746" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Primero el runtime, después el artifact</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">El hardware por sí solo no permite elegir el contenedor. Elige el runtime y usa después la estructura de</tspan><tspan x="32" dy="1.2em">artifact que documenta.</tspan></text>
<rect x="200" y="112" width="320" height="72" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="360" y="140" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">DECISIÓN</text><text x="360" y="164" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">¿Qué runtime?</text>
