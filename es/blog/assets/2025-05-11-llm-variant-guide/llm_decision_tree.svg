<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Flujo de selección de checkpoint, runtime y cuantización</title>
  <desc id="desc">El flujo comienza con un contrato de tarea, selecciona un checkpoint mediante una evaluación de alta calidad, verifica un runtime compatible, mide la memoria, compara representaciones y somete a benchmark el artefacto completo de release.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="480" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Elige el comportamiento antes de comprimir</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(30 120)"><rect width="135" height="120" rx="14" fill="#1e293b" stroke="#64748b" /><text x="67" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">1. Contrato de tarea</text><text x="67" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">calidad • licencia</text><text x="67" y="89" text-anchor="middle" font-size="11" fill="#94a3b8">interfaz • contexto</text></g><text x="180" y="188" font-size="23" fill="#94a3b8">→</text>
    <g transform="translate(205 120)"><rect width="135" height="120" rx="14" fill="#5b21b6" stroke="#2563eb" /><text x="67" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#c4b5fd">2. Checkpoint</text><text x="67" y="68" text-anchor="middle" font-size="11" fill="#93c5fd">revisión exacta</text><text x="67" y="89" text-anchor="middle" font-size="11" fill="#94a3b8">baseline de alta calidad</text></g><text x="355" y="188" font-size="23" fill="#94a3b8">→</text>
    <g transform="translate(380 120)"><rect width="135" height="120" rx="14" fill="#9a3412" stroke="#ea580c" /><text x="67" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#fdba74">3. Runtime</text><text x="67" y="68" text-anchor="middle" font-size="11" fill="#fdba74">arquitectura</text><text x="67" y="89" text-anchor="middle" font-size="11" fill="#94a3b8">kernel + hardware</text></g><text x="530" y="188" font-size="23" fill="#94a3b8">→</text>
    <g transform="translate(555 120)"><rect width="135" height="120" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="67" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#93c5fd">4. Memoria</text><text x="67" y="68" text-anchor="middle" font-size="11" fill="#93c5fd">pesos + KV cache</text><text x="67" y="89" text-anchor="middle" font-size="11" fill="#94a3b8">workspace + margen</text></g><text x="705" y="188" font-size="23" fill="#94a3b8">→</text>
    <g transform="translate(730 120)"><rect width="135" height="120" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="67" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#93c5fd">5. Representación</text><text x="67" y="68" text-anchor="middle" font-size="11" fill="#93c5fd">precisión / cuant.</text><text x="67" y="89" text-anchor="middle" font-size="11" fill="#94a3b8">procedencia + hash</text></g><text x="880" y="188" font-size="23" fill="#94a3b8">→</text>
    <g transform="translate(900 120)"><rect width="75" height="120" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="37" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#93c5fd">6. Prueba</text><text x="37" y="68" text-anchor="middle" font-size="10" fill="#93c5fd">release</text><text x="37" y="88" text-anchor="middle" font-size="10" fill="#94a3b8">unitaria</text></g>
    <rect x="150" y="315" width="700" height="80" rx="14" fill="#991b1b" stroke="#dc2626" /><text x="500" y="347" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">Cualquier gate fallido devuelve el flujo a la elección anterior</text><text x="500" y="375" text-anchor="middle" font-size="12" fill="#fca5a5">Un archivo más pequeño no es un release exitoso si fallan la calidad, el contexto o la concurrencia.</text>
    <text x="500" y="444" text-anchor="middle" font-size="13" fill="#94a3b8">Haz benchmark del checkpoint, la conversión, el runtime y el hardware exactos en conjunto.</text>
  </g>
</svg>
