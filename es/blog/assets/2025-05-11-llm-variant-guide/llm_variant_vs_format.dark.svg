<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Seis capas independientes en un artefacto de modelo con pesos abiertos</title>
  <desc id="layers-desc">Seis nodos alineados separan la familia y revisión, la función de entrenamiento, la arquitectura, la representación numérica, el contenedor y la disposición, y el runtime y el hardware. El foco está en el contenedor y la disposición, porque el nombre de un formato es solo una capa del artefacto.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#0C1210" />

  <text class="section" x="48" y="48">ARTEFACTO DEL MODELO — LEE CADA CAPA POR SEPARADO</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="114">CAPA 1</text>
  <text class="name" x="68" y="142">Familia + revisión</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="114">CAPA 2</text>
  <text class="name" x="364" y="142">Función de entrenamiento</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="114">CAPA 3</text>
  <text class="name" x="660" y="142">Arquitectura</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="250">CAPA 4</text>
  <text class="name" x="68" y="278">Representación numérica</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="364" y="250" fill="#FF6FB6">FOCO · CAPA 5</text>
  <text class="name" x="364" y="278" fill="#FF6FB6">Contenedor + disposición</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="250">CAPA 6</text>
  <text class="name" x="660" y="278">Runtime + hardware</text>

  <path d="M48 360H912" stroke="#2B3B33" stroke-width="1" />
  <text class="kind" x="48" y="392">EJEMPLOS</text>
  <text class="note" x="48" y="420">GPTQ y AWQ describen la cuantización. GGUF y Safetensors describen el empaquetado.</text>
  <text class="note" x="48" y="448">MoE describe la estructura de ejecución. llama.cpp, vLLM y Transformers ejecutan artefactos compatibles.</text>
  <text class="note" x="48" y="476">Un sufijo conocido no demuestra la calidad, el encaje en memoria ni la velocidad de serving.</text>
</svg>
