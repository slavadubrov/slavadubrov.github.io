<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="attnmatrix-title attnmatrix-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="attnmatrix-title">Matriz de atención: bi-encoder frente a cross-encoder</title><desc id="attnmatrix-desc">La atención de un bi-encoder es diagonal por bloques: los tokens de la consulta solo atienden a tokens de la consulta, y los tokens del documento solo atienden a tokens del documento. Un cross-encoder calcula la matriz de atención completa, por lo que los tokens de la consulta también atienden a los del documento, y los del documento, a los de la consulta.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="attnmatrix-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="attnmatrix-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Atención diagonal por bloques frente a atención completa</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Los bloques Q·D y D·Q del cross-encoder son los que un bi-encoder nunca calcula.</text>
<rect x="32" y="128" width="304" height="300" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">BI-ENCODER</text>
<rect x="384" y="128" width="304" height="300" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="400" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">CROSS-ENCODER</text>
<path d="M58 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">Q · Q</text><text x="62" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">activo</text><text x="62" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">self-attn</text>
<path d="M200 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M200 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="204" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">Q · D</text><text x="204" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8B8AF">bloqueado</text><text x="204" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">sin solapamiento</text>
<path d="M58 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="62" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">D · Q</text><text x="62" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8B8AF">bloqueado</text><text x="62" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">sin solapamiento</text>
