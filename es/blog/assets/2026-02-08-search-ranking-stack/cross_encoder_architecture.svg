<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">En un bi-encoder, ningún token de consulta atiende al documento; solo se unen los vectores</text>
