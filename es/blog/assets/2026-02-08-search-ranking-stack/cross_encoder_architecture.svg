<path d="M200 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M200 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="204" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">Q · D</text><text x="204" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">bloqueado</text><text x="204" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">sin solapamiento</text>
