<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 636" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rrf-title rrf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rrf-title">Búsqueda híbrida con reciprocal rank fusion</title><desc id="rrf-desc">BM25 y la recuperación densa devuelven una lista ordenada con scores en escalas diferentes. Reciprocal rank fusion descarta los scores originales y combina únicamente las posiciones en el ranking, evitando calibrar las escalas de score entre ambos métodos.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rrf-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="rrf-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="636" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Fusionar dos listas ordenadas por posición, no por score</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">BM25 y la recuperación densa asignan scores en escalas diferentes; RRF no compara ninguna de las dos</tspan><tspan x="32" dy="1.2em">directamente.</tspan></text>
<path d="M270 112h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M270 112h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="360" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">ENTRADA</text><text x="360" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E" text-anchor="middle">Consulta del usuario</text>
<path d="M360 184v24h-168v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rrf-arrow-flow)" />
<path d="M360 184v24h168v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rrf-arrow-flow)" />
<path d="M42 232h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M42 232h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="46" y="249.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ÍNDICE SPARSE · BM25</text><text x="46" y="293" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Consulta en el índice invertido</text><text x="46" y="315" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">1. Doc-X 12.5 · 2. Doc-Y 8.3 · 3. Doc-Z 7.1</text>
<path d="M378 232h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M378 232h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="382" y="249.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ÍNDICE DENSO · HNSW</text><text x="382" y="293" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Búsqueda vectorial ANN</text><text x="382" y="315" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">1. Doc-Y .92 · 2. Doc-X .87 · 3. Doc-W .81</text>
<path d="M192 336v28h168v28" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rrf-arrow-flow)" />
<path d="M528 336v28h-168v28" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rrf-arrow-flow)" />
<path d="M210 392h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M210 392h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="214" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · FUSIÓN RRF (k=60)</text><text x="214" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Fusión basada en el ranking</text><text x="214" y="475" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">1. Doc-Y .033 · 2. Doc-X .033 · 3. Doc-Z .016</text>
<path d="M32 536h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="562" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11.5px;">score(d) = suma de 1 / (k + rank) en ambas listas — un documento solo necesita quedar bien posicionado en uno de los dos</text>
<text x="32" y="584" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">métodos para sobrevivir a la fusión.</text>
</svg>
