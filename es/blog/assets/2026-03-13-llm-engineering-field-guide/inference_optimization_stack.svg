<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Opciones de optimización de inference</title>
  <desc>Las opciones de kernel, cuantización, memoria, scheduling, caching, especulación y paralelismo se pueden seleccionar de forma independiente frente a un cuello de botella común, medido en el hardware y la carga de trabajo, y a objetivos de nivel de aplicación.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#F7F7F4" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Opciones de optimización de inference</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#17211B">Seleccionar de forma independiente según el cuello de botella medido y el SLO objetivo</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#17211B">Base de hardware</text>
  <text x="80" y="468" font-size="11" fill="#17211B">Jerarquía de memoria de la GPU: el ancho de banda de HBM y la reutilización on-chip varían según la GPU</text>
  <text x="80" y="483" font-size="11" fill="#17211B">Medir el cuello de botella de cómputo, memoria y comunicación en la GPU objetivo</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#17211B">Optimizaciones de kernel</text>
  <text x="70" y="373" font-size="11" fill="#17211B">FlashAttention (tiling en SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#17211B">Kernels fusionados (reducen los viajes de ida y vuelta a HBM)</text>
  <text x="70" y="398" font-size="11" fill="#17211B">Perfilar la utilización en el grafo desplegado</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#17211B">Cuantización</text>
  <text x="470" y="373" font-size="11" fill="#17211B">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#17211B">Pesos de 8 bits: aproximadamente un 50 % menos de almacenamiento bruto que con 16 bits</text>
  <text x="470" y="400" font-size="11" fill="#17211B">4 bits: aproximadamente un 75 % menos antes del overhead de escalas y metadatos</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#17211B">Gestión de memoria</text>
  <text x="70" y="283" font-size="11" fill="#17211B">PagedAttention (asignación de KV por bloques)</text>
  <text x="70" y="298" font-size="11" fill="#17211B">GQA/MQA (reducción de 8–16× en la KV cache)</text>
  <text x="70" y="308" font-size="11" fill="#17211B">Las mejoras publicadas dependen de la carga de trabajo y del harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#17211B">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#17211B">Continuous batching (a nivel de iteración)</text>
  <text x="470" y="298" font-size="11" fill="#17211B">Chunked prefill (protege la latencia de decode)</text>
  <text x="470" y="308" font-size="11" fill="#17211B">Ajustar el sistema para maximizar el goodput con el SLO objetivo</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#17211B">Caching</text>
  <text x="70" y="193" font-size="11" fill="#17211B">Prefix caching (medir la tasa de aciertos)</text>
  <text x="70" y="208" font-size="11" fill="#17211B">RadixAttention (reutilización de KV basada en árboles)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#17211B">Especulación</text>
  <text x="340" y="193" font-size="11" fill="#17211B">Speculative decoding (verificar los drafts)</text>
  <text x="340" y="208" font-size="11" fill="#17211B">La tasa de aceptación controla la mejora</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#17211B">Paralelismo</text>
  <text x="620" y="193" font-size="11" fill="#17211B">TP (intra-nodo, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#17211B">PP (inter-nodo) + DP (escalado)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#17211B">Capa de aplicación</text>
  <text x="80" y="113" font-size="11" fill="#17211B">Enrutado de modelos · Rate limiting consciente de tokens · Monitorización (goodput, utilización de KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="11" fill="#17211B">Combinar técnicas solo después de medir sus efectos en calidad, latencia y coste</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
