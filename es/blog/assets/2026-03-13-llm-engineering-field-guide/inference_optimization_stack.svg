<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Opciones de optimización de inferencia</title>
  <desc>Las opciones de kernels, cuantización, memoria, scheduling, caching, especulación y paralelismo se pueden seleccionar de forma independiente según un cuello de botella común, medido en el hardware y la carga de trabajo, y los objetivos a nivel de aplicación.</desc>
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Opciones de optimización de inferencia</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#334155">Seleccionar de forma independiente según el cuello de botella medido y el SLO objetivo</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#1d4ed8">Base de hardware</text>
  <text x="80" y="468" font-size="11" fill="#0f172a">Jerarquía de memoria de la GPU: el ancho de banda de HBM y la reutilización on-chip varían según la GPU</text>
  <text x="80" y="483" font-size="10" fill="#334155">Medir el cuello de botella de cómputo, memoria y comunicación en la GPU objetivo</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#166534">Optimizaciones de kernels</text>
  <text x="70" y="373" font-size="11" fill="#0f172a">FlashAttention (tiling en SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#0f172a">Kernels fusionados (reducen los viajes de ida y vuelta a HBM)</text>
  <text x="70" y="398" font-size="10" fill="#334155">Perfilar la utilización en el grafo desplegado</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#9a3412">Cuantización</text>
  <text x="470" y="373" font-size="11" fill="#0f172a">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#0f172a">Pesos de 8 bits: aproximadamente un 50 % menos de almacenamiento bruto que con 16 bits</text>
  <text x="470" y="400" font-size="10" fill="#334155">4 bits: aproximadamente un 75 % menos antes del overhead de escalas y metadatos</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Gestión de memoria</text>
  <text x="70" y="283" font-size="11" fill="#0f172a">PagedAttention (asignación de KV por bloques)</text>
  <text x="70" y="298" font-size="11" fill="#0f172a">GQA/MQA (reducción de 8-16× en la KV cache)</text>
  <text x="70" y="308" font-size="10" fill="#334155">Las mejoras publicadas dependen de la carga de trabajo y del harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#0f172a">Continuous batching (a nivel de iteración)</text>
  <text x="470" y="298" font-size="11" fill="#0f172a">Chunked prefill (protege la latencia de decode)</text>
  <text x="470" y="308" font-size="10" fill="#334155">Optimizar el goodput para el SLO objetivo</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Caching</text>
  <text x="70" y="193" font-size="11" fill="#0f172a">Prefix caching (medir la tasa de aciertos)</text>
  <text x="70" y="208" font-size="11" fill="#0f172a">RadixAttention (reutilización de KV basada en árboles)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Especulación</text>
  <text x="340" y="193" font-size="11" fill="#0f172a">Speculative decoding (verificar los borradores)</text>
  <text x="340" y="208" font-size="11" fill="#0f172a">La tasa de aceptación controla la mejora</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Paralelismo</text>
  <text x="620" y="193" font-size="11" fill="#0f172a">TP (intra-nodo, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#0f172a">PP (inter-nodo) + DP (escalado)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#991b1b">Capa de aplicación</text>
  <text x="80" y="113" font-size="11" fill="#0f172a">Enrutamiento de modelos · Limitación de tasa con conocimiento de tokens · Monitorización (goodput, utilización de KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="10" fill="#334155">Combinar técnicas solo después de medir sus efectos en calidad, latencia y coste</text>

</svg>
