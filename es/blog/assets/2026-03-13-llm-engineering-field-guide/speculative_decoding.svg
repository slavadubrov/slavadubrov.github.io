<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Speculative decoding" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Decodificación especulativa</title>
  <desc>Un modelo draft propone cuatro tokens. El modelo target les asigna puntuaciones en paralelo, acepta probabilísticamente los dos primeros, rechaza el tercero, descarta el cuarto y obtiene una corrección mediante muestreo a partir de la distribución residual del modelo target.</desc>
  <defs>
    <style>
      .draft-model { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; rx: 8; }
      .target-model { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .token { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 4; }
      .token-accepted { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 4; }
      .token-rejected { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 4; }
      .token-discard { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4,4; rx: 4; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #dc2626; stroke-width: 2; marker-end: url(#arrowhead-red); }
      .text { font-family: Inter, system-ui, sans-serif; font-size: 14px; text-anchor: middle; fill: #0f172a; font-weight: bold; }
      .desc { font-family: Inter, system-ui, sans-serif; font-size: 12px; text-anchor: middle; fill: #0f172a; }
      .title { font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; fill: #0f172a; }
      .subtitle { font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #334155; text-anchor: start; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="500" y="30" class="title">Decodificación especulativa</text>

  <!-- Step 1: Draft Model -->
  <text x="40" y="75" class="subtitle">1. Generación del draft (secuencial, limitada por memoria)</text>

  <rect x="50" y="95" width="140" height="60" class="draft-model" />
  <text x="120" y="120" class="text" style="fill: #ffffff">Modelo draft</text>
  <text x="120" y="140" class="desc" style="fill: #ffffff">Modelo draft más pequeño</text>

  <line x1="190" y1="125" x2="230" y2="125" class="arrow" />

  <!-- Draft Tokens -->
  <rect x="250" y="105" width="50" height="40" class="token" />
  <text x="275" y="130" class="text">T₁</text>

  <line x1="300" y1="125" x2="330" y2="125" class="arrow" />

  <rect x="340" y="105" width="50" height="40" class="token" />
  <text x="365" y="130" class="text">T₂</text>

  <line x1="390" y1="125" x2="420" y2="125" class="arrow" />

  <rect x="430" y="105" width="50" height="40" class="token" />
  <text x="455" y="130" class="text">T₃</text>

  <line x1="480" y1="125" x2="510" y2="125" class="arrow" />

  <rect x="520" y="105" width="50" height="40" class="token" />
  <text x="545" y="130" class="text">T₄</text>

  <!-- Bracket for Candidate Tokens -->
  <line x1="250" y1="155" x2="250" y2="170" stroke="#334155" stroke-width="2" />
  <line x1="570" y1="155" x2="570" y2="170" stroke="#334155" stroke-width="2" />
  <line x1="250" y1="170" x2="570" y2="170" stroke="#334155" stroke-width="2" />

  <text x="410" y="195" class="subtitle" text-anchor="middle">K=4 tokens candidatos</text>
  <line x1="410" y1="205" x2="410" y2="245" class="arrow" />

  <!-- Step 2: Verification -->
  <text x="40" y="235" class="subtitle">2. Scoring del target y muestreo corregido</text>

  <rect x="50" y="255" width="140" height="60" class="target-model" />
  <text x="120" y="280" class="text">Modelo target</text>
  <text x="120" y="300" class="desc">Modelo target más grande</text>

  <line x1="190" y1="285" x2="230" y2="285" class="arrow" />

  <!-- Verification Block -->
  <rect x="230" y="255" width="340" height="60" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  <text x="400" y="280" class="text">Asigna puntuaciones a las K posiciones en una sola pasada del target</text>
  <text x="400" y="300" class="desc">Acepta de izquierda a derecha con min(1, p(token) / q(token))</text>

  <line x1="570" y1="285" x2="610" y2="285" class="arrow" />

  <!-- Result Tokens Space Increased! -->
  <rect x="600" y="265" width="50" height="40" class="token-accepted" />
  <text x="625" y="290" class="text">T₁</text>

  <rect x="670" y="265" width="50" height="40" class="token-accepted" />
  <text x="695" y="290" class="text">T₂</text>

  <!-- Rejected token -->
  <rect x="740" y="265" width="50" height="40" class="token-rejected" />
  <text x="765" y="290" class="text">T₃</text>

  <!-- Discarded token -->
  <rect x="810" y="265" width="50" height="40" class="token-discard" />
  <text x="835" y="290" class="text" fill="#64748b">T₄</text>

  <!-- Correction sampled after the first rejection -->
  <path d="M765 265 V250 H925 V255" fill="none" class="arrow-red" />
  <rect x="900" y="265" width="50" height="40" class="token-accepted" />
  <text x="925" y="290" class="text">C₃</text>

  <!-- Result Text safely spaced apart -->
  <text x="660" y="330" class="desc" fill="#166534" font-weight="bold">Aceptado</text>
  <text x="765" y="330" class="desc" fill="#991b1b" font-weight="bold">Rechazado</text>
  <text x="835" y="330" class="desc" fill="#64748b" font-weight="bold">Descartado</text>
  <text x="925" y="326" class="desc" fill="#166534" font-weight="bold">Residual</text>
  <text x="925" y="342" class="desc" fill="#166534" font-weight="bold">muestreo</text>
  <text x="770" y="235" class="desc" fill="#991b1b">Tras el rechazo: muestrear C₃ a partir de max(0, p − q) normalizada</text>

</svg>
