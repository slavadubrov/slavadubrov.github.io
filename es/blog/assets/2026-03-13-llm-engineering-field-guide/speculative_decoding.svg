<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="specdec-title specdec-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="specdec-title">Speculative decoding acepta probabilísticamente un prefijo propuesto y, tras el primer rechazo, muestrea una única corrección.</title><desc id="specdec-desc">Un modelo draft pequeño propone K tokens candidatos; el modelo target grande puntúa las K posiciones en un único forward pass. El decoder acepta los tokens del draft de izquierda a derecha usando min(1, p_target/p_draft) en cada posición y, tras el primer rechazo, muestrea una corrección de la distribución residual del target y descarta los tokens restantes del draft. Esto preserva la distribución de salida del modelo target dentro de la precisión numérica del hardware.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="specdec-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="specdec-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="620" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un draft, un pase de verificación, una corrección</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">El modelo target puntúa todos los tokens del draft en paralelo; después, el decoder recorre el límite de</tspan><tspan x="32" dy="1.2em">aceptación de izquierda a derecha.</tspan></text>
<path d="M42 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">DRAFT</text><text x="46" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 16px;">Modelo pequeño y rápido</text><text x="46" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Propone K tokens</text>
<path d="M240 180h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#specdec-arrow-flow)" />
<path d="M266 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M266 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="270" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">TOKENS DEL DRAFT</text><text x="270" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">K candidatos</text><text x="270" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">p. ej., K = 4</text>
<path d="M464 180h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#specdec-arrow-flow)" />
<path d="M490 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M490 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="494" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">TARGET</text><text x="494" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Puntúa los K</text><text x="494" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un único forward pass</text>
<path d="M584 232v12H360v12" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#specdec-arrow-flow)" />
<path d="M42 256h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M42 256h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="46" y="273.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCO · REJECTION SAMPLING</text><text x="46" y="317" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Aceptar de izquierda a derecha y después corregir</text><text x="46" y="339" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">min(1, p_target/p_draft) por posición de token</text>
<path d="M136 360v40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#specdec-arrow-flow)" /><text x="144" y="388.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="start">aceptar</text>
<path d="M360 360v40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#specdec-arrow-flow)" /><text x="368" y="388.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="start">rechazar → corregir</text>
<path d="M584 360v40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#specdec-arrow-flow)" /><text x="592" y="388.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="start">descartar</text>
<path d="M42 400h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 400h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="46" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ACEPTADOS</text><text x="46" y="461" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Prefijo conservado</text><text x="46" y="483" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">p. ej., 2 de 4 tokens</text>
<path d="M266 400h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M266 400h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="270" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">RECHAZADOS</text><text x="270" y="461" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Primer desajuste</text><text x="270" y="483" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Corrección muestreada</text>
<path d="M490 400h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M490 400h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="494" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">DESCARTADOS</text><text x="494" y="461" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Se descarta el resto</text><text x="494" y="483" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tras el rechazo</text>
<path d="M32 540h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="566" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Rejection sampling preserva la distribución de salida del modelo target, no solo sus tokens más probables.</text>
<text x="32" y="588" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">La ganancia es mayor con batches pequeños y drafts cortos, cuando puntuar resulta barato.</text>
</svg>
