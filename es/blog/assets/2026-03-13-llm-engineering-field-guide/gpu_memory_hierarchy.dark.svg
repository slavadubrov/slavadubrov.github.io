<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="GPU Memory Hierarchy" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Jerarquía de memoria de la GPU</title>
  <desc>La jerarquía de memoria de la H100: desde los registros por hilo y la memoria compartida por SM hasta la caché L2 compartida y la gran memoria HBM3. El almacenamiento on-chip es más pequeño y está más cerca del cómputo; HBM almacena los pesos del modelo y la KV cache.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="480" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0">Jerarquía de memoria de la GPU H100 SXM</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#EDF5F0">El almacenamiento on-chip más pequeño está más cerca del cómputo</text>

  <!-- Pyramid layers (top = fastest, smallest) -->

  <!-- Registers -->
  <polygon points="400,80 310,150 490,150" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#141D19">Registros</text>
  <text x="400" y="135" text-anchor="middle" font-size="11" fill="#141D19">Acceso por hilo</text>
  <text x="400" y="147" text-anchor="middle" font-size="11" fill="#141D19">Operandos matemáticos</text>

  <!-- Labels right side -->
  <line x1="452" y1="120" x2="560" y2="120" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="570" y="115" font-size="11" fill="#EDF5F0" font-weight="bold">Más rápidos</text>
  <text x="570" y="130" font-size="11" fill="#EDF5F0">Menor capacidad</text>

  <!-- SRAM / Shared Memory -->
  <polygon points="310,160 240,240 560,240 490,160" fill="#1B2621" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="400" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#EDF5F0">Memoria compartida (SRAM)</text>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#EDF5F0">228 KB por SM</text>
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#EDF5F0">Los tiles de FlashAttention se procesan aquí</text>

  <line x1="526" y1="200" x2="600" y2="200" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="610" y="195" font-size="11" fill="#EDF5F0" font-weight="bold">SRAM por SM</text>
  <text x="610" y="210" font-size="11" fill="#EDF5F0">Memoria de trabajo rápida</text>

  <!-- L2 Cache -->
  <polygon points="240,250 180,320 620,320 560,250" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#141D19">Caché L2</text>
  <text x="400" y="292" text-anchor="middle" font-size="11" fill="#141D19">Caché compartida de 50 MB</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#141D19">Datos reutilizados compartidos entre SM</text>

  <line x1="590" y1="285" x2="660" y2="285" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="670" y="280" font-size="11" fill="#EDF5F0" font-weight="bold">L2 compartida</text>
  <text x="670" y="295" font-size="11" fill="#EDF5F0">Evita algunas lecturas de HBM</text>

  <!-- HBM3 -->
  <polygon points="180,330 100,420 700,420 620,330" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="400" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#141D19">HBM3 (memoria de alto ancho de banda)</text>
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#141D19">80 GB · 3.35 TB/s</text>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#141D19">Los pesos del modelo y la KV cache se almacenan aquí</text>

  <line x1="660" y1="375" x2="720" y2="375" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="725" y="370" font-size="11" fill="#EDF5F0" font-weight="bold">3.35 TB/s</text>
  <text x="680" y="385" font-size="11" fill="#EDF5F0">Cuello de botella de memoria</text>

  <!-- Left side: Size labels -->
  <text x="90" y="125" font-size="11" fill="#EDF5F0" text-anchor="end">~KB</text>
  <text x="90" y="200" font-size="11" fill="#EDF5F0" text-anchor="end">228 KB/SM</text>
  <text x="90" y="285" font-size="11" fill="#EDF5F0" text-anchor="end">50 MB</text>
  <text x="90" y="375" font-size="11" fill="#EDF5F0" text-anchor="end">80 GB</text>

  <!-- Bottom insight box -->
  <rect x="100" y="435" width="600" height="35" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="400" y="457" text-anchor="middle" font-size="12" fill="#EDF5F0" font-weight="bold" style="font-size: 11px;">Los kernels optimizados para la memoria mantienen los datos reutilizados cerca del cómputo y reducen el tráfico de HBM</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
