<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Parallelism Decision Framework" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Marco de decisión del paralelismo</title>
  <desc>Diagrama: marco de decisión del paralelismo.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="460" fill="#F7F7F4" rx="8" />

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Selección del paralelismo: heurística inicial</text>

  <!-- Edges -->
  <path d="M 450 70 L 450 86" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />

  <path d="M 380 110 L 150 110 L 150 231" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="330" y="105" font-size="12" font-weight="bold" fill="#17211B">Sí</text>

  <path d="M 450 130 L 450 156" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="148" font-size="12" font-weight="bold" fill="#17211B">No</text>

  <path d="M 450 200 L 450 231" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="222" font-size="12" font-weight="bold" fill="#17211B">Sí</text>

  <path d="M 520 180 L 750 180 L 750 231" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="175" font-size="12" font-weight="bold" fill="#17211B">No</text>

  <path d="M 150 285 L 150 305 L 450 305" fill="none" stroke="#17211B" stroke-width="2" />
  <path d="M 750 285 L 750 305 L 450 305" fill="none" stroke="#17211B" stroke-width="2" />
  <path d="M 450 285 L 450 316" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />

  <path d="M 450 360 L 450 391" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="380" font-size="12" font-weight="bold" fill="#17211B">No</text>

  <path d="M 520 340 L 666 340" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="335" font-size="12" font-weight="bold" fill="#17211B">Sí</text>

  <path d="M 750 360 L 750 415 L 514 415" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Nodes -->
  <rect x="410" y="40" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
  <text x="450" y="59" text-anchor="middle" font-size="12" font-weight="bold" fill="#17211B">Inicio</text>

  <rect x="380" y="90" width="140" height="40" rx="20" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="450" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#17211B">¿Cabe en una GPU?</text>

  <rect x="380" y="160" width="140" height="40" rx="20" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="450" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#17211B">¿Cabe en un nodo?</text>

  <rect x="60" y="235" width="180" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="2" />
  <text x="150" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Probar réplicas DP</text>
  <text x="150" y="272" text-anchor="middle" font-size="11" fill="#17211B">Solicitudes independientes</text>

  <rect x="360" y="235" width="180" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="2" />
  <text x="450" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Probar TP + DP</text>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#17211B">Tensor dentro; réplicas entre nodos</text>

  <rect x="630" y="235" width="240" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="2" class="visual-focus" />
  <text x="750" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Probar TP + PP + DP</text>
  <text x="750" y="272" text-anchor="middle" font-size="11" fill="#17211B">Perfilar la ruta entre nodos</text>

  <rect x="380" y="320" width="140" height="40" rx="20" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
  <text x="450" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#17211B">¿Modelo MoE?</text>

  <rect x="670" y="320" width="160" height="40" rx="6" fill="#ffffff" stroke="#59645E" stroke-width="2" />
  <text x="750" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Probar EP</text>
  <text x="750" y="352" text-anchor="middle" font-size="11" fill="#17211B">Medir el tráfico all-to-all</text>

  <rect x="390" y="395" width="120" height="40" rx="20" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="450" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#17211B">Hacer benchmark con el SLO</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
