<path d="M270 320h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M270 320h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="274" y="337.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GENERATE</text><text x="274" y="381" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Destilar y filtrar</text><text x="274" y="403" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="274">Registrar el linaje de los</tspan><tspan x="274" dy="1.2em">datos</tspan></text>
<path d="M456 372h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trainpipe-arrow-flow)" />
<path d="M482 320h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M482 320h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="486" y="337.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · STUDENT</text><text x="486" y="381" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Modelo compacto</text><text x="486" y="403" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">De 1.5B a 70B en el artículo</text>
