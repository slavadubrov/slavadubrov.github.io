<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="trainpipe-title trainpipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="trainpipe-title">El pretraining, el fine-tuning y el alignment alimentan una ruta de distillation separada del teacher al student.</title><desc id="trainpipe-desc">El pretraining entrena la predicción del siguiente token sobre un corpus grande; el fine-tuning supervisado adapta el modelo base a datos etiquetados, y el alignment ajusta el comportamiento con RLHF, DPO o GRPO. Un modelo teacher alineado puede generar por separado ejemplos de entrenamiento filtrados para un student más pequeño y destilado; DeepSeek-R1 seleccionó unos 800.000 ejemplos de un teacher de 671B para destilar students Qwen y Llama de entre 1.5B y 70B parámetros.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="trainpipe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="trainpipe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="596" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Cada etapa modifica un artefacto distinto y necesita su propia evaluación</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Un teacher alineado también puede generar datos de entrenamiento para un student más pequeño y</tspan><tspan x="32" dy="1.2em">destilado.</tspan></text>
