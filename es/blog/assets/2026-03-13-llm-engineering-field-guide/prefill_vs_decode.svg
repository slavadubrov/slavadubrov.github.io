<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Prefill and decode phases" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Fases de prefill y decode</title>
  <desc>Prefill procesa los tokens del prompt en paralelo y rellena el KV cache. Los prefills largos o bien agrupados suelen estar limitados por cómputo, mientras que los prefills cortos pueden estar limitados por el tráfico de memoria o la sobrecarga de lanzamiento. El decode con batch-one o de baja intensidad genera un token cada vez y está limitado por memoria.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e293b" />
    </marker>
    <marker id="arrow2b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c" />
    </marker>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="400" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a" x="450">Prefill frente a decode: dos fases, distintos cuellos de botella</text>

  <!-- Prefill Phase -->
  <rect x="40" y="55" width="390" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow2)" />
  <text y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8" x="235">Fase de prefill</text>

  <!-- Input prompt tokens -->
  <rect x="70" y="100" width="330" height="40" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="125" text-anchor="middle" font-size="12" fill="#0f172a" x="235">Prompt de entrada: «Explica la computación cuántica en…»</text>

  <!-- Parallel processing arrows -->
  <g transform="translate(70, 155)">
    <rect width="60" height="30" rx="4" fill="#2563eb" />
    <text y="20" text-anchor="middle" font-size="10" fill="#ffffff" x="30">Token 1</text>
  </g>
  <g transform="translate(140, 155)">
    <rect width="60" height="30" rx="4" fill="#2563eb" />
    <text y="20" text-anchor="middle" font-size="10" fill="#ffffff" x="30">Token 2</text>
  </g>
  <g transform="translate(210, 155)">
    <rect width="60" height="30" rx="4" fill="#2563eb" />
    <text y="20" text-anchor="middle" font-size="10" fill="#ffffff" x="30">Token 3</text>
  </g>
  <g transform="translate(280, 155)">
    <rect width="50" height="30" rx="4" fill="#2563eb" />
    <text y="20" text-anchor="middle" font-size="10" fill="#ffffff" x="25">…</text>
  </g>
  <g transform="translate(340, 155)">
    <rect width="60" height="30" rx="4" fill="#2563eb" />
    <text y="20" text-anchor="middle" font-size="10" fill="#ffffff" x="30">Token N</text>
  </g>
  <text y="205" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="bold" x="235">Todos los tokens se procesan en paralelo</text>

  <!-- Properties -->
  <rect x="70" y="220" width="330" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1" opacity="0.7" />
  <text y="245" font-size="12" font-weight="bold" fill="#1d4ed8" x="90">A MENUDO LIMITADO POR CÓMPUTO CUANDO ES GRANDE</text>
  <text y="265" font-size="11" fill="#0f172a" x="90">• Los GEMM agrupados reutilizan los pesos del modelo</text>
  <text y="282" font-size="11" fill="#0f172a" x="90">• Las cargas cortas pueden estar limitadas por el ancho de banda o el lanzamiento</text>
  <text y="299" font-size="11" fill="#0f172a" x="90">• Contribuye al TTFT de extremo a extremo</text>
  <text y="316" font-size="11" fill="#0f172a" x="90">• Perfila la longitud del prompt y el tamaño del batch</text>
  <text y="333" font-size="11" fill="#9a3412" font-weight="bold" x="90">• Optimiza el cuello de botella medido</text>

  <!-- Arrow between phases -->
  <line x1="430" y1="200" x2="438" y2="200" stroke="#334155" stroke-width="2" />
  <line x1="462" y1="200" x2="470" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)" />
  <rect x="440" y="136" width="20" height="128" rx="3" fill="#f8fafc" />
  <text y="200" text-anchor="middle" font-size="11" fill="#334155" x="450" transform="rotate(-90 450 200)">KV cache rellenado</text>

  <!-- Decode Phase -->
  <rect x="470" y="55" width="390" height="300" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow2)" />
  <text y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412" x="665">Fase de decode</text>

  <!-- Sequential token generation -->
  <rect x="500" y="100" width="330" height="40" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="125" text-anchor="middle" font-size="12" fill="#0f172a" x="665">Salida: token → token → token → …</text>

  <!-- Sequential arrows -->
  <g transform="translate(540, 155)">
    <rect width="60" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" />
    <text y="20" text-anchor="middle" font-size="10" fill="#9a3412" x="30">t₁</text>
  </g>
  <line x1="600" y1="170" x2="630" y2="170" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow2b)" />
  <g transform="translate(630, 155)">
    <rect width="60" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" />
    <text y="20" text-anchor="middle" font-size="10" fill="#9a3412" x="30">t₂</text>
  </g>
  <line x1="690" y1="170" x2="720" y2="170" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow2b)" />
  <g transform="translate(720, 155)">
    <rect width="60" height="30" rx="4" fill="#fff7ed" stroke="#ea580c" />
    <text y="20" text-anchor="middle" font-size="10" fill="#9a3412" x="30">t₃</text>
  </g>
  <text y="205" text-anchor="middle" font-size="11" fill="#9a3412" font-weight="bold" x="665">Un token cada vez, secuencialmente</text>

  <!-- Properties -->
  <rect x="500" y="215" width="330" height="130" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1" opacity="0.7" />
  <text font-size="11" font-weight="bold" fill="#9a3412" x="520">
    <tspan x="520" y="238">BATCH-ONE / BAJA INTENSIDAD</tspan>
    <tspan x="520" y="252">EL DECODE ESTÁ LIMITADO POR MEMORIA</tspan>
  </text>
  <text y="269" font-size="11" fill="#0f172a" x="520">• Matrix-vector o GEMM pequeño</text>
  <text y="286" font-size="11" fill="#0f172a" x="520">• Lee todos los pesos + KV cache desde HBM</text>
  <text y="303" font-size="11" fill="#0f172a" x="520">• La intensidad con batch-one ≈ 1</text>
  <text y="320" font-size="11" fill="#0f172a" x="520">• Determina el TPOT</text>
  <text y="337" font-size="11" fill="#1d4ed8" font-weight="bold" x="520">• Optimiza: GQA, cuantización de KV, batching, BW</text>

  <!-- Timeline bar at bottom -->
  <rect x="40" y="370" width="820" height="20" rx="3" fill="#f1f5f9" />
  <rect x="40" y="370" width="280" height="20" rx="3" fill="#2563eb" opacity="0.3" />
  <rect x="320" y="370" width="540" height="20" rx="3" fill="#ea580c" opacity="0.3" />
  <text y="384" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="bold" x="180">TTFT</text>
  <text y="384" text-anchor="middle" font-size="10" fill="#9a3412" font-weight="bold" x="590">TPOT × (tokens de salida − 1)</text>
</svg>
