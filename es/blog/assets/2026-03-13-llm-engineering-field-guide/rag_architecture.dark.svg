<text x="32" y="446" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Un generador potente no recupera evidencias no halladas; evalúa cada etapa.</text>
<text x="32" y="468" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Añade búsqueda híbrida, reranking o transformación tras confirmar un fallo real.</text>
