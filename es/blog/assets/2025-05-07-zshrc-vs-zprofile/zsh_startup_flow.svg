<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="zsf-title zsf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="zsf-title">Orden de evaluación de los archivos de inicio de Zsh</title>
  <desc id="zsf-desc">Una secuencia numerada muestra zshenv para cada invocación de Zsh, zprofile para shells de login, zshrc para shells interactivos, zlogin para shells de login después de zshrc y zlogout cuando un shell de login finaliza normalmente. Los archivos cuyas condiciones no se cumplen se omiten.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="472" rx="14" fill="#f7f7f4" />
  <text class="section" x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">ORDEN DE INICIO — CADA ARCHIVO TIENE SU PROPIA CONDICIÓN</text>

  <circle cx="94" cy="76" r="14" fill="#17211b" /><text class="marker-num" x="94" y="81" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">1</text>
  <circle cx="374" cy="76" r="14" fill="#17211b" /><text class="marker-num" x="374" y="81" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">2</text>
  <circle cx="654" cy="76" r="14" fill="#17211b" /><text class="marker-num" x="654" y="81" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">3</text>

  <rect class="store" x="80" y="96" width="240" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="100" y="126" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TODO ZSH</text>
  <text class="name" x="100" y="153" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zshenv</text>
  <text class="note" x="100" y="176" fill="#59645e" font-size="13">Se lee primero; manténlo silencioso</text>

  <rect class="store" x="360" y="96" width="240" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="380" y="126" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">SOLO LOGIN</text>
  <text class="name" x="380" y="153" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zprofile</text>
  <text class="note" x="380" y="176" fill="#59645e" font-size="13" style="font-size: 12.5px;">Antes de la configuración interactiva</text>

  <rect x="640" y="96" width="240" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="660" y="126" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ENFOQUE · INTERACTIVO</text>
  <text class="name" x="660" y="153" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zshrc</text>
  <text class="note" x="660" y="176" fill="#c50e72" font-size="13">Prompt, autocompletado, hooks</text>

  <path class="edge" d="M320 144h32" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#zsf-arrow)" />
  <path class="edge" d="M600 144h32" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#zsf-arrow)" />
  <path class="edge" d="M760 192v72" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#zsf-arrow)" />

  <circle cx="654" cy="252" r="14" fill="#17211b" /><text class="marker-num" x="654" y="257" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">4</text>
  <circle cx="374" cy="252" r="14" fill="#17211b" /><text class="marker-num" x="374" y="257" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">5</text>

  <rect class="store" x="640" y="272" width="240" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="660" y="302" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">SOLO LOGIN</text>
  <text class="name" x="660" y="329" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zlogin</text>
  <text class="note" x="660" y="352" fill="#59645e" font-size="13" style="font-size: 11px;"><tspan x="660">Después de .zshrc cuando ambas</tspan><tspan x="660" dy="1.2em">condiciones se cumplen</tspan></text>

  <rect class="store" x="360" y="272" width="240" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="380" y="302" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">SALIDA DE LOGIN</text>
  <text class="name" x="380" y="329" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zlogout</text>
  <text class="note" x="380" y="352" fill="#59645e" font-size="13">Solo al salir normalmente</text>

  <path d="M640 320h-32" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#zsf-arrow)" />

  <path d="M48 408h864" stroke="#d8ddd9" stroke-width="1" />
  <text class="note" x="48" y="436" fill="#59645e" font-size="13">Zsh mantiene este orden, pero omite cualquier archivo cuya condición de login o interactiva no se cumpla.</text>

  <defs>
    <marker id="zsf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
