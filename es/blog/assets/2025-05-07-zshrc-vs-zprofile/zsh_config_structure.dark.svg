<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="zcs-title zcs-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="zcs-title">Archivos de inicio de Zsh seleccionados según los modos de login e interactivo</title>
  <desc id="zcs-desc">Una matriz dos por dos asigna las flags independientes de login e interactivo a los archivos de inicio que lee Zsh. Los shells interactivos de login leen zshenv, zprofile, zshrc y zlogin; los shells de login no interactivos omiten zshrc; los shells interactivos que no son de login leen zshenv y zshrc; y los shells sin ninguna de las dos flags solo leen zshenv.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0c1210" />

  <text class="section" x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">DOS FLAGS — CUATRO CONJUNTOS DE INICIO</text>
  <text class="axis" x="168" y="84" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">INTERACTIVO</text>
  <text class="axis" x="560" y="84" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">NO INTERACTIVO</text>

  <text class="axis" x="48" y="142" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">LOGIN</text>
  <text class="note" x="48" y="166" fill="#a8b8af" font-size="13">flag activada</text>
  <text class="axis" x="48" y="278" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">NO LOGIN</text>
  <text class="note" x="48" y="302" fill="#a8b8af" font-size="13">flag desactivada</text>

  <rect class="mode" x="168" y="104" width="352" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="188" y="134" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO</text>
  <text class="name" x="188" y="161" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Login + interactivo</text>
  <text class="note" x="188" y="184" fill="#a8b8af" font-size="13">.zshenv → .zprofile → .zshrc → .zlogin</text>

  <rect class="mode" x="560" y="104" width="352" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="580" y="134" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO</text>
  <text class="name" x="580" y="161" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Login + no interactivo</text>
  <text class="note" x="580" y="184" fill="#a8b8af" font-size="13">.zshenv → .zprofile → .zlogin</text>

  <rect x="168" y="240" width="352" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="188" y="270" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO DE CONCENTRACIÓN</text>
  <text class="name" x="188" y="297" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">No login + interactivo</text>
  <text class="note" x="188" y="320" fill="#ff6fb6" font-size="13">.zshenv → .zshrc</text>

  <rect class="mode" x="560" y="240" width="352" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="580" y="270" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO</text>
  <text class="name" x="580" y="297" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">No login + no interactivo</text>
  <text class="note" x="580" y="320" fill="#a8b8af" font-size="13">Solo .zshenv</text>

  <path d="M48 376h864" stroke="#2b3b33" stroke-width="1" />
  <text class="note" x="48" y="404" fill="#a8b8af" font-size="13">Un Zsh interactivo anidado también lee .zshrc; no tiene que ser un shell de login.</text>
</svg>
