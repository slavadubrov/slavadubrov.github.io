<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="xgrammar-title xgrammar-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="xgrammar-title">XGrammar se sitúa entre los logits del modelo y el sampling</title>
  <desc id="xgrammar-desc">El modelo produce logits sin procesar, XGrammar enmascara los tokens no válidos según el schema, el sampling elige un token elegible y el token aceptado hace avanzar el estado del decoder antes de repetir el loop.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .mono { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #17211B; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="448" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="48">APLICACIÓN · POST-FORWARD, PRE-SAMPLING</text>

  <rect class="box" x="48" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="68" y="122">PROCESO · GPU</text>
  <text class="name" x="68" y="151">Forward pass</text>
  <path class="edge" d="M192 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect class="store" x="224" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="244" y="122">ALMACENAMIENTO · SCORES</text>
  <text class="name" x="244" y="151"><tspan x="244">Logits sin</tspan><tspan x="244" dy="1.2em">procesar</tspan></text>
  <path class="edge" d="M368 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect x="400" y="88" width="144" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="420" y="122" fill="#C50E72">FOCO · CPU</text>
  <text class="name" x="420" y="151" fill="#C50E72"><tspan x="420">Máscara de</tspan><tspan x="420" dy="1.2em">gramática</tspan></text>
  <path class="edge" d="M544 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect class="box" x="576" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="596" y="122">PROCESO</text>
  <text class="name" x="596" y="151">Sampling</text>
  <path class="edge" d="M720 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect class="store" x="752" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="772" y="122">ALMACENAMIENTO · ESTADO</text>
  <text class="name" x="772" y="151">Token aceptado</text>

  <path class="edge" d="M824 184v44a12 12 0 0 1-12 12H132a12 12 0 0 1-12-12v-36" stroke-dasharray="2 6" marker-end="url(#xgrammar-arrow)" />
  <rect x="404" y="228" width="136" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="472" y="245" text-anchor="middle">avanzar y repetir</text>

  <path d="M48 296h416" stroke="#D8DDD9" />
  <text class="kind" x="48" y="324">EJEMPLO · CAMPO NUMÉRICO</text>
  <text class="mono" x="48" y="354">sin procesar</text>
  <text class="note" x="104" y="354">“fifteen” · 15 · true · {</text>
  <text class="mono" x="48" y="382">máscara</text>
  <text class="note" x="104" y="382">bloqueado · permitido · bloqueado · bloqueado</text>

  <path d="M496 296h416" stroke="#D8DDD9" />
  <text class="kind" x="496" y="324">LÍMITE · LO QUE QUEDA</text>
  <text class="name" x="496" y="354">La máscara garantiza la estructura.</text>
  <text class="note" x="496" y="382">No decide si 15 es correcto o está permitido.</text>
  <defs>
    <marker id="xgrammar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
