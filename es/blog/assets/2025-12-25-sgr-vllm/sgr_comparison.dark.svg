<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="comparison-title comparison-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="comparison-title">Comparativa: prompt engineering, chain-of-thought y razonamiento guiado por esquema</title>
  <desc id="comparison-desc">Tres columnas alineadas comparan el formato de salida, el mecanismo de control y la adecuación a la aplicación. Se destaca el razonamiento guiado por esquema porque el constrained decoding bloquea las salidas que no cumplen el esquema, aunque los errores semánticos siguen requiriendo validación.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">COMPARACIÓN · MISMA PETICIÓN, DISTINTO CONTROL</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="106">ENFOQUE · PROMPT</text>
  <text class="name" x="68" y="135">Prompt engineering</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="106">ENFOQUE · COT</text>
  <text class="name" x="372" y="135">Chain-of-thought</text>
  <rect x="656" y="72" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="676" y="106" fill="#FF6FB6">FOCO · SGR</text>
  <text class="name" x="676" y="135" fill="#FF6FB6">Guiado por esquema</text>

  <text class="kind" x="48" y="216">FORMATO DE SALIDA</text>
  <text class="note" x="48" y="244">texto variable</text>
  <text class="note" x="352" y="244">prosa de razonamiento libre</text>
  <text class="note" x="656" y="244">JSON rígido / Pydantic</text>
  <path d="M48 264h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="300">CONTROL</text>
  <text class="note" x="48" y="328">persuasión semántica</text>
  <text class="note" x="352" y="328">prompts heurísticos paso a paso</text>
  <text class="note" x="656" y="328">máscara de gramática por token</text>
  <path d="M48 348h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="384">ADECUACIÓN A LA APLICACIÓN</text>
  <text class="note" x="48" y="412">el parser debe recuperar los campos</text>
  <text class="note" x="352" y="412">el lector debe interpretar la prosa</text>
  <text class="note" x="656" y="412">los campos se validan; el significado aún debe comprobarse</text>
</svg>
