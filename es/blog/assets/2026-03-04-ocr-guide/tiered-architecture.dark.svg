<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-routing-title ocr-routing-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-routing-title">El OCR en producción dirige los documentos por niveles de fallback calibrados</title>
  <desc id="ocr-routing-desc">Los documentos entrantes prueban primero su texto nativo. Si fallan las comprobaciones, pasan por un OCR rápido y después por un modelo más potente. Las rutas que superan los controles convergen en el post-processing y el structured output; los campos de alto riesgo no resueltos pasan a revisión humana.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .branch { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.1px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="688" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">ROUTER DE PRODUCCIÓN · ESCALAR SOLO SI FALLA UN CONTROL</text>

  <rect x="48" y="88" width="152" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="122">EXTERNO</text><text class="name" x="68" y="150">Documentos</text>

  <path class="box" d="M336 88 432 136 336 184 240 136Z" />
  <text class="kind" x="336" y="128" text-anchor="middle">DECISIÓN</text>
  <text class="name" x="336" y="151" text-anchor="middle">¿Texto utilizable?</text>
  <path class="edge" d="M200 136h32" marker-end="url(#ocr-routing-arrow)" />

  <rect class="box" x="176" y="240" width="248" height="96" rx="10" />
  <text class="kind" x="196" y="274">PROCESO</text><text class="name" x="196" y="302">OCR local rápido</text>
  <text class="note" x="196" y="322">Rasterizar · normalizar · extraer</text>
  <path class="edge" d="M336 184v24h-36v24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="348" y="208">NO</text>

  <path class="box" d="M560 240 656 288 560 336 464 288Z" />
  <text class="kind" x="560" y="280" text-anchor="middle">DECISIÓN</text>
  <text class="name" x="560" y="303" text-anchor="middle">¿Supera el control?</text>
  <path class="edge" d="M424 288h32" marker-end="url(#ocr-routing-arrow)" />

  <rect class="box" x="176" y="392" width="248" height="96" rx="10" />
  <text class="kind" x="196" y="426">PROCESO</text><text class="name" x="196" y="454">Modelo más potente</text>
  <text class="note" x="196" y="474">Maquetación · páginas degradadas · campos</text>
  <path class="edge" d="M560 336v24H300v24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="572" y="360">NO</text>

  <path class="box" d="M560 392 656 440 560 488 464 440Z" />
  <text class="kind" x="560" y="432" text-anchor="middle">DECISIÓN</text>
  <text class="name" x="560" y="455" text-anchor="middle">¿Supera el control?</text>
  <path class="edge" d="M424 440h32" marker-end="url(#ocr-routing-arrow)" />

  <rect x="448" y="544" width="224" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="468" y="578" fill="#FF6FB6">ATENCIÓN</text>
  <text class="name" x="468" y="606" fill="#FF6FB6">Revisión humana</text>
  <text class="note" x="468" y="626">Campos no resueltos o de alto riesgo</text>
  <path class="edge" d="M560 488v48" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="572" y="520">NO</text>

  <rect class="box" x="736" y="88" width="176" height="96" rx="10" />
  <text class="kind" x="756" y="122">PROCESO</text><text class="name" x="756" y="150">Post-processing</text>
  <path class="edge" d="M432 136h296" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="448" y="124">SÍ · TEXTO NATIVO</text>

  <rect x="736" y="240" width="176" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="756" y="274">ALMACENAR</text><text class="name" x="756" y="302">Structured output</text>
  <path class="edge" d="M824 184v48" marker-end="url(#ocr-routing-arrow)" />

  <path class="edge" d="M656 288h48M656 440h48M672 592h32M704 592V136h24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="672" y="276">SÍ</text>
  <text class="branch" x="672" y="428">SÍ</text>
  <text class="branch" x="688" y="580">REVISADO</text>

  <path d="M48 656h864" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="48" y="680">Calibra cada control según la clase de documento, la criticidad del campo y los resultados etiquetados.</text>

  <defs>
    <marker id="ocr-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
