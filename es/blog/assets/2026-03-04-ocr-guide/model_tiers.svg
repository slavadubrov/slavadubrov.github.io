<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Tres familias de despliegue de OCR</title>
  <desc id="artifact-desc">Se comparan el OCR tradicional, los modelos especializados en documentos y los modelos generales de visión y lenguaje según la amplitud de tareas. El modo de despliegue varía independientemente según el producto y puede ser en CPU local, GPU autogestionada o API alojada.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="430" rx="14" fill="#f8fafc" />
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">Familias de modelos de OCR</text>
  <text x="48" y="76" font-size="14" fill="#64748b">La amplitud de tareas difiere; la carga operativa depende del producto elegido y del modo de alojamiento</text>

  <g>
    <rect x="40" y="112" width="280" height="244" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <path d="M 50 112 H 310 A 10 10 0 0 1 320 122 V 156 H 40 V 122 A 10 10 0 0 1 50 112 Z" fill="#16a34a" />
    <text x="180" y="141" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">OCR tradicional</text>
    <text x="60" y="190" font-size="14" font-weight="600" fill="#0f172a">Mejor primera prueba</text>
    <text x="60" y="214" font-size="13" fill="#64748b">Texto impreso limpio y alfabetos acotados</text>
    <text x="60" y="244" font-size="14" font-weight="600" fill="#0f172a">Ejemplos</text>
    <text x="60" y="268" font-size="13" fill="#64748b">Tesseract, PaddleOCR</text>
    <rect x="60" y="292" width="240" height="42" rx="6" fill="#f0fdf4" />
    <text x="180" y="309" font-size="12" font-weight="600" fill="#166534" text-anchor="middle"><tspan x="180">Despliegue: CPU local</tspan><tspan x="180" dy="16">o GPU autogestionada</tspan></text>
  </g>

  <g>
    <rect x="340" y="112" width="280" height="244" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <path d="M 350 112 H 610 A 10 10 0 0 1 620 122 V 156 H 340 V 122 A 10 10 0 0 1 350 112 Z" fill="#2563eb" />
    <text x="480" y="141" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Modelos especializados en documentos</text>
    <text x="360" y="190" font-size="14" font-weight="600" fill="#0f172a">Tareas documentales más amplias</text>
    <text x="360" y="214" font-size="13" fill="#64748b">Maquetación, tablas, fórmulas y orden</text>
    <text x="360" y="244" font-size="14" font-weight="600" fill="#0f172a">Ejemplos</text>
    <text x="360" y="268" font-size="13" fill="#64748b">dots.ocr, DeepSeek-OCR2</text>
    <rect x="360" y="292" width="240" height="42" rx="6" fill="#eff6ff" />
    <text x="480" y="309" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle"><tspan x="480">Despliegue: GPU autogestionada</tspan><tspan x="480" dy="16">o API alojada</tspan></text>
  </g>

  <g>
    <rect x="640" y="112" width="280" height="244" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <path d="M 650 112 H 910 A 10 10 0 0 1 920 122 V 156 H 640 V 122 A 10 10 0 0 1 650 112 Z" fill="#7c3aed" />
    <text x="780" y="141" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">VLMs generales</text>
    <text x="660" y="190" font-size="14" font-weight="600" fill="#0f172a">Razonamiento textual y visual</text>
    <text x="660" y="214" font-size="13" fill="#64748b">VQA y extracción semántica</text>
    <text x="660" y="244" font-size="14" font-weight="600" fill="#0f172a">Ejemplos</text>
    <text x="660" y="268" font-size="13" fill="#64748b">Gemini, GPT, Qwen-VL</text>
    <rect x="660" y="292" width="240" height="42" rx="6" fill="#faf5ff" />
    <text x="780" y="309" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle"><tspan x="780">Despliegue: API alojada</tspan><tspan x="780" dy="16">o pesos abiertos autogestionados</tspan></text>
  </g>

  <rect x="120" y="380" width="720" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="480" y="400" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Calidad en benchmarks, latencia, privacidad y coste operativo sobre las mismas páginas etiquetadas</text>
</svg>
