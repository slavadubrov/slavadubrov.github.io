<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="sgrvalid-title sgrvalid-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgrvalid-title">Un validador de pasos comprueba cada acción propuesta antes de que se convierta en un tool call y devuelve los pasos defectuosos al reasoner.</title><desc id="sgrvalid-desc">El reasoner propone un paso y el validador de pasos lo comprueba. Si se rechaza, vuelve al reasoner con comentarios; si se acepta, se ejecuta en el runtime y su resultado de API se guarda como observación, que alimenta el siguiente turno de razonamiento.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgrvalid-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="sgrvalid-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Valida cada paso guiado por el esquema antes de ejecutarlo</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El equipo NLN7Dw rechaza un paso defectuoso antes de que se convierta en un tool call.</text>
<path d="M42 112h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 112h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">RAZONADOR</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Proponer paso</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Prepara el siguiente tool call</text><circle cx="32" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M430 112h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M430 112h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="434" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">VALIDADOR DE PASOS</text><text x="434" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Comprobar acción</text><text x="434" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Reformula los pasos defectuosos</text><circle cx="420" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="420" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M430 288h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M430 288h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="434" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">RUNTIME</text><text x="434" y="349" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Ejecutar herramienta</text><text x="434" y="371" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Solo ejecuta tool calls validados</text><circle cx="420" cy="288" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="420" y="292.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M42 288h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M42 288h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="46" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">OBSERVACIÓN</text><text x="46" y="349" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Resultado de API</text><text x="46" y="371" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="46">Alimenta el siguiente turno de</tspan><tspan x="46" dy="1.2em">razonamiento</tspan></text><circle cx="32" cy="288" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="292.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">4</text>
<path d="M300 164h120" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgrvalid-arrow-flow)" /><rect x="306" y="140" width="108" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="360" y="156.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">proponer paso</text>
<path d="M420 196H300" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#sgrvalid-arrow-flow)" /><rect x="328" y="172" width="64" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="360" y="188.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">rechazar</text>
<path d="M554 216v72" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgrvalid-arrow-flow)" /><text x="554" y="272.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">aceptar</text>
<path d="M420 340H300" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgrvalid-arrow-flow)" /><rect x="328" y="316" width="64" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="360" y="332.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">resultado</text>
<path d="M166 288v-72" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgrvalid-arrow-flow)" /><text x="166" y="272.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">siguiente paso</text>
<path d="M32 432h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="458" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Los pasos rechazados se reformulan con los comentarios del validador antes de convertirse en un tool call.</text>
<text x="32" y="480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Los pasos aceptados se ejecutan y la observación alimenta el siguiente turno de razonamiento.</text>
</svg>
