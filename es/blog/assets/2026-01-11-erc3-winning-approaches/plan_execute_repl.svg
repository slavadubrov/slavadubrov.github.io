<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="planrepl-title planrepl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planrepl-title">Un planner, un modelo de código con contexto nuevo y un REPL persistente alimentan un modelo de decisión que puede continuar, abortar o replantear el plan.</title><desc id="planrepl-desc">Un planner define un paso, un modelo de código escribe el código Python correspondiente en un contexto nuevo del modelo y un REPL de tareas ejecuta el script conservando el estado de la tarea entre pasos. A continuación, un modelo de decisión, señalado como foco, decide si continuar, abortar o replantear el plan, y vuelve al planner para el siguiente paso.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="planrepl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="planrepl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="370" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Planificar, generar código, ejecutar con estado persistente y decidir</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El equipo key_concept_parallel aísla cada paso en un contexto nuevo del modelo.</text>
<rect x="32" y="100" width="736" height="154" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="126" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">REPL DE FINALIZACIÓN DE PASOS</text>
<path d="M42 166h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 166h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="183.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PLANNER · GPT-5.1</text><text x="46" y="221" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Planificar un paso</text><circle cx="32" cy="166" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="170.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M230 166h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M230 166h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="234" y="183.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODELO DE CÓDIGO</text><text x="234" y="221" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Escribir Python</text><circle cx="220" cy="166" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="220" y="170.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M418 166h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M418 166h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="422" y="183.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">REPL DE TAREAS</text><text x="422" y="221" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" style="font-size: 11px;"><tspan x="422">Ejecutar y conservar el</tspan><tspan x="422" dy="1.2em">estado</tspan></text><circle cx="408" cy="166" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="408" y="170.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M606 166h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M606 166h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="610" y="183.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">MODELO DE DECISIÓN</text><text x="610" y="221" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Decidir el resultado</text><circle cx="596" cy="166" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="596" y="170.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">4</text>
<path d="M204 202h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planrepl-arrow-flow)" />
<path d="M392 202h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planrepl-arrow-flow)" />
<path d="M580 202h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planrepl-arrow-flow)" />
<path d="M682 166v-20H118v20" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#planrepl-arrow-flow)" /><rect x="324" y="134" width="152" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="400" y="150.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">vuelve al siguiente paso</text>
<path d="M32 294h736" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="320" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El replanteamiento conserva el trabajo terminado y reescribe solo lo que queda, a diferencia de un reinicio completo.</text>
<text x="32" y="342" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Solo el REPL transporta el estado entre pasos; el modelo de código de cada paso empieza desde cero.</text>
</svg>
