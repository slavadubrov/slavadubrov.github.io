<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="enrichguard-title enrichguard-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="enrichguard-title">Los enrichers de API inyectan sugerencias no bloqueantes y un guard por niveles independiente decide si la acción propuesta puede continuar.</title><desc id="enrichguard-desc">Una respuesta de una API externa es inspeccionada por más de veinte enrichers, que inyectan sugerencias de rol y paginación en el contexto. Una búsqueda híbrida en la wiki corporativa, que combina streams regex, semánticos y de palabras clave, alimenta al mismo agente de reasoning. El agente elige una acción y el guard por niveles decide entre hard block, soft block o soft hint antes de que la acción continúe.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="enrichguard-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="enrichguard-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="810" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0" style="font-size: 18px;">Los enrichers de API guían al agente antes de que los guards por niveles decidan</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El equipo J8Gvbi separó las sugerencias no bloqueantes de un guard independiente de tres modos.</text>
