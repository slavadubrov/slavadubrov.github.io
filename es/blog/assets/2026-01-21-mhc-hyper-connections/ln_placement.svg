<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #F7F7F4; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Rutas residuales Post-LN y Pre-LN</title>
  <desc id="desc">Post-LN normaliza después de sumar la actualización residual; Pre-LN normaliza antes del bloque y deja una ruta de identidad más directa.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <marker id="arrowSlate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#FFFFFF" />
    </marker>
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5" />
    </marker>

    <!-- Glow & Shadow -->





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="600" fill="#F7F7F4" />

  <!-- Background grid layer -->
  <rect width="1000" height="600" fill="#F7F7F4" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#17211B">Compromisos entre Post-LN y Pre-LN</text>
  <text x="40" y="80" font-size="16" fill="#17211B">Dónde colocar Layer Normalization crea un compromiso fundamental.</text>

  <!-- Center divider -->
  <line x1="500" y1="120" x2="500" y2="520" stroke="#59645E" stroke-width="2" stroke-dasharray="8,6" />
  <circle cx="500" cy="320" r="22" fill="#ffffff" stroke="#59645E" stroke-width="2" />
  <text x="500" y="325" text-anchor="middle" fill="#17211B" font-size="14" font-weight="700">vs</text>

  <!-- LEFT SIDE: Post-LN -->
  <g transform="translate(140, 110)">

    <!-- Title -->
    <text x="110" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="#17211B">Post-LN</text>
    <text x="110" y="45" text-anchor="middle" font-size="13" fill="#17211B">(Transformer original)</text>

    <!-- Base Paths -->
    <g stroke="#59645E" stroke-width="2.5" fill="none">
      <!-- Input line down to split -->
      <path d="M 110 75 L 110 115" marker-end="url(#arrowSlate)" />
      <circle cx="110" cy="125" r="8" fill="#ffffff" stroke="#17211B" />

      <!-- Split down to F(x) -->
      <path d="M 110 133 L 110 155" marker-end="url(#arrowSlate)" />

      <!-- F(x) to Add -->
      <path d="M 110 210 L 110 235" marker-end="url(#arrowSlate)" />

      <!-- Add to LN -->
      <path d="M 110 270 L 110 295" marker-end="url(#arrowSlate)" />

      <!-- LN to Output -->
      <path d="M 110 350 L 110 375" marker-end="url(#arrowSlate)" />
    </g>

    <!-- Residual Path (Post-LN) -->
    <!-- Gradient flow gets rescaled/faded by LN in backprop -->
    <path id="pathPostRes" d="M 118 125 C 220 125 220 255 130 255" fill="none" stroke="#59645E" stroke-width="2.5" marker-end="url(#arrowAmber)" />

    <!-- Animated Particles -->
    <!-- Signal weakens after LN in backward pass logic (simulated by faded color) -->

    <!-- Flow Blocks -->
    <text x="110" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">x</text>

    <!-- F(x) block -->
    <rect x="40" y="160" width="140" height="50" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="110" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">F(x)</text>

    <!-- Add circle -->
    <circle cx="110" cy="255" r="15" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="110" y="261" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B">+</text>

    <!-- LayerNorm Block (Red to indicate warning/issue area) -->
    <rect x="40" y="300" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="110" y="330" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">LayerNorm</text>

    <!-- Properties Card (Bottom) -->
    <rect x="-30" y="400" width="280" height="65" rx="8" fill="#ffffff" stroke="#D8DDD9" stroke-width="1.5" class="visual-focus" />
    <text x="10" y="425" font-size="13" font-weight="700" fill="#17211B">Contribución de la profundidad</text>
    <text x="10" y="448" font-size="13" font-weight="700" fill="#17211B">Puede ser más difícil de optimizar</text>
  </g>

  <!-- RIGHT SIDE: Pre-LN -->
  <g transform="translate(640, 110)">

    <!-- Title -->
    <text x="110" y="25" text-anchor="middle" font-size="20" font-weight="800" fill="#17211B">Pre-LN</text>
    <text x="110" y="45" text-anchor="middle" font-size="13" fill="#17211B">(Transformer moderno)</text>

    <!-- Base Paths -->
    <g stroke="#59645E" stroke-width="2.5" fill="none">
      <!-- Input line down to split -->
      <path d="M 110 75 L 110 115" marker-end="url(#arrowSlate)" />
      <circle cx="110" cy="125" r="8" fill="#ffffff" stroke="#17211B" />

      <!-- Split down to LN -->
      <path d="M 110 133 L 110 155" marker-end="url(#arrowSlate)" />

      <!-- LN to F(x) -->
      <path d="M 110 210 L 110 235" marker-end="url(#arrowSlate)" />

      <!-- F(x) to Add -->
      <path d="M 110 290 L 110 315" marker-end="url(#arrowSlate)" />

      <!-- Add to Output -->
      <path d="M 110 345 L 110 375" marker-end="url(#arrowSlate)" />
    </g>

    <!-- Residual Path (Pre-LN) -->
    <!-- Clean, strong identity path flowing straight through to addition -->
    <path id="pathPreRes" d="M 118 125 C 230 125 230 330 130 330" fill="none" stroke="#59645E" stroke-width="2.5" marker-end="url(#arrowAmber)" />

    <!-- Animated Particles -->
    <!-- Signal remains strong along the unbroken identity shortcut -->

    <!-- Residual Identity Label -->
    <rect x="175" y="215" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="210" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#17211B">Identidad</text>

    <!-- Flow Blocks -->
    <text x="110" y="65" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">x</text>

    <!-- LayerNorm Block (Green to indicate clean/stable placement) -->
    <rect x="40" y="160" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text x="110" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">LayerNorm</text>

    <!-- F(x) block -->
    <rect x="40" y="240" width="140" height="50" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="110" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">F(x)</text>

    <!-- Add circle -->
    <circle cx="110" cy="330" r="15" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="110" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B">+</text>

    <!-- Properties Card (Bottom) -->
    <rect x="-30" y="400" width="280" height="65" rx="8" fill="#ffffff" stroke="#D8DDD9" stroke-width="1.5" />
    <text x="10" y="425" font-size="13" font-weight="700" fill="#17211B">Ruta residual más directa</text>
    <text x="10" y="448" font-size="13" font-weight="700" fill="#17211B">La similitud entre capas puede aumentar</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
