<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Training Pipeline" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Demo de fine-tuning de function calling con Unsloth</title>
  <desc>El demo convierte un dataset de function calling, carga un modelo base Nemotron Nano de cuatro bits, entrena adaptadores LoRA de rango 16 con SFT y guarda un adaptador versionado para su evaluación.</desc>
  <defs>





    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1B2621" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="400" fill="#0C1210" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">Pipeline de fine-tuning de Unsloth</text>

  <!-- Step 1: Dataset -->
  <rect x="30" y="80" width="150" height="100" rx="12" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="105" y="115" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Dataset</text>
  <text x="105" y="138" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">glaive-function-</text>
  <text x="105" y="153" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">calling-v2</text>
  <text x="105" y="172" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">113K ejemplos</text>

  <!-- Arrow 1 -->
  <path d="M180 130 L230 130" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Base Model -->
  <rect x="240" y="80" width="150" height="100" rx="12" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="315" y="115" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Modelo base</text>
  <text x="315" y="138" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Nemotron-Nano</text>
  <text x="315" y="153" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">4B-v1.1</text>
  <text x="315" y="172" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Cuantizado a 4 bits</text>

  <!-- Arrow 2 -->
  <path d="M390 130 L440 130" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Training -->
  <rect x="450" y="65" width="180" height="130" rx="12" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="540" y="95" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Entrenamiento SFT</text>
  <text x="540" y="120" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">LoRA r=16, α=32</text>
  <text x="540" y="140" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">max_seq=4096</text>
  <text x="540" y="160" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">packing=True</text>
  <text x="540" y="185" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Benchmark de velocidad en la GPU objetivo</text>

  <!-- Arrow 3 -->
  <path d="M630 130 L680 130" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: Output -->
  <rect x="690" y="80" width="180" height="100" rx="12" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="780" y="115" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Fine-tuned</text>
  <text x="780" y="138" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Function calling</text>
  <text x="780" y="153" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">modelo especializado</text>
  <text x="780" y="172" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Adaptador LoRA versionado</text>

  <!-- Components detail section -->
  <rect x="30" y="210" width="840" height="170" rx="12" fill="#141D19" stroke="#FF6FB6" stroke-width="2.5" class="visual-focus" />

  <!-- Config section -->
  <rect x="50" y="230" width="250" height="130" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="175" y="255" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="bold">config.py</text>
  <text x="65" y="280" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">LORA_R = 16</text>
  <text x="65" y="298" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">LORA_ALPHA = 32</text>
  <text x="65" y="316" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">MAX_SEQ_LENGTH = 4096</text>
  <text x="65" y="334" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">BATCH_SIZE = 2</text>
  <text x="65" y="352" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">LEARNING_RATE = 2e-4</text>

  <!-- Model section -->
  <rect x="320" y="230" width="250" height="130" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="445" y="255" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="bold">model.py</text>
  <text x="335" y="280" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">FastLanguageModel</text>
  <text x="335" y="298" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  .from_pretrained()</text>
  <text x="335" y="316" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  .get_peft_model()</text>
  <text x="335" y="334" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  .save_pretrained()</text>
  <text x="335" y="352" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  .save_pretrained_gguf()</text>

  <!-- Training section -->
  <rect x="590" y="230" width="260" height="130" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="720" y="255" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="bold">training.py</text>
  <text x="605" y="280" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">SFTTrainer(</text>
  <text x="605" y="298" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  model=model,</text>
  <text x="605" y="316" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  train_dataset=dataset,</text>
  <text x="605" y="334" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">  packing=True,</text>
  <text x="605" y="352" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">).train()</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
