<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Alignment Methods" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Tres diseños de optimización de preferencias</title>
  <desc>El RLHF basado en PPO usa fine-tuning supervisado, un modelo de recompensa y optimización on-policy; DPO optimiza pares offline frente a una referencia; ORPO combina pérdidas supervisadas y de odds ratio sin un modelo de referencia.</desc>
  <defs>



    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F2F2F5" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F2F2F5" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="420" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="30" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#17211B">Diseños de optimización de preferencias</text>

  <!-- Traditional RLHF -->
  <text x="60" y="65" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">RLHF basado en PPO:</text>

  <rect x="60" y="80" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="125" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1. SFT</text>
  <text x="125" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Aprender la tarea</text>

  <path d="M 190 102 L 220 102" stroke="#59645E" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <rect x="230" y="80" width="130" height="45" rx="6" fill="#F2F2F5" class="visual-focus" />
  <text x="295" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2. Modelo de recompensa</text>
  <text x="295" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Aprender preferencias</text>

  <path d="M 360 102 L 390 102" stroke="#59645E" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <rect x="400" y="80" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="465" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3. PPO (RL)</text>
  <text x="465" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Optimizar la policy</text>

  <text x="560" y="98" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Muestras on-policy</text>
  <text x="560" y="112" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Comprobaciones del modelo de recompensa</text>

  <!-- Divider -->
  <line x1="60" y1="150" x2="850" y2="150" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Modern DPO -->
  <text x="60" y="175" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">DPO:</text>

  <rect x="60" y="190" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="125" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1. SFT</text>
  <text x="125" y="228" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Aprender la tarea</text>

  <path d="M 190 212 L 220 212" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />

  <rect x="230" y="190" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="295" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2. DPO</text>
  <text x="295" y="228" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Preferencias directas</text>

  <text x="395" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Pares offline</text>
  <text x="395" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Policy de referencia</text>
  <text x="395" y="235" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Sin modelo de recompensa aprendido</text>

  <!-- Divider -->
  <line x1="60" y1="260" x2="850" y2="260" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Newest ORPO -->
  <text x="60" y="285" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">ORPO:</text>

  <rect x="60" y="300" width="200" height="50" rx="6" fill="#F2F2F5" />
  <text x="160" y="322" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">ORPO (una etapa)</text>
  <text x="160" y="340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">SFT + alineamiento combinado</text>

  <text x="290" y="315" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">SFT + pérdida de odds ratio</text>
  <text x="290" y="330" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Sin modelo de referencia</text>
  <text x="290" y="345" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Una única ruta de checkpoint acoplada</text>

  <!-- Recommendation Box -->
  <rect x="530" y="280" width="310" height="80" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="685" y="305" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#17211B">Regla de selección</text>
  <text x="685" y="325" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Ajusta el objetivo a los datos</text>
  <text x="685" y="340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Mantén un baseline solo con SFT</text>
  <text x="685" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Mide métricas de tarea y de preferencias</text>

  <!-- Legend -->
  <rect x="60" y="375" width="780" height="35" rx="4" fill="#FFFFFF" />
  <text x="80" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B">Clave:</text>
  <text x="115" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">SFT = Supervised Fine-Tuning</text>
  <text x="300" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">DPO = Direct Preference Optimization</text>
  <text x="530" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">ORPO = Odds-Ratio Preference Optimization</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
