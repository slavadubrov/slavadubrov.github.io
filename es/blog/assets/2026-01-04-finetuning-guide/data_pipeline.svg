<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Data Pipeline" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Pipeline de preparación de datos para fine-tuning</title>
  <desc>Los ejemplos sin procesar pasan por filtrado, controles de datos sensibles, deduplicación, augmentation opcional y formateo antes de generar un split de entrenamiento versionado.</desc>
  <defs>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="35" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#17211B">Pipeline de preparación de datos</text>

  <!-- Raw Data -->
  <g transform="translate(40, 70)">
    <rect width="120" height="55" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="60" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#17211B">Datos sin procesar</text>
    <text x="60" y="44" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Corpus sin procesar</text>
  </g>

  <path d="M 160 97 L 190 97" stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 1: Ingestion -->
  <g transform="translate(200, 70)">
    <rect width="130" height="55" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1. Ingesta</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Eliminar refusals,</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">UTF-8 corrupto</text>
  </g>
  <text x="265" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B" font-style="italic">Trafilatura + FastText</text>

  <path d="M 330 97 L 360 97" stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 2: PII -->
  <g transform="translate(370, 70)">
    <rect width="130" height="55" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2. Eliminación de PII</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Redactar emails, IPs,</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">números de teléfono</text>
  </g>
  <text x="435" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B" font-style="italic">Microsoft Presidio</text>

  <path d="M 500 97 L 530 97" stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 3: Dedup -->
  <g transform="translate(540, 70)">
    <rect width="130" height="55" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3. Deduplicación</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">MinHash LSH para</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">eliminar duplicados</text>
  </g>
  <text x="605" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B" font-style="italic">DataTrove</text>

  <path d="M 670 97 L 700 97" stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 4: Augmentation -->
  <g transform="translate(710, 70)">
    <rect width="130" height="55" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">4. Augmentation</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Modelo teacher</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">reescribe los datos</text>
  </g>
  <text x="775" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B" font-style="italic">Distilabel</text>

  <!-- Arrow down and left -->
  <path d="M 820 125 L 820 170 L 545 170" stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 5: Formatting -->
  <g transform="translate(370, 155)">
    <rect width="165" height="55" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="82" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">5. Formateo</text>
    <text x="82" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Convertir a formato Alpaca / ShareGPT</text>
    <text x="82" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">JSONL</text>
  </g>

  <path d="M 370 182 L 220 182" stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Clean Dataset -->
  <g transform="translate(80, 155)">
    <rect width="130" height="55" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text x="65" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#17211B">Dataset limpio</text>
    <text x="65" y="44" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Listo para fine-tuning</text>
  </g>

  <!-- Key Principles Box -->
  <rect x="40" y="250" width="820" height="200" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" class="visual-focus" />
  <text x="60" y="280" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B">Principios clave</text>

  <circle cx="60" cy="310" r="4" fill="#C50E72" />
  <text x="75" y="314" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Calidad frente a cantidad:</text>
  <text x="210" y="314" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Añadir cobertura para distintos modos de fallo antes de repetir ejemplos sencillos</text>

  <circle cx="60" cy="345" r="4" fill="#C50E72" />
  <text x="75" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Limpieza:</text>
  <text x="155" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Eliminar información irrelevante, normalizar el texto y garantizar un formato coherente</text>

  <circle cx="60" cy="380" r="4" fill="#C50E72" />
  <text x="75" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Equilibrio:</text>
  <text x="135" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Garantizar la representación de todos los temas para evitar sesgos</text>

  <circle cx="60" cy="415" r="4" fill="#C50E72" />
  <text x="75" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Gobernanza de datos:</text>
  <text x="180" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Registrar la procedencia, los permisos, la retención, las transformaciones y las rutas de eliminación</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
