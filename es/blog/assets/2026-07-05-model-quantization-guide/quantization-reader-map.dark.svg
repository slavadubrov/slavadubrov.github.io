<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Mapa de referencia de cuantización</title>
  <desc id="desc">Mapa de decisiones que dirige los cuellos de botella de serving hacia las opciones de cuantización y las comprobaciones de validación.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141D19" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="520" fill="#0C1210" />
  <text y="42" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#EDF5F0" x="480">Empieza por el cuello de botella</text>
  <text y="72" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#EDF5F0" x="480">El mismo número de bits puede ser adecuado o no según el hardware, el runtime, la caché y las evaluaciones.</text>

  <rect x="365" y="105" width="230" height="74" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text y="134" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#EDF5F0" x="480">¿Qué limita el serving?</text>
  <text y="160" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#EDF5F0" x="480"><tspan x="480">memoria, cómputo, caché, runtime o</tspan><tspan x="480" dy="1.2em">pipeline de imagen</tspan></text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="45" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="127">Memoria de los pesos</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="127">W4A16 GPTQ/AWQ</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="127" style="font-size: 11px;">decodificación, ajuste del modelo</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="127"><tspan x="127">diferencia de calidad</tspan><tspan x="127" dy="1.2em">en la evaluación</tspan></text>

    <rect x="230" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="312">Throughput</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="312">FP8 W8A8</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="312">kernels para Ada/Hopper</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="312">mide TTFT/ITL</text>

    <rect x="415" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="497">Contexto largo</text>
    <text y="292" text-anchor="middle" font-size="13" fill="#EDF5F0" x="497">KV cache</text>
    <text y="310" text-anchor="middle" font-size="13" fill="#EDF5F0" x="497">cuantización</text>
    <text y="332" text-anchor="middle" font-size="12" fill="#EDF5F0" x="497">la caché domina la VRAM</text>
    <text y="350" text-anchor="middle" font-size="12" fill="#EDF5F0" x="497">sondea la recuperación</text>

    <rect x="600" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="682">Runtime local</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="682">GGUF / MLX</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="682">CPU, Apple, edge</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="682">mide la RAM local</text>

    <rect x="785" y="240" width="130" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="850">Ruta de imagen</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="850">SVDQuant</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="850">VAE sensible</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="850">evaluaciones visuales</text>
  </g>

  <g stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 480 179 C 480 205 127 208 127 235" />
    <path d="M 480 179 C 480 207 312 211 312 235" />
    <path d="M 480 179 C 480 210 497 211 497 235" />
    <path d="M 480 179 C 480 207 682 211 682 235" />
    <path d="M 480 179 C 480 205 850 208 850 235" />
  </g>

  <rect x="190" y="405" width="580" height="62" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text y="430" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#EDF5F0" x="480">Después, ejecuta las comprobaciones de despliegue</text>
  <text y="455" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#EDF5F0" x="480" style="font-size: 11px;">perplejidad + métricas de tarea + muestras de generación + sondas de contexto largo + benchmarks de serving</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
