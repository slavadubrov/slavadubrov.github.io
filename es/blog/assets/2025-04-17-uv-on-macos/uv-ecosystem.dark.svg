<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uve-title uve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uve-title">Los cuatro límites del workflow de uv</title>
  <desc id="uve-desc">Un único ejecutable de uv gestiona cuatro ciclos de vida independientes: instalaciones de intérpretes, estado del proyecto, scripts autocontenidos y herramientas de línea de comandos aisladas. Homebrew y macOS siguen gestionando las aplicaciones del sistema y las bibliotecas nativas.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0C1210" />

  <text class="section" x="48" y="36">UN EJECUTABLE · CUATRO LÍMITES DE GESTIÓN</text>

  <rect x="336" y="56" width="288" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="356" y="80" fill="#FF6FB6">FOCO · RUNTIME</text>
  <text class="name" x="356" y="103" fill="#FF6FB6">Ejecutable de uv</text>

  <path class="edge" d="M480 118v24H254v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142h226v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142v142H254v24" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 284h226v24" marker-end="url(#uve-arrow)" />

  <rect class="store" x="48" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="210">PYTHON GESTIONADO · ALMACÉN</text>
  <text class="name" x="68" y="238">Instalaciones de intérpretes</text>
  <text class="note" x="68" y="258">directorio de datos · instalar, fijar, descubrir</text>

  <rect class="store" x="500" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="210">PROYECTO · ALMACÉN</text>
  <text class="name" x="520" y="238">Declaraciones, lock, entorno</text>
  <text class="note" x="520" y="258">ciclo de vida del repositorio · .venv local</text>

  <rect class="store" x="48" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="346">SCRIPT PEP 723 · ALMACÉN</text>
  <text class="name" x="68" y="374">Unidad de release de un solo archivo</text>
  <text class="note" x="68" y="394">metadatos inline · caché aislada</text>

  <rect class="store" x="500" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="346">HERRAMIENTA CLI · ALMACÉN</text>
  <text class="name" x="520" y="374">Comando efímero o instalado</text>
  <text class="note" x="520" y="394">caché de uvx · PATH solo si se elige</text>

  <path d="M48 438h24" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="84" y="443">Fuera de este límite: Homebrew y macOS gestionan las aplicaciones del sistema y las bibliotecas nativas.</text>

  <defs>
    <marker id="uve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
