<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="sgam-title sgam-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgam-title">Rutas de escritura y lectura en torno a un almacén de memoria de agentes guiado por esquema y limitado al tenant</title><desc id="sgam-desc">La ruta de escritura convierte un episodio sin procesar en un registro de memoria validado y vinculado a su procedencia, y es la única ruta autorizada para mutar el almacén SGAM compartido. La ruta de lectura limita una pregunta de usuario por tenant, sujeto, atributo y ventana de validez, consulta el mismo almacén y ensambla contexto actual o histórico con citas.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgam-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="sgam-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="720" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Un almacén SGAM, dos rutas</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La ruta de escritura confirma el estado; la ruta de lectura solo lo selecciona.</text>
<rect x="32" y="104" width="656" height="184" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">RUTA DE ESCRITURA — MUTA EL ESTADO</text>
<path d="M58 144h172a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 144h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="62" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXTERNO</text><text x="62" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF" style="font-size: 17.5px;">Episodio sin procesar</text>
<path d="M274 144h172a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M274 144h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="278" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESO</text><text x="278" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Extracción tipada</text>
<path d="M490 144h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M490 144h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="494" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESO</text><text x="494" y="204" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Validar +</text><text x="494" y="226" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">conciliar</text>
<path d="M240 180h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgam-arrow-flow)" />
<path d="M456 180h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgam-arrow-flow)" />
<text x="48" y="272" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Solo esta ruta puede crear, sustituir o cerrar un registro.</text>
<path d="M478 312h196a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-196a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M478 312h196a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-216a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="482" y="329.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ÁMBITO · ALMACÉN</text><text x="482" y="373" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Registros SGAM</text><text x="482" y="395" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="482">limitados al tenant,</tspan><tspan x="482" dy="1.2em">versionados</tspan></text>
<path d="M576 248v64" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgam-arrow-flow)" />
<rect x="32" y="456" width="656" height="174" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="482" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">RUTA DE LECTURA — SELECCIONA EL ESTADO</text>
<path d="M58 496h172a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 496h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="62" y="513.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXTERNO</text><text x="62" y="551" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Pregunta del usuario</text>
<path d="M274 496h172a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M274 496h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="278" y="513.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESO</text><text x="278" y="551" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Consulta limitada</text>
<path d="M526 496h148a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-148a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M526 496h148a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-168a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="530" y="513.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESO</text><text x="530" y="551" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17.5px;">Contexto con citas</text>
<path d="M240 532h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgam-arrow-flow)" />
<path d="M360 496v-24h160v-56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgam-arrow-flow)" /><rect x="386" y="460" width="108" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="440" y="476.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">consulta limitada</text>
<path d="M600 416v80" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgam-arrow-flow)" /><rect x="542.5" y="444" width="115" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="600" y="460.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 11.5px;">resultados con citas</text>
<text x="48" y="592" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El tenant, el tipo, el sujeto, el atributo y la ventana de validez se limitan</text>
<text x="48" y="614" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">antes de que la expansión vectorial o de grafos añada recuperación difusa.</text>
<path d="M32 662h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="688" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ambas rutas leen y escriben en el mismo almacén; solo la ruta de escritura puede mutarlo.</text>
</svg>
