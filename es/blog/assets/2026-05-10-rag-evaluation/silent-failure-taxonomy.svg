<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Silent failure taxonomy with the metric that catches each mode" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Taxonomía de fallos silenciosos con la métrica que detecta cada tipo</title>
  <defs>
    <filter id="shadowSF" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Taxonomía de fallos silenciosos</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">Cada tipo de fallo se empareja con la métrica que lo detecta. Sin la métrica, el bug es invisible.</text>

  <!-- Root -->
  <rect x="475" y="78" width="230" height="44" rx="22" fill="#dc2626" filter="url(#shadowSF)" />
  <text y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" x="590">Fallo silencioso (RAG)</text>

  <!-- Trunk: 4 main branches -->
  <line x1="540" y1="122" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="570" y1="122" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="610" y1="122" x2="730" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="640" y1="122" x2="1010" y2="170" stroke="#94a3b8" stroke-width="1.4" />

  <!-- ====== Branch A: Ingestion ====== -->
  <rect x="40" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="170">Fallos de ingesta</text>

  <!-- A1: Parse loss -->
  <rect x="40" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Pérdida al parsear</text>
  <text y="261" font-size="10" fill="#334155" x="50">las tablas colapsan · las notas al pie</text>
  <text y="275" font-size="10" fill="#334155" x="50">se pierden · OCR desordena los dígitos</text>
  <text y="285" font-size="9" font-style="italic" fill="#64748b" x="50">detectado por: CER/WER, TEDS</text>

  <!-- A2: Chunk break -->
  <rect x="40" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Ruptura de chunks</text>
  <text y="336" font-size="10" fill="#334155" x="50">el span de respuesta se divide entre dos</text>
  <text y="350" font-size="10" fill="#334155" x="50">chunks; ninguno contiene toda la evidencia</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="50">detectado por: contención del span de respuesta</text>

  <!-- A3: Dedup miss -->
  <rect x="40" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Error de deduplicación</text>
  <text y="411" font-size="10" fill="#334155" x="50">una falsa fusión corrompe la respuesta;</text>
  <text y="425" font-size="10" fill="#334155" x="50">conservar duplicados entierra el documento correcto</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="50">detectado por: precisión/exhaustividad de duplicados</text>

  <!-- A4: Normalization -->
  <rect x="40" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Deriva de normalización</text>
  <text y="486" font-size="10" fill="#334155" x="50">el desajuste NFC frente a NFKC rompe</text>
  <text y="500" font-size="10" fill="#334155" x="50">la resolución de alias por coincidencia exacta</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="50">detectado por: paridad NFC/NFKC, cobertura de alias</text>

  <!-- ====== Branch B: Embedding/Index ====== -->
  <rect x="320" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="450">Embeddings e índice</text>

  <!-- B1: Embedding miss -->
  <rect x="320" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Fallo del embedding</text>
  <text y="261" font-size="10" fill="#334155" x="330">el término de dominio queda fuera de la</text>
  <text y="275" font-size="10" fill="#334155" x="330">distribución de entrenamiento del modelo</text>
  <text y="285" font-size="9" font-style="italic" fill="#64748b" x="330">detectado por: Recall@k de dominio frente a baseline</text>

  <!-- B2: ANN drop -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Caída por aproximación ANN</text>
  <text y="336" font-size="10" fill="#334155" x="330">HNSW efSearch demasiado bajo; el vector gold</text>
  <text y="350" font-size="10" fill="#334155" x="330">existe, pero no se alcanza</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="330">detectado por: recall de ANN frente a flat</text>

  <!-- B3: Embedding drift -->
  <rect x="320" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Deriva de embeddings</text>
  <text y="411" font-size="10" fill="#334155" x="330">cambio de versión del modelo del proveedor;</text>
  <text y="425" font-size="10" fill="#334155" x="330">los vectores antiguos ya no están alineados</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="330">detectado por: estabilidad NN del probe set</text>

  <!-- B4: Stale index -->
  <rect x="320" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Índice obsoleto</text>
  <text y="486" font-size="10" fill="#334155" x="330">retraso de actualización; las consultas se ejecutan</text>
  <text y="500" font-size="10" fill="#334155" x="330">contra la realidad de la semana pasada</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="330">detectado por: retraso de actualización p99, % obsoleto</text>

  <!-- ====== Branch C: Online retrieval (HOT — silent killers) ====== -->
  <rect x="600" y="170" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="730">Retrieval online</text>

  <!-- C1: Filter exclude (highlighted) -->
  <rect x="600" y="225" width="260" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#991b1b" x="610">Exclusión falsa por filtro</text>
  <text y="261" font-size="10" fill="#334155" x="610">el predicado estricto descarta el documento gold;</text>
  <text y="275" font-size="10" fill="#334155" x="610">Recall@k cae, pero no se puede identificar la causa</text>
  <text y="285" font-size="9" font-style="italic" fill="#991b1b" x="610">detectado por: tasa de exclusión falsa del filtro</text>

  <!-- C2: Rerank miss -->
  <rect x="600" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#991b1b" x="610">Fallo del rerank</text>
  <text y="336" font-size="10" fill="#334155" x="610">el cross-encoder relega el documento correcto</text>
  <text y="350" font-size="10" fill="#334155" x="610">por detrás de distractores plausibles</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="610">detectado por: ΔnDCG, robustez ante distractores (RGB)</text>

  <!-- C3: Lost in middle -->
  <rect x="600" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#991b1b" x="610">Perdido en el centro</text>
  <text y="411" font-size="10" fill="#334155" x="610">el chunk gold está en el contexto, pero en la</text>
  <text y="425" font-size="10" fill="#334155" x="610">posición 7/10; el modelo lo ignora</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="610">detectado por: evaluación estratificada por posición</text>

  <!-- C4: Bad rewrite -->
  <rect x="600" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#991b1b" x="610">Regresión en la reescritura de consultas</text>
  <text y="486" font-size="10" fill="#334155" x="610">HyDE alucina una entidad que</text>
  <text y="500" font-size="10" fill="#334155" x="610">desvía el retrieval en la dirección equivocada</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="610">detectado por: ganancia/pérdida de la reescritura A/B</text>

  <!-- ====== Branch D: Generation/Citation ====== -->
  <rect x="880" y="170" width="260" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="1010">Generación</text>

  <!-- D1: Hallucination -->
  <rect x="880" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#5b21b6" x="890">Alucinación</text>
  <text y="261" font-size="10" fill="#334155" x="890">afirmación no respaldada, a menudo una</text>
  <text y="275" font-size="10" fill="#334155" x="890">entidad que no aparece en el contexto</text>
  <text y="285" font-size="9" font-style="italic" fill="#64748b" x="890">detectado por: faithfulness, HHEM, FActScore</text>

  <!-- D2: No citation -->
  <rect x="880" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#5b21b6" x="890">Teatro de las citas</text>
  <text y="336" font-size="10" fill="#334155" x="890">el span citado en realidad no</text>
  <text y="350" font-size="10" fill="#334155" x="890">respalda la afirmación cercana</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="890">detectado por: precisión/exhaustividad de citas (soporte TREC)</text>

  <!-- D3: Wrong refusal -->
  <rect x="880" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#5b21b6" x="890">Abstención incorrecta</text>
  <text y="411" font-size="10" fill="#334155" x="890">«No lo sé» cuando la respuesta</text>
  <text y="425" font-size="10" fill="#334155" x="890">está en el contexto (o al revés)</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="890">detectado por: NoMIRACL, precisión de abstención</text>

  <!-- D4: Schema break -->
  <rect x="880" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#5b21b6" x="890">Fallo de esquema/vocabulario</text>
  <text y="486" font-size="10" fill="#334155" x="890">la salida es sintácticamente válida, pero elige</text>
  <text y="500" font-size="10" fill="#334155" x="890">un ID de ontología incorrecto pero válido</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="890">detectado por: conformidad del vocabulario</text>

  <!-- Footer band -->
  <rect x="40" y="555" width="1100" height="68" rx="8" fill="#f0fdf4" stroke="#ea580c" stroke-width="1.2" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="590">Guía de lectura</text>
  <text y="598" text-anchor="middle" font-size="10" fill="#9a3412" x="590">Cada fallo es silencioso sin su métrica. La «corrección de la respuesta» estándar por sí sola indica que algo falla, pero no dónde.</text>
  <text y="614" text-anchor="middle" font-size="10" fill="#9a3412" x="590">La rama roja (exclusión por filtro, fallo del rerank, perdido en el centro, mala reescritura) es donde más daño causa RAG en producción. Instrumenta esa rama primero.</text>

  <!-- Visual cue: the 'red' propagation -->
  <rect x="40" y="640" width="1100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="662" font-size="11" font-weight="600" fill="#0f172a" x="60">La regla de propagación:</text>
  <text y="682" font-size="10" fill="#334155" x="60">Un fallo a la izquierda fija el techo de recall de todo lo que queda a la derecha. Un mal parseo limita el chunking. Un mal chunking limita el retrieval.</text>
  <text y="696" font-size="10" fill="#334155" x="60">Un mal retrieval limita el reranking. Un mal reranking limita la generación. Faithfulness solo mide el último eslabón: no puede ver la cadena rota.</text>
</svg>
