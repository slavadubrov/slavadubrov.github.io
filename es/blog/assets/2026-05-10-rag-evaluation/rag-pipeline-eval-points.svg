<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-pipeline-title rag-pipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="rag-pipeline-title">El pipeline de RAG y las métricas que diagnostican cada etapa</title>
  <desc id="rag-pipeline-desc">Tres carriles agrupados del pipeline vinculan la ingesta, el tiempo de consulta y la generación de respuestas con sus conjuntos de métricas diagnósticas. Las métricas de consulta se destacan porque la reescritura y el filtrado pueden eliminar evidencias antes del ranking.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="rag-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">PIPELINE DE RAG · MÉTRICAS POR ETAPA</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Añade una métrica diagnóstica junto a cada etapa</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Los gates end-to-end deciden el lanzamiento; las métricas por etapa explican el fallo.</text>

  <rect x="48" y="136" width="400" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="68" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESO · RUTA DE INGESTA</text>
  <text x="68" y="196" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Analizar → limpiar → dividir en chunks → enriquecer</text>
  <text x="68" y="218" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Generar embeddings → indexar</text>
  <path d="M448 184H504" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="136" width="400" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="532" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · EVALUACIONES DE INGESTA</text>
  <text x="532" y="196" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">CER/WER · TEDS · F1 de entidades</text>
  <text x="532" y="218" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall de ANN · latencia de actualización</text>

  <path d="M248 232V264" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="48" y="272" width="400" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="68" y="304" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESO · RUTA DE CONSULTA</text>
  <text x="68" y="332" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Reescribir → filtrar → recuperar</text>
  <text x="68" y="354" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Rerank → ensamblar el contexto</text>
  <path d="M448 320H504" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="272" width="400" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text x="532" y="304" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCO · EVALUACIONES DE CONSULTA</text>
  <text x="532" y="332" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k · tasa de exclusión errónea</text>
  <text x="532" y="354" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">ΔnDCG · utilización del contexto</text>

  <path d="M248 368V400" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="48" y="408" width="400" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="68" y="440" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESO · RUTA DE RESPUESTA</text>
  <text x="68" y="468" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Generar → verificar afirmaciones → citar</text>
  <text x="68" y="490" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Devolver → observar el tráfico</text>
  <path d="M448 456H504" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="408" width="400" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="532" y="440" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · EVALUACIONES DE RESPUESTA</text>
  <text x="532" y="468" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Fidelidad · P/R de citas</text>
  <text x="532" y="490" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Drift · coste/consulta · p95</text>

  <path d="M48 544H912" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="48" y="574" fill="#59645e" font-size="13">Una etapa sin métrica puede fallar silenciosamente mientras el sistema sigue devolviendo una respuesta.</text>
</svg>
