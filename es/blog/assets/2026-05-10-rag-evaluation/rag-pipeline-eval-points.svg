<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="Inter, system-ui, sans-serif" role="img" aria-label="A production RAG pipeline showing ingestion, query-time, and answer or production checks, with hard filters applied before retrieval ranking" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Pipeline completo de RAG con indicadores de métricas en cada etapa</title>
  <defs>
    <marker id="arrEval" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b" />
    </marker>
    <filter id="shadowEval" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="760" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">El pipeline de RAG con puntos de evaluación</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#64748b" x="590">Cada etapa tiene una métrica. La métrica detecta el fallo silencioso.</text>

  <!-- ============ OFFLINE LANE ============ -->
  <rect x="20" y="78" width="1140" height="290" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="102" font-size="14" font-weight="700" fill="#1d4ed8" x="40">Ruta de ingesta · corpus e índice</text>
  <text y="118" font-size="11" fill="#64748b" x="40">Se ejecuta cuando cambia la versión del corpus. Fija el techo de evidencia.</text>

  <!-- Stage 1: Acquire / Parse -->
  <rect x="40" y="140" width="170" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8" x="125">Adquirir y parsear</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="125">PDF · HTML · OCR</text>
  <text y="192" text-anchor="middle" font-size="11" fill="#64748b" x="125">Tablas · diseño</text>

  <!-- Metric badge 1 -->
  <rect x="40" y="212" width="170" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="125">CER · WER · TEDS</text>
  <text y="242" text-anchor="middle" font-size="11" fill="#9a3412" x="125">tasa de éxito del parseo</text>
  <text y="255" text-anchor="middle" font-size="11" fill="#9a3412" x="125">fidelidad del diseño</text>

  <!-- Arrow -->
  <line x1="210" y1="171" x2="245" y2="171" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 2: Normalize / Dedup -->
  <rect x="245" y="140" width="170" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8" x="330">Normalizar y deduplicar</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="330">NFC/NFKC · MinHash</text>
  <text y="192" text-anchor="middle" font-size="11" fill="#64748b" x="330">PII · boilerplate</text>

  <rect x="245" y="212" width="170" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="330">recall/precision de duplicados</text>
  <text y="242" text-anchor="middle" font-size="11" fill="#9a3412" x="330">recall de PII (por tipo)</text>
  <text y="255" text-anchor="middle" font-size="11" fill="#9a3412" x="330">F1 de detección de idioma</text>

  <line x1="415" y1="171" x2="450" y2="171" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 3: Chunk -->
  <rect x="450" y="140" width="170" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8" x="535">Fragmentar</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="535">recursivo · semántico</text>
  <text y="192" text-anchor="middle" font-size="11" fill="#64748b" x="535">estructural · tardío</text>

  <rect x="450" y="212" width="170" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="535">contención del tramo de respuesta</text>
  <text y="242" text-anchor="middle" font-size="11" fill="#9a3412" x="535">tasa de ruptura de límites</text>
  <text y="255" text-anchor="middle" font-size="11" fill="#9a3412" x="535">Recall@k frente al tamaño</text>

  <line x1="620" y1="171" x2="655" y2="171" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 4: Enrich (NER/EL) -->
  <rect x="655" y="140" width="170" height="62" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6" x="740">Enriquecer</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="740">NER · enlace de entidades</text>
  <text y="192" text-anchor="middle" font-size="11" fill="#64748b" x="740">etiquetas · jerarquía</text>

  <rect x="655" y="212" width="170" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="740">F1 de EL · precision de NIL</text>
  <text y="242" text-anchor="middle" font-size="11" fill="#9a3412" x="740">F1 jerárquico</text>
  <text y="255" text-anchor="middle" font-size="11" fill="#9a3412" x="740">cobertura de alias</text>

  <line x1="825" y1="171" x2="860" y2="171" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 5: Embed -->
  <rect x="860" y="140" width="135" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8" x="927">Generar embeddings</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="927">densos / dispersos</text>
  <text y="192" text-anchor="middle" font-size="11" fill="#64748b" x="927">multi-vector</text>

  <rect x="860" y="212" width="135" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="927">nDCG@10 de dominio</text>
  <text y="242" text-anchor="middle" font-size="11" fill="#9a3412" x="927">deriva (KL · NN-stab.)</text>
  <text y="255" text-anchor="middle" font-size="11" fill="#9a3412" x="927">frente a BEIR/MTEB</text>

  <line x1="995" y1="171" x2="1030" y2="171" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 6: Index -->
  <rect x="1030" y="140" width="115" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8" x="1087">Indexar</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="1087">HNSW / IVF</text>
  <text y="192" text-anchor="middle" font-size="11" fill="#64748b" x="1087">BM25 · híbrido</text>

  <rect x="1030" y="212" width="115" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="1087">recall de ANN frente a flat</text>
  <text y="242" text-anchor="middle" font-size="11" fill="#9a3412" x="1087">retraso de actualización p99</text>
  <text y="255" text-anchor="middle" font-size="11" fill="#9a3412" x="1087">latencia de búsqueda filtrada</text>

  <!-- Lane summary -->
  <rect x="40" y="290" width="1105" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
  <text y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8" x="592">La preparación para la ingesta fija el límite superior. Si un fragmento pierde aquí el tramo de respuesta, ningún reranker lo recupera después.</text>
  <text y="332" text-anchor="middle" font-size="11" fill="#1d4ed8" x="592">Instrumenta el parseo, la normalización, la fragmentación, el enriquecimiento, el embedding y la indexación para poder atribuir un fallo posterior.</text>

  <!-- ============ ONLINE LANE ============ -->
  <rect x="20" y="378" width="1140" height="280" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="402" font-size="14" font-weight="700" fill="#9a3412" x="40">Ruta en tiempo de consulta · ejecución por consulta</text>
  <text y="418" font-size="11" fill="#64748b" x="40">La ruta de solicitud se ejecuta en cada consulta; las métricas de calidad costosas pueden puntuar trazas muestreadas de forma asíncrona.</text>

  <!-- Stage 7: Query Rewrite -->
  <rect x="40" y="440" width="160" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412" x="120">Reescribir / enrutar</text>
  <text y="478" text-anchor="middle" font-size="11" fill="#64748b" x="120">HyDE · multi-query</text>
  <text y="492" text-anchor="middle" font-size="11" fill="#64748b" x="120">intención · adaptativo</text>

  <rect x="40" y="512" width="160" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="120">incremento de Recall@k</text>
  <text y="542" text-anchor="middle" font-size="11" fill="#9a3412" x="120">precisión del enrutamiento</text>
  <text y="555" text-anchor="middle" font-size="11" fill="#9a3412" x="120">tasa de no-op</text>

  <line x1="200" y1="471" x2="235" y2="471" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 8: Apply hard filters before ranking -->
  <rect x="235" y="440" width="160" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowEval)" />
  <text y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" x="315">Aplicar filtros estrictos</text>
  <text y="478" text-anchor="middle" font-size="11" fill="#64748b" x="315">tenant · ACL · etiqueta</text>
  <text y="492" text-anchor="middle" font-size="11" fill="#64748b" x="315">estricto frente a flexible</text>

  <rect x="235" y="512" width="160" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
  <text y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" x="315">tasa de exclusión errónea del filtro</text>
  <text y="542" text-anchor="middle" font-size="11" fill="#991b1b" x="315">precision/recall del predicado</text>
  <text y="555" text-anchor="middle" font-size="11" fill="#991b1b" x="315">Δ de recuperación en shadow</text>

  <line x1="395" y1="471" x2="430" y2="471" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 9: Retrieve from the eligible candidate set -->
  <rect x="430" y="440" width="160" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412" x="510">Recuperar</text>
  <text y="478" text-anchor="middle" font-size="11" fill="#64748b" x="510">denso + disperso + RRF</text>
  <text y="492" text-anchor="middle" font-size="11" fill="#64748b" x="510">conjunto de candidatos aptos</text>

  <rect x="430" y="512" width="160" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="510">Recall@k · MRR · nDCG</text>
  <text y="542" text-anchor="middle" font-size="11" fill="#9a3412" x="510">precision/recall del contexto</text>
  <text y="555" text-anchor="middle" font-size="11" fill="#9a3412" x="510">incremento del híbrido</text>

  <line x1="590" y1="471" x2="625" y2="471" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 10: Rerank -->
  <rect x="625" y="440" width="160" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412" x="705">Reordenar</text>
  <text y="478" text-anchor="middle" font-size="11" fill="#64748b" x="705">cross-encoder · listwise</text>
  <text y="492" text-anchor="middle" font-size="11" fill="#64748b" x="705">BGE · Cohere · ZeRank</text>

  <rect x="625" y="512" width="160" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="705">ΔnDCG · ΔMRR · ΔP@1</text>
  <text y="542" text-anchor="middle" font-size="11" fill="#9a3412" x="705">robustez frente a distractores</text>
  <text y="555" text-anchor="middle" font-size="11" fill="#9a3412" x="705">latencia p95</text>

  <line x1="785" y1="471" x2="820" y2="471" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 11: Assemble -->
  <rect x="820" y="440" width="160" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412" x="900">Ensamblar contexto</text>
  <text y="478" text-anchor="middle" font-size="11" fill="#64748b" x="900">ordenar · comprimir</text>
  <text y="492" text-anchor="middle" font-size="11" fill="#64748b" x="900">presupuesto de tokens</text>

  <rect x="820" y="512" width="160" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="900">utilización del contexto</text>
  <text y="542" text-anchor="middle" font-size="11" fill="#9a3412" x="900">lost-in-the-middle</text>
  <text y="555" text-anchor="middle" font-size="11" fill="#9a3412" x="900">compresión × corrección</text>

  <line x1="980" y1="471" x2="1015" y2="471" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrEval)" />

  <!-- Stage 12: Generate -->
  <rect x="1015" y="440" width="130" height="62" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowEval)" />
  <text y="462" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6" x="1080">Generar</text>
  <text y="478" text-anchor="middle" font-size="11" fill="#64748b" x="1080">llamada al LLM</text>
  <text y="492" text-anchor="middle" font-size="11" fill="#64748b" x="1080">+ citas</text>

  <rect x="1015" y="512" width="130" height="48" rx="6" fill="#f0fdf4" stroke="#ea580c" stroke-width="1" />
  <text y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412" x="1080">fidelidad · HHEM</text>
  <text y="542" text-anchor="middle" font-size="11" fill="#9a3412" x="1080">P/R de citas</text>
  <text y="555" text-anchor="middle" font-size="11" fill="#9a3412" x="1080">FActScore</text>

  <!-- Lane summary -->
  <rect x="40" y="582" width="1105" height="58" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1" />
  <text y="604" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412" x="592">Una reescritura o un filtro estricto incorrectos pueden eliminar el documento gold antes del ranking. La fidelidad aún puede aprobar la negativa fundamentada.</text>
  <text y="624" text-anchor="middle" font-size="11" fill="#9a3412" x="592">Recall@k detecta el fallo; la tasa de exclusión errónea del filtro lo atribuye al predicado y no al retriever.</text>

  <!-- ============ POST-GEN LANE ============ -->
  <rect x="20" y="668" width="1140" height="78" rx="10" fill="#f0fdf4" stroke="#166534" stroke-width="1" />
  <text y="692" font-size="14" font-weight="700" fill="#166534" x="40">Comprobaciones de respuesta y producción · verificación y telemetría</text>

  <rect x="40" y="704" width="220" height="32" rx="6" fill="#ffffff" stroke="#166534" stroke-width="1.2" />
  <text y="724" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" x="150">verificación de afirmaciones · NLI</text>

  <rect x="270" y="704" width="220" height="32" rx="6" fill="#ffffff" stroke="#166534" stroke-width="1.2" />
  <text y="724" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" x="380">validez del esquema · grounding</text>

  <rect x="500" y="704" width="220" height="32" rx="6" fill="#ffffff" stroke="#166534" stroke-width="1.2" />
  <text y="724" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" x="610">regeneración · valoraciones · permanencia</text>

  <rect x="730" y="704" width="220" height="32" rx="6" fill="#ffffff" stroke="#166534" stroke-width="1.2" />
  <text y="724" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" x="840">deriva · coste/consulta · p95</text>

  <rect x="960" y="704" width="185" height="32" rx="6" fill="#ffffff" stroke="#166534" stroke-width="1.2" />
  <text y="724" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" x="1052">evaluación en shadow · human-in-the-loop</text>
</svg>
