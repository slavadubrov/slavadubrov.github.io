<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eval-layers-title eval-layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="eval-layers-title">Tres puntos donde un sistema RAG puede perder evidencia</title>
  <desc id="eval-layers-desc">El diagrama sigue la evidencia a través del corpus y el índice, la ruta de retrieval y las respuestas y el tráfico en producción. Cada capa tiene métricas de diagnóstico y se evalúa tanto offline como online. Se destaca la ruta de retrieval porque los filtros pueden eliminar silenciosamente el documento gold.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="eval-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">RUTA DE EVIDENCIA · TRES CAPAS DE EVALUACIÓN</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Localiza el primer punto donde desaparece la evidencia</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Una métrica downstream no puede explicar una pérdida upstream.</text>

  <rect x="48" y="136" width="256" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="68" y="170" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · INGESTA</text>
  <text x="68" y="200" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Corpus e índice</text>
  <path d="M304 184H344" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#eval-layers-arrow)" />
  <rect x="352" y="136" width="256" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text x="372" y="170" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCO · TIEMPO DE CONSULTA</text>
  <text x="372" y="200" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Ruta de retrieval</text>
  <path d="M608 184H648" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#eval-layers-arrow)" />
  <rect x="656" y="136" width="256" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="676" y="170" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESAMIENTO · RESPUESTA</text>
  <text x="676" y="200" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Respuesta y tráfico en producción</text>

  <path d="M48 264H304" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="48" y="288" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNÓSTICO</text>
  <text x="48" y="314" fill="#59645e" font-size="13">CER/WER · TEDS · frescura</text>
  <text x="48" y="334" fill="#59645e" font-size="13">Recall de ANN frente a búsqueda exacta</text>
  <path d="M352 264H608" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="352" y="288" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNÓSTICO</text>
  <text x="352" y="314" fill="#59645e" font-size="13">Recall@k · tasa de exclusión falsa</text>
  <text x="352" y="334" fill="#59645e" font-size="13">ΔnDCG · utilización del contexto</text>
  <path d="M656 264H912" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="656" y="288" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNÓSTICO</text>
  <text x="656" y="314" fill="#59645e" font-size="13">Fidelidad · respaldo de citas</text>
  <text x="656" y="334" fill="#59645e" font-size="13">Drift · latencia · coste</text>

  <path d="M48 370H912" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="48" y="398" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">EJECUTA TODAS LAS CAPAS EN AMBOS MODOS</text>
  <rect x="48" y="418" width="408" height="62" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="68" y="444" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO · OFFLINE</text>
  <text x="68" y="468" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Golden set · comparación · CI gate</text>
  <rect x="504" y="418" width="408" height="62" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="524" y="444" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO · ONLINE</text>
  <text x="524" y="468" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Muestras en producción · señales de usuario · drift</text>
</svg>
