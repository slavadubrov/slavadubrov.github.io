<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="silent-failure-title silent-failure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="silent-failure-title">Fallos silenciosos de RAG y la métrica que identifica cada origen</title>
  <desc id="silent-failure-desc">La evidencia pasa del corpus de origen por el conjunto de candidatos elegibles y el contexto ordenado hasta llegar a la respuesta respaldada. Cada etapa apunta a una métrica de diagnóstico. El conjunto de candidatos elegibles está resaltado porque un filtro estricto puede eliminar el documento gold antes de la recuperación.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="silent-failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
  <rect width="960" height="568" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">FALLO SILENCIOSO · DEL ORIGEN A LA MÉTRICA</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Encuentra la etapa que eliminó la evidencia</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">El primer enlace roto limita todas las puntuaciones a su derecha.</text>

  <rect x="48" y="136" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="64" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · ORIGEN</text>
  <text x="64" y="198" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" style="font-size: 16.5px;">Artefactos del corpus</text>
  <text x="64" y="218" fill="#a8b8af" font-size="13" style="font-size: 11.5px;">parseo · chunking · indexación</text>
  <path d="M232 184H264" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="136" width="184" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="288" y="168" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ENFOQUE · FILTRO</text>
  <text x="288" y="198" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" style="font-size: 16px;">Documentos elegibles</text>
  <text x="288" y="218" fill="#a8b8af" font-size="13" style="font-size: 11px;">el documento gold puede eliminarse</text>
  <path d="M456 184H488" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="136" width="184" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="512" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESAMIENTO · RERANKER</text>
  <text x="512" y="198" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Contexto ordenado</text>
  <text x="512" y="218" fill="#a8b8af" font-size="13" style="font-size: 11px;">pérdida de posición · pérdida intermedia</text>
  <path d="M680 184H712" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="136" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="736" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESAMIENTO · GENERADOR</text>
  <text x="736" y="198" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" style="font-size: 16.5px;">Respuesta respaldada</text>
  <text x="736" y="218" fill="#a8b8af" font-size="13">afirmaciones · citas</text>

  <path d="M140 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="48" y="336" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="64" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · MÉTRICA</text>
  <text x="64" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">CER/WER · TEDS</text>
  <text x="64" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" style="font-size: 14.5px;">recall de ANN · frescura</text>
  <path d="M364 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="336" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="288" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · MÉTRICA</text>
  <text x="288" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recall@k</text>
  <text x="288" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" style="font-size: 12px;">Tasa de exclusión incorrecta</text>
  <path d="M588 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="336" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="512" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · MÉTRICA</text>
  <text x="512" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ΔnDCG · distractores</text>
  <text x="512" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Prueba de posición</text>
  <path d="M816 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="336" width="192" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="736" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ALMACENAMIENTO · MÉTRICA</text>
  <text x="736" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Fidelidad</text>
  <text x="736" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Precisión/recall de citas</text>

  <path d="M48 472H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="502" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k detecta el documento gold que falta.</text>
  <text x="48" y="528" fill="#a8b8af" font-size="13">La tasa de exclusión incorrecta identifica el predicado del filtro como causa; la fidelidad no puede hacerlo.</text>
  <rect x="42" y="262" width="352" height="20" fill="#0C1210" />
  <text x="48" y="276" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">LA MÉTRICA QUE ATRIBUYE CADA FALLO</text>
</svg>
