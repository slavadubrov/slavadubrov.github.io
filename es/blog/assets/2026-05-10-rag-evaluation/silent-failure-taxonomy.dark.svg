<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="silentfailure-title silentfailure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="silentfailure-title">Un flujo de cuatro etapas atribuye cada fallo silencioso a la métrica que lo identifica.</title><desc id="silentfailure-desc">La evidencia avanza desde el corpus de origen, pasando por el conjunto de documentos elegibles y el contexto ordenado, hasta la respuesta generada. El conjunto de documentos elegibles es el foco, porque un filtro estricto puede eliminar el documento gold antes del ranking. Cada etapa se vincula a la métrica que detecta un fallo en ella: métricas de parsing, Recall@k y la tasa de exclusión errónea, métricas de posición y distractores, y faithfulness con precisión y recall de las citas.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="silentfailure-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="silentfailure-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="520" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Encuentra la etapa que eliminó la evidencia</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El primer enlace roto limita todas las puntuaciones a su derecha.</text>
