<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="owaspasi-title owaspasi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="owaspasi-title">Las categorías OWASP ASI ayudan a asignar amenazas a controles de texto, identidad, ejecución y cadena de suministro.</title><desc id="owaspasi-desc">El secuestro de objetivos y el envenenamiento de memoria muestran dónde puede contribuir el filtrado de texto. Las categorías se solapan y requieren controles complementarios de identidad, ejecución, orquestación y cadena de suministro.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="owaspasi-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="owaspasi-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="920" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Asignar amenazas a controles aplicables</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Las categorías se solapan; esto es una lista de comprobación de cobertura, no una clasificación de</tspan><tspan x="32" dy="1.2em">incidentes.</tspan></text>
<rect x="32" y="128" width="656" height="184" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="154" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">EL FILTRADO DE TEXTO PUEDE CONTRIBUIR</text>
<path d="M58 192h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 192h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ASI01</text><text x="62" y="253" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Secuestro de objetivos del agente</text><text x="62" y="275" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">redirección de instrucciones</text>
<path d="M378 192h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M378 192h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="382" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ASI06</text><text x="382" y="253" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Envenenamiento de memoria</text><text x="382" y="275" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">RAG y contexto persistente</text>
<rect x="32" y="344" width="656" height="304" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="372" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">AMENAZAS Y CONTROLES ADICIONALES</text>
<path d="M58 408h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 408h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ASI02 + ASI05</text><text x="62" y="469" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Uso indebido de herramientas</text><text x="62" y="491" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ejecución inesperada de código</text>
<path d="M378 408h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M378 408h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="382" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ASI03 + ASI07</text><text x="382" y="469" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Abuso de identidad</text><text x="382" y="491" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">canales de agente inseguros</text>
<path d="M58 528h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 528h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="545.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ASI04 + ASI08</text><text x="62" y="589" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Cadena de suministro</text><text x="62" y="611" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">fallos en cascada de agentes</text>
<path d="M378 528h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M378 528h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="382" y="545.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ASI09 + ASI10</text><text x="382" y="589" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Confianza humana</text><text x="382" y="611" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">agentes maliciosos, deriva de objetivos</text>
<path d="M42 680h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 680h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="697.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ENFOQUE · QUÉ CUBRE ESTE ARTÍCULO</text><text x="46" y="741" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Toda ruta de ataque necesita controles aplicables</text><text x="46" y="763" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">identidad, política de herramientas, sandboxing, cadena de suministro, monitorización</text>
<path d="M32 824h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="850" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El Top 10 de OWASP ASI para 2026, publicado el 9 de diciembre de 2025.</text>
<text x="32" y="872" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">El filtrado de texto puede contribuir; ninguna categoría corresponde exclusivamente a un filtro de</tspan><tspan x="32" dy="1.2em">contenido.</tspan></text>
</svg>
