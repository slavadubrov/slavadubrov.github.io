<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asi-title asi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asi-title">OWASP ASI Top 10 agrupado por el límite de control que requiere</title>
  <desc id="asi-desc">El secuestro del objetivo y el envenenamiento de la memoria son las dos categorías en las que los filtros de contenido pueden contribuir. Las otras ocho requieren controles de sistema para herramientas, ejecución, identidad, comunicación, cadena de suministro, fallos en cascada, confianza humana y agentes rogue.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#F7F7F4" />

  <rect x="48" y="56" width="280" height="424" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="72" y="88">ADYACENTE AL CONTENIDO · 2 DE 10</text>
  <text class="note" x="72" y="112">Los filtros pueden contribuir aquí.</text>

  <rect x="72" y="144" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="92" y="176">ASI01</text>
  <text class="name" x="92" y="204">Secuestro del objetivo del agente</text>
  <text class="note" x="92" y="224">redirección de instrucciones</text>

  <rect x="72" y="280" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="92" y="312">ASI06</text>
  <text class="name" x="92" y="340">Envenenamiento de la memoria</text>
  <text class="note" x="92" y="360">RAG y contexto persistente</text>

  <text class="note" x="72" y="432">Aun así, requiere autorización y</text>
  <text class="note" x="72" y="452">aplicación de controles en el runtime.</text>

  <rect x="368" y="56" width="544" height="424" rx="12" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="392" y="88" fill="#C50E72">FOCO · CONTROLES DE SISTEMA · 8 DE 10</text>
  <text class="note" x="392" y="112" fill="#C50E72">Controles de identidad, políticas, aislamiento, monitorización y cadena de suministro.</text>

  <rect class="box" x="392" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="176">ASI02 + ASI05</text>
  <text class="name" x="412" y="204">Uso indebido de herramientas</text>
  <text class="note" x="412" y="224">ejecución inesperada de código</text>

  <rect class="box" x="656" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="176">ASI03 + ASI07</text>
  <text class="name" x="676" y="204">Abuso de identidad</text>
  <text class="note" x="676" y="224">canales de agentes inseguros</text>

  <rect class="box" x="392" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="312">ASI04 + ASI08</text>
  <text class="name" x="412" y="340">Cadena de suministro</text>
  <text class="note" x="412" y="360">fallos en cascada de agentes</text>

  <rect class="box" x="656" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="312">ASI09 + ASI10</text>
  <text class="name" x="676" y="340">Confianza humana</text>
  <text class="note" x="676" y="360">agentes rogue y deriva del objetivo</text>

  <text class="note" x="392" y="432">Estas clases de fallos quedan fuera de un único</text>
  <text class="note" x="392" y="452">límite de entrada o salida del modelo.</text>

  <text class="note" x="48" y="528">OWASP Agentic Security Initiative Top 10 para 2026 · publicado el 9 de diciembre de 2025</text>
</svg>
