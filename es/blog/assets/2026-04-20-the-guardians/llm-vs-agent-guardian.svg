<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="lvag-title lvag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="lvag-title">Un filtro de contenido envuelve una llamada al modelo; un harness autoriza cada acción del tool loop.</title><desc id="lvag-desc">Dos flujos apilados comparan el alcance. El flujo del filtro de contenido inspecciona el texto antes y después de una única llamada al modelo: comprueba la entrada, deja que el modelo genere una completion y después comprueba la salida. El flujo del harness cubre todo el tool loop: el modelo propone un tool call, el harness autoriza esa acción concreta, el runtime la ejecuta y devuelve evidencias, y esas evidencias alimentan la siguiente llamada propuesta.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="lvag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="lvag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="1000" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un filtro de contenido frente a un harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Uno observa el texto alrededor de una única llamada al modelo.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El otro autoriza cada acción del loop.</text>
<rect x="32" y="128" width="656" height="360" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">FILTRO DE CONTENIDO · UNA LLAMADA AL MODELO</text>
<path d="M58 192h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 192h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GUARDRAIL · ANTES</text><text x="62" y="247" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Inspeccionar el texto de entrada</text>
<path d="M58 296h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 296h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="313.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODELO</text><text x="62" y="351" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Generar una completion</text>
<path d="M58 400h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 400h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GUARDRAIL · DESPUÉS</text><text x="62" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Inspeccionar el texto de salida</text>
<path d="M288 264v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<path d="M288 368v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<rect x="32" y="520" width="656" height="360" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="548" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">HARNESS · TODO EL TOOL LOOP</text>
<path d="M58 584h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 584h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="601.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODELO</text><text x="62" y="639" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Proponer un tool call</text>
<path d="M58 688h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M58 688h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="62" y="705.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCO · HARNESS</text><text x="62" y="743" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Autorizar esta acción</text>
<path d="M58 792h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 792h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="809.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">RUNTIME</text><text x="62" y="847" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Ejecutar y devolver evidencias</text>
<path d="M288 656v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<path d="M288 760v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<path d="M528 828h60v-208h-60" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#lvag-arrow-flow)" /><rect x="545" y="712" width="86" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="588" y="728.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 12px;">siguiente paso</text>
<path d="M32 920h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="946" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un filtro de contenido evalúa un único intercambio de texto.</text>
<text x="32" y="968" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El harness evalúa —y puede bloquear— cada acción a la que conduce ese intercambio.</text>
</svg>
