<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="peo-title peo-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="peo-title">Orden de evaluación de permisos de Claude Code</title>
  <desc id="peo-desc">Claude Code comprueba las reglas deny, ask y allow, en ese orden, y decide la primera coincidencia. Un hook de PreToolUse puede bloquear antes del prompt de permisos, pero no puede omitir una regla deny o ask. Las llamadas sin coincidencias usan el modo de permisos activo. El callback canUseTool del Agent SDK es una vía independiente para solicitudes no resueltas.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="600" rx="14" fill="#F7F7F4" />

  <rect x="48" y="56" width="600" height="464" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="section" x="72" y="88">CLI DE CLAUDE CODE</text>
  <text class="note" x="72" y="110">Las reglas tienen prioridad; el orden de configuración no la modifica.</text>

  <rect class="box" x="72" y="136" width="240" height="62" rx="10" />
  <text class="kind" x="92" y="160">SOLICITUD</text>
  <text class="name" x="92" y="184">tool call propuesta</text>

  <rect x="72" y="238" width="240" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="92" y="272" fill="#C50E72">FOCO · REGLAS</text>
  <text class="name" x="92" y="300" fill="#C50E72">deny → ask → allow</text>
  <text class="note" x="92" y="320" fill="#C50E72">gana la primera regla coincidente</text>

  <path d="M432 238 512 286 432 334 352 286Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="432" y="281" text-anchor="middle">regla</text>
  <text class="name" x="432" y="301" text-anchor="middle">¿coincide?</text>

  <rect class="box" x="72" y="406" width="240" height="62" rx="10" />
  <text class="kind" x="92" y="430">SIN COINCIDENCIA · MODO</text>
  <text class="name" x="92" y="454">Resolver según el modo activo</text>

  <rect x="368" y="406" width="240" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="388" y="430">PRIMERA COINCIDENCIA · RESULTADO</text>
  <text class="name" x="388" y="454">Bloquear · mostrar prompt · ejecutar</text>

  <path class="edge" d="M192 198v32" marker-end="url(#peo-arrow)" />
  <path class="edge" d="M312 286h32" marker-end="url(#peo-arrow)" />
  <path class="edge" d="M432 334v56a16 16 0 0 0 16 16h40" marker-end="url(#peo-arrow)" />
  <rect x="444" y="354" width="64" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="476" y="371" text-anchor="middle">sí</text>
  <path class="edge" d="M352 286h-24a16 16 0 0 0-16 16v104" stroke-dasharray="7 6" marker-end="url(#peo-arrow)" />
  <rect x="288" y="346" width="64" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="320" y="363" text-anchor="middle">no</text>

  <path d="M336 168h248" fill="none" stroke="#D8DDD9" stroke-width="1.5" />
  <text class="kind" x="352" y="154">HOOK DE PRETOOLUSE</text>
  <text class="note" x="352" y="184">Se ejecuta antes del prompt y puede bloquear.</text>
  <text class="note" x="352" y="204">Nunca omite una coincidencia deny o ask.</text>

  <rect x="688" y="56" width="224" height="464" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="section" x="712" y="88">AGENT SDK</text>
  <text class="note" x="712" y="110">Vía de callback independiente</text>

  <rect x="712" y="168" width="176" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="732" y="202">NO RESUELTA</text>
  <text class="name" x="732" y="230" fill="#59645E">Solicitud de tool</text>
  <text class="note" x="732" y="250">Solo vía SDK</text>

  <rect x="712" y="336" width="176" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="732" y="370">CALLBACK</text>
  <text class="name" x="732" y="398" fill="#59645E">canUseTool</text>
  <text class="note" x="732" y="418">aprobar o denegar</text>

  <path class="edge" d="M800 264v64" stroke-dasharray="7 6" marker-end="url(#peo-arrow)" />

  <text class="note" x="48" y="568">Un hook puede añadir un bloqueo. No puede convertir una llamada denegada o que requiere prompt en una llamada permitida.</text>

  <defs>
    <marker id="peo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
