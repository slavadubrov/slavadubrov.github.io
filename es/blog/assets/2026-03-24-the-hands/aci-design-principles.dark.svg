<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="acid-title acid-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="acid-title">Cuatro principios para una interfaz agente-ordenador</title>
  <desc id="acid-desc">Diseña la acción, hazla compacta, devuelve feedback conciso y valida antes de que los errores se propaguen. Un fallo de validación devuelve evidencias al diseño de la acción. La validación es el punto de control destacado.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="344" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="40">ACI LOOP — HAZ QUE LA SIGUIENTE ACCIÓN SEA FÁCIL DE ELEGIR Y DE CORREGIR</text>
  <circle cx="62" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="77" text-anchor="middle">1</text>
  <circle cx="286" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="77" text-anchor="middle">2</text>
  <circle cx="510" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="77" text-anchor="middle">3</text>
  <circle cx="734" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="77" text-anchor="middle">4</text>
  <rect class="box" x="48" y="88" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="120">ACCIÓN</text><text class="name" x="68" y="148">Acciones simples</text>
  <rect class="box" x="272" y="88" width="188" height="96" rx="10" />
  <text class="kind" x="292" y="120">EFICIENCIA</text><text class="name" x="292" y="148">tool calls compactos</text>
  <rect class="box" x="496" y="88" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="120">FEEDBACK</text><text class="name" x="516" y="148">Resultados concisos</text>
  <rect x="720" y="88" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="740" y="120" fill="#FF6FB6">FOCO · VALIDACIÓN</text><text class="name" x="740" y="148" fill="#FF6FB6">Detén los estados incorrectos</text>
  <path class="edge" d="M236 136H264" marker-end="url(#acid-arrow)" />
  <path class="edge" d="M460 136H488" marker-end="url(#acid-arrow)" />
  <path class="edge" d="M684 136H712" marker-end="url(#acid-arrow)" />
  <text class="note" x="68" y="170">Una operación por intención</text>
  <text class="note" x="292" y="170">Menos round trips</text>
  <text class="note" x="516" y="170">Salida semántica y acotada</text>
  <text class="note" x="740" y="170" fill="#FF6FB6">Rechaza I/O malformado</text>
  <path d="M814 184V248H142V184" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#acid-signal-arrow)" />
  <rect x="392" y="236" width="176" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="480" y="253" text-anchor="middle" fill="#FF6FB6">inválido → devuelve evidencias</text>
  <text class="note" x="48" y="292">En la ablación de SWE-bench Lite: SWE-agent ACI completo, 18,0 %, frente a un entorno solo de shell sin demostración, 7,3 %.</text>
  <text class="source" x="48" y="320">Fuente: Yang, Jimenez et al., «SWE-agent» (NeurIPS 2024). Las condiciones difieren en aspectos que van más allá de la interfaz.</text>
  <defs>
    <marker id="acid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
    <marker id="acid-signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#FF6FB6" />
    </marker>
  </defs>
</svg>
