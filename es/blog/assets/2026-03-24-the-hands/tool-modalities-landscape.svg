<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tm-title tm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tm-title">Cinco interfaces para el tool use de agentes</title>
  <desc id="tm-desc">Comparativa de JSON tool calling, MCP, Skills, herramientas de línea de comandos y ejecución de código según lo que transporta cada interfaz, dónde encaja y su sobrecoste de contexto habitual. La ejecución de código se destaca para la orquestación multi-agent.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="44">MAPA DE INTERFACES — ELIGE SEGÚN LA FORMA DEL TRABAJO</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">LLAMADAS ATÓMICAS</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150"><tspan x="68">Solicitud/respuesta tipadas · 550–1.400 tokens de esquema</tspan><tspan x="68" dy="1.2em">por herramienta</tspan></text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">INTEGRACIÓN COMPARTIDA</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150"><tspan x="520">Descubrimiento + transporte · carga solo las herramientas que</tspan><tspan x="520" dy="1.2em">necesita la tarea</tspan></text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">PROCEDIMIENTO</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286"><tspan x="68">Instrucciones bajo demanda · unos 100 tokens de metadatos</tspan><tspan x="68" dy="1.2em">de inicio</tspan></text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">OPERACIÓN LOCAL</text>
  <text class="name" x="520" y="262">CLI y shell</text>
  <text class="note" x="520" y="286">Comandos componibles · bajo sobrecoste de esquema</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#C50E72">FOCO · TRABAJO MULTIPASO</text>
  <text class="name" x="294" y="398" fill="#C50E72">Ejecución de código</text>
  <text class="note" x="294" y="422">Bucles y condicionales · el resumen final vuelve al contexto</text>
  <path d="M48 472H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="48" y="490">El protocolo no define la política: la autenticación, la autorización, el logging y el sandboxing siguen correspondiendo al harness.</text>
</svg>
