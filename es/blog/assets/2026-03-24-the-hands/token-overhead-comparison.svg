<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="to-title to-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="to-title">Las definiciones de tools pueden consumir el contexto antes de empezar el trabajo</title>
  <desc id="to-desc">Los ejemplos publicados muestran 143.000 tokens para una configuración grande de MCP y 55.000 para unos 40 tools de MCP. Se estima que diez tool schemas en JSON ocupan entre 5.500 y 14.000 tokens. Los metadatos de inicio de una skill ocupan unos 100 tokens. La ejecución de código usa pocos meta-tools, pero no se afirma ninguna cifra comparable.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .grid { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="512" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">SOBRECOSTE DE DEFINICIONES ANTES DE LA TAREA</text>
  <text class="note" x="48" y="68">Ejemplos publicados, no un benchmark controlado · escala horizontal en miles de tokens</text>

  <path class="grid" d="M300 88V424M493 88V424M687 88V424M880 88V424" />
  <text class="kind" x="300" y="84" text-anchor="middle">0</text>
  <text class="kind" x="493" y="84" text-anchor="middle">50K</text>
  <text class="kind" x="687" y="84" text-anchor="middle">100K</text>
  <text class="kind" x="880" y="84" text-anchor="middle">150K</text>

  <text class="kind" x="48" y="124" fill="#C50E72">FOCO · MCP</text>
  <text class="name" x="48" y="148" fill="#C50E72">Configuración grande</text>
  <rect x="300" y="116" width="553" height="32" rx="6" fill="#F2148E" />
  <text class="name" x="840" y="139" text-anchor="end" fill="#17211B">143K</text>
  <text class="note" x="300" y="170">El 72 % de una ventana de contexto de 200K en la configuración descrita</text>

  <text class="kind" x="48" y="212">MCP</text>
  <text class="name" x="48" y="236">Unos 40 tools</text>
  <rect x="300" y="204" width="213" height="32" rx="6" fill="#17211B" />
  <text class="name" x="525" y="227">55K</text>
  <text class="note" x="300" y="258">Schemas cargados antes de que el usuario haga una pregunta</text>

  <text class="kind" x="48" y="300">JSON SCHEMAS</text>
  <text class="name" x="48" y="324">Diez tools</text>
  <path d="M321 308H354" stroke="#17211B" stroke-width="8" />
  <circle cx="321" cy="308" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <circle cx="354" cy="308" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="372" y="314">5,5–14K</text>
  <text class="note" x="300" y="346">Rango derivado de 550–1.400 tokens por definición</text>

  <text class="kind" x="48" y="388">CARGA PROGRESIVA</text>
  <text class="name" x="48" y="412">Metadatos de la skill</text>
  <circle cx="301" cy="396" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="320" y="402">~100 tokens</text>
  <text class="note" x="300" y="434">Las instrucciones completas solo se cargan cuando la skill está activa</text>

  <path d="M48 456H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="source" x="48" y="478">Fuentes: Apideck para las observaciones de 55K y 143K; estimación del artículo para diez JSON schemas; guía sobre progressive disclosure de Skills.</text>
  <text class="source" x="48" y="496">La ejecución de código sustituye muchos schemas por unos pocos meta-tools, pero su sobrecoste de definición depende del harness y no se representa en el gráfico.</text>
</svg>
