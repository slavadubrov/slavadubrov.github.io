<text x="32" y="496" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El rediseño de Vercel pasó un agente con 17 tools a dos meta-tools y redujo un 37 % los tokens medios.</text>
<text x="32" y="518" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Anthropic informó de una reducción del 98,7 % de tokens en un workflow de Drive a Salesforce.</text>
