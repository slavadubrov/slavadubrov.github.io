<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="manifest-title manifest-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="manifest-title">La unidad de release se amplía de un servicio de modelo a un manifiesto del sistema</title>
  <desc id="manifest-desc">Un core de MLOps convencional integra cinco componentes de una aplicación LLM que cambian de forma independiente: prompts y esquemas, estado de retrieval, herramientas y permisos, routing y presupuestos, y política de seguridad. Un único manifiesto identifica el release completo.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="520" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">UNIDAD DE RELEASE — CADA COMPONENTE QUE PUEDE CAMBIAR EL COMPORTAMIENTO</text>

  <rect x="48" y="72" width="288" height="280" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="72" y="102">MLOPS CONVENCIONAL</text>
  <rect class="store" x="72" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="92" y="162">CORE DEL RELEASE</text><text class="name" x="92" y="190">Código · datos · modelo</text>
  <rect class="box" x="72" y="248" width="240" height="62" rx="10" />
  <text class="kind" x="92" y="273">RUNTIME</text><text class="name" x="92" y="298">Configuración de serving</text>

  <rect x="376" y="72" width="696" height="280" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="400" y="102">EXTENSIONES DE LA APLICACIÓN LLM</text>
  <rect class="box" x="400" y="128" width="192" height="96" rx="10" />
  <text class="kind" x="420" y="162">PETICIÓN</text><text class="name" x="420" y="190">Prompts + esquema</text>
  <rect class="store" x="616" y="128" width="192" height="96" rx="10" />
  <text class="kind" x="636" y="162">RETRIEVAL</text><text class="name" x="636" y="190">Corpus + índice</text>
  <rect class="box" x="832" y="128" width="216" height="96" rx="10" />
  <text class="kind" x="852" y="162">ACCIÓN</text><text class="name" x="852" y="190">Herramientas + permisos</text>
  <rect class="box" x="508" y="248" width="216" height="62" rx="10" />
  <text class="kind" x="528" y="273">ENTREGA</text><text class="name" x="528" y="298">Routing + presupuesto</text>
  <rect class="box" x="748" y="248" width="216" height="62" rx="10" />
  <text class="kind" x="768" y="273">POLÍTICA</text><text class="name" x="768" y="298">Seguridad + reglas de negocio</text>

  <path class="edge" d="M192 352v56h368" />
  <path class="edge" d="M724 352v56H560" />
  <path class="edge" d="M560 408v20" marker-end="url(#manifest-arrow)" />

  <rect x="336" y="428" width="448" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="356" y="453" fill="#C50E72">MANIFIESTO DEL SISTEMA</text>
  <text class="name" x="356" y="478" fill="#C50E72">Identificar y promover el sistema completo</text>

  <defs><marker id="manifest-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
