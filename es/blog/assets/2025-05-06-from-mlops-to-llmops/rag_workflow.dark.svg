<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-dark-title rag-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rag-dark-title">Rutas de ingesta, serving y evaluación de RAG</title>
  <desc id="rag-dark-desc">Una fuente versionada se analiza y se convierte en embeddings dentro de un índice vectorial. En serving, se autoriza la consulta de un tenant y se recuperan evidencias ordenadas por relevancia. La calidad de la recuperación se comprueba antes de ensamblar el contexto y generar la respuesta; la calidad de la respuesta se comprueba por separado.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="488" rx="14" fill="#0C1210" /><text class="kind" x="48" y="44">INGESTA — CREAR UN PRODUCTO DE DATOS VERSIONADO</text>
  <rect class="store" x="48" y="72" width="232" height="96" rx="10" /><text class="kind" x="68" y="106">FUENTE</text><text class="name" x="68" y="134">Snapshot + estado de ACL</text>
  <rect class="box" x="320" y="72" width="232" height="96" rx="10" /><text class="kind" x="340" y="106">PIPELINE</text><text class="name" x="340" y="134">Analizar + dividir en chunks + generar embeddings</text>
  <rect class="store" x="592" y="72" width="232" height="96" rx="10" /><text class="kind" x="612" y="106">ÍNDICE</text><text class="name" x="612" y="134">Vectores versionados</text>
  <path class="edge" d="M280 120h32" marker-end="url(#rag-dark-arrow)" /><path class="edge" d="M552 120h32" marker-end="url(#rag-dark-arrow)" />
  <text class="kind" x="48" y="228">SERVING — EVALUAR LA RECUPERACIÓN ANTES DE LA GENERACIÓN</text>
  <rect class="box" x="48" y="256" width="192" height="96" rx="10" /><text class="kind" x="68" y="290">SOLICITUD</text><text class="name" x="68" y="318">Consulta + tenant</text>
  <rect class="box" x="280" y="256" width="232" height="96" rx="10" /><text class="kind" x="300" y="290">RECUPERACIÓN</text><text class="name" x="300" y="318">Autorizar + ordenar por relevancia</text>
  <rect x="552" y="256" width="208" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="572" y="290" fill="#FF6FB6">GATE DE RECUPERACIÓN</text><text class="name" x="572" y="318" fill="#FF6FB6">¿La evidencia es utilizable?</text>
  <rect class="box" x="800" y="256" width="272" height="96" rx="10" /><text class="kind" x="820" y="290">GENERACIÓN</text><text class="name" x="820" y="318">Ensamblar + responder</text>
  <path class="edge" d="M240 304h32" marker-end="url(#rag-dark-arrow)" /><path class="edge" d="M512 304h32" marker-end="url(#rag-dark-arrow)" /><path class="edge" d="M760 304h32" marker-end="url(#rag-dark-arrow)" />
  <path class="edge" d="M708 168v40H396v40" stroke-dasharray="2 6" marker-end="url(#rag-dark-arrow)" /><rect x="504" y="196" width="168" height="24" rx="6" fill="#0C1210" /><text class="note" x="588" y="213" text-anchor="middle">versión de índice seleccionada</text>
  <path d="M800 408h272" stroke="#2B3B33" /><text class="kind" x="800" y="400">GATE DE RESPUESTA</text><text class="note" x="800" y="432">soporte · cita · éxito de la tarea</text>
  <defs><marker id="rag-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
