<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="classic-dark-title classic-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="classic-dark-title">El bucle de control MLOps que los sistemas basados en foundation models siguen necesitando</title>
  <desc id="classic-dark-desc">La trazabilidad alimenta un build reproducible, una release gate offline, un despliegue por fases y la observabilidad. Las evidencias de incidentes vuelven a la release gate, mientras la identidad inmutable y el rollback abarcan todo el bucle.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="400" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">BUCLE DE CONTROL — CAMBIA EL COMPORTAMIENTO, NO LA DISCIPLINA</text>
  <circle cx="62" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="81" text-anchor="middle">1</text>
  <circle cx="278" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="278" y="81" text-anchor="middle">2</text>
  <circle cx="494" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="494" y="81" text-anchor="middle">3</text>
  <circle cx="710" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="710" y="81" text-anchor="middle">4</text>
  <circle cx="926" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="926" y="81" text-anchor="middle">5</text>
  <rect class="box" x="48" y="104" width="176" height="96" rx="10" /><text class="kind" x="68" y="138">TRAZABILIDAD</text><text class="name" x="68" y="166">Identificar entradas</text>
  <rect class="box" x="264" y="104" width="176" height="96" rx="10" /><text class="kind" x="284" y="138">BUILD</text><text class="name" x="284" y="166">Reproducir</text>
  <rect x="480" y="104" width="176" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="500" y="138" fill="#FF6FB6">RELEASE GATE</text><text class="name" x="500" y="166" fill="#FF6FB6">Validar offline</text>
  <rect class="box" x="696" y="104" width="176" height="96" rx="10" /><text class="kind" x="716" y="138">DESPLIEGUE</text><text class="name" x="716" y="166">Despliegue por fases</text>
  <rect class="box" x="912" y="104" width="160" height="96" rx="10" /><text class="kind" x="932" y="138">OPERACIONES</text><text class="name" x="932" y="166">Observar los SLO</text>
  <path class="edge" d="M224 152h32" marker-end="url(#classic-dark-arrow)" /><path class="edge" d="M440 152h32" marker-end="url(#classic-dark-arrow)" /><path class="edge" d="M656 152h32" marker-end="url(#classic-dark-arrow)" /><path class="edge" d="M872 152h32" marker-end="url(#classic-dark-arrow)" />
  <path class="edge" d="M992 200v40a12 12 0 0 1-12 12H580a12 12 0 0 1-12-12v-32" marker-end="url(#classic-dark-arrow)" />
  <rect x="700" y="240" width="196" height="24" rx="6" fill="#0C1210" /><text class="note" x="798" y="257" text-anchor="middle">las evidencias de incidentes vuelven</text>
  <rect x="264" y="296" width="608" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="284" y="321">PLANO DE CONTROL</text><text class="name" x="284" y="346">Identidad inmutable · gobernanza · rollback</text>
  <defs><marker id="classic-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
