<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="gateway-dark-title gateway-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="gateway-dark-title">El inference gateway es una frontera de políticas y routing</title>
  <desc id="gateway-dark-desc">Una aplicación envía un contrato estable y la identidad del manifest a un inference gateway. El gateway aplica autenticación, cuotas, routing, reintentos, política de caché y propagación de trazas antes de elegir rutas hosted, self-hosted o de fallback. Cada rama llega a un punto común de evaluación.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="560" rx="14" fill="#0C1210" /><text class="kind" x="48" y="44">FRONTERA DE ROUTING — LA POLÍTICA ES CENTRAL, LA VERDAD DE LA TAREA NO</text>
  <rect class="box" x="48" y="168" width="208" height="96" rx="10" /><text class="kind" x="68" y="202">APLICACIÓN</text><text class="name" x="68" y="230">Contrato estable</text>
  <rect x="320" y="168" width="288" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="344" y="202" fill="#FF6FB6">INFERENCE GATEWAY</text><text class="name" x="344" y="230" fill="#FF6FB6">Política + routing propios</text><path d="M320 304h288" stroke="#2B3B33" /><text class="note" x="320" y="328">auth · cuota · región · presupuesto</text><text class="note" x="320" y="352">reintento · breaker · caché · trazas</text>
  <rect class="external" x="688" y="64" width="256" height="96" rx="10" /><text class="kind" x="708" y="98">RUTA EXTERNA</text><text class="name" x="708" y="126" fill="#A8B8AF">Proveedor hosted</text>
  <rect class="box" x="688" y="184" width="256" height="96" rx="10" /><text class="kind" x="708" y="218">RUTA PROPIA</text><text class="name" x="708" y="246">Runtime self-hosted</text>
  <rect class="external" x="688" y="304" width="256" height="96" rx="10" /><text class="kind" x="708" y="338">RUTA DE FALLBACK</text><text class="name" x="708" y="366" fill="#A8B8AF"><tspan x="708">Cambio de comportamiento</tspan><tspan x="708" dy="1.2em">explícito</tspan></text>
  <path class="edge" d="M256 216h56" marker-end="url(#gateway-dark-arrow)" /><path class="edge" d="M608 192h40a12 12 0 0 0 12-12v-56a12 12 0 0 1 12-12h8" marker-end="url(#gateway-dark-arrow)" /><path class="edge" d="M608 216h72" marker-end="url(#gateway-dark-arrow)" /><path class="edge" d="M608 240h40a12 12 0 0 1 12 12v88a12 12 0 0 0 12 12h8" marker-end="url(#gateway-dark-arrow)" />
  <path class="edge" d="M944 112h80v312H816v24" marker-end="url(#gateway-arrow)" /><path class="edge" d="M944 232h80" /><path class="edge" d="M944 352h80" />
  <rect x="688" y="448" width="256" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="708" y="473">PUNTO DE EVALUACIÓN</text><text class="name" x="708" y="498">Comparar cada ruta</text>
  <defs><marker id="gateway-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
