<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="gateway-title gateway-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="gateway-title">El gateway de inferencia es una frontera de políticas y routing</title><desc id="gateway-desc">Una aplicación envía un contrato estable a un gateway de inferencia que aplica autenticación, cuotas, routing, reintentos, política de caché y propagación de trazas; después elige una ruta alojada, autoalojada o de fallback. Todas las rutas pasan por un gate de evaluación antes de promocionarse.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="gateway-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="gateway-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="580" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">El gateway centraliza las políticas, no la verdad de la tarea</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Todas las rutas —alojada, autoalojada o de fallback— pasan por el mismo gate de evaluación.</text>
<path d="M42 128h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 128h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">APLICACIÓN</text><text x="46" y="183" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Contrato estable</text>
<path d="M274 112h240a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-240a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M274 112h240a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-260a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="278" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GATEWAY DE INFERENCIA</text><text x="278" y="163" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Gestiona políticas + routing</text><text x="278" y="185" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">auth · cuota · región · presupuesto</text><text x="278" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">reintento · breaker · caché · traza</text>
<path d="M232 164h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gateway-arrow-flow)" />
<path d="M42 264h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 264h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="281.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">RUTA EXTERNA</text><text x="46" y="319" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Proveedor alojado</text>
<path d="M254 264h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M254 264h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="258" y="281.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RUTA PROPIA</text><text x="258" y="319" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Runtime autoalojado</text>
<path d="M466 264h212a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-212a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M466 264h212a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-232a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="470" y="281.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">RUTA DE FALLBACK</text><text x="470" y="319" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#A8B8AF" style="font-size: 12px;">Cambio de comportamiento explícito</text>
<path d="M394 216v20H132v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M394 216v20H344v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gateway-arrow-flow)" />
<path d="M394 216v20H572v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gateway-arrow-flow)" />
<path d="M42 408h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 408h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">GATE DE EVALUACIÓN</text><text x="46" y="463" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Comparar todas las rutas antes de promocionar</text>
<path d="M132 336v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gateway-arrow-flow)" />
<path d="M344 336v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gateway-arrow-flow)" />
<path d="M572 336v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gateway-arrow-flow)" />
<path d="M32 512h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="538" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Toda ruta —alojada, propia o fallback— pasa el mismo gate antes de promocionarse.</text>
</svg>
