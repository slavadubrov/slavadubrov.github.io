<path d="M32 488h736" stroke="#2B3B33" stroke-width="1"/>
<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">The synchronization step is the coordination point across all four workers.</text>
