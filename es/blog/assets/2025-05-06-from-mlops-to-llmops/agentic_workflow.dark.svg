<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="trace-title trace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="trace-title">Las trazas de producción se convierten en pruebas de regresión y despliegues más seguros</title><desc id="trace-desc">Una solicitud de producción genera una traza con privacidad controlada. El triaje convierte un fallo revisado en un caso de regresión etiquetado, que una puerta de evaluación compara con la release actual antes de un despliegue gradual. El resultado monitorizado cierra el ciclo de vuelta a producción.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="trace-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="trace-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="460" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Las trazas cierran el ciclo de vuelta a producción</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Un fallo revisado se convierte en un caso etiquetado y, después, en una decisión de release.</text>
<path d="M42 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PRODUCCIÓN</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Ejecutar solicitud</text><circle cx="32" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M204 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M204 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="208" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TRAZA</text><text x="208" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0" style="font-size: 11px;"><tspan x="208">Capturar de forma</tspan><tspan x="208" dy="1.2em">segura</tspan></text><circle cx="194" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="194" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M366 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M366 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="370" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TRIAJE</text><text x="370" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Revisar fallo</text><circle cx="356" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="356" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M528 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M528 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="532" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">CASO DE REGRESIÓN</text><text x="532" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Etiquetar el caso</text><circle cx="518" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="518" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M182 148h12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M344 148h12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M506 148h12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M593 184v32H512v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M366 248h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M366 248h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="370" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PUERTA DE EVALUACIÓN</text><text x="370" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Comparar el cambio candidato</text><text x="370" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">con la release actual</text>
<path d="M42 248h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 248h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">DESPLIEGUE</text><text x="46" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Desplegar gradualmente la release</text><text x="46" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">despliegue monitorizado, no un paso final</text>
<path d="M356 300h-12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M188 248v-32H107v-32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#trace-arrow-flow)" /><rect x="17.5" y="204" width="261" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="148" y="220.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">el resultado monitorizado cierra el ciclo</text>
<path d="M32 384h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="410" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Un pulgar arriba no es ground truth; los casos con consecuencias siguen necesitando etiquetas de</tspan><tspan x="32" dy="1.2em">expertos.</tspan></text>
</svg>
