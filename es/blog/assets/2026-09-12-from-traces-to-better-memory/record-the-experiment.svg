<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="record-experiment-title record-experiment-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="record-experiment-title">Esta demo delega las propuestas a un agente LLM</title><desc id="record-experiment-desc">Los fallos registrados se envían al agente. El agente propone un cambio de configuración de SGR. Python lo valida, prueba la herramienta de memoria determinista y compara el resultado. Los intentos aceptados y rechazados se convierten en feedback para la siguiente llamada al modelo. Seleccionar un padre para otro experimento no autoriza el despliegue; la revisión humana de la release sigue siendo independiente.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="record-experiment-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="record-experiment-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="880" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Esta demo: un agente elige el siguiente cambio</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El agente propone ajustes; Python los prueba y devuelve feedback.</text>
