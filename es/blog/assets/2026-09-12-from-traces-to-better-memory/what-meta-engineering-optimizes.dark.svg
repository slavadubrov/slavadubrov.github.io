<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="what-meta-engineering-optimizes-title what-meta-engineering-optimizes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="what-meta-engineering-optimizes-title">El meta-engineering optimiza el sistema completo</title><desc id="what-meta-engineering-optimizes-desc">El meta-engineering elige experimentos que pueden variar la redacción del prompt, el ensamblado del contexto, la configuración del loop y la estructura del grafo. Las cuatro son partes de un mismo sistema candidato. La evaluación mide los resultados de ese sistema y devuelve evidencias para el siguiente experimento. Las cuatro áreas son decisiones de diseño solapadas, no etapas históricas.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="what-meta-engineering-optimizes-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="what-meta-engineering-optimizes-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="744" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">El meta-engineering optimiza el sistema completo</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Las decisiones sobre prompt, contexto, loop y grafo comparten un mismo proceso experimental.</text>
<path d="M210 120h380a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-380a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M210 120h380a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-400a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="214" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESO EXPERIMENTAL</text><text x="214" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Meta-engineering</text><text x="214" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Elegir un cambio · probarlo · usar el resultado</text><text x="214" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12px;">Mantener explícitos los objetivos, los presupuestos y la aprobación</text>
