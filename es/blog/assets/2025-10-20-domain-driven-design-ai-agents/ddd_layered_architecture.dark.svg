<text x="32" y="634" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Las dependencias apuntan hacia las políticas del dominio; la infraestructura proporciona las</tspan><tspan x="32" dy="1.2em">implementaciones.</tspan></text>
