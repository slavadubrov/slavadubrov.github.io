<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="bcd-title bcd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="bcd-title">La palabra producto tiene tres significados acotados</title>
  <desc id="bcd-desc">Gestión de pedidos, Facturación e Inventario mantienen modelos Product independientes. Un contrato de traducción destacado mapea identificadores y términos entre los contextos sin imponer un único objeto compartido.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; fill: #141D19; }
    .group { stroke: #2B3B33; stroke-width: 1.5; fill: none; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0C1210" />
  <rect class="group" x="48" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="68" y="78">CONTEXTO ACOTADO</text>
  <text class="name" x="68" y="104">Gestión de pedidos</text>
  <rect class="box" x="72" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="92" y="158">MODELO</text>
  <text class="name" x="92" y="184">Product = línea de pedido</text>
  <text class="note" x="72" y="252">cantidad · compromiso · estado</text>
  <rect class="group" x="352" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="372" y="78">CONTEXTO ACOTADO</text>
  <text class="name" x="372" y="104">Facturación</text>
  <rect class="box" x="376" y="128" width="208" height="96" rx="10" fill="#1B2621" />
  <text class="kind" x="396" y="158">MODELO</text>
  <text class="name" x="396" y="184">Product = línea valorada</text>
  <text class="note" x="376" y="252">impuesto · descuento · liquidación</text>
  <rect class="group" x="656" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="676" y="78">CONTEXTO ACOTADO</text>
  <text class="name" x="676" y="104">Inventario</text>
  <rect class="box" x="680" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="700" y="158">MODELO</text>
  <text class="name" x="700" y="184">Product = artículo en stock</text>
  <text class="note" x="680" y="252">SKU · ubicación · cantidad</text>
  <path class="edge" d="M176 288v32M480 288v32M784 288v32" />
  <path class="edge" d="M176 320h608" />
  <path class="edge" d="M480 320v16" marker-end="url(#bcd-arrow)" />
  <rect x="256" y="336" width="448" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="276" y="361" fill="#FF6FB6">ENFOQUE · CONTRATO PUBLICADO</text>
  <text class="name" x="276" y="384" fill="#FF6FB6">Traducir términos e identificadores</text>
  <text class="note" x="48" y="424">Cada contexto mantiene su propio modelo; la traducción se realiza en el límite.</text>
  <defs>
    <marker id="bcd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
