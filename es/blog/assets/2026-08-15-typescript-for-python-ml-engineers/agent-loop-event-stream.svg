<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 736" width="1120" height="736" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Una iteración del agent loop escrito a mano y el flujo de eventos que produce</title>
  <desc>Un único paso del loop, de izquierda a derecha. El modelo transmite fragmentos mediante chat completions. Los fragmentos de un tool call llegan con solo un campo index en cada fragmento, así que el loop los acumula en llamadas completas agrupadas por index. Cada llamada ensamblada pasa por JSON.parse y después por la validación de Zod; un fallo en cualquiera de las dos rutas se convierte en un tool message que describe el error, en lugar de lanzar una excepción, y el loop continúa. Una llamada válida ejecuta la herramienta y el resultado se añade al array de mensajes como tool message antes del siguiente paso. El loop produce valores AgentEvent tipados desde un generador asíncrono. La ruta HTTP consume el generador, emite tramas Server-Sent Event, acumula el texto y escribe el texto final en el almacenamiento cuando termina el stream. Los tests consumen el generador por separado y recopilan sus eventos.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="736" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Un paso del loop y lo que produce</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Todo lo que queda dentro del límite discontinuo es código que un framework escribe por ti. El flujo de eventos es lo que permite probarlo.</text>

  <!-- Boundary of the hand-written loop -->
  <rect x="48" y="104" width="1024" height="368" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="68" y="130" font-size="14" font-weight="700" fill="#0f172a">runAgent — un paso</text>
  <text x="68" y="148" font-size="11" fill="#64748b">packages/agent-core/src/loop.ts</text>

  <!-- Model -->
  <rect x="68" y="168" width="182" height="94" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="86" y="194" font-size="13" font-weight="600" fill="#0f172a">Modelo</text>
  <text x="86" y="214" font-size="11" fill="#64748b">POST /chat/completions</text>
  <text x="86" y="230" font-size="11" fill="#64748b">stream: true</text>
  <text x="86" y="250" font-size="11" fill="#5b21b6">OpenAI, vLLM, Ollama</text>

  <path d="M 250 215 L 292 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="256" y="205" font-size="10" fill="#64748b">fragmentos</text>

  <!-- Accumulate -->
  <rect x="300" y="168" width="212" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="318" y="194" font-size="13" font-weight="600" fill="#0f172a">Acumular por index</text>
  <text x="318" y="214" font-size="11" fill="#64748b">id y name llegan una vez;</text>
  <text x="318" y="230" font-size="11" fill="#64748b">los argumentos llegan por partes</text>
  <text x="318" y="250" font-size="11" fill="#1d4ed8">Solo index aparece en cada fragmento</text>

  <path d="M 512 215 L 554 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="533" y="203" text-anchor="middle" font-size="10" fill="#64748b">call</text>

  <!-- Validate -->
  <rect x="562" y="168" width="204" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="580" y="194" font-size="13" font-weight="600" fill="#0f172a">JSON.parse y después Zod</text>
  <text x="580" y="214" font-size="11" fill="#64748b">Los modelos generan JSON mal formado</text>
  <text x="580" y="230" font-size="11" fill="#64748b">y argumentos fuera de rango</text>
  <text x="580" y="250" font-size="11" fill="#1d4ed8">Ambos casos son esperables, no excepcionales</text>

  <!-- Execute -->
  <path d="M 766 200 L 812 200" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <text x="770" y="192" font-size="10" fill="#166534">válido</text>
  <rect x="820" y="168" width="232" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="838" y="192" font-size="13" font-weight="600" fill="#0f172a">Ejecutar la herramienta</text>
  <text x="838" y="212" font-size="11" fill="#166534">El resultado se convierte en un tool message</text>

  <!-- Repair path -->
  <path d="M 664 262 L 664 300 L 812 300" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <text x="676" y="292" font-size="10" fill="#991b1b">no válido</text>
  <rect x="820" y="268" width="232" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="838" y="292" font-size="13" font-weight="600" fill="#0f172a">Describir el fallo</text>
  <text x="838" y="312" font-size="11" fill="#991b1b">El modelo lo lee y vuelve a intentarlo</text>

  <!-- Append + loop back -->
  <rect x="300" y="348" width="466" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="318" y="372" font-size="13" font-weight="600" fill="#0f172a">Añadir mensajes assistant + tool y repetir</text>
  <text x="318" y="392" font-size="11" fill="#64748b">El array de mensajes es toda la memoria del agente durante esta ejecución</text>

  <path d="M 850 228 L 850 244 L 792 244 L 792 378 L 774 378" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <path d="M 936 328 L 936 378 L 800 378" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <path d="M 292 378 L 200 378 L 200 270" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="204" y="336" font-size="10" fill="#64748b">siguiente paso</text>

  <text x="68" y="440" font-size="11" fill="#64748b">Condición de salida: una respuesta sin tool calls o alcanzar el límite de pasos. Ambas cosas terminan la ejecución; solo una indica éxito.</text>

  <!-- Event stream -->
  <rect x="48" y="496" width="1024" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="68" y="522" font-size="14" font-weight="700" fill="#0f172a">yield: AgentEvent</text>
  <text x="68" y="542" font-size="11" fill="#64748b">Una unión discriminada producida por un generador asíncrono: la forma del async def con yield de Python.</text>
  <text x="68" y="560" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#1d4ed8">text | tool_call | tool_result | done | error</text>

  <path d="M 240 572 L 240 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <path d="M 560 572 L 560 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />

  <rect x="88" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="108" y="640" font-size="13" font-weight="600" fill="#0f172a">Ruta HTTP</text>
  <text x="108" y="660" font-size="11" fill="#64748b">Una trama SSE por evento</text>
  <text x="108" y="676" font-size="11" fill="#64748b">apps/api/src/app.ts</text>

  <rect x="408" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="428" y="640" font-size="13" font-weight="600" fill="#0f172a">Test</text>
  <text x="428" y="660" font-size="11" fill="#64748b">Recopila los eventos en un array</text>
  <text x="428" y="676" font-size="11" fill="#64748b">Sin red ni API key</text>

  <rect x="728" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="748" y="640" font-size="13" font-weight="600" fill="#0f172a">Almacenamiento</text>
  <text x="748" y="660" font-size="11" fill="#64748b">Escribe el texto final una sola vez</text>
  <text x="748" y="676" font-size="11" fill="#64748b">La ruta lo llama después del stream</text>

  <path d="M 240 688 L 240 712 L 880 712 L 880 688" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <rect x="493" y="702" width="134" height="18" rx="9" fill="#f8fafc" />
  <text x="560" y="715" text-anchor="middle" font-size="10" fill="#64748b">texto final después del stream</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>
</svg>
