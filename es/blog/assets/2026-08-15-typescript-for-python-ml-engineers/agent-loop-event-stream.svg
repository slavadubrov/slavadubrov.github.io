<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="loop-title">Un agent loop escrito a mano expone un flujo de eventos tipado</title><desc id="loop-desc">Un modelo transmite chunks a un buffer de fragmentos. El loop ensambla las llamadas, las analiza y valida, ejecuta las tools válidas y añade los mensajes de las tools al historial de mensajes antes del siguiente paso. La entrada no válida se convierte en un error de tool dentro del mismo historial, en lugar de terminar el loop. El generador asíncrono AgentEvent, centrado en esta lógica, alimenta la ruta HTTP y los tests. Después del streaming, la ruta HTTP escribe el resultado final de la ejecución.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="loop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="loop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="840" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un paso del loop y, después, una interfaz estable</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">La reparación se mantiene dentro del loop. Los consumidores reciben eventos tipados en lugar de chunks</tspan><tspan x="32" dy="1.2em">del proveedor del modelo.</tspan></text>
<rect x="32" y="104" width="656" height="272" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">RUNAGENT · UN PASO</text>
