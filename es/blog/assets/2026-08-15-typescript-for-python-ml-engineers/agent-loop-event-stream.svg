<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;">Los tests capturan eventos; HTTP los envuelve en SSE y persiste al terminar.</text>
<text x="32" y="784" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Si no hay tool call, se emite done(stop); el límite de pasos emite done(max_steps),</text>
<text x="32" y="806" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">un resultado completado, pero truncado.</text>
