<rect width="720" height="840" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un esquema, tres consumidores</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">La declaración compartida cambia de forma en cada adaptador; las apps siguen siendo independientes</tspan><tspan x="32" dy="1.2em">entre sí.</tspan></text>
