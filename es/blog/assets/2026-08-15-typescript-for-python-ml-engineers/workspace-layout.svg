<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="workspace-title workspace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="workspace-title">Un esquema Zod llega a tres consumidores orientados al modelo</title><desc id="workspace-desc">El esquema EstimateKvCacheInput, definido en packages/schemas, alimenta un loop escrito a mano, el adaptador de Vercel AI SDK y el publicador de herramientas MCP. Los dos adaptadores de loop sirven la API de Hono; el publicador sirve el servidor MCP. La API escribe en una tabla runs de Postgres y el worker reclama filas de ella.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
