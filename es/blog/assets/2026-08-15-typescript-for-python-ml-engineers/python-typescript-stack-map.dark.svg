<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="stack-title">Herramientas de servicio Python asignadas a TypeScript</title>
  <desc id="stack-desc">Seis sustituciones habituales asignan las herramientas de proyecto, paquetes, HTTP, SQL, testing y linting de Python a sus equivalentes en TypeScript. Un panel destacado señala las tres sustituciones que cambian la semántica: Pydantic por Zod, Celery y Redis por una cola en Postgres, y mypy por el compilador de TypeScript.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .signal-kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #ff6fb6; }
    .signal-name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #ff6fb6; }
    .signal-note { fill: #ff6fb6; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="744" rx="14" fill="#0c1210" />
  <text class="name" x="48" y="44">Qué sustituye a qué</text>
  <text class="note" x="48" y="68">La mayoría de las herramientas ocupan el mismo lugar. El panel destacado muestra dónde la intuición de Python deja de trasladarse sin más.</text>
  <rect x="48" y="96" width="408" height="400" rx="12" fill="#141d19" stroke="#2b3b33" />
  <rect x="504" y="96" width="408" height="400" rx="12" fill="#141d19" stroke="#2b3b33" />
  <text class="kind" x="68" y="124">SERVICIO PYTHON</text><text class="kind" x="524" y="124">SERVICIO TYPESCRIPT</text>
  <path d="M48 144h408M504 144h408" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="174">MANIFIESTO</text><text class="name" x="68" y="198">pyproject.toml</text>
  <text class="kind" x="524" y="174">MANIFIESTO</text><text class="name" x="524" y="198">package.json</text><path class="edge" d="M464 184h32" marker-end="url(#stack-arrow)" />
  <path d="M68 216h368M524 216h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="236">PAQUETES</text><text class="name" x="68" y="260">uv</text>
  <text class="kind" x="524" y="236">PAQUETES</text><text class="name" x="524" y="260">pnpm</text><path class="edge" d="M464 246h32" marker-end="url(#stack-arrow)" />
  <path d="M68 278h368M524 278h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="298">HTTP</text><text class="name" x="68" y="322">FastAPI</text>
  <text class="kind" x="524" y="298">HTTP</text><text class="name" x="524" y="322">Hono</text><path class="edge" d="M464 308h32" marker-end="url(#stack-arrow)" />
  <path d="M68 340h368M524 340h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="360">SQL</text><text class="name" x="68" y="384">SQLAlchemy + Alembic</text>
  <text class="kind" x="524" y="360">SQL</text><text class="name" x="524" y="384">Drizzle + drizzle-kit</text><path class="edge" d="M464 370h32" marker-end="url(#stack-arrow)" />
  <path d="M68 402h368M524 402h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="422">TESTS</text><text class="name" x="68" y="446">pytest</text>
  <text class="kind" x="524" y="422">TESTS</text><text class="name" x="524" y="446">Vitest</text><path class="edge" d="M464 432h32" marker-end="url(#stack-arrow)" />
  <path d="M68 464h368M524 464h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="484">LINT + FORMATO</text><text class="name" x="216" y="484">Ruff + Black</text>
  <text class="kind" x="524" y="484">LINT + FORMATO</text><text class="name" x="672" y="484">Biome</text><path class="edge" d="M464 474h32" marker-end="url(#stack-arrow)" />
  <rect x="48" y="528" width="864" height="168" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="signal-kind" x="68" y="558">FOCO · TRES TRAMPAS SEMÁNTICAS</text>
  <text class="signal-name" x="68" y="584">Estas sustituciones cambian el modelo operativo</text>
  <path d="M68 604h824" stroke="#ff6fb6" fill="none" /><path d="M336 620v56M624 620v56" stroke="#ff6fb6" fill="none" opacity="0.45" />
  <text class="signal-kind" x="68" y="636">VALIDACIÓN</text><text class="signal-name" x="68" y="660">Pydantic → Zod</text><text class="note signal-note" x="68" y="680">schema primero, tipo inferido</text>
  <text class="signal-kind" x="356" y="636">COLA DE TAREAS</text><text class="signal-name" x="356" y="660">Celery + Redis → SQL</text><text class="note signal-note" x="356" y="680">el broker se sustituye por filas</text>
  <text class="signal-kind" x="644" y="636">COMPROBACIÓN DE TIPOS</text><text class="signal-name" x="644" y="660">mypy → tsc --noEmit</text><text class="note signal-note" x="644" y="680">los datos en runtime siguen sin comprobarse</text>
  <text class="note" x="48" y="724">Usa los scripts de pnpm como interfaz del servicio; Node, tsx y tsc se ejecutan detrás de esos nombres.</text>
  <defs><marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a8b8af" /></marker></defs>
