<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tt-title tt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tt-title">Enrutamiento NER en tres niveles según la estructura de la tarea de extracción</title>
  <desc id="tt-desc">Una solicitud de extracción se enruta según la estructura de la tarea. Los spans explícitos se envían a encoders; las tareas conjuntas y las relaciones, a GLiNER2 o GLiNER-Relex; y el trabajo intensivo en razonamiento o de mapeo de ontologías, a LLMs con schema restringido. Los casos de LLM registrados alimentan el siguiente dataset de entrenamiento del encoder.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="552" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="tt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
  </defs>
  <path class="edge" d="M256 96h40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40H168v40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v80" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40h312v40" marker-end="url(#tt-arrow)" />
  <rect x="48" y="48" width="208" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="72" y="82">SOLICITUD</text><text class="name" x="72" y="110">Tarea de extracción</text><text class="note" x="72" y="132">Texto + schema requerido.</text>
  <rect x="296" y="48" width="368" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="320" y="82" fill="#C50E72">FOCO · ROUTER</text><text class="name" x="320" y="110" fill="#C50E72">Enrutar según la estructura de la tarea</text>
  <text class="note" x="320" y="132" fill="#C50E72">No clasifiques modelos una sola vez para cada solicitud.</text>
  <rect class="group" x="48" y="200" width="240" height="264" rx="12" /><rect class="group" x="360" y="200" width="240" height="264" rx="12" /><rect class="group" x="672" y="200" width="240" height="264" rx="12" />
  <rect class="box" x="72" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="92" y="258">NIVEL 1 · PROCESO</text><text class="name" x="92" y="286">Modelos encoder</text><text class="note" x="92" y="308">Spans de texto explícitos.</text>
  <text class="kind" x="72" y="356">ELEGIR SEGÚN EL CONJUNTO DE LABELS</text><text class="note" x="72" y="382">Cross-encoder · inventario pequeño</text><text class="note" x="72" y="406">Bi-encoder · inventario reutilizable</text><text class="note" x="72" y="430">Modelo fine-tuned · dominio estable</text>
  <rect class="box" x="384" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="404" y="258">NIVEL 2 · PROCESO</text><text class="name" x="404" y="286">Extracción conjunta</text><text class="note" x="404" y="308">Varias tareas relacionadas.</text>
  <text class="kind" x="384" y="356">PRUEBA LA COMPOSICIÓN</text><text class="note" x="384" y="382">GLiNER2 · NER + campos + clase</text><text class="note" x="384" y="406">GLiNER-Relex · spans + relaciones</text><text class="note" x="384" y="430">Evalúa cada salida por separado</text>
  <rect x="696" y="224" width="192" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="716" y="258">NIVEL 3 · EXTERNO</text><text class="name" x="716" y="286">LLM estructurado</text><text class="note" x="716" y="308">Inferencia o mapeo.</text>
  <text class="kind" x="696" y="356">RESTRINGE LA SALIDA</text><text class="note" x="696" y="382">Schema nativo · Instructor</text><text class="note" x="696" y="406">Outlines · generación local</text><text class="note" x="696" y="430">Ancla o aloja en tus propios sistemas según sea necesario</text>
  <path class="edge" d="M792 464v32H168v-32" stroke-dasharray="2 6" marker-end="url(#tt-arrow)" />
  <rect x="338" y="484" width="284" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="501" text-anchor="middle">casos registrados → siguiente dataset de entrenamiento de Tier 1</text>
  <text class="note" x="48" y="534">Mide la distribución del tráfico en producción; los niveles describen el trabajo, no un porcentaje fijo de solicitudes.</text>
</svg>
