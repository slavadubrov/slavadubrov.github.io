<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="cp-title cp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cp-title">Intercambio de atención en paralelo por contexto</title><desc id="cp-desc">Una secuencia larga se divide en cuatro fragmentos de tokens, uno por rank, mientras cada rank replica los pesos completos del modelo. La atención intercambia el estado de keys y values entre ranks para que el resultado siga reflejando todo el contexto.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="cp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Intercambio de atención en paralelo por contexto</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Cada rank tiene un fragmento de secuencia y replica los pesos para el intercambio de atención.</text>
<path d="M294 112h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M294 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="360" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" text-anchor="middle" letter-spacing="1.2">SECUENCIA</text><text x="360" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" text-anchor="middle">S₀+S₁+S₂+S₃</text>
<path d="M360 184v24H108v40" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-arrow-flow)" />
