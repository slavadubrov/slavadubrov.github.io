<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 592" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="sdt-title sdt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sdt-title">Flujo de escalado distribuido basado en restricciones</title><desc id="sdt-desc">Perfila una carga de trabajo, clasifica su restricción limitante, ubica los collectives en la topología y, después, ejecuta benchmarks de las mallas candidatas. El layout que encaja con margen y obtiene el mejor rendimiento medido se convierte en la opción desplegable; si no supera la comprobación, el proceso vuelve a la fase de benchmarking.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sdt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="sdt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="592" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Flujo de escalado distribuido basado en restricciones</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Perfila la carga de trabajo, clasifica la restricción y ejecuta benchmarks antes de elegir un layout.</text>
