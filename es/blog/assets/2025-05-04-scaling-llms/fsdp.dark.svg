<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fsdp-title fsdp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fsdp-title">Ejecución paralela de datos totalmente fragmentada</title>
  <desc id="fsdp-desc">Cuatro ranks mantienen shards de parámetros, gradientes y del optimizador. Un grupo de capas se recopila temporalmente para el cálculo y, después, sus gradientes se distribuyen mediante reduce-scatter a los propietarios de los shards.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #EDF5F0; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #A8B8AF; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="600" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">SHARDS PERSISTENTES · VISTA DE CAPA TEMPORAL</text>
  <g>
    <rect class="box" x="48" y="64" width="192" height="96" rx="10" fill="#1B2621" />
    <text class="kind" x="68" y="98">RANK 0 · ALMACÉN</text><text class="name" x="68" y="126">P₀ · G₀ · O₀</text>
    <rect class="box" x="272" y="64" width="192" height="96" rx="10" fill="#1B2621" />
    <text class="kind" x="292" y="98">RANK 1 · ALMACÉN</text><text class="name" x="292" y="126">P₁ · G₁ · O₁</text>
    <rect class="box" x="496" y="64" width="192" height="96" rx="10" fill="#1B2621" />
    <text class="kind" x="516" y="98">RANK 2 · ALMACÉN</text><text class="name" x="516" y="126">P₂ · G₂ · O₂</text>
    <rect class="box" x="720" y="64" width="192" height="96" rx="10" fill="#1B2621" />
    <text class="kind" x="740" y="98">RANK 3 · ALMACÉN</text><text class="name" x="740" y="126">P₃ · G₃ · O₃</text>
  </g>
  <path class="edge" d="M144 160v40h336v40M368 160v40M592 160v40H480M816 160v40H480" />
  <path class="edge" d="M480 200v32" marker-end="url(#fsdp-arrow)" />
  <rect x="352" y="240" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="372" y="274" fill="#FF6FB6">COLECTIVA</text>
  <text class="name" x="372" y="302" fill="#FF6FB6">All-gather del grupo de capas</text>
  <path class="edge" d="M480 336v40" marker-end="url(#fsdp-arrow)" />
  <rect class="box" x="352" y="384" width="256" height="62" rx="10" fill="#141D19" />
  <text class="kind" x="372" y="408">PROCESO</text><text class="name" x="372" y="432">Forward + backward</text>
  <path class="edge" d="M480 446v40" marker-end="url(#fsdp-arrow)" />
  <rect class="box" x="352" y="494" width="256" height="62" rx="10" fill="#141D19" />
  <text class="kind" x="372" y="518">COLECTIVA</text><text class="name" x="372" y="542">Reduce-scatter de gradientes</text>
  <path class="edge" stroke-dasharray="7 6" d="M352 525H160a16 16 0 0 1-16-16V168" marker-end="url(#fsdp-arrow)" />
  <text class="note" x="48" y="584">Agrupar capas intercambia memoria máxima por tamaño de las colectivas y solapamiento.</text>
  <defs><marker id="fsdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
