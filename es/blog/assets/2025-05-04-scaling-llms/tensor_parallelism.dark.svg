<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="tp-title tp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tp-title">Particionado de capas con paralelismo de tensores</title><desc id="tp-desc">La entrada de una capa se distribuye entre cuatro fragmentos de pesos y cada rank calcula un resultado parcial. Un collective de la capa combina las salidas parciales antes de continuar con el cálculo dependiente, y este collective se repite dentro de cada bloque transformer.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="tp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="552" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Particionado de capas con paralelismo de tensores</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La entrada se reparte en cuatro shards de pesos; un collective combina los parciales.</text>
