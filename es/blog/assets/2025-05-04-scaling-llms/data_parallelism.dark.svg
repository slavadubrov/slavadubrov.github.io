<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="dp-title dp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="dp-title">Entrenamiento data parallel replicado</title>
  <desc id="dp-desc">Cuatro ranks procesan distintos micro-batches mientras cada uno almacena una réplica completa del entrenamiento. Sus gradientes convergen mediante un all-reduce antes de que cada rank aplique la misma actualización.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #EDF5F0; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">BATCH DIVIDIDO · ESTADO REPLICADO</text>
  <g>
    <rect class="box" x="48" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="106">RANK 0</text><text class="name" x="68" y="134"><tspan x="68">Batch A · réplica</tspan><tspan x="68" dy="1.2em">completa</tspan></text>
    <rect class="box" x="272" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="106">RANK 1</text><text class="name" x="292" y="134"><tspan x="292">Batch B · réplica</tspan><tspan x="292" dy="1.2em">completa</tspan></text>
    <rect class="box" x="496" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="106">RANK 2</text><text class="name" x="516" y="134"><tspan x="516">Batch C · réplica</tspan><tspan x="516" dy="1.2em">completa</tspan></text>
    <rect class="box" x="720" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="106">RANK 3</text><text class="name" x="740" y="134"><tspan x="740">Batch D · réplica</tspan><tspan x="740" dy="1.2em">completa</tspan></text>
  </g>
  <path class="edge" d="M144 168v40h336v40M368 168v40M592 168v40H480M816 168v40H480" />
  <path class="edge" d="M480 208v32" marker-end="url(#dp-arrow)" />
  <rect x="352" y="248" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="372" y="282" fill="#FF6FB6">COLECTIVO</text>
  <text class="name" x="372" y="310" fill="#FF6FB6">All-reduce de gradientes</text>
  <path class="edge" stroke-dasharray="7 6" d="M608 296h240a16 16 0 0 0 16-16V168" marker-end="url(#dp-arrow)" />
  <text class="note" x="632" y="282">misma actualización para cada rank</text>
  <text class="note" x="48" y="388">El throughput puede aumentar; la memoria del estado del modelo por rank no disminuye.</text>
  <defs>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker>
    <marker id="dp-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker>
  </defs>
</svg>
