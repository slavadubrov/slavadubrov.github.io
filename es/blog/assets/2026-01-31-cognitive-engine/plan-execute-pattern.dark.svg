<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pe-title pe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="pe-title">Plan-and-Execute mantiene un plan general mientras cada paso usa feedback</title>
  <desc id="pe-desc">Un planner escribe un plan de varios pasos. Un executor ejecuta cada paso como un pequeño ReAct loop, guarda su resultado en un checkpoint y después avanza al siguiente paso o replantea el plan si el resultado lo contradice.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .decision { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .signal-edge { fill: none; stroke: #FF6FB6; stroke-width: 1.5; }
    .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; } .signal-arrow { fill: #FF6FB6; }
  </style>
  <rect class="canvas" width="960" height="496" rx="14" /><text class="note" x="48" y="42">Planifica una vez a nivel de tarea; reacciona a la evidencia dentro de cada paso.</text>
  <rect class="process" x="48" y="72" width="208" height="96" rx="10" /><text class="kind" x="68" y="106">MODEL · PLANNER</text><text class="name" x="68" y="134">Descomponer la tarea</text><text class="note" x="68" y="153">escribir 4–6 pasos ordenados</text>
  <rect class="store" x="296" y="72" width="208" height="96" rx="10" /><text class="kind" x="316" y="106">STORE · PLAN</text><text class="name" x="316" y="134">Siguiente paso pendiente</text><text class="note" x="316" y="153">dirección general estable</text>
  <rect class="process" x="544" y="72" width="208" height="96" rx="10" /><text class="kind" x="564" y="106">PROCESS · EXECUTOR</text><text class="name" x="564" y="134">Ejecutar un pequeño ReAct loop</text><text class="note" x="564" y="153">pensamiento · herramienta · observación</text>
  <path class="edge" d="M256 120h32" marker-end="url(#pe-arrow)" /><path class="edge" d="M504 120h32" marker-end="url(#pe-arrow)" />
  <rect class="focus" x="704" y="224" width="208" height="96" rx="10" /><text class="kind focus-kind" x="724" y="258">FOCUS · CHECKPOINT</text><text class="name focus-name" x="724" y="286">Guardar evidencia del paso</text><text class="note" x="724" y="305">reanudar después de este límite</text>
  <path class="edge" d="M648 168v48a16 16 0 0 0 16 16h32" marker-end="url(#pe-arrow)" />
  <path class="decision" d="M480 216 584 272 480 328 376 272Z" /><text class="kind" x="480" y="263" text-anchor="middle">DECISION</text><text class="name" x="480" y="287" text-anchor="middle">¿el plan sigue siendo válido?</text>
  <path class="edge conditional" d="M704 272H592" marker-end="url(#pe-arrow)" />
  <path class="edge conditional" d="M480 216v-32a16 16 0 0 1 16-16h40" marker-end="url(#pe-arrow)" /><rect class="canvas" x="489" y="181" width="106" height="24" rx="6" /><text class="note" x="542" y="198" text-anchor="middle">sí → siguiente paso</text>
  <rect class="process" x="272" y="368" width="208" height="62" rx="10" /><text class="kind" x="292" y="392">MODEL · REPLANNER</text><text class="name" x="292" y="416">Revisar los pasos restantes</text>
  <path class="signal-edge" d="M428 300 380 360" marker-end="url(#pe-signal-arrow)" /><rect class="canvas" x="351" y="319" width="82" height="24" rx="6" /><text class="note focus-kind" x="392" y="336" text-anchor="middle">no → replantear</text>
  <path class="edge" d="M272 399H152a16 16 0 0 1-16-16V176" marker-end="url(#pe-arrow)" /><text class="note" x="48" y="470">El plan general se mantiene fijo el tiempo suficiente para coordinar el trabajo, pero no tanto como para tener que ignorar evidencias desfavorables.</text>
  <defs><marker id="pe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker><marker id="pe-signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="signal-arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
