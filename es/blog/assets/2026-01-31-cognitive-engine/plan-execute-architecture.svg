<path d="M32 1000h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="1026" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12px;">El esquema de estado no se bifurca por patrón: el routing es código de conversión, no tres esquemas independientes.</text>
<text x="32" y="1048" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;"><tspan x="32">Un evaluador con contexto nuevo y una compuerta de aprobación humana se sitúan después de ambas rutas; se omiten aquí para</tspan><tspan x="32" dy="1.2em">mantener claros los dos loops.</tspan></text>
