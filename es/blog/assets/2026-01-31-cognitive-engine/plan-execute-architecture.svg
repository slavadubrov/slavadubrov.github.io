<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un router, dos reasoning loops, un estado</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">El solver de ReWOO escribe directamente en el estado; solo la investigación profunda pasa por un</tspan><tspan x="32" dy="1.2em">reporter.</tspan></text>
