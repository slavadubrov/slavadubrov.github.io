<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El solver de ReWOO escribe directamente en el estado; solo deep research pasa por un reporter.</text>
