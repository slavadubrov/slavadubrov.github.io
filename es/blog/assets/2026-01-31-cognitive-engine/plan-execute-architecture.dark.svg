<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">Un router envía una pregunta de mercado a uno de dos reasoning loops que escriben en el mismo estado tipado.</title><desc id="planexecarch-desc">Un router clasifica una pregunta de mercado como deep research o flash briefing. Deep research ejecuta Plan-and-Execute: un planner escribe 4-6 pasos, un executor ejecuta cada uno como un ReAct loop y un reporter redacta el informe. Flash briefing ejecuta ReWOO: un planner escribe un grafo de dependencias de tools, un worker lo ejecuta y un solver sintetiza un único resultado. El reporter y el solver de ReWOO escriben en un único objeto de estado tipado compartido, aunque solo la ruta de deep research pasa por el reporter; el solver de ReWOO escribe directamente en el estado.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="planexecarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="planexecarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
