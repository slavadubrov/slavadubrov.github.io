<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="memory-title memory-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="memory-title">Cinco afirmaciones sobre un único pool de memoria de Apple Silicon</title>
  <desc id="memory-desc">macOS y las aplicaciones, los componentes del modelo, las activaciones y el workspace del runtime, y los adapters opcionales comparten la memoria unificada. El foco está en el margen de trabajo restante, porque el swap sostenido no es un punto de operación cómodo. La resolución, el batch size, la arquitectura, la precisión y las fases cargadas desplazan los límites.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .claim { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .claim-alt { fill: #1b2621; stroke: #edf5f0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#0c1210" />

  <text class="kind" x="48" y="44">ALMACENAMIENTO · UN ÚNICO POOL DE MEMORIA UNIFICADA</text>
  <text class="note" x="912" y="44" text-anchor="end">afirmaciones conceptuales · no a escala</text>

  <rect class="claim" x="80" y="72" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="109">SISTEMA</text>
  <text class="name" x="272" y="109">macOS y las aplicaciones</text>
  <text class="note" x="856" y="109" text-anchor="end">cambia mientras trabajas</text>

  <rect class="claim-alt" x="80" y="150" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="187">PESOS</text>
  <text class="name" x="272" y="187">Componentes del modelo</text>
  <text class="note" x="856" y="187" text-anchor="end">checkpoint · encoders · VAE</text>

  <rect class="claim" x="80" y="228" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="265">WORKSPACE</text>
  <text class="name" x="272" y="265">Activaciones y runtime</text>
  <text class="note" x="856" y="265" text-anchor="end">atención · estado intermedio</text>

  <rect class="claim-alt" x="80" y="306" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="343">CARGA OPCIONAL</text>
  <text class="name" x="272" y="343">Adapters y controles</text>
  <text class="note" x="856" y="343" text-anchor="end">LoRA · ControlNet · upscaler</text>

  <rect x="80" y="384" width="800" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="104" y="418" fill="#ff6fb6">FOCO</text>
  <text class="name" x="104" y="446">Margen de trabajo</text>
  <text class="note" x="856" y="446" text-anchor="end">deja margen antes del swap sostenido</text>

  <path d="M48 520h48" fill="none" stroke="#2b3b33" stroke-width="1.5" />
  <text class="note" x="112" y="525">La resolución · el batch size · la arquitectura · la precisión · las fases cargadas desplazan cada afirmación.</text>
</svg>
