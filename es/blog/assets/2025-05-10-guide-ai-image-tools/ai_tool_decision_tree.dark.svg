<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="decision-title decision-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="decision-title">Ruta de decisión para seleccionar un flujo local de imágenes en macOS</title>
  <desc id="decision-desc">Elige una aplicación nativa, un grafo inspeccionable o una interfaz existente según el estado que deba persistir. Verifica la compatibilidad con el modelo exacto y el stack de macOS. Las opciones no compatibles vuelven al inicio; las compatibles pasan a la prueba de aceptación representativa.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
    .process { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .decision { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="672" rx="14" fill="#0c1210" />
  <text class="kind" x="48" y="40">MAPA DE DECISIÓN · SELECCIÓN POR ESTADO CONTROLADO</text>

  <path class="decision" d="M480 64 608 112 480 160 352 112Z" />
  <text class="kind" x="480" y="105" text-anchor="middle">DECISIÓN</text>
  <text class="name" x="480" y="130" text-anchor="middle">¿Qué estado debe persistir?</text>

  <path class="edge" d="M480 160v24M176 184h608" />
  <path class="edge" d="M176 184v16" marker-end="url(#decision-arrow)" />
  <path class="edge" d="M480 184v16" marker-end="url(#decision-arrow)" />
  <path class="edge" d="M784 184v16" marker-end="url(#decision-arrow)" />

  <rect class="process" x="48" y="208" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="242">INTERACCIÓN</text>
  <text class="name" x="68" y="270">Aplicación nativa</text>
  <text class="note" x="48" y="330">Draw Things · DiffusionBee</text>

  <rect class="process" x="352" y="208" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="242">PIPELINE</text>
  <text class="name" x="372" y="270">Grafo inspeccionable</text>
  <text class="note" x="352" y="330">ComfyUI</text>

  <rect class="process" x="656" y="208" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="242">COMPATIBILIDAD</text>
  <text class="name" x="676" y="270">Interfaz existente</text>
  <text class="note" x="656" y="330">AUTOMATIC1111 · Fooocus</text>

  <path class="edge" d="M272 304v40M480 304v40M880 304v40M272 344h608M480 344v24" marker-end="url(#decision-arrow)" />

  <path class="decision" d="M480 376 624 424 480 472 336 424Z" />
  <text class="kind" x="480" y="417" text-anchor="middle">DECISIÓN</text>
  <text class="name" x="480" y="442" text-anchor="middle">¿Es compatible el stack exacto?</text>

  <path class="edge" d="M480 472v40" marker-end="url(#decision-arrow)" />
  <rect x="494" y="481" width="40" height="22" rx="6" fill="#0c1210" />
  <text class="note" x="514" y="497" text-anchor="middle">sí</text>

  <path class="edge" d="M336 424H24V112h320" stroke-dasharray="7 6" marker-end="url(#decision-arrow)" />
  <rect x="48" y="411" width="174" height="24" rx="6" fill="#0c1210" />
  <text class="note" x="135" y="428" text-anchor="middle">no · elige otra ruta</text>

  <rect x="304" y="520" width="352" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="324" y="554" fill="#ff6fb6">ENFOQUE</text>
  <text class="name" x="324" y="582">Prueba de aceptación representativa</text>
  <text class="note" x="304" y="646">Mide · reinicia · reproduce · registra la unidad de release</text>

  <defs>
    <marker id="decision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
