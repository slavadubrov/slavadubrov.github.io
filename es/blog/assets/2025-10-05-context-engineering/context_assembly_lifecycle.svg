<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Contexto ensamblado mediante recuperación acotada, presupuestación, ejecución y validación</title>
  <desc id="desc">El estado de la solicitud de confianza pasa por la selección de decisiones, la recuperación autorizada, la presupuestación basada en utilidad, la propuesta del modelo, la validación y ejecución deterministas, y finalmente el registro de la procedencia y del resultado.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#F7F7F4" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">El ensamblado del contexto es un ciclo de vida por decisión</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" style="font-size: 13.5px;">Solicitud de confianza</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">actor, tenant, tarea</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B"><tspan x="75">configuración regional</tspan><tspan x="75" dy="1.2em">+ hora</tspan></text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Seleccionar decisión</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">planificar, recuperar, actuar</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">o responder</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Acotar + recuperar</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">autorizar primero</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">ordenar evidencias</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#59645E" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" style="font-size: 11px;">Presupuestar + ensamblar</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">utilidad, frescura</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">límites de confianza</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Proponer → validar → actuar</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#17211B">salida tipada + política</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#17211B">postcondiciones de la herramienta</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Registrar el manifiesto, la procedencia, la validación y el resultado de la tarea</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#17211B">La siguiente decisión obtiene un nuevo conjunto de trabajo, en lugar de heredar todo.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#17211B">Una llamada al modelo es una etapa dentro de la política de contexto, no la política en sí.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
