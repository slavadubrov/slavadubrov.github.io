<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Memoria seleccionada por tenant, propósito, frescura y relevancia</title>
  <desc id="desc">Los candidatos de memoria pasan comprobaciones de sujeto y ámbito del tenant, propósito, frescura y relevancia. Solo los registros seleccionados entran en el contexto; los rechazados permanecen fuera.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="420" rx="22" fill="#0C1210" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">La recuperación de memoria es una decisión de política</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(40 110)"><rect width="220" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Almacén de memoria</text><text x="28" y="82" font-size="13" fill="#EDF5F0">hechos explícitos del usuario</text><text x="28" y="112" font-size="13" fill="#EDF5F0">hipótesis inferidas</text><text x="28" y="142" font-size="13" fill="#EDF5F0">registros episódicos</text><text x="28" y="172" font-size="13" fill="#EDF5F0">provenance + ciclo de vida</text></g><text x="290" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(330 95)"><rect width="330" height="240" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="165" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Puertas de selección</text><text x="35" y="82" font-size="13" fill="#EDF5F0">1. sujeto autenticado + tenant</text><text x="35" y="116" font-size="13" fill="#EDF5F0">2. propósito permitido</text><text x="35" y="150" font-size="13" fill="#EDF5F0">3. frescura y estado de revisión</text><text x="35" y="184" font-size="13" fill="#EDF5F0">4. relevancia y autoridad</text><text x="35" y="218" font-size="12" fill="#EDF5F0">Sin puerta → no se incluye en el contexto</text></g><text x="690" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(730 110)"><rect width="230" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="115" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0"><tspan x="115">Conjunto de trabajo</tspan><tspan x="115" dy="1.2em">seleccionado</tspan></text><text x="30" y="84" font-size="13" fill="#EDF5F0">mínimo de hechos útiles</text><text x="30" y="116" font-size="13" fill="#EDF5F0">fuente conservada</text><text x="30" y="148" font-size="13" fill="#EDF5F0">caducidad conservada</text><text x="30" y="180" font-size="13" fill="#EDF5F0"><tspan x="30">la eliminación sigue siendo</tspan><tspan x="30" dy="1.2em">posible</tspan></text></g><text x="500" y="382" text-anchor="middle" font-size="13" fill="#EDF5F0">Las memorias inferidas por el modelo siguen siendo hipótesis hasta que una fuente autorizada las confirma.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
