<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Contexto ensamblado mediante recuperación acotada, presupuestación, ejecución y validación</title>
  <desc id="desc">El estado de la solicitud, ya verificado, pasa por la selección de decisiones, la recuperación autorizada, la presupuestación basada en utilidad, la propuesta del modelo, la validación y ejecución deterministas, y finalmente el registro de la procedencia y del resultado.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#0C1210" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">El ensamblado del contexto es un ciclo de vida por decisión</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Solicitud verificada</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">actor, tenant, tarea</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">localización + hora</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Seleccionar decisión</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">planificar, recuperar, actuar</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">o responder</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Acotar + recuperar</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">autorizar primero</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">clasificar evidencias</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#A8B8AF" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Presupuestar + ensamblar</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">utilidad, actualidad</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">fronteras de confianza</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Proponer → validar → actuar</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">salida tipada + política</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">postcondiciones de las tools</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">Registrar el manifiesto, la procedencia, la validación y el resultado de la tarea</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#EDF5F0">La siguiente decisión obtiene un nuevo conjunto de trabajo, en lugar de heredar todo.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#EDF5F0">Una llamada al modelo es una etapa dentro de la política de contexto, no la política en sí.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
