<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El ciclo de vida se ejecuta por decisión; reutilizar un único contexto grande para toda una ejecución</text>
<text x="32" y="624" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">crea evidencia obsoleta y proporciona a cada etapa material que no necesita.</text>
