<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Compresión de contexto consciente de la pérdida, con índices independientes para el estado canónico y los artefactos</title>
  <desc id="desc">La conversación y las observaciones se resumen en un conjunto de trabajo compacto, mientras que el estado canónico de la tarea, las referencias a evidencias y el historial de artefactos se almacenan por separado para permitir una recuperación exacta.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0C1210" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">Comprime la prosa; conserva el estado recuperable</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Contexto creciente</text><text x="30" y="83" font-size="13" fill="#EDF5F0">turnos de conversación</text><text x="30" y="116" font-size="13" fill="#EDF5F0">observaciones sin procesar de tools</text><text x="30" y="149" font-size="13" fill="#EDF5F0">pasajes recuperados</text><text x="30" y="182" font-size="13" fill="#EDF5F0">texto repetitivo</text></g><text x="325" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Conjunto de trabajo compacto</text><text x="30" y="83" font-size="13" fill="#EDF5F0">decisiones + siguiente acción</text><text x="30" y="116" font-size="13" fill="#EDF5F0">hallazgos tipados de tools</text><text x="30" y="149" font-size="13" fill="#EDF5F0">referencias a fuentes + artefactos</text><text x="30" y="182" font-size="13" fill="#EDF5F0">preguntas sin resolver</text></g><text x="665" y="225" font-size="25" fill="#EDF5F0">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Almacenes canónicos</text><text x="30" y="83" font-size="13" fill="#EDF5F0">estado de la tarea</text><text x="30" y="116" font-size="13" fill="#EDF5F0">índice de archivos y artefactos</text><text x="30" y="149" font-size="13" fill="#EDF5F0">resultados completos de tools</text><text x="30" y="182" font-size="13" fill="#EDF5F0">versiones de las evidencias</text><text x="30" y="225" font-size="12" fill="#EDF5F0">Vuelve a obtener los detalles exactos</text><text x="30" y="247" font-size="12" fill="#EDF5F0">cuando la tarea los necesite.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#EDF5F0">Optimiza el total de tokens por tarea completada correctamente, incluida la nueva obtención de datos y la recuperación.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
