<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Elige una optimización para el cuello de botella de contexto medido</title>
  <desc id="artifact-desc">Cuatro técnicas de contexto asociadas a cuellos de botella y métricas de evaluación distintos: compaction para historiales crecientes, observation masking para tool outputs verbosos, prompt caching para prefijos repetidos y particionado de decisiones para un exceso de evidencias o capacidades.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
    <style>
        .bg { fill: #f8fafc; }
        .title { fill: #0f172a; font-family: Inter, system-ui, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
        .subtitle { fill: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
        .card { rx: 12; ry: 12; }
        .card-title { fill: #0f172a; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
        .card-desc { fill: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
        .metric { fill: #166534; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
        .metric-box { fill: #ffffff; rx: 6; ry: 6; }
        .use-case { fill: #94a3b8; font-family: Inter, system-ui, sans-serif; font-size: 12px; text-anchor: middle; font-style: italic; }
        .section-label { fill: #334155; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: start; }
        .result-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; ry: 10; }
        .result-text { fill: #166534; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
        .flow-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5 5; }
        .number { fill: #f8fafc; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: bold; }
    </style>

    <rect width="100%" height="100%" class="bg" />

    <!-- Title -->
    <text y="35" class="title" x="450">Técnicas de optimización de contexto</text>
    <text y="58" class="subtitle" x="450">Empieza por el origen de la presión. Cada técnica cambia una métrica distinta.</text>

    <!-- Horizontal flow line -->
    <line x1="50" y1="260" x2="850" y2="260" class="flow-line" />

    <!-- Technique 1: Compaction -->
    <g transform="translate(30, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#2563eb" />
        <text y="30" class="number" text-anchor="middle" x="25">1</text>
        <text y="30" class="card-title" x="105">Compaction</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#2563eb" stroke-width="1" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Resume el contexto al</text>
        <text y="83" class="card-desc" x="97">acercarte a los límites de la ventana</text>
        <text y="98" class="card-desc" x="97">Mantén el estado canónico fuera</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#2563eb" stroke-width="1" />
        <text y="129" class="metric" x="97">Éxito de la continuación</text>
    </g>

    <!-- Technique 2: Observation Masking -->
    <g transform="translate(245, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#7c3aed" />
        <text y="30" class="number" text-anchor="middle" x="25">2</text>
        <text y="30" class="card-title" x="112">Observation mask</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#7c3aed" stroke-width="1" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Sustituye los tool outputs</text>
        <text y="83" class="card-desc" x="97">por referencias compactas</text>
        <text y="98" class="card-desc" x="97">Conserva las referencias completas a los artefactos</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#7c3aed" stroke-width="1" />
        <text y="129" class="metric" x="97">Número de re-fetches</text>
    </g>

    <!-- Technique 3: KV-Cache -->
    <g transform="translate(460, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#16a34a" />
        <text y="30" class="number" text-anchor="middle" x="25">3</text>
        <text y="30" class="card-title" x="112">Prompt caching</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#16a34a" stroke-width="1" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Reutiliza un prefijo estable</text>
        <text y="83" class="card-desc" x="97">para reducir el coste repetido</text>
        <text y="98" class="card-desc" x="97">Coloca primero el contenido estable</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#16a34a" stroke-width="1" />
        <text y="129" class="metric" x="97">Ventana sin cambios</text>
    </g>

    <!-- Technique 4: Partitioning -->
    <g transform="translate(675, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#ea580c" />
        <text y="30" class="number" text-anchor="middle" x="25">4</text>
        <text y="30" class="card-title" x="112">Particiones de decisiones</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#ea580c" stroke-width="1" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Divide el trabajo entre</text>
        <text y="83" class="card-desc" x="97">pasos según la decisión y las</text>
        <text y="98" class="card-desc" x="97">capacidades permitidas</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#ea580c" stroke-width="1" />
        <text y="129" class="metric" x="97">Fallos en la transferencia</text>
    </g>

    <!-- When to apply section -->
    <text y="295" class="section-label" x="50">CUÁNDO APLICARLO:</text>

    <g transform="translate(30, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
        <text y="22" class="card-desc" style="fill: #1d4ed8;" x="97">Usa para:</text>
        <text y="40" class="card-desc" x="97">El historial de mensajes crece mucho</text>
    </g>

    <g transform="translate(245, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
        <text y="22" class="card-desc" style="fill: #5b21b6;" x="97">Usa para:</text>
        <text y="40" class="card-desc" x="97">Los tool outputs dominan el contexto</text>
    </g>

    <g transform="translate(460, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#16a34a" stroke-width="1" />
        <text y="22" class="card-desc" style="fill: #166534;" x="97">Usa para:</text>
        <text y="40" class="card-desc" x="97">Prompts / plantillas estables</text>
    </g>

    <g transform="translate(675, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
        <text y="22" class="card-desc" style="fill: #9a3412;" x="97">Usa para:</text>
        <text y="40" class="card-desc" x="97">Los pasos necesitan entradas distintas</text>
    </g>

    <!-- Result box -->
    <g transform="translate(250, 395)">
        <rect x="0" y="0" width="400" height="55" class="result-box" />
        <text y="25" class="result-text" x="200">Asocia la técnica al cuello de botella medido</text>
        <text y="45" class="card-desc" style="fill: #166534;" x="200">No hay un ahorro universal ni un multiplicador combinado</text>
    </g>

    <!-- Target metrics at bottom -->
    <text y="480" class="section-label" x="50">EVALÚA:</text>
    <text y="480" class="card-desc" x="250">Éxito de la tarea y acciones incorrectas</text>
    <text y="480" class="card-desc" x="500">Latencia, tokens totales y re-fetches</text>
    <text y="480" class="card-desc" x="750">Lecturas de caché y exposición de capacidades</text>

    <text y="520" class="card-desc" x="450">Las funciones y los umbrales del proveedor varían. Verifica la documentación actual.</text>

</svg>
