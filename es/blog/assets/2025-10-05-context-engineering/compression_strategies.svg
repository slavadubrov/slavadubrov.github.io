<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Compresión del contexto consciente de la pérdida, con índices independientes para el estado canónico y los artefactos</title>
  <desc id="desc">La conversación y las observaciones se resumen en un conjunto de trabajo compacto, mientras que el estado canónico de la tarea, las referencias a evidencias y el historial de artefactos se almacenan por separado para permitir una recuperación exacta.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Comprime la prosa; conserva el estado recuperable</text>
  <g font-family="Inter, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#1e293b" stroke="#64748b" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Contexto creciente</text><text x="30" y="83" font-size="13" fill="#cbd5e1">turnos de conversación</text><text x="30" y="116" font-size="13" fill="#cbd5e1">observaciones sin procesar de herramientas</text><text x="30" y="149" font-size="13" fill="#cbd5e1">pasajes recuperados</text><text x="30" y="182" font-size="13" fill="#cbd5e1">texto boilerplate repetido</text></g><text x="325" y="225" font-size="25" fill="#94a3b8">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Conjunto de trabajo compacto</text><text x="30" y="83" font-size="13" fill="#93c5fd">decisiones + siguiente acción</text><text x="30" y="116" font-size="13" fill="#93c5fd">hallazgos tipados de herramientas</text><text x="30" y="149" font-size="13" fill="#93c5fd">referencias a fuentes + artefactos</text><text x="30" y="182" font-size="13" fill="#93c5fd">preguntas sin resolver</text></g><text x="665" y="225" font-size="25" fill="#94a3b8">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Almacenes canónicos</text><text x="30" y="83" font-size="13" fill="#93c5fd">estado de la tarea</text><text x="30" y="116" font-size="13" fill="#93c5fd">índice de archivos y artefactos</text><text x="30" y="149" font-size="13" fill="#93c5fd">resultados completos de herramientas</text><text x="30" y="182" font-size="13" fill="#93c5fd">versiones de las evidencias</text><text x="30" y="225" font-size="12" fill="#93c5fd">Vuelve a recuperar los detalles exactos</text><text x="30" y="247" font-size="12" fill="#93c5fd">cuando la tarea los necesite.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">Optimiza el total de tokens por tarea completada correctamente, incluida la recuperación y la restauración.</text></g>
</svg>
