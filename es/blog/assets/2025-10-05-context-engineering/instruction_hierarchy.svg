<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">La autoridad de las instrucciones depende del proveedor, por lo que una jerarquía de roles universal es un error; el código de la aplicación es el límite común de enforcement.</title><desc id="instr-desc">El Model Spec de OpenAI sitúa las instrucciones de plataforma o sistema, desarrollador y usuario por orden de autoridad. La Messages API de Anthropic expone un parámetro system de nivel superior y mensajes de usuario y assistant, sin un rol developer equivalente. Independientemente de los nombres de los roles del proveedor, el código de la aplicación autoriza las tools, el acceso a datos y los efectos secundarios.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="instr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="instr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="670" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">La prioridad de las instrucciones depende del proveedor</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Los nombres de los roles varían según el proveedor; el enforcement es arquitectónico, no textual.</text>
