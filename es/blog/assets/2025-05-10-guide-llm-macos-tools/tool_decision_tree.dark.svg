<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 586" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="macostools-title macostools-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="macostools-title">Elige una herramienta LLM local para macOS según las necesidades del workflow y haz benchmark de todas las candidatas de la misma forma.</title><desc id="macostools-desc">Partiendo de una tarea y un checkpoint fijos, elige Ollama para un servicio local gestionado, LM Studio para explorar modelos desde el escritorio, llama.cpp para controlar directamente GGUF o MLX-LM para Python nativo de Apple; después, converge en una única disciplina: haz benchmark con el mismo checkpoint, cuantización y conjunto de prompts antes de comparar.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="macostools-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="macostools-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="586" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Elige la superficie de control y haz benchmark</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ramifica según las necesidades del workflow; converge en una única disciplina de benchmarking.</text>
