<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Where each primitive lives in each deployment shape" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Dónde reside cada primitiva en cada modalidad de despliegue</title>
  <desc>Diagrama: propiedad de las primitivas.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1140" height="640" fill="#F7F7F4" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#17211B" x="570">Dónde reside cada primitiva en cada modalidad de despliegue</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#17211B" x="570">Cada celda indica el componente que proporciona esa primitiva.</text>

  <!-- Column headers -->
  <g font-size="11" font-weight="700" letter-spacing="0.6" fill="#59645E" text-anchor="middle">
    <text y="96" x="140">MODALIDAD</text>
    <text y="96" x="370">HARNESS</text>
    <text y="96" x="585">SANDBOX</text>
    <text y="96" x="800">SESIÓN + CHECKPOINT</text>
    <text y="96" x="1015">TRACE</text>
  </g>
  <line x1="20" y1="106" x2="1120" y2="106" stroke="#17211B" stroke-width="1.5" />

  <!-- Row 1: SDK in app server (y_rect=118, y_text=140) -->
  <text y="140" font-size="13" font-weight="600" fill="#17211B" x="30">1. SDK en el servidor de la app</text>
  <g>
    <rect x="265" y="118" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
    <rect x="480" y="118" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
