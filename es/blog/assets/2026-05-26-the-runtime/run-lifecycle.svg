<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">Una ejecución saludable del agente persiste una intención pendiente antes del dispatch, registra el resultado y después crea un checkpoint y evalúa; un worker nuevo reconcilia primero la intención pendiente.</title><desc id="runlife-desc">Este flujo ilustrativo sigue una operación coordinada con efecto lateral: arranque, planificación, persistencia de una intención pendiente y una clave de idempotencia, dispatch, persistencia de su resultado, checkpoint y evaluación. Las llamadas independientes de solo lectura o idempotentes pueden ejecutarse en paralelo con registros persistentes independientes y una agregación determinista. Si un worker se bloquea después del dispatch y antes de escribir el resultado, se reactiva con el mismo ID de sesión, reconcilia la intención pendiente y solo entonces continúa. Una evaluación fallida reanuda la planificación; una evaluación superada finaliza correctamente.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="runlife-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="runlife-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
