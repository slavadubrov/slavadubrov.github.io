<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Los servicios core siempre se ejecutan; MCP y la observabilidad son perfiles opt-in.</text>
