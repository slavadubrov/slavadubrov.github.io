<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">El worker no guarda el modelo ni credenciales de tools: Claude y el sidecar MCP están fuera.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Redis solo es opcional en desarrollo local porque el runner síncrono puede llamar directamente al worker.</text>
