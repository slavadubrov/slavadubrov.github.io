<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">El stack de referencia de Docker Compose tiene un worker como harness, tres stores bajo su control directo y tres servicios opt-in activados mediante flags de perfil.</title><desc id="composetop-desc">Un worker de LangGraph actúa como responsable de la ejecución y harness: extrae jobs de una cola de Redis, escribe checkpoints en Postgres y lee la memoria fría de Qdrant. Un sidecar MCP aísla las credenciales de las tools del worker; un collector de OpenTelemetry recopila trazas y métricas; y un stack de observabilidad las almacena. Los tres se activan mediante perfiles opt-in de Compose. Claude es la API de modelo externa a la que el worker llama directamente.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="composetop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="composetop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
