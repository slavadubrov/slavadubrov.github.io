<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" aria-labelledby="artifact-title artifact-desc">
  <title id="artifact-title">Modos de fallo que un agente de larga duración debe soportar</title>
  <desc id="artifact-desc">Modos de fallo que un agente de larga duración debe soportar.</desc>
  <defs>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.08" />
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="940" height="600" fill="#f8fafc" />

  <text y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" x="470">Modos de fallo que un agente de larga duración debe soportar</text>
  <text y="56" text-anchor="middle" font-size="13" fill="#334155" x="470">Izquierda: el fallo. Derecha: la mitigación y dónde se implementa en el runtime.</text>

  <!-- Column headers -->
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" letter-spacing="0.6" x="200">MODO DE FALLO</text>
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.6" x="740">MITIGACIÓN · HOOK DEL RUNTIME</text>

  <!-- Rows -->
  <!-- Row 1: Premature completion -->
  <g filter="url(#ds2)">
    <rect x="40" y="110" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#991b1b" x="56">Finalización prematura</text>
    <text y="152" font-size="11" fill="#334155" x="56">El agente se declara victorioso tras un turno</text>
  </g>
  <path d="M360 138 L 540 138" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="110" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#166534" x="556">Revisor independiente con su propio contexto</text>
    <text y="152" font-size="11" fill="#334155" x="556">Herramientas de solo lectura · cada comprobación falla por defecto</text>
  </g>

  <!-- Row 2: Feature amnesia -->
  <g filter="url(#ds2)">
    <rect x="40" y="178" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#991b1b" x="56">Amnesia de funcionalidades</text>
    <text y="220" font-size="11" fill="#334155" x="56">Cada arranque en frío olvida el progreso anterior</text>
  </g>
  <path d="M360 206 L 540 206" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="178" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#166534" x="556">El inicializador vuelve a leer los archivos de progreso al arrancar</text>
    <text y="220" font-size="11" fill="#334155" x="556">PROGRESS.md, feature-list.json · antes de la primera llamada al modelo</text>
  </g>

  <!-- Row 3: Duplicated work -->
  <g filter="url(#ds2)">
    <rect x="40" y="246" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#991b1b" x="56">Trabajo duplicado tras un reinicio</text>
    <text y="288" font-size="11" fill="#334155" x="56">Se vuelve a ejecutar el mismo paso tras reiniciar el proceso</text>
  </g>
  <path d="M360 274 L 540 274" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="246" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#166534" x="556">Checkpoint en Postgres + archivo de handoff</text>
    <text y="288" font-size="11" fill="#334155" x="556">Log de solo escritura · reanudar desde el último nodo completado</text>
  </g>

  <!-- Row 4: Context anxiety -->
  <g filter="url(#ds2)">
    <rect x="40" y="314" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#991b1b" x="56">Ansiedad por el contexto</text>
    <text y="356" font-size="11" fill="#334155" x="56">El modelo abandona pronto al llenarse la ventana</text>
  </g>
  <path d="M360 342 L 540 342" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="314" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#166534" x="556">Sonnet 4.5: limitar el uso a 200k</text>
    <text y="356" font-size="11" fill="#334155" x="556">Dentro de una ventana de 1M tokens; reiniciar y reanudar</text>
  </g>

  <!-- Row 5: Stuck loops -->
  <g filter="url(#ds2)">
    <rect x="40" y="382" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#991b1b" x="56">Bucles atascados · tormentas de reintentos</text>
    <text y="424" font-size="11" fill="#334155" x="56">La misma tool call se reintenta indefinidamente</text>
  </g>
  <path d="M360 410 L 540 410" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="382" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#166534" x="556">Limitar iteraciones · backoff · circuit breaker</text>
    <text y="424" font-size="11" fill="#334155" x="556">Decorador de tool calls · Temporal RetryPolicy</text>
  </g>

  <!-- Row 6: Workspace drift -->
  <g filter="url(#ds2)">
    <rect x="40" y="450" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#991b1b" x="56">Deriva del workspace</text>
    <text y="492" font-size="11" fill="#334155" x="56">El agente edita archivos fuera de su tarea</text>
  </g>
  <path d="M360 478 L 540 478" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="450" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#166534" x="556">Workspace por sesión, acceso a rutas delimitado</text>
    <text y="492" font-size="11" fill="#334155" x="556">Middleware de Deep Agents, o fork de Daytona/Runloop</text>
  </g>

  <!-- Row 7: Runaway cost / lost work -->
  <g filter="url(#ds2)">
    <rect x="40" y="518" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#991b1b" x="56">Coste descontrolado · trabajo perdido tras un crash</text>
    <text y="560" font-size="11" fill="#334155" x="56">Consumo del presupuesto · muere el proceso o el sandbox</text>
  </g>
  <path d="M360 546 L 540 546" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="518" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#166534" x="556">Presupuesto de tokens · kill switch · registrar fuera del proceso</text>
    <text y="560" font-size="11" fill="#334155" x="556">Contadores gen_ai.usage · wake(sessionId) para reanudar</text>
  </g>
</svg>
