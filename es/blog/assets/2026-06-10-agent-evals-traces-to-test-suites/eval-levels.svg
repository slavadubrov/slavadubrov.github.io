<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Three levels of agent evaluation with their metrics" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Tres niveles de evaluación de agentes con sus métricas</title>
  <defs>
    <marker id="arrLvl" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#334155" />
    </marker>
    <filter id="shadowLvl" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Tres niveles de evaluación de agentes</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">El resultado indica QUÉ ha fallado · la trayectoria, DÓNDE · el componente, POR QUÉ</text>

  <!-- Level 1: end-to-end -->
  <rect x="30" y="80" width="1120" height="150" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="106" font-size="14" font-weight="700" fill="#166534" x="55">Nivel 1 · Resultado (caja negra)</text>
  <text y="124" font-size="10" fill="#166534" x="55">Pregunta: ¿se ha completado la tarea?</text>

  <rect x="55" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="225">Completitud de la tarea</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="225">Alineación con el objetivo evaluada por un LLM, sin referencia</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="225">utilizable online — no necesita un output de referencia</text>

  <rect x="415" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="585">Evaluación del resultado / estado</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="585">comparar el estado final del entorno con el estado objetivo</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="585">robusto frente a rutas alternativas creativas (tau-bench)</text>

  <rect x="775" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="945">Fiabilidad: pass^k</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="945">las k de k ejecuciones tienen éxito</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="945">si las ejecuciones fueran independientes: 90 % por ejecución → 43 % con k=8</text>

  <line x1="590" y1="234" x2="590" y2="268" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="256" font-size="10" fill="#64748b" font-style="italic" x="700">la tarea ha fallado — pero ¿dónde?</text>

  <!-- Level 2: trajectory -->
  <rect x="30" y="275" width="1120" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="301" font-size="14" font-weight="700" fill="#5b21b6" x="55">Nivel 2 · Trayectoria (caja de cristal)</text>
  <text y="319" font-size="10" fill="#5b21b6" x="55">Pregunta: ¿la ruta era correcta y eficiente?</text>

  <rect x="55" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="182">Corrección de las herramientas</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="182">determinista, sin necesidad de juez</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="182">coincidencia exacta / en orden / en cualquier orden</text>

  <rect x="330" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="457">Corrección de los argumentos</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="457">herramienta correcta, parámetros incorrectos</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="457">% de pares clave-valor rellenados correctamente</text>

  <rect x="605" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="732">Eficiencia y bucles</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="732">tool calls redundantes · convergencia de la ruta</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="732">tool calls idénticos repetidos = callejón sin salida</text>

  <rect x="880" y="335" width="235" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="997">Calidad / adherencia al plan</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="997">buen plan, ejecución desviada</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="997">fidelidad multi-turn entre turnos</text>

  <line x1="590" y1="429" x2="590" y2="463" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="451" font-size="10" fill="#64748b" font-style="italic" x="700">la ruta se rompió en el paso 3 — pero ¿por qué?</text>

  <!-- Level 3: component -->
  <rect x="30" y="470" width="1120" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="496" font-size="14" font-weight="700" fill="#9a3412" x="55">Nivel 3 · Componente (caja blanca)</text>
  <text y="514" font-size="10" fill="#9a3412" x="55">Pregunta: ¿qué decisión, herramienta, retriever o subagente ha fallado?</text>

  <rect x="55" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="225">Métricas por span</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="225">asignar puntuaciones a spans individuales de herramientas / retrieval</text>

  <rect x="415" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="585">Interpretación del output de la herramienta</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="585">respuesta válida, interpretación incorrecta — corrompe lo que viene después</text>

  <rect x="775" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="945">Atribución del fallo</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="945">el fallo visible suele ser consecuencia del bug real en un componente posterior</text>
</svg>
