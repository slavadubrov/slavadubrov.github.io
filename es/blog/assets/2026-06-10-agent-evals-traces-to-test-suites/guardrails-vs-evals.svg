<text x="32" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Los guardrails protegen antes de la entrega; las evaluaciones online miden después de la entrega.</text>
<text x="32" y="544" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un judge ejecutado inline añade latencia; un guardrail pospuesto a async deja pasar las infracciones.</text>
</svg>
