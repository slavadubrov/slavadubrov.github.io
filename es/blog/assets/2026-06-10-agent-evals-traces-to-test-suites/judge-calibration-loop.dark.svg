<path d="M32 456h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La promoción requiere acuerdo con trazas etiquetadas por humanos, no solo un veredicto válido según el schema.</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Un cambio en el modelo judge o en el prompt devuelve el bucle a la recalibración.</text>
