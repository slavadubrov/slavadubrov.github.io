<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tvr-title tvr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tvr-title">Una fila frente a un árbol: dónde se ocultan los fallos del agente</title>
  <desc id="tvr-desc">Una evaluación convencional de un modelo de lenguaje puntúa la entrada y la respuesta final. Una evaluación de un agente abre la trayectoria y revela que se omitió la verificación de identidad antes del reembolso.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="40">LA MISMA SOLICITUD DE REEMBOLSO · DOS OBJETIVOS DE EVALUACIÓN</text>

  <rect x="48" y="64" width="384" height="448" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="72" y="96">FILA · SOLO RESPUESTA</text>
  <text class="note" x="72" y="118">El recorrido desaparece; solo quedan los extremos.</text>
  <rect class="box" x="72" y="152" width="336" height="96" rx="10" />
  <text class="kind" x="92" y="186">ENTRADA</text>
  <text class="name" x="92" y="214">Reembolsar el pedido A-1002</text>
  <path class="edge" d="M240 248v40" marker-end="url(#tvr-arrow)" />
  <rect class="box" x="72" y="296" width="336" height="96" rx="10" />
  <text class="kind" x="92" y="330">SALIDA</text>
  <text class="name" x="92" y="358">Reembolso procesado</text>
  <path class="edge" d="M240 392v40" marker-end="url(#tvr-arrow)" />
  <rect class="store" x="72" y="440" width="336" height="62" rx="10" />
  <text class="kind" x="92" y="466">PUNTUACIÓN</text>
  <text class="name" x="92" y="488">La respuesta parece correcta</text>

  <rect x="472" y="64" width="440" height="448" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="496" y="96">ÁRBOL · TRAYECTORIA COMPLETA</text>
  <text class="note" x="496" y="118">Cada decisión y tool call permanece visible.</text>
  <rect class="box" x="568" y="144" width="248" height="62" rx="10" />
  <text class="kind" x="588" y="170">AGENTE</text>
  <text class="name" x="588" y="192">Planificar reembolso</text>
  <path class="edge" d="M692 206v34H572v32" marker-end="url(#tvr-arrow)" />
  <path class="edge" d="M692 240h120v32" marker-end="url(#tvr-arrow)" />
  <rect class="store" x="496" y="280" width="152" height="96" rx="10" />
  <text class="kind" x="516" y="314">HERRAMIENTA</text>
  <text class="name" x="516" y="342">Consultar pedido</text>
  <rect x="736" y="280" width="152" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="756" y="314" fill="#FF6FB6">PASO OMITIDO</text>
  <text class="name" x="756" y="342" fill="#FF6FB6">Verificar identidad</text>
  <path class="edge" d="M572 376v32h120v32" marker-end="url(#tvr-arrow)" />
  <path class="edge" d="M812 376v32H692" stroke-dasharray="7 6" marker-end="url(#tvr-arrow)" />
  <rect class="box" x="568" y="440" width="248" height="62" rx="10" />
  <text class="kind" x="588" y="466">HERRAMIENTA</text>
  <text class="name" x="588" y="488">Emitir reembolso</text>

  <defs>
    <marker id="tvr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
