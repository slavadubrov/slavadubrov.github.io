<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="pmf-title pmf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="pmf-title">Migración a pyproject.toml con verificación como prioridad</title><desc id="pmf-desc">Cinco pasos ordenados trasladan la configuración existente a pyproject.toml: inventariar los archivos existentes, clasificar su ownership, codificar las tablas de pyproject y, después, verificar los artefactos generados y el comportamiento en runtime, que es el foco de esta migración. Solo cuando la verificación se supera, el flujo retira la configuración duplicada antigua; si los artefactos o el comportamiento difieren, la verificación devuelve el trabajo a la clasificación en lugar de continuar.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="pmf-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="pmf-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="340" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Migra verificando, no borrando</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">La verificación decide qué se retira, no el orden en que se escribieron los pasos.</text>
<path d="M42 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">INVENTARIO</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B" style="font-size: 11px;"><tspan x="46">Configuración</tspan><tspan x="46" dy="1.2em">antigua</tspan></text><circle cx="32" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M176 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M176 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="180" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2" style="font-size: 11.5px;">CLASIFICACIÓN</text><text x="180" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Ownership</text><circle cx="166" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="166" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M310 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M310 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="314" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CODIFICACIÓN</text><text x="314" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Tablas</text><circle cx="300" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="300" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M444 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M444 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="448" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">VERIFICACIÓN</text><text x="448" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Artefactos</text><circle cx="434" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="434" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">4</text>
<path d="M578 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M578 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="582" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">RETIRADA</text><text x="582" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B" style="font-size: 12px;">Archivos antiguos</text><circle cx="568" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="568" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">5</text>
<path d="M152 148h14" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M286 148h14" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M420 148h14" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M554 148h14" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M494 184v40H226v-40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#pmf-arrow-flow)" /><rect x="258.5" y="212" width="203" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="360" y="228.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 11px;">difieren artefactos o conducta</text>
<path d="M32 256h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="282" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Borra la configuración antigua solo cuando los artefactos y el comportamiento coincidan.</text>
<text x="32" y="304" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">La modernización traslada el ownership entre archivos; borrar archivos no es el objetivo.</text>
</svg>
