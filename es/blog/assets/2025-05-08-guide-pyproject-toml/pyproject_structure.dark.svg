<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pps-title pps-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="pps-title">Las cuatro fronteras de propiedad en pyproject.toml</title>
  <desc id="pps-desc">Cuatro tablas tienen cuatro propietarios. Los frontends y backends de build son propietarios de build-system; los consumidores de paquetes reciben los metadatos del proyecto; los flujos de trabajo locales son propietarios de los grupos de dependencias; y cada herramienta con nombre es propietaria de su namespace. Los grupos de dependencias se resaltan como la frontera local no publicada.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .box { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#0c1210" />

  <rect class="box" x="48" y="48" width="408" height="96" rx="10" />
  <text class="kind" x="68" y="82">PROPIETARIO DEL BUILD</text>
  <text class="name" x="68" y="112">[build-system]</text>
  <path d="M48 168h408" stroke="#2b3b33" />
  <text class="note" x="68" y="190">Frontend + backend · requisitos de build aislados</text>

  <rect class="box" x="504" y="48" width="408" height="96" rx="10" fill="#1b2621" />
  <text class="kind" x="524" y="82">CONTRATO PUBLICADO</text>
  <text class="name" x="524" y="112">[project]</text>
  <path d="M504 168h408" stroke="#2b3b33" />
  <text class="note" x="524" y="190">Consumidores de paquetes · metadatos + requisitos de runtime</text>

  <rect x="48" y="232" width="408" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="68" y="266" fill="#ff6fb6">ENTORNO LOCAL</text>
  <text class="name" x="68" y="296" fill="#ff6fb6">[dependency-groups]</text>
  <path d="M48 352h408" stroke="#2b3b33" />
  <text class="note" x="68" y="374">Flujo de trabajo de contribución · test, lint y documentación no publicados</text>

  <rect class="box" x="504" y="232" width="408" height="96" rx="10" />
  <text class="kind" x="524" y="266">PROPIETARIO DE LA HERRAMIENTA</text>
  <text class="name" x="524" y="296">[tool.*]</text>
  <path d="M504 352h408" stroke="#2b3b33" />
  <text class="note" x="524" y="374">Herramienta con nombre · sus propias claves y semántica</text>
</svg>
