<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="pipeline-title pipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="pipeline-title">Ejecución secuencial y segmentada</title><desc id="pipeline-desc">Línea temporal conceptual que compara un flujo orientado a etapas, en el que todos los núcleos de la CPU terminan antes de que se inicie la GPU y la GPU permanece inactiva durante la Etapa 1, con un streaming segmentado, en el que los lotes posteriores se descargan y analizan mientras los lotes anteriores ya están en la GPU, reduciendo el tiempo de inactividad cuando las etapas están equilibradas.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="pipeline-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="pipeline-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="760" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Ejecución secuencial y segmentada</text>
<rect x="32" y="96" width="656" height="264" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">FLUJO ORIENTADO A ETAPAS</text>
<path d="M66 152h260a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M66 152h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="70" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">NÚCLEOS DE CPU 1 + 2</text><text x="70" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Descargar + analizar P1, P2</text>
<path d="M66 220h260a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M66 220h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="70" y="237.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">GPU</text><text x="70" y="267" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8B8AF">Inactiva — esperando a la CPU</text>
<path d="M352 180h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#pipeline-arrow-flow)" /><text x="368" y="168.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">barrera</text>
<path d="M410 152h112a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-112a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M410 152h112a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-132a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="414" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">CPU</text><text x="414" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8B8AF">Inactiva</text>
<path d="M410 220h112a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-112a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M410 220h112a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-132a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="414" y="237.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GPU</text><text x="414" y="267" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDF5F0" style="font-size: 11px;">Generar embeddings de P1+P2</text>
<text x="552" y="184" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">La GPU espera durante</text>
<text x="552" y="204" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">toda la Etapa 1.</text>
<rect x="32" y="400" width="656" height="280" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="428" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">STREAMING SEGMENTADO (DAFT / RAY DATA)</text>
<path d="M66 456h90a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M66 456h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="70" y="473.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU 1</text><text x="70" y="497" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0" style="font-size: 12.5px;">Descargar lotes</text>
<path d="M194 456h90a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M194 456h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="198" y="473.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU 1</text><text x="198" y="497" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">… continúa</text>
<path d="M66 516h160a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-160a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M66 516h160a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-180a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="70" y="533.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU 2</text><text x="70" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">Analizar lotes</text>
<path d="M266 516h130a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M266 516h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="270" y="533.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GPU</text><text x="270" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0" style="font-size: 11px;">Generar embeddings de lotes</text>
<path d="M166 478h18" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M236 538h20" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="56" y="596" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="56">Los lotes posteriores se descargan y analizan mientras los anteriores ya están generando</tspan><tspan x="56" dy="1.2em">embeddings en la GPU.</tspan></text>
<path d="M56 632h600" stroke="#2B3B33" stroke-width="1" />
<text x="56" y="656" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;"><tspan x="56">Más solapamiento: el throughput se mantiene más alto porque ninguna etapa espera a que todas las demás terminen</tspan><tspan x="56" dy="1.2em">primero.</tspan></text>
<path d="M32 704h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="730" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">El solapamiento puede reducir el tiempo de inactividad cuando las etapas están equilibradas.</text>
</svg>
