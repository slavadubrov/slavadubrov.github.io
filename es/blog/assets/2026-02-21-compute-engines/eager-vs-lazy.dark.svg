<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Ejecución eager y lazy</title><desc id="eagerlazy-desc">Un pipeline eager lee todas las columnas y después hace una copia completa en RAM en cada paso de filter, groupby y resultado, usando entre 2 y 3 veces el tamaño del dataset en memoria. Un motor lazy construye un plan de consulta a partir de scan, filter y group_by; un optimizador aplica predicate pushdown y column pruning, y después collect() lo ejecuta una sola vez en paralelo mediante lotes en streaming. Pandas tarda unos 365 segundos en el benchmark PDS-H SF-10; Polars tarda unos 3,89 segundos.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
