<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rustarrow-title rustarrow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rustarrow-title">Ejecución nativa e intercambio compatible con Arrow</title><desc id="rustarrow-desc">Cuatro motores — Polars, DataFusion, Daft y Ray Data — se basan en una base compartida de componentes nativos de Rust y el formato columnar Apache Arrow. En conjunto, ofrecen ausencia de recolector de basura tracing, un intercambio zero-copy más barato mediante la interfaz PyCapsule y concurrencia comprobada en tiempo de compilación. El comportamiento exacto del runtime y de las copias varía según el motor y el operador.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
