<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="uvproj-title uvproj-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="uvproj-title">Repozytorium zatwierdza trzy dane wejściowe; uv rozwiązuje zależności i wyprowadza resztę.</title><desc id="uvproj-desc">pyproject.toml, kod źródłowy i testy oraz .python-version to zatwierdzone dane wejściowe. uv rozwiązuje je do skoncentrowanego uv.lock — wieloplatformowego grafu zależności — a następnie używa tego pliku do zbudowania jednorazowego lokalnego .venv i jednorazowej pamięci podręcznej pobrań.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="uvproj-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="uvproj-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="736" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Co zatwierdzasz, a co wyprowadza uv</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Lock i żądanie wersji Pythona tworzą jednorazowe środowisko; pamięć podręczna również jest</tspan><tspan x="32" dy="1.2em">jednorazowa.</tspan></text>
