<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zatwierdź pyproject.toml, kod źródłowy i testy oraz świadomie wybraną wersję .python-version.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">uv rozwiązuje je do uv.lock; pamięć podręczna i .venv są wyprowadzone oraz jednorazowe.</text>
