<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Większość narzędzi zajmuje to samo miejsce. Wyróżniony panel pokazuje, gdzie intuicja z Python</text>
