<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="biserve-title biserve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="biserve-title">Indeksowanie offline z bi-encoderem a obsługa zapytań online</title><desc id="biserve-desc">Offline dokumenty są kodowane wsadowo raz i przechowywane w indeksie wektorowym. Online pojedyncze zapytanie jest kodowane i wyszukiwane w tym indeksie. Opóźnienie zależy od encodera, sprzętu, indeksu, filtrów i docelowego poziomu recall, dlatego mierz osobno kroki kodowania i wyszukiwania.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="biserve-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="biserve-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="590" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Indeksowanie offline, zapytanie online</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">embeddingi dokumentów są obliczane raz i przechowywane; kodowanie zapytania i wyszukiwanie są</tspan><tspan x="32" dy="1.2em">wykonywane przy każdym żądaniu.</tspan></text>
<rect x="32" y="96" width="656" height="180" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">OFFLINE · CZAS INDEKSOWANIA</text>
<path d="M58 144h120a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-120a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 144h120a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-140a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">KORPUS</text><text x="62" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">N dokumentów</text>
<path d="M214 144h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M214 144h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="218" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">KODOWANIE</text><text x="218" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B" style="font-size: 11px;">Kodowanie wsadowe</text>
<path d="M340 144h150a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-150a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M340 144h150a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-170a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="344" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">EMBEDDINGS</text><text x="344" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">Macierz N × D</text>
<path d="M526 144h130a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M526 144h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="530" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">INDEKS</text><text x="530" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">HNSW / IVF</text>
<path d="M188 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M314 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M500 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="236" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">Wykonywane raz, przechowywane na dysku. 8 500 × 384 ≈ 13 MB w demonstracji; 1B × 768 ≈ 3</tspan><tspan x="48" dy="1.2em">TiB w skali.</tspan></text>
<rect x="32" y="300" width="656" height="180" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="328" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ONLINE · CZAS ZAPYTANIA</text>
<path d="M58 348h120a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-120a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 348h120a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-140a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="62" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ZAPYTANIE</text><text x="62" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" style="font-size: 11px;">Zapytanie użytkownika</text>
<path d="M214 348h150a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-150a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M214 348h150a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-170a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="218" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">KODOWANIE</text><text x="218" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">Pojedyncze kodowanie</text>
<path d="M400 348h130a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M400 348h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="404" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">WYSZUKIWANIE</text><text x="404" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">Wyszukiwanie ANN</text>
<path d="M566 348h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M566 348h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="570" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">WYNIK</text><text x="570" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B">Top-K</text>
<path d="M188 376h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M374 376h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M540 376h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="440" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">Mierz osobno krok kodowania i krok wyszukiwania; oba wpływają na opóźnienie zapytania</tspan><tspan x="48" dy="1.2em">end-to-end.</tspan></text>
<path d="M32 508h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="534" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Podział na część offline/online to przewaga architektoniczna: embeddingi dokumentów nie muszą być</text>
<text x="32" y="556" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">ponownie obliczane w czasie obsługi zapytania.</text>
