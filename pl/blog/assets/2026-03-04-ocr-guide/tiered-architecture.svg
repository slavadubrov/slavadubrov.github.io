<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1216" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="tieredarch-title tieredarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tieredarch-title">Produkcyjny OCR kieruje dokumenty przez skalibrowane poziomy awaryjne — od tekstu natywnego, przez szybki OCR, po silniejszy model — a weryfikację przez człowieka rezerwuje dla nierozstrzygniętych lub wysokiego ryzyka pól.</title><desc id="tieredarch-desc">Najpierw dokumenty są sprawdzane pod kątem użytecznej natywnej warstwy tekstowej; jeśli jej brak, przechodzą przez szybki lokalny OCR i skalibrowaną kontrolę ufności, a następnie — gdy kontrola się nie powiedzie — są kierowane do silniejszego modelu specjalistycznego lub ogólnego. Ścieżki zakończone powodzeniem zbiegają się na etapie przetwarzania końcowego i tworzenia ustrukturyzowanych danych wyjściowych. Tylko nierozstrzygnięte lub wysokiego ryzyka pola trafiają do weryfikacji przez człowieka, a zweryfikowane wyniki wracają do tych samych ustrukturyzowanych danych wyjściowych.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tieredarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="tieredarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="1216" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Eskaluj tylko po nieudanej kontroli</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">Natywny tekst i pomyślne kontrole ufności prowadzą bezpośrednio do ustrukturyzowanych danych wyjściowych.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tylko nierozstrzygnięte lub wysokiego ryzyka pola trafiają do człowieka.</text>
