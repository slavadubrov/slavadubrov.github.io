<text x="32" y="1184" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Weryfikacja przez człowieka to najdroższy poziom — rezerwuj ją dla przypadków, których nie</tspan><tspan x="32" dy="1.2em">rozstrzygają kontrole automatyczne.</tspan></text>
