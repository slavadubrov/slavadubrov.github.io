<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ocrstack-title ocrstack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ocrstack-title">Jakość OCR ogranicza każdy dalszy system przetwarzania dokumentów, a utraconych informacji nie można później odzyskać.</title><desc id="ocrstack-desc">Dokumenty i obrazy przechodzą przez etap oceny jakości ekstrakcji; wynikowy rekord tekstu i układu jest jedynym dostępnym dowodem dla wyszukiwania i odpowiadania, decyzji agentów oraz dalszych procesów domenowych. Pominiętego lub zniekształconego tekstu nie można odzyskać na późniejszych etapach.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ocrstack-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ocrstack-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="704" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Jakość OCR ogranicza każdy dalszy system przetwarzania dokumentów</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Wyszukiwanie, agenci i procesy mogą korzystać wyłącznie z dowodów zachowanych podczas ekstrakcji.</text>
