<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">Katalog pamięci dokumentów zawiera cztery foldery tematyczne we wspólnym katalogu głównym, a cztery operacje — odczyt, zapis, listowanie i wyszukiwanie — działają we wszystkich z nich.</title><desc id="docmem-desc">Wspólny katalog .agent-memory zawiera pliki Markdown w folderach user-profiles, research, conventions i learnings. Niewielki interfejs pamięci plikowej udostępnia cztery operacje, które rozwiązują ścieżkę docelową we wspólnym katalogu głównym: read zwraca zawartość dokumentu, write tworzy go lub zastępuje, list dopasowuje ścieżki według wzorca glob, a search zwraca akapity pasujące do słowa kluczowego.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
