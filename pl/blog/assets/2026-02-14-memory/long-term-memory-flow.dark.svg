<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ltmflow-title ltmflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ltmflow-title">Przywoływanie z pamięci zimnej obejmuje pięć kroków — od nowej wiadomości do spersonalizowanego kontekstu planowania — a rescoring decyduje, co faktycznie trafi do modelu.</title><desc id="ltmflow-desc">Nowa wiadomość użytkownika jest kodowana do embeddingu o 1536 wymiarach, a następnie Qdrant wyszukuje wspomnienia przefiltrowane do faktów należących do tego użytkownika. Kandydaci są poddawani rescoringowi pod kątem trafności, aktualności i ważności, zamiast pozostawać przy surowym podobieństwie cosinusowym; tylko zwycięskie wyniki są wstrzykiwane do kontekstu plannera.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ltmflow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ltmflow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="512" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Przywoływanie z pamięci zimnej — pięć kroków</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Filtr użytkownika zawęża własność; rescoring wybiera treści warte budżetu kontekstu.</text>
