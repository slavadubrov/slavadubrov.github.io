<text x="32" y="458" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Filtr użytkownika określa zakres wyszukiwania, a nie uprawnienia — serwer nadal musi zweryfikować podmiot żądający.</text>
<text x="32" y="480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Surowe podobieństwo cosinusowe to sygnał początkowy; aktualność i ważność zapobiegają wygrywaniu nieaktualnych dopasowań.</text>
</svg>
