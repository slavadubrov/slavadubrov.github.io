<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="fullmem-title fullmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fullmem-title">Pamięć hot, cold i dokumentowa łączą się wokół jednego harnessu agenta ścieżkami, które są synchroniczne z żądaniem albo odroczone do wykonania w tle.</title><desc id="fullmem-desc">Żądanie użytkownika trafia do harnessu agenta, który zapisuje i przywraca checkpointy na ścieżce hot, synchronicznie przed planowaniem odczytuje fakty długoterminowe, a zapis nowych faktów odracza do zadania w tle; podczas każdego wywołania planera odczytuje też pamięć dokumentową, również odraczając nowe zapisy. Linie ciągłe oznaczają ścieżkę wykonania lub odzyskiwania; linie przerywane — aktualizacje w tle, które nigdy nie mogą blokować pętli rozumowania.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fullmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="fullmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Trzy ścieżki pamięci, jeden harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Harness decyduje, co trafia do modelu; magazyny tylko przechowują stan do tego momentu.</text>
