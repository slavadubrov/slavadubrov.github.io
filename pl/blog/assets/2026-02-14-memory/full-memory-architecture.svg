<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Odczyt z pamięci cold blokuje planowanie; wyodrębnianie i zapisywanie nowych faktów — nie.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">To harness, a nie pojedynczy magazyn, decyduje, co faktycznie trafia do okna kontekstu modelu.</text>
