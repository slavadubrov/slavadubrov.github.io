<text x="32" y="490" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Progressive disclosure is the seventh piece — load detail only when the decision needs it.</text>
