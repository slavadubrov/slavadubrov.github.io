<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Cykl życia przebiega dla każdej decyzji — ponowne użycie jednego dużego kontekstu dla całego przebiegu</text>
<text x="32" y="624" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">tworzy nieaktualne dowody i dostarcza każdemu etapowi materiały, których nie potrzebuje.</text>
