<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 678" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="lifecycle-title lifecycle-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="lifecycle-title">Składanie kontekstu przebiega jako ośmioetapowy cykl życia dla każdej decyzji — od rozstrzygnięcia zaufanego kontekstu żądania, przez zweryfikowane wykonanie, po zapisanie proweniencji.</title><desc id="lifecycle-desc">Dla każdej decyzji agenta wykonywanych jest osiem uporządkowanych etapów: rozstrzygnięcie zaufanego kontekstu żądania, wybór kolejnej decyzji, wyszukiwanie w zakresie, ranking i budżetowanie, składanie z granicami zaufania, wygenerowanie typowanej propozycji, walidacja i wykonanie, a następnie zapisanie proweniencji i wyniku.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="lifecycle-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="lifecycle-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="678" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Składanie kontekstu to cykl życia dla każdej decyzji</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Dla każdej decyzji wykonywanych jest osiem uporządkowanych operacji, zakończonych zapisanym</tspan><tspan x="32" dy="1.2em">manifestem.</tspan></text>
