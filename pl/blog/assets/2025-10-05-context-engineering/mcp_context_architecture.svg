<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="mcp-title mcp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mcp-title">MCP standardizes the tool-calling protocol; it does not authorize tool use or vouch for returned content.</title><desc id="mcp-desc">An MCP host aggregates resources, prompts, and tools from filesystem, database, Slack or API, and memory servers. The specification standardizes how clients interact with these servers but does not authorize their use. Credential and policy checks form a gateway outside the protocol description before content reaches the agent.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mcp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="mcp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="560" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">MCP standardizes the protocol, not the trust</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The specification does not authorize tool use or vouch for returned content.</text>
