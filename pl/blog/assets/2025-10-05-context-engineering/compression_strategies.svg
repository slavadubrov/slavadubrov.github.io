<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="compress-title compress-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="compress-title">Kompresja oddziela zwięzły zestaw roboczy przechowywany w prompcie od kanonicznych magazynów dostępnych adresowalnie poza nim.</title><desc id="compress-desc">Rosnący kontekst — kolejne tury rozmowy, dane wyjściowe narzędzi i pobrane fragmenty — jest kompresowany do dwóch wyników: zwięzłego zestawu decyzji i otwartych pytań, który pozostaje w prompcie, oraz kanonicznych magazynów stanu zadania, artefaktów i wersji dowodów, które pozostają adresowalne poza promptem i można je ponownie pobrać.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="compress-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="compress-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="392" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Kompresuj tekst; zachowaj stan</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Optymalizuj tokeny na zadanie, nie żądanie.</text>
<path d="M42 112h212a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-212a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M42 112h212a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-232a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">WEJŚCIE</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Rosnący kontekst</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tury, dane wyjściowe, fragmenty</text>
<path d="M306 112h116a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-116a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M306 112h116a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-136a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="310" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">KOMPRESJA</text><text x="310" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Kompresja</text><text x="310" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="310">Z założenia</tspan><tspan x="310" dy="1.2em">stratna</tspan></text>
<path d="M264 164h32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M432 164v-80h32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M432 164v56h32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M474 32h204a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M474 32h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="478" y="49.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">W PROMPCIE</text><text x="478" y="93" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Zwięzły zestaw</text><text x="478" y="115" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Decyzje + otwarte pytania</text>
<path d="M474 168h204a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M474 168h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="478" y="185.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ADRESOWALNE</text><text x="478" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Kanoniczne magazyny</text><text x="478" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Stan + indeks artefaktów</text>
<path d="M32 312h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="338" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Optymalizuj liczbę tokenów na pomyślnie wykonane zadanie, uwzględniając ponowne pobieranie i</tspan><tspan x="32" dy="1.2em">odzyskiwanie — nie na żądanie.</tspan></text>
</svg>
