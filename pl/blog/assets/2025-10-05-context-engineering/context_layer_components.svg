<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 544" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="layers-title">Seven inputs feed the context assembler, each with exactly one job.</title><desc id="layers-desc">Instructions state durable behavior, task state records canonical commitments, examples demonstrate edge decisions, knowledge supplies cited evidence, memory supplies scoped continuity, and tool contracts expose capabilities. A seventh discipline, progressive disclosure, loads detail only when the current decision needs it. The assembler composes these per decision rather than reusing one accumulated context.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="layers-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="layers-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="544" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Seven inputs feed the context assembler</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Each source has one job; the assembler composes them per decision.</text>
