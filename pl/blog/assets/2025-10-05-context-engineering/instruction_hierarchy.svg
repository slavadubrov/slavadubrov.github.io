<rect width="720" height="670" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Priorytet instrukcji zależy od dostawcy</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Nazwy ról różnią się między dostawcami; egzekwowanie zasad jest kwestią architektury, nie tekstu.</text>
