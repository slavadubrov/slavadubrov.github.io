<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">Hierarchia uprawnień instrukcji zależy od dostawcy, więc uniwersalna hierarchia ról jest błędem; kod aplikacji stanowi wspólną granicę egzekwowania zasad.</title><desc id="instr-desc">Model Spec OpenAI nadaje instrukcjom platformy lub systemu, dewelopera i użytkownika różne poziomy uprawnień. Anthropic Messages API udostępnia parametr system na najwyższym poziomie oraz komunikaty użytkownika i asystenta, bez odpowiednika roli dewelopera. Niezależnie od nazw ról u dostawcy to kod aplikacji autoryzuje narzędzia, dostęp do danych i skutki uboczne.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
