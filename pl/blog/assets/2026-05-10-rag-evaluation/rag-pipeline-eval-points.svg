<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="ragpipeline-title ragpipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ragpipeline-title">Każdy etap pipeline’u RAG ma przypisany zestaw metryk diagnostycznych.</title><desc id="ragpipeline-desc">Ścieżka ingestii — parsowanie, czyszczenie, dzielenie na fragmenty, wzbogacanie, embedding, indeksowanie — ma przypisane metryki ingestii. Ścieżka zapytania — przepisywanie, filtrowanie, wyszukiwanie, reranking, składanie kontekstu — ma przypisane metryki czasu obsługi zapytania i jest głównym tematem, ponieważ filtrowanie może usunąć dowody przed rankingiem. Ścieżka odpowiedzi — generowanie, weryfikacja twierdzeń, cytowanie, zwracanie, obserwacja ruchu — ma przypisane metryki odpowiedzi i produkcyjne.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ragpipeline-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="ragpipeline-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="620" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Umieść metrykę diagnostyczną obok każdego etapu</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Przetestuj cały system przed wydaniem; sprawdź każdy etap, aby znaleźć przyczynę awarii.</text>
