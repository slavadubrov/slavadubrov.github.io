<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="di-title di-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="di-title">Zamierzony przepływ od propozycji do zatwierdzonego stanu</title><desc id="di-desc">Zamierzony przepływ: przeanalizuj i znormalizuj niezaufaną propozycję, autoryzuj aktora, wyegzekwuj regułę agregatu, a następnie atomowo zatwierdź stan i outbox. Błędy analizy, autoryzacji, reguł domenowych lub współbieżnego zapisu przerywają operację bez zatwierdzania zmian. Fragmenty artykułu pomijają transakcję, która zapewniłaby tę gwarancję.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="di-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="di-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="696" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Zamierzony przepływ od propozycji do zatwierdzonego stanu</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Fragmenty kodu pomijają transakcję wymaganą do atomowego zatwierdzenia.</text>
