<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="record-experiment-title record-experiment-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="record-experiment-title">Ta demonstracja deleguje propozycje do agenta LLM</title><desc id="record-experiment-desc">Zarejestrowane błędy trafiają do agenta. Agent proponuje zmianę konfiguracji SGR. Python ją waliduje, testuje deterministyczne narzędzie pamięci i porównuje wynik. Zaakceptowane i odrzucone próby stają się informacją zwrotną dla następnego wywołania modelu. Wybór rodzica do kolejnego eksperymentu nie autoryzuje wdrożenia; przegląd wydania przez człowieka pozostaje oddzielny.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="record-experiment-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="record-experiment-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="880" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Ta demonstracja: agent wybiera następną zmianę</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Agent proponuje ustawienia; Python je testuje i zwraca informację zwrotną.</text>
