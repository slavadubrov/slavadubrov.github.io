<path d="M58 432h236a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-236a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 432h236a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-256a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="449.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">MAGAZYN</text><text x="62" y="483" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Historia eksperymentów</text><text x="62" y="505" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Hipoteza, konfiguracja, wyniki</text><text x="62" y="525" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Skróty i rekordy przeglądu</text>
