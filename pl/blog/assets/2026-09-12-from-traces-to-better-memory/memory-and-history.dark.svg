<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="two-memories-title two-memories-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="two-memories-title">Pamięć użytkownika i historia eksperymentów mają różnych właścicieli i różne zadania</title><desc id="two-memories-desc">Cel weryfikuje proponowane fakty o użytkowniku, zarządza wersjonowaną historią w określonym zakresie i wyszukuje rekordy dla jednego pytania. Uruchamiacz eksperymentów resetuje stan celu między zadaniami oraz zapisuje ślady i wyniki w osobnej historii. Pamięć użytkownika to dane celu; historia eksperymentów wyjaśnia zmiany w celu.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="two-memories-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="two-memories-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="800" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Dwa rodzaje pamięci, dwa oddzielne magazyny</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Fakty asystenta różnią się od rejestru eksperymentów inżyniera.</text>
<rect x="32" y="112" width="656" height="232" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="138" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">CEL — JEDNO SYNTETYCZNE ZADANIE ASYSTENTA</text>
