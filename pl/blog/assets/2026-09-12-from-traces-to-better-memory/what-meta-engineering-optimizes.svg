<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="what-meta-engineering-optimizes-title what-meta-engineering-optimizes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="what-meta-engineering-optimizes-title">Meta-inżynieria optymalizuje kompletny system</title><desc id="what-meta-engineering-optimizes-desc">Meta-inżynieria dobiera eksperymenty, które mogą zmieniać sformułowanie promptu, składanie kontekstu, konfigurację pętli i strukturę grafu. Wszystkie cztery elementy są częściami jednego badanego systemu. Ewaluacja mierzy wyniki tego systemu i zwraca dane do kolejnego eksperymentu. Te cztery obszary to nakładające się wybory projektowe, a nie etapy historyczne.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
