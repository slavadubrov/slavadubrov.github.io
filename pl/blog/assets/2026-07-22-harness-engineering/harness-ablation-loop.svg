<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hal-title">Test ablatywny w parach dla przekazywania postępu</title><desc id="hal-desc">Przykładowy eksperyment utrzymuje stałe: model, zestaw zadań, środowisko, grader oraz łączny budżet w dwóch sparowanych uruchomieniach z tego samego checkpointu migracji płatności z ustalonym seedem. Wariant kontrolny wyłącza przekazywanie postępu, a skoncentrowany wariant badany włącza wyłącznie ten mechanizm. Porównanie mierzy liczbę zduplikowanych działań narzędzi po wznowieniu, a opcjonalne przekazywanie jest zachowywane tylko wtedy, gdy uzyskana korzyść rekompensuje jego koszt. Wymagane kontrole bezpieczeństwa i akceptacji pozostają włączone w obu wariantach.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hal-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="hal-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="1040" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Test ablatywny w parach dla przekazywania postępu</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Przykład: wznowiona migracja płatności ponownie wykonuje ukończone działania.</text>
