<text x="32" y="962" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Komponent ma sens, gdy wzrost metryki docelowej pokrywa jego dodatkowy koszt.</text>
<text x="32" y="984" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Uruchamiaj jedną ablacją na hipotezę; nie pozwalaj, by guardrails narastały bez pomiaru.</text>
