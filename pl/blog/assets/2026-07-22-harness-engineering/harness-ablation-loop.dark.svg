<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hal-title">Parowany test ablacyjny przekazania postępu</title><desc id="hal-desc">Stałe: model, zestaw zadań, środowisko, grader i całkowity budżet zasilają dwie parowane próby z tego samego, zainicjalizowanego checkpointu migracji płatności. Wariant kontrolny wyłącza przekazanie postępu, a ukierunkowany wariant testowy włącza wyłącznie ten mechanizm. Porównanie mierzy liczbę zduplikowanych działań narzędzi po wznowieniu, a komponent zostaje zachowany tylko wtedy, gdy uzyskana poprawa rekompensuje jego koszt.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hal-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="hal-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1040" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Parowana ablacja przekazania postępu</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Zaobserwowana awaria: wznowione migracje płatności powtarzają pracę już ukończoną przez</tspan><tspan x="32" dy="1.2em">poprzednią sesję.</tspan></text>
