<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="calib-title calib-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="calib-title">Skalibruj i przetestuj skwantyzowany model przed wdrożeniem.</title><desc id="calib-desc">Najpierw wybierz recepturę, w razie potrzeby przeprowadź kalibrację, wykonaj kwantyzację, a następnie przetestuj model w docelowym środowisku uruchomieniowym. Przed wdrożeniem sprawdź jakość, dokładność zadań, działanie z długim kontekstem, przepustowość, TTFT, opóźnienie między tokenami oraz pamięć — zanim checkpoint zostanie wydany.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="calib-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="calib-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="520" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Przetestuj skwantyzowany model przed wdrożeniem</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Najpierw wybierz recepturę; użyj oddzielnych próbek do kalibracji i ewaluacji hold-out.</text>
<path d="M42 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RECEPTURA</text><text x="46" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Wybierz metodę</text><text x="46" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Format +</text><text x="46" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">obsługa runtime</text>
<path d="M230 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M230 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="234" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KALIBRACJA</text><text x="234" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Jeśli wymagana</text><text x="234" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zanonimizowany ruch,</text><text x="234" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">równe długości</text>
<path d="M418 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KWANTYZACJA</text><text x="422" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17.5px;">Zastosuj recepturę</text><text x="422" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zapisz skompresowany</text><text x="422" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">checkpoint</text>
<path d="M606 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M606 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="610" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TEST SERWOWANIA</text><text x="610" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Docelowy runtime</text><text x="610" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Sprzęt,</text><text x="610" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12px;">charakterystyka obciążenia</text>
<path d="M204 188h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#calib-arrow-flow)" />
<path d="M392 188h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#calib-arrow-flow)" />
<path d="M580 188h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#calib-arrow-flow)" />
<path d="M682 240v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#calib-arrow-flow)" />
<path d="M42 312h716a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 312h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="329.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KONTROLA · WYDANIE</text><text x="46" y="363" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Zaakceptuj dopiero po pomyślnym przejściu wszystkich kontroli</text><text x="46" y="385" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Jakość, zadania, długi kontekst</text><text x="46" y="405" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Przepustowość, TTFT, ITL, pamięć</text>
<path d="M32 440h736" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="466" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Załadowanie modelu to dopiero pierwsza kontrola.</text>
<text x="32" y="488" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Zaakceptuj model dopiero wtedy, gdy zarówno kontrole jakości, jak i kontrole serwowania zakończą się pomyślnie w</tspan><tspan x="32" dy="1.2em">docelowym środowisku uruchomieniowym.</tspan></text>
</svg>
