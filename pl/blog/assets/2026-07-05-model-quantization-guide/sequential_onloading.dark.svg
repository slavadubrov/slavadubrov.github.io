<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="seqload-title seqload-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="seqload-title">Sequential layer onloading keeps offline quantization memory bounded to one layer</title><desc id="seqload-desc">For each transformer layer, the runtime onloads the layer from CPU or disk in BF16, allocates calibration and Hessian buffers sized to that one layer, rounds and stores the quantized layer, then frees the GPU and moves to the next layer. Peak GPU memory tracks one active layer rather than the whole model, which is what lets a 70B-parameter model be quantized on a single 80GB GPU.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="seqload-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="seqload-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="696" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Quantizing layer by layer keeps memory bounded</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Peak GPU memory tracks one active layer, not the whole checkpoint.</text>
<rect x="32" y="112" width="656" height="336" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="138" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">FOR EACH LAYER, i = 1..L</text>
<path d="M58 168h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M58 168h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="62" y="185.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ONLOAD</text><text x="62" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Layer i to GPU (BF16)</text><text x="62" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">From CPU / disk RAM</text>
<path d="M402 168h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M402 168h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="406" y="185.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">BUFFERS</text><text x="406" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Hessian + calibration acts</text><text x="406" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Sized to one layer only</text>
<path d="M58 304h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5"/><path d="M58 304h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8"/><text x="62" y="321.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">QUANTIZE</text><text x="62" y="365" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Round and store layer i</text><text x="62" y="387" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">GPTQ-style reconstruction</text>
<path d="M402 304h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5"/><path d="M402 304h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8"/><text x="406" y="321.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">OFFLOAD</text><text x="406" y="365" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Free GPU, keep layer i</text><text x="406" y="387" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Move to next layer i+1</text>
<path d="M348 220h44" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#seqload-arrow-flow)"/>
<path d="M540 272v16H198v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#seqload-arrow-flow)"/>
<path d="M348 356h44" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#seqload-arrow-flow)"/>
<path d="M540 408v8H40v-196h8" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#seqload-arrow-flow)"/><rect x="203" y="404" width="174" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1"/><text x="290" y="420.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">next layer, i = i + 1</text>
<path d="M42 488h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><path d="M42 488h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6"/><text x="46" y="505.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · BOUNDED MEMORY</text><text x="46" y="549" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Peak GPU stays one layer, not the whole model</text><text x="46" y="571" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A 70B model can be quantized on a single 80GB GPU this way</text>
<path d="M32 616h656" stroke="#2B3B33" stroke-width="1"/>
<text x="32" y="642" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">This is what lets a 70B model be quantized end-to-end on a single 80GB GPU.</text>
<text x="32" y="664" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Serving is stricter: every quantized layer must stay resident at once, alongside the KV cache.</text>
</svg>
