<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1096" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="qdf-title qdf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="qdf-title">Model quantization decision flowchart</title><desc id="qdf-desc">A flowchart guiding practitioners from deployment goals to GGUF, NF4, W4A16, INT8, FP8, or NVFP4. vLLM is a separate serving-engine check, not the destination for every path.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="qdf-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="qdf-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="1096" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Choosing a quantization path</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Start from the serving goal. vLLM is a separate serving-engine check, not the destination for every path.</text>
