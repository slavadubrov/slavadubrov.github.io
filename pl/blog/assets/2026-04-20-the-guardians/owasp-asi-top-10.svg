<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="owaspasi-title owaspasi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="owaspasi-title">Kategorie OWASP ASI pomagają mapować zagrożenia na mechanizmy kontroli tekstu, tożsamości, wykonywania i łańcucha dostaw.</title><desc id="owaspasi-desc">Przejęcie celu i zatruwanie pamięci pokazują, gdzie może pomóc analiza tekstu. Kategorie nakładają się na siebie i wymagają uzupełniających mechanizmów kontroli tożsamości, wykonywania, orkiestracji i łańcucha dostaw.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="owaspasi-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="owaspasi-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="920" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Mapuj zagrożenia na egzekwowalne mechanizmy kontroli</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Kategorie nakładają się na siebie; to lista kontrolna pokrycia, a nie ranking incydentów.</text>
<rect x="32" y="128" width="656" height="184" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="154" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ANALIZA TEKSTU MOŻE POMÓC</text>
<path d="M58 192h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 192h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASI01</text><text x="62" y="253" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Przejęcie celu agenta</text><text x="62" y="275" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">przekierowanie instrukcji</text>
<path d="M378 192h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M378 192h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="382" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASI06</text><text x="382" y="253" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Zatruwanie pamięci</text><text x="382" y="275" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">RAG i trwały kontekst</text>
<rect x="32" y="344" width="656" height="304" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="372" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">DODATKOWE ZAGROŻENIA I MECHANIZMY KONTROLI</text>
<path d="M58 408h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 408h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASI02 + ASI05</text><text x="62" y="469" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Niewłaściwe użycie narzędzi</text><text x="62" y="491" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">nieoczekiwane wykonanie kodu</text>
<path d="M378 408h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M378 408h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="382" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASI03 + ASI07</text><text x="382" y="469" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Nadużycie tożsamości</text><text x="382" y="491" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">niezabezpieczone kanały agentów</text>
<path d="M58 528h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 528h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="545.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASI04 + ASI08</text><text x="62" y="589" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Łańcuch dostaw</text><text x="62" y="611" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">kaskadowe awarie agentów</text>
<path d="M378 528h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M378 528h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="382" y="545.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASI09 + ASI10</text><text x="382" y="589" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Zaufanie ludzi</text><text x="382" y="611" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="382">agenci działający wbrew założeniom, dryf</tspan><tspan x="382" dy="1.2em">celu</tspan></text>
<path d="M42 680h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M42 680h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="46" y="697.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ZAKRES · CZEGO DOTYCZY TEN ARTYKUŁ</text><text x="46" y="741" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Każda ścieżka ataku wymaga egzekwowalnych mechanizmów kontroli</text><text x="46" y="763" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">tożsamość, polityka narzędzi, sandboxing, łańcuch dostaw, monitorowanie</text>
<path d="M32 824h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="850" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">OWASP ASI Top 10 na 2026 rok, opublikowane 9 grudnia 2025 r.</text>
<text x="32" y="872" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Analiza tekstu może pomóc; żadna kategoria nie należy wyłącznie do filtra treści.</text>
</svg>
