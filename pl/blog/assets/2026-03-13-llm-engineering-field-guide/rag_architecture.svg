<text x="32" y="446" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Lepszy generator nie odzyska pominiętych dowodów — oceniaj etapy osobno.</text>
<text x="32" y="468" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Dodaj reranking lub transformację zapytania po analizie realnych braków.</text>
