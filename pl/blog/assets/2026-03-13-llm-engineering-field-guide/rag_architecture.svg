<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rag-title">RAG rozdziela ścieżkę offline pozyskiwania danych od ścieżki online obejmującej wyszukiwanie, reranking i generowanie.</title><desc id="rag-desc">Potok offline analizuje surowe dokumenty, przekształca je w czysty tekst, dzieli na fragmenty, tworzy embedding każdego fragmentu i zapisuje wektory. W czasie zapytania ten sam embedder — po opcjonalnej transformacji zapytania, takiej jak HyDE lub rozszerzenie multi-query — zasila hybrydowe wyszukiwanie dense-plus-BM25 w tym magazynie wektorów; reranker ocenia pobranych kandydatów względem zapytania, a model generatywny odpowiada, korzystając z kontekstu po rerankingu.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="rag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Ingestia offline; wyszukiwanie i generowanie na żądanie</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ten sam embedder tworzy embedding zapytania, chyba że je przekształcisz.</text>
