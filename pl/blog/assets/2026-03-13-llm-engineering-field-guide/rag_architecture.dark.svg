<path d="M32 420h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="446" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Lepszy generator nie odzyska pominiętych dowodów — oceniaj etapy osobno.</text>
<text x="32" y="468" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Dodaj reranking lub transformację zapytania po analizie realnych braków.</text>
