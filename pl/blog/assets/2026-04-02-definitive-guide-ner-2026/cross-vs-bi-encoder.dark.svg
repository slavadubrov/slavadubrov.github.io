<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="crossbi-title crossbi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="crossbi-title">Cross-encoder powtarza kodowanie etykiet dla każdego dokumentu; bi-encoder je buforuje</title><desc id="crossbi-desc">Cross-encoder wspólnie koduje etykiety ponownie dla każdego dokumentu, więc przepustowość gwałtownie spada wraz ze wzrostem listy etykiet. Bi-encoder koduje etykiety i tekst oddzielnie, dzięki czemu embeddingi etykiet można obliczyć wstępnie raz i wielokrotnie wykorzystać, unikając powtarzanego kodowania etykiet, choć obliczanie wyników dla par fragment–etykieta nadal wymaga mocy obliczeniowej. Przy 1 024 typach encji bi-encoder z etykietami obliczonymi wstępnie traci tylko 5,2% przepustowości względem jednej etykiety, podczas gdy cross-encoder traci 98,7%.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="crossbi-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="crossbi-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="560" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Buforuj etykiety, nie tylko tekst</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Buforowane etykiety oszczędzają kodowanie; obliczanie wyników kandydatów nadal wymaga pracy.</text>
<rect x="32" y="128" width="304" height="320" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6"><tspan x="48">CROSS-ENCODER · POWTARZANIE</tspan><tspan x="48" dy="1.2em">PRACY</tspan></text>
<rect x="384" y="128" width="304" height="320" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="400" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6"><tspan x="400">BI-ENCODER · PONOWNE</tspan><tspan x="400" dy="1.2em">WYKORZYSTANIE PRACY</tspan></text>
<path d="M58 172h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 172h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">WEJŚCIE</text><text x="62" y="233" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Sekwencja etykiet i tekstu</text><text x="62" y="255" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="62">Ponownie koduje każdą etykietę dla</tspan><tspan x="62" dy="1.2em">każdego dokumentu</tspan></text>
<path d="M58 292h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 292h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="309.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PRZETWARZANIE</text><text x="62" y="353" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Wspólna uwaga</text><text x="62" y="375" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="62">Pełne ponowne kodowanie dla</tspan><tspan x="62" dy="1.2em">każdego dokumentu</tspan></text>
<text x="48" y="414" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Przy 1 024 typach: 10,7 → 0,14 egz./s</text>
<text x="48" y="436" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">(spadek o 98,7%, gliner_small-v2.5)</text>
<path d="M410 172h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M410 172h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PRZETWARZANIE</text><text x="414" y="233" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Enkoder tekstu</text><text x="414" y="255" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="414">ModernBERT; raz dla każdego</tspan><tspan x="414" dy="1.2em">dokumentu</tspan></text>
<path d="M410 292h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M410 292h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="414" y="309.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">OBSZAR SKUPIENIA</text><text x="414" y="353" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Buforuj embeddingi etykiet</text><text x="414" y="375" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="414">Odświeżaj po zmianie etykiety lub</tspan><tspan x="414" dy="1.2em">modelu</tspan></text>
<text x="400" y="414" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Przy 1 024 typach: 19,3 → 18,3 egz./s</text>
<text x="400" y="436" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">(spadek o 5,2%, gliner-bi-edge-v2.0)</text>
<path d="M32 472h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="498" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Wstępnie obliczone etykiety: do 130× przepustowości cross-encodera w teście na 1 H100.</text>
</svg>
