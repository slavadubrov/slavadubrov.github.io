<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="codeexec-title codeexec-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="codeexec-title">Tradycyjne wywoływanie narzędzi powtarza każdy wynik w kontekście; wykonywanie kodu zwraca jedno podsumowanie.</title><desc id="codeexec-desc">Tradycyjne wywoływanie przesyła każdy wynik z kontekstu z powrotem do modelu przed następnym wywołaniem. Wykonywanie kodu zapisuje jeden skrypt, który uruchamia wywołania i przetwarza wiersze w sandboxie, a następnie zwraca modelowi tylko końcowe podsumowanie.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="codeexec-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="codeexec-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="560" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Powtarzaj każdy wynik albo zwracaj jedno podsumowanie</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tradycyjne wywoływanie przesyła każdy wynik z powrotem przez kontekst przed następnym wywołaniem.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Wykonywanie kodu uruchamia wywołania w sandboxie i zwraca tylko końcowe podsumowanie.</text>
<text x="32" y="120" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">TRADYCYJNE · POWTARZANIE PRZEZ KONTEKST</text>
