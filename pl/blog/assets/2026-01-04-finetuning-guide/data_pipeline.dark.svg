<text x="32" y="1058" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">Polityka danych wrażliwych przewyższa detekcję PII — obowiązują pochodzenie, zgoda, retencja i usuwanie.</text>
<text x="32" y="1080" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Najpierw pokrycie, potem wolumen: dodawaj przykłady dla odrębnych trybów błędów, a nie powtórzenia</tspan><tspan x="32" dy="1.2em">łatwego przypadku większościowego.</tspan></text>
