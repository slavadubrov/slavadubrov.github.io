<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ftmoe-title ftmoe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ftmoe-title">A router network selects a small subset of experts per token, and only their outputs are combined.</title><desc id="ftmoe-desc">An input token passes through a learned router network that selects the top-k experts, here 2 of 4 shown, and combines only their weighted outputs; the unselected experts do no work for that token. Mixtral 8x7B applies this pattern across 8 experts per layer, with 2 active per token out of 47B total parameters.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ftmoe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="ftmoe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="760" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">A router chooses experts per token</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Only the selected experts do work for that token.</text>
