<text x="32" y="698" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Only the top-k experts run per token; the rest sit idle for that step.</text>
<text x="32" y="720" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">The router is a learned gate, not a fixed rule — which experts activate changes per token.</text>
</svg>
