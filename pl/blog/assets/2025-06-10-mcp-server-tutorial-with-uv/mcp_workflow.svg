<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="mcpflow-title mcpflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mcpflow-title">Wyszukiwanie cechy przebiega w sześciu krokach: podczas uruchamiania klient jednorazowo wykrywa narzędzia serwera, a następnie każde pytanie przekracza granicę MCP jako nowe żądanie tools/call.</title><desc id="mcpflow-desc">Podczas uruchamiania klient MCP aplikacji Claude Desktop wykrywa narzędzia serwera, a host udostępnia Claude ich schematy. Claude może wtedy zażądać get_feature. Gdy pytanie wymaga danych z feature store, klient wysyła to żądanie do FeatureStoreLite jako komunikat tools/call, serwer wykonuje get_feature względem SQLite, a wynik wraca przez hosta do Claude, aby wygenerować końcową odpowiedź.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mcpflow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="mcpflow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="548" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Sześć kroków wyszukiwania cechy</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Wykrywanie odbywa się raz; każde kolejne wyszukiwanie powtarza trzy ostatnie kroki.</text>
<text x="32" y="104" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">URUCHAMIANIE · WYKRYWANIE NARZĘDZI</text>
