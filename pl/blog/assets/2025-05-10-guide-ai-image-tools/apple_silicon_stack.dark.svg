<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="memstack-title memstack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="memstack-title">Wspólna pamięć Apple Silicon jest współdzielona, a nie nieograniczona — obejmuje pięć jednoczesnych obciążeń.</title><desc id="memstack-desc">Narzut systemu macOS i innych aplikacji, komponenty wag modelu, przestrzeń robocza runtime’u oraz opcjonalnie załadowane adaptery korzystają z jednej puli pamięci. Skupiona rezerwa robocza to ilość pamięci, która musi pozostać dostępna, zanim generowanie zacznie powodować ciągłe przenoszenie danych do pamięci masowej.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="memstack-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="memstack-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="848" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Jedna wspólna pula, pięć obciążeń</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Schemat koncepcyjny, nie w skali — Apple opisuje wspólną pulę, a nie wzór doboru rozmiaru.</text>
<rect x="32" y="104" width="656" height="656" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">WSPÓLNA PULA PAMIĘCI</text>
<path d="M58 152h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 152h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="62" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">SYSTEM</text><text x="62" y="213" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">macOS i aplikacje</text><text x="62" y="235" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zmienia się podczas pracy.</text>
<path d="M58 272h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 272h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="289.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">WAGI</text><text x="62" y="333" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Komponenty modelu</text><text x="62" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Checkpoint, enkodery, VAE.</text>
<path d="M58 392h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 392h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PRZESTRZEŃ ROBOCZA</text><text x="62" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Aktywacje i runtime</text><text x="62" y="475" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Attention, stan pośredni.</text>
<path d="M58 512h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 512h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">OPCJONALNE ŁADOWANIE</text><text x="62" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Adaptery i mechanizmy sterujące</text><text x="62" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">LoRA, ControlNet, upscaler.</text>
<path d="M58 632h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M58 632h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="62" y="649.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">OBSZAR ROBOCZY</text><text x="62" y="693" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Rezerwa robocza</text><text x="62" y="715" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Pozostaw miejsce przed ciągłym przenoszeniem danych do pamięci masowej.</text>
<path d="M32 792h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="818" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Rozdzielczość, rozmiar batcha, architektura, precyzja i załadowane etapy zmieniają każde obciążenie.</text>
</svg>
