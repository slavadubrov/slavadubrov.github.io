<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="aitooldt-title aitooldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="aitooldt-title">Trójgałęziowa mapa decyzyjna wybiera narzędzie na podstawie stanu, który musi zostać zachowany, a następnie ukierunkowany test akceptacyjny potwierdza dokładny stack.</title><desc id="aitooldt-desc">To, czy workflow musi zachować stan wewnątrz aplikacji natywnej, inspektowalnego grafu czy istniejącego interfejsu, wyznacza pierwszą gałąź: Draw Things lub DiffusionBee, ComfyUI albo AUTOMATIC1111 lub Fooocus. Każda gałąź nadal wymaga potwierdzenia dokładnego stacku modelu; nieudana weryfikacja odsyła do ponownego rozważenia innego kandydata, zanim zostanie uruchomiony ukierunkowany, reprezentatywny test akceptacyjny.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="aitooldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="aitooldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="760" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Wybierz narzędzie, a następnie potwierdź stack</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tabela warstwy sterowania wskazuje, gdzie znajduje się stan. Ten test sprawdza, czy stan przetrwa.</text>
