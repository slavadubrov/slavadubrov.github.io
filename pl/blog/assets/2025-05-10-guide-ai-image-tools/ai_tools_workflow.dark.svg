<text x="32" y="714" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Przypnij identyfikatory razem; sam checkpoint nie pozwoli odtworzyć wyniku.</text>
