<text x="32" y="632" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Grupowanie warstw równoważy szczytowe zużycie pamięci z rozmiarem operacji zbiorowych i ich</tspan><tspan x="32" dy="1.2em">nakładaniem.</tspan></text>
