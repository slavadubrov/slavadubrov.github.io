<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="fsdp-title fsdp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fsdp-title">W pełni dzielone wykonanie równoległe danych</title><desc id="fsdp-desc">Każda z czterech rang przechowuje fragment parametrów, gradientów i stanu optymalizatora. Fragmenty są zbierane operacją all-gather do pełnej warstwy tylko na czas obliczeń w przód i wstecz, a następnie reduce-scatter zwraca fragment gradientu do każdego właściciela, podczas gdy stan optymalizatora pozostaje lokalny.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fsdp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="fsdp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="664" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">W pełni dzielone wykonanie równoległe danych</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Fragmenty parametrów są zbierane operacją all-gather do pełnej warstwy tylko na czas wymaganych</tspan><tspan x="32" dy="1.2em">obliczeń.</tspan></text>
