<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1066" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="mhcarch-title mhcarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mhcarch-title">Kompletna warstwa mHC wykonuje odczyt, obliczenia, zapis i mieszanie z ograniczeniem Sinkhorna w sześciu krokach, ograniczając wzmocnienie złożone do około 1,6 wobec około 3000 dla nieograniczonego HC.</title><desc id="mhcarch-desc">Strumienie trafiają do warstwy; nieujemna mapa odczytu kompresuje je do jednego wektora dla bloku attention lub MLP, nieujemna mapa zapisu rozwija wynik z powrotem do aktualizacji poszczególnych strumieni, a mapa mieszania resztkowego po projekcji Sinkhorna łączy strumienie wejściowe przed dodaniem aktualizacji. Tylko ta ostatnia mapa jest podwójnie stochastyczna. W artykule podano, że przy skali 27B złożone wzmocnienie wsteczne wynosi około 1,6 wobec około 3000 dla nieograniczonych Hyper-Connections, przy koszcie około 6,7% dodatkowego czasu treningu.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mhcarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="mhcarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="1066" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Pełna warstwa mHC — sześć ponumerowanych kroków</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tylko mapa mieszania resztkowego H^res jest projekcją Sinkhorna na wielościan Birkhoffa.</text>
