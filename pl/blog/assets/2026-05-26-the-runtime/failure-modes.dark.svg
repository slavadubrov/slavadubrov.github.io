<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="failmodes-title failmodes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="failmodes-title">Cztery awarie środowiska uruchomieniowego mają konkretne poprawki. Osobny ewaluator sprawdza ukończoną pracę.</title><desc id="failmodes-desc">Amnezję funkcji po resecie kontekstu ogranicza ponowne wczytywanie plików postępu przy zimnym starcie. Przedwczesnemu zakończeniu zapobiegają kontrole akceptacji artefaktów; ewaluator z nowym kontekstem może ocenić kryteria wymagające osądu. Awarie kosztowe (lawiny ponowień, niekontrolowane wydatki) są ograniczane przez budżety iteracji i backoff. Awarie stanu (zduplikowane wywołania, utracona praca) są kontrolowane przez trwały log, checkpointy i klucze idempotencji. Awarie okna kontekstu (zbyt wczesne podsumowanie) są ograniczane przez limity długości sesji i wznawianie z checkpointu. Kontrole akceptacji wykorzystują dowody wymagane przez zadanie.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="failmodes-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="failmodes-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="860" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Cztery awarie, jedna kontrola końcowa</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Mechanizmy ograniczające działają poza pamięcią modelu, więc przetrwają restart workera.</text>
<path d="M42 128h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 128h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">AWARIA · JAKOŚĆ</text><text x="46" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Amnezja funkcji</text><text x="46" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zapomina po resecie,</text><text x="46" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">zimny start nie ma planu</text>
<path d="M418 128h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 128h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KONTROLA · ZIMNY START</text><text x="422" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Wczytaj ponownie pliki postępu</text><text x="422" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">PROGRESS.md, lista funkcji,</text><text x="422" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">odczytywane przy każdym zimnym starcie</text>
<path d="M312 180h96" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-arrow-flow)" />
<path d="M42 248h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 248h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">AWARIA · KOSZT</text><text x="46" y="299" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Lawiny ponowień</text><text x="46" y="321" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zablokowane pętle, niekontrolowane</text><text x="46" y="341" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">zużycie tokenów lub narzędzi</text>
<path d="M418 248h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 248h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KONTROLA · BUDŻET</text><text x="422" y="299" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Limit, backoff, breaker</text><text x="422" y="321" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Limit iteracji, budżet</text><text x="422" y="341" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ponowień, circuit breaker</text>
<path d="M312 300h96" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-arrow-flow)" />
<path d="M42 368h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 368h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">AWARIA · STAN</text><text x="46" y="419" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF" style="font-size: 17px;">Zduplikowana lub utracona praca</text><text x="46" y="441" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zduplikowane wywołania narzędzi,</text><text x="46" y="461" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">utrata pracy po awarii</text>
<path d="M418 368h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 368h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KONTROLA · TRWAŁOŚĆ</text><text x="422" y="419" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Trwały log + klucze</text><text x="422" y="441" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Intencja/wynik przy każdym wywołaniu,</text><text x="422" y="461" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">checkpoint jako bezpieczna granica</text>
<path d="M312 420h96" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-arrow-flow)" />
<path d="M42 488h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 488h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="505.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">AWARIA · KONTEKST</text><text x="46" y="539" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Niepokój o kontekst</text><text x="46" y="561" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Model kończy zbyt wcześnie,</text><text x="46" y="581" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">resety gubią intencję</text>
<path d="M418 488h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 488h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="505.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KONTROLA · LIMIT SESJI</text><text x="422" y="539" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Ogranicz długość sesji</text><text x="422" y="561" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Harness ogranicza długość,</text><text x="422" y="581" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">wznawia z checkpointu</text>
<path d="M312 540h96" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-arrow-flow)" />
<path d="M42 648h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 648h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="665.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KONCENTRACJA · KONTROLA KOŃCOWA</text><text x="46" y="709" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kontrole akceptacji odrzucają nieukończoną pracę</text><text x="46" y="731" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Testy i dowody w artefaktach; recenzent dla kryteriów wymagających osądu</text>
<path d="M32 784h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="810" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">Mechanizmy ograniczające działają poza pamięcią modelu, więc te same kontrole przetrwają restart workera.</text>
<text x="32" y="832" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Wymagaj dowodów akceptacji zadania; recenzent modelowy jest opcjonalny.</text>
</svg>
