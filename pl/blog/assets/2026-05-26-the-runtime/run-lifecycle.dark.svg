<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">Prawidłowe wykonanie agenta zapisuje oczekującą intencję przed wysłaniem, rejestruje wynik, a następnie tworzy checkpoint i przeprowadza ewaluację; nowy worker najpierw uzgadnia oczekującą intencję.</title><desc id="runlife-desc">Ta ilustracyjna ścieżka przedstawia jedną skoordynowaną operację wywołującą efekt uboczny: uruchomienie, planowanie, zapisanie oczekującej intencji i klucza idempotencji, wysłanie, zapisanie wyniku, utworzenie checkpointu, a następnie ewaluację. Niezależne wywołania tylko do odczytu lub idempotentne mogą działać równolegle, z osobnymi trwałymi rekordami i deterministyczną agregacją. Worker, który ulegnie awarii po wysłaniu, ale przed zapisaniem wyniku, uruchamia się ponownie z tym samym identyfikatorem sesji, uzgadnia oczekującą intencję i dopiero wtedy kontynuuje. Nieudana ewaluacja wznawia działanie od planowania; pomyślna ewaluacja kończy wykonanie bez błędów.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
