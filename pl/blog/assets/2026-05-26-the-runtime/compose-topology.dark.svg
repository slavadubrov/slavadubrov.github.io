<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">Referencyjny stos Docker Compose ma jednego workera pełniącego funkcję harnessu, trzy bezpośrednio zarządzane przez niego magazyny oraz trzy usługi opt-in włączane flagami profili.</title><desc id="composetop-desc">Worker LangGraph pełni funkcję właściciela uruchomienia i harnessu: pobiera zadania z kolejki Redis, zapisuje checkpointy w Postgres i odczytuje pamięć długoterminową z Qdrant. To lokalne demo Compose obejmuje wyłącznie PostgresSaver; sesja zbliżona do produkcyjnej wymaga również osobnego schematu zdarzeń dla intencji i rezultatów użycia narzędzi. W lokalnym Compose worker i sidecar MCP odczytują wspólny plik .env: worker przechowuje dane uwierzytelniające do bezpośredniego wywołania Claude API i może odczytywać te same dane uwierzytelniające narzędzi co sidecar. Kolektor OpenTelemetry zbiera ślady i metryki, a stos obserwowalności je przechowuje — wszystkie trzy usługi są włączane przez profile opt-in Compose.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
