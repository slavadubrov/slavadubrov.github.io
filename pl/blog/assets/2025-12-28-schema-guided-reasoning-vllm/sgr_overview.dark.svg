<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="sgro-title sgro-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgro-title">Co wymusza system sterowany schematem, a czego nie</title><desc id="sgro-desc">Ograniczone dekodowanie ogranicza obsługiwaną strukturę danych wyjściowych. Kod aplikacji osobno odpowiada za kolejność etapów i politykę semantyczną. Każda z tych trzech warstw wymusza inny zestaw gwarancji, a tylko dekodowanie jest właściwością samego wywołania modelu.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgro-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="sgro-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="408" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Trzy granice wymuszania, jedna odpowiedź</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Obowiązują ograniczenia obsługiwanego formatu; kompletność i politykę nadal trzeba sprawdzać.</text>
<path d="M42 112h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 112h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ZAKRES · DEKODOWANIE</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 13.5px;">Format danych wyjściowych</text>
<path d="M270 112h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M270 112h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="274" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCES · APLIKACJA</text><text x="274" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kolejność etapów</text>
<path d="M498 112h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M498 112h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="502" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCES · KOD</text><text x="502" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Polityka semantyczna</text>
<path d="M232 148h28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgro-arrow-flow)" />
<path d="M460 148h28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sgro-arrow-flow)" />
<path d="M32 204h200" stroke="#2B3B33" stroke-width="1" />
<path d="M260 204h200" stroke="#2B3B33" stroke-width="1" />
<path d="M488 204h200" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="230" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">LIMIT DEKODERA</text>
<text x="32" y="254" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">klucze, typy, wartości wyliczeniowe</text>
<text x="32" y="276" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">obsługiwane przez backend</text>
<text x="32" y="298" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">kompletność sprawdzana w aplikacji</text>
<text x="260" y="230" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">WYMUSZA</text>
<text x="260" y="254" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">osobne wywołania dla każdej fazy</text>
<text x="260" y="276" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">bramki autoryzacji narzędzi</text>
<text x="488" y="230" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">WYMUSZA</text>
<text x="488" y="254" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">arytmetykę między polami</text>
<text x="488" y="276" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">progi i dowody</text>
<path d="M32 336h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="362" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Schemat sprawia, że odpowiedź można testować.</text>
<text x="32" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Kod aplikacji nadal decyduje, czy jest ona prawdziwa i dozwolona.</text>
</svg>
