<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rag-title">Ścieżki ingestowania, serwowania i ewaluacji RAG</title><desc id="rag-desc">Wersjonowane źródło jest parsowane, dzielone na fragmenty i osadzane w wersjonowanym indeksie wektorowym. W czasie serwowania zapytanie tenanta jest autoryzowane i szeregowane, jakość wyszukiwania jest sprawdzana przed złożeniem kontekstu i generowaniem, a jakość odpowiedzi jest sprawdzana osobno po generowaniu.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="rag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="780" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Dwie ścieżki RAG, dwa osobne sprawdzenia</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Jakość wyszukiwania warunkuje generowanie; jakość odpowiedzi jest oceniana później.</text>
