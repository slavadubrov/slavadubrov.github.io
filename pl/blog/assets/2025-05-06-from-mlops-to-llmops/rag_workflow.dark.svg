<path d="M268 112h202a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-202a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M268 112h202a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-222a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="272" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">POTOK</text><text x="272" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 11px;"><tspan x="272">Parsowanie + dzielenie na</tspan><tspan x="272" dy="1.2em">fragmenty + embedding</tspan></text>
