<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="dist-title dist-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="dist-title">Model-parallel training across four GPU workers</title><desc id="dist-desc">One foundation-model revision is partitioned into four sequential layer shards, one per GPU worker. All four workers contribute to a shared gradient synchronization step before the next update.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="dist-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="dist-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="800" height="560" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Partition layers, then synchronize</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Four GPU workers each hold a contiguous shard of the model.</text>
<path d="M314 104h172a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/><path d="M314 104h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45"/><text x="400" y="121.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">MODEL REVISION</text><text x="400" y="159" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">Foundation model</text>
<path d="M400 176v28H118v28" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#dist-arrow-flow)"/>
<path d="M400 176v28H306v28" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#dist-arrow-flow)"/>
