<path d="M32 488h736" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The synchronization step is the coordination point across all four workers.</text>
</svg>
