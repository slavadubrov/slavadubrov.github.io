<path d="M366 396h216a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-216a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M366 396h216a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-236a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="370" y="413.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">POLITYKA</text><text x="370" y="451" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 12.5px;">Bezpieczeństwo + reguły biznesowe</text>
