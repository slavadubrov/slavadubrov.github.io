<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="enrichguard-title enrichguard-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="enrichguard-title">Wzbogacacze API wstrzykują nieblokujące wskazówki, a osobna warstwa guard decyduje, czy proponowana akcja może być kontynuowana.</title><desc id="enrichguard-desc">Odpowiedź z zewnętrznego API jest analizowana przez ponad dwudziestu wzbogacaczy, którzy wstrzykują do kontekstu wskazówki dotyczące roli i stronicowania. Hybrydowe wyszukiwanie w firmowej wiki, łączące strumienie regex, semantyczny i słów kluczowych, zasila tego samego agenta AI prowadzącego rozumowanie. Agent wybiera akcję, a wyspecjalizowany warstwowy guard decyduje: twarda blokada, miękka blokada lub miękka wskazówka, zanim akcja będzie kontynuowana.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="enrichguard-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="enrichguard-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="810" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0" style="font-size: 18px;">Wzbogacacze API kierują agentem, zanim warstwowe guardy podejmą decyzję</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zespół J8Gvbi oddzielił nieblokujące wskazówki od osobnego guarda z trzema trybami.</text>
