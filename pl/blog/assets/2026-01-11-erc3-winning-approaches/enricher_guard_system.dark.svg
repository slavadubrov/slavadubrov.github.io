<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13px;">Wzbogacacze dodają nieblokujące wskazówki, a system guardów decyduje, czy akcja może być kontynuowana.</text>
<text x="32" y="784" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Twarde blokady zatrzymują akcję, miękkie blokady pozwalają na ponowienie próby, a miękkie wskazówki</tspan><tspan x="32" dy="1.2em">jedynie kierują działaniem.</tspan></text>
