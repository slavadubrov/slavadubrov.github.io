<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="sgrvalid-title sgrvalid-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgrvalid-title">Walidator kroku sprawdza każdą proponowaną akcję, zanim stanie się ona wywołaniem narzędzia, a błędne kroki odsyła z powrotem do modułu rozumującego.</title><desc id="sgrvalid-desc">Moduł rozumujący proponuje krok, a wyspecjalizowany walidator kroku sprawdza akcję. Odrzucony krok wraca do modułu rozumującego wraz z komentarzami; zaakceptowany krok jest wykonywany w środowisku uruchomieniowym, a wynik jego API jest zapisywany jako obserwacja, która zasila następną turę rozumowania.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgrvalid-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="sgrvalid-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Waliduj każdy krok zgodny ze schematem przed wykonaniem</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zespół NLN7Dw odrzuca błędny krok, zanim stanie się on wywołaniem narzędzia.</text>
<path d="M42 112h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">MODUŁ ROZUMUJĄCY</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Zaproponuj krok</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="46">Tworzy szkic następnego wywołania</tspan><tspan x="46" dy="1.2em">narzędzia</tspan></text><circle cx="32" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M430 112h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M430 112h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="434" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">WALIDATOR KROKU</text><text x="434" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Sprawdź akcję</text><text x="434" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Przerabia błędne kroki</text><circle cx="420" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="420" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M430 288h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M430 288h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="434" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ŚRODOWISKO URUCHOMIENIOWE</text><text x="434" y="349" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Wykonaj narzędzie</text><text x="434" y="371" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="434">Uruchamia tylko zwalidowane</tspan><tspan x="434" dy="1.2em">wywołania</tspan></text><circle cx="420" cy="288" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="420" y="292.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M42 288h248a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-248a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 288h248a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-268a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">OBSERWACJA</text><text x="46" y="349" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Wynik API</text><text x="46" y="371" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zasila następną turę rozumowania</text><circle cx="32" cy="288" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="292.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
