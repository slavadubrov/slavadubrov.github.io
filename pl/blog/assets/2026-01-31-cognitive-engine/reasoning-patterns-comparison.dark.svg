<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Te same narzędzia, inny moment zatwierdzenia</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Wszystkie trzy korzystają z tych samych narzędzi; różni je tylko moment, w którym plan może się zmienić.</text>
