<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="reasoncompare-title reasoncompare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reasoncompare-title">ReAct, ReWOO i Plan-and-Execute korzystają z tych samych narzędzi, ale w różnych momentach zatwierdzają plan.</title><desc id="reasoncompare-desc">Trzy ścieżki porównują przepływ sterowania i moment planowania. ReAct wybiera po każdej obserwacji — zapewnia najwyższą adaptacyjność kosztem wielokrotnych wywołań modelu. ReWOO ustala pełny graf zależności przed wykonaniem — zapewnia najniższą adaptacyjność i wymaga najmniejszej liczby wywołań. Plan-and-Execute ustala plan ogólny i może go zmienić wyłącznie za pomocą jawnego replannera — zapewnia średnią adaptacyjność, ale wymaga śledzenia większej ilości stanu. Różni się tylko moment zatwierdzenia: ReAct może zmienić kierunek po każdym wyniku, ReWOO — tylko przez logikę awaryjną, a Plan-and-Execute — w punktach kontrolnych kroków.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reasoncompare-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="reasoncompare-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
