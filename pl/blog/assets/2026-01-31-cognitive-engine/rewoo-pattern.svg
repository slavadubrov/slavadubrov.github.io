<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rewoopattern-title rewoopattern-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rewoopattern-title">ReWOO planuje graf zależności przed uruchomieniem jakichkolwiek narzędzi.</title><desc id="rewoopattern-desc">Jedno wywołanie plannera tworzy kompletny graf zależności narzędzi z symbolami zastępczymi E1, E2 i E3. Worker niezależny od modelu uruchamia równolegle niezależne wywołania E1 i E2, a następnie zależne wywołanie E3, gdy oba się zakończą. Jedno wywołanie solvera scala wszystkie wyniki — rozumowanie odbywa się przed wykonaniem, a worker uzupełnia symbole zastępcze bez wywoływania modelu.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rewoopattern-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="rewoopattern-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="800" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">ReWOO: najpierw skompiluj graf narzędzi</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Rozumowanie odbywa się przed wykonaniem; worker uzupełnia symbole zastępcze bez wywoływania</tspan><tspan x="32" dy="1.2em">modelu.</tspan></text>
<path d="M284 128h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M284 128h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="288" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · PLANNER</text><text x="288" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Zapisz pełny graf</text><text x="288" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="288">jedno wywołanie LLM ·</tspan><tspan x="288" dy="1.2em">#E1–#E3</tspan></text>
