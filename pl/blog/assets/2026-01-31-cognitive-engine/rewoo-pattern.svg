<path d="M32 704h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="730" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Szybko, gdy graf pozostaje poprawny.</text>
<text x="32" y="752" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Podatne na awarie, gdy narzędzie zmieni plan.</text>
