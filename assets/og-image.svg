<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Edge of Context</title>
  <desc id="description">Edge of Context, a practical AI engineering blog by Slava Dubrov.</desc>

  <rect width="1200" height="630" fill="#f7f7f4"/>
  <rect x="72" y="72" width="1056" height="486" rx="24" fill="#d8ddd9"/>
  <rect x="74" y="74" width="1052" height="482" rx="22" fill="#ffffff"/>

  <!-- The production logo, enlarged without changing its geometry. -->
  <g>
    <rect x="123.5" y="230.5" width="169" height="169" rx="43.875" fill="#17211b"/>
    <rect x="139.75" y="246.75" width="136.5" height="136.5" rx="27.625" fill="#ffffff"/>
    <rect x="232.375" y="238.625" width="16.25" height="152.75" fill="#0b6b45"/>
    <g fill="#0b6b45">
      <circle cx="157.625" cy="276" r="13.65"/>
      <circle cx="186.875" cy="276" r="13.65"/>
      <circle cx="216.125" cy="276" r="13.65"/>
      <circle cx="157.625" cy="315" r="13.65"/>
      <circle cx="186.875" cy="315" r="13.65"/>
      <circle cx="216.125" cy="315" r="13.65"/>
      <circle cx="157.625" cy="354" r="13.65"/>
      <circle cx="186.875" cy="354" r="13.65"/>
      <circle cx="216.125" cy="354" r="13.65"/>
    </g>
    <g fill="#59645e" opacity="0.45">
      <circle cx="263.25" cy="276" r="9.75"/>
      <circle cx="263.25" cy="315" r="9.75"/>
      <circle cx="263.25" cy="354" r="9.75"/>
    </g>
  </g>

  <g
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    text-rendering="geometricPrecision"
  >
    <text x="346" y="291" fill="#17211b" font-size="76" font-weight="800">Edge of Context</text>
    <text x="350" y="351" fill="#59645e" font-size="36" font-weight="500">Practical AI engineering</text>
  </g>

  <!-- A quiet repeat of the logo's boundary idea. -->
  <rect x="1012" y="142" width="6" height="346" rx="3" fill="#0b6b45"/>
  <g fill="#59645e" opacity="0.24">
    <circle cx="1060" cy="231" r="8"/>
    <circle cx="1060" cy="315" r="8"/>
    <circle cx="1060" cy="399" r="8"/>
  </g>
</svg>
