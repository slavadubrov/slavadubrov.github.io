<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">The parts of AI systems that survive production</title>
  <desc id="description">
    Edge of Context social card with the green and fuchsia brand mark and Byte,
    the beaver mascot.
  </desc>

  <rect width="1200" height="630" fill="#f7f7f4" />
  <rect x="780" width="420" height="630" fill="#fdecf5" />

  <g transform="translate(64 55)">
    <rect
      x="5.3125"
      y="5.3125"
      width="29.375"
      height="29.375"
      rx="6.875"
      fill="none"
      stroke="#17211b"
      stroke-width="3.125"
    />
    <line
      x1="26.25"
      y1="5.3125"
      x2="26.25"
      y2="34.6875"
      stroke="#f2148e"
      stroke-width="3.125"
    />
    <g fill="#0b6b45">
      <circle cx="10.3125" cy="12.5" r="2.625" />
      <circle cx="15.9375" cy="12.5" r="2.625" />
      <circle cx="21.5625" cy="12.5" r="2.625" />
      <circle cx="10.3125" cy="20" r="2.625" />
      <circle cx="15.9375" cy="20" r="2.625" />
      <circle cx="21.5625" cy="20" r="2.625" />
      <circle cx="10.3125" cy="27.5" r="2.625" />
      <circle cx="15.9375" cy="27.5" r="2.625" />
      <circle cx="21.5625" cy="27.5" r="2.625" />
    </g>
  </g>

  <g
    font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif"
    fill="#17211b"
    text-rendering="geometricPrecision"
  >
    <text x="116" y="84" font-size="30" font-weight="700">Edge of Context</text>
    <text x="64" y="270" font-size="68" font-weight="700">The parts of AI</text>
    <text x="64" y="341" font-size="68" font-weight="700">
      systems that survive
    </text>
    <text x="64" y="412" font-size="68" font-weight="700">production</text>
    <text
      x="64"
      y="476"
      font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"
      font-size="26"
      font-weight="400"
      fill="#59645e"
    >
      Practical AI engineering · Slava Dubrov
    </text>
  </g>

  <image
    href="byte/byte-full.png"
    xlink:href="byte/byte-full.png"
    x="840"
    y="180"
    width="300"
    height="450"
    preserveAspectRatio="xMidYMax meet"
  />
</svg>
