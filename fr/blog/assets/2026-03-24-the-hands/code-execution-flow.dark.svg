<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ced-title ced-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ced-title">Les tool calls traditionnels se répètent dans le context ; l’exécution de code renvoie un seul résumé</title>
  <desc id="ced-desc">Avec les appels traditionnels, chaque tool result revient dans le context du modèle avant l’appel suivant, ce qui se répète pendant 20 passes ou plus dans l’exemple de dépenses. Avec l’exécution de code, le modèle écrit un programme, un sandbox exécute les appels et conserve les données intermédiaires, puis seul le résumé final revient dans le context.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="40">TRADITIONNEL · CHAQUE RÉSULTAT RÉINTÈGRE LE CONTEXT</text>
  <rect class="box" x="48" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="96">MODÈLE</text><text class="name" x="68" y="124">Choisir un appel</text>
  <rect x="272" y="64" width="188" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="292" y="96">EXTERNE</text><text class="name" x="292" y="124">Tool ou API</text>
  <rect class="store" x="496" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="96">CONTEXT</text><text class="name" x="516" y="124"><tspan x="516">Le résultat brut</tspan><tspan x="516" dy="1.2em">revient</tspan></text>
  <rect class="box" x="720" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="740" y="96">PROCESSUS</text><text class="name" x="740" y="124">Répéter 20+ passes</text>
  <path class="edge" d="M236 112H264" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M460 112H488" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M684 112H712" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M814 160V192H142V160" stroke-dasharray="7 6" marker-end="url(#ced-arrow)" />
  <rect x="386" y="180" width="188" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="480" y="197" text-anchor="middle" style="font-size: 11px;">personne suivante · inférence suivante</text>
  <path d="M48 224H912" stroke="#2B3B33" stroke-width="1" />
  <text class="kind" x="48" y="252">EXÉCUTION DE CODE · LES DONNÉES INTERMÉDIAIRES RESTENT DANS LE SANDBOX</text>
  <rect class="box" x="48" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="308">MODÈLE</text><text class="name" x="68" y="336">Écrire un programme</text>
  <rect class="box" x="272" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="292" y="308">SANDBOX</text><text class="name" x="292" y="336"><tspan x="292">Exécuter les boucles</tspan><tspan x="292" dy="1.2em">+ appels</tspan></text>
  <rect class="store" x="496" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="308">ÉTAT LOCAL</text><text class="name" x="516" y="336"><tspan x="516">Traiter plus de 2 000</tspan><tspan x="516" dy="1.2em">lignes</tspan></text>
  <rect x="720" y="276" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="740" y="308" fill="#FF6FB6">FOCUS · CONTEXT</text><text class="name" x="740" y="336" fill="#FF6FB6"><tspan x="740">Renvoyer un résultat</tspan><tspan x="740" dy="1.2em">d’environ 1 Ko</tspan></text>
  <path class="edge" d="M236 324H264" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M460 324H488" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M684 324H712" marker-end="url(#ced-arrow)" />
  <text class="note" x="48" y="424">Exemple d’analyse de dépenses : environ 200 Ko de lignes brutes sont traités localement ; seul le résultat entre dans le context du modèle.</text>
  <defs>
    <marker id="ced-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
