<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tod-title tod-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tod-title">Les définitions des tools peuvent consommer le contexte avant le début du travail</title>
  <desc id="tod-desc">Les exemples rapportés indiquent 143 000 tokens pour une configuration MCP importante et 55 000 pour environ 40 tools MCP. Dix JSON tool schemas sont estimés entre 5 500 et 14 000 tokens. Les métadonnées de démarrage d’un skill représentent environ 100 tokens. L’exécution de code utilise un petit nombre de meta-tools, mais aucun volume comparable n’est avancé.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .grid { stroke: #2B3B33; stroke-width: 1; }
  </style>
  <rect width="960" height="512" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">SURCOÛT DES DÉFINITIONS AVANT LA TÂCHE</text>
  <text class="note" x="48" y="68">Exemples rapportés, pas un benchmark contrôlé unique · échelle horizontale en milliers de tokens</text>
  <path class="grid" d="M300 88V424M493 88V424M687 88V424M880 88V424" />
  <text class="kind" x="300" y="84" text-anchor="middle">0</text>
  <text class="kind" x="493" y="84" text-anchor="middle">50K</text>
  <text class="kind" x="687" y="84" text-anchor="middle">100K</text>
  <text class="kind" x="880" y="84" text-anchor="middle">150K</text>
  <text class="kind" x="48" y="124" fill="#FF6FB6">FOCUS · MCP</text>
  <text class="name" x="48" y="148" fill="#FF6FB6">Grande configuration</text>
  <rect x="300" y="116" width="553" height="32" rx="6" fill="#FF6FB6" />
  <text class="name" x="840" y="139" text-anchor="end" fill="#0C1210">143K</text>
  <text class="note" x="300" y="170">72 % d’une fenêtre de contexte de 200K dans la configuration rapportée</text>
  <text class="kind" x="48" y="212">MCP</text>
  <text class="name" x="48" y="236">Environ 40 tools</text>
  <rect x="300" y="204" width="213" height="32" rx="6" fill="#EDF5F0" />
  <text class="name" x="525" y="227">55K</text>
  <text class="note" x="300" y="258">Schemas chargés avant que l’utilisateur ne pose une question</text>
  <text class="kind" x="48" y="300">JSON SCHEMAS</text>
  <text class="name" x="48" y="324">Dix tools</text>
  <path d="M321 308H354" stroke="#EDF5F0" stroke-width="8" />
  <circle cx="321" cy="308" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <circle cx="354" cy="308" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="372" y="314">5,5–14K</text>
  <text class="note" x="300" y="346">Fourchette dérivée de 550 à 1 400 tokens par définition</text>
  <text class="kind" x="48" y="388">CHARGEMENT PROGRESSIF</text>
  <text class="name" x="48" y="412">Métadonnées du skill</text>
  <circle cx="301" cy="396" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="320" y="402">~100 tokens</text>
  <text class="note" x="300" y="434">Les instructions complètes ne sont chargées que lorsque le skill est actif</text>
  <path d="M48 456H912" stroke="#2B3B33" stroke-width="1" />
  <text class="source" x="48" y="478">Sources : Apideck pour les observations de 55K et 143K ; estimation d’un article pour dix JSON schemas ; recommandations de Skills sur la divulgation progressive.</text>
  <text class="source" x="48" y="496">L’exécution de code remplace de nombreux schemas par quelques meta-tools, mais son surcoût de définition dépend du harness et n’est pas représenté.</text>
</svg>
