<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tmd-title tmd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tmd-title">Cinq interfaces pour le tool use des agents</title>
  <desc id="tmd-desc">Comparaison du tool calling JSON, de MCP, des Skills, des outils en ligne de commande et de l’exécution de code selon ce que chaque interface transporte, son contexte d’utilisation et son overhead de contexte typique. L’exécution de code est mise en avant pour l’orchestration multi-agent en plusieurs étapes.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="44">CARTE DES INTERFACES — CHOISIR SELON LA STRUCTURE DU TRAVAIL</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">APPELS ATOMIQUES</text>
  <text class="name" x="68" y="126">Tool calling JSON</text>
  <text class="note" x="68" y="150">Requête/réponse typée · 550–1 400 tokens de schéma par tool</text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">INTÉGRATION PARTAGÉE</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150">Découverte + transport · charger uniquement les tools nécessaires à la tâche</text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">PROCÉDURE</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Instructions à la demande · environ 100 tokens de métadonnées au démarrage</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">OPÉRATION LOCALE</text>
  <text class="name" x="520" y="262">CLI et shell</text>
  <text class="note" x="520" y="286">Commandes composables · faible overhead de schéma</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#FF6FB6">FOCUS · TRAVAIL EN PLUSIEURS ÉTAPES</text>
  <text class="name" x="294" y="398" fill="#FF6FB6">Exécution de code</text>
  <text class="note" x="294" y="422">Boucles et conditionnelles · le résumé final est renvoyé dans le contexte</text>
  <path d="M48 472H912" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="48" y="490">Le protocole ne définit pas la policy : l’authentification, l’autorisation, la journalisation et le sandboxing relèvent toujours du harness.</text>
</svg>
