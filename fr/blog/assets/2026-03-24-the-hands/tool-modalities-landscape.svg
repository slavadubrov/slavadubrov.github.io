<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tm-title tm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tm-title">Cinq interfaces pour le tool use des agents</title>
  <desc id="tm-desc">Comparaison du JSON tool calling, de MCP, des Skills, des outils en ligne de commande et de l’exécution de code selon ce que chaque interface transporte, son domaine d’utilisation et sa surcharge de contexte typique. L’exécution de code est mise en avant pour la multi-step orchestration.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="44">CARTOGRAPHIE DES INTERFACES — CHOISIR SELON LA NATURE DU TRAVAIL</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">APPELS ATOMIQUES</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150">Requête/réponse typée · 550–1 400 tokens de schéma par outil</text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">INTÉGRATION PARTAGÉE</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150">Découverte + transport · charger uniquement les outils nécessaires à la tâche</text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">PROCÉDURE</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Instructions à la demande · environ 100 tokens de métadonnées au démarrage</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">OPÉRATION LOCALE</text>
  <text class="name" x="520" y="262">CLI et shell</text>
  <text class="note" x="520" y="286">Commandes composables · faible surcharge de schéma</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#C50E72">FOCUS · TRAVAIL EN PLUSIEURS ÉTAPES</text>
  <text class="name" x="294" y="398" fill="#C50E72">Exécution de code</text>
  <text class="note" x="294" y="422">Boucles et conditionnelles · le résumé final revient dans le contexte</text>
  <path d="M48 472H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="48" y="490">Le protocole ne définit pas la policy : l’authentification, l’autorisation, la journalisation et le sandboxing relèvent toujours du harness.</text>
</svg>
