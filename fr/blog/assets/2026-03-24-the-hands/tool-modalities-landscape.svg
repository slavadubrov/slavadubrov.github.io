<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Tool Modalities Landscape" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Panorama des modalités d’outillage</title>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Title -->
  <text y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" x="550">Cinq modalités d’outillage pour les AI Agents</text>
  <text y="50" text-anchor="middle" font-size="11" fill="#64748b" x="550">Cinq interfaces comparées selon leur overhead en tokens et leur cas d’usage privilégié</text>

  <!-- Central Agent Node -->
  <rect x="460" y="70" width="180" height="50" rx="25" fill="#7c3aed" filter="url(#shadow)" />
  <text y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" x="550">AI Agent</text>

  <!-- Connecting lines from agent to each modality -->
  <line x1="480" y1="120" x2="140" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="510" y1="120" x2="345" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="550" y1="120" x2="525" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="590" y1="120" x2="705" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="620" y1="120" x2="935" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 1. JSON Tool Calling -->
  <rect x="30" y="175" width="200" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8" x="130">Appels d’outils JSON</text>
  <line x1="50" y1="210" x2="210" y2="210" stroke="#2563eb" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="130">550 à 1 400 tokens par outil</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="130">Appels séquentiels 1:1</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="130">E/S structurées</text>
  <rect x="55" y="275" width="150" height="20" rx="4" fill="#2563eb" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8" x="130">Overhead élevé</text>

  <!-- 2. MCP -->
  <rect x="240" y="175" width="200" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b" x="340">Serveurs MCP</text>
  <line x1="260" y1="210" x2="420" y2="210" stroke="#dc2626" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="340">55K+ tokens pour ~40 outils</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="340">10K+ serveurs, 50 vulnérabilités suivies</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="340">Standard inter-éditeurs</text>
  <rect x="265" y="275" width="150" height="20" rx="4" fill="#dc2626" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b" x="340">Overhead très élevé</text>

  <!-- 3. Skills (SKILL.md) -->
  <rect x="450" y="175" width="200" height="130" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6" x="550">Skills (SKILL.md)</text>
  <line x1="470" y1="210" x2="630" y2="210" stroke="#7c3aed" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="550">~100 tokens de métadonnées</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="550">Expertise, pas exécution</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="550">Adopté par 8+ plateformes</text>
  <rect x="475" y="275" width="150" height="20" rx="4" fill="#7c3aed" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6" x="550">Overhead très faible</text>

  <!-- 4. CLI/Bash -->
  <rect x="660" y="175" width="200" height="130" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#166534" x="760">Outils CLI / Bash</text>
  <line x1="680" y1="210" x2="840" y2="210" stroke="#166534" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="760">Métadonnées quasi nulles</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="760">Maîtrise native par le modèle</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="760">Pipes, composabilité</text>
  <rect x="685" y="275" width="150" height="20" rx="4" fill="#166534" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#166534" x="760">Overhead quasi nul</text>

  <!-- 5. Code Execution (PTC) -->
  <rect x="870" y="175" width="200" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412" x="970">Exécution de code</text>
  <line x1="890" y1="210" x2="1050" y2="210" stroke="#ea580c" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="970">98,7 % sur un workflow</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="970">Jusqu’à +20 % de réussite des tâches</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="970">Boucles, conditionnelles</text>
  <rect x="895" y="275" width="150" height="20" rx="4" fill="#ea580c" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412" x="970">Overhead faible</text>

  <!-- Bottom spectrum bar -->
  <text y="340" font-size="10" font-weight="600" fill="#64748b" x="30">OVERHEAD EN TOKENS (du plus élevé → au plus faible)</text>
  <rect x="30" y="350" width="1040" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <!-- Gradient fill segments — ordered highest to lowest overhead -->
  <rect x="31" y="351" width="208" height="22" rx="31" fill="#fef2f2" opacity="0.7" />
  <rect x="239" y="351" width="207" height="22" rx="239" fill="#eff6ff" opacity="0.7" />
  <rect x="446" y="351" width="208" height="22" rx="446" fill="#fff7ed" opacity="0.7" />
  <rect x="654" y="351" width="207" height="22" rx="654" fill="#faf5ff" opacity="0.7" />
  <rect x="861" y="351" width="208" height="22" rx="861" fill="#f0fdf4" opacity="0.7" />

  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b" x="135">MCP : 55K+ tokens</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8" x="342">JSON : 550 à 1 400 par outil</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#9a3412" x="550">Exécution de code : 2 meta-tools</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6" x="758">Skills : ~100 tokens</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#166534" x="965">CLI : quasi nul</text>

  <!-- Best-for labels -->
  <text y="405" font-size="10" font-weight="600" fill="#64748b" x="30">IDÉAL POUR</text>
  <rect x="30" y="415" width="200" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#1d4ed8" x="130">Actions simples et unitaires</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#1d4ed8" x="130">Appels d’API</text>

  <rect x="240" y="415" width="200" height="45" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#991b1b" x="340">SaaS inter-éditeurs</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#991b1b" x="340">Intégration</text>

  <rect x="450" y="415" width="200" height="45" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#5b21b6" x="550">Expertise métier</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#5b21b6" x="550">Transfert</text>

  <rect x="660" y="415" width="200" height="45" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#166534" x="760">Workflows de développement,</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#166534" x="760">opérations locales</text>

  <rect x="870" y="415" width="200" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#9a3412" x="970">Orchestration</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#9a3412" x="970">en plusieurs étapes</text>

  <!-- Legend -->
  <text y="495" font-size="10" fill="#64748b" x="30">Aucune modalité ne s’impose absolument : l’overhead n’est qu’un axe — consultez le tableau comparatif pour la sécurité, la latence et la composabilité</text>

  <!-- Sources -->
  <text y="540" font-size="9" fill="#64748b" x="30">Sources : données de tokens MCP — Apideck (apideck.com/blog) ; 50 vulnérabilités suivies — vulnerablemcp.info ; +20 % avec CodeAct — Wang et al. (arXiv:2402.01030, ICML 2024) ;</text>
  <text y="552" font-size="9" fill="#64748b" x="30">Réduction de 98,7 % — Anthropic « Code execution with MCP » ; ~100 tokens pour les Skills — divulgation progressive de SKILL.md</text>
</svg>
