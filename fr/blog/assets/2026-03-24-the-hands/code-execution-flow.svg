<text x="32" y="496" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Vercel : 17 tools réduits à 2 meta-tools, tokens moyens −37 %.</text>
<text x="32" y="518" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Anthropic a rapporté une réduction de 98,7 % des tokens sur un workflow Drive-to-Salesforce.</text>
