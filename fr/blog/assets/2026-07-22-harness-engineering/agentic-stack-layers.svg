<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 718" width="1120" height="718" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Où se situe chaque partie de la série Engineering the Agentic Stack</title>
  <desc>Une stack à quatre couches. Le modèle propose une action. La reasoning loop de la Partie 1 définit l’ordre et le nombre de propositions. Le harness assemble le contexte à partir de la mémoire de la Partie 2, expose les outils de la Partie 3, applique les règles d’autorisation de la Partie 4 et exécute les contrôles d’acceptation ainsi que les traces de la Partie 6. Le runtime de la Partie 5 exécute les tool calls acceptés et conserve l’état de la session, du sandbox, du checkpoint et de la trace. Les résultats remontent du runtime vers le modèle comme contexte pour le tour suivant.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="718" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Où se situe chaque partie de la série</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Un run d’agent, de haut en bas : ce qui décide, ce qui autorise et ce qui exécute.</text>

  <!-- Model -->
  <rect x="110" y="110" width="962" height="62" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="130" y="136" font-size="14" font-weight="700" fill="#0f172a">Modèle</text>
  <text x="130" y="156" font-size="11" fill="#64748b">Propose du texte, un tool call ou une réponse finale. Il ne décide pas si le call est exécuté.</text>

  <path d="M 591 172 L 591 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />

  <!-- Reasoning loop -->
  <rect x="110" y="202" width="962" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="130" y="228" font-size="14" font-weight="700" fill="#0f172a">Reasoning loop<tspan font-size="11" font-weight="400" fill="#1d4ed8" dx="10">Partie 1</tspan></text>
  <text x="130" y="248" font-size="11" fill="#64748b">Définit l’ordre et le nombre de propositions avant que le harness ne les voie.</text>

  <path d="M 591 264 L 591 292" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="283" font-size="11" fill="#64748b">call proposé</text>

  <!-- Harness -->
  <rect x="110" y="294" width="962" height="218" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="130" y="322" font-size="14" font-weight="700" fill="#0f172a">Harness<tspan font-size="11" font-weight="400" fill="#9a3412" dx="10">Parties 2, 3, 4 et 6</tspan></text>
  <text x="130" y="340" font-size="11" fill="#64748b">Le programme de contrôle entre le modèle et la machine. Les Parties 2, 3, 4 et 6 sont les quatre blocs ci-dessous, exécutés comme les étapes d’un même tour.</text>

  <rect x="130" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="376" font-size="13" font-weight="600" fill="#0f172a">Contexte</text>
  <rect x="146" y="384" width="112" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="202" y="396" font-size="10" fill="#64748b" text-anchor="middle">Partie 2 — mémoire</text>
  <text x="146" y="418" font-size="11" fill="#64748b">Quel état antérieur entre dans ce prompt :</text>
  <text x="146" y="432" font-size="11" fill="#64748b">rappel, documents, handoff.</text>

  <rect x="442" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="458" y="376" font-size="13" font-weight="600" fill="#0f172a">Contrat d’outil</text>
  <rect x="458" y="384" width="116" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="516" y="396" font-size="10" fill="#64748b" text-anchor="middle">Partie 3 — tool use</text>
  <text x="458" y="418" font-size="11" fill="#64748b">Quelles actions existent et à quoi ressemble un</text>
  <text x="458" y="432" font-size="11" fill="#64748b">résultat validé.</text>

  <rect x="754" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="770" y="376" font-size="13" font-weight="600" fill="#0f172a">Autorisation</text>
  <rect x="770" y="384" width="118" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="829" y="396" font-size="10" fill="#64748b" text-anchor="middle">Partie 4 — sécurité</text>
  <text x="770" y="418" font-size="11" fill="#64748b">Si ce call précis est</text>
  <text x="770" y="432" font-size="11" fill="#64748b">autorisé à s’exécuter maintenant, sans supervision.</text>

  <rect x="130" y="454" width="922" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="146" y="472" font-size="13" font-weight="600" fill="#0f172a">Contrôles d’acceptation, traces, retries et handoffs<tspan font-size="11" font-weight="400" fill="#166534" dx="10">Partie 6</tspan></text>
  <text x="146" y="489" font-size="11" fill="#64748b">Lit les éléments de preuve et décide si le run est terminé, se poursuit ou doit être escaladé. Le modèle ne participe pas à cette décision.</text>

  <path d="M 591 512 L 591 540" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="531" font-size="11" fill="#64748b">call accepté</text>

  <!-- Runtime -->
  <rect x="110" y="542" width="962" height="128" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="130" y="570" font-size="14" font-weight="700" fill="#0f172a">Runtime<tspan font-size="11" font-weight="400" fill="#334155" dx="10">Partie 5</tspan></text>
  <text x="130" y="588" font-size="11" fill="#64748b">Exécute les calls acceptés et maintient l’état en dehors du processus worker. Ces quatre primitives stockent et isolent ; elles ne décident jamais.</text>

  <rect x="130" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="622" font-size="13" font-weight="600" fill="#0f172a">Session</text>
  <text x="146" y="640" font-size="11" fill="#64748b">Journal d’exécution en ajout uniquement</text>

  <rect x="364" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="380" y="622" font-size="13" font-weight="600" fill="#0f172a">Sandbox</text>
  <text x="380" y="640" font-size="11" fill="#64748b">Exécution isolée</text>

  <rect x="598" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="614" y="622" font-size="13" font-weight="600" fill="#0f172a">Checkpoint</text>
  <text x="614" y="640" font-size="11" fill="#64748b">Point de reprise</text>

  <rect x="832" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="848" y="622" font-size="13" font-weight="600" fill="#0f172a">Trace</text>
  <text x="848" y="640" font-size="11" fill="#64748b">Éléments de preuve a posteriori</text>

  <!-- Return path -->
  <path d="M 110 606 L 76 606 L 76 141 L 106 141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="62" y="374" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 62 374)">les résultats et les traces deviennent le contexte du tour suivant</text>
</svg>
