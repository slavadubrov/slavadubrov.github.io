<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hcl-title hcl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hcl-title">Un changement de remise via la boucle de contrôle du harness</title>
  <desc id="hcl-desc">Sept étapes font passer une modification du checkout du contexte assemblé à une proposition du modèle, une autorisation, une exécution par le runtime, des tests d’acceptation, une décision fondée sur les preuves et une trace. Les tests échoués renvoient les preuves au modèle ; seules des preuves de réussite enregistrées peuvent être acceptées.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="552" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="38">CHANGEMENT DE REMISE — UN TOUR CONTRÔLÉ</text>
  <text class="note" x="48" y="60">Rien n’atteint la machine ni n’est considéré comme terminé tant que le harness ne l’a pas décidé.</text>
  <circle cx="62" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="62" y="99" text-anchor="middle">1</text>
  <circle cx="286" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="286" y="99" text-anchor="middle">2</text>
  <circle cx="510" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="510" y="99" text-anchor="middle">3</text>
  <circle cx="734" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="734" y="99" text-anchor="middle">4</text>
  <rect class="box" x="48" y="122" width="188" height="96" rx="10" /><text class="kind" x="68" y="156">CONTEXTE</text><text class="name" x="68" y="184">Assembler la tâche</text>
  <rect class="box" x="272" y="122" width="188" height="96" rx="10" /><text class="kind" x="292" y="156">MODÈLE</text><text class="name" x="292" y="184">Proposer une modification</text>
  <rect class="box" x="496" y="122" width="188" height="96" rx="10" /><text class="kind" x="516" y="156">FRONTIÈRE</text><text class="name" x="516" y="184">Autoriser le tool call</text>
  <rect class="box" x="720" y="122" width="188" height="96" rx="10" /><text class="kind" x="740" y="156">RUNTIME</text><text class="name" x="740" y="184">Appliquer la modification</text>
  <path class="edge" d="M236 170h28" marker-end="url(#hcl-arrow)" /><path class="edge" d="M460 170h28" marker-end="url(#hcl-arrow)" /><path class="edge" d="M684 170h28" marker-end="url(#hcl-arrow)" />
  <path class="edge" d="M814 218v76" marker-end="url(#hcl-arrow)" />
  <circle cx="734" cy="266" r="14" fill="#17211B" /><text class="marker-num" x="734" y="271" text-anchor="middle">5</text>
  <circle cx="510" cy="266" r="14" fill="#17211B" /><text class="marker-num" x="510" y="271" text-anchor="middle">6</text>
  <circle cx="286" cy="266" r="14" fill="#17211B" /><text class="marker-num" x="286" y="271" text-anchor="middle">7</text>
  <rect x="720" y="294" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="740" y="328" fill="#C50E72">FOCUS</text><text class="name" x="740" y="356" fill="#C50E72">Exécuter les deux tests</text><text class="note" x="740" y="376">pytest + Playwright</text>
  <path d="M590 294 684 342 590 390 496 342Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><text class="kind" x="590" y="327" text-anchor="middle">DÉCISION</text><text class="name" x="590" y="354" text-anchor="middle">Preuves suffisantes ?</text>
  <rect class="box" x="272" y="294" width="188" height="96" rx="10" fill="#F2F2F5" /><text class="kind" x="292" y="328">TRACE</text><text class="name" x="292" y="356">Enregistrer les preuves</text><text class="note" x="292" y="376">commandes · codes de sortie · commit</text>
  <path class="edge" d="M720 342h-28" marker-end="url(#hcl-arrow)" /><path class="edge" d="M496 342h-28" marker-end="url(#hcl-arrow)" />
  <path d="M590 390v46a12 12 0 0 1-12 12H378a12 12 0 0 1-12-12V382" class="edge" marker-end="url(#hcl-arrow)" /><rect x="434" y="425" width="108" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="488" y="442" text-anchor="middle">oui → enregistrer</text>
  <path d="M814 390v86a12 12 0 0 1-12 12H366a12 12 0 0 1-12-12V218" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#hcl-arrow-signal)" /><rect x="560" y="476" width="166" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="643" y="493" text-anchor="middle" fill="#C50E72">échec → preuves vers le modèle</text>
  <path class="edge" d="M272 342H138a12 12 0 0 0-12 12v70" marker-end="url(#hcl-arrow)" /><text class="kind" x="48" y="450">ACCEPTER</text><text class="name" x="48" y="478">Résultat vérifié</text><text class="note" x="48" y="502">Les deux vérifications ont réussi sur le commit enregistré.</text>
  <path d="M48 516h864" stroke="#D8DDD9" stroke-width="1" /><text class="note" x="48" y="538">Le modèle propose. Le harness contrôle l’autorisation et la validation.</text>
  <defs><marker id="hcl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="hcl-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
