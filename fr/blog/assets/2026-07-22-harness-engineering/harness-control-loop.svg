<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="hcl-title hcl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hcl-title">Un changement de remise via la boucle de contrôle du harness</title><desc id="hcl-desc">Sept étapes font passer une modification du checkout du contexte assemblé à une proposition du modèle, une autorisation, une exécution runtime, des tests d’acceptation, une décision fondée sur les preuves et une trace. Les tests échoués renvoient les preuves au modèle ; seules des preuves enregistrées et concluantes peuvent être acceptées.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hcl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="hcl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="480" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Changement de remise — un tour contrôlé</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Rien n’atteint la machine ni n’est considéré comme terminé tant que le harness ne l’a pas validé.</text>
