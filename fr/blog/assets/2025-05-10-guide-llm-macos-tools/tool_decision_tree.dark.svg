<text x="32" y="554" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Aucun des quatre n’est toujours le plus rapide — c’est le benchmark qui tranche, pas l’outil.</text>
