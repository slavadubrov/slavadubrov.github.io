<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Workflow de sélection d’un outil LLM local pour macOS</title>
  <desc id="desc">Une tâche et un checkpoint de référence mènent à quatre choix de workflow : service local géré avec Ollama, exploration desktop avec LM Studio, contrôle direct de GGUF avec llama.cpp ou Python natif Apple avec MLX-LM. Tous les chemins convergent vers le même benchmark de charge de travail.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="480" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Choisir la surface de contrôle, puis benchmarker</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb" /></marker></defs>
  <g font-family="Inter, system-ui, sans-serif"><rect x="345" y="90" width="310" height="70" rx="14" fill="#1e293b" stroke="#64748b" /><text x="500" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#e2e8f0">Tâche + checkpoint de référence</text><text x="500" y="143" text-anchor="middle" font-size="12" fill="#94a3b8">qualité, licence, contexte, artefact</text>
  <text x="500" y="195" text-anchor="middle" font-size="28" fill="#94a3b8">↓</text>
  <g transform="translate(30 220)"><rect width="215" height="115" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="107" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Ollama</text><text x="107" y="68" text-anchor="middle" font-size="12" fill="#93c5fd">CLI gérée + API</text><text x="107" y="91" text-anchor="middle" font-size="11" fill="#94a3b8">service applicatif</text></g>
  <g transform="translate(270 220)"><rect width="215" height="115" rx="14" fill="#5b21b6" stroke="#2563eb" /><text x="107" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#c4b5fd">LM Studio</text><text x="107" y="68" text-anchor="middle" font-size="12" fill="#93c5fd">desktop + SDKs + APIs</text><text x="107" y="91" text-anchor="middle" font-size="11" fill="#94a3b8">exploration humaine</text></g>
  <g transform="translate(515 220)"><rect width="215" height="115" rx="14" fill="#9a3412" stroke="#ea580c" /><text x="107" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#fdba74">llama.cpp</text><text x="107" y="68" text-anchor="middle" font-size="12" fill="#fdba74">runtime GGUF direct</text><text x="107" y="91" text-anchor="middle" font-size="11" fill="#94a3b8">flags + embedding</text></g>
  <g transform="translate(755 220)"><rect width="215" height="115" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="107" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">MLX-LM</text><text x="107" y="68" text-anchor="middle" font-size="12" fill="#93c5fd">Python natif Apple</text><text x="107" y="91" text-anchor="middle" font-size="11" fill="#94a3b8">expérimentations + tuning</text></g>
  <g fill="none" stroke="#94a3b8" stroke-width="2"><path d="M137.5 335 V358 H500" /><path d="M377.5 335 V358 H500" /><path d="M622.5 335 V358 H500" /><path d="M862.5 335 V358 H500" /></g><path d="M500 358 V385" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="180" y="385" width="640" height="55" rx="12" fill="#1d4ed8" stroke="#2563eb" /><text x="500" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#93c5fd">Mêmes prompts • même contexte • précision comparable • mémoire mesurée</text></g>
</svg>
