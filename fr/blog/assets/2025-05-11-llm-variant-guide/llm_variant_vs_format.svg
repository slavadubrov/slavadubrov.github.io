<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Six couches indépendantes dans un artefact de modèle à poids ouverts</title>
  <desc id="layers-desc">Six nœuds alignés distinguent la famille et la révision, le rôle dans l’entraînement, l’architecture, la représentation numérique, le conteneur et la disposition, ainsi que le runtime et le matériel. Le conteneur et la disposition sont au centre, car un nom de format ne constitue qu’une seule couche de l’artefact.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#F7F7F4" />

  <text class="section" x="48" y="48">ARTEFACT DE MODÈLE — LIRE CHAQUE COUCHE SÉPARÉMENT</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="114">COUCHE 1</text>
  <text class="name" x="68" y="142">Famille + révision</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="114">COUCHE 2</text>
  <text class="name" x="364" y="142">Rôle dans l’entraînement</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="114">COUCHE 3</text>
  <text class="name" x="660" y="142">Architecture</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="250">COUCHE 4</text>
  <text class="name" x="68" y="278">Représentation numérique</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="364" y="250" fill="#C50E72">FOCUS · COUCHE 5</text>
  <text class="name" x="364" y="278" fill="#C50E72">Conteneur + disposition</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="250">COUCHE 6</text>
  <text class="name" x="660" y="278">Runtime + matériel</text>

  <path d="M48 360H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="392">EXEMPLES</text>
  <text class="note" x="48" y="420">GPTQ et AWQ décrivent la quantification. GGUF et Safetensors décrivent le conditionnement.</text>
  <text class="note" x="48" y="448">MoE décrit la structure d’exécution. llama.cpp, vLLM et Transformers exécutent les artefacts pris en charge.</text>
  <text class="note" x="48" y="476">Un suffixe familier ne garantit ni la qualité, ni l’adéquation à la mémoire, ni la vitesse de serving.</text>
</svg>
