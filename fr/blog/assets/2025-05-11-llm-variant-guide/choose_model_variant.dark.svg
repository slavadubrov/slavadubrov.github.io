<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 736" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="variant-title variant-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="variant-title">Choisir une variante de modèle en séparant le rôle, la provenance et l’architecture</title>
  <desc id="variant-desc">Trois étapes séparent le rôle d’entraînement, la provenance éventuelle de la distillation et l’architecture d’exécution. Base, instruct et reasoning-tuned sont des choix de rôle ; distilled indique la provenance ; dense et mixture of experts décrivent l’architecture. Chaque candidat aboutit à une même étape d’évaluation de la release.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .stage { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="736" rx="14" fill="#0C1210" />

  <rect x="48" y="64" width="864" height="128" rx="12" fill="none" stroke="#2B3B33" />
  <text class="stage" x="72" y="102">1 · RÔLE D’ENTRAÎNEMENT</text>
  <text class="note" x="72" y="130">cible comportementale</text>
  <rect class="box" x="224" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="244" y="114">RÔLE</text>
  <text class="name" x="244" y="142">Base</text>
  <rect class="box" x="456" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="476" y="114">RÔLE</text>
  <text class="name" x="476" y="142">Instruct</text>
  <rect class="box" x="688" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="708" y="114">RÔLE</text>
  <text class="name" x="708" y="142">Reasoning-tuned</text>

  <path class="edge" d="M480 192v32" marker-end="url(#variant-arrow)" />

  <rect x="48" y="232" width="864" height="128" rx="12" fill="none" stroke="#2B3B33" />
  <text class="stage" x="72" y="270">2 · PROVENANCE</text>
  <text class="note" x="72" y="298">en cas de transfert</text>
  <rect class="store" x="384" y="248" width="192" height="96" rx="10" />
  <text class="kind" x="404" y="282">PROVENANCE</text>
  <text class="name" x="404" y="310">Distilled</text>

  <path class="edge" d="M480 360v32" marker-end="url(#variant-arrow)" />

  <rect x="48" y="400" width="864" height="128" rx="12" fill="none" stroke="#2B3B33" />
  <text class="stage" x="72" y="438">3 · ARCHITECTURE</text>
  <text class="note" x="72" y="466">forme d’exécution</text>
  <rect class="box" x="288" y="416" width="192" height="96" rx="10" />
  <text class="kind" x="308" y="450">ARCHITECTURE</text>
  <text class="name" x="308" y="478">Dense</text>
  <rect class="box" x="520" y="416" width="192" height="96" rx="10" />
  <text class="kind" x="540" y="450">ARCHITECTURE</text>
  <text class="name" x="540" y="478">Mixture of experts</text>

  <path class="edge" d="M480 528v32" marker-end="url(#variant-arrow)" />

  <rect x="328" y="568" width="304" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="348" y="602" fill="#FF6FB6">FOCUS · ÉTAPE D’ÉVALUATION DE LA RELEASE</text>
  <text class="name" x="348" y="630" fill="#FF6FB6">Évaluer l’unité de release</text>
  <text class="note" x="48" y="712">Mesurer le comportement sur les tâches, la conformité de l’interface, la latence et la mémoire maximale ; les labels ne remplacent jamais l’évaluation.</text>

  <defs>
    <marker id="variant-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
