<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 746" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="cff-title cff-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cff-title">Choisir un conteneur de modèle via une gate de compatibilité axée runtime</title><desc id="cff-desc">Une décision de runtime oriente vers llama.cpp, un serveur ou loader GPU, ou un runtime edge ou mobile. Chaque branche mène à l’artefact pris en charge — une conversion GGUF, un artefact de repository ou un export pris en charge — puis tous les chemins convergent vers une même gate de compatibilité avant le benchmarking.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cff-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="cff-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="746" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Le runtime d’abord, puis l’artefact</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Le matériel seul ne permet pas de choisir le conteneur. Choisissez le runtime, puis utilisez la structure</tspan><tspan x="32" dy="1.2em">d’artefact documentée.</tspan></text>
<rect x="200" y="112" width="320" height="72" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="360" y="140" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">DÉCISION</text><text x="360" y="164" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">Quel runtime ?</text>
