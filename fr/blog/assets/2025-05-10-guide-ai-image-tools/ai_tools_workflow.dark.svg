<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="workflow-title">Les enregistrements qui rendent un workflow d’image local reproductible</title>
  <desc id="workflow-desc">Une unité de release reproductible contient cinq enregistrements persistants : la version de l’application, les composants du modèle, les paramètres de génération, les dépendances du workflow et les preuves de sortie. Un fichier de modèle n’est qu’un élément de ce package.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .store { fill: #1b2621; stroke: #edf5f0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0c1210" />

  <rect x="48" y="64" width="864" height="344" rx="12" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="72" y="94" fill="#ff6fb6">FOCUS</text>
  <text class="name" x="148" y="94">Unité de release reproductible</text>

  <rect class="store" x="80" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="100" y="162">RUNTIME</text>
  <text class="name" x="100" y="190">Version de l’application</text>

  <rect class="store" x="360" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="162">MANIFEST</text>
  <text class="name" x="380" y="190">Composants du modèle</text>

  <rect class="store" x="640" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="660" y="162">PARAMETERS</text>
  <text class="name" x="660" y="190">Paramètres de génération</text>

  <rect class="store" x="220" y="264" width="240" height="96" rx="10" />
  <text class="kind" x="240" y="298">DEPENDENCIES</text>
  <text class="name" x="240" y="326">Graphe du workflow</text>

  <rect class="store" x="500" y="264" width="240" height="96" rx="10" />
  <text class="kind" x="520" y="298">EVIDENCE</text>
  <text class="name" x="520" y="326">Enregistrement de sortie</text>

  <path d="M48 440h48" fill="none" stroke="#2b3b33" stroke-width="1.5" />
  <text class="note" x="112" y="445">Figez les identifiants ensemble ; le checkpoint seul ne permet pas de reproduire le résultat.</text>
</svg>
