<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="aitooldt-title aitooldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="aitooldt-title">Une carte de décision à trois branches sélectionne un outil selon l’état à préserver, puis un test d’acceptation ciblé confirme la stack exacte.</title><desc id="aitooldt-desc">Selon que le workflow doit être préservé dans une application native, un graphe inspectable ou une interface existante, la première branche est sélectionnée : Draw Things ou DiffusionBee, ComfyUI, ou AUTOMATIC1111 ou Fooocus. Chaque branche nécessite néanmoins de confirmer sa stack exacte ; un échec vous renvoie à l’évaluation d’un autre candidat avant l’exécution du test d’acceptation ciblé représentatif.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="aitooldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="aitooldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="760" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Choisissez l’outil, puis validez la stack</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le tableau des surfaces de contrôle indique où se trouve l’état. Ce test vérifie s’il persiste.</text>
<rect x="200" y="112" width="320" height="96" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="360" y="152" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">DÉCISION</text><text x="360" y="176" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">Quel état doit persister ?</text>
