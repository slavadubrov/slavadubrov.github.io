<text x="32" y="738" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Comparez les outils uniquement avec le même checkpoint, la même résolution, le même nombre d’étapes</tspan><tspan x="32" dy="1.2em">et la même précision.</tspan></text>
