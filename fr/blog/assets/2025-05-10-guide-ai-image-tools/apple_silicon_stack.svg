<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="memstack-title memstack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="memstack-title">Le pool de mémoire unifiée d’Apple Silicon est partagé, et non illimité, entre cinq usages simultanés.</title><desc id="memstack-desc">La charge système de macOS et des autres applications, les composants des poids du modèle, l’espace de travail du runtime et les adapters chargés en option puisent tous dans un seul pool de mémoire. La marge de travail disponible est celle qui doit rester avant que la génération n’entraîne des échanges mémoire soutenus.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="memstack-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="memstack-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="848" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un pool partagé, cinq usages</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Usages conceptuels, non à l’échelle — Apple documente un pool unifié, pas une formule de</tspan><tspan x="32" dy="1.2em">dimensionnement.</tspan></text>
<rect x="32" y="104" width="656" height="656" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">POOL DE MÉMOIRE UNIFIÉE</text>
<path d="M58 152h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 152h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="62" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">SYSTÈME</text><text x="62" y="213" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E">macOS et applications</text><text x="62" y="235" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Évolue pendant le travail.</text>
<path d="M58 272h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 272h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="289.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">POIDS</text><text x="62" y="333" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Composants du modèle</text><text x="62" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Checkpoint, encodeurs, VAE.</text>
<path d="M58 392h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 392h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ESPACE DE TRAVAIL</text><text x="62" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Activations et runtime</text><text x="62" y="475" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Attention, état intermédiaire.</text>
<path d="M58 512h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 512h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">CHARGEMENT OPTIONNEL</text><text x="62" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Adapters et contrôles</text><text x="62" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">LoRA, ControlNet, upscaler.</text>
<path d="M58 632h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M58 632h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="62" y="649.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS</text><text x="62" y="693" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Marge de travail</text><text x="62" y="715" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Garder une marge avant les échanges mémoire soutenus.</text>
<path d="M32 792h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="818" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">La résolution, la taille de batch, l’architecture, la précision et les étapes chargées modifient chaque usage.</text>
</svg>
