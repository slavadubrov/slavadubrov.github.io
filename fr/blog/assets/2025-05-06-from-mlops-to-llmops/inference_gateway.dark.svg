<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="gateway-dark-title gateway-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="gateway-dark-title">La gateway d’inférence est une frontière de politiques et de routage</title>
  <desc id="gateway-dark-desc">Une application envoie un contrat stable et une identité de manifest à une gateway d’inférence. La gateway applique l’authentification, les quotas, le routage, les retries, la politique de cache et la propagation des traces avant de choisir une route hébergée, auto-hébergée ou de fallback. Chaque branche atteint une gate d’évaluation commune.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="560" rx="14" fill="#0C1210" /><text class="kind" x="48" y="44">FRONTIÈRE DE ROUTAGE — LA POLITIQUE EST CENTRALE, PAS LA VÉRITÉ DE LA TÂCHE</text>
  <rect class="box" x="48" y="168" width="208" height="96" rx="10" /><text class="kind" x="68" y="202">APPLICATION</text><text class="name" x="68" y="230">Contrat stable</text>
  <rect x="320" y="168" width="288" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="344" y="202" fill="#FF6FB6">GATEWAY D’INFÉRENCE</text><text class="name" x="344" y="230" fill="#FF6FB6"><tspan x="344">Politiques + routage gérés en</tspan><tspan x="344" dy="1.2em">propre</tspan></text><path d="M320 304h288" stroke="#2B3B33" /><text class="note" x="320" y="328">auth · quota · région · budget</text><text class="note" x="320" y="352">retry · breaker · cache · trace</text>
  <rect class="external" x="688" y="64" width="256" height="96" rx="10" /><text class="kind" x="708" y="98">ROUTE EXTERNE</text><text class="name" x="708" y="126" fill="#A8B8AF">Fournisseur hébergé</text>
  <rect class="box" x="688" y="184" width="256" height="96" rx="10" /><text class="kind" x="708" y="218">ROUTE GÉRÉE EN PROPRE</text><text class="name" x="708" y="246">Runtime auto-hébergé</text>
  <rect class="external" x="688" y="304" width="256" height="96" rx="10" /><text class="kind" x="708" y="338">ROUTE DE FALLBACK</text><text class="name" x="708" y="366" fill="#A8B8AF"><tspan x="708">Changement de</tspan><tspan x="708" dy="1.2em">comportement explicite</tspan></text>
  <path class="edge" d="M256 216h56" marker-end="url(#gateway-dark-arrow)" /><path class="edge" d="M608 192h40a12 12 0 0 0 12-12v-56a12 12 0 0 1 12-12h8" marker-end="url(#gateway-dark-arrow)" /><path class="edge" d="M608 216h72" marker-end="url(#gateway-dark-arrow)" /><path class="edge" d="M608 240h40a12 12 0 0 1 12 12v88a12 12 0 0 0 12 12h8" marker-end="url(#gateway-dark-arrow)" />
  <path class="edge" d="M944 112h80v312H816v24" marker-end="url(#gateway-arrow)" /><path class="edge" d="M944 232h80" /><path class="edge" d="M944 352h80" />
  <rect x="688" y="448" width="256" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="708" y="473">GATE D’ÉVALUATION</text><text class="name" x="708" y="498">Comparer chaque route</text>
  <defs><marker id="gateway-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
