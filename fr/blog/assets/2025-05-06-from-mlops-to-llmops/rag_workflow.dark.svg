<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-dark-title rag-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rag-dark-title">Parcours d’ingestion, de serving et d’évaluation RAG</title>
  <desc id="rag-dark-desc">Une source versionnée est analysée et transformée en embeddings dans un index vectoriel. Au moment du serving, la requête d’un tenant est autorisée et récupère les éléments de preuve classés. La qualité de la retrieval est vérifiée avant l’assemblage du contexte et la génération ; la qualité de la réponse est vérifiée séparément.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="488" rx="14" fill="#0C1210" /><text class="kind" x="48" y="44">INGESTION — CONSTRUIRE UN PRODUIT DE DONNÉES VERSIONNÉ</text>
  <rect class="store" x="48" y="72" width="232" height="96" rx="10" /><text class="kind" x="68" y="106">SOURCE</text><text class="name" x="68" y="134">Snapshot + état ACL</text>
  <rect class="box" x="320" y="72" width="232" height="96" rx="10" /><text class="kind" x="340" y="106">PIPELINE</text><text class="name" x="340" y="134">Analyser + segmenter + générer les embeddings</text>
  <rect class="store" x="592" y="72" width="232" height="96" rx="10" /><text class="kind" x="612" y="106">INDEX</text><text class="name" x="612" y="134">Vecteurs versionnés</text>
  <path class="edge" d="M280 120h32" marker-end="url(#rag-dark-arrow)" /><path class="edge" d="M552 120h32" marker-end="url(#rag-dark-arrow)" />
  <text class="kind" x="48" y="228">SERVING — ÉVALUER LA RETRIEVAL AVANT LA GÉNÉRATION</text>
  <rect class="box" x="48" y="256" width="192" height="96" rx="10" /><text class="kind" x="68" y="290">REQUÊTE</text><text class="name" x="68" y="318">Requête + tenant</text>
  <rect class="box" x="280" y="256" width="232" height="96" rx="10" /><text class="kind" x="300" y="290">RETRIEVAL</text><text class="name" x="300" y="318">Autoriser + classer</text>
  <rect x="552" y="256" width="208" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="572" y="290" fill="#FF6FB6">GARDE DE RETRIEVAL</text><text class="name" x="572" y="318" fill="#FF6FB6">Les éléments de preuve sont-ils utilisables ?</text>
  <rect class="box" x="800" y="256" width="272" height="96" rx="10" /><text class="kind" x="820" y="290">GÉNÉRATION</text><text class="name" x="820" y="318">Assembler + répondre</text>
  <path class="edge" d="M240 304h32" marker-end="url(#rag-dark-arrow)" /><path class="edge" d="M512 304h32" marker-end="url(#rag-dark-arrow)" /><path class="edge" d="M760 304h32" marker-end="url(#rag-dark-arrow)" />
  <path class="edge" d="M708 168v40H396v40" stroke-dasharray="2 6" marker-end="url(#rag-dark-arrow)" /><rect x="504" y="196" width="168" height="24" rx="6" fill="#0C1210" /><text class="note" x="588" y="213" text-anchor="middle">version d’index sélectionnée</text>
  <path d="M800 408h272" stroke="#2B3B33" /><text class="kind" x="800" y="400">GARDE DE RÉPONSE</text><text class="note" x="800" y="432">étayage · citation · réussite de la tâche</text>
  <defs><marker id="rag-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
