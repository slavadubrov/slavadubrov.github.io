<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="gateway-title gateway-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="gateway-title">La passerelle d’inférence est une frontière de politiques et de routage</title><desc id="gateway-desc">Une application envoie un contrat stable à une passerelle d’inférence qui applique l’authentification, les quotas, le routage, les nouvelles tentatives, la politique de cache et la propagation des traces, puis choisit une route hébergée, auto-hébergée ou de repli. Chaque route passe par une même gate d’évaluation avant la mise en production.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="gateway-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="gateway-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="580" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">La passerelle centralise les politiques, pas la vérité métier de la tâche</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Chaque route — hébergée, auto-hébergée ou de repli — passe par la même gate d’évaluation.</text>
