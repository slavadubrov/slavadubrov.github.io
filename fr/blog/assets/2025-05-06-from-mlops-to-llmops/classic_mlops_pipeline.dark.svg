<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="mlopsloop-title mlopsloop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mlopsloop-title">La boucle de contrôle MLOps dont les systèmes de foundation models ont toujours besoin</title><desc id="mlopsloop-desc">La traçabilité alimente un build reproductible, une release gate hors ligne, un déploiement progressif et l’observabilité. Les éléments probants des incidents reviennent à la release gate, tandis que l’identité immuable, la gouvernance et le rollback couvrent toute la boucle.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mlopsloop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="mlopsloop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="450" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">La boucle de contrôle MLOps reste applicable</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Le comportement change ; la discipline qui l’encadre, elle, ne change pas.</text>
