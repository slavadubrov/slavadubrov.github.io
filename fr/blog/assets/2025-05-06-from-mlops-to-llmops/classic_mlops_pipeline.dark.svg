<path d="M32 356h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="382" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">L’identité immuable, la gouvernance et le rollback couvrent toute la boucle.</text>
<text x="32" y="404" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Les éléments probants de l’incident reviennent à la release gate avant la prochaine promotion.</text>
