<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="dist-dark-title dist-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="dist-dark-title">Model-parallel training across four GPU workers</title>
  <desc id="dist-dark-desc">One foundation-model revision is partitioned into four sequential layer shards, each assigned to a GPU worker. The workers contribute to a shared gradient synchronization step before the next update.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#0C1210"/><text class="kind" x="48" y="44">MODEL PARALLELISM — PARTITION LAYERS, THEN SYNCHRONIZE</text>
  <rect class="store" x="328" y="72" width="304" height="62" rx="10"/><text class="kind" x="348" y="97">MODEL REVISION</text><text class="name" x="348" y="122">Foundation model</text>
  <path class="edge" d="M480 134v32H144v30"/><path class="edge" d="M480 166H368v30"/><path class="edge" d="M480 166h112v30"/><path class="edge" d="M480 166h336v30"/>
  <rect class="box" x="48" y="196" width="192" height="96" rx="10"/><text class="kind" x="68" y="230">GPU WORKER 1</text><text class="name" x="68" y="258">Layers 1–10</text>
  <rect class="box" x="272" y="196" width="192" height="96" rx="10"/><text class="kind" x="292" y="230">GPU WORKER 2</text><text class="name" x="292" y="258">Layers 11–20</text>
  <rect class="box" x="496" y="196" width="192" height="96" rx="10"/><text class="kind" x="516" y="230">GPU WORKER 3</text><text class="name" x="516" y="258">Layers 21–30</text>
  <rect class="box" x="720" y="196" width="192" height="96" rx="10"/><text class="kind" x="740" y="230">GPU WORKER 4</text><text class="name" x="740" y="258">Layers 31–40</text>
  <path class="edge" d="M144 292v32h336"/><path class="edge" d="M368 292v32h112"/><path class="edge" d="M592 292v32H480"/><path class="edge" d="M816 292v32H480"/><path class="edge" d="M480 324v16" marker-end="url(#dist-dark-arrow)"/>
  <rect x="384" y="340" width="192" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="404" y="365" fill="#FF6FB6">SYNC STEP</text><text class="name" x="404" y="390" fill="#FF6FB6">Aggregate gradients</text>
  <defs><marker id="dist-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker></defs>
</svg>
