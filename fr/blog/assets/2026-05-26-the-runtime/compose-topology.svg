<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">La stack de référence Docker Compose comporte un worker servant de harness, trois stores qu’il gère directement et trois services facultatifs activés par des profils.</title><desc id="composetop-desc">Un worker LangGraph agit comme propriétaire de l’exécution et harness : il récupère les jobs dans une file Redis, écrit les checkpoints dans Postgres et lit la mémoire froide depuis Qdrant. Un sidecar MCP isole les identifiants des tools du worker, un collecteur OpenTelemetry rassemble les traces et les métriques, et une stack d’observabilité les stocke — tous trois étant activés par des profils Compose facultatifs. Claude est l’API de modèle externe appelée directement par le worker.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
