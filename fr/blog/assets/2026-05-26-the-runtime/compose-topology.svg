<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le worker ne détient ni modèle ni identifiants : Claude et le sidecar MCP restent externes.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Redis est facultatif uniquement en développement local, car le runner synchrone peut appeler directement le worker.</text>
