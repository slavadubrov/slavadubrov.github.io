<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fm-title fm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fm-title">Quatre classes d’échec et les contrôles du runtime qui les contiennent</title>
  <desc id="fm-desc">Les échecs de qualité, de coût, d’état et de contexte convergent vers les contrôles du runtime. La barrière d’acceptation est mise en évidence, car elle empêche un agent de déclarer terminé un travail incomplet.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#A8B8AF}.box{stroke:#EDF5F0;stroke-width:1.5;fill:#141D19}.edge{stroke:#A8B8AF;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="560" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">CLASSE D’ÉCHEC</text><text class="section" x="584" y="48">POINT DE CONTRÔLE</text>
  <rect class="box" x="48" y="72" width="280" height="96" rx="10" /><text class="kind" x="68" y="106">ÉCHEC · QUALITÉ</text><text class="name" x="68" y="134">Achèvement prématuré</text><text class="note" x="68" y="154">oubli des fonctionnalités</text>
  <rect class="box" x="48" y="192" width="280" height="96" rx="10" /><text class="kind" x="68" y="226">ÉCHEC · COÛT</text><text class="name" x="68" y="254">Tempêtes de retries</text><text class="note" x="68" y="274">dépense incontrôlée en tokens</text>
  <rect class="box" x="48" y="312" width="280" height="96" rx="10" /><text class="kind" x="68" y="346">ÉCHEC · ÉTAT</text><text class="name" x="68" y="374">Effets de bord dupliqués</text><text class="note" x="68" y="394">dérive du workspace · perte après crash</text>
  <rect class="box" x="48" y="432" width="280" height="80" rx="10" /><text class="kind" x="68" y="462">ÉCHEC · CONTEXTE</text><text class="name" x="68" y="490">Le reset fait perdre l’intention</text>

  <rect x="584" y="72" width="328" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="604" y="106" fill="#FF6FB6">FOCUS · BARRIÈRE D’ACCEPTATION</text><text class="name" x="604" y="134" fill="#FF6FB6">Un reviewer vierge refuse par défaut</text>
  <rect class="box" x="584" y="192" width="328" height="96" rx="10" /><text class="kind" x="604" y="226">CONTRÔLE · BUDGET</text><text class="name" x="604" y="254">Plafonds · backoff · kill switch</text>
  <rect class="box" x="584" y="312" width="328" height="96" rx="10" /><text class="kind" x="604" y="346">CONTRÔLE · PERSISTANCE</text><text class="name" x="604" y="374">Logs · checkpoint · isolation</text>
  <rect class="box" x="584" y="432" width="328" height="80" rx="10" /><text class="kind" x="604" y="462">CONTRÔLE · COLD BOOT</text><text class="name" x="604" y="490">Recharger les artefacts de progression</text>
  <path d="M328 120H576" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#fm-signal)" /><text class="note" x="408" y="110" fill="#FF6FB6">vérifier les artefacts</text>
  <path class="edge" d="M328 240H576" marker-end="url(#fm-arrow)" /><text class="note" x="420" y="230">borner le travail</text>
  <path class="edge" d="M328 360H576" marker-end="url(#fm-arrow)" /><text class="note" x="414" y="350">reprendre en toute sécurité</text>
  <path class="edge" d="M328 472H576" marker-end="url(#fm-arrow)" /><text class="note" x="412" y="462">restaurer l’intention</text>
  <text class="note" x="48" y="544">Les mesures d’atténuation résident en dehors de la mémoire du modèle ; les mêmes contrôles survivent donc au redémarrage d’un worker.</text>
  <defs><marker id="fm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="fm-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
