<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Cartographie des benchmarks des algorithmes de quantification et des kernels d’exécution</title>
  <desc id="desc">Diagramme montrant qu’un algorithme crée un checkpoint compressé, tandis que les kernels d’exécution déterminent la vitesse de serving et les résultats des benchmarks.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="520" fill="#F7F7F4" />
  <text y="42" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="#17211B" x="480">Algorithme + kernel + workload = résultat</text>
  <text y="72" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#17211B" x="480">Un checkpoint quantifié n’implique pas automatiquement un déploiement plus rapide.</text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="130" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B" x="153">Méthode de quantification</text>
    <text y="194" text-anchor="middle" font-size="14" fill="#17211B" x="153">GPTQ</text>
    <text y="220" text-anchor="middle" font-size="14" fill="#17211B" x="153">AWQ</text>
    <text y="246" text-anchor="middle" font-size="14" fill="#17211B" x="153">SmoothQuant</text>
    <text y="268" text-anchor="middle" font-size="12" fill="#17211B" x="153">détermine l’erreur du checkpoint</text>

    <rect x="375" y="130" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B" x="480">Kernel d’exécution</text>
    <text y="194" text-anchor="middle" font-size="14" fill="#17211B" x="480">Marlin</text>
    <text y="220" text-anchor="middle" font-size="14" fill="#17211B" x="480">BitBLAS</text>
    <text y="246" text-anchor="middle" font-size="14" fill="#17211B" x="480">Tensor cores FP8</text>
    <text y="268" text-anchor="middle" font-size="12" fill="#17211B" x="480">détermine le chemin d’exécution</text>

    <rect x="702" y="130" width="210" height="150" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B" x="807">Workload</text>
    <text y="194" text-anchor="middle" font-size="14" fill="#17211B" x="807">longueur du prompt</text>
    <text y="220" text-anchor="middle" font-size="14" fill="#17211B" x="807">concurrence</text>
    <text y="246" text-anchor="middle" font-size="14" fill="#17211B" x="807">objectif de qualité</text>
    <text y="268" text-anchor="middle" font-size="12" fill="#17211B" x="807">détermine le goulet d’étranglement</text>
  </g>

  <g stroke="#59645E" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
    <path d="M 258 205 L 365 205" />
    <path d="M 585 205 L 692 205" />
    <path d="M 807 280 C 807 330 480 325 480 365" />
    <path d="M 480 280 L 480 365" />
    <path d="M 153 280 C 153 330 480 325 480 365" />
  </g>

  <rect x="260" y="365" width="440" height="100" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text y="395" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#17211B" x="480">Benchmarkez la stack réelle</text>
  <text y="424" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#17211B" x="480">qualité : perplexité, métriques de tâches, générations</text>
  <text y="448" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#17211B" x="480">serving : débit, TTFT, ITL, mémoire, concurrence</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
