<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%" role="img" aria-label="Quantization Mechanics: Weight-Only vs. Weight-Activation" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Mécanismes de quantification : poids seuls vs poids-activations</title>
  <desc>Schéma : mécanismes de quantification.</desc>
  <defs>
    <!-- Drop Shadow Filter -->

    <!-- Gradients -->




  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="850" height="520" fill="#0C1210" rx="12" />

  <!-- Title -->
  <text y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0" x="30">
    Poids seuls (W4A16) vs poids-activations (W8A8/FP8)
  </text>
  <text y="60" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#EDF5F0" x="30">
    Comparaison du transfert mémoire GPU, du traitement par registres et de l’utilisation des Tensor Cores
  </text>

  <!-- Divider Line -->
  <line x1="425" y1="90" x2="425" y2="490" stroke="#A8B8AF" stroke-dasharray="5,5" stroke-width="2" />

  <!-- SECTION 1: WEIGHT-ONLY (W4A16) -->
  <g>
    <!-- Subtitle -->
    <rect x="30" y="90" width="365" height="30" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" rx="6" />
    <text y="110" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#EDF5F0" x="212.5">
      A. Quantification des poids seuls (p. ex. W4A16 GPTQ/AWQ)
    </text>
    <text y="142" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="212.5">
      Optimise le décodage limité par la mémoire (petit batch / flux unique)
    </text>

    <!-- GPU VRAM (HBM) -->
    <rect x="50" y="160" width="320" height="75" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="8" />
    <text y="180" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="210">VRAM GPU (HBM)</text>

    <!-- weights box -->
    <rect x="65" y="192" width="135" height="30" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#141D19" x="132.5">Poids (4 bits)</text>
    <!-- activations box -->
    <rect x="220" y="192" width="135" height="30" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#141D19" x="287.5">Activations (BF16 16 bits)</text>

    <!-- Data Flow Arrows -->
    <path d="M 132.5 235 L 132.5 272" fill="none" stroke="#A8B8AF" stroke-width="2.5" marker-end="url(#arrow-orange)" />
    <path d="M 287.5 235 L 287.5 272" fill="none" stroke="#EDF5F0" stroke-width="2.5" marker-end="url(#arrow-blue)" />

    <!-- GPU Compute Block -->
    <rect x="50" y="285" width="320" height="150" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="8" class="visual-focus" />
    <text y="305" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="210">Exécution dans la SRAM / les registres</text>

    <!-- Dequantization Step -->
    <rect x="65" y="320" width="135" height="40" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="132.5">Déquantification dans le kernel</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="132.5">INT 4 bits → FP 16 bits</text>

    <!-- Activations path (Unchanged) -->
    <rect x="220" y="320" width="135" height="40" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="287.5">Conserver en 16 bits</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="287.5">Aucune déquantification</text>

    <!-- Arrow from Dequant to Tensor Core -->
    <path d="M 132.5 360 L 132.5 388 C 132.5 400, 180 400, 195 400" fill="none" stroke="#A8B8AF" stroke-dasharray="3,3" stroke-width="1.5" />

    <!-- Activations entry line -->
    <path d="M 287.5 285 L 287.5 320" fill="none" stroke="#EDF5F0" stroke-width="1.5" />

    <!-- Activations bypass dequant -->
    <path d="M 287.5 360 L 287.5 388 C 287.5 400, 240 400, 225 400" fill="none" stroke="#EDF5F0" stroke-width="1.5" />

    <!-- Math execution box -->
    <rect x="180" y="385" width="60" height="35" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="406" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#141D19" x="210">BF16 TC</text>
    <text y="445" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="210">Calcul sur les poids en 16 bits</text>

    <!-- Bottom Note -->
    <rect x="50" y="450" width="320" height="40" fill="#141D19" stroke="#A8B8AF" rx="6" />
    <text y="466" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EDF5F0" x="210">Le goulet d’étranglement du calcul demeure :</text>
    <text y="478" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="210">Les économies de VRAM sont effectives, mais sans accélération du calcul.</text>
  </g>

  <!-- SECTION 2: WEIGHT-ACTIVATION (W8A8/FP8) -->
  <g transform="translate(425, 0)">
    <!-- Subtitle -->
    <rect x="30" y="90" width="365" height="30" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" rx="6" />
    <text y="110" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#EDF5F0" x="212.5">
      B. Quantification poids-activations (W8A8 / FP8)
    </text>
    <text y="142" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="212.5">
      Accélère le prefill limité par le calcul (forte concurrence / serving)
    </text>

    <!-- GPU VRAM (HBM) -->
    <rect x="50" y="160" width="320" height="75" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="8" />
    <text y="180" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="210">VRAM GPU (HBM)</text>

    <!-- weights box -->
    <rect x="65" y="192" width="135" height="30" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#141D19" x="132.5">Poids (8 bits)</text>
    <!-- activations box -->
    <rect x="220" y="192" width="135" height="30" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#141D19" x="287.5">Activations (8 bits)</text>

    <!-- Data Flow Arrows -->
    <path d="M 132.5 235 L 132.5 280" fill="none" stroke="#A8B8AF" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <path d="M 287.5 235 L 287.5 280" fill="none" stroke="#A8B8AF" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- GPU Compute Block -->
    <rect x="50" y="285" width="320" height="150" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="8" />
    <text y="305" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="210">Exécution dans la SRAM / les registres</text>

    <!-- Pass Directly to Tensor Cores (Weights) -->
    <rect x="65" y="320" width="135" height="40" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="132.5">Aucun surcoût de déquantification</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="132.5">Alimentation directe du matériel</text>

    <!-- Pass Directly to Tensor Cores (Activations) -->
    <rect x="220" y="320" width="135" height="40" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#EDF5F0" x="287.5">Aucun surcoût de déquantification</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="287.5">Alimentation directe du matériel</text>

    <!-- Arrow from Weights to Tensor Core -->
    <path d="M 132.5 360 L 132.5 388 C 132.5 400, 180 400, 195 400" fill="none" stroke="#A8B8AF" stroke-width="1.5" />

    <!-- Arrow from Activations to Tensor Core -->
    <path d="M 287.5 360 L 287.5 388 C 287.5 400, 240 400, 225 400" fill="none" stroke="#A8B8AF" stroke-width="1.5" />

    <!-- Math execution box -->
    <rect x="180" y="385" width="60" height="35" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" rx="4" />
    <text y="406" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#141D19" x="210">INT8/FP8</text>
    <text y="445" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="210">Exécution directe dans le matériel</text>

    <!-- Bottom Note -->
    <rect x="50" y="450" width="320" height="40" fill="#141D19" stroke="#A8B8AF" rx="6" />
    <text y="466" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EDF5F0" x="210">Accélération matérielle complète :</text>
    <text y="478" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="210">Débloque 2× le débit théorique des Tensor Cores (TOPS).</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1B2621" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1B2621" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1B2621" />
    </marker>
  </defs>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
