<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Carte de lecture de la quantification</title>
  <desc id="desc">Carte de décision reliant les goulots d’étranglement du serving aux choix de quantification et aux contrôles de validation.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="520" fill="#F7F7F4" />
  <text y="42" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#17211B" x="480">Commencer par le goulot d’étranglement</text>
  <text y="72" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#17211B" x="480">La même précision peut être adaptée ou non selon le matériel, le runtime, le cache et les évaluations.</text>

  <rect x="365" y="105" width="230" height="74" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
  <text y="134" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#17211B" x="480" style="font-size: 15px;">Qu’est-ce qui limite le serving ?</text>
  <text y="160" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#17211B" x="480"><tspan x="480">mémoire, calcul, cache, runtime ou</tspan><tspan x="480" dy="1.2em">pipeline d’image</tspan></text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="45" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="127">Mémoire des poids</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="127">W4A16 GPTQ/AWQ</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="127" style="font-size: 11px;">décodage, faire tenir le modèle</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="127"><tspan x="127">écart de qualité aux</tspan><tspan x="127" dy="1.2em">évaluations</tspan></text>

    <rect x="230" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="312">Débit</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="312">FP8 W8A8</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="312">kernels Ada/Hopper</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="312">mesurer TTFT/ITL</text>

    <rect x="415" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="497">Contexte long</text>
    <text y="292" text-anchor="middle" font-size="13" fill="#17211B" x="497">KV cache</text>
    <text y="310" text-anchor="middle" font-size="13" fill="#17211B" x="497">quantification</text>
    <text y="332" text-anchor="middle" font-size="12" fill="#17211B" x="497">le cache domine la VRAM</text>
    <text y="350" text-anchor="middle" font-size="12" fill="#17211B" x="497">sonder la récupération</text>

    <rect x="600" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="682">Runtime local</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="682">GGUF / MLX</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="682">CPU, Apple, edge</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="682">mesurer la RAM locale</text>

    <rect x="785" y="240" width="130" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="850">Pipeline d’image</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="850">SVDQuant</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="850">VAE sensible</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="850">évaluations visuelles</text>
  </g>

  <g stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 480 179 C 480 205 127 208 127 235" />
    <path d="M 480 179 C 480 207 312 211 312 235" />
    <path d="M 480 179 C 480 210 497 211 497 235" />
    <path d="M 480 179 C 480 207 682 211 682 235" />
    <path d="M 480 179 C 480 205 850 208 850 235" />
  </g>

  <rect x="190" y="405" width="580" height="62" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text y="430" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#17211B" x="480">Puis lancer les contrôles de déploiement</text>
  <text y="455" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#17211B" x="480" style="font-size: 11px;">perplexité + métriques de tâche + échantillons de génération + sondes de contexte long + benchmarks de serving</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
