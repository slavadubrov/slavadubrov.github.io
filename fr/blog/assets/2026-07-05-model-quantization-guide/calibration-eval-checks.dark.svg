<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="calibration-title calibration-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="calibration-title">Vérifications de calibration et d’évaluation pour les modèles quantifiés</title>
  <desc id="calibration-desc">Des échantillons représentatifs de la production alimentent la calibration, la quantification et un test de serving sur le runtime cible. Une gate de déploiement vérifie ensuite la qualité, le comportement en contexte long, la vitesse et la mémoire.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="calibration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">QUANTIFICATION · VALIDATION DU DÉPLOIEMENT</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Un checkpoint qui se charge n’a pas réussi la gate de déploiement</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Calibrer et tester sur la charge, le runtime et le matériel cibles.</text>

  <path d="M240 200H272" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />
  <path d="M464 200H496" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />
  <path d="M688 200H720" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />
  <path d="M816 248V300a20 20 0 0 1-20 20H480v32" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />

  <rect x="48" y="152" width="192" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · JEU DE TRAFIC</text>
  <text x="68" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Échantillons de trafic</text>
  <text x="68" y="236" fill="#a8b8af" font-size="13">RAG · SQL · code · chat</text>

  <rect x="272" y="152" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="292" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TRAITEMENT · CALIBRATION</text>
  <text x="292" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Calibrer les plages</text>
  <text x="292" y="236" fill="#a8b8af" font-size="13" style="font-size: 11px;">Caviardés · longueurs appariées</text>

  <rect x="496" y="152" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="516" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TRAITEMENT · QUANTIFICATION</text>
  <text x="516" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Choisir la précision</text>
  <text x="516" y="236" fill="#a8b8af" font-size="13">GPTQ · AWQ · FP8 · INT8</text>

  <rect x="720" y="152" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="740" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TRAITEMENT · TEST DE SERVING</text>
  <text x="740" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Runtime cible</text>
  <text x="740" y="236" fill="#a8b8af" font-size="13">Matériel · forme de charge</text>

  <text x="160" y="334" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ACCEPTER UNIQUEMENT APRÈS LA RÉUSSITE DES DEUX GROUPES DE VÉRIFICATIONS</text>
  <rect x="160" y="352" width="640" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="184" y="384" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCUS · GATE DE DÉPLOIEMENT</text>
  <text x="184" y="414" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Qualité · tâches · contexte long</text>
  <text x="512" y="414" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Débit · TTFT · ITL · mémoire</text>
  <text x="184" y="436" fill="#a8b8af" font-size="13">Écart de perplexité · régressions · échantillons de génération</text>
</svg>
