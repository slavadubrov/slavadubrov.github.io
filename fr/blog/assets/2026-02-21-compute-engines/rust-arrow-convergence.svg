<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rustarrow-title rustarrow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rustarrow-title">Exécution native et échanges compatibles avec Arrow</title><desc id="rustarrow-desc">Quatre moteurs — Polars, DataFusion, Daft, Ray Data — reposent sur une fondation commune de composants natifs, souvent en Rust, et sur le format colonnaire Apache Arrow. Ensemble, ils permettent d’éviter un garbage collector à traçage, de réduire le coût des échanges zero-copy via l’interface PyCapsule et de bénéficier d’une concurrence vérifiée à la compilation. Le runtime exact et le comportement des copies varient selon le moteur et l’opérateur.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
