<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="pipeline-title pipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="pipeline-title">Exécution séquentielle et en pipeline</title><desc id="pipeline-desc">Chronologie conceptuelle comparant un chemin orienté par étapes, où tous les cœurs CPU terminent avant le démarrage du GPU et où le GPU reste inactif pendant l’étape 1, avec un traitement en flux pipeliné, où les lots suivants sont téléchargés et analysés tandis que les lots précédents sont déjà sur le GPU, ce qui réduit le temps d’inactivité lorsque les étapes sont équilibrées.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="pipeline-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="pipeline-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="760" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Exécution séquentielle et en pipeline</text>
<rect x="32" y="96" width="656" height="264" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">CHEMIN ORIENTÉ PAR ÉTAPES</text>
<path d="M66 152h260a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M66 152h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="70" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CŒURS CPU 1 + 2</text><text x="70" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Téléchargement + analyse de P1, P2</text>
<path d="M66 220h260a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M66 220h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="70" y="237.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">GPU</text><text x="70" y="267" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">Inactif — en attente du CPU</text>
<path d="M352 180h32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#pipeline-arrow-flow)" /><text x="368" y="168.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">barrière</text>
<path d="M410 152h112a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-112a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M410 152h112a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-132a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="414" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">CPU</text><text x="414" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">Inactif</text>
<path d="M410 220h112a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-112a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M410 220h112a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-132a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="414" y="237.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">GPU</text><text x="414" y="267" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B" style="font-size: 11px;">Génération des embeddings de P1+P2</text>
<text x="552" y="184" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12.5px;">Le GPU attend pendant</text>
<text x="552" y="204" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">toute l’étape 1.</text>
<rect x="32" y="400" width="656" height="280" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="428" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">TRAITEMENT EN FLUX PIPELINÉ (DAFT / RAY DATA)</text>
<path d="M66 456h90a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M66 456h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="70" y="473.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CPU 1</text><text x="70" y="497" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B" style="font-size: 11px;">Télécharg. lots</text>
<path d="M194 456h90a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M194 456h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="198" y="473.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CPU 1</text><text x="198" y="497" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">… suite</text>
<path d="M66 516h160a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-160a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M66 516h160a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-180a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="70" y="533.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CPU 2</text><text x="70" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">Analyse des lots</text>
<path d="M266 516h130a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M266 516h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="270" y="533.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">GPU</text><text x="270" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B" style="font-size: 11px;">Génération des embeddings des lots</text>
<path d="M166 478h18" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M236 538h20" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="56" y="596" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="56">Les lots suivants sont téléchargés et analysés tandis que les lots précédents génèrent déjà leurs</tspan><tspan x="56" dy="1.2em">embeddings sur le GPU.</tspan></text>
<path d="M56 632h600" stroke="#D8DDD9" stroke-width="1" />
<text x="56" y="656" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="56">Davantage de chevauchement : le débit reste supérieur, car aucune étape n’attend que toutes les</tspan><tspan x="56" dy="1.2em">autres aient terminé.</tspan></text>
<path d="M32 704h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="730" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le chevauchement peut réduire le temps d’inactivité lorsque les étapes sont équilibrées.</text>
</svg>
