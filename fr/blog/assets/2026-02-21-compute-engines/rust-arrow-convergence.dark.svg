<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Convergence de Rust et d’Arrow</title>
  <desc id="desc">Couches reliant les APIs Python à une exécution native en Rust et à l’échange de données colonnaires compatibles avec Arrow.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="450" rx="12" fill="#0C1210" stroke="#2B3B33" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#EDF5F0">Exécution native et échanges compatibles avec Arrow</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#EDF5F0">Le runtime exact et le comportement des copies varient selon le moteur et l’opérateur.</text>

  <!-- LAYER 1: The Engines (Top) -->

  <!-- Polars -->
  <g class="anim-box layer-1-a">
    <path d="M 120 160 Q 120 150 130 150 L 250 150 Q 260 150 260 160 L 260 190 L 120 190 Z" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="190" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#EDF5F0">Polars</text>
    <text x="190" y="185" text-anchor="middle" font-size="11" fill="#EDF5F0">Bibliothèque DataFrame</text>
  </g>

  <!-- DataFusion -->
  <g class="anim-box layer-1-b">
    <path d="M 280 160 Q 280 150 290 150 L 410 150 Q 420 150 420 160 L 420 190 L 280 190 Z" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="350" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#EDF5F0">DataFusion</text>
    <text x="350" y="185" text-anchor="middle" font-size="11" fill="#EDF5F0">Moteur de requêtes</text>
  </g>

  <!-- Daft -->
  <g class="anim-box layer-1-c">
    <path d="M 480 160 Q 480 150 490 150 L 610 150 Q 620 150 620 160 L 620 190 L 480 190 Z" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="550" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#EDF5F0">Daft</text>
    <text x="550" y="185" text-anchor="middle" font-size="11" fill="#EDF5F0">Multimodal</text>
  </g>

  <!-- Ray -->
  <g class="anim-box layer-1-d">
    <path d="M 640 160 Q 640 150 650 150 L 770 150 Q 780 150 780 160 L 780 190 L 640 190 Z" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="710" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#EDF5F0">Ray Data</text>
    <text x="710" y="185" text-anchor="middle" font-size="11" fill="#EDF5F0">Passage à l’échelle distribué</text>
  </g>

  <!-- LAYER 2: The Unified Foundation (Middle) -->
  <g class="anim-box layer-2">
    <!-- Main base container -->
    <rect x="120" y="190" width="660" height="90" fill="#141D19" stroke="#EDF5F0" stroke-width="2" class="visual-focus" />

    <!-- Divider -->
    <line x1="450" y1="190" x2="450" y2="280" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Left side: Rust -->
    <text x="285" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#EDF5F0">Composants natifs</text>
    <text x="285" y="250" text-anchor="middle" font-size="12" fill="#EDF5F0">Souvent implémentés en Rust</text>

    <!-- Right side: Apache Arrow -->
    <text x="615" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#EDF5F0">Apache Arrow</text>
    <text x="615" y="250" text-anchor="middle" font-size="12" fill="#EDF5F0">Format colonnaire en mémoire</text>
  </g>

  <!-- LAYER 3: The Outcomes (Bottom) -->
  <g class="anim-box layer-3">
    <!-- Connecting arrows -->
    <line x1="255" y1="280" x2="255" y2="308" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arr)" />
    <line x1="450" y1="280" x2="450" y2="308" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arr)" />
    <line x1="645" y1="280" x2="645" y2="308" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arr)" />

    <rect x="155" y="310" width="200" height="80" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="255" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Sans GC traçage</text>
    <text x="255" y="365" text-anchor="middle" font-size="11" fill="#EDF5F0">Ownership et borrowing</text>
    <text x="255" y="380" text-anchor="middle" font-size="11" fill="#EDF5F0">Évite les pauses du GC dans le code Rust</text>

    <rect x="350" y="310" width="200" height="80" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="450" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Échange moins coûteux</text>
    <text x="450" y="365" text-anchor="middle" font-size="11" fill="#EDF5F0">Interface PyCapsule</text>
    <text x="450" y="380" text-anchor="middle" font-size="11" fill="#EDF5F0">Les buffers compatibles peuvent être réutilisés</text>

    <rect x="545" y="310" width="200" height="80" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="645" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Concurrence plus sûre</text>
    <text x="645" y="365" text-anchor="middle" font-size="11" fill="#EDF5F0">Vérifications à la compilation</text>
    <text x="645" y="380" text-anchor="middle" font-size="11" fill="#EDF5F0">Les data races sont rejetées en Rust sûr</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
