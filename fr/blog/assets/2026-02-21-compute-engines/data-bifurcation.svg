<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="bifurc-title bifurc-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="bifurc-title">Deux formes de charge</title><desc id="bifurc-desc">Les charges tabulaires filtrent, joignent et agrègent des lignes. Les pipelines multimodaux peuvent transformer les entrées en fragments et embeddings, avec un débit limité par les lectures, le décodage CPU ou l’inférence GPU. Testez des données représentatives avant de choisir la taille ou le moteur.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="bifurc-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="bifurc-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="540" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Deux formes de charge</text>
<rect x="32" y="96" width="312" height="352" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">DONNÉES STRUCTURÉES</text>
<rect x="376" y="96" width="312" height="352" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="392" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">AI MULTIMODALE</text>
<path d="M58 140h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 140h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">TABULAIRE</text><text x="62" y="195" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Lignes et colonnes</text>
<path d="M402 140h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M402 140h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="406" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">RESSOURCES MIXTES</text><text x="406" y="195" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Images, vidéo, texte</text>
<text x="48" y="244" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Filtres, jointures, agrégations.</text>
<text x="48" y="268" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un nœud puissant peut suffire ;</text>
<text x="48" y="290" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">mesurez d’abord la mémoire et les E/S.</text>
<text x="392" y="244" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Lectures, décodage, inférence GPU :</text>
<text x="392" y="268" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">l’étape la plus lente fixe le débit.</text>
<text x="392" y="290" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="392">Une entrée peut produire de nombreux</tspan><tspan x="392" dy="1.2em">fragments.</tspan></text>
<path d="M58 324h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 324h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="62" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">CANDIDATS LOCAUX</text><text x="62" y="379" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Polars / DuckDB / DataFusion</text>
<path d="M402 324h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M402 324h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="406" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">CANDIDATS POUR LE PIPELINE</text><text x="406" y="379" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Ray Data / Daft</text>
<path d="M32 476h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="502" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Choisissez à l’aide d’un test de bout en bout sur des données représentatives.</text>
</svg>
