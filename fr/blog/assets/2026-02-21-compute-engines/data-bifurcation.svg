<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Charges structurées et multimodales</title>
  <desc id="desc">Comparaison entre le traitement tabulaire orienté CPU et les pipelines qui coordonnent les entrées, le prétraitement CPU et l’inférence GPU.</desc>
  <defs>
    <style>
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      .cpu-anim { transform-origin: 100px 125px; animation: pulse 2s infinite ease-in-out; }
      .gpu-anim { transform-origin: 550px 125px; animation: pulse 2s infinite ease-in-out; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Background -->
  <rect width="900" height="400" rx="12" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Deux mondes de la donnée</text>

  <!-- Divider -->
  <line x1="450" y1="55" x2="450" y2="370" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- LEFT: Reality A -->
  <rect x="30" y="55" width="390" height="310" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="225" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#17211B">Données structurées</text>

  <!-- CPU icon -->
  <g class="cpu-anim">
    <rect x="60" y="100" width="80" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <rect x="72" y="110" width="56" height="30" rx="3" fill="#FFFFFF" />
    <text x="100" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">CPU</text>
  </g>

  <!-- Table icon -->
  <rect x="180" y="100" width="100" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
  <line x1="180" y1="118" x2="280" y2="118" stroke="#17211B" stroke-width="1.5" />
  <line x1="180" y1="130" x2="280" y2="130" stroke="#17211B" stroke-width="0.8" />
  <line x1="180" y1="140" x2="280" y2="140" stroke="#17211B" stroke-width="0.8" />
  <line x1="220" y1="100" x2="220" y2="150" stroke="#17211B" stroke-width="0.8" />
  <text x="230" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B"><tspan x="230">Lignes et</tspan><tspan x="230" dy="1.2em">colonnes</tspan></text>

  <!-- Characteristics -->
  <text x="60" y="185" font-size="13" font-weight="bold" fill="#17211B">Généralement gourmand en CPU</text>
  <text x="60" y="205" font-size="12" fill="#17211B">Filtres, jointures et agrégations</text>
  <text x="60" y="230" font-size="13" font-weight="bold" fill="#17211B">Changer d’échelle après mesure</text>
  <text x="60" y="250" font-size="12" fill="#17211B">Un nœud puissant peut suffire</text>
  <text x="60" y="270" font-size="12" fill="#17211B">pour de nombreuses requêtes analytiques</text>

  <!-- Tag -->
  <rect x="55" y="295" width="340" height="50" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
  <text x="225" y="315" text-anchor="middle" font-size="11" fill="#17211B">Polars / DuckDB / DataFusion gèrent cela sur une seule machine.</text>
  <text x="225" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">Testez d’abord une stratégie de scale-up avant d’ajouter un cluster.</text>

  <!-- RIGHT: Reality B -->
  <rect x="480" y="55" width="390" height="310" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="675" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#17211B">AI multimodale</text>

  <!-- GPU icon -->
  <g class="gpu-anim">
    <rect x="510" y="100" width="80" height="50" rx="6" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
    <rect x="522" y="110" width="56" height="30" rx="3" fill="#FFFFFF" />
    <text x="550" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">GPU</text>
  </g>

  <!-- Media icons -->
  <g transform="translate(630, 100)">
    <rect width="30" height="24" rx="3" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="15" y="16" text-anchor="middle" font-size="11" fill="#17211B">IMG</text>
  </g>
  <g transform="translate(670, 100)">
    <rect width="30" height="24" rx="3" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="15" y="16" text-anchor="middle" font-size="11" fill="#17211B">VID</text>
  </g>
  <g transform="translate(710, 100)">
    <rect width="30" height="24" rx="3" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="15" y="16" text-anchor="middle" font-size="11" fill="#17211B">PDF</text>
  </g>
  <g transform="translate(750, 100)">
    <rect width="30" height="24" rx="3" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="15" y="16" text-anchor="middle" font-size="11" fill="#17211B">WAV</text>
  </g>

  <!-- Example utilization bar -->
  <rect x="620" y="132" width="220" height="14" rx="4" fill="#F2F2F5" stroke="#59645E" stroke-width="1.5" />
  <rect x="620" y="132" width="88" height="14" rx="4" fill="#F2F2F5" class="visual-focus" />
  <text x="730" y="164" text-anchor="middle" font-size="11" fill="#17211B">Le débit suit l’étape la plus lente</text>

  <!-- Characteristics -->
  <text x="510" y="195" font-size="13" font-weight="bold" fill="#17211B">Souvent gourmande en accélérateurs</text>
  <text x="510" y="215" font-size="12" fill="#17211B">Images, vidéo, audio, tenseurs</text>
  <text x="510" y="240" font-size="13" font-weight="bold" fill="#17211B">Pipelines extensibles</text>
  <text x="510" y="260" font-size="12" fill="#17211B">1 ligne (parcours PDF) devient</text>
  <text x="510" y="278" font-size="12" fill="#17211B">des milliers de segments + embeddings</text>

  <!-- Tag -->
  <rect x="505" y="295" width="340" height="50" rx="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="675" y="315" text-anchor="middle" font-size="11" fill="#17211B">Ray Data et Daft exposent des contrôles pour</text>
  <text x="675" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">des ressources CPU et GPU mixtes.</text>

  <!-- Bottom note -->
  <rect x="250" y="375" width="400" height="22" rx="4" fill="#FFFFFF" />
  <text x="450" y="391" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">Choisissez après un test de bout en bout sur des données représentatives.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
