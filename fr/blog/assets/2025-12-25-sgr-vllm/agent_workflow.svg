<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Workflow de tarification avec des frontières distinctes entre schéma et politique</title>
  <desc id="desc">Une requête passe par un routage structuré, une récupération de fonctionnalités autorisée, une proposition structurée, une validation déterministe par la politique et une réponse basée sur un template. Les chemins d’échec mènent à un repli sûr.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="560" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Agent de tarification : frontières d’application observables</text>

  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(25 125)"><rect width="150" height="110" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2" /><text x="75" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Requête utilisateur</text><text x="75" y="72" text-anchor="middle" font-size="12" fill="#94a3b8">entrée non fiable</text></g>
    <text x="202" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(230 125)"><rect width="150" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="75" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Routage</text><text x="75" y="62" text-anchor="middle" font-size="12" fill="#cbd5e1">union discriminée</text><text x="75" y="85" text-anchor="middle" font-size="12" fill="#94a3b8">forme validée</text></g>
    <text x="407" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(435 125)"><rect width="150" height="110" rx="14" fill="#5b21b6" stroke="#2563eb" stroke-width="2" /><text x="75" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Récupération</text><text x="75" y="62" text-anchor="middle" font-size="12" fill="#cbd5e1">autoriser l’identifiant utilisateur</text><text x="75" y="85" text-anchor="middle" font-size="12" fill="#94a3b8">charger les fonctionnalités en temps réel</text></g>
    <text x="612" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(640 125)"><rect width="150" height="110" rx="14" fill="#9a3412" stroke="#ea580c" stroke-width="2" /><text x="75" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#fdba74">Proposition</text><text x="75" y="62" text-anchor="middle" font-size="12" fill="#cbd5e1">JSON Schema typé</text><text x="75" y="85" text-anchor="middle" font-size="12" fill="#94a3b8">forme validée</text></g>
    <text x="817" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(845 125)"><rect width="130" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="65" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Contrôle de politique</text><text x="65" y="62" text-anchor="middle" font-size="12" fill="#cbd5e1">plafond dynamique</text><text x="65" y="85" text-anchor="middle" font-size="12" fill="#94a3b8">appliqué par le code</text></g>

    <text x="910" y="286" text-anchor="middle" font-size="28" fill="#93c5fd">↓</text>
    <g transform="translate(785 315)"><rect width="190" height="90" rx="14" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="95" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Réponse basée sur un template</text><text x="95" y="64" text-anchor="middle" font-size="12" fill="#93c5fd">valeurs validées uniquement</text></g>

    <text x="620" y="459" text-anchor="end" font-size="13" fill="#fca5a5">tout contrôle rejeté →</text>
    <g transform="translate(670 420)"><rect width="190" height="80" rx="14" fill="#991b1b" stroke="#dc2626" stroke-width="2" /><text x="95" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">Repli sûr</text><text x="95" y="59" text-anchor="middle" font-size="12" fill="#fca5a5">rejeter, réessayer ou transmettre</text></g>
    <text x="500" y="535" text-anchor="middle" font-size="13" fill="#94a3b8">Les échecs de schéma et les échecs de politique sont gérés explicitement ; aucun n’est converti silencieusement en offre.</text>
  </g>
</svg>
