<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="workflow-title">Workflow d’un agent de tarification avec une porte de contrôle déterministe</title>
  <desc id="workflow-desc">La requête utilisateur est routée. Les demandes de tarification récupèrent les caractéristiques et produisent une proposition conforme au schéma, que la politique applicative doit approuver avant le renvoi d’une réponse. Les demandes générales contournent la tarification, et les propositions rejetées sont dirigées vers un fallback sécurisé.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="528" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">WORKFLOW · APPLICATION DU SCHÉMA ET POLITIQUE APPLICATIVE</text>

  <rect x="48" y="80" width="192" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="114">EXTERNE · ENTRÉE</text>
  <text class="name" x="68" y="143" fill="#A8B8AF">Requête utilisateur</text>
  <path class="edge" d="M240 128h24" marker-end="url(#workflow-arrow)" />
  <rect class="box" x="272" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="292" y="114">PROCESSUS · SGR</text>
  <text class="name" x="292" y="143">Router la requête</text>
  <path class="edge" d="M464 128h24" marker-end="url(#workflow-arrow)" />
  <rect class="store" x="496" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="516" y="114">STOCKAGE · CARACTÉRISTIQUES</text>
  <text class="name" x="516" y="143">Récupérer le contexte</text>
  <path class="edge" d="M688 128h24" marker-end="url(#workflow-arrow)" />
  <rect class="box" x="720" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="740" y="114">PROCESSUS · SGR</text>
  <text class="name" x="740" y="143">Proposition typée</text>

  <path class="edge" d="M816 176v56" marker-end="url(#workflow-arrow)" />
  <rect x="720" y="248" width="192" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="740" y="282" fill="#FF6FB6">FOCUS · CODE</text>
  <text class="name" x="740" y="311" fill="#FF6FB6">Vérification de la politique</text>
  <path class="edge" d="M720 296h-24" marker-end="url(#workflow-arrow)" />
  <text class="note" x="704" y="288" text-anchor="middle">accepter</text>
  <rect class="box" x="496" y="248" width="192" height="96" rx="10" />
  <text class="kind" x="516" y="282">PROCESSUS · SORTIE</text>
  <text class="name" x="516" y="311">Réponse basée sur un template</text>

  <path class="edge" d="M368 176v108a12 12 0 0 0 12 12h108" stroke-dasharray="7 6" marker-end="url(#workflow-arrow)" />
  <text class="note" x="446" y="288" text-anchor="middle">réponse générale</text>

  <path d="M816 344v40" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#workflow-arrow-signal)" />
  <rect x="824" y="352" width="56" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="852" y="369" text-anchor="middle" fill="#FF6FB6">rejeter</text>
  <rect class="box" x="720" y="400" width="192" height="62" rx="10" />
  <text class="kind" x="740" y="426">PROCESSUS · FALLBACK</text>
  <text class="name" x="740" y="449">Rejeter ou transmettre</text>

  <path d="M48 480h640" stroke="#2B3B33" />
  <text class="note" x="48" y="508">La validité du schéma permet au code d’inspecter la proposition ; seule la porte de contrôle de la politique peut autoriser l’offre.</text>
  <defs>
    <marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker>
    <marker id="workflow-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker>
  </defs>
</svg>
