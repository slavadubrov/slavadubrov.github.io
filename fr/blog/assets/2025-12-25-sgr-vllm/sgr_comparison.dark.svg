<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="comparison-title comparison-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="comparison-title">Comparaison entre le prompt engineering, le chain-of-thought et le raisonnement guidé par schéma</title>
  <desc id="comparison-desc">Trois colonnes alignées comparent la forme de sortie, le mécanisme de contrôle et l’adéquation aux applications. Le raisonnement guidé par schéma est mis en évidence, car le constrained decoding bloque les sorties non conformes au schéma, tandis que les erreurs sémantiques nécessitent toujours une validation.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">COMPARAISON · MÊME REQUÊTE, CONTRÔLE DIFFÉRENT</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="106">APPROCHE · PROMPT</text>
  <text class="name" x="68" y="135">Prompt engineering</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="106">APPROCHE · COT</text>
  <text class="name" x="372" y="135">Chain of thought</text>
  <rect x="656" y="72" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="676" y="106" fill="#FF6FB6">AXE · SGR</text>
  <text class="name" x="676" y="135" fill="#FF6FB6">Guidé par schéma</text>

  <text class="kind" x="48" y="216">FORME DE SORTIE</text>
  <text class="note" x="48" y="244">texte variable</text>
  <text class="note" x="352" y="244">prose de raisonnement libre</text>
  <text class="note" x="656" y="244">JSON / Pydantic rigide</text>
  <path d="M48 264h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="300">CONTRÔLE</text>
  <text class="note" x="48" y="328">persuasion sémantique</text>
  <text class="note" x="352" y="328">prompting heuristique par étapes</text>
  <text class="note" x="656" y="328">masque de grammaire par token</text>
  <path d="M48 348h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="384">ADÉQUATION AUX APPLICATIONS</text>
  <text class="note" x="48" y="412">le parseur doit extraire les champs</text>
  <text class="note" x="352" y="412">un lecteur doit interpréter la prose</text>
  <text class="note" x="656" y="412" style="font-size: 11px;">les champs sont validés ; le sens doit encore être vérifié</text>
</svg>
