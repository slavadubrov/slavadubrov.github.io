<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uve-title uve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uve-title">Les quatre frontières des workflows uv</title>
  <desc id="uve-desc">Un seul exécutable uv gère quatre cycles de vie distincts : les installations d’interpréteurs, l’état des projets, les scripts autonomes et les outils en ligne de commande isolés. Homebrew et macOS restent propriétaires des applications hôtes et des bibliothèques natives.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0C1210" />

  <text class="section" x="48" y="36">UN EXÉCUTABLE · QUATRE FRONTIÈRES DE RESPONSABILITÉ</text>

  <rect x="336" y="56" width="288" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="356" y="80" fill="#FF6FB6">FOCUS · RUNTIME</text>
  <text class="name" x="356" y="103" fill="#FF6FB6">Exécutable uv</text>

  <path class="edge" d="M480 118v24H254v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142h226v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142v142H254v24" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 284h226v24" marker-end="url(#uve-arrow)" />

  <rect class="store" x="48" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="210">PYTHON GÉRÉ · STORE</text>
  <text class="name" x="68" y="238">Installations d’interpréteurs</text>
  <text class="note" x="68" y="258">répertoire de données · installer, figer, découvrir</text>

  <rect class="store" x="500" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="210">PROJET · STORE</text>
  <text class="name" x="520" y="238">Déclarations, lock, environnement</text>
  <text class="note" x="520" y="258">cycle de vie du dépôt · .venv local</text>

  <rect class="store" x="48" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="346">SCRIPT PEP 723 · STORE</text>
  <text class="name" x="68" y="374">Unité de livraison monofichier</text>
  <text class="note" x="68" y="394">métadonnées inline · cache isolé</text>

  <rect class="store" x="500" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="346">OUTIL CLI · STORE</text>
  <text class="name" x="520" y="374">Commande éphémère ou installée</text>
  <text class="note" x="520" y="394">cache uvx · PATH uniquement sur choix explicite</text>

  <path d="M48 438h24" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="84" y="443">Hors de cette frontière : Homebrew et macOS sont propriétaires des applications hôtes et des bibliothèques natives.</text>

  <defs>
    <marker id="uve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
