<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="silentfailure-title silentfailure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="silentfailure-title">Un flux en quatre étapes attribue chaque échec silencieux à la métrique qui permet de l’identifier.</title><desc id="silentfailure-desc">Les éléments probants progressent du corpus source à l’ensemble des documents éligibles, puis au contexte classé et à la réponse générée. L’ensemble des documents éligibles est central, car un filtre strict peut supprimer le document de référence avant le classement. Chaque étape est associée à la métrique qui y détecte un échec : métriques d’analyse, Recall@k et taux de fausse exclusion, métriques de position et de distracteurs, puis fidélité avec précision et rappel des citations.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="silentfailure-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="silentfailure-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="520" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Trouvez l’étape qui a supprimé les éléments probants</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le premier lien rompu plafonne tous les scores à sa droite.</text>
