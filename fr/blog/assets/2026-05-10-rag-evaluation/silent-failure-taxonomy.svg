<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Silent failure taxonomy with the metric that catches each mode" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Taxonomie des échecs silencieux et métrique qui détecte chaque mode</title>
  <defs>
    <filter id="shadowSF" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Taxonomie des échecs silencieux</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">Chaque mode d’échec est associé à la métrique qui le détecte. Sans cette métrique, le bug est invisible.</text>

  <!-- Root -->
  <rect x="475" y="78" width="230" height="44" rx="22" fill="#dc2626" filter="url(#shadowSF)" />
  <text y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" x="590">Échec silencieux (RAG)</text>

  <!-- Trunk: 4 main branches -->
  <line x1="540" y1="122" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="570" y1="122" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="610" y1="122" x2="730" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="640" y1="122" x2="1010" y2="170" stroke="#94a3b8" stroke-width="1.4" />

  <!-- ====== Branch A: Ingestion ====== -->
  <rect x="40" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="170">Échecs d’ingestion</text>

  <!-- A1: Parse loss -->
  <rect x="40" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Perte au parsing</text>
  <text y="261" font-size="10" fill="#334155" x="50">les tableaux s’effondrent · notes de bas de page</text>
  <text y="275" font-size="10" fill="#334155" x="50">supprimées · OCR brouille les chiffres</text>
  <text y="285" font-size="9" font-style="italic" fill="#64748b" x="50">détecté par : CER/WER, TEDS</text>

  <!-- A2: Chunk break -->
  <rect x="40" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Rupture de chunk</text>
  <text y="336" font-size="10" fill="#334155" x="50">la plage de réponse est répartie sur deux</text>
  <text y="350" font-size="10" fill="#334155" x="50">chunks ; aucun ne contient toutes les preuves</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="50">détecté par : containment de la plage de réponse</text>

  <!-- A3: Dedup miss -->
  <rect x="40" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Erreur de déduplication</text>
  <text y="411" font-size="10" fill="#334155" x="50">une fusion abusive corrompt la réponse ;</text>
  <text y="425" font-size="10" fill="#334155" x="50">une conservation abusive noie le bon document</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="50">détecté par : précision/rappel de déduplication</text>

  <!-- A4: Normalization -->
  <rect x="40" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Dérive de normalisation</text>
  <text y="486" font-size="10" fill="#334155" x="50">un décalage NFC/NFKC compromet</text>
  <text y="500" font-size="10" fill="#334155" x="50">la résolution exacte des alias</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="50">détecté par : parité NFC/NFKC, couverture des alias</text>

  <!-- ====== Branch B: Embedding/Index ====== -->
  <rect x="320" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="450">Embedding et index</text>

  <!-- B1: Embedding miss -->
  <rect x="320" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Échec d’embedding</text>
  <text y="261" font-size="10" fill="#334155" x="330">un terme métier se trouve hors de la</text>
  <text y="275" font-size="10" fill="#334155" x="330">distribution d’entraînement du modèle</text>
  <text y="285" font-size="9" font-style="italic" fill="#64748b" x="330">détecté par : Recall@k métier vs. baseline</text>

  <!-- B2: ANN drop -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Baisse due à l’approximation ANN</text>
  <text y="336" font-size="10" fill="#334155" x="330">efSearch HNSW trop faible ; le vecteur</text>
  <text y="350" font-size="10" fill="#334155" x="330">de référence existe mais n’est pas atteint</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="330">détecté par : rappel ANN vs. index plat</text>

  <!-- B3: Embedding drift -->
  <rect x="320" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Dérive d’embedding</text>
  <text y="411" font-size="10" fill="#334155" x="330">changement de version du modèle du provider ;</text>
  <text y="425" font-size="10" fill="#334155" x="330">les anciens vecteurs ne sont plus alignés</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="330">détecté par : stabilité des NN sur probe set</text>

  <!-- B4: Stale index -->
  <rect x="320" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Index obsolète</text>
  <text y="486" font-size="10" fill="#334155" x="330">retard de fraîcheur ; les requêtes s’exécutent</text>
  <text y="500" font-size="10" fill="#334155" x="330">sur la vérité de la semaine dernière</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="330">détecté par : retard de fraîcheur p99, %-stale</text>

  <!-- ====== Branch C: Online retrieval (HOT — silent killers) ====== -->
  <rect x="600" y="170" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="730">Retrieval en ligne</text>

  <!-- C1: Filter exclude (highlighted) -->
  <rect x="600" y="225" width="260" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#991b1b" x="610">Fausse exclusion par filtre</text>
  <text y="261" font-size="10" fill="#334155" x="610">un prédicat strict exclut le document de référence ;</text>
  <text y="275" font-size="10" fill="#334155" x="610">Recall@k baisse, mais la cause reste indéterminée</text>
  <text y="285" font-size="9" font-style="italic" fill="#991b1b" x="610">détecté par : taux de fausse exclusion du filtre</text>

  <!-- C2: Rerank miss -->
  <rect x="600" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#991b1b" x="610">Échec du reranking</text>
  <text y="336" font-size="10" fill="#334155" x="610">le cross-encoder rétrograde le bon</text>
  <text y="350" font-size="10" fill="#334155" x="610">document derrière des distracteurs plausibles</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="610">détecté par : ΔnDCG, robustesse aux distracteurs (RGB)</text>

  <!-- C3: Lost in middle -->
  <rect x="600" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#991b1b" x="610">Perdu au milieu</text>
  <text y="411" font-size="10" fill="#334155" x="610">le chunk de référence est dans le contexte, mais en</text>
  <text y="425" font-size="10" fill="#334155" x="610">position 7/10 ; le modèle l’ignore</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="610">détecté par : évaluation stratifiée par position</text>

  <!-- C4: Bad rewrite -->
  <rect x="600" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#991b1b" x="610">Régression de réécriture de requête</text>
  <text y="486" font-size="10" fill="#334155" x="610">HyDE hallucine une entité qui</text>
  <text y="500" font-size="10" fill="#334155" x="610">oriente le retrieval dans la mauvaise direction</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="610">détecté par : gain/perte de la réécriture en A/B</text>

  <!-- ====== Branch D: Generation/Citation ====== -->
  <rect x="880" y="170" width="260" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="1010">Génération</text>

  <!-- D1: Hallucination -->
  <rect x="880" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#5b21b6" x="890">Hallucination</text>
  <text y="261" font-size="10" fill="#334155" x="890">affirmation non étayée, souvent une</text>
  <text y="275" font-size="10" fill="#334155" x="890">entité absente du contexte</text>
  <text y="285" font-size="9" font-style="italic" fill="#64748b" x="890">détecté par : faithfulness, HHEM, FActScore</text>

  <!-- D2: No citation -->
  <rect x="880" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#5b21b6" x="890">Théâtre des citations</text>
  <text y="336" font-size="10" fill="#334155" x="890">la plage citée ne</text>
  <text y="350" font-size="10" fill="#334155" x="890">justifie en réalité pas l’affirmation voisine</text>
  <text y="360" font-size="9" font-style="italic" fill="#64748b" x="890">détecté par : précision/rappel des citations (TREC support)</text>

  <!-- D3: Wrong refusal -->
  <rect x="880" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#5b21b6" x="890">Abstention incorrecte</text>
  <text y="411" font-size="10" fill="#334155" x="890">« Je ne sais pas » alors que la réponse</text>
  <text y="425" font-size="10" fill="#334155" x="890">est dans le contexte (ou inversement)</text>
  <text y="435" font-size="9" font-style="italic" fill="#64748b" x="890">détecté par : NoMIRACL, exactitude de l’abstention</text>

  <!-- D4: Schema break -->
  <rect x="880" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#5b21b6" x="890">Rupture de schéma/vocabulaire</text>
  <text y="486" font-size="10" fill="#334155" x="890">la sortie syntaxiquement valide sélectionne</text>
  <text y="500" font-size="10" fill="#334155" x="890">un ID d’ontologie erroné mais valide</text>
  <text y="510" font-size="9" font-style="italic" fill="#64748b" x="890">détecté par : conformité au vocabulaire</text>

  <!-- Footer band -->
  <rect x="40" y="555" width="1100" height="68" rx="8" fill="#f0fdf4" stroke="#ea580c" stroke-width="1.2" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="590">Guide de lecture</text>
  <text y="598" text-anchor="middle" font-size="10" fill="#9a3412" x="590">Chaque échec reste silencieux en l’absence de sa métrique. La seule « justesse de la réponse » standard indique qu’un problème existe — pas où.</text>
  <text y="614" text-anchor="middle" font-size="10" fill="#9a3412" x="590">La branche rouge (exclusion par filtre, échec du rerank, perdu au milieu, mauvaise réécriture) est à l’origine de la plupart des problèmes du RAG en production. Instrumentez-la en premier.</text>

  <!-- Visual cue: the 'red' propagation -->
  <rect x="40" y="640" width="1100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="662" font-size="11" font-weight="600" fill="#0f172a" x="60">Règle de propagation :</text>
  <text y="682" font-size="10" fill="#334155" x="60">Un échec à gauche impose un plafond de rappel à tout ce qui se trouve à droite. Un mauvais parsing plafonne le chunking. Un mauvais chunking plafonne le retrieval.</text>
  <text y="696" font-size="10" fill="#334155" x="60">Un mauvais retrieval plafonne le reranking. Un mauvais reranking plafonne la génération. La faithfulness ne mesure que le dernier maillon — elle ne peut pas voir où la chaîne est rompue.</text>
</svg>
