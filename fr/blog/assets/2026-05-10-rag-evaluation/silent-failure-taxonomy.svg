<text x="32" y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Recall@k détecte l’absence du document de référence.</text>
<text x="32" y="464" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Une métrique de fausse exclusion identifie le filtre comme cause ; la fidélité ne permet pas de le diagnostiquer.</text>
