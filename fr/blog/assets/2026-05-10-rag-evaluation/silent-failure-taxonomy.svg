<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="silent-failure-title silent-failure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="silent-failure-title">Échecs silencieux de RAG et métrique qui identifie chaque source</title>
  <desc id="silent-failure-desc">Les éléments probants passent du corpus source à l’ensemble des candidats éligibles, puis au contexte classé et enfin à la réponse étayée. Chaque étape pointe vers une métrique de diagnostic. L’ensemble des candidats éligibles est mis en évidence, car un filtre strict peut supprimer le document de référence avant la retrieval.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="silent-failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
  <rect width="960" height="568" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">ÉCHEC SILENCIEUX · DE LA SOURCE À LA MÉTRIQUE</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Trouvez l’étape qui a supprimé les éléments probants</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Le premier maillon défaillant plafonne tous les scores à sa droite.</text>

  <rect x="48" y="136" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="64" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · SOURCE</text>
  <text x="64" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Artefacts du corpus</text>
  <text x="64" y="218" fill="#59645e" font-size="13">parser · segmenter · indexer</text>
  <path d="M232 184H264" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="136" width="184" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text x="288" y="168" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCUS · FILTRE</text>
  <text x="288" y="198" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Documents éligibles</text>
  <text x="288" y="218" fill="#59645e" font-size="13">le document de référence peut être supprimé</text>
  <path d="M456 184H488" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="136" width="184" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="512" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TRAITEMENT · RERANKER</text>
  <text x="512" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Contexte classé</text>
  <text x="512" y="218" fill="#59645e" font-size="13">déclassement · perte au milieu</text>
  <path d="M680 184H712" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="136" width="192" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="736" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TRAITEMENT · GÉNÉRATEUR</text>
  <text x="736" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Réponse étayée</text>
  <text x="736" y="218" fill="#59645e" font-size="13">affirmations · citations</text>

  <path d="M140 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="48" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="64" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · MÉTRIQUE</text>
  <text x="64" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">CER/WER · TEDS</text>
  <text x="64" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">rappel ANN · fraîcheur</text>
  <path d="M364 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="288" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · MÉTRIQUE</text>
  <text x="288" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recall@k</text>
  <text x="288" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Taux de fausse exclusion</text>
  <path d="M588 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="512" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · MÉTRIQUE</text>
  <text x="512" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ΔnDCG · distracteurs</text>
  <text x="512" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Test de position</text>
  <path d="M816 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="336" width="192" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="736" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · MÉTRIQUE</text>
  <text x="736" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Fidélité</text>
  <text x="736" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Précision/rappel des citations</text>

  <path d="M48 472H912" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="48" y="502" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k détecte le document de référence manquant.</text>
  <text x="48" y="528" fill="#59645e" font-size="13">Le taux de fausse exclusion identifie le prédicat du filtre comme cause ; la fidélité ne le peut pas.</text>
  <rect x="42" y="262" width="352" height="20" fill="#F7F7F4" />
  <text x="48" y="276" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">LA MÉTRIQUE QUI ATTRIBUE CHAQUE ÉCHEC</text>
</svg>
