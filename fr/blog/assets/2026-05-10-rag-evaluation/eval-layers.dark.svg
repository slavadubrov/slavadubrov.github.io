<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eval-layers-title eval-layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="eval-layers-title">Trois points où un système RAG peut perdre des éléments probants</title>
  <desc id="eval-layers-desc">Le diagramme suit les éléments probants à travers le corpus et l’index, le chemin de retrieval, puis la réponse et le trafic en production. Chaque couche dispose de métriques de diagnostic et est évaluée offline comme online. Le chemin de retrieval est mis en évidence, car les filtres peuvent exclure silencieusement le document de référence.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="eval-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">CHEMINEMENT DES ÉLÉMENTS PROBANTS · TROIS COUCHES D’ÉVALUATION</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Localisez le premier point où les éléments probants disparaissent</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Un score downstream ne peut pas expliquer une perte upstream.</text>

  <rect x="48" y="136" width="256" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="170" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · INGESTION</text>
  <text x="68" y="200" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Corpus et index</text>
  <path d="M304 184H344" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#eval-layers-arrow)" />
  <rect x="352" y="136" width="256" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="372" y="170" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCUS · À L’EXÉCUTION DE LA REQUÊTE</text>
  <text x="372" y="200" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Chemin de retrieval</text>
  <path d="M608 184H648" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#eval-layers-arrow)" />
  <rect x="656" y="136" width="256" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="676" y="170" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">TRAITEMENT · RÉPONSE</text>
  <text x="676" y="200" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Réponse et trafic en production</text>

  <path d="M48 264H304" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="288" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNOSTICS</text>
  <text x="48" y="314" fill="#a8b8af" font-size="13">CER/WER · TEDS · fraîcheur</text>
  <text x="48" y="334" fill="#a8b8af" font-size="13">Rappel ANN vs. recherche exacte</text>
  <path d="M352 264H608" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="352" y="288" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNOSTICS</text>
  <text x="352" y="314" fill="#a8b8af" font-size="13">Recall@k · taux de fausse exclusion</text>
  <text x="352" y="334" fill="#a8b8af" font-size="13">ΔnDCG · utilisation du contexte</text>
  <path d="M656 264H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="656" y="288" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNOSTICS</text>
  <text x="656" y="314" fill="#a8b8af" font-size="13">Fidélité · prise en charge par les citations</text>
  <text x="656" y="334" fill="#a8b8af" font-size="13">Dérive · latence · coût</text>

  <path d="M48 370H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="398" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">EXÉCUTEZ CHAQUE COUCHE DANS LES DEUX MODES</text>
  <rect x="48" y="418" width="408" height="62" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="444" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE · OFFLINE</text>
  <text x="68" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Jeu de référence · comparaison · gate CI</text>
  <rect x="504" y="418" width="408" height="62" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="524" y="444" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE · ONLINE</text>
  <text x="524" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Échantillons en production · signaux utilisateur · dérive</text>
</svg>
