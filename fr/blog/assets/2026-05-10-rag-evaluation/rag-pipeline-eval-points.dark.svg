<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ragpipeline-title ragpipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ragpipeline-title">Chaque étape d’un pipeline RAG s’accompagne d’un ensemble de métriques de diagnostic.</title><desc id="ragpipeline-desc">Le parcours d’ingestion — parser, nettoyer, segmenter, enrichir, générer les embeddings, indexer — s’accompagne de métriques d’ingestion. Le parcours de requête — réécrire, filtrer, récupérer, reranker, assembler le contexte — s’accompagne de métriques à l’exécution et constitue le point central, car le filtrage peut supprimer des éléments de preuve avant le ranking. Le parcours de réponse — générer, vérifier les affirmations, citer, retourner, observer le trafic — s’accompagne de métriques de réponse et de production.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ragpipeline-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ragpipeline-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="620" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Associez une métrique de diagnostic à chaque étape</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Les critères end-to-end décident de la mise en production ; les métriques par étape expliquent l’échec.</text>
<path d="M42 136h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 136h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PARCOURS D’INGESTION</text><text x="46" y="196" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Parser → nettoyer → segmenter</text><text x="46" y="218" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Générer les embeddings → indexer</text>
