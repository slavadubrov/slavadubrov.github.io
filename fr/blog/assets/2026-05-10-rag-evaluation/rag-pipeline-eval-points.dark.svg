<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-pipeline-title rag-pipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="rag-pipeline-title">Le pipeline RAG et les métriques qui diagnostiquent chaque étape</title>
  <desc id="rag-pipeline-desc">Trois voies de pipeline regroupées associent l’ingestion, le temps de requête et la production de réponses à leurs ensembles de métriques diagnostiques. Les métriques du temps de requête sont mises en évidence, car la réécriture et le filtrage peuvent supprimer des éléments probants avant le ranking.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="rag-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">PIPELINE RAG · MÉTRIQUES PAR ÉTAPE</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Associer une métrique diagnostique à chaque étape</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Les gates end-to-end décident de la mise en production ; les métriques par étape expliquent l’échec.</text>

  <rect x="48" y="136" width="400" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSUS · PARCOURS D’INGESTION</text>
  <text x="68" y="196" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Parser → nettoyer → segmenter → enrichir</text>
  <text x="68" y="218" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Embed → indexer</text>
  <path d="M448 184H504" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="136" width="400" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="532" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · ÉVALS D’INGESTION</text>
  <text x="532" y="196" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">CER/WER · TEDS · F1 des entités</text>
  <text x="532" y="218" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall ANN · latence de fraîcheur</text>

  <path d="M248 232V264" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="48" y="272" width="400" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="304" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSUS · PARCOURS DE REQUÊTE</text>
  <text x="68" y="332" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Réécrire → filtrer → récupérer</text>
  <text x="68" y="354" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Rerank → assembler le contexte</text>
  <path d="M448 320H504" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="272" width="400" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="532" y="304" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCUS · ÉVALS DE REQUÊTE</text>
  <text x="532" y="332" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k · taux de fausse exclusion</text>
  <text x="532" y="354" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">ΔnDCG · utilisation du contexte</text>

  <path d="M248 368V400" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="48" y="408" width="400" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="440" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSUS · PARCOURS DE RÉPONSE</text>
  <text x="68" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Générer → vérifier les claims → citer</text>
  <text x="68" y="490" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Retourner → observer le trafic</text>
  <path d="M448 456H504" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="408" width="400" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="532" y="440" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STOCKAGE · ÉVALS DE RÉPONSE</text>
  <text x="532" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Faithfulness · P/R des citations</text>
  <text x="532" y="490" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Drift · coût/requête · p95</text>

  <path d="M48 544H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="574" fill="#a8b8af" font-size="13">Une étape sans métrique peut échouer silencieusement alors que le système renvoie toujours une réponse.</text>
</svg>
