<text x="32" y="578" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Une étape sans métrique peut échouer sans que personne ne s’en aperçoive.</text>
