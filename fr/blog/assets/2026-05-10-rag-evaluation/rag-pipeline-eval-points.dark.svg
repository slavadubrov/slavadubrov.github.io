<path d="M42 272h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 272h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="289.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PARCOURS DE REQUÊTE</text><text x="46" y="332" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Réécrire → filtrer → récupérer</text><text x="46" y="354" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Reranker → assembler le contexte</text>
