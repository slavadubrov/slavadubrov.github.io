<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">Comparaison des backends de checkpoints Redis et PostgreSQL</title>
  <desc id="rp-desc">Comparaison alignée de Redis et PostgreSQL selon le temps d’accès, la durabilité, l’historique, le modèle de requête et l’adéquation opérationnelle. PostgreSQL est présenté comme le choix par défaut durable ; Redis comme l’option privilégiant la latence lorsque la perte de l’état récent est récupérable.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .rule { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">STOCKAGE · PRIORITÉ À LA LATENCE</text>
  <text class="name" x="92" y="136">Saver de checkpoints Redis</text>
  <text class="note" x="92" y="156" style="font-size: 11px;">À choisir lorsque la latence de reprise est le goulot d’étranglement.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">FOCUS · CHOIX PAR DÉFAUT DURABLE</text>
  <text class="name focus-text" x="540" y="136">Saver de checkpoints PostgreSQL</text>
  <text class="note" x="540" y="156" style="font-size: 12px;">À choisir lorsque la perte du travail terminé est inacceptable.</text>

  <text class="kind" x="72" y="206">TEMPS D’ACCÈS</text>
  <text class="value" x="72" y="230">Inférieur à la milliseconde</text>
  <text class="note" x="72" y="250">lectures et écritures en mémoire</text>
  <text class="kind" x="520" y="206">TEMPS D’ACCÈS</text>
  <text class="value" x="520" y="230">Quelques millisecondes</text>
  <text class="note" x="520" y="250">écriture en base à chaque limite</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">DURABILITÉ</text>
  <text class="value" x="72" y="318">Configuré avec AOF ou RDB</text>
  <text class="note" x="72" y="338">les écritures récentes peuvent être perdues ou évincées</text>
  <text class="kind" x="520" y="294">DURABILITÉ</text>
  <text class="value" x="520" y="318">Transactions ACID et WAL</text>
  <text class="note" x="520" y="338">le checkpoint subsiste après une écriture validée</text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">HISTORIQUE · MODÈLE DE REQUÊTE</text>
  <text class="value" x="72" y="406">Rétention et index de clés/recherche</text>
  <text class="note" x="72" y="426">l’historique dépend du saver et de la politique d’éviction</text>
  <text class="kind" x="520" y="382">HISTORIQUE · MODÈLE DE REQUÊTE</text>
  <text class="value" x="520" y="406">Historique durable avec SQL et JSONB</text>
  <text class="note" x="520" y="426">reprise, inspection et débogage par retour dans le temps</text>

  <text class="note" x="72" y="462"><tspan x="72">Meilleure adéquation : état de session récupérable et sensible à</tspan><tspan x="72" dy="1.2em">la latence.</tspan></text>
  <text class="note" x="520" y="462"><tspan x="520">Meilleure adéquation : tâches longues et récupération</tspan><tspan x="520" dy="1.2em">reproductible.</tspan></text>
  <text class="note" x="48" y="510"><tspan x="48">Mesurez la taille de votre état sérialisé et la fréquence d’écriture ; les benchmarks génériques de bases de données ne prédisent pas le coût des</tspan><tspan x="48" dy="1.2em">checkpoints.</tspan></text>
</svg>
