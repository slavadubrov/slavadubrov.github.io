<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12.5px;">README.md explique le répertoire à une personne ; PROGRESS.md transmet le travail inachevé à la prochaine session du modèle.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Git enregistre chaque modification effectuée ici par l’agent — un mauvais acquis peut être annulé en un revert.</text>
