<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12.5px;">La récupération depuis la mémoire froide bloque la planification ; l’extraction et le stockage de nouveaux faits, non.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">C’est le harness, et non un store particulier, qui décide de ce qui parvient effectivement à la fenêtre de</tspan><tspan x="32" dy="1.2em">contexte du modèle.</tspan></text>
</svg>
