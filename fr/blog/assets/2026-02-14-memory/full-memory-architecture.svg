<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="fullmem-title fullmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fullmem-title">Les mémoires chaude, froide et documentaire s’articulent autour d’un même harness d’agent via des chemins soit synchrones avec la requête, soit différés en arrière-plan.</title><desc id="fullmem-desc">Une requête utilisateur entre dans le harness d’agent, qui écrit et restaure les checkpoints sur le chemin critique, récupère les faits à long terme de manière synchrone avant la planification tout en différant l’écriture des nouveaux faits dans une tâche en arrière-plan, et lit la mémoire documentaire au démarrage tout en différant également les nouvelles écritures. Les arêtes pleines se trouvent sur le chemin d’exécution ou de reprise ; les arêtes en pointillés correspondent aux mises à jour en arrière-plan, qui ne doivent jamais bloquer la reasoning loop.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fullmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="fullmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Trois chemins mémoire, un seul harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le harness décide ce qui parvient au modèle ; les stores ne font que conserver l’état en attendant.</text>
