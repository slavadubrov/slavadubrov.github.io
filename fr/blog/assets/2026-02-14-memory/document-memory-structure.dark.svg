<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="dmd-title dmd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="dmd-title">Un répertoire de mémoire documentaire et ses quatre opérations</title>
  <desc id="dmd-desc">Le répertoire partagé .agent-memory contient des profils utilisateur, des recherches, des conventions et des schémas appris au format Markdown. Un agent lit, écrit, liste et recherche ces chemins via une petite interface de mémoire fichier. Le répertoire partagé est mis en évidence, car les humains comme les agents peuvent l’inspecter et le versionner.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="664" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="48" width="480" height="552" rx="12" />
  <text class="kind" x="72" y="76">ARBORESCENCE DOCUMENTAIRE · LISIBLE PAR L’HUMAIN</text>
  <rect class="focus" x="72" y="88" width="432" height="62" rx="10" />
  <text class="kind focus-text" x="92" y="112">FOCUS · RÉPERTOIRE PARTAGÉ</text>
  <text class="name focus-text" x="92" y="136">.agent-memory/</text>

  <path d="M96 150v377M96 221h16M96 323h16M96 425h16M96 527h16" fill="none" stroke="#2B3B33" stroke-width="1.5" />

  <rect class="store" x="112" y="190" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="214">STOCKAGE · PROFILS UTILISATEUR</text>
  <text class="name" x="132" y="238">user-profiles/user-123.md</text>

  <rect class="store" x="112" y="292" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="316">STOCKAGE · RECHERCHE</text>
  <text class="name" x="132" y="340">research/NVDA-2026-02.md</text>

  <rect class="store" x="112" y="394" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="418">STOCKAGE · CONVENTIONS</text>
  <text class="name" x="132" y="442">conventions/analysis-format.md</text>

  <rect class="store" x="112" y="496" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="520">STOCKAGE · ACQUIS</text>
  <text class="name" x="132" y="544">learnings/common-errors.md</text>

  <rect class="group" x="592" y="48" width="480" height="552" rx="12" />
  <text class="kind" x="616" y="76">MÉMOIRE FICHIER · QUATRE OPÉRATIONS</text>
  <text class="note" x="616" y="120">Chaque appel indique un chemin ou un motif de recherche ; chaque résultat reste inspectable.</text>

  <rect class="process" x="616" y="190" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="214">PROCESSUS · LIRE</text>
  <text class="name" x="636" y="238">Renvoyer le contenu Markdown</text>

  <rect class="process" x="616" y="292" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="316">PROCESSUS · ÉCRIRE</text>
  <text class="name" x="636" y="340">Créer ou remplacer un document</text>

  <rect class="process" x="616" y="394" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="418">PROCESSUS · LISTER</text>
  <text class="name" x="636" y="442">Rechercher des chemins de documents correspondants</text>

  <rect class="process" x="616" y="496" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="520">PROCESSUS · RECHERCHER</text>
  <text class="name" x="636" y="544">Renvoyer les paragraphes correspondants</text>

  <path class="edge" d="M504 119h56v408" />
  <path class="edge" d="M560 221h48" marker-end="url(#dmd-arrow)" />
  <path class="edge" d="M560 323h48" marker-end="url(#dmd-arrow)" />
  <path class="edge" d="M560 425h48" marker-end="url(#dmd-arrow)" />
  <path class="edge" d="M560 527h48" marker-end="url(#dmd-arrow)" />
  <text class="note" x="48" y="636">README.md décrit le répertoire ; PROGRESS.md transmet le travail inachevé à la prochaine session du modèle ; git enregistre chaque modification.</text>

  <defs>
    <marker id="dmd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
