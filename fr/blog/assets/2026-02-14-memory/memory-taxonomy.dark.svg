<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mtd-title mtd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mtd-title">Six types de mémoire d’agent répartis en trois niveaux de stockage</title>
  <desc id="mtd-desc">La mémoire chaude contient la mémoire de travail et la mémoire à court terme, la mémoire froide contient les mémoires épisodique et sémantique, et la mémoire documentaire stocke les connaissances du projet. La mémoire procédurale se situe en dehors des niveaux de stockage, dans les instructions système et les définitions des outils. La mémoire de travail est mise en évidence comme le contexte que le modèle peut utiliser maintenant.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">NIVEAU CHAUD · THREAD ACTUEL</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">FOCUS · TRAVAIL</text>
  <text class="name focus-text" x="92" y="174">Contexte actuel</text>
  <text class="note" x="92" y="194">une étape du modèle · non persisté</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">STOCKAGE · COURT TERME</text>
  <text class="name" x="92" y="310">Point de contrôle du thread</text>
  <text class="note" x="92" y="330" style="font-size: 11px;">minutes–heures · mettre en pause et reprendre</text>
  <text class="note" x="72" y="408"><tspan x="72">Utilisable maintenant ; les points de contrôle</tspan><tspan x="72" dy="1.2em">permettent la reprise.</tspan></text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">NIVEAU FROID · ENTRE THREADS</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">STOCKAGE · ÉPISODIQUE</text>
  <text class="name" x="444" y="174">Interactions passées</text>
  <text class="note" x="444" y="194">jours–mois · événements et historique</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">STOCKAGE · SÉMANTIQUE</text>
  <text class="name" x="444" y="310">Faits et préférences</text>
  <text class="note" x="444" y="330">mois–permanent · vecteur ou KV</text>
  <text class="note" x="424" y="408"><tspan x="424">Rappel par signification ou clé dans le thread</tspan><tspan x="424" dy="1.2em">suivant.</tspan></text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94"><tspan x="776">NIVEAU DOCUMENTAIRE · CONNAISSANCES</tspan><tspan x="776" dy="1.2em">DU PROJET</tspan></text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">STOCKAGE · DOCUMENTAIRE</text>
  <text class="name" x="796" y="174">Fichiers inspectables</text>
  <text class="note" x="796" y="194">notes · recherche · patterns appris</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="800" y="246">FICHIERS</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Lisible par l’humain, modifiable et versionné.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">EXTERNE · PROCÉDURAL</text>
  <text class="name" x="420" y="520">System prompt et outils</text>
  <text class="note" x="420" y="544"><tspan x="420">Fourni avec l’agent ; ce n’est pas un niveau</tspan><tspan x="420" dy="1.2em">récupéré.</tspan></text>
</svg>
