<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Le rappel de la mémoire froide bloque la planification ; l’extraction et le stockage de nouveaux faits, non.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">C’est le harness, et non un store particulier, qui décide ce qui atteint réellement la fenêtre de contexte du</tspan><tspan x="32" dy="1.2em">modèle.</tspan></text>
