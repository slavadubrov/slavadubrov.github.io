<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="hotckpt-title hotckpt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hotckpt-title">Un checkpoint est écrit après chaque super-step terminé, et la reprise se fait à cette frontière, pas à une ligne de code arbitraire.</title><desc id="hotckpt-desc">Lorsqu’un nœud LangGraph termine un super-step, le framework sérialise l’état complet du graphe dans un checkpoint avant le démarrage du nœud suivant. Après le redémarrage d’un processus ou une approbation human-in-the-loop, le graphe recharge le dernier checkpoint terminé et reprend à la prochaine frontière entre nœuds, plutôt qu’à la ligne Python où le worker s’est arrêté.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hotckpt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="hotckpt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="568" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un checkpoint par super-step</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">La reprise se fait à la dernière frontière entre nœuds terminée, pas à une ligne arbitraire.</text>
<path d="M42 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PROCESSUS · SUPER-STEP</text><text x="46" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Le nœud se termine</text><text x="46" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">messages · plan</text><text x="46" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">données collectées</text><circle cx="32" cy="128" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M266 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M266 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="270" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · CHECKPOINT</text><text x="270" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 14.5px;">Enregistrer l’état du graphe</text><text x="270" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">thread · namespace</text><text x="270" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">version du channel</text><circle cx="256" cy="128" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="256" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M490 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M490 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="494" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PROCESSUS · GRAPHE</text><text x="494" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 14.5px;">Entrer dans le nœud suivant</text><text x="494" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">l’unique frontière</text><text x="494" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">de reprise sûre</text><circle cx="480" cy="128" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="480" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M240 180h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" />
<path d="M464 180h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" />
<path d="M386 344h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M386 344h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="390" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">EXTERNE · INTERRUPTION</text><text x="390" y="405" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E">Redémarrage ou HITL</text><text x="390" y="427" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">demande de reprise</text>
<path d="M360 232v40h120v72" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" /><rect x="355" y="260" width="130" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="420" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">sérialiser l’état</text>
<path d="M584 344v-112" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#hotckpt-arrow-flow)" /><rect x="522.5" y="276" width="123" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="584" y="292.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 12.5px;">demande de reprise</text>
<path d="M32 488h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un checkpoint est une frontière de reprise, pas un journal d’audit ni une trace d’événements.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Une interruption et un redémarrage rechargent tous deux le même checkpoint avant la poursuite du graphe.</text>
</svg>
