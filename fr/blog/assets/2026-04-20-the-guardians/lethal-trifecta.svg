<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ltf-title ltf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ltf-title">La trifecta létale crée une voie d’exfiltration</title>
  <desc id="ltf-desc">Les données privées, le contenu non fiable et un canal de communication externe convergent. Lorsqu’un agent dispose de ces trois capacités, des instructions non fiables peuvent rediriger des données privées vers un attaquant.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="480" rx="14" fill="#F7F7F4" />

  <rect x="48" y="64" width="256" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="68" y="98">STOCKAGE · CAPACITÉ 1</text>
  <text class="name" x="68" y="126">Données privées</text>
  <text class="note" x="68" y="146">boîte de réception · documents · dépôts</text>

  <rect x="656" y="64" width="256" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="676" y="98">EXTERNE · CAPACITÉ 2</text>
  <text class="name" x="676" y="126" fill="#59645E">Contenu non fiable</text>
  <text class="note" x="676" y="146">web · retrieval · e-mail</text>

  <rect x="352" y="192" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="372" y="226" fill="#C50E72">FOCUS · COMBINAISON</text>
  <text class="name" x="372" y="254" fill="#C50E72">Voie d’exfiltration</text>
  <text class="note" x="372" y="274" fill="#C50E72">les trois capacités à la fois</text>

  <rect class="box" x="352" y="336" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="370">TRAITEMENT · CAPACITÉ 3</text>
  <text class="name" x="372" y="398">Canal externe</text>
  <text class="note" x="372" y="418">message · récupération d’image · webhook</text>

  <path class="edge" d="M304 112h64a16 16 0 0 1 16 16v56" marker-end="url(#ltf-arrow)" />
  <rect x="314" y="100" width="88" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="358" y="117" text-anchor="middle">peut lire</text>

  <path class="edge" d="M656 112h-64a16 16 0 0 0-16 16v56" marker-end="url(#ltf-arrow)" />
  <rect x="558" y="100" width="88" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="602" y="117" text-anchor="middle">peut orienter</text>

  <path class="edge" d="M480 336v-40" marker-end="url(#ltf-arrow)" />
  <rect x="492" y="300" width="88" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="536" y="317" text-anchor="middle">peut envoyer</text>

  <text class="note" x="48" y="456">Supprimer une seule capacité suffit à rompre cette voie directe de divulgation.</text>

  <defs>
    <marker id="ltf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
