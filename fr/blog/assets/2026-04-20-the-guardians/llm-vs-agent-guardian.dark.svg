<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="lvag-title lvag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="lvag-title">Un filtre de contenu encapsule un appel de modèle ; un harness autorise chaque action dans l’agent loop.</title><desc id="lvag-desc">Deux flux empilés comparent la portée. Le flux du filtre de contenu inspecte le texte avant et après un appel de modèle unique : il vérifie l’entrée, laisse le modèle générer une completion, puis vérifie la sortie. Le flux du harness couvre l’intégralité de l’agent loop : le modèle propose un tool call, le harness autorise cette action précise, le runtime l’exécute et renvoie des éléments de preuve, qui alimentent le tool call proposé suivant.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="lvag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="lvag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1000" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Filtre de contenu ou harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">L’un surveille le texte autour d’un seul appel de modèle.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">L’autre autorise chaque action de l’agent loop.</text>
<rect x="32" y="128" width="656" height="360" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">FILTRE DE CONTENU · UN APPEL DE MODÈLE</text>
<path d="M58 192h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 192h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GARDE-FOU · AVANT</text><text x="62" y="247" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Inspecter le texte d’entrée</text>
<path d="M58 296h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 296h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="313.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">MODÈLE</text><text x="62" y="351" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Générer une completion</text>
<path d="M58 400h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 400h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GARDE-FOU · APRÈS</text><text x="62" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Inspecter le texte de sortie</text>
<path d="M288 264v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<path d="M288 368v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<rect x="32" y="520" width="656" height="360" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="548" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">HARNESS · INTÉGRALITÉ DE L’AGENT LOOP</text>
<path d="M58 584h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 584h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="601.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">MODÈLE</text><text x="62" y="639" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Proposer un tool call</text>
<path d="M58 688h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M58 688h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="62" y="705.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · HARNESS</text><text x="62" y="743" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Autoriser cette action</text>
<path d="M58 792h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 792h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="809.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RUNTIME</text><text x="62" y="847" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Exécuter, renvoyer les éléments de preuve</text>
<path d="M288 656v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<path d="M288 760v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lvag-arrow-flow)" />
<path d="M528 828h60v-208h-60" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#lvag-arrow-flow)" /><rect x="545" y="712" width="86" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="588" y="728.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 12px;">étape suivante</text>
<path d="M32 920h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="946" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Un filtre de contenu évalue un échange de texte.</text>
<text x="32" y="968" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Le harness évalue — et peut bloquer — chaque action issue de cet échange.</text>
</svg>
