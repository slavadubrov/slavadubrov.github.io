<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asi-title asi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asi-title">OWASP ASI Top 10 regroupé selon la frontière de contrôle requise</title>
  <desc id="asi-desc">Le détournement de l’objectif et l’empoisonnement de la mémoire sont les deux catégories où les filtres de contenu peuvent contribuer. Les huit autres catégories nécessitent des contrôles système pour les outils, l’exécution, l’identité, la communication, la chaîne d’approvisionnement, les défaillances en cascade, la confiance humaine et les agents malveillants.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#F7F7F4" />

  <rect x="48" y="56" width="280" height="424" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="72" y="88">ADJACENT AU CONTENU · 2 SUR 10</text>
  <text class="note" x="72" y="112">Les filtres peuvent contribuer ici.</text>

  <rect x="72" y="144" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="92" y="176">ASI01</text>
  <text class="name" x="92" y="204">Détournement de l’objectif de l’agent</text>
  <text class="note" x="92" y="224">redirection des instructions</text>

  <rect x="72" y="280" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="92" y="312">ASI06</text>
  <text class="name" x="92" y="340">Empoisonnement de la mémoire</text>
  <text class="note" x="92" y="360">RAG et contexte persistant</text>

  <text class="note" x="72" y="432">Nécessite également une autorisation et une</text>
  <text class="note" x="72" y="452">application des contrôles au niveau du runtime en aval.</text>

  <rect x="368" y="56" width="544" height="424" rx="12" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="392" y="88" fill="#C50E72">PRIORITÉ · CONTRÔLES SYSTÈME · 8 SUR 10</text>
  <text class="note" x="392" y="112" fill="#C50E72">Contrôles de l’identité, des politiques, de l’isolation, de la supervision et de la chaîne d’approvisionnement.</text>

  <rect class="box" x="392" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="176">ASI02 + ASI05</text>
  <text class="name" x="412" y="204">Mauvaise utilisation des outils</text>
  <text class="note" x="412" y="224">exécution inattendue de code</text>

  <rect class="box" x="656" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="176">ASI03 + ASI07</text>
  <text class="name" x="676" y="204">Abus d’identité</text>
  <text class="note" x="676" y="224">canaux d’agents non sécurisés</text>

  <rect class="box" x="392" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="312">ASI04 + ASI08</text>
  <text class="name" x="412" y="340">Chaîne d’approvisionnement</text>
  <text class="note" x="412" y="360">défaillances en cascade des agents</text>

  <rect class="box" x="656" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="312">ASI09 + ASI10</text>
  <text class="name" x="676" y="340">Confiance humaine</text>
  <text class="note" x="676" y="360">agents malveillants et dérive de l’objectif</text>

  <text class="note" x="392" y="432">Ces catégories de défaillances dépassent une simple</text>
  <text class="note" x="392" y="452">frontière d’entrée ou de sortie du modèle.</text>

  <text class="note" x="48" y="528">OWASP Agentic Security Initiative Top 10 pour 2026 · publié le 9 décembre 2025</text>
</svg>
