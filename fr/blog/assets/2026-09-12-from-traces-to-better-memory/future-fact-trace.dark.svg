<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 742" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="future-fact-title future-fact-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="future-fact-title">Un changement futur ne doit pas remplacer l’adresse actuelle dans une réponse au 5 janvier</title><desc id="future-fact-desc">Berlin est valide du 1er au 10 janvier. Paris a été signalé le 3 janvier, mais devient valide le 10 janvier. Pour une question portant sur le 5 janvier, une récupération basée sur l’observation la plus récente choisit Paris à tort. Le filtrage par l’intervalle de validité semi-ouvert sélectionne Berlin. Le temps d’observation et le temps de validité répondent à des questions différentes.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="future-fact-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="future-fact-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="742" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0" style="font-size: 19.5px;">Un signalement ultérieur ne signifie pas que la valeur est valide maintenant</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Question : quelle est l’adresse de l’utilisateur le 5 janvier ?</text>
<path d="M58 120h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 120h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STOCKAGE</text><text x="62" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Berlin</text><text x="62" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Valide à partir du 1er janvier</text><text x="62" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Valide jusqu’au 10 janvier</text>
<path d="M386 120h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M386 120h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="390" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STOCKAGE</text><text x="390" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Paris</text><text x="390" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Signalé le 3 janvier</text><text x="390" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Valide à partir du 10 janvier</text>
<rect x="32" y="264" width="312" height="368" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="290" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">RÉFÉRENCE</text>
<rect x="360" y="264" width="328" height="368" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="376" y="290" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">CANDIDAT</text>
<path d="M58 312h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 312h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="329.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TRAITEMENT</text><text x="62" y="373" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Observation la plus récente</text><text x="62" y="395" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Paris a été signalé ultérieurement</text>
<path d="M386 312h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M386 312h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="390" y="329.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS</text><text x="390" y="373" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Valide le 5 janvier ?</text><text x="390" y="395" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">début ≤ 5 janvier &lt; fin</text>
<path d="M58 512h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 512h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="62" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">RÉSULTAT</text><text x="62" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Réponse : Paris</text><text x="62" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Incorrect pour cette question</text>
<path d="M386 512h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M386 512h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="390" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">RÉSULTAT</text><text x="390" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Réponse : Berlin</text><text x="390" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Correspond à la date demandée</text>
<path d="M188 416v96" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#future-fact-arrow-flow)" /><rect x="148.5" y="452" width="79" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="188" y="468.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">sélectionné</text>
<path d="M524 416v96" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#future-fact-arrow-flow)" /><rect x="484.5" y="452" width="79" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="524" y="468.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">sélectionné</text>
<path d="M32 662h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="688" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;">Les deux enregistrements restent disponibles pour les lectures historiques. La correction modifie l’enregistrement qui entre dans le contexte de réponse,</text>
<text x="32" y="710" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">au lieu de supprimer le fait futur.</text>
</svg>
