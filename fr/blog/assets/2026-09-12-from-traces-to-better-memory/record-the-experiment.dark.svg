<text x="32" y="810" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Le modèle choisit les propositions ; l’évaluateur contrôle ce qui compte comme une amélioration.</text>
<text x="32" y="832" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">L’outil de mémoire reste déterministe. Nous répétons des campagnes d’agents indépendantes.</text>
<text x="32" y="854" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La sélection modifie un parent expérimental. Une mise en production nécessite une revue.</text>
