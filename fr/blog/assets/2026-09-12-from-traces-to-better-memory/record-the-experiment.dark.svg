<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="record-experiment-title record-experiment-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="record-experiment-title">Cette démo délègue les propositions à un agent LLM</title><desc id="record-experiment-desc">Les échecs enregistrés sont transmis à l’agent. L’agent propose une modification de configuration SGR. Python la valide, teste l’outil de mémoire déterministe et compare le résultat. Les tentatives acceptées et rejetées servent de feedback pour le prochain appel au modèle. Sélectionner un parent pour une autre expérience n’autorise pas le déploiement ; la revue humaine de mise en production reste séparée.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="record-experiment-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="record-experiment-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="880" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Cette démo : un agent choisit la prochaine modification</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">L’agent propose des paramètres ; Python les teste et renvoie le feedback.</text>
