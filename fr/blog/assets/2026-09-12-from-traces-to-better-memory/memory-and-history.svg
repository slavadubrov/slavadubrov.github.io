<text x="48" y="318" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Chaque tâche démarre dans son propre état vierge ; les candidats ne partagent jamais de lignes.</text>
