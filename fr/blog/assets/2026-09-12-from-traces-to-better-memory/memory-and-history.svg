<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="two-memories-title two-memories-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="two-memories-title">La mémoire utilisateur et l’historique des expériences ont des propriétaires et des fonctions différents</title><desc id="two-memories-desc">La cible valide les faits utilisateur proposés, gère un historique de versions limité au périmètre concerné et récupère les enregistrements nécessaires pour répondre à une question. Le lanceur d’expériences réinitialise l’état de la cible entre les tâches et enregistre les traces et les résultats dans un historique distinct. La mémoire utilisateur constitue les données de la cible ; l’historique des expériences explique les changements apportés à la cible.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="two-memories-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="two-memories-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="800" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Deux types de mémoire, deux stockages distincts</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Les faits concernant l’utilisateur de l’assistant diffèrent de l’historique des expériences de l’ingénieur.</text>
<rect x="32" y="112" width="656" height="232" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
