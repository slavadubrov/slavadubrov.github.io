<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Fine-Tuning Types" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Trois formats de datasets de fine-tuning</title>
  <desc>Le continued pre-training utilise du texte brut du domaine, le fine-tuning supervisé spécifique à une tâche utilise des paires entrée-sortie, et l’instruction tuning utilise un vaste mélange d’instructions et de réponses.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="800" height="520" fill="#F7F7F4" />

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">Types de fine-tuning</text>

  <!-- Base Model (center top) -->
  <rect x="300" y="70" width="200" height="45" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="400" y="98" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Modèle de base pré-entraîné</text>

  <!-- Arrows from base model -->
  <path d="M400 115 L400 140 L150 140 L150 160" stroke="#59645E" stroke-width="2" fill="none" />
  <path d="M400 115 L400 160" stroke="#59645E" stroke-width="2" fill="none" />
  <path d="M400 115 L400 140 L650 140 L650 160" stroke="#59645E" stroke-width="2" fill="none" />

  <!-- Unsupervised / Continued Pre-training (left) -->
  <rect x="50" y="165" width="200" height="55" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="150" y="190" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Continued pre-training</text>
  <text x="150" y="208" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(Non supervisé)</text>

  <!-- SFT (center) -->
  <rect x="300" y="165" width="200" height="55" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="400" y="190" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Fine-tuning supervisé</text>
  <text x="400" y="208" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(SFT)</text>

  <!-- Instruction Tuning (right) -->
  <rect x="550" y="165" width="200" height="55" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="650" y="190" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Instruction tuning</text>
  <text x="650" y="208" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(Cas particulier de SFT)</text>

  <!-- Descriptions boxes -->

  <!-- Unsupervised description -->
  <rect x="50" y="240" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="65" y="265" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Données :</text>
  <text x="65" y="283" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Texte brut (sans labels)</text>
  <text x="65" y="305" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Objectif :</text>
  <text x="65" y="323" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Connaissances du domaine</text>
  <text x="65" y="345" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Exemple :</text>
  <text x="65" y="363" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Articles médicaux, documents juridiques</text>

  <!-- SFT description -->
  <rect x="300" y="240" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="315" y="265" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Données :</text>
  <text x="315" y="283" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Paires (entrée, sortie)</text>
  <text x="315" y="305" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Objectif :</text>
  <text x="315" y="323" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Comportement spécifique à la tâche</text>
  <text x="315" y="345" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Exemple :</text>
  <text x="315" y="363" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Texte → SQL, résumé</text>

  <!-- Instruction Tuning description -->
  <rect x="550" y="240" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="565" y="265" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Données :</text>
  <text x="565" y="283" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Paires (instruction, réponse)</text>
  <text x="565" y="305" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Objectif :</text>
  <text x="565" y="323" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Suivre des instructions variées</text>
  <text x="565" y="345" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Exemple :</text>
  <text x="565" y="363" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Vaste mélange de conversations d’assistant</text>

  <!-- When to use section -->
  <rect x="50" y="390" width="700" height="110" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="400" y="415" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">QUAND UTILISER CHAQUE APPROCHE</text>

  <text x="80" y="445" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Continued pre-training :</text>
  <text x="230" y="445" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Le modèle ne connaît pas le vocabulaire du domaine (p. ex. médecine, droit, code)</text>

  <text x="80" y="465" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">SFT :</text>
  <text x="130" y="465" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Tâche spécifique avec un format entrée-sortie connu (p. ex. Text-to-SQL)</text>

  <text x="80" y="485" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Instruction tuning :</text>
  <text x="180" y="485" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Comportement général d’assistant conversationnel</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
