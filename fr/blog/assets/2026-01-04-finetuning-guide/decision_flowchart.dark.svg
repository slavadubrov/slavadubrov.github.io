<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ftdecide-title ftdecide-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ftdecide-title">Quatre questions orientent le problème vers la retrieval, le prompting, le constrained decoding ou le fine-tuning.</title><desc id="ftdecide-desc">Un problème de faits évolutifs oriente vers la retrieval ; un problème de style ou de format vers le prompting ; un problème de syntaxe de sortie vers le constrained decoding ; et un écart de comportement mesuré par rapport au baseline non fine-tuné vers le fine-tuning avec LoRA ou QLoRA. En l’absence d’écart mesuré, le baseline est conservé.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ftdecide-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ftdecide-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="920" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Choisir selon le mécanisme, pas par défaut</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Chaque question coûte moins cher à traiter que la suivante.</text>
<rect x="32" y="112" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="192" y="141" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">DÉCISION</text><text x="192" y="165" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Besoin de faits en temps réel ou</text><text x="192" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">évolutifs ?</text>
<path d="M426 108h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M426 108h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="430" y="125.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">RÉSULTAT</text><text x="430" y="159" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Retrieval (RAG)</text><text x="430" y="181" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Mise à jour immédiate</text><text x="430" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">avec de nouveaux documents</text>
<path d="M352 160h64" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="148" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="384" y="164.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">oui</text>
