<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Quatre périmètres de responsabilité dans pyproject.toml</title>
  <desc id="desc">Quatre cartes distinguent build-system pour le backend de build, project pour les métadonnées publiées, dependency-groups pour les environnements non publiés et les espaces de noms tool pour les paramètres propres à chaque outil.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="650" rx="28" fill="#0f172a" />
  <text x="600" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="700">Un fichier, quatre responsables</text>
  <text x="600" y="104" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">Classez un paramètre selon son consommateur avant de choisir une table</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(70 155)"><rect width="500" height="185" rx="20" fill="#1d4ed8" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[build-system]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Responsable : frontend et backend de build</text><text x="30" y="124" fill="#93c5fd" font-size="16">identité du backend • exigences de build isolées</text><text x="30" y="154" fill="#93c5fd" font-size="16">arborescence source → sdist et wheel</text></g>
    <g transform="translate(630 155)"><rect width="500" height="185" rx="20" fill="#5b21b6" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[project]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Responsable : consommateurs du package</text><text x="30" y="124" fill="#c4b5fd" font-size="16">identité • exigences d’exécution • extras</text><text x="30" y="154" fill="#c4b5fd" font-size="16">publiées comme métadonnées de distribution</text></g>
    <g transform="translate(70 385)"><rect width="500" height="185" rx="20" fill="#166534" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[dependency-groups]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Responsable : workflow local</text><text x="30" y="124" fill="#93c5fd" font-size="16">tests • lint • documentation • environnements hors package</text><text x="30" y="154" fill="#93c5fd" font-size="16">non publié dans les métadonnées du package</text></g>
    <g transform="translate(630 385)"><rect width="500" height="185" rx="20" fill="#9a3412" /><text x="30" y="48" fill="#fdba74" font-size="23" font-weight="700">[tool.*]</text><text x="30" y="88" fill="#fdba74" font-size="18">Responsable : l’outil nommé</text><text x="30" y="124" fill="#fdba74" font-size="16">clés et sémantique définies par l’outil</text><text x="30" y="154" fill="#fdba74" font-size="16">aucun schéma partagé entre les espaces de noms</text></g>
  </g>
</svg>
