<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pps-title pps-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="pps-title">Les quatre périmètres de responsabilité dans pyproject.toml</title>
  <desc id="pps-desc">Quatre tables, quatre responsables. Les frontends et backends de build gèrent build-system, les consommateurs du package reçoivent les métadonnées du projet, les workflows locaux gèrent les groupes de dépendances, et chaque outil nommé gère son propre namespace. Les groupes de dépendances sont mis en évidence comme le périmètre local non publié.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .box { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#f7f7f4" />

  <rect class="box" x="48" y="48" width="408" height="96" rx="10" />
  <text class="kind" x="68" y="82">RESPONSABLE DU BUILD</text>
  <text class="name" x="68" y="112">[build-system]</text>
  <path d="M48 168h408" stroke="#d8ddd9" />
  <text class="note" x="68" y="190">Frontend + backend · exigences de build isolées</text>

  <rect class="box" x="504" y="48" width="408" height="96" rx="10" fill="#f2f2f5" />
  <text class="kind" x="524" y="82">CONTRAT PUBLIÉ</text>
  <text class="name" x="524" y="112">[project]</text>
  <path d="M504 168h408" stroke="#d8ddd9" />
  <text class="note" x="524" y="190">Consommateurs du package · métadonnées + exigences d’exécution</text>

  <rect x="48" y="232" width="408" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="68" y="266" fill="#c50e72">ENVIRONNEMENT LOCAL</text>
  <text class="name" x="68" y="296" fill="#c50e72">[dependency-groups]</text>
  <path d="M48 352h408" stroke="#d8ddd9" />
  <text class="note" x="68" y="374">Workflow des contributeurs · tests, lint et documentation non publiés</text>

  <rect class="box" x="504" y="232" width="408" height="96" rx="10" />
  <text class="kind" x="524" y="266">RESPONSABLE DE L’OUTIL</text>
  <text class="name" x="524" y="296">[tool.*]</text>
  <path d="M504 352h408" stroke="#d8ddd9" />
  <text class="note" x="524" y="374">Outil nommé · ses propres clés et sa sémantique</text>
</svg>
