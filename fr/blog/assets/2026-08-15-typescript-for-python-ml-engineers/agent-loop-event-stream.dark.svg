<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="loop-title">Une agent loop écrite à la main expose un flux d’événements typés</title><desc id="loop-desc">Un modèle diffuse des fragments vers un buffer de fragments. La loop assemble les appels, les analyse et les valide, exécute les tools valides, puis ajoute les messages de tool à l’historique des messages avant l’étape suivante. Une entrée invalide devient une erreur de tool dans le même historique au lieu d’arrêter la loop. Le générateur asynchrone AgentEvent ciblé alimente la route HTTP et les tests. Après le streaming, la route HTTP écrit le résultat final de l’exécution.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="loop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="loop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="840" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Une étape de loop, puis une interface stable</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">La réparation reste dans la loop. Les consommateurs voient des événements typés plutôt que des</tspan><tspan x="32" dy="1.2em">fragments du fournisseur de modèle.</tspan></text>
