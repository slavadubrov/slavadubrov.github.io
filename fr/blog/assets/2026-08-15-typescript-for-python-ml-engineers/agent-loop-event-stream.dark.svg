<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">Les tests collectent directement les événements ; la route HTTP les encapsule en SSE et ne persiste qu’une fois le</text>
