<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 736" width="1120" height="736" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Un tour de boucle agent écrite à la main et le flux d’événements produit</title>
  <desc>Une étape de boucle, de gauche à droite. Le modèle diffuse des fragments via les chat completions. Les fragments d’un tool call arrivent avec uniquement un champ d’index sur chaque fragment ; la boucle les accumule donc en appels complets indexés par cet index. Chaque appel assemblé passe par JSON.parse, puis par la validation Zod ; un échec sur l’un ou l’autre chemin devient un tool message décrivant l’erreur plutôt qu’une exception levée, et la boucle continue. Un appel valide exécute l’outil, puis le résultat est ajouté au tableau de messages sous forme de tool message avant l’étape suivante. La boucle produit des valeurs AgentEvent typées depuis un générateur asynchrone. La route HTTP consomme le générateur, émet des trames Server-Sent Events, accumule le texte et écrit le texte final dans le stockage après le flux. Les tests consomment séparément le générateur et collectent ses événements.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="736" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Une étape de la boucle et ce qu’elle produit</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Tout ce qui se trouve à l’intérieur de la limite en pointillés est du code qu’un framework écrit pour vous. Le flux d’événements rend le tout testable.</text>

  <!-- Boundary of the hand-written loop -->
  <rect x="48" y="104" width="1024" height="368" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="68" y="130" font-size="14" font-weight="700" fill="#0f172a">runAgent — une étape</text>
  <text x="68" y="148" font-size="11" fill="#64748b">packages/agent-core/src/loop.ts</text>

  <!-- Model -->
  <rect x="68" y="168" width="182" height="94" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="86" y="194" font-size="13" font-weight="600" fill="#0f172a">Modèle</text>
  <text x="86" y="214" font-size="11" fill="#64748b">POST /chat/completions</text>
  <text x="86" y="230" font-size="11" fill="#64748b">stream: true</text>
  <text x="86" y="250" font-size="11" fill="#5b21b6">OpenAI, vLLM, Ollama</text>

  <path d="M 250 215 L 292 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="256" y="205" font-size="10" fill="#64748b">fragments</text>

  <!-- Accumulate -->
  <rect x="300" y="168" width="212" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="318" y="194" font-size="13" font-weight="600" fill="#0f172a">Accumuler par index</text>
  <text x="318" y="214" font-size="11" fill="#64748b">id et name arrivent une seule fois ;</text>
  <text x="318" y="230" font-size="11" fill="#64748b">les arguments arrivent par fragments</text>
  <text x="318" y="250" font-size="11" fill="#1d4ed8">Seul l’index figure sur chaque fragment</text>

  <path d="M 512 215 L 554 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="533" y="203" text-anchor="middle" font-size="10" fill="#64748b">appel</text>

  <!-- Validate -->
  <rect x="562" y="168" width="204" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="580" y="194" font-size="13" font-weight="600" fill="#0f172a">JSON.parse, puis Zod</text>
  <text x="580" y="214" font-size="11" fill="#64748b">Les modèles produisent du JSON mal formé</text>
  <text x="580" y="230" font-size="11" fill="#64748b">et des arguments hors limites</text>
  <text x="580" y="250" font-size="11" fill="#1d4ed8">Les deux sont attendus, pas exceptionnels</text>

  <!-- Execute -->
  <path d="M 766 200 L 812 200" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <text x="770" y="192" font-size="10" fill="#166534">valide</text>
  <rect x="820" y="168" width="232" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="838" y="192" font-size="13" font-weight="600" fill="#0f172a">Exécuter l’outil</text>
  <text x="838" y="212" font-size="11" fill="#166534">Le résultat est sérialisé en tool message</text>

  <!-- Repair path -->
  <path d="M 664 262 L 664 300 L 812 300" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <text x="676" y="292" font-size="10" fill="#991b1b">invalide</text>
  <rect x="820" y="268" width="232" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="838" y="292" font-size="13" font-weight="600" fill="#0f172a">Décrire l’échec</text>
  <text x="838" y="312" font-size="11" fill="#991b1b">Le modèle le lit et réessaie</text>

  <!-- Append + loop back -->
  <rect x="300" y="348" width="466" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="318" y="372" font-size="13" font-weight="600" fill="#0f172a">Ajouter les messages assistant et tool, puis recommencer</text>
  <text x="318" y="392" font-size="11" fill="#64748b">Le tableau de messages constitue toute la mémoire de l’agent pour cette exécution</text>

  <path d="M 850 228 L 850 244 L 792 244 L 792 378 L 774 378" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <path d="M 936 328 L 936 378 L 800 378" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <path d="M 292 378 L 200 378 L 200 270" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="204" y="336" font-size="10" fill="#64748b">étape suivante</text>

  <text x="68" y="440" font-size="11" fill="#64748b">Condition de sortie : une réponse sans tool calls ou l’atteinte de la limite d’étapes. Les deux terminent l’exécution ; une seule correspond à un succès.</text>

  <!-- Event stream -->
  <rect x="48" y="496" width="1024" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="68" y="522" font-size="14" font-weight="700" fill="#0f172a">yield: AgentEvent</text>
  <text x="68" y="542" font-size="11" fill="#64748b">Une union discriminée produite par un générateur asynchrone — la forme correspondant au async def avec yield de Python.</text>
  <text x="68" y="560" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#1d4ed8">text | tool_call | tool_result | done | error</text>

  <path d="M 240 572 L 240 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <path d="M 560 572 L 560 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />

  <rect x="88" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="108" y="640" font-size="13" font-weight="600" fill="#0f172a">Route HTTP</text>
  <text x="108" y="660" font-size="11" fill="#64748b">Une trame SSE par événement</text>
  <text x="108" y="676" font-size="11" fill="#64748b">apps/api/src/app.ts</text>

  <rect x="408" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="428" y="640" font-size="13" font-weight="600" fill="#0f172a">Test</text>
  <text x="428" y="660" font-size="11" fill="#64748b">Collecte les événements dans un tableau</text>
  <text x="428" y="676" font-size="11" fill="#64748b">Pas de réseau ni de clé API</text>

  <rect x="728" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="748" y="640" font-size="13" font-weight="600" fill="#0f172a">Stockage</text>
  <text x="748" y="660" font-size="11" fill="#64748b">Écrit le texte final une seule fois</text>
  <text x="748" y="676" font-size="11" fill="#64748b">Appelé par la route après le flux</text>

  <path d="M 240 688 L 240 712 L 880 712 L 880 688" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <rect x="493" y="702" width="134" height="18" rx="9" fill="#f8fafc" />
  <text x="560" y="715" text-anchor="middle" font-size="10" fill="#64748b">texte final après le flux</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>
</svg>
