<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="workspace-title workspace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="workspace-title">Un schéma Zod alimente trois consommateurs côté modèle</title><desc id="workspace-desc">Le schéma EstimateKvCacheInput ciblé dans packages/schemas alimente une boucle écrite à la main, l’adaptateur Vercel AI SDK et le publisher d’outils MCP. Les deux adaptateurs de boucle servent l’API Hono ; le publisher sert le serveur MCP. L’API écrit dans une table runs Postgres, et le worker récupère les lignes dans cette table.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
