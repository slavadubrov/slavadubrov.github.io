<rect width="720" height="840" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Un schéma, trois consommateurs</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">La déclaration partagée change de forme dans chaque adaptateur ; les applications restent</tspan><tspan x="32" dy="1.2em">indépendantes les unes des autres.</tspan></text>
