<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workspace-title workspace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="workspace-title">Un schéma Zod alimente trois consommateurs côté modèles</title>
  <desc id="workspace-desc">Le package ciblé agent schemas envoie une déclaration EstimateKvCacheInput au loop écrit à la main, à l’adaptateur Vercel AI SDK et au publisher d’outils MCP. Les deux implémentations du loop servent l’API Hono ; le publisher sert le processus MCP. L’API écrit les lignes d’exécution dans Postgres, et le worker les récupère.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #59645e; }
    .box { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .store { fill: #f2f2f5; stroke: #17211b; stroke-width: 1.5; }
    .edge { stroke: #59645e; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="744" rx="14" fill="#f7f7f4" />
  <text class="name" x="48" y="44">Un schéma, trois consommateurs</text>
  <text class="note" x="48" y="68">La déclaration partagée change de forme dans chaque adaptateur ; les applications restent indépendantes les unes des autres.</text>

  <rect x="48" y="96" width="864" height="304" rx="12" fill="none" stroke="#d8ddd9" />
  <text class="section" x="68" y="120">PACKAGES · LIBRAIRIES PARTAGÉES</text>

  <rect x="68" y="144" width="256" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="88" y="178" fill="#c50e72">FOCUS · SCHÉMA</text>
  <text class="name" x="88" y="206" fill="#c50e72">EstimateKvCacheInput</text>

  <path class="edge" d="M196 240v24h568M196 264v24M480 264v24M764 264v24" />
  <rect x="280" y="248" width="400" height="24" rx="6" fill="#f7f7f4" />
  <text class="note" x="480" y="265" text-anchor="middle">même déclaration Zod, trois formats de frontière</text>

  <rect class="box" x="68" y="296" width="256" height="96" rx="10" />
  <text class="kind" x="88" y="330">ADAPTATEUR</text><text class="name" x="88" y="358">Loop écrit à la main</text>
  <rect class="box" x="352" y="296" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="330">ADAPTATEUR</text><text class="name" x="372" y="358">Vercel AI SDK</text>
  <rect class="box" x="636" y="296" width="256" height="96" rx="10" />
  <text class="kind" x="656" y="330">PUBLISHER</text><text class="name" x="656" y="358">Outil MCP</text>

  <rect x="48" y="432" width="864" height="264" rx="12" fill="none" stroke="#d8ddd9" />
  <text class="section" x="68" y="456">APPLICATIONS · PROCESSUS DÉPLOYÉS</text>

  <path class="edge" d="M196 392v16h128M480 392v16H324v56" marker-end="url(#workspace-arrow)" />
  <rect x="100" y="412" width="192" height="24" rx="6" fill="#f7f7f4" />
  <text class="note" x="196" y="429" text-anchor="middle">choisir un loop</text>
  <path class="edge" d="M764 392v72" marker-end="url(#workspace-arrow)" />

  <rect class="box" x="68" y="472" width="512" height="96" rx="10" />
  <text class="kind" x="88" y="506">PROCESSUS · APPLICATIONS/API</text><text class="name" x="88" y="534">HTTP Hono + SSE</text>
  <rect class="box" x="636" y="472" width="256" height="96" rx="10" />
  <text class="kind" x="656" y="506">PROCESSUS · APPLICATIONS/MCP</text><text class="name" x="656" y="534">Serveur MCP</text>

  <path class="edge" d="M324 568v32" marker-end="url(#workspace-arrow)" />
  <rect x="344" y="576" width="152" height="24" rx="6" fill="#f7f7f4" />
  <text class="note" x="420" y="593" text-anchor="middle" style="font-size: 11px;">insérer une exécution en attente</text>
  <rect class="store" x="68" y="608" width="512" height="62" rx="10" />
  <text class="kind" x="88" y="632">STOCKAGE</text><text class="name" x="188" y="648">Table des exécutions Postgres</text>

  <rect class="box" x="636" y="608" width="256" height="62" rx="10" />
  <text class="kind" x="656" y="632">PROCESSUS</text><text class="name" x="744" y="648" style="font-size: 13px;">Worker de file d’attente</text>
  <path class="edge" d="M580 639h48" marker-end="url(#workspace-arrow)" />
  <rect x="560" y="616" width="96" height="20" rx="6" fill="#f7f7f4" />
  <text class="note" x="608" y="631" text-anchor="middle" style="font-size: 11.5px;">récupérer la ligne</text>

  <text class="note" x="48" y="724">Le processus MCP ne touche ni à HTTP ni à Postgres ; l’observabilité reste une librairie sidecar utilisée au besoin.</text>
  <defs><marker id="workspace-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645e" /></marker></defs>
</svg>
