<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Quel outil remplace lequel lorsqu’une stack backend Python passe à TypeScript</title>
  <desc>Deux colonnes alignées. À gauche, une stack de service AI en Python : pyproject.toml, uv, pydantic-settings et pydantic, FastAPI, SQLAlchemy avec Alembic, Celery avec Redis, pytest, ruff et black, ainsi que mypy. À droite, le remplacement TypeScript pour chaque ligne : package.json, pnpm, Zod, Hono, Drizzle avec drizzle-kit, une table Postgres utilisée comme file d’attente avec FOR UPDATE SKIP LOCKED, Vitest, Biome et tsc --noEmit. Trois lignes sont signalées comme ayant un comportement différent plutôt que comme des remplacements directs : Zod déduit le type depuis le schéma, et non l’inverse ; tsc n’effectue aucun contrôle à l’exécution ; et la ligne de la file d’attente remplace un broker par une table de base de données.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="760" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Quel outil remplace lequel</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Une ligne par préoccupation dans un service AI Python, avec le package TypeScript qui occupe le même rôle en 2026.</text>

  <!-- Column headers -->
  <rect x="48" y="104" width="482" height="36" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="128" font-size="14" font-weight="700" fill="#0f172a">Python</text>

  <rect x="590" y="104" width="482" height="36" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="610" y="128" font-size="14" font-weight="700" fill="#0f172a">TypeScript</text>

  <!-- Row 1: manifest -->
  <rect x="48" y="152" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="176" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">pyproject.toml</text>
  <text x="68" y="196" font-size="11" fill="#64748b">Métadonnées, dépendances, configuration des outils, points d’entrée</text>
  <path d="M 538 180 L 582 180" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <rect x="590" y="152" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="176" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">package.json</text>
  <text x="610" y="196" font-size="11" fill="#64748b">Même rôle, sans la configuration des outils : elle se trouve dans tsconfig.json et biome.jsonc</text>

  <!-- Row 2: package manager -->
  <rect x="48" y="216" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="240" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">uv</text>
  <text x="68" y="260" font-size="11" fill="#64748b">Résoudre, verrouiller, installer, gérer les workspaces</text>
  <path d="M 538 244 L 582 244" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <rect x="590" y="216" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="240" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">pnpm</text>
  <text x="610" y="260" font-size="11" fill="#64748b">Store adressé par contenu, node_modules strict, workspaces natifs</text>

  <!-- Row 3: validation (marked) -->
  <rect x="48" y="280" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="304" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">pydantic + pydantic-settings</text>
  <text x="68" y="324" font-size="11" fill="#64748b">Déclarer une classe, obtenir un validateur</text>
  <path d="M 538 308 L 582 308" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arw-warn)" />
  <rect x="590" y="280" width="482" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="610" y="304" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">zod</text>
  <text x="610" y="324" font-size="11" fill="#9a3412">Inversé : déclarer un validateur, déduire le type avec z.infer</text>

  <!-- Row 4: web framework -->
  <rect x="48" y="344" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="368" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">FastAPI</text>
  <text x="68" y="388" font-size="11" fill="#64748b">Routes typées, validation depuis les annotations</text>
  <path d="M 538 372 L 582 372" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <rect x="590" y="344" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="368" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">hono</text>
  <text x="610" y="388" font-size="11" fill="#64748b">Request et Response conformes aux standards Web ; s’exécute sur Node, Cloud Run, Lambda et Workers</text>

  <!-- Row 5: ORM -->
  <rect x="48" y="408" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="432" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">SQLAlchemy + Alembic</text>
  <text x="68" y="452" font-size="11" fill="#64748b">Schéma dans le code, migrations générées depuis un diff</text>
  <path d="M 538 436 L 582 436" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <rect x="590" y="408" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="432" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">drizzle-orm + drizzle-kit</text>
  <text x="610" y="452" font-size="11" fill="#64748b">Même structure, sans DSL séparé ni étape de génération de code</text>

  <!-- Row 6: queue (marked) -->
  <rect x="48" y="472" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="496" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">Celery + Redis</text>
  <text x="68" y="516" font-size="11" fill="#64748b">Broker, workers, tâches décorées</text>
  <path d="M 538 500 L 582 500" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arw-warn)" />
  <rect x="590" y="472" width="482" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="610" y="496" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">bullmq — ou une seule table Postgres</text>
  <text x="610" y="516" font-size="11" fill="#9a3412">FOR UPDATE SKIP LOCKED forme une file d’attente. Ajoutez BullMQ pour les délais, priorités et retries</text>

  <!-- Row 7: tests -->
  <rect x="48" y="536" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="560" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">pytest</text>
  <text x="68" y="580" font-size="11" fill="#64748b">parametrize, fixtures, monkeypatch</text>
  <path d="M 538 564 L 582 564" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <rect x="590" y="536" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="560" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">vitest</text>
  <text x="610" y="580" font-size="11" fill="#64748b">test.each, beforeEach, vi.mock — exécute TypeScript sans configuration de transformation</text>

  <!-- Row 8: lint/format -->
  <rect x="48" y="600" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="624" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">ruff</text>
  <text x="68" y="644" font-size="11" fill="#64748b">Lint, formatage et tri des imports dans un seul binaire</text>
  <path d="M 538 628 L 582 628" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <rect x="590" y="600" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="610" y="624" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">@biomejs/biome</text>
  <text x="610" y="644" font-size="11" fill="#64748b">Même principe, même implémentation Rust, remplace ESLint et Prettier</text>

  <!-- Row 9: type checker (marked) -->
  <rect x="48" y="664" width="482" height="56" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="688" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">mypy</text>
  <text x="68" y="708" font-size="11" fill="#64748b">Vérificateur optionnel des annotations présentes à l’exécution</text>
  <path d="M 538 692 L 582 692" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arw-warn)" />
  <rect x="590" y="664" width="482" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="610" y="688" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">tsc --noEmit</text>
  <text x="610" y="708" font-size="11" fill="#9a3412">Les types sont effacés avant l’exécution du code ; chaque frontière nécessite donc encore Zod</text>

  <!-- Legend -->
  <rect x="48" y="732" width="14" height="14" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="70" y="744" font-size="11" fill="#64748b">Les lignes orange ne sont pas des remplacements directs : le remplacement se comporte différemment, et cette différence vous fait perdre du temps.</text>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arw-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
  </defs>
</svg>
