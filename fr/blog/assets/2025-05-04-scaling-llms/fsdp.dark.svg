<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="fsdp-title fsdp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fsdp-title">Exécution data parallel entièrement shardée</title><desc id="fsdp-desc">Quatre ranks stockent chacun un shard des paramètres, des gradients et de l’état de l’optimizer. Ces shards sont réunis par all-gather en une couche complète uniquement le temps nécessaire au calcul forward et backward, puis un reduce-scatter renvoie un shard de gradient à chaque propriétaire, tandis que l’état de l’optimizer reste local.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fsdp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="fsdp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="664" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Exécution data parallel entièrement shardée</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Les shards de paramètres sont réunis par all-gather en une couche complète uniquement le temps</tspan><tspan x="32" dy="1.2em">nécessaire au calcul.</tspan></text>
<path d="M42 112h132a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RANK 0</text><text x="46" y="161" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Paramètres,</text><text x="46" y="183" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">gradients,</text><text x="46" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">optimizer</text>
<path d="M210 112h132a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M210 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="214" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RANK 1</text><text x="214" y="161" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Paramètres,</text><text x="214" y="183" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">gradients,</text><text x="214" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">optimizer</text>
<path d="M378 112h132a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M378 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="382" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RANK 2</text><text x="382" y="161" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Paramètres,</text><text x="382" y="183" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">gradients,</text><text x="382" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">optimizer</text>
<path d="M546 112h132a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M546 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="550" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">RANK 3</text><text x="550" y="161" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Paramètres,</text><text x="550" y="183" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">gradients,</text><text x="550" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">optimizer</text>
<path d="M108 216v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M276 216v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M444 216v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M612 216v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M42 248h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 248h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">COLLECTIVE</text><text x="46" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">All-gather des shards de paramètres</text>
<path d="M360 320v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fsdp-arrow-flow)" />
<path d="M200 352h320a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-320a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M200 352h320a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-340a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="204" y="369.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · TRANSITOIRE</text><text x="204" y="413" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Forward + backward</text><text x="204" y="435" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">la couche complète n’existe que pour cette étape</text>
<path d="M360 456v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fsdp-arrow-flow)" />
<path d="M42 488h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 488h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="505.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">COLLECTIVE</text><text x="46" y="543" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Reduce-scatter des gradients vers leurs propriétaires</text>
<path d="M32 584h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="610" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Les shards de gradients circulent via les collectives ; l’état de l’optimizer reste local à chaque rank.</text>
<text x="32" y="632" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Le regroupement des couches échange mémoire de pointe contre taille et recouvrement des collectives.</text>
</svg>
