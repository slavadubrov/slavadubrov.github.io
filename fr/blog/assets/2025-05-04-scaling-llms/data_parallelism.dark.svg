<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="dp-title dp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="dp-title">Entraînement data parallel répliqué</title><desc id="dp-desc">Quatre ranks détiennent chacun une réplique complète du modèle et traitent un micro-batch différent. Leurs gradients convergent via un collective all-reduce, qui renvoie la même mise à jour à chaque rank avant l'étape de l'optimiseur.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="dp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="dp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="452" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Entraînement data parallel répliqué</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Chaque rank détient une réplique complète ; les gradients sont synchronisés avant l'étape de l'optimiseur.</text>
