<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tp-title tp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tp-title">Partition d’une couche en tensor parallelism</title>
  <desc id="tp-desc">L’entrée d’une couche est distribuée sur quatre shards de poids. Chaque rank calcule un résultat partiel, puis un collective de couche combine les résultats partiels avant la poursuite du calcul dépendant.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #EDF5F0; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">UNE COUCHE · QUATRE SHARDS DE MATRICE</text>
  <rect x="352" y="64" width="256" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="372" y="88">ENTRÉE</text><text class="name" x="372" y="112">Activation X</text>
  <path class="edge" d="M480 126v38H144v36M480 164H368v36M480 164h112v36M480 164h336v36" />
  <g>
    <rect class="box" x="48" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="234">RANK 0</text><text class="name" x="68" y="262">W₀ × X → Y₀</text>
    <rect class="box" x="272" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="234">RANK 1</text><text class="name" x="292" y="262">W₁ × X → Y₁</text>
    <rect class="box" x="496" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="234">RANK 2</text><text class="name" x="516" y="262">W₂ × X → Y₂</text>
    <rect class="box" x="720" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="234">RANK 3</text><text class="name" x="740" y="262">W₃ × X → Y₃</text>
  </g>
  <path class="edge" d="M144 296v40h336M368 296v40M592 296v40H480M816 296v40H480" />
  <path class="edge" d="M480 336v32" marker-end="url(#tp-arrow)" />
  <rect x="352" y="368" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="372" y="402" fill="#FF6FB6">COLLECTIVE</text>
  <text class="name" x="372" y="430" fill="#FF6FB6">Combiner les sorties partielles</text>
  <text class="note" x="48" y="488">Le collective se répète dans les blocs transformer ; des liens locaux rapides sont donc essentiels.</text>
  <defs><marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
