<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 648" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="moe-title moe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="moe-title">Routage des tokens entre experts</title>
  <desc id="moe-desc">Un routeur évalue un batch de tokens ; un dispatch all-to-all envoie les représentations vers quatre propriétaires d’experts aux charges inégales, puis une étape de combinaison rétablit l’ordre des tokens.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="648" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">ROUTAGE MOE · PROPRIÉTÉ DES EXPERTS</text>

  <rect x="48" y="72" width="240" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="68" y="106">TOKENS</text><text class="name" x="68" y="134">Batch dans l’ordre d’origine</text>
  <path class="edge" d="M288 120h64" marker-end="url(#moe-arrow)" />
  <rect class="box" x="360" y="72" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="106">ROUTEUR</text><text class="name" x="380" y="134">Score + top-k</text>
  <path class="edge" d="M600 120h64" marker-end="url(#moe-arrow)" />
  <rect x="672" y="72" width="240" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="692" y="106" fill="#C50E72">ALL-TO-ALL</text><text class="name" x="692" y="134" fill="#C50E72">Dispatch des représentations</text>

  <path class="edge" d="M792 168v56M144 224h672" />
  <path class="edge" d="M144 224v40" marker-end="url(#moe-arrow)" />
  <path class="edge" d="M368 224v40" marker-end="url(#moe-arrow)" />
  <path class="edge" d="M592 224v40" marker-end="url(#moe-arrow)" />
  <path class="edge" d="M816 224v40" marker-end="url(#moe-arrow)" />
  <g>
    <rect class="box" x="48" y="264" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="298">RANG 0</text><text class="name" x="68" y="326">Expert 0 · 31 tokens</text>
    <rect class="box" x="272" y="264" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="298">RANG 1</text><text class="name" x="292" y="326">Expert 1 · 18 tokens</text>
    <rect class="box" x="496" y="264" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="298">RANG 2</text><text class="name" x="516" y="326">Expert 2 · 42 tokens</text>
    <rect class="box" x="720" y="264" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="298">RANG 3</text><text class="name" x="740" y="326">Expert 3 · 9 tokens</text>
  </g>
  <path class="edge" d="M144 360v56h672M368 360v56M592 360v56M816 360v56" />
  <path class="edge" d="M480 416v40" marker-end="url(#moe-arrow)" />
  <rect class="box" x="352" y="456" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="490">PROCESSUS</text><text class="name" x="372" y="518">Combinaison dans l’ordre des tokens</text>
  <path class="edge" d="M480 552v32" marker-end="url(#moe-arrow)" />
  <rect x="352" y="592" width="256" height="24" rx="6" fill="#F2F2F5" />
  <text class="note" x="480" y="609" text-anchor="middle">déséquilibre de charge : 9 → 42 tokens</text>
  <text class="note" x="48" y="632">Surveillez le nombre de tokens par expert, l’overflow, l’entropie du routage et le temps all-to-all.</text>
  <defs><marker id="moe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
