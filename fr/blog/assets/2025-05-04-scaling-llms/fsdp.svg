<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Exécution data parallel entièrement shardée</title><desc id="desc">Les shards persistants des paramètres, des gradients et de l’optimizer résident sur quatre ranks. Un groupe de couches est temporairement rassemblé par all-gather pour le calcul, puis les gradients sont redistribués par reduce-scatter à leurs propriétaires.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8" /></marker></defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="570" rx="28" fill="#0f172a" />
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Sharder l’état persistant, rassembler temporairement les groupes de couches</text>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(70 135)"><rect width="220" height="175" rx="18" fill="#1d4ed8" /><text x="110" y="40" fill="#93c5fd" font-size="19" font-weight="700">Rank 0</text><text x="110" y="82" fill="#93c5fd" font-size="15">shard de paramètres 0</text><text x="110" y="112" fill="#c4b5fd" font-size="15">shard de gradients 0</text><text x="110" y="142" fill="#93c5fd" font-size="15">shard de l’optimizer 0</text></g>
    <g transform="translate(350 135)"><rect width="220" height="175" rx="18" fill="#1d4ed8" /><text x="110" y="40" fill="#93c5fd" font-size="19" font-weight="700">Rank 1</text><text x="110" y="82" fill="#93c5fd" font-size="15">shard de paramètres 1</text><text x="110" y="112" fill="#c4b5fd" font-size="15">shard de gradients 1</text><text x="110" y="142" fill="#93c5fd" font-size="15">shard de l’optimizer 1</text></g>
    <g transform="translate(630 135)"><rect width="220" height="175" rx="18" fill="#1d4ed8" /><text x="110" y="40" fill="#93c5fd" font-size="19" font-weight="700">Rank 2</text><text x="110" y="82" fill="#93c5fd" font-size="15">shard de paramètres 2</text><text x="110" y="112" fill="#c4b5fd" font-size="15">shard de gradients 2</text><text x="110" y="142" fill="#93c5fd" font-size="15">shard de l’optimizer 2</text></g>
    <g transform="translate(910 135)"><rect width="220" height="175" rx="18" fill="#1d4ed8" /><text x="110" y="40" fill="#93c5fd" font-size="19" font-weight="700">Rank 3</text><text x="110" y="82" fill="#93c5fd" font-size="15">shard de paramètres 3</text><text x="110" y="112" fill="#c4b5fd" font-size="15">shard de gradients 3</text><text x="110" y="142" fill="#93c5fd" font-size="15">shard de l’optimizer 3</text></g>
    <path d="M180 320 V365 H1020 V320 M460 320 V365 M740 320 V365" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)" />
    <rect x="245" y="380" width="710" height="115" rx="19" fill="#5b21b6" /><text x="600" y="420" fill="#93c5fd" font-size="20" font-weight="700">Groupe de communication des couches</text><text x="600" y="452" fill="#c4b5fd" font-size="15">all-gather des paramètres → calcul → libération de la vue non shardée</text><text x="600" y="480" fill="#c4b5fd" font-size="15">backward → reduce-scatter des gradients vers les propriétaires des shards</text>
    <text x="600" y="540" fill="#94a3b8" font-size="15">Le regroupement contrôle le pic de mémoire, la taille des opérations collectives et les possibilités de recouvrement.</text>
  </g>
</svg>
