<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="GPU Memory Hierarchy" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Hiérarchie de la mémoire GPU</title>
  <desc>La hiérarchie mémoire du H100, des registres par thread et de la mémoire partagée par SM jusqu’au cache L2 partagé, puis à la grande mémoire HBM3. Le stockage on-chip est plus petit et plus proche du calcul ; la HBM stocke les poids du modèle et le KV cache.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="480" fill="#F7F7F4" rx="8" />

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Hiérarchie mémoire du GPU H100 SXM</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#17211B">Le stockage on-chip de plus petite capacité est plus proche du calcul</text>

  <!-- Pyramid layers (top = fastest, smallest) -->

  <!-- Registers -->
  <polygon points="400,80 310,150 490,150" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Registres</text>
  <text x="400" y="135" text-anchor="middle" font-size="11" fill="#ffffff">Accès par thread</text>
  <text x="400" y="147" text-anchor="middle" font-size="11" fill="#ffffff">Opérandes de calcul</text>

  <!-- Labels right side -->
  <line x1="452" y1="120" x2="560" y2="120" stroke="#17211B" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="570" y="115" font-size="11" fill="#17211B" font-weight="bold">Le plus rapide</text>
  <text x="570" y="130" font-size="11" fill="#17211B">Capacité minimale</text>

  <!-- SRAM / Shared Memory -->
  <polygon points="310,160 240,240 560,240 490,160" fill="#F2F2F5" stroke="#59645E" stroke-width="1.5" />
  <text x="400" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Mémoire partagée (SRAM)</text>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#17211B">228 KB par SM</text>
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#17211B">Les tuiles de FlashAttention sont traitées ici</text>

  <line x1="526" y1="200" x2="600" y2="200" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="610" y="195" font-size="11" fill="#17211B" font-weight="bold">SRAM par SM</text>
  <text x="610" y="210" font-size="11" fill="#17211B">Mémoire de travail rapide</text>

  <!-- L2 Cache -->
  <polygon points="240,250 180,320 620,320 560,250" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Cache L2</text>
  <text x="400" y="292" text-anchor="middle" font-size="11" fill="#ffffff">Cache partagé de 50 MB</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#ffffff">Données réutilisées partagées entre les SM</text>

  <line x1="590" y1="285" x2="660" y2="285" stroke="#17211B" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="670" y="280" font-size="11" fill="#17211B" font-weight="bold">L2 partagé</text>
  <text x="670" y="295" font-size="11" fill="#17211B">Évite certaines lectures depuis la HBM</text>

  <!-- HBM3 -->
  <polygon points="180,330 100,420 700,420 620,330" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="400" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">HBM3 (High Bandwidth Memory)</text>
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#ffffff">80 GB · 3.35 TB/s</text>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#ffffff">Les poids du modèle et le KV cache sont stockés ici</text>

  <line x1="660" y1="375" x2="720" y2="375" stroke="#17211B" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="725" y="370" font-size="11" fill="#17211B" font-weight="bold">3.35 TB/s</text>
  <text x="680" y="385" font-size="11" fill="#17211B">Goulot d’étranglement mémoire</text>

  <!-- Left side: Size labels -->
  <text x="90" y="125" font-size="11" fill="#17211B" text-anchor="end">~KB</text>
  <text x="90" y="200" font-size="11" fill="#17211B" text-anchor="end">228 KB/SM</text>
  <text x="90" y="285" font-size="11" fill="#17211B" text-anchor="end">50 MB</text>
  <text x="90" y="375" font-size="11" fill="#17211B" text-anchor="end">80 GB</text>

  <!-- Bottom insight box -->
  <rect x="100" y="435" width="600" height="35" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="400" y="457" text-anchor="middle" font-size="12" fill="#17211B" font-weight="bold">Les kernels optimisés pour la mémoire gardent les données réutilisées près du calcul et réduisent le trafic HBM</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
