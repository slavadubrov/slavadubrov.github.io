<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Choix d’optimisation de l’inférence</title>
  <desc>Les choix de kernel, de quantification, de gestion mémoire, de scheduling, de caching, de spéculation et de parallélisme sont sélectionnables indépendamment, en fonction d’un bottleneck matériel et workload mesuré partagé, ainsi que des objectifs au niveau applicatif.</desc>
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Choix d’optimisation de l’inférence</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#334155">Sélectionner indépendamment selon le bottleneck mesuré et le SLO cible</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#1d4ed8">Fondations matérielles</text>
  <text x="80" y="468" font-size="11" fill="#0f172a">Hiérarchie mémoire du GPU : la bande passante HBM et la réutilisation on-chip varient selon le GPU</text>
  <text x="80" y="483" font-size="10" fill="#334155">Mesurer le bottleneck de calcul, de mémoire et de communication sur le GPU cible</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#166534">Optimisations des kernels</text>
  <text x="70" y="373" font-size="11" fill="#0f172a">FlashAttention (tiling en SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#0f172a">Kernels fusionnés (réduisent les allers-retours vers la HBM)</text>
  <text x="70" y="398" font-size="10" fill="#334155">Profiler l’utilisation sur le graphe déployé</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#9a3412">Quantification</text>
  <text x="470" y="373" font-size="11" fill="#0f172a">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#0f172a">Poids 8 bits : environ 50 % de stockage brut en moins qu’en 16 bits</text>
  <text x="470" y="400" font-size="10" fill="#334155">4 bits : environ 75 % de stockage en moins avant le surcoût des facteurs d’échelle et des métadonnées</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Gestion mémoire</text>
  <text x="70" y="283" font-size="11" fill="#0f172a">PagedAttention (allocation de KV par blocs)</text>
  <text x="70" y="298" font-size="11" fill="#0f172a">GQA/MQA (réduction de 8 à 16× du KV cache)</text>
  <text x="70" y="308" font-size="10" fill="#334155">Les gains publiés dépendent du workload et du harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#0f172a">Continuous batching (au niveau de l’itération)</text>
  <text x="470" y="298" font-size="11" fill="#0f172a">Chunked prefill (préserve la latence du decode)</text>
  <text x="470" y="308" font-size="10" fill="#334155">Optimiser le goodput pour le SLO cible</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Caching</text>
  <text x="70" y="193" font-size="11" fill="#0f172a">Prefix caching (mesurer le taux de hits)</text>
  <text x="70" y="208" font-size="11" fill="#0f172a">RadixAttention (réutilisation arborescente du KV)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Spéculation</text>
  <text x="340" y="193" font-size="11" fill="#0f172a">Speculative decoding (vérifier les drafts)</text>
  <text x="340" y="208" font-size="11" fill="#0f172a">Le taux d’acceptation détermine le gain</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Parallélisme</text>
  <text x="620" y="193" font-size="11" fill="#0f172a">TP (intra-nœud, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#0f172a">PP (inter-nœuds) + DP (scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#991b1b">Couche applicative</text>
  <text x="80" y="113" font-size="11" fill="#0f172a">Routage du modèle · Rate limiting sensible aux tokens · Monitoring (goodput, utilisation du KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="10" fill="#334155">Combiner les techniques uniquement après avoir mesuré leurs effets sur la qualité, la latence et les coûts</text>

</svg>
