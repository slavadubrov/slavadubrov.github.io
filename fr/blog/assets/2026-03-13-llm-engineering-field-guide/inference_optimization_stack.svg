<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Choix d’optimisation de l’inférence</title>
  <desc>Les choix de kernel, de quantification, de gestion mémoire, de scheduling, de caching, de spéculation et de parallélisme sont sélectionnables indépendamment, en fonction d’un goulot d’étranglement matériel et workload mesuré, ainsi que des objectifs au niveau applicatif.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#F7F7F4" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Choix d’optimisation de l’inférence</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#17211B">Sélectionner indépendamment selon le goulot d’étranglement mesuré et le SLO cible</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#17211B">Fondations matérielles</text>
  <text x="80" y="468" font-size="11" fill="#17211B">Hiérarchie mémoire du GPU : la bande passante HBM et la réutilisation on-chip varient selon le GPU</text>
  <text x="80" y="483" font-size="11" fill="#17211B">Mesurer le goulot d’étranglement en calcul, mémoire et communication sur le GPU cible</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#17211B">Optimisations des kernels</text>
  <text x="70" y="373" font-size="11" fill="#17211B">FlashAttention (tiling dans la SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#17211B">Kernels fusionnés (réduisent les allers-retours vers la HBM)</text>
  <text x="70" y="398" font-size="11" fill="#17211B">Profiler l’utilisation sur le graphe déployé</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#17211B">Quantification</text>
  <text x="470" y="373" font-size="11" fill="#17211B">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#17211B">Poids 8 bits : environ 50 % de stockage brut en moins que le 16 bits</text>
  <text x="470" y="400" font-size="11" fill="#17211B">4 bits : environ 75 % de réduction avant le surcoût des facteurs d’échelle et des métadonnées</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#17211B">Gestion mémoire</text>
  <text x="70" y="283" font-size="11" fill="#17211B">PagedAttention (allocation de KV par blocs)</text>
  <text x="70" y="298" font-size="11" fill="#17211B">GQA/MQA (réduction de 8 à 16× du KV cache)</text>
  <text x="70" y="308" font-size="11" fill="#17211B">Les gains publiés dépendent du workload et du harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#17211B">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#17211B">Continuous batching (au niveau de l’itération)</text>
  <text x="470" y="298" font-size="11" fill="#17211B">Chunked prefill (préserve la latence du décodage)</text>
  <text x="470" y="308" font-size="11" fill="#17211B">Optimiser le goodput pour le SLO cible</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#17211B">Caching</text>
  <text x="70" y="193" font-size="11" fill="#17211B">Prefix caching (mesurer le taux de hits)</text>
  <text x="70" y="208" font-size="11" fill="#17211B">RadixAttention (réutilisation arborescente du KV)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#17211B">Spéculation</text>
  <text x="340" y="193" font-size="11" fill="#17211B">Speculative decoding (vérifier les drafts)</text>
  <text x="340" y="208" font-size="11" fill="#17211B">Le taux d’acceptation détermine le gain</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#17211B">Parallélisme</text>
  <text x="620" y="193" font-size="11" fill="#17211B">TP (intra-nœud, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#17211B">PP (inter-nœuds) + DP (passage à l’échelle)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#17211B">Couche applicative</text>
  <text x="80" y="113" font-size="11" fill="#17211B">Routage du modèle · Limitation de débit sensible aux tokens · Monitoring (goodput, utilisation du KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="11" fill="#17211B">Combiner les techniques uniquement après avoir mesuré leurs effets sur la qualité, la latence et les coûts</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
