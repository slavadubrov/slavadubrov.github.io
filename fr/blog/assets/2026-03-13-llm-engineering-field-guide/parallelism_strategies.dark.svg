<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Parallelism Strategies" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Stratégies de parallélisme</title>
  <desc>Quatre panneaux comparent le parallélisme tensoriel, pipeline, des données et des experts, en indiquant quel composant du modèle chaque stratégie distribue sur les GPUs.</desc>
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="520" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0">Quatre formes de parallélisme</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#EDF5F0">Comment distribuer le calcul d’un LLM sur plusieurs GPUs</text>

  <!-- TP: Tensor Parallelism -->
  <rect x="30" y="75" width="410" height="190" rx="10" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="235" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Parallélisme tensoriel (TP)</text>
  <text x="235" y="118" text-anchor="middle" font-size="11" fill="#EDF5F0">Répartir les matrices de poids sur les GPUs</text>

  <!-- Weight matrix split -->
  <rect x="60" y="130" width="160" height="50" rx="4" fill="#1B2621" class="visual-focus" />
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#141D19">Matrice de poids W</text>
  <line x1="220" y1="155" x2="250" y2="155" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrow4)" />
  <!-- Split parts -->
  <rect x="250" y="130" width="80" height="24" rx="3" fill="#1B2621" />
  <text x="290" y="147" text-anchor="middle" font-size="11" fill="#141D19">W₁ → GPU 0</text>
  <rect x="250" y="157" width="80" height="24" rx="3" fill="#1B2621" />
  <text x="290" y="174" text-anchor="middle" font-size="11" fill="#141D19">W₂ → GPU 1</text>

  <text x="60" y="205" font-size="11" fill="#EDF5F0">• All-reduce après chaque couche</text>
  <text x="60" y="220" font-size="11" fill="#EDF5F0">• Bénéficie de liaisons rapides (H100 NVLink : 900 GB/s)</text>
  <text x="60" y="235" font-size="11" fill="#EDF5F0">• Généralement limité à un nœud doté de liaisons rapides</text>
  <text x="60" y="250" font-size="11" fill="#EDF5F0" font-weight="bold"><tspan x="60">• Échange davantage de communication contre une charge moindre</tspan><tspan x="60" dy="1.2em">par device</tspan></text>

  <!-- PP: Pipeline Parallelism -->
  <rect x="460" y="75" width="410" height="190" rx="10" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="665" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Parallélisme pipeline (PP)</text>
  <text x="665" y="118" text-anchor="middle" font-size="11" fill="#EDF5F0">Répartir séquentiellement les couches sur les GPUs</text>

  <!-- Pipeline stages -->
  <rect x="490" y="132" width="75" height="40" rx="4" fill="#141D19" />
  <text x="527" y="147" text-anchor="middle" font-size="11" fill="#141D19">Couches 1–20</text>
  <text x="527" y="160" text-anchor="middle" font-size="11" fill="#141D19">GPU 0</text>
  <line x1="565" y1="152" x2="585" y2="152" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrow4)" />
  <rect x="585" y="132" width="75" height="40" rx="4" fill="#141D19" />
  <text x="622" y="147" text-anchor="middle" font-size="11" fill="#141D19">Couches 21–40</text>
  <text x="622" y="160" text-anchor="middle" font-size="11" fill="#141D19">GPU 1</text>
  <line x1="660" y1="152" x2="680" y2="152" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrow4)" />
  <rect x="680" y="132" width="75" height="40" rx="4" fill="#141D19" />
  <text x="717" y="147" text-anchor="middle" font-size="11" fill="#141D19">Couches 41–60</text>
  <text x="717" y="160" text-anchor="middle" font-size="11" fill="#141D19">GPU 2</text>

  <text x="490" y="200" font-size="11" fill="#EDF5F0">• Transfère les activations entre les étapes</text>
  <text x="490" y="215" font-size="11" fill="#EDF5F0">• Peut s’étendre sur plusieurs nœuds ; profiler le trafic d’activations</text>
  <text x="490" y="230" font-size="11" fill="#EDF5F0">• Bulles du pipeline (temps d’inactivité des GPUs)</text>
  <text x="490" y="245" font-size="11" fill="#EDF5F0" font-weight="bold">• Souvent combiné au TP au sein de chaque nœud</text>

  <!-- DP: Data Parallelism -->
  <rect x="30" y="285" width="410" height="190" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
  <text x="235" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Parallélisme des données (DP)</text>
  <text x="235" y="328" text-anchor="middle" font-size="11" fill="#EDF5F0">Répliquer le modèle complet sur chaque GPU</text>

  <!-- Replicated models -->
  <rect x="70" y="342" width="90" height="45" rx="4" fill="#141D19" stroke="#A8B8AF" />
  <text x="115" y="362" text-anchor="middle" font-size="11" fill="#EDF5F0">Modèle complet</text>
  <text x="115" y="378" text-anchor="middle" font-size="11" fill="#EDF5F0">GPU 0 → Batch A</text>
  <rect x="175" y="342" width="90" height="45" rx="4" fill="#141D19" stroke="#A8B8AF" />
  <text x="220" y="362" text-anchor="middle" font-size="11" fill="#EDF5F0">Modèle complet</text>
  <text x="220" y="378" text-anchor="middle" font-size="11" fill="#EDF5F0">GPU 1 → Batch B</text>
  <rect x="280" y="342" width="90" height="45" rx="4" fill="#141D19" stroke="#A8B8AF" />
  <text x="325" y="362" text-anchor="middle" font-size="11" fill="#EDF5F0">Modèle complet</text>
  <text x="325" y="378" text-anchor="middle" font-size="11" fill="#EDF5F0">GPU 2 → Batch C</text>

  <text x="60" y="413" font-size="11" fill="#EDF5F0">• Aucune communication inter-GPU (inférence)</text>
  <text x="60" y="428" font-size="11" fill="#EDF5F0">• Efficace lorsque le modèle tient dans chaque réplica</text>
  <text x="60" y="443" font-size="11" fill="#EDF5F0">• Pour l’entraînement : combiné au sharding ZeRO</text>
  <text x="60" y="458" font-size="11" fill="#EDF5F0" font-weight="bold">• Mesurer l’équilibrage de la charge et l’utilisation des réplicas</text>

  <!-- EP: Expert Parallelism -->
  <rect x="460" y="285" width="410" height="190" rx="10" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="665" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#EDF5F0">Parallélisme des experts (EP)</text>
  <text x="665" y="328" text-anchor="middle" font-size="11" fill="#EDF5F0">Distribuer les experts MoE sur les GPUs</text>

  <!-- Router + experts -->
  <rect x="575" y="340" width="80" height="30" rx="4" fill="#1B2621" />
  <text x="615" y="360" text-anchor="middle" font-size="11" fill="#141D19">Routeur</text>

  <!-- Expert boxes -->
  <line x1="593" y1="370" x2="517" y2="385" stroke="#EDF5F0" stroke-width="1.5" />
  <line x1="605" y1="370" x2="582" y2="385" stroke="#EDF5F0" stroke-width="1.5" />
  <line x1="625" y1="370" x2="707" y2="385" stroke="#EDF5F0" stroke-width="1.5" />
  <line x1="637" y1="370" x2="772" y2="385" stroke="#EDF5F0" stroke-width="1.5" />

  <rect x="490" y="385" width="55" height="24" rx="3" fill="#1B2621" />
  <text x="517" y="401" text-anchor="middle" font-size="11" fill="#141D19">E1 GPU0</text>
  <rect x="555" y="385" width="55" height="24" rx="3" fill="#1B2621" />
  <text x="582" y="401" text-anchor="middle" font-size="11" fill="#141D19">E2 GPU0</text>
  <rect x="680" y="385" width="55" height="24" rx="3" fill="#1B2621" />
  <text x="707" y="401" text-anchor="middle" font-size="11" fill="#141D19">E3 GPU1</text>
  <rect x="745" y="385" width="55" height="24" rx="3" fill="#1B2621" />
  <text x="772" y="401" text-anchor="middle" font-size="11" fill="#141D19">E4 GPU1</text>

  <text x="490" y="433" font-size="11" fill="#EDF5F0">• Communication all-to-all pour le routage des tokens</text>
  <text x="490" y="448" font-size="11" fill="#EDF5F0">• Sensible à l’équilibrage des experts et à la topologie</text>
  <text x="490" y="463" font-size="11" fill="#EDF5F0" font-weight="bold">• Profiler le trafic all-to-all avec le routage réel</text>

  <!-- Decision framework at bottom -->
  <rect x="30" y="488" width="840" height="25" rx="5" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="450" y="505" text-anchor="middle" font-size="11" fill="#EDF5F0" font-weight="bold">Heuristique de départ uniquement : valider la mémoire, la communication, le débit et la latence sur le cluster cible</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
