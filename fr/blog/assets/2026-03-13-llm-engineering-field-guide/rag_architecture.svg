<text x="32" y="446" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un meilleur générateur ne compense pas une retrieval absente — évaluez chaque étape.</text>
<text x="32" y="468" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ajoutez recherche hybride, reranking ou transformation après analyse d’un vrai échec.</text>
