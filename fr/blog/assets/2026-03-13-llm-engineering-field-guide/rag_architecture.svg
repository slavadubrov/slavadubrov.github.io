<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rag-title">Le RAG sépare un pipeline d’ingestion offline d’un pipeline online de recherche, reranking et génération.</title><desc id="rag-desc">Le pipeline offline analyse les documents bruts pour produire du texte propre, le découpe en chunks, embed chaque chunk et stocke les vecteurs. Lors de la requête, le même embedder — après une éventuelle transformation de la requête, comme HyDE ou une expansion multi-query — alimente une recherche hybride dense + BM25 sur ce vector store ; un reranker note les candidats récupérés par rapport à la requête, puis le modèle génératif répond à partir du contexte reranké.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="rag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Ingestion offline ; retrieval et génération par requête</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le même embedder que lors de l’ingestion embed la requête, sauf si elle est d’abord transformée.</text>
