<text x="32" y="542" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">DeepSeek-R1 a distillé des students Qwen et Llama de 1.5B à 70B paramètres avec son teacher de 671B.</text>
