<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="GPU Memory Hierarchy" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Hiérarchie de mémoire GPU</title>
  <desc>La hiérarchie mémoire du H100, des registres par thread et de la mémoire partagée par SM jusqu’au cache L2 partagé, puis à la grande mémoire HBM3. Le stockage on-chip est plus petit et plus proche du calcul ; la HBM stocke les poids du modèle et le KV cache.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="480" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0">Hiérarchie de mémoire du GPU H100 SXM</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#EDF5F0">Le stockage on-chip, plus petit, est plus proche du calcul</text>

  <!-- Pyramid layers (top = fastest, smallest) -->

  <!-- Registers -->
  <polygon points="400,80 310,150 490,150" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#141D19">Registres</text>
  <text x="400" y="135" text-anchor="middle" font-size="11" fill="#141D19">Accès par thread</text>
  <text x="400" y="147" text-anchor="middle" font-size="11" fill="#141D19">Opérandes de calcul</text>

  <!-- Labels right side -->
  <line x1="452" y1="120" x2="560" y2="120" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="570" y="115" font-size="11" fill="#EDF5F0" font-weight="bold">Le plus rapide</text>
  <text x="570" y="130" font-size="11" fill="#EDF5F0">Capacité minimale</text>

  <!-- SRAM / Shared Memory -->
  <polygon points="310,160 240,240 560,240 490,160" fill="#1B2621" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="400" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#EDF5F0">Mémoire partagée (SRAM)</text>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#EDF5F0">228 Ko par SM</text>
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#EDF5F0">Les tuiles de FlashAttention y sont traitées</text>

  <line x1="526" y1="200" x2="600" y2="200" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="610" y="195" font-size="11" fill="#EDF5F0" font-weight="bold">SRAM par SM</text>
  <text x="610" y="210" font-size="11" fill="#EDF5F0">Mémoire de travail rapide</text>

  <!-- L2 Cache -->
  <polygon points="240,250 180,320 620,320 560,250" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#141D19">Cache L2</text>
  <text x="400" y="292" text-anchor="middle" font-size="11" fill="#141D19">Cache partagé de 50 Mo</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#141D19">Données réutilisées partagées entre les SM</text>

  <line x1="590" y1="285" x2="660" y2="285" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="670" y="280" font-size="11" fill="#EDF5F0" font-weight="bold">L2 partagé</text>
  <text x="670" y="295" font-size="11" fill="#EDF5F0">Évite certains accès en lecture à la HBM</text>

  <!-- HBM3 -->
  <polygon points="180,330 100,420 700,420 620,330" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="400" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#141D19">HBM3 (High Bandwidth Memory)</text>
  <text x="400" y="385" text-anchor="middle" font-size="12" fill="#141D19">80 Go · 3,35 To/s</text>
  <text x="400" y="405" text-anchor="middle" font-size="11" fill="#141D19">Les poids du modèle et le KV cache y résident</text>

  <line x1="660" y1="375" x2="720" y2="375" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4,3" />
  <text x="725" y="370" font-size="11" fill="#EDF5F0" font-weight="bold">3,35 To/s</text>
  <text x="680" y="385" font-size="11" fill="#EDF5F0">Goulot d’étranglement mémoire</text>

  <!-- Left side: Size labels -->
  <text x="90" y="125" font-size="11" fill="#EDF5F0" text-anchor="end">~Ko</text>
  <text x="90" y="200" font-size="11" fill="#EDF5F0" text-anchor="end">228 Ko/SM</text>
  <text x="90" y="285" font-size="11" fill="#EDF5F0" text-anchor="end">50 Mo</text>
  <text x="90" y="375" font-size="11" fill="#EDF5F0" text-anchor="end">80 Go</text>

  <!-- Bottom insight box -->
  <rect x="100" y="435" width="600" height="35" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="400" y="457" text-anchor="middle" font-size="12" fill="#EDF5F0" font-weight="bold">Les kernels sensibles à la mémoire maintiennent les données réutilisées près du calcul et réduisent le trafic HBM</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
