<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Model cascading vs routing" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Cascading de modèles vs routage</title>
  <desc>Diagramme : routage en cascade des modèles.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #17211B; stroke-width: 2; rx: 5; }
      .router { fill: #F2F2F5; stroke: #59645E; stroke-width: 2; rx: 10; }
      .eval { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 5; }
      .small-model { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 5; }
      .large-model { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 5; }
      .arrow { stroke: #17211B; stroke-width: 2; marker-end: url(#arrowhead); }
      .text { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: middle; fill: #59645E; }
      .subtitle { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #FFFFFF; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="100%" height="100%" fill="#F7F7F4" />

  <!-- Routing Section (Left Half) -->
  <text y="30" class="subtitle" x="200">1. Routage des modèles</text>

  <rect x="150" y="60" width="100" height="40" class="box" />
  <text y="85" class="text" x="200">Requête utilisateur</text>

  <line x1="200" y1="100" x2="200" y2="120" class="arrow" />

  <!-- Router Diamond -->
  <polygon points="200,125 260,155 200,185 140,155" class="router" />
  <text y="159" class="text" font-weight="bold" x="200">Routeur</text>

  <!-- Router to Models -->
  <line x1="200" y1="185" x2="200" y2="205" stroke="#17211B" stroke-width="2" />
  <line x1="110" y1="205" x2="290" y2="205" stroke="#17211B" stroke-width="2" />

  <!-- Arrow to Small Model -->
  <line x1="110" y1="205" x2="110" y2="220" class="arrow" />
  <text y="195" class="text" font-size="12" x="155">Simple</text>

  <!-- Arrow to Large Model -->
  <line x1="290" y1="205" x2="290" y2="220" class="arrow" />
  <text y="195" class="text" font-size="12" x="245">Complexe</text>

  <!-- Small Model -->
  <rect x="40" y="225" width="140" height="60" class="small-model visual-focus" />
  <text y="250" class="text" font-weight="bold" x="110">Petit modèle</text>
  <text y="270" class="text" font-size="12" x="110">(Rapide, économique)</text>

  <!-- Large Model -->
  <rect x="220" y="225" width="140" height="60" class="large-model" />
  <text y="250" class="text" font-weight="bold" x="290">Grand modèle</text>
  <text y="270" class="text" font-size="12" x="290">(Précis, coûteux)</text>

  <!-- Models to Output Vector -->
  <line x1="110" y1="285" x2="110" y2="330" stroke="#17211B" stroke-width="2" />
  <line x1="290" y1="285" x2="290" y2="330" stroke="#17211B" stroke-width="2" />
  <line x1="110" y1="330" x2="290" y2="330" stroke="#17211B" stroke-width="2" />
  <line x1="200" y1="330" x2="200" y2="385" class="arrow" />

  <rect x="150" y="390" width="100" height="40" class="box" />
  <text y="415" class="text" x="200">Sortie</text>

  <!-- Divider -->
  <line x1="400" y1="20" x2="400" y2="430" stroke="#59645E" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Cascading Section (Right Half) -->
  <text y="30" class="subtitle" x="600">2. Cascade de modèles</text>

  <rect x="550" y="60" width="100" height="40" class="box" />
  <text y="85" class="text" x="600">Requête utilisateur</text>

  <line x1="600" y1="100" x2="600" y2="120" class="arrow" />

  <!-- Small Model -->
  <rect x="530" y="125" width="140" height="60" class="small-model" />
  <text y="150" class="text" font-weight="bold" x="600">Petit modèle</text>
  <text y="170" class="text" font-size="12" x="600">Première tentative</text>

  <line x1="600" y1="185" x2="600" y2="205" class="arrow" />

  <!-- Acceptance-test diamond -->
  <polygon points="600,210 670,240 600,270 530,240" class="eval" />
  <text class="text" font-size="12" font-weight="bold" x="600">
    <tspan x="600" y="238">Test d’acceptation</tspan>
    <tspan x="600" y="252">Réussi ?</tspan>
  </text>

  <!-- Failed test (down) -->
  <line x1="600" y1="270" x2="600" y2="295" class="arrow" />
  <text y="286" class="text" font-size="12" x="650">Échec / escalade</text>

  <!-- Large Model -->
  <rect x="530" y="300" width="140" height="60" class="large-model" />
  <text y="325" class="text" font-weight="bold" x="600">Grand modèle</text>
  <text y="345" class="text" font-size="12" x="600">Solution de repli</text>

  <line x1="600" y1="360" x2="600" y2="385" class="arrow" />

  <!-- Passed test (bypass to output) -->
  <line x1="530" y1="240" x2="480" y2="240" stroke="#17211B" stroke-width="2" />
  <line x1="480" y1="240" x2="480" y2="410" stroke="#17211B" stroke-width="2" />
  <line x1="480" y1="410" x2="545" y2="410" class="arrow" />
  <text y="234" class="text" font-size="12" x="500">Réussi</text>

  <!-- Output Box -->
  <rect x="550" y="390" width="100" height="40" class="box" />
  <text y="415" class="text" x="600">Sortie</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
