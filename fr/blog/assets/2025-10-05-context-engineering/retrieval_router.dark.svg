<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Adaptive Retrieval Router" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Routeur d’obtention adaptatif</title>
  <desc>Routeur d’obtention adaptatif.</desc>

<style>
    .bg { fill: #0C1210; }
    .node { fill: #141D19; stroke: #EDF5F0; stroke-width: 2; rx: 8; ry: 8; }
    .node-text { fill: #EDF5F0; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #A8B8AF; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; background-color: #A8B8AF; }
    .title { fill: #EDF5F0; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .group-label { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: start; }
    .accent-green { stroke: #A8B8AF; }
    .accent-red { stroke: #EDF5F0; }
    .accent-yellow { stroke: #A8B8AF; }
    .accent-purple { stroke: #EDF5F0; }
    .accent-orange { stroke: #A8B8AF; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1B2621" />
    </marker>
</defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

<rect width="100%" height="100%" class="bg" />

<text y="30" class="title" x="400">Routeur d’obtention adaptatif</text>

<g transform="translate(50, 180)">
    <rect x="0" y="0" width="120" height="40" class="node" style="stroke: #A8B8AF" />
    <text y="20" class="node-text" x="60" style="font-size: 11px;">Requête de l’utilisateur</text>
</g>

<g transform="translate(250, 170)">
    <polygon points="60,0 120,30 60,60 0,30" class="node" style="stroke: #EDF5F0; fill: #141D19" />
    <text y="30" class="node-text" x="60">Classer</text>
</g>

<!-- Paths -->
<g transform="translate(500, 50)">
    <rect x="0" y="0" width="160" height="60" class="node visual-focus" style="stroke: #A8B8AF" />
    <text y="20" class="node-text" x="80">Aucune récupération</text>
    <text y="40" class="node-text" style="font-size: 12px" x="80">Connaissance paramétrique</text>
</g>

<g transform="translate(500, 170)">
    <rect x="0" y="0" width="160" height="60" class="node" style="stroke: #A8B8AF" />
    <text y="20" class="node-text" x="80" style="font-size: 11px;">RAG à une seule prise de données</text>
    <text y="40" class="node-text" style="font-size: 12px" x="80">Hybride + Réclassement</text>
</g>

<g transform="translate(500, 290)">
    <rect x="0" y="0" width="160" height="60" class="node" style="stroke: #A8B8AF" />
    <text y="20" class="node-text" x="80">RAG itératif</text>
    <text y="40" class="node-text" style="font-size: 12px" x="80">Multi-étapes / Graphique</text>
</g>

<!-- Edges -->
<path d="M170 200 L250 200" class="edge" />
<path d="M370 200 L500 80" class="edge" />
<path d="M370 200 L500 200" class="edge" />
<path d="M370 200 L500 320" class="edge" />

<!-- Labels -->
<text y="120" class="label" style="fill: #A8B8AF" x="420">Général</text>
<text y="190" class="label" style="fill: #A8B8AF" x="450">Données</text>
<text y="280" class="label" style="fill: #A8B8AF" x="420">Complexe</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
