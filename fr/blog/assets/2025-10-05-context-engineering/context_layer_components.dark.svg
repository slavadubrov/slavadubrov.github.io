<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Context Layer Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Architecture de la couche de contexte (7 composants)</title>
  <desc>Architecture de la couche de contexte (7 composants).</desc>

<style>
    .bg { fill: #0C1210; }
    .node { fill: #141D19; stroke: #EDF5F0; stroke-width: 2; rx: 8; ry: 8; }
    .node-text { fill: #EDF5F0; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #A8B8AF; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; background-color: #A8B8AF; }
    .title { fill: #EDF5F0; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .group-label { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: start; }
    .accent-green { stroke: #A8B8AF; }
    .accent-red { stroke: #EDF5F0; }
    .accent-yellow { stroke: #A8B8AF; }
    .accent-purple { stroke: #EDF5F0; }
    .accent-orange { stroke: #A8B8AF; }
    .accent-cyan { stroke: #EDF5F0; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1B2621" />
    </marker>
</defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

<rect width="100%" height="100%" class="bg" />

<text y="40" class="title" x="400">Architecture de la couche de contexte (7 composants)</text>

<!-- Groups -->
<!-- Static Context -->
<g transform="translate(50, 80)">
    <rect x="0" y="0" width="220" height="250" rx="10" ry="10" style="fill: none; stroke: #2B3B33; stroke-dasharray: 5 5" />
    <text y="30" class="group-label" style="fill: #A8B8AF" x="20">1. Direction (statique)</text>

    <g transform="translate(35, 60)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Instructions</text>
    </g>
    <g transform="translate(35, 150)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Exemples</text>
    </g>
</g>

<!-- Dynamic Context -->
<g transform="translate(290, 80)">
    <rect x="0" y="0" width="220" height="340" rx="10" ry="10" style="fill: #A8B8AF; stroke: #A8B8AF; stroke-dasharray: 5 5" class="visual-focus" />
    <text y="30" class="group-label" style="fill: #A8B8AF" x="20">2. Données (dynamiques)</text>

    <g transform="translate(35, 60)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Connaissances (RAG)</text>
    </g>
    <g transform="translate(35, 150)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Mémoire</text>
    </g>
    <g transform="translate(35, 240)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Compétences</text>
    </g>
</g>

<!-- Execution & Safety -->
<g transform="translate(530, 80)">
    <rect x="0" y="0" width="220" height="250" rx="10" ry="10" style="fill: none; stroke: #2B3B33; stroke-dasharray: 5 5" />
    <text y="30" class="group-label" style="fill: #A8B8AF" x="20">3. Contrôles</text>

    <g transform="translate(35, 60)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Outils</text>
    </g>
    <g transform="translate(35, 150)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #A8B8AF" />
        <text y="30" class="node-text" x="75">Barrages de sécurité</text>
    </g>
</g>

<!-- Assembly Engine -->
<g transform="translate(200, 450)">
    <rect x="0" y="0" width="400" height="80" class="node" style="stroke: #EDF5F0; fill: #141D19" />
    <text y="40" class="node-text" style="font-size: 16px; font-weight: bold; fill: #A8B8AF" x="200">Moteur d’assemblage de contexte</text>
</g>

<!-- Edges -->
<!-- From Groups to Engine -->
<path d="M160 330 L250 450" class="edge" />
<path d="M400 420 L400 450" class="edge" />
<path d="M640 330 L550 450" class="edge" />

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
