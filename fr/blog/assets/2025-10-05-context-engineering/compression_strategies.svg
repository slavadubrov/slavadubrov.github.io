<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Compression du contexte tenant compte de la perte, avec état canonique et index d’artefacts séparés</title>
  <desc id="desc">La conversation et les observations sont résumées dans un ensemble de travail compact, tandis que l’état canonique de la tâche, les références aux éléments probants et l’historique des artefacts restent stockés séparément pour permettre une récupération exacte.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Compresser la prose ; préserver l’état récupérable</text>
  <g font-family="Inter, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#1e293b" stroke="#64748b" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Contexte croissant</text><text x="30" y="83" font-size="13" fill="#cbd5e1">tours de conversation</text><text x="30" y="116" font-size="13" fill="#cbd5e1">observations brutes des outils</text><text x="30" y="149" font-size="13" fill="#cbd5e1">passages récupérés</text><text x="30" y="182" font-size="13" fill="#cbd5e1">texte répétitif</text></g><text x="325" y="225" font-size="25" fill="#94a3b8">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Ensemble de travail compact</text><text x="30" y="83" font-size="13" fill="#93c5fd">décisions + prochaine action</text><text x="30" y="116" font-size="13" fill="#93c5fd">résultats typés des outils</text><text x="30" y="149" font-size="13" fill="#93c5fd">références aux sources et aux artefacts</text><text x="30" y="182" font-size="13" fill="#93c5fd">questions non résolues</text></g><text x="665" y="225" font-size="25" fill="#94a3b8">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Stockages canoniques</text><text x="30" y="83" font-size="13" fill="#93c5fd">état de la tâche</text><text x="30" y="116" font-size="13" fill="#93c5fd">index des fichiers et artefacts</text><text x="30" y="149" font-size="13" fill="#93c5fd">résultats complets des outils</text><text x="30" y="182" font-size="13" fill="#93c5fd">versions des éléments probants</text><text x="30" y="225" font-size="12" fill="#93c5fd">Récupérer les détails exacts</text><text x="30" y="247" font-size="12" fill="#93c5fd">lorsque la tâche l’exige.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">Optimiser le nombre total de tokens par tâche réussie, y compris la récupération et la restauration.</text></g>
</svg>
