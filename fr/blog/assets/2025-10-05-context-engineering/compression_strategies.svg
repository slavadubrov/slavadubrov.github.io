<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Compression du contexte sensible aux pertes, avec index distincts pour l’état canonique et les artefacts</title>
  <desc id="desc">La conversation et les observations sont résumées en un ensemble de travail compact, tandis que l’état canonique de la tâche, les références aux éléments probants et l’historique des artefacts restent stockés séparément pour une récupération exacte.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#F7F7F4" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">Compresser la prose ; préserver l’état récupérable</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Contexte croissant</text><text x="30" y="83" font-size="13" fill="#17211B">tours de conversation</text><text x="30" y="116" font-size="13" fill="#17211B">observations brutes des outils</text><text x="30" y="149" font-size="13" fill="#17211B">passages récupérés</text><text x="30" y="182" font-size="13" fill="#17211B">éléments répétitifs</text></g><text x="325" y="225" font-size="25" fill="#17211B">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Ensemble de travail compact</text><text x="30" y="83" font-size="13" fill="#17211B">décisions + prochaine action</text><text x="30" y="116" font-size="13" fill="#17211B">résultats typés des outils</text><text x="30" y="149" font-size="13" fill="#17211B">références aux sources et aux artefacts</text><text x="30" y="182" font-size="13" fill="#17211B">questions non résolues</text></g><text x="665" y="225" font-size="25" fill="#17211B">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Stockages canoniques</text><text x="30" y="83" font-size="13" fill="#17211B">état de la tâche</text><text x="30" y="116" font-size="13" fill="#17211B">index des fichiers et artefacts</text><text x="30" y="149" font-size="13" fill="#17211B">résultats complets des outils</text><text x="30" y="182" font-size="13" fill="#17211B">versions des éléments probants</text><text x="30" y="225" font-size="12" fill="#17211B">Récupérer les détails exacts</text><text x="30" y="247" font-size="12" fill="#17211B">lorsque la tâche l’exige.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#17211B">Optimiser le nombre total de tokens par tâche réussie, y compris la récupération et la reprise.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
