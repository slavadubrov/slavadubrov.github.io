<text x="32" y="458" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Mesurer l’effet du routage sur réussite, latence et tokens par tâche réussie.</text>
