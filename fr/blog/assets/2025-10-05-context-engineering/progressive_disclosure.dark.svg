<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="progressive-title progressive-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="progressive-title">La divulgation progressive conserve les identifiants et l’état de confiance prêts à l’emploi, puis ne récupère les détails que pour la décision en cours.</title><desc id="progressive-desc">Quatre étapes s’exécutent pour chaque décision : commencer par des identifiants stables et l’état de tâche fiable, acheminer la décision pour l’autoriser et en définir le périmètre avant la récupération, charger uniquement les éléments de preuve, la mémoire et les tool schemas adaptés, puis valider la proposition avant l’exécution. L’alternative — copier chaque source dans chaque appel — augmente le coût et l’exposition sans bénéfice mesuré.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="progressive-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="progressive-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="512" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Divulgation progressive pour une décision d’agent</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Garder les identifiants et l’état fiable ; détailler l’étape en cours.</text>
