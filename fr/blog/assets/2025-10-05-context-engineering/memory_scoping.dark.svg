<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Mémoire sélectionnée selon le tenant, la finalité, la fraîcheur et la pertinence</title>
  <desc id="desc">Les candidats mémoire passent des contrôles de sujet et de périmètre du tenant, de finalité, de fraîcheur et de pertinence. Seuls les enregistrements sélectionnés sont ajoutés au contexte ; les autres restent exclus.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="420" rx="22" fill="#0C1210" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">La récupération de mémoire relève d’une décision de politique</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(40 110)"><rect width="220" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Stockage mémoire</text><text x="28" y="82" font-size="13" fill="#EDF5F0" style="font-size: 11px;"><tspan x="28">faits explicites fournis par</tspan><tspan x="28" dy="1.2em">l’utilisateur</tspan></text><text x="28" y="112" font-size="13" fill="#EDF5F0">hypothèses inférées</text><text x="28" y="142" font-size="13" fill="#EDF5F0">enregistrements épisodiques</text><text x="28" y="172" font-size="13" fill="#EDF5F0">provenance + cycle de vie</text></g><text x="290" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(330 95)"><rect width="330" height="240" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="165" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Filtres de sélection</text><text x="35" y="82" font-size="13" fill="#EDF5F0">1. sujet authentifié + tenant</text><text x="35" y="116" font-size="13" fill="#EDF5F0">2. finalité autorisée</text><text x="35" y="150" font-size="13" fill="#EDF5F0">3. fraîcheur et statut de revue</text><text x="35" y="184" font-size="13" fill="#EDF5F0">4. pertinence et autorité</text><text x="35" y="218" font-size="12" fill="#EDF5F0">Aucun filtre → aucune inclusion dans le contexte</text></g><text x="690" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(730 110)"><rect width="230" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="115" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0"><tspan x="115">Ensemble de travail</tspan><tspan x="115" dy="1.2em">sélectionné</tspan></text><text x="30" y="84" font-size="13" fill="#EDF5F0">minimum de faits utiles</text><text x="30" y="116" font-size="13" fill="#EDF5F0">source préservée</text><text x="30" y="148" font-size="13" fill="#EDF5F0">expiration préservée</text><text x="30" y="180" font-size="13" fill="#EDF5F0">suppression toujours possible</text></g><text x="500" y="382" text-anchor="middle" font-size="13" fill="#EDF5F0">Les mémoires inférées par le modèle restent des hypothèses jusqu’à confirmation par une source faisant autorité.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
