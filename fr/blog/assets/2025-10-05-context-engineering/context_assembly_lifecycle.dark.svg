<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 678" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="lifecycle-title lifecycle-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="lifecycle-title">L’assemblage du contexte suit un cycle de vie en huit étapes pour chaque décision, de la résolution du contexte de requête fiable jusqu’à l’exécution validée et à la traçabilité enregistrée.</title><desc id="lifecycle-desc">Huit étapes ordonnées s’exécutent pour chaque décision d’agent : résoudre le contexte de requête fiable, choisir la décision suivante, récupérer dans le périmètre autorisé, classer et budgéter, assembler avec des frontières de confiance, générer une proposition typée, valider et exécuter, puis enregistrer la traçabilité et le résultat.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="lifecycle-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="lifecycle-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="678" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">L’assemblage du contexte est un cycle de vie par décision</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Huit opérations ordonnées s’exécutent par décision et se terminent par un manifeste enregistré.</text>
