<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Contexte assemblé via une récupération ciblée, la budgétisation, l’exécution et la validation</title>
  <desc id="desc">L’état de requête fiable passe par la sélection de décision, la récupération autorisée, la budgétisation fondée sur l’utilité, la proposition du modèle, la validation et l’exécution déterministes, puis l’enregistrement de la provenance et du résultat.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#0C1210" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">L’assemblage du contexte est un cycle de vie propre à chaque décision</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Requête fiable</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">acteur, tenant, tâche</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">locale + heure</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Sélectionner la décision</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">planifier, récupérer, agir</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">ou répondre</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Délimiter + récupérer</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">autoriser d’abord</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">classer les éléments probants</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#A8B8AF" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Budgétiser + assembler</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">utilité, fraîcheur</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">frontières de confiance</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Proposer → valider → agir</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">sortie typée + politique</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">postconditions des outils</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">Enregistrer le manifeste, la provenance, la validation et le résultat de la tâche</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#EDF5F0">La décision suivante obtient un nouvel ensemble de travail au lieu de tout hériter.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#EDF5F0">Un appel au modèle est une étape de la politique de contexte, pas la politique elle-même.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
