<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Le cycle de vie s’exécute par décision — réutiliser un contexte unique et volumineux pour toute l’exécution</text>
<text x="32" y="624" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">produit des preuves obsolètes et fournit à chaque étape des éléments dont elle n’a pas besoin.</text>
