<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="compress-title compress-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="compress-title">La compression sépare un ensemble de travail compact, conservé dans le prompt, des référentiels canoniques conservés en dehors de celui-ci et adressables.</title><desc id="compress-desc">Le contexte qui s’accroît — tours de conversation, résultats des tool calls et passages récupérés — est compressé en deux sorties : un ensemble de travail compact contenant les décisions et questions ouvertes, conservé dans le prompt, et des référentiels canoniques de l’état de la tâche, des artefacts et des versions des éléments probants, conservés en dehors de celui-ci, adressables et récupérables à nouveau.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="compress-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="compress-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="392" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Compresser la prose ; garder l’état adressable</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Optimiser les tokens par tâche réussie, pas par requête.</text>
<path d="M42 112h212a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-212a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 112h212a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-232a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ENTRÉE</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Contexte croissant</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tours, sorties, passages</text>
<path d="M306 112h116a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-116a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M306 112h116a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-136a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="310" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">COMPRESSER</text><text x="310" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Compresser</text><text x="310" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="310">Avec perte par</tspan><tspan x="310" dy="1.2em">conception</tspan></text>
<path d="M264 164h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M432 164v-80h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M432 164v56h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M474 32h204a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M474 32h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="478" y="49.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">DANS LE PROMPT</text><text x="478" y="93" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Jeu compact</text><text x="478" y="115" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Décisions + questions ouvertes</text>
<path d="M474 168h204a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M474 168h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="478" y="185.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ADRESSABLE</text><text x="478" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Référentiels canoniques</text><text x="478" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">État + index des artefacts</text>
<path d="M32 312h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="338" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;"><tspan x="32">Optimiser le nombre de tokens par tâche réussie, y compris la récupération à nouveau et la reprise — pas le nombre de tokens par</tspan><tspan x="32" dy="1.2em">requête.</tspan></text>
</svg>
