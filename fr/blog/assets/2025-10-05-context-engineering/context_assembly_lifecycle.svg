<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Contexte assemblé via la récupération ciblée, le budget, l’exécution et la validation</title>
  <desc id="desc">L’état de requête de confiance passe par la sélection de décision, la récupération autorisée, le budget fondé sur l’utilité, la proposition du modèle, la validation et l’exécution déterministes, puis l’enregistrement de la provenance et du résultat.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#F7F7F4" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">L’assemblage du contexte est un cycle de vie propre à chaque décision</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Requête de confiance</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">acteur, tenant, tâche</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">locale + heure</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Sélectionner la décision</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">planifier, récupérer, agir</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">ou répondre</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Définir le périmètre + récupérer</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">autoriser d’abord</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">classer les éléments probants</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#59645E" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Définir le budget + assembler</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">utilité, fraîcheur</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">limites de confiance</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Proposer → valider → agir</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#17211B">sortie typée + politique</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#17211B">postconditions des outils</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Enregistrer le manifeste, la provenance, la validation et le résultat de la tâche</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#17211B">La décision suivante obtient un nouvel ensemble de travail au lieu de tout hériter.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#17211B">Un appel au modèle est une étape du cadre de politique du contexte, pas la politique elle-même.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
