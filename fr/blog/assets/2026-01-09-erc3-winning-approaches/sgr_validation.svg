<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="sgr-title sgr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="sgr-title">Valider chaque étape guidée par un schéma avant son exécution</title>
  <desc id="sgr-desc">Le modèle de raisonnement propose une étape guidée par un schéma. StepValidator l’accepte pour exécution ou la rejette avec des commentaires pour révision. Le résultat de l’API devient l’observation de l’étape suivante.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #C50E72; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #C50E72; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="360" rx="14" fill="#F7F7F4" />
  <rect class="box" x="48" y="72" width="188" height="96" rx="10" /><text class="kind" x="68" y="106">RAISONNEUR</text><text class="name" x="68" y="134">Proposer une étape</text>
  <rect x="272" y="72" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind-focus" x="292" y="106">VALIDATEUR D’ÉTAPE</text><text class="name-focus" x="292" y="134">Vérifier l’action</text>
  <rect class="box" x="496" y="72" width="188" height="96" rx="10" /><text class="kind" x="516" y="106">RUNTIME</text><text class="name" x="516" y="134">Exécuter l’outil</text>
  <rect class="store" x="720" y="72" width="188" height="96" rx="10" /><text class="kind" x="740" y="106">OBSERVATION</text><text class="name" x="740" y="134">Résultat de l’API</text>
  <path class="edge" d="M236 120h28" marker-end="url(#sgr-arrow)" /><path class="edge" d="M460 120h28" marker-end="url(#sgr-arrow)" /><text class="note" x="478" y="62" text-anchor="middle">accepter</text><path class="edge" d="M684 120h28" marker-end="url(#sgr-arrow)" />
  <path d="M366 168v52a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-52" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#sgr-signal)" /><rect x="202" y="220" width="108" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="256" y="237" text-anchor="middle" fill="#C50E72">rejeter + commentaires</text>
  <path class="edge" d="M814 168v96a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-24" stroke-dasharray="7 6" marker-end="url(#sgr-arrow)" /><rect x="418" y="264" width="124" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="480" y="281" text-anchor="middle">étape suivante</text>
  <text class="note" x="48" y="332">Le travail rejeté est révisé avant de devenir un tool call ; les résultats acceptés alimentent le tour de raisonnement suivant.</text>
  <defs><marker id="sgr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="sgr-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
