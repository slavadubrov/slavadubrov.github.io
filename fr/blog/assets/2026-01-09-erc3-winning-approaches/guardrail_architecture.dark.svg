<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="guard-title guard-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="guard-title">Les garde-fous couvrent trois frontières de défaillance distinctes</title>
  <desc id="guard-desc">Une boundary map ciblée contient trois contrôles, dans l’ordre d’exécution : une gate pré-exécution valide l’identité et les permissions, un validator in-loop vérifie chaque action proposée, et un guard post-exécution contrôle les éléments probants et la policy avant la soumission.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="352" rx="14" fill="#0C1210" />
  <rect x="48" y="48" width="864" height="232" rx="12" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind-focus" x="68" y="82">FOCUS · BOUNDARY MAP</text><text class="name-focus" x="68" y="110">Trois contrôles, trois risques</text>
  <circle cx="86" cy="146" r="14" fill="#EDF5F0" /><text class="marker-num" x="86" y="151" text-anchor="middle">1</text><circle cx="358" cy="146" r="14" fill="#EDF5F0" /><text class="marker-num" x="358" y="151" text-anchor="middle">2</text><circle cx="630" cy="146" r="14" fill="#EDF5F0" /><text class="marker-num" x="630" y="151" text-anchor="middle">3</text>
  <rect class="box" x="72" y="168" width="248" height="96" rx="10" /><text class="kind" x="92" y="202">PRÉ-EXÉCUTION</text><text class="name" x="92" y="230">Identité + permissions</text>
  <rect class="box" x="344" y="168" width="248" height="96" rx="10" /><text class="kind" x="364" y="202">IN-LOOP</text><text class="name" x="364" y="230">Action proposée</text>
  <rect class="box" x="616" y="168" width="248" height="96" rx="10" /><text class="kind" x="636" y="202">POST-EXÉCUTION</text><text class="name" x="636" y="230">Éléments probants + policy</text>
  <path class="edge" d="M320 216h16" marker-end="url(#guard-arrow)" /><path class="edge" d="M592 216h16" marker-end="url(#guard-arrow)" />
  <text class="note" x="48" y="320">Chaque contrôle est placé à côté de la défaillance qu’il peut empêcher ; aucun ne remplace les deux autres.</text>
  <defs><marker id="guard-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
