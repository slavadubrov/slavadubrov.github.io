<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eg-title eg-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="eg-title">Les enrichers d’API guident l’agent avant la décision des garde-fous par niveaux</title>
  <desc id="eg-desc">Une réponse d’API passe par plus de vingt enrichers qui stockent des indications opérationnelles. Une recherche hybride dans le wiki fournit les règles. Les deux alimentent l’agent, dont le résultat proposé est vérifié par des modes de garde-fou : blocage strict, blocage souple ou indication souple.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0C1210" />
  <rect class="external" x="48" y="64" width="188" height="96" rx="10" /><text class="kind" x="68" y="98">EXTERNE</text><text class="name" x="68" y="126">Réponse d’API</text>
  <rect class="box" x="272" y="64" width="188" height="96" rx="10" /><text class="kind" x="292" y="98">ENRICHERS · 20+</text><text class="name" x="292" y="126">Inspecter le résultat</text>
  <rect class="store" x="496" y="64" width="188" height="96" rx="10" /><text class="kind" x="516" y="98">INDICATIONS DE CONTEXTE</text><text class="name" x="516" y="126">Rôle + pagination</text>
  <path class="edge" d="M236 112h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M460 112h28" marker-end="url(#eg-arrow)" />
  <rect class="store" x="48" y="256" width="188" height="96" rx="10" /><text class="kind" x="68" y="290">STOCKAGE DU WIKI</text><text class="name" x="68" y="318">Règles de l’entreprise</text>
  <rect class="box" x="272" y="256" width="188" height="96" rx="10" /><text class="kind" x="292" y="290">RECHERCHE HYBRIDE</text><text class="name" x="292" y="318">Regex + sémantique</text>
  <rect class="box" x="496" y="256" width="188" height="96" rx="10" /><text class="kind" x="516" y="290">AGENT SGR</text><text class="name" x="516" y="318">Choisir une action</text>
  <rect x="720" y="256" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="740" y="290">GARDE-FOU PAR NIVEAUX</text><text class="name-focus" x="740" y="318">Bloquer ou indiquer</text>
  <path class="edge" d="M236 304h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M460 304h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M684 304h28" marker-end="url(#eg-arrow)" />
  <path class="edge" d="M590 160v88" marker-end="url(#eg-arrow)" /><text class="note" x="604" y="210">injecter des indications</text>
  <text class="note" x="720" y="384">blocage strict · blocage souple · indication souple</text><path d="M720 394h188" stroke="#2B3B33" />
  <text class="note" x="48" y="416">Les enrichers ajoutent des indications sans bloquer ; les garde-fous décident séparément si un résultat peut être exécuté.</text>
  <defs><marker id="eg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
