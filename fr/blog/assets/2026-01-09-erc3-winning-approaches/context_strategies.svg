<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ctx-title ctx-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ctx-title">Quatre politiques déterminent ce qui entre dans le contexte de travail</title>
  <desc id="ctx-desc">Les équipes ont distillé les règles du wiki, préchargé les données métier, récupéré les règles via trois modes de recherche ou résumé les tours plus anciens. Chaque politique filtre une entrée différente avant son ajout au contexte de travail de l’agent.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #C50E72; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #C50E72; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#F7F7F4" />
  <rect class="box" x="48" y="64" width="188" height="96" rx="10" /><text class="kind" x="68" y="98">RÈGLES DU WIKI</text><text class="name" x="68" y="126"><tspan x="68">Distiller les</tspan><tspan x="68" dy="1.2em">contraintes</tspan></text>
  <rect class="box" x="272" y="64" width="188" height="96" rx="10" /><text class="kind" x="292" y="98">DONNÉES MÉTIER</text><text class="name" x="292" y="126">Précharger les entités</text>
  <rect class="box" x="496" y="64" width="188" height="96" rx="10" /><text class="kind" x="516" y="98">RECHERCHE DANS LE WIKI</text><text class="name" x="516" y="126"><tspan x="516">Récupérer de 3</tspan><tspan x="516" dy="1.2em">façons</tspan></text>
  <rect class="box" x="720" y="64" width="188" height="96" rx="10" /><text class="kind" x="740" y="98">HISTORIQUE DES TOURS</text><text class="name" x="740" y="126" style="font-size: 11px;">Résumer les tours plus anciens</text>
  <path class="edge" d="M142 160v60a12 12 0 0 0 12 12h266v32" marker-end="url(#ctx-arrow)" /><path class="edge" d="M366 160v44a12 12 0 0 0 12 12h82v48" marker-end="url(#ctx-arrow)" /><path class="edge" d="M590 160v44a12 12 0 0 1-12 12h-78v48" marker-end="url(#ctx-arrow)" /><path class="edge" d="M814 160v60a12 12 0 0 1-12 12H540v32" marker-end="url(#ctx-arrow)" />
  <rect x="384" y="272" width="192" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind-focus" x="404" y="306">FOCUS</text><text class="name-focus" x="404" y="334">Contexte de travail</text>
  <text class="note" x="48" y="400">Il n’existe pas de défaut neutre : chaque système choisit ce qu’il conserve, récupère, résume ou omet.</text>
  <defs><marker id="ctx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
