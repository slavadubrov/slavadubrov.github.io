<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">Un routeur envoie une question de marché vers l’une de deux boucles de raisonnement qui écrivent dans le même état typé.</title><desc id="planexecarch-desc">Un routeur classe une question de marché en recherche approfondie ou briefing express. La recherche approfondie exécute Plan-and-Execute : un planificateur écrit 4 à 6 étapes, un exécuteur exécute chacune dans une boucle ReAct, puis un reporter rédige le rapport. Le briefing express exécute ReWOO : un planificateur écrit un graphe de dépendances entre outils, un worker l’exécute et un solver synthétise un résultat. Le reporter et le solver ReWOO écrivent tous deux dans un objet d’état typé partagé, mais seule la route de recherche approfondie passe par le reporter — le solver ReWOO écrit directement dans l’état.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
