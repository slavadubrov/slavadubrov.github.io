<text x="32" y="1026" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12px;">Le schéma d’état ne se scinde pas selon le pattern — le routage est du code de conversion, pas trois schémas distincts.</text>
<text x="32" y="1048" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;"><tspan x="32">Un évaluateur en contexte vierge et une étape d’approbation humaine se trouvent en aval des deux routes ; ils sont omis ici pour</tspan><tspan x="32" dy="1.2em">préserver la lisibilité des deux boucles.</tspan></text>
