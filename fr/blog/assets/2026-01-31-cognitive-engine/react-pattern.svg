<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="reactpattern-title reactpattern-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reactpattern-title">ReAct lit chaque tool result avant de choisir l’action suivante.</title><desc id="reactpattern-desc">Une boucle de gauche à droite enchaîne pensée, action et observation. L’étape d’observation est centrale, car elle renvoie vers la pensée suivante et permet à l’agent de changer de direction après chaque tool call, au prix du retraitement d’un historique qui s’allonge à chaque passage.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reactpattern-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="reactpattern-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="456" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">ReAct : décider après chaque observation</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Un appel au modèle choisit un mouvement ; de nouvelles preuves peuvent modifier le mouvement suivant.</text>
<rect x="32" y="104" width="656" height="232" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">BOUCLE REACT · SE RÉPÈTE JUSQU’À LA FIN</text>
<path d="M42 144h182a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-182a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 144h182a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-202a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODÈLE · PENSÉE</text><text x="46" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" style="font-size: 13px;">Choisir le mouvement suivant</text><text x="46" y="227" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="46">raisonner à partir de</tspan><tspan x="46" dy="1.2em">l’historique courant</tspan></text><circle cx="32" cy="144" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="148.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M268 144h182a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-182a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M268 144h182a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-202a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="272" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OUTIL · ACTION</text><text x="272" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Exécuter un appel</text><text x="272" y="227" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="272">agir avant de poursuivre la</tspan><tspan x="272" dy="1.2em">planification</tspan></text><circle cx="258" cy="144" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="258" y="148.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M494 144h182a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-182a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M494 144h182a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-202a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="498" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2" style="font-size: 11.5px;">POINT CLÉ · OBSERVATION</text><text x="498" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Lire le résultat réel</text><text x="498" y="227" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">ancrer la pensée suivante</text><circle cx="484" cy="144" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="484" y="148.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M234 196h24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reactpattern-arrow-flow)" />
<path d="M460 196h24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reactpattern-arrow-flow)" />
<path d="M585 248v40H118v-40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#reactpattern-arrow-flow)" /><rect x="228.5" y="288" width="247" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="352" y="304.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 11px;">non fait → répéter avec preuves</text>
<path d="M32 376h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="402" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Compromis : chaque boucle retraite l’historique qui s’allonge, ce qui augmente la latence et le coût en</tspan><tspan x="32" dy="1.2em">tokens.</tspan></text>
</svg>
