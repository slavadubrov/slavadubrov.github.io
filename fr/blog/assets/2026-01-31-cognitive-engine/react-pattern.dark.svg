<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="react-title react-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="react-title">ReAct lit chaque tool result avant de choisir l’action suivante</title>
  <desc id="react-desc">Une boucle de gauche à droite enchaîne thought, action et observation. L’observation est mise en avant car elle revient dans la thought suivante et permet à l’agent de changer de direction après chaque tool call.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="960" height="360" rx="14" />
  <text class="note" x="48" y="42">Un appel au modèle choisit un mouvement. De nouveaux éléments peuvent modifier le mouvement suivant.</text>
  <rect class="process" x="48" y="88" width="240" height="96" rx="10" /><text class="kind" x="68" y="122">MODEL · THOUGHT</text><text class="name" x="68" y="150" style="font-size: 15.5px;">Choisir le mouvement suivant</text><text class="note" x="68" y="169" style="font-size: 11.5px;">raisonner à partir de l’historique courant</text>
  <rect class="process" x="360" y="88" width="240" height="96" rx="10" /><text class="kind" x="380" y="122">TOOL · ACTION</text><text class="name" x="380" y="150">Exécuter un appel</text><text class="note" x="380" y="169" style="font-size: 11.5px;">agir avant de poursuivre la planification</text>
  <rect class="focus" x="672" y="88" width="240" height="96" rx="10" /><text class="kind focus-kind" x="692" y="122">FOCUS · OBSERVATION</text><text class="name focus-name" x="692" y="150">Lire le résultat réel</text><text class="note" x="692" y="169">ancrer la thought suivante</text>
  <path class="edge" d="M288 136h64" marker-end="url(#react-arrow)" /><path class="edge" d="M600 136h64" marker-end="url(#react-arrow)" />
  <path class="edge conditional" d="M792 184v56a16 16 0 0 1-16 16H184a16 16 0 0 1-16-16v-48" marker-end="url(#react-arrow)" />
  <rect class="canvas" x="373" y="244" width="214" height="24" rx="6" /><text class="note" x="480" y="261" text-anchor="middle" style="font-size: 11px;">pas terminé → répéter avec les éléments observés</text>
  <text class="note" x="48" y="328">Compromis : chaque boucle retraite l’historique qui s’allonge, ce qui augmente la latence et le coût en tokens.</text>
  <defs><marker id="react-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
