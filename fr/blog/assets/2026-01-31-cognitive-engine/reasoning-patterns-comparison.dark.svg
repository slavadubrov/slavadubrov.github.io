<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 544" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="compare-title compare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="compare-title">ReAct, ReWOO et Plan-and-Execute diffèrent quant au moment où les éléments probants peuvent modifier le plan</title>
  <desc id="compare-desc">Trois voies alignées comparent le flux de contrôle et le moment de planification. ReAct choisit après chaque observation. ReWOO fixe l’ensemble du graphe de dépendances avant l’exécution. Plan-and-Execute fixe un plan global, mais peut le réviser aux points de contrôle de chaque étape.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; } .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="1120" height="544" rx="14" /><text class="section" x="48" y="44">MÊMES OUTILS, POINT D’ENGAGEMENT DIFFÉRENT</text>
  <rect class="group" x="48" y="64" width="320" height="296" rx="12" /><rect class="group" x="400" y="64" width="320" height="296" rx="12" /><rect class="group" x="752" y="64" width="320" height="296" rx="12" />
  <rect class="process" x="72" y="88" width="272" height="96" rx="10" /><text class="kind" x="92" y="122">PATTERN · INTERACTIF</text><text class="name" x="92" y="150">ReAct</text><text class="note" x="92" y="169">réflexion → action → observation ↺</text>
  <rect class="process" x="424" y="88" width="272" height="96" rx="10" /><text class="kind" x="444" y="122">PATTERN · DÉCOUPLÉ</text><text class="name" x="444" y="150">ReWOO</text><text class="note" x="444" y="169">planner → graphe de workers → solver</text>
  <rect class="process" x="776" y="88" width="272" height="96" rx="10" /><text class="kind" x="796" y="122">PATTERN · HIÉRARCHIQUE</text><text class="name" x="796" y="150">Plan-and-Execute</text><text class="note" x="796" y="169">planner → boucles par étape → replanner</text>
  <path class="edge" d="M208 184v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M560 184v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M912 184v32" marker-end="url(#compare-arrow)" />
  <rect class="store" x="72" y="224" width="272" height="96" rx="10" /><text class="kind" x="92" y="258">MOMENT DE PLANIFICATION</text><text class="name" x="92" y="286">Un mouvement à la fois</text><text class="note" x="92" y="305">adaptabilité maximale · appels répétés</text>
  <rect class="store" x="424" y="224" width="272" height="96" rx="10" /><text class="kind" x="444" y="258">MOMENT DE PLANIFICATION</text><text class="name" x="444" y="286">Graphe complet dès le départ</text><text class="note" x="444" y="305">adaptabilité minimale · moins d’appels</text>
  <rect class="store" x="776" y="224" width="272" height="96" rx="10" /><text class="kind" x="796" y="258">MOMENT DE PLANIFICATION</text><text class="name" x="796" y="286">Plan, puis points de contrôle</text><text class="note" x="796" y="305">adaptabilité moyenne · davantage d’état</text>
  <rect class="focus" x="48" y="400" width="1024" height="96" rx="10" /><text class="kind focus-kind" x="72" y="430">FOCUS · OÙ LES ÉLÉMENTS PROBANTS PEUVENT-ILS MODIFIER LE PLAN ?</text><text class="name focus-name" x="72" y="462">ReAct : chaque résultat</text><text class="name focus-name" x="400" y="462">ReWOO : logique de repli uniquement</text><text class="name focus-name" x="776" y="462" style="font-size: 16.5px;">Plan-and-Execute : points de contrôle</text><text class="note" x="72" y="484">Choisissez selon l’endroit où une hypothèse erronée risque d’apparaître, puis mesurez le coût et la latence sur vos propres tâches.</text>
  <path class="edge" d="M208 360v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M560 360v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M912 360v32" marker-end="url(#compare-arrow)" />
  <defs><marker id="compare-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
