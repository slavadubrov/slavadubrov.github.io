<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rewoopattern-title rewoopattern-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rewoopattern-title">ReWOO planifie le graphe de dépendances avant toute exécution d’outil.</title><desc id="rewoopattern-desc">Un seul appel du planner crée un graphe complet des dépendances entre outils, avec les placeholders E1, E2 et E3. Un worker sans modèle exécute les appels indépendants E1 et E2 en parallèle, puis l’appel dépendant E3 une fois les deux terminés. Un seul appel du solver synthétise tous les résultats — le raisonnement a lieu avant l’exécution, et le worker remplit les placeholders sans appeler le modèle.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rewoopattern-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="rewoopattern-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="800" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">ReWOO : compiler d’abord le graphe d’outils</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Le raisonnement a lieu avant l’exécution ; le worker remplit les placeholders sans appeler le modèle.</text>
<path d="M284 128h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M284 128h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="288" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · PLANNER</text><text x="288" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" style="font-size: 13px;">Écrire le graphe complet</text><text x="288" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">un appel LLM · #E1–#E3</text>
<path d="M360 232v52" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewoopattern-arrow-flow)" />
<rect x="32" y="284" width="656" height="240" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="310" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">WORKER · EXÉCUTEUR SANS LLM</text>
<path d="M58 324h284a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 324h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OUTIL · #E1</text><text x="62" y="379" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Données de prix</text>
<path d="M378 324h284a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M378 324h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="382" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OUTIL · #E2</text><text x="382" y="379" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Actualités récentes</text>
<path d="M206 420h308a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M206 420h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="210" y="437.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OUTIL · #E3</text><text x="210" y="475" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Comparer #E1, #E2</text>
<path d="M200 396v12h160v12" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewoopattern-arrow-flow)" />
<path d="M520 396v12h-160v12" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewoopattern-arrow-flow)" />
<path d="M360 492v68" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewoopattern-arrow-flow)" />
<path d="M284 560h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M284 560h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="288" y="577.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODEL · SOLVER</text><text x="288" y="621" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" style="font-size: 13px;">Synthétiser les résultats</text><text x="288" y="643" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">un appel LLM final</text>
<path d="M32 704h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="730" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Rapide tant que le graphe reste valide.</text>
<text x="32" y="752" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Fragile lorsqu’un outil modifie le plan.</text>
</svg>
