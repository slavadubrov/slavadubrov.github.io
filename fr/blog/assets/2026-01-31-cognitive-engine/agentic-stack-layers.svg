<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 632" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="stack-title">Où se situe chaque composant de la série Engineering the Agentic Stack</title>
  <desc id="stack-desc">Un modèle propose des actions via la reasoning loop de la Partie 1. Le harness assemble le contexte, expose les tools, vérifie les permissions et évalue les éléments probants. Le runtime exécute les tool calls acceptés et persiste l’état. Les résultats retournent au modèle pour le tour suivant.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
    .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="1120" height="632" rx="14" />
  <text class="section" x="48" y="44">UN TOUR — DE LA PROPOSITION AUX ÉLÉMENTS PROBANTS</text>
  <rect class="process" x="184" y="64" width="752" height="62" rx="10" /><text class="kind" x="208" y="88">MODÈLE</text><text class="name" x="208" y="111">Proposer l’action suivante</text>
  <path class="edge" d="M560 126v32" marker-end="url(#stack-arrow)" />
  <rect class="focus" x="184" y="168" width="752" height="62" rx="10" /><text class="kind focus-kind" x="208" y="192">FOCUS · PARTIE 1</text><text class="name focus-name" x="208" y="215">La reasoning loop définit l’ordre des propositions</text>
  <path class="edge" d="M560 230v32" marker-end="url(#stack-arrow)" /><rect class="canvas" x="577" y="240" width="98" height="24" rx="6" /><text class="note" x="626" y="257" text-anchor="middle">tool call proposé</text>
  <rect class="group" x="48" y="272" width="1024" height="176" rx="12" /><text class="section" x="72" y="300">HARNESS · PARTIES 2, 3, 4, 6 — AUTORISER UN TOUR</text>
  <rect class="process" x="72" y="320" width="220" height="96" rx="10" /><text class="kind" x="92" y="350">PARTIE 2 · CONTEXTE</text><text class="name" x="92" y="378">Assembler la mémoire</text><text class="note" x="92" y="399">rappel · documents · passation</text>
  <rect class="process" x="316" y="320" width="220" height="96" rx="10" /><text class="kind" x="336" y="350">PARTIE 3 · CONTRAT</text><text class="name" x="336" y="378">Exposer les tools</text><text class="note" x="336" y="399">actions · schemas · résultats</text>
  <rect class="process" x="560" y="320" width="220" height="96" rx="10" /><text class="kind" x="580" y="350">PARTIE 4 · POLITIQUE</text><text class="name" x="580" y="378">Vérifier les permissions</text><text class="note" x="580" y="399">autorisé · maintenant · sans supervision</text>
  <rect class="process" x="804" y="320" width="244" height="96" rx="10" /><text class="kind" x="824" y="350">PARTIE 6 · ÉLÉMENTS PROBANTS</text><text class="name" x="824" y="378">Évaluer l’achèvement</text><text class="note" x="824" y="399">accepter · réessayer · transmettre</text>
  <path class="edge" d="M292 368h16" marker-end="url(#stack-arrow)" /><path class="edge" d="M536 368h16" marker-end="url(#stack-arrow)" /><path class="edge" d="M780 368h16" marker-end="url(#stack-arrow)" />
  <path class="edge" d="M560 448v32" marker-end="url(#stack-arrow)" /><rect class="canvas" x="577" y="458" width="94" height="24" rx="6" /><text class="note" x="624" y="475" text-anchor="middle">tool call accepté</text>
  <rect class="store" x="184" y="490" width="752" height="96" rx="10" /><text class="kind" x="208" y="520">PARTIE 5 · STOCKAGE DU RUNTIME</text><text class="name" x="208" y="548">Exécuter et persister hors du worker</text><text class="note" x="208" y="569">journal de session · sandbox · checkpoint · trace</text>
  <path class="edge" d="M184 538H48a24 24 0 0 1-24-24V95a24 24 0 0 1 24-24h128" marker-end="url(#stack-arrow)" /><text class="note" x="16" y="300" text-anchor="middle" transform="rotate(-90 16 300)">les résultats deviennent le contexte du tour suivant</text>
  <text class="note" x="48" y="614">La loop choisit quoi proposer. Le harness l’autorise. Le runtime l’exécute.</text>
  <defs><marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
