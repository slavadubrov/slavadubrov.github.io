<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="reasoncompare-title reasoncompare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reasoncompare-title">ReAct, ReWOO et Plan-and-Execute utilisent les mêmes outils, mais s’engagent sur un plan à des moments différents.</title><desc id="reasoncompare-desc">Trois voies comparent le flux de contrôle et le moment de planification. ReAct choisit après chaque observation : adaptabilité maximale, avec des appels répétés au modèle. ReWOO fixe le graphe complet des dépendances avant l’exécution : adaptabilité minimale, avec le moins d’appels. Plan-and-Execute fixe un plan global, mais peut le réviser aux points de contrôle entre les étapes : adaptabilité intermédiaire, avec davantage d’état à suivre. Seul le point d’engagement diffère : ReAct peut changer de direction après chaque résultat, ReWOO uniquement via une logique de repli, et Plan-and-Execute aux points de contrôle des étapes.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reasoncompare-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="reasoncompare-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="680" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Mêmes outils, point d’engagement différent</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tous trois utilisent les mêmes outils ; seul le moment où le plan peut changer diffère.</text>
