<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="judgecal-title judgecal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="judgecal-title">Boucle de calibration du judge</title><desc id="judgecal-desc">Les annotations humaines façonnent une grille d’évaluation et une version figée du judge. Un contrôle d’accord mesure le kappa et le taux de faux positifs par rapport à ces annotations ; les contrôles de biais et la surveillance de la dérive renvoient tout judge qui échoue au contrôle vers la révision de la grille avant son intégration dans la CI.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="judgecal-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="judgecal-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="552" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Boucle de calibration du judge</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Calibrer le judge comme instrument de mesure.</text>
<rect x="32" y="120" width="656" height="304" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="146" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">CALIBRER LE JUDGE COMME INSTRUMENT DE MESURE</text>
<path d="M58 160h176a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 160h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="177.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">JEU DE CALIBRATION</text><text x="62" y="215" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17px;">Annotations humaines</text><circle cx="48" cy="160" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="48" y="164.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M270 160h176a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M270 160h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="274" y="177.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GRILLE D’ÉVALUATION</text><text x="274" y="215" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Critères atomiques</text><circle cx="260" cy="160" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="260" y="164.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M482 160h176a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M482 160h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="486" y="177.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">VERSION DU JUDGE</text><text x="486" y="215" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Modèle + prompt</text><circle cx="472" cy="160" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="472" y="164.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M244 196h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" />
<path d="M456 196h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" />
<path d="M570 232v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" />
<path d="M482 304h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M482 304h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="486" y="321.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · ACCORD</text><text x="486" y="365" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kappa + erreurs</text><text x="486" y="387" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">taux de faux positifs</text><circle cx="472" cy="304" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="472" y="308.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M270 304h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M270 304h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="274" y="321.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CONTRÔLES DE BIAIS</text><text x="274" y="365" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Ordre, longueur</text><text x="274" y="387" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="274">et préférence pour</tspan><tspan x="274" dy="1.2em">soi-même</tspan></text><circle cx="260" cy="304" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="260" y="308.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">5</text>
<path d="M58 304h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 304h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="321.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">SURVEILLANCE DE LA DÉRIVE</text><text x="62" y="365" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 15.5px;">Revérifier régulièrement</text><text x="62" y="387" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="62">à chaque changement du</tspan><tspan x="62" dy="1.2em">judge</tspan></text><circle cx="48" cy="304" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="48" y="308.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">6</text>
<path d="M472 356h-16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" />
<path d="M260 356h-16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" />
<path d="M146 304v-72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" /><text x="146" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">recalibrer</text>
<path d="M32 456h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La promotion exige l’accord sur des traces humaines, pas un verdict valide seul.</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tout changement de modèle ou de prompt du judge renvoie la boucle vers une nouvelle calibration.</text>
</svg>
