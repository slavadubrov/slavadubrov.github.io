<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 530" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Pipeline de démo en cinq étapes</title>
  <desc id="desc">BM25 et la recherche dense alimentent une fusion de rangs, suivie d’un reranking par cross-encoder et, en option, d’un reranking listwise par LLM.</desc>
  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="500" height="530" fill="#0C1210" />

  <!-- Title -->
  <text x="250" y="22" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Pipeline de démo : search-ranking-stack</text>
  <text x="250" y="40" text-anchor="middle" font-size="12" fill="#EDF5F0">Benchmark Amazon ESCI — ~500 requêtes, ~8,5 k produits</text>

  <!-- Stage 1: Retrieval -->
  <rect x="30" y="52" width="440" height="210" rx="10" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4" class="visual-focus" />
  <text x="45" y="72" font-size="12" font-weight="700" fill="#EDF5F0">Étape 1 : Recherche</text>

  <!-- Query -->
  <rect x="200" y="82" width="100" height="28" rx="14" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="250" y="101" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Requête</text>

  <!-- Arrows to BM25 and Dense -->
  <line x1="224" y1="110" x2="148" y2="132" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />
  <line x1="276" y1="110" x2="352" y2="132" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />

  <!-- BM25 -->
  <rect x="50" y="135" width="170" height="48" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="135" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">BM25 Sparse</text>
  <text x="135" y="172" text-anchor="middle" font-size="11" fill="#EDF5F0">rank_bm25 | Top-100</text>

  <!-- Dense -->
  <rect x="280" y="135" width="170" height="48" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="365" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Bi-Encoder dense</text>
  <text x="365" y="172" text-anchor="middle" font-size="11" fill="#EDF5F0">all-MiniLM-L6-v2 | Top-100</text>

  <!-- Arrows to RRF -->
  <line x1="135" y1="183" x2="200" y2="208" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />
  <line x1="365" y1="183" x2="300" y2="208" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />

  <!-- RRF -->
  <rect x="150" y="210" width="200" height="42" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="250" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF5F0">Fusion RRF</text>
  <text x="250" y="243" text-anchor="middle" font-size="11" fill="#EDF5F0">k=60 | Top-100</text>

  <!-- Arrow from RRF to Cross-Encoder -->
  <line x1="250" y1="252" x2="250" y2="300" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />
  <text x="268" y="268" font-size="11" fill="#EDF5F0">Top-50</text>

  <!-- Stage 2: Reranking -->
  <rect x="30" y="275" width="440" height="240" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4" />
  <text x="45" y="295" font-size="12" font-weight="700" fill="#EDF5F0">Étape 2 : Reranking</text>

  <!-- Cross-Encoder -->
  <rect x="65" y="305" width="370" height="52" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="250" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Reranking par Cross-Encoder</text>
  <text x="250" y="344" text-anchor="middle" font-size="11" fill="#EDF5F0">ms-marco-MiniLM-L-12-v2 | Rerank Top-50</text>

  <!-- Arrow -->
  <line x1="250" y1="357" x2="250" y2="385" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />
  <text x="268" y="376" font-size="11" fill="#EDF5F0">Top-10</text>

  <!-- LLM Reranker -->
  <rect x="65" y="390" width="370" height="52" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="250" y="411" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Reranker LLM listwise</text>
  <text x="250" y="429" text-anchor="middle" font-size="11" fill="#EDF5F0">Style RankGPT | Ollama / Claude / Local</text>

  <!-- Arrow to results -->
  <line x1="250" y1="442" x2="250" y2="468" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowD)" />

  <!-- Final Results -->
  <rect x="140" y="472" width="220" height="30" rx="15" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="250" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Résultats finaux Top-10</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
