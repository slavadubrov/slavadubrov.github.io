<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Comparaison bi-encodeur et cross-encodeur</title>
  <desc id="desc">Un bi-encodeur effectue la recherche avec des vecteurs indépendants ; un cross-encodeur attribue conjointement un score à chaque paire requête-document dans une liste restreinte.</desc>
  <defs>
    <marker id="arrowBvC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="380" fill="#0C1210" />

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Bi-encodeur vs. cross-encodeur</text>

  <!-- Left: Bi-Encoder -->
  <rect x="30" y="50" width="350" height="310" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus" />
  <text x="205" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#EDF5F0">Bi-encodeur (recherche)</text>
  <text x="205" y="93" text-anchor="middle" font-size="11" fill="#EDF5F0">Encodage indépendant pour la recherche</text>

  <!-- Query path -->
  <rect x="60" y="115" width="120" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="120" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Requête</text>
  <line x1="120" y1="149" x2="120" y2="172" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="60" y="175" width="120" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="120" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Encodeur</text>
  <line x1="120" y1="209" x2="120" y2="232" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="55" y="235" width="130" height="28" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#EDF5F0">Embedding de la requête</text>

  <!-- Doc path -->
  <rect x="230" y="115" width="120" height="34" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="290" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Document</text>
  <line x1="290" y1="149" x2="290" y2="172" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="230" y="175" width="120" height="34" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="290" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Encodeur</text>
  <line x1="290" y1="209" x2="290" y2="232" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="225" y="235" width="130" height="28" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="290" y="254" text-anchor="middle" font-size="11" fill="#EDF5F0">Embedding du document</text>

  <!-- Dot product -->
  <line x1="120" y1="263" x2="180" y2="293" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <line x1="290" y1="263" x2="230" y2="293" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="160" y="290" width="90" height="30" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="205" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Produit scalaire</text>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#EDF5F0">Un encodage de la requête, puis une recherche vectorielle</text>

  <!-- No cross-attention label -->
  <line x1="180" y1="190" x2="230" y2="190" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="4" />
  <text x="205" y="168" text-anchor="middle" font-size="11" fill="#EDF5F0">Aucune interaction</text>

  <!-- Right: Cross-Encoder -->
  <rect x="420" y="50" width="350" height="310" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="595" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#EDF5F0">Cross-encodeur (reranking)</text>
  <text x="595" y="93" text-anchor="middle" font-size="11" fill="#EDF5F0">Encodage conjoint pour le reranking</text>

  <!-- Concatenated input -->
  <rect x="455" y="115" width="280" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="595" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">[CLS] Requête [SEP] Document [SEP]</text>

  <line x1="595" y1="149" x2="595" y2="172" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />

  <!-- Transformer block -->
  <rect x="475" y="175" width="240" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="595" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Transformer</text>
  <text x="595" y="218" text-anchor="middle" font-size="11" fill="#EDF5F0">Cross-attention complète</text>
  <text x="595" y="236" text-anchor="middle" font-size="11" fill="#EDF5F0">Chaque token de la requête porte son attention sur chaque token du document</text>

  <line x1="595" y1="250" x2="595" y2="283" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowBvC)" />

  <!-- Score output -->
  <rect x="530" y="286" width="130" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="595" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Score de pertinence</text>
  <text x="595" y="340" text-anchor="middle" font-size="11" fill="#EDF5F0">Un score du modèle par paire candidate</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
