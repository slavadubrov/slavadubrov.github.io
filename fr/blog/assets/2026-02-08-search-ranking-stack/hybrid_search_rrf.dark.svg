<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Recherche hybride avec fusion des rangs réciproques</title>
  <desc id="desc">BM25 et la recherche dense produisent des listes classées distinctes ; la fusion des rangs réciproques combine leurs positions sans comparer les scores bruts.</desc>
  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="780" height="420" fill="#0C1210" />

  <!-- Title -->
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Recherche hybride avec fusion des rangs réciproques</text>

  <!-- Query -->
  <rect x="310" y="50" width="160" height="40" rx="20" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="390" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#EDF5F0">Requête utilisateur</text>

  <!-- Arrows from query -->
  <line x1="345" y1="90" x2="180" y2="130" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowH)" />
  <line x1="435" y1="90" x2="600" y2="130" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowH)" />

  <!-- BM25 Sparse Index -->
  <rect x="60" y="133" width="240" height="110" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus" />
  <text x="180" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Index creux (BM25)</text>
  <text x="180" y="177" text-anchor="middle" font-size="11" fill="#EDF5F0">Recherche dans l’index inversé</text>

  <text x="85" y="198" font-size="11" fill="#EDF5F0">1. Doc-X</text>
  <text x="175" y="198" font-size="11" fill="#EDF5F0">score : 12.5</text>
  <text x="85" y="215" font-size="11" fill="#EDF5F0">2. Doc-Y</text>
  <text x="175" y="215" font-size="11" fill="#EDF5F0">score : 8.3</text>
  <text x="85" y="232" font-size="11" fill="#EDF5F0">3. Doc-Z</text>
  <text x="175" y="232" font-size="11" fill="#EDF5F0">score : 7.1</text>

  <!-- Dense Index -->
  <rect x="480" y="133" width="240" height="110" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="600" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Index dense (HNSW)</text>
  <text x="600" y="177" text-anchor="middle" font-size="11" fill="#EDF5F0">Recherche vectorielle ANN</text>

  <text x="505" y="198" font-size="11" fill="#EDF5F0">1. Doc-Y</text>
  <text x="595" y="198" font-size="11" fill="#EDF5F0">sim : 0.92</text>
  <text x="505" y="215" font-size="11" fill="#EDF5F0">2. Doc-X</text>
  <text x="595" y="215" font-size="11" fill="#EDF5F0">sim : 0.87</text>
  <text x="505" y="232" font-size="11" fill="#EDF5F0">3. Doc-W</text>
  <text x="595" y="232" font-size="11" fill="#EDF5F0">sim : 0.81</text>

  <!-- Arrows to RRF -->
  <line x1="180" y1="243" x2="320" y2="290" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowH)" />
  <line x1="600" y1="243" x2="460" y2="290" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowH)" />

  <!-- RRF Fusion Box -->
  <rect x="280" y="280" width="220" height="55" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="390" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Fusion RRF (k=60)</text>
  <text x="390" y="322" text-anchor="middle" font-size="11" fill="#EDF5F0">score(d) = Somme 1/(k + rang)</text>

  <!-- Arrow to results -->
  <line x1="390" y1="335" x2="390" y2="365" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowH)" />

  <!-- Fused Results -->
  <rect x="220" y="368" width="340" height="42" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="390" y="393" text-anchor="middle" font-size="11" fill="#EDF5F0">1. Doc-Y (0.033) · 2. Doc-X (0.033) · 3. Doc-Z (0.016)</text>

  <!-- Callout -->
  <rect x="560" y="280" width="190" height="52" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="3" />
  <text x="570" y="298" font-size="11" fill="#EDF5F0">Basée sur les rangs, pas sur les scores.</text>
  <text x="570" y="313" font-size="11" fill="#EDF5F0">Évite de comparer les scores bruts</text>
  <text x="570" y="328" font-size="11" fill="#EDF5F0">entre les méthodes.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
