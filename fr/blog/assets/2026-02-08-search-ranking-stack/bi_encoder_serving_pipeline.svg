<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Indexation et serving avec un bi-encoder</title>
  <desc id="desc">Les documents sont encodés et indexés hors ligne ; une requête en ligne est encodée puis recherchée dans l’index vectoriel. Chaque étape en ligne doit être profilée.</desc>
  <defs>
    <marker id="arrowSrv" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FFFFFF" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="820" height="420" fill="#F7F7F4" />

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B">Serving d’un bi-encoder : indexation hors ligne vs requête en ligne</text>

  <!-- Divider -->
  <line x1="410" y1="50" x2="410" y2="400" stroke="#59645E" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="200" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Hors ligne (temps d’indexation)</text>
  <text x="620" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">En ligne (temps de requête)</text>

  <!-- === LEFT SIDE: Offline === -->

  <!-- Document Corpus -->
  <rect x="50" y="85" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="130" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Corpus de documents</text>
  <text x="130" y="118" text-anchor="middle" font-size="11" fill="#17211B">N documents</text>

  <!-- Arrow -->
  <line x1="210" y1="105" x2="250" y2="105" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Encoder -->
  <rect x="255" y="85" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="315" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">Bi-Encoder</text>
  <text x="315" y="118" text-anchor="middle" font-size="11" fill="#17211B">encodage par batch</text>

  <!-- Arrow -->
  <line x1="200" y1="125" x2="200" y2="168" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Embeddings Store -->
  <rect x="60" y="170" width="280" height="50" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="200" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Embeddings des documents</text>
  <text x="200" y="208" text-anchor="middle" font-size="11" fill="#17211B">Matrice N × D (p. ex. 8500 × 384 = 13 MB)</text>

  <!-- Arrow -->
  <line x1="200" y1="220" x2="200" y2="263" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Vector Index -->
  <rect x="80" y="265" width="240" height="55" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="200" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Index vectoriel</text>
  <text x="200" y="305" text-anchor="middle" font-size="11" fill="#17211B">HNSW / IVF / DiskANN</text>

  <!-- One-time label -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="200" y="359" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">Effectué une fois, stocké sur disque</text>

  <!-- === RIGHT SIDE: Online === -->

  <!-- User Query -->
  <rect x="480" y="85" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="550" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Requête utilisateur</text>
  <text x="550" y="118" text-anchor="middle" font-size="11" fill="#17211B">"casque audio sans fil"</text>

  <!-- Arrow -->
  <line x1="620" y1="105" x2="660" y2="105" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Encoder -->
  <rect x="665" y="85" width="120" height="40" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="725" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">Bi-Encoder</text>
  <text x="725" y="118" text-anchor="middle" font-size="11" fill="#17211B">encodage unique</text>

  <!-- Arrow down -->
  <line x1="620" y1="125" x2="620" y2="168" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Query Embedding -->
  <rect x="530" y="170" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="620" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Embedding de la requête</text>
  <text x="620" y="206" text-anchor="middle" font-size="11" fill="#17211B">Vecteur 1 × D</text>

  <!-- Timing label for encode -->
  <rect x="700" y="152" width="70" height="20" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="735" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">profiler</text>

  <!-- Arrow down -->
  <line x1="620" y1="210" x2="620" y2="263" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- ANN Search -->
  <rect x="500" y="265" width="240" height="55" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="620" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Recherche ANN</text>
  <text x="620" y="305" text-anchor="middle" font-size="11" fill="#17211B">Embedding de la requête vs index vectoriel</text>

  <!-- Timing label for ANN -->
  <rect x="700" y="245" width="70" height="20" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="735" y="259" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">profiler</text>

  <!-- Cross-connection: Vector Index → ANN Search -->
  <path d="M320,292 Q380,292 410,292 Q440,292 500,292" stroke="#59645E" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowSrv)" />

  <!-- Arrow down to results -->
  <line x1="620" y1="320" x2="620" y2="358" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Top-K Results -->
  <rect x="510" y="360" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="620" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#17211B">Top-K candidats</text>
  <text x="620" y="393" text-anchor="middle" font-size="11" fill="#17211B">Classés par similarité cosinus</text>

  <!-- Total timing -->
  <rect x="700" y="340" width="90" height="20" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="745" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">de bout en bout</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
