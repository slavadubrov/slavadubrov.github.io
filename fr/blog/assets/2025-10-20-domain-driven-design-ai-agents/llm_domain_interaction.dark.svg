<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="di-title di-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="di-title">Flux attendu, de la proposition à l’état validé</title><desc id="di-desc">Flux attendu : analyser et normaliser une proposition non fiable, autoriser l’acteur, faire respecter la règle de l’agrégat, puis valider atomiquement l’état et l’outbox. Les échecs d’analyse, d’autorisation, de règles métier ou de sauvegarde concurrente interrompent l’opération sans validation. Les fragments de l’article omettent la transaction qui fournirait cette garantie.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="di-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="di-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="696" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Flux attendu, de la proposition à l’état validé</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Les fragments de code omettent la transaction requise pour une validation atomique.</text>
