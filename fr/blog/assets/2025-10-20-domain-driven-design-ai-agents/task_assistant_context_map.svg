<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Gestion des tâches, planification et contextes de notification</title>
  <desc id="desc">La gestion des tâches est le domaine central. Elle s’appuie sur un contexte de planification et publie des faits consommés par un contexte de notification générique via des contrats explicites.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="430" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Cartographie des contextes de l’assistant de tâches</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(35 120)"><rect width="250" height="190" rx="16" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="125" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#93c5fd">Planification</text><text x="125" y="72" text-anchor="middle" font-size="13" fill="#93c5fd">Sous-domaine de support</text><text x="32" y="116" font-size="13" fill="#cbd5e1">calendrier</text><text x="32" y="145" font-size="13" fill="#cbd5e1">créneau temporel</text><text x="32" y="174" font-size="13" fill="#cbd5e1">disponibilité</text></g>
    <text x="330" y="220" text-anchor="middle" font-size="11" fill="#94a3b8">contrat de date →</text>
    <g transform="translate(375 95)"><rect width="250" height="240" rx="16" fill="#9a3412" stroke="#ea580c" stroke-width="3" /><text x="125" y="46" text-anchor="middle" font-size="19" font-weight="700" fill="#fdba74">Gestion des tâches</text><text x="125" y="78" text-anchor="middle" font-size="13" fill="#fdba74">Domaine central</text><text x="32" y="125" font-size="13" fill="#cbd5e1">tâche et liste de tâches</text><text x="32" y="156" font-size="13" fill="#cbd5e1">échéance et priorité</text><text x="32" y="187" font-size="13" fill="#cbd5e1">règles d’achèvement</text><text x="32" y="218" font-size="13" fill="#cbd5e1">événement TaskAdded</text></g>
    <text x="670" y="220" text-anchor="middle" font-size="11" fill="#94a3b8">contrat d’événement →</text>
    <g transform="translate(715 120)"><rect width="250" height="190" rx="16" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="125" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#93c5fd">Notifications</text><text x="125" y="72" text-anchor="middle" font-size="13" fill="#93c5fd">Sous-domaine générique</text><text x="32" y="116" font-size="13" fill="#cbd5e1">envoi par e-mail</text><text x="32" y="145" font-size="13" fill="#cbd5e1">envoi push</text><text x="32" y="174" font-size="13" fill="#cbd5e1">accusé de réception</text></g>
    <text x="500" y="390" text-anchor="middle" font-size="13" fill="#94a3b8">La cartographie des contextes décrit les relations métier ; elle n’impose pas un agent par bloc.</text>
  </g>
</svg>
