<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="bcd-title bcd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="bcd-title">Le terme produit a trois significations délimitées</title>
  <desc id="bcd-desc">La gestion des commandes, la facturation et les stocks possèdent chacune leur propre modèle Product. Un contrat de traduction mis en évidence fait correspondre les identifiants et les termes entre les contextes sans imposer un objet partagé.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; fill: #141D19; }
    .group { stroke: #2B3B33; stroke-width: 1.5; fill: none; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0C1210" />
  <rect class="group" x="48" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="68" y="78">CONTEXTE DÉLIMITÉ</text>
  <text class="name" x="68" y="104">Gestion des commandes</text>
  <rect class="box" x="72" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="92" y="158">MODÈLE</text>
  <text class="name" x="92" y="184"><tspan x="92">Product = ligne de</tspan><tspan x="92" dy="1.2em">commande</tspan></text>
  <text class="note" x="72" y="252">quantité · promesse · statut</text>
  <rect class="group" x="352" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="372" y="78">CONTEXTE DÉLIMITÉ</text>
  <text class="name" x="372" y="104">Facturation</text>
  <rect class="box" x="376" y="128" width="208" height="96" rx="10" fill="#1B2621" />
  <text class="kind" x="396" y="158">MODÈLE</text>
  <text class="name" x="396" y="184">Product = ligne tarifée</text>
  <text class="note" x="376" y="252">taxe · remise · règlement</text>
  <rect class="group" x="656" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="676" y="78">CONTEXTE DÉLIMITÉ</text>
  <text class="name" x="676" y="104">Stocks</text>
  <rect class="box" x="680" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="700" y="158">MODÈLE</text>
  <text class="name" x="700" y="184"><tspan x="700">Product = article en</tspan><tspan x="700" dy="1.2em">stock</tspan></text>
  <text class="note" x="680" y="252">SKU · emplacement · quantité</text>
  <path class="edge" d="M176 288v32M480 288v32M784 288v32" />
  <path class="edge" d="M176 320h608" />
  <path class="edge" d="M480 320v16" marker-end="url(#bcd-arrow)" />
  <rect x="256" y="336" width="448" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="276" y="361" fill="#FF6FB6">FOCUS · CONTRAT PUBLIÉ</text>
  <text class="name" x="276" y="384" fill="#FF6FB6">Traduire les termes et les identifiants</text>
  <text class="note" x="48" y="424">Chaque contexte conserve son propre modèle ; la traduction s’effectue à la frontière.</text>
  <defs>
    <marker id="bcd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
