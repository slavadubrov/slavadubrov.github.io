<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="di-title di-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="di-title">Une proposition de modèle traverse des frontières de domaine déterministes</title>
  <desc id="di-desc">Un modèle externe émet un AddTaskProposal non fiable. L’application l’analyse et le normalise, autorise l’acteur, invoque l’agrégat mis en évidence pour faire respecter les invariants métier, puis valide l’état et un événement outbox.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { stroke: #17211B; stroke-width: 1.5; fill: #FFFFFF; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1120" height="408" rx="14" fill="#F7F7F4" />
  <circle cx="62" cy="64" r="14" fill="#17211B" /><text class="marker-num" x="62" y="69" text-anchor="middle">1</text>
  <circle cx="278" cy="64" r="14" fill="#17211B" /><text class="marker-num" x="278" y="69" text-anchor="middle">2</text>
  <circle cx="494" cy="64" r="14" fill="#17211B" /><text class="marker-num" x="494" y="69" text-anchor="middle">3</text>
  <circle cx="710" cy="64" r="14" fill="#17211B" /><text class="marker-num" x="710" y="69" text-anchor="middle">4</text>
  <circle cx="926" cy="64" r="14" fill="#17211B" /><text class="marker-num" x="926" y="69" text-anchor="middle">5</text>
  <rect x="48" y="92" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="124">EXTERNE · MODÈLE</text>
  <text class="name" x="68" y="150">AddTaskProposal</text>
  <text class="note" x="68" y="174">valeurs non fiables</text>
  <rect class="box" x="264" y="92" width="160" height="96" rx="10" />
  <text class="kind" x="284" y="124">APPLICATION</text>
  <text class="name" x="284" y="150" style="font-size: 13px;">Analyser + normaliser</text>
  <text class="note" x="284" y="174">forme · date · unités</text>
  <rect class="box" x="480" y="92" width="160" height="96" rx="10" />
  <text class="kind" x="500" y="124">POLITIQUE</text>
  <text class="name" x="500" y="150">Autoriser l’acteur</text>
  <text class="note" x="500" y="174">propriétaire · opération</text>
  <rect x="696" y="92" width="160" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="716" y="124" fill="#C50E72">FOCUS · DOMAINE</text>
  <text class="name" x="716" y="150" fill="#C50E72" style="font-size: 11px;">Faire respecter l’invariant</text>
  <text class="note" x="716" y="174" fill="#C50E72" style="font-size: 11px;">émettre un événement de domaine</text>
  <rect class="box" x="912" y="92" width="160" height="96" rx="10" fill="#F2F2F5" />
  <text class="kind" x="932" y="124">STOCKAGE</text>
  <text class="name" x="932" y="150" style="font-size: 14.5px;">Validation atomique</text>
  <text class="note" x="932" y="174">état + outbox</text>
  <path class="edge" d="M208 140h48" marker-end="url(#di-arrow)" />
  <path class="edge" d="M424 140h48" marker-end="url(#di-arrow)" />
  <path class="edge" d="M640 140h48" marker-end="url(#di-arrow)" />
  <path class="edge" d="M856 140h48" marker-end="url(#di-arrow)" />
  <path class="edge" d="M344 188v60M560 188v60M776 188v60M992 188v60" stroke-dasharray="7 6" />
  <path class="edge" d="M344 248h648" stroke-dasharray="7 6" />
  <path class="edge" d="M560 248v24" stroke-dasharray="7 6" marker-end="url(#di-arrow)" />
  <rect x="224" y="272" width="672" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="244" y="297">REJETER AVANT PERSISTANCE</text>
  <text class="name" x="244" y="320">Invalide · contexte manquant · non autorisé · conflit · mise à jour concurrente</text>
  <text class="note" x="48" y="376">Un schéma contrôle la représentation. L’agrégat contrôle le sens métier.</text>
  <defs>
    <marker id="di-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
