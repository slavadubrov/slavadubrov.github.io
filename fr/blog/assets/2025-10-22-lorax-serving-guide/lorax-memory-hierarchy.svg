<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Stockage des artefacts d’adaptateurs et résidence en runtime dans LoRAX</title>
  <desc id="desc">Les artefacts d’adaptateurs distants ou locaux sont stockés dans le cache de données, matérialisés en mémoire CPU, puis rendus résidents dans la mémoire GPU aux côtés du modèle de base partagé. Les flèches représentent des transitions mesurées, et non des garanties de latence fixes.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="500" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Le stockage des artefacts n’est pas équivalent à leur résidence en runtime</text>
  <text x="500" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">La capacité dépend du working set actif et du coût de chaque transition</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(55 125)"><rect width="235" height="210" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2" /><text x="117" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0">Source des artefacts</text><text x="28" y="82" font-size="14" fill="#cbd5e1">Hugging Face / registre</text><text x="28" y="113" font-size="14" fill="#cbd5e1">Source objet ou système de fichiers</text><text x="28" y="144" font-size="14" fill="#cbd5e1">Digest d’intégrité</text><text x="28" y="175" font-size="14" fill="#cbd5e1">Métadonnées du modèle de base</text></g>
    <text x="320" y="240" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
    <g transform="translate(350 125)"><rect width="235" height="210" rx="16" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="117" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#93c5fd">Cache local d’artefacts</text><text x="28" y="82" font-size="14" fill="#cbd5e1">Fichiers d’adaptateurs téléchargés</text><text x="28" y="113" font-size="14" fill="#cbd5e1">Monté sur /data</text><text x="28" y="144" font-size="14" fill="#cbd5e1">Persistant ou éphémère</text><text x="28" y="175" font-size="14" fill="#cbd5e1">Coût de lecture et de matérialisation</text></g>
    <text x="615" y="240" text-anchor="middle" font-size="28" fill="#94a3b8">→</text>
    <g transform="translate(645 125)"><rect width="300" height="210" rx="16" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="150" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#93c5fd">Mémoire du runtime</text><rect x="28" y="70" width="112" height="105" rx="10" fill="#1d4ed8" /><text x="84" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#93c5fd">RAM CPU</text><text x="84" y="129" text-anchor="middle" font-size="12" fill="#93c5fd">déportés</text><text x="84" y="151" text-anchor="middle" font-size="12" fill="#93c5fd">adaptateurs</text><rect x="160" y="70" width="112" height="105" rx="10" fill="#166534" /><text x="216" y="101" text-anchor="middle" font-size="14" font-weight="700" fill="#86efac">VRAM GPU</text><text x="216" y="129" text-anchor="middle" font-size="12" fill="#86efac">base + actifs</text><text x="216" y="151" text-anchor="middle" font-size="12" fill="#86efac">adaptateurs + KV</text></g>

    <rect x="135" y="385" width="730" height="58" rx="12" fill="#5b21b6" stroke="#2563eb" />
    <text x="500" y="411" text-anchor="middle" font-size="14" font-weight="700" fill="#c4b5fd">Mesurez chaque transition sur votre workload</text>
    <text x="500" y="432" text-anchor="middle" font-size="12" fill="#93c5fd">Aucune latence fixe « disque → RAM → GPU » ne s’applique quelles que soient la taille de l’adaptateur, le stockage, le réseau et le matériel.</text>
  </g>
</svg>
