<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lmh-title lmh-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="lmh-title">Adapter : stockage des artefacts et résidence en mémoire dans LoRAX</title>
  <desc id="lmh-desc">Un adapter passe d’un registre externe au cache de données local, puis à un pool d’adapters CPU, et enfin à l’ensemble de travail actif sur GPU. Le téléchargement, la matérialisation et le transfert sont des transitions distinctes. La mémoire GPU contient également le modèle de base partagé, le KV cache, l’espace de travail du batch et les kernels du runtime.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #59645e; }
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .box { stroke: #17211b; stroke-width: 1.5; }
    .external { fill: #ffffff; stroke: #59645e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .store { fill: #f2f2f5; }
    .focus { fill: #fdecf5; stroke: #f2148e; stroke-width: 2.5; }
    .edge { fill: none; stroke: #59645e; stroke-width: 1.5; }
  </style>
  <rect width="960" height="336" rx="14" fill="#f7f7f4" />

  <text class="section" x="48" y="44">CHEMIN DE L’ADAPTER · TAILLE DU CATALOGUE ≠ ENSEMBLE DE TRAVAIL ACTIF</text>

  <rect class="external" x="48" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="68" y="122">EXTERNE</text>
  <text class="name" x="68" y="150">Registre d’artefacts</text>

  <rect class="box store" x="272" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="292" y="122">STOCKAGE · DISQUE</text>
  <text class="name" x="292" y="150">Cache local /data</text>

  <rect class="box store" x="496" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="516" y="122">STOCKAGE · CPU</text>
  <text class="name" x="516" y="150">Adapters déchargés</text>

  <rect class="focus" x="720" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="740" y="122" fill="#c50e72">GPU · CIBLE</text>
  <text class="name" x="740" y="150" fill="#c50e72">Adapters actifs</text>

  <path class="edge" d="M232 136h32" marker-end="url(#lmh-arrow)" />
  <path class="edge" d="M456 136h32" marker-end="url(#lmh-arrow)" />
  <path class="edge" d="M680 136h32" marker-end="url(#lmh-arrow)" />

  <text class="note" x="252" y="218" text-anchor="middle">téléchargement</text>
  <text class="note" x="476" y="218" text-anchor="middle">matérialisation</text>
  <text class="note" x="700" y="218" text-anchor="middle">transfert</text>

  <path d="M48 248h864" stroke="#d8ddd9" stroke-width="1" />
  <text class="kind" x="48" y="278">BUDGET GPU</text>
  <text class="note" x="48" y="302">Modèle de base partagé · adapters actifs · KV cache · espace de travail du batch · kernels du runtime</text>
  <text class="note" x="48" y="324">Mesurez séparément les hits GPU, les hits CPU, les hits d’artefacts et les misses distants comme des chemins de latence distincts.</text>

  <defs>
    <marker id="lmh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
