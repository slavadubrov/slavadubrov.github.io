<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #F7F7F4; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Instabilité HC signalée à 27B</title>
  <desc id="desc">Les cartes résiduelles non contraintes se composent entre les couches ; l’article rapporte un pic d’Amax Gain composite proche de 3 000 dans son expérience HC à 27B.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5" />
    </marker>
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5" />
    </marker>
    <marker id="arrowSlate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5" />
    </marker>

    <!-- Glowing Effects -->




    <!-- Shadows -->

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="600" fill="#F7F7F4" />

  <!-- Background grid layer -->
  <rect width="1000" height="600" fill="#F7F7F4" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#17211B">La complication : instabilité à grande échelle</text>
  <text x="40" y="80" font-size="16" fill="#17211B">L’article relie la hausse soudaine de la loss HC à 27B à une carte résiduelle composite non contrainte.</text>

  <!-- Left Side: Plot Area -->
  <g transform="translate(80, 140)">

    <!-- Plot Background -->
    <rect x="0" y="0" width="460" height="380" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="1.5" class="visual-focus" />

    <text x="240" y="28" text-anchor="middle" fill="#17211B" font-size="13" font-weight="600">Amplitude d’Amax Gain (échelle logarithmique)</text>

    <!-- Y-axis lines and ticks -->
    <g stroke="#59645E" stroke-width="1.5" fill="none">
      <line x1="60" y1="50" x2="420" y2="50" />
      <line x1="60" y1="120" x2="420" y2="120" />
      <line x1="60" y1="190" x2="420" y2="190" />
      <line x1="60" y1="260" x2="420" y2="260" />
    </g>

    <!-- Y-axis tick labels -->
    <g fill="#59645E" font-size="12" text-anchor="end" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
      <text x="50" y="54">1000</text>
      <text x="50" y="124">100</text>
      <text x="50" y="194">10</text>
      <text x="50" y="264">1</text>
      <text x="50" y="334">0.1</text>
    </g>

    <!-- Base X and Y axis lines drawn thicker -->
    <path d="M 60 40 L 60 330 L 430 330" fill="none" stroke="#17211B" stroke-width="2" />

    <!-- X-axis tick labels -->
    <g fill="#59645E" font-size="12" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
      <text x="60" y="350">0</text>
      <text x="150" y="350">25</text>
      <text x="240" y="350">50</text>
      <text x="330" y="350">75</text>
      <text x="420" y="350">100</text>
    </g>
    <!-- X-axis label -->
    <text x="240" y="370" text-anchor="middle" fill="#17211B" font-size="14" font-weight="600">Profondeur des couches</text>

    <!-- SVG paths for the curves -->
    <!-- ResNet Line -->
    <path id="pathResNet" d="M 60 260 L 420 260" fill="none" stroke="#59645E" stroke-width="3" stroke-dasharray="6,4" />
    <!-- Exploding Line -->
    <path id="pathExplode" d="M 60 260 C 200 260, 300 210, 420 50" fill="none" stroke="#17211B" stroke-width="3" />
    <!-- Vanishing Line -->
    <path id="pathVanish" d="M 60 260 C 200 260, 300 320, 420 325" fill="none" stroke="#59645E" stroke-width="3" />

    <!-- Exploding Curve Annotation -->
    <line x1="315" y1="120" x2="335" y2="100" stroke="#17211B" stroke-width="1.5" marker-end="url(#arrowRed)" />
    <rect x="265" y="120" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text x="315" y="138" text-anchor="middle" fill="#17211B" font-size="13" font-weight="700">Explose</text>

    <!-- ResNet Curve Annotation -->
    <line x1="350" y1="240" x2="350" y2="252" stroke="#17211B" stroke-width="1.5" marker-end="url(#arrowSlate)" />
    <rect x="280" y="214" width="140" height="26" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="350" y="232" text-anchor="middle" fill="#17211B" font-size="13" font-weight="700">ResNet standard</text>

    <!-- Vanishing Curve Annotation -->
    <line x1="225" y1="292" x2="270" y2="313" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowAmber)" />
    <rect x="180" y="266" width="90" height="26" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="225" y="284" text-anchor="middle" fill="#17211B" font-size="13" font-weight="700">S’annule</text>

    <!-- Animated Particles Tracing Curves -->

  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(580, 140)">

    <!-- Title Card -->
    <rect x="0" y="0" width="380" height="280" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
    <text x="190" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="#17211B">Gain de l’opérateur composite</text>
    <line x1="20" y1="50" x2="360" y2="50" stroke="#D8DDD9" stroke-width="2" />

    <!-- Standard Comparison -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="340" height="36" rx="6" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1.5" />
      <text x="15" y="23" font-size="14" font-weight="600" fill="#17211B">ResNet standard :</text>
      <text x="140" y="23" font-size="14" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">1.0 × x</text>
      <rect x="270" y="7" width="55" height="22" rx="11" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
      <text x="297" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#17211B">Sûr</text>
    </g>

    <!-- HC Matrix Explanations -->
    <g transform="translate(20, 140)">
      <text x="0" y="0" font-size="14" font-weight="600" fill="#17211B">Hyper-Connection : matrice non contrainte</text>

      <!-- Explodes -->
      <g transform="translate(0, 20)">
        <text x="10" y="0" font-size="14" font-weight="600" fill="#17211B">• Gain répété &gt; 1</text>
        <line x1="180" y1="-5" x2="200" y2="-5" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSlate)" />
        <text x="215" y="0" font-size="14" font-weight="700" fill="#17211B">Explose</text>
        <text x="10" y="22" font-size="13" fill="#17211B">peut amplifier les directions alignées</text>
      </g>

      <!-- Vanishes -->
      <g transform="translate(0, 65)">
        <text x="10" y="0" font-size="14" font-weight="600" fill="#17211B">• Gain répété &lt; 1</text>
        <line x1="180" y1="-5" x2="200" y2="-5" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowSlate)" />
        <text x="215" y="0" font-size="14" font-weight="700" fill="#17211B">S’annule</text>
        <text x="10" y="22" font-size="13" fill="#17211B">peut atténuer les directions alignées</text>
      </g>
    </g>

    <!-- Warning Metrics Box -->
    <rect x="0" y="310" width="380" height="85" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <path d="M 15 325 L 15 380" stroke="#17211B" stroke-width="4" stroke-linecap="round" />
    <text x="30" y="340" font-size="14" font-weight="700" fill="#17211B">Mesure HC de l’article à 27B</text>
    <text x="30" y="362" font-size="13" font-weight="500" fill="#17211B">Dans les réseaux HC profonds et non contrôlés, DeepSeek</text>
    <text x="30" y="380" font-size="13" font-weight="500" fill="#17211B">a mesuré un </text>
    <text x="105" y="380" font-size="13" font-weight="800" fill="#17211B">pic d’environ 3 000×</text>
    <text x="163" y="380" font-size="13" font-weight="500" fill="#17211B"> d’Amax Gain composite.</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
