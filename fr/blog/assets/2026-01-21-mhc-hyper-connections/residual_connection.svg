<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" style="background-color: #F7F7F4; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Connexion résiduelle standard</title>
  <desc id="desc">L’entrée suit un raccourci identité, tandis qu’une branche résiduelle apprise calcule une mise à jour ; les deux chemins sont additionnés.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <marker id="arrowSlate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#FFFFFF" />
    </marker>
    <marker id="arrowEmerald" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5" />
    </marker>

    <!-- Glow & Shadow -->




  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="600" height="680" fill="#F7F7F4" />

  <!-- Background grid layer -->
  <rect width="600" height="680" fill="#F7F7F4" />

  <!-- Top Title -->
  <text x="300" y="50" text-anchor="middle" font-size="24" font-weight="800" fill="#17211B">Connexion résiduelle standard</text>

  <!-- The Block -->
  <g transform="translate(150, 90)">

    <!-- Input x -->
    <rect x="110" y="0" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="150" y="24" text-anchor="middle" font-size="20" font-weight="800" fill="#17211B">x</text>

    <!-- Base Paths -->
    <g stroke="#59645E" stroke-width="2.5" fill="none">
      <!-- x to Split -->
      <path d="M 150 36 L 150 85" marker-end="url(#arrowSlate)" />
      <circle cx="150" cy="95" r="8" fill="#ffffff" stroke="#17211B" />

      <!-- Split to Layer 1 -->
      <path d="M 150 103 L 150 135" marker-end="url(#arrowSlate)" />

      <!-- Layer 1 to ReLU -->
      <path d="M 150 195 L 150 225" marker-end="url(#arrowSlate)" />

      <!-- ReLU to Layer 2 -->
      <path d="M 150 285 L 150 315" marker-end="url(#arrowSlate)" />

      <!-- Layer 2 to Add -->
      <path d="M 150 375 L 150 415" marker-end="url(#arrowSlate)" />

      <!-- Add to Output -->
      <path d="M 150 465 L 150 500" marker-end="url(#arrowSlate)" />
    </g>

    <!-- Identity path (the vital shortcut) -->
    <path id="pathIdentity" d="M 158 95 C 370 95 370 440 170 440" fill="none" stroke="#59645E" stroke-width="3" marker-end="url(#arrowEmerald)" />

    <!-- Animated Particles -->
    <!-- Gradient/Signal flow down the main F(x) block -->
    <g>

    </g>

    <!-- Block Components -->

    <!-- F(x) background enclosure -->
    <rect x="30" y="120" width="240" height="275" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6,4" class="visual-focus" />
    <!-- F(x) Label at edge -->
    <rect x="-10" y="240" width="50" height="30" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="15" y="260" text-anchor="middle" font-size="16" font-weight="800" fill="#17211B">F(x)</text>

    <!-- Weight Layer 1 -->
    <rect x="50" y="140" width="200" height="55" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="150" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Couche de poids</text>

    <!-- ReLU Layer -->
    <rect x="50" y="230" width="200" height="55" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="150" y="263" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">ReLU</text>

    <!-- Weight Layer 2 -->
    <rect x="50" y="320" width="200" height="55" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="150" y="353" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Couche de poids</text>

    <!-- Identity label mounted on the curve -->
    <rect x="275" y="250" width="75" height="30" rx="15" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text x="312" y="270" text-anchor="middle" fill="#17211B" font-size="13" font-weight="800">Identité</text>

    <!-- Plus (Addition) Node -->
    <circle cx="150" cy="440" r="22" fill="#ffffff" stroke="#17211B" stroke-width="2" />
    <text x="150" y="448" text-anchor="middle" font-size="24" font-weight="800" fill="#17211B">+</text>

    <!-- Output H(x) -->
    <rect x="85" y="505" width="130" height="45" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="150" y="534" text-anchor="middle" font-size="18" font-weight="800" fill="#17211B">F(x) + x</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
