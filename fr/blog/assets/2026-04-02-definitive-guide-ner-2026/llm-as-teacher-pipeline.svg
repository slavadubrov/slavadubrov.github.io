<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lt-title lt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lt-title">Des labels NER générés par un LLM à un encodeur déployable</title>
  <desc id="lt-desc">Six étapes ordonnées vont des titres bruts à l’annotation par LLM, à la revue humaine, puis au fine-tuning de l’encodeur. Un contrôle de qualité sur données réservées et de coût total détermine si l’encodeur est déployé.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .external { stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="536" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="lt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
  </defs>
  <path class="edge" d="M288 112h72" marker-end="url(#lt-arrow)" /><path class="edge" d="M600 112h72" marker-end="url(#lt-arrow)" />
  <path class="edge" d="M792 160v40" marker-end="url(#lt-arrow)" /><path class="edge" d="M672 248h-72" marker-end="url(#lt-arrow)" />
  <path class="edge" d="M360 248h-72" marker-end="url(#lt-arrow)" />
  <circle cx="62" cy="48" r="14" fill="#17211B" /><text class="marker-num" x="62" y="53" text-anchor="middle">1</text>
  <circle cx="374" cy="48" r="14" fill="#17211B" /><text class="marker-num" x="374" y="53" text-anchor="middle">2</text>
  <circle cx="686" cy="48" r="14" fill="#17211B" /><text class="marker-num" x="686" y="53" text-anchor="middle">3</text>
  <circle cx="686" cy="184" r="14" fill="#17211B" /><text class="marker-num" x="686" y="189" text-anchor="middle">4</text>
  <circle cx="374" cy="184" r="14" fill="#17211B" /><text class="marker-num" x="374" y="189" text-anchor="middle">5</text>
  <circle cx="62" cy="184" r="14" fill="#17211B" /><text class="marker-num" x="62" y="189" text-anchor="middle">6</text>
  <rect class="box" x="48" y="64" width="240" height="96" rx="10" fill="#F2F2F5" />
  <text class="kind" x="72" y="98">STOCKAGE · SOURCE</text><text class="name" x="72" y="126">~900K titres</text><text class="note" x="72" y="148">Actualités financières non annotées.</text>
  <rect class="external" x="360" y="64" width="240" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="384" y="98">EXTERNE · ENSEIGNANT</text><text class="name" x="384" y="126">Labels générés par Llama 3.1-70B</text><text class="note" x="384" y="148">Étude de cas : ~8 heures · ~$70.</text>
  <rect class="box" x="672" y="64" width="240" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="696" y="98">TRAITEMENT · REVUE</text><text class="name" x="696" y="126">Vérifier 2 714 échantillons</text><text class="note" x="696" y="148">Argilla · environ 8 heures.</text>
  <rect class="box" x="672" y="200" width="240" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="696" y="234">TRAITEMENT · ENTRAÎNEMENT</text><text class="name" x="696" y="262">Effectuer le fine-tuning de l’encodeur</text><text class="note" x="696" y="284">GLiNER-medium dans l’étude de cas.</text>
  <rect x="360" y="200" width="240" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="384" y="234" fill="#C50E72">FOCUS · CONTRÔLE QUALITÉ</text><text class="name" x="384" y="262" fill="#C50E72">F1 sur données réservées + coût total</text>
  <text class="note" x="384" y="284" fill="#C50E72">Accepter uniquement les gains mesurés.</text>
  <rect class="box" x="48" y="200" width="240" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="72" y="234">TRAITEMENT · DÉPLOIEMENT</text><text class="name" x="72" y="262">Servir sur CPU</text><text class="note" x="72" y="284">Rapporté : 93,4 % de F1 · $0,10/h.</text>
  <path d="M48 352h864" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="388">COMPARAISON DE L’ÉTUDE DE CAS · PAS UN RATIO DE COÛT UNIVERSEL</text>
  <text class="name" x="48" y="424">Enseignant : 92,7 % de F1 · prix d’instance rapporté : $8/h</text>
  <text class="name" x="48" y="458">Encodeur : 93,4 % de F1 · prix d’instance CPU rapporté : $0,10/h</text>
  <text class="note" x="48" y="496">Votre contrôle doit inclure l’annotation, la revue, le serving, le réentraînement et la qualité spécifique au domaine.</text>
</svg>
