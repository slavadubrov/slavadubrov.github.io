<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tt-title tt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tt-title">Routage NER à trois niveaux selon la nature de la tâche d’extraction</title>
  <desc id="tt-desc">Une demande d’extraction est routée selon la nature de la tâche. Les spans explicites sont dirigés vers des encodeurs, les tâches conjointes et les relations vers GLiNER2 ou GLiNER-Relex, et les tâches exigeant du raisonnement ou la mise en correspondance avec une ontologie vers des LLMs contraints par schéma. Les cas traités par des LLMs et journalisés alimentent le prochain dataset d’entraînement des encodeurs.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="552" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="tt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
  </defs>
  <path class="edge" d="M256 96h40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40H168v40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v80" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40h312v40" marker-end="url(#tt-arrow)" />
  <rect x="48" y="48" width="208" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="72" y="82">DEMANDE</text><text class="name" x="72" y="110">Tâche d’extraction</text><text class="note" x="72" y="132">Texte + schéma requis.</text>
  <rect x="296" y="48" width="368" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="320" y="82" fill="#C50E72">FOCUS · ROUTEUR</text><text class="name" x="320" y="110" fill="#C50E72">Router selon la nature de la tâche</text>
  <text class="note" x="320" y="132" fill="#C50E72" style="font-size: 11px;">Ne classez pas les modèles une seule fois pour chaque demande.</text>
  <rect class="group" x="48" y="200" width="240" height="264" rx="12" /><rect class="group" x="360" y="200" width="240" height="264" rx="12" /><rect class="group" x="672" y="200" width="240" height="264" rx="12" />
  <rect class="box" x="72" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="92" y="258">NIVEAU 1 · TRAITEMENT</text><text class="name" x="92" y="286">Modèles encodeurs</text><text class="note" x="92" y="308">Spans textuels explicites.</text>
  <text class="kind" x="72" y="356">CHOISIR SELON L’ENSEMBLE DE LABELS</text><text class="note" x="72" y="382">Cross-encoder · petit inventaire</text><text class="note" x="72" y="406">Bi-encoder · inventaire réutilisable</text><text class="note" x="72" y="430">Modèle fine-tuné · domaine stable</text>
  <rect class="box" x="384" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="404" y="258">NIVEAU 2 · TRAITEMENT</text><text class="name" x="404" y="286">Extraction conjointe</text><text class="note" x="404" y="308">Plusieurs tâches liées.</text>
  <text class="kind" x="384" y="356">TESTER LA COMPOSITION</text><text class="note" x="384" y="382">GLiNER2 · NER + champs + classe</text><text class="note" x="384" y="406">GLiNER-Relex · spans + relations</text><text class="note" x="384" y="430">Évaluer chaque sortie séparément</text>
  <rect x="696" y="224" width="192" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="716" y="258">NIVEAU 3 · EXTERNE</text><text class="name" x="716" y="286">LLM structuré</text><text class="note" x="716" y="308" style="font-size: 11px;">Inférence ou mise en correspondance.</text>
  <text class="kind" x="696" y="356">CONTRAINDRE LA SORTIE</text><text class="note" x="696" y="382">Schéma natif · Instructor</text><text class="note" x="696" y="406">Outlines · génération locale</text><text class="note" x="696" y="430"><tspan x="696">Ancrer ou auto-héberger selon les</tspan><tspan x="696" dy="1.2em">besoins</tspan></text>
  <path class="edge" d="M792 464v32H168v-32" stroke-dasharray="2 6" marker-end="url(#tt-arrow)" />
  <rect x="338" y="484" width="284" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="501" text-anchor="middle" style="font-size: 11px;">cas journalisés → prochain dataset d’entraînement du niveau 1</text>
  <text class="note" x="48" y="534">Mesurez la répartition du trafic en production ; les niveaux décrivent le travail, pas un pourcentage fixe des demandes.</text>
</svg>
