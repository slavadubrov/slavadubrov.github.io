<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ga-title ga-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ga-title">Comment GLiNER transforme un label et un segment de texte en un score d’entité</title>
  <desc id="ga-desc">Les labels et le texte passent dans un seul encodeur DeBERTa. Le modèle construit des embeddings de types d’entités et des représentations de segments candidats, puis compare chaque paire par produit scalaire et sigmoid. Le score est au centre du diagramme.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .formula { font: 600 16px "IBM Plex Mono", ui-monospace, monospace; fill: #C50E72; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="566" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="ga-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
  <path class="edge" d="M480 144v32" marker-end="url(#ga-arrow)" />
  <path class="edge" d="M480 238v24H232v32" marker-end="url(#ga-arrow)" />
  <path class="edge" d="M480 238v24h248v32" marker-end="url(#ga-arrow)" />
  <path class="edge" d="M232 390v24h248v32" marker-end="url(#ga-arrow)" />
  <path class="edge" d="M728 390v24H480v32" marker-end="url(#ga-arrow)" />
  <rect class="box" x="48" y="48" width="864" height="96" rx="10" fill="#F2F2F5" />
  <text class="kind" x="72" y="82">SÉQUENCE D’ENTRÉE</text>
  <text class="name" x="72" y="111">[ENT] personne · [ENT] organisation · [SEP] Bill Gates a fondé Microsoft</text>
  <text class="note" x="72" y="132">Les labels et le texte partagent un même contexte bidirectionnel.</text>
  <rect class="box" x="296" y="176" width="368" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="320" y="201">TRAITEMENT</text>
  <text class="name" x="320" y="226">Encodage DeBERTa conjoint</text>
  <rect class="box" x="48" y="294" width="368" height="96" rx="10" fill="#F2F2F5" />
  <text class="kind" x="72" y="328">TYPES D’ENTITÉS</text>
  <text class="name" x="72" y="356">Embeddings de type q<tspan baseline-shift="sub" font-size="12">t</tspan></text>
  <text class="note" x="72" y="378">Lus à chaque position de token [ENT].</text>
  <rect class="box" x="544" y="294" width="368" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="568" y="328">SEGMENTS CANDIDATS</text>
  <text class="name" x="568" y="356">Vecteurs de segment S<tspan baseline-shift="sub" font-size="12">ij</tspan></text>
  <text class="note" x="568" y="378">FFN des vecteurs de début et de fin ; largeur ≤ 12.</text>
  <rect x="296" y="446" width="368" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="320" y="480" fill="#C50E72">FOCUS · SCORE DE CORRESPONDANCE</text>
  <text class="formula" x="320" y="509">φ(i,j,t) = σ(S<tspan baseline-shift="sub" font-size="12">ij</tspan> · q<tspan baseline-shift="sub" font-size="12">t</tspan>)</text>
  <text class="note" x="320" y="531" fill="#C50E72">Conserver les paires segment–type au-dessus du seuil.</text>
</svg>
