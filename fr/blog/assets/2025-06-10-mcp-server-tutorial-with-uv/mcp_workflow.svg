<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mw-title mw-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="mw-title">Six étapes d’une recherche d’outil FeatureStoreLite</title>
  <desc id="mw-desc">Au démarrage, le client MCP découvre les outils du serveur et Claude reçoit leurs tool schemas. Pour une recherche, Claude demande get_feature, le client envoie un tools call via la frontière MCP, FeatureStoreLite interroge SQLite, puis le résultat revient via l’hôte pour la réponse finale de Claude.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .marker-num { font-weight: 600; font-size: 13px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; fill: #ffffff; }
    .box { stroke: #17211b; stroke-width: 1.5; fill: #ffffff; }
    .edge { stroke: #59645e; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="472" rx="14" fill="#f7f7f4" />

  <text class="kind" x="48" y="40">DÉMARRAGE · DÉCOUVRIR L’OUTIL</text>

  <circle cx="62" cy="68" r="14" fill="#17211b" />
  <text class="marker-num" x="62" y="73" text-anchor="middle">1</text>
  <circle cx="366" cy="68" r="14" fill="#17211b" />
  <text class="marker-num" x="366" y="73" text-anchor="middle">2</text>
  <circle cx="670" cy="68" r="14" fill="#17211b" />
  <text class="marker-num" x="670" y="73" text-anchor="middle">3</text>

  <rect class="box" x="48" y="96" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="126">PROCESSUS</text>
  <text class="name" x="68" y="154">Découvrir les outils du serveur</text>
  <text class="note" x="68" y="176">Claude Desktop · client MCP</text>

  <rect class="box" x="352" y="96" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="126">PROCESSUS</text>
  <text class="name" x="372" y="154">Exposer les tool schemas</text>
  <text class="note" x="372" y="176">Hôte → Claude</text>

  <rect class="box" x="656" y="96" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="126">PROCESSUS</text>
  <text class="name" x="676" y="154">Demander get_feature</text>
  <text class="note" x="676" y="176">Claude → hôte</text>

  <path class="edge" d="M312 144h32" marker-end="url(#mw-arrow)" />
  <path class="edge" d="M616 144h32" marker-end="url(#mw-arrow)" />

  <text class="kind" x="48" y="244">PLACE AUX QUESTIONS · LANCER LA RECHERCHE</text>

  <circle cx="670" cy="272" r="14" fill="#17211b" />
  <text class="marker-num" x="670" y="277" text-anchor="middle">4</text>
  <circle cx="366" cy="272" r="14" fill="#17211b" />
  <text class="marker-num" x="366" y="277" text-anchor="middle">5</text>
  <circle cx="62" cy="272" r="14" fill="#17211b" />
  <text class="marker-num" x="62" y="277" text-anchor="middle">6</text>

  <rect x="656" y="300" width="256" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="676" y="330" fill="#c50e72">FOCUS</text>
  <text class="name" x="676" y="358" fill="#c50e72">Envoyer tools/call</text>
  <text class="note" x="676" y="380">Client MCP → FeatureStoreLite</text>

  <rect class="box" x="352" y="300" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="330">PROCESSUS</text>
  <text class="name" x="372" y="358">Exécuter get_feature</text>
  <text class="note" x="372" y="380">FeatureStoreLite ↔ features.db</text>

  <rect class="box" x="48" y="300" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="330">PROCESSUS</text>
  <text class="name" x="68" y="358">Retourner la réponse finale</text>
  <text class="note" x="68" y="380">JSON → hôte → Claude</text>

  <path class="edge" d="M784 192v100" marker-end="url(#mw-arrow)" />
  <path class="edge" d="M656 348h-32" marker-end="url(#mw-arrow)" />
  <path class="edge" d="M352 348h-32" marker-end="url(#mw-arrow)" />

  <text class="note" x="48" y="444">La découverte s’effectue au démarrage. Chaque recherche franchit la frontière client-serveur MCP sous la forme d’une requête tools/call.</text>

  <defs>
    <marker id="mw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
