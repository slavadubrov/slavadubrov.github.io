<path d="M32 452h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La découverte s’exécute une fois, au démarrage — le client connaît déjà les schémas des outils à ce stade.</text>
<text x="32" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Chaque recherche franchit néanmoins la frontière entre le client et le serveur MCP via une nouvelle requête tools/call.</text>
</svg>
