<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="mcpflow-title mcpflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mcpflow-title">Une recherche de feature s’exécute en six étapes : au démarrage, le client découvre une fois les outils du serveur, puis chaque question franchit la frontière MCP via une nouvelle requête tools/call.</title><desc id="mcpflow-desc">Au démarrage, le client MCP de Claude Desktop découvre les outils du serveur et l’hôte expose leurs schémas à Claude, qui peut alors demander get_feature. Lorsqu’une question nécessite des données du feature store, le client envoie cette demande à FeatureStoreLite sous forme de message tools/call ; le serveur exécute get_feature sur SQLite, puis le résultat revient via l’hôte jusqu’à Claude, qui formule la réponse finale.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mcpflow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="mcpflow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="548" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Six étapes d’une recherche de feature</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">La découverte s’exécute une fois ; chaque recherche suivante répète les trois dernières étapes.</text>
<text x="32" y="104" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">DÉMARRAGE · DÉCOUVRIR LES OUTILS</text>
