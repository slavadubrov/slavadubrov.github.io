<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="zcs-title zcs-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="zcs-title">Fichiers de démarrage Zsh sélectionnés selon les modes login et interactif</title>
  <desc id="zcs-desc">Une matrice deux par deux associe les indicateurs indépendants login et interactif aux fichiers de démarrage lus par Zsh. Les shells interactifs login lisent zshenv, zprofile, zshrc et zlogin ; les shells non interactifs login ignorent zshrc ; les shells interactifs non-login lisent zshenv et zshrc ; les shells sans aucun de ces indicateurs ne lisent que zshenv.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0c1210" />

  <text class="section" x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">DEUX INDICATEURS — QUATRE ENSEMBLES DE DÉMARRAGE</text>
  <text class="axis" x="168" y="84" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">INTERACTIF</text>
  <text class="axis" x="560" y="84" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">NON INTERACTIF</text>

  <text class="axis" x="48" y="142" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">LOGIN</text>
  <text class="note" x="48" y="166" fill="#a8b8af" font-size="13">indicateur activé</text>
  <text class="axis" x="48" y="278" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">NON-LOGIN</text>
  <text class="note" x="48" y="302" fill="#a8b8af" font-size="13">indicateur désactivé</text>

  <rect class="mode" x="168" y="104" width="352" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="188" y="134" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE</text>
  <text class="name" x="188" y="161" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Login + interactif</text>
  <text class="note" x="188" y="184" fill="#a8b8af" font-size="13">.zshenv → .zprofile → .zshrc → .zlogin</text>

  <rect class="mode" x="560" y="104" width="352" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="580" y="134" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE</text>
  <text class="name" x="580" y="161" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Login + non interactif</text>
  <text class="note" x="580" y="184" fill="#a8b8af" font-size="13">.zshenv → .zprofile → .zlogin</text>

  <rect x="168" y="240" width="352" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="188" y="270" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE CONCENTRATION</text>
  <text class="name" x="188" y="297" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Non-login + interactif</text>
  <text class="note" x="188" y="320" fill="#ff6fb6" font-size="13">.zshenv → .zshrc</text>

  <rect class="mode" x="560" y="240" width="352" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="580" y="270" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE</text>
  <text class="name" x="580" y="297" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Non-login + non interactif</text>
  <text class="note" x="580" y="320" fill="#a8b8af" font-size="13">.zshenv uniquement</text>

  <path d="M48 376h864" stroke="#2b3b33" stroke-width="1" />
  <text class="note" x="48" y="404" fill="#a8b8af" font-size="13">Un Zsh interactif imbriqué lit toujours .zshrc ; il n’a pas besoin d’être un shell login.</text>
</svg>
