<text x="32" y="810" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Mitigations live outside model memory, so the same controls survive a worker restart.</text>
<text x="32" y="832" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A fresh-context evaluator fails closed regardless of which failure class fired.</text>
