<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fm-title fm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fm-title">Four failure classes and the runtime controls that contain them</title>
  <desc id="fm-desc">Quality, cost, state, and context failures converge on runtime controls. The acceptance gate is highlighted because it prevents an agent from declaring incomplete work done.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#A8B8AF}.box{stroke:#EDF5F0;stroke-width:1.5;fill:#141D19}.edge{stroke:#A8B8AF;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="560" rx="14" fill="#0C1210"/>
  <text class="section" x="48" y="48">FAILURE CLASS</text><text class="section" x="584" y="48">CONTAINMENT HOOK</text>
  <rect class="box" x="48" y="72" width="280" height="96" rx="10"/><text class="kind" x="68" y="106">FAILURE · QUALITY</text><text class="name" x="68" y="134">Premature completion</text><text class="note" x="68" y="154">feature amnesia</text>
  <rect class="box" x="48" y="192" width="280" height="96" rx="10"/><text class="kind" x="68" y="226">FAILURE · COST</text><text class="name" x="68" y="254">Retry storms</text><text class="note" x="68" y="274">runaway token spend</text>
  <rect class="box" x="48" y="312" width="280" height="96" rx="10"/><text class="kind" x="68" y="346">FAILURE · STATE</text><text class="name" x="68" y="374">Duplicate side effects</text><text class="note" x="68" y="394">workspace drift · crash loss</text>
  <rect class="box" x="48" y="432" width="280" height="80" rx="10"/><text class="kind" x="68" y="462">FAILURE · CONTEXT</text><text class="name" x="68" y="490">Reset loses intent</text>

  <rect x="584" y="72" width="328" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="604" y="106" fill="#FF6FB6">FOCUS · ACCEPTANCE GATE</text><text class="name" x="604" y="134" fill="#FF6FB6">Fresh reviewer fails closed</text>
  <rect class="box" x="584" y="192" width="328" height="96" rx="10"/><text class="kind" x="604" y="226">CONTROL · BUDGET</text><text class="name" x="604" y="254">Caps · backoff · kill switch</text>
  <rect class="box" x="584" y="312" width="328" height="96" rx="10"/><text class="kind" x="604" y="346">CONTROL · DURABILITY</text><text class="name" x="604" y="374">Log · checkpoint · isolation</text>
  <rect class="box" x="584" y="432" width="328" height="80" rx="10"/><text class="kind" x="604" y="462">CONTROL · COLD BOOT</text><text class="name" x="604" y="490">Reload progress artifacts</text>
  <path d="M328 120H576" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#fm-signal)"/><text class="note" x="408" y="110" fill="#FF6FB6">verify artifacts</text>
  <path class="edge" d="M328 240H576" marker-end="url(#fm-arrow)"/><text class="note" x="420" y="230">bound work</text>
  <path class="edge" d="M328 360H576" marker-end="url(#fm-arrow)"/><text class="note" x="414" y="350">resume safely</text>
  <path class="edge" d="M328 472H576" marker-end="url(#fm-arrow)"/><text class="note" x="412" y="462">restore intent</text>
  <text class="note" x="48" y="544">Mitigations live outside model memory, so the same controls survive a worker restart.</text>
  <defs><marker id="fm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker><marker id="fm-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
</svg>
