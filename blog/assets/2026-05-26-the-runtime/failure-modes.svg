<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="failmodes-title failmodes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="failmodes-title">Four runtime failures have specific fixes. A separate evaluator checks the finished work.</title><desc id="failmodes-desc">Feature amnesia after a context reset is mitigated by reloading progress files on cold boot. Premature completion is blocked by a fresh-context evaluator that reads files, not chat history, and fails closed. Cost failures (retry storms, runaway spend) are capped by iteration budgets and backoff. State failures (workspace drift, duplicate calls, lost work) are contained by a durable log, checkpoints, and idempotency keys. Context-window failures (early summarization) are capped by session-length limits and checkpoint resume. The evaluator checks the finished work in all four cases.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="failmodes-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="failmodes-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="860" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Four failures, one final check</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Mitigations run outside model memory, so they survive a worker restart.</text>
