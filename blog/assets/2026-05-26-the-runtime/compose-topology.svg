<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">The Docker Compose reference stack has one worker as the harness, three stores it owns directly, and three opt-in services enabled by profile flags.</title><desc id="composetop-desc">A LangGraph worker acts as the run owner and harness, pulling jobs from a Redis queue, writing checkpoints to Postgres, and reading cold memory from Qdrant. This local Compose demo has PostgresSaver only; a production-shaped session also needs a separately written event schema for tool intents and outcomes. In local Compose, the worker and MCP sidecar read a shared .env: the worker holds the credential for its direct Claude API call and can read the same tool credentials as the sidecar. An OpenTelemetry collector gathers traces and metrics, and an observability stack stores them — all three enabled by opt-in Compose profiles.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
