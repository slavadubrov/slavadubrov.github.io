<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">A healthy agent run persists a pending intent before dispatch, records the outcome, then checkpoints and evaluates; a new worker reconciles the pending intent first.</title><desc id="runlife-desc">This illustrative path follows one coordinated side-effecting operation: boot, plan, persist a pending intent and idempotency key, dispatch, persist its outcome, checkpoint, then evaluate. Independent read-only or idempotent calls may run in parallel with separate durable records and deterministic aggregation. A worker that crashes after dispatch and before the outcome write wakes with the same session ID, reconciles the pending intent, and only then continues. A failed evaluation resumes at planning; a passed evaluation exits cleanly.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="runlife-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="runlife-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
