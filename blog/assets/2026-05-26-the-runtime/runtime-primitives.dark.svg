<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">The five runtime primitives and their boundaries</title>
  <desc id="rp-desc">The harness drives model and tool calls. A session records events, a checkpoint stores resumable state, a sandbox executes commands, and a trace records evidence. The checkpoint is highlighted as the recovery boundary.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#A8B8AF}.box{stroke:#EDF5F0;stroke-width:1.5;fill:#141D19}.store{stroke:#EDF5F0;stroke-width:1.5;fill:#1B2621}.edge{stroke:#A8B8AF;stroke-width:1.5;fill:none}
  </style>
  <rect width="960" height="520" rx="14" fill="#0C1210"/>
  <rect x="48" y="48" width="864" height="408" rx="12" fill="none" stroke="#2B3B33"/>
  <text class="section" x="68" y="76">OUTER RUNTIME · OWNS EXECUTION AND DURABILITY</text>
  <rect class="box" x="344" y="104" width="272" height="96" rx="10"/>
  <text class="kind" x="364" y="138">PROCESS · HARNESS</text><text class="name" x="364" y="166">Drive model ↔ tool turns</text>
  <rect class="store" x="88" y="264" width="200" height="96" rx="10"/>
  <text class="kind" x="108" y="298">STORE · SESSION</text><text class="name" x="108" y="326">Append-only event log</text>
  <rect x="344" y="264" width="272" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/>
  <text class="kind" x="364" y="298" fill="#FF6FB6">FOCUS · CHECKPOINT</text><text class="name" x="364" y="326" fill="#FF6FB6">Resume from safe state</text>
  <rect class="box" x="672" y="264" width="200" height="96" rx="10"/>
  <text class="kind" x="692" y="298">PROCESS · SANDBOX</text><text class="name" x="692" y="326">Execute commands</text>
  <rect class="store" x="344" y="392" width="272" height="62" rx="10"/>
  <text class="kind" x="364" y="418">STORE · TRACE</text><text class="name" x="364" y="442">Replayable evidence</text>
  <path class="edge" d="M344 152H288a20 20 0 0 0-20 20v84" marker-end="url(#rp-arrow)"/><text class="note" x="276" y="226">events</text>
  <path class="edge" d="M480 200v56" marker-end="url(#rp-arrow)"/><text class="note" x="492" y="232">state</text>
  <path class="edge" d="M616 152h136a20 20 0 0 1 20 20v84" marker-end="url(#rp-arrow)"/><text class="note" x="682" y="142">tool calls</text>
  <path class="edge" d="M772 360v42a20 20 0 0 1-20 20H624" marker-end="url(#rp-arrow)"/><text class="note" x="688" y="410">spans</text>
  <path class="edge" d="M336 423H188a20 20 0 0 1-20-20v-35" marker-end="url(#rp-arrow)"/><text class="note" x="208" y="412">record</text>
  <path d="M288 312H336" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#rp-signal)"/><text class="note" x="298" y="302" fill="#FF6FB6">resume</text>
  <text class="note" x="48" y="494">Workers are replaceable because the session and checkpoint outlive the process.</text>
  <defs><marker id="rp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker><marker id="rp-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
</svg>
