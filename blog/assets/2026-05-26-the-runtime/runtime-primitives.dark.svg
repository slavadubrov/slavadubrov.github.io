<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="runprim-title runprim-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runprim-title">The harness is the only runtime primitive that decides; the other four store state or confine execution.</title><desc id="runprim-desc">Five runtime primitives support a long-running agent: the harness assembles context, checks permissions, and dispatches tool calls; the session is an append-only log of what happened; the sandbox executes commands in isolation; the checkpoint gives the next worker a resume point; and the trace preserves evidence for debugging. Only the harness decides — the other four store state or confine execution.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="runprim-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="runprim-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="800" height="520" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Five primitives, one decision-maker</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Session, sandbox, checkpoint, and trace store state or confine execution; the harness decides.</text>
<path d="M42 128h716a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><path d="M42 128h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6"/><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · HARNESS</text><text x="46" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">The only primitive that decides</text><text x="46" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Assembles context, checks permissions, dispatches, resumes</text>
<path d="M42 288h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5"/><path d="M42 288h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8"/><text x="46" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · SESSION</text><text x="46" y="339" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Event log</text><text x="46" y="361" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Model + tool calls,</text><text x="46" y="381" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">results, approvals</text>
<path d="M230 288h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M230 288h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="234" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESS · SANDBOX</text><text x="234" y="339" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Runs commands</text><text x="234" y="361" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Isolated container</text><text x="234" y="381" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">or VM</text>
<path d="M418 288h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5"/><path d="M418 288h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8"/><text x="422" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · CHECKPOINT</text><text x="422" y="339" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Resume point</text><text x="422" y="361" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Written at each</text><text x="422" y="381" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">super-step</text>
<path d="M606 288h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5"/><path d="M606 288h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8"/><text x="610" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · TRACE</text><text x="610" y="339" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Replay evidence</text><text x="610" y="361" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Spans: timing,</text><text x="610" y="381" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">tokens, cost</text>
<path d="M118 232v56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#runprim-arrow-flow)"/><text x="118" y="270.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">writes</text>
<path d="M306 232v56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#runprim-arrow-flow)"/><rect x="259" y="254" width="94" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1"/><text x="306" y="270.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">dispatches</text>
<path d="M494 232v56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#runprim-arrow-flow)"/><rect x="443.5" y="254" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1"/><text x="494" y="270.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">checkpoints</text>
<path d="M682 232v56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#runprim-arrow-flow)"/><text x="682" y="270.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">traces</text>
<path d="M32 424h736" stroke="#2B3B33" stroke-width="1"/>
<text x="32" y="450" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Workers are replaceable because the session and checkpoint outlive the process.</text>
<text x="32" y="472" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">The harness is not a storage layer — it's the program that stands on the other four.</text>
</svg>
