<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rl-title rl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rl-title">Lifecycle of a recoverable agent run</title>
  <desc id="rl-desc">A run boots, plans, executes, checkpoints, and evaluates. Failed evaluation or a new worker resumes from the highlighted checkpoint rather than starting over.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.num{font:600 13px "IBM Plex Mono",ui-monospace,monospace;fill:#141D19}.box{stroke:#EDF5F0;stroke-width:1.5;fill:#141D19}.edge{stroke:#A8B8AF;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="480" rx="14" fill="#0C1210"/>
  <g><circle cx="62" cy="68" r="14" fill="#EDF5F0"/><text class="num" x="62" y="73" text-anchor="middle">1</text><circle cx="238" cy="68" r="14" fill="#EDF5F0"/><text class="num" x="238" y="73" text-anchor="middle">2</text><circle cx="414" cy="68" r="14" fill="#EDF5F0"/><text class="num" x="414" y="73" text-anchor="middle">3</text><circle cx="590" cy="68" r="14" fill="#EDF5F0"/><text class="num" x="590" y="73" text-anchor="middle">4</text><circle cx="766" cy="68" r="14" fill="#EDF5F0"/><text class="num" x="766" y="73" text-anchor="middle">5</text></g>
  <rect class="box" x="48" y="96" width="144" height="96" rx="10"/><text class="kind" x="68" y="130">PROCESS</text><text class="name" x="68" y="158">Boot</text><text class="note" x="68" y="178">load state</text>
  <rect class="box" x="224" y="96" width="144" height="96" rx="10"/><text class="kind" x="244" y="130">PROCESS</text><text class="name" x="244" y="158">Plan</text><text class="note" x="244" y="178">define done</text>
  <rect class="box" x="400" y="96" width="144" height="96" rx="10"/><text class="kind" x="420" y="130">PROCESS</text><text class="name" x="420" y="158">Execute</text><text class="note" x="420" y="178">one tool call</text>
  <rect x="576" y="96" width="144" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="596" y="130" fill="#A8B8AF">FOCUS</text><text class="name" x="596" y="158" fill="#A8B8AF">Checkpoint</text><text class="note" x="596" y="178" fill="#A8B8AF">commit state</text>
  <path class="box" d="M824 96 912 144 824 192 736 144Z"/><text class="kind" x="824" y="136" text-anchor="middle">DECISION</text><text class="name" x="824" y="160" text-anchor="middle">done?</text>
  <path class="edge" d="M192 144h24" marker-end="url(#rl-arrow)"/><path class="edge" d="M368 144h24" marker-end="url(#rl-arrow)"/><path class="edge" d="M544 144h24" marker-end="url(#rl-arrow)"/>  <path class="edge" d="M720 144h16" marker-end="url(#rl-arrow)"/>
  <text class="note" x="865" y="222">yes → exit</text><path class="edge" d="M824 192v36" marker-end="url(#rl-arrow)"/>
  <path d="M760 157v103a20 20 0 0 1-20 20H472a20 20 0 0 1-20-20v-60" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#rl-signal)"/><text class="note" x="628" y="306" text-anchor="middle" fill="#A8B8AF">no → continue from checkpoint</text>
  <rect class="box" x="176" y="344" width="240" height="96" rx="10" stroke-dasharray="6 5" stroke="#A8B8AF"/><text class="kind" x="196" y="378">EXTERNAL · NEW WORKER</text><text class="name" x="196" y="406">Crash or redeploy</text><text class="note" x="196" y="426">same session ID</text>
  <path d="M416 392h232a20 20 0 0 0 20-20V200" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#rl-signal)"/><text class="note" x="492" y="382" fill="#A8B8AF">restore last clean state</text>
  <text class="note" x="48" y="462">Each completed step is durable before the next begins; only in-flight work is lost.</text>
  <defs><marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker><marker id="rl-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
</svg>
