<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="gateway-dark-title gateway-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="gateway-dark-title">The inference gateway is a policy and routing boundary</title>
  <desc id="gateway-dark-desc">An application sends a stable contract and manifest identity to an inference gateway. The gateway applies authentication, quotas, routing, retries, cache policy, and trace propagation before choosing hosted, self-hosted, or fallback routes. Every branch reaches a common evaluation gate.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="560" rx="14" fill="#0C1210"/><text class="kind" x="48" y="44">ROUTING BOUNDARY — POLICY IS CENTRAL, TASK TRUTH IS NOT</text>
  <rect class="box" x="48" y="168" width="208" height="96" rx="10"/><text class="kind" x="68" y="202">APPLICATION</text><text class="name" x="68" y="230">Stable contract</text>
  <rect x="320" y="168" width="288" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="344" y="202" fill="#FF6FB6">INFERENCE GATEWAY</text><text class="name" x="344" y="230" fill="#FF6FB6">Own policy + routing</text><path d="M320 304h288" stroke="#2B3B33"/><text class="note" x="320" y="328">auth · quota · region · budget</text><text class="note" x="320" y="352">retry · breaker · cache · trace</text>
  <rect class="external" x="688" y="64" width="256" height="96" rx="10"/><text class="kind" x="708" y="98">EXTERNAL ROUTE</text><text class="name" x="708" y="126" fill="#A8B8AF">Hosted provider</text>
  <rect class="box" x="688" y="184" width="256" height="96" rx="10"/><text class="kind" x="708" y="218">OWNED ROUTE</text><text class="name" x="708" y="246">Self-hosted runtime</text>
  <rect class="external" x="688" y="304" width="256" height="96" rx="10"/><text class="kind" x="708" y="338">FALLBACK ROUTE</text><text class="name" x="708" y="366" fill="#A8B8AF">Explicit behavior change</text>
  <path class="edge" d="M256 216h56" marker-end="url(#gateway-dark-arrow)"/><path class="edge" d="M608 192h40a12 12 0 0 0 12-12v-56a12 12 0 0 1 12-12h8" marker-end="url(#gateway-dark-arrow)"/><path class="edge" d="M608 216h72" marker-end="url(#gateway-dark-arrow)"/><path class="edge" d="M608 240h40a12 12 0 0 1 12 12v88a12 12 0 0 0 12 12h8" marker-end="url(#gateway-dark-arrow)"/>
  <path class="edge" d="M944 112h80v312H816v24" marker-end="url(#gateway-arrow)"/><path class="edge" d="M944 232h80"/><path class="edge" d="M944 352h80"/>
  <rect x="688" y="448" width="256" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/><text class="kind" x="708" y="473">EVALUATION GATE</text><text class="name" x="708" y="498">Compare every route</text>
  <defs><marker id="gateway-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker></defs>
</svg>
