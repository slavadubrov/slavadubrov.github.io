<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-dark-title rag-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rag-dark-title">RAG ingestion, serving, and evaluation paths</title>
  <desc id="rag-dark-desc">A versioned source is parsed and embedded into a vector index. At serving time, a tenant query is authorized and retrieves ranked evidence. Retrieval quality is checked before context assembly and generation; answer quality is checked separately.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="488" rx="14" fill="#0C1210"/><text class="kind" x="48" y="44">INGESTION — BUILD A VERSIONED DATA PRODUCT</text>
  <rect class="store" x="48" y="72" width="232" height="96" rx="10"/><text class="kind" x="68" y="106">SOURCE</text><text class="name" x="68" y="134">Snapshot + ACL state</text>
  <rect class="box" x="320" y="72" width="232" height="96" rx="10"/><text class="kind" x="340" y="106">PIPELINE</text><text class="name" x="340" y="134">Parse + chunk + embed</text>
  <rect class="store" x="592" y="72" width="232" height="96" rx="10"/><text class="kind" x="612" y="106">INDEX</text><text class="name" x="612" y="134">Versioned vectors</text>
  <path class="edge" d="M280 120h32" marker-end="url(#rag-dark-arrow)"/><path class="edge" d="M552 120h32" marker-end="url(#rag-dark-arrow)"/>
  <text class="kind" x="48" y="228">SERVING — EVALUATE RETRIEVAL BEFORE GENERATION</text>
  <rect class="box" x="48" y="256" width="192" height="96" rx="10"/><text class="kind" x="68" y="290">REQUEST</text><text class="name" x="68" y="318">Query + tenant</text>
  <rect class="box" x="280" y="256" width="232" height="96" rx="10"/><text class="kind" x="300" y="290">RETRIEVAL</text><text class="name" x="300" y="318">Authorize + rank</text>
  <rect x="552" y="256" width="208" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="572" y="290" fill="#FF6FB6">RETRIEVAL GATE</text><text class="name" x="572" y="318" fill="#FF6FB6">Evidence is usable?</text>
  <rect class="box" x="800" y="256" width="272" height="96" rx="10"/><text class="kind" x="820" y="290">GENERATION</text><text class="name" x="820" y="318">Assemble + answer</text>
  <path class="edge" d="M240 304h32" marker-end="url(#rag-dark-arrow)"/><path class="edge" d="M512 304h32" marker-end="url(#rag-dark-arrow)"/><path class="edge" d="M760 304h32" marker-end="url(#rag-dark-arrow)"/>
  <path class="edge" d="M708 168v40H396v40" stroke-dasharray="2 6" marker-end="url(#rag-dark-arrow)"/><rect x="504" y="196" width="168" height="24" rx="6" fill="#0C1210"/><text class="note" x="588" y="213" text-anchor="middle">selected index version</text>
  <rect class="box" x="800" y="384" width="272" height="64" rx="10"/><text class="kind" x="820" y="408">ANSWER GATE</text><text class="note" x="820" y="432">support · citation · task success</text><path class="edge" d="M936 352v24" marker-end="url(#rag-dark-arrow)"/>
  <defs><marker id="rag-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker></defs>
</svg>
