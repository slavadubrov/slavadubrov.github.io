<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 416" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stores-dark-title stores-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="stores-dark-title">Feature stores and vector databases serve different retrieval contracts</title>
  <desc id="stores-dark-desc">A feature store provides structured, point-in-time facts to a prediction model. A vector database stores embeddings built from documents and returns semantically similar evidence to a language-model application. Neither storage system replaces the other.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="416" rx="14" fill="#0C1210"/><text class="kind" x="48" y="44">TWO STORAGE CONTRACTS — STRUCTURED FACTS VS SEMANTIC EVIDENCE</text>
  <rect x="48" y="72" width="496" height="296" rx="12" fill="none" stroke="#2B3B33"/><text class="kind" x="72" y="102">FEATURE STORE</text>
  <rect class="store" x="72" y="128" width="200" height="96" rx="10"/><text class="kind" x="92" y="162">STRUCTURED DATA</text><text class="name" x="92" y="190">Point-in-time facts</text>
  <rect class="box" x="320" y="128" width="200" height="96" rx="10"/><text class="kind" x="340" y="162">PREDICTION</text><text class="name" x="340" y="190">Feature lookup</text><path class="edge" d="M272 176h40" marker-end="url(#stores-dark-arrow)"/>
  <path d="M72 264h448" stroke="#2B3B33"/><text class="note" x="72" y="292">Keyed lookup · temporal consistency · typed columns</text><text class="note" x="72" y="320">Contract: return the correct facts for this entity and time.</text>
  <rect x="576" y="72" width="496" height="296" rx="12" fill="none" stroke="#2B3B33"/><text class="kind" x="600" y="102">VECTOR DATABASE</text>
  <rect class="box" x="600" y="128" width="128" height="96" rx="10"/><text class="kind" x="620" y="162">DOCUMENTS</text><text class="name" x="620" y="190">Embed</text>
  <rect x="768" y="128" width="280" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="788" y="162" fill="#FF6FB6">VECTOR INDEX</text><text class="name" x="788" y="190" fill="#FF6FB6">Similarity retrieval</text><path class="edge" d="M728 176h32" marker-end="url(#stores-dark-arrow)"/>
  <path d="M600 264h448" stroke="#2B3B33"/><text class="note" x="600" y="292">Embedding distance · metadata filters · ranked matches</text><text class="note" x="600" y="320">Contract: return evidence that is semantically close to the query.</text>
  <defs><marker id="stores-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/></marker></defs>
</svg>
