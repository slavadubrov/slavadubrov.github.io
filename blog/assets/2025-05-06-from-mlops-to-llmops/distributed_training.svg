<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="dist-title dist-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="dist-title">Model-parallel training across four GPU workers</title>
  <desc id="dist-desc">One foundation-model revision is partitioned into four sequential layer shards, each assigned to a GPU worker. The workers contribute to a shared gradient synchronization step before the next update.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#F7F7F4"/>
  <text class="kind" x="48" y="44">MODEL PARALLELISM — PARTITION LAYERS, THEN SYNCHRONIZE</text>

  <rect class="store" x="328" y="72" width="304" height="62" rx="10"/>
  <text class="kind" x="348" y="97">MODEL REVISION</text><text class="name" x="348" y="122">Foundation model</text>
  <path class="edge" d="M480 134v32H144v30"/>
  <path class="edge" d="M480 166H368v30"/>
  <path class="edge" d="M480 166h112v30"/>
  <path class="edge" d="M480 166h336v30"/>

  <rect class="box" x="48" y="196" width="192" height="96" rx="10"/>
  <text class="kind" x="68" y="230">GPU WORKER 1</text><text class="name" x="68" y="258">Layers 1–10</text>
  <rect class="box" x="272" y="196" width="192" height="96" rx="10"/>
  <text class="kind" x="292" y="230">GPU WORKER 2</text><text class="name" x="292" y="258">Layers 11–20</text>
  <rect class="box" x="496" y="196" width="192" height="96" rx="10"/>
  <text class="kind" x="516" y="230">GPU WORKER 3</text><text class="name" x="516" y="258">Layers 21–30</text>
  <rect class="box" x="720" y="196" width="192" height="96" rx="10"/>
  <text class="kind" x="740" y="230">GPU WORKER 4</text><text class="name" x="740" y="258">Layers 31–40</text>

  <path class="edge" d="M144 292v32h336"/>
  <path class="edge" d="M368 292v32h112"/>
  <path class="edge" d="M592 292v32H480"/>
  <path class="edge" d="M816 292v32H480"/>
  <path class="edge" d="M480 324v16" marker-end="url(#dist-arrow)"/>
  <rect x="384" y="340" width="192" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="404" y="365" fill="#C50E72">SYNC STEP</text><text class="name" x="404" y="390" fill="#C50E72">Aggregate gradients</text>

  <defs><marker id="dist-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E"/></marker></defs>
</svg>
