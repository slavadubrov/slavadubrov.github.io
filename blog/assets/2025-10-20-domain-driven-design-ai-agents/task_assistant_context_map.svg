<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="cm-title cm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="cm-title">Task assistant context map</title>
  <desc id="cm-desc">The Task Management core domain consumes a date contract from the supporting Scheduling context and publishes a TaskAdded event to the generic Notifications context.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { stroke: #17211B; stroke-width: 1.5; fill: #FFFFFF; }
    .group { stroke: #D8DDD9; stroke-width: 1.5; fill: none; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="400" rx="14" fill="#F7F7F4"/>
  <rect class="group" x="48" y="48" width="240" height="248" rx="12"/>
  <text class="kind" x="68" y="80">SUPPORTING SUBDOMAIN</text>
  <rect class="box" x="64" y="104" width="208" height="96" rx="10"/>
  <text class="kind" x="84" y="136">CONTEXT</text>
  <text class="name" x="84" y="164">Scheduling</text>
  <text class="note" x="64" y="232">calendar · time window</text>
  <text class="note" x="64" y="256">availability</text>
  <rect class="group" x="360" y="48" width="240" height="248" rx="12"/>
  <text class="kind" x="380" y="80">CORE DOMAIN</text>
  <rect x="376" y="104" width="208" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="396" y="136" fill="#C50E72">FOCUS · CONTEXT</text>
  <text class="name" x="396" y="164" fill="#C50E72">Task Management</text>
  <text class="note" x="376" y="232">task · deadline · priority</text>
  <text class="note" x="376" y="256">completion rules</text>
  <rect class="group" x="672" y="48" width="240" height="248" rx="12"/>
  <text class="kind" x="692" y="80">GENERIC SUBDOMAIN</text>
  <rect class="box" x="688" y="104" width="208" height="96" rx="10" fill="#F2F2F5"/>
  <text class="kind" x="708" y="136">CONTEXT</text>
  <text class="name" x="708" y="164">Notifications</text>
  <text class="note" x="688" y="232">email · push</text>
  <text class="note" x="688" y="256">delivery receipt</text>
  <path class="edge" d="M288 152h64" marker-end="url(#cm-arrow)"/>
  <rect x="286" y="116" width="68" height="22" rx="6" fill="#F7F7F4"/>
  <text class="note" x="320" y="132" text-anchor="middle">date contract</text>
  <path class="edge" d="M600 152h64" marker-end="url(#cm-arrow)"/>
  <rect x="598" y="116" width="68" height="22" rx="6" fill="#F7F7F4"/>
  <text class="note" x="632" y="132" text-anchor="middle">TaskAdded</text>
  <text class="note" x="48" y="368">The map describes business relationships—not one agent per box.</text>
  <defs>
    <marker id="cm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
