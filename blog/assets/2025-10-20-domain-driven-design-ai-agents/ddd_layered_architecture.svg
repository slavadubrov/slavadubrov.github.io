<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="la-title la-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="la-title">DDD layers keep the model outside the domain</title>
  <desc id="la-desc">An external language model sends a typed proposal through the interface and application layers. The highlighted domain layer owns invariants, while infrastructure implements persistence ports.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { stroke: #17211B; stroke-width: 1.5; fill: #FFFFFF; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="416" rx="14" fill="#F7F7F4"/>
  <rect x="48" y="144" width="176" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="kind" x="68" y="176">EXTERNAL</text>
  <text class="name" x="68" y="202">Language model</text>
  <text class="note" x="68" y="226">probabilistic proposal</text>
  <path class="edge" d="M224 192h72" marker-end="url(#la-arrow)"/>
  <rect x="230" y="157" width="60" height="22" rx="6" fill="#F7F7F4"/>
  <text class="note" x="260" y="173" text-anchor="middle">typed data</text>
  <rect class="box" x="304" y="40" width="608" height="62" rx="10"/>
  <text class="kind" x="324" y="66">INTERFACE</text>
  <text class="name" x="468" y="68">Tool adapter · API · event consumer</text>
  <rect class="box" x="304" y="120" width="608" height="62" rx="10" fill="#F2F2F5"/>
  <text class="kind" x="324" y="146">APPLICATION</text>
  <text class="name" x="468" y="148">Use case · authorization · transaction</text>
  <rect x="304" y="200" width="608" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="324" y="226" fill="#C50E72">FOCUS · DOMAIN</text>
  <text class="name" x="468" y="228" fill="#C50E72">Aggregate · value object · invariant</text>
  <rect class="box" x="304" y="280" width="608" height="62" rx="10" fill="#F2F2F5"/>
  <text class="kind" x="324" y="306">INFRASTRUCTURE</text>
  <text class="name" x="468" y="308">Repository adapter · database · outbox</text>
  <path class="edge" d="M608 102v10" marker-end="url(#la-arrow)"/>
  <path class="edge" d="M608 182v10" marker-end="url(#la-arrow)"/>
  <path class="edge" d="M608 280v-10" marker-end="url(#la-arrow)"/>
  <text class="note" x="48" y="384">Dependencies point toward domain policy; infrastructure supplies implementations.</text>
  <defs>
    <marker id="la-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
