<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 632" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="stack-title">Where each part of the Engineering the Agentic Stack series sits</title>
  <desc id="stack-desc">A model proposes actions through the Part 1 reasoning loop. The harness assembles context, exposes tools, checks permissions, and evaluates evidence. The runtime executes accepted calls and persists state. Results return to the model for the next turn.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
    .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="1120" height="632" rx="14"/>
  <text class="section" x="48" y="44">ONE TURN — FROM PROPOSAL TO EVIDENCE</text>
  <rect class="process" x="184" y="64" width="752" height="62" rx="10"/><text class="kind" x="208" y="88">MODEL</text><text class="name" x="208" y="111">Propose the next action</text>
  <path class="edge" d="M560 126v32" marker-end="url(#stack-arrow)"/>
  <rect class="focus" x="184" y="168" width="752" height="62" rx="10"/><text class="kind focus-kind" x="208" y="192">FOCUS · PART 1</text><text class="name focus-name" x="208" y="215">Reasoning loop sets proposal order</text>
  <path class="edge" d="M560 230v32" marker-end="url(#stack-arrow)"/><rect class="canvas" x="577" y="240" width="98" height="24" rx="6"/><text class="note" x="626" y="257" text-anchor="middle">proposed call</text>
  <rect class="group" x="48" y="272" width="1024" height="176" rx="12"/><text class="section" x="72" y="300">HARNESS · PARTS 2, 3, 4, 6 — AUTHORIZE ONE TURN</text>
  <rect class="process" x="72" y="320" width="220" height="96" rx="10"/><text class="kind" x="92" y="350">PART 2 · CONTEXT</text><text class="name" x="92" y="378">Assemble memory</text><text class="note" x="92" y="399">recall · documents · handoff</text>
  <rect class="process" x="316" y="320" width="220" height="96" rx="10"/><text class="kind" x="336" y="350">PART 3 · CONTRACT</text><text class="name" x="336" y="378">Expose tools</text><text class="note" x="336" y="399">actions · schemas · results</text>
  <rect class="process" x="560" y="320" width="220" height="96" rx="10"/><text class="kind" x="580" y="350">PART 4 · POLICY</text><text class="name" x="580" y="378">Check permission</text><text class="note" x="580" y="399">allowed · now · unattended</text>
  <rect class="process" x="804" y="320" width="244" height="96" rx="10"/><text class="kind" x="824" y="350">PART 6 · EVIDENCE</text><text class="name" x="824" y="378">Judge completion</text><text class="note" x="824" y="399">accept · retry · hand off</text>
  <path class="edge" d="M292 368h16" marker-end="url(#stack-arrow)"/><path class="edge" d="M536 368h16" marker-end="url(#stack-arrow)"/><path class="edge" d="M780 368h16" marker-end="url(#stack-arrow)"/>
  <path class="edge" d="M560 448v32" marker-end="url(#stack-arrow)"/><rect class="canvas" x="577" y="458" width="94" height="24" rx="6"/><text class="note" x="624" y="475" text-anchor="middle">accepted call</text>
  <rect class="store" x="184" y="490" width="752" height="96" rx="10"/><text class="kind" x="208" y="520">PART 5 · RUNTIME STORE</text><text class="name" x="208" y="548">Execute and persist outside the worker</text><text class="note" x="208" y="569">session log · sandbox · checkpoint · trace</text>
  <path class="edge" d="M184 538H48a24 24 0 0 1-24-24V95a24 24 0 0 1 24-24h128" marker-end="url(#stack-arrow)"/><text class="note" x="16" y="300" text-anchor="middle" transform="rotate(-90 16 300)">results become context for the next turn</text>
  <text class="note" x="48" y="614">The loop chooses what to propose. The harness authorizes it. The runtime executes it.</text>
  <defs><marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z"/></marker></defs>
</svg>
