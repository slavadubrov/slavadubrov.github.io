<path d="M32 536h656" stroke="#2B3B33" stroke-width="1"/>
<text x="32" y="562" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">An optional replanner can revise later steps when new evidence changes the task.</text>
</svg>
