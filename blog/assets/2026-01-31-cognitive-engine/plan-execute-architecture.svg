<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">A router sends a market question into one of two reasoning loops that write to the same typed state.</title><desc id="planexecarch-desc">A router classifies a market question as deep research or flash briefing. Deep research runs Plan-and-Execute: a planner writes 4-6 steps, an executor runs each as a ReAct loop, and a reporter drafts the report. Flash briefing runs ReWOO: a planner writes a tool dependency graph, a worker runs it, and a solver synthesizes one result. The reporter and the ReWOO solver both write into one shared typed state object, though only the deep-research route passes through the reporter — the ReWOO solver writes state directly.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="planexecarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="planexecarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="1080" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">One router, two reasoning loops, one state</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The ReWOO solver writes state directly; only deep research passes through a reporter.</text>
