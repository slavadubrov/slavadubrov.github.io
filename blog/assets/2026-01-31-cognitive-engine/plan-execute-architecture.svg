<text x="32" y="1026" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The state schema does not fork per pattern — routing is conversion code, not three separate schemas.</text>
<text x="32" y="1048" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A fresh-context evaluator and a human approval gate sit downstream of both routes, omitted here to keep the two loops legible.</text>
