<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 576" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="arch-title arch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="arch-title">Market Analyst Agent routes one request into two reasoning loops with shared state</title>
  <desc id="arch-desc">A router sends deep research to a planner and ReAct executor, or a flash briefing to a ReWOO planner, worker, and solver. Both routes converge on the reporter and update the same typed agent state.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; } .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; } .decision { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .async { stroke-dasharray: 2 6; } .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="1120" height="576" rx="14"/><text class="section" x="48" y="44">ONE LANGGRAPH · TWO ROUTABLE MODES · ONE STATE SCHEMA</text>
  <rect class="external" x="48" y="88" width="176" height="62" rx="10"/><text class="kind" x="68" y="112">EXTERNAL · REQUEST</text><text class="name" x="68" y="136">Market question</text>
  <path class="edge" d="M224 119h40" marker-end="url(#arch-arrow)"/>
  <path class="decision" d="M328 71 400 119 328 167 256 119Z"/><text class="kind" x="328" y="110" text-anchor="middle">ROUTER</text><text class="name" x="328" y="134" text-anchor="middle">which loop?</text>
  <rect class="group" x="432" y="64" width="640" height="176" rx="12"/><text class="section" x="456" y="92">DEEP RESEARCH · PLAN-AND-EXECUTE</text>
  <rect class="process" x="456" y="112" width="176" height="96" rx="10"/><text class="kind" x="476" y="146">MODEL · PLANNER</text><text class="name" x="476" y="174">Write research plan</text><text class="note" x="476" y="193">4–6 ordered steps</text>
  <rect class="process" x="664" y="112" width="176" height="96" rx="10"/><text class="kind" x="684" y="146">PROCESS · EXECUTOR</text><text class="name" x="684" y="174">Run step loop</text><text class="note" x="684" y="193">ReAct per step</text>
  <path class="edge conditional" d="M378 103 448 144" marker-end="url(#arch-arrow)"/><rect class="canvas" x="390" y="107" width="52" height="24" rx="6"/><text class="note" x="416" y="124" text-anchor="middle">deep</text><path class="edge" d="M632 160h32" marker-end="url(#arch-arrow)"/>
  <rect class="group" x="432" y="272" width="640" height="176" rx="12"/><text class="section" x="456" y="300">FLASH BRIEFING · REWOO</text>
  <rect class="process" x="456" y="320" width="176" height="96" rx="10"/><text class="kind" x="476" y="354">MODEL · PLANNER</text><text class="name" x="476" y="382">Write tool graph</text><text class="note" x="476" y="401">#E1 · #E2 · dependencies</text>
  <rect class="process" x="664" y="320" width="176" height="96" rx="10"/><text class="kind" x="684" y="354">PROCESS · WORKER</text><text class="name" x="684" y="382">Run graph</text><text class="note" x="684" y="401">parallel when free</text>
  <rect class="process" x="872" y="320" width="176" height="96" rx="10"/><text class="kind" x="892" y="354">MODEL · SOLVER</text><text class="name" x="892" y="382">Synthesize result</text><text class="note" x="892" y="401">one final call</text>
  <path class="edge conditional" d="M328 167v201h120" marker-end="url(#arch-arrow)"/><rect class="canvas" x="341" y="252" width="54" height="24" rx="6"/><text class="note" x="368" y="269" text-anchor="middle">flash</text><path class="edge" d="M632 368h32" marker-end="url(#arch-arrow)"/><path class="edge" d="M840 368h32" marker-end="url(#arch-arrow)"/>
  <rect class="process" x="872" y="112" width="176" height="96" rx="10"/><text class="kind" x="892" y="146">PROCESS · REPORTER</text><text class="name" x="892" y="174">Draft report</text><text class="note" x="892" y="193">shared output path</text>
  <path class="edge" d="M840 160h32" marker-end="url(#arch-arrow)"/><path class="edge" d="M960 320V216" marker-end="url(#arch-arrow)"/>
  <rect class="focus" x="256" y="480" width="792" height="62" rx="10"/><text class="kind focus-kind" x="280" y="504">FOCUS · SHARED TYPED STATE</text><text class="name focus-name" x="280" y="528">messages · execution_mode · plan · rewoo_plan · research_data · draft_report</text>
  <path class="edge async" d="M544 416v56" marker-end="url(#arch-arrow)"/><path class="edge async" d="M752 416v56" marker-end="url(#arch-arrow)"/><path class="edge async" d="M972 208v264" marker-end="url(#arch-arrow)"/>
  <defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z"/></marker></defs>
</svg>
