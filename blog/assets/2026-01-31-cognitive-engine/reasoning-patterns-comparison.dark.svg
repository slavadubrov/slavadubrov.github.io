<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="reasoncompare-title reasoncompare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reasoncompare-title">ReAct, ReWOO, and Plan-and-Execute call the same tools but commit to a plan at different points.</title><desc id="reasoncompare-desc">Three lanes compare control flow and plan timing. ReAct chooses after every observation, the highest adaptability with repeated model calls. ReWOO fixes the full dependency graph before execution, the lowest adaptability with the fewest calls. Plan-and-Execute fixes an overall plan but can revise it at step checkpoints, a medium adaptability with more state to track. Only the commitment point differs: ReAct can change direction after every result, ReWOO only through fallback logic, and Plan-and-Execute at step checkpoints.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reasoncompare-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="reasoncompare-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="680" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Same tools, different commitment point</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">All three call the same tools; only when the plan can change differs.</text>
