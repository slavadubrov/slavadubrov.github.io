<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rewoo-title rewoo-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rewoo-title">ReWOO plans the dependency graph before tools run</title>
  <desc id="rewoo-desc">One planner call creates a complete tool dependency graph. A non-model worker runs independent calls E1 and E2 in parallel, then dependent call E3. One solver call synthesizes all results.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; stroke-dasharray: 6 5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .async { stroke-dasharray: 2 6; } .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="960" height="464" rx="14"/><text class="note" x="48" y="42">Reasoning happens before execution; workers fill placeholders without calling the model.</text>
  <rect class="focus" x="48" y="72" width="240" height="96" rx="10"/><text class="kind focus-kind" x="68" y="106">FOCUS · PLANNER</text><text class="name focus-name" x="68" y="134">Write full graph</text><text class="note" x="68" y="153">one LLM call · #E1, #E2, #E3</text>
  <path class="edge" d="M288 120h56v72" marker-end="url(#rewoo-arrow)"/>
  <rect class="group" x="344" y="72" width="568" height="232" rx="12"/><text class="kind" x="368" y="100">WORKER · NON-LLM EXECUTOR</text>
  <rect class="process" x="368" y="120" width="160" height="62" rx="10"/><text class="kind" x="388" y="144">TOOL · #E1</text><text class="name" x="388" y="168">Price data</text>
  <rect class="process" x="728" y="120" width="160" height="62" rx="10"/><text class="kind" x="748" y="144">TOOL · #E2</text><text class="name" x="748" y="168">Recent news</text>
  <rect class="store" x="548" y="218" width="160" height="62" rx="10"/><text class="kind" x="568" y="242">TOOL · #E3</text><text class="name" x="568" y="266">Compare #E1, #E2</text>
  <path class="edge async" d="M448 182v24a16 16 0 0 0 16 16h76" marker-end="url(#rewoo-arrow)"/><path class="edge async" d="M808 182v24a16 16 0 0 1-16 16h-76" marker-end="url(#rewoo-arrow)"/>
  <path class="edge" d="M628 280v52" marker-end="url(#rewoo-arrow)"/>
  <rect class="process" x="508" y="340" width="240" height="96" rx="10"/><text class="kind" x="528" y="374">MODEL · SOLVER</text><text class="name" x="528" y="402">Synthesize results</text><text class="note" x="528" y="421">one final LLM call</text>
  <text class="note" x="48" y="350">Fast when the graph stays valid.</text><text class="note" x="48" y="374">Brittle when a tool changes the plan.</text>
  <defs><marker id="rewoo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z"/></marker></defs>
</svg>
