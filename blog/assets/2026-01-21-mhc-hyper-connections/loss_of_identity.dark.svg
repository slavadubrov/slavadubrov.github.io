<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Composite residual-map behavior</title>
  <desc id="desc">Unconstrained residual maps may amplify or attenuate aligned directions. mHC instead targets non-identity doubly stochastic mixing, which preserves the stream mean and is non-expansive.</desc>
