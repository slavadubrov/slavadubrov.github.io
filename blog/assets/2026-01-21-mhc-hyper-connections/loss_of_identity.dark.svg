      <!-- Row 1 -->
      <text x="40" y="65" text-anchor="middle" fill="#EDF5F0" font-weight="700">-5.2</text>
      <text x="106" y="65" text-anchor="middle" fill="#EDF5F0" font-weight="700">14.1</text>
      <text x="173" y="65" text-anchor="middle" fill="#EDF5F0">0.01</text>
