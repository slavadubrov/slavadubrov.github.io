      <text x="106" y="185" text-anchor="middle" fill="#EDF5F0">3.4</text>
      <text x="173" y="185" text-anchor="middle" fill="#EDF5F0" font-weight="700">11.1</text>
      <text x="240" y="185" text-anchor="middle" fill="#EDF5F0" font-weight="700">-0.03</text>
    </g>

    <!-- Signal Particle Entering and Exploding/Scattering -->
    <!-- Input stream -->

    <!-- Output explosion (multiple glowing red particles bursting downwards/outwards) -->
    <g>

    </g>

