    <rect x="-10" y="285" width="300" height="45" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
    <text x="140" y="313" text-anchor="middle" fill="#EDF5F0" font-size="16" font-weight="800">Result: gain can be unbounded</text>

  </g>

  <!-- CENTER: The core question connecting the two concepts -->
  <g transform="translate(420, 220)">
