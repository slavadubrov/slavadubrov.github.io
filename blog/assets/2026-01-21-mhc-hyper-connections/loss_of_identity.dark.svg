  <text x="40" y="50" font-size="28" font-weight="800" fill="#EDF5F0">The Root Cause: Loss of Identity</text>
  <text x="40" y="80" font-size="16" fill="#EDF5F0">Unconstrained map products can amplify or attenuate signals.</text>

  <!-- LEFT SIDE: Unconstrained (Exploding) -->
  <g transform="translate(60, 130)">

