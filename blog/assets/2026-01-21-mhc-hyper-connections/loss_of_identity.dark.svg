      <text x="106" y="185" text-anchor="middle" fill="#EDF5F0">.15</text>
      <text x="173" y="185" text-anchor="middle" fill="#EDF5F0">.10</text>
      <text x="240" y="185" text-anchor="middle" fill="#EDF5F0" font-weight="800">.55</text>
    </g>

    <!-- Signal Particle Entering and Safely Exiting -->

    <!-- Output safe steady stream -->
    <g>

    </g>

    <!-- Downward Arrow indicating stable flow -->
    <path d="M 140 215 L 140 270" stroke="#A8B8AF" stroke-width="4" marker-end="url(#arrowEmerald)" fill="none"/>

    <!-- Outcome Box -->
    <rect x="-30" y="285" width="340" height="45" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
    <text x="140" y="313" text-anchor="middle" fill="#EDF5F0" font-size="16" font-weight="800">Result: mean preserved; gain ≤ 1</text>

  </g>

  <!-- Bottom Final Takeaway Banner -->
  <rect x="90" y="470" width="820" height="40" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
  <text x="500" y="495" text-anchor="middle" fill="#EDF5F0" font-size="15" font-weight="600">Identity is the residual baseline; mHC instead permits stable inter-stream mixing.</text>

  <style data-visual-system="byte-diagram-v1">
