<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #F7F7F4; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Hyper-Connections paper result</title>
  <desc id="desc">A schematic of the paper-reported 1.8 times faster convergence for its OLMoE-1B-7B DHC times four configuration.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Marker for arrow -->
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5"/>
    </marker>

    <!-- Shadows -->


    <!-- Glows for animated particles -->


  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="600" fill="#F7F7F4"/>

  <!-- Background grid layer -->
  <rect width="1000" height="600" fill="#F7F7F4"/>

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#17211B">The Performance Promise</text>
  <text x="40" y="80" font-size="16" fill="#17211B">Source: Hyper-Connections (2024)</text>

  <!-- Left Side: Plot Area -->
  <g transform="translate(60, 140)">

    <!-- Plot Background -->
    <rect x="0" y="0" width="460" height="380" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="1.5" class="visual-focus"/>

    <text x="240" y="28" text-anchor="middle" fill="#17211B" font-size="13" font-weight="600">Validation metric (paper schematic)</text>

    <!-- Y-axis lines and ticks -->
    <g stroke="#59645E" stroke-width="1.5" fill="none">
      <line x1="60" y1="50" x2="420" y2="50"/>
      <line x1="60" y1="120" x2="420" y2="120"/>
      <line x1="60" y1="190" x2="420" y2="190"/>
      <line x1="60" y1="260" x2="420" y2="260"/>
    </g>

    <!-- Base X and Y axis lines drawn thicker -->
    <path d="M 60 40 L 60 330 L 430 330" fill="none" stroke="#17211B" stroke-width="2"/>

    <!-- X-axis label -->
    <text x="240" y="370" text-anchor="middle" fill="#17211B" font-size="14" font-weight="600">Training Steps</text>

    <!-- SVG paths for the curves -->
    <!-- ResNet Line -->
    <path id="pathResNetFast" d="M 60 320 Q 120 280 180 230 Q 240 180 300 150 Q 360 130 420 120" fill="none" stroke="#59645E" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Hyper-Connections Line -->
    <path id="pathHCFast" d="M 60 320 Q 90 240 135 170 Q 180 110 240 85 Q 310 70 420 65" fill="none" stroke="#17211B" stroke-width="3"/>

    <!-- HC Curve Annotation -->
    <rect x="290" y="35" width="135" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/>
    <text x="357" y="53" text-anchor="middle" fill="#17211B" font-size="13" font-weight="700">Hyper-Connections</text>

    <!-- ResNet Curve Annotation (Hidden) -->
    <!-- <rect x="290" y="145" width="130" height="26" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5"/> -->
    <!-- <text x="355" y="163" text-anchor="middle" fill="#17211B" font-size="13" font-weight="700">Baseline ResNet</text> -->

    <!-- Gap Arrow "1.8x Faster" -->
    <!-- Drawing arrow between early parts of the convergence to show the speed gap -->
    <line x1="220" y1="95" x2="220" y2="200" stroke="#59645E" stroke-width="2"/>
    <polygon points="220,95 215,105 225,105" fill="#F2F2F5"/>
    <polygon points="220,200 215,190 225,190" fill="#F2F2F5"/>

    <rect x="115" y="130" width="95" height="40" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5"/>
    <text x="162" y="146" text-anchor="middle" fill="#17211B" font-size="13" font-weight="800">1.8× in this run</text>
    <text x="162" y="162" text-anchor="middle" fill="#17211B" font-size="11" font-weight="600">Convergence</text>

    <!-- Animated Particles Tracing Curves -->

    <!-- HC particle is significantly faster (dur=2.2s vs 4.0s) -->

  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(560, 140)">

    <!-- Title Card -->
    <rect x="0" y="0" width="400" height="240" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="1.5"/>
    <text x="200" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="#17211B">Static vs Dynamic Mappings</text>
    <line x1="20" y1="50" x2="380" y2="50" stroke="#D8DDD9" stroke-width="2"/>

    <!-- Static Explanation -->
    <g transform="translate(20, 75)">
      <text x="0" y="0" font-size="15" font-weight="700" fill="#17211B">Static (Standard ResNet):</text>
      <text x="0" y="24" font-size="14" fill="#17211B">The residual shortcut coefficient is fixed at one.</text>
      <text x="0" y="46" font-size="14" fill="#17211B">The shortcut topology does not depend on the input.</text>
    </g>

    <!-- Dynamic Explanation -->
    <g transform="translate(20, 155)">
      <text x="0" y="0" font-size="15" font-weight="700" fill="#17211B">Dynamic (Hyper-Connections):</text>
      <text x="0" y="24" font-size="14" fill="#17211B">Weights are conditioned on the input feature vector.</text>
      <text x="0" y="46" font-size="14" fill="#17211B">Dynamic HC can condition its read, write, and residual</text>
      <text x="0" y="68" font-size="14" fill="#17211B">maps on the current input.</text>
    </g>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
