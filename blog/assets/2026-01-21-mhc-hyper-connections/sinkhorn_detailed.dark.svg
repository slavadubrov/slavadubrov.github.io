<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Sinkhorn-Knopp projection used by mHC</title>
  <desc id="desc">Raw logits are exponentiated, then columns and rows are normalized repeatedly. The paper uses 20 iterations to obtain an approximate doubly stochastic matrix.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <!-- Default Orange Arrow -->
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621"/>
    </marker>

    <!-- Shadow -->

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1050" height="480" fill="#0C1210"/>

  <!-- Background grid layer -->
  <rect width="1050" height="480" fill="#0C1210"/>

  <!-- Top Title -->
  <text x="525" y="45" text-anchor="middle" font-size="28" font-weight="800" fill="#EDF5F0">Implementing the Fix: The Sinkhorn Algorithm</text>
  <text x="525" y="75" text-anchor="middle" font-size="16" fill="#EDF5F0">Alternating column and row normalization for an approximate projection.</text>

  <!-- ========================================== -->
  <!-- Step 1: Raw Matrix                         -->
  <!-- ========================================== -->
  <g transform="translate(15, 140)">
    <rect x="0" y="0" width="140" height="140" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2.5"/>
    <text x="70" y="-12" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">Raw Matrix</text>

    <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#A8B8AF" text-anchor="middle">
      <text x="25" y="40" fill="#EDF5F0" font-weight="700">-0.5</text> <text x="70" y="40">2.1</text> <text x="115" y="40">0.8</text>
      <text x="25" y="80">1.3</text> <text x="70" y="80" fill="#EDF5F0" font-weight="700">-4.0</text> <text x="115" y="80">1.9</text>
      <text x="25" y="120">0.1</text> <text x="70" y="120">0.6</text> <text x="115" y="120" fill="#EDF5F0" font-weight="700">-0.2</text>
    </g>
  </g>

  <!-- Arrow 1: Exp() -->
  <g transform="translate(165, 210)">
    <rect x="0" y="-15" width="60" height="30" rx="15" fill="#1B2621"/>
    <text x="30" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Exp()</text>
    <line x1="60" y1="0" x2="72" y2="0" stroke="#A8B8AF" stroke-width="3" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- ========================================== -->
  <!-- Step 2: Positivity                         -->
  <!-- ========================================== -->
  <g transform="translate(245, 140)">
    <rect x="0" y="0" width="140" height="140" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2.5"/>
    <text x="70" y="-12" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">Positivity</text>

    <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#A8B8AF" text-anchor="middle">
      <text x="25" y="40">0.61</text>  <text x="70" y="40">8.17</text>  <text x="115" y="40">2.23</text>
      <text x="25" y="80">3.67</text>  <text x="70" y="80">0.02</text>  <text x="115" y="80">6.69</text>
      <text x="25" y="120">1.11</text> <text x="70" y="120">1.82</text> <text x="115" y="120">0.82</text>
    </g>

    <g font-size="12" font-weight="800" fill="#A8B8AF" text-anchor="start">
      <text x="145" y="40">Σ=11.00</text>
      <text x="145" y="80">Σ=10.37</text>
      <text x="145" y="120">Σ=3.75</text>
    </g>
  </g>

  <!-- Arrow 2: Normalize Columns -->
  <g transform="translate(445, 210)">
    <rect x="-5" y="-20" width="80" height="40" rx="20" fill="#1B2621" class="visual-focus"/>
    <text x="35" y="-3" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Normalize</text>
    <text x="35" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Columns</text>
    <line x1="75" y1="0" x2="87" y2="0" stroke="#A8B8AF" stroke-width="3" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- ========================================== -->
  <!-- Step 3: Column Normalized                  -->
  <!-- ========================================== -->
  <g transform="translate(540, 140)">
    <rect x="0" y="0" width="140" height="140" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2.5"/>
    <text x="70" y="-12" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">Column Normalized</text>

    <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#A8B8AF" text-anchor="middle">
      <text x="25" y="40">0.113</text> <text x="70" y="40">0.816</text> <text x="115" y="40">0.229</text>
      <text x="25" y="80">0.682</text> <text x="70" y="80">0.002</text> <text x="115" y="80">0.687</text>
      <text x="25" y="120">0.205</text> <text x="70" y="120">0.182</text> <text x="115" y="120">0.084</text>
    </g>

    <!-- Row sums OUTSIDE box -->
    <g font-size="12" font-weight="800" fill="#A8B8AF" text-anchor="start">
      <text x="145" y="40">Σ=1.16</text>
      <text x="145" y="80">Σ=1.37</text>
      <text x="145" y="120">Σ=.47</text>
    </g>

    <!-- Column sums BELOW box -->
    <g font-size="11" font-weight="800" fill="#A8B8AF" text-anchor="middle">
      <text x="25" y="160">Σ=1.0</text>
      <text x="70" y="160">Σ=1.0</text>
      <text x="115" y="160">Σ=1.0</text>
    </g>
  </g>

  <!-- Arrow 3: Normalize Rows -->
  <g transform="translate(740, 210)">
    <rect x="-5" y="-20" width="80" height="40" rx="20" fill="#1B2621"/>
    <text x="35" y="-3" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Normalize</text>
    <text x="35" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Rows</text>
    <line x1="75" y1="0" x2="87" y2="0" stroke="#A8B8AF" stroke-width="3" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- ========================================== -->
  <!-- Step 4: Doubly Stochastic Matrix           -->
  <!-- ========================================== -->
  <g transform="translate(835, 140)">
    <rect x="0" y="0" width="140" height="140" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="3"/>
    <text x="70" y="-12" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">After one iteration</text>

    <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#A8B8AF" font-weight="700" text-anchor="middle">
      <text x="25" y="40">0.097</text> <text x="70" y="40">0.705</text> <text x="115" y="40">0.198</text>
      <text x="25" y="80">0.497</text> <text x="70" y="80">0.001</text> <text x="115" y="80">0.501</text>
      <text x="25" y="120">0.435</text> <text x="70" y="120">0.386</text> <text x="115" y="120">0.178</text>
    </g>

    <!-- Final Row sums OUTSIDE box -->
    <g font-size="12" font-weight="800" fill="#A8B8AF" text-anchor="start">
      <text x="145" y="40">→ 1.0</text>
      <text x="145" y="80">→ 1.0</text>
      <text x="145" y="120">→ 1.0</text>
    </g>

    <!-- Final Column sums BELOW box -->
    <g font-size="12" font-weight="800" fill="#A8B8AF" text-anchor="middle">
      <text x="25" y="160">↓ 1.03</text>
      <text x="70" y="160">↓ 1.09</text>
      <text x="115" y="160">↓ .88</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- Iteration Loop                             -->
  <!-- ========================================== -->
  <!-- Starts below Box 4 (x=905, y=320) and loops to Arrow 2 (x=480, y=240) -->
  <path d="M 905 320 Q 905 375 690 375 Q 480 375 480 245" fill="none" stroke="#A8B8AF" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#arrowOrange)"/>

  <g transform="translate(690, 375)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#EDF5F0">Repeat 20 times (approximate)</text>
  </g>

  <!-- ========================================== -->
  <!-- Bottom Explanation Card                    -->
  <!-- ========================================== -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="950" height="44" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
    <text x="475" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">The paper fuses this loop and recomputes its backward intermediates in a custom kernel.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
