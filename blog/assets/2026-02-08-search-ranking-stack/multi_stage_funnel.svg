<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Multi-stage ranking funnel</title>
  <desc id="desc">A conceptual funnel from corpus retrieval through pre-ranking, full ranking, and final blending, with a measurement for each exit.</desc>
  <defs>
    <marker id="arrowFunnel" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FFFFFF"/>
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="520" fill="#F7F7F4"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B">The Multi-Stage Ranking Funnel</text>

  <!-- Corpus -->
  <rect x="200" y="55" width="400" height="52" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5"/>
  <text x="400" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#17211B">Full Corpus</text>
  <text x="400" y="95" text-anchor="middle" font-size="11" fill="#17211B">Size depends on the product and index</text>

  <!-- Arrow -->
  <line x1="400" y1="107" x2="400" y2="130" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowFunnel)"/>

  <!-- Stage 1: Retrieval -->
  <rect x="160" y="133" width="480" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus"/>
  <text x="180" y="155" font-size="11" font-weight="700" fill="#17211B">STAGE 1: RETRIEVAL</text>
  <text x="180" y="172" font-size="12" font-weight="600" fill="#17211B">BM25 + Dense Bi-Encoder + Hybrid RRF Fusion</text>
  <text x="180" y="190" font-size="11" fill="#17211B">Exit: recall at the candidate cutoff</text>
  <text x="590" y="172" text-anchor="end" font-size="16" font-weight="700" fill="#17211B">Broad set</text>
  <text x="590" y="190" text-anchor="end" font-size="11" fill="#17211B">benchmark cutoff</text>

  <!-- Arrow -->
  <line x1="400" y1="208" x2="400" y2="231" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowFunnel)"/>
  <text x="416" y="224" font-size="11" fill="#17211B">candidate count decreases</text>

  <!-- Stage 2: Pre-Ranking -->
  <rect x="180" y="234" width="440" height="68" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5"/>
  <text x="200" y="256" font-size="11" font-weight="700" fill="#17211B">STAGE 2: PRE-RANKING</text>
  <text x="200" y="273" font-size="12" font-weight="600" fill="#17211B">Two-Tower Models + Interaction Features</text>
  <text x="200" y="289" font-size="11" fill="#17211B">Exit: recall retained per millisecond</text>
  <text x="575" y="273" text-anchor="end" font-size="16" font-weight="700" fill="#17211B">Filtered set</text>
  <text x="575" y="289" text-anchor="end" font-size="11" fill="#17211B">optional stage</text>

  <!-- Arrow -->
  <line x1="400" y1="302" x2="400" y2="325" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowFunnel)"/>
  <text x="416" y="318" font-size="11" fill="#17211B">shortlist</text>

  <!-- Stage 3: Full Ranking -->
  <rect x="200" y="328" width="400" height="68" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/>
  <text x="220" y="350" font-size="11" font-weight="700" fill="#17211B">STAGE 3: FULL RANKING</text>
  <text x="220" y="367" font-size="12" font-weight="600" fill="#17211B">Cross-Encoders + LLM Rerankers</text>
  <text x="220" y="383" font-size="11" fill="#17211B">Exit: NDCG/MRR, latency, and cost</text>
  <text x="560" y="367" text-anchor="end" font-size="16" font-weight="700" fill="#17211B">Shortlist</text>
  <text x="560" y="383" text-anchor="end" font-size="11" fill="#17211B">measured limit</text>

  <!-- Arrow -->
  <line x1="400" y1="396" x2="400" y2="419" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowFunnel)"/>

  <!-- Stage 4: Blending -->
  <rect x="240" y="422" width="320" height="68" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/>
  <text x="260" y="444" font-size="11" font-weight="700" fill="#17211B">STAGE 4: BLENDING</text>
  <text x="260" y="461" font-size="12" font-weight="600" fill="#17211B">Diversity + Business Rules</text>
  <text x="260" y="477" font-size="11" fill="#17211B">Exit: policy and diversity guardrails</text>

  <!-- Cost gradient label on right -->
  <text x="690" y="145" font-size="11" fill="#17211B" text-anchor="start">Low cost</text>
  <text x="690" y="160" font-size="11" fill="#17211B" text-anchor="start">High speed</text>
  <line x1="680" y1="140" x2="680" y2="385" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="690" y="380" font-size="11" fill="#17211B" text-anchor="start">High cost</text>
  <text x="690" y="395" font-size="11" fill="#17211B" text-anchor="start">High precision</text>
  <!-- Arrow for gradient -->
  <line x1="680" y1="165" x2="680" y2="370" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowFunnel)"/>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
