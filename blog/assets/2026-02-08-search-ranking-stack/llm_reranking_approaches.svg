<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="llmrerank-title llmrerank-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="llmrerank-title">Pointwise versus listwise LLM reranking</title><desc id="llmrerank-desc">Pointwise scoring calls the LLM once per document and sorts by score afterward, with no comparative context between candidates. Listwise ranking makes one call with all candidates and asks for an ordering directly, which needs more context but sees candidates together.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="llmrerank-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="llmrerank-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="680" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Score each document alone, or rank them together</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The demo uses listwise ranking, inspired by RankGPT.</text>
<rect x="32" y="128" width="312" height="424" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1"/>
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">POINTWISE SCORING</text>
<rect x="376" y="128" width="312" height="424" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1"/>
<text x="392" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">LISTWISE RANKING</text>
<path d="M58 172h260a10 10 0 0 1 10 10v44a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-44a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 172h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">LLM CALL 1</text><text x="62" y="223" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Doc A → 0.8</text>
<path d="M188 236v10" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  />
<path d="M58 246h260a10 10 0 0 1 10 10v44a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-44a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 246h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="263.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">LLM CALL 2</text><text x="62" y="297" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Doc B → 0.3</text>
<path d="M188 310v10" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  />
<path d="M58 320h260a10 10 0 0 1 10 10v44a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-44a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 320h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="337.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">LLM CALL 3</text><text x="62" y="371" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Doc C → 0.9</text>
<path d="M188 384v16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#llmrerank-arrow-flow)"/>
<path d="M58 400h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 400h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5"/><text x="188" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">SORT BY SCORE</text><text x="188" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">C &gt; A &gt; B</text>
<text x="48" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">+ Parallelizable, simple to run</text>
<text x="48" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">− No comparative context between candidates</text>
<path d="M410 172h244a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-244a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M410 172h244a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-264a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · ONE CALL</text><text x="414" y="233" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">All docs, one prompt</text><text x="414" y="255" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Sees every candidate together</text>
<path d="M532 276v124" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#llmrerank-arrow-flow)"/>
<path d="M410 400h244a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-244a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M410 400h244a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-264a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5"/><text x="532" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">MODEL RETURNS ORDER</text><text x="532" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B" text-anchor="middle">[3], [1], [2] → C, A, B</text>
<text x="400" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">+ Sees relative order in one call</text>
<text x="400" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">− Context-window limits, position bias</text>
<path d="M32 588h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="614" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The demo's parser accepts incomplete or duplicate identifiers, so treat the listwise result as</text>
<text x="32" y="636" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">illustrative rather than a validated ranking.</text>
</svg>
