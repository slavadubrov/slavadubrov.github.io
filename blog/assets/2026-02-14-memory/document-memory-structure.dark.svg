<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">README.md explains the directory to a person; PROGRESS.md hands unfinished work to the next model session.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Git records every change the agent makes here — a bad learning is one revert away from gone.</text>
