<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">Redis and PostgreSQL checkpoint backends compared</title>
  <desc id="rp-desc">An aligned comparison of Redis and PostgreSQL across access pattern, durability, history, query model, and operational fit. PostgreSQL is highlighted as the durable default; Redis keeps recoverable session state in memory.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .rule { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4"/>

  <rect class="group" x="48" y="48" width="416" height="432" rx="12"/>
  <rect class="group" x="496" y="48" width="416" height="432" rx="12"/>

  <rect class="store" x="72" y="72" width="368" height="96" rx="10"/>
  <text class="kind" x="92" y="106">STORE · LATENCY FIRST</text>
  <text class="name" x="92" y="136">Redis checkpoint saver</text>
  <text class="note" x="92" y="156">Choose when resume latency is the bottleneck.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10"/>
  <text class="kind focus-text" x="540" y="106">FOCUS · DURABLE DEFAULT</text>
  <text class="name focus-text" x="540" y="136">PostgreSQL checkpoint saver</text>
  <text class="note" x="540" y="156">Choose when losing completed work is unacceptable.</text>

  <text class="kind" x="72" y="206">ACCESS PATTERN</text>
  <text class="value" x="72" y="230">In-memory state</text>
  <text class="note" x="72" y="250">measure the checkpoint path in your workload</text>
  <text class="kind" x="520" y="206">ACCESS PATTERN</text>
  <text class="value" x="520" y="230">Database-backed state</text>
  <text class="note" x="520" y="250">measure the checkpoint path in your workload</text>
  <path class="rule" d="M72 268h368M520 268h368"/>

  <text class="kind" x="72" y="294">DURABILITY</text>
  <text class="value" x="72" y="318">Configured with AOF or RDB</text>
  <text class="note" x="72" y="338">recent writes can be lost or evicted</text>
  <text class="kind" x="520" y="294">DURABILITY</text>
  <text class="value" x="520" y="318">ACID transactions and WAL</text>
  <text class="note" x="520" y="338">checkpoint survives a committed write</text>
  <path class="rule" d="M72 356h368M520 356h368"/>

  <text class="kind" x="72" y="382">HISTORY · QUERY MODEL</text>
  <text class="value" x="72" y="406">Retention plus key/search indexes</text>
  <text class="note" x="72" y="426">history depends on saver and eviction policy</text>
  <text class="kind" x="520" y="382">HISTORY · QUERY MODEL</text>
  <text class="value" x="520" y="406">Durable history plus SQL and JSONB</text>
  <text class="note" x="520" y="426">resume, inspection, and time-travel debugging</text>

  <text class="note" x="72" y="462">Best fit: recoverable, latency-sensitive session state.</text>
  <text class="note" x="520" y="462">Best fit: long tasks and reproducible recovery.</text>
  <text class="note" x="48" y="510">Benchmark your serialized state size and write frequency; generic database benchmarks do not predict checkpoint cost.</text>
</svg>
