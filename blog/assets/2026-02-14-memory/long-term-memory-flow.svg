<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 368" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="lm-title lm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lm-title">Cold-memory retrieval from a new message to planning context</title>
  <desc id="lm-desc">A new user message is embedded, searched in Qdrant with a user filter, rescored by relevance, recency, and importance, then injected into the planner context. Rescoring is highlighted because raw cosine similarity is only the first retrieval signal.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="368" rx="14" fill="#F7F7F4"/>

  <circle cx="62" cy="58" r="14" fill="#17211B"/><text class="num" x="62" y="63" text-anchor="middle">1</text>
  <circle cx="270" cy="58" r="14" fill="#17211B"/><text class="num" x="270" y="63" text-anchor="middle">2</text>
  <circle cx="478" cy="58" r="14" fill="#17211B"/><text class="num" x="478" y="63" text-anchor="middle">3</text>
  <circle cx="686" cy="58" r="14" fill="#17211B"/><text class="num" x="686" y="63" text-anchor="middle">4</text>
  <circle cx="894" cy="58" r="14" fill="#17211B"/><text class="num" x="894" y="63" text-anchor="middle">5</text>

  <rect class="external" x="48" y="88" width="168" height="96" rx="10"/>
  <text class="kind" x="68" y="122">EXTERNAL · QUERY</text>
  <text class="name" x="68" y="150">New message</text>
  <text class="note" x="68" y="170">“Update my analysis”</text>

  <rect class="process" x="256" y="88" width="168" height="96" rx="10"/>
  <text class="kind" x="276" y="122">PROCESS · EMBED</text>
  <text class="name" x="276" y="150">Encode query</text>
  <text class="note" x="276" y="170">1536-dim vector</text>

  <rect class="store" x="464" y="88" width="168" height="96" rx="10"/>
  <text class="kind" x="484" y="122">STORE · QDRANT</text>
  <text class="name" x="484" y="150">Search memories</text>
  <text class="note" x="484" y="170">filter: user_id</text>

  <rect class="focus" x="672" y="88" width="168" height="96" rx="10"/>
  <text class="kind focus-text" x="692" y="122">FOCUS · RANK</text>
  <text class="name focus-text" x="692" y="150">Rescore results</text>
  <text class="note" x="692" y="170">keep the useful facts</text>

  <rect class="process" x="880" y="88" width="192" height="96" rx="10"/>
  <text class="kind" x="900" y="122">PROCESS · PLANNER</text>
  <text class="name" x="900" y="150">Inject context</text>
  <text class="note" x="900" y="170">personalized plan</text>

  <path class="edge" d="M216 136h32" marker-end="url(#lm-arrow)"/>
  <path class="edge" d="M424 136h32" marker-end="url(#lm-arrow)"/>
  <path class="edge" d="M632 136h32" marker-end="url(#lm-arrow)"/>
  <path class="edge" d="M840 136h32" marker-end="url(#lm-arrow)"/>

  <rect x="640" y="232" width="264" height="80" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5"/>
  <text class="kind" x="664" y="258">THREE SIGNALS, ONE SCORE</text>
  <text class="name" x="664" y="286">Relevance · recency · importance</text>
  <path class="edge" d="M756 184v40" marker-end="url(#lm-arrow)"/>
  <text class="note" x="48" y="344">The user filter narrows ownership first; rescoring then decides which memories deserve scarce context-window space.</text>

  <defs>
    <marker id="lm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
