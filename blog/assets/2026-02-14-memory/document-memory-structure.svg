<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">The document-memory directory holds four topic folders under one shared root, and four operations read, write, list, and search across all of them.</title><desc id="docmem-desc">The shared .agent-memory directory holds user-profiles, research, conventions, and learnings as Markdown files. A small file-memory interface exposes four operations that all resolve their target path inside that same root: read returns a document's content, write creates or replaces one, list matches paths by a glob pattern, and search returns the paragraphs that match a keyword.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
