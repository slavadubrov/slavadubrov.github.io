<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="mt-title mt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mt-title">Six agent memory types grouped into three storage tiers</title>
  <desc id="mt-desc">Hot memory contains working and short-term memory, cold memory contains episodic and semantic memory, and document memory stores project knowledge. Procedural memory sits outside the storage tiers in system instructions and tool definitions. Working memory is highlighted as the context the model can use now.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#F7F7F4"/>

  <rect class="group" x="48" y="64" width="320" height="376" rx="12"/>
  <text class="kind" x="72" y="94">HOT TIER · CURRENT THREAD</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10"/>
  <text class="kind focus-text" x="92" y="146">FOCUS · WORKING</text>
  <text class="name focus-text" x="92" y="174">Current context</text>
  <text class="note" x="92" y="194">one model step · not persisted</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10"/>
  <text class="kind" x="92" y="282">STORE · SHORT-TERM</text>
  <text class="name" x="92" y="310">Thread checkpoint</text>
  <text class="note" x="92" y="330">minutes–hours · pause and resume</text>
  <text class="note" x="72" y="408">Usable now; checkpoints make it recoverable.</text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12"/>
  <text class="kind" x="424" y="94">COLD TIER · ACROSS THREADS</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10"/>
  <text class="kind" x="444" y="146">STORE · EPISODIC</text>
  <text class="name" x="444" y="174">Past interactions</text>
  <text class="note" x="444" y="194">days–months · events and history</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10"/>
  <text class="kind" x="444" y="282">STORE · SEMANTIC</text>
  <text class="name" x="444" y="310">Facts and preferences</text>
  <text class="note" x="444" y="330">months–permanent · vector or KV</text>
  <text class="note" x="424" y="408">Recall by meaning or key in the next thread.</text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12"/>
  <text class="kind" x="776" y="94">DOCUMENT TIER · PROJECT KNOWLEDGE</text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10"/>
  <text class="kind" x="796" y="146">STORE · DOCUMENT</text>
  <text class="name" x="796" y="174">Inspectable files</text>
  <text class="note" x="796" y="194">notes · research · learned patterns</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#D8DDD9" stroke-width="1.5"/>
  <text class="kind" x="800" y="246">FILES</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Human-readable, editable, and versioned.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10"/>
  <text class="kind" x="420" y="496">EXTERNAL · PROCEDURAL</text>
  <text class="name" x="420" y="520">System prompt and tools</text>
  <text class="note" x="420" y="544">Ships with the agent; not a retrieved tier.</text>
</svg>
