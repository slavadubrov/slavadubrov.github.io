<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="hc-title hc-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hc-title">A checkpoint is written after every completed super-step</title>
  <desc id="hc-desc">A LangGraph node completes, its state is serialized into a checkpoint, and the next node begins. After a process restart or human approval, the graph reloads the latest completed checkpoint and resumes at the next node boundary rather than at an arbitrary Python line.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="392" rx="14" fill="#F7F7F4"/>

  <circle cx="62" cy="58" r="14" fill="#17211B"/><text class="num" x="62" y="63" text-anchor="middle">1</text>
  <circle cx="366" cy="58" r="14" fill="#17211B"/><text class="num" x="366" y="63" text-anchor="middle">2</text>
  <circle cx="670" cy="58" r="14" fill="#17211B"/><text class="num" x="670" y="63" text-anchor="middle">3</text>

  <rect class="process" x="48" y="88" width="256" height="96" rx="10"/>
  <text class="kind" x="68" y="122">PROCESS · SUPER-STEP</text>
  <text class="name" x="68" y="150">Node completes</text>
  <text class="note" x="68" y="170">messages · plan · gathered data</text>

  <rect class="focus" x="352" y="88" width="256" height="96" rx="10"/>
  <text class="kind focus-text" x="372" y="122">FOCUS · CHECKPOINT</text>
  <text class="name focus-text" x="372" y="150">Persist full graph state</text>
  <text class="note" x="372" y="170">thread · namespace · version</text>

  <rect class="process" x="656" y="88" width="256" height="96" rx="10"/>
  <text class="kind" x="676" y="122">PROCESS · GRAPH</text>
  <text class="name" x="676" y="150">Enter the next node</text>
  <text class="note" x="676" y="170">the only safe resume boundary</text>

  <path class="edge" d="M304 136h40" marker-end="url(#hc-arrow)"/>
  <path class="edge" d="M608 136h40" marker-end="url(#hc-arrow)"/>
  <text class="note" x="320" y="212">serialize state</text>
  <text class="note" x="624" y="212">load latest</text>

  <rect class="external" x="48" y="248" width="256" height="62" rx="10"/>
  <text class="kind" x="68" y="272">EXTERNAL · INTERRUPTION</text>
  <text class="name" x="68" y="296">Restart or human approval</text>
  <path class="edge" d="M304 279h96a80 80 0 0 0 80-80v-7" stroke-dasharray="7 6" marker-end="url(#hc-arrow)"/>
  <text class="note" x="336" y="267">resume request</text>

  <path d="M48 344h864" fill="none" stroke="#D8DDD9" stroke-width="1.5"/>
  <text class="kind" x="48" y="336">BOUNDARY, NOT A TRACE</text>
  <text class="note" x="236" y="365">Recovery returns to the latest completed graph boundary—not to the Python line where the worker stopped.</text>

  <defs>
    <marker id="hc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
