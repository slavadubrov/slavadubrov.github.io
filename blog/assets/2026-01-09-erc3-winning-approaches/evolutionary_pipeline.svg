<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="evo-title evo-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="evo-title">Failed benchmark traces evolve the production prompt</title>
  <desc id="evo-desc">The main agent runs the benchmark and stores failed traces. An analyzer turns failures into hypotheses, then a versioner produces the next system prompt. The revised prompt returns to the main agent; this loop produced prompt version 80.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #C50E72; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #C50E72; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="360" rx="14" fill="#F7F7F4"/>
  <circle cx="62" cy="52" r="14" fill="#17211B"/><text class="marker-num" x="62" y="57" text-anchor="middle">1</text>
  <circle cx="286" cy="52" r="14" fill="#17211B"/><text class="marker-num" x="286" y="57" text-anchor="middle">2</text>
  <circle cx="510" cy="52" r="14" fill="#17211B"/><text class="marker-num" x="510" y="57" text-anchor="middle">3</text>
  <circle cx="734" cy="52" r="14" fill="#17211B"/><text class="marker-num" x="734" y="57" text-anchor="middle">4</text>
  <rect class="box" x="48" y="80" width="188" height="96" rx="10"/><text class="kind" x="68" y="114">AGENT</text><text class="name" x="68" y="142">Run benchmark</text>
  <rect class="store" x="272" y="80" width="188" height="96" rx="10"/><text class="kind" x="292" y="114">TRACE STORE</text><text class="name" x="292" y="142">Failed tasks</text>
  <rect class="box" x="496" y="80" width="188" height="96" rx="10"/><text class="kind" x="516" y="114">ANALYZER</text><text class="name" x="516" y="142">Diagnose causes</text>
  <rect x="720" y="80" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><text class="kind-focus" x="740" y="114">VERSIONER</text><text class="name-focus" x="740" y="142">Revise prompt</text>
  <path class="edge" d="M236 128h28" marker-end="url(#evo-arrow)"/><path class="edge" d="M460 128h28" marker-end="url(#evo-arrow)"/><path class="edge" d="M684 128h28" marker-end="url(#evo-arrow)"/>
  <path d="M814 176v48a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-48" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#evo-signal)"/>
  <rect x="362" y="224" width="232" height="24" rx="6" fill="#F7F7F4"/><text class="note" x="478" y="241" text-anchor="middle" fill="#C50E72">new system prompt · v1 → v80</text>
  <text class="note" x="48" y="324">The loop changes the prompt only after failed traces have been converted into explicit hypotheses.</text>
  <defs><marker id="evo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E"/></marker><marker id="evo-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
</svg>
