<text x="32" y="446" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A stronger generator cannot recover evidence that retrieval never found — evaluate each stage separately.</text>
<text x="32" y="468" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Add hybrid search, reranking, or query transformation only after error analysis shows a real miss.</text>
