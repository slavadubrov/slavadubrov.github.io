<text x="32" y="542" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">DeepSeek-R1 distilled Qwen and Llama students from 1.5B to 70B parameters using its 671B teacher.</text>
