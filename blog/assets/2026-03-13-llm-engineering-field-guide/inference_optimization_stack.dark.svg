<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Inference optimization choices</title>
  <desc>Kernel, quantization, memory, scheduling, caching, speculation, and parallelism choices are independently selectable against a shared measured hardware and workload bottleneck and application-level targets.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#0C1210" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0">Inference optimization choices</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#EDF5F0">Select independently against the measured bottleneck and target SLO</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus"/>
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#EDF5F0">Hardware foundation</text>
  <text x="80" y="468" font-size="11" fill="#EDF5F0">GPU memory hierarchy: HBM bandwidth and on-chip reuse vary by GPU</text>
  <text x="80" y="483" font-size="11" fill="#EDF5F0">Measure the compute, memory, and communication bottleneck on the target GPU</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#EDF5F0">Kernel optimizations</text>
  <text x="70" y="373" font-size="11" fill="#EDF5F0">FlashAttention (tiling in SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#EDF5F0">Fused kernels (reduce HBM round-trips)</text>
  <text x="70" y="398" font-size="11" fill="#EDF5F0">Profile utilization on the deployed graph</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#EDF5F0">Quantization</text>
  <text x="470" y="373" font-size="11" fill="#EDF5F0">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#EDF5F0">8-bit weights: about 50% less raw storage than 16-bit</text>
  <text x="470" y="400" font-size="11" fill="#EDF5F0">4-bit: about 75% less before scale and metadata overhead</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#EDF5F0">Memory management</text>
  <text x="70" y="283" font-size="11" fill="#EDF5F0">PagedAttention (block-based KV allocation)</text>
  <text x="70" y="298" font-size="11" fill="#EDF5F0">GQA/MQA (8-16× KV cache reduction)</text>
  <text x="70" y="308" font-size="11" fill="#EDF5F0">Published gains depend on workload and harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#EDF5F0">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#EDF5F0">Continuous batching (iteration-level)</text>
  <text x="470" y="298" font-size="11" fill="#EDF5F0">Chunked prefill (protects decode latency)</text>
  <text x="470" y="308" font-size="11" fill="#EDF5F0">Tune for goodput at the target SLO</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Caching</text>
  <text x="70" y="193" font-size="11" fill="#EDF5F0">Prefix caching (measure the hit rate)</text>
  <text x="70" y="208" font-size="11" fill="#EDF5F0">RadixAttention (tree-based KV reuse)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Speculation</text>
  <text x="340" y="193" font-size="11" fill="#EDF5F0">Speculative decoding (verify drafts)</text>
  <text x="340" y="208" font-size="11" fill="#EDF5F0">Acceptance rate controls the gain</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Parallelism</text>
  <text x="620" y="193" font-size="11" fill="#EDF5F0">TP (intra-node, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#EDF5F0">PP (inter-node) + DP (scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#EDF5F0">Application layer</text>
  <text x="80" y="113" font-size="11" fill="#EDF5F0">Model routing · Token-aware rate limiting · Monitoring (goodput, KV utilization, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="11" fill="#EDF5F0">Combine techniques only after measuring their quality, latency, and cost effects</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
