<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="H100 dense BF16 and FP16 roofline model" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Schematic H100 dense BF16 and FP16 roofline model</title>
  <desc>A schematic H100 SXM roofline using a dense BF16 or FP16 peak of 989 TFLOPS and 3.35 TB/s bandwidth, giving a 295 FLOPs-per-byte critical intensity. It separates memory-bound work below the rising bandwidth ceiling from compute-bound work at the flat compute ceiling. Decode at batch one sits in the memory-bound region; long or well-batched prefill can reach the compute-bound region. Positions are not to scale.</desc>
  <defs>

    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#FFFFFF"/>
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="720" height="400" fill="#F7F7F4" rx="8"/>

  <!-- Title -->
  <text y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#17211B" x="360">Schematic roofline model</text>
  <text y="48" text-anchor="middle" font-size="11" fill="#17211B" x="360">H100 SXM · dense BF16/FP16 · positions not to scale</text>

  <!-- Shaded regions -->
  <!-- Memory-bound region (blue tint, left of knee) -->
  <polygon points="90,340 90,88 470,88 470,340" fill="#FFFFFF" opacity="0.5" class="visual-focus"/>
  <!-- Compute-bound region (red tint, right of knee) -->
  <polygon points="470,340 470,88 660,88 660,340" fill="#FFFFFF" opacity="0.5"/>

  <!-- Region labels at top -->
  <text y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#17211B" opacity="0.7" x="280">MEMORY-BOUND</text>
  <text y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#17211B" opacity="0.7" x="565">COMPUTE-BOUND</text>

  <!-- Axes -->
  <line x1="90" y1="340" x2="670" y2="340" stroke="#59645E" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="90" y1="340" x2="90" y2="82" stroke="#59645E" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Y-axis label -->
  <text y="210" text-anchor="middle" font-size="11" fill="#17211B" x="22" transform="rotate(-90,22,210)">Performance (TFLOPS)</text>

  <!-- X-axis label -->
  <text y="375" text-anchor="middle" font-size="11" fill="#17211B" x="380">Arithmetic intensity (FLOPs/byte, schematic)</text>

  <!-- ============ THE ROOFLINE ============ -->

  <!-- Memory-bandwidth slope: from bottom-left to knee -->
  <line x1="95" y1="335" x2="470" y2="110" stroke="#17211B" stroke-width="3" stroke-linecap="round"/>

  <!-- Compute ceiling: flat from knee to right -->
  <line x1="470" y1="110" x2="660" y2="110" stroke="#17211B" stroke-width="3" stroke-linecap="round"/>

  <!-- Line labels along the lines -->
  <text y="260" font-size="11" fill="#17211B" font-weight="bold" x="210" transform="rotate(-31,210,260)">3.35 TB/s bandwidth</text>
  <text y="103" font-size="11" fill="#17211B" font-weight="bold" x="540">989 TFLOPS dense BF16/FP16</text>

  <!-- Knee point (critical intensity) -->
  <circle cx="470" cy="110" r="5" fill="#ffffff" stroke="#17211B" stroke-width="2"/>
  <line x1="470" y1="120" x2="470" y2="145" stroke="#17211B" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text y="158" text-anchor="start" font-size="11" font-weight="bold" fill="#17211B" x="482">295 FLOPs/byte</text>
  <text y="171" text-anchor="start" font-size="11" fill="#17211B" x="482">(critical intensity)</text>

  <!-- ============ WORKLOAD DOTS ============ -->

  <!-- Decode (bs=1): intensity ≈ 1 → bottom of slope -->
  <circle cx="140" cy="310" r="9" fill="#F2F2F5" stroke="#17211B" stroke-width="2"/>
  <text y="298" font-size="12" font-weight="bold" fill="#17211B" x="158">Decode</text>
  <text y="312" font-size="11" fill="#17211B" x="158">batch = 1</text>
  <text y="325" font-size="11" fill="#17211B" x="158">1 FLOP/byte</text>

  <!-- Long or well-batched prefill can reach the ceiling -->
  <circle cx="530" cy="110" r="9" fill="#FFFFFF" stroke="#17211B" stroke-width="2"/>
  <text y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#17211B" x="530">Long/batched prefill</text>
  <text y="209" text-anchor="middle" font-size="11" fill="#17211B" x="530">many tokens reuse the same weights</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
