<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="eval-layers-title eval-layers-desc" shape-rendering="geometricPrecision"
     text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="eval-layers-title">Three places where a RAG system can lose evidence</title>
  <desc id="eval-layers-desc">The diagram follows evidence through the corpus and index, the retrieval path, and the answer and live traffic. Each layer has diagnostic metrics, and every layer is evaluated both offline and online. The retrieval path is highlighted because filters can silently remove the gold document.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="eval-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#f7f7f4"/>
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">EVIDENCE PATH · THREE EVALUATION LAYERS</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Locate the first place evidence disappears</text>
  <text x="48" y="102" fill="#59645e" font-size="13">A downstream score cannot explain an upstream loss.</text>

  <rect x="48" y="136" width="256" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5"/>
  <text x="68" y="170" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · INGESTION</text>
  <text x="68" y="200" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Corpus &amp; index</text>
  <path d="M304 184H344" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#eval-layers-arrow)"/>
  <rect x="352" y="136" width="256" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5"/>
  <text x="372" y="170" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCUS · QUERY TIME</text>
  <text x="372" y="200" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Retrieval path</text>
  <path d="M608 184H648" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#eval-layers-arrow)"/>
  <rect x="656" y="136" width="256" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5"/>
  <text x="676" y="170" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESS · ANSWER</text>
  <text x="676" y="200" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Answer &amp; live traffic</text>

  <path d="M48 264H304" fill="none" stroke="#d8ddd9" stroke-width="1"/>
  <text x="48" y="288" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNOSTICS</text>
  <text x="48" y="314" fill="#59645e" font-size="13">CER/WER · TEDS · freshness</text>
  <text x="48" y="334" fill="#59645e" font-size="13">ANN recall vs. exact search</text>
  <path d="M352 264H608" fill="none" stroke="#d8ddd9" stroke-width="1"/>
  <text x="352" y="288" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNOSTICS</text>
  <text x="352" y="314" fill="#59645e" font-size="13">Recall@k · false-exclusion rate</text>
  <text x="352" y="334" fill="#59645e" font-size="13">ΔnDCG · context utilization</text>
  <path d="M656 264H912" fill="none" stroke="#d8ddd9" stroke-width="1"/>
  <text x="656" y="288" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNOSTICS</text>
  <text x="656" y="314" fill="#59645e" font-size="13">Faithfulness · citation support</text>
  <text x="656" y="334" fill="#59645e" font-size="13">Drift · latency · cost</text>

  <path d="M48 370H912" fill="none" stroke="#d8ddd9" stroke-width="1"/>
  <text x="48" y="398" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">RUN EVERY LAYER IN BOTH MODES</text>
  <rect x="48" y="418" width="408" height="62" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5"/>
  <text x="68" y="444" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE · OFFLINE</text>
  <text x="68" y="468" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Golden set · comparison · CI gate</text>
  <rect x="504" y="418" width="408" height="62" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5"/>
  <text x="524" y="444" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODE · ONLINE</text>
  <text x="524" y="468" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Live samples · user signals · drift</text>
</svg>
