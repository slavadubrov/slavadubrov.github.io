<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="lrf-title lrf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="lrf-title">Hardened LoRAX deployment path</title>
  <desc id="lrf-desc">Five ordered steps. An external gateway authenticates the tenant and authorizes the adapter ID before it reaches LoRAX. LoRAX resolves the adapter, forms a heterogeneous batch, applies each adapter over the shared base model, and streams output tokens. Unauthorized IDs, incompatible artifacts, and load failures stop before scheduling.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #59645e; }
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .marker-num { font-style: normal; font-weight: 600; font-size: 13px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; fill: #ffffff; }
    .box { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .external { fill: #ffffff; stroke: #59645e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #fdecf5; stroke: #f2148e; stroke-width: 2.5; }
    .edge { fill: none; stroke: #59645e; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#f7f7f4"/>

  <text class="section" x="48" y="44">HARDENED DEPLOYMENT PATH · AUTHORIZED ADAPTER ID → OUTPUT TOKENS</text>

  <circle cx="62" cy="76" r="14" fill="#17211b"/>
  <text class="marker-num" x="62" y="81" text-anchor="middle">1</text>
  <rect class="external" x="48" y="104" width="240" height="96" rx="10"/>
  <text class="kind" x="68" y="138">EXTERNAL GATEWAY</text>
  <text class="name" x="68" y="166">Authorize adapter ID</text>

  <circle cx="374" cy="76" r="14" fill="#17211b"/>
  <text class="marker-num" x="374" y="81" text-anchor="middle">2</text>
  <rect class="focus" x="360" y="104" width="240" height="96" rx="10"/>
  <text class="kind" x="380" y="138" fill="#c50e72">LORAX · FOCUS</text>
  <text class="name" x="380" y="166" fill="#c50e72">Resolve residency</text>

  <circle cx="686" cy="76" r="14" fill="#17211b"/>
  <text class="marker-num" x="686" y="81" text-anchor="middle">3</text>
  <rect class="box" x="672" y="104" width="240" height="96" rx="10"/>
  <text class="kind" x="692" y="138">SCHEDULER</text>
  <text class="name" x="692" y="166">Form mixed batch</text>

  <path class="edge" d="M288 152h64" marker-end="url(#lrf-arrow)"/>
  <path class="edge" d="M600 152h64" marker-end="url(#lrf-arrow)"/>

  <circle cx="218" cy="252" r="14" fill="#17211b"/>
  <text class="marker-num" x="218" y="257" text-anchor="middle">4</text>
  <rect class="box" x="204" y="280" width="240" height="96" rx="10"/>
  <text class="kind" x="224" y="314">GPU INFERENCE</text>
  <text class="name" x="224" y="342">Apply each adapter</text>

  <circle cx="530" cy="252" r="14" fill="#17211b"/>
  <text class="marker-num" x="530" y="257" text-anchor="middle">5</text>
  <rect class="box" x="516" y="280" width="240" height="96" rx="10"/>
  <text class="kind" x="536" y="314">STREAM</text>
  <text class="name" x="536" y="342">Return output tokens</text>

  <path class="edge" d="M792 200v24H324v48" marker-end="url(#lrf-arrow)"/>
  <text class="note" x="788" y="218" text-anchor="end">ready mixed batch</text>
  <path class="edge" d="M444 328h64" marker-end="url(#lrf-arrow)"/>

  <path d="M48 416h864" stroke="#d8ddd9" stroke-width="1"/>
  <text class="note" x="48" y="440">Stop before scheduling: unauthorized ID · incompatible artifact · adapter load failure</text>

  <defs>
    <marker id="lrf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e"/>
    </marker>
  </defs>
</svg>
