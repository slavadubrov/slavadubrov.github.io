<text x="32" y="1058" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Sensitive-data policy is stricter than PII detection — provenance, consent, retention, and deletion still apply.</text>
<text x="32" y="1080" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Coverage before volume: add examples for distinct failure modes, not repeats of the easy majority case.</text>
</svg>
