<path d="M360 600v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ftdata-arrow-flow)"/>
<path d="M360 728v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ftdata-arrow-flow)"/>
<path d="M360 856v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ftdata-arrow-flow)"/>
