<svg viewBox="0 0 1120 472.89" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Output Formats" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Fine-tuned model artifact choices</title>
  <desc>A small LoRA adapter depends on its base model, a merged checkpoint is standalone at full-model size, and GGUF targets local or edge inference at a chosen quantization.</desc>
  <defs>




  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="1120" height="472.89" fill="#0C1210"/>

  <g transform="scale(1.244444444)">
  <!-- Title -->
  <text class="diagram-kind" x="852" y="35" text-anchor="end" fill="#A8B8AF">COMPARISON</text>
  <text class="diagram-name" x="450" y="35" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">Output Format Comparison</text>

  <!-- LoRA Adapter -->
  <rect x="40" y="70" width="260" height="290" rx="16" fill="#1B2621" stroke="#FF6FB6" stroke-width="2.5" class="visual-focus"/>
  <text class="diagram-name" x="170" y="110" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold">LoRA Adapter</text>

  <rect x="55" y="130" width="230" height="210" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>

  <text x="70" y="160" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">SIZE</text>
  <text x="70" y="180" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14">Rank/module dependent</text>

  <text x="70" y="210" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">COMMAND</text>
  <text x="70" y="228" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">uv run finetune</text>

  <text x="70" y="258" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">BEST FOR</text>
  <text x="70" y="278" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Development &amp; testing</text>
  <text x="70" y="295" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Multiple adapters</text>
  <text x="70" y="312" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Storage efficiency</text>
  <text x="70" y="329" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Version control</text>

  <!-- Merged Model -->
  <rect x="320" y="70" width="260" height="290" rx="16" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="450" y="110" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold">Merged Model</text>

  <rect x="335" y="130" width="230" height="210" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>

  <text x="350" y="160" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">SIZE</text>
  <text x="350" y="180" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14">Full checkpoint size</text>

  <text x="350" y="210" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">COMMAND</text>
  <text x="350" y="228" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">uv run finetune --merge</text>

  <text x="350" y="258" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">BEST FOR</text>
  <text x="350" y="278" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Sharing with others</text>
  <text x="350" y="295" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Engines requiring one model</text>
  <text x="350" y="312" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Single-artifact deployment</text>
  <text x="350" y="329" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Hugging Face Hub</text>

  <!-- GGUF -->
  <rect x="600" y="70" width="260" height="290" rx="16" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="730" y="110" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold">GGUF Format</text>

  <rect x="615" y="130" width="230" height="210" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>

  <text x="630" y="160" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">SIZE</text>
  <text x="630" y="180" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14">Model + quantization dependent</text>

  <text x="630" y="210" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">COMMAND</text>
  <text x="630" y="228" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">uv run finetune --gguf q4_k_m</text>

  <text x="630" y="258" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">BEST FOR</text>
  <text x="630" y="278" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• CPU inference</text>
  <text x="630" y="295" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Ollama / llama.cpp</text>
  <text x="630" y="312" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Edge deployment</text>
  <text x="630" y="329" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Low-resource systems</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .diagram-kind { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; }
    .diagram-name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
