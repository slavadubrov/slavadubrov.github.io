<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" data-visual-system="byte-diagram-v1" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" aria-labelledby="artifact-title artifact-desc">
  <title id="artifact-title">Mixture of Experts (MoE) Architecture</title>
  <desc id="artifact-desc">Mixture of Experts (MoE) Architecture.</desc>
  <defs>


    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B2621"/>
    </marker>
    <marker id="arrowActive" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B2621"/>
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" fill="#0C1210"/>

  <!-- Title -->
  <text y="35" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#EDF5F0" x="450">Mixture of Experts (MoE) Architecture</text>

  <!-- Input -->
  <rect x="390" y="60" width="120" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text y="85" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#EDF5F0" x="450">Input Token</text>

  <!-- Arrow to router -->
  <path d="M 450 100 L 450 130" stroke="#EDF5F0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect x="340" y="140" width="220" height="50" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text y="165" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#141D19" x="450">Router Network</text>
  <text y="180" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" x="450">Selects top-k experts (k=2)</text>

  <!-- Arrows to experts -->
  <line x1="380" y1="190" x2="130" y2="240" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="420" y1="190" x2="295" y2="240" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="480" y1="190" x2="605" y2="240" stroke="#A8B8AF" stroke-width="2" marker-end="url(#arrowActive)"/>
  <line x1="520" y1="190" x2="770" y2="240" stroke="#A8B8AF" stroke-width="2" marker-end="url(#arrowActive)"/>

  <!-- Expert 1 (inactive) -->
  <rect x="50" y="240" width="160" height="60" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" opacity="0.6"/>
  <text y="265" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#EDF5F0" x="130">Expert 1</text>
  <text y="285" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" x="130">Language/Grammar</text>

  <!-- Expert 2 (inactive) -->
  <rect x="220" y="240" width="160" height="60" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" opacity="0.6"/>
  <text y="265" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#EDF5F0" x="300">Expert 2</text>
  <text y="285" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" x="300">History/Culture</text>

  <!-- Expert 3 (ACTIVE) -->
  <rect x="520" y="240" width="160" height="60" rx="6" fill="#1B2621" stroke="#A8B8AF" stroke-width="2"/>
  <text y="262" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#141D19" x="600">Expert 3 ✓</text>
  <text y="280" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" x="600">Science/Physics</text>
  <text y="295" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19" x="600">ACTIVE</text>

  <!-- Expert 4 (ACTIVE) -->
  <rect x="690" y="240" width="160" height="60" rx="6" fill="#1B2621" stroke="#A8B8AF" stroke-width="2"/>
  <text y="262" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#141D19" x="770">Expert 4 ✓</text>
  <text y="280" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" x="770">Math/Computing</text>
  <text y="295" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19" x="770">ACTIVE</text>

  <!-- Arrows to output -->
  <path d="M 600 300 L 480 350" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrowActive)"/>
  <path d="M 770 300 L 520 350" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrowActive)"/>

  <!-- Combined Output -->
  <rect x="390" y="350" width="220" height="50" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2"/>
  <text y="375" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#EDF5F0" x="500">Combined Output</text>
  <text y="390" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" x="500">Weighted sum of active experts</text>

  <!-- Case Study Box -->
  <rect x="50" y="420" width="800" height="50" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus"/>
  <text y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0" x="70">Mixtral 8x7B:</text>
  <text y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="160">Total: 47B params (8 experts)</text>
  <text y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="330">•  Active: 13B params (2 experts)</text>
  <text y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0" x="510">•  Result: 47B performance at 13B cost</text>
  <text y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EDF5F0" x="725">✓ 3.6× efficiency</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
