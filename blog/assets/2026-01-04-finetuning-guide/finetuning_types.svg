<svg viewBox="0 0 960 624.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fine-Tuning Types" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Three fine-tuning dataset shapes</title>
  <desc>Continued pre-training uses raw domain text, task-specific supervised fine-tuning uses input and output pairs, and instruction tuning uses a broad mixture of instructions and responses.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="960" height="624.00" fill="#F7F7F4"/>

  <g transform="scale(1.2)">
  <!-- Title -->
  <text class="diagram-kind" x="752" y="35" text-anchor="end" fill="#59645E">TYPES</text>
  <text class="diagram-name" x="400" y="40" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">Types of Fine-Tuning</text>

  <!-- Base Model (center top) -->
  <rect x="300" y="70" width="200" height="45" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2"/>
  <text class="diagram-name" x="400" y="98" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Pre-trained Base Model</text>

  <!-- Arrows from base model -->
  <path d="M400 115 L400 140 L150 140 L150 160" stroke="#59645E" stroke-width="2" fill="none"/>
  <path d="M400 115 L400 160" stroke="#59645E" stroke-width="2" fill="none"/>
  <path d="M400 115 L400 140 L650 140 L650 160" stroke="#59645E" stroke-width="2" fill="none"/>

  <!-- Self-supervised / Continued Pre-training (left) -->
  <rect x="50" y="165" width="200" height="55" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5"/>
  <text x="150" y="190" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Continued Pre-training</text>
  <text x="150" y="208" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(Self-supervised)</text>

  <!-- SFT (center) -->
  <rect x="300" y="165" width="200" height="55" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5"/>
  <text x="400" y="190" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Supervised Fine-Tuning</text>
  <text x="400" y="208" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(SFT)</text>

  <!-- Instruction Tuning (right) -->
  <rect x="550" y="165" width="200" height="55" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5"/>
  <text x="650" y="190" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Instruction Tuning</text>
  <text x="650" y="208" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(Special case of SFT)</text>

  <!-- Descriptions boxes -->

  <!-- Unsupervised description -->
  <rect x="50" y="240" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5"/>
  <text x="65" y="265" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Data:</text>
  <text x="65" y="283" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Raw text; next-token targets</text>
  <text x="65" y="305" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Goal:</text>
  <text x="65" y="323" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Adapt next-token behavior</text>
  <text x="65" y="345" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Example:</text>
  <text x="65" y="363" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Medical papers, legal docs</text>

  <!-- SFT description -->
  <rect x="300" y="240" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5"/>
  <text x="315" y="265" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Data:</text>
  <text x="315" y="283" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(input, output) pairs</text>
  <text x="315" y="305" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Goal:</text>
  <text x="315" y="323" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Task-specific behavior</text>
  <text x="315" y="345" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Example:</text>
  <text x="315" y="363" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Text → SQL, Summarization</text>

  <!-- Instruction Tuning description -->
  <rect x="550" y="240" width="200" height="130" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/>
  <text x="565" y="265" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Data:</text>
  <text x="565" y="283" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(instruction, response) pairs</text>
  <text x="565" y="305" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Goal:</text>
  <text x="565" y="323" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Follow diverse instructions</text>
  <text x="565" y="345" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Example:</text>
  <text x="565" y="363" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Broad chat-assistant mixture</text>

  <!-- When to use section -->
  <rect x="50" y="390" width="700" height="110" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus"/>
  <text x="400" y="415" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">WHEN TO USE EACH</text>

  <text x="80" y="445" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Continued Pre-training:</text>
  <text x="230" y="445" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Model lacks domain vocabulary (e.g., medical, legal, code)</text>

  <text x="80" y="465" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">SFT:</text>
  <text x="130" y="465" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Specific task with known input/output format (e.g., Text-to-SQL)</text>

  <text x="80" y="485" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Instruction:</text>
  <text x="180" y="485" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">General chat assistant behavior</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .diagram-kind { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; }
    .diagram-name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
