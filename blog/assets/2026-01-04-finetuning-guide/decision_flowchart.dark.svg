<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision Flowchart" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Choose the mechanism before fine-tuning</title>
  <desc>A decision path routes changing facts to retrieval, simple style changes to prompting, output syntax to constrained decoding, and persistent measured behavior gaps to fine-tuning.</desc>
  <defs>
    <marker id="decision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/>
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="800" height="580" fill="#0C1210"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">When to Fine-Tune? Decision Flowchart</text>

  <!-- Start node -->
  <ellipse cx="400" cy="90" rx="100" ry="28" fill="#141D19" stroke="#EDF5F0" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">What do you need?</text>

  <!-- Arrow down from start -->
  <path d="M400 118 L400 138" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>

  <!-- Decision 1: Dynamic facts? -->
  <rect x="290" y="145" width="220" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">Need real-time or</text>
  <text x="400" y="183" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">changing knowledge?</text>

  <!-- Yes arrow to RAG -->
  <path d="M510 170 L590 170" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <text x="540" y="160" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">YES</text>

  <!-- RAG box -->
  <rect x="600" y="145" width="150" height="50" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="675" y="167" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Use RAG</text>
  <text x="675" y="183" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Retrieval-Augmented Gen</text>

  <!-- No arrow down -->
  <path d="M400 195 L400 220" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <text x="415" y="210" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">NO</text>

  <!-- Decision 2: Simple format? -->
  <rect x="290" y="225" width="220" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">Simple style/format</text>
  <text x="400" y="263" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">adjustments?</text>

  <!-- Yes arrow to Prompt Engineering -->
  <path d="M510 250 L590 250" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <text x="540" y="240" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">YES</text>

  <!-- Prompt Engineering box -->
  <rect x="600" y="225" width="150" height="50" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="675" y="247" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Prompting</text>
  <text x="675" y="263" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Few-shot examples</text>

  <!-- No arrow down -->
  <path d="M400 275 L400 300" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <text x="415" y="290" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">NO</text>

  <!-- Decision 3: Consistency issues? (REFRAMED) -->
  <rect x="290" y="305" width="220" height="50" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">Need valid output syntax</text>
  <text x="400" y="343" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">for a schema or grammar?</text>

  <!-- Yes arrow to constrained decoding -->
  <path d="M510 330 L590 330" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <text x="540" y="320" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">YES</text>

  <!-- Constrained decoding box -->
  <rect x="600" y="305" width="150" height="50" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="675" y="327" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="bold">Constrain decoding</text>
  <text x="675" y="343" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Valid syntax, not truth</text>

  <!-- No arrow down -->
  <path d="M400 355 L400 380" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <text x="415" y="370" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">NO</text>

  <!-- Decision 4: Complex behavior? -->
  <rect x="275" y="385" width="250" height="50" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">Measured behavior gap remains</text>
  <text x="400" y="423" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13">against the untuned baseline?</text>

  <!-- Yes arrow to Fine-Tuning -->
  <path d="M400 435 L400 465" stroke="#A8B8AF" stroke-width="2" marker-end="url(#decision-arrow)"/>
  <path d="M275 410H230" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#decision-arrow)"/>
  <text x="415" y="453" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">YES</text>
  <text x="230" y="400" text-anchor="end" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">NO · KEEP BASELINE</text>

  <!-- Fine-Tuning box -->
  <rect x="300" y="470" width="200" height="55" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="400" y="495" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="bold">Fine-Tune</text>
  <text x="400" y="513" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12">PEFT (LoRA/QLoRA)</text>

  <!-- Left side examples -->
  <rect x="40" y="145" width="180" height="220" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus"/>
  <text x="130" y="168" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">USE CASES</text>
  <text x="55" y="193" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">RAG:</text>
  <text x="55" y="208" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Company docs</text>
  <text x="55" y="223" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Current prices</text>
  <text x="55" y="243" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Prompting:</text>
  <text x="55" y="258" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Basic style changes</text>
  <text x="55" y="278" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Constraint:</text>
  <text x="55" y="293" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Consistent JSON</text>
  <text x="55" y="308" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Tool-call syntax</text>
  <text x="55" y="328" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Fine-Tune:</text>
  <text x="55" y="343" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Repeated task behavior</text>
  <text x="55" y="358" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Smaller-model adaptation</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
