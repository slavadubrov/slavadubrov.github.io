<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 622.22" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DoRA Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>DoRA magnitude and directional update</title>
  <desc>DoRA learns weight-vector magnitudes separately while a normalized low-rank update changes their directions, adding flexibility and cost beyond standard LoRA.</desc>
  <defs>


    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B2621"/>
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="1120" height="622.22" fill="#0C1210"/>

  <g transform="scale(1.244444444)">
  <!-- Title -->
  <text class="diagram-kind" x="852" y="35" text-anchor="end" fill="#A8B8AF">ARCHITECTURE</text>
  <text class="diagram-name" x="450" y="35" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#EDF5F0">DoRA: Weight-Decomposed Low-Rank Adaptation</text>

  <!-- Left side: Standard LoRA -->
  <text class="diagram-name" x="200" y="70" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#EDF5F0">Standard LoRA</text>

  <!-- Frozen Weight Matrix -->
  <rect x="80" y="90" width="240" height="70" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
  <text x="200" y="125" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#EDF5F0">W (Frozen)</text>
  <text x="200" y="145" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Pre-trained weights (d × d)</text>

  <!-- Plus sign -->
  <text x="330" y="135" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#EDF5F0">+</text>

  <!-- LoRA matrices -->
  <rect x="80" y="180" width="100" height="50" rx="4" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="130" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">Matrix B (d×r)</text>
  <text x="130" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">trainable</text>

  <text x="195" y="210" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">×</text>

  <rect x="220" y="180" width="100" height="50" rx="4" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="270" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">Matrix A (r×d)</text>
  <text x="270" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">trainable</text>

  <!-- Formula -->
  <text x="200" y="260" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#EDF5F0">W' = W + B × A</text>

  <!-- Divider -->
  <line x1="450" y1="70" x2="450" y2="280" stroke="#A8B8AF" stroke-width="2"/>

  <!-- Right side: DoRA -->
  <text x="680" y="70" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#EDF5F0">DoRA (Weight Decomposition)</text>

  <!-- Frozen Weight Matrix -->
  <rect x="560" y="90" width="240" height="50" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
  <text x="680" y="115" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#EDF5F0">W → Magnitude × Direction</text>
  <text x="680" y="132" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Decomposed</text>

  <!-- Arrow -->
  <path d="M 680 145 L 680 165" stroke="#EDF5F0" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Magnitude -->
  <rect x="500" y="175" width="130" height="50" rx="4" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/>
  <text x="565" y="198" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#EDF5F0">‖W‖ (Magnitude)</text>
  <text x="565" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">trainable scalar</text>

  <text x="645" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">×</text>

  <!-- Direction -->
  <rect x="670" y="175" width="130" height="50" rx="4" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="735" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">Direction (V)</text>
  <text x="735" y="212" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">V + B×A (LoRA)</text>

  <!-- Formula -->
  <text x="680" y="260" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#EDF5F0">W' = m × normalize_c(V + BA)</text>

  <!-- Comparison Box -->
  <rect x="50" y="300" width="800" height="180" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus"/>
  <text x="70" y="330" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDF5F0">What DoRA Changes</text>

  <circle cx="70" cy="360" r="4" fill="#FF6FB6"/>
  <text x="85" y="364" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Richer Updates:</text>
  <text x="185" y="364" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Separating magnitude and direction enables more substantial parameter changes</text>

  <circle cx="70" cy="390" r="4" fill="#FF6FB6"/>
  <text x="85" y="394" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Paper evidence:</text>
  <text x="185" y="394" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Improved over LoRA in several evaluated model and task configurations</text>

  <circle cx="70" cy="420" r="4" fill="#FF6FB6"/>
  <text x="85" y="424" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Trade-off:</text>
  <text x="155" y="424" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Extra magnitude parameters and computation require an apples-to-apples benchmark</text>

  <!-- When to use -->
  <rect x="70" y="442" width="760" height="26" rx="4" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/>
  <text x="85" y="460" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EDF5F0">Use DoRA when:</text>
  <text x="190" y="460" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">An apples-to-apples evaluation shows enough gain to justify the extra mechanism</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .diagram-kind { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; }
    .diagram-name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
