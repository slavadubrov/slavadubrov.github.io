<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="aitooldt-title aitooldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="aitooldt-title">A three-branch decision map selects a tool by the state that must persist, then a focused acceptance test confirms the exact stack.</title><desc id="aitooldt-desc">Whether the workflow must persist inside a native application, an inspectable graph, or an existing interface picks the first branch: Draw Things or DiffusionBee, ComfyUI, or AUTOMATIC1111 or Fooocus. Every branch still needs its exact model stack confirmed; a failed check sends you back to weigh another candidate before the focused representative acceptance test runs.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="aitooldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="aitooldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="760" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Choose the tool, then prove the stack</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">The control-surface table says where state lives. This test says whether it survives.</text>
<rect x="200" y="112" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2"/><text x="360" y="152" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">DECISION</text><text x="360" y="176" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">What state must persist?</text>
