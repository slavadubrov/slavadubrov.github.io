<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="memory-title memory-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision"
     font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="memory-title">Five claims on one Apple Silicon memory pool</title>
  <desc id="memory-desc">macOS and applications, model components, activations and runtime workspace, and optional adapters all draw from unified memory. The remaining working headroom is the focus because sustained swap is not a comfortable operating point. Resolution, batch size, architecture, precision, and loaded stages move the boundaries.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .claim { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .claim-alt { fill: #f2f2f5; stroke: #17211b; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#f7f7f4"/>

  <text class="kind" x="48" y="44">STORE · ONE UNIFIED MEMORY POOL</text>
  <text class="note" x="912" y="44" text-anchor="end">conceptual claims · not to scale</text>

  <rect class="claim" x="80" y="72" width="800" height="62" rx="10"/>
  <text class="kind" x="104" y="109">SYSTEM</text>
  <text class="name" x="272" y="109">macOS and applications</text>
  <text class="note" x="856" y="109" text-anchor="end">changes while you work</text>

  <rect class="claim-alt" x="80" y="150" width="800" height="62" rx="10"/>
  <text class="kind" x="104" y="187">WEIGHTS</text>
  <text class="name" x="272" y="187">Model components</text>
  <text class="note" x="856" y="187" text-anchor="end">checkpoint · encoders · VAE</text>

  <rect class="claim" x="80" y="228" width="800" height="62" rx="10"/>
  <text class="kind" x="104" y="265">WORKSPACE</text>
  <text class="name" x="272" y="265">Activations and runtime</text>
  <text class="note" x="856" y="265" text-anchor="end">attention · intermediate state</text>

  <rect class="claim-alt" x="80" y="306" width="800" height="62" rx="10"/>
  <text class="kind" x="104" y="343">OPTIONAL LOAD</text>
  <text class="name" x="272" y="343">Adapters and controls</text>
  <text class="note" x="856" y="343" text-anchor="end">LoRA · ControlNet · upscaler</text>

  <rect x="80" y="384" width="800" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5"/>
  <text class="kind" x="104" y="418" fill="#c50e72">FOCUS</text>
  <text class="name" x="104" y="446" fill="#c50e72">Working headroom</text>
  <text class="note" x="856" y="446" text-anchor="end">leave room before sustained swap</text>

  <path d="M48 520h48" fill="none" stroke="#d8ddd9" stroke-width="1.5"/>
  <text class="note" x="112" y="525">Resolution · batch size · architecture · precision · loaded stages move every claim.</text>
</svg>
