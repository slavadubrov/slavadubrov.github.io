<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="lga-title lga-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lga-title">LLM guardrails wrap one model call; the harness wraps the tool loop</title>
  <desc id="lga-desc">A side-by-side comparison. Content guardrails inspect input before a model call and output before returning it. The agent harness authorizes each proposed action before the sandbox executes it and returns an observation.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="704" rx="14" fill="#F7F7F4"/>

  <rect x="48" y="56" width="408" height="592" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="section" x="72" y="88">ONE MODEL CALL</text>
  <text class="note" x="72" y="110">Question: is the text safe?</text>

  <rect class="box" x="72" y="136" width="360" height="62" rx="10"/>
  <text class="kind" x="92" y="160">INPUT</text>
  <text class="name" x="92" y="184">User and retrieved text</text>

  <rect class="box" x="72" y="238" width="360" height="62" rx="10"/>
  <text class="kind" x="92" y="262">CONTENT GUARDRAIL</text>
  <text class="name" x="92" y="286">Inspect input</text>

  <rect x="72" y="340" width="360" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5"/>
  <text class="kind" x="92" y="364">MODEL</text>
  <text class="name" x="92" y="388">Generate a completion</text>

  <rect class="box" x="72" y="442" width="360" height="62" rx="10"/>
  <text class="kind" x="92" y="466">CONTENT GUARDRAIL</text>
  <text class="name" x="92" y="490">Inspect output</text>

  <rect x="72" y="544" width="360" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5"/>
  <text class="kind" x="92" y="568">OUTPUT</text>
  <text class="name" x="92" y="592">Return completion</text>

  <path class="edge" d="M252 198v32" marker-end="url(#lga-arrow)"/>
  <path class="edge" d="M252 300v32" marker-end="url(#lga-arrow)"/>
  <path class="edge" d="M252 402v32" marker-end="url(#lga-arrow)"/>
  <path class="edge" d="M252 504v32" marker-end="url(#lga-arrow)"/>

  <rect x="504" y="56" width="408" height="592" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="section" x="528" y="88">ENTIRE TOOL LOOP</text>
  <text class="note" x="528" y="110">Question: may this action run?</text>

  <rect class="box" x="528" y="136" width="360" height="62" rx="10"/>
  <text class="kind" x="548" y="160">MODEL</text>
  <text class="name" x="548" y="184">Propose a tool call</text>

  <rect x="528" y="238" width="360" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="548" y="262" fill="#C50E72">FOCUS · HARNESS</text>
  <text class="name" x="548" y="286" fill="#C50E72">Authorize this action</text>

  <rect class="box" x="528" y="340" width="168" height="62" rx="10"/>
  <text class="kind" x="548" y="364">RUNTIME</text>
  <text class="name" x="548" y="388">Execute</text>

  <rect x="720" y="340" width="168" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5"/>
  <text class="kind" x="740" y="364">OBSERVATION</text>
  <text class="name" x="740" y="388">Return evidence</text>

  <path class="edge" d="M708 198v32" marker-end="url(#lga-arrow)"/>
  <path class="edge" d="M612 300v32" marker-end="url(#lga-arrow)"/>
  <path class="edge" d="M696 371h16" marker-end="url(#lga-arrow)"/>
  <path class="edge" d="M804 340v-116a16 16 0 0 0-16-16H732" stroke-dasharray="2 6" marker-end="url(#lga-arrow)"/>
  <rect x="748" y="211" width="76" height="24" rx="6" fill="#F7F7F4"/>
  <text class="note" x="786" y="228" text-anchor="middle">next step</text>

  <text class="note" x="48" y="672">A text check guards a completion. The harness guards every side effect across the run.</text>

  <defs>
    <marker id="lga-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
