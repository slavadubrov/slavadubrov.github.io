<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="lvag-title lvag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="lvag-title">A content filter wraps one model call; an agent harness authorizes every action in the tool loop.</title><desc id="lvag-desc">Two stacked flows compare scope. The content-filter flow inspects text before and after a single model call: it checks the input, lets the model generate a completion, then checks the output. The harness flow covers the entire tool loop: the model proposes a tool call, the harness authorizes that specific action, the runtime executes it and returns evidence, and that evidence feeds the next proposed call.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="lvag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="lvag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="1000" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">A content filter versus a harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">One watches text around a single model call.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The other authorizes every action in the loop.</text>
<rect x="32" y="128" width="656" height="360" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1"/>
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">CONTENT FILTER · ONE MODEL CALL</text>
<path d="M58 192h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 192h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="209.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GUARDRAIL · BEFORE</text><text x="62" y="247" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Inspect input text</text>
<path d="M58 296h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 296h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="313.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODEL</text><text x="62" y="351" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Generate a completion</text>
<path d="M58 400h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 400h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GUARDRAIL · AFTER</text><text x="62" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Inspect output text</text>
<path d="M288 264v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#lvag-arrow-flow)"/>
<path d="M288 368v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#lvag-arrow-flow)"/>
<rect x="32" y="520" width="656" height="360" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1"/>
<text x="48" y="548" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">HARNESS · ENTIRE TOOL LOOP</text>
<path d="M58 584h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 584h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="601.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MODEL</text><text x="62" y="639" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Propose a tool call</text>
<path d="M58 688h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M58 688h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="62" y="705.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · HARNESS</text><text x="62" y="743" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Authorize this action</text>
<path d="M58 792h460a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 792h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="809.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">RUNTIME</text><text x="62" y="847" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Execute, return evidence</text>
<path d="M288 656v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#lvag-arrow-flow)"/>
<path d="M288 760v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#lvag-arrow-flow)"/>
<path d="M528 828h60v-208h-60" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#lvag-arrow-flow)"/><rect x="545" y="712" width="86" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="588" y="728.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">next step</text>
<path d="M32 920h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="946" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A content filter judges one exchange of text.</text>
<text x="32" y="968" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The harness judges — and can block — every action the exchange leads to.</text>
</svg>
