<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="guardev-title guardev-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="guardev-title">Guardrails versus online evaluations</title><desc id="guardev-desc">A guardrail runs inline in the request path and can block the response before it reaches the user. A sampled trace also branches to an asynchronous online evaluation that scores it, alerts on failure clusters, and can add a new golden case, all without delaying the response.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="guardev-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="guardev-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="600" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Two lanes, different placement</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Request path: milliseconds, may block.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Observation path: seconds to minutes, never blocks.</text>
<rect x="32" y="104" width="656" height="148" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1"/>
<text x="48" y="132" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">REQUEST PATH · MAY BLOCK</text>
<path d="M58 156h124a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-124a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M58 156h124a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-144a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9"/><text x="62" y="173.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">INPUT</text><text x="62" y="211" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#59645E">User request</text>
<path d="M218 156h124a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-124a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M218 156h124a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-144a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="222" y="173.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PROCESS</text><text x="222" y="211" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Agent run</text>
<path d="M378 156h124a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-124a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M378 156h124a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-144a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="382" y="173.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · INLINE</text><text x="382" y="211" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Guardrail</text>
<path d="M538 156h124a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-124a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M538 156h124a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-144a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5"/><text x="542" y="173.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">OUTPUT</text><text x="542" y="211" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Response</text>
<path d="M192 192h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#guardev-arrow-flow)"/>
<path d="M352 192h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#guardev-arrow-flow)"/>
<path d="M512 192h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#guardev-arrow-flow)"/>
<path d="M280 228v40h-134v68" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#guardev-arrow-flow)"/><rect x="155.5" y="256" width="115" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="213" y="272.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">sampled trace</text>
<rect x="32" y="284" width="656" height="180" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1"/>
<text x="48" y="312" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">OBSERVATION PATH · NEVER BLOCKS</text>
<path d="M58 336h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M58 336h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="62" y="353.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ASYNC EVAL</text><text x="62" y="397" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Score trace</text><text x="62" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">off the request path</text>
<path d="M270 336h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M270 336h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="274" y="353.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">MONITOR</text><text x="274" y="397" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Alert cluster</text><text x="274" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">confidence bounds</text>
<path d="M482 336h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/><path d="M482 336h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45"/><text x="486" y="353.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">DATASET</text><text x="486" y="397" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Add golden</text><text x="486" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">feeds offline suite</text>
<path d="M244 388h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#guardev-arrow-flow)"/>
<path d="M456 388h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#guardev-arrow-flow)"/>
<path d="M32 496h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Guardrails protect before delivery; online evals measure after delivery.</text>
<text x="32" y="544" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A judge run inline adds latency; a guardrail deferred to async lets violations through.</text>
</svg>
