<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="evlvl-title evlvl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="evlvl-title">Three levels of agent evaluation</title><desc id="evlvl-desc">Outcome evaluation checks whether the task succeeded, trajectory evaluation checks whether the path was sound, and component evaluation locates the tool or decision span that broke. Use all three views on both passing and failing runs.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="evlvl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="evlvl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="700" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Three views of one run</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Outcome, trajectory, and component evals answer different questions about the same run.</text>
<path d="M42 112h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M42 112h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OUTCOME</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Did the task succeed?</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Completion, final state, pass^k</text>
<path d="M360 216v72" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#evlvl-arrow-flow)"/><rect x="273" y="240" width="174" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="360" y="256.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">also inspect the path</text>
<path d="M42 288h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M42 288h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="46" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS · TRAJECTORY</text><text x="46" y="349" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Was the path sound?</text><text x="46" y="371" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tool order, arguments, loops</text>
<path d="M360 392v72" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#evlvl-arrow-flow)"/><rect x="214.5" y="416" width="291" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1"/><text x="360" y="432.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">locate failures with component checks</text>
<path d="M42 464h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M42 464h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="46" y="481.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">COMPONENT</text><text x="46" y="525" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Which span broke?</text><text x="46" y="547" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Per-span score, reading, attribution</text>
<path d="M32 600h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="626" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Use all three views for both passing and failing outcomes.</text>
<text x="32" y="648" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A passing outcome eval can still hide a broken trajectory underneath it.</text>
</svg>
