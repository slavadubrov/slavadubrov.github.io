<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="tvr-title tvr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tvr-title">A row versus a tree: where agent failures hide</title>
  <desc id="tvr-desc">A conventional language-model evaluation scores an input and final answer. An agent evaluation opens the trajectory and reveals that identity verification was skipped before a refund.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#F7F7F4"/>
  <text class="section" x="48" y="40">SAME REFUND REQUEST · TWO EVALUATION TARGETS</text>

  <rect x="48" y="64" width="384" height="448" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="kind" x="72" y="96">ROW · ANSWER ONLY</text>
  <text class="note" x="72" y="118">The path disappears; only the endpoints remain.</text>
  <rect class="box" x="72" y="152" width="336" height="96" rx="10"/>
  <text class="kind" x="92" y="186">INPUT</text>
  <text class="name" x="92" y="214">Refund order A-1002</text>
  <path class="edge" d="M240 248v40" marker-end="url(#tvr-arrow)"/>
  <rect class="box" x="72" y="296" width="336" height="96" rx="10"/>
  <text class="kind" x="92" y="330">OUTPUT</text>
  <text class="name" x="92" y="358">Refund processed</text>
  <path class="edge" d="M240 392v40" marker-end="url(#tvr-arrow)"/>
  <rect class="store" x="72" y="440" width="336" height="62" rx="10"/>
  <text class="kind" x="92" y="466">SCORE</text>
  <text class="name" x="92" y="488">Answer looks correct</text>

  <rect x="472" y="64" width="440" height="448" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="kind" x="496" y="96">TREE · FULL TRAJECTORY</text>
  <text class="note" x="496" y="118">Every decision and tool call stays visible.</text>
  <rect class="box" x="568" y="144" width="248" height="62" rx="10"/>
  <text class="kind" x="588" y="170">AGENT</text>
  <text class="name" x="588" y="192">Plan refund</text>
  <path class="edge" d="M692 206v34H572v32" marker-end="url(#tvr-arrow)"/>
  <path class="edge" d="M692 240h120v32" marker-end="url(#tvr-arrow)"/>
  <rect class="store" x="496" y="280" width="152" height="96" rx="10"/>
  <text class="kind" x="516" y="314">TOOL</text>
  <text class="name" x="516" y="342">Lookup order</text>
  <rect x="736" y="280" width="152" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="756" y="314" fill="#C50E72">MISSING STEP</text>
  <text class="name" x="756" y="342" fill="#C50E72">Verify identity</text>
  <path class="edge" d="M572 376v32h120v32" marker-end="url(#tvr-arrow)"/>
  <path class="edge" d="M812 376v32H692" stroke-dasharray="7 6" marker-end="url(#tvr-arrow)"/>
  <rect class="box" x="568" y="440" width="248" height="62" rx="10"/>
  <text class="kind" x="588" y="466">TOOL</text>
  <text class="name" x="588" y="488">Issue refund</text>

  <defs>
    <marker id="tvr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
