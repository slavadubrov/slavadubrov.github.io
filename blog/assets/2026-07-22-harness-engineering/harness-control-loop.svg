<path d="M32 400h736" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="426" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Both checks passed on the recorded commit.</text>
<text x="32" y="448" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The model proposes. The harness owns permission and completion.</text>
