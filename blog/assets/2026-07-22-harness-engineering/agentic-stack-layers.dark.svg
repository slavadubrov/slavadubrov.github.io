<path d="M400 184v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#asl-arrow-flow)"/>
<path d="M42 216h716a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M42 216h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="46" y="233.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PART 1 · REASONING LOOP</text><text x="46" y="271" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Choose the next move from available context</text>
<path d="M400 288v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#asl-arrow-flow)"/><text x="416" y="310.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="start">proposed call</text>
<rect x="32" y="336" width="736" height="168" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="48" y="362" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">HARNESS — ONE PROGRAM, FOUR RESPONSIBILITIES</text>
