<text x="32" y="770" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Context enters through memory; contracts and permissions rule on the proposal.</text>
<text x="32" y="792" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Only the acceptance gate can end the run — the runtime executes and stores, and its results become next-turn context.</text>
</svg>
