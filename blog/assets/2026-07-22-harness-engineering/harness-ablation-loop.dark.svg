<text x="32" y="962" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A component earns its place only when the treatment's lift in the target metric repays its added cost.</text>
<text x="32" y="984" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Run one ablation per hypothesis; do not let guards accumulate un-measured.</text>
</svg>
