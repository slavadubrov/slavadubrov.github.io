<path d="M32 736h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tests collect events directly; the HTTP route frames them as SSE and persists only after</text>
<text x="32" y="784" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">streaming completes. No tool call yields done(stop); the step cap yields done(max_steps),</text>
<text x="32" y="806" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">a completed but truncated outcome.</text>
