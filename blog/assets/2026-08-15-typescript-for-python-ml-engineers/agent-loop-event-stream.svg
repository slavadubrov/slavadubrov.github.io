<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 768" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="loop-title">A hand-written agent loop exposes a typed event stream</title>
  <desc id="loop-desc">A model streams chunks into a fragment buffer. The loop assembles calls, parses and validates them, runs valid tools, and appends tool messages to message history before the next step. Invalid input becomes a tool error in the same history instead of terminating the loop. The focused AgentEvent async generator feeds the HTTP route and tests. After streaming, the HTTP route writes the final run result.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #59645e; }
    .box { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .store { fill: #f2f2f5; stroke: #17211b; stroke-width: 1.5; }
    .edge { stroke: #59645e; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="768" rx="14" fill="#f7f7f4"/>
  <text class="name" x="48" y="44">One loop step, then a stable interface</text>
  <text class="note" x="48" y="68">Repair stays inside the loop. Consumers see typed events instead of model-provider chunks.</text>

  <rect x="48" y="96" width="864" height="336" rx="12" fill="none" stroke="#d8ddd9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="section" x="68" y="120">RUNAGENT · ONE STEP</text>

  <rect x="68" y="144" width="160" height="96" rx="10" fill="#ffffff" stroke="#59645e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="kind" x="88" y="178">EXTERNAL</text><text class="name" x="88" y="206" fill="#59645e">Model stream</text>
  <rect class="store" x="268" y="144" width="176" height="96" rx="10"/>
  <text class="kind" x="288" y="178">STORE</text><text class="name" x="288" y="206">Call fragments</text>
  <rect class="box" x="484" y="144" width="176" height="96" rx="10"/>
  <text class="kind" x="504" y="178">PROCESS</text><text class="name" x="504" y="206">Parse + validate</text>
  <rect class="box" x="700" y="144" width="192" height="96" rx="10"/>
  <text class="kind" x="720" y="178">PROCESS</text><text class="name" x="720" y="206">Run valid tool</text>

  <path class="edge" d="M228 192h32" marker-end="url(#loop-arrow)"/>
  <rect x="220" y="164" width="48" height="20" rx="6" fill="#f7f7f4"/><text class="note" x="244" y="179" text-anchor="middle">chunks</text>
  <path class="edge" d="M444 192h32" marker-end="url(#loop-arrow)"/>
  <rect x="444" y="164" width="40" height="20" rx="6" fill="#f7f7f4"/><text class="note" x="464" y="179" text-anchor="middle">index</text>
  <path class="edge" d="M660 192h32" marker-end="url(#loop-arrow)"/>
  <rect x="656" y="164" width="40" height="20" rx="6" fill="#f7f7f4"/><text class="note" x="676" y="179" text-anchor="middle">valid</text>

  <rect class="store" x="268" y="304" width="392" height="96" rx="10"/>
  <text class="kind" x="288" y="338">STORE</text><text class="name" x="288" y="366">Assistant + tool message history</text>
  <path class="edge" d="M796 240v112H668" marker-end="url(#loop-arrow)"/>
  <rect x="700" y="324" width="104" height="20" rx="6" fill="#f7f7f4"/><text class="note" x="752" y="339" text-anchor="middle">tool result</text>
  <path class="edge" d="M572 240v40H464v16" stroke-dasharray="7 6" marker-end="url(#loop-arrow)"/>
  <rect x="476" y="260" width="176" height="24" rx="6" fill="#f7f7f4"/><text class="note" x="564" y="277" text-anchor="middle">invalid → tool error</text>
  <path class="edge" d="M268 352H148V248" marker-end="url(#loop-arrow)"/>
  <rect x="144" y="320" width="88" height="20" rx="6" fill="#f7f7f4"/><text class="note" x="188" y="335" text-anchor="middle">next step</text>
  <text class="note" x="68" y="416">No tool call yields done(stop); the step cap yields done(max_steps), a completed but truncated outcome.</text>

  <path class="edge" d="M464 400v64" stroke-dasharray="2 6" marker-end="url(#loop-arrow)"/>
  <rect x="376" y="432" width="176" height="24" rx="6" fill="#f7f7f4"/><text class="note" x="464" y="449" text-anchor="middle">yield after each change</text>
  <rect x="260" y="472" width="440" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5"/>
  <text class="kind" x="280" y="506" fill="#c50e72">FOCUS · ASYNC GENERATOR</text>
  <text class="name" x="280" y="534" fill="#c50e72">AgentEvent stream</text>
  <text class="note" x="448" y="534" fill="#c50e72">text · tool_call · tool_result · done · error</text>

  <path class="edge" d="M480 568v40H196v24M480 608v24"/>
  <rect x="356" y="592" width="248" height="24" rx="6" fill="#f7f7f4"/><text class="note" x="480" y="609" text-anchor="middle">same events, two consumers</text>
  <rect class="box" x="68" y="640" width="256" height="62" rx="10"/>
  <text class="kind" x="88" y="664">PROCESS</text><text class="name" x="176" y="680">HTTP route</text>
  <rect class="box" x="352" y="640" width="256" height="62" rx="10"/>
  <text class="kind" x="372" y="664">PROCESS</text><text class="name" x="460" y="680">Test harness</text>
  <rect class="store" x="636" y="640" width="256" height="62" rx="10"/>
  <text class="kind" x="656" y="664">STORE</text><text class="name" x="720" y="680">Run result</text>

  <path class="edge" d="M196 702v24h568v-16" marker-end="url(#loop-arrow)"/>
  <rect x="366" y="710" width="228" height="24" rx="6" fill="#f7f7f4"/><text class="note" x="480" y="727" text-anchor="middle">final text, after the stream</text>
  <text class="note" x="48" y="752">Tests collect events directly; the HTTP route frames them as SSE and persists only after streaming completes.</text>

  <defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645e"/></marker></defs>
</svg>
