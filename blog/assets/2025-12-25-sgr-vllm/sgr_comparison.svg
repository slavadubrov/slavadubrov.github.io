<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="comparison-title comparison-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="comparison-title">Prompt engineering, chain of thought, and schema-guided reasoning compared</title>
  <desc id="comparison-desc">Three aligned columns compare output form, control mechanism, and application fit. Schema-guided reasoning is highlighted because constrained decoding blocks schema-invalid output, while semantic errors still require validation.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#F7F7F4"/>
  <text class="kind" x="48" y="48">COMPARISON · SAME REQUEST, DIFFERENT CONTROL</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10"/>
  <text class="kind" x="68" y="106">APPROACH · PROMPT</text>
  <text class="name" x="68" y="135">Prompt engineering</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10"/>
  <text class="kind" x="372" y="106">APPROACH · COT</text>
  <text class="name" x="372" y="135">Chain of thought</text>
  <rect x="656" y="72" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="676" y="106" fill="#C50E72">FOCUS · SGR</text>
  <text class="name" x="676" y="135" fill="#C50E72">Schema-guided</text>

  <text class="kind" x="48" y="216">OUTPUT FORM</text>
  <text class="note" x="48" y="244">variable text</text>
  <text class="note" x="352" y="244">free-form reasoning prose</text>
  <text class="note" x="656" y="244">rigid JSON / Pydantic</text>
  <path d="M48 264h864" stroke="#D8DDD9"/>

  <text class="kind" x="48" y="300">CONTROL</text>
  <text class="note" x="48" y="328">semantic persuasion</text>
  <text class="note" x="352" y="328">heuristic step prompting</text>
  <text class="note" x="656" y="328">grammar mask per token</text>
  <path d="M48 348h864" stroke="#D8DDD9"/>

  <text class="kind" x="48" y="384">APPLICATION FIT</text>
  <text class="note" x="48" y="412">parser must recover fields</text>
  <text class="note" x="352" y="412">a reader must interpret prose</text>
  <text class="note" x="656" y="412">fields validate; meaning still checked</text>
</svg>
