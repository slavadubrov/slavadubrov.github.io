<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 590" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="to-title to-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="to-title">Tool definitions can consume the context before work begins</title><desc id="to-desc">Reported observations: a large MCP setup used 143 thousand tokens, about 40 MCP tools used 55 thousand, ten JSON schemas are estimated at 5.5 to 14 thousand, and skill metadata uses about 100 tokens.</desc>
  <style data-visual-system="byte-diagram-v1">*{animation: none !important}.kind{font:600 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;fill:#59645E}.name{font:600 18px 'Space Grotesk',ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 14px 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;fill:#59645E}.box{fill:#FFFFFF;stroke:#17211B;stroke-width:1.5}</style>
  <rect width="400" height="590" rx="14" fill="#F7F7F4"/><text class="kind" x="24" y="34">DEFINITION OVERHEAD</text><text class="note" x="24" y="55">Reported examples, not one benchmark</text>
  <rect x="24" y="80" width="352" height="100" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><text class="kind" x="44" y="108" fill="#C50E72">FOCUS · MCP</text><text class="name" x="44" y="135" fill="#C50E72">Large setup · 143K</text><rect x="44" y="148" width="300" height="12" rx="6" fill="#F2148E"/><text class="note" x="44" y="174">72% of a 200K context window</text>
  <rect class="box" x="24" y="196" width="352" height="100" rx="10"/><text class="kind" x="44" y="224">MCP</text><text class="name" x="44" y="251">About 40 tools · 55K</text><rect x="44" y="264" width="115" height="12" rx="6" fill="#17211B"/><text class="note" x="44" y="290">Schemas loaded before the task</text>
  <rect class="box" x="24" y="312" width="352" height="100" rx="10"/><text class="kind" x="44" y="340">JSON SCHEMAS</text><text class="name" x="44" y="367">Ten tools · 5.5–14K</text><rect x="44" y="380" width="30" height="12" rx="6" fill="#17211B"/><text class="note" x="44" y="406">Estimate from 550–1,400 per tool</text>
  <rect class="box" x="24" y="428" width="352" height="100" rx="10"/><text class="kind" x="44" y="456">PROGRESSIVE LOAD</text><text class="name" x="44" y="483">Skill metadata · ~100</text><circle cx="50" cy="500" r="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><text class="note" x="66" y="505">Instructions load when active</text><path d="M24 550H376" stroke="#D8DDD9"/><text class="note" x="24" y="574">MCP and JSON costs depend on the harness.</text>
</svg>
