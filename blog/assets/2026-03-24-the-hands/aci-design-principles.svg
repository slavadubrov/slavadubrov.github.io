<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 610" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="aci-title aci-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="aci-title">Four principles for an agent-computer interface</title><desc id="aci-desc">A vertical ACI loop: design an action, keep calls compact, return concise feedback, and validate. Invalid input returns evidence from validation to the Action node. Validation is highlighted.</desc>
  <defs><marker id="arrow-signal" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M0 0L7 3.5L0 7z" fill="#F2148E"/></marker></defs>
  <style data-visual-system="byte-diagram-v1">*{animation: none !important}.kind{font:600 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;fill:#59645E}.name{font:600 18px 'Space Grotesk',ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 14px 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;fill:#59645E}.box{fill:#FFFFFF;stroke:#17211B;stroke-width:1.5}.num{font:600 14px 'IBM Plex Mono',ui-monospace,monospace;fill:#FFFFFF}.edge{stroke:#59645E;stroke-width:1.5;fill:none}</style>
  <rect width="400" height="610" rx="14" fill="#F7F7F4"/><text class="kind" x="24" y="34">ACI LOOP</text><text class="note" x="24" y="55">Make the next action easy to correct</text>
  <circle cx="42" cy="94" r="14" fill="#17211B"/><text class="num" x="42" y="99" text-anchor="middle">1</text><rect class="box" x="68" y="64" width="308" height="60" rx="10"/><text class="kind" x="88" y="89">ACTION</text><text class="name" x="88" y="112">Simple actions</text><path class="edge" d="M200 124v20"/>
  <circle cx="42" cy="174" r="14" fill="#17211B"/><text class="num" x="42" y="179" text-anchor="middle">2</text><rect class="box" x="68" y="144" width="308" height="60" rx="10"/><text class="kind" x="88" y="169">EFFICIENCY</text><text class="name" x="88" y="192">Compact calls</text><path class="edge" d="M200 204v20"/>
  <circle cx="42" cy="254" r="14" fill="#17211B"/><text class="num" x="42" y="259" text-anchor="middle">3</text><rect class="box" x="68" y="224" width="308" height="60" rx="10"/><text class="kind" x="88" y="249">FEEDBACK</text><text class="name" x="88" y="272">Concise results</text><path class="edge" d="M200 284v20"/>
  <circle cx="42" cy="334" r="14" fill="#17211B"/><text class="num" x="42" y="339" text-anchor="middle">4</text><rect x="68" y="304" width="308" height="60" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><text class="kind" x="88" y="329" fill="#C50E72">FOCUS · VALIDATION</text><text class="name" x="88" y="352" fill="#C50E72">Stop bad state</text>
  <path d="M376 334h8V94h-8" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#arrow-signal)"/><text class="note" x="24" y="482" fill="#C50E72">Invalid input returns evidence to the Action node.</text><path d="M24 514H376" stroke="#D8DDD9"/><text class="note" x="24" y="540">Validation keeps malformed I/O from</text><text class="note" x="24" y="561">becoming the next action.</text><text class="note" x="24" y="590">Source: SWE-agent ablation; conditions differ.</text>
</svg>
