<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ce-title ce-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ce-title">Traditional tool calls repeat through context; code execution returns one summary</title><desc id="ce-desc">Traditional calling sends each result from context back to the model before the next call. Code execution can keep intermediate data out of model context and return one summary.</desc>
  <style data-visual-system="byte-diagram-v1">*{animation: none !important}.kind{font:600 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.2px;fill:#59645E}.name{font:600 18px 'Space Grotesk',ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 14px 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;fill:#59645E}.box{fill:#FFFFFF;stroke:#17211B;stroke-width:1.5}.store{fill:#F2F2F5;stroke:#17211B;stroke-width:1.5}.edge{stroke:#59645E;stroke-width:1.5;fill:none}</style><defs><marker id="ce-arrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#59645E"/></marker></defs>
  <rect width="480" height="680" rx="14" fill="#F7F7F4"/><text class="kind" x="24" y="34">TRADITIONAL</text><text class="note" x="24" y="55">Every result re-enters context</text>
  <rect class="box" x="24" y="76" width="352" height="72" rx="10"/><text class="kind" x="44" y="104">MODEL</text><text class="name" x="44" y="130">Choose one call</text><path class="edge" d="M200 148v16"/>
  <rect x="24" y="164" width="352" height="72" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5"/><text class="kind" x="44" y="192">EXTERNAL</text><text class="name" x="44" y="218">Tool or API</text><path class="edge" d="M200 236v16"/>
  <rect class="store" x="24" y="252" width="352" height="72" rx="10"/><text class="kind" x="44" y="280">CONTEXT</text><text class="name" x="44" y="306">Raw result returns</text><path d="M376 288H448V112H376" class="edge" marker-end="url(#ce-arrow)"/><text class="kind" x="388" y="190">RETURN</text><text class="kind" x="388" y="206">TO MODEL</text>
  <path d="M24 380H456" stroke="#D8DDD9"/><text class="kind" x="24" y="412">CODE EXECUTION</text><text class="note" x="24" y="433">Intermediate data can stay out of model context</text>
  <rect class="box" x="24" y="454" width="352" height="72" rx="10"/><text class="kind" x="44" y="482">MODEL</text><text class="name" x="44" y="508">Write one program</text><path class="edge" d="M200 526v16"/>
  <rect class="store" x="24" y="542" width="352" height="72" rx="10"/><text class="kind" x="44" y="570">SANDBOX</text><text class="name" x="44" y="596">Run calls and process rows</text><path class="edge" d="M200 614v16"/>
  <rect x="24" y="630" width="352" height="32" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><text class="name" x="44" y="654" fill="#C50E72">FOCUS · Return one summary</text>
</svg>
