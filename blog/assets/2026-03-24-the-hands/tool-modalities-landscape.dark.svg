<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tm-title tm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tm-title">Five interfaces for agent tool use</title><desc id="tm-desc">A mobile-first comparison of JSON tool calling, MCP, Skills, command-line tools, and code execution. Code execution is highlighted for multi-step orchestration.</desc>
  <style data-visual-system="byte-diagram-v1">*{animation: none !important}.kind{font:600 12px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 18px 'Space Grotesk',ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 14px 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.box{fill:#141D19;stroke:#EDF5F0;stroke-width:1.5}</style>
  <rect width="400" height="640" rx="14" fill="#0C1210"/><text class="kind" x="24" y="34">INTERFACE MAP</text><text class="note" x="24" y="55">Choose by the shape of the work</text>
  <rect class="box" x="24" y="76" width="352" height="88" rx="10"/><text class="kind" x="44" y="104">ATOMIC CALLS</text><text class="name" x="44" y="130">JSON tool calling</text><text class="note" x="44" y="151">Typed request and response</text>
  <rect class="box" x="24" y="180" width="352" height="88" rx="10"/><text class="kind" x="44" y="208">SHARED INTEGRATION</text><text class="name" x="44" y="234">MCP</text><text class="note" x="44" y="255">Discovery and transport</text>
  <rect class="box" x="24" y="284" width="352" height="88" rx="10"/><text class="kind" x="44" y="312">PROCEDURE</text><text class="name" x="44" y="338">Skills</text><text class="note" x="44" y="359">Instructions on demand</text>
  <rect class="box" x="24" y="388" width="352" height="88" rx="10"/><text class="kind" x="44" y="416">LOCAL OPERATION</text><text class="name" x="44" y="442">CLI and shell</text><text class="note" x="44" y="463">Composable commands</text>
  <rect x="24" y="492" width="352" height="88" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/><text class="kind" x="44" y="520" fill="#FF6FB6">FOCUS · MULTI-STEP WORK</text><text class="name" x="44" y="546" fill="#FF6FB6">Code execution</text><text class="note" x="44" y="567">Loops and conditionals</text><path d="M24 600H376" stroke="#2B3B33"/><text class="note" x="24" y="622">Policy and logging belong to the harness.</text>
</svg>
