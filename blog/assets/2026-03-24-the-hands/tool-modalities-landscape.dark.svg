<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="tmd-title tmd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tmd-title">Five interfaces for agent tool use</title>
  <desc id="tmd-desc">A comparison of JSON tool calling, MCP, Skills, command-line tools, and code execution by what each interface carries, where it fits, and its typical context overhead. Code execution is highlighted for multi-step orchestration.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210"/>
  <text class="section" x="48" y="44">INTERFACE MAP — CHOOSE BY THE SHAPE OF THE WORK</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10"/>
  <text class="kind" x="68" y="100">ATOMIC CALLS</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150">Typed request/response · 550–1,400 schema tokens per tool</text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10"/>
  <text class="kind" x="520" y="100">SHARED INTEGRATION</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150">Discovery + transport · load only the tools the task needs</text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10"/>
  <text class="kind" x="68" y="236">PROCEDURE</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Instructions on demand · about 100 startup metadata tokens</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10"/>
  <text class="kind" x="520" y="236">LOCAL OPERATION</text>
  <text class="name" x="520" y="262">CLI and shell</text>
  <text class="note" x="520" y="286">Composable commands · low schema overhead</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/>
  <text class="kind" x="294" y="372" fill="#FF6FB6">FOCUS · MULTI-STEP WORK</text>
  <text class="name" x="294" y="398" fill="#FF6FB6">Code execution</text>
  <text class="note" x="294" y="422">Loops and conditionals · final summary returns to context</text>
  <path d="M48 472H912" stroke="#2B3B33" stroke-width="1"/>
  <text class="note" x="48" y="490">Protocol does not set policy: authentication, authorization, logging, and sandboxing still belong to the harness.</text>
</svg>
