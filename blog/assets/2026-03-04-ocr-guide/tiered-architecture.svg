<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Production OCR with confidence-based tiered routing</title>
  <desc id="artifact-desc">PDFs first test whether the embedded text layer is usable. Valid native text goes to post-processing; images and failed text checks continue through rasterization, local OCR, stronger models, and finally review.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="720" rx="14" fill="#f8fafc"/>
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">Production OCR: tiered routing</text>
  <text x="48" y="74" font-size="14" fill="#64748b">Calibrate each quality gate on labeled document classes</text>

  <g transform="translate(48 280)">
    <rect width="142" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="71" y="34" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Incoming</text>
    <text x="71" y="55" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">documents</text>
    <text x="71" y="79" font-size="13" fill="#64748b" text-anchor="middle">PDF, images</text>
  </g>
  <line x1="190" y1="330" x2="218" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#blue-arrow)"/>

  <g transform="translate(230 270)">
    <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="85" y="30" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Tier 0: native text</text>
    <text x="85" y="56" font-size="13" fill="#64748b" text-anchor="middle">Usable text layer?</text>
    <text x="85" y="78" font-size="13" fill="#64748b" text-anchor="middle">Check order + coverage</text>
    <text x="85" y="100" font-size="13" fill="#64748b" text-anchor="middle">Images → No</text>
  </g>

  <g transform="translate(454 98)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#2563eb"/>
    <text x="135" y="27" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 1: fast local path</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">PaddleOCR / Tesseract</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">Rasterize + preprocess</text>
    <text x="135" y="116" font-size="13" fill="#64748b" text-anchor="middle">CPU-only, clean print</text>
    <text x="135" y="139" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">Measure pass rate</text>
  </g>

  <g transform="translate(454 276)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#ea580c"/>
    <text x="135" y="27" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 2: stronger model</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Qwen3-VL / dots.ocr</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">or Gemini 3 Flash</text>
    <text x="135" y="116" font-size="13" fill="#64748b" text-anchor="middle">Layout and degraded images</text>
    <text x="135" y="139" font-size="13" font-weight="600" fill="#9a3412" text-anchor="middle">Measure pass rate</text>
  </g>

  <g transform="translate(454 454)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#7c3aed"/>
    <text x="135" y="27" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 3: review path</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Gemini 3 Pro / GPT-5.2</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">Hosted VLM or second model</text>
    <text x="135" y="116" font-size="13" fill="#64748b" text-anchor="middle">Complex layouts, handwriting</text>
    <text x="135" y="139" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle">Measure review rate</text>
  </g>

  <path d="M 400 330 H 426 V 173 H 454" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <text x="414" y="318" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">No</text>
  <path d="M 315 270 V 86 H 1002 V 104" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="330" y="102" font-size="12" font-weight="700" fill="#166534">Yes: native text</text>
  <line x1="724" y1="173" x2="758" y2="173" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>

  <g transform="translate(770 125)">
    <rect width="132" height="96" rx="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="66" y="40" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Quality gate</text>
    <text x="66" y="61" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">passes?</text>
  </g>
  <path d="M 902 173 H 910 V 206 H 920" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="910" y="160" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>
  <path d="M 836 221 V 254 H 426 V 351 H 454" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/>
  <text x="850" y="244" font-size="13" font-weight="700" fill="#dc2626">No</text>

  <line x1="724" y1="351" x2="758" y2="351" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/>
  <g transform="translate(770 303)">
    <rect width="132" height="96" rx="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="66" y="40" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Quality gate</text>
    <text x="66" y="61" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">passes?</text>
  </g>
  <path d="M 902 351 H 910 V 336 H 920" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="910" y="338" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Yes</text>
  <path d="M 836 399 V 432 H 426 V 529 H 454" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)"/>
  <text x="850" y="422" font-size="13" font-weight="700" fill="#dc2626">No</text>

  <path d="M 724 529 H 900 V 490 H 920" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)"/>

  <g transform="translate(920 104)">
    <rect width="164" height="500" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="82" y="44" font-size="17" font-weight="700" fill="#166534" text-anchor="middle">Post-process</text>
    <text x="82" y="76" font-size="13" fill="#0f172a" text-anchor="middle">Schema validation</text>
    <text x="82" y="116" font-size="13" fill="#0f172a" text-anchor="middle">Confidence filtering</text>
    <text x="82" y="156" font-size="13" fill="#0f172a" text-anchor="middle">Spell check / LM</text>
    <line x1="30" y1="190" x2="134" y2="190" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="82" y="226" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Structured</text>
    <text x="82" y="248" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Output</text>
    <text x="82" y="276" font-size="13" fill="#0f172a" text-anchor="middle">JSON / Markdown</text>
    <line x1="30" y1="304" x2="134" y2="304" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="82" y="340" font-size="13" fill="#991b1b" text-anchor="middle">Unresolved or</text>
    <text x="82" y="361" font-size="13" fill="#991b1b" text-anchor="middle">high-risk fields:</text>
    <rect x="18" y="400" width="128" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="82" y="426" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Human review</text>
    <text x="82" y="464" font-size="12" fill="#64748b" text-anchor="middle">Audit trail logged</text>
  </g>

  <g transform="translate(48 650)">
    <rect width="1036" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="130" y="35" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">Track CPU cost</text>
    <text x="390" y="35" font-size="13" font-weight="600" fill="#9a3412" text-anchor="middle">Track GPU/API cost</text>
    <text x="650" y="35" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle">Track retry cost</text>
    <text x="906" y="35" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">Track review cost</text>
  </g>
</svg>
