<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1184" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="tieredarch-title tieredarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tieredarch-title">Production OCR routes documents through calibrated fallback tiers, escalating from native text to fast OCR to a stronger model, and reserving human review for unresolved or high-risk fields.</title><desc id="tieredarch-desc">Documents first check for a usable native text layer; failing that, they pass through fast local OCR gated by calibrated confidence, then escalate to a stronger specialized or general model when the gate fails. Passing routes converge on post-processing and structured output. Only unresolved or high-risk fields reach human review, and reviewed results feed back into the same structured output.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tieredarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="tieredarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="1184" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Escalate only when a gate fails</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Native text and passing confidence gates skip straight to structured output; only unresolved or high-risk fields reach a human.</text>
