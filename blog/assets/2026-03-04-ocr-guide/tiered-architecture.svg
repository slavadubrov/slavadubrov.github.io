<path d="M32 1104h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="1130" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Calibrate every gate by document class, field criticality, and labeled outcomes.</text>
<text x="32" y="1152" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Human review is the most expensive tier — reserve it for what the model gates cannot resolve.</text>
</svg>
