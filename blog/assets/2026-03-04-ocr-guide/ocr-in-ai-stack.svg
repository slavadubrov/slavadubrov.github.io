<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">OCR in the modern AI stack</title>
  <desc id="artifact-desc">Document sources flow through text and structure extraction into retrieval systems, agents, enterprise question answering, and domain applications.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c"/>
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="960" height="560" rx="14" fill="#f8fafc"/>
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">OCR in the modern AI stack</text>
  <text x="48" y="74" font-size="14" fill="#64748b">From raw documents to AI-powered insights</text>

  <g transform="translate(48 108)">
    <rect width="240" height="38" rx="8" fill="#2563eb"/>
    <text x="120" y="25" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Document sources</text>

    <g transform="translate(0 50)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff"/>
      <text x="38" y="37" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">PDF</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">PDFs &amp; Word docs</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Contracts, reports, manuals</text>
    </g>
    <g transform="translate(0 124)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff"/>
      <text x="38" y="37" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">SCAN</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">Scanned documents</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Invoices, receipts, forms</text>
    </g>
    <g transform="translate(0 198)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff"/>
      <text x="38" y="37" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">PHOTO</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">Photos &amp; screenshots</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Whiteboards, signs, UI</text>
    </g>
    <g transform="translate(0 272)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff"/>
      <text x="38" y="37" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">MAIL</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">Emails &amp; attachments</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Embedded images, PDFs</text>
    </g>
  </g>

  <line x1="288" y1="296" x2="350" y2="296" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>

  <g transform="translate(360 108)">
    <rect width="240" height="38" rx="8" fill="#ea580c"/>
    <text x="120" y="25" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">OCR layer</text>
    <rect y="50" width="240" height="336" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="120" y="79" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">Text + structure extraction</text>

    <g transform="translate(14 94)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Traditional OCR</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">Tesseract, PaddleOCR</text>
    </g>
    <g transform="translate(14 150)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">VLMs</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">Gemini, Claude, GPT</text>
    </g>
    <g transform="translate(14 206)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Specialized Models</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">dots.ocr, Qwen3-VL</text>
    </g>
    <g transform="translate(14 262)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Layout Analysis</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">Tables, headers, lists</text>
    </g>

    <line x1="120" y1="313" x2="120" y2="320" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)"/>
    <rect x="24" y="328" width="192" height="54" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="120" y="347" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">Output: Clean text, tables,</text>
    <text x="120" y="370" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">structure, and metadata</text>
  </g>

  <line x1="600" y1="296" x2="662" y2="296" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)"/>

  <g transform="translate(672 108)">
    <rect width="240" height="38" rx="8" fill="#7c3aed"/>
    <text x="120" y="25" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Downstream systems</text>

    <g transform="translate(0 50)">
      <rect width="240" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="120" y="26" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">RAG Pipelines</text>
      <text x="120" y="48" font-size="12" fill="#64748b" text-anchor="middle">Chunk → Embed → Vector DB</text>
      <text x="120" y="65" font-size="12" fill="#64748b" text-anchor="middle">→ Retrieve → LLM Answer</text>
    </g>
    <g transform="translate(0 138)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="120" y="27" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">AI Agents</text>
      <text x="120" y="48" font-size="12" fill="#64748b" text-anchor="middle">Document reading, form filling</text>
    </g>
    <g transform="translate(0 212)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="120" y="27" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">Enterprise QA</text>
      <text x="120" y="48" font-size="12" fill="#64748b" text-anchor="middle">Contract search, compliance, KBs</text>
    </g>
    <g transform="translate(0 286)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="120" y="27" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">Domain Applications</text>
      <text x="120" y="48" font-size="12" fill="#64748b" text-anchor="middle">Medical, legal, financial</text>
    </g>
  </g>

  <g transform="translate(144 494)">
    <rect width="672" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="336" y="21" font-size="14" font-weight="600" fill="#9a3412" text-anchor="middle">Missing text or structure constrains downstream quality</text>
    <text x="336" y="39" font-size="12" fill="#64748b" text-anchor="middle">Evaluate extraction before retrieval, generation, and agent decisions.</text>
  </g>
</svg>
