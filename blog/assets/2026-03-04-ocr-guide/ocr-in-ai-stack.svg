<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="ocrstack-title ocrstack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ocrstack-title">OCR quality constrains every downstream document system, and lost information cannot be recovered later.</title><desc id="ocrstack-desc">Documents and images pass through an extraction-quality step; the resulting text-and-layout record is the only evidence available to retrieval and answering, agent decisions, and domain workflows downstream. Dropped or garbled text at extraction cannot be recovered by later stages.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ocrstack-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="ocrstack-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="704" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">OCR quality constrains every downstream document system</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Retrieval, agents, and workflows can only use the evidence extraction preserved.</text>
<path d="M234 112h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M234 112h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9"/><text x="238" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">EXTERNAL</text><text x="238" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E">Documents and images</text>
<path d="M360 184v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ocrstack-arrow-flow)"/>
<path d="M234 208h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M234 208h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="238" y="225.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS</text><text x="238" y="269" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Extraction quality</text><text x="238" y="291" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The constraint on everything below</text>
<path d="M360 312v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ocrstack-arrow-flow)"/>
<path d="M234 336h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/><path d="M234 336h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45"/><text x="238" y="353.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">STORE</text><text x="238" y="397" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Text + layout evidence</text><text x="238" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Persists after extraction runs</text>
<path d="M360 440v40H136v40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ocrstack-arrow-flow)"/>
<path d="M360 440v80" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ocrstack-arrow-flow)"/>
<path d="M360 440v40H584v40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#ocrstack-arrow-flow)"/>
<path d="M42 520h188a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M42 520h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5"/><text x="46" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">RAG</text><text x="46" y="575" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Retrieve and answer</text>
<path d="M266 520h188a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M266 520h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5"/><text x="270" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">AGENT</text><text x="270" y="575" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Agent decisions</text>
<path d="M490 520h188a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M490 520h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5"/><text x="494" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">WORKFLOW</text><text x="494" y="575" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Domain workflows</text>
<path d="M32 624h656" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="650" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Dropped text or structure leaves no evidence for retrieval, generation, or action.</text>
<text x="32" y="672" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">OCR is retrieval and agent infrastructure, not a preprocessing step you can skip evaluating.</text>
</svg>
