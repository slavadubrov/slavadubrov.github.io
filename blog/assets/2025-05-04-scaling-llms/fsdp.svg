<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="fsdp-title fsdp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fsdp-title">Fully sharded data parallel execution</title>
  <desc id="fsdp-desc">Each rank keeps parameter, gradient, and optimizer shards. Only parameter shards enter the all-gather before forward and backward computation; the gradient reduce-scatter returns a gradient shard to each rank while optimizer state stays local.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="680" rx="14" fill="#F7F7F4"/>
  <text class="kind" x="48" y="44">PERSISTENT SHARDS · TRANSIENT LAYER VIEW</text>

  <g>
    <rect class="box" x="48" y="64" width="192" height="112" rx="10" fill="#F2F2F5"/>
    <text class="kind" x="68" y="96">RANK 0 · STORE</text><text class="name" x="68" y="120">P₀ parameter</text><text class="note" x="68" y="142">G₀ gradient</text><text class="note" x="68" y="162">O₀ optimizer · local</text>
    <rect class="box" x="272" y="64" width="192" height="112" rx="10" fill="#F2F2F5"/>
    <text class="kind" x="292" y="96">RANK 1 · STORE</text><text class="name" x="292" y="120">P₁ parameter</text><text class="note" x="292" y="142">G₁ gradient</text><text class="note" x="292" y="162">O₁ optimizer · local</text>
    <rect class="box" x="496" y="64" width="192" height="112" rx="10" fill="#F2F2F5"/>
    <text class="kind" x="516" y="96">RANK 2 · STORE</text><text class="name" x="516" y="120">P₂ parameter</text><text class="note" x="516" y="142">G₂ gradient</text><text class="note" x="516" y="162">O₂ optimizer · local</text>
    <rect class="box" x="720" y="64" width="192" height="112" rx="10" fill="#F2F2F5"/>
    <text class="kind" x="740" y="96">RANK 3 · STORE</text><text class="name" x="740" y="120">P₃ parameter</text><text class="note" x="740" y="142">G₃ gradient</text><text class="note" x="740" y="162">O₃ optimizer · local</text>
  </g>
  <path class="edge" d="M144 176v24h336v40M368 176v64M592 176v64H480M816 176v24H480v40"/>
  <path class="edge" d="M480 200v32" marker-end="url(#fsdp-arrow)"/>
  <rect x="382" y="207" width="196" height="22" fill="#F7F7F4"/>
  <text class="note" x="392" y="224">parameter shards Pᵢ</text>

  <rect x="352" y="240" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="372" y="274" fill="#C50E72">COLLECTIVE</text>
  <text class="name" x="372" y="302" fill="#C50E72">All-gather layer group</text>
  <path class="edge" d="M480 336v40" marker-end="url(#fsdp-arrow)"/>

  <rect class="box" x="352" y="384" width="256" height="62" rx="10" fill="#FFFFFF"/>
  <text class="kind" x="372" y="408">PROCESS</text><text class="name" x="372" y="432">Forward + backward</text>
  <path class="edge" d="M480 446v40" marker-end="url(#fsdp-arrow)"/>

  <rect class="box" x="352" y="494" width="256" height="62" rx="10" fill="#FFFFFF"/>
  <text class="kind" x="372" y="518">COLLECTIVE</text><text class="name" x="372" y="542">Reduce-scatter gradients</text>
  <path class="edge" d="M384 556v36H144V142M448 556v52H368V142M512 556v52H592V142M576 556v36H816V142" marker-end="url(#fsdp-arrow)"/>
  <text class="note" x="48" y="648">Layer grouping trades peak memory against collective size and overlap.</text>
  <defs><marker id="fsdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E"/></marker></defs>
</svg>
