<text x="32" y="610" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Pandas: ~365s on PDS-H SF-10 (eager, in-memory baseline).</text>
<text x="32" y="632" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Polars: ~3.89s on PDS-H SF-10 (multi-threaded, lazy, streaming).</text>
