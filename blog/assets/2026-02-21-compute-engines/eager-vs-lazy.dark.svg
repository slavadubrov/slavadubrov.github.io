<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Eager and lazy execution</title><desc id="eagerlazy-desc">An eager pipeline reads all columns, then makes a full copy in RAM at each of filter, groupby, and result, using 2 to 3x the dataset size in memory. A lazy engine builds a query plan from scan, filter, and group_by, an optimizer applies predicate pushdown and column pruning, then collect() executes once in parallel with streaming batches. Pandas takes about 365 seconds on a PDS-H SF-10 benchmark; Polars takes about 3.89 seconds.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="eagerlazy-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="eagerlazy-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
