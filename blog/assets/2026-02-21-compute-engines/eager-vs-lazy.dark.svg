<path d="M184 392h76a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-76a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M184 392h76a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-96a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="188" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PLAN</text><text x="188" y="439" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">.filter()</text>
