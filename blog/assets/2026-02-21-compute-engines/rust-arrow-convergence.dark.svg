<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rustarrow-title rustarrow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rustarrow-title">Native execution and Arrow-compatible exchange</title><desc id="rustarrow-desc">Four engines — Polars, DataFusion, Daft, Ray Data — sit on a shared foundation of Rust-native components and the Apache Arrow columnar format, which together give no tracing garbage collector, cheaper zero-copy exchange via the PyCapsule interface, and compile-time-checked concurrency. The exact runtime and copy behavior differ by engine and operator.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rustarrow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="rustarrow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="640" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Native execution and Arrow-compatible exchange</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">The exact runtime and copy behavior differ by engine and operator.</text>
