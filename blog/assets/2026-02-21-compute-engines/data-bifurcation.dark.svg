<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="bifurc-title bifurc-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="bifurc-title">Two worlds of data</title><desc id="bifurc-desc">Structured tabular data is usually CPU-heavy and fits on one machine; multimodal AI data is accelerator-heavy and expands from one row into thousands of chunks and embeddings. Choose with an end-to-end test on representative data.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="bifurc-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="bifurc-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="520" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Two worlds of data</text>
<rect x="32" y="96" width="312" height="360" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1"/>
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">STRUCTURED DATA</text>
<rect x="376" y="96" width="312" height="360" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1"/>
<text x="392" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">MULTIMODAL AI</text>
<path d="M58 140h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M58 140h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="62" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU</text><text x="62" y="195" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Rows and columns</text>
<path d="M402 140h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M402 140h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0"/><text x="406" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GPU</text><text x="406" y="195" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Images, video, audio, tensors</text>
<text x="48" y="240" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Usually CPU-heavy: filters, joins, aggregations.</text>
<text x="48" y="264" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Scale after measurement — one large node may be</text>
<text x="48" y="284" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">enough for many analytical queries.</text>
<text x="392" y="240" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Often accelerator-heavy: throughput follows the</text>
<text x="392" y="264" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">slowest stage in the pipeline.</text>
<text x="392" y="284" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Expanding pipelines: one PDF row can expand into</text>
<text x="392" y="304" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">thousands of chunks and embeddings.</text>
<path d="M58 340h260a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M58 340h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621"/><text x="62" y="357.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">HANDLES THIS ON ONE MACHINE</text><text x="62" y="397" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Polars / DuckDB / DataFusion</text><text x="62" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">test a scale-up path first</text>
<path d="M402 340h260a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5"/><path d="M402 340h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621"/><text x="406" y="357.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXPOSE MIXED RESOURCE CONTROLS</text><text x="406" y="407" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Ray Data / Daft</text>
<path d="M32 476h656" stroke="#2B3B33" stroke-width="1"/>
<text x="32" y="502" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Choose with an end-to-end test on representative data.</text>
</svg>
