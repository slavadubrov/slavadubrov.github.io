<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Context Layer Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Context Layer Architecture</title>
  <desc>Diagram: Context Layer Components.</desc>

<style>
    .bg { fill: #F7F7F4; }
    .node { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 8; ry: 8; }
    .node-text { fill: #17211B; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #59645E; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; background-color: #59645E; }
    .title { fill: #17211B; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .group-label { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: start; }
    .accent-green { stroke: #59645E; }
    .accent-red { stroke: #17211B; }
    .accent-yellow { stroke: #59645E; }
    .accent-purple { stroke: #17211B; }
    .accent-orange { stroke: #59645E; }
    .accent-cyan { stroke: #17211B; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
</defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

<rect width="100%" height="100%" class="bg"/>

<text y="40" class="title" x="400">Context Layer Architecture (7 Components)</text>

<!-- Groups -->
<!-- Static Context -->
<g transform="translate(50, 80)">
    <rect x="0" y="0" width="220" height="250" rx="10" ry="10" style="fill: none; stroke: #D8DDD9; stroke-dasharray: 5 5"/>
    <text y="30" class="group-label" style="fill: #59645E" x="20">1. Steering (Static)</text>

    <g transform="translate(35, 60)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Instructions</text>
    </g>
    <g transform="translate(35, 150)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Examples</text>
    </g>
</g>

<!-- Dynamic Context -->
<g transform="translate(290, 80)">
    <rect x="0" y="0" width="220" height="340" rx="10" ry="10" style="fill: #59645E; stroke: #59645E; stroke-dasharray: 5 5" class="visual-focus"/>
    <text y="30" class="group-label" style="fill: #59645E" x="20">2. Data (Dynamic)</text>

    <g transform="translate(35, 60)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Knowledge (RAG)</text>
    </g>
    <g transform="translate(35, 150)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Memory</text>
    </g>
    <g transform="translate(35, 240)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Skills</text>
    </g>
</g>

<!-- Execution & Safety -->
<g transform="translate(530, 80)">
    <rect x="0" y="0" width="220" height="250" rx="10" ry="10" style="fill: none; stroke: #D8DDD9; stroke-dasharray: 5 5"/>
    <text y="30" class="group-label" style="fill: #59645E" x="20">3. Controls</text>

    <g transform="translate(35, 60)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Tools</text>
    </g>
    <g transform="translate(35, 150)">
        <rect x="0" y="0" width="150" height="60" class="node" style="stroke: #59645E"/>
        <text y="30" class="node-text" x="75">Guardrails</text>
    </g>
</g>

<!-- Assembly Engine -->
<g transform="translate(200, 450)">
    <rect x="0" y="0" width="400" height="80" class="node" style="stroke: #17211B; fill: #FFFFFF"/>
    <text y="40" class="node-text" style="font-size: 16px; font-weight: bold; fill: #59645E" x="200">Context Assembly Engine</text>
</g>

<!-- Edges -->
<!-- From Groups to Engine -->
<path d="M160 330 L250 450" class="edge"/>
<path d="M400 420 L400 450" class="edge"/>
<path d="M640 330 L550 450" class="edge"/>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
