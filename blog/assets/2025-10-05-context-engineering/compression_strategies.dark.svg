<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Loss-aware context compression with separate canonical state and artifact indexes</title>
  <desc id="desc">Conversation and observations are summarized into a compact working set, while canonical task state, evidence references, and artifact history remain stored separately for exact recovery.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0C1210"/><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">Compress prose; preserve recoverable state</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#141D19" stroke="#EDF5F0"/><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Growing context</text><text x="30" y="83" font-size="13" fill="#EDF5F0">conversation turns</text><text x="30" y="116" font-size="13" fill="#EDF5F0">raw tool observations</text><text x="30" y="149" font-size="13" fill="#EDF5F0">retrieved passages</text><text x="30" y="182" font-size="13" fill="#EDF5F0">repeated boilerplate</text></g><text x="325" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#141D19" stroke="#EDF5F0"/><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Compact working set</text><text x="30" y="83" font-size="13" fill="#EDF5F0">decisions + next action</text><text x="30" y="116" font-size="13" fill="#EDF5F0">typed tool findings</text><text x="30" y="149" font-size="13" fill="#EDF5F0">source + artifact refs</text><text x="30" y="182" font-size="13" fill="#EDF5F0">unresolved questions</text></g><text x="665" y="225" font-size="25" fill="#EDF5F0">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus"/><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Canonical stores</text><text x="30" y="83" font-size="13" fill="#EDF5F0">task state</text><text x="30" y="116" font-size="13" fill="#EDF5F0">file and artifact index</text><text x="30" y="149" font-size="13" fill="#EDF5F0">full tool results</text><text x="30" y="182" font-size="13" fill="#EDF5F0">evidence versions</text><text x="30" y="225" font-size="12" fill="#EDF5F0">Re-fetch exact details</text><text x="30" y="247" font-size="12" fill="#EDF5F0">when the task needs them.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#EDF5F0">Optimize total tokens per successful task, including re-fetch and recovery.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
