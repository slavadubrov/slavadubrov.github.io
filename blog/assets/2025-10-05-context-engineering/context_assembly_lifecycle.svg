<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">The lifecycle runs per decision — reusing one big context for an entire run</text>
<text x="32" y="624" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">creates stale evidence and gives every step material it does not need.</text>
</svg>
