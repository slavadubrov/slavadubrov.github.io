<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 616" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="window-title window-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="window-title">Five typed items assemble the context window before the model generates.</title><desc id="window-desc">The context window is the model's current input plus generated tokens, not a durable memory system. A ContextItem schema types each assembled item as instruction, task_state, evidence, memory, or tool. The model then reads the assembled input and generates new tokens that are appended to the window.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="window-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="window-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="720" height="616" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Five typed items assemble the context window</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">ContextItem.kind: instruction, task_state, evidence, memory, tool.</text>
