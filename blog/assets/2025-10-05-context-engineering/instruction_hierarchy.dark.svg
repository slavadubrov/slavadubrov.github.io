<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">Instruction authority is provider-specific, so a universal role hierarchy is a mistake; application code is the shared enforcement boundary.</title><desc id="instr-desc">OpenAI’s Model Spec ranks platform or system, developer, and user instructions by authority. The Anthropic Messages API exposes a top-level system parameter and user and assistant messages with no equivalent developer role. Regardless of provider role names, application code authorizes tools, data access, and side effects.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
