<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="MCP Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">MCP Architecture</title>
  <desc>Diagram: Mcp Context Architecture.</desc>

<style>
    .bg { fill: #F7F7F4; }
    .node { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 8; ry: 8; }
    .node-text { fill: #17211B; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .edge { stroke: #59645E; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .label { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; background-color: #59645E; }
    .title { fill: #17211B; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .group-label { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: start; }
    .accent-green { stroke: #59645E; }
    .accent-red { stroke: #17211B; }
    .accent-yellow { stroke: #59645E; }
    .accent-purple { stroke: #17211B; }
    .accent-orange { stroke: #59645E; }
</style>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
</defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

<rect width="100%" height="100%" class="bg"/>

<text y="30" class="title" x="400">Model Context Protocol (MCP) Architecture</text>

<!-- Host -->
<g transform="translate(300, 200)">
    <rect x="0" y="0" width="200" height="100" class="node visual-focus" style="stroke: #59645E; fill: #59645E"/>
    <text y="40" class="node-text" style="fill: #59645E; font-weight: bold" x="100">MCP Host</text>
    <text y="70" class="node-text" style="fill: #59645E; font-size: 12px" x="100">(Agent / LLM App)</text>
</g>

<!-- Servers -->
<g transform="translate(50, 50)">
    <rect x="0" y="0" width="140" height="60" class="node" style="stroke: #59645E"/>
    <text y="30" class="node-text" x="70">Filesystem Server</text>
</g>

<g transform="translate(600, 50)">
    <rect x="0" y="0" width="140" height="60" class="node" style="stroke: #59645E"/>
    <text y="30" class="node-text" x="70">Database Server</text>
</g>

<g transform="translate(50, 390)">
    <rect x="0" y="0" width="140" height="60" class="node" style="stroke: #59645E"/>
    <text y="30" class="node-text" x="70">Slack/API Server</text>
</g>

<g transform="translate(600, 390)">
    <rect x="0" y="0" width="140" height="60" class="node" style="stroke: #59645E"/>
    <text y="30" class="node-text" x="70">Memory Server</text>
</g>

<!-- Connections -->
<path d="M190 80 L300 200" class="edge"/>
<path d="M600 80 L500 200" class="edge"/>
<path d="M190 420 L300 300" class="edge"/>
<path d="M600 420 L500 300" class="edge"/>

<!-- Labels -->
<text y="130" class="label" x="230">Resources</text>
<text y="130" class="label" x="580">Prompts</text>
<text y="380" class="label" x="230">Tools</text>
<text y="380" class="label" x="580">Context</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
