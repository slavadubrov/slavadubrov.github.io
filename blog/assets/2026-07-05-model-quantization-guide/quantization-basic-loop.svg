<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="basicloop-title basicloop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="basicloop-title">One weight value traced through quantization and dequantization</title><desc id="basicloop-desc">A weight of 0.40, from a tensor with a maximum magnitude of 2.10, is scaled by s = 2.10 / 7 = 0.30, rounded to the integer 1, stored in 4-bit form, and dequantized back to 0.30 for the matrix multiply — a rounding error of 0.10 against the original value.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="basicloop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B"/></marker><marker id="basicloop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E"/></marker></defs>
<rect width="800" height="344" rx="14" fill="#F7F7F4"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Quantization is controlled rounding</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tracking one value through the loop shows where the error comes from.</text>
<path d="M42 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/><path d="M42 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45"/><text x="46" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">STORE</text><text x="46" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Original weight</text><text x="46" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">x = 0.40</text><text x="46" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">max |x| = 2.10</text><circle cx="32" cy="136" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2"/><text x="32" y="140.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M230 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5"/><path d="M230 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B"/><text x="234" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PROCESS</text><text x="234" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Compute scale</text><text x="234" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">s = 2.10 / 7</text><text x="234" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">= 0.30</text><circle cx="220" cy="136" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2"/><text x="220" y="140.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M418 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5"/><path d="M418 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45"/><text x="422" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">STORE</text><text x="422" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Quantize value</text><text x="422" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">round(0.40/0.30)</text><text x="422" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">= 1</text><circle cx="408" cy="136" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2"/><text x="408" y="140.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M606 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/><path d="M606 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E"/><text x="610" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS</text><text x="610" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Dequant + GEMM</text><text x="610" y="209" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">1 × 0.30 = 0.30</text><text x="610" y="229" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">error: 0.10</text><circle cx="596" cy="136" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2"/><text x="596" y="140.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">4</text>
<path d="M204 188h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#basicloop-arrow-flow)"/>
<path d="M392 188h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#basicloop-arrow-flow)"/>
<path d="M580 188h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#basicloop-arrow-flow)"/>
<path d="M32 264h736" stroke="#D8DDD9" stroke-width="1"/>
<text x="32" y="290" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Rounding 0.40 to the nearest representable value costs 0.10 once dequantized.</text>
<text x="32" y="312" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">GPTQ and AWQ choose scales that minimize this error across a whole layer, not one value.</text>
</svg>
