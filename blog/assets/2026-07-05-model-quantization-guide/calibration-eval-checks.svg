<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="calibration-title calibration-desc" shape-rendering="geometricPrecision"
     text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="calibration-title">Calibration and evaluation checks for quantized models</title>
  <desc id="calibration-desc">Representative production samples feed calibration, quantization, and a target-runtime serving test. A deployment gate then checks quality, long-context behavior, speed, and memory.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="calibration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#f7f7f4"/>
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">QUANTIZATION · DEPLOYMENT VALIDATION</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">A checkpoint that loads has not passed the deployment gate</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Calibrate and test on the target workload, runtime, and hardware.</text>

  <path d="M240 200H272" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#calibration-arrow)"/>
  <path d="M464 200H496" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#calibration-arrow)"/>
  <path d="M688 200H720" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#calibration-arrow)"/>
  <path d="M816 248V300a20 20 0 0 1-20 20H480v32" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#calibration-arrow)"/>

  <rect x="48" y="152" width="192" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5"/>
  <text x="68" y="184" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · TRAFFIC SET</text>
  <text x="68" y="214" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Traffic samples</text>
  <text x="68" y="236" fill="#59645e" font-size="13">RAG · SQL · code · chat</text>

  <rect x="272" y="152" width="192" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5"/>
  <text x="292" y="184" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESS · CALIBRATE</text>
  <text x="292" y="214" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Calibrate ranges</text>
  <text x="292" y="236" fill="#59645e" font-size="13">Redacted · matched lengths</text>

  <rect x="496" y="152" width="192" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5"/>
  <text x="516" y="184" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESS · QUANTIZE</text>
  <text x="516" y="214" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Choose precision</text>
  <text x="516" y="236" fill="#59645e" font-size="13">GPTQ · AWQ · FP8 · INT8</text>

  <rect x="720" y="152" width="192" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5"/>
  <text x="740" y="184" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESS · SERVE TEST</text>
  <text x="740" y="214" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Target runtime</text>
  <text x="740" y="236" fill="#59645e" font-size="13">Hardware · workload shape</text>

  <text x="160" y="334" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ACCEPT ONLY AFTER BOTH CHECK GROUPS PASS</text>
  <rect x="160" y="352" width="640" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5"/>
  <text x="184" y="384" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCUS · DEPLOY GATE</text>
  <text x="184" y="414" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Quality · tasks · long context</text>
  <text x="512" y="414" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Throughput · TTFT · ITL · memory</text>
  <text x="184" y="436" fill="#59645e" font-size="13">Perplexity delta · regressions · generation samples</text>
</svg>
