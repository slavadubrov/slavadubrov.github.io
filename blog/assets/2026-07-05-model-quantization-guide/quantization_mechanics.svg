<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%" role="img" aria-label="Quantization Mechanics: Weight-Only vs. Weight-Activation" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Quantization Mechanics: Weight-Only vs. Weight-Activation</title>
  <desc>Diagram: Quantization Mechanics.</desc>
  <defs>
    <!-- Drop Shadow Filter -->

    <!-- Gradients -->




  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="850" height="520" fill="#F7F7F4" rx="12" />

  <!-- Title -->
  <text y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B" x="30">
    Weight-Only (W4A16) vs. Weight-Activation (W8A8/FP8)
  </text>
  <text y="60" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#17211B" x="30">
    Comparison of GPU memory-transfer, register processing, and tensor core utilization
  </text>

  <!-- Divider Line -->
  <line x1="425" y1="90" x2="425" y2="490" stroke="#59645E" stroke-dasharray="5,5" stroke-width="2" />

  <!-- SECTION 1: WEIGHT-ONLY (W4A16) -->
  <g>
    <!-- Subtitle -->
    <rect x="30" y="90" width="365" height="30" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="6" />
    <text y="110" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#17211B" x="212.5">
      A. Weight-Only Quantization (e.g., W4A16 GPTQ/AWQ)
    </text>
    <text y="142" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="212.5">
      Optimizes Memory-Bound Decode (Low Batch / Single Stream)
    </text>

    <!-- GPU VRAM (HBM) -->
    <rect x="50" y="160" width="320" height="75" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8" />
    <text y="180" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="210">GPU VRAM (HBM)</text>

    <!-- weights box -->
    <rect x="65" y="192" width="135" height="30" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" x="132.5">Weights (4-bit)</text>
    <!-- activations box -->
    <rect x="220" y="192" width="135" height="30" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" x="287.5">Activations (16-bit BF16)</text>

    <!-- Data Flow Arrows -->
    <path d="M 132.5 235 L 132.5 272" fill="none" stroke="#59645E" stroke-width="2.5" marker-end="url(#arrow-orange)" />
    <path d="M 287.5 235 L 287.5 272" fill="none" stroke="#17211B" stroke-width="2.5" marker-end="url(#arrow-blue)" />

    <!-- GPU Compute Block -->
    <rect x="50" y="285" width="320" height="150" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8"  class="visual-focus"/>
    <text y="305" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="210">SRAM / Register Execution</text>

    <!-- Dequantization Step -->
    <rect x="65" y="320" width="135" height="40" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="132.5">Dequantize in-kernel</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="132.5">4-bit INT → 16-bit FP</text>

    <!-- Activations path (Unchanged) -->
    <rect x="220" y="320" width="135" height="40" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="287.5">Keep as 16-bit</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="287.5">No dequantization</text>

    <!-- Arrow from Dequant to Tensor Core -->
    <path d="M 132.5 360 L 132.5 388 C 132.5 400, 180 400, 195 400" fill="none" stroke="#59645E" stroke-dasharray="3,3" stroke-width="1.5" />

    <!-- Activations entry line -->
    <path d="M 287.5 285 L 287.5 320" fill="none" stroke="#17211B" stroke-width="1.5" />

    <!-- Activations bypass dequant -->
    <path d="M 287.5 360 L 287.5 388 C 287.5 400, 240 400, 225 400" fill="none" stroke="#17211B" stroke-width="1.5" />

    <!-- Math execution box -->
    <rect x="180" y="385" width="60" height="35" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="406" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" x="210">BF16 TC</text>
    <text y="445" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="210">Weights math is 16-bit</text>

    <!-- Bottom Note -->
    <rect x="50" y="450" width="320" height="40" fill="#FFFFFF" stroke="#59645E" rx="6" />
    <text y="466" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B" x="210">Compute bottleneck remains active:</text>
    <text y="478" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="210">VRAM savings are realized, but no compute speedup.</text>
  </g>

  <!-- SECTION 2: WEIGHT-ACTIVATION (W8A8/FP8) -->
  <g transform="translate(425, 0)">
    <!-- Subtitle -->
    <rect x="30" y="90" width="365" height="30" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="6" />
    <text y="110" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#17211B" x="212.5">
      B. Weight-Activation Quantization (W8A8 / FP8)
    </text>
    <text y="142" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="212.5">
      Accelerates Compute-Bound Prefill (High Concurrency / Serving)
    </text>

    <!-- GPU VRAM (HBM) -->
    <rect x="50" y="160" width="320" height="75" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8" />
    <text y="180" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="210">GPU VRAM (HBM)</text>

    <!-- weights box -->
    <rect x="65" y="192" width="135" height="30" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" x="132.5">Weights (8-bit)</text>
    <!-- activations box -->
    <rect x="220" y="192" width="135" height="30" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="211" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" x="287.5">Activations (8-bit)</text>

    <!-- Data Flow Arrows -->
    <path d="M 132.5 235 L 132.5 280" fill="none" stroke="#59645E" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <path d="M 287.5 235 L 287.5 280" fill="none" stroke="#59645E" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- GPU Compute Block -->
    <rect x="50" y="285" width="320" height="150" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8" />
    <text y="305" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="210">SRAM / Register Execution</text>

    <!-- Pass Directly to Tensor Cores (Weights) -->
    <rect x="65" y="320" width="135" height="40" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="132.5">No dequant overhead</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="132.5">Direct hardware feed</text>

    <!-- Pass Directly to Tensor Cores (Activations) -->
    <rect x="220" y="320" width="135" height="40" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" rx="4" />
    <text y="337" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="287.5">No dequant overhead</text>
    <text y="350" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="287.5">Direct hardware feed</text>

    <!-- Arrow from Weights to Tensor Core -->
    <path d="M 132.5 360 L 132.5 388 C 132.5 400, 180 400, 195 400" fill="none" stroke="#59645E" stroke-width="1.5" />

    <!-- Arrow from Activations to Tensor Core -->
    <path d="M 287.5 360 L 287.5 388 C 287.5 400, 240 400, 225 400" fill="none" stroke="#59645E" stroke-width="1.5" />

    <!-- Math execution box -->
    <rect x="180" y="385" width="60" height="35" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="406" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" x="210">INT8/FP8</text>
    <text y="445" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="210">Executed directly in HW</text>

    <!-- Bottom Note -->
    <rect x="50" y="450" width="320" height="40" fill="#FFFFFF" stroke="#59645E" rx="6" />
    <text y="466" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B" x="210">Full hardware acceleration:</text>
    <text y="478" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="210">Unlocks 2x theoretical Tensor Core throughput (TOPS).</text>
  </g>

  <!-- Markers -->
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F2F2F5" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F2F2F5" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F2F2F5" />
    </marker>
  </defs>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
