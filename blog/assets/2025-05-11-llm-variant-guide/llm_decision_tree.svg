<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="workflow-title">Checkpoint, runtime, and quantization selection workflow</title>
  <desc id="workflow-desc">A six-step snake flow fixes the task contract, selects an exact checkpoint, verifies a supported runtime, measures a memory budget, chooses a representation, and benchmarks the complete release unit. The release benchmark is the focus.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .detail { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4"/>

  <circle cx="62" cy="60" r="14" fill="#17211B"/><text class="marker-num" x="62" y="65" text-anchor="middle">1</text>
  <circle cx="370" cy="60" r="14" fill="#17211B"/><text class="marker-num" x="370" y="65" text-anchor="middle">2</text>
  <circle cx="678" cy="60" r="14" fill="#17211B"/><text class="marker-num" x="678" y="65" text-anchor="middle">3</text>

  <rect class="box" x="48" y="88" width="248" height="96" rx="10"/>
  <text class="kind" x="68" y="116">TASK</text>
  <text class="name" x="68" y="142">Task contract</text>
  <text class="detail" x="68" y="166">quality · license · context</text>
  <rect class="box" x="356" y="88" width="248" height="96" rx="10"/>
  <text class="kind" x="376" y="116">CHECKPOINT</text>
  <text class="name" x="376" y="142">Exact revision</text>
  <text class="detail" x="376" y="166">model · tokenizer · template</text>
  <rect class="box" x="664" y="88" width="248" height="96" rx="10"/>
  <text class="kind" x="684" y="116">RUNTIME</text>
  <text class="name" x="684" y="142">Supported executor</text>
  <text class="detail" x="684" y="166">architecture · kernels</text>

  <path class="edge" d="M296 136h52" marker-end="url(#workflow-arrow)"/>
  <path class="edge" d="M604 136h52" marker-end="url(#workflow-arrow)"/>
  <path class="edge" d="M788 184v88" marker-end="url(#workflow-arrow)"/>

  <circle cx="678" cy="252" r="14" fill="#17211B"/><text class="marker-num" x="678" y="257" text-anchor="middle">4</text>
  <circle cx="370" cy="252" r="14" fill="#17211B"/><text class="marker-num" x="370" y="257" text-anchor="middle">5</text>
  <circle cx="62" cy="252" r="14" fill="#17211B"/><text class="marker-num" x="62" y="257" text-anchor="middle">6</text>

  <rect class="store" x="664" y="280" width="248" height="96" rx="10"/>
  <text class="kind" x="684" y="308">BUDGET</text>
  <text class="name" x="684" y="334">Measured memory</text>
  <text class="detail" x="684" y="358">weights · KV · headroom</text>
  <rect class="store" x="356" y="280" width="248" height="96" rx="10"/>
  <text class="kind" x="376" y="308">ARTIFACT</text>
  <text class="name" x="376" y="334">Representation</text>
  <text class="detail" x="376" y="358">precision · quant · provenance</text>
  <rect x="48" y="280" width="248" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="68" y="308" fill="#C50E72">FOCUS · RELEASE</text>
  <text class="name" x="68" y="334" fill="#C50E72">Release benchmark</text>
  <text class="detail" x="68" y="358" fill="#C50E72">quality · latency · peak memory</text>

  <path class="edge" d="M664 328h-52" marker-end="url(#workflow-arrow)"/>
  <path class="edge" d="M356 328h-52" marker-end="url(#workflow-arrow)"/>

  <path d="M48 416H912" stroke="#D8DDD9" stroke-width="1"/>
  <text class="note" x="48" y="452">Benchmark the exact checkpoint, conversion, runtime, and hardware together.</text>
  <text class="note" x="48" y="480">Changing any one of them creates a new release unit to test.</text>

  <defs>
    <marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
