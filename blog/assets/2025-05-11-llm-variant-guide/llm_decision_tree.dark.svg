<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ldt-title ldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ldt-title">Checkpoint, runtime, and quantization selection workflow</title><desc id="ldt-desc">A six-step flow fixes the task contract, selects an exact checkpoint, verifies a supported runtime, establishes a measured memory budget, chooses a representation, and benchmarks the release unit. The release benchmark is the focus, and changing any step creates a new release unit to test.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="ldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="496" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">A selection workflow that survives new formats</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Six steps, in order. Changing any one creates a new release unit to benchmark.</text>
