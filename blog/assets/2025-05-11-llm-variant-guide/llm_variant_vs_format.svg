<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Six independent layers in an open-weight model artifact</title>
  <desc id="layers-desc">Six aligned nodes separate family and revision, training role, architecture, numeric representation, container and layout, and runtime and hardware. Container and layout is the focus because a format name is only one layer of the artifact.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#F7F7F4"/>

  <text class="section" x="48" y="48">MODEL ARTIFACT — READ EACH LAYER SEPARATELY</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10"/>
  <text class="kind" x="68" y="114">LAYER 1</text>
  <text class="name" x="68" y="142">Family + revision</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10"/>
  <text class="kind" x="364" y="114">LAYER 2</text>
  <text class="name" x="364" y="142">Training role</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10"/>
  <text class="kind" x="660" y="114">LAYER 3</text>
  <text class="name" x="660" y="142">Architecture</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10"/>
  <text class="kind" x="68" y="250">LAYER 4</text>
  <text class="name" x="68" y="278">Numeric representation</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="364" y="250" fill="#C50E72">FOCUS · LAYER 5</text>
  <text class="name" x="364" y="278" fill="#C50E72">Container + layout</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10"/>
  <text class="kind" x="660" y="250">LAYER 6</text>
  <text class="name" x="660" y="278">Runtime + hardware</text>

  <path d="M48 360H912" stroke="#D8DDD9" stroke-width="1"/>
  <text class="kind" x="48" y="392">EXAMPLES</text>
  <text class="note" x="48" y="420">GPTQ and AWQ describe quantization. GGUF and Safetensors describe packaging.</text>
  <text class="note" x="48" y="448">MoE describes execution structure. llama.cpp, vLLM, and Transformers execute supported artifacts.</text>
  <text class="note" x="48" y="476">A familiar suffix does not prove quality, memory fit, or serving speed.</text>
</svg>
