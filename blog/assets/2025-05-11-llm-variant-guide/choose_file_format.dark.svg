<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 746" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="cff-title cff-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cff-title">Choose a model container through a runtime-first compatibility gate</title><desc id="cff-desc">A runtime decision branches to llama.cpp, a GPU server or loader, or an edge or mobile runtime. Each branch leads to its supported artifact — a GGUF conversion, a repository artifact, or a supported export — and every path converges on one compatibility gate before benchmarking.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cff-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0"/></marker><marker id="cff-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6"/></marker></defs>
<rect width="720" height="746" rx="14" fill="#0C1210"/>
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Runtime first, then artifact</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Hardware alone cannot choose the container. Pick the runtime, then use the artifact layout it documents.</text>
<rect x="200" y="112" width="320" height="72" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2"/><text x="360" y="140" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">DECISION</text><text x="360" y="164" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" text-anchor="middle">Which runtime?</text>
