<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 736" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="variant-title variant-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="variant-title">Choose a model variant by separating role, provenance, and architecture</title>
  <desc id="variant-desc">Three stages keep training role, optional distillation provenance, and execution architecture separate. Base, instruct, and reasoning-tuned are role choices; distilled records provenance; dense and mixture of experts describe architecture. Every candidate ends at one release evaluation gate.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .stage { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="736" rx="14" fill="#F7F7F4"/>

  <rect x="48" y="64" width="864" height="128" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="stage" x="72" y="102">TRAINING ROLE</text>
  <text class="note" x="72" y="130">behavior target</text>
  <rect class="box" x="224" y="80" width="192" height="96" rx="10"/>
  <text class="kind" x="244" y="114">ROLE</text>
  <text class="name" x="244" y="142">Base</text>
  <rect class="box" x="456" y="80" width="192" height="96" rx="10"/>
  <text class="kind" x="476" y="114">ROLE</text>
  <text class="name" x="476" y="142">Instruct</text>
  <rect class="box" x="688" y="80" width="192" height="96" rx="10"/>
  <text class="kind" x="708" y="114">ROLE</text>
  <text class="name" x="708" y="142">Reasoning-tuned</text>

  <rect x="48" y="232" width="864" height="128" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="stage" x="72" y="270">OPTIONAL PROVENANCE</text>
  <text class="note" x="72" y="298">when transferred</text>
  <rect class="store" x="384" y="248" width="192" height="96" rx="10"/>
  <text class="kind" x="404" y="282">PROVENANCE</text>
  <text class="name" x="404" y="310">Distilled</text>

  <rect x="48" y="400" width="864" height="128" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="stage" x="72" y="438">ARCHITECTURE</text>
  <text class="note" x="72" y="466">execution shape</text>
  <rect class="box" x="288" y="416" width="192" height="96" rx="10"/>
  <text class="kind" x="308" y="450">ARCHITECTURE</text>
  <text class="name" x="308" y="478">Dense</text>
  <rect class="box" x="520" y="416" width="192" height="96" rx="10"/>
  <text class="kind" x="540" y="450">ARCHITECTURE</text>
  <text class="name" x="540" y="478">Mixture of experts</text>

  <path class="edge" d="M480 528v32" marker-end="url(#variant-arrow)"/>

  <rect x="328" y="568" width="304" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="348" y="602" fill="#C50E72">FOCUS · RELEASE GATE</text>
  <text class="name" x="348" y="630" fill="#C50E72">Evaluate the release unit</text>
  <text class="note" x="48" y="712">Measure task behavior, interface correctness, latency, and peak memory; labels never replace the evaluation.</text>

  <defs>
    <marker id="variant-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
