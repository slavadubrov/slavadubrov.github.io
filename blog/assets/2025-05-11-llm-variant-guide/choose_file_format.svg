<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" data-visual-system="evidence-plate-v1" font-family="Inter, system-ui, sans-serif">
  <title id="title">Choose a model container with a runtime-first compatibility gate</title>
  <desc id="desc">A stacked runtime-first decision map for narrow and wide screens. The llama.cpp path uses a supported GGUF conversion. A Transformers-style loader or GPU server uses its documented repository artifact. An edge or mobile runtime uses its supported export. Every path passes through compatibility and benchmark gates.</desc>
  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .stage { font-size: 21px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .copy { font-size: 18px; fill: #64748b; }
      .chip { font-size: 18px; font-weight: 600; }
      .note { font-size: 18px; fill: #166534; font-weight: 600; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="960" height="1040" rx="14" fill="#f8fafc"/>
  <text x="48" y="54" class="title">Choose the runtime before the container</text>
  <text x="48" y="86" class="subtitle">Hardware constrains backends and kernels. It does not select a format alone.</text>

  <rect x="144" y="118" width="672" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="149" text-anchor="middle" class="stage">Which runtime supports the architecture</text>
  <text x="480" y="176" text-anchor="middle" class="copy">and the required serving interface?</text>

  <path d="M480 194 V226" class="arrow"/>

  <rect x="96" y="236" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="270" class="label">Path 1 · llama.cpp / ggml executor</text>
  <rect x="124" y="288" width="104" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="176" y="312" text-anchor="middle" class="chip">GGUF</text>
  <text x="124" y="348" class="copy">Use a conversion for the exact architecture. Record source and converter revisions.</text>

  <path d="M480 378 V410" class="arrow"/>
  <rect x="96" y="420" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="454" class="label">Path 2 · Transformers-style loader or GPU server</text>
  <rect x="124" y="472" width="326" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="287" y="496" text-anchor="middle" class="chip">Documented repository artifact</text>
  <text x="124" y="532" class="copy">Use the documented files, configuration, quantization method, and kernels.</text>

  <path d="M480 562 V594" class="arrow"/>
  <rect x="96" y="604" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="124" y="638" class="label">Path 3 · edge or mobile runtime</text>
  <rect x="124" y="656" width="286" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="267" y="680" text-anchor="middle" class="chip">Runtime-supported export</text>
  <text x="124" y="716" class="copy">Use supported operators, dtypes, and quantization. Measure on the target device.</text>

  <path d="M480 746 V778" class="arrow"/>

  <rect x="96" y="788" width="768" height="126" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="124" y="824" class="stage">Compatibility gate</text>
  <text x="124" y="856" class="copy">Check architecture, loader version, kernels, hardware, model revision,</text>
  <text x="124" y="884" class="copy">and conversion provenance. A matching extension is not enough.</text>

  <path d="M480 914 V946" class="arrow"/>
  <rect x="132" y="956" width="696" height="46" rx="23" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="985" text-anchor="middle" class="note">Benchmark task quality, throughput, latency, and peak memory</text>
</svg>
