<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="uvi-title uvi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvi-title">Anatomy of a PEP 723 script</title>
  <desc id="uvi-desc">The fetch.py file contains inline Python and dependency metadata beside ordinary code. uv run reads the metadata and creates an isolated cached environment. An optional adjacent fetch.py.lock can supply an exact resolution. Plain Python ignores the metadata.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4"/>

  <rect x="48" y="48" width="400" height="368" rx="12" fill="none" stroke="#D8DDD9"/>
  <text class="section" x="72" y="76">FILE · FETCH.PY</text>

  <rect x="72" y="96" width="352" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5"/>
  <text class="kind" x="92" y="130" fill="#C50E72">FOCUS · PEP 723 METADATA</text>
  <text class="name" x="92" y="158" fill="#C50E72">Python + dependencies</text>
  <text class="note" x="92" y="178" fill="#C50E72">requires-python ≥3.12 · httpx ≥0.27,&lt;1</text>

  <rect class="process" x="72" y="232" width="352" height="96" rx="10"/>
  <text class="kind" x="92" y="266">CODE · PROCESS</text>
  <text class="name" x="92" y="294">Import + HTTP request</text>
  <text class="note" x="92" y="314">ordinary valid Python syntax</text>

  <path d="M72 368h24" stroke="#D8DDD9"/>
  <text class="note" x="108" y="373">The comment block and code ship together.</text>

  <rect class="process" x="560" y="96" width="352" height="96" rx="10"/>
  <text class="kind" x="580" y="130">RUNNER · PROCESS</text>
  <text class="name" x="580" y="158">uv run fetch.py</text>
  <text class="note" x="580" y="178">reads metadata before execution</text>

  <rect class="store" x="560" y="232" width="352" height="96" rx="10"/>
  <text class="kind" x="580" y="266">ENVIRONMENT · STORE</text>
  <text class="name" x="580" y="294">Isolated cache</text>
  <text class="note" x="580" y="314">resolved interpreter + packages</text>

  <rect class="store" x="560" y="368" width="352" height="62" rx="10"/>
  <text class="kind" x="580" y="392">OPTIONAL LOCK · STORE</text>
  <text class="name" x="580" y="415">fetch.py.lock</text>

  <path class="edge" d="M424 144h128" marker-end="url(#uvi-arrow)"/>
  <path class="edge" d="M736 192v32" marker-end="url(#uvi-arrow)"/>
  <path class="edge" d="M912 399h16V144h-12" stroke-dasharray="7 6" marker-end="url(#uvi-arrow)"/>
  <rect x="840" y="204" width="88" height="24" rx="6" fill="#F7F7F4"/>
  <text class="note" x="884" y="221" text-anchor="middle">when locked</text>

  <path d="M48 462h24" stroke="#D8DDD9"/>
  <text class="note" x="84" y="467">Plain python fetch.py ignores the metadata; a compatible runner owns this boundary.</text>

  <defs>
    <marker id="uvi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E"/>
    </marker>
  </defs>
</svg>
