<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 336" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ma-title ma-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="ma-title">FeatureStoreLite MCP-architectuur</title>
  <desc id="ma-desc">Een gebruikersverzoek komt binnen in Claude Desktop, dat een dedicated MCP-client beheert. De client verstuurt MCP-berichten via lokale standaardinvoer en -uitvoer naar de FeatureStoreLite FastMCP-server. De server leest en schrijft feature vectors in een lokale SQLite-database.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .owner { font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #59645e; }
    .box { stroke: #17211b; stroke-width: 1.5; fill: #ffffff; }
    .edge { stroke: #59645e; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1120" height="336" rx="14" fill="#f7f7f4" />

  <rect x="248" y="48" width="400" height="240" rx="12" fill="none" stroke="#d8ddd9" />
  <text class="owner" x="272" y="78">MCP-HOST · CLAUDE DESKTOP</text>

  <rect x="48" y="112" width="160" height="96" rx="10" fill="#ffffff" stroke="#59645e" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="146">EXTERN</text>
  <text class="name" x="68" y="174">Gebruikersverzoek</text>
  <text class="note" x="68" y="194">Vraag Claude</text>

  <rect class="box" x="272" y="112" width="152" height="96" rx="10" />
  <text class="kind" x="292" y="146">PROCESS</text>
  <text class="name" x="292" y="174">Claude Desktop</text>
  <text class="note" x="292" y="194">Hostapplicatie</text>

  <rect class="box" x="464" y="112" width="160" height="96" rx="10" />
  <text class="kind" x="484" y="146">PROCESS</text>
  <text class="name" x="484" y="174">Client per server</text>
  <text class="note" x="484" y="194">Protocolberichten</text>

  <rect x="688" y="112" width="184" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="708" y="146" fill="#c50e72">FOCUS</text>
  <text class="name" x="708" y="174" fill="#c50e72">FeatureStoreLite</text>
  <text class="note" x="708" y="194">FastMCP-server</text>

  <rect x="912" y="112" width="160" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="932" y="146">OPSLAG</text>
  <text class="name" x="932" y="174">features.db</text>
  <text class="note" x="932" y="194">SQLite-rijen</text>

  <path class="edge" d="M208 160h56" marker-end="url(#ma-arrow)" />
  <path class="edge" d="M424 160h32" marker-end="url(#ma-arrow)" />
  <path class="edge" d="M624 160h56" marker-end="url(#ma-arrow)" />
  <path class="edge" d="M872 160h32" marker-end="url(#ma-arrow)" />

  <text class="note" x="240" y="240" text-anchor="middle">Prompt in natuurlijke taal</text>
  <text class="note" x="444" y="240" text-anchor="middle">Tool request</text>
  <text class="note" x="656" y="240" text-anchor="middle">MCP via lokale stdio</text>
  <text class="note" x="892" y="240" text-anchor="middle">SQL</text>

  <defs>
    <marker id="ma-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
