<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="mcpflow-title mcpflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mcpflow-title">Een feature lookup verloopt in zes stappen: de client ontdekt de servertools één keer bij het opstarten; daarna gaat elke vraag over de MCP-grens als een nieuw tools/call-verzoek.</title><desc id="mcpflow-desc">Bij het opstarten ontdekt de MCP-client van Claude Desktop de tools van de server en stelt de host de bijbehorende schema’s beschikbaar aan Claude, die vervolgens get_feature kan aanvragen. Wanneer een vraag data uit de feature store nodig heeft, stuurt de client dat verzoek als een tools/call-bericht naar FeatureStoreLite; de server voert get_feature uit tegen SQLite en het resultaat gaat via de host terug naar Claude voor het uiteindelijke antwoord.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mcpflow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="mcpflow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
