<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">LoRAX-requestpad van adapterresolutie tot generation</title>
  <desc id="desc">Een geauthenticeerde request levert een allowlisted adapter-ID aan. LoRAX bepaalt de residency, laadt de adapter indien nodig, batcht compatibel werk, past de adapter toe op het gedeelde basismodel en streamt tokens. Afgewezen identiteiten en artifacts volgen een failure path.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="500" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">LoRAX-requestpad</text>
  <text x="500" y="77" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">Adapteridentiteit is een geautoriseerde routing-input, geen willekeurige publieke input</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(25 125)"><rect width="150" height="110" rx="14" fill="#1e293b" stroke="#64748b" /><text x="75" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Gateway</text><text x="75" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">tenant authenticeren</text><text x="75" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">adapter allowlisten</text></g>
    <text x="197" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(220 125)"><rect width="165" height="110" rx="14" fill="#5b21b6" stroke="#2563eb" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Resolver</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">residency controleren</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">laden indien afwezig</text></g>
    <text x="407" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(430 125)"><rect width="165" height="110" rx="14" fill="#9a3412" stroke="#ea580c" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fdba74">Scheduler</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">in wachtrij plaatsen op readiness</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">mixed batch vormen</text></g>
    <text x="617" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(640 125)"><rect width="165" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">GPU-inference</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">gedeeld basismodel</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">adapter per request</text></g>
    <text x="827" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(850 125)"><rect width="125" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="62" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Stream</text><text x="62" y="75" text-anchor="middle" font-size="12" fill="#93c5fd">output-tokens</text></g>

    <g transform="translate(220 315)"><rect width="585" height="105" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="292" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Observeer het residency-pad voor elke request</text><text x="45" y="66" font-size="13" fill="#cbd5e1">GPU-hit</text><text x="160" y="66" font-size="13" fill="#cbd5e1">CPU-hit</text><text x="275" y="66" font-size="13" fill="#cbd5e1">artifact-hit</text><text x="410" y="66" font-size="13" fill="#cbd5e1">remote miss</text><text x="45" y="88" font-size="12" fill="#94a3b8">Leg queue-, load-, first-token-, totale latency- en failure-reason vast.</text></g>
    <text x="500" y="465" text-anchor="middle" font-size="13" fill="#fca5a5">Niet-geautoriseerde adapter, incompatibel artifact of load failure → reject of gebruik een expliciete fallback</text>
  </g>
</svg>
