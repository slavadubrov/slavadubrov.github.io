<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="di-title di-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="di-title">Een modelvoorstel doorkruist deterministische domeingrenzen</title><desc id="di-desc">Een extern model produceert een onbetrouwbare AddTaskProposal. De applicatie parseert en normaliseert deze, autoriseert de actor, roept het gemarkeerde aggregate aan om business-invarianten af te dwingen en commit daarna state en een outbox-event. Elk van de eerdere checks kan het voorstel nog afwijzen vóór persistence.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="di-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="di-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="696" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Van voorstel naar gecommitte state</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Vijf stappen brengen modeloutput naar een domeinbeslissing; elke check kan deze vóór persistence</tspan><tspan x="32" dy="1.2em">afwijzen.</tspan></text>
