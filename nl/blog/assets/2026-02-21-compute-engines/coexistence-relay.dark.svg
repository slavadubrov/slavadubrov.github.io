<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="relay-title relay-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="relay-title">Een mogelijke multi-engine relay</title><desc id="relay-desc">Een optionele relay die Parquet-bestanden overdraagt: een data lake voedt Spark/Dask voor gevestigde ETL, die vervolgens overdraagt aan Ray/Daft voor multimodaal werk met gemengde CPU/GPU-inzet en afzonderlijk aan Polars/DuckDB voor lokale ad-hocanalyse. Voeg alleen een engine toe als de operationele kosten van de stagegrens gerechtvaardigd zijn.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="relay-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="relay-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="560" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Een mogelijke multi-engine relay</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Voeg alleen een engine toe als de operationele kosten van de stagegrens gerechtvaardigd zijn.</text>
