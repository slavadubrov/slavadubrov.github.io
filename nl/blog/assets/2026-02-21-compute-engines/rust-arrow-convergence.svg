<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Convergentie van Rust en Arrow</title>
  <desc id="desc">Lagen die Python APIs verbinden met Rust-native execution en Arrow-compatibele columnar data exchange.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="450" rx="12" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Native execution en Arrow-compatibele exchange</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#17211B">Het exacte runtime- en kopieergedrag verschilt per engine en operator.</text>

  <!-- LAYER 1: The Engines (Top) -->

  <!-- Polars -->
  <g class="anim-box layer-1-a">
    <path d="M 120 160 Q 120 150 130 150 L 250 150 Q 260 150 260 160 L 260 190 L 120 190 Z" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="190" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Polars</text>
    <text x="190" y="185" text-anchor="middle" font-size="11" fill="#17211B">DataFrame-library</text>
  </g>

  <!-- DataFusion -->
  <g class="anim-box layer-1-b">
    <path d="M 280 160 Q 280 150 290 150 L 410 150 Q 420 150 420 160 L 420 190 L 280 190 Z" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="350" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">DataFusion</text>
    <text x="350" y="185" text-anchor="middle" font-size="11" fill="#17211B">Query-engine</text>
  </g>

  <!-- Daft -->
  <g class="anim-box layer-1-c">
    <path d="M 480 160 Q 480 150 490 150 L 610 150 Q 620 150 620 160 L 620 190 L 480 190 Z" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text x="550" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Daft</text>
    <text x="550" y="185" text-anchor="middle" font-size="11" fill="#17211B">Multimodaal</text>
  </g>

  <!-- Ray -->
  <g class="anim-box layer-1-d">
    <path d="M 640 160 Q 640 150 650 150 L 770 150 Q 780 150 780 160 L 780 190 L 640 190 Z" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="710" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Ray Data</text>
    <text x="710" y="185" text-anchor="middle" font-size="11" fill="#17211B">Distributed scale</text>
  </g>

  <!-- LAYER 2: The Unified Foundation (Middle) -->
  <g class="anim-box layer-2">
    <!-- Main base container -->
    <rect x="120" y="190" width="660" height="90" fill="#ffffff" stroke="#17211B" stroke-width="2" class="visual-focus" />

    <!-- Divider -->
    <line x1="450" y1="190" x2="450" y2="280" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Left side: Rust -->
    <text x="285" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Native componenten</text>
    <text x="285" y="250" text-anchor="middle" font-size="12" fill="#17211B">Vaak geïmplementeerd in Rust</text>

    <!-- Right side: Apache Arrow -->
    <text x="615" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Apache Arrow</text>
    <text x="615" y="250" text-anchor="middle" font-size="12" fill="#17211B">Columnar in-memoryformaat</text>
  </g>

  <!-- LAYER 3: The Outcomes (Bottom) -->
  <g class="anim-box layer-3">
    <!-- Connecting arrows -->
    <line x1="255" y1="280" x2="255" y2="308" stroke="#59645E" stroke-width="1.5" marker-end="url(#arr)" />
    <line x1="450" y1="280" x2="450" y2="308" stroke="#59645E" stroke-width="1.5" marker-end="url(#arr)" />
    <line x1="645" y1="280" x2="645" y2="308" stroke="#59645E" stroke-width="1.5" marker-end="url(#arr)" />

    <rect x="155" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="255" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Geen tracing GC</text>
    <text x="255" y="365" text-anchor="middle" font-size="11" fill="#17211B">Ownership en borrowing</text>
    <text x="255" y="380" text-anchor="middle" font-size="11" fill="#17211B">Voorkomt GC-pauses in Rust-code</text>

    <rect x="350" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text x="450" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Goedkopere exchange</text>
    <text x="450" y="365" text-anchor="middle" font-size="11" fill="#17211B">PyCapsule-interface</text>
    <text x="450" y="380" text-anchor="middle" font-size="11" fill="#17211B">Compatibele buffers kunnen worden hergebruikt</text>

    <rect x="545" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text x="645" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Veiligere concurrency</text>
    <text x="645" y="365" text-anchor="middle" font-size="11" fill="#17211B">Compile-time checks</text>
    <text x="645" y="380" text-anchor="middle" font-size="11" fill="#17211B">Data races worden in safe Rust afgewezen</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
