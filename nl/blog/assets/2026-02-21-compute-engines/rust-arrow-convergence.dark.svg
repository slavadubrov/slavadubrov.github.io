<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rustarrow-title rustarrow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rustarrow-title">Native execution en Arrow-compatibele uitwisseling</title><desc id="rustarrow-desc">Vier engines — Polars, DataFusion, Daft en Ray Data — zijn gebouwd op een gedeelde basis van Rust-native componenten en het kolomformaat van Apache Arrow. Samen zorgen die voor geen tracing garbage collector, goedkopere zero-copy-uitwisseling via de PyCapsule-interface en concurrency met compile-time checks. Het precieze runtime- en kopieergedrag verschilt per engine en operator.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
