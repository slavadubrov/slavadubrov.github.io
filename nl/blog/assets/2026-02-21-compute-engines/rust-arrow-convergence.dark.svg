<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Het precieze runtime- en kopieergedrag verschilt per engine en operator.</text>
