<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Eager en lazy execution</title><desc id="eagerlazy-desc">Een eager pipeline leest alle kolommen en maakt vervolgens bij filter, groupby en resultaat telkens een volledige kopie in RAM, waardoor 2 tot 3× de datasetgrootte aan geheugen wordt gebruikt. Een lazy engine bouwt een queryplan op basis van scan, filter en group_by. Een optimizer past predicate pushdown en column pruning toe, waarna collect() het plan één keer parallel uitvoert met streaming batches. Pandas doet er ongeveer 365 seconden over op een PDS-H SF-10-benchmark; Polars ongeveer 3,89 seconden.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
