<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Eager en lazy execution</title><desc id="eagerlazy-desc">Eager operations kunnen intermediate tables behouden. Polars lazy execution optimaliseert het volledige plan. Expliciete streaming kan het geheugen voor intermediates begrenzen bij ondersteunde operators, maar collect materialiseert het eindresultaat.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="eagerlazy-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="eagerlazy-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="610" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Eager en lazy execution</text>
<rect x="32" y="96" width="656" height="176" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">EAGER OPERATIONS</text>
<path d="M58 136h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 136h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">READ</text><text x="62" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kolommen laden</text>
<path d="M282 136h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M282 136h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="286" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FILTER</text><text x="286" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Rijen filteren</text>
<path d="M506 136h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M506 136h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="510" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">AGGREGATE</text><text x="510" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 15.5px;">Resultaten groeperen</text>
<path d="M224 172H272" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<path d="M448 172H496" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<text x="48" y="244" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="48">Intermediates kunnen naast elkaar bestaan; het geheugengebruik hangt af van copies en de</tspan><tspan x="48" dy="1.2em">omvang van resultaten.</tspan></text>
<rect x="32" y="304" width="656" height="216" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="332" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">POLARS LAZY PLAN</text>
<path d="M58 344h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 344h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PLAN</text><text x="62" y="399" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 11.5px;">Scannen, filteren, groeperen</text>
<path d="M282 344h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M282 344h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="286" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">OPTIMIZER</text><text x="286" y="399" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Plan optimaliseren</text>
<path d="M506 344h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M506 344h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="510" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">EXECUTE</text><text x="510" y="399" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 15.5px;">Resultaat verzamelen</text>
<path d="M224 380H272" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<path d="M448 380H496" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<text x="48" y="452" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">collect(engine="streaming") gebruikt batches wanneer operators dit ondersteunen.</text>
<text x="48" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="48">Het eindresultaat moet in het geheugen passen; sommige operations kunnen terugvallen op een</tspan><tspan x="48" dy="1.2em">andere aanpak.</tspan></text>
<path d="M32 548h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="574" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Lazy planning maakt optimalisatie mogelijk; het garandeert op zichzelf geen streaming.</text>
</svg>
