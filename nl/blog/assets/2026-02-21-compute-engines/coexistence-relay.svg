<path d="M32 464h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="490" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">File handoffs brengen I/O met zich mee; connectorondersteuning verschilt per engine.</text>
