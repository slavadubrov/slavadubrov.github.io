<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="relay-title relay-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="relay-title">Een mogelijke multi-engine relay</title><desc id="relay-desc">Een data lake voedt Spark of Dask voor gevestigde ETL, die Parquet schrijft voor Ray- of Daft-inference en lokale analyse met Polars of DuckDB. Elke file handoff brengt I/O- en conversiekosten met zich mee.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="relay-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="relay-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="504" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Een mogelijke multi-engine relay</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Voeg een engine toe wanneer het voordeel een extra operationele grens rechtvaardigt.</text>
