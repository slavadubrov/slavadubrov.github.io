<path d="M498 336h180a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M498 336h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="502" y="353.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">LOKAAL</text><text x="502" y="397" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Polars / DuckDB</text><text x="502" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ad-hocanalyse</text>
<path d="M432 260H460V180H488" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relay-arrow-flow)" />
