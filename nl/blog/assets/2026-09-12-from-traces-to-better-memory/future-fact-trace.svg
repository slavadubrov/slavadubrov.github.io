<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 742" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="future-fact-title future-fact-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="future-fact-title">Een toekomstige wijziging mag het huidige adres niet vervangen in een antwoord voor 5 januari</title><desc id="future-fact-desc">Berlijn is geldig van 1 januari tot 10 januari. Parijs werd op 3 januari gemeld, maar wordt pas op 10 januari geldig. Bij een vraag over 5 januari kiest retrieval op basis van nieuwste waarneming ten onrechte Parijs. Filteren op het halfopen geldigheidsinterval selecteert Berlijn. Waarnemingstijd en geldigheidstijd beantwoorden verschillende vragen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="future-fact-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="future-fact-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="742" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Later gemeld betekent niet dat het nu geldig is</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Vraag: Wat is het adres van de gebruiker op 5 januari?</text>
