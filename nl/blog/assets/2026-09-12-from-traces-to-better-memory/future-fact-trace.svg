<text x="32" y="688" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Beide records blijven beschikbaar voor historische reads. De correctie bepaalt welk</text>
<text x="32" y="710" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">record in de answer context terechtkomt, in plaats van het toekomstige feit te verwijderen.</text>
