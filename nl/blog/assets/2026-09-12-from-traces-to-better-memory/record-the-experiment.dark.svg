<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="record-experiment-title record-experiment-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="record-experiment-title">Deze demo delegeert voorstellen aan een LLM agent</title><desc id="record-experiment-desc">Geregistreerde fouten gaan naar de agent. De agent stelt een SGR-configuratiewijziging voor. Python valideert deze, test de deterministische memory tool en vergelijkt het resultaat. Geaccepteerde en afgewezen pogingen worden feedback voor de volgende model call. Een parent selecteren voor een ander experiment autoriseert geen deployment; human release review blijft apart.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
