<path d="M456 216h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#two-memories-arrow-flow)" />
<text x="48" y="318" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Elke taak start vanuit een eigen clean state; kandidaten delen nooit rows.</text>
