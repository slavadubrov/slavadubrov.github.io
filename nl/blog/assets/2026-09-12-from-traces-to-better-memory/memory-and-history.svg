<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="two-memories-title two-memories-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="two-memories-title">Gebruikersgeheugen en experimentgeschiedenis hebben verschillende owners en taken</title><desc id="two-memories-desc">De target valideert voorgestelde gebruikersfeiten, beheert scoped version history en haalt records op voor één vraag. De experiment runner reset de target state tussen taken en registreert traces en resultaten in een aparte history. Gebruikersgeheugen is target data; experimentgeschiedenis verklaart wijzigingen aan de target.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="two-memories-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="two-memories-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="800" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Twee soorten memory, twee aparte stores</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">De facts van de assistant verschillen van het experimentrecord van de engineer.</text>
<rect x="32" y="112" width="656" height="232" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="138" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">TARGET — ÉÉN SYNTHETISCHE ASSISTENTTASK</text>
