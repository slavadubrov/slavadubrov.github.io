<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="what-meta-engineering-optimizes-title what-meta-engineering-optimizes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="what-meta-engineering-optimizes-title">Meta-engineering optimaliseert het volledige systeem</title><desc id="what-meta-engineering-optimizes-desc">Meta-engineering kiest experimenten waarin promptformulering, context assembly, loopconfiguratie en graphstructuur kunnen variëren. Alle vier maken deel uit van één kandidaat-systeem. Evaluatie meet de resultaten van dat systeem en levert evidence voor het volgende experiment. De vier gebieden zijn overlappende designkeuzes, geen historische fasen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
