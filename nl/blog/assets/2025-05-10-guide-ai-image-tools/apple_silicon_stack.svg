<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="memory-title memory-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="memory-title">Vijf claims over één Apple Silicon-geheugenpool</title>
  <desc id="memory-desc">macOS en applicaties, modelcomponenten, activations en runtime-workspace, en optionele adapters gebruiken allemaal unified memory. De resterende werkruimte staat centraal, omdat langdurige swap geen prettig operating point is. Resolutie, batch size, architectuur, precision en geladen stages verschuiven de grenzen.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .claim { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .claim-alt { fill: #f2f2f5; stroke: #17211b; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#f7f7f4" />

  <text class="kind" x="48" y="44">OPSLAAN · ÉÉN UNIFIED MEMORY-POOL</text>
  <text class="note" x="912" y="44" text-anchor="end">conceptuele claims · niet op schaal</text>

  <rect class="claim" x="80" y="72" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="109">SYSTEEM</text>
  <text class="name" x="272" y="109">macOS en applicaties</text>
  <text class="note" x="856" y="109" text-anchor="end">verandert tijdens het werken</text>

  <rect class="claim-alt" x="80" y="150" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="187">WEIGHTS</text>
  <text class="name" x="272" y="187">Modelcomponenten</text>
  <text class="note" x="856" y="187" text-anchor="end">checkpoint · encoders · VAE</text>

  <rect class="claim" x="80" y="228" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="265">WORKSPACE</text>
  <text class="name" x="272" y="265">Activations en runtime</text>
  <text class="note" x="856" y="265" text-anchor="end">attention · intermediaire state</text>

  <rect class="claim-alt" x="80" y="306" width="800" height="62" rx="10" />
  <text class="kind" x="104" y="343">OPTIONELE LADING</text>
  <text class="name" x="272" y="343">Adapters en controls</text>
  <text class="note" x="856" y="343" text-anchor="end">LoRA · ControlNet · upscaler</text>

  <rect x="80" y="384" width="800" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="104" y="418" fill="#c50e72">FOCUS</text>
  <text class="name" x="104" y="446" fill="#c50e72">Werkruimte</text>
  <text class="note" x="856" y="446" text-anchor="end">laat ruimte over vóór langdurige swap</text>

  <path d="M48 520h48" fill="none" stroke="#d8ddd9" stroke-width="1.5" />
  <text class="note" x="112" y="525">Resolutie · batch size · architectuur · precision · geladen stages verschuiven elke claim.</text>
</svg>
