<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="aitooldt-title aitooldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="aitooldt-title">Een decision map met drie vertakkingen selecteert een tool op basis van de state die moet blijven bestaan; daarna bevestigt een gerichte acceptance test de exacte stack.</title><desc id="aitooldt-desc">Of de workflow moet blijven bestaan in een native applicatie, een inspecteerbare graph of een bestaande interface bepaalt de eerste vertakking: Draw Things of DiffusionBee, ComfyUI, of AUTOMATIC1111 of Fooocus. Voor elke vertakking moet de exacte model stack nog worden bevestigd; bij een mislukte check ga je terug om een andere kandidaat te beoordelen voordat de gerichte representative acceptance test wordt uitgevoerd.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="aitooldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="aitooldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="760" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Kies de tool en bewijs daarna de stack</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">De control-surface-tabel geeft aan waar de state leeft. Deze test laat zien of die behouden blijft.</text>
<rect x="200" y="112" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="360" y="152" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">BESLISSING</text><text x="360" y="176" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Welke state moet behouden blijven?</text>
