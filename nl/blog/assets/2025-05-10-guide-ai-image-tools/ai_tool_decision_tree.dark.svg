<path d="M42 576h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 576h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="593.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS</text><text x="46" y="637" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Representative acceptance test</text><text x="46" y="659" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Meet, herstart, reproduceer en leg de release unit vast.</text>
<path d="M472 424v-216" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#aitooldt-arrow-flow)" /><rect x="535.5" y="128" width="137" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="604" y="144.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">nee → andere</text>
<path d="M32 712h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="738" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Vergelijk tools alleen met hetzelfde checkpoint, dezelfde resolutie, hetzelfde aantal steps en dezelfde</tspan><tspan x="32" dy="1.2em">precision.</tspan></text>
