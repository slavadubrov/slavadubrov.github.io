<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="biserve-title biserve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="biserve-title">Bi-encoder: offline indexing versus online query serving</title><desc id="biserve-desc">Offline worden documenten één keer batchgewijs ge-encodeerd en opgeslagen in een vector index. Online wordt één query ge-encodeerd en tegen die index gezocht. De latency hangt af van de encoder, hardware, index, filters en de gewenste recall. Profileer daarom de encode- en search-stappen afzonderlijk.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="biserve-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="biserve-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="590" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Offline indexing, online query</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Document embeddings worden één keer berekend en opgeslagen; query encoding en search worden bij</tspan><tspan x="32" dy="1.2em">elke request uitgevoerd.</tspan></text>
<rect x="32" y="96" width="656" height="180" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">OFFLINE · INDEXTIJD</text>
<path d="M58 144h120a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-120a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 144h120a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-140a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">CORPUS</text><text x="62" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">N documenten</text>
<path d="M214 144h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M214 144h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="218" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ENCODE</text><text x="218" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Batch encode</text>
<path d="M340 144h150a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-150a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M340 144h150a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-170a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="344" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">EMBEDDINGS</text><text x="344" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">N × D-matrix</text>
<path d="M526 144h130a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M526 144h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="530" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">INDEX</text><text x="530" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">HNSW / IVF</text>
<path d="M188 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M314 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M500 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="236" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">Eén keer uitgevoerd en op schijf opgeslagen. 8.500 × 384 ≈ 13 MB in de demo; 1B × 768 ≈ 3 TiB</tspan><tspan x="48" dy="1.2em">op schaal.</tspan></text>
<rect x="32" y="300" width="656" height="180" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="328" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ONLINE · QUERYTIJD</text>
<path d="M58 348h120a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-120a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 348h120a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-140a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="62" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">QUERY</text><text x="62" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E">User query</text>
<path d="M214 348h150a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-150a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M214 348h150a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-170a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="218" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ENCODE</text><text x="218" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">Single encode</text>
<path d="M400 348h130a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M400 348h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="404" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">SEARCH</text><text x="404" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#17211B">ANN search</text>
<path d="M566 348h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M566 348h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="570" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">OUTPUT</text><text x="570" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B">Top-K</text>
<path d="M188 376h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M374 376h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M540 376h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="440" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">Profileer de encode-stap en de search-stap afzonderlijk; beide dragen bij aan de end-to-end</tspan><tspan x="48" dy="1.2em">query latency.</tspan></text>
<path d="M32 508h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="534" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">De offline/online-splitsing is het architecturale voordeel: document embeddings hoeven nooit opnieuw te worden</text>
<text x="32" y="556" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">berekend op querytijd.</text>
</svg>
