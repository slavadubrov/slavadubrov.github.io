<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ocrstack-title ocrstack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ocrstack-title">OCR-kwaliteit beperkt elk downstream documentsysteem, en verloren informatie kan later niet worden hersteld.</title><desc id="ocrstack-desc">Documenten en afbeeldingen doorlopen een stap voor extraction quality; het resulterende text-and-layout record is het enige beschikbare bewijs voor retrieval en answering, agent-beslissingen en domain workflows verderop in de keten. Weggevallen of verminkte tekst tijdens extraction kan niet door latere stages worden hersteld.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ocrstack-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ocrstack-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="704" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">OCR-kwaliteit beperkt elk downstream documentsysteem</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Retrieval, agents en workflows kunnen alleen het bewijs gebruiken dat extraction heeft behouden.</text>
