    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Gemini 3 Pro / GPT-5.2</text>
    <text x="135" y="94" font-size="11" fill="#64748b" text-anchor="middle" textLength="240" lengthAdjust="spacingAndGlyphs">Gehosteerd op VLM of via een tweede model</text>
    <text x="135" y="116" font-size="11.5" fill="#64748b" text-anchor="middle">
      <tspan x="135" y="108">Gecompliceerde lay-outs,</tspan>
      <tspan x="135" y="124">handschrift</tspan>
    </text>
    <text x="135" y="145" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle">Meting van het review-ratio</text>
