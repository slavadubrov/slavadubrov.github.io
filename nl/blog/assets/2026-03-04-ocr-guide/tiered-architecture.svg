  <path d="M 902 351 H 910 V 336 H 920" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)" />
  <text x="910" y="338" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Ja</text>
  <path d="M 836 399 V 432 H 426 V 529 H 454" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)" />
  <text x="850" y="422" font-size="13" font-weight="700" fill="#dc2626">Nee</text>
  <path d="M 724 529 H 900 V 490 H 920" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)" />
  <g transform="translate(920 104)">
