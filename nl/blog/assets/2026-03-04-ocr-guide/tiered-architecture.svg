<path d="M224 544h-144v348h360v12" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><rect x="98" y="532" width="108" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="152" y="548.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">check geslaagd</text>
