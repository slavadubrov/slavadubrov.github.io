    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#2563eb" />
    <text x="135" y="27" font-size="15.1" font-weight="700" fill="#ffffff" text-anchor="middle">Layer 1: snelle lokale route</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">PaddleOCR / Tesseract</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">CPU-only</text>
    <text x="135" y="116" font-size="11.2" fill="#64748b" text-anchor="middle">
      <tspan x="135" y="108">Schoonmaken van afgedrukte</tspan>
      <tspan x="135" y="124">documenten</tspan>
    </text>
    <text x="135" y="145" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">Meting van het slagenpercentage</text>
