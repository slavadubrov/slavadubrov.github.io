  <rect width="1120" height="720" rx="14" fill="#f8fafc" />
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">Productie OCR: gestapelde routing</text>
  <text x="48" y="74" font-size="14" fill="#64748b">Kalibreer elke kwaliteitscontrolepunt voor de gelaagde documentklassen</text>
  <g transform="translate(48 280)">
    <rect width="142" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="71" y="34" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Inkomend</text>
    <text x="71" y="55" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">documenten</text>
    <text x="71" y="79" font-size="11" fill="#64748b" text-anchor="middle" textLength="120" lengthAdjust="spacingAndGlyphs">PDF's, afbeeldingen</text>
  </g>
  <line x1="190" y1="330" x2="218" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#blue-arrow)" />
  <g transform="translate(230 270)">
