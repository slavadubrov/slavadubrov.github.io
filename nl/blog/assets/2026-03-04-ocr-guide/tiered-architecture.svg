    <text x="66" y="40" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle" textLength="110" lengthAdjust="spacingAndGlyphs">Kwaliteitscontrolepunt</text>
    <text x="66" y="61" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle" textLength="110" lengthAdjust="spacingAndGlyphs">worden goedgekeurd?</text>
