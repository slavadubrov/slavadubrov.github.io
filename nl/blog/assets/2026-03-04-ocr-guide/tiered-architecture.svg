<path d="M496 668h80v272H496" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><rect x="536.5" y="792" width="79" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="576" y="808.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 12px;">geaccepteerd</text>
<path d="M360 720v56" fill="none" stroke="#F2148E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-fail)" /><rect x="266" y="736" width="188" height="24" rx="6" fill="#F7F7F4" stroke="#F2148E" stroke-width="1" /><text x="360" y="752.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#C50E72" text-anchor="middle">onopgelost of risicovol</text>
