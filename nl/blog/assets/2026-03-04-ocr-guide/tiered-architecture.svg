    <text x="85" y="30" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Voorverwerking</text>
    <text x="85" y="56" font-size="11" fill="#64748b" text-anchor="middle">
      <tspan x="85" y="49">Ontkantelen,</tspan>
      <tspan x="85" y="64">binariseren</tspan>
    </text>
    <text x="85" y="82" font-size="13" fill="#64748b" text-anchor="middle">DPI normaliseren</text>
    <text x="85" y="104" font-size="13" fill="#64748b" text-anchor="middle">CPU werkers</text>
  </g>
