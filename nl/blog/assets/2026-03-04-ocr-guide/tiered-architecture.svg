<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Een architectuur voor productieomgevingen die is opgebouwd rondom confiantiegraden van routing: documenten gaan eerst door preverwerking, vervolgens naar Tier 1 (PaddleOCR/Tesseract); resultaten met lage confiantie worden doorgestuurd naar Tier 2 (Qwen3-VL en soortgelijke systemenocr) en Tier 3 (Gemini Pro/GPT-5.2), waarna ze worden gevolgd door postverwerking en menselijke controle</title>
  <desc id="artifact-desc">Een architectuur voor productieomgevingen die is opgebouwd rondom confiantiegraden van routing: documenten gaan eerst door preverwerking, vervolgens naar Tier 1 (PaddleOCR/Tesseract); resultaten met lage confiantie worden doorgestuurd naar Tier 2 (Qwen3-VL en soortgelijke systemenocr) en Tier 3 (Gemini Pro/GPT-5.2), waarna ze worden gevolgd door postverwerking en menselijke controle</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" />
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
