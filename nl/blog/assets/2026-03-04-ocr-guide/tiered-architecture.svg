    <line x1="30" y1="190" x2="134" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="82" y="226" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">gestructureerd</text>
    <text x="82" y="248" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">Uitvoer</text>
    <text x="82" y="276" font-size="13" fill="#0f172a" text-anchor="middle">JSON / Markdown</text>
    <line x1="30" y1="304" x2="134" y2="304" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="82" y="340" font-size="11.4" fill="#991b1b" text-anchor="middle">nog niet opgelost of</text>
