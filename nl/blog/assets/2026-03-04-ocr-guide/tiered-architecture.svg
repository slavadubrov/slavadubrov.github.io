    <text x="135" y="27" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Tier 2: krachtiger model</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Qwen3-VL / dots.ocr</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">or Gemini 3 Flash</text>
    <text x="135" y="116" font-size="11.5" fill="#64748b" text-anchor="middle">
      <tspan x="135" y="108">Opmaak en gedegradeerde</tspan>
      <tspan x="135" y="124">afbeeldingen</tspan>
    </text>
    <text x="135" y="145" font-size="13" font-weight="600" fill="#9a3412" text-anchor="middle">De foutloosheidsgraad meten</text>
  </g>
  <g transform="translate(454 454)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#7c3aed" />
