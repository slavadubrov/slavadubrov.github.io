<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-compare-title ocr-compare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-compare-title">Modulaire OCR vergeleken met gezamenlijke vision-language inference</title>
  <desc id="ocr-compare-desc">Een modulair pad voert detectie, herkenning en post-processing serieel uit voordat platte tekst wordt opgeslagen. Een gezamenlijk vision-language-pad combineert inference en slaat tekst plus structuur op, terwijl rasterization en output parsing buiten het model blijven.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">MODULAIRE OCR · DRIE SERIËLE STAPPEN</text>

  <rect x="48" y="80" width="128" height="62" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="64" y="104">EXTERN</text><text class="name" x="64" y="128">Document</text>
  <rect class="box" x="216" y="80" width="144" height="62" rx="10" />
  <text class="kind" x="232" y="104">VERWERKEN</text><text class="name" x="232" y="128">Regio’s detecteren</text>
  <rect class="box" x="400" y="80" width="144" height="62" rx="10" />
  <text class="kind" x="416" y="104">VERWERKEN</text><text class="name" x="416" y="128">Tekst lezen</text>
  <rect class="box" x="584" y="80" width="144" height="62" rx="10" />
  <text class="kind" x="600" y="104">VERWERKEN</text><text class="name" x="600" y="128">Post-processing</text>
  <rect x="768" y="80" width="144" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="784" y="104">OPSLAAN</text><text class="name" x="784" y="128">Platte tekst</text>

  <path class="edge" d="M176 111h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M360 111h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M544 111h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M728 111h32" marker-end="url(#ocr-compare-arrow)" />
  <text class="note" x="48" y="174">Elke stap kan een fout doorgeven; evalueer zowel tekens als downstream-velden.</text>

  <path d="M48 208h864" stroke="#2B3B33" stroke-width="1" />
  <text class="section" x="48" y="248">JOINT VLM · ÉÉN INFERENCE-STAP</text>

  <rect x="48" y="280" width="128" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="64" y="314">EXTERN</text><text class="name" x="64" y="342">Document</text>
  <rect x="216" y="280" width="328" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="236" y="314" fill="#FF6FB6">FOCUS</text><text class="name" x="236" y="342" fill="#FF6FB6">Vision + language inference</text>
  <rect x="584" y="280" width="328" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="604" y="314">OPSLAAN</text><text class="name" x="604" y="342">Tekst + structuur</text>
  <path class="edge" d="M176 328h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M544 328h32" marker-end="url(#ocr-compare-arrow)" />
  <text class="note" x="48" y="408">Rasterization, normalization en output parsing blijven het model omringen.</text>

  <defs>
    <marker id="ocr-compare-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
