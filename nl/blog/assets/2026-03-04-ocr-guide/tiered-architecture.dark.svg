<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1216" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="tieredarch-title tieredarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tieredarch-title">Production-OCR leidt documenten door gekalibreerde fallback-tiers: van native text via snelle OCR naar een sterker model, met human review alleen voor onopgeloste of risicovolle velden.</title><desc id="tieredarch-desc">Documenten controleren eerst of er een bruikbare native text-laag is. Zo niet, dan gaan ze door snelle lokale OCR en een gekalibreerde confidence check; bij een mislukte check volgt escalatie naar een sterker gespecialiseerd of algemeen model. Geslaagde routes komen samen bij post-processing en structured output. Alleen onopgeloste of risicovolle velden bereiken human review; beoordeelde resultaten vloeien terug naar dezelfde structured output.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tieredarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="tieredarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1216" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Escalateer alleen wanneer een check mislukt</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Native text en geslaagde confidence checks gaan direct naar structured output.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Alleen onopgeloste of risicovolle velden bereiken een mens.</text>
