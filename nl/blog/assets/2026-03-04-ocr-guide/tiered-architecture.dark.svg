<path d="M32 1136h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="1162" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Kalibreer elke check per documentklasse, veldkritikaliteit en gelabelde uitkomsten.</text>
<text x="32" y="1184" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Human review is de duurste tier — reserveer die voor wat geautomatiseerde checks niet kunnen oplossen.</text>
