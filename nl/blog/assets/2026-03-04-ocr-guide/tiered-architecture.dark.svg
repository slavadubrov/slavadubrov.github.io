<text x="32" y="1130" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Kalibreer elke gate per documentklasse, veldkritikaliteit en gelabelde uitkomsten.</text>
<text x="32" y="1152" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Human review is de duurste tier — reserveer deze voor wat de modelgates niet kunnen oplossen.</text>
