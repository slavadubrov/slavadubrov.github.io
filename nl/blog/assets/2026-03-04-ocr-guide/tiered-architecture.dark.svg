<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1184" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="tieredarch-title tieredarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tieredarch-title">Production OCR routeert documenten via gekalibreerde fallbacktiers: van native text naar snelle OCR en vervolgens naar een sterker model, waarbij human review wordt gereserveerd voor onopgeloste of risicovolle velden.</title><desc id="tieredarch-desc">Documenten controleren eerst op een bruikbare native text layer. Als die ontbreekt, gaan ze door snelle lokale OCR met een gate op basis van gekalibreerde confidence. Bij een mislukte gate wordt opgeschaald naar een sterker gespecialiseerd of algemeen model. Geslaagde routes komen samen bij post-processing en structured output. Alleen onopgeloste of risicovolle velden bereiken human review; beoordeelde resultaten vloeien terug naar dezelfde structured output.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tieredarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="tieredarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1184" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Escalate alleen wanneer een gate faalt</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;">Native text en geslaagde confidence gates gaan rechtstreeks naar structured output; alleen onopgeloste of risicovolle velden bereiken een mens.</text>
