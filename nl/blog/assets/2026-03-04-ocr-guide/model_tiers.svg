<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Drie OCR-deploymentfamilies</title>
  <desc id="artifact-desc">Traditional OCR, gespecialiseerde documentmodellen en algemene VLMs worden vergeleken op task breadth. De deploymentmodus varieert onafhankelijk per product en kan local CPU, self-hosted GPU of hosted API zijn.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="430" rx="14" fill="#f8fafc" />
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">OCR-modelfamilies</text>
  <text x="48" y="76" font-size="14" fill="#64748b">Task breadth verschilt; de deploymentlast hangt af van het gekozen product en de hostingmodus</text>

  <g>
    <rect x="40" y="112" width="280" height="244" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
    <path d="M 50 112 H 310 A 10 10 0 0 1 320 122 V 156 H 40 V 122 A 10 10 0 0 1 50 112 Z" fill="#16a34a" />
    <text x="180" y="141" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Traditional OCR</text>
    <text x="60" y="190" font-size="14" font-weight="600" fill="#0f172a">Beste eerste test</text>
    <text x="60" y="214" font-size="13" fill="#64748b">Schone print en beperkte scripts</text>
    <text x="60" y="244" font-size="14" font-weight="600" fill="#0f172a">Voorbeelden</text>
    <text x="60" y="268" font-size="13" fill="#64748b">Tesseract, PaddleOCR</text>
    <rect x="60" y="292" width="240" height="42" rx="6" fill="#f0fdf4" />
    <text x="180" y="309" font-size="12" font-weight="600" fill="#166534" text-anchor="middle"><tspan x="180">Deployment: local CPU</tspan><tspan x="180" dy="16">of self-hosted GPU</tspan></text>
  </g>

  <g>
    <rect x="340" y="112" width="280" height="244" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <path d="M 350 112 H 610 A 10 10 0 0 1 620 122 V 156 H 340 V 122 A 10 10 0 0 1 350 112 Z" fill="#2563eb" />
    <text x="480" y="141" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Gespecialiseerde documentmodellen</text>
    <text x="360" y="190" font-size="14" font-weight="600" fill="#0f172a">Bredere documenttaken</text>
    <text x="360" y="214" font-size="13" fill="#64748b">Layout, tabellen, formules, volgorde</text>
    <text x="360" y="244" font-size="14" font-weight="600" fill="#0f172a">Voorbeelden</text>
    <text x="360" y="268" font-size="13" fill="#64748b">dots.ocr, DeepSeek-OCR2</text>
    <rect x="360" y="292" width="240" height="42" rx="6" fill="#eff6ff" />
    <text x="480" y="309" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle"><tspan x="480">Deployment: self-hosted GPU</tspan><tspan x="480" dy="16">of hosted API</tspan></text>
  </g>

  <g>
    <rect x="640" y="112" width="280" height="244" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <path d="M 650 112 H 910 A 10 10 0 0 1 920 122 V 156 H 640 V 122 A 10 10 0 0 1 650 112 Z" fill="#7c3aed" />
    <text x="780" y="141" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Algemene VLMs</text>
    <text x="660" y="190" font-size="14" font-weight="600" fill="#0f172a">Tekst plus visuele reasoning</text>
    <text x="660" y="214" font-size="13" fill="#64748b">VQA en semantic extraction</text>
    <text x="660" y="244" font-size="14" font-weight="600" fill="#0f172a">Voorbeelden</text>
    <text x="660" y="268" font-size="13" fill="#64748b">Gemini, GPT, Qwen-VL</text>
    <rect x="660" y="292" width="240" height="42" rx="6" fill="#faf5ff" />
    <text x="780" y="309" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle"><tspan x="780">Deployment: hosted API</tspan><tspan x="780" dy="16">of self-hosted open weights</tspan></text>
  </g>

  <rect x="120" y="380" width="720" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="480" y="400" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Benchmarkkwaliteit, latency, privacy en operationele kosten op dezelfde gelabelde pagina's</text>
</svg>
