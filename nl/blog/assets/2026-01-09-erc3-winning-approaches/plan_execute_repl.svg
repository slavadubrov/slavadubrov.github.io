<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="repl-title repl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="repl-title">Plan, genereer code, voer uit in persistente state en beslis daarna</title>
  <desc id="repl-desc">Een planner definieert één high-level stap, een vers code model schrijft Python en een task-scoped REPL voert de code uit met behoud van variabelen. Een decision model gaat vervolgens door, breekt af of plant alleen het resterende werk opnieuw.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #C50E72; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #C50E72; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="360" rx="14" fill="#F7F7F4" />
  <circle cx="62" cy="52" r="14" fill="#17211B" /><text class="marker-num" x="62" y="57" text-anchor="middle">1</text><circle cx="286" cy="52" r="14" fill="#17211B" /><text class="marker-num" x="286" y="57" text-anchor="middle">2</text><circle cx="510" cy="52" r="14" fill="#17211B" /><text class="marker-num" x="510" y="57" text-anchor="middle">3</text><circle cx="734" cy="52" r="14" fill="#17211B" /><text class="marker-num" x="734" y="57" text-anchor="middle">4</text>
  <rect class="box" x="48" y="80" width="188" height="96" rx="10" /><text class="kind" x="68" y="114">PLANNER · GPT-5.1</text><text class="name" x="68" y="142">Definieer één stap</text>
  <rect class="box" x="272" y="80" width="188" height="96" rx="10" /><text class="kind" x="292" y="114">CODE MODEL</text><text class="name" x="292" y="142">Schrijf Python</text>
  <rect class="store" x="496" y="80" width="188" height="96" rx="10" /><text class="kind" x="516" y="114">TASK REPL</text><text class="name" x="516" y="142">Voer uit + behoud state</text>
  <rect x="720" y="80" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind-focus" x="740" y="114">DECISION MODEL</text><text class="name-focus" x="740" y="142">Ga door of plan opnieuw</text>
  <path class="edge" d="M236 128h28" marker-end="url(#repl-arrow)" /><path class="edge" d="M460 128h28" marker-end="url(#repl-arrow)" /><path class="edge" d="M684 128h28" marker-end="url(#repl-arrow)" />
  <path d="M814 176v64a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-64" fill="none" stroke="#F2148E" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#repl-signal)" />
  <rect x="408" y="240" width="144" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="480" y="257" text-anchor="middle" fill="#C50E72">plan resterend werk opnieuw</text>
  <text class="note" x="802" y="208" text-anchor="end">doorgaan · afbreken · opnieuw plannen</text>
  <text class="note" x="48" y="324">Het code model start voor elke stap opnieuw; de REPL behoudt de task state tijdens deze geïsoleerde uitvoeringen.</text>
  <defs><marker id="repl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="repl-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
