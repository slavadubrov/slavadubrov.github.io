<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ctx-title ctx-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ctx-title">Vier policies bepalen wat in de working context komt</title>
  <desc id="ctx-desc">Teams distilleerden wiki-regels, laadden bedrijfsrecords vooraf in, haalden regels op via drie zoekmodi of comprimeerden oudere turns. Elke policy filtert een andere input voordat die in de working context van de agent komt.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#0C1210" />
  <rect class="box" x="48" y="64" width="188" height="96" rx="10" /><text class="kind" x="68" y="98">WIKI-REGELS</text><text class="name" x="68" y="126">Constraints distilleren</text>
  <rect class="box" x="272" y="64" width="188" height="96" rx="10" /><text class="kind" x="292" y="98">BEDRIJFSRECORDS</text><text class="name" x="292" y="126">Entiteiten preloaden</text>
  <rect class="box" x="496" y="64" width="188" height="96" rx="10" /><text class="kind" x="516" y="98">WIKI-SEARCH</text><text class="name" x="516" y="126">Op 3 manieren ophalen</text>
  <rect class="box" x="720" y="64" width="188" height="96" rx="10" /><text class="kind" x="740" y="98">TURN-HISTORIE</text><text class="name" x="740" y="126">Oudere turns comprimeren</text>
  <path class="edge" d="M142 160v60a12 12 0 0 0 12 12h266v32" marker-end="url(#ctx-arrow)" /><path class="edge" d="M366 160v44a12 12 0 0 0 12 12h82v48" marker-end="url(#ctx-arrow)" /><path class="edge" d="M590 160v44a12 12 0 0 1-12 12h-78v48" marker-end="url(#ctx-arrow)" /><path class="edge" d="M814 160v60a12 12 0 0 1-12 12H540v32" marker-end="url(#ctx-arrow)" />
  <rect x="384" y="272" width="192" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="404" y="306">FOCUS</text><text class="name-focus" x="404" y="334">Working context</text>
  <text class="note" x="48" y="400">Er is geen neutrale default: elk systeem kiest wat het bewaart, ophaalt, samenvat of weglaat.</text>
  <defs><marker id="ctx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
