<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uvp-title uvp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvp-title">Vastgelegde en afgeleide status in een uv-project</title>
  <desc id="uvp-desc">De repository commit projectdeclaraties, source en tests, een Python-versieverzoek en de opgeloste uv-lock. De lock en het Python-verzoek produceren een wegwerpbare lokale virtual environment. Ook de cache is afgeleid en wegwerpbaar.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#F7F7F4" />

  <rect x="48" y="48" width="472" height="320" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="section" x="72" y="76">COMMIT · BRON VAN WAARHEID</text>

  <rect class="process" x="72" y="96" width="200" height="96" rx="10" />
  <text class="kind" x="92" y="130">DECLARATIE · PROCES</text>
  <text class="name" x="92" y="158">pyproject.toml</text>
  <text class="note" x="92" y="178">requirements · groepen</text>

  <rect class="store" x="296" y="96" width="200" height="96" rx="10" />
  <text class="kind" x="316" y="130">REPOSITORY · OPSLAG</text>
  <text class="name" x="316" y="158">Source + tests</text>
  <text class="note" x="316" y="178">projectgedrag</text>

  <rect class="store" x="72" y="232" width="200" height="96" rx="10" />
  <text class="kind" x="92" y="266">VERZOEK · OPSLAG</text>
  <text class="name" x="92" y="294">.python-version</text>
  <text class="note" x="92" y="314">interpreterselectie</text>

  <rect x="296" y="232" width="200" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="316" y="266" fill="#C50E72">FOCUS · RESOLUTIE</text>
  <text class="name" x="316" y="294" fill="#C50E72">uv.lock</text>
  <text class="note" x="316" y="314" fill="#C50E72">multi-platformgrafiek</text>

  <rect x="560" y="48" width="352" height="320" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="section" x="584" y="76">AFLEIDEN · LOKAAL REBUILDEN</text>

  <rect class="store" x="584" y="96" width="304" height="96" rx="10" />
  <text class="kind" x="604" y="130">CACHE · OPSLAG</text>
  <text class="name" x="604" y="158">Downloads + builds</text>
  <text class="note" x="604" y="178">herbruikbaar, nooit gezaghebbend</text>

  <rect class="store" x="584" y="232" width="304" height="96" rx="10" />
  <text class="kind" x="604" y="266">ENVIRONMENT · OPSLAG</text>
  <text class="name" x="604" y="294">.venv</text>
  <text class="note" x="604" y="314">geïnstalleerd voor dit OS + deze architectuur</text>

  <path class="edge" d="M172 192v16h224v20" marker-end="url(#uvp-arrow)" />
  <path class="edge" d="M496 280h80" marker-end="url(#uvp-arrow)" />
  <path class="edge" d="M172 328v24h404v-56" marker-end="url(#uvp-arrow)" />

  <path d="M48 406h24" stroke="#D8DDD9" />
  <text class="note" x="84" y="411">Commitintentie en resolutie. Negeer .venv en de cache; beide kunnen opnieuw worden opgebouwd.</text>

  <defs>
    <marker id="uvp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
