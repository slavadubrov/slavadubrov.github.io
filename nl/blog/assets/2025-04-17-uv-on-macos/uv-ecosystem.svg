<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uve-title uve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uve-title">De vier uv-workflowgrenzen</title>
  <desc id="uve-desc">Eén uv-executable beheert vier afzonderlijke lifecycles: interpreter-installaties, projectstatus, self-contained scripts en geïsoleerde command-line tools. Homebrew en macOS beheren nog steeds hostapplicaties en native libraries.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#F7F7F4" />

  <text class="section" x="48" y="36">ÉÉN EXECUTABLE · VIER EIGENDOMSGRENZEN</text>

  <rect x="336" y="56" width="288" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="356" y="80" fill="#C50E72">FOCUS · RUNTIME</text>
  <text class="name" x="356" y="103" fill="#C50E72">uv-executable</text>

  <path class="edge" d="M480 118v24H254v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142h226v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142v142H254v24" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 284h226v24" marker-end="url(#uve-arrow)" />

  <rect class="store" x="48" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="210">BEHEERDE PYTHON · STORE</text>
  <text class="name" x="68" y="238">Interpreter-installaties</text>
  <text class="note" x="68" y="258">datadirectory · installeren, vastleggen, detecteren</text>

  <rect class="store" x="500" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="210">PROJECT · STORE</text>
  <text class="name" x="520" y="238">Declaraties, lock, environment</text>
  <text class="note" x="520" y="258">repository-lifecycle · lokale .venv</text>

  <rect class="store" x="48" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="346">PEP 723-SCRIPT · STORE</text>
  <text class="name" x="68" y="374">Release-unit in één bestand</text>
  <text class="note" x="68" y="394">inline metadata · geïsoleerde cache</text>

  <rect class="store" x="500" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="346">CLI-TOOL · STORE</text>
  <text class="name" x="520" y="374">Ephemeral of geïnstalleerd command</text>
  <text class="note" x="520" y="394">uvx-cache · PATH alleen naar keuze</text>

  <path d="M48 438h24" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="84" y="443">Buiten deze grens: Homebrew en macOS beheren hostapplicaties en native libraries.</text>

  <defs>
    <marker id="uve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
