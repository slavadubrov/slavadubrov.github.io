<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="enrichguard-title enrichguard-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="enrichguard-title">API enrichers voegen non-blocking hints toe; een aparte tiered guard bepaalt of de voorgestelde actie mag doorgaan.</title><desc id="enrichguard-desc">Een externe API-response wordt door meer dan twintig enrichers geïnspecteerd, die role- en pagination-hints aan de context toevoegen. Een hybrid search over de bedrijfswiki, met regex-, semantic- en keyword-streams, voedt dezelfde reasoning agent. De agent kiest een actie, waarna de gerichte tiered guard beslist: hard block, soft block of soft hint, voordat de actie doorgaat.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="enrichguard-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="enrichguard-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="810" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">API enrichers sturen de agent voordat tiered guards beslissen</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Team J8Gvbi scheidde non-blocking hints van een aparte guard met drie modi.</text>
