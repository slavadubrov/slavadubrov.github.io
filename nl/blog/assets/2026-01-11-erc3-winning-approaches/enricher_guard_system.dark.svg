<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Enrichers voegen non-blocking guidance toe; het guard-systeem beslist of een actie doorgaat.</text>
<text x="32" y="784" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Hard blocks stoppen een actie; soft blocks staan een retry toe; soft hints geven alleen richting.</text>
