<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pp-title pp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="pp-title">Pipeline-parallel stages en micro-batches</title>
  <desc id="pp-desc">Vier stage-rijen bevatten verschillende layer-groepen. Drie micro-batches bewegen diagonaal door de tijd. Lege startup- en drain-slots vormen de pipeline bubble die onder het schema wordt samengevat.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #EDF5F0; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #A8B8AF; }
    .tick { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #EDF5F0; }
    .row { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .slot { fill: #1B2621; stroke: #2B3B33; stroke-width: 1; }
  </style>
  <rect width="960" height="536" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">DEPTH SPLIT · TIME SCHEDULE</text>
  <text class="note" x="808" y="44">tijd →</text>
  <g>
    <rect class="row" x="48" y="72" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="96">STAGE 0</text><text class="name" x="68" y="120">Layers 0–7</text>
    <rect class="row" x="48" y="158" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="182">STAGE 1</text><text class="name" x="68" y="206">Layers 8–15</text>
    <rect class="row" x="48" y="244" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="268">STAGE 2</text><text class="name" x="68" y="292">Layers 16–23</text>
    <rect class="row" x="48" y="330" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="354">STAGE 3</text><text class="name" x="68" y="378">Layers 24–31</text>
  </g>
  <g>
    <rect class="slot" x="248" y="72" width="88" height="62" rx="6" /><rect class="slot" x="352" y="72" width="88" height="62" rx="6" /><rect class="slot" x="456" y="72" width="88" height="62" rx="6" />
    <rect class="slot" x="352" y="158" width="88" height="62" rx="6" /><rect class="slot" x="456" y="158" width="88" height="62" rx="6" /><rect class="slot" x="560" y="158" width="88" height="62" rx="6" />
    <rect class="slot" x="456" y="244" width="88" height="62" rx="6" /><rect class="slot" x="560" y="244" width="88" height="62" rx="6" /><rect class="slot" x="664" y="244" width="88" height="62" rx="6" />
    <rect class="slot" x="560" y="330" width="88" height="62" rx="6" /><rect class="slot" x="664" y="330" width="88" height="62" rx="6" /><rect class="slot" x="768" y="330" width="88" height="62" rx="6" />
    <g class="tick" text-anchor="middle">
      <text x="292" y="109">μ0</text><text x="396" y="109">μ1</text><text x="500" y="109">μ2</text>
      <text x="396" y="195">μ0</text><text x="500" y="195">μ1</text><text x="604" y="195">μ2</text>
      <text x="500" y="281">μ0</text><text x="604" y="281">μ1</text><text x="708" y="281">μ2</text>
      <text x="604" y="367">μ0</text><text x="708" y="367">μ1</text><text x="812" y="367">μ2</text>
    </g>
  </g>
  <path d="M248 144h88M352 230h88M456 316h88" fill="none" stroke="#FF6FB6" stroke-width="2.5" stroke-dasharray="7 6" />
  <text class="note" x="248" y="414" fill="#FF6FB6">startup idle slots</text>
  <rect x="248" y="440" width="608" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="268" y="464" fill="#FF6FB6">FOCUS · BUBBLE</text>
  <text class="name" x="268" y="488" fill="#FF6FB6">(stages − 1) / (micro-batches + stages − 1)</text>
  <text class="note" x="48" y="520">Ongelijke stage-tijd creëert meer idle ruimte dan het geïdealiseerde schema.</text>
</svg>
