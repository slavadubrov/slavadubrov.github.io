<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="sd-title sd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="sd-title">Workflow voor distributed scaling, constraint-first</title>
  <desc id="sd-desc">Profileer één workload, identificeer de binding constraint, breng de vereiste communicatie in kaart op de hardwaretopologie, benchmark geldige meshes en selecteer alleen een layout die past en de beste gemeten performance oplevert.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #EDF5F0; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #A8B8AF; }
    .num { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="592" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">CONSTRAINT-FIRST WORKFLOW</text>
  <g>
    <circle cx="62" cy="76" r="14" fill="#EDF5F0" /><text class="num" x="62" y="81" text-anchor="middle">1</text>
    <circle cx="286" cy="76" r="14" fill="#EDF5F0" /><text class="num" x="286" y="81" text-anchor="middle">2</text>
    <circle cx="510" cy="76" r="14" fill="#EDF5F0" /><text class="num" x="510" y="81" text-anchor="middle">3</text>
    <circle cx="734" cy="76" r="14" fill="#EDF5F0" /><text class="num" x="734" y="81" text-anchor="middle">4</text>
  </g>
  <g>
    <rect class="box" x="48" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="138">PROFILE</text><text class="name" x="68" y="166">Meet workload</text>
    <rect class="box" x="272" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="138">CLASSIFY</text><text class="name" x="292" y="166">Binding constraint</text>
    <rect class="box" x="496" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="138">TOPOLOGY</text><text class="name" x="516" y="166">Plaats collectives</text>
    <rect class="box" x="720" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="138">BENCHMARK</text><text class="name" x="740" y="166"><tspan x="740">Voer geldige meshes</tspan><tspan x="740" dy="1.2em">uit</tspan></text>
  </g>
  <path class="edge" d="M240 152h24" marker-end="url(#sd-arrow)" /><path class="edge" d="M464 152h24" marker-end="url(#sd-arrow)" /><path class="edge" d="M688 152h24" marker-end="url(#sd-arrow)" />
  <path class="box" d="M480 248 592 320 480 392 368 320Z" />
  <text class="kind" x="480" y="304" text-anchor="middle">DECISION</text>
  <text class="name" x="480" y="332" text-anchor="middle">Past + wint?</text>
  <path class="edge" d="M816 200v120H600" marker-end="url(#sd-arrow)" />
  <rect x="680" y="272" width="56" height="24" rx="6" fill="#0C1210" /><text class="note" x="708" y="289" text-anchor="middle" style="font-size: 12px;">resultaten</text>
  <path class="edge" stroke-dasharray="7 6" d="M368 320H144V208" marker-end="url(#sd-arrow)" />
  <rect x="232" y="308" width="72" height="24" rx="6" fill="#0C1210" /><text class="note" x="268" y="325" text-anchor="middle" style="font-size: 12px;">nee · herzien</text>
  <path d="M480 392v40" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#sd-arrow-signal)" />
  <rect x="352" y="440" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="372" y="474" fill="#FF6FB6">MEASURED WINNER</text>
  <text class="name" x="372" y="502" fill="#FF6FB6">Deployable layout</text>
  <rect x="492" y="400" width="48" height="24" rx="6" fill="#0C1210" /><text class="note" x="516" y="417" text-anchor="middle" fill="#FF6FB6">ja</text>
  <path class="edge" d="M48 560h864" stroke="#2B3B33" />
  <text class="note" x="48" y="576">State → FSDP · layer math → TP · depth → PP · sequence → CP · experts → EP</text>
  <defs>
    <marker id="sd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker>
    <marker id="sd-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker>
  </defs>
</svg>
