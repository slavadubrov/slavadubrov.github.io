<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="dp-title dp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="dp-title">Gerepliceerde data-parallel training</title>
  <desc id="dp-desc">Vier ranks verwerken verschillende micro-batches, terwijl elke rank een volledige training-replica opslaat. Hun gradients komen samen in één all-reduce, waarna elke rank dezelfde update toepast.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">BATCH GESPLITST · STATE GEREPLICEERD</text>

  <g>
    <rect class="box" x="48" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="106">RANK 0</text><text class="name" x="68" y="134">Batch A · volledige replica</text>
    <rect class="box" x="272" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="106">RANK 1</text><text class="name" x="292" y="134">Batch B · volledige replica</text>
    <rect class="box" x="496" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="106">RANK 2</text><text class="name" x="516" y="134">Batch C · volledige replica</text>
    <rect class="box" x="720" y="72" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="106">RANK 3</text><text class="name" x="740" y="134">Batch D · volledige replica</text>
  </g>

  <path class="edge" d="M144 168v40h336v40M368 168v40M592 168v40H480M816 168v40H480" />
  <path class="edge" d="M480 208v32" marker-end="url(#dp-arrow)" />
  <rect x="352" y="248" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="372" y="282" fill="#C50E72">COLLECTIVE</text>
  <text class="name" x="372" y="310" fill="#C50E72">Gradient all-reduce</text>

  <path class="edge" stroke-dasharray="7 6" d="M608 296h240a16 16 0 0 0 16-16V168" marker-end="url(#dp-arrow)" />
  <text class="note" x="632" y="282">dezelfde update naar elke rank</text>
  <text class="note" x="48" y="388">Throughput kan toenemen; het geheugen voor de model state per rank neemt niet af.</text>
  <defs>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
    <marker id="dp-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker>
  </defs>
</svg>
