<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="cp-title cp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="cp-title">Context-parallel attention exchange</title>
  <desc id="cp-desc">Een lange sequence wordt opgesplitst in vier token shards. Elke rank houdt replicated weights bij en wisselt key- en value-state uit, zodat attention de volledige context blijft zien.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">SEQUENCE SPLIT · WEIGHTS REPLICATED</text>

  <rect x="352" y="64" width="256" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="372" y="88">SEQUENCE</text><text class="name" x="372" y="112">S₀ + S₁ + S₂ + S₃</text>
  <path class="edge" d="M480 126v38H144v36M480 164H368v36M480 164h112v36M480 164h336v36" />

  <g>
    <rect class="box" x="48" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="234">RANK 0</text><text class="name" x="68" y="262">Tokens S₀</text>
    <rect class="box" x="272" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="234">RANK 1</text><text class="name" x="292" y="262">Tokens S₁</text>
    <rect class="box" x="496" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="234">RANK 2</text><text class="name" x="516" y="262">Tokens S₂</text>
    <rect class="box" x="720" y="200" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="234">RANK 3</text><text class="name" x="740" y="262">Tokens S₃</text>
  </g>
  <text class="note" x="68" y="282">full model</text><text class="note" x="292" y="282">full model</text><text class="note" x="516" y="282">full model</text><text class="note" x="740" y="282">full model</text>

  <path class="edge" stroke-dasharray="2 6" d="M144 296v40h336M368 296v40M592 296v40H480M816 296v40H480" />
  <path class="edge" stroke-dasharray="2 6" d="M480 336v32" marker-end="url(#cp-arrow)" />
  <rect x="352" y="368" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="372" y="402" fill="#C50E72">ATTENTION</text>
  <text class="name" x="372" y="430" fill="#C50E72">Exchange K/V state</text>
  <text class="note" x="48" y="488">Activation memory neemt af; attention-communicatie komt op het kritieke pad.</text>
  <defs><marker id="cp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
