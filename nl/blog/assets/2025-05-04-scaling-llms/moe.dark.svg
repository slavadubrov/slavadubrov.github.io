<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="moe-title moe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="moe-title">Expert-parallel token routing</title><desc id="moe-desc">Een router scoort een token batch en dispatcht representaties via een all-to-all collective naar vier experts, die doorgaans ongelijke loads ontvangen. Een combine-stap herstelt de oorspronkelijke tokenvolgorde nadat elke expert de berekening heeft uitgevoerd.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="moe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="moe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="720" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Expert-parallel token routing</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een router scoort tokens en dispatcht ze naar experts met ongelijke load.</text>
