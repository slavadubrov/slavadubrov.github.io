<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="reasoncompare-title reasoncompare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reasoncompare-title">ReAct, ReWOO en Plan-and-Execute gebruiken dezelfde tools, maar leggen zich op verschillende momenten vast op een plan.</title><desc id="reasoncompare-desc">Drie banen vergelijken de control flow en de timing van het plan. ReAct kiest na elke observatie: de hoogste adaptability, met herhaalde model calls. ReWOO legt vóór de uitvoering de volledige dependency graph vast: de laagste adaptability, met de minste calls. Plan-and-Execute legt een overkoepelend plan vast en kan dit alleen aanpassen met een expliciete replanner: gemiddelde adaptability, met meer state om bij te houden. Alleen het commitment point verschilt: ReAct kan na elk resultaat van richting veranderen, ReWOO alleen via fallback logic en Plan-and-Execute bij step checkpoints.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reasoncompare-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="reasoncompare-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
