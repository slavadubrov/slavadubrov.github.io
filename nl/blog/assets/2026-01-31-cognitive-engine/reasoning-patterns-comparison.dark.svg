<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 544" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="compare-title compare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="compare-title">ReAct, ReWOO en Plan-and-Execute verschillen in wanneer evidence het plan mag wijzigen</title>
  <desc id="compare-desc">Drie uitgelijnde banen vergelijken de control flow en timing van het plan. ReAct kiest na elke observatie. ReWOO legt de volledige dependency graph vast vóór execution. Plan-and-Execute legt een overall plan vast, maar kan dit bij step checkpoints herzien.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; } .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="1120" height="544" rx="14" /><text class="section" x="48" y="44">DEZELFDE TOOLS, ANDER COMMITMENT POINT</text>
  <rect class="group" x="48" y="64" width="320" height="296" rx="12" /><rect class="group" x="400" y="64" width="320" height="296" rx="12" /><rect class="group" x="752" y="64" width="320" height="296" rx="12" />
  <rect class="process" x="72" y="88" width="272" height="96" rx="10" /><text class="kind" x="92" y="122">PATROON · INTERACTIEF</text><text class="name" x="92" y="150">ReAct</text><text class="note" x="92" y="169">thought → action → observation ↺</text>
  <rect class="process" x="424" y="88" width="272" height="96" rx="10" /><text class="kind" x="444" y="122">PATROON · GEKOPPELD</text><text class="name" x="444" y="150">ReWOO</text><text class="note" x="444" y="169">planner → worker graph → solver</text>
  <rect class="process" x="776" y="88" width="272" height="96" rx="10" /><text class="kind" x="796" y="122">PATROON · HIËRARCHISCH</text><text class="name" x="796" y="150">Plan-and-Execute</text><text class="note" x="796" y="169">planner → step loops → replanner</text>
  <path class="edge" d="M208 184v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M560 184v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M912 184v32" marker-end="url(#compare-arrow)" />
  <rect class="store" x="72" y="224" width="272" height="96" rx="10" /><text class="kind" x="92" y="258">TIMING VAN HET PLAN</text><text class="name" x="92" y="286">Eén stap tegelijk</text><text class="note" x="92" y="305">hoogste adaptability · herhaalde calls</text>
  <rect class="store" x="424" y="224" width="272" height="96" rx="10" /><text class="kind" x="444" y="258">TIMING VAN HET PLAN</text><text class="name" x="444" y="286">Volledige graph vooraf</text><text class="note" x="444" y="305">laagste adaptability · minder calls</text>
  <rect class="store" x="776" y="224" width="272" height="96" rx="10" /><text class="kind" x="796" y="258">TIMING VAN HET PLAN</text><text class="name" x="796" y="286">Plan, daarna checkpoints</text><text class="note" x="796" y="305">gemiddelde adaptability · meer state</text>
  <rect class="focus" x="48" y="400" width="1024" height="96" rx="10" /><text class="kind focus-kind" x="72" y="430">FOCUS · WAAR KAN EVIDENCE HET PLAN WIJZIGEN?</text><text class="name focus-name" x="72" y="462">ReAct: elk resultaat</text><text class="name focus-name" x="400" y="462">ReWOO: alleen fallback logic</text><text class="name focus-name" x="776" y="462">Plan-and-Execute: checkpoints</text><text class="note" x="72" y="484">Kies op basis van waar een verkeerde aanname waarschijnlijk aan het licht komt en meet daarna de kosten en latency op je eigen taken.</text>
  <path class="edge" d="M208 360v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M560 360v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M912 360v32" marker-end="url(#compare-arrow)" />
  <defs><marker id="compare-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
