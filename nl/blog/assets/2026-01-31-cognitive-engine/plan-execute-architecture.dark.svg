<text x="32" y="1026" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Het state schema forked niet per pattern — routing is conversion code, geen drie afzonderlijke schema’s.</text>
