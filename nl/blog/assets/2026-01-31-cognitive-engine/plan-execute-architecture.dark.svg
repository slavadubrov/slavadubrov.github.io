<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">Een router stuurt een marktvraag naar een van twee reasoning loops die naar dezelfde getypeerde state schrijven.</title><desc id="planexecarch-desc">Een router classificeert een marktvraag als deep research of flash briefing. Deep research gebruikt Plan-and-Execute: een planner schrijft 4–6 stappen, een executor voert elke stap uit als een ReAct-loop en een reporter stelt het rapport op. Flash briefing gebruikt ReWOO: een planner schrijft een tool dependency graph, een worker voert die uit en een solver synthetiseert één resultaat. De reporter en de ReWOO-solver schrijven beide naar één gedeeld getypeerd state-object, hoewel alleen de deep-researchroute via de reporter loopt — de ReWOO-solver schrijft rechtstreeks naar state.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
