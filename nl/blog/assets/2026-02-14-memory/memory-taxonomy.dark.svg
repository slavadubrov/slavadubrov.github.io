<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mtd-title mtd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mtd-title">Zes typen agent memory, gegroepeerd in drie storage tiers</title>
  <desc id="mtd-desc">Hot memory bevat working en short-term memory, cold memory bevat episodic en semantic memory, en document memory slaat projectkennis op. Procedural memory staat buiten de storage tiers in system instructions en tool definitions. Working memory is gemarkeerd als de context die het model nu kan gebruiken.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">HOT TIER · CURRENT THREAD</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">FOCUS · WORKING</text>
  <text class="name focus-text" x="92" y="174">Huidige context</text>
  <text class="note" x="92" y="194">één modelstap · niet persistent</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">STORE · SHORT-TERM</text>
  <text class="name" x="92" y="310">Thread-checkpoint</text>
  <text class="note" x="92" y="330">minuten–uren · pauzeren en hervatten</text>
  <text class="note" x="72" y="408">Nu bruikbaar; checkpoints maken herstel mogelijk.</text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">COLD TIER · ACROSS THREADS</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">STORE · EPISODIC</text>
  <text class="name" x="444" y="174">Eerdere interacties</text>
  <text class="note" x="444" y="194">dagen–maanden · gebeurtenissen en geschiedenis</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">STORE · SEMANTIC</text>
  <text class="name" x="444" y="310">Feiten en voorkeuren</text>
  <text class="note" x="444" y="330">maanden–permanent · vector of KV</text>
  <text class="note" x="424" y="408">Ophalen op betekenis of key in de volgende thread.</text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94">DOCUMENT TIER · PROJECT KNOWLEDGE</text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">STORE · DOCUMENT</text>
  <text class="name" x="796" y="174">Inspecteerbare bestanden</text>
  <text class="note" x="796" y="194">notities · research · geleerde patronen</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="800" y="246">FILES</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Door mensen leesbaar, bewerkbaar en versioned.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">EXTERNAL · PROCEDURAL</text>
  <text class="name" x="420" y="520">System prompt en tools</text>
  <text class="note" x="420" y="544">Wordt met de agent meegeleverd; geen retrieved tier.</text>
</svg>
