<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 368" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lmd-title lmd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lmd-title">Cold-memory retrieval van een nieuw bericht naar planningcontext</title>
  <desc id="lmd-desc">Een nieuw gebruikersbericht wordt ge-embed, doorzocht in Qdrant met een user-filter, opnieuw gerankt op relevantie, recentheid en belang, en vervolgens geïnjecteerd in de plannercontext. Het opnieuw ranken is uitgelicht omdat ruwe cosine similarity slechts het eerste retrieval-signaal is.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="368" rx="14" fill="#0C1210" />

  <circle cx="62" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="62" y="63" text-anchor="middle">1</text>
  <circle cx="270" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="270" y="63" text-anchor="middle">2</text>
  <circle cx="478" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="478" y="63" text-anchor="middle">3</text>
  <circle cx="686" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="686" y="63" text-anchor="middle">4</text>
  <circle cx="894" cy="58" r="14" fill="#EDF5F0" /><text class="num" x="894" y="63" text-anchor="middle">5</text>

  <rect class="external" x="48" y="88" width="168" height="96" rx="10" />
  <text class="kind" x="68" y="122">EXTERNAL · QUERY</text>
  <text class="name" x="68" y="150">Nieuw bericht</text>
  <text class="note" x="68" y="170">“Werk mijn analyse bij”</text>

  <rect class="process" x="256" y="88" width="168" height="96" rx="10" />
  <text class="kind" x="276" y="122">PROCESS · EMBED</text>
  <text class="name" x="276" y="150">Query encoderen</text>
  <text class="note" x="276" y="170">Vector met 1536 dimensies</text>

  <rect class="store" x="464" y="88" width="168" height="96" rx="10" />
  <text class="kind" x="484" y="122">STORE · QDRANT</text>
  <text class="name" x="484" y="150">Memories doorzoeken</text>
  <text class="note" x="484" y="170">filter: user_id</text>

  <rect class="focus" x="672" y="88" width="168" height="96" rx="10" />
  <text class="kind focus-text" x="692" y="122">FOCUS · RANK</text>
  <text class="name focus-text" x="692" y="150">Resultaten opnieuw ranken</text>
  <text class="note" x="692" y="170">de bruikbare feiten behouden</text>

  <rect class="process" x="880" y="88" width="192" height="96" rx="10" />
  <text class="kind" x="900" y="122">PROCESS · PLANNER</text>
  <text class="name" x="900" y="150">Context injecteren</text>
  <text class="note" x="900" y="170">gepersonaliseerd plan</text>

  <path class="edge" d="M216 136h32" marker-end="url(#lmd-arrow)" />
  <path class="edge" d="M424 136h32" marker-end="url(#lmd-arrow)" />
  <path class="edge" d="M632 136h32" marker-end="url(#lmd-arrow)" />
  <path class="edge" d="M840 136h32" marker-end="url(#lmd-arrow)" />

  <rect x="640" y="232" width="264" height="80" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="664" y="258">DRIE SIGNALEN, ÉÉN SCORE</text>
  <text class="name" x="664" y="286">Relevantie · recentheid · belang</text>
  <path class="edge" d="M756 184v40" marker-end="url(#lmd-arrow)" />
  <text class="note" x="48" y="344">De user-filter beperkt eerst het eigenaarschap; daarna bepaalt het opnieuw ranken welke memories schaarse ruimte in het context window verdienen.</text>

  <defs>
    <marker id="lmd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
