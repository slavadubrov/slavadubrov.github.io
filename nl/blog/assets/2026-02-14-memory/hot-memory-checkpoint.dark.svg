<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hotckpt-title hotckpt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hotckpt-title">Na elke voltooide super-step wordt een checkpoint geschreven; recovery hervat op die grens, niet op een willekeurige coderegel.</title><desc id="hotckpt-desc">Wanneer een LangGraph-node een super-step voltooit, serialiseert het framework de volledige graph state naar een checkpoint voordat de volgende node start. Na een process-restart of human-in-the-loop-goedkeuring laadt de graph het laatst voltooide checkpoint en hervat bij de volgende node-grens, niet bij de Python-regel waar de worker stopte.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hotckpt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="hotckpt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="568" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Eén checkpoint per super-step</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Recovery hervat bij de laatst voltooide node-grens, niet bij een willekeurige regel.</text>
<path d="M42 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESS · SUPER-STEP</text><text x="46" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Node voltooit</text><text x="46" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">messages · plan</text><text x="46" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">verzamelde data</text><circle cx="32" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M266 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M266 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="270" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · CHECKPOINT</text><text x="270" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Graph state opslaan</text><text x="270" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">thread · namespace</text><text x="270" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">channel-versie</text><circle cx="256" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="256" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M490 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M490 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="494" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESS · GRAPH</text><text x="494" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 16.5px;">Volgende node betreden</text><text x="494" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">de enige veilige</text><text x="494" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">hervattingsgrens</text><circle cx="480" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="480" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M240 180h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" />
<path d="M464 180h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" />
<path d="M386 344h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M386 344h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="390" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXTERNAL · INTERRUPTION</text><text x="390" y="405" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Restart of HITL</text><text x="390" y="427" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">hervattingsverzoek</text>
<path d="M360 232v40h120v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" /><rect x="355" y="260" width="130" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="420" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">state serialiseren</text>
<path d="M584 344v-112" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#hotckpt-arrow-flow)" /><rect x="522.5" y="276" width="123" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="584" y="292.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">hervattingsverzoek</text>
<path d="M32 488h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een checkpoint is een hervattingsgrens, geen auditlog of event trace.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zowel een interruptie als een restart laadt hetzelfde checkpoint opnieuw voordat de graph verdergaat.</text>
</svg>
