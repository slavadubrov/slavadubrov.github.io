<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="fullmem-title fullmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fullmem-title">Hot, cold en document memory zijn via paden met één agent harness verbonden; sommige lopen synchroon met het request, andere worden op de achtergrond uitgesteld.</title><desc id="fullmem-desc">Een user request komt de agent harness binnen. Die schrijft checkpoints weg en herstelt ze op het hot path, haalt vóór de planning synchroon feiten uit de long-term memory op en stelt het wegschrijven van nieuwe feiten uit naar een background job. Bij de startup leest hij de document memory in en stelt ook nieuwe writes daar uit. Doorgetrokken lijnen liggen op het execution- of recovery path; stippellijnen zijn background updates die de reasoning loop nooit mogen blokkeren.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fullmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="fullmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Drie memory-paden, één harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">De harness bepaalt wat het model bereikt; de stores houden alleen state vast totdat dat gebeurt.</text>
