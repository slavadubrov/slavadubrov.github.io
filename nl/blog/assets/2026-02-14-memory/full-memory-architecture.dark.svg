<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Recall uit de cold memory blokkeert de planning; het extraheren en opslaan van nieuwe feiten niet.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">De harness, niet één specifieke store, bepaalt wat daadwerkelijk de context window van het model bereikt.</text>
