<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">Redis- en PostgreSQL-checkpoint backends vergeleken</title>
  <desc id="rp-desc">Een uitgelijnde vergelijking van Redis en PostgreSQL op toegangstijd, duurzaamheid, historie, querymodel en operationele geschiktheid. PostgreSQL wordt uitgelicht als duurzame default; Redis is de latency-first-optie wanneer het verlies van recente state herstelbaar is.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .rule { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">STORE · LATENCY FIRST</text>
  <text class="name" x="92" y="136">Redis checkpoint saver</text>
  <text class="note" x="92" y="156">Kies dit wanneer resume-latency de bottleneck is.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">FOCUS · DURABLE DEFAULT</text>
  <text class="name focus-text" x="540" y="136">PostgreSQL checkpoint saver</text>
  <text class="note" x="540" y="156">Kies dit wanneer verlies van afgerond werk onacceptabel is.</text>

  <text class="kind" x="72" y="206">TOEGANGSTIJD</text>
  <text class="value" x="72" y="230">Minder dan een milliseconde</text>
  <text class="note" x="72" y="250">reads en writes in memory</text>
  <text class="kind" x="520" y="206">TOEGANGSTIJD</text>
  <text class="value" x="520" y="230">Lage single-digit milliseconden</text>
  <text class="note" x="520" y="250">database-write bij elke grens</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">DUURZAAMHEID</text>
  <text class="value" x="72" y="318">Geconfigureerd met AOF of RDB</text>
  <text class="note" x="72" y="338">recente writes kunnen verloren gaan of worden geëvict</text>
  <text class="kind" x="520" y="294">DUURZAAMHEID</text>
  <text class="value" x="520" y="318">ACID-transacties en WAL</text>
  <text class="note" x="520" y="338">checkpoint blijft behouden na een gecommitte write</text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">HISTORIE · QUERYMODEL</text>
  <text class="value" x="72" y="406">Retention plus key-/search-indexen</text>
  <text class="note" x="72" y="426">historie hangt af van saver en eviction policy</text>
  <text class="kind" x="520" y="382">HISTORIE · QUERYMODEL</text>
  <text class="value" x="520" y="406">Duurzame historie plus SQL en JSONB</text>
  <text class="note" x="520" y="426">resume, inspectie en time-travel-debugging</text>

  <text class="note" x="72" y="462">Beste fit: herstelbare, latency-gevoelige session state.</text>
  <text class="note" x="520" y="462">Beste fit: lange taken en reproduceerbaar herstel.</text>
  <text class="note" x="48" y="510">Benchmark de grootte van je serialized state en de write-frequentie; generieke database-benchmarks voorspellen de checkpoint-kosten niet.</text>
</svg>
