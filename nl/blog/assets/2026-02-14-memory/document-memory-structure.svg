<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">De document-memorydirectory bevat vier topicmappen onder één gedeelde root, en vier operations — read, write, list en search — werken over alle mappen heen.</title><desc id="docmem-desc">De gedeelde .agent-memorydirectory bevat user-profiles, research, conventions en learnings als Markdown-bestanden. Een kleine file-memoryinterface biedt vier operations die hun target path allemaal binnen diezelfde root oplossen: read retourneert de content van een document, write maakt een document aan of vervangt het, list matcht paths met een glob pattern en search retourneert de paragrafen die met een keyword matchen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
