<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Git registreert elke wijziging die de agent hier maakt — een slechte learning is met één revert verdwenen.</text>
