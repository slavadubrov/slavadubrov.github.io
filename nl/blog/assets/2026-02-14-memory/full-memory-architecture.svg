<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fa-title fa-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fa-title">Hot, cold en document memory rond één agent</title>
  <desc id="fa-desc">Een user request komt binnen bij de agent. De agent schrijft hot checkpoints weg en herstelt ze, leest relevante cold memories vóór het plannen en werkt deze asynchroon bij, en laadt document memory uit lokale bestanden terwijl writes worden uitgesteld. Doorgetrokken lijnen zijn execution- of recovery-paden; gestippelde lijnen zijn background updates.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
    .async { stroke-dasharray: 2 6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#F7F7F4" />

  <rect class="external" x="440" y="48" width="240" height="62" rx="10" />
  <text class="kind" x="460" y="72">EXTERNAL · USER</text>
  <text class="name" x="460" y="96">Request en response</text>

  <rect class="focus" x="400" y="160" width="320" height="96" rx="10" />
  <text class="kind focus-text" x="420" y="194">FOCUS · AGENT HARNESS</text>
  <text class="name focus-text" x="420" y="222">Bouw de model context</text>
  <text class="note" x="420" y="242">reason · plan · call tools</text>

  <path class="edge" d="M536 110v42" marker-end="url(#fa-arrow)" />
  <path class="edge" d="M584 160v-42" stroke-dasharray="7 6" marker-end="url(#fa-arrow)" />
  <text class="note" x="476" y="140">request</text>
  <text class="note" x="598" y="140">response</text>

  <text class="kind" x="48" y="372">HOT PATH · CURRENT THREAD</text>
  <rect class="store" x="48" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="426">STORE · CHECKPOINT</text>
  <text class="name" x="68" y="454">PostgreSQL of Redis</text>
  <text class="note" x="68" y="474">elke super-step · hervatten in 1–5 ms</text>

  <text class="kind" x="424" y="372">COLD PATH · ACROSS THREADS</text>
  <rect class="store" x="424" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="426">STORE · LONG-TERM</text>
  <text class="name" x="444" y="454">Vector of key-value</text>
  <text class="note" x="444" y="474">relevante feiten · 100–300 ms</text>

  <text class="kind" x="800" y="372">DOCUMENT PATH · PROJECT</text>
  <rect class="store" x="800" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="820" y="426">STORE · FILES</text>
  <text class="name" x="820" y="454">Markdown en JSON</text>
  <text class="note" x="820" y="474">conventies en notities · 1–5 ms</text>

  <path class="edge" d="M400 184H120V384" marker-end="url(#fa-arrow)" />
  <rect x="176" y="172" width="126" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="239" y="186" text-anchor="middle">checkpoint wegschrijven</text>
  <path class="edge" d="M248 392V232H392" marker-end="url(#fa-arrow)" />
  <rect x="279" y="220" width="82" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="320" y="234" text-anchor="middle">herstellen</text>

  <path class="edge" d="M512 392V264" marker-end="url(#fa-arrow)" />
  <rect x="432" y="304" width="78" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="471" y="318" text-anchor="middle">recall</text>
  <path class="edge async" d="M624 256v128" marker-end="url(#fa-arrow)" />
  <rect x="630" y="304" width="148" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="704" y="318" text-anchor="middle">background update</text>

  <path class="edge" d="M936 392V232H728" marker-end="url(#fa-arrow)" />
  <rect x="783" y="220" width="98" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="832" y="234" text-anchor="middle">startup read</text>
  <path class="edge async" d="M720 184h280v200" marker-end="url(#fa-arrow)" />
  <rect x="828" y="172" width="100" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="878" y="186" text-anchor="middle">deferred write</text>

  <path class="edge" d="M48 544h64" marker-end="url(#fa-arrow)" />
  <text class="note" x="128" y="549">execution- of recovery-pad</text>
  <path class="edge async" d="M392 544h64" marker-end="url(#fa-arrow)" />
  <text class="note" x="472" y="549">asynchronous update</text>
  <text class="note" x="48" y="580">De harness—niet de stores—bepaalt wat de bounded context window van het model bereikt.</text>

  <defs>
    <marker id="fa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
