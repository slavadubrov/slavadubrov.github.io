<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="fullmem-title fullmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fullmem-title">Hot, cold en document memory lopen via één agent harness, met paden die synchroon met het verzoek verlopen of naar de achtergrond worden uitgesteld.</title><desc id="fullmem-desc">Een user request komt de agent harness binnen. Die schrijft checkpoints naar en herstelt ze op het hot path, haalt vóór het plannen synchroon langetermijnfeiten op en stelt het opslaan van nieuwe feiten uit naar een background job. Tijdens elke planner-aanroep leest de harness document memory; ook nieuwe writes daarheen worden uitgesteld. Doorgetrokken lijnen liggen op het execution- of recovery path; stippellijnen zijn background updates die de reasoning loop nooit mogen blokkeren.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fullmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="fullmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Drie memory-paden, één harness</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">De harness bepaalt wat het model bereikt; de stores houden alleen state vast totdat dat gebeurt.</text>
