<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Recall uit cold memory blokkeert het plannen; het extraheren en opslaan van nieuwe feiten niet.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">De harness, niet één specifieke store, bepaalt wat daadwerkelijk de context window van het model bereikt.</text>
