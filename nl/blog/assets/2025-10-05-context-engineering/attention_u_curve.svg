<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Positie-effecten in tests met lange context</title>
  <desc id="artifact-desc">Een kwalitatieve samenvatting van Lost in the Middle. In het onderzoek werd gevarieerd waar relevante informatie verscheen; vaak werden betere taakprestaties aan het begin of einde gevonden. Het resultaat varieerde per model, taak en contextlengte en definieert geen universele penalty.</desc>
  <style>
    .title{font-size: 24px;font-weight:700;fill: #0f172a}.subtitle{font-size: 13px;fill: #64748b}.panel{fill: #ffffff;stroke: #cbd5e1;stroke-width:1.5}.heading{font-size: 15px;font-weight:700;fill: #0f172a}.label{font-size: 13px;fill: #0f172a}.note{font-size: 12px;fill: #64748b}.axis{stroke: #94a3b8;stroke-width:1.5}.curve{fill:none;stroke: #2563eb;stroke-width:4}.guide{stroke: #e2e8f0;stroke-width:1.5;stroke-dasharray:5 5}.chip{font-size: 12px;font-weight:600}.arrow{stroke: #2563eb;stroke-width:2;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb" /></marker></defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="470" rx="14" fill="#f8fafc" />
  <text x="48" y="48" class="title">Wat ‘lost in the middle’ wel en niet laat zien</text>
  <text x="48" y="72" class="subtitle">Kwalitatief resultaat van Liu et al. over multi-document QA en key-value retrieval</text>

  <rect x="48" y="104" width="560" height="294" rx="12" class="panel" />
  <text x="72" y="136" class="heading">Waargenomen patroon in veel geteste omstandigheden</text>
  <line x1="104" y1="176" x2="104" y2="332" class="axis" />
  <line x1="104" y1="332" x2="560" y2="332" class="axis" />
  <line x1="332" y1="176" x2="332" y2="332" class="guide" />
  <path d="M104 202 C180 202 224 278 332 292 C440 278 484 202 560 202" class="curve" />
  <text x="86" y="180" text-anchor="end" class="note">hoger</text>
  <text x="86" y="332" text-anchor="end" class="note">lager</text>
  <text x="104" y="356" text-anchor="middle" class="label">begin</text>
  <text x="332" y="356" text-anchor="middle" class="label">midden</text>
  <text x="560" y="356" text-anchor="middle" class="label">einde</text>
  <text x="332" y="382" text-anchor="middle" class="note">positie van relevante informatie</text>
  <rect x="130" y="220" width="120" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" />
  <text x="190" y="240" text-anchor="middle" class="chip" fill="#1d4ed8">vaak sterker</text>
  <rect x="414" y="220" width="120" height="30" rx="15" fill="#eff6ff" stroke="#2563eb" />
  <text x="474" y="240" text-anchor="middle" class="chip" fill="#1d4ed8">vaak sterker</text>

  <rect x="632" y="104" width="280" height="294" rx="12" class="panel" />
  <text x="656" y="136" class="heading">Generaliseer de schets niet</text>
  <rect x="656" y="160" width="232" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" />
  <text x="672" y="183" class="label">Geen vaste recall penalty</text>
  <text x="672" y="201" class="note">Het paper rapporteert resultaten per conditie.</text>
  <rect x="656" y="230" width="232" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" />
  <text x="672" y="253" class="label">Geen universele curve</text>
  <text x="672" y="271" class="note">Model, taak, sequentielengte en</text>
  <text x="672" y="288" class="note">promptconstructie veranderen het effect.</text>
  <rect x="656" y="316" width="232" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" />
  <text x="672" y="339" class="label">Engineeringactie</text>
  <text x="672" y="357" class="note">Varieer de positie van evidence in je evaluatie.</text>
  <text x="48" y="438" class="note">Bron: Liu et al., ‘Lost in the Middle’ (2023). De lijn is een kwalitatieve illustratieve schets, geen gedigitaliseerde data uit het paper.</text>
</svg>
