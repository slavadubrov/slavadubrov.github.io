<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Provider-specifieke instructiekanalen</title>
  <desc id="artifact-desc">OpenAI documenteert platform- of system-, developer- en user-instructieautoriteit. De Anthropic Messages API biedt daarentegen een top-level system-parameter en user- en assistant-berichten. Applicatiecode moet voor beide providers de permissies afdwingen.</desc>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
</defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
<rect width="960" height="520" rx="14" fill="#f8fafc" />

<text y="40" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="24px" font-weight="bold" text-anchor="start" x="48">Instructieprioriteit is provider-specifiek</text>
<text y="64" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13px" text-anchor="start" x="48">De OpenAI-autoriteitsniveaus staan hieronder. Deze rolnamen definiëren geen universele API.</text>

<!-- 1. System Policy -->
<g transform="translate(80, 92)">
    <rect x="0" y="0" width="450" height="80" rx="6" ry="6" fill="#991b1b" stroke="#dc2626" stroke-width="2" />
    <text y="30" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="20">1. Platformregels en system-berichten</text>
    <text y="55" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="20">Hoogste OpenAI-autoriteitsniveau in de aangehaalde Model Spec</text>
</g>

<!-- Arrow -->
<line x1="305" y1="172" x2="305" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

<!-- 2. Developer Guidelines -->
<g transform="translate(80, 192)">
    <rect x="0" y="0" width="450" height="80" rx="6" ry="6" fill="#9a3412" stroke="#ea580c" stroke-width="2" />
    <text y="30" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="20">2. Developer-instructies</text>
    <text y="55" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="20">Applicatiegedrag en outputcontract</text>
</g>

<!-- Arrow -->
<line x1="305" y1="272" x2="305" y2="292" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

<!-- 3. User Task -->
<g transform="translate(80, 292)">
    <rect x="0" y="0" width="450" height="80" rx="6" ry="6" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" />
    <text y="30" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="20">3. User-instructies</text>
    <text y="55" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="20">De huidige taak, ondergeschikt aan instructies met hogere autoriteit</text>
</g>

<!-- Arrow -->
<line x1="305" y1="372" x2="305" y2="392" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

<!-- Model -->
<g transform="translate(205, 392)">
    <rect x="0" y="0" width="200" height="50" rx="25" ry="25" fill="#5b21b6" stroke="#7c3aed" stroke-width="2" />
    <text y="30" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="100">Modelrespons</text>
</g>

<!-- Side Note -->
<g transform="translate(570, 92)">
    <rect x="0" y="0" width="310" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text y="34" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="24">Anthropic Messages API</text>
    <text y="64" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">Top-level system-parameter</text>
    <text y="84" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">User- en assistant-berichten</text>
    <text y="104" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">Geen equivalente developer-rol</text>
    <line x1="24" y1="128" x2="286" y2="128" stroke="#e2e8f0" stroke-width="1.5" />
    <text y="158" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="24">Gedeelde handhavingsgrens</text>
    <text y="186" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">Applicatiecode autoriseert tools,</text>
    <text y="205" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">data access en side effects.</text>
    <rect x="24" y="226" width="262" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" />
    <text y="248" fill="#166534" font-family="Inter, system-ui, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="155">Controleer de actuele documentatie van de provider</text>
</g>

<text y="490" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11px" text-anchor="start" x="48">Bronnen: OpenAI Model Spec (2025-02-12) en de Anthropic Messages API-reference.</text>

</svg>
