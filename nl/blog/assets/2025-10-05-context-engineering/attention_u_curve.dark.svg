<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Positie-effecten in tests met lange context</title>
  <desc id="artifact-desc">Een kwalitatieve samenvatting van Lost in the Middle. In de studie werd gevarieerd waar relevante informatie verscheen; vaak bleek de taakprestatie sterker aan het begin of einde. Het resultaat varieerde per model, taak en contextlengte en definieert geen universele penalty.</desc>
  <style>
    .title{font-size: 24px;font-weight:700;fill: #A8B8AF}.subtitle{font-size: 13px;fill: #1B2621}.panel{fill: #141D19;stroke: #A8B8AF;stroke-width:1.5}.heading{font-size: 15px;font-weight:700;fill: #141D19}.label{font-size: 13px;fill: #A8B8AF}.note{font-size: 12px;fill: #1B2621}.axis{stroke: #A8B8AF;stroke-width:1.5}.curve{fill:none;stroke: #EDF5F0;stroke-width:4}.guide{stroke: #2B3B33;stroke-width:1.5;stroke-dasharray:5 5}.chip{font-size: 12px;font-weight:600}.arrow{stroke: #EDF5F0;stroke-width:2;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B2621" /></marker></defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="470" rx="14" fill="#0C1210" />
  <text x="48" y="48" class="title">Wat “lost in the middle” wel en niet laat zien</text>
  <text x="48" y="72" class="subtitle">Kwalitatief resultaat van Liu et al. over multi-document QA en key-value retrieval</text>

  <rect x="48" y="104" width="560" height="294" rx="12" class="panel visual-focus" />
  <text x="72" y="136" class="heading">Waargenomen patroon in veel geteste omstandigheden</text>
  <line x1="104" y1="176" x2="104" y2="332" class="axis" />
  <line x1="104" y1="332" x2="560" y2="332" class="axis" />
  <line x1="332" y1="176" x2="332" y2="332" class="guide" />
  <path d="M104 202 C180 202 224 278 332 292 C440 278 484 202 560 202" class="curve" />
  <text x="86" y="180" text-anchor="end" class="note">hoger</text>
  <text x="86" y="332" text-anchor="end" class="note">lager</text>
  <text x="104" y="356" text-anchor="middle" class="label">begin</text>
  <text x="332" y="356" text-anchor="middle" class="label">midden</text>
  <text x="560" y="356" text-anchor="middle" class="label">einde</text>
  <text x="332" y="382" text-anchor="middle" class="note">positie van relevante informatie</text>
  <rect x="130" y="220" width="120" height="30" rx="15" fill="#141D19" stroke="#EDF5F0" />
  <text x="190" y="240" text-anchor="middle" class="chip" fill="#EDF5F0">vaak sterker</text>
  <rect x="414" y="220" width="120" height="30" rx="15" fill="#141D19" stroke="#EDF5F0" />
  <text x="474" y="240" text-anchor="middle" class="chip" fill="#EDF5F0">vaak sterker</text>

  <rect x="632" y="104" width="280" height="294" rx="12" class="panel" />
  <text x="656" y="136" class="heading">Generaliseer de schets niet</text>
  <rect x="656" y="160" width="232" height="54" rx="8" fill="#141D19" stroke="#A8B8AF" />
  <text x="672" y="183" class="label">Geen vaste recall-penalty</text>
  <text x="672" y="201" class="note">Resultaten zijn conditiegebonden.</text>
  <rect x="656" y="230" width="232" height="70" rx="8" fill="#141D19" stroke="#A8B8AF" />
  <text x="672" y="253" class="label">Geen universele curve</text>
  <text x="672" y="271" class="note">Model, taak, sequentielengte en</text>
  <text x="672" y="288" class="note">promptconstructie veranderen dit.</text>
  <rect x="656" y="316" width="232" height="58" rx="8" fill="#141D19" stroke="#A8B8AF" />
  <text x="672" y="339" class="label">Engineeringactie</text>
  <text x="672" y="357" class="note">Varieer de positie van evidence in evals.</text>
  <text x="48" y="438" class="note">Bron: Liu et al., “Lost in the Middle” (2023). De lijn is een kwalitatieve onderwijsschets, geen gedigitaliseerde paperdata.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
