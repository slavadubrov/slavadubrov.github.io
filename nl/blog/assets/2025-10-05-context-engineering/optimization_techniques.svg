<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Kies een optimalisatie voor de gemeten context-bottleneck</title>
  <desc id="artifact-desc">Vier contexttechnieken gekoppeld aan specifieke bottlenecks en evaluatiematen: compaction voor groeiende history, observation masking voor uitvoerige tool output, prompt caching voor herhaalde prefixes en decision partitioning voor te veel evidence of capabilities.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
    <style>
        .bg { fill: #F7F7F4; }
        .title { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
        .subtitle { fill: #F2F2F5; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
        .card { rx: 12; ry: 12; }
        .card-title { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
        .card-desc { fill: #F2F2F5; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
        .metric { fill: #FFFFFF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
        .metric-box { fill: #ffffff; rx: 6; ry: 6; }
        .use-case { fill: #F2F2F5; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; font-style: italic; }
        .section-label { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: start; }
        .result-box { fill: #FFFFFF; stroke: #59645E; stroke-width: 2; rx: 10; ry: 10; }
        .result-text { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
        .flow-line { stroke: #59645E; stroke-width: 2; stroke-dasharray: 5 5; }
        .number { fill: #FFFFFF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; }
    </style>

    <rect width="100%" height="100%" class="bg" />

    <!-- Title -->
    <text y="35" class="title" x="450">Contextoptimalisatietechnieken</text>
    <text y="58" class="subtitle" x="450">Begin bij de bron van de druk. Elke techniek verandert een andere maat.</text>

    <!-- Horizontal flow line -->
    <line x1="50" y1="260" x2="850" y2="260" class="flow-line" />

    <!-- Technique 1: Compaction -->
    <g transform="translate(30, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#F2F2F5" />
        <text y="30" class="number" text-anchor="middle" x="25">1</text>
        <text y="30" class="card-title" x="105">Compaction</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#17211B" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Vat de context samen wanneer</text>
        <text y="83" class="card-desc" x="97">de grenzen van het context window naderen</text>
        <text y="98" class="card-desc" x="97">Bewaar de canonical state buiten de context</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box visual-focus" stroke="#17211B" stroke-width="1.5" />
        <text y="129" class="metric" x="97">Succes bij continuation</text>
    </g>

    <!-- Technique 2: Observation Masking -->
    <g transform="translate(245, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#F2F2F5" />
        <text y="30" class="number" text-anchor="middle" x="25">2</text>
        <text y="30" class="card-title" x="112">Observation mask</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#17211B" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Vervang tool outputs</text>
        <text y="83" class="card-desc" x="97">door compacte references</text>
        <text y="98" class="card-desc" x="97">Behoud volledige artifact refs</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#17211B" stroke-width="1.5" />
        <text y="129" class="metric" x="97">Aantal re-fetches</text>
    </g>

    <!-- Technique 3: KV-Cache -->
    <g transform="translate(460, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#F2F2F5" />
        <text y="30" class="number" text-anchor="middle" x="25">3</text>
        <text y="30" class="card-title" x="112">Prompt caching</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#59645E" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Gebruik een stabiele prefix opnieuw</text>
        <text y="83" class="card-desc" x="97">om herhaalde kosten te verlagen</text>
        <text y="98" class="card-desc" x="97">Plaats stabiele content eerst</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#59645E" stroke-width="1.5" />
        <text y="129" class="metric" x="97">Context window ongewijzigd</text>
    </g>

    <!-- Technique 4: Partitioning -->
    <g transform="translate(675, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#F2F2F5" />
        <text y="30" class="number" text-anchor="middle" x="25">4</text>
        <text y="30" class="card-title" x="112">Decision partitions</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#59645E" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Verdeel het werk over</text>
        <text y="83" class="card-desc" x="97">stappen per decision en</text>
        <text y="98" class="card-desc" x="97">toegestane capabilities</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#59645E" stroke-width="1.5" />
        <text y="129" class="metric" x="97">Mislukte handoffs</text>
    </g>

    <!-- When to apply section -->
    <text y="295" class="section-label" x="50">WANNEER TOEPASSEN:</text>

    <g transform="translate(30, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #59645E;" x="97">Gebruik voor:</text>
        <text y="40" class="card-desc" x="97">Message history wordt groot</text>
    </g>

    <g transform="translate(245, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #59645E;" x="97">Gebruik voor:</text>
        <text y="40" class="card-desc" x="97">Tool outputs nemen het grootste deel van de context in</text>
    </g>

    <g transform="translate(460, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #59645E;" x="97">Gebruik voor:</text>
        <text y="40" class="card-desc" x="97">Stabiele prompts / templates</text>
    </g>

    <g transform="translate(675, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #59645E;" x="97">Gebruik voor:</text>
        <text y="40" class="card-desc" x="97">Stappen hebben verschillende inputs nodig</text>
    </g>

    <!-- Result box -->
    <g transform="translate(250, 395)">
        <rect x="0" y="0" width="400" height="55" class="result-box" />
        <text y="25" class="result-text" x="200">Stem de techniek af op de gemeten bottleneck</text>
        <text y="45" class="card-desc" style="fill: #59645E;" x="200">Geen universele besparing of gecombineerde multiplier</text>
    </g>

    <!-- Target metrics at bottom -->
    <text y="480" class="section-label" x="50">EVALUEREN:</text>
    <text y="480" class="card-desc" x="250">Task success en incorrecte actions</text>
    <text y="480" class="card-desc" x="500">Latency, totaal aantal tokens en re-fetches</text>
    <text y="480" class="card-desc" x="750">Cache reads en blootstelling van capabilities</text>

    <text y="520" class="card-desc" x="450">Features en thresholds verschillen per provider. Controleer de actuele documentatie.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
