<path d="M32 312h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="338" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Optimaliseer tokens per geslaagde task, inclusief opnieuw ophalen en recovery — niet tokens per request.</text>
