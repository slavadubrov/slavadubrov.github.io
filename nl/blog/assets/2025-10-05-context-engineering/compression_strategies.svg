<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="compress-title compress-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="compress-title">Compression scheidt een compacte working set in de prompt van canonical stores die daarbuiten addressable blijven.</title><desc id="compress-desc">Groeiende context — conversation turns, tool output en retrieved passages — wordt gecomprimeerd tot twee outputs: een compacte working set met beslissingen en open vragen die in de prompt blijft, en canonical stores met task state, artifacts en evidence versions die daarbuiten addressable blijven en opnieuw kunnen worden opgehaald.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="compress-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="compress-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="392" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Comprimeer proza; houd state addressable</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Optimaliseer tokens per geslaagde task, niet tokens per request.</text>
