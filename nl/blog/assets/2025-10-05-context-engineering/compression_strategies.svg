<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Loss-aware context compression met aparte canonical state- en artifact-indexen</title>
  <desc id="desc">Conversation en observaties worden samengevat tot een compacte working set, terwijl de canonical task state, evidence-referenties en artifact history apart opgeslagen blijven voor exact herstel.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#F7F7F4" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">Comprimeer proza; behoud herstelbare state</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Groeiende context</text><text x="30" y="83" font-size="13" fill="#17211B">conversation turns</text><text x="30" y="116" font-size="13" fill="#17211B">raw tool observations</text><text x="30" y="149" font-size="13" fill="#17211B">retrieved passages</text><text x="30" y="182" font-size="13" fill="#17211B">repeated boilerplate</text></g><text x="325" y="225" font-size="25" fill="#17211B">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Compacte working set</text><text x="30" y="83" font-size="13" fill="#17211B">decisions + next action</text><text x="30" y="116" font-size="13" fill="#17211B">getypeerde tool findings</text><text x="30" y="149" font-size="13" fill="#17211B">source- + artifact-referenties</text><text x="30" y="182" font-size="13" fill="#17211B">onopgeloste vragen</text></g><text x="665" y="225" font-size="25" fill="#17211B">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Canonical stores</text><text x="30" y="83" font-size="13" fill="#17211B">task state</text><text x="30" y="116" font-size="13" fill="#17211B">file- en artifact-index</text><text x="30" y="149" font-size="13" fill="#17211B">volledige tool results</text><text x="30" y="182" font-size="13" fill="#17211B">evidence-versies</text><text x="30" y="225" font-size="12" fill="#17211B">Exacte details opnieuw ophalen</text><text x="30" y="247" font-size="12" fill="#17211B">wanneer de task ze nodig heeft.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#17211B">Optimaliseer het totale aantal tokens per succesvolle task, inclusief opnieuw ophalen en herstel.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
