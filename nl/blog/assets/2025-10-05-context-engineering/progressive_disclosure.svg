<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="progressive-title progressive-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="progressive-title">Progressive disclosure houdt identifiers en betrouwbare state gereed en haalt alleen detail op voor de huidige beslissing.</title><desc id="progressive-desc">Per beslissing worden vier stappen uitgevoerd: begin met stabiele identifiers en betrouwbare task state, routeer de beslissing eerst voor autorisatie en scoping voordat je retrieval uitvoert, laad alleen de evidence, memory en tool schemas die passen, en valideer daarna het voorstel vóór execution. Het alternatief — elke bron in elke call kopiëren — verhoogt kosten en exposure zonder aantoonbaar voordeel.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="progressive-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="progressive-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="512" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Progressive disclosure voor één agent-beslissing</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Houd identifiers en betrouwbare state gereed; haal alleen detail op voor de huidige stap.</text>
