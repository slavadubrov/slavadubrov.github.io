<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Memory geselecteerd op tenant, doel, versheid en relevantie</title>
  <desc id="desc">Memory-kandidaten doorlopen controles op subject- en tenant-scope, doel, versheid en relevantie. Alleen geselecteerde records komen in de context; afgewezen records blijven erbuiten.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="420" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Memory retrieval is een beleidsbeslissing</text>
  <g font-family="Inter, system-ui, sans-serif"><g transform="translate(40 110)"><rect width="220" height="210" rx="16" fill="#1e293b" stroke="#64748b" /><text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Memory store</text><text x="28" y="82" font-size="13" fill="#cbd5e1">expliciete user-feiten</text><text x="28" y="112" font-size="13" fill="#cbd5e1">afgeleide hypotheses</text><text x="28" y="142" font-size="13" fill="#cbd5e1">episodic records</text><text x="28" y="172" font-size="13" fill="#cbd5e1">provenance + lifecycle</text></g><text x="290" y="225" font-size="25" fill="#94a3b8">→</text>
  <g transform="translate(330 95)"><rect width="330" height="240" rx="16" fill="#5b21b6" stroke="#2563eb" /><text x="165" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#c4b5fd">Selectiepoorten</text><text x="35" y="82" font-size="13" fill="#93c5fd">1. geauthenticeerd subject + tenant</text><text x="35" y="116" font-size="13" fill="#93c5fd">2. toegestaan doel</text><text x="35" y="150" font-size="13" fill="#93c5fd">3. versheid en reviewstatus</text><text x="35" y="184" font-size="13" fill="#93c5fd">4. relevantie en autoriteit</text><text x="35" y="218" font-size="12" fill="#fca5a5">Geen poort → geen opname in de context</text></g><text x="690" y="225" font-size="25" fill="#94a3b8">→</text>
  <g transform="translate(730 110)"><rect width="230" height="210" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="115" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Geselecteerde working set</text><text x="30" y="84" font-size="13" fill="#93c5fd">minimaal bruikbare feiten</text><text x="30" y="116" font-size="13" fill="#93c5fd">bron behouden</text><text x="30" y="148" font-size="13" fill="#93c5fd">vervaldatum behouden</text><text x="30" y="180" font-size="13" fill="#93c5fd">verwijdering blijft mogelijk</text></g><text x="500" y="382" text-anchor="middle" font-size="13" fill="#94a3b8">Door het model afgeleide memories blijven hypotheses totdat een autoritatieve bron ze bevestigt.</text></g>
</svg>
