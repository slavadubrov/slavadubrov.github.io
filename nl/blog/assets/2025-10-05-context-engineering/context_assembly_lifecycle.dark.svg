<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">De lifecycle wordt per beslissing uitgevoerd — één grote context hergebruiken voor een volledige run</text>
<text x="32" y="624" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">creëert verouderde evidence en geeft elke stap materiaal dat niet nodig is.</text>
