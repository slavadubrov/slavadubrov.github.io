<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 694" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asld-title asld-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asld-title">Waar elk onderdeel van de agentic stack zich bevindt</title>
  <desc id="asld-desc">Het model doet een voorstel en de reasoning loop kiest de volgende stap. Binnen de harness levert agent memory context, bepaalt tool use het contract, regelt security de permissies en beheert Part 6 de acceptance gate. De runtime voert geaccepteerde tool calls uit en slaat session-, sandbox-, checkpoint- en trace-state op. Results keren terug als context voor de volgende turn.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="694" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">ÉÉN TURN — OWNERSHIP VAN VOORSTEL TOT UITVOERING</text>
  <rect class="box" x="48" y="64" width="1024" height="62" rx="10" /><text class="kind" x="68" y="89">MODEL</text><text class="name" x="168" y="90">Doe een voorstel voor tekst, een tool call of een final answer</text><path class="edge" d="M560 126v32" marker-end="url(#asld-arrow)" />
  <rect class="box" x="48" y="166" width="1024" height="62" rx="10" /><text class="kind" x="68" y="191">PART 1</text><text class="name" x="168" y="192">Reasoning loop kiest de volgende stap</text><path class="edge" d="M560 228v32" marker-end="url(#asld-arrow)" /><text class="note" x="576" y="250">voorgestelde call</text>
  <rect x="48" y="268" width="1024" height="200" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" /><text class="kind" x="68" y="296">HARNESS — ÉÉN PROGRAMMA, VIER VERANTWOORDELIJKHEDEN</text>
  <rect class="store" x="68" y="320" width="216" height="96" rx="10" /><text class="kind" x="88" y="354">PART 2 · AGENT MEMORY</text><text class="name" x="88" y="382">Bouw context</text>
  <rect class="box" x="324" y="320" width="216" height="96" rx="10" /><text class="kind" x="344" y="354">PART 3 · TOOLS</text><text class="name" x="344" y="382">Definieer het contract</text>
  <rect class="box" x="580" y="320" width="216" height="96" rx="10" /><text class="kind" x="600" y="354">PART 4 · SECURITY</text><text class="name" x="600" y="382">Beheer permissies</text>
  <rect x="836" y="320" width="216" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="856" y="354" fill="#FF6FB6">FOCUS · PART 6</text><text class="name" x="856" y="382" fill="#FF6FB6">Accepteer evidence</text>
  <path class="edge" d="M284 368h32" marker-end="url(#asld-arrow)" /><path class="edge" d="M540 368h32" marker-end="url(#asld-arrow)" /><path class="edge" d="M796 368h32" marker-end="url(#asld-arrow)" /><text class="note" x="68" y="448">Context komt hier binnen; contracts en permissies bepalen wat er met het voorstel gebeurt; alleen de acceptance gate kan de run beëindigen.</text><path class="edge" d="M944 468v32" marker-end="url(#asld-arrow)" /><text class="note" x="960" y="490">geaccepteerde call</text>
  <rect x="48" y="508" width="1024" height="136" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" /><text class="kind" x="68" y="536">PART 5 · RUNTIME</text>
  <rect class="box" x="68" y="556" width="472" height="62" rx="10" /><text class="kind" x="88" y="581">PROCESS</text><text class="name" x="198" y="582">Voer geaccepteerde calls uit</text>
  <rect class="store" x="580" y="556" width="472" height="62" rx="10" /><text class="kind" x="600" y="581">STORE</text><text class="name" x="680" y="582">Session · sandbox · checkpoint · trace</text><path class="edge" d="M540 587h32" marker-end="url(#asld-arrow)" />
  <path class="edge" d="M68 587H24V95h16" marker-end="url(#asld-arrow)" /><rect x="12" y="286" width="24" height="196" rx="6" fill="#0C1210" /><text class="note" x="28" y="384" text-anchor="middle" transform="rotate(-90 28 384)">results en traces worden context voor de volgende turn</text>
  <path d="M48 658h1024" stroke="#2B3B33" stroke-width="1" /><text class="note" x="48" y="680">De runtime voert uit en slaat op. De harness beslist.</text>
  <defs><marker id="asld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
