<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 352" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hbl-title hbl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hbl-title">Een gedragswijziging door een harness-handboek routeren</title>
  <desc id="hbl-desc">Een request dat alleen gedrag betreft komt het handboek binnen. Het handboek routeert van een systeemo overzicht via een execution stage naar source-grounded entries. Elke kandidaat-locator wordt tegen de live repository geverifieerd voordat een edit plan wordt toegepast. Een niet-lege diff synchroniseert het handboek opnieuw voor het volgende request.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="352" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="38">GEDRAGSLOCALISATIE — ROUTEER, VERIFIEER, WIJZIG, SYNCHRONISEER OPNIEUW</text>
  <text class="note" x="48" y="60">Het handboek verkleint de zoekruimte. De live repository bepaalt wat echt is.</text>

  <rect class="box" x="48" y="96" width="160" height="96" rx="10" /><text class="kind" x="68" y="130">REQUEST</text><text class="name" x="68" y="158">Masker secrets</text><text class="note" x="68" y="178">gedrag, geen bestand</text>
  <rect class="store" x="248" y="96" width="160" height="96" rx="10" /><text class="kind" x="268" y="130">HANDBOEK</text><text class="name" x="268" y="158">Routeer zoekopdracht</text><text class="note" x="268" y="178">overzicht → stage</text>
  <rect x="448" y="96" width="160" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="468" y="130" fill="#C50E72">FOCUS</text><text class="name" x="468" y="158" fill="#C50E72">Verifieer locators</text><text class="note" x="468" y="178">live functies + bestanden</text>
  <rect class="box" x="648" y="96" width="160" height="96" rx="10" /><text class="kind" x="668" y="130">PROCESS</text><text class="name" x="668" y="158">Pas edit plan toe</text><text class="note" x="668" y="178">alleen geverifieerde locaties</text>
  <rect class="store" x="848" y="96" width="160" height="96" rx="10" /><text class="kind" x="868" y="130">STORE</text><text class="name" x="868" y="158">Synchroniseer map opnieuw</text><text class="note" x="868" y="178">na elke diff</text>
  <path class="edge" d="M208 144h32" marker-end="url(#hbl-arrow)" /><path class="edge" d="M408 144h32" marker-end="url(#hbl-arrow)" /><path class="edge" d="M608 144h32" marker-end="url(#hbl-arrow)" /><path class="edge" d="M808 144h32" marker-end="url(#hbl-arrow)" />

  <path d="M928 192v56a12 12 0 0 1-12 12H340a12 12 0 0 1-12-12v-48" class="edge" stroke-dasharray="7 6" marker-end="url(#hbl-arrow)" />
  <rect x="532" y="248" width="204" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="634" y="265" text-anchor="middle">volgende request gebruikt verse entries</text>
  <path d="M48 292h1024" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="320">VOLGORDE VAN AUTORITEIT</text><text class="name" x="194" y="321">Gedragsmap → kandidaatbron → live repository</text>
  <text class="note" x="48" y="342">Bevries een verouderde entry; verzin nooit de vervanging.</text>
  <defs><marker id="hbl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
