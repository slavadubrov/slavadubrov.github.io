<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 694" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asl-title asl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asl-title">Waar elk onderdeel van de agentic stack zich bevindt</title>
  <desc id="asl-desc">Het model doet voorstellen en de reasoning loop kiest de volgende stap. Binnen de harness levert agent memory context, definieert tool use het contract, beheert security de permissies en beheert Part 6 de acceptance gate. De runtime voert geaccepteerde calls uit en slaat session-, sandbox-, checkpoint- en trace-state op. Results worden context voor de volgende beurt.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="694" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="38">ÉÉN BEURT — OWNERSHIP VAN VOORSTEL TOT UITVOERING</text>

  <rect class="box" x="48" y="64" width="1024" height="62" rx="10" />
  <text class="kind" x="68" y="89">MODEL</text><text class="name" x="168" y="90">Stel tekst, een tool call of een final answer voor</text>
  <path class="edge" d="M560 126v32" marker-end="url(#asl-arrow)" />

  <rect class="box" x="48" y="166" width="1024" height="62" rx="10" />
  <text class="kind" x="68" y="191">PART 1</text><text class="name" x="168" y="192">Reasoning loop kiest de volgende stap</text>
  <path class="edge" d="M560 228v32" marker-end="url(#asl-arrow)" /><text class="note" x="576" y="250">voorgestelde call</text>

  <rect x="48" y="268" width="1024" height="200" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" />
  <text class="kind" x="68" y="296">HARNESS — ÉÉN PROGRAMMA, VIER VERANTWOORDELIJKHEDEN</text>
  <rect class="store" x="68" y="320" width="216" height="96" rx="10" /><text class="kind" x="88" y="354">PART 2 · MEMORY</text><text class="name" x="88" y="382">Bouw context</text>
  <rect class="box" x="324" y="320" width="216" height="96" rx="10" /><text class="kind" x="344" y="354">PART 3 · TOOLS</text><text class="name" x="344" y="382">Definieer contract</text>
  <rect class="box" x="580" y="320" width="216" height="96" rx="10" /><text class="kind" x="600" y="354">PART 4 · SECURITY</text><text class="name" x="600" y="382">Beheer permissies</text>
  <rect x="836" y="320" width="216" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="856" y="354" fill="#C50E72">FOCUS · PART 6</text><text class="name" x="856" y="382" fill="#C50E72">Beoordeel evidence</text>
  <path class="edge" d="M284 368h32" marker-end="url(#asl-arrow)" /><path class="edge" d="M540 368h32" marker-end="url(#asl-arrow)" /><path class="edge" d="M796 368h32" marker-end="url(#asl-arrow)" />
  <text class="note" x="68" y="448">Context komt hier binnen; contracts en permissions bepalen wat er met het voorstel gebeurt; alleen de acceptance gate kan de run beëindigen.</text>
  <path class="edge" d="M944 468v32" marker-end="url(#asl-arrow)" /><text class="note" x="960" y="490">geaccepteerde call</text>

  <rect x="48" y="508" width="1024" height="136" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" />
  <text class="kind" x="68" y="536">PART 5 · RUNTIME</text>
  <rect class="box" x="68" y="556" width="472" height="62" rx="10" /><text class="kind" x="88" y="581">PROCESS</text><text class="name" x="198" y="582">Voer geaccepteerde calls uit</text>
  <rect class="store" x="580" y="556" width="472" height="62" rx="10" /><text class="kind" x="600" y="581">STORE</text><text class="name" x="680" y="582">Session · sandbox · checkpoint · trace</text>
  <path class="edge" d="M540 587h32" marker-end="url(#asl-arrow)" />

  <path class="edge" d="M68 587H24V95h16" marker-end="url(#asl-arrow)" />
  <rect x="12" y="286" width="24" height="196" rx="6" fill="#F7F7F4" />
  <text class="note" x="28" y="384" text-anchor="middle" transform="rotate(-90 28 384)">results en traces worden context voor de volgende beurt</text>
  <path d="M48 658h1024" stroke="#D8DDD9" stroke-width="1" /><text class="note" x="48" y="680">De runtime voert uit en slaat op. De harness beslist.</text>
  <defs><marker id="asl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
