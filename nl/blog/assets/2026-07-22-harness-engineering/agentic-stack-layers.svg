<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 718" width="1120" height="718" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Waar elk onderdeel van de serie Engineering the Agentic Stack past</title>
  <desc>Een stack met vier lagen. Het model stelt een actie voor. De reasoning loop uit Part 1 bepaalt de volgorde en het aantal voorstellen. De harness stelt context samen met agent memory uit Part 2, maakt de tools uit Part 3 beschikbaar, past de permissieregels uit Part 4 toe en voert de acceptance checks en traces uit Part 6 uit. De runtime uit Part 5 voert geaccepteerde tool calls uit en beheert de state van session, sandbox, checkpoint en trace. Resultaten gaan van de runtime terug naar het model als context voor de volgende beurt.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="718" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Waar elk onderdeel van de serie past</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Eén agent run, van boven naar beneden: wat beslist, wat autoriseert en wat uitvoert.</text>

  <!-- Model -->
  <rect x="110" y="110" width="962" height="62" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="130" y="136" font-size="14" font-weight="700" fill="#0f172a">Model</text>
  <text x="130" y="156" font-size="11" fill="#64748b">Stelt tekst, een tool call of een final answer voor. Beslist niet of de call wordt uitgevoerd.</text>

  <path d="M 591 172 L 591 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />

  <!-- Reasoning loop -->
  <rect x="110" y="202" width="962" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="130" y="228" font-size="14" font-weight="700" fill="#0f172a">Reasoning loop<tspan font-size="11" font-weight="400" fill="#1d4ed8" dx="10">Part 1</tspan></text>
  <text x="130" y="248" font-size="11" fill="#64748b">Bepaalt de volgorde en het aantal voorstellen voordat de harness ze ziet.</text>

  <path d="M 591 264 L 591 292" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="283" font-size="11" fill="#64748b">voorgestelde call</text>

  <!-- Harness -->
  <rect x="110" y="294" width="962" height="218" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="130" y="322" font-size="14" font-weight="700" fill="#0f172a">Harness<tspan font-size="11" font-weight="400" fill="#9a3412" dx="10">Parts 2, 3, 4 en 6</tspan></text>
  <text x="130" y="340" font-size="11" fill="#64748b">Het control program tussen het model en de machine. Parts 2, 3, 4 en 6 zijn de vier onderstaande blokken, die als stages van één beurt draaien.</text>

  <rect x="130" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="376" font-size="13" font-weight="600" fill="#0f172a">Context</text>
  <rect x="146" y="384" width="112" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="202" y="396" font-size="10" fill="#64748b" text-anchor="middle">Part 2 — memory</text>
  <text x="146" y="418" font-size="11" fill="#64748b">Welke eerdere state in deze prompt terechtkomt:</text>
  <text x="146" y="432" font-size="11" fill="#64748b">recall, documenten, handoff.</text>

  <rect x="442" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="458" y="376" font-size="13" font-weight="600" fill="#0f172a">Tool contract</text>
  <rect x="458" y="384" width="116" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="516" y="396" font-size="10" fill="#64748b" text-anchor="middle">Part 3 — tool use</text>
  <text x="458" y="418" font-size="11" fill="#64748b">Welke acties bestaan en hoe een</text>
  <text x="458" y="432" font-size="11" fill="#64748b">gevalideerd resultaat eruitziet.</text>

  <rect x="754" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="770" y="376" font-size="13" font-weight="600" fill="#0f172a">Permission</text>
  <rect x="770" y="384" width="118" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="829" y="396" font-size="10" fill="#64748b" text-anchor="middle">Part 4 — security</text>
  <text x="770" y="418" font-size="11" fill="#64748b">Of deze specifieke call</text>
  <text x="770" y="432" font-size="11" fill="#64748b">nu unattended mag worden uitgevoerd.</text>

  <rect x="130" y="454" width="922" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="146" y="472" font-size="13" font-weight="600" fill="#0f172a">Acceptance checks, traces, retries en handoffs<tspan font-size="11" font-weight="400" fill="#166534" dx="10">Part 6</tspan></text>
  <text x="146" y="489" font-size="11" fill="#64748b">Leest het bewijs en beslist of de run klaar is, doorgaat of wordt geëscaleerd. Het model heeft geen stem in die beslissing.</text>

  <path d="M 591 512 L 591 540" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="531" font-size="11" fill="#64748b">geaccepteerde call</text>

  <!-- Runtime -->
  <rect x="110" y="542" width="962" height="128" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="130" y="570" font-size="14" font-weight="700" fill="#0f172a">Runtime<tspan font-size="11" font-weight="400" fill="#334155" dx="10">Part 5</tspan></text>
  <text x="130" y="588" font-size="11" fill="#64748b">Voert geaccepteerde calls uit en houdt state buiten het worker process actief. Deze vier primitives slaan state op en isoleren die; ze beslissen nooit.</text>

  <rect x="130" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="622" font-size="13" font-weight="600" fill="#0f172a">Session</text>
  <text x="146" y="640" font-size="11" fill="#64748b">Append-only runlog</text>

  <rect x="364" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="380" y="622" font-size="13" font-weight="600" fill="#0f172a">Sandbox</text>
  <text x="380" y="640" font-size="11" fill="#64748b">Geïsoleerde uitvoering</text>

  <rect x="598" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="614" y="622" font-size="13" font-weight="600" fill="#0f172a">Checkpoint</text>
  <text x="614" y="640" font-size="11" fill="#64748b">Hervattingspunt</text>

  <rect x="832" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="848" y="622" font-size="13" font-weight="600" fill="#0f172a">Trace</text>
  <text x="848" y="640" font-size="11" fill="#64748b">Bewijs achteraf</text>

  <!-- Return path -->
  <path d="M 110 606 L 76 606 L 76 141 L 106 141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="62" y="374" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 62 374)">resultaten en traces worden de context van de volgende beurt</text>
</svg>
