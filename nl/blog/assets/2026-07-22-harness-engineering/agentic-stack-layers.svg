<text x="48" y="602" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ONDERDEEL 5 · RUNTIME</text>
<path d="M58 616h228a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 616h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="633.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">VERWERKEN</text><text x="62" y="671" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Voert geaccepteerde calls uit</text>
<path d="M322 616h420a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-420a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M322 616h420a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-440a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="326" y="633.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">OPSLAAN</text><text x="326" y="671" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Session · sandbox · checkpoint · trace</text>
<path d="M296 652h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M48 652H16V148H32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M32 744h736" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="770" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Context komt binnen via memory; contracts en permissies bepalen wat er met het voorstel gebeurt.</text>
<text x="32" y="792" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;">Alleen de acceptance gate kan de run beëindigen — de runtime voert uit en slaat op, en de resultaten worden context voor de volgende beurt.</text>
</svg>
