<text x="32" y="962" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12px;">Een component verdient alleen zijn plaats als de lift van de treatment op de target metric de extra kosten compenseert.</text>
<text x="32" y="984" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Voer één ablation per hypothese uit; laat guards niet onmeetbaar opstapelen.</text>
