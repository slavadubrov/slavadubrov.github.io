<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tests verzamelen events direct; de HTTP-route framet ze als SSE en persisteert pas nadat</text>
