<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="loop-title">Een handgeschreven agent loop maakt een getypeerde event stream zichtbaar</title><desc id="loop-desc">Een model streamt chunks naar een fragmentbuffer. De loop assembleert calls, parseert en valideert ze, voert geldige tools uit en voegt tool messages toe aan de message history vóór de volgende stap. Ongeldige input wordt in dezelfde history een tool error in plaats van de loop te beëindigen. De gerichte AgentEvent async generator voedt de HTTP-route en tests. Na het streamen schrijft de HTTP-route het uiteindelijke run result weg.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="loop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="loop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="840" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Eén loopstap, daarna een stabiele interface</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Repair blijft binnen de loop. Consumers zien getypeerde events in plaats van model-provider chunks.</text>
