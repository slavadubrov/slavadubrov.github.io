<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="stack-title">Python-service tools gekoppeld aan TypeScript</title>
  <desc id="stack-desc">Zes routinevervangingen koppelen Python-project-, package-, HTTP-, SQL-, test- en linting-tools aan TypeScript-equivalenten. Een uitgelicht paneel benoemt de drie vervangingen die de semantiek wijzigen: Pydantic naar Zod, Celery en Redis naar een Postgres-queue, en mypy naar de TypeScript-compiler.</desc>
