<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 724" width="1120" height="724" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Hoe één Zod-schema drie consumers bereikt in een pnpm-workspace</title>
  <desc>Drie lagen. De bovenste laag is packages: agent-schemas bevat de Zod-declaraties, agent-core bevat zowel agent loops als Drizzle-opslag, en agent-observability bevat de Pino-logger en OpenTelemetry-configuratie. Vanuit agent-schemas waaiert één declaratie met de naam EstimateKvCacheInput uit naar drie call sites in de middelste laag: loop.ts converteert deze met z.toJSONSchema naar een OpenAI tools-array, loop-ai-sdk.ts geeft het schema ongewijzigd door aan de Vercel AI SDK, en de MCP-server publiceert de vorm naar elke MCP-client. De onderste laag is apps: de Hono API, de worker en de MCP-server. De API voegt een queued row toe aan de Postgres-tabel runs en retourneert 202; de worker claimt die row met FOR UPDATE SKIP LOCKED en schrijft het resultaat terug. De MCP-server raakt noch HTTP noch de database aan.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="724" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Eén schema, drie consumers</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Waarom een schemas-package zijn plek verdient: de inputvorm van de tool wordt één keer gedeclareerd en bereikt een model op drie verschillende manieren.</text>

  <!-- packages layer -->
  <rect x="48" y="104" width="1024" height="150" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="130" font-size="14" font-weight="700" fill="#0f172a">packages/</text>
  <text x="152" y="130" font-size="11" fill="#64748b">gedeelde libraries, nooit zelfstandig gedeployed</text>

  <rect x="68" y="146" width="300" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="88" y="170" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">@agent/schemas</text>
  <text x="88" y="192" font-size="11" fill="#9a3412">Env-config, API-contracten, tool-</text>
  <text x="88" y="208" font-size="11" fill="#9a3412">inputs, de AgentEvent-union</text>
  <text x="88" y="228" font-size="11" fill="#64748b">Hangt alleen af van zod</text>

  <rect x="388" y="146" width="332" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="408" y="170" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">@agent/core</text>
  <text x="408" y="192" font-size="11" fill="#1d4ed8">Twee agent loops, de tools,</text>
  <text x="408" y="208" font-size="11" fill="#1d4ed8">de sweep, Drizzle-opslag</text>
  <text x="408" y="228" font-size="11" fill="#64748b">Het enige package dat met een model praat</text>

  <rect x="740" y="146" width="312" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="760" y="170" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">@agent/observability</text>
  <text x="760" y="192" font-size="11" fill="#64748b">Pino-logger met redaction;</text>
  <text x="760" y="208" font-size="11" fill="#64748b">OpenTelemetry, uitgeschakeld tenzij een</text>
  <text x="760" y="224" font-size="11" fill="#64748b">endpoint is geconfigureerd</text>

  <!-- fan-out bus -->
  <path d="M 218 238 L 218 268 L 888 268" stroke="#ea580c" stroke-width="2" fill="none" />
  <text x="240" y="262" font-size="11" font-weight="600" font-family="SFMono-Regular, Consolas, monospace" fill="#9a3412">EstimateKvCacheInput</text>
  <path d="M 218 268 L 218 290" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#w-warn)" />
  <path d="M 548 268 L 548 290" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#w-warn)" />
  <path d="M 888 268 L 888 290" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#w-warn)" />

  <!-- three call sites -->
  <rect x="68" y="298" width="300" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="88" y="322" font-size="12" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">loop.ts</text>
  <text x="88" y="344" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#0f172a">z.toJSONSchema(schema)</text>
  <text x="88" y="364" font-size="11" fill="#64748b">Wordt een OpenAI tools-array,</text>
  <text x="88" y="380" font-size="11" fill="#64748b">met strict decoding aangevraagd</text>

  <rect x="398" y="298" width="300" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="418" y="322" font-size="12" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">loop-ai-sdk.ts</text>
  <text x="418" y="344" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#0f172a">inputSchema: schema</text>
  <text x="418" y="364" font-size="11" fill="#64748b">Doorgegeven aan de Vercel AI SDK</text>
  <text x="418" y="380" font-size="11" fill="#64748b">ongewijzigd; die converteert intern</text>

  <rect x="728" y="298" width="324" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="748" y="322" font-size="12" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">apps/mcp/src/index.ts</text>
  <text x="748" y="344" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#0f172a">schema.shape</text>
  <text x="748" y="364" font-size="11" fill="#64748b">Via MCP gepubliceerd naar elke client:</text>
  <text x="748" y="380" font-size="11" fill="#64748b">Claude Code, Cursor, je eigen</text>

  <!-- apps layer -->
  <rect x="48" y="418" width="1024" height="250" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="68" y="444" font-size="14" font-weight="700" fill="#0f172a">apps/</text>
  <text x="124" y="444" font-size="11" fill="#64748b">elk exemplaar wordt als eigen container of proces gedeployed</text>

  <rect x="68" y="460" width="300" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="88" y="484" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">apps/api</text>
  <text x="88" y="506" font-size="11" fill="#64748b">Hono-routes met Zod-validatie</text>
  <text x="88" y="522" font-size="11" fill="#64748b">POST /v1/chat streamt SSE</text>
  <text x="88" y="538" font-size="11" fill="#64748b">POST /v1/sweeps retourneert 202</text>

  <rect x="398" y="460" width="300" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="418" y="484" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">apps/worker</text>
  <text x="418" y="506" font-size="11" fill="#64748b">Pollen naar queued rows</text>
  <text x="418" y="522" font-size="11" fill="#64748b">Valideert de opgeslagen input opnieuw</text>
  <text x="418" y="538" font-size="11" fill="#64748b">Start zoveel kopieën als je wilt</text>

  <rect x="728" y="460" width="324" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="748" y="484" font-size="13" font-weight="600" fill="#0f172a" font-family="SFMono-Regular, Consolas, monospace">apps/mcp</text>
  <text x="748" y="506" font-size="11" fill="#64748b">Eén tool via stdio. Geen HTTP,</text>
  <text x="748" y="522" font-size="11" fill="#64748b">geen database, geen model call.</text>
  <text x="748" y="538" font-size="11" fill="#64748b">stdout is het protocolkanaal</text>

  <path d="M 218 556 L 218 586" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#w-ok)" />
  <text x="230" y="578" font-size="10" fill="#166534">een queued row invoegen</text>
  <path d="M 548 586 L 548 556" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#w-ok)" />
  <text x="560" y="578" font-size="10" fill="#166534">één row claimen en daarna het resultaat terugschrijven</text>

  <rect x="180" y="588" width="692" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="200" y="612" font-size="13" font-weight="600" fill="#0f172a">Postgres — één runs-tabel</text>
  <text x="200" y="632" font-size="11" fill="#166534">Run-opslag en job queue in dezelfde rows. Geen Redis, geen broker:</text>
  <text x="626" y="632" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#166534">FOR UPDATE SKIP LOCKED</text>

  <text x="48" y="700" font-size="11" fill="#64748b">Oranje voert het schema. Groen voert rows door Postgres. Niets in apps/ importeert iets uit een andere app.</text>

  <defs>
    <marker id="w-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
    <marker id="w-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
  </defs>
</svg>
