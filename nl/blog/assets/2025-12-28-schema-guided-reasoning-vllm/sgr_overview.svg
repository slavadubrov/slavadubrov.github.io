<text x="32" y="362" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Een schema maakt de response testbaar.</text>
<text x="32" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Application code bepaalt nog steeds of de response waar en toegestaan is.</text>
