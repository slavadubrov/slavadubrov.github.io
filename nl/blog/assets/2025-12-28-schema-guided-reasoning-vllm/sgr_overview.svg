<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="sgro-title sgro-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgro-title">Wat een schema-gestuurd systeem afdwingt — en wat niet</title><desc id="sgro-desc">Constrained decoding garandeert de outputvorm. Application code beheert afzonderlijk de fasenvolgorde en het semantische beleid. Elk van de drie dwingt een andere set garanties af; alleen decoding is een eigenschap van de model call zelf.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgro-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="sgro-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="408" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Drie afdwingingsgrenzen, één response</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Constrained decoding garandeert de vorm. Volgorde en waarheid vereisen nog steeds application code.</text>
