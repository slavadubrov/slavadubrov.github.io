<text x="32" y="532" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Routing en proposal zijn schema-guided; goedkeuring wordt nog steeds in plain code uitgevoerd.</text>
