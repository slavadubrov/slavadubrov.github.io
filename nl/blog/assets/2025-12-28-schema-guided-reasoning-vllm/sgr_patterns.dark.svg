<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="sgrp-title sgrp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgrp-title">Drie schema-gestuurde reasoning-patronen</title><desc id="sgrp-desc">Cascade legt velden vast in één structured response, routing kiest precies één union-branch en cycle genereert een lijst met begrensde lengte. Een focus-node onderaan de figuur benoemt de gedeelde beperking: alle drie beschrijven ze structuur, maar geen ervan bewijst dat de output feitelijk correct is.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgrp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="sgrp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="496" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Drie manieren om een response vorm te geven</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Schema’s beschrijven deze vormen; een ondersteunde decoder legt ze vast.</text>
