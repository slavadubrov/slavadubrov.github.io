<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="xgr-title xgr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="xgr-title">XGrammar combineert grammar state met model scores vóór sampling</title><desc id="xgr-desc">De GPU forward pass produceert logits. Afzonderlijk gebruikt de CPU matcher de gecompileerde grammar en de accepted-token state om een mask te produceren. De GPU past het mask toe op de logits en samplet vervolgens een token. Dat token werkt zowel de modelinput als de grammar state bij voor de volgende stap.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="xgr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="xgr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="736" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Twee inputs komen samen vóór sampling</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">De grammar state bepaalt het mask; raw logits gaan niet naar de grammar matcher.</text>
<path d="M42 112h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 112h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GPU · FORWARD</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Forward pass → logits</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">één score per vocabulary-token</text>
<path d="M386 112h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M386 112h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="390" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">CPU · STATE</text><text x="390" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Grammar + token state</text><text x="390" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">gecompileerde grammar en accepted prefix</text>
<path d="M386 248h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M386 248h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="390" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">CPU · MATCHER</text><text x="390" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Bitmask genereren</text><text x="390" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">welke tokens de prefix mogen voortzetten</text>
<path d="M532 216v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#xgr-arrow-flow)" />
<path d="M188 216v176" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#xgr-arrow-flow)" />
<path d="M532 352v40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#xgr-arrow-flow)" />
<path d="M42 392h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 392h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GPU · MASK</text><text x="46" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Mask toepassen op logits</text><text x="46" y="475" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">ongeldige continuations krijgen vóór sampling −∞</text>
<path d="M360 496v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#xgr-arrow-flow)" />
<path d="M42 528h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 528h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="545.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">GPU · SAMPLE</text><text x="46" y="589" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Het volgende token samplen</text><text x="46" y="611" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">modelinput en grammar state bijwerken; herhalen</text>
<path d="M32 664h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="690" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Logits, tokens en grammar state veranderen naarmate de generation vordert.</text>
<text x="32" y="712" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Een grammar-valid prefix vereist nog steeds succesvolle completion en validatie in de applicatie.</text>
</svg>
