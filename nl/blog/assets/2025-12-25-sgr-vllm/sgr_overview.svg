<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="overview-title overview-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="overview-title">Drie garanties in een schema-gestuurd systeem</title>
  <desc id="overview-desc">Afdwinging van de outputvorm wordt gevolgd door door de applicatie beheerde stages en semantische policy checks. Een schema garandeert een geldige structuur, terwijl applicatiecode procesgrenzen en correctheid moet afdwingen.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="400" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="48">OVERZICHT · ÉÉN SYSTEEM, DRIE GARANTIES</text>

  <rect x="48" y="80" width="240" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="68" y="114" fill="#C50E72">FOCUS · DECODING</text>
  <text class="name" x="68" y="143" fill="#C50E72">Outputvorm</text>
  <path class="edge" d="M288 128h64" marker-end="url(#overview-arrow)" />
  <rect class="box" x="368" y="80" width="240" height="96" rx="10" />
  <text class="kind" x="388" y="114">PROCES · APP</text>
  <text class="name" x="388" y="143">Stage-topologie</text>
  <path class="edge" d="M608 128h64" marker-end="url(#overview-arrow)" />
  <rect class="box" x="688" y="80" width="224" height="96" rx="10" />
  <text class="kind" x="708" y="114">PROCES · CODE</text>
  <text class="name" x="708" y="143">Semantische policy</text>

  <path d="M48 216h240" stroke="#D8DDD9" />
  <text class="kind" x="48" y="244">DWINGT AF</text>
  <text class="note" x="48" y="270">vereiste keys · types · enums</text>
  <text class="note" x="48" y="294">geldige JSON bij elke token</text>
  <path d="M368 216h240" stroke="#D8DDD9" />
  <text class="kind" x="368" y="244">DWINGT AF</text>
  <text class="note" x="368" y="270">afzonderlijke calls · gevalideerde inputs</text>
  <text class="note" x="368" y="294">autorisatiegates voor tools</text>
  <path d="M688 216h224" stroke="#D8DDD9" />
  <text class="kind" x="688" y="244">DWINGT AF</text>
  <text class="note" x="688" y="270">rekenkundige consistentie tussen velden</text>
  <text class="note" x="688" y="294">dynamische drempelwaarden · bewijs</text>

  <path d="M48 336h864" stroke="#D8DDD9" />
  <text class="name" x="48" y="369" font-size="16">Een schema maakt de response testbaar.</text>
  <text class="note" x="368" y="369">Applicatiecode bepaalt nog steeds of de response waar en toegestaan is.</text>
  <defs>
    <marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
