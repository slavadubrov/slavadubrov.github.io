<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="xgrammar-title xgrammar-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="xgrammar-title">XGrammar bevindt zich tussen model logits en sampling</title>
  <desc id="xgrammar-desc">Het model produceert raw logits, XGrammar maskeert tokens die ongeldig zijn volgens het schema, sampling kiest een toegestane token en de geaccepteerde token werkt de decoder state bij voordat de loop zich herhaalt.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .mono { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #EDF5F0; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="448" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">HANDHAVING · NA FORWARD, VÓÓR SAMPLING</text>

  <rect class="box" x="48" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="68" y="122">PROCESS · GPU</text>
  <text class="name" x="68" y="151">Forward pass</text>
  <path class="edge" d="M192 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect class="store" x="224" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="244" y="122">OPSLAAN · SCORES</text>
  <text class="name" x="244" y="151">Raw logits</text>
  <path class="edge" d="M368 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect x="400" y="88" width="144" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="420" y="122" fill="#FF6FB6">FOCUS · CPU</text>
  <text class="name" x="420" y="151" fill="#FF6FB6">Grammar mask</text>
  <path class="edge" d="M544 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect class="box" x="576" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="596" y="122">PROCESS</text>
  <text class="name" x="596" y="151">Sampling</text>
  <path class="edge" d="M720 136h24" marker-end="url(#xgrammar-arrow)" />
  <rect class="store" x="752" y="88" width="144" height="96" rx="10" />
  <text class="kind" x="772" y="122">OPSLAAN · STATE</text>
  <text class="name" x="772" y="151"><tspan x="772">Geaccepteerde</tspan><tspan x="772" dy="1.2em">token</tspan></text>

  <path class="edge" d="M824 184v44a12 12 0 0 1-12 12H132a12 12 0 0 1-12-12v-36" stroke-dasharray="2 6" marker-end="url(#xgrammar-arrow)" />
  <rect x="404" y="228" width="136" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="472" y="245" text-anchor="middle">bijwerken en herhalen</text>

  <path d="M48 296h416" stroke="#2B3B33" />
  <text class="kind" x="48" y="324">VOORBEELD · NUMERIEK VELD</text>
  <text class="mono" x="48" y="354">raw</text>
  <text class="note" x="104" y="354">“fifteen” · 15 · true · {</text>
  <text class="mono" x="48" y="382">mask</text>
  <text class="note" x="104" y="382">geblokkeerd · toegestaan · geblokkeerd · geblokkeerd</text>

  <path d="M496 296h416" stroke="#2B3B33" />
  <text class="kind" x="496" y="324">GRENS · WAT RESTEERT</text>
  <text class="name" x="496" y="354">Het mask garandeert de vorm.</text>
  <text class="note" x="496" y="382">Het bepaalt niet of 15 correct of toegestaan is.</text>
  <defs>
    <marker id="xgrammar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
