<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="comparison-title comparison-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="comparison-title">Prompt engineering, chain-of-thought en schema-guided reasoning vergeleken</title>
  <desc id="comparison-desc">Drie uitgelijnde kolommen vergelijken outputvorm, controlemechanisme en geschiktheid voor toepassingen. Schema-guided reasoning is gemarkeerd omdat constrained decoding schema-invalid output blokkeert, terwijl semantische fouten nog steeds validatie vereisen.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">VERGELIJKING · DEZELFDE AANVRAAG, ANDERE CONTROLE</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="106">AANPAK · PROMPT</text>
  <text class="name" x="68" y="135">Prompt engineering</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="106">AANPAK · COT</text>
  <text class="name" x="372" y="135">Chain-of-thought</text>
  <rect x="656" y="72" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="676" y="106" fill="#FF6FB6">FOCUS · SGR</text>
  <text class="name" x="676" y="135" fill="#FF6FB6">Schema-guided</text>

  <text class="kind" x="48" y="216">OUTPUTVORM</text>
  <text class="note" x="48" y="244">variabele tekst</text>
  <text class="note" x="352" y="244">vrije redeneringsproza</text>
  <text class="note" x="656" y="244">rigide JSON / Pydantic</text>
  <path d="M48 264h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="300">CONTROLE</text>
  <text class="note" x="48" y="328">semantische overtuiging</text>
  <text class="note" x="352" y="328">heuristische stap-voor-stap prompts</text>
  <text class="note" x="656" y="328">grammar mask per token</text>
  <path d="M48 348h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="384">GESCHIKTHEID VOOR TOEPASSINGEN</text>
  <text class="note" x="48" y="412">parser moet velden reconstrueren</text>
  <text class="note" x="352" y="412">een lezer moet proza interpreteren</text>
  <text class="note" x="656" y="412">velden gevalideerd; betekenis nog gecontroleerd</text>
</svg>
