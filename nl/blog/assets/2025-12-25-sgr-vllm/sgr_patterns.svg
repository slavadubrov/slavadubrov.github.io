<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="patterns-title patterns-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="patterns-title">Drie schema-gestuurde reasoning-patronen</title>
  <desc id="patterns-desc">Cascade legt een geordende reeks vast, routing selecteert één union-branch en cycle geeft een begrensde lijst terug. Alle drie dwingen structuur af, maar geen ervan bewijst factual correctness.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="464" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="48">PATRONEN · DRIE MANIEREN OM EEN RESPONSE VORM TE GEVEN</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="106">PATROON · CASCADE</text>
  <text class="name" x="68" y="135">Geordende velden</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="106">PATROON · ROUTING</text>
  <text class="name" x="372" y="135">Eén union-branch</text>
  <rect class="box" x="656" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="106">PATROON · CYCLE</text>
  <text class="name" x="676" y="135">Begrensde lijst</text>

  <circle cx="70" cy="226" r="14" fill="#17211B" /><text class="marker-num" x="70" y="231" text-anchor="middle">1</text>
  <text class="note" x="92" y="231">samenvatten</text>
  <path class="edge" d="M70 240v24" marker-end="url(#patterns-arrow)" />
  <circle cx="70" cy="286" r="14" fill="#17211B" /><text class="marker-num" x="70" y="291" text-anchor="middle">2</text>
  <text class="note" x="92" y="291">beoordelen</text>
  <path class="edge" d="M70 300v24" marker-end="url(#patterns-arrow)" />
  <circle cx="70" cy="346" r="14" fill="#17211B" /><text class="marker-num" x="70" y="351" text-anchor="middle">3</text>
  <text class="note" x="92" y="351">bepalen</text>

  <path class="box" d="M480 196 544 244 480 292 416 244Z" />
  <text class="name" x="480" y="241" text-anchor="middle" font-size="15">welke</text>
  <text class="name" x="480" y="260" text-anchor="middle" font-size="15">route?</text>
  <path class="edge" d="M432 276l-40 54" />
  <path class="edge" d="M528 276l40 54" />
  <text class="kind" x="368" y="354">FETCH</text>
  <text class="kind" x="544" y="354">RESPOND</text>

  <path d="M692 212v116m0-116h12m-12 116h12M876 212v116m0-116h-12m12 116h-12" fill="none" stroke="#D8DDD9" />
  <text class="name" x="720" y="244" font-size="16">Risico 1</text>
  <text class="note" x="720" y="273">…</text>
  <text class="name" x="720" y="304" font-size="16">Risico N</text>
  <text class="kind" x="720" y="338">2 ≤ N ≤ 4</text>

  <rect x="48" y="378" width="864" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="68" y="404" fill="#C50E72">FOCUS · GEDEELDE GRENS</text>
  <text class="name" x="68" y="427" fill="#C50E72">Structuur wordt afgedwongen; factual correctness niet.</text>
  <defs>
    <marker id="patterns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
