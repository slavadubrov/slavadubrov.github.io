<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asi-title asi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asi-title">OWASP ASI Top 10 gegroepeerd op basis van de vereiste control boundary</title>
  <desc id="asi-desc">Goal hijack en memory poisoning zijn de twee categorieën waaraan contentfilters kunnen bijdragen. De overige acht categorieën vereisen system controls voor tools, execution, identity, communication, supply chain, cascading failures, human trust en rogue agents.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#0C1210" />

  <rect x="48" y="56" width="280" height="424" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="72" y="88">CONTENT-ADJACENT · 2 VAN 10</text>
  <text class="note" x="72" y="112">Filters kunnen hieraan bijdragen.</text>

  <rect x="72" y="144" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="176">ASI01</text>
  <text class="name" x="92" y="204">Agent Goal Hijack</text>
  <text class="note" x="92" y="224">instruction redirection</text>

  <rect x="72" y="280" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="312">ASI06</text>
  <text class="name" x="92" y="340">Memory Poisoning</text>
  <text class="note" x="92" y="360">RAG en persistente context</text>

  <text class="note" x="72" y="432" style="font-size: 11px;">Vereist downstream nog steeds authorization en</text>
  <text class="note" x="72" y="452">runtime enforcement.</text>

  <rect x="368" y="56" width="544" height="424" rx="12" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="392" y="88" fill="#FF6FB6">FOCUS · SYSTEM CONTROLS · 8 VAN 10</text>
  <text class="note" x="392" y="112" fill="#FF6FB6">Identity-, policy-, isolation-, monitoring- en supply-chain controls.</text>

  <rect class="box" x="392" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="176">ASI02 + ASI05</text>
  <text class="name" x="412" y="204">Tool misuse</text>
  <text class="note" x="412" y="224">unexpected code execution</text>

  <rect class="box" x="656" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="176">ASI03 + ASI07</text>
  <text class="name" x="676" y="204">Identity abuse</text>
  <text class="note" x="676" y="224">insecure agent channels</text>

  <rect class="box" x="392" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="312">ASI04 + ASI08</text>
  <text class="name" x="412" y="340">Supply chain</text>
  <text class="note" x="412" y="360">cascading agent failures</text>

  <rect class="box" x="656" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="312">ASI09 + ASI10</text>
  <text class="name" x="676" y="340">Human trust</text>
  <text class="note" x="676" y="360">rogue agents en goal drift</text>

  <text class="note" x="392" y="432">Deze failure classes vallen buiten één enkele</text>
  <text class="note" x="392" y="452">model input- of output boundary.</text>

  <text class="note" x="48" y="528">OWASP Agentic Security Initiative Top 10 voor 2026 · gepubliceerd op 9 december 2025</text>
</svg>
