<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="peo-title peo-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="peo-title">Volgorde van permission-evaluatie in Claude Code</title>
  <desc id="peo-desc">Claude Code controleert deny-, ask- en daarna allow-regels; de eerste match bepaalt de uitkomst. Een PreToolUse-hook kan blokkeren vóór de permission-prompt, maar kan een deny- of ask-regel niet omzeilen. Calls zonder match gebruiken de actieve permission mode. De canUseTool-callback van de Agent SDK is een afzonderlijk pad voor niet-opgeloste requests.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="600" rx="14" fill="#0C1210" />

  <rect x="48" y="56" width="600" height="464" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="72" y="88">CLAUDE CODE CLI</text>
  <text class="note" x="72" y="110">Regels hebben voorrang; de configuratievolgorde verandert dit niet.</text>

  <rect class="box" x="72" y="136" width="240" height="62" rx="10" />
  <text class="kind" x="92" y="160">REQUEST</text>
  <text class="name" x="92" y="184">Voorgestelde tool call</text>

  <rect x="72" y="238" width="240" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="92" y="272" fill="#FF6FB6">FOCUS · REGELS</text>
  <text class="name" x="92" y="300" fill="#FF6FB6">deny → ask → allow</text>
  <text class="note" x="92" y="320" fill="#FF6FB6">eerste matchende regel wint</text>

  <path d="M432 238 512 286 432 334 352 286Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="432" y="281" text-anchor="middle">regel</text>
  <text class="name" x="432" y="301" text-anchor="middle">match?</text>

  <rect class="box" x="72" y="406" width="240" height="62" rx="10" />
  <text class="kind" x="92" y="430">GEEN MATCH · MODE</text>
  <text class="name" x="92" y="454">Bepaal via de actieve mode</text>

  <rect x="368" y="406" width="240" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="388" y="430">EERSTE MATCH · RESULTAAT</text>
  <text class="name" x="388" y="454">Blokkeren · prompt · uitvoeren</text>

  <path class="edge" d="M192 198v32" marker-end="url(#peo-arrow)" />
  <path class="edge" d="M312 286h32" marker-end="url(#peo-arrow)" />
  <path class="edge" d="M432 334v56a16 16 0 0 0 16 16h40" marker-end="url(#peo-arrow)" />
  <rect x="444" y="354" width="64" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="476" y="371" text-anchor="middle">ja</text>
  <path class="edge" d="M352 286h-24a16 16 0 0 0-16 16v104" stroke-dasharray="7 6" marker-end="url(#peo-arrow)" />
  <rect x="288" y="346" width="64" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="320" y="363" text-anchor="middle">nee</text>

  <path d="M336 168h248" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="352" y="154">PRETOOLUSE-HOOK</text>
  <text class="note" x="352" y="184">Draait vóór de prompt en kan blokkeren.</text>
  <text class="note" x="352" y="204">Omzeilt nooit een matchende deny- of ask-regel.</text>

  <rect x="688" y="56" width="224" height="464" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="712" y="88">AGENT SDK</text>
  <text class="note" x="712" y="110">Afzonderlijk callback-pad</text>

  <rect x="712" y="168" width="176" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="732" y="202">NIET OPGELOST</text>
  <text class="name" x="732" y="230" fill="#A8B8AF">Tool request</text>
  <text class="note" x="732" y="250">Alleen SDK-pad</text>

  <rect x="712" y="336" width="176" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="732" y="370">CALLBACK</text>
  <text class="name" x="732" y="398" fill="#A8B8AF">canUseTool</text>
  <text class="note" x="732" y="418">goedkeuren of weigeren</text>

  <path class="edge" d="M800 264v64" stroke-dasharray="7 6" marker-end="url(#peo-arrow)" />

  <text class="note" x="48" y="568">Een hook kan een blokkering toevoegen. Hij kan een geweigerde of gepromptte call niet omzetten in een toegestane call.</text>

  <defs>
    <marker id="peo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
