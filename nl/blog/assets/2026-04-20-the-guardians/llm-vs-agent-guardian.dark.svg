<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lga-title lga-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lga-title">LLM guardrails omringen één model call; de harness omringt de tool loop</title>
  <desc id="lga-desc">Een vergelijking naast elkaar. Content guardrails inspecteren input en output rond één model call. De agent harness autoriseert elke voorgestelde actie voordat de sandbox deze uitvoert en een observatie retourneert.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="480" rx="14" fill="#0C1210" />

  <rect x="48" y="56" width="408" height="344" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="72" y="88">ÉÉN MODEL CALL</text>
  <text class="note" x="72" y="110">Vraag: is de tekst veilig?</text>

  <rect class="box" x="72" y="136" width="360" height="62" rx="10" />
  <text class="kind" x="92" y="160">INPUT</text>
  <text class="name" x="92" y="184">Tekst van de gebruiker en uit retrieval</text>

  <rect class="box" x="72" y="238" width="360" height="62" rx="10" />
  <text class="kind" x="92" y="262">CONTENT GUARDRAIL</text>
  <text class="name" x="92" y="286">Input en output inspecteren</text>

  <rect x="72" y="340" width="360" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="364">MODEL</text>
  <text class="name" x="92" y="388">Een completion retourneren</text>

  <path class="edge" d="M252 198v32" marker-end="url(#lga-arrow)" />
  <path class="edge" d="M252 300v32" marker-end="url(#lga-arrow)" />

  <rect x="504" y="56" width="408" height="344" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="528" y="88">VOLLEDIGE TOOL LOOP</text>
  <text class="note" x="528" y="110">Vraag: mag deze actie worden uitgevoerd?</text>

  <rect class="box" x="528" y="136" width="360" height="62" rx="10" />
  <text class="kind" x="548" y="160">MODEL</text>
  <text class="name" x="548" y="184">Een tool call voorstellen</text>

  <rect x="528" y="238" width="360" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="548" y="262" fill="#FF6FB6">FOCUS · HARNESS</text>
  <text class="name" x="548" y="286" fill="#FF6FB6">Deze actie autoriseren</text>

  <rect class="box" x="528" y="340" width="168" height="62" rx="10" />
  <text class="kind" x="548" y="364">RUNTIME</text>
  <text class="name" x="548" y="388">Uitvoeren</text>

  <rect x="720" y="340" width="168" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="740" y="364">OBSERVATIE</text>
  <text class="name" x="740" y="388">Bewijs retourneren</text>

  <path class="edge" d="M708 198v32" marker-end="url(#lga-arrow)" />
  <path class="edge" d="M612 300v32" marker-end="url(#lga-arrow)" />
  <path class="edge" d="M696 371h16" marker-end="url(#lga-arrow)" />
  <path class="edge" d="M804 340v-116a16 16 0 0 0-16-16H732" stroke-dasharray="2 6" marker-end="url(#lga-arrow)" />
  <rect x="748" y="211" width="76" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="786" y="228" text-anchor="middle" style="font-size: 11.5px;">volgende stap</text>

  <text class="note" x="48" y="448">Een tekstcontrole beschermt een completion. De harness beschermt elk side effect tijdens de volledige run.</text>

  <defs>
    <marker id="lga-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
