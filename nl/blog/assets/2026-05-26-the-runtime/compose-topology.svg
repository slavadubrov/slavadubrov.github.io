<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">De Docker Compose-reference stack heeft één worker als harness, drie stores die deze rechtstreeks beheert en drie optionele services die via profile flags worden ingeschakeld.</title><desc id="composetop-desc">Een LangGraph-worker fungeert als run owner en harness: hij haalt jobs uit een Redis-queue, schrijft checkpoints naar Postgres en leest cold memory uit Qdrant. Een MCP-sidecar isoleert tool credentials van de worker, een OpenTelemetry-collector verzamelt traces en metrics, en een observability-stack slaat deze op — alle drie worden ingeschakeld via optionele Compose-profielen. Claude is de externe model-API die de worker rechtstreeks aanroept.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="composetop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="composetop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
