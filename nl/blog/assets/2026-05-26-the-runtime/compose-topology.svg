<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">De worker heeft nooit rechtstreeks het model of tool credentials in bezit — Claude en de MCP-sidecar staan erbuiten.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Redis is alleen optioneel voor lokale development, omdat de synchrone runner de worker rechtstreeks kan aanroepen.</text>
