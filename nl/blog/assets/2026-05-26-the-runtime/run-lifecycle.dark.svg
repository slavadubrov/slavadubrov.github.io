<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">Een gezonde agent-run slaat vóór dispatch een pending intent op, registreert de uitkomst en maakt daarna een checkpoint en voert een evaluatie uit; een nieuwe worker reconcilieert eerst de pending intent.</title><desc id="runlife-desc">Dit illustratieve pad volgt één gecoördineerde operatie met side effect: boot, plan, een pending intent en idempotency key opslaan, dispatch, de uitkomst opslaan, checkpoint, en daarna evalueren. Onafhankelijke read-only- of idempotent calls kunnen parallel worden uitgevoerd met afzonderlijke durable records en deterministische aggregatie. Een worker die na dispatch en vóór het wegschrijven van de uitkomst crasht, wordt wakker met dezelfde session ID, reconcilieert de pending intent en gaat pas daarna verder. Bij een mislukte evaluatie wordt hervat bij planning; bij een geslaagde evaluatie wordt de run netjes beëindigd.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
