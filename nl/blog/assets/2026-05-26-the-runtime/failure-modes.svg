<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fm-title fm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fm-title">Vier foutklassen en de runtime-controls die ze indammen</title>
  <desc id="fm-desc">Fouten in kwaliteit, kosten, state en context komen samen bij runtime-controls. De acceptance gate is gemarkeerd omdat die voorkomt dat een agent onvoltooid werk als afgerond verklaart.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#59645E}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#59645E}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#59645E}.box{stroke:#17211B;stroke-width:1.5;fill:#FFFFFF}.edge{stroke:#59645E;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="560" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="48">FOUTKLASSE</text><text class="section" x="584" y="48">CONTAINMENT HOOK</text>
  <rect class="box" x="48" y="72" width="280" height="96" rx="10" /><text class="kind" x="68" y="106">FOUT · KWALITEIT</text><text class="name" x="68" y="134">Voortijdige voltooiing</text><text class="note" x="68" y="154">vergeten van features</text>
  <rect class="box" x="48" y="192" width="280" height="96" rx="10" /><text class="kind" x="68" y="226">FOUT · KOSTEN</text><text class="name" x="68" y="254">Retry-stormen</text><text class="note" x="68" y="274">ongecontroleerd tokenverbruik</text>
  <rect class="box" x="48" y="312" width="280" height="96" rx="10" /><text class="kind" x="68" y="346">FOUT · STATE</text><text class="name" x="68" y="374">Dubbele side effects</text><text class="note" x="68" y="394">workspace-drift · verlies bij crash</text>
  <rect class="box" x="48" y="432" width="280" height="80" rx="10" /><text class="kind" x="68" y="462">FOUT · CONTEXT</text><text class="name" x="68" y="490">Reset verliest intent</text>

  <rect x="584" y="72" width="328" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="604" y="106" fill="#C50E72">FOCUS · ACCEPTANCE GATE</text><text class="name" x="604" y="134" fill="#C50E72">Verse reviewer faalt gesloten</text>
  <rect class="box" x="584" y="192" width="328" height="96" rx="10" /><text class="kind" x="604" y="226">CONTROL · BUDGET</text><text class="name" x="604" y="254">Limieten · backoff · kill switch</text>
  <rect class="box" x="584" y="312" width="328" height="96" rx="10" /><text class="kind" x="604" y="346">CONTROL · DUURZAAMHEID</text><text class="name" x="604" y="374">Log · checkpoint · isolatie</text>
  <rect class="box" x="584" y="432" width="328" height="80" rx="10" /><text class="kind" x="604" y="462">CONTROL · COLD BOOT</text><text class="name" x="604" y="490">Progress-artifacts opnieuw laden</text>
  <path d="M328 120H576" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#fm-signal)" /><text class="note" x="408" y="110" fill="#C50E72">artifacts verifiëren</text>
  <path class="edge" d="M328 240H576" marker-end="url(#fm-arrow)" /><text class="note" x="420" y="230">werk begrenzen</text>
  <path class="edge" d="M328 360H576" marker-end="url(#fm-arrow)" /><text class="note" x="414" y="350">veilig hervatten</text>
  <path class="edge" d="M328 472H576" marker-end="url(#fm-arrow)" /><text class="note" x="412" y="462">intent herstellen</text>
  <text class="note" x="48" y="544">Mitigations bevinden zich buiten het geheugen van het model, zodat dezelfde controls een worker-restart overleven.</text>
  <defs><marker id="fm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="fm-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
