<text x="32" y="810" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">Mitigations draaien buiten het modelgeheugen en dezelfde controls overleven daardoor een worker restart.</text>
<text x="32" y="832" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een evaluator met fresh context werkt fail-closed, ongeacht welke failureklasse is opgetreden.</text>
