<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Keuzes voor inference-optimalisatie</title>
  <desc>Keuzes voor kernels, quantization, memory, scheduling, caching, speculation en parallelism zijn onafhankelijk selecteerbaar op basis van een gedeelde, gemeten hardware- en workload-bottleneck en targets op applicatieniveau.</desc>
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Keuzes voor inference-optimalisatie</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#334155">Selecteer onafhankelijk op basis van de gemeten bottleneck en de target-SLO</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#1d4ed8">Hardwarefundament</text>
  <text x="80" y="468" font-size="11" fill="#0f172a">GPU-memoryhiërarchie: HBM-bandbreedte en on-chip reuse verschillen per GPU</text>
  <text x="80" y="483" font-size="10" fill="#334155">Meet de compute-, memory- en communication-bottleneck op de target-GPU</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#166534">Kernel-optimalisaties</text>
  <text x="70" y="373" font-size="11" fill="#0f172a">FlashAttention (tiling in SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#0f172a">Fused kernels (minder HBM-round-trips)</text>
  <text x="70" y="398" font-size="10" fill="#334155">Profile het utilization-niveau op de gedeployde graph</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#9a3412">Quantization</text>
  <text x="470" y="373" font-size="11" fill="#0f172a">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#0f172a">8-bit weights: ongeveer 50% minder raw storage dan 16-bit</text>
  <text x="470" y="400" font-size="10" fill="#334155">4-bit: ongeveer 75% minder vóór overhead voor scale en metadata</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Memorymanagement</text>
  <text x="70" y="283" font-size="11" fill="#0f172a">PagedAttention (block-based KV-allocatie)</text>
  <text x="70" y="298" font-size="11" fill="#0f172a">GQA/MQA (8–16× minder KV cache)</text>
  <text x="70" y="308" font-size="10" fill="#334155">Gepubliceerde gains zijn afhankelijk van workload en harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#0f172a">Continuous batching (op iteration-niveau)</text>
  <text x="470" y="298" font-size="11" fill="#0f172a">Chunked prefill (beschermt decode-latency)</text>
  <text x="470" y="308" font-size="10" fill="#334155">Tune op goodput bij de target-SLO</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Caching</text>
  <text x="70" y="193" font-size="11" fill="#0f172a">Prefix caching (meet de hit rate)</text>
  <text x="70" y="208" font-size="11" fill="#0f172a">RadixAttention (tree-based KV-reuse)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Speculation</text>
  <text x="340" y="193" font-size="11" fill="#0f172a">Speculative decoding (verifieer drafts)</text>
  <text x="340" y="208" font-size="11" fill="#0f172a">De acceptance rate bepaalt de gain</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Parallelism</text>
  <text x="620" y="193" font-size="11" fill="#0f172a">TP (intra-node, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#0f172a">PP (inter-node) + DP (scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#991b1b">Applicatielaag</text>
  <text x="80" y="113" font-size="11" fill="#0f172a">Model routing · Token-aware rate limiting · Monitoring (goodput, KV-utilization, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="10" fill="#334155">Combineer technieken pas nadat je hun effecten op kwaliteit, latency en kosten hebt gemeten</text>

</svg>
