<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Prefill and decode phases" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Prefill- en decodefasen</title>
  <desc>Prefill verwerkt prompt tokens parallel en vult de KV cache. Lange of goed gebatchte prefills zijn vaak compute-bound, terwijl korte prefills beperkt kunnen worden door memory traffic of launch overhead. Batch-one of low-intensity decode genereert één token per keer en is memory-bound.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF" />
    </marker>
    <marker id="arrow2b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="400" fill="#F7F7F4" rx="8" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B" x="450">Prefill versus decode: twee fasen, verschillende bottlenecks</text>

  <!-- Prefill Phase -->
  <rect x="40" y="55" width="390" height="300" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#17211B" x="235">Prefillfase</text>

  <!-- Input prompt tokens -->
  <rect x="70" y="100" width="330" height="40" rx="5" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
  <text y="125" text-anchor="middle" font-size="12" fill="#17211B" x="235">Inputprompt: "Leg quantumcomputing uit in..."</text>

  <!-- Parallel processing arrows -->
  <g transform="translate(70, 155)">
    <rect width="60" height="30" rx="4" fill="#F2F2F5" />
    <text y="20" text-anchor="middle" font-size="11" fill="#ffffff" x="30">Token 1</text>
  </g>
  <g transform="translate(140, 155)">
    <rect width="60" height="30" rx="4" fill="#F2F2F5" />
    <text y="20" text-anchor="middle" font-size="11" fill="#ffffff" x="30">Token 2</text>
  </g>
  <g transform="translate(210, 155)">
    <rect width="60" height="30" rx="4" fill="#F2F2F5" />
    <text y="20" text-anchor="middle" font-size="11" fill="#ffffff" x="30">Token 3</text>
  </g>
  <g transform="translate(280, 155)">
    <rect width="50" height="30" rx="4" fill="#F2F2F5" />
    <text y="20" text-anchor="middle" font-size="11" fill="#ffffff" x="25">...</text>
  </g>
  <g transform="translate(340, 155)">
    <rect width="60" height="30" rx="4" fill="#F2F2F5" />
    <text y="20" text-anchor="middle" font-size="11" fill="#ffffff" x="30">Token N</text>
  </g>
  <text y="205" text-anchor="middle" font-size="11" fill="#17211B" font-weight="bold" x="235">Alle tokens parallel verwerkt</text>

  <!-- Properties -->
  <rect x="70" y="220" width="330" height="120" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" opacity="0.7" />
  <text y="245" font-size="12" font-weight="bold" fill="#17211B" x="90">VAAK COMPUTE-BOUND BIJ GROTE INPUTS</text>
  <text y="265" font-size="11" fill="#17211B" x="90">• Gebatchte GEMMs hergebruiken model weights</text>
  <text y="282" font-size="11" fill="#17211B" x="90">• Kort werk kan bandwidth/launch-bound zijn</text>
  <text y="299" font-size="11" fill="#17211B" x="90">• Draagt bij aan end-to-end TTFT</text>
  <text y="316" font-size="11" fill="#17211B" x="90">• Profile promptlengte en batchgrootte</text>
  <text y="333" font-size="11" fill="#17211B" font-weight="bold" x="90">• Optimaliseer de gemeten bottleneck</text>

  <!-- Arrow between phases -->
  <line x1="430" y1="200" x2="438" y2="200" stroke="#17211B" stroke-width="2" />
  <line x1="462" y1="200" x2="470" y2="200" stroke="#17211B" stroke-width="2" marker-end="url(#arrow2)" />
  <rect x="440" y="136" width="20" height="128" rx="3" fill="#FFFFFF" />
  <text y="200" text-anchor="middle" font-size="11" fill="#17211B" x="450" transform="rotate(-90 450 200)">KV cache gevuld</text>

  <!-- Decode Phase -->
  <rect x="470" y="55" width="390" height="300" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
  <text y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#17211B" x="665">Decodefase</text>

  <!-- Sequential token generation -->
  <rect x="500" y="100" width="330" height="40" rx="5" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text y="125" text-anchor="middle" font-size="12" fill="#17211B" x="665">Output: token → token → token → ...</text>

  <!-- Sequential arrows -->
  <g transform="translate(540, 155)">
    <rect width="60" height="30" rx="4" fill="#FFFFFF" stroke="#59645E" />
    <text y="20" text-anchor="middle" font-size="11" fill="#17211B" x="30">t₁</text>
  </g>
  <line x1="600" y1="170" x2="630" y2="170" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrow2b)" />
  <g transform="translate(630, 155)">
    <rect width="60" height="30" rx="4" fill="#FFFFFF" stroke="#59645E" />
    <text y="20" text-anchor="middle" font-size="11" fill="#17211B" x="30">t₂</text>
  </g>
  <line x1="690" y1="170" x2="720" y2="170" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrow2b)" />
  <g transform="translate(720, 155)">
    <rect width="60" height="30" rx="4" fill="#FFFFFF" stroke="#59645E" />
    <text y="20" text-anchor="middle" font-size="11" fill="#17211B" x="30">t₃</text>
  </g>
  <text y="205" text-anchor="middle" font-size="11" fill="#17211B" font-weight="bold" x="665">Eén token per keer, sequentieel</text>

  <!-- Properties -->
  <rect x="500" y="215" width="330" height="130" rx="6" fill="#ffffff" stroke="#59645E" stroke-width="1.5" opacity="0.7" />
  <text font-size="11" font-weight="bold" fill="#17211B" x="520">
    <tspan x="520" y="238">BATCH-ONE / LOW-INTENSITY</tspan>
    <tspan x="520" y="252">DECODE IS MEMORY-BOUND</tspan>
  </text>
  <text y="269" font-size="11" fill="#17211B" x="520">• Matrix-vector of kleine GEMM</text>
  <text y="286" font-size="11" fill="#17211B" x="520">• Leest volledige weights + KV cache uit HBM</text>
  <text y="303" font-size="11" fill="#17211B" x="520">• Batch-one-intensiteit ≈ 1</text>
  <text y="320" font-size="11" fill="#17211B" x="520">• Bepaalt TPOT</text>
  <text y="337" font-size="11" fill="#17211B" font-weight="bold" x="520">• Optimaliseer: GQA, KV quant, batching, BW</text>

  <!-- Timeline bar at bottom -->
  <rect x="40" y="370" width="820" height="20" rx="3" fill="#FFFFFF" />
  <rect x="40" y="370" width="280" height="20" rx="3" fill="#F2F2F5" opacity="0.3" />
  <rect x="320" y="370" width="540" height="20" rx="3" fill="#F2F2F5" opacity="0.3" class="visual-focus" />
  <text y="384" text-anchor="middle" font-size="11" fill="#17211B" font-weight="bold" x="180">TTFT</text>
  <text y="384" text-anchor="middle" font-size="11" fill="#17211B" font-weight="bold" x="590">TPOT × (Output Tokens − 1)</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
