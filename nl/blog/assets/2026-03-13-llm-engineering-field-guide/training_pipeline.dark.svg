<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="trainpipe-title trainpipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="trainpipe-title">Pretraining, fine-tuning en alignment voeden een afzonderlijk distillation-pad van teacher naar student.</title><desc id="trainpipe-desc">Pretraining traint next-token prediction op een groot corpus, supervised fine-tuning past het basismodel aan gelabelde data aan en alignment geeft gedrag vorm met RLHF, DPO of GRPO. Een aligned teacher model kan afzonderlijk gefilterde training examples genereren voor een kleinere distilled student — DeepSeek-R1 stelde ongeveer 800.000 examples samen uit een 671B-teacher om Qwen- en Llama-students van 1.5B tot 70B parameters te distilleren.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="trainpipe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="trainpipe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="596" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Elke fase wijzigt een ander artefact en heeft een eigen evaluatie nodig</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een aligned teacher kan ook training data genereren voor een kleinere, distilled student.</text>
