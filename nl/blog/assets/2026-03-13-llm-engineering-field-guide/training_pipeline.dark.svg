<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="LLM training pipeline from pretraining to alignment and distillation" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">LLM training pipeline</title>
  <desc>Pretraining levert een base model op, supervised fine-tuning past het aan en alignment optimaliseert preference- of verifiable rewards. Een aligned teacher kan ook gefilterde voorbeelden genereren voor een kleinere distilled student.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#141D19" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="500" fill="#0C1210" rx="14" />
  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#EDF5F0">LLM training pipeline</text>
  <text x="560" y="64" text-anchor="middle" font-size="13" fill="#EDF5F0">Elke fase wijzigt een ander artifact en vereist een eigen evaluatie</text>

  <rect x="48" y="92" width="280" height="178" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="72" y="124" font-size="17" font-weight="700" fill="#EDF5F0">1. Pretraining</text>
  <text x="72" y="154" font-size="13" fill="#EDF5F0">Artifact: base-model weights</text>
  <text x="72" y="178" font-size="13" fill="#EDF5F0">Signal: next-token prediction</text>
  <text x="72" y="202" font-size="13" fill="#EDF5F0">Data: groot ongelabeld corpus</text>
  <text x="72" y="226" font-size="13" fill="#EDF5F0">Systemen: ZeRO, FSDP, mixed precision</text>
  <text x="72" y="250" font-size="12" font-weight="600" fill="#EDF5F0">Meet loss, datakwaliteit en utilization</text>

  <line x1="328" y1="181" x2="410" y2="181" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="420" y="92" width="280" height="178" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
  <text x="444" y="124" font-size="17" font-weight="700" fill="#EDF5F0">2. Supervised fine-tuning</text>
  <text x="444" y="154" font-size="13" fill="#EDF5F0">Artifact: adapted weights of LoRA adapter</text>
  <text x="444" y="178" font-size="13" fill="#EDF5F0">Signal: gelabelde target responses</text>
  <text x="444" y="202" font-size="13" fill="#EDF5F0">Keuze: full update, LoRA of QLoRA</text>
  <text x="444" y="226" font-size="13" fill="#EDF5F0">Memory hangt af van rank en optimizer</text>
  <text x="444" y="250" font-size="12" font-weight="600" fill="#EDF5F0">Vergelijk task quality met het base model</text>

  <line x1="700" y1="181" x2="782" y2="181" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="792" y="92" width="280" height="178" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="816" y="124" font-size="17" font-weight="700" fill="#EDF5F0">3. Alignment</text>
  <text x="816" y="154" font-size="13" fill="#EDF5F0">PPO: reward model en critic</text>
  <text x="816" y="178" font-size="13" fill="#EDF5F0">DPO: offline preference-pair loss</text>
  <text x="816" y="202" font-size="13" fill="#EDF5F0">GRPO: group-relative reward baseline</text>
  <text x="816" y="226" font-size="13" fill="#EDF5F0">RLVR: tests of andere verifiable rewards</text>
  <text x="816" y="250" font-size="12" font-weight="600" fill="#EDF5F0">Test task quality en reward exploits</text>

  <path d="M932 270 V300 H188 V340" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  <text x="560" y="320" text-anchor="middle" font-size="12" fill="#EDF5F0">Een aligned teacher kan training data genereren</text>

  <rect x="48" y="340" width="1024" height="120" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="2" class="visual-focus" />
  <text x="72" y="372" font-size="17" font-weight="700" fill="#EDF5F0">Distillation en synthetic data</text>

  <rect x="80" y="390" width="220" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="190" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Grote teacher</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#EDF5F0">DeepSeek-R1 (671B)</text>

  <line x1="300" y1="415" x2="420" y2="415" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="430" y="390" width="260" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="560" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Genereer, filter en track lineage</text>
  <text x="560" y="430" text-anchor="middle" font-size="12" fill="#EDF5F0">DeepSeek-R1 rapporteert 800K voorbeelden</text>

  <line x1="690" y1="415" x2="810" y2="415" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="820" y="390" width="220" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="930" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Compacte student</text>
  <text x="930" y="430" text-anchor="middle" font-size="12" fill="#EDF5F0">1.5B tot 70B in de paper</text>

  <text x="560" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Evalueer de student opnieuw op de target task en binnen het serving budget</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
