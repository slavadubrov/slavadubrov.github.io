<text x="32" y="446" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een sterkere generator kan evidence die retrieval nooit heeft gevonden niet herstellen — evalueer elke stage afzonderlijk.</text>
<text x="32" y="468" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Voeg hybrid search, reranking of querytransformatie pas toe nadat error analysis een echte miss aantoont.</text>
