<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rag-title">RAG scheidt een offline ingestion-pad van een online pad voor search, reranking en generation.</title><desc id="rag-desc">De offline pipeline parse’t raw documenten naar schone tekst, splitst die in chunks, maakt voor elke chunk embeddings en slaat de vectors op. Bij elke query voedt dezelfde embedder — na een optionele querytransformatie zoals HyDE of multi-query expansion — een hybride dense-plus-BM25-search over die vector store. Een reranker scoort de opgehaalde kandidaten tegen de query, waarna het generatieve model antwoordt met de rerankte context.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="rag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Ingestion draait offline; retrieval en generation draaien per query</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Dezelfde embedder die tijdens ingestion wordt gebruikt, maakt de embedding van de query, tenzij die eerst wordt getransformeerd.</text>
