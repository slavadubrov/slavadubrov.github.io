<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="mlopsloop-title mlopsloop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mlopsloop-title">De MLOps-control loop die foundation-modelsystemen nog steeds nodig hebben</title><desc id="mlopsloop-desc">Lineage voedt een reproduceerbare build, een offline release gate, staged delivery en observability. Bewijs uit incidenten gaat terug naar de release gate, terwijl immutable identity, governance en rollback de hele loop omvatten.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mlopsloop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="mlopsloop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="450" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">De MLOps-control loop blijft van toepassing</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Gedrag verandert; de discipline die het beheerst niet.</text>
