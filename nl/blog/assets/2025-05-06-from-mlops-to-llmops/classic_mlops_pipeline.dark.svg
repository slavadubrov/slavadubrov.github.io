<text x="32" y="382" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Immutable identity, governance en rollback omvatten de hele loop.</text>
<text x="32" y="404" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Bewijs uit incidenten gaat vóór de volgende promotion terug naar de release gate.</text>
