<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="manifest-title manifest-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="manifest-title">De release-unit groeit van een modelservice uit tot een system manifest</title><desc id="manifest-desc">Een conventionele MLOps-core van code, data en model wordt aangevuld met vijf onafhankelijk veranderende extensies: prompts en schema, retrieval state, tools en permissions, routing en budget, en safety policy. Eén manifest identificeert de volledige release.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="manifest-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="manifest-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="700" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">De release-unit wordt een system manifest</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een conventionele MLOps-core wordt aangevuld met vijf onafhankelijk veranderende extensies.</text>
