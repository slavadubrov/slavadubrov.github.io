<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="trace-title trace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="trace-title">Production-traces worden regressietests voor veiligere releases</title><desc id="trace-desc">Een production-request levert een privacy-gecontroleerde trace op. Triage maakt van een beoordeelde fout een gelabelde regressiecase. Een evaluation gate vergelijkt die met de huidige release voordat een gefaseerde delivery plaatsvindt. De gemonitorde uitkomst sluit de loop terug naar production.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="trace-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="trace-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="460" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Traces sluiten de loop terug naar production</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een beoordeelde fout wordt een gelabelde case en leidt vervolgens tot een releasebesluit.</text>
