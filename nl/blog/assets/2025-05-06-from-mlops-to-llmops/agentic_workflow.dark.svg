<text x="32" y="410" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een thumbs-up is geen ground truth; voor consequential cases zijn nog steeds expertlabels nodig.</text>
