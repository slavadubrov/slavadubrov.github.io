<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rag-title">RAG-paden voor ingestion, serving en evaluatie</title>
  <desc id="rag-desc">Een versiegebonden source wordt geparsed en als embeddings in een vector index opgeslagen. Tijdens serving wordt een tenant-query geautoriseerd en worden gerangschikte evidence opgehaald. De retrievalkwaliteit wordt gecontroleerd vóór context assembly en generation; de answerkwaliteit wordt afzonderlijk gecontroleerd.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="488" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">INGESTION — EEN VERSIEGEBONDEN DATAPRODUCT BOUWEN</text>

  <rect class="store" x="48" y="72" width="232" height="96" rx="10" />
  <text class="kind" x="68" y="106">SOURCE</text><text class="name" x="68" y="134">Snapshot + ACL-status</text>
  <rect class="box" x="320" y="72" width="232" height="96" rx="10" />
  <text class="kind" x="340" y="106">PIPELINE</text><text class="name" x="340" y="134"><tspan x="340">Parsen + chunken +</tspan><tspan x="340" dy="1.2em">embeddings maken</tspan></text>
  <rect class="store" x="592" y="72" width="232" height="96" rx="10" />
  <text class="kind" x="612" y="106">INDEX</text><text class="name" x="612" y="134">Versiegebonden vectors</text>
  <path class="edge" d="M280 120h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M552 120h32" marker-end="url(#rag-arrow)" />

  <text class="kind" x="48" y="228">SERVING — RETRIEVAL EVALUEREN VÓÓR GENERATION</text>
  <rect class="box" x="48" y="256" width="192" height="96" rx="10" />
  <text class="kind" x="68" y="290">REQUEST</text><text class="name" x="68" y="318">Query + tenant</text>
  <rect class="box" x="280" y="256" width="232" height="96" rx="10" />
  <text class="kind" x="300" y="290">RETRIEVAL</text><text class="name" x="300" y="318">Autoriseren + ranken</text>
  <rect x="552" y="256" width="208" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="572" y="290" fill="#C50E72">RETRIEVAL GATE</text><text class="name" x="572" y="318" fill="#C50E72"><tspan x="572">Is de evidence</tspan><tspan x="572" dy="1.2em">bruikbaar?</tspan></text>
  <rect class="box" x="800" y="256" width="272" height="96" rx="10" />
  <text class="kind" x="820" y="290">GENERATION</text><text class="name" x="820" y="318">Assembleren + antwoord geven</text>
  <path class="edge" d="M240 304h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M512 304h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M760 304h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M708 168v40H396v40" stroke-dasharray="2 6" marker-end="url(#rag-arrow)" />
  <rect x="504" y="196" width="168" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="588" y="213" text-anchor="middle">geselecteerde indexversie</text>

  <path d="M800 408h272" stroke="#D8DDD9" />
  <text class="kind" x="800" y="400">ANSWER GATE</text>
  <text class="note" x="800" y="432">onderbouwing · citation · task success</text>

  <defs><marker id="rag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
