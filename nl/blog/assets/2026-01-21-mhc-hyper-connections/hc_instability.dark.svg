<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Gerapporteerde HC-instabiliteit bij 27B</title>
  <desc id="desc">Onbeperkte residual maps stapelen zich over layers; de paper rapporteert een piek in composite Amax Gain van bijna 3.000 in het 27B HC-experiment.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>
    <marker id="arrowSlate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>

    <!-- Glowing Effects -->




    <!-- Shadows -->

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="600" fill="#0C1210" />

  <!-- Background grid layer -->
  <rect width="1000" height="600" fill="#0C1210" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#EDF5F0">De complicatie: instabiliteit op schaal</text>
  <text x="40" y="80" font-size="16" fill="#EDF5F0">De paper koppelt de loss-piek van HC bij 27B aan een onbeperkte composite residual map.</text>

  <!-- Left Side: Plot Area -->
  <g transform="translate(80, 140)">

    <!-- Plot Background -->
    <rect x="0" y="0" width="460" height="380" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus" />

    <text x="240" y="28" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="600">Magnitude van Amax Gain (log-schaal)</text>

    <!-- Y-axis lines and ticks -->
    <g stroke="#A8B8AF" stroke-width="1.5" fill="none">
      <line x1="60" y1="50" x2="420" y2="50" />
      <line x1="60" y1="120" x2="420" y2="120" />
      <line x1="60" y1="190" x2="420" y2="190" />
      <line x1="60" y1="260" x2="420" y2="260" />
    </g>

    <!-- Y-axis tick labels -->
    <g fill="#A8B8AF" font-size="12" text-anchor="end" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
      <text x="50" y="54">1000</text>
      <text x="50" y="124">100</text>
      <text x="50" y="194">10</text>
      <text x="50" y="264">1</text>
      <text x="50" y="334">0.1</text>
    </g>

    <!-- Base X and Y axis lines drawn thicker -->
    <path d="M 60 40 L 60 330 L 430 330" fill="none" stroke="#EDF5F0" stroke-width="2" />

    <!-- X-axis tick labels -->
    <g fill="#A8B8AF" font-size="12" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
      <text x="60" y="350">0</text>
      <text x="150" y="350">25</text>
      <text x="240" y="350">50</text>
      <text x="330" y="350">75</text>
      <text x="420" y="350">100</text>
    </g>
    <!-- X-axis label -->
    <text x="240" y="370" text-anchor="middle" fill="#EDF5F0" font-size="14" font-weight="600">Layerdiepte</text>

    <!-- SVG paths for the curves -->
    <!-- ResNet Line -->
    <path id="pathResNet" d="M 60 260 L 420 260" fill="none" stroke="#A8B8AF" stroke-width="3" stroke-dasharray="6,4" />
    <!-- Exploding Line -->
    <path id="pathExplode" d="M 60 260 C 200 260, 300 210, 420 50" fill="none" stroke="#EDF5F0" stroke-width="3" />
    <!-- Vanishing Line -->
    <path id="pathVanish" d="M 60 260 C 200 260, 300 320, 420 325" fill="none" stroke="#A8B8AF" stroke-width="3" />

    <!-- Exploding Curve Annotation -->
    <line x1="315" y1="120" x2="335" y2="100" stroke="#EDF5F0" stroke-width="1.5" marker-end="url(#arrowRed)" />
    <rect x="265" y="120" width="100" height="26" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="315" y="138" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="700">Exploderend</text>

    <!-- ResNet Curve Annotation -->
    <line x1="350" y1="240" x2="350" y2="252" stroke="#EDF5F0" stroke-width="1.5" marker-end="url(#arrowSlate)" />
    <rect x="280" y="214" width="140" height="26" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="350" y="232" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="700">Standaard ResNet</text>

    <!-- Vanishing Curve Annotation -->
    <line x1="225" y1="292" x2="270" y2="313" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowAmber)" />
    <rect x="180" y="266" width="90" height="26" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="225" y="284" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="700">Verdwijnend</text>

    <!-- Animated Particles Tracing Curves -->

  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(580, 140)">

    <!-- Title Card -->
    <rect x="0" y="0" width="380" height="280" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="190" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="#EDF5F0">Gain van de composite operator</text>
    <line x1="20" y1="50" x2="360" y2="50" stroke="#2B3B33" stroke-width="2" />

    <!-- Standard Comparison -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="340" height="36" rx="6" fill="#141D19" stroke="#2B3B33" stroke-width="1.5" />
      <text x="15" y="23" font-size="14" font-weight="600" fill="#EDF5F0">Standaard ResNet:</text>
      <text x="140" y="23" font-size="14" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">1.0 × x</text>
      <rect x="270" y="7" width="55" height="22" rx="11" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
      <text x="297" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Veilig</text>
    </g>

    <!-- HC Matrix Explanations -->
    <g transform="translate(20, 140)">
      <text x="0" y="0" font-size="14" font-weight="600" fill="#EDF5F0">Hyper-Connection: onbeperkte matrix</text>

      <!-- Explodes -->
      <g transform="translate(0, 20)">
        <text x="10" y="0" font-size="14" font-weight="600" fill="#EDF5F0">• Herhaalde gain &gt; 1</text>
        <line x1="180" y1="-5" x2="200" y2="-5" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSlate)" />
        <text x="215" y="0" font-size="14" font-weight="700" fill="#EDF5F0">Explodeert</text>
        <text x="10" y="22" font-size="13" fill="#EDF5F0">kan uitgelijnde richtingen versterken</text>
      </g>

      <!-- Vanishes -->
      <g transform="translate(0, 65)">
        <text x="10" y="0" font-size="14" font-weight="600" fill="#EDF5F0">• Herhaalde gain &lt; 1</text>
        <line x1="180" y1="-5" x2="200" y2="-5" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSlate)" />
        <text x="215" y="0" font-size="14" font-weight="700" fill="#EDF5F0">Verdwijnt</text>
        <text x="10" y="22" font-size="13" fill="#EDF5F0">kan uitgelijnde richtingen verzwakken</text>
      </g>
    </g>

    <!-- Warning Metrics Box -->
    <rect x="0" y="310" width="380" height="85" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <path d="M 15 325 L 15 380" stroke="#EDF5F0" stroke-width="4" stroke-linecap="round" />
    <text x="30" y="340" font-size="14" font-weight="700" fill="#EDF5F0">Meting van HC bij 27B in de paper</text>
    <text x="30" y="362" font-size="13" font-weight="500" fill="#EDF5F0" style="font-size: 12.5px;">In diepe, ongecontroleerde HC-netwerken heeft DeepSeek</text>
    <text x="30" y="380" font-size="13" font-weight="500" fill="#EDF5F0">een </text>
    <text x="105" y="380" font-size="13" font-weight="800" fill="#EDF5F0">~3000x</text>
    <text x="163" y="380" font-size="13" font-weight="500" fill="#EDF5F0" style="font-size: 11.5px;"> piek in composite Amax Gain gemeten.</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
