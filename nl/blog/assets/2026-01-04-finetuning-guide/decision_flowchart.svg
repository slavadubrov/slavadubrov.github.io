<rect x="32" y="256" width="320" height="96" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="192" y="285" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">BESLISSING</text><text x="192" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">Eenvoudige stijl- of</text><text x="192" y="331" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">formatfix?</text>
<path d="M426 252h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M426 252h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="430" y="269.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">UITKOMST</text><text x="430" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Prompt engineering</text><text x="430" y="325" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Few-shot voorbeelden,</text><text x="430" y="345" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">snelle iteratie</text>
<path d="M352 304h64" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="292" width="42" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="384" y="308.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">ja</text>
<path d="M192 352v48" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="364" width="35" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="192" y="380.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">nee</text>
<rect x="32" y="400" width="320" height="96" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="192" y="429" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">BESLISSING</text><text x="192" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">Alleen de outputsyntaxis</text><text x="192" y="475" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">is ongeldig?</text>
<path d="M426 396h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M426 396h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="430" y="413.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">UITKOMST</text><text x="430" y="447" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Constrained decoding</text><text x="430" y="469" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">xgrammar / outlines —</text><text x="430" y="489" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">geldige syntaxis, niet de waarheid</text>
<path d="M352 448h64" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="436" width="42" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="384" y="452.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">ja</text>
<path d="M192 496v48" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="508" width="35" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="192" y="524.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">nee</text>
<rect x="32" y="544" width="320" height="96" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="192" y="573" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">BESLISSING</text><text x="192" y="597" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">Gemeten verschil met</text><text x="192" y="619" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B" text-anchor="middle">untuned baseline?</text>
<path d="M426 540h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M426 540h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="430" y="557.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCUS</text><text x="430" y="591" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Fine-tune (LoRA/QLoRA)</text><text x="430" y="613" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Pas nadat prompting</text><text x="430" y="633" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">en decoding zijn uitgesloten</text>
<path d="M352 592h64" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="580" width="42" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="384" y="596.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">ja</text>
<path d="M192 640v48" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="652" width="35" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="192" y="668.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">nee</text>
<path d="M42 688h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 688h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="46" y="705.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">UITKOMST</text><text x="46" y="739" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Behoud de baseline</text><text x="46" y="761" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Nog geen bewezen case —</text><text x="46" y="781" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">herzie na nieuwe data</text>
<path d="M32 840h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="866" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Elke upstream-stap is goedkoper te testen dan de volgende.</text>
<text x="32" y="888" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Voer alleen een fine-tune uit nadat de goedkopere mechanismen zijn uitgesloten en de baseline een echt</tspan><tspan x="32" dy="1.2em">verschil laat zien.</tspan></text>
</svg>
