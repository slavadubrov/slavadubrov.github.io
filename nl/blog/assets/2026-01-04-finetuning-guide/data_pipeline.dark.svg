<text x="32" y="1058" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">PII-detectie alleen dekt consent, retentie of verwijdering niet af.</text>
<text x="32" y="1080" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Controleer na cleaning opnieuw de scheiding per source; houd alle rewrites in training.</text>
