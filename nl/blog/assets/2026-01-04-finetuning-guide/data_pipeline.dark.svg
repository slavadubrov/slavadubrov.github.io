<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Data Pipeline" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Pipeline voor fine-tuning-datapreparatie</title>
  <desc>Ruwe voorbeelden doorlopen filtering, controles op gevoelige data, deduplicatie, optionele augmentatie en formattering voordat een versiebeheerde trainingssplit wordt geproduceerd.</desc>
  <defs>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B2621" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" fill="#0C1210" />

  <!-- Title -->
  <text x="450" y="35" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#EDF5F0">Datapreparatiepipeline</text>

  <!-- Raw Data -->
  <g transform="translate(40, 70)">
    <rect width="120" height="55" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="60" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#EDF5F0">Ruwe data</text>
    <text x="60" y="44" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Onverwerkt corpus</text>
  </g>

  <path d="M 160 97 L 190 97" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 1: Ingestion -->
  <g transform="translate(200, 70)">
    <rect width="130" height="55" rx="6" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">1. Ingestion</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Verwijder weigeringen,</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">ongeldige UTF-8</text>
  </g>
  <text x="265" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" font-style="italic">Trafilatura + FastText</text>

  <path d="M 330 97 L 360 97" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 2: PII -->
  <g transform="translate(370, 70)">
    <rect width="130" height="55" rx="6" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">2. PII-scrubbing</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Redigeer e-mails, IP's,</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">telefoonnummers</text>
  </g>
  <text x="435" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" font-style="italic">Microsoft Presidio</text>

  <path d="M 500 97 L 530 97" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 3: Dedup -->
  <g transform="translate(540, 70)">
    <rect width="130" height="55" rx="6" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">3. Deduplicatie</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">MinHash LSH om</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">duplicaten te verwijderen</text>
  </g>
  <text x="605" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" font-style="italic">DataTrove</text>

  <path d="M 670 97 L 700 97" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 4: Augmentation -->
  <g transform="translate(710, 70)">
    <rect width="130" height="55" rx="6" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="65" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">4. Augmentatie</text>
    <text x="65" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Teacher model</text>
    <text x="65" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">herschrijft data</text>
  </g>
  <text x="775" y="140" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0" font-style="italic">Distilabel</text>

  <!-- Arrow down and left -->
  <path d="M 820 125 L 820 170 L 545 170" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Stage 5: Formatting -->
  <g transform="translate(370, 155)">
    <rect width="165" height="55" rx="6" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="82" y="24" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">5. Formatteren</text>
    <text x="82" y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Converteren naar Alpaca / ShareGPT</text>
    <text x="82" y="50" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">JSONL-indeling</text>
  </g>

  <path d="M 370 182 L 220 182" stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Clean Dataset -->
  <g transform="translate(80, 155)">
    <rect width="130" height="55" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="65" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#EDF5F0">Schone dataset</text>
    <text x="65" y="44" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Klaar voor fine-tuning</text>
  </g>

  <!-- Key Principles Box -->
  <rect x="40" y="250" width="820" height="200" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus" />
  <text x="60" y="280" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDF5F0">Belangrijkste principes</text>

  <circle cx="60" cy="310" r="4" fill="#FF6FB6" />
  <text x="75" y="314" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Kwaliteit boven kwantiteit:</text>
  <text x="210" y="314" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Voeg dekking toe voor verschillende failure modes voordat je eenvoudige voorbeelden herhaalt</text>

  <circle cx="60" cy="345" r="4" fill="#FF6FB6" />
  <text x="75" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Schone data:</text>
  <text x="155" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Verwijder irrelevante informatie, normaliseer tekst en zorg voor consistente formattering</text>

  <circle cx="60" cy="380" r="4" fill="#FF6FB6" />
  <text x="75" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Balans:</text>
  <text x="135" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Zorg voor representatie over onderwerpen heen om bias te voorkomen</text>

  <circle cx="60" cy="415" r="4" fill="#FF6FB6" />
  <text x="75" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Datagovernance:</text>
  <text x="180" y="419" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Leg provenance, toestemming, bewaartermijn, transformaties en verwijderingspaden vast</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
