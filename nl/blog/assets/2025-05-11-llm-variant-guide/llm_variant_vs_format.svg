<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Zes onafhankelijke lagen in een open-weight modelartifact</title>
  <desc id="layers-desc">Zes uitgelijnde knooppunten scheiden family en revision, training role, architecture, numeric representation, container en layout, en runtime en hardware. Container en layout staan centraal, omdat een formatnaam slechts één laag van het artifact is.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#F7F7F4" />

  <text class="section" x="48" y="48">MODELARTIFACT — LEES ELKE LAAG AFZONDERLIJK</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="114">LAAG 1</text>
  <text class="name" x="68" y="142">Family + revision</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="114">LAAG 2</text>
  <text class="name" x="364" y="142">Training role</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="114">LAAG 3</text>
  <text class="name" x="660" y="142">Architecture</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="250">LAAG 4</text>
  <text class="name" x="68" y="278">Numeric representation</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="364" y="250" fill="#C50E72">FOCUS · LAAG 5</text>
  <text class="name" x="364" y="278" fill="#C50E72">Container + layout</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="250">LAAG 6</text>
  <text class="name" x="660" y="278">Runtime + hardware</text>

  <path d="M48 360H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="392">VOORBEELDEN</text>
  <text class="note" x="48" y="420">GPTQ en AWQ beschrijven quantization. GGUF en Safetensors beschrijven packaging.</text>
  <text class="note" x="48" y="448">MoE beschrijft de execution structure. llama.cpp, vLLM en Transformers voeren ondersteunde artifacts uit.</text>
  <text class="note" x="48" y="476">Een vertrouwd suffix bewijst niet automatisch de kwaliteit, memory fit of serving-snelheid.</text>
</svg>
