<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 832" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="cmv-title cmv-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cmv-title">Kies een modelvariant door rol, herkomst en architectuur te scheiden</title><desc id="cmv-desc">Drie opties voor de trainingsrol — base, instruct en reasoning-tuned — komen samen bij optionele distillation als herkomst en splitsen daarna op in dense of mixture-of-experts-architectuur. Alle paden eindigen bij één gerichte release-evaluatiegate die task quality, interface correctness, latency en peak memory meet.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cmv-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="cmv-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="832" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Scheid rol, herkomst en architectuur</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Distillation is optionele herkomst, geen vierde rol — het kan op elk van de drie bovenstaande rollen</tspan><tspan x="32" dy="1.2em">worden toegepast.</tspan></text>
