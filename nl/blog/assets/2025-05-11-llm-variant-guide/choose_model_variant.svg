<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" data-visual-system="evidence-plate-v1" font-family="Inter, system-ui, sans-serif">
  <title id="title">Kies een modelvariant door trainingsrol, trainingsherkomst en architectuur apart te beoordelen</title>
  <desc id="desc">Besliskaart in drie stappen. Kies eerst een base- of instruction-tuned kandidaat. Beoordeel daarna reasoning-tuned als trainingsrol en distilled als trainingsherkomst. Controleer ten slotte ondersteuning voor dense- of mixture-of-experts-architectuur en meet kwaliteit, latency en geheugen.</desc>
  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .stage { font-size: 15px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 600; }
      .copy { font-size: 12px; fill: #64748b; }
      .note { font-size: 12px; fill: #166534; font-weight: 600; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="960" height="680" rx="14" fill="#f8fafc" />
  <text x="48" y="48" class="title">Kies een modelvariant zonder op één suffix te vertrouwen</text>
  <text x="48" y="74" class="subtitle">Elk label beantwoordt een andere vraag. Laat elke kandidaat dezelfde task evaluation doorlopen.</text>

  <rect x="48" y="104" width="864" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="72" y="134" class="stage">1. Kies de trainingsrol voor het gewenste gedrag</text>
  <rect x="72" y="152" width="376" height="78" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="92" y="178" class="label">Assistant-, chat- of tool-interface</text>
  <text x="92" y="201" class="copy">Begin met een instruction-tuned kandidaat.</text>
  <text x="92" y="219" class="copy">Controleer de chat template en het interfacegedrag.</text>
  <rect x="472" y="152" width="416" height="78" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="492" y="178" class="label">Voortgezette pretraining of custom post-training</text>
  <text x="492" y="201" class="copy">Neem een base-kandidaat op.</text>
  <text x="492" y="219" class="copy">Test ook instruct-initialisatie als die bij de objective past.</text>

  <path d="M480 254 V278" class="arrow" />

  <rect x="48" y="288" width="864" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="72" y="318" class="stage">2. Houd trainingsrol en trainingsherkomst gescheiden</text>
  <rect x="72" y="336" width="376" height="78" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="92" y="362" class="label">Trainingsrol: reasoning-tuned</text>
  <text x="92" y="385" class="copy">Behoud deze alleen als moeilijke evaluation-slices verbeteren</text>
  <text x="92" y="403" class="copy">na kosten voor output-tokens, latency en verificatie.</text>
  <rect x="472" y="336" width="416" height="78" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="492" y="362" class="label">Trainingsherkomst: distilled</text>
  <text x="492" y="385" class="copy">Leg teacher, data, objective en student vast.</text>
  <text x="492" y="403" class="copy">Meet behouden gedrag op jouw task.</text>

  <path d="M480 438 V462" class="arrow" />

  <rect x="48" y="472" width="864" height="116" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="72" y="502" class="stage">3. Controleer architectuur- en runtime-ondersteuning</text>
  <rect x="72" y="520" width="376" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="92" y="547" class="label">Dense of MoE: bevestig loader en kernels</text>
  <rect x="472" y="520" width="416" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="492" y="547" class="label">MoE: controleer de plaatsing van expert weights in de runtime</text>

  <path d="M480 588 V612" class="arrow" />
  <rect x="180" y="622" width="600" height="38" rx="19" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="480" y="646" text-anchor="middle" class="note">Release gate: taskkwaliteit + interfacechecks + latency + piekgeheugen</text>
</svg>
