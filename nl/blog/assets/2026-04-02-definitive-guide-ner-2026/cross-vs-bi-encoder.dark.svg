<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="cb-title cb-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="cb-title">Werk met cross-encoder en bi-encoder vereist voor een herbruikbare labelinventaris</title>
  <desc id="cb-desc">Een cross-encoder encodeert labels samen met elk document opnieuw. Een bi-encoder encodeert labels en tekst afzonderlijk, zodat de label embeddings kunnen worden gecachet en hergebruikt. De herbruikbare cache staat centraal.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .metric { font: 600 15px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="608" rx="14" fill="#0C1210" />
  <defs><marker id="cb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <rect class="group" x="48" y="48" width="412" height="512" rx="12" /><rect class="group" x="500" y="48" width="412" height="512" rx="12" />
  <text class="section" x="72" y="80">CROSS-ENCODER · HERHAALD WERK</text><text class="section" x="524" y="80">BI-ENCODER · HERGEBRUIKBAAR WERK</text>
  <path class="edge" d="M254 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M254 252v40" marker-end="url(#cb-arrow)" /><path class="edge" d="M594 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M818 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M594 252v40" marker-end="url(#cb-arrow)" /><path class="edge" d="M818 252v16h86v142h-86v18" marker-end="url(#cb-arrow)" /><path class="edge" d="M706 388v40" marker-end="url(#cb-arrow)" />
  <rect class="box" x="72" y="96" width="364" height="62" rx="10" fill="#1B2621" /><text class="kind" x="92" y="121">INPUT</text><text class="name" x="92" y="146">Labels + tekst in één sequence</text>
  <rect class="box" x="72" y="190" width="364" height="62" rx="10" fill="#141D19" /><text class="kind" x="92" y="215">PROCESS</text><text class="name" x="92" y="240">Gezamenlijke attention over beide</text>
  <rect class="box" x="72" y="292" width="364" height="96" rx="10" fill="#141D19" /><text class="kind" x="92" y="326">PROCESS</text><text class="name" x="92" y="354">Score span × type</text><text class="note" x="92" y="376">Elk document herhaalt de label encoding.</text>
  <text class="kind" x="72" y="448">BIJ 1.024 TYPES</text><text class="metric" x="72" y="478">10,7 → 0,14 voorbeelden/s</text><text class="note" x="72" y="504">gliner_small-v2.5 · 98,7% reductie</text><text class="note" x="72" y="530">Eén H100 · batch 1 · omstandigheden uit de paper</text>
  <rect class="box" x="524" y="96" width="140" height="62" rx="10" fill="#1B2621" /><text class="kind" x="544" y="121">LABELS</text><text class="name" x="544" y="146">Typelijst</text>
  <rect class="box" x="748" y="96" width="140" height="62" rx="10" fill="#1B2621" /><text class="kind" x="768" y="121">TEKST</text><text class="name" x="768" y="146">Document</text>
  <rect class="box" x="524" y="190" width="140" height="62" rx="10" fill="#141D19" /><text class="kind" x="544" y="215">PROCESS</text><text class="name" x="544" y="240">Label encoder</text>
  <rect class="box" x="748" y="190" width="140" height="62" rx="10" fill="#141D19" /><text class="kind" x="768" y="215">PROCESS</text><text class="name" x="768" y="240">Text encoder</text>
  <rect x="524" y="292" width="364" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="548" y="326" fill="#FF6FB6">FOCUS · STORE</text><text class="name" x="548" y="354" fill="#FF6FB6">Gecachete label embeddings</text><text class="note" x="548" y="376" fill="#FF6FB6">Eén keer pre-computen; hergebruiken voor meerdere documenten.</text>
  <rect class="box" x="524" y="428" width="364" height="62" rx="10" fill="#141D19" /><text class="kind" x="548" y="453">PROCESS</text><text class="name" x="548" y="478">Late span × type scoring</text>
  <text class="kind" x="524" y="524">BIJ 1.024 TYPES</text><text class="metric" x="524" y="550">19,3 → 18,3 voorbeelden/s · 5,2% reductie</text><text class="note" x="524" y="578">Vooraf gecompute gliner-bi-edge-v2.0 · tot 130× in de paper</text>
</svg>
