<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tt-title tt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tt-title">Drielaagse NER-routing op basis van de taakvorm voor extraction</title>
  <desc id="tt-desc">Een extraction request wordt gerouteerd op basis van de taakvorm. Expliciete spans gaan naar encoders, joint tasks en relaties naar GLiNER2 of GLiNER-Relex, en reasoning-intensieve of ontology-mapping-taken naar schema-constrained LLMs. Gelogde LLM-cases voeden de volgende encoder-trainingsset.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="552" rx="14" fill="#0C1210" />
  <defs><marker id="tt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <path class="edge" d="M256 96h40" marker-end="url(#tt-arrow)" /><path class="edge" d="M480 144v40H168v40" marker-end="url(#tt-arrow)" /><path class="edge" d="M480 144v80" marker-end="url(#tt-arrow)" /><path class="edge" d="M480 144v40h312v40" marker-end="url(#tt-arrow)" />
  <rect x="48" y="48" width="208" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="72" y="82">REQUEST</text><text class="name" x="72" y="110">Extraction-taak</text><text class="note" x="72" y="132">Tekst + vereist schema.</text>
  <rect x="296" y="48" width="368" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="320" y="82" fill="#FF6FB6">FOCUS · ROUTER</text><text class="name" x="320" y="110" fill="#FF6FB6">Routeer op taakvorm</text><text class="note" x="320" y="132" fill="#FF6FB6">Rank modellen niet één keer voor elk request.</text>
  <rect class="group" x="48" y="200" width="240" height="264" rx="12" /><rect class="group" x="360" y="200" width="240" height="264" rx="12" /><rect class="group" x="672" y="200" width="240" height="264" rx="12" />
  <rect class="box" x="72" y="224" width="192" height="96" rx="10" fill="#141D19" /><text class="kind" x="92" y="258">TIER 1 · PROCESS</text><text class="name" x="92" y="286">Encoder-modellen</text><text class="note" x="92" y="308">Expliciete tekstspans.</text>
  <text class="kind" x="72" y="356">KIES OP LABELSET</text><text class="note" x="72" y="382">Cross-encoder · kleine inventory</text><text class="note" x="72" y="406">Bi-encoder · herbruikbare inventory</text><text class="note" x="72" y="430">Fine-tuned model · stabiel domein</text>
  <rect class="box" x="384" y="224" width="192" height="96" rx="10" fill="#141D19" /><text class="kind" x="404" y="258">TIER 2 · PROCESS</text><text class="name" x="404" y="286">Joint extraction</text><text class="note" x="404" y="308">Meerdere gekoppelde taken.</text>
  <text class="kind" x="384" y="356">TEST DE COMPOSITIE</text><text class="note" x="384" y="382">GLiNER2 · NER + velden + klasse</text><text class="note" x="384" y="406">GLiNER-Relex · spans + relaties</text><text class="note" x="384" y="430">Evalueer elke output afzonderlijk</text>
  <rect x="696" y="224" width="192" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><text class="kind" x="716" y="258">TIER 3 · EXTERNAL</text><text class="name" x="716" y="286">Structured LLM</text><text class="note" x="716" y="308">Inference of mapping.</text>
  <text class="kind" x="696" y="356">BEHEERS DE OUTPUT</text><text class="note" x="696" y="382">Native schema · Instructor</text><text class="note" x="696" y="406">Outlines · lokale generatie</text><text class="note" x="696" y="430">Ground of self-host indien nodig</text>
  <path class="edge" d="M792 464v32H168v-32" stroke-dasharray="2 6" marker-end="url(#tt-arrow)" /><rect x="338" y="484" width="284" height="24" rx="6" fill="#0C1210" /><text class="note" x="480" y="501" text-anchor="middle">gelogde cases → volgende Tier 1-trainingsset</text><text class="note" x="48" y="534">Meet de verdeling van production traffic; de tiers beschrijven het werk, niet een vast percentage van de requests.</text>
</svg>
