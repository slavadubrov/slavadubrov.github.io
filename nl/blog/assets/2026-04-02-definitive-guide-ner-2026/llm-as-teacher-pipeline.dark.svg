<text x="32" y="882" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Vergelijking uit de case study, geen universele kostenratio.</text>
<text x="32" y="904" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Teacher: 92,7% F1, gerapporteerd $8/uur. Encoder: 93,4% F1, gerapporteerd $0,10/uur (CPU).</text>
<text x="32" y="926" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Je gate moet labeling-, review-, serving- en retraining-kosten omvatten.</text>
