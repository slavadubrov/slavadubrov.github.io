<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="teacherpipe-title teacherpipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="teacherpipe-title">CFM's LLM-as-teacher-pipeline, van ruwe headlines tot een gedeployde encoder</title><desc id="teacherpipe-desc">Zes geordende stappen verwerken ongeveer 900.000 ongelabelde financiële headlines via labeling door Llama 3.1-70B als teacher, human review in Argilla, fine-tuning van de encoder en een gecombineerde quality-and-cost-gate voordat de encoder wordt gedeployed voor serving op CPU. De gerapporteerde kosten uit de case study gebruiken uurprijzen van instances zonder normalisatie voor throughput.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="teacherpipe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="teacherpipe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="980" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">LLM-as-teacher: van headlines tot gedeployde encoder</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een held-out quality-and-total-cost-gate bepaalt of de encoder wordt uitgerold.</text>
