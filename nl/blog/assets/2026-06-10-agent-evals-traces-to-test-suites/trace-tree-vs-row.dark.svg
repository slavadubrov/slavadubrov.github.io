<path d="M378 380h124a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-124a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M378 380h124a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-144a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="382" y="397.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · GAP</text><text x="382" y="440" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Identiteit</text><text x="382" y="462" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">verifiëren</text>
<path d="M538 380h124a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-124a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M538 380h124a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-144a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="542" y="397.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TOOL</text><text x="542" y="435" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Refund uitvoeren</text>
<path d="M192 416h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ttvr-arrow-flow)" />
<path d="M352 416h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ttvr-arrow-flow)" />
<path d="M512 416h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ttvr-arrow-flow)" />
<text x="48" y="512" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Elke beslissing en tool call blijft zichtbaar — ook het overslaan ervan.</text>
<path d="M32 582h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="608" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Answer-only grading slaagt omdat de eindpunten er correct uitzien.</text>
<text x="32" y="630" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Trajectory grading detecteert de ontbrekende verify_identity-call voordat issue_refund wordt uitgevoerd.</text>
