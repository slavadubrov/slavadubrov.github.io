<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ttvr-title ttvr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ttvr-title">Een rij versus een boom: waar agent-fouten verborgen blijven</title><desc id="ttvr-desc">Een conventionele evaluatie scoort alleen het refund-verzoek en het eindantwoord, waardoor een trace waarin verify_identity niet vóór issue_refund werd uitgevoerd er toch correct uitziet. Door de volledige trajectory te openen, komt die ontbrekende stap naar voren als de kern van de fout.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ttvr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ttvr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="680" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Een rij versus een boom</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Hetzelfde refund-verzoek, twee evaluatiedoelen.</text>
