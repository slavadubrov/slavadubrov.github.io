<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Promotie vereist agreement op traces met menselijke labels, niet alleen een schema-valid verdict.</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een wijziging van het judge-model of de prompt stuurt de lus terug naar herkalibratie.</text>
