<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="judgecal-title judgecal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="judgecal-title">Kalibratielus voor de judge</title><desc id="judgecal-desc">Menselijke labels bepalen een rubric en een vastgezette judge-versie. Een agreement check meet kappa en het false-passpercentage ten opzichte van die labels; bias checks en drift monitoring sturen een judge die niet slaagt voor de check terug naar rubric-revisie voordat deze CI bereikt.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
