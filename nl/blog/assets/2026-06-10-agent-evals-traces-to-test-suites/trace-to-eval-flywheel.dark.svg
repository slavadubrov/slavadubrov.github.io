<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een gediagnosticeerde failure is pas afgehandeld wanneer de volgende agentversie deze moet doorstaan.</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Stap 6, de CI-gate, zorgt ervoor dat de loop überhaupt iets afdwingt.</text>
