<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="flywheel-title flywheel-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="flywheel-title">De trace-to-eval-flywheel</title><desc id="flywheel-desc">Een gesamplede production trace wordt gelabeld, geclusterd, teruggebracht tot één representatieve golden case, van een versie voorzien en in CI als gate gebruikt voordat de agent wordt uitgebracht; de uitgebrachte agent genereert vervolgens de volgende traces die de loop analyseert.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="flywheel-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="flywheel-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="552" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">De trace-to-eval-flywheel</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Production evidence wordt een release gate.</text>
