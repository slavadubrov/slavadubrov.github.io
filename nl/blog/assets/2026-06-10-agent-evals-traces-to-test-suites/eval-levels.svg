<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Three levels of agent evaluation with their metrics" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Drie niveaus van agent-evaluatie met hun metrics</title>
  <defs>
    <marker id="arrLvl" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#334155" />
    </marker>
    <filter id="shadowLvl" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Drie niveaus van agent-evaluatie</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">Outcome laat zien WAT er misging · trajectory WAAR · component WAAROM</text>

  <!-- Level 1: end-to-end -->
  <rect x="30" y="80" width="1120" height="150" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="106" font-size="14" font-weight="700" fill="#166534" x="55">Niveau 1 · Outcome (black box)</text>
  <text y="124" font-size="10" fill="#166534" x="55">Vraag: is de task geslaagd?</text>

  <rect x="55" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="225">Task completion</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="225">Door LLM beoordeelde goal alignment, zonder referentie</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="225">online bruikbaar — geen golden output nodig</text>

  <rect x="415" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="585">Outcome- / state-grading</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="585">vergelijk de uiteindelijke environment state met de goal state</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="585">robuust tegen creatieve alternatieve paden (τ-bench)</text>

  <rect x="775" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="945">Reliability: pass^k</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="945">alle k van de k pogingen slagen</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="945">90% succes per run → 43% bij k=8 (0.9^8)</text>

  <line x1="590" y1="234" x2="590" y2="268" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="256" font-size="10" fill="#64748b" font-style="italic" x="700">task mislukt — maar waar?</text>

  <!-- Level 2: trajectory -->
  <rect x="30" y="275" width="1120" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="301" font-size="14" font-weight="700" fill="#5b21b6" x="55">Niveau 2 · Trajectory (glass box)</text>
  <text y="319" font-size="10" fill="#5b21b6" x="55">Vraag: was het pad correct en efficiënt?</text>

  <rect x="55" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="182">Tool-correctness</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="182">deterministisch, geen judge nodig</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="182">exacte match / match in volgorde / match in willekeurige volgorde</text>

  <rect x="330" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="457">Argument-correctness</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="457">juiste tool, verkeerde parameters</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="457">% correct ingevulde key-value pairs</text>

  <rect x="605" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="732">Efficiency &amp; loops</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="732">redundante calls · path convergence</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="732">herhaalde identieke calls = dead end</text>

  <rect x="880" y="335" width="235" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="997">Plan quality / adherence</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="997">goed plan, uitvoering wijkt af</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="997">multi-turn fidelity over meerdere turns</text>

  <line x1="590" y1="429" x2="590" y2="463" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="451" font-size="10" fill="#64748b" font-style="italic" x="700">pad brak bij stap 3 — maar waarom?</text>

  <!-- Level 3: component -->
  <rect x="30" y="470" width="1120" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="496" font-size="14" font-weight="700" fill="#9a3412" x="55">Niveau 3 · Component (white box)</text>
  <text y="514" font-size="10" fill="#9a3412" x="55">Vraag: welke beslissing, tool, retriever of sub-agent brak?</text>

  <rect x="55" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="225">Metrics per span</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="225">koppel scores aan individuele tool- / retrieval-spans</text>

  <rect x="415" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="585">Interpretatie van tool-output</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="585">geldige response, verkeerde interpretatie — corrumpeert downstream</text>

  <rect x="775" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="945">Failure attribution</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="945">zichtbare failure is meestal downstream van de echte bug</text>
</svg>
