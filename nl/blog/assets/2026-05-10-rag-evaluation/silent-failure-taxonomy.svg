<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Silent failure taxonomy with the metric that catches each mode" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Taxonomie van stille fouten met de metric die elke modus detecteert</title>
  <defs>
    <filter id="shadowSF" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="720" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">Taxonomie van stille fouten</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#0f172a" x="590">Elke foutmodus wordt gekoppeld aan de metric die deze detecteert. Zonder de metric blijft de bug onzichtbaar.</text>

  <!-- Root -->
  <rect x="475" y="78" width="230" height="44" rx="22" fill="#dc2626" filter="url(#shadowSF)" />
  <text y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" x="590">Stille fout (RAG)</text>

  <!-- Trunk: 4 main branches -->
  <line x1="540" y1="122" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="570" y1="122" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="610" y1="122" x2="730" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="640" y1="122" x2="1010" y2="170" stroke="#94a3b8" stroke-width="1.4" />

  <!-- ====== Branch A: Ingestion ====== -->
  <rect x="40" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="170">Ingestion-fouten</text>

  <!-- A1: Parse loss -->
  <rect x="40" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Parseverlies</text>
  <text y="261" font-size="11" fill="#0f172a" x="50">tabellen vallen uiteen · voetnoten</text>
  <text y="275" font-size="11" fill="#0f172a" x="50">vallen weg · OCR verwisselt cijfers</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="50">gedetecteerd door: CER/WER, TEDS</text>

  <!-- A2: Chunk break -->
  <rect x="40" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Chunkbreuk</text>
  <text y="336" font-size="11" fill="#0f172a" x="50">answer span opgesplitst over twee</text>
  <text y="350" font-size="11" fill="#0f172a" x="50">chunks; geen van beide bevat volledig bewijs</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="50">gedetecteerd door: answer-span containment</text>

  <!-- A3: Dedup miss -->
  <rect x="40" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Dedup-fout</text>
  <text y="411" font-size="11" fill="#0f172a" x="50">false merge corrumpeert het antwoord;</text>
  <text y="425" font-size="11" fill="#0f172a" x="50">false keep begraaft het juiste document</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="50">gedetecteerd door: dup precision/recall</text>

  <!-- A4: Normalization -->
  <rect x="40" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Normalisatiedrift</text>
  <text y="486" font-size="11" fill="#0f172a" x="50">Mismatch tussen NFC en NFKC verstoort</text>
  <text y="500" font-size="11" fill="#0f172a" x="50">exact-match alias resolution</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="50">gedetecteerd door: NFC/NFKC-pariteit, alias coverage</text>

  <!-- ====== Branch B: Embedding/Index ====== -->
  <rect x="320" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="450">Embedding &amp; index</text>

  <!-- B1: Embedding miss -->
  <rect x="320" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Embedding miss</text>
  <text y="261" font-size="11" fill="#0f172a" x="330">domeinterm valt buiten de</text>
  <text y="275" font-size="11" fill="#0f172a" x="330">training distribution van het model</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="330">gedetecteerd door: domain Recall@k vs. baseline</text>

  <!-- B2: ANN drop -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Daling door ANN-benadering</text>
  <text y="336" font-size="11" fill="#0f172a" x="330">HNSW efSearch te laag; gold</text>
  <text y="350" font-size="11" fill="#0f172a" x="330">vector bestaat, maar wordt niet bereikt</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="330">gedetecteerd door: ANN recall vs. flat</text>

  <!-- B3: Embedding drift -->
  <rect x="320" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Embedding-drift</text>
  <text y="411" font-size="11" fill="#0f172a" x="330">versie-upgrade van het providermodel;</text>
  <text y="425" font-size="11" fill="#0f172a" x="330">oude vectors zijn niet langer aligned</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="330">gedetecteerd door: probe-set NN-stabiliteit</text>

  <!-- B4: Stale index -->
  <rect x="320" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Verouderde index</text>
  <text y="486" font-size="11" fill="#0f172a" x="330">freshness-lag; queries draaien</text>
  <text y="500" font-size="11" fill="#0f172a" x="330">tegen de waarheid van vorige week</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="330">gedetecteerd door: freshness-lag p99, %-stale</text>

  <!-- ====== Branch C: Online retrieval (HOT — silent killers) ====== -->
  <rect x="600" y="170" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="730">Online retrieval</text>

  <!-- C1: Filter exclude (highlighted) -->
  <rect x="600" y="225" width="260" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#991b1b" x="610">Onterechte filter-exclusie</text>
  <text y="261" font-size="11" fill="#0f172a" x="610">hard predicate sluit het gold-document uit;</text>
  <text y="275" font-size="11" fill="#0f172a" x="610">Recall@k daalt, maar de oorzaak is niet aan te wijzen</text>
  <text y="285" font-size="11" font-style="italic" fill="#991b1b" x="610">gedetecteerd door: filter false-exclusion rate</text>

  <!-- C2: Rerank miss -->
  <rect x="600" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#991b1b" x="610">Rerank miss</text>
  <text y="336" font-size="11" fill="#0f172a" x="610">cross-encoder plaatst het juiste</text>
  <text y="350" font-size="11" fill="#0f172a" x="610">document achter plausibele distractors</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="610">gedetecteerd door: ΔnDCG, distractor robustness</text>

  <!-- C3: Lost in middle -->
  <rect x="600" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#991b1b" x="610">Lost in the middle</text>
  <text y="411" font-size="11" fill="#0f172a" x="610">gold chunk staat in de context, maar op</text>
  <text y="425" font-size="11" fill="#0f172a" x="610">positie 7/10; het model negeert deze</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="610">gedetecteerd door: position-stratified eval</text>

  <!-- C4: Bad rewrite -->
  <rect x="600" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#991b1b" x="610">Regressie in query rewrite</text>
  <text y="486" font-size="11" fill="#0f172a" x="610">HyDE hallucineert een entity die</text>
  <text y="500" font-size="11" fill="#0f172a" x="610">retrieval de verkeerde kant op stuurt</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="610">gedetecteerd door: rewrite gain/loss A/B</text>

  <!-- ====== Branch D: Generation/Citation ====== -->
  <rect x="880" y="170" width="260" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="1010">Generation</text>

  <!-- D1: Hallucination -->
  <rect x="880" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#5b21b6" x="890">Hallucinatie</text>
  <text y="261" font-size="11" fill="#0f172a" x="890">niet-onderbouwde claim, vaak een</text>
  <text y="275" font-size="11" fill="#0f172a" x="890">entity die niet in de context staat</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="890">gedetecteerd door: faithfulness, HHEM, FActScore</text>

  <!-- D2: No citation -->
  <rect x="880" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#5b21b6" x="890">Citation theater</text>
  <text y="336" font-size="11" fill="#0f172a" x="890">geciteerde span ondersteunt niet echt</text>
  <text y="350" font-size="11" fill="#0f172a" x="890">de claim die ernaast staat</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="890">gedetecteerd door: citation P/R (TREC)</text>

  <!-- D3: Wrong refusal -->
  <rect x="880" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#5b21b6" x="890">Verkeerde abstention</text>
  <text y="411" font-size="11" fill="#0f172a" x="890">"Ik weet het niet" terwijl het antwoord</text>
  <text y="425" font-size="11" fill="#0f172a" x="890">in de context staat (of omgekeerd)</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="890">gedetecteerd door: NoMIRACL, abstention accuracy</text>

  <!-- D4: Schema break -->
  <rect x="880" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#5b21b6" x="890">Schema/vocab-breuk</text>
  <text y="486" font-size="11" fill="#0f172a" x="890">syntactisch geldige output kiest</text>
  <text y="500" font-size="11" fill="#0f172a" x="890">een verkeerde maar geldige ontology-ID</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="890">gedetecteerd door: vocabulary conformance</text>

  <!-- Footer band -->
  <rect x="40" y="555" width="1100" height="68" rx="8" fill="#f0fdf4" stroke="#ea580c" stroke-width="1.2" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="590">Leeswijzer</text>
  <text y="598" text-anchor="middle" font-size="11" fill="#9a3412" x="590">Elke fout blijft stil zonder de bijbehorende metric. Alleen standaard "answer correctness" laat zien dát er iets defect is — niet waar.</text>
  <text y="614" text-anchor="middle" font-size="11" fill="#9a3412" x="590">De rode tak omvat checks voor filter, rerank, contextpositie en rewrite. Instrumenteer de stages die evidence kunnen verwijderen.</text>

  <!-- Visual cue: the 'red' propagation -->
  <rect x="40" y="640" width="1100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="662" font-size="11" font-weight="600" fill="#0f172a" x="60">De propagatieregel:</text>
  <text y="682" font-size="11" fill="#0f172a" x="60">Een fout links vormt een recall-plafond voor alles rechts. Slechte parsing begrenst chunking. Slechte chunking begrenst retrieval.</text>
  <text y="696" font-size="11" fill="#0f172a" x="60">Slechte retrieval begrenst reranking. Slechte reranking begrenst generation. Faithfulness meet alleen de laatste schakel — de gebroken keten blijft onzichtbaar.</text>
</svg>
