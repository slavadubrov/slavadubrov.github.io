<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 562" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="evallayers-title evallayers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="evallayers-title">Evidenceverlies is verdeeld over drie pipeline-lagen, die elk offline en online worden gecontroleerd.</title><desc id="evallayers-desc">Ingestion, query-time retrieval en answer-and-production zijn de drie lagen waarin een RAG-systeem evidence kan verliezen. De query-time retrieval-laag staat centraal, omdat een hard filter het juiste document kan verwijderen voordat ranking begint. Elke laag draait zowel offline, tegen een vaste golden set, als online, tegen gesamplede live traffic.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="evallayers-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="evallayers-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="562" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Lokaliseer de eerste plek waar evidence verdwijnt</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Een downstream-score kan upstream-verlies niet verklaren; elke laag draait offline en online.</text>
