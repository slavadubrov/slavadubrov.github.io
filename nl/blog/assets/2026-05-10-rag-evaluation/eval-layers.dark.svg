<text x="32" y="486" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Voeg de lagen samen tot één score en een normalization-bug kan verdwijnen</text>
