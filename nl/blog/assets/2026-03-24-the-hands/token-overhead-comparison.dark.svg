<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tod-title tod-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tod-title">Tooldefinities kunnen de context verbruiken voordat het werk begint</title>
  <desc id="tod-desc">Gerapporteerde voorbeelden noemen 143.000 tokens voor één grote MCP-setup en 55.000 voor ongeveer 40 MCP-tools. Tien JSON tool schemas worden geschat op 5.500 tot 14.000 tokens. Skill-startupmetadata omvat ongeveer 100 tokens. Code execution gebruikt een klein aantal meta-tools, maar er wordt geen vergelijkbaar aantal genoemd.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .grid { stroke: #2B3B33; stroke-width: 1; }
  </style>
  <rect width="960" height="512" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">DEFINITIE-OVERHEAD VOOR DE TAAK</text>
  <text class="note" x="48" y="68">Gerapporteerde voorbeelden, geen gecontroleerde benchmark · horizontale schaal in duizenden tokens</text>
  <path class="grid" d="M300 88V424M493 88V424M687 88V424M880 88V424" />
  <text class="kind" x="300" y="84" text-anchor="middle">0</text>
  <text class="kind" x="493" y="84" text-anchor="middle">50K</text>
  <text class="kind" x="687" y="84" text-anchor="middle">100K</text>
  <text class="kind" x="880" y="84" text-anchor="middle">150K</text>
  <text class="kind" x="48" y="124" fill="#FF6FB6">FOCUS · MCP</text>
  <text class="name" x="48" y="148" fill="#FF6FB6">Grote setup</text>
  <rect x="300" y="116" width="553" height="32" rx="6" fill="#FF6FB6" />
  <text class="name" x="840" y="139" text-anchor="end" fill="#0C1210">143K</text>
  <text class="note" x="300" y="170">72% van een context window van 200K in de gerapporteerde setup</text>
  <text class="kind" x="48" y="212">MCP</text>
  <text class="name" x="48" y="236">Ongeveer 40 tools</text>
  <rect x="300" y="204" width="213" height="32" rx="6" fill="#EDF5F0" />
  <text class="name" x="525" y="227">55K</text>
  <text class="note" x="300" y="258">Schemas geladen voordat de gebruiker een vraag stelt</text>
  <text class="kind" x="48" y="300">JSON SCHEMAS</text>
  <text class="name" x="48" y="324">Tien tools</text>
  <path d="M321 308H354" stroke="#EDF5F0" stroke-width="8" />
  <circle cx="321" cy="308" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <circle cx="354" cy="308" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="372" y="314">5,5–14K</text>
  <text class="note" x="300" y="346">Bereik afgeleid van 550–1.400 tokens per definitie</text>
  <text class="kind" x="48" y="388">PROGRESSIVE LOAD</text>
  <text class="name" x="48" y="412">Skill-metadata</text>
  <circle cx="301" cy="396" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="320" y="402">~100 tokens</text>
  <text class="note" x="300" y="434">Volledige instructies worden alleen geladen wanneer de skill actief is</text>
  <path d="M48 456H912" stroke="#2B3B33" stroke-width="1" />
  <text class="source" x="48" y="478">Bronnen: Apideck voor de observaties van 55K en 143K; schatting uit een artikel voor tien JSON schemas; richtlijnen voor progressive disclosure van Skills.</text>
  <text class="source" x="48" y="496">Code execution vervangt veel schemas door enkele meta-tools, maar de definitie-overhead hangt af van de harness en is niet geplot.</text>
</svg>
