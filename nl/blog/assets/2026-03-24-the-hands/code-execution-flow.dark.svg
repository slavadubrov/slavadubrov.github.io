<text x="32" y="496" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Vercels redesign verplaatste een agent met 17 tools naar twee meta-tools en verlaagde het gemiddelde aantal tokens met 37%.</text>
<text x="32" y="518" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Anthropic rapporteerde een tokenreductie van 98,7% bij één Drive-to-Salesforce-workflow.</text>
