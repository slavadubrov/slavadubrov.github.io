<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tm-title tm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tm-title">Vijf interfaces voor tool use door agents</title>
  <desc id="tm-desc">Een vergelijking van JSON tool calling, MCP, Skills, command-line tools en code execution op basis van wat elke interface transporteert, waar deze past en wat de typische context overhead is. Code execution is uitgelicht voor multi-step orchestration.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="44">INTERFACEKAART — KIES OP BASIS VAN DE VORM VAN HET WERK</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">ATOMAIRE CALLS</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150"><tspan x="68">Getypeerde request/response · 550–1.400 schema tokens per</tspan><tspan x="68" dy="1.2em">tool</tspan></text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">GEDEELDE INTEGRATIE</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150"><tspan x="520">Discovery + transport · laad alleen de tools die de taak nodig</tspan><tspan x="520" dy="1.2em">heeft</tspan></text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">PROCEDURE</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Instructies on demand · ongeveer 100 startup metadata tokens</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">LOKALE OPERATIE</text>
  <text class="name" x="520" y="262">CLI en shell</text>
  <text class="note" x="520" y="286">Composabele commands · lage schema overhead</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#C50E72">FOCUS · MULTI-STEP WERK</text>
  <text class="name" x="294" y="398" fill="#C50E72">Code execution</text>
  <text class="note" x="294" y="422"><tspan x="294">Loops en conditionals · de eindsamenvatting keert terug naar</tspan><tspan x="294" dy="1.2em">de context</tspan></text>
  <path d="M48 472H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="48" y="490">Het protocol bepaalt niet het beleid: authentication, authorization, logging en sandboxing blijven de verantwoordelijkheid van de harness.</text>
</svg>
