<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">How to choose a model quantization recipe</title>
  <desc id="desc">A decision map whose root question routes VRAM-bound workloads to W4A16, compute-bound workloads to W8A8, long-context workloads to KV-cache quantization, local hardware to GGUF, and adapter training to bitsandbytes NF4.</desc>
  <defs>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#F2F2F5"/>
    </marker>
    <style>
      .bg { fill: #F7F7F4; }
      .card { fill: #ffffff; stroke: #17211B; stroke-width: 1.4; filter: url(#shadow); }
      .start { fill: #FFFFFF; stroke: #17211B; }
      .memory { fill: #FFFFFF; stroke: #59645E; }
      .compute { fill: #FFFFFF; stroke: #59645E; }
      .cache { fill: #FFFFFF; stroke: #17211B; }
      .edge { fill: #FFFFFF; stroke: #17211B; }
      .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
      .title { font-style: normal; font-weight: 700; font-size: 24px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
      .label { font-style: normal; font-weight: 700; font-size: 16px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
      .text { font-style: normal; font-weight: 400; font-size: 14px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
      .small { font-style: normal; font-weight: 400; font-size: 12px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #FFFFFF; }
      .mono { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #FFFFFF; }
      .branch { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.7px; fill: #59645E; }
      .arrow { stroke: #17211B; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect class="bg" width="1120" height="720"/>
  <text class="title" y="58" x="52">A practical recipe map</text>
  <text class="text" y="88" x="52">Choose for the workload first. Bit-width by itself does not tell you whether the runtime will get faster.</text>

  <path class="start" d="M560 105 L700 165 L560 225 L420 165 Z"/>
  <text class="kind-tag" y="143" x="560" text-anchor="middle">DECISION</text>
  <text class="label" y="168" x="560" text-anchor="middle">What problem are you solving?</text>

  <path class="arrow" d="M450 195 C415 215 392 230 370 260"/>
  <path class="arrow" d="M560 225 L560 330"/>
  <path class="arrow" d="M670 195 C705 215 728 230 750 260"/>
  <path class="arrow" d="M515 218 L390 280 L390 450 L300 500"/>
  <path class="arrow" d="M605 218 L730 280 L730 450 L900 500"/>
  <rect class="bg" x="294" y="210" width="88" height="18" rx="3"/>
  <text class="branch" x="302" y="223">VRAM BOUND</text>
  <rect class="bg" x="568" y="260" width="110" height="18" rx="3"/>
  <text class="branch" x="576" y="273">COMPUTE BOUND</text>
  <rect class="bg" x="724" y="210" width="130" height="18" rx="3"/>
  <text class="branch" x="732" y="223">LONG CONTEXT</text>
  <rect class="bg" x="262" y="456" width="114" height="18" rx="3"/>
  <text class="branch" x="270" y="469">LOCAL HARDWARE</text>
  <rect class="bg" x="744" y="456" width="126" height="18" rx="3"/>
  <text class="branch" x="752" y="469">ADAPTER TRAINING</text>

  <rect class="card memory" x="70" y="250" width="300" height="190" rx="8"/>
  <text class="kind-tag" y="272" x="96">PROCESS</text>
  <text class="label" y="296" x="96">Fit a bigger LLM</text>
  <text class="text" y="318" x="96">Use GPTQ or AWQ W4A16.</text>
  <text class="text" y="342" x="96">Good for low-QPS decode,</text>
  <text class="text" y="366" x="96">single-stream chat, and</text>
  <text class="text" y="390" x="96">tight GPU memory.</text>
  <text class="mono" y="426" x="96">llm-compressor: W4A16</text>

  <rect class="card compute" x="410" y="330" width="300" height="190" rx="8"/>
  <text class="kind-tag" y="352" x="436">PROCESS</text>
  <text class="label" y="376" x="436">Increase throughput</text>
  <text class="text" y="398" x="436">Use W8A8. Prefer FP8 on</text>
  <text class="text" y="422" x="436">Ada, Hopper, and newer.</text>
  <text class="text" y="446" x="436">Use INT8 when hardware</text>
  <text class="text" y="470" x="436">or kernels fit that path.</text>
  <text class="mono" y="506" x="436">FP8 dynamic or SmoothQuant</text>

  <rect class="card focus" x="750" y="250" width="300" height="190" rx="8"/>
  <text class="kind-tag" y="272" x="776">FOCUS</text>
  <text class="label" y="296" x="776">Serve long context</text>
  <text class="text" y="318" x="776">Use KV-cache quantization.</text>
  <text class="text" y="342" x="776">This helps when context</text>
  <text class="text" y="366" x="776">length or concurrency</text>
  <text class="text" y="390" x="776">dominates VRAM.</text>
  <text class="mono" y="426" x="776">vLLM: --kv-cache-dtype fp8</text>

  <rect class="card edge" x="130" y="500" width="300" height="170" rx="8"/>
  <text class="kind-tag" y="522" x="156">PROCESS</text>
  <text class="label" y="546" x="156">Run local or edge</text>
  <text class="text" y="568" x="156">Use GGUF for llama.cpp,</text>
  <text class="text" y="592" x="156">Ollama, MLX, CPU, or</text>
  <text class="text" y="616" x="156">Apple Silicon targets.</text>
  <text class="mono" y="646" x="156">Q4_K_M or Q5_K_M</text>

  <rect class="card start" x="750" y="500" width="300" height="190" rx="8"/>
  <text class="kind-tag" y="522" x="776">PROCESS</text>
  <text class="label" y="546" x="776">Fine-tune cheaply</text>
  <text class="text" y="568" x="776">Use bitsandbytes NF4 for</text>
  <text class="text" y="592" x="776">QLoRA-style experiments.</text>
  <text class="text" y="616" x="776">Do not treat it as a clean</text>
  <text class="text" y="640" x="776">vLLM artifact by default.</text>
  <text class="mono" y="670" x="776">bnb NF4 + PEFT</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
  </style>
</svg>
