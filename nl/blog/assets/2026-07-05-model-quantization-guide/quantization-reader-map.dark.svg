<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Quantization-leeskaart</title>
  <desc id="desc">Besliskaart die serving-bottlenecks koppelt aan quantization-keuzes en validatiechecks.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141D19" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="520" fill="#0C1210" />
  <text y="42" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#EDF5F0" x="480">Begin bij de bottleneck</text>
  <text y="72" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#EDF5F0" x="480">Dezelfde bit-width kan goed of fout zijn afhankelijk van hardware, runtime, cache en evals.</text>

  <rect x="365" y="105" width="230" height="74" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text y="134" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#EDF5F0" x="480">Wat beperkt serving?</text>
  <text y="160" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#EDF5F0" x="480"><tspan x="480">memory, compute, cache, runtime of</tspan><tspan x="480" dy="1.2em">image pipeline</tspan></text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="45" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="127">Weight memory</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="127">W4A16 GPTQ/AWQ</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="127">decode, model laten passen</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="127">eval-kwaliteitsverschil</text>

    <rect x="230" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="312">Throughput</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="312">FP8 W8A8</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="312">Ada/Hopper-kernels</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="312">TTFT/ITL benchmarken</text>

    <rect x="415" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="497">Lange context</text>
    <text y="292" text-anchor="middle" font-size="13" fill="#EDF5F0" x="497">KV-cache</text>
    <text y="310" text-anchor="middle" font-size="13" fill="#EDF5F0" x="497">quantization</text>
    <text y="332" text-anchor="middle" font-size="12" fill="#EDF5F0" x="497">cache bepaalt VRAM-gebruik</text>
    <text y="350" text-anchor="middle" font-size="12" fill="#EDF5F0" x="497">retrieval testen</text>

    <rect x="600" y="240" width="165" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="682">Lokale runtime</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="682">GGUF / MLX</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="682">CPU, Apple, edge</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="682">lokale RAM meten</text>

    <rect x="785" y="240" width="130" height="118" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" x="850">Image path</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#EDF5F0" x="850">SVDQuant</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#EDF5F0" x="850">VAE-gevoelig</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#EDF5F0" x="850">visual evals</text>
  </g>

  <g stroke="#A8B8AF" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 480 179 C 480 205 127 208 127 235" />
    <path d="M 480 179 C 480 207 312 211 312 235" />
    <path d="M 480 179 C 480 210 497 211 497 235" />
    <path d="M 480 179 C 480 207 682 211 682 235" />
    <path d="M 480 179 C 480 205 850 208 850 235" />
  </g>

  <rect x="190" y="405" width="580" height="62" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text y="430" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#EDF5F0" x="480">Voer daarna deploy-checks uit</text>
  <text y="455" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#EDF5F0" x="480">perplexity + task-metrics + generation-samples + long-context-probes + serving-benchmarks</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
