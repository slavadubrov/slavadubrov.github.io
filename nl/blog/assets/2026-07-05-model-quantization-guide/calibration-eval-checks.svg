  <text x="160" y="334" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ACCEPTEER PAS NADAT BEIDE CONTROLEGROEPEN ZIJN GESLAAGD</text>
