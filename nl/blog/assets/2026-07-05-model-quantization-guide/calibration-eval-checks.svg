  <text x="292" y="214" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Calibreer ranges</text>
  <text x="292" y="236" fill="#59645e" font-size="13">Ger redacteerd · gematchte lengtes</text>

