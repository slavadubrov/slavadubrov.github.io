  <text x="184" y="414" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Quality · taken · long context</text>
  <text x="512" y="414" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Throughput · TTFT · ITL · geheugen</text>
