<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="protocol-title protocol-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="protocol-title">Where each agent interoperability protocol belongs</title>
  <desc id="protocol-desc">A directory returns an OASF agent record to a caller agent. The caller delegates a task to a merchant agent over A2A. The merchant agent calls catalog and cart tools through MCP and sends checkout data over UCP. A separate AP2 signed mandate binds the checkout to the user's authorized limits.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211b; }
    .note { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645e; }
    .edge-label { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #59645e; }
    .box { stroke: #17211b; stroke-width: 1.5; }
    .external { stroke: #59645e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #59645e; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="488" rx="14" fill="#f7f7f4"/>

  <text class="kind" x="48" y="44">ONE WORKFLOW · FOUR PROTOCOL BOUNDARIES</text>

  <rect class="box" x="48" y="80" width="184" height="96" rx="10" fill="#f2f2f5"/>
  <text class="kind" x="68" y="114">STORE</text>
  <text class="name" x="68" y="142">Agent directory</text>

  <rect class="box" x="272" y="80" width="184" height="96" rx="10" fill="#ffffff"/>
  <text class="kind" x="292" y="114">PROCESS</text>
  <text class="name" x="292" y="142">Caller agent</text>

  <rect class="external" x="496" y="80" width="184" height="96" rx="10" fill="#ffffff"/>
  <text class="kind" x="516" y="114">EXTERNAL</text>
  <text class="name" x="516" y="142">Merchant agent</text>

  <rect x="720" y="80" width="184" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5"/>
  <text class="kind" x="740" y="114" fill="#c50e72">FOCUS · COMMERCE</text>
  <text class="name" x="740" y="142" fill="#c50e72">Authorized checkout</text>

  <path class="edge" d="M232 128h32" marker-end="url(#protocol-arrow)"/>
  <rect x="234" y="104" width="36" height="18" rx="6" fill="#f7f7f4"/>
  <text class="edge-label" x="252" y="117" text-anchor="middle">OASF</text>

  <path class="edge" d="M456 128h32" marker-end="url(#protocol-arrow)"/>
  <rect x="458" y="104" width="36" height="18" rx="6" fill="#f7f7f4"/>
  <text class="edge-label" x="476" y="117" text-anchor="middle">A2A</text>

  <path class="edge" d="M680 128h32" marker-end="url(#protocol-arrow)"/>
  <rect x="682" y="104" width="36" height="18" rx="6" fill="#f7f7f4"/>
  <text class="edge-label" x="700" y="117" text-anchor="middle">UCP</text>

  <rect class="external" x="496" y="256" width="184" height="96" rx="10" fill="#ffffff"/>
  <text class="kind" x="516" y="290">EXTERNAL</text>
  <text class="name" x="516" y="318">Catalog + cart tools</text>

  <path class="edge" d="M588 176v72" marker-end="url(#protocol-arrow)"/>
  <rect x="568" y="202" width="40" height="20" rx="6" fill="#f7f7f4"/>
  <text class="edge-label" x="588" y="216" text-anchor="middle">MCP</text>

  <path class="edge" d="M364 176v216h448V184" marker-end="url(#protocol-arrow)"/>
  <rect x="637" y="380" width="142" height="24" rx="6" fill="#f7f7f4"/>
  <text class="edge-label" x="708" y="396" text-anchor="middle">AP2 · SIGNED INTENT</text>

  <text class="note" x="48" y="452">OASF finds the callee · A2A crosses agent ownership · MCP stays behind an agent · AP2/UCP binds spending authority</text>

  <defs>
    <marker id="protocol-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e"/>
    </marker>
  </defs>
</svg>
