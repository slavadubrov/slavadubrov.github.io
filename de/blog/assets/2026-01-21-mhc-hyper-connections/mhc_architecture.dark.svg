<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Vollständiger mHC-Block</title>
  <desc id="desc">Nichtnegative Read- und Write-Maps umgeben die Layer-Funktion, während eine Sinkhorn-projizierte Residual-Map die parallelen Streams mischt.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <marker id="arrowSlate" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#141D19" />
    </marker>
    <marker id="arrowEmerald" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>

    <!-- Flow Filters -->



  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="680" fill="#0C1210" />

  <!-- Background Layer -->
  <rect width="1000" height="680" fill="#0C1210" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#EDF5F0">mHC: Manifold-Constrained Hyper-Connections</text>
  <text x="40" y="80" font-size="16" fill="#EDF5F0">Drei lernbare Mappings mit expliziten Stabilitätsbedingungen.</text>

  <!-- Left Side: Architecture Diagram -->
  <g transform="translate(50, 110)">

    <!-- Grouped Background Block -->
    <rect x="0" y="50" width="460" height="460" rx="16" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="8 4" />
    <text x="230" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0" letter-spacing="1">mHC LAYER-BLOCK</text>

    <!-- Static Paths -->
    <g fill="none" stroke-width="2.5" opacity="0.4">
      <!-- Input to Split -->
      <path d="M 230 40 L 230 115" stroke="#EDF5F0" />

      <!-- Split to Residual (Left) -->
      <path d="M 230 115 Q 230 125 215 125 L 125 125 Q 110 125 110 135 L 110 210" stroke="#A8B8AF" marker-end="url(#arrowEmerald)" />

      <!-- Split to Aggregation (Right) -->
      <path d="M 230 115 Q 230 125 245 125 L 335 125 Q 350 125 350 135" stroke="#EDF5F0" marker-end="url(#arrowSlate)" />

      <!-- Aggregation -> Transformer -->
      <path d="M 350 200 L 350 230" stroke="#EDF5F0" marker-end="url(#arrowSlate)" />

      <!-- Transformer -> Expansion -->
      <path d="M 350 290 L 350 315" stroke="#EDF5F0" marker-end="url(#arrowSlate)" />

      <!-- Expansion -> Meet -->
      <path d="M 350 380 L 350 400 Q 350 410 335 410 L 245 410 Q 230 410 230 420 L 230 426" stroke="#EDF5F0" />

      <!-- Residual -> Meet -->
      <path d="M 110 310 L 110 400 Q 110 410 125 410 L 215 410 Q 230 410 230 420 L 230 426" stroke="#A8B8AF" />

      <!-- Meet -> Output Streams -->
      <path d="M 230 454 L 230 520" stroke="#EDF5F0" marker-end="url(#arrowSlate)" />
    </g>

    <!-- Animated Flow Particles -->
    <g>
      <!-- Main Path Particle -->

      <!-- Residual Path Particle -->

    </g>

    <!-- Blocks -->
    <!-- Input Streams Box -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="160" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
      <text x="80" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0" style="font-size: 14.5px;">Input-Streams H_(l−1)</text>
    </g>

    <!-- Residual Box (H^{res}) -->
    <g transform="translate(25, 210)">
      <rect x="0" y="0" width="170" height="100" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2.5" />
      <text x="85" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#EDF5F0">H_res</text>
      <text x="85" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#EDF5F0">Residual-Mixing</text>

      <!-- Sinkhorn badge inside H_res -->
      <rect x="20" y="60" width="130" height="28" rx="6" fill="#1B2621" class="visual-focus" />
      <text x="85" y="78" text-anchor="middle" fill="#141D19" font-size="12" font-weight="700">Sinkhorn-Knopp</text>
    </g>

    <!-- Aggregation Box -->
    <g transform="translate(270, 135)">
      <rect x="0" y="0" width="160" height="65" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
      <text x="80" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">H_pre (Read)</text>
      <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Komprimiert n → 1 Stream</text>
      <text x="80" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">σ(·) → nichtnegativ</text>
    </g>

    <!-- Transformer Box -->
    <g transform="translate(270, 230)">
      <rect x="0" y="0" width="160" height="60" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2.5" />
      <text x="80" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">Transformer-FFN</text>
      <text x="80" y="48" text-anchor="middle" font-size="13" font-weight="500" fill="#EDF5F0">oder Attention T(·)</text>
    </g>

    <!-- Expansion Box -->
    <g transform="translate(270, 315)">
      <rect x="0" y="0" width="160" height="65" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
      <text x="80" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">H_post (Write)</text>
      <text x="80" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Broadcast 1 → n Streams</text>
      <text x="80" y="56" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">2σ(·) → nichtnegativ</text>
    </g>

    <!-- Addition Node -->
    <circle cx="230" cy="440" r="14" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="230" y="446" text-anchor="middle" font-size="18" font-weight="800" fill="#EDF5F0">+</text>

    <!-- Output Streams -->
    <g transform="translate(150, 520)">
      <rect x="0" y="0" width="160" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
      <text x="80" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Output-Streams H_l</text>
    </g>
  </g>

  <!-- Right Side: Explanations -->
  <g transform="translate(540, 110)">

    <!-- Doubly Stochastic Constraint Explainer -->
    <rect x="0" y="0" width="420" height="225" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="210" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#EDF5F0">Doppelt-stochastische Bedingung</text>
    <line x1="20" y1="45" x2="400" y2="45" stroke="#2B3B33" stroke-width="2" />

    <!-- Matrix representation -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="100" height="100" rx="4" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
      <line x1="33" y1="0" x2="33" y2="100" stroke="#A8B8AF" stroke-width="1.5" />
      <line x1="66" y1="0" x2="66" y2="100" stroke="#A8B8AF" stroke-width="1.5" />
      <line x1="0" y1="33" x2="100" y2="33" stroke="#A8B8AF" stroke-width="1.5" />
      <line x1="0" y1="66" x2="100" y2="66" stroke="#A8B8AF" stroke-width="1.5" />

      <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">
        <text x="16.5" y="22">.2</text> <text x="50" y="22">.5</text> <text x="83.5" y="22">.3</text>
        <text x="16.5" y="55">.4</text> <text x="50" y="55">.1</text> <text x="83.5" y="55">.5</text>
        <text x="16.5" y="88">.4</text> <text x="50" y="88">.4</text> <text x="83.5" y="88">.2</text>
      </g>

      <g font-size="13" font-weight="800" fill="#A8B8AF">
        <text x="115" y="22">=1</text> <text x="115" y="55">=1</text> <text x="115" y="88">=1</text>
        <text x="16.5" y="120" text-anchor="middle">=1</text> <text x="50" y="120" text-anchor="middle">=1</text> <text x="83.5" y="120" text-anchor="middle">=1</text>
      </g>
    </g>

    <!-- Checklist -->
    <g transform="translate(180, 75)">
      <!-- Checkmarks -->
      <g fill="#A8B8AF">
        <circle cx="0" cy="-4" r="8" />
        <path d="M -3 -4 L -1 -1 L 4 -6" stroke="#141D19" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="15" y="0" font-size="14" font-weight="600" fill="#EDF5F0">Alle Einträge ≥ 0</text>

      <g fill="#A8B8AF" transform="translate(0, 28)">
        <circle cx="0" cy="-4" r="8" />
        <path d="M -3 -4 L -1 -1 L 4 -6" stroke="#141D19" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="15" y="28" font-size="14" font-weight="600" fill="#EDF5F0">Jede Zeile summiert sich zu 1</text>

      <g fill="#A8B8AF" transform="translate(0, 56)">
        <circle cx="0" cy="-4" r="8" />
        <path d="M -3 -4 L -1 -1 L 4 -6" stroke="#141D19" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <text x="15" y="56" font-size="14" font-weight="600" fill="#EDF5F0">Jede Spalte summiert sich zu 1</text>

      <text x="-15" y="96" font-size="15" font-weight="800" fill="#EDF5F0">→ ||H<tspan baseline-shift="super" font-size="11">res</tspan>|| ≤ 1</text>
      <text x="80" y="96" font-size="13" font-weight="500" fill="#EDF5F0">(Spektralnorm)</text>

      <text x="-15" y="122" font-size="15" font-weight="800" fill="#EDF5F0" style="font-size: 13.5px;">→ Mittelwert erhalten; Gain begrenzt</text>
    </g>

    <!-- Formula Summary Box -->
    <rect x="0" y="240" width="420" height="95" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="210" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#EDF5F0">Vollständige mHC-Layer-Formel</text>

    <text x="210" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">H_l = H_res H_(l−1) + H_postᵀ T(H_pre H_(l−1))</text>
    <text x="210" y="318" text-anchor="middle" font-size="12" fill="#EDF5F0">H_res ist annähernd doppelt-stochastisch</text>

    <!-- Side-by-side Results Cards -->
    <g transform="translate(0, 350)">
      <!-- Stability Card -->
      <rect x="0" y="0" width="200" height="85" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
      <text x="100" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#EDF5F0">Stabilität erreicht</text>
      <text x="100" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Max. Signalverstärkung</text>
      <text x="100" y="60" text-anchor="middle" font-size="14" font-weight="800" fill="#EDF5F0">Paper: Peak ~1.6</text>
      <text x="100" y="76" text-anchor="middle" font-size="11" fill="#EDF5F0">(HC nähert sich ~3000)</text>

      <!-- Efficiency Card -->
      <rect x="220" y="0" width="200" height="85" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
      <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#EDF5F0">Effizienz erhalten</text>
      <text x="320" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Paper: +6,7 % Zeit</text>
      <text x="320" y="60" text-anchor="middle" font-size="14" font-weight="800" fill="#EDF5F0">Kosten der Trainingszeit</text>
      <text x="320" y="76" text-anchor="middle" font-size="11" fill="#EDF5F0">durch Kernel Fusion</text>
    </g>

    <!-- Legend Box -->
    <rect x="0" y="450" width="420" height="40" rx="8" fill="#141D19" stroke="#2B3B33" stroke-width="1.5" />

    <g transform="translate(10, 474)">
      <circle cx="5" cy="-4" r="6" fill="#1B2621" />
      <text x="16" y="0" font-size="12" font-weight="600" fill="#EDF5F0">Aggregation (σ-Bedingung)</text>

      <circle cx="180" cy="-4" r="6" fill="#1B2621" />
      <text x="191" y="0" font-size="12" font-weight="600" fill="#EDF5F0">Sinkhorn-Routing</text>

      <circle cx="310" cy="-4" r="6" fill="#1B2621" />
      <text x="321" y="0" font-size="12" font-weight="600" fill="#EDF5F0" style="font-size: 11.5px;">Expansion Dist.</text>
    </g>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
