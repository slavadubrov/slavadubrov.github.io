<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Architektur der Hyper-Connections</title>
  <desc id="desc">Mehrere Residual Streams werden in den Layer-Input eingelesen, durch eine Residual Map gemischt und mit dem Layer-Output aktualisiert.</desc>
  <defs>
    <!-- Background grid -->


    <marker id="arrowStream1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>
    <marker id="arrowStream2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>

    <!-- Filters for Glow and Shadow -->


  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="680" fill="#0C1210" />

  <!-- Background grid layer -->
  <rect width="1000" height="680" fill="#0C1210" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#EDF5F0">Hyper-Connections (HC)</text>
  <text x="40" y="80" font-size="16" fill="#EDF5F0">Erweiterung der Residual-Stream-Breite durch paralleles Routing (vereinfachtes n=2-Layout)</text>

  <!-- Left Side: Architecture Diagram -->
  <g transform="translate(60, 140)">

    <!-- Grouped Background Block -->
    <rect x="-10" y="60" width="520" height="420" rx="16" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="8 4" class="visual-focus" />
    <text x="250" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0" letter-spacing="1">HYPER-CONNECTIONS-BLOCK</text>

    <!-- Base Paths representing the parallel flow (Animated particles will follow these) -->
    <g fill="none">
      <!-- Stream 1 straight path -->
      <path d="M 100 440 L 100 136" stroke="#EDF5F0" stroke-width="2.5" opacity="0.6" />
      <!-- Stream 2 straight path -->
      <path d="M 400 440 L 400 136" stroke="#A8B8AF" stroke-width="2.5" opacity="0.6" />

      <!-- 1 -> 2 mixing cross -->
      <path d="M 100 440 L 100 430 L 350 430 Q 370 430 370 410 L 370 150 Q 370 120 384 120" stroke="#EDF5F0" stroke-width="2.5" opacity="0.6" />

      <!-- 2 -> 1 mixing cross -->
      <path d="M 400 440 L 400 410 L 150 410 Q 130 410 130 390 L 130 150 Q 130 120 116 120" stroke="#A8B8AF" stroke-width="2.5" opacity="0.6" />

      <!-- 1 -> Aggregation -->
      <path d="M 100 440 L 100 390 C 180 390 180 340 236 340" stroke="#EDF5F0" stroke-width="2.5" opacity="0.6" marker-end="url(#arrowStream1)" />

      <!-- 2 -> Aggregation -->
      <path d="M 400 440 L 400 390 C 320 390 320 340 264 340" stroke="#A8B8AF" stroke-width="2.5" opacity="0.6" marker-end="url(#arrowStream2)" />

      <!-- Aggregation -> Transformer -->
      <path d="M 250 326 L 250 296" stroke="#EDF5F0" stroke-width="3" opacity="0.6" />

      <!-- Transformer Output to Stream 1 (Expansion) -->
      <path d="M 250 240 L 250 210 Q 250 190 220 190 L 130 190 Q 100 190 100 160 L 100 136" stroke="#A8B8AF" stroke-width="2.5" opacity="0.6" />

      <!-- Transformer Output to Stream 2 (Expansion) -->
      <path d="M 250 240 L 250 210 Q 250 190 280 190 L 370 190 Q 400 190 400 160 L 400 136" stroke="#A8B8AF" stroke-width="2.5" opacity="0.6" />
    </g>

    <!-- Animated Flow Particles -->
    <g>
      <!-- Stream 1 Straight -->

      <!-- Stream 2 Straight -->

      <!-- Mixing 1 to 2 -->

      <!-- Mixing 2 to 1 -->

      <!-- 1 to Aggregation -->

      <!-- 2 to Aggregation -->

      <!-- Transformer to 1 (Expansion) -->

      <!-- Transformer to 2 (Expansion) -->

    </g>

    <!-- Input Streams -->
    <rect x="60" y="440" width="80" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="100" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">h₁</text>
    <text x="100" y="495" text-anchor="middle" font-size="12" fill="#EDF5F0">Stream 1</text>

    <rect x="360" y="440" width="80" height="36" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="400" y="464" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">h₂</text>
    <text x="400" y="495" text-anchor="middle" font-size="12" fill="#EDF5F0">Stream 2</text>

    <!-- Mixing Weights (alpha) -->
    <!-- alpha 11 -->
    <rect x="83" y="240" width="34" height="24" rx="4" fill="#1B2621" />
    <text x="100" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">α₁₁</text>
    <!-- alpha 12 -->
    <rect x="353" y="290" width="34" height="24" rx="4" fill="#1B2621" />
    <text x="370" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">α₁₂</text>
    <!-- alpha 21 -->
    <rect x="113" y="290" width="34" height="24" rx="4" fill="#1B2621" />
    <text x="130" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">α₂₁</text>
    <!-- alpha 22 -->
    <rect x="383" y="240" width="34" height="24" rx="4" fill="#1B2621" />
    <text x="400" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">α₂₂</text>

    <!-- Expansion Layer Scalers (beta) -->
    <rect x="143" y="178" width="34" height="24" rx="4" fill="#1B2621" />
    <text x="160" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">β₁</text>

    <rect x="323" y="178" width="34" height="24" rx="4" fill="#1B2621" />
    <text x="340" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">β₂</text>

    <!-- Central Processing Logic -->
    <!-- Aggregation Node -->
    <circle cx="250" cy="340" r="14" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="250" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">+</text>

    <!-- Transformer FFN -->
    <rect x="180" y="240" width="140" height="56" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="250" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#EDF5F0">Transformer-FFN</text>
    <text x="250" y="285" text-anchor="middle" font-size="12" fill="#EDF5F0">oder Attention</text>

    <!-- Output Combinations (+) Nodes -->
    <circle cx="100" cy="120" r="16" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="100" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">+</text>

    <circle cx="400" cy="120" r="16" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="400" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">+</text>

    <!-- Final Output Links to Boxes -->
    <!-- Left output path -->
    <path d="M 100 104 L 100 46" stroke="#EDF5F0" stroke-width="2.5">
      <marker markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M 0 0 L 6 3 L 0 6 z" fill="#141D19" />
      </marker>
    </path>
    <!-- Right output path -->
    <path d="M 400 104 L 400 46" stroke="#EDF5F0" stroke-width="2.5">
      <marker markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <path d="M 0 0 L 6 3 L 0 6 z" fill="#141D19" />
      </marker>
    </path>

    <!-- Outputs Streams -->
    <!-- h'1 Output -->
    <rect x="60" y="10" width="80" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">h'₁</text>
    <text x="100" y="-2" text-anchor="middle" font-size="12" fill="#EDF5F0">Output 1</text>

    <!-- h'2 Output -->
    <rect x="360" y="10" width="80" height="36" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">h'₂</text>
    <text x="400" y="-2" text-anchor="middle" font-size="12" fill="#EDF5F0">Output 2</text>
  </g>

  <!-- Right Side: Explanations -->
  <g transform="translate(560, 140)">

    <!-- 1. Aggregation Box -->
    <rect x="0" y="-10" width="400" height="95" rx="8" fill="#141D19" stroke="#2B3B33" stroke-width="1.5" />
    <text x="20" y="15" font-size="14" font-weight="700" fill="#EDF5F0">1. Aggregation</text>
    <text x="20" y="35" font-size="13" fill="#EDF5F0">Kombiniert parallele Streams linear zu einem einzelnen Vektor.</text>
    <text x="20" y="53" font-size="13" fill="#EDF5F0">Dadurch erhält der Transformer-Block eine komprimierte</text>
    <text x="20" y="71" font-size="13" fill="#EDF5F0">Repräsentation aller verfügbaren Residual-Pfade.</text>

    <!-- 2. Transformer & Expansion Box -->
    <rect x="0" y="105" width="400" height="95" rx="8" fill="#141D19" stroke="#2B3B33" stroke-width="1.5" />
    <text x="20" y="130" font-size="14" font-weight="700" fill="#EDF5F0">2. Transformer &amp; Expansion</text>
    <text x="20" y="150" font-size="13" fill="#EDF5F0">Nach der Verarbeitung der aggregierten Features wird der</text>
    <text x="20" y="168" font-size="13" fill="#EDF5F0">Transformer-Output mithilfe von</text>
    <text x="20" y="186" font-size="13" fill="#EDF5F0">lernbaren Skalierungsfaktoren (β) pro Stream wieder auf alle einzelnen Streams verteilt.</text>

    <!-- 3. Mixing Feature Router Box -->
    <rect x="0" y="220" width="400" height="95" rx="8" fill="#141D19" stroke="#2B3B33" stroke-width="1.5" />
    <text x="20" y="245" font-size="14" font-weight="700" fill="#EDF5F0">3. Mixing (Feature Router)</text>
    <text x="20" y="265" font-size="13" fill="#EDF5F0">Eine lernbare n×n-Matrix (α) routet Features dynamisch</text>
    <text x="20" y="283" font-size="13" fill="#EDF5F0">zwischen parallelen Streams und ermöglicht dadurch</text>
    <text x="20" y="301" font-size="13" fill="#EDF5F0">einen vielfältigen Gradient Flow, der einzelne Bottlenecks umgehen kann.</text>

    <!-- Problem Warning Box (Sets up context for mHC) -->
    <rect x="0" y="335" width="400" height="120" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <path d="M 15 355 L 15 435" stroke="#EDF5F0" stroke-width="4" stroke-linecap="round" />
    <text x="30" y="360" font-size="14" font-weight="700" fill="#EDF5F0">Das Skalierbarkeitsproblem</text>
    <text x="30" y="382" font-size="13" font-weight="500" fill="#EDF5F0">Da die α-Mixing-Weights anfangs nicht beschränkt sind,</text>
    <text x="30" y="400" font-size="13" font-weight="500" fill="#EDF5F0">akkumulieren sich die Signalstärken über lange Layer</text>
    <text x="30" y="418" font-size="13" font-weight="500" fill="#EDF5F0">exponentiell und zerstören die Eigenschaft des Identity Mappings.</text>
    <text x="30" y="440" font-size="13" font-weight="700" fill="#EDF5F0">mHC-Paper: Instabilität tritt im 27B-HC-Run auf.</text>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
