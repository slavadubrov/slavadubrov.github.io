<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Sechs unabhängige Ebenen eines Open-Weight-Model-Artefakts</title>
  <desc id="layers-desc">Sechs ausgerichtete Knoten trennen Familie und Revision, Trainingsrolle, Architektur, numerische Repräsentation, Container und Layout sowie Runtime und Hardware. Container und Layout stehen im Fokus, weil ein Formatname nur eine Ebene des Artefakts bezeichnet.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#F7F7F4" />

  <text class="section" x="48" y="48">MODEL-ARTEFAKT — JEDE EBENE SEPARAT LESEN</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="114">EBENE 1</text>
  <text class="name" x="68" y="142">Familie + Revision</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="114">EBENE 2</text>
  <text class="name" x="364" y="142">Trainingsrolle</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="114">EBENE 3</text>
  <text class="name" x="660" y="142">Architektur</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="250">EBENE 4</text>
  <text class="name" x="68" y="278">Numerische Repräsentation</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="364" y="250" fill="#C50E72">FOKUS · EBENE 5</text>
  <text class="name" x="364" y="278" fill="#C50E72">Container + Layout</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="250">EBENE 6</text>
  <text class="name" x="660" y="278">Runtime + Hardware</text>

  <path d="M48 360H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="392">BEISPIELE</text>
  <text class="note" x="48" y="420">GPTQ und AWQ beschreiben Quantization. GGUF und Safetensors beschreiben Packaging.</text>
  <text class="note" x="48" y="448">MoE beschreibt die Ausführungsstruktur. llama.cpp, vLLM und Transformers führen unterstützte Artefakte aus.</text>
  <text class="note" x="48" y="476">Ein vertrautes Suffix belegt weder Qualität noch passenden Speicherbedarf oder Serving-Geschwindigkeit.</text>
</svg>
