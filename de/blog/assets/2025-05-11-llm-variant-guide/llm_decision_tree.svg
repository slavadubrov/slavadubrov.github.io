<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="ldt-title ldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ldt-title">Workflow zur Auswahl von Checkpoint, Runtime und Quantization</title><desc id="ldt-desc">Ein Ablauf mit sechs Schritten legt den Task Contract fest, wählt einen exakten Checkpoint aus, verifiziert eine unterstützte Runtime, ermittelt ein gemessenes Memory Budget, wählt eine Repräsentation und benchmarked die Release Unit. Der Release Benchmark steht im Fokus; jede Änderung an einem Schritt erzeugt eine neue Release Unit zum Testen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="ldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="496" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Ein Auswahl-Workflow, der neue Formate übersteht</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Sechs Schritte, in dieser Reihenfolge. Jede Änderung erzeugt eine neue Release Unit für den Benchmark.</text>
