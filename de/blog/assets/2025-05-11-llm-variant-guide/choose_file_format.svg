<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 746" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="cff-title cff-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cff-title">Einen Model-Container über ein Runtime-first-Kompatibilitäts-Gate auswählen</title><desc id="cff-desc">Eine Runtime-Entscheidung verzweigt zu llama.cpp, einem GPU Server oder Loader oder einer Edge- bzw. Mobile-Runtime. Jeder Pfad führt zum unterstützten Artefakt — einer GGUF-Konvertierung, einem Repository-Artefakt oder einem unterstützten Export — und alle Pfade laufen vor dem Benchmarking in einem Kompatibilitäts-Gate zusammen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cff-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="cff-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="746" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Runtime zuerst, dann Artefakt</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Die Hardware allein kann den Container nicht bestimmen. Runtime auswählen und anschließend das dort</tspan><tspan x="32" dy="1.2em">dokumentierte Artefakt-Layout verwenden.</tspan></text>
<rect x="200" y="112" width="320" height="72" rx="24" fill="#FFFFFF" stroke="#17211B" stroke-width="2" /><text x="360" y="140" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" text-anchor="middle" letter-spacing="1.2">ENTSCHEIDUNG</text><text x="360" y="164" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">Welche Runtime?</text>
