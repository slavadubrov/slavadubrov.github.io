<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="format-title format-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="format-title">Model-Container über einen Runtime-first-Kompatibilitätscheck auswählen</title>
  <desc id="format-desc">Eine Runtime-Entscheidung verzweigt zu llama.cpp, einem GPU Server oder einer Edge- bzw. Mobile-Runtime. Jede Runtime führt zu ihrem unterstützten Artefakt: einer GGUF-Konvertierung, einem dokumentierten Repository-Artefakt oder einem unterstützten Export. Alle Pfade führen an einem Kompatibilitätscheck zusammen.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="688" rx="14" fill="#F7F7F4" />

  <path class="box" d="M480 64 600 112 480 160 360 112Z" />
  <text class="kind" x="480" y="106" text-anchor="middle">ENTSCHEIDUNG</text>
  <text class="name" x="480" y="130" text-anchor="middle">Welche Runtime?</text>

  <path class="edge" d="M480 160v16H184v24" marker-end="url(#format-arrow)" />
  <path class="edge" d="M480 160v40" marker-end="url(#format-arrow)" />
  <path class="edge" d="M480 160v16h296v24" marker-end="url(#format-arrow)" />

  <rect class="box" x="48" y="200" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="234">RUNTIME</text>
  <text class="name" x="68" y="262">llama.cpp</text>
  <rect class="box" x="344" y="200" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="234">RUNTIME</text>
  <text class="name" x="364" y="262">GPU Server / Loader</text>
  <rect class="box" x="640" y="200" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="234">RUNTIME</text>
  <text class="name" x="660" y="262">Edge / Mobile</text>

  <path class="edge" d="M184 296v40" marker-end="url(#format-arrow)" />
  <path class="edge" d="M480 296v40" marker-end="url(#format-arrow)" />
  <path class="edge" d="M776 296v40" marker-end="url(#format-arrow)" />

  <rect class="store" x="48" y="344" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="378">ARTEFAKT</text>
  <text class="name" x="68" y="406">GGUF-Konvertierung</text>
  <rect class="store" x="344" y="344" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="378">ARTEFAKT</text>
  <text class="name" x="364" y="406">Repository-Artefakt</text>
  <rect class="store" x="640" y="344" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="378">ARTEFAKT</text>
  <text class="name" x="660" y="406">Unterstützter Export</text>

  <path class="edge" d="M184 440v32h296" />
  <path class="edge" d="M776 440v32H480" />
  <path class="edge" d="M480 440v56" marker-end="url(#format-arrow)" />

  <rect x="272" y="504" width="416" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="292" y="538" fill="#C50E72">FOKUS · KOMPATIBILITÄTSCHECK</text>
  <text class="name" x="292" y="566" fill="#C50E72">Den exakten Ausführungspfad verifizieren</text>

  <text class="note" x="48" y="640">Architektur, Loader-Version, Kernel, Hardware, Model-Revision und Konvertierungsherkunft prüfen.</text>
  <text class="note" x="48" y="668">Anschließend Task-Qualität, Throughput, Latency und Spitzenverbrauch des Speichers auf dem Zielgerät benchmarken.</text>

  <defs>
    <marker id="format-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
