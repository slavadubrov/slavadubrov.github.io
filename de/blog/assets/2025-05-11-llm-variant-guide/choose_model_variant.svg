<path d="M32 752h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="778" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Jeder Kandidat erreicht dasselbe Evaluierungs-Gate.</text>
<text x="32" y="800" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Task-Qualität, Interface-Verhalten, Latency und Spitzen-Speicherbedarf messen, bevor Labels verglichen</tspan><tspan x="32" dy="1.2em">werden.</tspan></text>
