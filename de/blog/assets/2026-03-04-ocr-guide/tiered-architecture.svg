<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-routing-title ocr-routing-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-routing-title">Production-OCR routet Dokumente durch kalibrierte Fallback-Stufen</title>
  <desc id="ocr-routing-desc">Eingehende Dokumente prüfen zuerst ihren nativen Text. Fehlgeschlagene Prüfungen führen über schnelles OCR zu einem stärkeren Model. Erfolgreiche Routen laufen bei Post-Processing und Structured Output zusammen; ungelöste Hochrisikofelder erreichen die Human Review.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .branch { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.1px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="688" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="48">PRODUCTION ROUTER · NUR BEI FEHLER EINER PRÜFSTUFE ESKALIEREN</text>

  <rect x="48" y="88" width="152" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="122">EXTERN</text><text class="name" x="68" y="150">Dokumente</text>

  <path class="box" d="M336 88 432 136 336 184 240 136Z" />
  <text class="kind" x="336" y="128" text-anchor="middle">ENTSCHEIDUNG</text>
  <text class="name" x="336" y="151" text-anchor="middle">Text verwendbar?</text>
  <path class="edge" d="M200 136h32" marker-end="url(#ocr-routing-arrow)" />

  <rect class="box" x="176" y="240" width="248" height="96" rx="10" />
  <text class="kind" x="196" y="274">PROZESS</text><text class="name" x="196" y="302">Schnelles lokales OCR</text>
  <text class="note" x="196" y="322" style="font-size: 11.5px;">Rasterisieren · normalisieren · extrahieren</text>
  <path class="edge" d="M336 184v24h-36v24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="348" y="208">NEIN</text>

  <path class="box" d="M560 240 656 288 560 336 464 288Z" />
  <text class="kind" x="560" y="280" text-anchor="middle">ENTSCHEIDUNG</text>
  <text class="name" x="560" y="303" text-anchor="middle">Prüfstufe bestanden?</text>
  <path class="edge" d="M424 288h32" marker-end="url(#ocr-routing-arrow)" />

  <rect class="box" x="176" y="392" width="248" height="96" rx="10" />
  <text class="kind" x="196" y="426">PROZESS</text><text class="name" x="196" y="454">Stärkeres Model</text>
  <text class="note" x="196" y="474">Layout · beschädigte Seiten · Felder</text>
  <path class="edge" d="M560 336v24H300v24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="572" y="360">NEIN</text>

  <path class="box" d="M560 392 656 440 560 488 464 440Z" />
  <text class="kind" x="560" y="432" text-anchor="middle">ENTSCHEIDUNG</text>
  <text class="name" x="560" y="455" text-anchor="middle">Prüfstufe bestanden?</text>
  <path class="edge" d="M424 440h32" marker-end="url(#ocr-routing-arrow)" />

  <rect x="448" y="544" width="224" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="468" y="578" fill="#C50E72">FOKUS</text>
  <text class="name" x="468" y="606" fill="#C50E72">Human Review</text>
  <text class="note" x="468" y="626">Ungelöste oder Hochrisikofelder</text>
  <path class="edge" d="M560 488v48" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="572" y="520">NEIN</text>

  <rect class="box" x="736" y="88" width="176" height="96" rx="10" />
  <text class="kind" x="756" y="122">PROZESS</text><text class="name" x="756" y="150">Post-Processing</text>
  <path class="edge" d="M432 136h296" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="448" y="124">JA · NATIVER TEXT</text>

  <rect x="736" y="240" width="176" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="756" y="274">SPEICHERN</text><text class="name" x="756" y="302">Structured Output</text>
  <path class="edge" d="M824 184v48" marker-end="url(#ocr-routing-arrow)" />

  <path class="edge" d="M656 288h48M656 440h48M672 592h32M704 592V136h24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="672" y="276">JA</text>
  <text class="branch" x="672" y="428">JA</text>
  <text class="branch" x="688" y="580">GEPRÜFT</text>

  <path d="M48 656h864" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="48" y="680">Kalibrieren Sie jede Prüfstufe nach Dokumentklasse, Feldkritikalität und gelabelten Ergebnissen.</text>

  <defs>
    <marker id="ocr-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
