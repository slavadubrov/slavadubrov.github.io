<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Architektur mit Produktivumgebungs-Ebenen, die ein konfidenzbasierteres Routing darstellt: Dokumente durchlaufen zunächst die Vorausverarbeitung, anschließend Ebene 1 (PaddleOCR/Tesseract); Ergebnisse mit geringer Konfidenz werden an Ebene 2 (Qwen3-VL usw.ocr) und schließlich an Ebene 3 (Gemini Pro/GPT-5.2) weitergeleitet, bevor sie einer Nachverarbeitung sowie menschlichen Überprüfung zugeführt werden</title>
  <desc id="artifact-desc">Architektur mit Produktivumgebungs-Ebenen, die ein konfidenzbasierteres Routing darstellt: Dokumente durchlaufen zunächst die Vorausverarbeitung, anschließend Ebene 1 (PaddleOCR/Tesseract); Ergebnisse mit geringer Konfidenz werden an Ebene 2 (Qwen3-VL usw.ocr) und schließlich an Ebene 3 (Gemini Pro/GPT-5.2) weitergeleitet, bevor sie einer Nachverarbeitung sowie menschlichen Überprüfung zugeführt werden</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" />
