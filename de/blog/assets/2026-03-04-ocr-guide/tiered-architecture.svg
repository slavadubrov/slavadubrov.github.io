  <rect width="1120" height="720" rx="14" fill="#f8fafc" />
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">Produktionsumgebung OCR: mehrstufiger Routing</text>
  <text x="48" y="74" font-size="14" fill="#64748b">Jede Qualitätskontrollstufe anhand von gekennzeichneten Dokumentklassen kalibrieren.</text>
  <g transform="translate(48 280)">
    <rect width="142" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="71" y="34" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Eingehend</text>
    <text x="71" y="55" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Dokumente</text>
    <text x="71" y="79" font-size="13" fill="#64748b" text-anchor="middle">PDFs, Bilder</text>
  </g>
  <line x1="190" y1="330" x2="218" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#blue-arrow)" />
  <g transform="translate(230 270)">
