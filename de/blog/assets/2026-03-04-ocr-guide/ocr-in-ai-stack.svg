  <g transform="translate(144 494)">
    <rect width="672" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="336" y="21" font-size="14" font-weight="600" fill="#9a3412" text-anchor="middle">Fehlender Text oder fehlende Struktur begrenzen die nachgelagerte Qualität</text>
    <text x="336" y="39" font-size="12" fill="#64748b" text-anchor="middle">Extraktion vor Retrieval, Generation und Agent-Entscheidungen evaluieren.</text>
  </g>
