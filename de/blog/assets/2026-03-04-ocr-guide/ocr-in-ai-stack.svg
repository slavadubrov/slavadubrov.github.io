<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-stack-title ocr-stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-stack-title">OCR-Qualität begrenzt jedes nachgelagerte Dokumentensystem</title>
  <desc id="ocr-stack-desc">Dokumente durchlaufen einen fokussierten Schritt zur Extraktionsqualität und werden in einem persistenten Text-und-Layout-Datensatz gespeichert. Retrieval, Agent-Entscheidungen und domänenspezifische Workflows können nur die Evidenz nutzen, die durch die Extraktion erhalten blieb.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="488" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="48">DIE EXTRAKTIONSGRENZE</text>

  <rect x="48" y="80" width="232" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="114">EXTERN</text>
  <text class="name" x="68" y="142">Dokumente und Bilder</text>

  <rect x="364" y="80" width="232" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="384" y="114" fill="#C50E72">FOKUS</text>
  <text class="name" x="384" y="142" fill="#C50E72">Extraktionsqualität</text>

  <rect x="680" y="80" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="700" y="114">SPEICHERN</text>
  <text class="name" x="700" y="142">Text- und Layout-Evidenz</text>

  <path class="edge" d="M280 128h76" marker-end="url(#ocr-stack-arrow)" />
  <path class="edge" d="M596 128h76" marker-end="url(#ocr-stack-arrow)" />

  <path class="edge" d="M796 176v48H164v32" />
  <path class="edge" d="M480 224v32" marker-end="url(#ocr-stack-arrow)" />
  <path class="edge" d="M796 224v32" marker-end="url(#ocr-stack-arrow)" />
  <path class="edge" d="M164 224v32" marker-end="url(#ocr-stack-arrow)" />

  <rect class="box" x="48" y="264" width="232" height="96" rx="10" />
  <text class="kind" x="68" y="298">VERARBEITEN</text>
  <text class="name" x="68" y="326">Retrieval und Antworten</text>

  <rect class="box" x="364" y="264" width="232" height="96" rx="10" />
  <text class="kind" x="384" y="298">VERARBEITEN</text>
  <text class="name" x="384" y="326">Agent-Entscheidungen</text>

  <rect class="box" x="680" y="264" width="232" height="96" rx="10" />
  <text class="kind" x="700" y="298">VERARBEITEN</text>
  <text class="name" x="700" y="326">Domänenspezifische Workflows</text>

  <path d="M48 408h864" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="436">BESCHRÄNKUNG</text>
  <text class="note" x="176" y="436">Entfernter Text oder entfernte Struktur hinterlassen keine Evidenz für Retrieval, Generierung oder Aktionen.</text>

  <defs>
    <marker id="ocr-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
