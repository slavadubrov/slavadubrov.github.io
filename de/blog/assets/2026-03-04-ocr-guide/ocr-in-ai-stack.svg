      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff" />
      <text x="38" y="37" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">MAIL</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">E-Mails &amp; Anhänge</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Eingebettete Bilder, PDFs</text>
    </g>
  </g>

