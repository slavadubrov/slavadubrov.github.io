      <text x="38" y="37" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">SCAN</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">Gescannte Dokumente</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Rechnungen, Belege, Formulare</text>
    </g>
    <g transform="translate(0 198)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff" />
      <text x="38" y="37" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">FOTO</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">Fotos &amp; Screenshots</text>
      <text x="76" y="47" font-size="12" fill="#64748b">Whiteboards, Schilder, UI</text>
    </g>
    <g transform="translate(0 272)">
