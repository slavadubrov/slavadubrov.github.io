<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-tiers-title ocr-tiers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-tiers-title">Drei OCR-Modellfamilien nach Workload-Fit verglichen</title>
  <desc id="ocr-tiers-desc">Traditionelles OCR, spezialisierte Dokument-Modelle und allgemeine VLMs decken zunehmend breitere Aufgaben ab, doch der Deployment-Modus variiert je nach Produkt. Alle drei sollten auf demselben gelabelten Workload getestet werden.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="464" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">VERGLEICH DER MODELLFAMILIEN</text>

  <rect class="box" x="48" y="72" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="106">FAMILIE</text><text class="name" x="68" y="134">Traditionelles OCR</text>
  <rect class="box" x="352" y="72" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="106">FAMILIE</text><text class="name" x="372" y="134">Spezialisierte Modelle</text>
  <rect class="box" x="656" y="72" width="264" height="96" rx="10" />
  <text class="kind" x="676" y="106">FAMILIE</text><text class="name" x="676" y="134">Allgemeine VLMs</text>

  <rect class="box" x="48" y="188" width="264" height="64" rx="10" />
  <text class="kind" x="68" y="212">AUFGABENBREITE</text>
  <text class="note" x="68" y="238">Sauberer Druck · begrenzte Schriften</text>
  <rect class="box" x="352" y="188" width="264" height="64" rx="10" />
  <text class="kind" x="372" y="212">AUFGABENBREITE</text>
  <text class="note" x="372" y="238">Layout · Tabellen · Formeln</text>
  <rect class="box" x="656" y="188" width="264" height="64" rx="10" />
  <text class="kind" x="676" y="212">AUFGABENBREITE</text>
  <text class="note" x="676" y="238">Extraktion · VQA · Reasoning</text>

  <rect class="box" x="48" y="272" width="264" height="64" rx="10" />
  <text class="kind" x="68" y="296">DEPLOYMENT</text>
  <text class="note" x="68" y="322">Lokale CPU oder Self-Hosting</text>
  <rect class="box" x="352" y="272" width="264" height="64" rx="10" />
  <text class="kind" x="372" y="296">DEPLOYMENT</text>
  <text class="note" x="372" y="322">Self-Hosting auf GPU oder API</text>
  <rect class="box" x="656" y="272" width="264" height="64" rx="10" />
  <text class="kind" x="676" y="296">DEPLOYMENT</text>
  <text class="note" x="676" y="322">Hosted API oder Open Weights</text>

  <path class="edge" d="M180 336v16h304" />
  <path class="edge" d="M484 336v16" />
  <path class="edge" d="M788 336v16H484" />
  <path class="edge" d="M484 352v16" marker-end="url(#ocr-tiers-arrow)" />

  <rect x="240" y="376" width="480" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="260" y="400" fill="#FF6FB6">FOKUS</text>
  <text class="name" x="260" y="424" fill="#FF6FB6">Dieselben gelabelten Workload testen</text>

  <defs>
    <marker id="ocr-tiers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
