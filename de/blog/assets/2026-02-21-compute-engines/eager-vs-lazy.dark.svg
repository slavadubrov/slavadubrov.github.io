<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Eager und Lazy Execution</title><desc id="eagerlazy-desc">Eine Eager Pipeline liest alle Spalten und erstellt anschließend bei jedem Schritt – Filter, Groupby und Ergebnis – eine vollständige Kopie im RAM. Dadurch werden 2- bis 3-mal so viele Daten wie die Dataset-Größe im Speicher benötigt. Eine Lazy Engine erstellt aus Scan, Filter und group_by einen Query-Plan. Ein Optimizer wendet Predicate Pushdown und Column Pruning an; anschließend führt collect() die Abfrage einmal parallel mit Streaming-Batches aus. Pandas benötigt auf einem PDS-H SF-10 Benchmark etwa 365 Sekunden, Polars etwa 3,89 Sekunden.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
