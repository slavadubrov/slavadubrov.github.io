<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Eager- und Lazy Execution</title><desc id="eagerlazy-desc">Eager Operations können Intermediate Tables behalten. Die Lazy Execution von Polars optimiert den gesamten Plan. Explizites Streaming kann den Speicherbedarf für unterstützte Operators bei Intermediates begrenzen, aber collect materialisiert das finale Ergebnis.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="eagerlazy-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="eagerlazy-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="610" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Eager- und Lazy Execution</text>
<rect x="32" y="96" width="656" height="176" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">EAGER OPERATIONS</text>
<path d="M58 136h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 136h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">LESEN</text><text x="62" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Spalten laden</text>
<path d="M282 136h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M282 136h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="286" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">FILTERN</text><text x="286" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Zeilen filtern</text>
<path d="M506 136h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M506 136h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="510" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">AGGREGIEREN</text><text x="510" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 15px;">Ergebnisse gruppieren</text>
<path d="M224 172H272" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<path d="M448 172H496" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<text x="48" y="244" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">Intermediates können gleichzeitig existieren; der Speicherbedarf hängt von Kopien und</tspan><tspan x="48" dy="1.2em">Ergebnisgrößen ab.</tspan></text>
<rect x="32" y="304" width="656" height="216" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="332" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">POLARS LAZY PLAN</text>
<path d="M58 344h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 344h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PLAN</text><text x="62" y="399" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 11.5px;">Scannen, filtern, gruppieren</text>
<path d="M282 344h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M282 344h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="286" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OPTIMIZER</text><text x="286" y="399" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Plan optimieren</text>
<path d="M506 344h156a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-156a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M506 344h156a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-176a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="510" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">AUSFÜHREN</text><text x="510" y="399" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Ergebnis sammeln</text>
<path d="M224 380H272" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<path d="M448 380H496" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eagerlazy-arrow-flow)" />
<text x="48" y="452" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">collect(engine="streaming") verwendet Batches, sofern die Operators dies unterstützen.</text>
<text x="48" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">Das finale Ergebnis muss in den Speicher passen; einige Operations können auf eine andere</tspan><tspan x="48" dy="1.2em">Ausführung zurückfallen.</tspan></text>
<path d="M32 548h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="574" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Lazy Planning ermöglicht Optimierung; es garantiert nicht automatisch Streaming.</text>
</svg>
