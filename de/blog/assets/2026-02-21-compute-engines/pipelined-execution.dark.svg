<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="pipeline-title pipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="pipeline-title">Sequenzielle und pipelinierte Ausführung</title><desc id="pipeline-desc">Konzeptionelle Zeitleiste zum Vergleich eines stufenorientierten Pfads, bei dem alle CPU-Kerne fertig sind, bevor die GPU startet, und die GPU während Stage 1 untätig ist, mit pipeliniertem Streaming, bei dem spätere Batches heruntergeladen und geparst werden, während frühere Batches bereits auf der GPU liegen – dadurch sinkt die Untätigkeitszeit bei ausbalancierten Stages.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="pipeline-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="pipeline-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="760" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Sequenzielle und pipelinierte Ausführung</text>
<rect x="32" y="96" width="656" height="264" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">STUFENORIENTIERTER PFAD</text>
<path d="M66 152h260a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M66 152h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="70" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU-KERN 1 + 2</text><text x="70" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">P1, P2 herunterladen + parsen</text>
<path d="M66 220h260a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M66 220h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="70" y="237.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">GPU</text><text x="70" y="267" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8B8AF">Untätig – wartet auf CPU</text>
<path d="M352 180h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#pipeline-arrow-flow)" /><text x="368" y="168.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">Barriere</text>
<path d="M410 152h112a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-112a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M410 152h112a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-132a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="414" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">CPU</text><text x="414" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#A8B8AF">Untätig</text>
<path d="M410 220h112a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-112a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M410 220h112a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-132a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="414" y="237.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GPU</text><text x="414" y="267" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDF5F0" style="font-size: 13px;">P1 + P2 embedden</text>
<text x="552" y="184" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">GPU wartet während</text>
<text x="552" y="204" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13px;">der gesamten Stage 1.</text>
<rect x="32" y="400" width="656" height="280" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="428" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">PIPELINIERTES STREAMING (DAFT / RAY DATA)</text>
<path d="M66 456h90a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M66 456h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="70" y="473.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU 1</text><text x="70" y="497" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">DL-Batches</text>
<path d="M194 456h90a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M194 456h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="198" y="473.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU 1</text><text x="198" y="497" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">… läuft weiter</text>
<path d="M66 516h160a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-160a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M66 516h160a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-180a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="70" y="533.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CPU 2</text><text x="70" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">Batches parsen</text>
<path d="M266 516h130a10 10 0 0 1 10 10v24a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-24a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M266 516h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="270" y="533.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GPU</text><text x="270" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">Batches embedden</text>
<path d="M166 478h18" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M236 538h20" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="56" y="596" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="56">Spätere Batches werden heruntergeladen und geparst, während frühere Batches bereits auf der</tspan><tspan x="56" dy="1.2em">GPU eingebettet werden.</tspan></text>
<path d="M56 632h600" stroke="#2B3B33" stroke-width="1" />
<text x="56" y="656" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;">Mehr Overlap: Der Throughput bleibt höher, weil keine Stage darauf wartet, dass zuerst jede andere Stage fertig wird.</text>
<path d="M32 704h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="730" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Overlap kann die Untätigkeitszeit reduzieren, wenn die Stages ausbalanciert sind.</text>
</svg>
