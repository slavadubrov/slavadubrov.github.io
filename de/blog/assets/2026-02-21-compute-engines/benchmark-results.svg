<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Benchmark-Ergebnisse auf einem einzelnen Knoten</title>
  <desc id="desc">Laufzeitergebnisse für den Taxi-Query-Benchmark des Artikels mit Pandas, Polars, DataFusion, Daft und Polars-rs.</desc>
  <defs>
    <style>
      .bar { transform-origin: left; }
      .bar-text { font-size: 12px; fill: #59645E; font-weight: bold; }
      @keyframes scaleIn { from { transform: scaleX(0); opacity: 1; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .g-pandas .bar { fill: #F2F2F5; animation-delay: 0.1s; } .g-pandas .bar-text { animation-delay: 1.1s; }
      .g-polars .bar { fill: #F2F2F5; animation-delay: 0.2s; } .g-polars .bar-text { animation-delay: 1.2s; }
      .g-datafusion .bar { fill: #F2F2F5; animation-delay: 0.3s; } .g-datafusion .bar-text { animation-delay: 1.3s; }
      .g-daft .bar { fill: #F2F2F5; animation-delay: 0.4s; } .g-daft .bar-text { animation-delay: 1.4s; }
      .g-rust .bar { fill: #F2F2F5; animation-delay: 0.5s; } .g-rust .bar-text { animation-delay: 1.5s; }
      .axis-label { font-size: 13px; font-weight: bold; fill: #59645E; text-anchor: end; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="200" rx="12" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1.5" />
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Tabellarische Performance auf einem einzelnen Knoten</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#17211B">Ausführungszeit in Sekunden (kleiner ist besser) | ~41 Mio. NYC Yellow Taxi-Fahrten</text>

  <!-- Chart Area -->
  <g transform="translate(150, 70)">
    <!-- Base Grid X -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#59645E" stroke-width="2" />
    <line x1="0" y1="80" x2="650" y2="80" stroke="#59645E" stroke-width="2" />
    <text x="0" y="100" text-anchor="middle" font-size="11" fill="#17211B">0.0s</text>
    <line x1="150" y1="0" x2="150" y2="80" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4" /><text x="150" y="100" text-anchor="middle" font-size="11" fill="#17211B">1.0s</text>
    <line x1="300" y1="0" x2="300" y2="80" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4" /><text x="300" y="100" text-anchor="middle" font-size="11" fill="#17211B">2.0s</text>
    <line x1="450" y1="0" x2="450" y2="80" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4" /><text x="450" y="100" text-anchor="middle" font-size="11" fill="#17211B">3.0s</text>
    <line x1="600" y1="0" x2="600" y2="80" stroke="#59645E" stroke-width="1.5" stroke-dasharray="4" /><text x="600" y="100" text-anchor="middle" font-size="11" fill="#17211B">4.0s</text>

    <!-- Row 1: ETL Pipeline -->
    <g transform="translate(0, 5)">
      <g class="g-pandas"><text class="bar-label" x="-15" y="9" text-anchor="end">Pandas</text><rect class="bar" x="0" y="0" width="475" height="10" /><text class="bar-text" x="480" y="9">3.17s</text></g>
      <g class="g-polars"><text class="bar-label" x="-15" y="23" text-anchor="end">Polars</text><rect class="bar" x="0" y="14" width="117" height="10" /><text class="bar-text" x="122" y="23">0.78s</text></g>
      <g class="g-datafusion"><text class="bar-label" x="-15" y="37" text-anchor="end">DataFusion</text><rect class="bar visual-focus" x="0" y="28" width="73" height="10" /><text class="bar-text" x="78" y="37">0.49s</text></g>
      <g class="g-daft"><text class="bar-label" x="-15" y="51" text-anchor="end">Daft</text><rect class="bar" x="0" y="42" width="169" height="10" /><text class="bar-text" x="174" y="51">1.13s</text></g>
      <g class="g-rust"><text class="bar-label" x="-15" y="65" text-anchor="end">Polars-rs</text><rect class="bar" x="0" y="56" width="81" height="10" /><text class="bar-text" x="86" y="65">0.54s</text></g>
    </g>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
    .bar-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #17211B; }
    .bar:not(.visual-focus) { fill: #F2F2F5 !important; stroke: #59645E !important; stroke-width: 1.5 !important; }
  </style>
</svg>
