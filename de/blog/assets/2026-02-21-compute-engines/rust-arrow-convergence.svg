<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Das genaue Runtime- und Copy-Verhalten unterscheidet sich je nach Engine und Operator.</text>
