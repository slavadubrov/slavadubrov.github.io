<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rustarrow-title rustarrow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rustarrow-title">Native Ausführung und Arrow-kompatibler Austausch</title><desc id="rustarrow-desc">Vier Engines — Polars, DataFusion, Daft, Ray Data — basieren auf einer gemeinsamen Grundlage aus nativen Rust-Komponenten und dem spaltenbasierten Apache-Arrow-Format. Zusammen ermöglichen sie einen Tracing-Garbage-Collector-freien Betrieb, kostengünstigeren Zero-Copy-Austausch über die PyCapsule-Schnittstelle und zur Compile-Zeit geprüfte Nebenläufigkeit. Das genaue Runtime- und Copy-Verhalten unterscheidet sich je nach Engine und Operator.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
