<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="workflow-title">Die Datensätze, die einen lokalen Bild-Workflow reproduzierbar machen</title>
  <desc id="workflow-desc">Eine reproduzierbare Release-Einheit enthält fünf persistente Datensätze: die Anwendungsversion, Model-Komponenten, Generierungseinstellungen, Workflow-Abhängigkeiten und Output-Evidenz. Eine Model-Datei ist nur ein Teil dieses Pakets.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .store { fill: #f2f2f5; stroke: #17211b; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#f7f7f4" />

  <rect x="48" y="64" width="864" height="344" rx="12" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="72" y="94" fill="#c50e72">FOKUS</text>
  <text class="name" x="148" y="94" fill="#c50e72">Reproduzierbare Release-Einheit</text>

  <rect class="store" x="80" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="100" y="162">RUNTIME</text>
  <text class="name" x="100" y="190">Anwendungsversion</text>

  <rect class="store" x="360" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="162">MANIFEST</text>
  <text class="name" x="380" y="190">Model-Komponenten</text>

  <rect class="store" x="640" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="660" y="162">PARAMETER</text>
  <text class="name" x="660" y="190">Generierungseinstellungen</text>

  <rect class="store" x="220" y="264" width="240" height="96" rx="10" />
  <text class="kind" x="240" y="298">ABHÄNGIGKEITEN</text>
  <text class="name" x="240" y="326">Workflow-Graph</text>

  <rect class="store" x="500" y="264" width="240" height="96" rx="10" />
  <text class="kind" x="520" y="298">EVIDENZ</text>
  <text class="name" x="520" y="326">Output-Datensatz</text>

  <path d="M48 440h48" fill="none" stroke="#d8ddd9" stroke-width="1.5" />
  <text class="note" x="112" y="445">Die Identitäten gemeinsam fixieren; der Checkpoint allein kann das Ergebnis nicht reproduzieren.</text>
</svg>
