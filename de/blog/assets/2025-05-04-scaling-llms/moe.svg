<text x="32" y="666" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Lastverzerrung in diesem Batch: 9 bis 42 Tokens über vier Experts.</text>
<text x="32" y="688" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Tokens pro Expert, Kapazitätsüberlauf, Routing-Entropie und All-to-All-Zeit erfassen.</text>
