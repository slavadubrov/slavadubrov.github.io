<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="moe-title moe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="moe-title">Expert-paralleles Token-Routing</title><desc id="moe-desc">Ein Router bewertet einen Token-Batch und verteilt die Repräsentationen über ein All-to-All-Kollektiv an vier Experts, die typischerweise unterschiedlich stark ausgelastet sind. Nach der Berechnung durch jeden Expert stellt ein Combine-Schritt die ursprüngliche Token-Reihenfolge wieder her.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="moe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="moe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="720" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Expert-paralleles Token-Routing</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ein Router bewertet Tokens und verteilt sie mit ungleichmäßiger Last an Experts.</text>
