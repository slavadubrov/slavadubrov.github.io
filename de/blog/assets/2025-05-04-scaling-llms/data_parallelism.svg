<path d="M42 248h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M42 248h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">COLLECTIVE</text><text x="46" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Gradienten-All-Reduce</text><text x="46" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Dasselbe Update geht an jeden Rank zurück</text>
<path d="M32 376h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="402" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Der Throughput kann mit mehr Ranks steigen; der Speicherbedarf für Model State pro Rank sinkt jedoch</tspan><tspan x="32" dy="1.2em">nicht.</tspan></text>
</svg>
