<path d="M42 248h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 248h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="108" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" text-anchor="middle" letter-spacing="1.2">RANK 0</text><text x="108" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">W₀ × X → Y₀</text>
<path d="M210 248h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M210 248h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="276" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" text-anchor="middle" letter-spacing="1.2">RANK 1</text><text x="276" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">W₁ × X → Y₁</text>
<path d="M378 248h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M378 248h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="444" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" text-anchor="middle" letter-spacing="1.2">RANK 2</text><text x="444" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">W₂ × X → Y₂</text>
<path d="M546 248h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M546 248h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="612" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" text-anchor="middle" letter-spacing="1.2">RANK 3</text><text x="612" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">W₃ × X → Y₃</text>
<path d="M108 320v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M276 320v24" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
