<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="tp-title tp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tp-title">Tensor-parallele Layer-Partitionierung</title><desc id="tp-desc">Der Input einer Layer wird auf vier Weight Shards verteilt, wobei jeder Rank ein Teilergebnis berechnet. Ein Layer-Collective kombiniert die Teilergebnisse, bevor die abhängige Berechnung fortgesetzt wird. Dieses Collective wiederholt sich innerhalb jedes Transformer-Blocks.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="tp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="552" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Tensor-parallele Layer-Partitionierung</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Der Input einer Layer wird auf vier Weight Shards verteilt; ein Collective kombiniert die Teilergebnisse.</text>
