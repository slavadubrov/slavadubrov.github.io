<path d="M42 344h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M42 344h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="46" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOKUS · COLLECTIVE</text><text x="46" y="405" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Teilergebnisse kombinieren</text><text x="46" y="427" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">wiederholt sich innerhalb jedes Transformer-Blocks</text>
<path d="M32 472h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="498" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Das Collective wiederholt sich innerhalb jedes Transformer-Blocks; daher sind schnelle lokale Links wichtig.</text>
<text x="32" y="520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ein hoher Tensor-Parallelism-Grad kann Matrizen so weit verkleinern, dass die Kernel-Effizienz sinkt.</text>
</svg>
