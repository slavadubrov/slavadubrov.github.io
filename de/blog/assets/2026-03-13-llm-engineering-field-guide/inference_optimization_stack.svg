<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Inference-Optimierungsoptionen</title>
  <desc>Optionen für Kernel, Quantization, Memory, Scheduling, Caching, Speculation und Parallelism sind unabhängig auswählbar – anhand eines gemeinsamen, gemessenen Hardware- und Workload-Bottlenecks sowie anwendungsseitiger Zielvorgaben.</desc>
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Inference-Optimierungsoptionen</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#334155">Unabhängig anhand des gemessenen Bottlenecks und des Ziel-SLO auswählen</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#1d4ed8">Hardware-Grundlage</text>
  <text x="80" y="468" font-size="11" fill="#0f172a">GPU-Memory-Hierarchie: HBM-Bandbreite und On-Chip-Reuse variieren je nach GPU</text>
  <text x="80" y="483" font-size="10" fill="#334155">Compute-, Memory- und Communication-Bottleneck auf der Ziel-GPU messen</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#166534">Kernel-Optimierungen</text>
  <text x="70" y="373" font-size="11" fill="#0f172a">FlashAttention (Tiling in SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#0f172a">Fused Kernels (reduzieren HBM-Round-Trips)</text>
  <text x="70" y="398" font-size="10" fill="#334155">Auslastung im deployten Graph profilieren</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#9a3412">Quantization</text>
  <text x="470" y="373" font-size="11" fill="#0f172a">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#0f172a">8-Bit-Weights: etwa 50 % weniger Raw Storage als 16-Bit</text>
  <text x="470" y="400" font-size="10" fill="#334155">4-Bit: etwa 75 % weniger vor Scale- und Metadata-Overhead</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Memory-Management</text>
  <text x="70" y="283" font-size="11" fill="#0f172a">PagedAttention (blockbasierte KV-Allokation)</text>
  <text x="70" y="298" font-size="11" fill="#0f172a">GQA/MQA (8–16× weniger KV cache)</text>
  <text x="70" y="308" font-size="10" fill="#334155">Veröffentlichte Gains hängen von Workload und Harness ab</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#0f172a">Continuous Batching (auf Iterationsebene)</text>
  <text x="470" y="298" font-size="11" fill="#0f172a">Chunked Prefill (schützt die Decode-Latency)</text>
  <text x="470" y="308" font-size="10" fill="#334155">Für Goodput beim Ziel-SLO tunen</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Caching</text>
  <text x="70" y="193" font-size="11" fill="#0f172a">Prefix Caching (Hit Rate messen)</text>
  <text x="70" y="208" font-size="11" fill="#0f172a">RadixAttention (baum basiertes KV-Reuse)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Speculation</text>
  <text x="340" y="193" font-size="11" fill="#0f172a">Speculative Decoding (Drafts verifizieren)</text>
  <text x="340" y="208" font-size="11" fill="#0f172a">Die Acceptance Rate bestimmt den Gain</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Parallelism</text>
  <text x="620" y="193" font-size="11" fill="#0f172a">TP (Intra-Node, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#0f172a">PP (Inter-Node) + DP (Scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#991b1b">Application Layer</text>
  <text x="80" y="113" font-size="11" fill="#0f172a">Model Routing · Token-aware Rate Limiting · Monitoring (Goodput, KV-Auslastung, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="10" fill="#334155">Techniken erst kombinieren, nachdem ihre Auswirkungen auf Quality, Latency und Kosten gemessen wurden</text>

</svg>
