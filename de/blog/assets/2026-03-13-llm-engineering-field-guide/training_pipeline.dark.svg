<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="LLM training pipeline from pretraining to alignment and distillation" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">LLM-Trainingspipeline</title>
  <desc>Pretraining erzeugt ein Base Model, Supervised Fine-Tuning passt es an, und Alignment optimiert Präferenz- oder verifizierbare Rewards. Ein ausgerichteter Teacher kann außerdem gefilterte Beispiele für einen kleineren distillierten Student erzeugen.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#141D19" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="500" fill="#0C1210" rx="14" />
  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#EDF5F0">LLM-Trainingspipeline</text>
  <text x="560" y="64" text-anchor="middle" font-size="13" fill="#EDF5F0">Jede Stufe verändert ein anderes Artefakt und benötigt eine eigene Evaluation</text>

  <rect x="48" y="92" width="280" height="178" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="72" y="124" font-size="17" font-weight="700" fill="#EDF5F0">1. Pretraining</text>
  <text x="72" y="154" font-size="13" fill="#EDF5F0">Artefakt: Base-Model-Weights</text>
  <text x="72" y="178" font-size="13" fill="#EDF5F0">Signal: Next-Token Prediction</text>
  <text x="72" y="202" font-size="13" fill="#EDF5F0">Daten: großer ungelabelter Korpus</text>
  <text x="72" y="226" font-size="13" fill="#EDF5F0">Systeme: ZeRO, FSDP, Mixed Precision</text>
  <text x="72" y="250" font-size="12" font-weight="600" fill="#EDF5F0"><tspan x="72">Loss, Datenqualität und Auslastung</tspan><tspan x="72" dy="1.2em">messen</tspan></text>

  <line x1="328" y1="181" x2="410" y2="181" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="420" y="92" width="280" height="178" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
  <text x="444" y="124" font-size="17" font-weight="700" fill="#EDF5F0">2. Supervised Fine-Tuning</text>
  <text x="444" y="154" font-size="13" fill="#EDF5F0" style="font-size: 11px;">Artefakt: angepasste Weights oder LoRA Adapter</text>
  <text x="444" y="178" font-size="13" fill="#EDF5F0">Signal: gelabelte Zielantworten</text>
  <text x="444" y="202" font-size="13" fill="#EDF5F0">Wahl: Full Update, LoRA oder QLoRA</text>
  <text x="444" y="226" font-size="13" fill="#EDF5F0" style="font-size: 11px;">Der Speicherbedarf hängt von Rank und Optimizer ab</text>
  <text x="444" y="250" font-size="12" font-weight="600" fill="#EDF5F0"><tspan x="444">Task-Qualität mit dem Base Model</tspan><tspan x="444" dy="1.2em">vergleichen</tspan></text>

  <line x1="700" y1="181" x2="782" y2="181" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="792" y="92" width="280" height="178" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="816" y="124" font-size="17" font-weight="700" fill="#EDF5F0">3. Alignment</text>
  <text x="816" y="154" font-size="13" fill="#EDF5F0">PPO: Reward Model und Critic</text>
  <text x="816" y="178" font-size="13" fill="#EDF5F0">DPO: Offline-Loss für Präferenzpaare</text>
  <text x="816" y="202" font-size="13" fill="#EDF5F0">GRPO: gruppenrelativer Reward-Baseline</text>
  <text x="816" y="226" font-size="13" fill="#EDF5F0" style="font-size: 11px;">RLVR: Tests oder andere verifizierbare Rewards</text>
  <text x="816" y="250" font-size="12" font-weight="600" fill="#EDF5F0">Task-Qualität und Reward Exploits testen</text>

  <path d="M932 270 V300 H188 V340" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  <text x="560" y="320" text-anchor="middle" font-size="12" fill="#EDF5F0">Ein ausgerichteter Teacher kann Trainingsdaten erzeugen</text>

  <rect x="48" y="340" width="1024" height="120" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="2" class="visual-focus" />
  <text x="72" y="372" font-size="17" font-weight="700" fill="#EDF5F0">Distillation und synthetische Daten</text>

  <rect x="80" y="390" width="220" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="190" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Großer Teacher</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#EDF5F0">DeepSeek-R1 (671B)</text>

  <line x1="300" y1="415" x2="420" y2="415" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="430" y="390" width="260" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="560" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0" style="font-size: 11.5px;">Erzeugen, filtern und Lineage nachverfolgen</text>
  <text x="560" y="430" text-anchor="middle" font-size="12" fill="#EDF5F0">DeepSeek-R1 berichtet 800K Beispiele</text>

  <line x1="690" y1="415" x2="810" y2="415" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="820" y="390" width="220" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="930" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Kompakter Student</text>
  <text x="930" y="430" text-anchor="middle" font-size="12" fill="#EDF5F0">1,5B bis 70B im Paper</text>

  <text x="560" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Den Student für die Zielaufgabe und das Serving-Budget erneut evaluieren</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
