<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rag-title">RAG trennt einen Offline-Ingestion-Pfad vom Online-Pfad für Search, Reranking und Generation.</title><desc id="rag-desc">Die Offline-Pipeline analysiert Raw Documents zu sauberem Text, teilt ihn in Chunks auf, erstellt für jeden Chunk ein Embedding und speichert die Vectors. Zur Query-Zeit speist derselbe Embedder – nach einer optionalen Query-Transformation wie HyDE oder Multi-Query Expansion – eine hybride Dense-plus-BM25-Search über diesen Vector Store. Ein Reranker bewertet die abgerufenen Candidates anhand der Query, und das generative Model beantwortet sie mit dem gererankten Context.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="rag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Ingestion läuft offline; Retrieval und Generation laufen pro Query</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Derselbe Embedder wie bei der Ingestion erstellt das Embedding der Query, sofern sie nicht zuerst transformiert wird.</text>
