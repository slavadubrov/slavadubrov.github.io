<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Roofline Model" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Schematisches Roofline-Modell</title>
  <desc>Ein schematisches Roofline-Modell trennt Memory-Bound-Workloads unterhalb der ansteigenden Bandbreitenobergrenze von Compute-Bound-Workloads an der flachen Compute-Obergrenze. Decode bei Batchgröße 1 liegt im Memory-Bound-Bereich; langes oder gut gebatchtes Prefill kann den Compute-Bound-Bereich erreichen. Positionen nicht maßstabsgetreu.</desc>
  <defs>

    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#141D19" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="720" height="400" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#EDF5F0" x="360">Schematisches Roofline-Modell</text>
  <text y="48" text-anchor="middle" font-size="11" fill="#EDF5F0" x="360">H100 SXM · Sparse TF32 · Positionen nicht maßstabsgetreu</text>

  <!-- Shaded regions -->
  <!-- Memory-bound region (blue tint, left of knee) -->
  <polygon points="90,340 90,88 470,88 470,340" fill="#141D19" opacity="0.5" class="visual-focus" />
  <!-- Compute-bound region (red tint, right of knee) -->
  <polygon points="470,340 470,88 660,88 660,340" fill="#141D19" opacity="0.5" />

  <!-- Region labels at top -->
  <text y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#EDF5F0" opacity="0.7" x="280">MEMORY-BOUND</text>
  <text y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#EDF5F0" opacity="0.7" x="565">COMPUTE-BOUND</text>

  <!-- Axes -->
  <line x1="90" y1="340" x2="670" y2="340" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arr)" />
  <line x1="90" y1="340" x2="90" y2="82" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arr)" />

  <!-- Y-axis label -->
  <text y="210" text-anchor="middle" font-size="11" fill="#EDF5F0" x="22" transform="rotate(-90,22,210)">Performance (TFLOPS)</text>

  <!-- X-axis label -->
  <text y="375" text-anchor="middle" font-size="11" fill="#EDF5F0" x="380">Arithmetische Intensität (FLOPs/Byte, schematisch)</text>

  <!-- ============ THE ROOFLINE ============ -->

  <!-- Memory-bandwidth slope: from bottom-left to knee -->
  <line x1="95" y1="335" x2="470" y2="110" stroke="#EDF5F0" stroke-width="3" stroke-linecap="round" />

  <!-- Compute ceiling: flat from knee to right -->
  <line x1="470" y1="110" x2="660" y2="110" stroke="#EDF5F0" stroke-width="3" stroke-linecap="round" />

  <!-- Line labels along the lines -->
  <text y="260" font-size="11" fill="#EDF5F0" font-weight="bold" x="210" transform="rotate(-31,210,260)">3,35 TB/s Bandbreite</text>
  <text y="103" font-size="11" fill="#EDF5F0" font-weight="bold" x="540">989 Sparse-TF32-TFLOPS Peak</text>

  <!-- Knee point (critical intensity) -->
  <circle cx="470" cy="110" r="5" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <line x1="470" y1="120" x2="470" y2="145" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="3,2" />
  <text y="158" text-anchor="start" font-size="11" font-weight="bold" fill="#EDF5F0" x="482">295 FLOPs/Byte</text>
  <text y="171" text-anchor="start" font-size="11" fill="#EDF5F0" x="482">(kritische Intensität)</text>

  <!-- ============ WORKLOAD DOTS ============ -->

  <!-- Decode (bs=1): intensity ≈ 1 → bottom of slope -->
  <circle cx="140" cy="310" r="9" fill="#1B2621" stroke="#EDF5F0" stroke-width="2" />
  <text y="298" font-size="12" font-weight="bold" fill="#EDF5F0" x="158">Decode</text>
  <text y="312" font-size="11" fill="#EDF5F0" x="158">Batch = 1</text>
  <text y="325" font-size="11" fill="#EDF5F0" x="158">1 FLOP/Byte</text>

  <!-- Long or well-batched prefill can reach the ceiling -->
  <circle cx="530" cy="110" r="9" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#EDF5F0" x="530" style="font-size: 11px;">Langes/gebatchtes Prefill</text>
  <text y="209" text-anchor="middle" font-size="11" fill="#EDF5F0" x="530">Viele Tokens verwenden dieselben Weights wieder</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
