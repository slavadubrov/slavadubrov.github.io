<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Optionen für die Inference-Optimierung</title>
  <desc>Optionen für Kernel, Quantization, Memory, Scheduling, Caching, Speculation und Parallelism lassen sich unabhängig voneinander auswählen – auf Basis eines gemeinsamen, gemessenen Hardware- und Workload-Bottlenecks sowie von Zielen auf Anwendungsebene.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0">Optionen für die Inference-Optimierung</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#EDF5F0">Unabhängig anhand des gemessenen Bottlenecks und des Ziel-SLO auswählen</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#EDF5F0">Hardware-Grundlage</text>
  <text x="80" y="468" font-size="11" fill="#EDF5F0">GPU-Memory-Hierarchie: HBM-Bandbreite und On-Chip-Reuse variieren je nach GPU</text>
  <text x="80" y="483" font-size="11" fill="#EDF5F0">Compute-, Memory- und Communication-Bottleneck auf der Ziel-GPU messen</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#EDF5F0">Kernel-Optimierungen</text>
  <text x="70" y="373" font-size="11" fill="#EDF5F0">FlashAttention (Tiling in SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#EDF5F0">Fused Kernels (weniger HBM-Round-Trips)</text>
  <text x="70" y="398" font-size="11" fill="#EDF5F0">Utilization im deployten Graph profilieren</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#EDF5F0">Quantization</text>
  <text x="470" y="373" font-size="11" fill="#EDF5F0">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#EDF5F0">8-Bit Weights: etwa 50 % weniger Raw Storage als 16-Bit</text>
  <text x="470" y="400" font-size="11" fill="#EDF5F0">4-Bit: etwa 75 % weniger vor Overhead durch Scales und Metadata</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#EDF5F0">Memory-Management</text>
  <text x="70" y="283" font-size="11" fill="#EDF5F0">PagedAttention (blockbasierte KV-Allokation)</text>
  <text x="70" y="298" font-size="11" fill="#EDF5F0">GQA/MQA (8–16× weniger KV cache)</text>
  <text x="70" y="308" font-size="11" fill="#EDF5F0">Veröffentlichte Gains hängen von Workload und Harness ab</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#EDF5F0">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#EDF5F0">Continuous Batching (auf Iterationsebene)</text>
  <text x="470" y="298" font-size="11" fill="#EDF5F0">Chunked Prefill (schützt die Decode-Latency)</text>
  <text x="470" y="308" font-size="11" fill="#EDF5F0">Für Goodput beim Ziel-SLO tunen</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Caching</text>
  <text x="70" y="193" font-size="11" fill="#EDF5F0">Prefix Caching (Hit Rate messen)</text>
  <text x="70" y="208" font-size="11" fill="#EDF5F0">RadixAttention (baumartige KV-Wiederverwendung)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Speculation</text>
  <text x="340" y="193" font-size="11" fill="#EDF5F0">Speculative Decoding (Drafts verifizieren)</text>
  <text x="340" y="208" font-size="11" fill="#EDF5F0">Die Acceptance Rate bestimmt den Gain</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Parallelism</text>
  <text x="620" y="193" font-size="11" fill="#EDF5F0">TP (Intra-Node, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#EDF5F0">PP (Inter-Node) + DP (Scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#EDF5F0">Application Layer</text>
  <text x="80" y="113" font-size="11" fill="#EDF5F0">Model Routing · Token-basiertes Rate Limiting · Monitoring (Goodput, KV-Auslastung, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="11" fill="#EDF5F0">Techniken erst nach Messung ihrer Auswirkungen auf Quality, Latency und Cost kombinieren</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
