<text x="32" y="362" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ein Schema macht die Antwort testbar.</text>
<text x="32" y="384" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Der Anwendungscode entscheidet weiterhin, ob sie wahr und zulässig ist.</text>
