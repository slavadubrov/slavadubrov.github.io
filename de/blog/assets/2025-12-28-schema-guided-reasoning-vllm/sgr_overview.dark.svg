<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="sgro-title sgro-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sgro-title">Was ein schema-geführtes System erzwingt – und was nicht</title><desc id="sgro-desc">Constrained Decoding garantiert die Output-Form. Der Anwendungscode ist separat für die Reihenfolge der Phasen und die semantische Policy zuständig. Jede der drei Ebenen erzwingt einen anderen Satz an Garantien, und nur Decoding ist eine Eigenschaft des Model Calls selbst.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sgro-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="sgro-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="408" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Drei Enforcement-Grenzen, eine Antwort</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Constrained Decoding garantiert die Form. Reihenfolge und Wahrheitsgehalt erfordern weiterhin</tspan><tspan x="32" dy="1.2em">Anwendungscode.</tspan></text>
