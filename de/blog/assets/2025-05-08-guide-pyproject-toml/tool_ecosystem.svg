<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pte-title pte-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="pte-title">Konfigurationskonsumenten rund um pyproject.toml</title>
  <desc id="pte-desc">Eine zentrale pyproject.toml leitet vier Namespaces an vier verschiedene Konsumenten weiter: Build-Einstellungen an Build-Frontends und -Backends, Projektmetadaten an Installer und Resolver, Dependency Groups an Environment Manager und Tool-Einstellungen an das jeweils benannte Tool.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .box { fill: #ffffff; stroke: #59645e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { fill: none; stroke: #59645e; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#f7f7f4" />

  <path class="edge" d="M480 144v40M140 184h680M140 184v48M380 184v48M620 184v48M820 184v48" />
  <path class="edge" d="M140 208v24" marker-end="url(#pte-arrow)" />
  <path class="edge" d="M380 208v24" marker-end="url(#pte-arrow)" />
  <path class="edge" d="M620 208v24" marker-end="url(#pte-arrow)" />
  <path class="edge" d="M820 208v24" marker-end="url(#pte-arrow)" />

  <rect x="304" y="48" width="352" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="324" y="82" fill="#c50e72">GEMEINSAME DATEI</text>
  <text class="name" x="324" y="112" fill="#c50e72">pyproject.toml</text>

  <text class="kind" x="140" y="204" text-anchor="middle">[BUILD-SYSTEM]</text>
  <text class="kind" x="380" y="204" text-anchor="middle">[PROJECT]</text>
  <text class="kind" x="620" y="204" text-anchor="middle">[DEPENDENCY-GROUPS]</text>
  <text class="kind" x="820" y="204" text-anchor="middle">[TOOL.*]</text>

  <rect class="box" x="48" y="232" width="184" height="96" rx="10" />
  <text class="kind" x="64" y="266">BUILD-KONSUMENT</text>
  <text class="name" x="64" y="296">Frontend + Backend</text>
  <text class="note" x="48" y="352">Erzeugt sdist + wheel</text>

  <rect class="box" x="288" y="232" width="184" height="96" rx="10" />
  <text class="kind" x="304" y="266">PACKAGE-KONSUMENT</text>
  <text class="name" x="304" y="296">Installer + Resolver</text>
  <text class="note" x="288" y="352">Wählt eine Umgebung aus</text>

  <rect class="box" x="512" y="232" width="216" height="96" rx="10" />
  <text class="kind" x="528" y="266">LOKALE UMGEBUNG</text>
  <text class="name" x="528" y="296">Environment Manager</text>
  <text class="note" x="512" y="352">Synchronisiert Groups + Lockfile</text>

  <rect class="box" x="768" y="232" width="144" height="96" rx="10" />
  <text class="kind" x="784" y="266">TOOL-KONSUMENT</text>
  <text class="name" x="784" y="296">Benanntes Tool</text>
  <text class="note" x="768" y="352">Nur eigener Namespace</text>

  <text class="note" x="48" y="384">Eine Datei koordiniert die Konsumenten; sie gibt ihren Sections kein gemeinsames Schema.</text>
  <defs>
    <marker id="pte-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
