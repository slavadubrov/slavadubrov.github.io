<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Vier Zuständigkeitsgrenzen in pyproject.toml</title>
  <desc id="desc">Vier Karten unterscheiden build-system für das Build-Backend, project für veröffentlichte Metadaten, dependency-groups für unveröffentlichte Umgebungen und Tool-Namespaces für tool-spezifische Einstellungen.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="650" rx="28" fill="#0f172a" />
  <text x="600" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="700">Eine Datei, vier Zuständigkeiten</text>
  <text x="600" y="104" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">Einstellung anhand ihres Consumers klassifizieren, bevor eine Tabelle gewählt wird</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(70 155)"><rect width="500" height="185" rx="20" fill="#1d4ed8" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[build-system]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Zuständig: Build-Frontend und Build-Backend</text><text x="30" y="124" fill="#93c5fd" font-size="16">Backend-Identität • isolierte Build-Anforderungen</text><text x="30" y="154" fill="#93c5fd" font-size="16">Source Tree → sdist und wheel</text></g>
    <g transform="translate(630 155)"><rect width="500" height="185" rx="20" fill="#5b21b6" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[project]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Zuständig: Package-Consumer</text><text x="30" y="124" fill="#c4b5fd" font-size="16">Identität • Runtime-Anforderungen • Extras</text><text x="30" y="154" fill="#c4b5fd" font-size="16">Als Distribution-Metadaten veröffentlicht</text></g>
    <g transform="translate(70 385)"><rect width="500" height="185" rx="20" fill="#166534" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[dependency-groups]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Zuständig: lokaler Workflow</text><text x="30" y="124" fill="#93c5fd" font-size="16">Tests • Linting • Doku • Nicht-Package-Umgebungen</text><text x="30" y="154" fill="#93c5fd" font-size="16">Nicht in Package-Metadaten veröffentlicht</text></g>
    <g transform="translate(630 385)"><rect width="500" height="185" rx="20" fill="#9a3412" /><text x="30" y="48" fill="#fdba74" font-size="23" font-weight="700">[tool.*]</text><text x="30" y="88" fill="#fdba74" font-size="18">Zuständig: das benannte Tool</text><text x="30" y="124" fill="#fdba74" font-size="16">Vom Tool definierte Keys und Semantik</text><text x="30" y="154" fill="#fdba74" font-size="16">Kein gemeinsames Schema über Namespaces hinweg</text></g>
  </g>
</svg>
