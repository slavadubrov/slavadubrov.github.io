<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ltf-title ltf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ltf-title">Die tödliche Trifecta schafft einen Exfiltrationspfad</title>
  <desc id="ltf-desc">Private Daten, nicht vertrauenswürdiger Content und ein externer Kommunikationskanal laufen zusammen. Verfügt ein Agent über alle drei Fähigkeiten, können nicht vertrauenswürdige Instruktionen private Daten zu einem Angreifer lenken.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="480" rx="14" fill="#0C1210" />

  <rect x="48" y="64" width="256" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="68" y="98">SPEICHER · FÄHIGKEIT 1</text>
  <text class="name" x="68" y="126">Private Daten</text>
  <text class="note" x="68" y="146" style="font-size: 12.5px;">Posteingang · Dokumente · Repositories</text>

  <rect x="656" y="64" width="256" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="676" y="98">EXTERN · FÄHIGKEIT 2</text>
  <text class="name" x="676" y="126" fill="#A8B8AF" style="font-size: 14px;">Nicht vertrauenswürdiger Content</text>
  <text class="note" x="676" y="146">Web · Retrieval · E-Mail</text>

  <rect x="352" y="192" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="372" y="226" fill="#FF6FB6">FOKUS · KOMBINATION</text>
  <text class="name" x="372" y="254" fill="#FF6FB6">Exfiltrationspfad</text>
  <text class="note" x="372" y="274" fill="#FF6FB6">alle drei Fähigkeiten gleichzeitig</text>

  <rect class="box" x="352" y="336" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="370">PROZESS · FÄHIGKEIT 3</text>
  <text class="name" x="372" y="398">Externer Kanal</text>
  <text class="note" x="372" y="418">Nachricht · Bildabruf · Webhook</text>

  <path class="edge" d="M304 112h64a16 16 0 0 1 16 16v56" marker-end="url(#ltf-arrow)" />
  <rect x="314" y="100" width="88" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="358" y="117" text-anchor="middle">kann lesen</text>

  <path class="edge" d="M656 112h-64a16 16 0 0 0-16 16v56" marker-end="url(#ltf-arrow)" />
  <rect x="558" y="100" width="88" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="602" y="117" text-anchor="middle">kann lenken</text>

  <path class="edge" d="M480 336v-40" marker-end="url(#ltf-arrow)" />
  <rect x="492" y="300" width="88" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="536" y="317" text-anchor="middle">kann senden</text>

  <text class="note" x="48" y="456">Entfernt man eine beliebige Fähigkeit, wird dieser direkte Offenlegungspfad unterbrochen.</text>

  <defs>
    <marker id="ltf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
