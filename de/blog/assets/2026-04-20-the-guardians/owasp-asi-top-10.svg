<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asi-title asi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asi-title">OWASP ASI Top 10 gruppiert nach erforderlicher Kontrollgrenze</title>
  <desc id="asi-desc">Goal Hijack und Memory Poisoning sind die beiden Kategorien, zu denen Content-Filter beitragen können. Die anderen acht Kategorien erfordern Systemkontrollen für Tools, Ausführung, Identität, Kommunikation, Supply Chain, kaskadierende Ausfälle, menschliches Vertrauen und Rogue Agents.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#F7F7F4" />

  <rect x="48" y="56" width="280" height="424" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="72" y="88">CONTENT-NAH · 2 VON 10</text>
  <text class="note" x="72" y="112">Filter können hier beitragen.</text>

  <rect x="72" y="144" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="92" y="176">ASI01</text>
  <text class="name" x="92" y="204">Agent Goal Hijack</text>
  <text class="note" x="92" y="224">Umleitung von Instructions</text>

  <rect x="72" y="280" width="232" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="92" y="312">ASI06</text>
  <text class="name" x="92" y="340">Memory Poisoning</text>
  <text class="note" x="92" y="360">RAG und persistenter Kontext</text>

  <text class="note" x="72" y="432">Erfordert weiterhin Autorisierung und</text>
  <text class="note" x="72" y="452">Runtime Enforcement nachgelagert.</text>

  <rect x="368" y="56" width="544" height="424" rx="12" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="392" y="88" fill="#C50E72">FOKUS · SYSTEMKONTROLLEN · 8 VON 10</text>
  <text class="note" x="392" y="112" fill="#C50E72">Kontrollen für Identität, Policies, Isolation, Monitoring und Supply Chain.</text>

  <rect class="box" x="392" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="176">ASI02 + ASI05</text>
  <text class="name" x="412" y="204">Tool Misuse</text>
  <text class="note" x="412" y="224">unerwartete Code-Ausführung</text>

  <rect class="box" x="656" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="176">ASI03 + ASI07</text>
  <text class="name" x="676" y="204">Identity Abuse</text>
  <text class="note" x="676" y="224">unsichere Agent Channels</text>

  <rect class="box" x="392" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="312">ASI04 + ASI08</text>
  <text class="name" x="412" y="340">Supply Chain</text>
  <text class="note" x="412" y="360">kaskadierende Agent-Ausfälle</text>

  <rect class="box" x="656" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="312">ASI09 + ASI10</text>
  <text class="name" x="676" y="340">Menschliches Vertrauen</text>
  <text class="note" x="676" y="360">Rogue Agents und Goal Drift</text>

  <text class="note" x="392" y="432">Diese Fehlerklassen liegen jenseits einer einzelnen</text>
  <text class="note" x="392" y="452">Model-Input- oder Model-Output-Grenze.</text>

  <text class="note" x="48" y="528">OWASP Agentic Security Initiative Top 10 für 2026 · veröffentlicht am 9. Dezember 2025</text>
</svg>
