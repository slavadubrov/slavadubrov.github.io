<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="manifest-dark-title manifest-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="manifest-dark-title">Die Release Unit wächst vom Model Service zum System Manifest</title>
  <desc id="manifest-dark-desc">Ein konventioneller MLOps-Kern verbindet fünf unabhängig veränderliche Komponenten einer LLM-Anwendung: Prompts und Schemas, Retrieval-Zustand, Tools und Berechtigungen, Routing und Budgets sowie Safety Policy. Ein Manifest identifiziert den vollständigen Release.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="520" rx="14" fill="#0C1210" /><text class="kind" x="48" y="44">RELEASE UNIT — JEDE KOMPONENTE, DIE DAS VERHALTEN ÄNDERN KANN</text>
  <rect x="48" y="72" width="288" height="280" rx="12" fill="none" stroke="#2B3B33" /><text class="kind" x="72" y="102">KONVENTIONELLES MLOPS</text>
  <rect class="store" x="72" y="128" width="240" height="96" rx="10" /><text class="kind" x="92" y="162">RELEASE-KERN</text><text class="name" x="92" y="190">Code · Daten · Model</text>
  <rect class="box" x="72" y="248" width="240" height="62" rx="10" /><text class="kind" x="92" y="273">RUNTIME</text><text class="name" x="92" y="298">Serving-Konfiguration</text>
  <rect x="376" y="72" width="696" height="280" rx="12" fill="none" stroke="#2B3B33" /><text class="kind" x="400" y="102">LLM-ANWENDUNGSERWEITERUNGEN</text>
  <rect class="box" x="400" y="128" width="192" height="96" rx="10" /><text class="kind" x="420" y="162">REQUEST</text><text class="name" x="420" y="190">Prompts + Schema</text>
  <rect class="store" x="616" y="128" width="192" height="96" rx="10" /><text class="kind" x="636" y="162">RETRIEVAL</text><text class="name" x="636" y="190">Corpus + Index</text>
  <rect class="box" x="832" y="128" width="216" height="96" rx="10" /><text class="kind" x="852" y="162">AKTION</text><text class="name" x="852" y="190">Tools + Berechtigungen</text>
  <rect class="box" x="508" y="248" width="216" height="62" rx="10" /><text class="kind" x="528" y="273">BEREITSTELLUNG</text><text class="name" x="528" y="298">Routing + Budget</text>
  <rect class="box" x="748" y="248" width="216" height="62" rx="10" /><text class="kind" x="768" y="273">POLICY</text><text class="name" x="768" y="298">Safety + Geschäftsregeln</text>
  <path class="edge" d="M192 352v56h368" /><path class="edge" d="M724 352v56H560" /><path class="edge" d="M560 408v20" marker-end="url(#manifest-dark-arrow)" />
  <rect x="336" y="428" width="448" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="356" y="453" fill="#FF6FB6">SYSTEM MANIFEST</text><text class="name" x="356" y="478" fill="#FF6FB6">Das vollständige System identifizieren und promoten</text>
  <defs><marker id="manifest-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
