<text x="32" y="410" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ein Daumen-hoch ist keine Ground Truth; folgenreiche Fälle benötigen weiterhin Expertenlabels.</text>
