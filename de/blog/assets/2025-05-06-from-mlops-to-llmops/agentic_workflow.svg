<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="trace-title trace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="trace-title">Produktions-Traces werden zu Regressionstests und sichereren Releases</title><desc id="trace-desc">Eine Produktionsanfrage erzeugt einen datenschutzkontrollierten Trace. Beim Triage wird aus einem geprüften Fehler ein gelabelter Regressionsfall, den ein Evaluation Gate vor einer gestaffelten Auslieferung mit dem aktuellen Release vergleicht. Das überwachte Ergebnis schließt den Loop zurück zur Produktion.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="trace-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="trace-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="460" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Traces schließen den Loop zurück zur Produktion</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Aus einem geprüften Fehler wird ein gelabelter Fall und daraus eine Release-Entscheidung.</text>
