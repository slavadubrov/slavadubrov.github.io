<path d="M610 360v-88h40v-40" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#fullmem-arrow-flow)" /><rect x="590.5" y="260" width="79" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="630" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 11px;">zurückgestellt</text>
<path d="M32 504h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Der Abruf aus Cold Memory blockiert das Planning; das Extrahieren und Speichern neuer Fakten nicht.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Das Harness – nicht ein einzelner Store – entscheidet, was tatsächlich das Context Window des Models</tspan><tspan x="32" dy="1.2em">erreicht.</tspan></text>
</svg>
