<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fad-title fad-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fad-title">Hot-, Cold- und Dokument-Memory rund um einen Agent</title>
  <desc id="fad-desc">Eine User-Anfrage erreicht den Agent. Der Agent schreibt und stellt Hot-Checkpoints wieder her, liest vor dem Planen relevante Cold Memories und aktualisiert sie asynchron. Außerdem lädt er Dokument-Memory aus lokalen Dateien und stellt Schreibvorgänge zurück. Durchgezogene Pfade gehören zur Ausführung oder Recovery; gepunktete Pfade sind Background-Updates.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
    .async { stroke-dasharray: 2 6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="external" x="440" y="48" width="240" height="62" rx="10" />
  <text class="kind" x="460" y="72">EXTERN · USER</text>
  <text class="name" x="460" y="96">Anfrage und Antwort</text>

  <rect class="focus" x="400" y="160" width="320" height="96" rx="10" />
  <text class="kind focus-text" x="420" y="194">FOKUS · AGENT HARNESS</text>
  <text class="name focus-text" x="420" y="222">Model Context aufbauen</text>
  <text class="note" x="420" y="242">Reasoning · Planen · Tools aufrufen</text>

  <path class="edge" d="M536 110v42" marker-end="url(#fad-arrow)" />
  <path class="edge" d="M584 160v-42" stroke-dasharray="7 6" marker-end="url(#fad-arrow)" />
  <text class="note" x="476" y="140">Anfrage</text>
  <text class="note" x="598" y="140">Antwort</text>

  <text class="kind" x="48" y="372">HOT PATH · AKTUELLER THREAD</text>
  <rect class="store" x="48" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="426">STORE · CHECKPOINT</text>
  <text class="name" x="68" y="454">PostgreSQL oder Redis</text>
  <text class="note" x="68" y="474">jeder Super-Step · Resume in 1–5 ms</text>

  <text class="kind" x="424" y="372">COLD PATH · THREAD-ÜBERGREIFEND</text>
  <rect class="store" x="424" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="426">STORE · LANGZEIT</text>
  <text class="name" x="444" y="454">Vector oder Key-Value</text>
  <text class="note" x="444" y="474">relevante Fakten · 100–300 ms</text>

  <text class="kind" x="800" y="372">DOKUMENT-PFAD · PROJEKT</text>
  <rect class="store" x="800" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="820" y="426">STORE · DATEIEN</text>
  <text class="name" x="820" y="454">Markdown und JSON</text>
  <text class="note" x="820" y="474">Konventionen und Notizen · 1–5 ms</text>

  <path class="edge" d="M400 184H120V384" marker-end="url(#fad-arrow)" />
  <rect x="176" y="172" width="126" height="20" rx="6" fill="#0C1210" />
  <text class="note" x="239" y="186" text-anchor="middle">Checkpoint schreiben</text>
  <path class="edge" d="M248 392V232H392" marker-end="url(#fad-arrow)" />
  <rect x="279" y="220" width="82" height="20" rx="6" fill="#0C1210" />
  <text class="note" x="320" y="234" text-anchor="middle">wiederherstellen</text>

  <path class="edge" d="M512 392V264" marker-end="url(#fad-arrow)" />
  <rect x="432" y="304" width="78" height="20" rx="6" fill="#0C1210" />
  <text class="note" x="471" y="318" text-anchor="middle">Recall</text>
  <path class="edge async" d="M624 256v128" marker-end="url(#fad-arrow)" />
  <rect x="630" y="304" width="148" height="20" rx="6" fill="#0C1210" />
  <text class="note" x="704" y="318" text-anchor="middle">Background-Update</text>

  <path class="edge" d="M936 392V232H728" marker-end="url(#fad-arrow)" />
  <rect x="783" y="220" width="98" height="20" rx="6" fill="#0C1210" />
  <text class="note" x="832" y="234" text-anchor="middle">Startup-Read</text>
  <path class="edge async" d="M720 184h280v200" marker-end="url(#fad-arrow)" />
  <rect x="828" y="172" width="100" height="20" rx="6" fill="#0C1210" />
  <text class="note" x="878" y="186" text-anchor="middle">Deferred Write</text>

  <path class="edge" d="M48 544h64" marker-end="url(#fad-arrow)" />
  <text class="note" x="128" y="549">Ausführungs- oder Recovery-Pfad</text>
  <path class="edge async" d="M392 544h64" marker-end="url(#fad-arrow)" />
  <text class="note" x="472" y="549">asynchrones Update</text>
  <text class="note" x="48" y="580">Das Harness – nicht die Stores – entscheidet, was den begrenzten Context Window des Models erreicht.</text>

  <defs>
    <marker id="fad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
