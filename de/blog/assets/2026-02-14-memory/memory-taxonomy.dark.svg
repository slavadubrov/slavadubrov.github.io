<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mtd-title mtd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mtd-title">Sechs Agent-Memory-Typen, gruppiert in drei Storage-Tiers</title>
  <desc id="mtd-desc">Hot Memory enthält Working Memory und Short-Term Memory, Cold Memory enthält Episodic Memory und Semantic Memory, und Document Memory speichert Projektwissen. Procedural Memory liegt außerhalb der Storage-Tiers in System Instructions und Tool Definitions. Working Memory ist als Context hervorgehoben, den das Model jetzt verwenden kann.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">HOT TIER · AKTUELLER THREAD</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">FOKUS · WORKING</text>
  <text class="name focus-text" x="92" y="174">Aktueller Context</text>
  <text class="note" x="92" y="194">ein Model-Schritt · nicht persistiert</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">SPEICHER · SHORT-TERM</text>
  <text class="name" x="92" y="310">Thread-Checkpoint</text>
  <text class="note" x="92" y="330" style="font-size: 12px;">Minuten–Stunden · pausieren und fortsetzen</text>
  <text class="note" x="72" y="408"><tspan x="72">Jetzt nutzbar; Checkpoints machen ihn</tspan><tspan x="72" dy="1.2em">wiederherstellbar.</tspan></text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">COLD TIER · THREAD-ÜBERGREIFEND</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">SPEICHER · EPISODIC</text>
  <text class="name" x="444" y="174">Vergangene Interaktionen</text>
  <text class="note" x="444" y="194">Tage–Monate · Ereignisse und Verlauf</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">SPEICHER · SEMANTIC</text>
  <text class="name" x="444" y="310">Fakten und Präferenzen</text>
  <text class="note" x="444" y="330">Monate–dauerhaft · Vector oder KV</text>
  <text class="note" x="424" y="408"><tspan x="424">Abruf per Bedeutung oder Key im nächsten</tspan><tspan x="424" dy="1.2em">Thread.</tspan></text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94">DOCUMENT TIER · PROJEKTWISSEN</text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">SPEICHER · DOCUMENT</text>
  <text class="name" x="796" y="174">Inspizierbare Dateien</text>
  <text class="note" x="796" y="194">Notizen · Research · gelernte Patterns</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="800" y="246">DATEIEN</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Menschenlesbar, editierbar und versioniert.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">EXTERN · PROCEDURAL</text>
  <text class="name" x="420" y="520">System Prompt und Tools</text>
  <text class="note" x="420" y="544"><tspan x="420">Wird mit dem Agent ausgeliefert; kein</tspan><tspan x="420" dy="1.2em">abgerufener Tier.</tspan></text>
</svg>
