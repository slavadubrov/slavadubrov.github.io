<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 968" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="memtax-title memtax-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="memtax-title">Fünf von sechs Agent-Memory-Typen fallen in drei Storage-Tiers zusammen, und Working Memory ist der Bottleneck, in den sie alle einfließen.</title><desc id="memtax-desc">Short-Term Memory wird zu Hot Memory, dem Checkpoint für den aktuellen Thread. Episodic und Semantic Memory werden zu Cold Memory für den Abruf über Threads hinweg. Document Memory hält Projektwissen in Dateien. Procedural Memory liegt außerhalb aller drei Tiers – im System Prompt und in Tool-Definitionen. Working Memory, dem Hot Tier zugeordnet, ist der Kern der Abbildung: das begrenzte Context Window, in das letztlich jedes Tier lädt.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="memtax-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="memtax-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="968" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Sechs Memory-Typen, drei Storage-Tiers</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Working Memory ist der Bottleneck, in den letztlich jedes Tier lädt.</text>
<rect x="32" y="120" width="656" height="176" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="146" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">HOT TIER · AKTUELLER THREAD</text>
<path d="M58 176h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M58 176h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="62" y="193.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCUS · WORKING</text><text x="62" y="237" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Aktueller Kontext</text><text x="62" y="259" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ein Model-Schritt · nicht persistiert</text>
<path d="M374 176h272a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-272a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M374 176h272a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-292a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="378" y="193.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · SHORT-TERM</text><text x="378" y="237" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Thread-Checkpoint</text><text x="378" y="259" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="378">Minuten–Stunden · pausieren und</tspan><tspan x="378" dy="1.2em">fortsetzen</tspan></text>
<rect x="32" y="328" width="656" height="176" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="354" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">COLD TIER · ÜBER THREADS HINWEG</text>
<path d="M58 384h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 384h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · EPISODIC</text><text x="62" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Vergangene Interaktionen</text><text x="62" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tage–Monate · Ereignisse und Verlauf</text>
<path d="M374 384h272a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-272a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M374 384h272a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-292a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="378" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · SEMANTIC</text><text x="378" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Fakten und Präferenzen</text><text x="378" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Monate–permanent · Vektor oder KV</text>
<rect x="32" y="536" width="656" height="176" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="562" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">DOCUMENT TIER · PROJEKTWISSEN</text>
<path d="M58 592h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 592h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="609.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STORE · DOCUMENT</text><text x="62" y="653" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Inspizierbare Dateien</text><text x="62" y="675" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Notizen · Research · gelernte Muster</text>
<path d="M42 744h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 744h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="761.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXTERN · PROCEDURAL</text><text x="46" y="805" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">System Prompt und Tools</text><text x="46" y="827" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">wird mit dem Agent ausgeliefert · nicht abgerufen</text>
<path d="M32 888h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="914" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;">Fünf von sechs Memory-Typen fallen in drei Storage-Tiers zusammen; Procedural Memory wird stattdessen mit dem Agent ausgeliefert.</text>
<text x="32" y="936" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Working Memory ist der Bottleneck: Jedes Tier dient dazu, die richtigen Fakten zur richtigen Zeit dorthin</tspan><tspan x="32" dy="1.2em">zu bringen.</tspan></text>
</svg>
