<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">Das Document-Memory-Verzeichnis enthält vier Themenordner unter einer gemeinsamen Root, und vier Operationen lesen, schreiben, listen und suchen darin.</title><desc id="docmem-desc">Das gemeinsame .agent-memory-Verzeichnis enthält user-profiles, research, conventions und learnings als Markdown-Dateien. Ein kleines File-Memory-Interface stellt vier Operationen bereit, die ihren Zielpfad alle innerhalb derselben Root auflösen: read gibt den Inhalt eines Dokuments zurück, write erstellt oder ersetzt ein Dokument, list findet Pfade anhand eines Glob-Patterns, und search gibt die Absätze zurück, die zu einem Keyword passen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="docmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="docmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="712" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Ein Verzeichnis, vier Operationen</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Jede Operation löst ihren Pfad innerhalb der gemeinsamen Root auf, bevor sie auf die Festplatte zugreift.</text>
