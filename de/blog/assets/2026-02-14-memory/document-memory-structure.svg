<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="dm-title dm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="dm-title">Ein Dokument-Memory-Verzeichnis und seine vier Operationen</title>
  <desc id="dm-desc">Das gemeinsame Verzeichnis .agent-memory enthält Benutzerprofile, Recherche, Konventionen und gelernte Muster als Markdown. Ein Agent liest, schreibt, listet und durchsucht diese Pfade über ein kleines File-Memory-Interface. Das gemeinsame Verzeichnis ist hervorgehoben, weil sowohl Menschen als auch Agents es inspizieren und versionieren können.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="664" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="48" width="480" height="552" rx="12" />
  <text class="kind" x="72" y="76">DOKUMENTBAUM · MENSCHENLESBAR</text>
  <rect class="focus" x="72" y="88" width="432" height="62" rx="10" />
  <text class="kind focus-text" x="92" y="112">FOKUS · GEMEINSAMES VERZEICHNIS</text>
  <text class="name focus-text" x="92" y="136">.agent-memory/</text>

  <path d="M96 150v377M96 221h16M96 323h16M96 425h16M96 527h16" fill="none" stroke="#D8DDD9" stroke-width="1.5" />

  <rect class="store" x="112" y="190" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="214">SPEICHERN · BENUTZERPROFILE</text>
  <text class="name" x="132" y="238">user-profiles/user-123.md</text>

  <rect class="store" x="112" y="292" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="316">SPEICHERN · RECHERCHE</text>
  <text class="name" x="132" y="340">research/NVDA-2026-02.md</text>

  <rect class="store" x="112" y="394" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="418">SPEICHERN · KONVENTIONEN</text>
  <text class="name" x="132" y="442">conventions/analysis-format.md</text>

  <rect class="store" x="112" y="496" width="392" height="62" rx="10" />
  <text class="kind" x="132" y="520">SPEICHERN · LEARNINGS</text>
  <text class="name" x="132" y="544">learnings/common-errors.md</text>

  <rect class="group" x="592" y="48" width="480" height="552" rx="12" />
  <text class="kind" x="616" y="76">FILE MEMORY · VIER OPERATIONEN</text>
  <text class="note" x="616" y="120">Jeder Aufruf benennt einen Pfad oder ein Suchmuster; jedes Ergebnis bleibt inspizierbar.</text>

  <rect class="process" x="616" y="190" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="214">PROZESS · LESEN</text>
  <text class="name" x="636" y="238">Markdown-Inhalt zurückgeben</text>

  <rect class="process" x="616" y="292" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="316">PROZESS · SCHREIBEN</text>
  <text class="name" x="636" y="340">Dokument erstellen oder ersetzen</text>

  <rect class="process" x="616" y="394" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="418">PROZESS · AUFLISTEN</text>
  <text class="name" x="636" y="442">Dokumentpfade abgleichen</text>

  <rect class="process" x="616" y="496" width="432" height="62" rx="10" />
  <text class="kind" x="636" y="520">PROZESS · SUCHEN</text>
  <text class="name" x="636" y="544">Passende Absätze zurückgeben</text>

  <path class="edge" d="M504 119h56v408" />
  <path class="edge" d="M560 221h48" marker-end="url(#dm-arrow)" />
  <path class="edge" d="M560 323h48" marker-end="url(#dm-arrow)" />
  <path class="edge" d="M560 425h48" marker-end="url(#dm-arrow)" />
  <path class="edge" d="M560 527h48" marker-end="url(#dm-arrow)" />
  <text class="note" x="48" y="636">README.md erklärt das Verzeichnis; PROGRESS.md übergibt unerledigte Arbeit an die nächste Model-Session; git erfasst jede Änderung.</text>

  <defs>
    <marker id="dm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
