<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">README.md erklärt das Verzeichnis einer Person; PROGRESS.md übergibt unerledigte Arbeit an die nächste Model-Session.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Git protokolliert jede Änderung, die der Agent hier vornimmt — ein schlechtes Learning ist nur einen Revert vom</tspan><tspan x="32" dy="1.2em">Verschwinden entfernt.</tspan></text>
