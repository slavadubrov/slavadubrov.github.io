<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">Redis- und PostgreSQL-Checkpoint-Backends im Vergleich</title>
  <desc id="rp-desc">Ein direkter Vergleich von Redis und PostgreSQL hinsichtlich Zugriffszeit, Haltbarkeit, Historie, Abfragemodell und operativer Eignung. PostgreSQL wird als dauerhafter Standard hervorgehoben; Redis ist die Latenz-first-Option, wenn der Verlust des jüngsten State wiederherstellbar ist.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .rule { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">STORE · LATENCY FIRST</text>
  <text class="name" x="92" y="136">Redis Checkpoint Saver</text>
  <text class="note" x="92" y="156">Wählen, wenn Resume-Latenz der Bottleneck ist.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">FOCUS · DURABLE DEFAULT</text>
  <text class="name focus-text" x="540" y="136">PostgreSQL Checkpoint Saver</text>
  <text class="note" x="540" y="156" style="font-size: 11px;">Wählen, wenn der Verlust abgeschlossener Arbeit nicht akzeptabel ist.</text>

  <text class="kind" x="72" y="206">ZUGRIFFSZEIT</text>
  <text class="value" x="72" y="230">Unter einer Millisekunde</text>
  <text class="note" x="72" y="250">In-Memory-Lese- und Schreibvorgänge</text>
  <text class="kind" x="520" y="206">ZUGRIFFSZEIT</text>
  <text class="value" x="520" y="230">Niedrige einstellige Millisekundenwerte</text>
  <text class="note" x="520" y="250">Datenbankschreibvorgang an jeder Grenze</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">HALTBARKEIT</text>
  <text class="value" x="72" y="318">Mit AOF oder RDB konfiguriert</text>
  <text class="note" x="72" y="338"><tspan x="72">Jüngste Schreibvorgänge können verloren gehen oder evicted</tspan><tspan x="72" dy="1.2em">werden</tspan></text>
  <text class="kind" x="520" y="294">HALTBARKEIT</text>
  <text class="value" x="520" y="318">ACID-Transaktionen und WAL</text>
  <text class="note" x="520" y="338"><tspan x="520">Checkpoint bleibt nach einem bestätigten Schreibvorgang</tspan><tspan x="520" dy="1.2em">erhalten</tspan></text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">HISTORIE · ABFRAGEMODELL</text>
  <text class="value" x="72" y="406">Retention plus Key-/Search-Indizes</text>
  <text class="note" x="72" y="426">Historie hängt von Saver und Eviction Policy ab</text>
  <text class="kind" x="520" y="382">HISTORIE · ABFRAGEMODELL</text>
  <text class="value" x="520" y="406">Dauerhafte Historie plus SQL und JSONB</text>
  <text class="note" x="520" y="426">Resume, Inspektion und Time-Travel-Debugging</text>

  <text class="note" x="72" y="462"><tspan x="72">Am besten geeignet für: wiederherstellbaren, latenzsensitiven</tspan><tspan x="72" dy="1.2em">Session State.</tspan></text>
  <text class="note" x="520" y="462"><tspan x="520">Am besten geeignet für: lange Tasks und reproduzierbare</tspan><tspan x="520" dy="1.2em">Recovery.</tspan></text>
  <text class="note" x="48" y="510"><tspan x="48">Benchmarken Sie die Größe Ihres serialisierten State und die Schreibfrequenz; generische Datenbank-Benchmarks sagen die Checkpoint-Kosten nicht</tspan><tspan x="48" dy="1.2em">voraus.</tspan></text>
</svg>
