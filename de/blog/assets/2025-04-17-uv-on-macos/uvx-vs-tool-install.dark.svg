<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uvt-title uvt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvt-title">uv run, uvx oder uv tool install wählen</title>
  <desc id="uvt-desc">Wähle die Umgebung nach Sichtbarkeit und Lebensdauer. Verwende uv run für Tools, die den Projektzustand benötigen, uvx für einen isolierten einmaligen Befehl und uv tool install, wenn ein isoliertes Executable dauerhaft im PATH verfügbar sein muss.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#0C1210" />

  <rect x="248" y="48" width="464" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="268" y="72" fill="#FF6FB6">FOKUS · AUSWAHL</text>
  <text class="name" x="268" y="95" fill="#FF6FB6">Was muss das Tool sehen – und wie lange?</text>

  <path class="edge" d="M480 110v42H180v52" marker-end="url(#uvt-arrow)" />
  <path class="edge" d="M480 152v52" marker-end="url(#uvt-arrow)" />
  <path class="edge" d="M480 152h308v52" marker-end="url(#uvt-arrow)" />

  <rect x="100" y="140" width="160" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="180" y="157" text-anchor="middle">Projekt-Imports + Lockfile</text>
  <rect x="408" y="140" width="144" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="480" y="157" text-anchor="middle">nichts Lokales</text>
  <rect x="700" y="140" width="176" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="788" y="157" text-anchor="middle">muss im PATH bleiben</text>

  <rect class="process" x="48" y="208" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="242">PROJEKT · PROZESS</text>
  <text class="name" x="68" y="270">uv run</text>
  <text class="note" x="68" y="290">Repository-Lifecycle · sieht Plugins</text>

  <rect class="process" x="352" y="208" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="242">EPHEMERAL · PROZESS</text>
  <text class="name" x="372" y="270">uvx</text>
  <text class="note" x="372" y="290">isolierter Cache · für CI pinnen</text>

  <rect class="store" x="656" y="208" width="264" height="96" rx="10" />
  <text class="kind" x="676" y="242">PERSISTENT · STORE</text>
  <text class="name" x="676" y="270">uv tool install</text>
  <text class="note" x="676" y="290">isolierte Umgebung · im PATH</text>

  <path d="M48 350h24" stroke="#2B3B33" />
  <text class="note" x="84" y="355">Isolation ist beabsichtigt: Nur der an das Projekt gekoppelte Zweig kann Projektcode importieren.</text>

  <defs>
    <marker id="uvt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
