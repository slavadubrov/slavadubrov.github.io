<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="uveco-title uveco-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="uveco-title">Eine uv-Executable verwaltet vier getrennte Lifecycles.</title><desc id="uveco-desc">uv hält Interpreter-Installationen, Projektstatus, eigenständige PEP-723-Skripte und isolierte CLI-Tools als vier getrennte, unabhängig löschbare Lifecycles unter einer Executable. Homebrew und macOS verwalten weiterhin Host-Anwendungen und native Bibliotheken außerhalb dieser Grenze.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="uveco-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="uveco-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="536" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Eine Executable, vier Lifecycles</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Managed Python, Projekte, Skripte und Tools bleiben in getrennten Grenzen.</text>
