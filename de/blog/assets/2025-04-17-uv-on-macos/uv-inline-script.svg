<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uvi-title uvi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvi-title">Anatomie eines PEP-723-Skripts</title>
  <desc id="uvi-desc">Die Datei fetch.py enthält Inline-Python und Dependency-Metadaten neben normalem Code. uv run liest die Metadaten und erstellt eine isolierte, gecachte Umgebung. Eine optionale benachbarte fetch.py.lock kann eine exakte Auflösung vorgeben. Normales Python ignoriert die Metadaten.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />

  <rect x="48" y="48" width="400" height="368" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="section" x="72" y="76">DATEI · FETCH.PY</text>

  <rect x="72" y="96" width="352" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="92" y="130" fill="#C50E72">FOKUS · PEP-723-METADATEN</text>
  <text class="name" x="92" y="158" fill="#C50E72">Python + Dependencies</text>
  <text class="note" x="92" y="178" fill="#C50E72">requires-python ≥3.12 · httpx ≥0.27,&lt;1</text>

  <rect class="process" x="72" y="232" width="352" height="96" rx="10" />
  <text class="kind" x="92" y="266">CODE · PROZESS</text>
  <text class="name" x="92" y="294">Import + HTTP-Request</text>
  <text class="note" x="92" y="314">normale gültige Python-Syntax</text>

  <path d="M72 368h24" stroke="#D8DDD9" />
  <text class="note" x="108" y="373">Kommentarblock und Code werden gemeinsam ausgeliefert.</text>

  <rect class="process" x="560" y="96" width="352" height="96" rx="10" />
  <text class="kind" x="580" y="130">RUNNER · PROZESS</text>
  <text class="name" x="580" y="158">uv run fetch.py</text>
  <text class="note" x="580" y="178">liest die Metadaten vor der Ausführung</text>

  <rect class="store" x="560" y="232" width="352" height="96" rx="10" />
  <text class="kind" x="580" y="266">UMGEBUNG · STORE</text>
  <text class="name" x="580" y="294">Isolierter Cache</text>
  <text class="note" x="580" y="314">aufgelöster Interpreter + Packages</text>

  <rect class="store" x="560" y="368" width="352" height="62" rx="10" />
  <text class="kind" x="580" y="392">OPTIONALES LOCK · STORE</text>
  <text class="name" x="580" y="415">fetch.py.lock</text>

  <path class="edge" d="M424 144h128" marker-end="url(#uvi-arrow)" />
  <path class="edge" d="M736 192v32" marker-end="url(#uvi-arrow)" />
  <path class="edge" d="M912 399h16V144h-12" stroke-dasharray="7 6" marker-end="url(#uvi-arrow)" />
  <rect x="840" y="204" width="88" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="884" y="221" text-anchor="middle">bei vorhandenem Lock</text>

  <path d="M48 462h24" stroke="#D8DDD9" />
  <text class="note" x="84" y="467">Plain Python ignoriert mit fetch.py die Metadaten; ein kompatibler Runner kontrolliert diese Grenze.</text>

  <defs>
    <marker id="uvi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
