<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="reactpattern-title reactpattern-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reactpattern-title">ReAct liest jedes Tool Result, bevor die nächste Aktion gewählt wird.</title><desc id="reactpattern-desc">Ein Loop von links nach rechts führt Thought, Action und Observation aus. Der Fokus liegt auf dem Observation-Schritt, weil er zur nächsten Thought zurückführt und dem Agent nach jedem Tool Call eine Richtungsänderung ermöglicht – auf Kosten der erneuten Verarbeitung einer wachsenden History bei jedem Durchlauf.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reactpattern-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="reactpattern-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="456" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">ReAct: nach jeder Observation entscheiden</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ein Model Call wählt einen Schritt; neue Evidenz kann den nächsten Schritt ändern.</text>
<rect x="32" y="104" width="656" height="232" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">REACT LOOP · WIEDERHOLT SICH BIS ZUM ABSCHLUSS</text>
<path d="M42 144h182a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-182a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 144h182a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-202a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">MODEL · THOUGHT</text><text x="46" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Nächsten Schritt wählen</text><text x="46" y="227" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="46">aus der aktuellen History</tspan><tspan x="46" dy="1.2em">Reasoning ableiten</tspan></text><circle cx="32" cy="144" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="148.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M268 144h182a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-182a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M268 144h182a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-202a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="272" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TOOL · ACTION</text><text x="272" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Einen Call ausführen</text><text x="272" y="227" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="272">handeln, bevor weiter</tspan><tspan x="272" dy="1.2em">geplant wird</tspan></text><circle cx="258" cy="144" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="258" y="148.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M494 144h182a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-182a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M494 144h182a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-202a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="498" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOKUS · OBSERVATION</text><text x="498" y="205" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Reales Ergebnis lesen</text><text x="498" y="227" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="498">die nächste Thought</tspan><tspan x="498" dy="1.2em">Grounding geben</tspan></text><circle cx="484" cy="144" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="484" y="148.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M234 196h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reactpattern-arrow-flow)" />
<path d="M460 196h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reactpattern-arrow-flow)" />
<path d="M585 248v40H118v-40" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#reactpattern-arrow-flow)" /><rect x="228.5" y="288" width="247" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="352" y="304.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">offen → mit Evidenz wiederholen</text>
<path d="M32 376h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="402" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Trade-off: Jeder Loop verarbeitet die wachsende History erneut, wodurch Latency und Token-Kosten</tspan><tspan x="32" dy="1.2em">steigen.</tspan></text>
</svg>
