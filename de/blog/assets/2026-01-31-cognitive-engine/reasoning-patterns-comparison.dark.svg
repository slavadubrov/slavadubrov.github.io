<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="reasoncompare-title reasoncompare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="reasoncompare-title">ReAct, ReWOO und Plan-and-Execute rufen dieselben Tools auf, legen sich aber zu unterschiedlichen Zeitpunkten auf einen Plan fest.</title><desc id="reasoncompare-desc">Drei Spuren vergleichen den Control Flow und das Timing der Planung. ReAct entscheidet nach jeder Observation – höchste Adaptivität bei wiederholten Model-Aufrufen. ReWOO legt den vollständigen Dependency Graph vor der Ausführung fest – geringste Adaptivität bei den wenigsten Aufrufen. Plan-and-Execute legt einen übergeordneten Plan fest, kann ihn aber an Step Checkpoints überarbeiten – mittlere Adaptivität bei mehr zu verwaltendem State. Nur der Commitment Point unterscheidet sich: ReAct kann nach jedem Result die Richtung ändern, ReWOO nur über Fallback Logic und Plan-and-Execute an Step Checkpoints.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="reasoncompare-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="reasoncompare-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="680" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Gleiche Tools, anderer Commitment Point</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Alle drei rufen dieselben Tools auf; nur wann sich der Plan ändern kann, unterscheidet sich.</text>
