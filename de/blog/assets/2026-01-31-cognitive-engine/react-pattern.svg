<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="react-title react-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="react-title">ReAct liest jedes Tool Result, bevor die nächste Aktion gewählt wird</title>
  <desc id="react-desc">Eine Schleife von links nach rechts durchläuft Thought, Action und Observation. Die Observation wird hervorgehoben, weil sie zur nächsten Thought zurückführt und dem Agent nach jedem Tool Call eine Richtungsänderung ermöglicht.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="960" height="360" rx="14" />
  <text class="note" x="48" y="42">Ein Model Call wählt einen Schritt. Neue Evidenz kann den nächsten Schritt ändern.</text>
  <rect class="process" x="48" y="88" width="240" height="96" rx="10" /><text class="kind" x="68" y="122">MODEL · THOUGHT</text><text class="name" x="68" y="150">Nächsten Schritt wählen</text><text class="note" x="68" y="169">aus der aktuellen History schließen</text>
  <rect class="process" x="360" y="88" width="240" height="96" rx="10" /><text class="kind" x="380" y="122">TOOL · ACTION</text><text class="name" x="380" y="150">Einen Call ausführen</text><text class="note" x="380" y="169">handeln, bevor weiter geplant wird</text>
  <rect class="focus" x="672" y="88" width="240" height="96" rx="10" /><text class="kind focus-kind" x="692" y="122">FOCUS · OBSERVATION</text><text class="name focus-name" x="692" y="150">Reales Ergebnis lesen</text><text class="note" x="692" y="169">die nächste Thought fundieren</text>
  <path class="edge" d="M288 136h64" marker-end="url(#react-arrow)" /><path class="edge" d="M600 136h64" marker-end="url(#react-arrow)" />
  <path class="edge conditional" d="M792 184v56a16 16 0 0 1-16 16H184a16 16 0 0 1-16-16v-48" marker-end="url(#react-arrow)" />
  <rect class="canvas" x="373" y="244" width="214" height="24" rx="6" /><text class="note" x="480" y="261" text-anchor="middle">nicht fertig → mit Evidenz wiederholen</text>
  <text class="note" x="48" y="328">Trade-off: Jede Schleife verarbeitet die wachsende History erneut und erhöht dadurch Latency und Token-Kosten.</text>
  <defs><marker id="react-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
