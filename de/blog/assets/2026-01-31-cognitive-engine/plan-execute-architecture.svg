<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 576" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="arch-title arch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="arch-title">Market Analyst Agent leitet eine Anfrage in zwei Reasoning Loops mit gemeinsamem State</title>
  <desc id="arch-desc">Ein Router sendet Deep Research an einen Planner und ReAct Executor oder ein Flash Briefing an einen ReWOO Planner, Worker und Solver. Die Deep-Research-Route erreicht den Reporter; der ReWOO-Solver schreibt direkt in den gemeinsamen typisierten Agent State.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; } .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; } .decision { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .async { stroke-dasharray: 2 6; } .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="1120" height="576" rx="14" /><text class="section" x="48" y="44">EIN LANGGRAPH · ZWEI ROUTABLE MODES · EIN STATE SCHEMA</text>
  <rect class="external" x="48" y="88" width="176" height="62" rx="10" /><text class="kind" x="68" y="112">EXTERN · ANFRAGE</text><text class="name" x="68" y="136">Marktfrage</text>
  <path class="edge" d="M224 119h40" marker-end="url(#arch-arrow)" />
  <path class="decision" d="M328 71 400 119 328 167 256 119Z" /><text class="kind" x="328" y="110" text-anchor="middle">ROUTER</text><text class="name" x="328" y="134" text-anchor="middle">welcher Loop?</text>
  <rect class="group" x="432" y="64" width="640" height="176" rx="12" /><text class="section" x="456" y="92">DEEP RESEARCH · PLAN-AND-EXECUTE</text>
  <rect class="process" x="456" y="112" width="176" height="96" rx="10" /><text class="kind" x="476" y="146">MODEL · PLANNER</text><text class="name" x="476" y="174" style="font-size: 12.5px;">Research-Plan schreiben</text><text class="note" x="476" y="193">4–6 geordnete Schritte</text>
  <rect class="process" x="664" y="112" width="176" height="96" rx="10" /><text class="kind" x="684" y="146">PROZESS · EXECUTOR</text><text class="name" x="684" y="174" style="font-size: 13.5px;">Schritt-Loop ausführen</text><text class="note" x="684" y="193">ReAct pro Schritt</text>
  <path class="edge conditional" d="M378 103 448 144" marker-end="url(#arch-arrow)" /><rect class="canvas" x="390" y="107" width="52" height="24" rx="6" /><text class="note" x="416" y="124" text-anchor="middle">deep</text><path class="edge" d="M632 160h32" marker-end="url(#arch-arrow)" />
  <rect class="group" x="432" y="272" width="640" height="176" rx="12" /><text class="section" x="456" y="300">FLASH BRIEFING · REWOO</text>
  <rect class="process" x="456" y="320" width="176" height="96" rx="10" /><text class="kind" x="476" y="354">MODEL · PLANNER</text><text class="name" x="476" y="382" style="font-size: 15px;">Tool-Graph schreiben</text><text class="note" x="476" y="401" style="font-size: 12.5px;">#E1 · #E2 · Abhängigkeiten</text>
  <rect class="process" x="664" y="320" width="176" height="96" rx="10" /><text class="kind" x="684" y="354">PROZESS · WORKER</text><text class="name" x="684" y="382">Graph ausführen</text><text class="note" x="684" y="401">parallel, wenn möglich</text>
  <rect class="process" x="872" y="320" width="176" height="96" rx="10" /><text class="kind" x="892" y="354">MODEL · SOLVER</text><text class="name" x="892" y="382" style="font-size: 13.5px;">Ergebnis synthetisieren</text><text class="note" x="892" y="401">ein finaler Call</text>
  <path class="edge conditional" d="M328 167v201h120" marker-end="url(#arch-arrow)" /><rect class="canvas" x="341" y="252" width="54" height="24" rx="6" /><text class="note" x="368" y="269" text-anchor="middle">flash</text><path class="edge" d="M632 368h32" marker-end="url(#arch-arrow)" /><path class="edge" d="M840 368h32" marker-end="url(#arch-arrow)" />
  <rect class="process" x="872" y="112" width="176" height="96" rx="10" /><text class="kind" x="892" y="146">PROZESS · REPORTER</text><text class="name" x="892" y="174" style="font-size: 12.5px;">Report-Entwurf erstellen</text><text class="note" x="892" y="193" style="font-size: 12.5px;">gemeinsamer Output-Pfad</text>
  <path class="edge" d="M840 160h32" marker-end="url(#arch-arrow)" />
  <rect class="focus" x="256" y="480" width="792" height="62" rx="10" /><text class="kind focus-kind" x="280" y="504">FOKUS · GEMEINSAMER TYPISIERTER STATE</text><text class="name focus-name" x="280" y="528">messages · execution_mode · plan · rewoo_plan · research_data · draft_report</text>
  <path class="edge async" d="M544 416v56" marker-end="url(#arch-arrow)" /><path class="edge async" d="M752 416v56" marker-end="url(#arch-arrow)" /><path class="edge async" d="M960 416v56" marker-end="url(#arch-arrow)" /><path class="edge async" d="M1048 160h40v296h-48v16" marker-end="url(#arch-arrow)" />
  <defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
