<text x="32" y="1026" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12.5px;">Das State Schema wird nicht pro Pattern aufgeteilt — Routing ist Conversion-Code, keine drei separaten Schemas.</text>
<text x="32" y="1048" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;">Fresh-Context-Evaluator und Human-in-the-Loop-Gate folgen beiden Routes; hier aus Platzgründen ausgeblendet.</text>
