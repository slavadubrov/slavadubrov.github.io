<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">Ein Router sendet eine Marktfrage in einen von zwei Reasoning Loops, die in denselben typisierten State schreiben.</title><desc id="planexecarch-desc">Ein Router klassifiziert eine Marktfrage als Deep Research oder Flash Briefing. Deep Research verwendet Plan-and-Execute: Ein Planner schreibt 4–6 Schritte, ein Executor führt jeden Schritt als ReAct Loop aus, und ein Reporter erstellt den Berichtsentwurf. Flash Briefing verwendet ReWOO: Ein Planner schreibt einen Tool-Abhängigkeitsgraphen, ein Worker führt ihn aus, und ein Solver synthetisiert ein Ergebnis. Der Reporter und der ReWOO Solver schreiben beide in ein gemeinsames typisiertes State-Objekt; nur die Deep-Research-Route läuft jedoch über den Reporter — der ReWOO Solver schreibt den State direkt.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
