<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Context durch begrenztes Retrieval, Budgetierung, Ausführung und Validierung zusammengestellt</title>
  <desc id="desc">Der vertrauenswürdige Request-State durchläuft Entscheidungsauswahl, autorisiertes Retrieval, nutzenbasierte Budgetierung, Model-Vorschlag, deterministische Validierung und Ausführung sowie anschließend die Aufzeichnung von Provenienz und Ergebnis.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#F7F7F4" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">Context Assembly ist ein Lifecycle pro Entscheidung</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Vertrauenswürdiger Request</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">Akteur, Tenant, Task</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">Locale + Zeit</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Entscheidung auswählen</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">planen, abrufen, handeln</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">oder antworten</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Scope setzen + Retrieval</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">zuerst autorisieren</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">Evidenz ranken</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#59645E" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Budgetieren + zusammenstellen</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">Nutzen, Aktualität</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">Vertrauensgrenzen</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Vorschlagen → validieren → handeln</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#17211B">typisierter Output + Policy</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#17211B">Tool-Postconditions</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Manifest, Provenienz, Validierung und Task-Ergebnis aufzeichnen</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#17211B">Die nächste Entscheidung erhält ein neues Working Set, statt alles zu übernehmen.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#17211B">Ein Model Call ist eine Stufe innerhalb der Context Policy – nicht die Policy selbst.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
