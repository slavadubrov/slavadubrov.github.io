<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Loss-aware Context Compression mit separaten Canonical-State- und Artifact-Index</title>
  <desc id="desc">Conversation und Observations werden zu einem kompakten Working Set zusammengefasst, während Canonical Task State, Evidence-Referenzen und Artifact-Historie separat für die exakte Wiederherstellung gespeichert bleiben.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Prosa komprimieren; wiederherstellbaren State bewahren</text>
  <g font-family="Inter, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#1e293b" stroke="#64748b" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Wachsender Context</text><text x="30" y="83" font-size="13" fill="#cbd5e1">Conversation-Turns</text><text x="30" y="116" font-size="13" fill="#cbd5e1">Rohe Tool-Observations</text><text x="30" y="149" font-size="13" fill="#cbd5e1">Abgerufene Passagen</text><text x="30" y="182" font-size="13" fill="#cbd5e1">Wiederholtes Boilerplate</text></g><text x="325" y="225" font-size="25" fill="#94a3b8">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Kompaktes Working Set</text><text x="30" y="83" font-size="13" fill="#93c5fd">Entscheidungen + nächste Aktion</text><text x="30" y="116" font-size="13" fill="#93c5fd">Typisierte Tool-Findings</text><text x="30" y="149" font-size="13" fill="#93c5fd">Quelle + Artifact-Referenzen</text><text x="30" y="182" font-size="13" fill="#93c5fd">Offene Fragen</text></g><text x="665" y="225" font-size="25" fill="#94a3b8">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Canonical Stores</text><text x="30" y="83" font-size="13" fill="#93c5fd">Task State</text><text x="30" y="116" font-size="13" fill="#93c5fd">Datei- und Artifact-Index</text><text x="30" y="149" font-size="13" fill="#93c5fd">Vollständige Tool Results</text><text x="30" y="182" font-size="13" fill="#93c5fd">Evidence-Versionen</text><text x="30" y="225" font-size="12" fill="#93c5fd">Exakte Details erneut abrufen</text><text x="30" y="247" font-size="12" fill="#93c5fd">wenn die Aufgabe sie benötigt.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">Gesamtzahl der Tokens pro erfolgreicher Aufgabe optimieren, einschließlich erneutem Abruf und Recovery.</text></g>
</svg>
