<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 608" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="memory-title memory-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="memory-title">Das Laden einer Memory ist eine Policy-Entscheidung: Ein Kandidat gelangt erst dann in das Working Set, wenn er jedes Scoping-Gate passiert hat.</title><desc id="memory-desc">Ein Memory-Kandidat – ein expliziter Fakt, eine abgeleitete Hypothese oder ein episodischer Datensatz – muss vier Gates passieren, bevor er in das Working Set gelangt: authentifiziertes Subjekt und Tenant, zulässiger Zweck, Aktualität und Review-Status sowie Relevanz und Autorität. Erfolgreiche Kandidaten behalten ihre Quelle, ihr Ablaufdatum und ihren Löschpfad; nicht erfolgreiche Kandidaten werden ausgeschlossen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="memory-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="memory-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="608" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Memory-Retrieval ist eine Policy-Entscheidung</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Jeder Kandidat passiert vier Gates, bevor er in das Working Set gelangt.</text>
<path d="M42 112h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 112h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">KANDIDAT</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Expliziter Fakt, abgeleitete Hypothese oder episodischer Datensatz</text>
<path d="M360 184v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow-flow)" />
<rect x="32" y="212" width="656" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="360" y="241" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">ENTSCHEIDUNG</text><text x="360" y="265" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Subjekt, Zweck,</text><text x="360" y="287" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Aktualität und Autorität erfüllt?</text>
<path d="M328 308v30h-106v30" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow-flow)" /><rect x="259" y="308" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="280" y="324.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">ja</text>
<path d="M392 308v30h174v30" fill="none" stroke="#FF6FB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#memory-arrow-fail)" /><rect x="422.5" y="308" width="35" height="24" rx="6" fill="#0C1210" stroke="#FF6FB6" stroke-width="1" /><text x="440" y="324.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FF6FB6" text-anchor="middle">nein</text>
<path d="M42 368h360a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-360a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 368h360a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-380a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOKUS</text><text x="46" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Ausgewähltes Working Set</text><text x="46" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Quelle, Ablaufdatum und Löschpfad erhalten</text>
<path d="M454 368h224a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-224a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M454 368h224a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-244a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="458" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">AUSGESCHLOSSEN</text><text x="458" y="439" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kein Gate, keine Aufnahme</text>
<path d="M32 512h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="538" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Behandle abgeleitete Memories als Hypothesen, bis eine autoritative Quelle sie bestätigt.</text>
</svg>
