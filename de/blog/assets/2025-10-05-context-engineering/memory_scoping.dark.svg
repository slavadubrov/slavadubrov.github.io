<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Memory ausgewählt nach Tenant, Zweck, Aktualität und Relevanz</title>
  <desc id="desc">Memory-Kandidaten durchlaufen Prüfungen zu Subjekt- und Tenant-Scope, Zweck, Aktualität und Relevanz. Nur ausgewählte Datensätze gelangen in den Kontext; abgelehnte Datensätze bleiben außerhalb.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="420" rx="22" fill="#0C1210" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">Memory-Retrieval ist eine Policy-Entscheidung</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(40 110)"><rect width="220" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Memory Store</text><text x="28" y="82" font-size="13" fill="#EDF5F0">explizite Nutzerfakten</text><text x="28" y="112" font-size="13" fill="#EDF5F0">abgeleitete Hypothesen</text><text x="28" y="142" font-size="13" fill="#EDF5F0">episodische Datensätze</text><text x="28" y="172" font-size="13" fill="#EDF5F0">Provenance + Lifecycle</text></g><text x="290" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(330 95)"><rect width="330" height="240" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="165" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Auswahl-Gates</text><text x="35" y="82" font-size="13" fill="#EDF5F0">1. authentifiziertes Subjekt + Tenant</text><text x="35" y="116" font-size="13" fill="#EDF5F0">2. zulässiger Zweck</text><text x="35" y="150" font-size="13" fill="#EDF5F0">3. Aktualität und Review-Status</text><text x="35" y="184" font-size="13" fill="#EDF5F0">4. Relevanz und Autorität</text><text x="35" y="218" font-size="12" fill="#EDF5F0">Kein Gate → keine Aufnahme in den Kontext</text></g><text x="690" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(730 110)"><rect width="230" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="115" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Ausgewählte Arbeitsmenge</text><text x="30" y="84" font-size="13" fill="#EDF5F0">minimale nützliche Fakten</text><text x="30" y="116" font-size="13" fill="#EDF5F0">Quelle beibehalten</text><text x="30" y="148" font-size="13" fill="#EDF5F0">Ablaufdatum beibehalten</text><text x="30" y="180" font-size="13" fill="#EDF5F0">Löschung bleibt möglich</text></g><text x="500" y="382" text-anchor="middle" font-size="13" fill="#EDF5F0">Vom Model abgeleitete Memories bleiben Hypothesen, bis eine autoritative Quelle sie bestätigt.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
