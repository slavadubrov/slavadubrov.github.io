<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Provider-spezifische Instruction Channels</title>
  <desc id="artifact-desc">OpenAI dokumentiert Platform- oder System-, Developer- und User-Instruction Authority. Die Anthropic Messages API stellt stattdessen einen system-Parameter auf Top-Level sowie User- und Assistant-Messages bereit. Der Anwendungscode muss die Berechtigungen für beide Provider durchsetzen.</desc>
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
</defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
<rect width="960" height="520" rx="14" fill="#F7F7F4" />

<text y="40" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24px" font-weight="bold" text-anchor="start" x="48">Instruction Priority ist Provider-spezifisch</text>
<text y="64" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13px" text-anchor="start" x="48">Die OpenAI Authority Levels sind unten dargestellt. Diese Role Names definieren keine universelle API.</text>

<!-- 1. System Policy -->
<g transform="translate(80, 92)">
    <rect x="0" y="0" width="450" height="80" rx="6" ry="6" fill="#FFFFFF" stroke="#17211B" stroke-width="2" class="visual-focus" />
    <text y="30" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="20">1. Platform Rules und System Messages</text>
    <text y="55" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="20">Höchstes OpenAI Authority Level im zitierten Model Spec</text>
</g>

<!-- Arrow -->
<line x1="305" y1="172" x2="305" y2="192" stroke="#59645E" stroke-width="2" marker-end="url(#arrow)" />

<!-- 2. Developer Guidelines -->
<g transform="translate(80, 192)">
    <rect x="0" y="0" width="450" height="80" rx="6" ry="6" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
    <text y="30" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="20">2. Developer Instructions</text>
    <text y="55" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="20">Anwendungsverhalten und Output Contract</text>
</g>

<!-- Arrow -->
<line x1="305" y1="272" x2="305" y2="292" stroke="#59645E" stroke-width="2" marker-end="url(#arrow)" />

<!-- 3. User Task -->
<g transform="translate(80, 292)">
    <rect x="0" y="0" width="450" height="80" rx="6" ry="6" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text y="30" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="20">3. User Instructions</text>
    <text y="55" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="20">Die aktuelle Aufgabe, vorbehaltlich übergeordneter Instructions</text>
</g>

<!-- Arrow -->
<line x1="305" y1="372" x2="305" y2="392" stroke="#59645E" stroke-width="2" marker-end="url(#arrow)" />

<!-- Model -->
<g transform="translate(205, 392)">
    <rect x="0" y="0" width="200" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
    <text y="30" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="100">Model Response</text>
</g>

<!-- Side Note -->
<g transform="translate(570, 92)">
    <rect x="0" y="0" width="310" height="280" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
    <text y="34" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="24">Anthropic Messages API</text>
    <text y="64" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">System-Parameter auf Top-Level</text>
    <text y="84" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">User- und Assistant-Messages</text>
    <text y="104" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">Keine gleichwertige Developer Role</text>
    <line x1="24" y1="128" x2="286" y2="128" stroke="#D8DDD9" stroke-width="1.5" />
    <text y="158" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="24">Gemeinsame Enforcement Boundary</text>
    <text y="186" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">Anwendungscode autorisiert Tools,</text>
    <text y="205" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" text-anchor="start" x="24">Datenzugriff und Side Effects.</text>
    <rect x="24" y="226" width="262" height="34" rx="8" fill="#FFFFFF" stroke="#59645E" />
    <text y="248" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="155">Aktuelle Provider-Dokumentation prüfen</text>
</g>

<text y="490" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11px" text-anchor="start" x="48">Quellen: OpenAI Model Spec (2025-02-12) und Anthropic Messages API Reference.</text>

