<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">Die Anweisungsautorität ist anbieterabhängig; eine universelle Rollenhierarchie ist daher ein Fehler. Der Anwendungscode bildet die gemeinsame Durchsetzungsgrenze.</title><desc id="instr-desc">OpenAI’s Model Spec ordnet Platform bzw. System-, Developer- und User-Anweisungen nach ihrer Autorität. Die Anthropic Messages API stellt einen übergeordneten System-Parameter sowie User- und Assistant-Nachrichten bereit, jedoch keine entsprechende Developer-Rolle. Unabhängig von den Rollenbezeichnungen des Anbieters autorisiert der Anwendungscode Tools, Datenzugriff und Seiteneffekte.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="instr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="instr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="670" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Priorität von Anweisungen ist anbieterabhängig</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Rollenbezeichnungen unterscheiden sich je nach Anbieter; die Durchsetzung ist architektonisch, nicht</tspan><tspan x="32" dy="1.2em">textuell.</tspan></text>
<rect x="32" y="112" width="304" height="288" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
