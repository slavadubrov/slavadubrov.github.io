<path d="M32 568h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="594" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ordne deine Richtlinie den dokumentierten Kanälen des Anbieters zu und setze anschließend</text>
<text x="32" y="616" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Berechtigungen und Seiteneffekte im Anwendungscode durch — nicht in der Rollenbezeichnung.</text>
