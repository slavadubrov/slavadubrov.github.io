<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Positionseffekte in Long-Context-Tests</title>
  <desc id="artifact-desc">Eine qualitative Zusammenfassung von „Lost in the Middle“. Die Studie variierte, wo relevante Informationen erschienen, und stellte häufig eine stärkere Task-Performance nahe am Anfang oder Ende fest. Das Ergebnis variierte je nach Model, Task und Context Length und definiert keine universelle Penalty.</desc>
  <style>
    .title{font-size: 24px;font-weight:700;fill: #59645E}.subtitle{font-size: 13px;fill: #F2F2F5}.panel{fill: #ffffff;stroke: #59645E;stroke-width:1.5}.heading{font-size: 15px;font-weight:700;fill: #FFFFFF}.label{font-size: 13px;fill: #59645E}.note{font-size: 12px;fill: #F2F2F5}.axis{stroke: #59645E;stroke-width:1.5}.curve{fill:none;stroke: #17211B;stroke-width:4}.guide{stroke: #D8DDD9;stroke-width:1.5;stroke-dasharray:5 5}.chip{font-size: 12px;font-weight:600}.arrow{stroke: #17211B;stroke-width:2;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#F2F2F5" /></marker></defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="470" rx="14" fill="#F7F7F4" />
  <text x="48" y="48" class="title">Was „Lost in the Middle“ zeigt – und was nicht</text>
  <text x="48" y="72" class="subtitle">Qualitatives Ergebnis von Liu et al. zu Multi-Document-QA und Key-Value-Retrieval</text>

  <rect x="48" y="104" width="560" height="294" rx="12" class="panel visual-focus" />
  <text x="72" y="136" class="heading">Beobachtetes Muster unter vielen getesteten Bedingungen</text>
  <line x1="104" y1="176" x2="104" y2="332" class="axis" />
  <line x1="104" y1="332" x2="560" y2="332" class="axis" />
  <line x1="332" y1="176" x2="332" y2="332" class="guide" />
  <path d="M104 202 C180 202 224 278 332 292 C440 278 484 202 560 202" class="curve" />
  <text x="86" y="180" text-anchor="end" class="note">höher</text>
  <text x="86" y="332" text-anchor="end" class="note">niedriger</text>
  <text x="104" y="356" text-anchor="middle" class="label">Anfang</text>
  <text x="332" y="356" text-anchor="middle" class="label">Mitte</text>
  <text x="560" y="356" text-anchor="middle" class="label">Ende</text>
  <text x="332" y="382" text-anchor="middle" class="note">Position der relevanten Information</text>
  <rect x="130" y="220" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#17211B" />
  <text x="190" y="240" text-anchor="middle" class="chip" fill="#17211B">häufig stärker</text>
  <rect x="414" y="220" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#17211B" />
  <text x="474" y="240" text-anchor="middle" class="chip" fill="#17211B">häufig stärker</text>

  <rect x="632" y="104" width="280" height="294" rx="12" class="panel" />
  <text x="656" y="136" class="heading">Skizze nicht verallgemeinern</text>
  <rect x="656" y="160" width="232" height="54" rx="8" fill="#FFFFFF" stroke="#59645E" />
  <text x="672" y="183" class="label">Keine feste Recall-Penalty</text>
  <text x="672" y="201" class="note">Ergebnisse sind bedingungsspezifisch.</text>
  <rect x="656" y="230" width="232" height="70" rx="8" fill="#FFFFFF" stroke="#59645E" />
  <text x="672" y="253" class="label">Keine universelle Kurve</text>
  <text x="672" y="271" class="note">Model, Task, Sequence Length und</text>
  <text x="672" y="288" class="note">Prompt-Konstruktion verändern sie.</text>
  <rect x="656" y="316" width="232" height="58" rx="8" fill="#FFFFFF" stroke="#59645E" />
  <text x="672" y="339" class="label">Engineering-Maßnahme</text>
  <text x="672" y="357" class="note">Evidenzposition in Evals variieren.</text>
  <text x="48" y="438" class="note">Quelle: Liu et al., „Lost in the Middle“ (2023). Die Linie ist eine qualitative Lehrskizze, keine digitalisierten Paper-Daten.</text>

