<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">Der Lifecycle läuft pro Entscheidung – die Wiederverwendung eines großen Kontexts für einen gesamten Run</text>
<text x="32" y="624" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">erzeugt veraltete Evidenz und gibt jedem Schritt Material, das er nicht benötigt.</text>
