<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="compress-title compress-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="compress-title">Compression trennt ein kompaktes Working Set im Prompt von kanonischen Stores, die außerhalb des Prompts adressierbar bleiben.</title><desc id="compress-desc">Wachsender Kontext — Conversation Turns, Tool Output und abgerufene Passagen — wird in zwei Outputs komprimiert: ein kompaktes Working Set aus Entscheidungen und offenen Fragen, das im Prompt bleibt, sowie kanonische Stores für Task State, Artefakte und Evidence-Versionen, die außerhalb des Prompts adressierbar bleiben und erneut abgerufen werden können.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="compress-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="compress-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="392" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Prosa komprimieren; State adressierbar halten</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tokens pro erfolgreichem Task optimieren</text>
