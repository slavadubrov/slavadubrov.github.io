<path d="M306 112h116a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-116a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M306 112h116a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-136a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="310" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">COMPRESS</text><text x="310" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Komprimieren</text><text x="310" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="310">Verlustbehaftet</tspan><tspan x="310" dy="1.2em">per Design</tspan></text>
<path d="M264 164h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M432 164v-80h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M432 164v56h32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compress-arrow-flow)" />
<path d="M474 32h204a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M474 32h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="478" y="49.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">IM PROMPT</text><text x="478" y="93" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kompaktes Set</text><text x="478" y="115" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Entscheidungen + offene Fragen</text>
<path d="M474 168h204a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M474 168h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="478" y="185.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ADRESSIERBAR</text><text x="478" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Kanonische Stores</text><text x="478" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">State- und Artefakt-Index</text>
<path d="M32 312h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="338" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Tokens pro erfolgreich abgeschlossenem Task optimieren, einschließlich erneutem Abruf und Recovery —</tspan><tspan x="32" dy="1.2em">nicht Tokens pro Request.</tspan></text>
</svg>
