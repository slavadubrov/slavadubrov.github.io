<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="bc-title bc-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="bc-title">Das Wort „Produkt“ hat drei klar abgegrenzte Bedeutungen</title>
  <desc id="bc-desc">Order Management, Billing und Inventory verwalten separate Product-Modelle. Ein hervorgehobener Übersetzungsvertrag ordnet Identifier und Begriffe zwischen den Kontexten zu, ohne ein gemeinsames Objekt zu erzwingen.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { stroke: #17211B; stroke-width: 1.5; fill: #FFFFFF; }
    .group { stroke: #D8DDD9; stroke-width: 1.5; fill: none; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="440" rx="14" fill="#F7F7F4" />
  <rect class="group" x="48" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="68" y="78">ABGEGRENZTER KONTEXT</text>
  <text class="name" x="68" y="104">Order Management</text>
  <rect class="box" x="72" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="92" y="158">MODELL</text>
  <text class="name" x="92" y="184"><tspan x="92">Product =</tspan><tspan x="92" dy="1.2em">Bestellposition</tspan></text>
  <text class="note" x="72" y="252">Menge · Zusage · Status</text>
  <rect class="group" x="352" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="372" y="78">ABGEGRENZTER KONTEXT</text>
  <text class="name" x="372" y="104">Billing</text>
  <rect class="box" x="376" y="128" width="208" height="96" rx="10" fill="#F2F2F5" />
  <text class="kind" x="396" y="158">MODELL</text>
  <text class="name" x="396" y="184"><tspan x="396">Product = bepreiste</tspan><tspan x="396" dy="1.2em">Position</tspan></text>
  <text class="note" x="376" y="252">Steuer · Rabatt · Abrechnung</text>
  <rect class="group" x="656" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="676" y="78">ABGEGRENZTER KONTEXT</text>
  <text class="name" x="676" y="104">Inventory</text>
  <rect class="box" x="680" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="700" y="158">MODELL</text>
  <text class="name" x="700" y="184">Product = Lagerartikel</text>
  <text class="note" x="680" y="252">SKU · Standort · Menge</text>
  <path class="edge" d="M176 288v32M480 288v32M784 288v32" />
  <path class="edge" d="M176 320h608" />
  <path class="edge" d="M480 320v16" marker-end="url(#bc-arrow)" />
  <rect x="256" y="336" width="448" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="276" y="361" fill="#C50E72">FOKUS · VERÖFFENTLICHTER VERTRAG</text>
  <text class="name" x="276" y="384" fill="#C50E72">Begriffe und Identifier übersetzen</text>
  <text class="note" x="48" y="424">Jeder Kontext behält sein eigenes Modell; die Übersetzung erfolgt an der Grenze.</text>
  <defs>
    <marker id="bc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
