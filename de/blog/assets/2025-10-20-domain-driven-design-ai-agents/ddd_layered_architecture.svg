<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="la-title la-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="la-title">DDD-Schichten halten das Model außerhalb der Domäne</title><desc id="la-desc">Ein externes Language Model sendet einen typisierten Vorschlag durch Interface- und Application-Schichten. Die hervorgehobene Domain-Schicht besitzt die Invarianten, während die Infrastructure Persistence-Ports implementiert.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
