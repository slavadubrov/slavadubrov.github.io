<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="di-title di-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="di-title">Vorgesehener Ablauf vom Vorschlag zum festgeschriebenen Zustand</title><desc id="di-desc">Vorgesehener Ablauf: Einen nicht vertrauenswürdigen Vorschlag parsen und normalisieren, den Akteur autorisieren, die Aggregate-Regel durchsetzen und anschließend Zustand und Outbox atomar festschreiben. Fehler beim Parsen, bei der Autorisierung, in den Domain-Regeln oder beim konkurrierenden Speichern brechen den Ablauf ohne Commit ab. Die Artikel-Fragmente lassen die Transaktion aus, die diese Garantie liefern würde.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="di-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="di-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="696" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Vorgesehener Ablauf vom Vorschlag zum festgeschriebenen Zustand</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Die Code-Fragmente lassen die für den atomaren Commit erforderliche Transaktion aus.</text>
