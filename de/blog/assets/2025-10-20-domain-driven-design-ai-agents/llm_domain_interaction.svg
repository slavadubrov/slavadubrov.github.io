<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="di-title di-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="di-title">Ein Model-Vorschlag durchläuft deterministische Domänengrenzen</title><desc id="di-desc">Ein externes Model erzeugt eine nicht vertrauenswürdige AddTaskProposal. Die Anwendung parst und normalisiert sie, autorisiert den Akteur, ruft das hervorgehobene Aggregate zur Durchsetzung von Business-Invarianten auf und committet anschließend State und ein Outbox-Event. Jede der vorherigen Prüfungen kann den Vorschlag weiterhin vor der Persistenz ablehnen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="di-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="di-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="696" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Vom Vorschlag zum committeten State</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Fünf Schritte führen einen Model-Output zu einer Domänenentscheidung; jede Prüfung kann ihn vor der</tspan><tspan x="32" dy="1.2em">Persistenz ablehnen.</tspan></text>
<path d="M42 112h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 112h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">EXTERN · MODEL</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#59645E">AddTaskProposal</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="46">nicht vertrauenswürdige</tspan><tspan x="46" dy="1.2em">Werte</tspan></text><circle cx="32" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M266 112h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M266 112h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="270" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ANWENDUNG</text><text x="270" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" fill="#17211B">Parsen + normalisieren</text><text x="270" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Struktur · Datum · Einheiten</text><circle cx="256" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="256" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M490 112h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M490 112h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="494" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">POLICY</text><text x="494" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Akteur autorisieren</text><text x="494" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Owner · Operation</text><circle cx="480" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="480" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M240 164h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#di-arrow-flow)" />
