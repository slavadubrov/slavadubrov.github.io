<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 742" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="future-fact-title future-fact-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="future-fact-title">Ein zukünftiger Umzug darf in einer Antwort vom 5. Januar nicht die aktuelle Adresse ersetzen</title><desc id="future-fact-desc">Berlin ist vom 1. Januar bis zum 10. Januar gültig. Paris wurde am 3. Januar gemeldet, wird aber erst am 10. Januar gültig. Bei einer Frage zum 5. Januar wählt die Retrieval-Logik fälschlicherweise Paris anhand der neuesten Beobachtung. Die Filterung nach dem halboffenen Gültigkeitsintervall wählt Berlin. Beobachtungszeit und Gültigkeitszeit beantworten unterschiedliche Fragen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="future-fact-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="future-fact-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="742" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Später gemeldet bedeutet nicht jetzt gültig</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Frage: In welcher Stadt befindet sich die Adresse des Benutzers am 5. Januar?</text>
<path d="M58 120h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 120h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">SPEICHERN</text><text x="62" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Berlin</text><text x="62" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Gültig ab 1. Jan.</text><text x="62" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Gültig bis 10. Jan.</text>
<path d="M386 120h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M386 120h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="390" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">SPEICHERN</text><text x="390" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Paris</text><text x="390" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Gemeldet am 3. Jan.</text><text x="390" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Gültig ab 10. Jan.</text>
<rect x="32" y="264" width="312" height="368" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="290" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">BASELINE</text>
<rect x="360" y="264" width="328" height="368" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="376" y="290" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">KANDIDAT</text>
<path d="M58 312h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 312h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="329.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PROZESS</text><text x="62" y="373" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Neueste Beobachtung</text><text x="62" y="395" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Paris wurde später gemeldet</text>
<path d="M386 312h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M386 312h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="390" y="329.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOKUS</text><text x="390" y="373" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Am 5. Jan. gültig?</text><text x="390" y="395" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Start ≤ 5. Jan. &lt; Ende</text>
<path d="M58 512h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 512h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="62" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ERGEBNIS</text><text x="62" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Antwort: Paris</text><text x="62" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Für diese Frage falsch</text>
<path d="M386 512h276a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-276a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M386 512h276a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-296a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="390" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ERGEBNIS</text><text x="390" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Antwort: Berlin</text><text x="390" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Entspricht dem angefragten Datum</text>
<path d="M188 416v96" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#future-fact-arrow-flow)" /><rect x="148.5" y="452" width="79" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="188" y="468.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">ausgewählt</text>
<path d="M524 416v96" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#future-fact-arrow-flow)" /><rect x="484.5" y="452" width="79" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="524" y="468.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle">ausgewählt</text>
<path d="M32 662h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="688" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Beide Datensätze bleiben für historische Abfragen verfügbar. Die Anpassung ändert, welcher</text>
<text x="32" y="710" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Datensatz in den Antwortkontext gelangt, anstatt die zukünftige Tatsache zu löschen.</text>
</svg>
