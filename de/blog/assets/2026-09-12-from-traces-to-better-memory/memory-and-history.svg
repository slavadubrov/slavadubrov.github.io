<path d="M58 432h236a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-236a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 432h236a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-256a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="449.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">STORE</text><text x="62" y="483" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Experiment History</text><text x="62" y="505" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Hypothese, Config, Results</text><text x="62" y="525" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Hashes und Review Records</text>
<path d="M416 484H304" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#two-memories-arrow-flow)" /><rect x="328" y="472" width="64" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="360" y="488.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 11px;">beibehalten</text>
<path d="M58 608h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 608h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="62" y="625.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">EXTERN</text><text x="62" y="669" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E">Nächster Proposer / Human Reviewer</text><text x="62" y="691" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Kann prüfen, warum der Candidate bestanden oder nicht bestanden hat</text>
