<path d="M274 152h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M274 152h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="278" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">LLM AGENT</text><text x="278" y="203" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 16px;">Agent macht Vorschlag</text><text x="278" y="225" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12.5px;">SGR-Entscheidungsdatensatz</text><text x="278" y="245" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Maximal zwei Einstellungen</text>
