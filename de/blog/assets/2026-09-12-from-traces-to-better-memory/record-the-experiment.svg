<text x="32" y="810" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Das Model wählt Vorschläge; der Evaluator bestimmt, was als Verbesserung gilt.</text>
<text x="32" y="832" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Das Memory Tool bleibt deterministisch. Wir wiederholen unabhängige Agent-Kampagnen.</text>
<text x="32" y="854" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Die Auswahl ändert einen experimentellen Parent. Ein Production Release erfordert ein Review.</text>
