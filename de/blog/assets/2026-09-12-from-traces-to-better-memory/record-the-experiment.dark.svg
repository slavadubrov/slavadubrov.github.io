<text x="32" y="810" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Das Model wählt Vorschläge; der Evaluator kontrolliert, was als Verbesserung gilt.</text>
<text x="32" y="832" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Das Memory Tool bleibt deterministisch. Wir wiederholen unabhängige Agent-Kampagnen.</text>
<text x="32" y="854" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Die Auswahl ändert einen experimentellen Parent. Ein Production Release benötigt ein Review.</text>
