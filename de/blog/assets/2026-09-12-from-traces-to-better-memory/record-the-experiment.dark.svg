<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="record-experiment-title record-experiment-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="record-experiment-title">Diese Demo delegiert Vorschläge an einen LLM Agent</title><desc id="record-experiment-desc">Aufgezeichnete Fehler gehen an den Agent. Der Agent schlägt eine SGR-Konfigurationsänderung vor. Python validiert sie, testet das deterministische Memory Tool und vergleicht das Ergebnis. Akzeptierte und abgelehnte Versuche werden zum Feedback für den nächsten Model-Aufruf. Die Auswahl eines Parents für ein weiteres Experiment autorisiert kein Deployment; das Human Release Review bleibt getrennt.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="record-experiment-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="record-experiment-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="880" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Diese Demo: Ein Agent wählt die nächste Änderung</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Der Agent schlägt Settings vor; Python testet sie und gibt Feedback zurück.</text>
