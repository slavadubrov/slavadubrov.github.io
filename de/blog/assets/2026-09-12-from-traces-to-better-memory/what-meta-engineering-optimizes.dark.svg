<text x="32" y="710" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Dies sind sich überschneidende Designentscheidungen. Die Reihenfolge ist keine historische Zeitleiste.</text>
<text x="32" y="732" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Evidenz steuert das nächste Experiment; die Übernahme bleibt eine separate Entscheidung.</text>
