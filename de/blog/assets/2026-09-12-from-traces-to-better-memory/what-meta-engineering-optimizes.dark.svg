<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="what-meta-engineering-optimizes-title what-meta-engineering-optimizes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="what-meta-engineering-optimizes-title">Meta-Engineering optimiert das Gesamtsystem</title><desc id="what-meta-engineering-optimizes-desc">Meta-Engineering wählt Experimente, die Prompt-Formulierungen, Context-Zusammenstellung, Loop-Konfiguration und Graph-Struktur variieren können. Alle vier sind Bestandteile eines einzigen Kandidatensystems. Die Evaluation misst die Ergebnisse dieses Systems und liefert Evidenz für das nächste Experiment. Die vier Bereiche sind sich überschneidende Designentscheidungen, keine historischen Phasen.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="what-meta-engineering-optimizes-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="what-meta-engineering-optimizes-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="744" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Meta-Engineering optimiert das Gesamtsystem</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Prompt-, Context-, Loop- und Graph-Entscheidungen nutzen einen gemeinsamen Experimentprozess.</text>
<path d="M210 120h380a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-380a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M210 120h380a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-400a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="214" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">EXPERIMENTPROZESS</text><text x="214" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Meta-Engineering</text><text x="214" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Änderung wählen · testen · Ergebnis nutzen</text><text x="214" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ziele, Budgets und Freigaben explizit halten</text>
