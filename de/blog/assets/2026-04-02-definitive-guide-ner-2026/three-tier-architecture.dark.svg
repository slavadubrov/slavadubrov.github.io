<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 734" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="tiers-title tiers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tiers-title">Dreistufiges NER-Routing nach Aufgabenform statt nach einem Model-Ranking</title><desc id="tiers-desc">Eine Extraktionsanfrage wird nach ihrer Aufgabenform geroutet: Explizite Spans gehen an Encoder-Modelle in Tier 1, Multi-Task- oder Joint-Relation-Extraction an GLiNER2 oder GLiNER-Relex in Tier 2 und Reasoning-intensive oder Ontology-Mapping-Aufgaben an Schema-Constrained LLMs in Tier 3. Protokollierte Tier-3-Fälle fließen in das nächste Tier-1-Training-Set ein.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tiers-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="tiers-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="734" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Production-NER nach Aufgabenform routen</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Explizite Spans, Joint Tasks und Reasoning-intensive Felder benötigen unterschiedliche Models.</text>
<path d="M42 112h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ANFRAGE</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Extraktionsaufgabe</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Text + erforderliches Schema</text>
<path d="M360 216v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tiers-arrow-flow)" />
<path d="M42 232h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 232h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="249.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOKUS · ROUTER</text><text x="46" y="293" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Nach Aufgabenform routen</text><text x="46" y="315" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Nicht für jede Anfrage ein geranktes Model</text>
<path d="M360 336v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M136 352H584" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M136 352v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tiers-arrow-flow)" />
<path d="M360 352v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tiers-arrow-flow)" />
<path d="M584 352v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tiers-arrow-flow)" />
<path d="M42 368h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 368h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TIER 1 · ENCODER</text><text x="46" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Explizite Spans</text><text x="46" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Cross- oder Bi-Encoder</text>
<path d="M266 368h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M266 368h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="270" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TIER 2 · JOINT</text><text x="270" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Joint Extraction</text><text x="270" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">GLiNER2 oder GLiNER-Relex</text>
<path d="M490 368h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M490 368h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="494" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">TIER 3 · LLM</text><text x="494" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Reasoning-intensiv</text><text x="494" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Schema-Constrained LLM</text>
<path d="M584 472v20H360v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tiers-arrow-flow)" /><rect x="418" y="476" width="108" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="472" y="492.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 11.5px;">protokollierte Fälle</text>
<path d="M42 520h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 520h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">SPEICHER · PROTOKOLLIERTE FÄLLE</text><text x="46" y="575" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">In das nächste Tier-1-Training-Set einspeisen</text>
<path d="M32 632h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Den tatsächlichen Traffic-Split messen; die Tiers beschreiben die Arbeit, nicht einen festen Prozentsatz</tspan><tspan x="32" dy="1.2em">der Anfragen.</tspan></text>
</svg>
