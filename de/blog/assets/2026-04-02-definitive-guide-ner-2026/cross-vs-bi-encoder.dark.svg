<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="cb-title cb-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="cb-title">Cross-Encoder- und Bi-Encoder-Arbeit für ein wiederverwendbares Label-Inventar erforderlich</title>
  <desc id="cb-desc">Ein Cross-Encoder kodiert Labels gemeinsam mit jedem Dokument neu. Ein Bi-Encoder kodiert Labels und Text getrennt, sodass die Label-Embeddings gecacht und wiederverwendet werden können. Der wiederverwendbare Cache steht im Fokus.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .metric { font: 600 15px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="608" rx="14" fill="#0C1210" />
  <defs><marker id="cb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <rect class="group" x="48" y="48" width="412" height="512" rx="12" /><rect class="group" x="500" y="48" width="412" height="512" rx="12" />
  <text class="section" x="72" y="80">CROSS-ENCODER · WIEDERHOLTE ARBEIT</text><text class="section" x="524" y="80">BI-ENCODER · WIEDERVERWENDBARE ARBEIT</text>
  <path class="edge" d="M254 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M254 252v40" marker-end="url(#cb-arrow)" /><path class="edge" d="M594 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M818 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M594 252v40" marker-end="url(#cb-arrow)" /><path class="edge" d="M818 252v16h86v142h-86v18" marker-end="url(#cb-arrow)" /><path class="edge" d="M706 388v40" marker-end="url(#cb-arrow)" />
  <rect class="box" x="72" y="96" width="364" height="62" rx="10" fill="#1B2621" /><text class="kind" x="92" y="121">INPUT</text><text class="name" x="92" y="146">Labels + Text in einer Sequenz</text>
  <rect class="box" x="72" y="190" width="364" height="62" rx="10" fill="#141D19" /><text class="kind" x="92" y="215">PROZESS</text><text class="name" x="92" y="240">Gemeinsame Attention über beide</text>
  <rect class="box" x="72" y="292" width="364" height="96" rx="10" fill="#141D19" /><text class="kind" x="92" y="326">PROZESS</text><text class="name" x="92" y="354">Span × Typ scoren</text><text class="note" x="92" y="376">Jedes Dokument wiederholt die Label-Kodierung.</text>
  <text class="kind" x="72" y="448">BEI 1.024 TYPEN</text><text class="metric" x="72" y="478">10,7 → 0,14 Beispiele/s</text><text class="note" x="72" y="504">gliner_small-v2.5 · 98,7 % Reduktion</text><text class="note" x="72" y="530">Eine H100 · Batch 1 · Paper-Bedingungen</text>
  <rect class="box" x="524" y="96" width="140" height="62" rx="10" fill="#1B2621" /><text class="kind" x="544" y="121">LABELS</text><text class="name" x="544" y="146">Typenliste</text>
  <rect class="box" x="748" y="96" width="140" height="62" rx="10" fill="#1B2621" /><text class="kind" x="768" y="121">TEXT</text><text class="name" x="768" y="146">Dokument</text>
  <rect class="box" x="524" y="190" width="140" height="62" rx="10" fill="#141D19" /><text class="kind" x="544" y="215">PROZESS</text><text class="name" x="544" y="240">Label-Encoder</text>
  <rect class="box" x="748" y="190" width="140" height="62" rx="10" fill="#141D19" /><text class="kind" x="768" y="215">PROZESS</text><text class="name" x="768" y="240">Text-Encoder</text>
  <rect x="524" y="292" width="364" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="548" y="326" fill="#FF6FB6">FOKUS · SPEICHERN</text><text class="name" x="548" y="354" fill="#FF6FB6">Gecachte Label-Embeddings</text><text class="note" x="548" y="376" fill="#FF6FB6">Einmal vorab berechnen; über Dokumente hinweg wiederverwenden.</text>
  <rect class="box" x="524" y="428" width="364" height="62" rx="10" fill="#141D19" /><text class="kind" x="548" y="453">PROZESS</text><text class="name" x="548" y="478">Spätes Span-×-Typ-Scoring</text>
  <text class="kind" x="524" y="524">BEI 1.024 TYPEN</text><text class="metric" x="524" y="550">19,3 → 18,3 Beispiele/s · 5,2 % Reduktion</text><text class="note" x="524" y="578">Vorab berechnet mit gliner-bi-edge-v2.0 · bis zu 130× im Paper</text>
</svg>
