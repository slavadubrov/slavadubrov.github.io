<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="teacherpipe-title teacherpipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="teacherpipe-title">Deployment-Pipeline auf Basis der CFM-Fallstudie zu LLM-as-teacher</title><desc id="teacherpipe-desc">Die CFM-Fallstudie liefert in dieser sechsstufigen Pipeline die grobe Labeling-Methode, Review, Fine-Tuning, Testergebnisse und stündlichen Instance-Preise. Der abschließende Qualitäts- und Gesamtkosten-Check mit Hold-out-Daten sowie die anschließende Deployment-Empfehlung sind empfohlene Schritte und keine beobachteten Deployment-Entscheidungen von CFM.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="teacherpipe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="teacherpipe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="980" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">LLM-as-teacher: empfohlene Deployment-Pipeline</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">CFM liefert die Fallstudie; der abschließende Check und das Deployment sind Empfehlungen.</text>
