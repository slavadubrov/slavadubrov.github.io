<text x="32" y="882" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Zahlen aus der CFM-Fallstudie plus empfohlene Deployment-Schritte.</text>
<text x="32" y="904" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Teacher: 92.7 % F1, $8/Std. berichtet. Encoder: 93.4 % F1, $0.10/Std. berichtet (CPU).</text>
<text x="32" y="926" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">CFM berichtet stündliche Instance-Preise, nicht die Kosten eines deployten Services.</text>
