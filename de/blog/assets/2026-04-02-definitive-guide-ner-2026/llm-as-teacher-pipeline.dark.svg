<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="teacherpipe-title teacherpipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="teacherpipe-title">CFMs LLM-as-teacher Pipeline – von Roh-Headlines zum deployten Encoder</title><desc id="teacherpipe-desc">Sechs geordnete Schritte führen etwa 900.000 ungelabelte Finanz-Headlines durch das Labeling mit dem Llama-3.1-70B-Teacher, die Human Review in Argilla, das Fine-Tuning des Encoders und einen kombinierten Qualitäts- und Kosten-Gate, bevor der Encoder für den Betrieb auf der CPU deployed wird. Die angegebenen Case-Study-Kosten basieren auf stündlichen Instanzpreisen ohne Throughput-Normalisierung.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="teacherpipe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="teacherpipe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="980" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">LLM-as-teacher: von Headlines zum deployten Encoder</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ein Hold-out-Qualitäts- und Gesamtkosten-Gate entscheidet, ob der Encoder ausgeliefert wird.</text>
