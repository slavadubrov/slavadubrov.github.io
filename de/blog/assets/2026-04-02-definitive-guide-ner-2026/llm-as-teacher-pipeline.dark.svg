<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lt-title lt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lt-title">Von LLM-generierten NER-Labels zum deploybaren Encoder</title>
  <desc id="lt-desc">Sechs geordnete Schritte führen von rohen Schlagzeilen über LLM-Labeling, Human Review und Fine-Tuning des Encoders. Ein Quality- und Gesamtkosten-Gate mit zurückgehaltenen Daten entscheidet über das Deployment des Encoders.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .external { stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="536" rx="14" fill="#0C1210" />
  <defs><marker id="lt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <path class="edge" d="M288 112h72" marker-end="url(#lt-arrow)" /><path class="edge" d="M600 112h72" marker-end="url(#lt-arrow)" /><path class="edge" d="M792 160v40" marker-end="url(#lt-arrow)" /><path class="edge" d="M672 248h-72" marker-end="url(#lt-arrow)" /><path class="edge" d="M360 248h-72" marker-end="url(#lt-arrow)" />
  <circle cx="62" cy="48" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="53" text-anchor="middle">1</text><circle cx="374" cy="48" r="14" fill="#EDF5F0" /><text class="marker-num" x="374" y="53" text-anchor="middle">2</text><circle cx="686" cy="48" r="14" fill="#EDF5F0" /><text class="marker-num" x="686" y="53" text-anchor="middle">3</text>
  <circle cx="686" cy="184" r="14" fill="#EDF5F0" /><text class="marker-num" x="686" y="189" text-anchor="middle">4</text><circle cx="374" cy="184" r="14" fill="#EDF5F0" /><text class="marker-num" x="374" y="189" text-anchor="middle">5</text><circle cx="62" cy="184" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="189" text-anchor="middle">6</text>
  <rect class="box" x="48" y="64" width="240" height="96" rx="10" fill="#1B2621" /><text class="kind" x="72" y="98">STORE · QUELLE</text><text class="name" x="72" y="126">~900K Schlagzeilen</text><text class="note" x="72" y="148">Unlabelte Finanznachrichten.</text>
  <rect class="external" x="360" y="64" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="384" y="98">EXTERN · TEACHER</text><text class="name" x="384" y="126">Llama 3.1-70B-Labels</text><text class="note" x="384" y="148">Fallstudie: ~8 Stunden · ~$70.</text>
  <rect class="box" x="672" y="64" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="696" y="98">PROZESS · REVIEW</text><text class="name" x="696" y="126">2.714 Samples prüfen</text><text class="note" x="696" y="148">Argilla · etwa 8 Stunden.</text>
  <rect class="box" x="672" y="200" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="696" y="234">PROZESS · TRAINING</text><text class="name" x="696" y="262">Encoder fine-tunen</text><text class="note" x="696" y="284">GLiNER-medium in der Fallstudie.</text>
  <rect x="360" y="200" width="240" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="384" y="234" fill="#FF6FB6">FOKUS · QUALITY-GATE</text><text class="name" x="384" y="262" fill="#FF6FB6" style="font-size: 11px;">F1 auf zurückgehaltenen Daten + Gesamtkosten</text><text class="note" x="384" y="284" fill="#FF6FB6" style="font-size: 12px;">Nur gemessene Gewinne akzeptieren.</text>
  <rect class="box" x="48" y="200" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="72" y="234">PROZESS · DEPLOYMENT</text><text class="name" x="72" y="262">Auf CPU serven</text><text class="note" x="72" y="284">Berichtet: 93,4 % F1 · $0,10/Std.</text>
  <path d="M48 352h864" stroke="#2B3B33" stroke-width="1" /><text class="kind" x="48" y="388">FALLSTUDIENVERGLEICH · KEIN UNIVERSELLES KOSTENVERHÄLTNIS</text>
  <text class="name" x="48" y="424">Teacher: 92,7 % F1 · berichteter Instanzpreis $8/Std.</text><text class="name" x="48" y="458">Encoder: 93,4 % F1 · berichteter CPU-Instanzpreis $0,10/Std.</text><text class="note" x="48" y="496">Dein Gate muss Labeling, Review, Serving, Retraining und domänenspezifische Qualität umfassen.</text>
</svg>
