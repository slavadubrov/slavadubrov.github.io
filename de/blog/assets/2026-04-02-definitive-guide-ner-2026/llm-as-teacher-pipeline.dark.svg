<text x="32" y="882" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Zahlen aus der CFM-Fallstudie plus empfohlene Deployment-Schritte.</text>
<text x="32" y="904" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Teacher: 92.7 % F1, gemeldet mit $8/Std. Encoder: 93.4 % F1, gemeldet mit $0.10/Std. (CPU).</text>
<text x="32" y="926" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">CFM nennt stündliche Instance-Preise, nicht die Kosten des deployten Service.</text>
