<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="DoRA Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>DoRA-Magnitude- und Richtungsupdate</title>
  <desc>DoRA lernt die Magnituden von Weight-Vektoren separat, während ein normalisiertes Low-Rank-Update ihre Richtungen verändert – mit mehr Flexibilität und Kosten als Standard-LoRA.</desc>
  <defs>


    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F2F2F5" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="500" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="35" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#17211B">DoRA: Weight-Decomposed Low-Rank Adaptation</text>

  <!-- Left side: Standard LoRA -->
  <text x="200" y="70" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17211B">Standard-LoRA</text>

  <!-- Frozen Weight Matrix -->
  <rect x="80" y="90" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="200" y="125" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#17211B">W (eingefroren)</text>
  <text x="200" y="145" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Pre-trained Weights (d × d)</text>

  <!-- Plus sign -->
  <text x="330" y="135" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" fill="#17211B">+</text>

  <!-- LoRA matrices -->
  <rect x="80" y="180" width="100" height="50" rx="4" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="130" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Matrix B (d×r)</text>
  <text x="130" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">trainierbar</text>

  <text x="195" y="210" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">×</text>

  <rect x="220" y="180" width="100" height="50" rx="4" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="270" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Matrix A (r×d)</text>
  <text x="270" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">trainierbar</text>

  <!-- Formula -->
  <text x="200" y="260" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17211B">W' = W + B × A</text>

  <!-- Divider -->
  <line x1="450" y1="70" x2="450" y2="280" stroke="#59645E" stroke-width="2" />

  <!-- Right side: DoRA -->
  <text x="680" y="70" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#17211B">DoRA (Weight Decomposition)</text>

  <!-- Frozen Weight Matrix -->
  <rect x="560" y="90" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="680" y="115" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17211B">W → Magnitude × Direction</text>
  <text x="680" y="132" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">dekomponiert</text>

  <!-- Arrow -->
  <path d="M 680 145 L 680 165" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Magnitude -->
  <rect x="500" y="175" width="130" height="50" rx="4" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="565" y="198" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#17211B">‖W‖ (Magnitude)</text>
  <text x="565" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">trainierbarer Skalar</text>

  <text x="645" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">×</text>

  <!-- Direction -->
  <rect x="670" y="175" width="130" height="50" rx="4" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="735" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">Direction (V)</text>
  <text x="735" y="212" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">V + B×A (LoRA)</text>

  <!-- Formula -->
  <text x="680" y="260" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17211B">W' = m × normalize_c(V + BA)</text>

  <!-- Comparison Box -->
  <rect x="50" y="300" width="800" height="180" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="70" y="330" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B">Was DoRA ändert</text>

  <circle cx="70" cy="360" r="4" fill="#C50E72" />
  <text x="85" y="364" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Reichhaltigere Updates:</text>
  <text x="185" y="364" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Die Trennung von Magnitude und Direction ermöglicht substanziellere Parameteränderungen</text>

  <circle cx="70" cy="390" r="4" fill="#C50E72" />
  <text x="85" y="394" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Evidenz aus dem Paper:</text>
  <text x="185" y="394" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Bessere Ergebnisse als LoRA in mehreren evaluierten Model- und Task-Konfigurationen</text>

  <circle cx="70" cy="420" r="4" fill="#C50E72" />
  <text x="85" y="424" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">Trade-off:</text>
  <text x="155" y="424" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Zusätzliche Magnitude-Parameter und Berechnungen erfordern einen Apples-to-Apples-Benchmark</text>

  <!-- When to use -->
  <rect x="70" y="442" width="760" height="26" rx="4" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="85" y="460" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B">DoRA verwenden, wenn:</text>
  <text x="190" y="460" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Eine Apples-to-Apples-Evaluation genügend Gewinn zeigt, um den zusätzlichen Mechanismus zu rechtfertigen</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
