<text x="32" y="1058" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">PII Detection allein deckt Consent, Retention oder Deletion nicht ab.</text>
<text x="32" y="1080" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Source-Trennung nach dem Cleaning erneut prüfen; alle Überarbeitungen im Training belassen.</text>
