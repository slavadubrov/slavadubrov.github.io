<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="mcpflow-title mcpflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mcpflow-title">Ein Feature-Lookup läuft in sechs Schritten ab: Der Client ermittelt die Server-Tools einmal beim Start, danach überquert jede Frage die MCP-Grenze als neuer tools/call-Request.</title><desc id="mcpflow-desc">Beim Start ermittelt der MCP-Client von Claude Desktop die Tools des Servers, und der Host stellt Claude deren Tool Schemas bereit. Claude kann anschließend get_feature anfordern. Wenn eine Frage Daten aus dem Feature Store benötigt, sendet der Client diese Anfrage als tools/call-Nachricht an FeatureStoreLite, der Server führt get_feature gegen SQLite aus, und das Ergebnis gelangt über den Host zurück zu Claude für die finale Antwort.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mcpflow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="mcpflow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="548" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Sechs Schritte bei einem Feature-Lookup</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Die Ermittlung läuft einmal; danach wiederholt jeder Lookup die letzten drei Schritte.</text>
<text x="32" y="104" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">START · TOOLS ERMITTELN</text>
