<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hal-title">Ein gepaarter Ablationstest zur Fortschrittsübergabe</title><desc id="hal-desc">Ein festgelegtes Model, Task-Set, eine feste Umgebung, ein fester Grader und ein festgelegtes Gesamtbudget speisen zwei gepaarte Runs aus demselben geseedeten Checkpoint der Payment-Migration. Im Control ist die Fortschrittsübergabe deaktiviert, im fokussierten Treatment ausschließlich diese Übergabe aktiviert. Der Vergleich misst doppelte Tool-Aktionen nach dem Resume; die Komponente bleibt nur erhalten, wenn ihr Lift ihre Kosten ausgleicht.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
