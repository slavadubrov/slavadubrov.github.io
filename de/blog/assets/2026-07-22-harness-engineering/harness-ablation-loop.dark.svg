<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hald-title hald-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hald-title">Eine gepaarte Ablation des Progress-Handoffs</title>
  <desc id="hald-desc">Ein festgelegtes Model, Task-Set, Environment, Grader, Budget und ein gesetzter Payment-Migration-Checkpoint speisen zwei gepaarte Varianten. Die Control deaktiviert das Progress-Handoff, die Treatment aktiviert ausschließlich dieses Handoff. Doppelte Aktionen nach dem Resume werden verglichen, und die Komponente bleibt nur erhalten, wenn ihr Lift ihre Kosten ausgleicht.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="704" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">PAIRED ABLATION — ONE VARIABLE MOVES</text><text class="note" x="48" y="60">Beobachteter Fehler: Fortgesetzte Payment-Migrations wiederholen Arbeit, die die vorherige Session bereits abgeschlossen hat.</text>
  <rect class="store" x="48" y="80" width="864" height="62" rx="10" /><text class="kind" x="68" y="105">FIXED</text><text class="name" x="154" y="106">Model · Tasks · Environment · Grader · Gesamtbudget</text><path class="edge" d="M480 142v32" marker-end="url(#hald-arrow)" />
  <rect class="store" x="368" y="182" width="224" height="62" rx="10" /><text class="kind" x="388" y="207">START</text><text class="name" x="388" y="228">Gleicher Checkpoint</text>
  <path class="edge" d="M480 244v24a12 12 0 0 1-12 12H284v28" marker-end="url(#hald-arrow)" /><path class="edge" d="M480 244v24a12 12 0 0 0 12 12h184v28" marker-end="url(#hald-arrow)" />
  <rect class="box" x="144" y="316" width="280" height="96" rx="10" /><text class="kind" x="164" y="350">CONTROL</text><text class="name" x="164" y="378">Handoff deaktiviert</text><text class="note" x="164" y="398">Workspace + Conversation</text>
  <rect x="536" y="316" width="280" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="556" y="350" fill="#FF6FB6">FOCUS · TREATMENT</text><text class="name" x="556" y="378" fill="#FF6FB6">Handoff aktiviert</text><text class="note" x="556" y="398">nur diese Komponente ändert sich</text>
  <path class="edge" d="M284 412v24a12 12 0 0 0 12 12h172v28" marker-end="url(#hald-arrow)" /><path class="edge" d="M676 412v24a12 12 0 0 1-12 12H492v28" marker-end="url(#hald-arrow)" />
  <rect class="box" x="340" y="484" width="280" height="96" rx="10" /><text class="kind" x="360" y="518">MEASURE</text><text class="name" x="360" y="546">Gepaarte Runs vergleichen</text><text class="note" x="360" y="566">doppelte Aktionen · Kosten · Zeit</text><path class="edge" d="M480 580v16" marker-end="url(#hald-arrow)" />
  <path d="M480 604 590 638 480 672 370 638Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="480" y="624" text-anchor="middle">DECISION</text><text class="name" x="480" y="646" text-anchor="middle">Gleicht der Lift die Kosten aus?</text><text class="note" x="154" y="680" text-anchor="middle">NO → REMOVE</text><text class="note" x="806" y="680" text-anchor="middle">YES → KEEP</text><path class="edge" d="M370 638H154" marker-end="url(#hald-arrow)" /><path class="edge" d="M590 638h216" marker-end="url(#hald-arrow)" />
  <defs><marker id="hald-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
