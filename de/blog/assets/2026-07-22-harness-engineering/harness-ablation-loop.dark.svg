<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Beobachteter Fehler: Fortgesetzte Payment-Migrations wiederholen Arbeit, die die vorherige Session</tspan><tspan x="32" dy="1.2em">bereits abgeschlossen hat.</tspan></text>
