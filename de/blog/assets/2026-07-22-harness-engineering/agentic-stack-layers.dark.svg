<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="asl-title asl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="asl-title">Wo jeder Teil der Serie in einem Turn sitzt</title><desc id="asl-desc">Das Model macht einen Vorschlag, und der Reasoning Loop wählt den nächsten Schritt. Im Harness baut die Memory den Context auf, Tool Use definiert den Vertrag, Security steuert Berechtigungen, und der fokussierte Acceptance-Schritt entscheidet, ob Evidence den Run beendet. Der Runtime führt akzeptierte Calls aus und speichert Session-, Sandbox-, Checkpoint- und Trace-State; seine Ergebnisse werden zum Context des nächsten Turns.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="asl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="asl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="850" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Wo jeder Teil der Serie sitzt</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ein Turn, vier Verantwortlichkeiten im Harness.</text>
