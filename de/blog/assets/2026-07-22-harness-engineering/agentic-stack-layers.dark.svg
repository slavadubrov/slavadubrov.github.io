<text x="32" y="770" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Context kommt über die Memory hinein; Verträge und Berechtigungen entscheiden über den Vorschlag.</text>
<text x="32" y="792" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Nur das Acceptance-Gate kann den Run beenden — der Runtime führt aus und speichert, und seine Ergebnisse werden</tspan><tspan x="32" dy="1.2em">zum Context des nächsten Turns.</tspan></text>
