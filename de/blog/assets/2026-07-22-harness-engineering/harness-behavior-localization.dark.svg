<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hbl-title hbl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hbl-title">Eine Verhaltensänderung durch ein Harness-Handbuch routen</title><desc id="hbl-desc">Eine reine Verhaltensanforderung wie das Maskieren von Secrets in jedem Capture-Pfad durchläuft das Handbuch – von der Systemübersicht bis zu quellenbasierten Einträgen. Der fokussierte Schritt prüft jeden möglichen Locator gegen das Live-Repository, bevor der Edit-Plan ausgeführt wird. Ein nicht leerer Diff synchronisiert die Karte neu, damit die nächste Anfrage aktuelle Einträge verwendet.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hbl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="hbl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="900" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Verhaltenslokalisierung, durch ein Handbuch geroutet</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Das Handbuch grenzt die Suche ein. Das Live-Repository entscheidet, was tatsächlich existiert.</text>
<path d="M42 112h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ANFRAGE</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Secrets in jedem Capture-Pfad maskieren</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ein Verhalten, keine Datei</text><circle cx="32" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M272 216v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 248h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 248h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">HANDBUCH</text><text x="46" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Route: Übersicht → Stage → Quelle</text><text x="46" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">grenzt den Suchraum ein</text><circle cx="32" cy="248" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="252.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M272 352v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 384h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 384h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOKUS</text><text x="46" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Locator gegen das Live-Repository prüfen</text><text x="46" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">von ihm benannte Funktionen und Dateien</text><circle cx="32" cy="384" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="388.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M272 488v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 520h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 520h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROZESS</text><text x="46" y="581" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Edit-Plan anwenden</text><text x="46" y="603" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">nur geprüfte Stellen</text><circle cx="32" cy="520" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="524.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M272 624v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 656h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 656h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="673.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">SPEICHER</text><text x="46" y="717" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Verhaltenskarte neu synchronisieren</text><text x="46" y="739" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">nach jedem nicht leeren Diff</text><circle cx="32" cy="656" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="660.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">5</text>
<path d="M512 708H600V300H512" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#hbl-arrow-flow)" /><rect x="568" y="492" width="64" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="600" y="508.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">resync</text>
<path d="M32 800h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="826" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Autoritätsreihenfolge: zuerst die Verhaltenskarte, dann der mögliche Quellcode, dann das Live-Repository.</text>
<text x="32" y="848" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Ein nicht leerer Diff synchronisiert die Karte neu; die nächste Anfrage verwendet aktuelle Einträge.</text>
</svg>
