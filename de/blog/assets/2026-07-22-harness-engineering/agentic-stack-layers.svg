<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 718" width="1120" height="718" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Wo die einzelnen Teile der Reihe „Engineering the Agentic Stack“ einzuordnen sind</title>
  <desc>Ein Stack aus vier Ebenen. Das Model schlägt eine Aktion vor. Der Reasoning Loop aus Teil 1 legt Reihenfolge und Anzahl der Vorschläge fest. Der Harness stellt den Context aus der Memory von Teil 2 zusammen, stellt die Tools aus Teil 3 bereit, wendet die Permission-Regeln aus Teil 4 an und führt die Acceptance Checks sowie Traces aus Teil 6 aus. Der Runtime aus Teil 5 führt akzeptierte Tool Calls aus und verwaltet Session-, Sandbox-, Checkpoint- und Trace-State. Results gehen vom Runtime als Context für den nächsten Turn zurück an das Model.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="718" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Wo die einzelnen Teile der Reihe einzuordnen sind</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Ein Agent Run von oben nach unten: Was entscheidet, was autorisiert und was ausführt.</text>

  <!-- Model -->
  <rect x="110" y="110" width="962" height="62" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="130" y="136" font-size="14" font-weight="700" fill="#0f172a">Model</text>
  <text x="130" y="156" font-size="11" fill="#64748b">Schlägt Text, einen Tool Call oder eine finale Antwort vor. Entscheidet nicht, ob der Call ausgeführt wird.</text>

  <path d="M 591 172 L 591 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />

  <!-- Reasoning loop -->
  <rect x="110" y="202" width="962" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="130" y="228" font-size="14" font-weight="700" fill="#0f172a">Reasoning Loop<tspan font-size="11" font-weight="400" fill="#1d4ed8" dx="10">Teil 1</tspan></text>
  <text x="130" y="248" font-size="11" fill="#64748b">Legt Reihenfolge und Anzahl der Vorschläge fest, bevor der Harness sie sieht.</text>

  <path d="M 591 264 L 591 292" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="283" font-size="11" fill="#64748b">vorgeschlagener Call</text>

  <!-- Harness -->
  <rect x="110" y="294" width="962" height="218" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="130" y="322" font-size="14" font-weight="700" fill="#0f172a">Harness<tspan font-size="11" font-weight="400" fill="#9a3412" dx="10">Teile 2, 3, 4 und 6</tspan></text>
  <text x="130" y="340" font-size="11" fill="#64748b">Das Steuerprogramm zwischen Model und Maschine. Teile 2, 3, 4 und 6 sind die vier folgenden Boxen und laufen als Stufen eines Turns ab.</text>

  <rect x="130" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="376" font-size="13" font-weight="600" fill="#0f172a">Context</text>
  <rect x="146" y="384" width="112" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="202" y="396" font-size="10" fill="#64748b" text-anchor="middle">Teil 2 — Memory</text>
  <text x="146" y="418" font-size="11" fill="#64748b">Welcher vorherige State in diesen Prompt gelangt:</text>
  <text x="146" y="432" font-size="11" fill="#64748b">Recall, Dokumente, Handoff.</text>

  <rect x="442" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="458" y="376" font-size="13" font-weight="600" fill="#0f172a">Tool Contract</text>
  <rect x="458" y="384" width="116" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="516" y="396" font-size="10" fill="#64748b" text-anchor="middle">Teil 3 — Tool Use</text>
  <text x="458" y="418" font-size="11" fill="#64748b">Welche Aktionen existieren und wie ein</text>
  <text x="458" y="432" font-size="11" fill="#64748b">validiertes Result aussieht.</text>

  <rect x="754" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="770" y="376" font-size="13" font-weight="600" fill="#0f172a">Permission</text>
  <rect x="770" y="384" width="118" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="829" y="396" font-size="10" fill="#64748b" text-anchor="middle">Teil 4 — Security</text>
  <text x="770" y="418" font-size="11" fill="#64748b">Ob dieser konkrete Call</text>
  <text x="770" y="432" font-size="11" fill="#64748b">jetzt unbeaufsichtigt ausgeführt werden darf.</text>

  <rect x="130" y="454" width="922" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="146" y="472" font-size="13" font-weight="600" fill="#0f172a">Acceptance Checks, Traces, Retries und Handoffs<tspan font-size="11" font-weight="400" fill="#166534" dx="10">Teil 6</tspan></text>
  <text x="146" y="489" font-size="11" fill="#64748b">Liest die Evidence und entscheidet, ob der Run beendet ist, fortgesetzt oder eskaliert wird. Das Model hat dabei kein Stimmrecht.</text>

  <path d="M 591 512 L 591 540" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="531" font-size="11" fill="#64748b">akzeptierter Call</text>

  <!-- Runtime -->
  <rect x="110" y="542" width="962" height="128" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="130" y="570" font-size="14" font-weight="700" fill="#0f172a">Runtime<tspan font-size="11" font-weight="400" fill="#334155" dx="10">Teil 5</tspan></text>
  <text x="130" y="588" font-size="11" fill="#64748b">Führt akzeptierte Calls aus und hält State außerhalb des Worker-Prozesses persistent. Diese vier Primitives speichern und isolieren; sie entscheiden nie.</text>

  <rect x="130" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="622" font-size="13" font-weight="600" fill="#0f172a">Session</text>
  <text x="146" y="640" font-size="11" fill="#64748b">Append-only Run-Log</text>

  <rect x="364" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="380" y="622" font-size="13" font-weight="600" fill="#0f172a">Sandbox</text>
  <text x="380" y="640" font-size="11" fill="#64748b">Isolierte Ausführung</text>

  <rect x="598" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="614" y="622" font-size="13" font-weight="600" fill="#0f172a">Checkpoint</text>
  <text x="614" y="640" font-size="11" fill="#64748b">Wiederaufnahmepunkt</text>

  <rect x="832" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="848" y="622" font-size="13" font-weight="600" fill="#0f172a">Trace</text>
  <text x="848" y="640" font-size="11" fill="#64748b">Nachträgliche Evidence</text>

  <!-- Return path -->
  <path d="M 110 606 L 76 606 L 76 141 L 106 141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="62" y="374" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 62 374)">Results und Traces werden zum Context des nächsten Turns</text>
</svg>
