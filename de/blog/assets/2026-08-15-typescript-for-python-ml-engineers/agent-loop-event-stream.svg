<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 736" width="1120" height="736" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Ein Durchlauf eines handgeschriebenen Agent Loops und der daraus entstehende Event-Stream</title>
  <desc>Ein einzelner Loop-Schritt von links nach rechts. Das Model streamt Chunks über Chat Completions. Fragmente eines Tool Calls enthalten in jedem Fragment nur ein Index-Feld, daher sammelt der Loop sie anhand des Index zu vollständigen Calls. Jeder zusammengesetzte Call durchläuft JSON.parse und anschließend die Zod-Validierung. Ein Fehler in einem der beiden Schritte wird als Tool Message mit Fehlerbeschreibung behandelt, nicht als geworfene Exception; der Loop läuft weiter. Ein erfolgreicher Call führt das Tool aus, und das Ergebnis wird vor dem nächsten Schritt als Tool Message an das Message-Array angehängt. Der Loop liefert typisierte AgentEvent-Werte aus einem asynchronen Generator. Die HTTP-Route konsumiert den Generator, sendet Server-Sent Event-Frames, sammelt den Text und schreibt den finalen Text nach dem Stream in den Storage. Tests konsumieren den Generator separat und sammeln seine Events.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="736" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Ein Loop-Schritt und was er liefert</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Alles innerhalb der gestrichelten Begrenzung ist Code, den ein Framework für dich schreibt. Der Event-Stream macht das Ganze testbar.</text>

  <!-- Boundary of the hand-written loop -->
  <rect x="48" y="104" width="1024" height="368" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="68" y="130" font-size="14" font-weight="700" fill="#0f172a">runAgent — ein Schritt</text>
  <text x="68" y="148" font-size="11" fill="#64748b">packages/agent-core/src/loop.ts</text>

  <!-- Model -->
  <rect x="68" y="168" width="182" height="94" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="86" y="194" font-size="13" font-weight="600" fill="#0f172a">Model</text>
  <text x="86" y="214" font-size="11" fill="#64748b">POST /chat/completions</text>
  <text x="86" y="230" font-size="11" fill="#64748b">stream: true</text>
  <text x="86" y="250" font-size="11" fill="#5b21b6">OpenAI, vLLM, Ollama</text>

  <path d="M 250 215 L 292 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="256" y="205" font-size="10" fill="#64748b">Chunks</text>

  <!-- Accumulate -->
  <rect x="300" y="168" width="212" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="318" y="194" font-size="13" font-weight="600" fill="#0f172a">Nach Index akkumulieren</text>
  <text x="318" y="214" font-size="11" fill="#64748b">id und name kommen einmal;</text>
  <text x="318" y="230" font-size="11" fill="#64748b">arguments kommen stückweise</text>
  <text x="318" y="250" font-size="11" fill="#1d4ed8">Nur der Index steht in jedem Fragment</text>

  <path d="M 512 215 L 554 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="533" y="203" text-anchor="middle" font-size="10" fill="#64748b">Call</text>

  <!-- Validate -->
  <rect x="562" y="168" width="204" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="580" y="194" font-size="13" font-weight="600" fill="#0f172a">JSON.parse, dann Zod</text>
  <text x="580" y="214" font-size="11" fill="#64748b">Models erzeugen fehlerhaftes JSON</text>
  <text x="580" y="230" font-size="11" fill="#64748b">und Arguments außerhalb des zulässigen Bereichs</text>
  <text x="580" y="250" font-size="11" fill="#1d4ed8">Beides ist erwartbar, kein Ausnahmefall</text>

  <!-- Execute -->
  <path d="M 766 200 L 812 200" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <text x="770" y="192" font-size="10" fill="#166534">gültig</text>
  <rect x="820" y="168" width="232" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="838" y="192" font-size="13" font-weight="600" fill="#0f172a">Tool ausführen</text>
  <text x="838" y="212" font-size="11" fill="#166534">Ergebnis wird in eine Tool Message serialisiert</text>

  <!-- Repair path -->
  <path d="M 664 262 L 664 300 L 812 300" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <text x="676" y="292" font-size="10" fill="#991b1b">ungültig</text>
  <rect x="820" y="268" width="232" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="838" y="292" font-size="13" font-weight="600" fill="#0f172a">Fehler beschreiben</text>
  <text x="838" y="312" font-size="11" fill="#991b1b">Das Model liest ihn und versucht es erneut</text>

  <!-- Append + loop back -->
  <rect x="300" y="348" width="466" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="318" y="372" font-size="13" font-weight="600" fill="#0f172a">Assistant- und Tool Messages anhängen, dann wiederholen</text>
  <text x="318" y="392" font-size="11" fill="#64748b">Das Message-Array ist das gesamte Agent Memory dieses Runs</text>

  <path d="M 850 228 L 850 244 L 792 244 L 792 378 L 774 378" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <path d="M 936 328 L 936 378 L 800 378" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <path d="M 292 378 L 200 378 L 200 270" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="204" y="336" font-size="10" fill="#64748b">nächster Schritt</text>

  <text x="68" y="440" font-size="11" fill="#64748b">Abbruchbedingung: eine Antwort ohne Tool Calls oder das Step-Limit. Beides beendet den Run; nur eines davon ist ein Erfolg.</text>

  <!-- Event stream -->
  <rect x="48" y="496" width="1024" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="68" y="522" font-size="14" font-weight="700" fill="#0f172a">yield: AgentEvent</text>
  <text x="68" y="542" font-size="11" fill="#64748b">Eine diskriminierte Union, die aus einem asynchronen Generator geliefert wird — das Gegenstück zu Pythons async def mit yield.</text>
  <text x="68" y="560" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#1d4ed8">text | tool_call | tool_result | done | error</text>

  <path d="M 240 572 L 240 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <path d="M 560 572 L 560 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />

  <rect x="88" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="108" y="640" font-size="13" font-weight="600" fill="#0f172a">HTTP-Route</text>
  <text x="108" y="660" font-size="11" fill="#64748b">Ein SSE-Frame pro Event</text>
  <text x="108" y="676" font-size="11" fill="#64748b">apps/api/src/app.ts</text>

  <rect x="408" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="428" y="640" font-size="13" font-weight="600" fill="#0f172a">Test</text>
  <text x="428" y="660" font-size="11" fill="#64748b">Sammelt die Events in einem Array</text>
  <text x="428" y="676" font-size="11" fill="#64748b">Kein Netzwerk, kein API Key</text>

  <rect x="728" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="748" y="640" font-size="13" font-weight="600" fill="#0f172a">Storage</text>
  <text x="748" y="660" font-size="11" fill="#64748b">Schreibt den finalen Text einmalig</text>
  <text x="748" y="676" font-size="11" fill="#64748b">Wird von der Route nach dem Stream aufgerufen</text>

  <path d="M 240 688 L 240 712 L 880 712 L 880 688" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <rect x="493" y="702" width="134" height="18" rx="9" fill="#f8fafc" />
  <text x="560" y="715" text-anchor="middle" font-size="10" fill="#64748b">finaler Text nach dem Stream</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>
</svg>
