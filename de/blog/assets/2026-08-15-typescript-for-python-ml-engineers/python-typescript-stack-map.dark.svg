<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="stack-title">Python-Service-Tools auf TypeScript abgebildet</title>
  <desc id="stack-desc">Sechs übliche Substitutionen ordnen Python-Projekt-, Paket-, HTTP-, SQL-, Test- und Linting-Tools ihren TypeScript-Entsprechungen zu. Ein hervorgehobenes Panel nennt die drei Substitutionen, die die Semantik ändern: Pydantic zu Zod, Celery und Redis zu einer Postgres Queue sowie mypy zum TypeScript Compiler.</desc>
