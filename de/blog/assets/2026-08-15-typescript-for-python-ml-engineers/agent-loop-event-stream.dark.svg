<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Tests sammeln Events direkt; die HTTP-Route rahmt sie als SSE und persistiert erst nach</text>
