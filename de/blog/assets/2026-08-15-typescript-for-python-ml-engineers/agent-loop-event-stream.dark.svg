<text x="32" y="806" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ein abgeschlossenes, aber abgeschnittenes Ergebnis.</text>
