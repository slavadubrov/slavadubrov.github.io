<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="loop-title">Ein handgeschriebener Agent Loop stellt einen typisierten Event-Stream bereit</title><desc id="loop-desc">Ein Model streamt Chunks in einen Fragment-Buffer. Der Loop setzt Calls zusammen, parst und validiert sie, führt gültige Tools aus und hängt Tool Messages vor dem nächsten Schritt an die Message History an. Ungültige Eingaben werden als Tool Error in derselben History erfasst, statt den Loop zu beenden. Der fokussierte asynchrone AgentEvent-Generator versorgt die HTTP-Route und Tests. Nach dem Streaming schreibt die HTTP-Route das finale Run-Ergebnis.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="loop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="loop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="840" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Ein Loop-Schritt, dann ein stabiles Interface</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Die Reparatur bleibt innerhalb des Loops. Consumers sehen typisierte Events statt Chunks des</tspan><tspan x="32" dy="1.2em">Model-Providers.</tspan></text>
