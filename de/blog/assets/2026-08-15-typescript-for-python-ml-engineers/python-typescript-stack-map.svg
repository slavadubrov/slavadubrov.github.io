<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Die meisten Tools nehmen denselben Platz ein. Im fokussierten Panel endet die Python-Intuition</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">und lässt sich nicht mehr sauber übertragen.</text>
