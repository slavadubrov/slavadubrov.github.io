<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="jcl-title jcl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="jcl-title">Judge-Kalibrierungsschleife</title>
  <desc id="jcl-desc">Menschliche Labels bilden die Grundlage für eine Rubrik und eine fixierte Judge-Version. Ein Agreement-Gate misst Kappa und die False-Pass-Rate; Bias Checks und Drift Monitoring schicken schwache Judges zur Rubrik-Überarbeitung zurück.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="416" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="40">DEN JUDGE ALS MESSINSTRUMENT KALIBRIEREN</text>

  <rect class="store" x="48" y="72" width="240" height="96" rx="10" />
  <text class="kind" x="68" y="106">KALIBRIERUNGSSET</text><text class="name" x="68" y="134">Menschliche Labels</text>
  <rect class="box" x="360" y="72" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="106">RUBRIK</text><text class="name" x="380" y="134">Atomare Kriterien</text>
  <rect class="store" x="672" y="72" width="240" height="96" rx="10" />
  <text class="kind" x="692" y="106">JUDGE-VERSION</text><text class="name" x="692" y="134">Model + Prompt</text>
  <path class="edge" d="M288 120h64" marker-end="url(#jcl-arrow)" /><path class="edge" d="M600 120h64" marker-end="url(#jcl-arrow)" />

  <path class="edge" d="M792 168v56" marker-end="url(#jcl-arrow)" />
  <rect x="672" y="232" width="240" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="692" y="266" fill="#FF6FB6">FOKUS · AGREEMENT</text><text class="name" x="692" y="294" fill="#FF6FB6">Kappa + Fehlerraten</text>
  <rect class="box" x="360" y="232" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="266">BIAS CHECKS</text><text class="name" x="380" y="294">Reihenfolge · Länge · Familie</text>
  <rect class="store" x="48" y="232" width="240" height="96" rx="10" />
  <text class="kind" x="68" y="266">DRIFT MONITORING</text><text class="name" x="68" y="294">Bei jeder Änderung erneut prüfen</text>
  <path class="edge" d="M672 280h-64" marker-end="url(#jcl-arrow)" /><path class="edge" d="M360 280h-64" marker-end="url(#jcl-arrow)" />
  <path class="edge" d="M168 232v-32h312v-24" stroke-dasharray="7 6" marker-end="url(#jcl-arrow)" />
  <rect x="264" y="188" width="168" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="348" y="205" text-anchor="middle">Überarbeiten und erneut kalibrieren</text>
  <text class="note" x="48" y="376">Eine Promotion erfordert Agreement bei von Menschen gelabelten Traces, nicht lediglich ein Schema-valides Verdict.</text>
  <defs><marker id="jcl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
