<text x="32" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Guardrails schützen vor der Auslieferung; Online-Evals messen danach.</text>
<text x="32" y="544" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Ein inline ausgeführter Judge erhöht die Latency; ein auf Async verschobener Guardrail lässt Verstöße</tspan><tspan x="32" dy="1.2em">durch.</tspan></text>
</svg>
