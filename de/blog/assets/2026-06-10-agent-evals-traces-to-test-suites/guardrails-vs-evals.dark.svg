<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="guardev-title guardev-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="guardev-title">Guardrails versus Online-Evals</title><desc id="guardev-desc">Ein Guardrail läuft inline im Request-Pfad und kann die Response blockieren, bevor sie den User erreicht. Ein gesampelter Trace wird außerdem an eine asynchrone Online-Evaluation weitergeleitet, die ihn bewertet, bei Fehler-Clustern alarmiert und einen neuen Golden Case hinzufügen kann – ohne die Response zu verzögern.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="guardev-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="guardev-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="600" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Zwei Lanes, unterschiedliche Platzierung</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Request-Pfad: Millisekunden, kann blockieren.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Beobachtungspfad: Sekunden bis Minuten, blockiert nie.</text>
<rect x="32" y="104" width="656" height="148" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="132" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">REQUEST-PFAD · KANN BLOCKIEREN</text>
