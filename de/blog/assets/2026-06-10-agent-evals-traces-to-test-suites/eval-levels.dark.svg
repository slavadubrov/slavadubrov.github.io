<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="el-title el-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="el-title">Drei Ebenen der Agent-Evaluation</title>
  <desc id="el-desc">Die Outcome-Evaluation prüft, ob die Aufgabe erfolgreich war, die Trajectory-Evaluation, ob der Pfad sinnvoll war, und die Component-Evaluation lokalisiert das fehlerhafte Tool oder die fehlerhafte Entscheidung.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #141D19; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="480" rx="14" fill="#0C1210" />

  <circle cx="62" cy="80" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="85" text-anchor="middle">1</text>
  <rect class="box" x="96" y="48" width="304" height="96" rx="10" />
  <text class="kind" x="116" y="82">OUTCOME</text>
  <text class="name" x="116" y="110">War die Aufgabe erfolgreich?</text>
  <rect class="store" x="440" y="48" width="472" height="96" rx="10" />
  <text class="kind" x="460" y="82">METRIKEN</text>
  <text class="name" x="460" y="110">Abschluss · Endzustand · pass^k</text>

  <path class="edge" d="M248 144v40" marker-end="url(#el-arrow)" />
  <circle cx="62" cy="224" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="229" text-anchor="middle">2</text>
  <rect x="96" y="192" width="304" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="116" y="226" fill="#FF6FB6">FOKUS · TRAJECTORY</text>
  <text class="name" x="116" y="254" fill="#FF6FB6">War der Pfad sinnvoll?</text>
  <rect class="store" x="440" y="192" width="472" height="96" rx="10" />
  <text class="kind" x="460" y="226">METRIKEN</text>
  <text class="name" x="460" y="254">Tool-Reihenfolge · Argumente · Schleifen</text>

  <path class="edge" d="M248 288v40" marker-end="url(#el-arrow)" />
  <circle cx="62" cy="368" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="373" text-anchor="middle">3</text>
  <rect class="box" x="96" y="336" width="304" height="96" rx="10" />
  <text class="kind" x="116" y="370">COMPONENT</text>
  <text class="name" x="116" y="398">Welcher Span ist fehlgeschlagen?</text>
  <rect class="store" x="440" y="336" width="472" height="96" rx="10" />
  <text class="kind" x="460" y="370">METRIKEN</text>
  <text class="name" x="460" y="398">Score pro Span · Auslesen · Attribution</text>

  <text class="note" x="96" y="462">Zuerst den Überblick gewinnen, dann den Trace öffnen, bis der Fehler einem Verantwortlichen zugeordnet ist.</text>
  <defs>
    <marker id="el-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker>
  </defs>
</svg>
