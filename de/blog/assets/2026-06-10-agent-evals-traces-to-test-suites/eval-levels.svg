<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Three levels of agent evaluation with their metrics" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Drei Ebenen der Agent-Evaluation mit ihren Metriken</title>
  <defs>
    <marker id="arrLvl" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#334155" />
    </marker>
    <filter id="shadowLvl" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Drei Ebenen der Agent-Evaluation</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">Outcome zeigt WAS schiefging · Trajectory zeigt WO · Komponente zeigt WARUM</text>

  <!-- Level 1: end-to-end -->
  <rect x="30" y="80" width="1120" height="150" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="106" font-size="14" font-weight="700" fill="#166534" x="55">Ebene 1 · Outcome (Black Box)</text>
  <text y="124" font-size="10" fill="#166534" x="55">Frage: War die Aufgabe erfolgreich?</text>

  <rect x="55" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="225">Task Completion</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="225">LLM-bewertete Zielausrichtung, ohne Referenz</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="225">online nutzbar — kein Golden Output erforderlich</text>

  <rect x="415" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="585">Outcome- / Zustandsbewertung</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="585">Finalen Umgebungszustand mit Zielzustand vergleichen</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="585">robust gegenüber kreativen alternativen Pfaden (τ-bench)</text>

  <rect x="775" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="945">Zuverlässigkeit: pass^k</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="945">Alle k von k Versuchen erfolgreich</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="945">90 % Erfolg pro Lauf → 43 % bei k=8 (0.9^8)</text>

  <line x1="590" y1="234" x2="590" y2="268" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="256" font-size="10" fill="#64748b" font-style="italic" x="700">Task fehlgeschlagen — aber wo?</text>

  <!-- Level 2: trajectory -->
  <rect x="30" y="275" width="1120" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="301" font-size="14" font-weight="700" fill="#5b21b6" x="55">Ebene 2 · Trajectory (Glass Box)</text>
  <text y="319" font-size="10" fill="#5b21b6" x="55">Frage: War der Pfad stimmig und effizient?</text>

  <rect x="55" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="182">Tool-Korrektheit</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="182">deterministisch, kein Judge erforderlich</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="182">Exakt- / Reihenfolge- / Beliebige-Reihenfolge-Match</text>

  <rect x="330" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="457">Argument-Korrektheit</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="457">richtiges Tool, falsche Parameter</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="457">Anteil korrekt ausgefüllter Schlüssel-Wert-Paare</text>

  <rect x="605" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="732">Effizienz &amp; Loops</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="732">redundante Calls · Pfadkonvergenz</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="732">wiederholte identische Calls = Sackgasse</text>

  <rect x="880" y="335" width="235" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="997">Planqualität / Planbefolgung</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="997">guter Plan, abweichende Ausführung</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="997">Multi-Turn-Treue über mehrere Turns</text>

  <line x1="590" y1="429" x2="590" y2="463" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="451" font-size="10" fill="#64748b" font-style="italic" x="700">Pfad bei Schritt 3 abgebrochen — aber warum?</text>

  <!-- Level 3: component -->
  <rect x="30" y="470" width="1120" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="496" font-size="14" font-weight="700" fill="#9a3412" x="55">Ebene 3 · Komponente (White Box)</text>
  <text y="514" font-size="10" fill="#9a3412" x="55">Frage: Welche Entscheidung, welches Tool, welcher Retriever oder Sub-Agent ist ausgefallen?</text>

  <rect x="55" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="225">Metriken pro Span</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="225">Scores an einzelne Tool- / Retrieval-Spans anhängen</text>

  <rect x="415" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="585">Interpretation des Tool-Outputs</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="585">gültige Antwort, falsch gelesen — korrumpiert nachgelagerte Schritte</text>

  <rect x="775" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="945">Fehlerzuordnung</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="945">Der sichtbare Fehler liegt meist hinter dem eigentlichen Bug</text>
</svg>
