<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eg-title eg-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="eg-title">API Enrichers leiten den Agent vor der Entscheidung durch abgestufte Guards</title>
  <desc id="eg-desc">Eine API-Antwort durchläuft mehr als zwanzig Enrichers, die operative Hinweise speichern. Eine hybride Wiki-Suche liefert Regeln. Beides versorgt den Agent, dessen vorgeschlagenes Ergebnis durch Guard-Modi für Hard Block, Soft Block oder Soft Hint geprüft wird.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0C1210" />
  <rect class="external" x="48" y="64" width="188" height="96" rx="10" /><text class="kind" x="68" y="98">EXTERN</text><text class="name" x="68" y="126">API-Antwort</text>
  <rect class="box" x="272" y="64" width="188" height="96" rx="10" /><text class="kind" x="292" y="98">ENRICHERS · 20+</text><text class="name" x="292" y="126">Ergebnis prüfen</text>
  <rect class="store" x="496" y="64" width="188" height="96" rx="10" /><text class="kind" x="516" y="98">CONTEXT HINTS</text><text class="name" x="516" y="126">Rolle + Paginierung</text>
  <path class="edge" d="M236 112h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M460 112h28" marker-end="url(#eg-arrow)" />
  <rect class="store" x="48" y="256" width="188" height="96" rx="10" /><text class="kind" x="68" y="290">WIKI STORE</text><text class="name" x="68" y="318">Unternehmensregeln</text>
  <rect class="box" x="272" y="256" width="188" height="96" rx="10" /><text class="kind" x="292" y="290">HYBRID SEARCH</text><text class="name" x="292" y="318">Regex + semantisch</text>
  <rect class="box" x="496" y="256" width="188" height="96" rx="10" /><text class="kind" x="516" y="290">SGR AGENT</text><text class="name" x="516" y="318">Aktion wählen</text>
  <rect x="720" y="256" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="740" y="290">TIERED GUARD</text><text class="name-focus" x="740" y="318">Blockieren oder Hinweis</text>
  <path class="edge" d="M236 304h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M460 304h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M684 304h28" marker-end="url(#eg-arrow)" />
  <path class="edge" d="M590 160v88" marker-end="url(#eg-arrow)" /><text class="note" x="604" y="210">Hinweise injizieren</text>
  <text class="note" x="720" y="384">Hard Block · Soft Block · Soft Hint</text><path d="M720 394h188" stroke="#2B3B33" />
  <text class="note" x="48" y="416">Enrichers fügen Anleitungen hinzu, ohne zu blockieren; Guards entscheiden unabhängig, ob ein Ergebnis fortgesetzt werden darf.</text>
  <defs><marker id="eg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
