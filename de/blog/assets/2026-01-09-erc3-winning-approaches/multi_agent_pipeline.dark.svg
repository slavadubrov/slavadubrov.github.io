<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="map-title map-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="map-title">Vier Spezialisten verantworten vier aufeinanderfolgende Anforderungen</title>
  <desc id="map-desc">Ein Security Gate prüft Berechtigungen, der Context Agent bereitet Regeln und Datensätze vor, der Execution Agent erledigt die Aufgabe, und ein eingebetteter Link-Generator stellt Entity-Links in der Antwort sicher.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="304" rx="14" fill="#0C1210" />
  <circle cx="62" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="57" text-anchor="middle">1</text><circle cx="286" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="57" text-anchor="middle">2</text><circle cx="510" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="57" text-anchor="middle">3</text><circle cx="734" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="57" text-anchor="middle">4</text>
  <rect class="box" x="48" y="80" width="188" height="96" rx="10" /><text class="kind" x="68" y="114">SECURITY GATE</text><text class="name" x="68" y="142">Berechtigung prüfen</text>
  <rect class="box" x="272" y="80" width="188" height="96" rx="10" /><text class="kind" x="292" y="114">CONTEXT AGENT</text><text class="name" x="292" y="142">Nachweise vorbereiten</text>
  <rect class="box" x="496" y="80" width="188" height="96" rx="10" /><text class="kind" x="516" y="114">EXECUTION AGENT</text><text class="name" x="516" y="142">Task Loop ausführen</text>
  <rect x="720" y="80" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="740" y="114">RESPONSE TOOL</text><text class="name-focus" x="740" y="142">Links generieren</text>
  <path class="edge" d="M236 128h28" marker-end="url(#map-arrow)" /><path class="edge" d="M460 128h28" marker-end="url(#map-arrow)" /><path class="edge" d="M684 128h28" marker-end="url(#map-arrow)" />
  <text class="note" x="48" y="220">Wiki-Regeln</text><path d="M48 230h188" stroke="#2B3B33" /><text class="note" x="272" y="220">Regeln + Datensätze</text><path d="M272 230h188" stroke="#2B3B33" /><text class="note" x="496" y="220">Tool Results</text><path d="M496 230h188" stroke="#2B3B33" /><text class="note" x="720" y="220">Antwort + Entity-Links</text><path d="M720 230h188" stroke="#2B3B33" />
  <text class="note" x="48" y="276">Die letzte Anforderung ist in die Response-Schnittstelle integriert, sodass das Execution Model sie nicht weglassen kann.</text>
  <defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
