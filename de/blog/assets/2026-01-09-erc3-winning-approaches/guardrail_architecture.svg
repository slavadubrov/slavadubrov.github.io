<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="guard-title guard-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="guard-title">Guardrails decken drei klar getrennte Fehlergrenzen ab</title>
  <desc id="guard-desc">Eine fokussierte Boundary Map enthält drei Checks in Ausführungsreihenfolge: Ein Pre-Execution Gate validiert Identität und Berechtigung, ein In-Loop Validator prüft jede vorgeschlagene Aktion, und ein Post-Execution Guard prüft Evidence und Policy vor der Übermittlung.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #C50E72; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #C50E72; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="352" rx="14" fill="#F7F7F4" />
  <rect x="48" y="48" width="864" height="232" rx="12" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind-focus" x="68" y="82">FOCUS · BOUNDARY MAP</text><text class="name-focus" x="68" y="110">Drei Checks, drei Risiken</text>
  <circle cx="86" cy="146" r="14" fill="#17211B" /><text class="marker-num" x="86" y="151" text-anchor="middle">1</text><circle cx="358" cy="146" r="14" fill="#17211B" /><text class="marker-num" x="358" y="151" text-anchor="middle">2</text><circle cx="630" cy="146" r="14" fill="#17211B" /><text class="marker-num" x="630" y="151" text-anchor="middle">3</text>
  <rect class="box" x="72" y="168" width="248" height="96" rx="10" /><text class="kind" x="92" y="202">PRE-EXECUTION</text><text class="name" x="92" y="230">Identität + Berechtigung</text>
  <rect class="box" x="344" y="168" width="248" height="96" rx="10" /><text class="kind" x="364" y="202">IN-LOOP</text><text class="name" x="364" y="230">Vorgeschlagene Aktion</text>
  <rect class="box" x="616" y="168" width="248" height="96" rx="10" /><text class="kind" x="636" y="202">POST-EXECUTION</text><text class="name" x="636" y="230">Evidence + Policy</text>
  <path class="edge" d="M320 216h16" marker-end="url(#guard-arrow)" /><path class="edge" d="M592 216h16" marker-end="url(#guard-arrow)" />
  <text class="note" x="48" y="320">Jeder Check steht neben dem Fehler, den er verhindern kann; keiner ersetzt die beiden anderen.</text>
  <defs><marker id="guard-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
