<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="repl-title repl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="repl-title">Planen, Code generieren, in persistentem State ausführen, dann entscheiden</title>
  <desc id="repl-desc">Ein Planner definiert einen übergeordneten Schritt, ein frisches Code Model schreibt Python, und ein Task-scoped REPL führt den Code aus und bewahrt Variablen. Ein Decision Model entscheidet dann, ob fortgesetzt, abgebrochen oder nur die verbleibende Arbeit neu geplant wird.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="360" rx="14" fill="#0C1210" />
  <circle cx="62" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="57" text-anchor="middle">1</text><circle cx="286" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="57" text-anchor="middle">2</text><circle cx="510" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="57" text-anchor="middle">3</text><circle cx="734" cy="52" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="57" text-anchor="middle">4</text>
  <rect class="box" x="48" y="80" width="188" height="96" rx="10" /><text class="kind" x="68" y="114">PLANNER · GPT-5.1</text><text class="name" x="68" y="142"><tspan x="68">Einen Schritt</tspan><tspan x="68" dy="1.2em">definieren</tspan></text>
  <rect class="box" x="272" y="80" width="188" height="96" rx="10" /><text class="kind" x="292" y="114">CODE MODEL</text><text class="name" x="292" y="142">Python schreiben</text>
  <rect class="store" x="496" y="80" width="188" height="96" rx="10" /><text class="kind" x="516" y="114">TASK REPL</text><text class="name" x="516" y="142"><tspan x="516">Ausführen + State</tspan><tspan x="516" dy="1.2em">beibehalten</tspan></text>
  <rect x="720" y="80" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="740" y="114">DECISION MODEL</text><text class="name-focus" x="740" y="142"><tspan x="740">Fortsetzen oder neu</tspan><tspan x="740" dy="1.2em">planen</tspan></text>
  <path class="edge" d="M236 128h28" marker-end="url(#repl-arrow)" /><path class="edge" d="M460 128h28" marker-end="url(#repl-arrow)" /><path class="edge" d="M684 128h28" marker-end="url(#repl-arrow)" />
  <path d="M814 176v64a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-64" fill="none" stroke="#FF6FB6" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#repl-signal)" />
  <rect x="408" y="240" width="144" height="24" rx="6" fill="#0C1210" /><text class="note" x="480" y="257" text-anchor="middle" fill="#FF6FB6" style="font-size: 11px;">verbleibende Arbeit neu planen</text>
  <text class="note" x="802" y="208" text-anchor="end">fortsetzen · abbrechen · neu planen</text><text class="note" x="48" y="324">Das Code Model startet für jeden Schritt neu; das REPL bewahrt den Task-State über diese isolierten Ausführungen hinweg.</text>
  <defs><marker id="repl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="repl-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
