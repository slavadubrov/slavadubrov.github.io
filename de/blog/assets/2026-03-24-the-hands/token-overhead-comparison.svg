<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="to-title to-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="to-title">Tool-Definitionen können den Context verbrauchen, bevor die Arbeit beginnt</title>
  <desc id="to-desc">Berichtete Beispiele zeigen 143.000 Tokens für ein großes MCP-Setup und 55.000 für etwa 40 MCP-Tools. Für zehn JSON Tool Schemas werden 5.500 bis 14.000 Tokens geschätzt. Skill-Startup-Metadaten umfassen etwa 100 Tokens. Code Execution verwendet wenige Meta-Tools; eine vergleichbare Anzahl wird jedoch nicht angegeben.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .grid { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="512" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">DEFINITIONSOVERHEAD VOR DER AUFGABE</text>
  <text class="note" x="48" y="68">Berichtete Beispiele, kein kontrollierter Benchmark · horizontale Skala in Tausenden von Tokens</text>

  <path class="grid" d="M300 88V424M493 88V424M687 88V424M880 88V424" />
  <text class="kind" x="300" y="84" text-anchor="middle">0</text>
  <text class="kind" x="493" y="84" text-anchor="middle">50K</text>
  <text class="kind" x="687" y="84" text-anchor="middle">100K</text>
  <text class="kind" x="880" y="84" text-anchor="middle">150K</text>

  <text class="kind" x="48" y="124" fill="#C50E72">FOKUS · MCP</text>
  <text class="name" x="48" y="148" fill="#C50E72">Großes Setup</text>
  <rect x="300" y="116" width="553" height="32" rx="6" fill="#F2148E" />
  <text class="name" x="840" y="139" text-anchor="end" fill="#17211B">143K</text>
  <text class="note" x="300" y="170">72 % eines 200K Context Windows im berichteten Setup</text>

  <text class="kind" x="48" y="212">MCP</text>
  <text class="name" x="48" y="236">Etwa 40 Tools</text>
  <rect x="300" y="204" width="213" height="32" rx="6" fill="#17211B" />
  <text class="name" x="525" y="227">55K</text>
  <text class="note" x="300" y="258">Schemas, die geladen werden, bevor der User eine Frage stellt</text>

  <text class="kind" x="48" y="300">JSON SCHEMAS</text>
  <text class="name" x="48" y="324">Zehn Tools</text>
  <path d="M321 308H354" stroke="#17211B" stroke-width="8" />
  <circle cx="321" cy="308" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <circle cx="354" cy="308" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="372" y="314">5,5–14K</text>
  <text class="note" x="300" y="346">Spanne, abgeleitet aus 550–1.400 Tokens pro Definition</text>

  <text class="kind" x="48" y="388">PROGRESSIVE LOAD</text>
  <text class="name" x="48" y="412">Skill-Metadaten</text>
  <circle cx="301" cy="396" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="320" y="402">~100 Tokens</text>
  <text class="note" x="300" y="434">Vollständige Instructions werden erst geladen, wenn der Skill aktiv ist</text>

  <path d="M48 456H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="source" x="48" y="478">Quellen: Apideck für die Beobachtungen von 55K und 143K; Artikelschätzung für zehn JSON Schemas; Anleitung zur progressiven Offenlegung von Skills.</text>
  <text class="source" x="48" y="496">Code Execution ersetzt viele Schemas durch wenige Meta-Tools. Der Definitionsoverhead hängt jedoch vom Harness ab und ist nicht dargestellt.</text>
</svg>
