<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tmd-title tmd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tmd-title">Fünf Schnittstellen für Tool Use von AI Agents</title>
  <desc id="tmd-desc">Ein Vergleich von JSON Function Calling, MCP, Skills, Command-Line-Tools und Code Execution danach, was die jeweilige Schnittstelle überträgt, wo sie eingesetzt wird und welchen typischen Context Overhead sie verursacht. Code Execution ist für Multi-Step Orchestration hervorgehoben.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="44">SCHNITTSTELLEN-MAP — NACH DER FORM DER ARBEIT AUSWÄHLEN</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">ATOMARE CALLS</text>
  <text class="name" x="68" y="126">JSON Function Calling</text>
  <text class="note" x="68" y="150">Typisierte Anfrage/Antwort · 550–1.400 Schema-Tokens pro Tool</text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">GEMEINSAME INTEGRATION</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150">Discovery + Transport · nur die für die Aufgabe benötigten Tools laden</text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">PROZEDUR</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Instructions on Demand · etwa 100 Startup-Metadaten-Tokens</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">LOKALER BETRIEB</text>
  <text class="name" x="520" y="262">CLI und Shell</text>
  <text class="note" x="520" y="286">Kombinierbare Commands · geringer Schema Overhead</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#FF6FB6">FOKUS · MULTI-STEP-ARBEIT</text>
  <text class="name" x="294" y="398" fill="#FF6FB6">Code Execution</text>
  <text class="note" x="294" y="422">Loops und Conditionals · die abschließende Zusammenfassung kehrt in den Context zurück</text>
  <path d="M48 472H912" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="48" y="490">Das Protokoll legt keine Policy fest: Authentication, Authorization, Logging und Sandboxing bleiben weiterhin Aufgabe des Harness.</text>
</svg>
