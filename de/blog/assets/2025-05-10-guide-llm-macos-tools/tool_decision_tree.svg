<path d="M42 384h716a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M42 384h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="400" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">FOKUS</text><text x="400" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">Dieselbe Workload benchmarken</text><text x="400" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" text-anchor="middle"><tspan x="400">Dieselbe Checkpoint-Familie, dieselbe Quantization, dasselbe Prompt-Set — anschließend die Timings</tspan><tspan x="400" dy="1.2em">vergleichen.</tspan></text>
<path d="M32 528h736" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="554" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Keines der vier Tools ist universell am schnellsten — der Benchmark entscheidet, nicht das Tool.</text>
