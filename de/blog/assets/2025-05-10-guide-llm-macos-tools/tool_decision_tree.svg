<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 586" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="macostools-title macostools-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="macostools-title">Wähle je nach Workflow-Anforderung ein lokales macOS-LLM-Tool und führe anschließend für jeden Kandidaten denselben Benchmark durch.</title><desc id="macostools-desc">Ausgehend von einer festgelegten Aufgabe und einem Checkpoint verzweigst du zu Ollama als verwaltetem lokalem Service, LM Studio zur Desktop-Erkundung von Models, llama.cpp für direkte GGUF-Kontrolle oder MLX-LM für Apple-natives Python — anschließend gilt eine gemeinsame Disziplin: Vergleiche erst nach einem Benchmark mit demselben Checkpoint, derselben Quantization und demselben Prompt-Set.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="macostools-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="macostools-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="586" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Wähle die Control Surface, dann benchmarken</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Nach Workflow-Anforderung verzweigen; bei einer Benchmarking-Disziplin zusammenführen.</text>
<path d="M42 112h716a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 112h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="400" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" text-anchor="middle" letter-spacing="1.2">BASELINE</text><text x="400" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" text-anchor="middle">Aufgabe und Checkpoint zuerst festlegen</text>
