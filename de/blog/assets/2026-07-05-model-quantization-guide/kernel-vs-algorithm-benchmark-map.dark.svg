<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Benchmark-Map für Quantization-Algorithmus und Runtime-Kernel</title>
  <desc id="desc">Diagramm: Der Algorithmus erstellt einen komprimierten Checkpoint, während Runtime-Kernels Serving-Geschwindigkeit und Benchmark-Ergebnisse bestimmen.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141D19" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="520" fill="#0C1210" />
  <text y="42" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" fill="#EDF5F0" x="480">Algorithmus + Kernel + Workload = Ergebnis</text>
  <text y="72" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#EDF5F0" x="480">Ein quantisierter Checkpoint ist nicht automatisch ein schnelleres Deployment.</text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="130" width="210" height="150" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0" x="153">Quantization-Methode</text>
    <text y="194" text-anchor="middle" font-size="14" fill="#EDF5F0" x="153">GPTQ</text>
    <text y="220" text-anchor="middle" font-size="14" fill="#EDF5F0" x="153">AWQ</text>
    <text y="246" text-anchor="middle" font-size="14" fill="#EDF5F0" x="153">SmoothQuant</text>
    <text y="268" text-anchor="middle" font-size="12" fill="#EDF5F0" x="153">bestimmt den Checkpoint-Fehler</text>

    <rect x="375" y="130" width="210" height="150" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0" x="480">Runtime-Kernel</text>
    <text y="194" text-anchor="middle" font-size="14" fill="#EDF5F0" x="480">Marlin</text>
    <text y="220" text-anchor="middle" font-size="14" fill="#EDF5F0" x="480">BitBLAS</text>
    <text y="246" text-anchor="middle" font-size="14" fill="#EDF5F0" x="480">FP8 Tensor Cores</text>
    <text y="268" text-anchor="middle" font-size="12" fill="#EDF5F0" x="480">bestimmt den Ausführungspfad</text>

    <rect x="702" y="130" width="210" height="150" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
    <text y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0" x="807">Workload</text>
    <text y="194" text-anchor="middle" font-size="14" fill="#EDF5F0" x="807">Prompt-Länge</text>
    <text y="220" text-anchor="middle" font-size="14" fill="#EDF5F0" x="807">Concurrency</text>
    <text y="246" text-anchor="middle" font-size="14" fill="#EDF5F0" x="807">Qualitätsziel</text>
    <text y="268" text-anchor="middle" font-size="12" fill="#EDF5F0" x="807">bestimmt den Bottleneck</text>
  </g>

  <g stroke="#A8B8AF" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
    <path d="M 258 205 L 365 205" />
    <path d="M 585 205 L 692 205" />
    <path d="M 807 280 C 807 330 480 325 480 365" />
    <path d="M 480 280 L 480 365" />
    <path d="M 153 280 C 153 330 480 325 480 365" />
  </g>

  <rect x="260" y="365" width="440" height="100" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text y="395" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#EDF5F0" x="480">Den tatsächlichen Stack benchmarken</text>
  <text y="424" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#EDF5F0" x="480">Qualität: Perplexity, Task-Metriken, Generations</text>
  <text y="448" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#EDF5F0" x="480">Serving: Throughput, TTFT, ITL, Speicher, Concurrency</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
