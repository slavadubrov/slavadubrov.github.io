  <rect x="190" y="405" width="580" height="62" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text y="430" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#17211B" x="480">Dann Deployment-Checks ausführen</text>
  <text y="455" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#17211B" x="480" style="font-size: 12.5px;">Perplexity + Task-Metriken + Generation Samples + Long-Context-Probes + Serving-Benchmarks</text>

