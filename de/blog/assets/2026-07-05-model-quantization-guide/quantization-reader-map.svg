<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Quantization-Lesekarte</title>
  <desc id="desc">Decision Map, die Serving-Bottlenecks zu Quantization-Optionen und Validierungschecks routet.</desc>
  <defs>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="520" fill="#F7F7F4" />
  <text y="42" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#17211B" x="480">Mit dem Bottleneck starten</text>
  <text y="72" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#17211B" x="480">Dieselbe Bitbreite kann je nach Hardware, Runtime, Cache und Evals richtig oder falsch sein.</text>

  <rect x="365" y="105" width="230" height="74" rx="8" fill="#ffffff" stroke="#17211B" stroke-width="2" />
  <text y="134" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#17211B" x="480">Was begrenzt das Serving?</text>
  <text y="160" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#17211B" x="480"><tspan x="480">Memory, Compute, Cache, Runtime</tspan><tspan x="480" dy="1.2em">oder Image Pipeline</tspan></text>

  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <rect x="45" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="127">Weight Memory</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="127">W4A16 GPTQ/AWQ</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="127">Decode, Model fitten</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="127">Eval-Qualitätsdelta</text>

    <rect x="230" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="312">Throughput</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="312">FP8 W8A8</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="312">Ada/Hopper-Kernels</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="312">TTFT/ITL benchmarken</text>

    <rect x="415" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="497">Langer Kontext</text>
    <text y="292" text-anchor="middle" font-size="13" fill="#17211B" x="497">KV cache</text>
    <text y="310" text-anchor="middle" font-size="13" fill="#17211B" x="497">Quantization</text>
    <text y="332" text-anchor="middle" font-size="12" fill="#17211B" x="497">Cache dominiert VRAM</text>
    <text y="350" text-anchor="middle" font-size="12" fill="#17211B" x="497">Retrieval prüfen</text>

    <rect x="600" y="240" width="165" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="682">Lokale Runtime</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="682">GGUF / MLX</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="682">CPU, Apple, Edge</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="682">Lokalen RAM messen</text>

    <rect x="785" y="240" width="130" height="118" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B" x="850">Image-Pfad</text>
    <text y="294" text-anchor="middle" font-size="13" fill="#17211B" x="850">SVDQuant</text>
    <text y="318" text-anchor="middle" font-size="12" fill="#17211B" x="850">VAE-sensitiv</text>
    <text y="340" text-anchor="middle" font-size="12" fill="#17211B" x="850">Visuelle Evals</text>
  </g>

  <g stroke="#59645E" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 480 179 C 480 205 127 208 127 235" />
    <path d="M 480 179 C 480 207 312 211 312 235" />
    <path d="M 480 179 C 480 210 497 211 497 235" />
    <path d="M 480 179 C 480 207 682 211 682 235" />
    <path d="M 480 179 C 480 205 850 208 850 235" />
