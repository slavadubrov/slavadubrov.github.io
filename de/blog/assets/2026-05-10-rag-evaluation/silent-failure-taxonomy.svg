<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Silent failure taxonomy with the metric that catches each mode" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Taxonomie stiller Fehler mit der Metrik, die jeden Modus erkennt</title>
  <defs>
    <filter id="shadowSF" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="720" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">Taxonomie stiller Fehler</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#0f172a" x="590">Jedem Fehlermodus ist die Metrik zugeordnet, die ihn erkennt. Ohne die Metrik bleibt der Bug unsichtbar.</text>

  <!-- Root -->
  <rect x="475" y="78" width="230" height="44" rx="22" fill="#dc2626" filter="url(#shadowSF)" />
  <text y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" x="590">Stiller Fehler (RAG)</text>

  <!-- Trunk: 4 main branches -->
  <line x1="540" y1="122" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="570" y1="122" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="610" y1="122" x2="730" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="640" y1="122" x2="1010" y2="170" stroke="#94a3b8" stroke-width="1.4" />

  <!-- ====== Branch A: Ingestion ====== -->
  <rect x="40" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="170">Fehler bei der Ingestion</text>

  <!-- A1: Parse loss -->
  <rect x="40" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Parse-Verlust</text>
  <text y="261" font-size="11" fill="#0f172a" x="50">Tabellen kollabieren · Fußnoten</text>
  <text y="275" font-size="11" fill="#0f172a" x="50">entfernt · OCR vertauscht Ziffern</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="50">erkannt durch: CER/WER, TEDS</text>

  <!-- A2: Chunk break -->
  <rect x="40" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Chunk-Bruch</text>
  <text y="336" font-size="11" fill="#0f172a" x="50">Answer Span über zwei</text>
  <text y="350" font-size="11" fill="#0f172a" x="50">Chunks geteilt; keiner enthält die vollständige Evidenz</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="50">erkannt durch: Answer-Span-Containment</text>

  <!-- A3: Dedup miss -->
  <rect x="40" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Dedup-Fehler</text>
  <text y="411" font-size="11" fill="#0f172a" x="50">False-Merge verfälscht die Antwort;</text>
  <text y="425" font-size="11" fill="#0f172a" x="50">False-Keep verschüttet das richtige Dokument</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="50">erkannt durch: Dup Precision/Recall</text>

  <!-- A4: Normalization -->
  <rect x="40" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Normalization Drift</text>
  <text y="486" font-size="11" fill="#0f172a" x="50">NFC- vs. NFKC-Mismatch bricht</text>
  <text y="500" font-size="11" fill="#0f172a" x="50">die Exact-Match-Aliasauflösung</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="50">erkannt durch: NFC/NFKC-Parität, Alias-Abdeckung</text>

  <!-- ====== Branch B: Embedding/Index ====== -->
  <rect x="320" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="450">Embedding &amp; Index</text>

  <!-- B1: Embedding miss -->
  <rect x="320" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Embedding-Miss</text>
  <text y="261" font-size="11" fill="#0f172a" x="330">Domänenbegriff liegt außerhalb der</text>
  <text y="275" font-size="11" fill="#0f172a" x="330">Trainingsverteilung des Models</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="330">erkannt durch: Domain Recall@k vs. Baseline</text>

  <!-- B2: ANN drop -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="330">ANN-Approximationsverlust</text>
  <text y="336" font-size="11" fill="#0f172a" x="330">HNSW efSearch zu niedrig; Gold-</text>
  <text y="350" font-size="11" fill="#0f172a" x="330">Vektor existiert, wird aber nicht erreicht</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="330">erkannt durch: ANN Recall vs. Flat</text>

  <!-- B3: Embedding drift -->
  <rect x="320" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Embedding Drift</text>
  <text y="411" font-size="11" fill="#0f172a" x="330">Versionssprung des Provider-Models;</text>
  <text y="425" font-size="11" fill="#0f172a" x="330">alte Vektoren sind nicht mehr ausgerichtet</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="330">erkannt durch: NN-Stabilität des Probe-Sets</text>

  <!-- B4: Stale index -->
  <rect x="320" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Veralteter Index</text>
  <text y="486" font-size="11" fill="#0f172a" x="330">Freshness-Lag; Queries laufen</text>
  <text y="500" font-size="11" fill="#0f172a" x="330">gegen den Stand der letzten Woche</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="330">erkannt durch: Freshness-Lag p99, %-stale</text>

  <!-- ====== Branch C: Online retrieval (HOT — silent killers) ====== -->
  <rect x="600" y="170" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="730">Online-Retrieval</text>

  <!-- C1: Filter exclude (highlighted) -->
  <rect x="600" y="225" width="260" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#991b1b" x="610">Filter-False-Exclusion</text>
  <text y="261" font-size="11" fill="#0f172a" x="610">Hartes Prädikat entfernt das Gold-Dokument;</text>
  <text y="275" font-size="11" fill="#0f172a" x="610">Recall@k sinkt, aber die Ursache bleibt unklar</text>
  <text y="285" font-size="11" font-style="italic" fill="#991b1b" x="610">erkannt durch: Filter-False-Exclusion-Rate</text>

  <!-- C2: Rerank miss -->
  <rect x="600" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#991b1b" x="610">Rerank-Miss</text>
  <text y="336" font-size="11" fill="#0f172a" x="610">Cross-Encoder stuft das richtige</text>
  <text y="350" font-size="11" fill="#0f172a" x="610">Dokument hinter plausiblen Ablenkungen ein</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="610">erkannt durch: ΔnDCG, Distractor Robustness</text>

  <!-- C3: Lost in middle -->
  <rect x="600" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#991b1b" x="610">Lost in the Middle</text>
  <text y="411" font-size="11" fill="#0f172a" x="610">Gold-Chunk im Context, aber an</text>
  <text y="425" font-size="11" fill="#0f172a" x="610">Position 7/10; das Model ignoriert ihn</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="610">erkannt durch: positionsstratifizierte Eval</text>

  <!-- C4: Bad rewrite -->
  <rect x="600" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#991b1b" x="610">Query-Rewrite-Regression</text>
  <text y="486" font-size="11" fill="#0f172a" x="610">HyDE halluziniert eine Entität, die</text>
  <text y="500" font-size="11" fill="#0f172a" x="610">das Retrieval in die falsche Richtung lenkt</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="610">erkannt durch: Rewrite-Gain/Loss-A/B</text>

  <!-- ====== Branch D: Generation/Citation ====== -->
  <rect x="880" y="170" width="260" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="1010">Generation</text>

  <!-- D1: Hallucination -->
  <rect x="880" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#5b21b6" x="890">Hallucination</text>
  <text y="261" font-size="11" fill="#0f172a" x="890">Nicht belegte Behauptung, oft eine</text>
  <text y="275" font-size="11" fill="#0f172a" x="890">Entität, die nicht im Context steht</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="890">erkannt durch: Faithfulness, HHEM, FActScore</text>

  <!-- D2: No citation -->
  <rect x="880" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#5b21b6" x="890">Citation Theater</text>
  <text y="336" font-size="11" fill="#0f172a" x="890">Der zitierte Span stützt tatsächlich nicht</text>
  <text y="350" font-size="11" fill="#0f172a" x="890">die benachbarte Behauptung</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="890">erkannt durch: Citation P/R (TREC)</text>

  <!-- D3: Wrong refusal -->
  <rect x="880" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#5b21b6" x="890">Falsche Abstention</text>
  <text y="411" font-size="11" fill="#0f172a" x="890">„Ich weiß es nicht“, obwohl die Antwort</text>
  <text y="425" font-size="11" fill="#0f172a" x="890">im Context steht (oder umgekehrt)</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="890">erkannt durch: NoMIRACL, Abstention Accuracy</text>

  <!-- D4: Schema break -->
  <rect x="880" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#5b21b6" x="890">Schema-/Vokabularbruch</text>
  <text y="486" font-size="11" fill="#0f172a" x="890">Syntaktisch valides Output wählt</text>
  <text y="500" font-size="11" fill="#0f172a" x="890">eine falsche, aber gültige Ontology-ID</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="890">erkannt durch: Vocabulary Conformance</text>

  <!-- Footer band -->
  <rect x="40" y="555" width="1100" height="68" rx="8" fill="#f0fdf4" stroke="#ea580c" stroke-width="1.2" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="590">Lesehilfe</text>
  <text y="598" text-anchor="middle" font-size="11" fill="#9a3412" x="590">Jeder Fehler bleibt ohne seine Metrik still. Die standardmäßige „Answer Correctness“ zeigt nur, dass etwas kaputt ist – nicht wo.</text>
  <text y="614" text-anchor="middle" font-size="11" fill="#9a3412" x="590">Der rote Zweig deckt Filter-, Rerank-, Context-Position- und Rewrite-Checks ab. Instrumentiere die Stages, die Evidenz entfernen können.</text>

  <!-- Visual cue: the 'red' propagation -->
  <rect x="40" y="640" width="1100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="662" font-size="11" font-weight="600" fill="#0f172a" x="60">Die Propagationsregel:</text>
  <text y="682" font-size="11" fill="#0f172a" x="60">Ein Fehler links bildet eine Recall-Obergrenze für alles rechts. Schlechtes Parsing begrenzt Chunking. Schlechtes Chunking begrenzt Retrieval.</text>
  <text y="696" font-size="11" fill="#0f172a" x="60">Schlechtes Retrieval begrenzt Reranking. Schlechtes Reranking begrenzt Generation. Faithfulness misst nur die letzte Verbindung – die unterbrochene Kette kann es nicht sehen.</text>
</svg>
