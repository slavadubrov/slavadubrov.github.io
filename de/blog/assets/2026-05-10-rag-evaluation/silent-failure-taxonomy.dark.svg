<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="silentfailure-title silentfailure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="silentfailure-title">Ein Flow mit vier Stufen ordnet jeden stillen Fehler der Metrik zu, die ihn identifiziert.</title><desc id="silentfailure-desc">Die Evidenz bewegt sich vom Quellkorpus über die zulässige Dokumentmenge und den gerankten Kontext bis zur generierten Antwort. Im Fokus steht die zulässige Dokumentmenge, da ein harter Filter das Gold-Dokument vor dem Ranking entfernen kann. Jede Stufe ist mit der Metrik verknüpft, die dort einen Fehler erkennt: Parsing-Metriken, Recall@k und die False-Exclusion-Rate, Positions- und Distraktor-Metriken sowie Faithfulness mit Citation Precision und Recall.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="silentfailure-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="silentfailure-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="520" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Finde die Stufe, die die Evidenz entfernt hat</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Der erste unterbrochene Link begrenzt alle Scores rechts davon.</text>
