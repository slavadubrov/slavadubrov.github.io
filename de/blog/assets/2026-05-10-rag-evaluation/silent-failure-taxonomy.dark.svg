<text x="32" y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Recall@k erkennt das fehlende Gold-Dokument.</text>
<text x="32" y="464" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Eine False-Exclusion-Metrik identifiziert den Filter als Ursache; Faithfulness kann dies nicht diagnostizieren.</text>
