<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="silent-failure-title silent-failure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="silent-failure-title">Stille RAG-Fehler und die Metrik, die jede Quelle identifiziert</title>
  <desc id="silent-failure-desc">Evidenz bewegt sich vom Quellkorpus über die Menge zulässiger Kandidaten und den gerankten Kontext bis zur belegten Antwort. Jede Stufe verweist auf eine diagnostische Metrik. Die Menge zulässiger Kandidaten ist hervorgehoben, weil ein harter Filter das Gold-Dokument vor dem Retrieval entfernen kann.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="silent-failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
  <rect width="960" height="568" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">STILLER FEHLER · QUELLE ZUR METRIK</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Finde die Stufe, die die Evidenz entfernt hat</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Das erste unterbrochene Glied begrenzt jeden Score rechts davon.</text>

  <rect x="48" y="136" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="64" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · QUELLE</text>
  <text x="64" y="198" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Korpus-Artefakte</text>
  <text x="64" y="218" fill="#a8b8af" font-size="13" style="font-size: 12px;">parsen · chunken · indexieren</text>
  <path d="M232 184H264" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="136" width="184" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="288" y="168" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOKUS · FILTER</text>
  <text x="288" y="198" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" style="font-size: 16.5px;">Zulässige Dokumente</text>
  <text x="288" y="218" fill="#a8b8af" font-size="13" style="font-size: 11px;">Gold-Dokument kann entfernt werden</text>
  <path d="M456 184H488" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="136" width="184" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="512" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROZESS · RANKER</text>
  <text x="512" y="198" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Gerankter Kontext</text>
  <text x="512" y="218" fill="#a8b8af" font-size="13" style="font-size: 11px;">Abwertung · Verlust in der Mitte</text>
  <path d="M680 184H712" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="136" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="736" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROZESS · GENERATOR</text>
  <text x="736" y="198" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Belegte Antwort</text>
  <text x="736" y="218" fill="#a8b8af" font-size="13">Claims · Zitate</text>

  <path d="M140 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="48" y="336" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="64" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · METRIK</text>
  <text x="64" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">CER/WER · TEDS</text>
  <text x="64" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ANN Recall · Aktualität</text>
  <path d="M364 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="336" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="288" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · METRIK</text>
  <text x="288" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recall@k</text>
  <text x="288" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">False-Exclusion-Rate</text>
  <path d="M588 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="336" width="184" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="512" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · METRIK</text>
  <text x="512" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ΔnDCG · Distraktoren</text>
  <text x="512" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Positions-Test</text>
  <path d="M816 232V328" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="336" width="192" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="736" y="368" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">STORE · METRIK</text>
  <text x="736" y="396" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Faithfulness</text>
  <text x="736" y="418" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Citation Precision/Recall</text>

  <path d="M48 472H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="502" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k erkennt das fehlende Gold-Dokument.</text>
  <text x="48" y="528" fill="#a8b8af" font-size="13">Die False-Exclusion-Rate identifiziert das Filter-Prädikat als Ursache; Faithfulness kann das nicht.</text>
  <rect x="42" y="262" width="352" height="20" fill="#0C1210" />
  <text x="48" y="276" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">DIE METRIK, DIE JEDEN FEHLER ZUORDNET</text>
</svg>
