<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eval-layers-title eval-layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="eval-layers-title">Drei Stellen, an denen ein RAG-System Evidenz verlieren kann</title>
  <desc id="eval-layers-desc">Das Diagramm verfolgt die Evidenz durch Corpus und Index, den Retrieval-Pfad sowie die Antwort und den Live-Traffic. Jede Schicht verfügt über diagnostische Metriken und wird sowohl offline als auch online evaluiert. Der Retrieval-Pfad ist hervorgehoben, da Filter das Gold-Dokument unbemerkt entfernen können.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="eval-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">EVIDENZPFAD · DREI EVALUIERUNGSSCHICHTEN</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Die erste Stelle lokalisieren, an der Evidenz verschwindet</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Ein nachgelagerter Score kann einen vorgelagerten Verlust nicht erklären.</text>

  <rect x="48" y="136" width="256" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
