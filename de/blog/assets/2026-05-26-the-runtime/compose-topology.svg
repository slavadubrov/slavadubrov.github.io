<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">Der Docker-Compose-Referenz-Stack umfasst einen Worker als Harness, drei direkt von ihm verwaltete Stores und drei optionale Services, die über Profile-Flags aktiviert werden.</title><desc id="composetop-desc">Ein LangGraph Worker fungiert als Run Owner und Harness: Er ruft Jobs aus einer Redis-Queue ab, schreibt Checkpoints nach Postgres und liest Cold Memory aus Qdrant. Ein MCP Sidecar isoliert Tool-Credentials vom Worker, ein OpenTelemetry Collector erfasst Traces und Metriken, und ein Observability-Stack speichert sie — alle drei werden über optionale Compose-Profile aktiviert. Claude ist die externe Model API, die der Worker direkt aufruft.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
