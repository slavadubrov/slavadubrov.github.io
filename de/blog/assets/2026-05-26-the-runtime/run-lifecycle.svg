<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">Ein gesunder Agent Run startet, plant, führt aus, erstellt Checkpoints und evaluiert in einer Schleife, in die ein abgestürzter Worker am gleichen Punkt wieder einsteigen kann.</title><desc id="runlife-desc">Fünf geordnete Schritte: aus einer neuen oder fortgesetzten Session starten, Definition of Done und Budget planen, einen Tool Call ausführen, das Ergebnis als Checkpoint speichern und anschließend evaluieren, ob der Run abgeschlossen ist. Bei einer fehlgeschlagenen Evaluation wird ab dem letzten Checkpoint fortgesetzt, statt neu zu starten. Ein abgestürzter oder neu ausgerollter Worker steigt beim Boot mit derselben Session ID wieder ein.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="runlife-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="runlife-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="780" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Der Lebenszyklus eines gesunden Runs</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Jeder abgeschlossene Schritt ist dauerhaft gespeichert, bevor der nächste beginnt; nur laufende Arbeit geht verloren.</text>
