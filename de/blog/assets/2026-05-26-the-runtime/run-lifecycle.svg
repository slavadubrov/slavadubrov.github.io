<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">Ein gesunder Agent Run persistiert eine ausstehende Intent vor dem Dispatch, protokolliert das Ergebnis, erstellt anschließend einen Checkpoint und führt eine Evaluation durch; ein neuer Worker gleicht zuerst die ausstehende Intent ab.</title><desc id="runlife-desc">Dieser illustrative Ablauf folgt einer koordinierten Operation mit Side Effect: Boot, Plan, Persistieren einer ausstehenden Intent und eines Idempotency Keys, Dispatch, Persistieren des Ergebnisses, Checkpoint, anschließend Evaluation. Unabhängige Read-only- oder idempotente Calls können parallel mit separaten persistenten Records und deterministischer Aggregation ausgeführt werden. Wenn ein Worker nach dem Dispatch und vor dem Schreiben des Ergebnisses abstürzt, startet er mit derselben Session ID, gleicht die ausstehende Intent ab und setzt erst danach fort. Eine fehlgeschlagene Evaluation setzt bei der Planung fort; eine bestandene Evaluation beendet den Lauf sauber.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
