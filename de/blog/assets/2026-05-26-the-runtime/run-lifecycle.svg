<text x="32" y="722" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Jeder abgeschlossene Schritt ist dauerhaft gespeichert, bevor der nächste beginnt; nur laufende Arbeit geht verloren.</text>
<text x="32" y="744" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Ein neuer Worker steigt beim Boot mit derselben Session ID wieder ein — der gesamte Run wird nicht erneut</tspan><tspan x="32" dy="1.2em">abgespielt.</tspan></text>
</svg>
