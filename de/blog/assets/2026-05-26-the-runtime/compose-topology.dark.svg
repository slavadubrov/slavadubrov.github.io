<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Der Worker hält weder Model noch Tool-Credentials — Claude und MCP Sidecar laufen extern.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Redis ist in der lokalen Entwicklung nur deshalb optional, weil der synchrone Runner den Worker direkt aufrufen kann.</text>
