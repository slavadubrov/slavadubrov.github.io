<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" aria-labelledby="artifact-title artifact-desc">
  <title id="artifact-title">Fehlermodi, die ein langlebiger Agent überleben muss</title>
  <desc id="artifact-desc">Fehlermodi, die ein langlebiger Agent überleben muss.</desc>
  <defs>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.08" />
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="940" height="600" fill="#f8fafc" />

  <text y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" x="470">Fehlermodi, die ein langlebiger Agent überleben muss</text>
  <text y="56" text-anchor="middle" font-size="13" fill="#334155" x="470">Links: der Fehler. Rechts: die Gegenmaßnahme und ihr Platz im Runtime.</text>

  <!-- Column headers -->
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" letter-spacing="0.6" x="200">FEHLERMODUS</text>
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.6" x="740">GEGENMASSNAHME · RUNTIME-HOOK</text>

  <!-- Rows -->
  <!-- Row 1: Premature completion -->
  <g filter="url(#ds2)">
    <rect x="40" y="110" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#991b1b" x="56">Vorzeitiger Abschluss</text>
    <text y="152" font-size="11" fill="#334155" x="56">Agent erklärt sich nach einem Turn zum Sieger</text>
  </g>
  <path d="M360 138 L 540 138" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="110" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#166534" x="556">Unabhängiger Reviewer mit eigenem Context</text>
    <text y="152" font-size="11" fill="#334155" x="556">Read-only Tools · jeder Check schlägt standardmäßig fehl</text>
  </g>

  <!-- Row 2: Feature amnesia -->
  <g filter="url(#ds2)">
    <rect x="40" y="178" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#991b1b" x="56">Feature-Amnesie</text>
    <text y="220" font-size="11" fill="#334155" x="56">Jeder Cold Start vergisst den bisherigen Fortschritt</text>
  </g>
  <path d="M360 206 L 540 206" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="178" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#166534" x="556">Initializer liest beim Booten die Fortschrittsdateien erneut ein</text>
    <text y="220" font-size="11" fill="#334155" x="556">PROGRESS.md, feature-list.json · vor dem ersten Model Call</text>
  </g>

  <!-- Row 3: Duplicated work -->
  <g filter="url(#ds2)">
    <rect x="40" y="246" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#991b1b" x="56">Duplizierte Arbeit nach Reset</text>
    <text y="288" font-size="11" fill="#334155" x="56">Derselbe Schritt wird nach einem Prozessneustart erneut ausgeführt</text>
  </g>
  <path d="M360 274 L 540 274" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="246" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#166534" x="556">Checkpoint in Postgres + Handoff-Datei</text>
    <text y="288" font-size="11" fill="#334155" x="556">Append-only-Log · Fortsetzung ab dem zuletzt abgeschlossenen Node</text>
  </g>

  <!-- Row 4: Context anxiety -->
  <g filter="url(#ds2)">
    <rect x="40" y="314" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#991b1b" x="56">Context-Angst</text>
    <text y="356" font-size="11" fill="#334155" x="56">Model beendet die Ausführung vorzeitig, wenn sich das Context Window füllt</text>
  </g>
  <path d="M360 342 L 540 342" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="314" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#166534" x="556">Sonnet 4.5: Nutzung auf 200k begrenzen</text>
    <text y="356" font-size="11" fill="#334155" x="556">Innerhalb eines 1M-Token-Context-Windows; Reset und Fortsetzung</text>
  </g>

  <!-- Row 5: Stuck loops -->
  <g filter="url(#ds2)">
    <rect x="40" y="382" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#991b1b" x="56">Festgefahrene Loops · Retry-Stürme</text>
    <text y="424" font-size="11" fill="#334155" x="56">Derselbe Tool Call wird endlos wiederholt</text>
  </g>
  <path d="M360 410 L 540 410" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="382" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#166534" x="556">Iterationen begrenzen · Backoff · Circuit Breaker</text>
    <text y="424" font-size="11" fill="#334155" x="556">Tool-Call-Decorator · Temporal RetryPolicy</text>
  </g>

  <!-- Row 6: Workspace drift -->
  <g filter="url(#ds2)">
    <rect x="40" y="450" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#991b1b" x="56">Workspace-Drift</text>
    <text y="492" font-size="11" fill="#334155" x="56">Agent bearbeitet Dateien außerhalb seiner Aufgabe</text>
  </g>
  <path d="M360 478 L 540 478" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="450" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#166534" x="556">Session-spezifischer Workspace, Zugriff auf begrenzte Pfade</text>
    <text y="492" font-size="11" fill="#334155" x="556">Deep Agents Middleware oder Daytona/Runloop Fork</text>
  </g>

  <!-- Row 7: Runaway cost / lost work -->
  <g filter="url(#ds2)">
    <rect x="40" y="518" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#991b1b" x="56">Unkontrollierte Kosten · Arbeitsverlust bei einem Crash</text>
    <text y="560" font-size="11" fill="#334155" x="56">Budgetverbrauch · Prozess oder Sandbox stirbt</text>
  </g>
  <path d="M360 546 L 540 546" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="518" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#166534" x="556">Token-Budget · Kill Switch · Log außerhalb des Prozesses</text>
    <text y="560" font-size="11" fill="#334155" x="556">gen_ai.usage-Zähler · wake(sessionId) zur Fortsetzung</text>
  </g>
</svg>
