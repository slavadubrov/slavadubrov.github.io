<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Bi-Encoder-Training – Beispiel</title>
  <desc id="desc">Ein Siamese-Bi-Encoder lernt, eine Query nahe an ihrem positiven Dokument und entfernt von ausgewählten Negativbeispielen zu platzieren.</desc>
  <defs>
    <marker id="arrowTrn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="820" height="480" fill="#0C1210" />

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Bi-Encoder-Trainings-Pipeline</text>
  <text x="410" y="48" text-anchor="middle" font-size="12" fill="#EDF5F0">Kontrastives Lernen mit Hard Negatives (InfoNCE Loss)</text>

  <!-- Training Triplet -->
  <rect x="30" y="70" width="160" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="110" y="93" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Query</text>

  <rect x="330" y="70" width="160" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="410" y="93" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Positives Dokument (d+)</text>

  <rect x="630" y="70" width="160" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="710" y="93" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Hard Negative (d-)</text>

  <!-- Arrows down to encoder -->
  <line x1="110" y1="106" x2="110" y2="148" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />
  <line x1="410" y1="106" x2="410" y2="148" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />
  <line x1="710" y1="106" x2="710" y2="148" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />

  <!-- Shared Encoder (spans across all three) -->
  <rect x="50" y="150" width="720" height="50" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="410" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#EDF5F0">Shared Transformer Encoder</text>
  <text x="410" y="190" text-anchor="middle" font-size="11" fill="#EDF5F0">Geteilte Weights in diesem Siamese-Beispiel</text>

  <!-- Arrows down to embeddings -->
  <line x1="110" y1="200" x2="110" y2="238" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />
  <line x1="410" y1="200" x2="410" y2="238" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />
  <line x1="710" y1="200" x2="710" y2="238" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />

  <!-- Embeddings -->
  <rect x="50" y="240" width="120" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="110" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Query-Embedding</text>

  <rect x="350" y="240" width="120" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="410" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">d+-Embedding</text>

  <rect x="650" y="240" width="120" height="34" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="710" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">d--Embedding</text>

  <!-- Similarity computations -->
  <line x1="150" y1="274" x2="250" y2="320" stroke="#EDF5F0" stroke-width="1.5" marker-end="url(#arrowTrn)" />
  <line x1="380" y1="274" x2="280" y2="320" stroke="#EDF5F0" stroke-width="1.5" marker-end="url(#arrowTrn)" />

  <line x1="150" y1="274" x2="530" y2="320" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowTrn)" />
  <line x1="670" y1="274" x2="570" y2="320" stroke="#EDF5F0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowTrn)" />

  <!-- Similarity boxes -->
  <rect x="205" y="320" width="120" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="265" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">sim(q, d+)</text>
  <text x="265" y="352" text-anchor="middle" font-size="11" fill="#EDF5F0">Maximieren</text>

  <rect x="490" y="320" width="120" height="36" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="550" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">sim(q, d-)</text>
  <text x="550" y="352" text-anchor="middle" font-size="11" fill="#EDF5F0">Minimieren</text>

  <!-- Arrows down to loss -->
  <line x1="265" y1="356" x2="350" y2="396" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />
  <line x1="550" y1="356" x2="465" y2="396" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowTrn)" />

  <!-- Contrastive Loss -->
  <rect x="310" y="398" width="200" height="60" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="410" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">InfoNCE Loss</text>
  <text x="410" y="440" text-anchor="middle" font-size="11" fill="#EDF5F0">-log( exp(sim+/t) /</text>
  <text x="410" y="452" text-anchor="middle" font-size="11" fill="#EDF5F0">S exp(sim_i/t) )</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
