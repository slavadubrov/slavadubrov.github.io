<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1060" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="demoarch-title demoarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="demoarch-title">Die fünfstufige Pipeline der Demo</title><desc id="demoarch-desc">Eine Anfrage speist parallel die BM25 Sparse Retrieval und die Dense Bi-Encoder Retrieval; beide werden mit Reciprocal Rank Fusion zusammengeführt, anschließend mit einem Cross-Encoder rerankt und optional mit einem Listwise LLM, bevor die finalen Top-10-Ergebnisse ausgegeben werden.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="demoarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="demoarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1060" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Fünf Stufen, eine Anfrage</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Die Schritte 1–3 maximieren den Recall; die Schritte 4–5 maximieren die Precision.</text>
