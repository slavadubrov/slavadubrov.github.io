<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="attnmatrix-title attnmatrix-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="attnmatrix-title">Attention-Matrix: Bi-Encoder versus Cross-Encoder</title><desc id="attnmatrix-desc">Die Attention eines Bi-Encoders ist blockdiagonal: Query-Tokens attendieren nur zu Query-Tokens, und Dokument-Tokens attendieren nur zu Dokument-Tokens. Ein Cross-Encoder berechnet die vollständige Attention-Matrix, sodass Query-Tokens auch zu Dokument-Tokens und Dokument-Tokens zu Query-Tokens attendieren.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="attnmatrix-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="attnmatrix-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Blockdiagonale versus vollständige Attention</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Die Q·D- und D·Q-Blöcke des Cross-Encoders sind diejenigen, die ein Bi-Encoder niemals berechnet.</text>
<rect x="32" y="128" width="304" height="300" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">BI-ENCODER</text>
<rect x="384" y="128" width="304" height="300" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="400" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">CROSS-ENCODER</text>
<path d="M58 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">Q · Q</text><text x="62" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">aktiv</text><text x="62" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Self-Attention</text>
<path d="M200 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M200 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="204" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">Q · D</text><text x="204" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">blockiert</text><text x="204" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">keine Überlappung</text>
<path d="M58 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="62" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">D · Q</text><text x="62" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">blockiert</text><text x="62" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">keine Überlappung</text>
<path d="M200 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M200 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="204" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">D · D</text><text x="204" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">aktiv</text><text x="204" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Self-Attention</text>
<path d="M410 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M410 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">Q · Q</text><text x="414" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">aktiv</text><text x="414" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Self-Attention</text>
<path d="M552 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M552 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="556" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">Q · D</text><text x="556" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Cross-Attention</text><text x="556" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">beide Richtungen</text>
<path d="M410 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M410 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="414" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">D · Q</text><text x="414" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">Cross-Attention</text><text x="414" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">beide Richtungen</text>
<path d="M552 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M552 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="556" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">D · D</text><text x="556" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">aktiv</text><text x="556" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Self-Attention</text>
<path d="M32 456h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Bei einem Bi-Encoder attendiert kein Query-Token jemals zu einem Dokument-Token; die beiden Vektoren treffen erst</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">später über ein Skalarprodukt aufeinander.</text>
</svg>
