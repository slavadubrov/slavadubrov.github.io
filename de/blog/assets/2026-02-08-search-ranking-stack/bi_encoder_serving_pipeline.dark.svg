<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Bi-Encoder-Indexierung und Serving</title>
  <desc id="desc">Dokumente werden offline encodiert und indexiert; eine Online-Anfrage wird encodiert und gegen den Vector Index durchsucht. Jeder Online-Schritt muss profiliert werden.</desc>
  <defs>
    <marker id="arrowSrv" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="820" height="420" fill="#0C1210" />

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Bi-Encoder Serving: Offline-Indexierung vs. Online-Anfrage</text>

  <!-- Divider -->
  <line x1="410" y1="50" x2="410" y2="400" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="200" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Offline (Indexierungszeit)</text>
  <text x="620" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Online (Anfragezeit)</text>

  <!-- === LEFT SIDE: Offline === -->

  <!-- Document Corpus -->
  <rect x="50" y="85" width="160" height="40" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="130" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Dokumentenkorpus</text>
  <text x="130" y="118" text-anchor="middle" font-size="11" fill="#EDF5F0">N Dokumente</text>

  <!-- Arrow -->
  <line x1="210" y1="105" x2="250" y2="105" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Encoder -->
  <rect x="255" y="85" width="120" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="315" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Bi-Encoder</text>
  <text x="315" y="118" text-anchor="middle" font-size="11" fill="#EDF5F0">Batch-Encoding</text>

  <!-- Arrow -->
  <line x1="200" y1="125" x2="200" y2="168" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Embeddings Store -->
  <rect x="60" y="170" width="280" height="50" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="200" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Dokument-Embeddings</text>
  <text x="200" y="208" text-anchor="middle" font-size="11" fill="#EDF5F0">N x D-Matrix (z. B. 8500 x 384 = 13 MB)</text>

  <!-- Arrow -->
  <line x1="200" y1="220" x2="200" y2="263" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Vector Index -->
  <rect x="80" y="265" width="240" height="55" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="200" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">Vector Index</text>
  <text x="200" y="305" text-anchor="middle" font-size="11" fill="#EDF5F0">HNSW / IVF / DiskANN</text>

  <!-- One-time label -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="200" y="359" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Einmalig ausgeführt, auf Disk gespeichert</text>

  <!-- === RIGHT SIDE: Online === -->

  <!-- User Query -->
  <rect x="480" y="85" width="140" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="550" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Nutzeranfrage</text>
  <text x="550" y="118" text-anchor="middle" font-size="11" fill="#EDF5F0">"wireless headphones"</text>

  <!-- Arrow -->
  <line x1="620" y1="105" x2="660" y2="105" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Encoder -->
  <rect x="665" y="85" width="120" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="725" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Bi-Encoder</text>
  <text x="725" y="118" text-anchor="middle" font-size="11" fill="#EDF5F0">Single-Encoding</text>

  <!-- Arrow down -->
  <line x1="620" y1="125" x2="620" y2="168" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Query Embedding -->
  <rect x="530" y="170" width="180" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="620" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">Query-Embedding</text>
  <text x="620" y="206" text-anchor="middle" font-size="11" fill="#EDF5F0">1 x D-Vektor</text>

  <!-- Timing label for encode -->
  <rect x="700" y="152" width="70" height="20" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="735" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Profiling</text>

  <!-- Arrow down -->
  <line x1="620" y1="210" x2="620" y2="263" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- ANN Search -->
  <rect x="500" y="265" width="240" height="55" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="620" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">ANN Search</text>
  <text x="620" y="305" text-anchor="middle" font-size="11" fill="#EDF5F0">Query-Embedding vs. Vector Index</text>

  <!-- Timing label for ANN -->
  <rect x="700" y="245" width="70" height="20" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="735" y="259" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">Profiling</text>

  <!-- Cross-connection: Vector Index → ANN Search -->
  <path d="M320,292 Q380,292 410,292 Q440,292 500,292" stroke="#A8B8AF" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowSrv)" />

  <!-- Arrow down to results -->
  <line x1="620" y1="320" x2="620" y2="358" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowSrv)" />

  <!-- Top-K Results -->
  <rect x="510" y="360" width="220" height="40" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="620" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Top-K-Kandidaten</text>
  <text x="620" y="393" text-anchor="middle" font-size="11" fill="#EDF5F0">Nach Cosine Similarity sortiert</text>

  <!-- Total timing -->
  <rect x="700" y="340" width="90" height="20" rx="10" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="745" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#EDF5F0">End-to-End</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
