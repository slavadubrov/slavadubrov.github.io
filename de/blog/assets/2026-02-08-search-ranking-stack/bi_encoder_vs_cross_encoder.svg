<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="bivscross-title bivscross-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="bivscross-title">Bi-Encoder Retrieval versus Cross-Encoder Reranking</title><desc id="bivscross-desc">Ein Bi-Encoder encodiert Query und Dokument unabhängig voneinander und vergleicht sie per Dot Product, sodass Document Embeddings vorab berechnet werden können. Ein Cross-Encoder verkettet Query und Dokument zu einer Sequenz und erzeugt aus vollständiger Cross-Attention einen Relevance Score, der zur Query-Zeit berechnet werden muss.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="bivscross-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="bivscross-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="660" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Unabhängige Encoding versus gemeinsames Encoding</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Unabhängiges Encoding ermöglicht vorab berechnetes Retrieval; gemeinsames Encoding läuft pro Query,</tspan><tspan x="32" dy="1.2em">erfasst aber mehr.</tspan></text>
<rect x="32" y="128" width="304" height="404" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">BI-ENCODER · RETRIEVAL</text>
<rect x="384" y="128" width="304" height="404" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="400" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">CROSS-ENCODER · RERANKING</text>
<path d="M58 172h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 172h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">INPUT</text><text x="62" y="233" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Query &amp; Dokument</text><text x="62" y="255" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Separat encodiert, nie kombiniert</text>
<path d="M184 276v16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bivscross-arrow-flow)" />
<path d="M58 292h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 292h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="309.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">ENCODE</text><text x="62" y="353" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Unabhängige Türme</text><text x="62" y="375" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Keine gemeinsame Attention</text>
<path d="M184 396v16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bivscross-arrow-flow)" />
<path d="M58 412h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 412h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2F2F5" /><text x="62" y="429.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">SCORE</text><text x="62" y="473" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Dot Product</text><text x="62" y="495" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="62">Aus gespeicherten Embeddings</tspan><tspan x="62" dy="1.2em">wiederverwendet</tspan></text>
<path d="M410 172h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M410 172h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">INPUT</text><text x="414" y="233" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">[CLS] query [SEP] doc</text><text x="414" y="255" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Zu einer Sequenz verkettet</text>
<path d="M536 276v16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bivscross-arrow-flow)" />
<path d="M410 292h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M410 292h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="414" y="309.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">TRANSFORM</text><text x="414" y="353" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Gemeinsamer Encoder</text><text x="414" y="375" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="414">Vollständige Cross-Attention, jedes</tspan><tspan x="414" dy="1.2em">Token-Paar</tspan></text>
<path d="M536 396v16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bivscross-arrow-flow)" />
<path d="M410 412h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M410 412h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="414" y="429.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOKUS · SCORE</text><text x="414" y="473" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Relevance Score</text><text x="414" y="495" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ein Forward Pass pro Kandidatenpaar</text>
<path d="M32 568h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="594" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ein Bi-Encoder lässt Query- und Dokument-Tokens vor dem Dot Product nie interagieren. Ein Cross-</text>
<text x="32" y="616" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Encoder attendiert über beide hinweg – das kann sich eine Reranking-Stufe leisten, nicht aber</tspan><tspan x="32" dy="1.2em">vollständiges Retrieval.</tspan></text>
</svg>
