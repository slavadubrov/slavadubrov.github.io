<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">LoRAX Request Path von der Adapterauflösung bis zur Generation</title>
  <desc id="desc">Ein authentifizierter Request liefert eine allowlistete Adapter-ID. LoRAX ermittelt die Residency, lädt den Adapter bei Bedarf, bündelt kompatible Workloads, wendet den Adapter auf das gemeinsame Base Model an und streamt Tokens. Abgelehnte Identitäten und Artefakte nehmen einen Fehlerpfad.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="500" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">LoRAX Request Path</text>
  <text x="500" y="77" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">Die Adapteridentität ist ein autorisierter Routing-Input, kein beliebiger öffentlicher Input</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(25 125)"><rect width="150" height="110" rx="14" fill="#1e293b" stroke="#64748b" /><text x="75" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Gateway</text><text x="75" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">Tenant authentifizieren</text><text x="75" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">Adapter allowlisten</text></g>
    <text x="197" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(220 125)"><rect width="165" height="110" rx="14" fill="#5b21b6" stroke="#2563eb" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Resolver</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">Residency prüfen</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">Bei Abwesenheit laden</text></g>
    <text x="407" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(430 125)"><rect width="165" height="110" rx="14" fill="#9a3412" stroke="#ea580c" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fdba74">Scheduler</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">Nach Readiness einreihen</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">Gemischten Batch bilden</text></g>
    <text x="617" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(640 125)"><rect width="165" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">GPU Inference</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">Gemeinsames Base Model</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">Adapter pro Request</text></g>
    <text x="827" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(850 125)"><rect width="125" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="62" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Stream</text><text x="62" y="75" text-anchor="middle" font-size="12" fill="#93c5fd">Output-Tokens</text></g>

    <g transform="translate(220 315)"><rect width="585" height="105" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="292" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Residency Path für jeden Request beobachten</text><text x="45" y="66" font-size="13" fill="#cbd5e1">GPU-Treffer</text><text x="160" y="66" font-size="13" fill="#cbd5e1">CPU-Treffer</text><text x="275" y="66" font-size="13" fill="#cbd5e1">Artefakt-Treffer</text><text x="410" y="66" font-size="13" fill="#cbd5e1">Remote-Miss</text><text x="45" y="88" font-size="12" fill="#94a3b8">Queue-, Load-, First-Token-, Gesamt-Latency und Fehlergrund erfassen.</text></g>
    <text x="500" y="465" text-anchor="middle" font-size="13" fill="#fca5a5">Nicht autorisierter Adapter, inkompatibles Artefakt oder Load-Fehler → ablehnen oder expliziten Fallback verwenden</text>
  </g>
</svg>
