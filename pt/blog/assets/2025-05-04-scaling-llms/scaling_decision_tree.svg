<text x="32" y="538" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Estado → FSDP · matemática das layers → TP · profundidade → PP · sequência → CP · experts → EP</text>
<text x="32" y="560" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Uma heurística escolhe candidatos com base na topologia; o benchmarking escolhe o vencedor.</text>
