<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 592" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="sdt-title sdt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="sdt-title">Workflow de scaling distribuído orientado por restrições</title><desc id="sdt-desc">Faça o profiling da workload, classifique a sua restrição limitadora, posicione os collectives na topologia e, em seguida, faça o benchmark das meshes candidatas. Um layout que cumpra os requisitos com margem e obtenha o melhor desempenho medido torna-se a escolha implementável; um layout que falhe na validação faz o processo regressar ao benchmarking.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="sdt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="sdt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="592" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Workflow de scaling distribuído orientado por restrições</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Faça o profiling da workload, classifique a restrição e faça o benchmark antes de escolher um layout.</text>
