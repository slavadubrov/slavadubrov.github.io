<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="silent-failure-title silent-failure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="silent-failure-title">Falhas silenciosas de RAG e a métrica que identifica cada origem</title>
  <desc id="silent-failure-desc">A evidência passa pelo corpus de origem, pelo conjunto de candidatos elegíveis e pelo contexto ordenado até chegar à resposta suportada. Cada etapa aponta para uma métrica de diagnóstico. O conjunto de candidatos elegíveis está realçado porque um filtro rígido pode remover o documento gold antes da recuperação.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="silent-failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
  <rect width="960" height="568" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">FALHA SILENCIOSA · ORIGEM PARA MÉTRICA</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Encontre a etapa que removeu a evidência</text>
  <text x="48" y="102" fill="#59645e" font-size="13">A primeira ligação quebrada limita todas as pontuações à sua direita.</text>

  <rect x="48" y="136" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="64" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · ORIGEM</text>
  <text x="64" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Artefactos do corpus</text>
  <text x="64" y="218" fill="#59645e" font-size="13" style="font-size: 11px;">analisar · dividir em chunks · indexar</text>
  <path d="M232 184H264" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="136" width="184" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text x="288" y="168" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCO · FILTRO</text>
  <text x="288" y="198" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600" style="font-size: 16px;">Documentos elegíveis</text>
  <text x="288" y="218" fill="#59645e" font-size="13" style="font-size: 11px;">o documento gold pode ser removido</text>
  <path d="M456 184H488" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="136" width="184" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="512" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSAMENTO · RANKER</text>
  <text x="512" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Contexto ordenado</text>
  <text x="512" y="218" fill="#59645e" font-size="13" style="font-size: 11px;">despromoção · perda intermédia</text>
  <path d="M680 184H712" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="136" width="192" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="736" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSAMENTO · GERADOR</text>
  <text x="736" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Resposta suportada</text>
  <text x="736" y="218" fill="#59645e" font-size="13">afirmações · citações</text>

  <path d="M140 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="48" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="64" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · MÉTRICA</text>
  <text x="64" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">CER/WER · TEDS</text>
  <text x="64" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" style="font-size: 12.5px;">recall de ANN · atualização</text>
  <path d="M364 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="288" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · MÉTRICA</text>
  <text x="288" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recall@k</text>
  <text x="288" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" style="font-size: 13px;">Taxa de exclusão indevida</text>
  <path d="M588 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="512" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · MÉTRICA</text>
  <text x="512" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ΔnDCG · distratores</text>
  <text x="512" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Teste de posição</text>
  <path d="M816 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="336" width="192" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="736" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · MÉTRICA</text>
  <text x="736" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Fidelidade</text>
  <text x="736" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" style="font-size: 13px;">precisão/recall das citações</text>

  <path d="M48 472H912" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="48" y="502" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k deteta o documento gold em falta.</text>
  <text x="48" y="528" fill="#59645e" font-size="13">A taxa de exclusão indevida identifica o predicado do filtro como causa; a fidelidade não.</text>
  <rect x="42" y="262" width="352" height="20" fill="#F7F7F4" />
  <text x="48" y="276" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">A MÉTRICA QUE ATRIBUI CADA FALHA</text>
</svg>
