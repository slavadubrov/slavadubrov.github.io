<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Silent failure taxonomy with the metric that catches each mode" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Taxonomia de falhas silenciosas com a métrica que deteta cada modo</title>
  <defs>
    <filter id="shadowSF" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="720" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">Taxonomia de falhas silenciosas</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#0f172a" x="590">Cada modo de falha é associado à métrica que o deteta. Sem a métrica, o bug é invisível.</text>

  <!-- Root -->
  <rect x="475" y="78" width="230" height="44" rx="22" fill="#dc2626" filter="url(#shadowSF)" />
  <text y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" x="590">Falha silenciosa (RAG)</text>

  <!-- Trunk: 4 main branches -->
  <line x1="540" y1="122" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="570" y1="122" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="610" y1="122" x2="730" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="640" y1="122" x2="1010" y2="170" stroke="#94a3b8" stroke-width="1.4" />

  <!-- ====== Branch A: Ingestion ====== -->
  <rect x="40" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="170">Falhas de ingestão</text>

  <!-- A1: Parse loss -->
  <rect x="40" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Perda na análise</text>
  <text y="261" font-size="11" fill="#0f172a" x="50">tabelas colapsam · notas de rodapé</text>
  <text y="275" font-size="11" fill="#0f172a" x="50">eliminadas · OCR baralha dígitos</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="50">detetado por: CER/WER, TEDS</text>

  <!-- A2: Chunk break -->
  <rect x="40" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Quebra de chunk</text>
  <text y="336" font-size="11" fill="#0f172a" x="50">o answer span é dividido por dois</text>
  <text y="350" font-size="11" fill="#0f172a" x="50">chunks; nenhum contém toda a evidência</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="50">detetado por: contenção do answer span</text>

  <!-- A3: Dedup miss -->
  <rect x="40" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Erro de deduplicação</text>
  <text y="411" font-size="11" fill="#0f172a" x="50">fusão indevida corrompe a resposta;</text>
  <text y="425" font-size="11" fill="#0f172a" x="50">manter duplicados enterra o documento certo</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="50">detetado por: precisão/recall de duplicados</text>

  <!-- A4: Normalization -->
  <rect x="40" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Deriva de normalização</text>
  <text y="486" font-size="11" fill="#0f172a" x="50">incompatibilidade NFC vs NFKC quebra</text>
  <text y="500" font-size="11" fill="#0f172a" x="50">a resolução de aliases por correspondência exata</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="50">detetado por: paridade NFC/NFKC, cobertura de aliases</text>

  <!-- ====== Branch B: Embedding/Index ====== -->
  <rect x="320" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="450">Embedding e índice</text>

  <!-- B1: Embedding miss -->
  <rect x="320" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Falha de embedding</text>
  <text y="261" font-size="11" fill="#0f172a" x="330">o termo do domínio fica fora da</text>
  <text y="275" font-size="11" fill="#0f172a" x="330">distribuição de treino do modelo</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="330">detetado por: Recall@k do domínio vs. baseline</text>

  <!-- B2: ANN drop -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Queda de aproximação ANN</text>
  <text y="336" font-size="11" fill="#0f172a" x="330">efSearch do HNSW demasiado baixo; o vetor</text>
  <text y="350" font-size="11" fill="#0f172a" x="330">gold existe, mas não é alcançado</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="330">detetado por: recall ANN vs. flat</text>

  <!-- B3: Embedding drift -->
  <rect x="320" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Deriva de embedding</text>
  <text y="411" font-size="11" fill="#0f172a" x="330">atualização da versão do modelo do provider;</text>
  <text y="425" font-size="11" fill="#0f172a" x="330">os vetores antigos deixam de estar alinhados</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="330">detetado por: estabilidade NN do probe set</text>

  <!-- B4: Stale index -->
  <rect x="320" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Índice obsoleto</text>
  <text y="486" font-size="11" fill="#0f172a" x="330">atraso de atualização; as queries são executadas</text>
  <text y="500" font-size="11" fill="#0f172a" x="330">sobre a verdade da semana passada</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="330">detetado por: atraso de atualização p99, % obsoleto</text>

  <!-- ====== Branch C: Online retrieval (HOT — silent killers) ====== -->
  <rect x="600" y="170" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="730">Retrieval online</text>

  <!-- C1: Filter exclude (highlighted) -->
  <rect x="600" y="225" width="260" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#991b1b" x="610">Falsa exclusão por filtro</text>
  <text y="261" font-size="11" fill="#0f172a" x="610">predicado rígido elimina o documento gold;</text>
  <text y="275" font-size="11" fill="#0f172a" x="610">Recall@k diminui, mas não é possível identificar a causa</text>
  <text y="285" font-size="11" font-style="italic" fill="#991b1b" x="610">detetado por: taxa de falsa exclusão do filtro</text>

  <!-- C2: Rerank miss -->
  <rect x="600" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#991b1b" x="610">Falha no rerank</text>
  <text y="336" font-size="11" fill="#0f172a" x="610">o cross-encoder despromove o documento certo</text>
  <text y="350" font-size="11" fill="#0f172a" x="610">para trás de distractores plausíveis</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="610">detetado por: ΔnDCG, robustez a distractores</text>

  <!-- C3: Lost in middle -->
  <rect x="600" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#991b1b" x="610">Perdido no meio</text>
  <text y="411" font-size="11" fill="#0f172a" x="610">o chunk gold está no contexto, mas na</text>
  <text y="425" font-size="11" fill="#0f172a" x="610">posição 7/10; o modelo ignora-o</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="610">detetado por: avaliação estratificada por posição</text>

  <!-- C4: Bad rewrite -->
  <rect x="600" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#991b1b" x="610">Regressão na reescrita da query</text>
  <text y="486" font-size="11" fill="#0f172a" x="610">o HyDE alucina uma entidade que</text>
  <text y="500" font-size="11" fill="#0f172a" x="610">inclina o retrieval na direção errada</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="610">detetado por: ganho/perda da rewrite em A/B</text>

  <!-- ====== Branch D: Generation/Citation ====== -->
  <rect x="880" y="170" width="260" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="1010">Geração</text>

  <!-- D1: Hallucination -->
  <rect x="880" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#5b21b6" x="890">Alucinação</text>
  <text y="261" font-size="11" fill="#0f172a" x="890">afirmação sem suporte, frequentemente uma</text>
  <text y="275" font-size="11" fill="#0f172a" x="890">entidade que não está no contexto</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="890">detetado por: faithfulness, HHEM, FActScore</text>

  <!-- D2: No citation -->
  <rect x="880" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#5b21b6" x="890">Teatro de citações</text>
  <text y="336" font-size="11" fill="#0f172a" x="890">o span citado não suporta realmente</text>
  <text y="350" font-size="11" fill="#0f172a" x="890">a afirmação que lhe está próxima</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="890">detetado por: P/R de citações (TREC)</text>

  <!-- D3: Wrong refusal -->
  <rect x="880" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#5b21b6" x="890">Abstenção errada</text>
  <text y="411" font-size="11" fill="#0f172a" x="890">"Não sei" quando a resposta</text>
  <text y="425" font-size="11" fill="#0f172a" x="890">está no contexto (ou vice-versa)</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="890">detetado por: NoMIRACL, precisão da abstenção</text>

  <!-- D4: Schema break -->
  <rect x="880" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#5b21b6" x="890">Falha de schema/vocabulário</text>
  <text y="486" font-size="11" fill="#0f172a" x="890">o output sintaticamente válido escolhe</text>
  <text y="500" font-size="11" fill="#0f172a" x="890">um ID de ontologia errado, mas válido</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="890">detetado por: conformidade do vocabulário</text>

  <!-- Footer band -->
  <rect x="40" y="555" width="1100" height="68" rx="8" fill="#f0fdf4" stroke="#ea580c" stroke-width="1.2" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="590">Guia de leitura</text>
  <text y="598" text-anchor="middle" font-size="11" fill="#9a3412" x="590">Cada falha é silenciosa na ausência da sua métrica. A "correção da resposta" padrão, por si só, indica que algo está avariado — não onde.</text>
  <text y="614" text-anchor="middle" font-size="11" fill="#9a3412" x="590">O ramo vermelho abrange as verificações de filtro, rerank, posição no contexto e rewrite. Instrumente as etapas que podem remover evidência.</text>

  <!-- Visual cue: the 'red' propagation -->
  <rect x="40" y="640" width="1100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="662" font-size="11" font-weight="600" fill="#0f172a" x="60">A regra de propagação:</text>
  <text y="682" font-size="11" fill="#0f172a" x="60">Uma falha à esquerda é um teto de recall para tudo o que está à direita. Uma análise deficiente limita o chunking. Um chunking deficiente limita o retrieval.</text>
  <text y="696" font-size="11" fill="#0f172a" x="60">Um retrieval deficiente limita o reranking. Um reranking deficiente limita a geração. A faithfulness mede apenas o último elo — não consegue ver a cadeia quebrada.</text>
</svg>
