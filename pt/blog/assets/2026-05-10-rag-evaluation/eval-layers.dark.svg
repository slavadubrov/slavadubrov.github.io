<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eval-layers-title eval-layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="eval-layers-title">Três pontos onde um sistema RAG pode perder evidência</title>
  <desc id="eval-layers-desc">O diagrama acompanha a evidência através do corpus e do índice, do percurso de retrieval e da resposta e do tráfego em produção. Cada camada tem métricas de diagnóstico e todas são avaliadas offline e online. O percurso de retrieval está destacado porque os filtros podem remover silenciosamente o documento gold.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="eval-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">PERCURSO DA EVIDÊNCIA · TRÊS CAMADAS DE AVALIAÇÃO</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Localize o primeiro ponto onde a evidência desaparece</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Uma métrica downstream não consegue explicar uma perda upstream.</text>

  <rect x="48" y="136" width="256" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="170" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · INGESTÃO</text>
  <text x="68" y="200" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Corpus e índice</text>
  <path d="M304 184H344" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#eval-layers-arrow)" />
  <rect x="352" y="136" width="256" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="372" y="170" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCO · TEMPO DE QUERY</text>
  <text x="372" y="200" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Percurso de retrieval</text>
  <path d="M608 184H648" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#eval-layers-arrow)" />
  <rect x="656" y="136" width="256" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="676" y="170" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSAMENTO · RESPOSTA</text>
  <text x="676" y="200" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600"><tspan x="676">Resposta e tráfego em</tspan><tspan x="676" dy="1.2em">produção</tspan></text>

  <path d="M48 264H304" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="288" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNÓSTICO</text>
  <text x="48" y="314" fill="#a8b8af" font-size="13">CER/WER · TEDS · atualidade</text>
  <text x="48" y="334" fill="#a8b8af" font-size="13">Recall de ANN vs. pesquisa exata</text>
  <path d="M352 264H608" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="352" y="288" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNÓSTICO</text>
  <text x="352" y="314" fill="#a8b8af" font-size="13">Recall@k · taxa de exclusão indevida</text>
  <text x="352" y="334" fill="#a8b8af" font-size="13">ΔnDCG · utilização do contexto</text>
  <path d="M656 264H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="656" y="288" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">DIAGNÓSTICO</text>
  <text x="656" y="314" fill="#a8b8af" font-size="13">Fidelidade · suporte das citações</text>
  <text x="656" y="334" fill="#a8b8af" font-size="13">Drift · latência · custo</text>

  <path d="M48 370H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="398" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">EXECUTE TODAS AS CAMADAS NOS DOIS MODOS</text>
  <rect x="48" y="418" width="408" height="62" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="444" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO · OFFLINE</text>
  <text x="68" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Golden set · comparação · CI gate</text>
  <rect x="504" y="418" width="408" height="62" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="524" y="444" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">MODO · ONLINE</text>
  <text x="524" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" style="font-size: 15px;">Amostras em produção · sinais dos utilizadores · drift</text>
</svg>
