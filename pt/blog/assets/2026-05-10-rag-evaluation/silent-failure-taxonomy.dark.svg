<text x="32" y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Recall@k deteta o documento gold em falta.</text>
<text x="32" y="464" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Uma métrica de falsa exclusão identifica o filtro como causa; faithfulness não consegue diagnosticá-la.</text>
