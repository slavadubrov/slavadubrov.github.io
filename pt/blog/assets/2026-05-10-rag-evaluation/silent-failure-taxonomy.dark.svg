<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="silentfailure-title silentfailure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="silentfailure-title">Um fluxo em quatro fases atribui cada falha silenciosa à métrica que a identifica.</title><desc id="silentfailure-desc">A evidência passa pelo corpus de origem, pelo conjunto de documentos elegíveis, pelo contexto ordenado e pela resposta gerada. O conjunto de documentos elegíveis é o foco, porque um filtro rígido pode remover o documento gold antes do ranking. Cada fase está associada à métrica que deteta uma falha nessa fase: métricas de parsing, Recall@k e taxa de falsa exclusão, métricas de posição e de distractores, e faithfulness com precisão e recall de citações.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="silentfailure-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="silentfailure-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="520" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Encontre a fase que removeu a evidência</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A primeira ligação quebrada limita todas as pontuações à sua direita.</text>
