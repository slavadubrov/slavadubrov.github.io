<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Three places where a RAG system can lose evidence: ingestion, query time, and the answer or production environment" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Três pontos onde um sistema RAG pode perder evidência</title>
  <defs>
    <marker id="arrLayer" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b" />
    </marker>
    <filter id="shadowL" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="660" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">Três pontos onde um sistema RAG pode perder evidência</text>
  <text y="56" text-anchor="middle" font-size="12" fill="#64748b" x="590">Ingestão · Pipeline em tempo de consulta · Qualidade das respostas e comportamento em produção</text>

  <!-- =============== Layer 1: Ingestion =============== -->
  <rect x="30" y="80" width="1120" height="160" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowL)" />
  <text y="106" font-size="14" font-weight="700" fill="#1d4ed8" x="55">Camada 1 · Ingestão</text>
  <text y="124" font-size="11" fill="#1d4ed8" x="55">Pergunta: o corpus e o índice preservaram a fonte?</text>

  <!-- Sub-cards -->
  <rect x="55" y="140" width="240" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="175">Preparação do corpus</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="175">taxa de sucesso do parsing · CER/WER</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="175">TEDS · cobertura de metadados</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="175">atualidade · deduplicação</text>

  <rect x="305" y="140" width="240" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="425">Chunking</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="425">contenção do segmento da resposta</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="425">taxa de quebras nos limites</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="425">redundância de overlap</text>

  <rect x="555" y="140" width="240" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="675">Embedding · Índice</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="675">nDCG@10 no domínio</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="675">recall de ANN vs. flat</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="675">baseline de drift</text>

  <rect x="805" y="140" width="320" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="965">Enrichment (NER · EL · tags)</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="965">F1 de EL · tratamento de NIL · cobertura de aliases</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="965">F1 hierárquico · taxa de tags órfãs</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="965">validade do schema no momento da publicação</text>

  <!-- Arrow down to Layer 2 -->
  <line x1="590" y1="244" x2="590" y2="280" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLayer)" />
  <text y="265" font-size="11" fill="#64748b" font-style="italic" x="700">define o limite superior de recall para tudo o que se segue</text>

  <!-- =============== Layer 2: Query time =============== -->
  <rect x="30" y="290" width="1120" height="160" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowL)" />
  <text y="316" font-size="14" font-weight="700" fill="#9a3412" x="55">Camada 2 · Tempo de consulta</text>
  <text y="334" font-size="11" fill="#9a3412" x="55">Pergunta: o pipeline encontrou e reuniu a evidência certa?</text>

  <rect x="55" y="350" width="240" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="175">Compreensão da consulta</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#64748b" x="175">ganho/perda da reescrita</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#64748b" x="175">precisão do routing</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#64748b" x="175">cobertura da decomposição</text>

  <rect x="305" y="350" width="240" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="425">Retrieval</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#64748b" x="425">Recall@k · MRR · nDCG · MAP</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#64748b" x="425">precisão/recall do contexto</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#64748b" x="425">ganho híbrido face a cada via</text>

  <rect x="555" y="350" width="240" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" x="675">Filtragem (zona crítica)</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#991b1b" x="675">taxa de exclusão indevida pelo filtro</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#991b1b" x="675">precisão/recall do predicado</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#991b1b" x="675">Δ de shadow retrieval</text>

  <rect x="805" y="350" width="320" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="965">Reranking · Montagem do contexto</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#64748b" x="965">ΔnDCG · ΔMRR face a sem rerank</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#64748b" x="965">utilização do contexto · lost-in-middle</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#64748b" x="965">robustez a distractores (RGB)</text>

  <!-- Arrow down to Layer 3 -->
  <line x1="590" y1="454" x2="590" y2="490" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLayer)" />
  <text y="475" font-size="11" fill="#64748b" font-style="italic" x="700">fornece contexto verificado à geração</text>

  <!-- =============== Layer 3: Answer and production =============== -->
  <rect x="30" y="500" width="1120" height="135" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowL)" />
  <text y="526" font-size="14" font-weight="700" fill="#166534" x="55">Camada 3 · Resposta e produção</text>
  <text y="544" font-size="11" fill="#166534" x="55">Pergunta: a resposta usou a evidência e a qualidade mantém-se sob tráfego real?</text>

  <rect x="55" y="558" width="240" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="175">Fidelidade</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="175">RAGAS · HHEM · FActScore</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="175">verificador NLI · autoconsistência</text>

  <rect x="305" y="558" width="240" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="425">Citações e estrutura</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="425">precisão/recall das citações</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="425">validade do schema · conformidade vocabular</text>

  <rect x="555" y="558" width="240" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="675">Sinal implícito + explícito</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="675">taxa de regeneração · tempo de permanência · CTR nas citações</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="675">polegares · estrelas · edições inline</text>

  <rect x="805" y="558" width="320" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="965">Drift · custo · latência · HITL</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="965">drift de consulta/embedding · latência p95 · $/consulta</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="965">avaliação shadow · fila de revisão de baixa confiança</text>
</svg>
