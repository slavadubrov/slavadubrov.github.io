<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ragpipeline-title ragpipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ragpipeline-title">Cada etapa da pipeline RAG é associada a um conjunto de métricas de diagnóstico.</title><desc id="ragpipeline-desc">O percurso de ingestão — analisar, limpar, dividir em chunks, enriquecer, gerar embeddings, indexar — é associado a métricas de ingestão. O percurso da query — reescrever, filtrar, recuperar, fazer reranking, montar o contexto — é associado a métricas em tempo de query e é o foco, porque a filtragem pode remover evidência antes do ranking. O percurso da resposta — gerar, verificar claims, citar, devolver, observar o tráfego — é associado a métricas de resposta e de produção.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ragpipeline-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ragpipeline-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="620" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Coloque uma métrica de diagnóstico junto a cada etapa</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Os gates end-to-end decidem o release; as métricas por etapa explicam a falha.</text>
<path d="M42 136h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 136h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PERCURSO DE INGESTÃO</text><text x="46" y="196" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17px;">Analisar → limpar → dividir em chunks</text><text x="46" y="218" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Gerar embeddings → indexar</text>
<path d="M352 188h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ragpipeline-arrow-flow)" />
<path d="M378 136h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M378 136h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="382" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">AVALIAÇÕES DE INGESTÃO</text><text x="382" y="197" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">CER/WER · TEDS · F1 de entidades</text><text x="382" y="219" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Recall de ANN · atraso de atualização</text>
<path d="M192 240v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ragpipeline-arrow-flow)" />
<path d="M42 272h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 272h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="289.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PERCURSO DA QUERY</text><text x="46" y="332" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Reescrever → filtrar → recuperar</text><text x="46" y="354" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17.5px;">Fazer reranking → montar o contexto</text>
<path d="M352 324h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ragpipeline-arrow-flow)" />
<path d="M378 272h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M378 272h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="382" y="289.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">AVALIAÇÕES DE QUERY</text><text x="382" y="333" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Recall@k · exclusão indevida</text><text x="382" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ΔnDCG · utilização do contexto</text>
<path d="M192 376v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ragpipeline-arrow-flow)" />
<path d="M42 408h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 408h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PERCURSO DA RESPOSTA</text><text x="46" y="468" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Gerar → verificar claims</text><text x="46" y="490" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Devolver → observar o tráfego</text>
<path d="M352 460h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ragpipeline-arrow-flow)" />
<path d="M378 408h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M378 408h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="382" y="425.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">AVALIAÇÕES DA RESPOSTA</text><text x="382" y="469" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Fidelidade · P/R de citações</text><text x="382" y="491" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Drift · custo/query · p95</text>
<path d="M32 552h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="578" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Uma etapa sem uma métrica pode falhar sem que ninguém dê por isso.</text>
</svg>
