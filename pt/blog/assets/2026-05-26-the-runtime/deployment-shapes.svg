<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Deployment shapes and their run-length sweet spots" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Formas de deployment e respetivos pontos ideais de duração</title>
  <desc>Diagrama: formas de deployment.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="980" height="540" fill="#F7F7F4" />

  <text y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#17211B" x="490">Formas de deployment por ponto ideal de duração</text>
  <text y="56" text-anchor="middle" font-size="12" fill="#17211B" x="490">Cada barra mostra onde a forma funciona bem; as secções esbatidas representam território de extensão.</text>

  <!-- Time axis -->
  <line x1="120" y1="490" x2="940" y2="490" stroke="#59645E" stroke-width="1.5" />
  <!-- Ticks -->
  <g font-size="11" fill="#59645E" text-anchor="middle">
    <line x1="120" y1="486" x2="120" y2="494" stroke="#59645E" />
    <text y="512" x="120">0 s</text>
    <line x1="240" y1="486" x2="240" y2="494" stroke="#59645E" />
    <text y="512" x="240">30 s</text>
    <line x1="360" y1="486" x2="360" y2="494" stroke="#59645E" />
    <text y="512" x="360">5 min</text>
    <line x1="500" y1="486" x2="500" y2="494" stroke="#59645E" />
    <text y="512" x="500">60 min</text>
    <line x1="640" y1="486" x2="640" y2="494" stroke="#59645E" />
    <text y="512" x="640">5 h</text>
    <line x1="780" y1="486" x2="780" y2="494" stroke="#59645E" />
    <text y="512" x="780">24 h</text>
    <line x1="920" y1="486" x2="920" y2="494" stroke="#59645E" />
    <text y="512" x="920">7 dias</text>
  </g>
  <text y="530" text-anchor="middle" font-size="11" fill="#17211B" font-style="italic" x="490">duração →</text>

  <!-- Row helpers: y positions for each bar -->
  <!-- 1) SDK in app server: 0-30s sweet, 30s-60min stretch -->
  <g>
    <rect x="120" y="90" width="120" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <rect x="240" y="90" width="260" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" opacity="0.45" />
    <text y="108" font-size="12" font-weight="600" fill="#17211B" x="135" style="font-size: 11px;">SDK no servidor da aplicação</text>
  </g>
  <text y="108" font-size="11" fill="#17211B" x="510">pedido síncrono; perde-se em caso de crash</text>

  <!-- 2) Queue + worker + checkpoint DB: 30s-5h sweet, 5h-24h stretch -->
  <g>
    <rect x="240" y="130" width="400" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <rect x="640" y="130" width="140" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" opacity="0.5" />
    <text y="148" font-size="12" font-weight="600" fill="#17211B" x="255" style="font-size: 11px;">Queue + worker + base de dados de checkpoints ← stack de referência</text>
  </g>

  <!-- 3) Durable workflow (Temporal): 60min-7days sweet -->
  <g>
    <rect x="500" y="170" width="420" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <text y="188" font-size="12" font-weight="600" fill="#17211B" x="515">Motor de workflows duráveis (Temporal)</text>
  </g>

  <!-- 4) Sandbox-per-session (E2B/Daytona/etc.): 30s-24h -->
  <g>
    <rect x="240" y="210" width="540" height="26" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.4" />
    <text y="228" font-size="12" font-weight="600" fill="#17211B" x="255">Sandbox por sessão (E2B · Daytona · Modal · Runloop · Vercel)</text>
  </g>

  <!-- 5) Anthropic Managed Agents -->
  <g>
    <rect x="240" y="250" width="540" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <text y="268" font-size="12" font-weight="600" fill="#17211B" x="255">Anthropic Managed Agents · $0,08 / hora de sessão, inatividade gratuita</text>
  </g>

  <!-- 6) Deep Agents Deploy -->
  <g>
    <rect x="240" y="290" width="560" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <text y="308" font-size="12" font-weight="600" fill="#17211B" x="255">LangChain Deep Agents Deploy · backend de sandbox permutável</text>
  </g>

  <!-- 7) Cloud Run service -->
  <g>
    <rect x="120" y="330" width="380" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <text y="348" font-size="12" font-weight="600" fill="#17211B" x="135">Serviço Cloud Run · máximo de 60 min por HTTP</text>
  </g>

  <!-- 8) Cloud Run job -->
  <g>
    <rect x="360" y="370" width="560" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <text y="388" font-size="12" font-weight="600" fill="#17211B" x="375">Cloud Run job · máximo de 7 dias; jobs com GPU no máximo 1 h</text>
  </g>

  <!-- 9) Lambda (wrong tool) -->
  <g>
    <rect x="120" y="410" width="220" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" />
    <text y="428" font-size="12" font-weight="600" fill="#17211B" x="135">AWS Lambda · limite de 15 min</text>
    <text y="428" font-size="12" fill="#59645E" x="352">limite rígido — ferramenta inadequada para execuções longas</text>
  </g>

  <!-- 10) Fargate task / K8s Job -->
  <g>
    <rect x="240" y="450" width="680" height="26" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.4" class="visual-focus" />
    <text y="468" font-size="12" font-weight="600" fill="#17211B" x="255">Tarefa Fargate · K8s Job · sem limite documentado, a durabilidade fica a seu cargo</text>
  </g>

  <!-- Vertical guides -->
  <line x1="240" y1="80" x2="240" y2="486" stroke="#17211B" stroke-dasharray="3 3" />
  <line x1="500" y1="80" x2="500" y2="486" stroke="#17211B" stroke-dasharray="3 3" />
  <line x1="780" y1="80" x2="780" y2="486" stroke="#17211B" stroke-dasharray="3 3" />

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
