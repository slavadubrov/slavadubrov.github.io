<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" aria-labelledby="artifact-title artifact-desc">
  <title id="artifact-title">Modos de falha que um agente de longa duração tem de suportar</title>
  <desc id="artifact-desc">Modos de falha que um agente de longa duração tem de suportar.</desc>
  <defs>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.08" />
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="940" height="600" fill="#f8fafc" />

  <text y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" x="470">Modos de falha que um agente de longa duração tem de suportar</text>
  <text y="56" text-anchor="middle" font-size="13" fill="#334155" x="470">Esquerda: a falha. Direita: a mitigação e onde reside no runtime.</text>

  <!-- Column headers -->
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" letter-spacing="0.6" x="200">MODO DE FALHA</text>
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.6" x="740">MITIGAÇÃO · HOOK DO RUNTIME</text>

  <!-- Rows -->
  <!-- Row 1: Premature completion -->
  <g filter="url(#ds2)">
    <rect x="40" y="110" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#991b1b" x="56">Conclusão prematura</text>
    <text y="152" font-size="11" fill="#334155" x="56">O agente declara vitória após um turno</text>
  </g>
  <path d="M360 138 L 540 138" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="110" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#166534" x="556">Revisor independente com o seu próprio contexto</text>
    <text y="152" font-size="11" fill="#334155" x="556">Ferramentas só de leitura · cada verificação assume FAIL por predefinição</text>
  </g>

  <!-- Row 2: Feature amnesia -->
  <g filter="url(#ds2)">
    <rect x="40" y="178" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#991b1b" x="56">Amnésia de funcionalidades</text>
    <text y="220" font-size="11" fill="#334155" x="56">Cada cold boot esquece o progresso anterior</text>
  </g>
  <path d="M360 206 L 540 206" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="178" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#166534" x="556">O inicializador relê os ficheiros de progresso no arranque</text>
    <text y="220" font-size="11" fill="#334155" x="556">PROGRESS.md, feature-list.json · antes da primeira chamada ao modelo</text>
  </g>

  <!-- Row 3: Duplicated work -->
  <g filter="url(#ds2)">
    <rect x="40" y="246" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#991b1b" x="56">Trabalho duplicado após reset</text>
    <text y="288" font-size="11" fill="#334155" x="56">O mesmo passo é executado novamente após o reinício do processo</text>
  </g>
  <path d="M360 274 L 540 274" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="246" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#166534" x="556">Checkpoint no Postgres + ficheiro de handoff</text>
    <text y="288" font-size="11" fill="#334155" x="556">Log apenas de anexação · retoma a partir do último nó concluído</text>
  </g>

  <!-- Row 4: Context anxiety -->
  <g filter="url(#ds2)">
    <rect x="40" y="314" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#991b1b" x="56">Ansiedade com o contexto</text>
    <text y="356" font-size="11" fill="#334155" x="56">O modelo abandona cedo à medida que a janela fica cheia</text>
  </g>
  <path d="M360 342 L 540 342" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="314" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#166534" x="556">Sonnet 4.5: limitar a utilização a 200k</text>
    <text y="356" font-size="11" fill="#334155" x="556">Dentro de uma janela de 1M tokens; fazer reset e retomar</text>
  </g>

  <!-- Row 5: Stuck loops -->
  <g filter="url(#ds2)">
    <rect x="40" y="382" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#991b1b" x="56">Loops bloqueados · tempestades de retries</text>
    <text y="424" font-size="11" fill="#334155" x="56">A mesma tool call é repetida indefinidamente</text>
  </g>
  <path d="M360 410 L 540 410" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="382" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#166534" x="556">Limitar iterações · backoff · circuit breaker</text>
    <text y="424" font-size="11" fill="#334155" x="556">Decorador de tool call · Temporal RetryPolicy</text>
  </g>

  <!-- Row 6: Workspace drift -->
  <g filter="url(#ds2)">
    <rect x="40" y="450" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#991b1b" x="56">Deriva do workspace</text>
    <text y="492" font-size="11" fill="#334155" x="56">O agente edita ficheiros fora da sua tarefa</text>
  </g>
  <path d="M360 478 L 540 478" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="450" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#166534" x="556">Workspace por sessão, acesso a caminhos com scope</text>
    <text y="492" font-size="11" fill="#334155" x="556">Middleware do Deep Agents ou fork do Daytona/Runloop</text>
  </g>

  <!-- Row 7: Runaway cost / lost work -->
  <g filter="url(#ds2)">
    <rect x="40" y="518" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#991b1b" x="56">Custos descontrolados · perda de trabalho após crash</text>
    <text y="560" font-size="11" fill="#334155" x="56">Consumo do orçamento · o processo ou sandbox morre</text>
  </g>
  <path d="M360 546 L 540 546" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="518" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#166534" x="556">Orçamento de tokens · kill switch · registo fora do processo</text>
    <text y="560" font-size="11" fill="#334155" x="556">Contadores gen_ai.usage · wake(sessionId) para retomar</text>
  </g>
</svg>
