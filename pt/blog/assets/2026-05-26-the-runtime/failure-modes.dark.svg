<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fm-title fm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fm-title">Quatro classes de falhas e os controlos de runtime que as contêm</title>
  <desc id="fm-desc">As falhas de qualidade, custo, estado e contexto convergem nos controlos de runtime. O acceptance gate está destacado porque impede um agente de declarar concluído um trabalho incompleto.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#A8B8AF}.box{stroke:#EDF5F0;stroke-width:1.5;fill:#141D19}.edge{stroke:#A8B8AF;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="560" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">CLASSE DE FALHA</text><text class="section" x="584" y="48">MECANISMO DE CONTENÇÃO</text>
  <rect class="box" x="48" y="72" width="280" height="96" rx="10" /><text class="kind" x="68" y="106">FALHA · QUALIDADE</text><text class="name" x="68" y="134">Conclusão prematura</text><text class="note" x="68" y="154">amnésia de funcionalidades</text>
  <rect class="box" x="48" y="192" width="280" height="96" rx="10" /><text class="kind" x="68" y="226">FALHA · CUSTO</text><text class="name" x="68" y="254">Tempestades de retries</text><text class="note" x="68" y="274">consumo descontrolado de tokens</text>
  <rect class="box" x="48" y="312" width="280" height="96" rx="10" /><text class="kind" x="68" y="346">FALHA · ESTADO</text><text class="name" x="68" y="374">Efeitos secundários duplicados</text><text class="note" x="68" y="394">deriva da workspace · perda após crash</text>
  <rect class="box" x="48" y="432" width="280" height="80" rx="10" /><text class="kind" x="68" y="462">FALHA · CONTEXTO</text><text class="name" x="68" y="490">O reset perde a intenção</text>

  <rect x="584" y="72" width="328" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="604" y="106" fill="#FF6FB6">FOCO · ACCEPTANCE GATE</text><text class="name" x="604" y="134" fill="#FF6FB6">Um revisor novo falha em modo fechado</text>
  <rect class="box" x="584" y="192" width="328" height="96" rx="10" /><text class="kind" x="604" y="226">CONTROLO · ORÇAMENTO</text><text class="name" x="604" y="254">Limites · backoff · kill switch</text>
  <rect class="box" x="584" y="312" width="328" height="96" rx="10" /><text class="kind" x="604" y="346">CONTROLO · DURABILIDADE</text><text class="name" x="604" y="374">Log · checkpoint · isolamento</text>
  <rect class="box" x="584" y="432" width="328" height="80" rx="10" /><text class="kind" x="604" y="462">CONTROLO · COLD BOOT</text><text class="name" x="604" y="490">Recarregar artefactos de progresso</text>
  <path d="M328 120H576" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#fm-signal)" /><text class="note" x="408" y="110" fill="#FF6FB6">verificar artefactos</text>
  <path class="edge" d="M328 240H576" marker-end="url(#fm-arrow)" /><text class="note" x="420" y="230">delimitar o trabalho</text>
  <path class="edge" d="M328 360H576" marker-end="url(#fm-arrow)" /><text class="note" x="414" y="350">retomar em segurança</text>
  <path class="edge" d="M328 472H576" marker-end="url(#fm-arrow)" /><text class="note" x="412" y="462">restaurar a intenção</text>
  <text class="note" x="48" y="544">As mitigações existem fora da memória do modelo, pelo que os mesmos controlos sobrevivem ao reinício de um worker.</text>
  <defs><marker id="fm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="fm-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
