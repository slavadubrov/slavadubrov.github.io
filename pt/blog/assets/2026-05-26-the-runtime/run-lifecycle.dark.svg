<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">Uma execução saudável do agente persiste uma intenção pendente antes do dispatch, regista o resultado e, depois, cria um checkpoint e avalia; um novo worker reconcilia primeiro a intenção pendente.</title><desc id="runlife-desc">Este percurso ilustrativo segue uma operação coordenada com efeito secundário: arranque, planeamento, persistência de uma intenção pendente e de uma chave de idempotência, dispatch, persistência do resultado, checkpoint e, depois, avaliação. Chamadas independentes, só de leitura ou idempotentes, podem ser executadas em paralelo com registos duráveis separados e agregação determinística. Um worker que falhe depois do dispatch e antes da escrita do resultado é reativado com o mesmo ID de sessão, reconcilia a intenção pendente e só depois continua. Uma avaliação falhada retoma no planeamento; uma avaliação aprovada termina corretamente.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="runlife-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="runlife-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
