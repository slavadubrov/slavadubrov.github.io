<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="compose-title compose-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="compose-title">Topologia de referência do Docker Compose</title>
  <desc id="compose-desc">Um agent worker especializado recebe execuções em fila do Redis, grava checkpoints no Postgres, obtém memória do Qdrant, chama ferramentas através de um MCP sidecar, envia traces através do OpenTelemetry e chama uma API de modelo externa.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="compose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>

  <rect width="960" height="620" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">STACK DE REFERÊNCIA · DOCKER COMPOSE</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600" style="font-size: 22.5px;">Um worker é responsável pela execução; os serviços fornecem capacidades persistentes</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Os serviços principais partilham uma rede interna; MCP e observabilidade são perfis opcionais.</text>

  <rect x="48" y="126" width="864" height="374" rx="12" fill="none" stroke="#2b3b33" stroke-width="1" stroke-dasharray="6 5" />
  <text x="68" y="150" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FRONTEIRA · REDE INTERNA</text>

  <path d="M480 230V250" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M344 290H296" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M368 332 296 390" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M616 290H664" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M480 346V378" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#compose-arrow)" />
  <path d="M592 426H664" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#compose-arrow)" />
  <path d="M480 474V526" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#compose-arrow)" />

  <rect x="368" y="168" width="224" height="62" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="388" y="194" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · FILA</text>
  <text x="388" y="218" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Redis</text>

  <rect x="344" y="250" width="272" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="364" y="282" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">FOCO · RESPONSÁVEL PELA EXECUÇÃO</text>
  <text x="364" y="312" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">LangGraph agent worker</text>
  <text x="364" y="334" fill="#a8b8af" font-size="13">Harness · workspace por thread_id</text>

  <rect x="72" y="250" width="224" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="92" y="282" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · CHECKPOINTS</text>
  <text x="92" y="312" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Postgres</text>
  <text x="92" y="334" fill="#a8b8af" font-size="13">PostgresSaver · pgdata</text>

  <rect x="72" y="378" width="224" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="92" y="410" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · RETRIEVAL</text>
  <text x="92" y="440" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Qdrant</text>
  <text x="92" y="462" fill="#a8b8af" font-size="13">Memória fria · embeddings</text>

  <rect x="664" y="250" width="224" height="96" rx="10" fill="#141d19" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="684" y="282" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">EXTERNO · FERRAMENTAS</text>
  <text x="684" y="312" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">MCP sidecar</text>
  <text x="684" y="334" fill="#a8b8af" font-size="13">Tokens OAuth isolados do worker</text>

  <rect x="368" y="378" width="224" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="388" y="410" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">PROCESSAMENTO · TELEMETRIA</text>
  <text x="388" y="440" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Coletor OpenTelemetry</text>
  <text x="388" y="462" fill="#a8b8af" font-size="13">Traces · métricas · logs</text>

  <rect x="664" y="378" width="224" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="684" y="410" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ARMAZENAMENTO · OBSERVABILIDADE</text>
  <text x="684" y="440" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Tempo · Prometheus</text>
  <text x="684" y="462" fill="#a8b8af" font-size="13">Loki · Grafana</text>

  <rect x="368" y="526" width="224" height="62" rx="10" fill="#141d19" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="388" y="552" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">EXTERNO · API DE MODELO</text>
  <text x="388" y="576" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Claude</text>

  <rect x="303" y="258" width="38" height="18" fill="#0c1210" />
  <text x="322" y="271" text-anchor="middle" fill="#a8b8af" font-size="11">estado</text>
  <rect x="619" y="258" width="42" height="18" fill="#0c1210" />
  <text x="640" y="271" text-anchor="middle" fill="#a8b8af" font-size="11">ferramentas</text>
  <rect x="486" y="354" width="42" height="18" fill="#0c1210" />
  <text x="507" y="367" text-anchor="middle" fill="#a8b8af" font-size="11">spans</text>
  <rect x="606" y="394" width="44" height="18" fill="#0c1210" />
  <text x="628" y="407" text-anchor="middle" fill="#a8b8af" font-size="11">exportação</text>
  <rect x="486" y="492" width="68" height="18" fill="#0c1210" />
  <text x="520" y="505" text-anchor="middle" fill="#a8b8af" font-size="11">chamada ao modelo</text>
</svg>
