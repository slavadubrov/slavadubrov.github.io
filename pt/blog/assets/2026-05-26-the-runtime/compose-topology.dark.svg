<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">A stack de referência Docker Compose tem um worker como harness, três stores sob a sua gestão direta e três serviços opt-in ativados por flags de perfil.</title><desc id="composetop-desc">Um worker LangGraph atua como responsável pela execução e harness, obtendo jobs de uma fila Redis, escrevendo checkpoints no Postgres e lendo memória fria do Qdrant. Um sidecar MCP isola as credenciais das tools do worker, um collector OpenTelemetry recolhe traces e métricas, e uma stack de observabilidade armazena-os — os três ativados por perfis Compose opt-in. Claude é a API de modelo externa que o worker chama diretamente.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="composetop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="composetop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
