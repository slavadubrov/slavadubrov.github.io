<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O worker nunca guarda diretamente o modelo nem as credenciais das tools — Claude e o sidecar MCP ficam fora dele.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O Redis é opcional apenas no desenvolvimento local, porque o runner síncrono pode chamar diretamente o worker.</text>
