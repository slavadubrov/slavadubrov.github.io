<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">As cinco primitivas de runtime e os seus limites</title>
  <desc id="rp-desc">O harness conduz as chamadas ao modelo e às ferramentas. Uma sessão regista eventos, um checkpoint armazena estado retomável, um sandbox executa comandos e um trace regista evidências. O checkpoint é destacado como limite de recuperação.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path,line,polyline{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#59645E}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#59645E}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#59645E}.box{stroke:#17211B;stroke-width:1.5;fill:#FFFFFF}.store{stroke:#17211B;stroke-width:1.5;fill:#F2F2F5}.edge{stroke:#59645E;stroke-width:1.5;fill:none}
  </style>
  <rect width="960" height="520" rx="14" fill="#F7F7F4" />
  <rect x="48" y="48" width="864" height="408" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="section" x="68" y="76">RUNTIME EXTERNO · DETÉM A EXECUÇÃO E A DURABILIDADE</text>
  <rect class="box" x="344" y="104" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="138">PROCESSO · HARNESS</text><text class="name" x="364" y="166"><tspan x="364">Conduzir turnos modelo ↔</tspan><tspan x="364" dy="1.2em">ferramenta</tspan></text>
  <rect class="store" x="88" y="264" width="200" height="96" rx="10" />
  <text class="kind" x="108" y="298">ARMAZENAMENTO · SESSÃO</text><text class="name" x="108" y="326"><tspan x="108">Registo de eventos</tspan><tspan x="108" dy="1.2em">apenas para anexar</tspan></text>
  <rect x="344" y="264" width="272" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="364" y="298" fill="#C50E72">FOCO · CHECKPOINT</text><text class="name" x="364" y="326" fill="#C50E72"><tspan x="364">Retomar a partir de um estado</tspan><tspan x="364" dy="1.2em">seguro</tspan></text>
  <rect class="box" x="672" y="264" width="200" height="96" rx="10" />
  <text class="kind" x="692" y="298">PROCESSO · SANDBOX</text><text class="name" x="692" y="326">Executar comandos</text>
  <rect class="store" x="344" y="392" width="272" height="62" rx="10" />
  <text class="kind" x="364" y="418">ARMAZENAMENTO · TRACE</text><text class="name" x="364" y="442">Evidências reproduzíveis</text>
  <path class="edge" d="M344 152H288a20 20 0 0 0-20 20v84" marker-end="url(#rp-arrow)" /><text class="note" x="276" y="226">eventos</text>
  <path class="edge" d="M480 200v56" marker-end="url(#rp-arrow)" /><text class="note" x="492" y="232">estado</text>
  <path class="edge" d="M616 152h136a20 20 0 0 1 20 20v84" marker-end="url(#rp-arrow)" /><text class="note" x="682" y="142">tool calls</text>
  <path class="edge" d="M772 360v42a20 20 0 0 1-20 20H624" marker-end="url(#rp-arrow)" /><text class="note" x="688" y="410">spans</text>
  <path class="edge" d="M336 423H188a20 20 0 0 1-20-20v-35" marker-end="url(#rp-arrow)" /><text class="note" x="208" y="412">registar</text>
  <path d="M288 312H336" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#rp-signal)" /><text class="note" x="298" y="302" fill="#C50E72">retomar</text>
  <text class="note" x="48" y="494">Os workers são substituíveis porque a sessão e o checkpoint sobrevivem ao processo.</text>
  <defs><marker id="rp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="rp-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
