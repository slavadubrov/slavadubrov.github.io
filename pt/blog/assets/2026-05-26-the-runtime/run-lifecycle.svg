<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rl-title rl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rl-title">Ciclo de vida de uma execução de agente recuperável</title>
  <desc id="rl-desc">Uma execução inicia, planeia, executa, cria checkpoints e é avaliada. Se a avaliação falhar ou surgir um novo worker, a execução retoma no checkpoint destacado, em vez de recomeçar.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#59645E}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#59645E}.num{font:600 13px "IBM Plex Mono",ui-monospace,monospace;fill:#FFFFFF}.box{stroke:#17211B;stroke-width:1.5;fill:#FFFFFF}.edge{stroke:#59645E;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="480" rx="14" fill="#F7F7F4" />
  <g><circle cx="62" cy="68" r="14" fill="#17211B" /><text class="num" x="62" y="73" text-anchor="middle">1</text><circle cx="238" cy="68" r="14" fill="#17211B" /><text class="num" x="238" y="73" text-anchor="middle">2</text><circle cx="414" cy="68" r="14" fill="#17211B" /><text class="num" x="414" y="73" text-anchor="middle">3</text><circle cx="590" cy="68" r="14" fill="#17211B" /><text class="num" x="590" y="73" text-anchor="middle">4</text><circle cx="766" cy="68" r="14" fill="#17211B" /><text class="num" x="766" y="73" text-anchor="middle">5</text></g>
  <rect class="box" x="48" y="96" width="144" height="96" rx="10" /><text class="kind" x="68" y="130">PROCESSO</text><text class="name" x="68" y="158">Iniciar</text><text class="note" x="68" y="178">carregar estado</text>
  <rect class="box" x="224" y="96" width="144" height="96" rx="10" /><text class="kind" x="244" y="130">PROCESSO</text><text class="name" x="244" y="158">Planear</text><text class="note" x="244" y="178">definir conclusão</text>
  <rect class="box" x="400" y="96" width="144" height="96" rx="10" /><text class="kind" x="420" y="130">PROCESSO</text><text class="name" x="420" y="158">Executar</text><text class="note" x="420" y="178">uma tool call</text>
  <rect x="576" y="96" width="144" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="596" y="130" fill="#C50E72">FOCO</text><text class="name" x="596" y="158" fill="#C50E72">Checkpoint</text><text class="note" x="596" y="178" fill="#C50E72">consolidar estado</text>
  <path class="box" d="M824 96 912 144 824 192 736 144Z" /><text class="kind" x="824" y="136" text-anchor="middle">DECISÃO</text><text class="name" x="824" y="160" text-anchor="middle">concluído?</text>
  <path class="edge" d="M192 144h24" marker-end="url(#rl-arrow)" /><path class="edge" d="M368 144h24" marker-end="url(#rl-arrow)" /><path class="edge" d="M544 144h24" marker-end="url(#rl-arrow)" />  <path class="edge" d="M720 144h16" marker-end="url(#rl-arrow)" />
  <text class="note" x="865" y="222">sim → sair</text><path class="edge" d="M824 192v36" marker-end="url(#rl-arrow)" />
  <path d="M760 157v103a20 20 0 0 1-20 20H472a20 20 0 0 1-20-20v-60" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#rl-signal)" /><text class="note" x="628" y="306" text-anchor="middle" fill="#C50E72">não → continuar a partir do checkpoint</text>
  <rect class="box" x="176" y="344" width="240" height="96" rx="10" stroke-dasharray="6 5" stroke="#59645E" /><text class="kind" x="196" y="378">EXTERNO · NOVO WORKER</text><text class="name" x="196" y="406">Falha ou redeploy</text><text class="note" x="196" y="426">mesmo ID de sessão</text>
  <path d="M416 392h232a20 20 0 0 0 20-20V200" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#rl-signal)" /><text class="note" x="492" y="382" fill="#C50E72">restaurar o último estado limpo</text>
  <text class="note" x="48" y="462">Cada passo concluído é persistido antes de o seguinte começar; perde-se apenas o trabalho em curso.</text>
  <defs><marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="rl-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
