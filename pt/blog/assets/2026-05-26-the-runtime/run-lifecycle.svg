<text x="32" y="898" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Persista a intenção antes do dispatch; reconcilie um resultado em falta antes de repetir.</text>
