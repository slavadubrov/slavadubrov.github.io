<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Efeitos da posição em testes com contexto longo</title>
  <desc id="artifact-desc">Resumo qualitativo de Lost in the Middle. O estudo variou a posição da informação relevante e encontrou frequentemente melhor desempenho nas tarefas perto do início ou do fim. O resultado variou consoante o modelo, a tarefa e o comprimento do contexto, não definindo uma penalização universal.</desc>
  <style>
    .title{font-size: 24px;font-weight:700;fill: #A8B8AF}.subtitle{font-size: 13px;fill: #1B2621}.panel{fill: #141D19;stroke: #A8B8AF;stroke-width:1.5}.heading{font-size: 15px;font-weight:700;fill: #141D19}.label{font-size: 13px;fill: #A8B8AF}.note{font-size: 12px;fill: #1B2621}.axis{stroke: #A8B8AF;stroke-width:1.5}.curve{fill:none;stroke: #EDF5F0;stroke-width:4}.guide{stroke: #2B3B33;stroke-width:1.5;stroke-dasharray:5 5}.chip{font-size: 12px;font-weight:600}.arrow{stroke: #EDF5F0;stroke-width:2;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B2621" /></marker></defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="470" rx="14" fill="#0C1210" />
  <text x="48" y="48" class="title">O que “lost in the middle” mostra e não mostra</text>
  <text x="48" y="72" class="subtitle">Resultado qualitativo de Liu et al. sobre QA com vários documentos e recuperação de pares chave-valor</text>

  <rect x="48" y="104" width="560" height="294" rx="12" class="panel visual-focus" />
  <text x="72" y="136" class="heading">Padrão observado em muitas condições testadas</text>
  <line x1="104" y1="176" x2="104" y2="332" class="axis" />
  <line x1="104" y1="332" x2="560" y2="332" class="axis" />
  <line x1="332" y1="176" x2="332" y2="332" class="guide" />
  <path d="M104 202 C180 202 224 278 332 292 C440 278 484 202 560 202" class="curve" />
  <text x="86" y="180" text-anchor="end" class="note" style="font-size: 11px;">mais elevado</text>
  <text x="86" y="332" text-anchor="end" class="note" style="font-size: 11px;">mais baixo</text>
  <text x="104" y="356" text-anchor="middle" class="label">início</text>
  <text x="332" y="356" text-anchor="middle" class="label">meio</text>
  <text x="560" y="356" text-anchor="middle" class="label">fim</text>
  <text x="332" y="382" text-anchor="middle" class="note">posição da informação relevante</text>
  <rect x="130" y="220" width="120" height="30" rx="15" fill="#141D19" stroke="#EDF5F0" />
  <text x="190" y="240" text-anchor="middle" class="chip" fill="#EDF5F0" style="font-size: 11px;">frequentemente mais forte</text>
  <rect x="414" y="220" width="120" height="30" rx="15" fill="#141D19" stroke="#EDF5F0" />
  <text x="474" y="240" text-anchor="middle" class="chip" fill="#EDF5F0" style="font-size: 11px;">frequentemente mais forte</text>

  <rect x="632" y="104" width="280" height="294" rx="12" class="panel" />
  <text x="656" y="136" class="heading">Não generalize o esquema</text>
  <rect x="656" y="160" width="232" height="54" rx="8" fill="#141D19" stroke="#A8B8AF" />
  <text x="672" y="183" class="label" style="font-size: 12px;">Sem penalização fixa na recuperação</text>
  <text x="672" y="201" class="note" style="font-size: 11px;">Os resultados dependem das condições.</text>
  <rect x="656" y="230" width="232" height="70" rx="8" fill="#141D19" stroke="#A8B8AF" />
  <text x="672" y="253" class="label">Sem curva universal</text>
  <text x="672" y="271" class="note" style="font-size: 11px;">O modelo, a tarefa, o comprimento da sequência e a</text>
  <text x="672" y="288" class="note" style="font-size: 11px;">construção do prompt alteram o resultado.</text>
  <rect x="656" y="316" width="232" height="58" rx="8" fill="#141D19" stroke="#A8B8AF" />
  <text x="672" y="339" class="label">Ação de engenharia</text>
  <text x="672" y="357" class="note"><tspan x="672">Varie a posição da evidência nas</tspan><tspan x="672" dy="1.2em">evals.</tspan></text>
  <text x="48" y="438" class="note">Fonte: Liu et al., “Lost in the Middle” (2023). A linha é um esquema qualitativo para fins pedagógicos, não representa dados digitalizados do artigo.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
