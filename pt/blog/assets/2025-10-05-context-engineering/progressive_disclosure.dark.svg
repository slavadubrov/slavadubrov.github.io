<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="progressive-title progressive-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="progressive-title">A divulgação progressiva mantém os identificadores e o estado fidedigno disponíveis, obtendo depois apenas os detalhes necessários para a decisão atual.</title><desc id="progressive-desc">Quatro passos por decisão: começar pelos identificadores estáveis e pelo estado fidedigno da tarefa; encaminhar a decisão para autorizar e definir o âmbito antes da obtenção; carregar apenas as evidências, a memória e os tool schemas adequados; e validar a proposta antes da execução. A alternativa — copiar todas as fontes para todas as chamadas — aumenta o custo e a exposição sem benefício comprovado.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="progressive-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="progressive-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="512" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Divulgação progressiva para uma decisão de um agente</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Manter os identificadores e o estado fidedigno disponíveis; obter detalhes apenas para o passo atual.</text>
