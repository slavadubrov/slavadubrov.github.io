<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">A autoridade das instruções é específica de cada fornecedor, pelo que uma hierarquia universal de funções é um erro; o código da aplicação é a fronteira de aplicação partilhada.</title><desc id="instr-desc">O Model Spec da OpenAI ordena as instruções de plataforma ou sistema, developer e utilizador por autoridade. A Messages API da Anthropic expõe um parâmetro de sistema de nível superior e mensagens de utilizador e assistant, sem uma função developer equivalente. Independentemente dos nomes das funções do fornecedor, o código da aplicação autoriza ferramentas, acesso a dados e efeitos secundários.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="instr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="instr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="670" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">A prioridade das instruções é específica de cada fornecedor</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Os nomes das funções diferem entre fornecedores; a aplicação é arquitetural, não textual.</text>
