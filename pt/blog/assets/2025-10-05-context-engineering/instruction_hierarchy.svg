<text x="32" y="594" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Mapeie a sua política para os canais documentados pelo fornecedor e, em seguida, aplique</text>
<text x="32" y="616" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">as permissões e os efeitos secundários no código da aplicação — não no nome da função.</text>
