<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Contexto reunido através de retrieval com escopo, orçamentação, execução e validação</title>
  <desc id="desc">O estado fiável do pedido passa pela seleção da decisão, retrieval autorizado, orçamentação baseada em utilidade, proposta do modelo, validação determinística e execução, seguindo-se o registo da proveniência e do resultado.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#F7F7F4" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">A reunião de contexto é um ciclo de vida por decisão</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Pedido fiável</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">ator, tenant, tarefa</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">localidade + hora</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Selecionar decisão</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">planear, fazer retrieval, agir</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">ou responder</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Definir escopo + fazer retrieval</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">autorizar primeiro</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">ordenar evidência</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#59645E" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Orçamentar + reunir</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">utilidade, atualidade</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">fronteiras de confiança</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Propor → validar → agir</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#17211B">output tipado + política</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#17211B">pós-condições da tool</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Registar o manifesto, a proveniência, a validação e o resultado da tarefa</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#17211B">A decisão seguinte obtém um novo working set, em vez de herdar tudo.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#17211B">Uma chamada ao modelo é uma etapa dentro da política de contexto — não é a própria política.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
