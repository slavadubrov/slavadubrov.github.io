<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Contexto reunido através de retrieval com âmbito definido, orçamentação, execução e validação</title>
  <desc id="desc">O estado fiável do pedido passa pela seleção da decisão, retrieval autorizado, orçamentação baseada na utilidade, proposta do modelo, validação e execução determinísticas, e depois pelo registo da proveniência e do resultado.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#0C1210" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">A composição do contexto é um ciclo de vida por decisão</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Pedido fiável</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">ator, tenant, tarefa</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">locale + hora</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Selecionar decisão</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">planear, fazer retrieval, agir</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">ou responder</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Definir âmbito + fazer retrieval</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">autorizar primeiro</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">ordenar evidências</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#A8B8AF" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Orçamentar + compor</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">utilidade, atualidade</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">fronteiras de confiança</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Propor → validar → agir</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">saída tipada + política</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">pós-condições da tool</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">Registar o manifest, a proveniência, a validação e o resultado da tarefa</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#EDF5F0">A decisão seguinte recebe um novo working set, em vez de herdar tudo.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#EDF5F0">Uma chamada ao modelo é uma etapa dentro da política de contexto — não é a própria política.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
