<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Memória selecionada por tenant, finalidade, atualidade e relevância</title>
  <desc id="desc">Os candidatos a memória passam por verificações de sujeito e âmbito do tenant, finalidade, atualidade e relevância. Apenas os registos selecionados entram no contexto; os rejeitados permanecem de fora.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="420" rx="22" fill="#F7F7F4" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">A recuperação de memória é uma decisão de política</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(40 110)"><rect width="220" height="210" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B"><tspan x="110">Armazenamento de</tspan><tspan x="110" dy="1.2em">memória</tspan></text><text x="28" y="82" font-size="13" fill="#17211B">factos explícitos do utilizador</text><text x="28" y="112" font-size="13" fill="#17211B">hipóteses inferidas</text><text x="28" y="142" font-size="13" fill="#17211B">registos episódicos</text><text x="28" y="172" font-size="13" fill="#17211B">proveniência + ciclo de vida</text></g><text x="290" y="225" font-size="25" fill="#17211B">→</text>
  <g transform="translate(330 95)"><rect width="330" height="240" rx="16" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="165" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Gates de seleção</text><text x="35" y="82" font-size="13" fill="#17211B">1. sujeito autenticado + tenant</text><text x="35" y="116" font-size="13" fill="#17211B">2. finalidade permitida</text><text x="35" y="150" font-size="13" fill="#17211B">3. atualidade e estado da revisão</text><text x="35" y="184" font-size="13" fill="#17211B">4. relevância e autoridade</text><text x="35" y="218" font-size="12" fill="#17211B">Sem gate → sem inclusão no contexto</text></g><text x="690" y="225" font-size="25" fill="#17211B">→</text>
  <g transform="translate(730 110)"><rect width="230" height="210" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="115" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B"><tspan x="115">Conjunto de trabalho</tspan><tspan x="115" dy="1.2em">selecionado</tspan></text><text x="30" y="84" font-size="13" fill="#17211B">factos mínimos úteis</text><text x="30" y="116" font-size="13" fill="#17211B">fonte preservada</text><text x="30" y="148" font-size="13" fill="#17211B">expiração preservada</text><text x="30" y="180" font-size="13" fill="#17211B">a eliminação continua possível</text></g><text x="500" y="382" text-anchor="middle" font-size="13" fill="#17211B">As memórias inferidas pelo modelo permanecem hipóteses até serem confirmadas por uma fonte autorizada.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
