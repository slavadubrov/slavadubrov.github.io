<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Divulgação progressiva do contexto</title>
  <desc id="artifact-desc">Um fluxo por decisão começa com o estado fiável da tarefa, encaminha a decisão, carrega apenas evidência, memória e tool schemas relevantes para o âmbito e, em seguida, valida a proposta do modelo. Uma abordagem eager carrega material não relacionado antes de este ser necessário para a decisão.</desc>
    <style>
        .bg { fill: #f8fafc; }
        .title { fill: #0f172a; font-family: Inter, system-ui, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
        .box { rx: 8; ry: 8; }
        .box-title { fill: #0f172a; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
        .box-text { fill: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
        .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        .flow-text { fill: #64748b; font-family: Inter, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
    </style>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
        </marker>
    </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

    <rect width="100%" height="100%" class="bg" />

    <text y="30" class="title" x="400">Divulgação progressiva para uma decisão</text>

    <!-- Step 1: Initial Load -->
    <g transform="translate(50, 70)">
        <rect x="0" y="0" width="140" height="80" class="box" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
        <text y="25" class="box-title" x="70">1. Começar com pouco</text>
        <text y="45" class="box-text" x="70">Instruções fiáveis</text>
        <text y="58" class="box-text" x="70">Estado atual da tarefa</text>
        <text y="71" class="box-text" x="70">Identificadores estáveis</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 190 110 L 240 110" class="arrow" />
    <text y="100" class="flow-text" x="215">query</text>

    <!-- Step 2: Route -->
    <g transform="translate(250, 70)">
        <rect x="0" y="0" width="140" height="80" class="box" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
        <text y="25" class="box-title" x="70">2. Encaminhar</text>
        <text y="45" class="box-text" x="70">É necessária recuperação?</text>
        <text y="58" class="box-text" x="70">É necessária memória?</text>
        <text y="71" class="box-text" x="70">Que ferramentas?</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 390 110 L 440 110" class="arrow" />
    <text y="100" class="flow-text" x="415">selecionadas</text>

    <!-- Step 3: Load -->
    <g transform="translate(450, 70)">
        <rect x="0" y="0" width="140" height="80" class="box" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
        <text y="25" class="box-title" x="70">3. Carregar o que é relevante</text>
        <text y="45" class="box-text" x="70">Evidência delimitada</text>
        <text y="58" class="box-text" x="70">Memória relevante</text>
        <text y="71" class="box-text" x="70">tool schemas permitidos</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 590 110 L 640 110" class="arrow" />
    <text y="100" class="flow-text" x="615">proposta</text>

    <!-- Step 4: Respond -->
    <g transform="translate(650, 70)">
        <rect x="0" y="0" width="100" height="80" class="box" fill="#fff7ed" stroke="#ea580c" stroke-width="2" />
        <text y="25" class="box-title" x="50">4. Validar</text>
        <text y="50" class="box-text" x="50">Verificar a proposta</text>
        <text y="63" class="box-text" x="50">e depois executar</text>
    </g>

    <!-- Contrast: Naive approach -->
    <g transform="translate(50, 180)">
        <rect x="0" y="0" width="700" height="60" class="box" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
        <text y="20" class="box-title" style="fill: #991b1b;" x="350">Carregamento eager: copiar todas as fontes para cada chamada ao modelo</text>
        <text y="40" class="box-text" x="350">Material não relacionado aumenta o custo e a exposição do input. Meça o seu efeito no sucesso da tarefa.</text>
    </g>

    <!-- Insight -->
    <rect x="125" y="255" width="550" height="42" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" />
    <text y="280" class="box-text" style="fill: #166534;font-weight:600;" x="400">Mantenha identificadores estáveis. Obtenha os detalhes autorizados para a decisão atual.</text>
</svg>
