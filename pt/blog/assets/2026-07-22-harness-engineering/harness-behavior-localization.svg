<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="hbl-title hbl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hbl-title">Encaminhar uma alteração de comportamento através de um manual de harness</title><desc id="hbl-desc">Um pedido apenas de comportamento, como mascarar segredos em todos os caminhos de captura, percorre o manual desde uma visão geral do sistema até entradas fundamentadas no código-fonte. O passo de foco verifica cada localizador candidato no repositório ativo antes de executar o plano de edição. Um diff não vazio ressincroniza o mapa, para que o pedido seguinte use entradas atualizadas.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hbl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="hbl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="900" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Localização do comportamento, encaminhada através de um manual</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">O manual restringe a pesquisa. O repositório ativo determina o que é real.</text>
<path d="M42 112h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 112h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PEDIDO</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Mascarar segredos em todos os caminhos de captura</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">um comportamento, não um ficheiro</text><circle cx="32" cy="112" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">1</text>
<path d="M272 216v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 248h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M42 248h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">MANUAL</text><text x="46" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Rota: visão geral → etapa → código-fonte</text><text x="46" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">restringe o espaço de pesquisa</text><circle cx="32" cy="248" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="252.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">2</text>
<path d="M272 352v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 384h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M42 384h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="46" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCO</text><text x="46" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Verificar os localizadores no repositório ativo</text><text x="46" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">funções e ficheiros que indica</text><circle cx="32" cy="384" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="388.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">3</text>
<path d="M272 488v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 520h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 520h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">PROCESSO</text><text x="46" y="581" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Aplicar o plano de edição</text><text x="46" y="603" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">apenas locais verificados</text><circle cx="32" cy="520" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="524.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">4</text>
<path d="M272 624v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbl-arrow-flow)" />
<path d="M42 656h460a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-460a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M42 656h460a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-480a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="46" y="673.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ARMAZENAMENTO</text><text x="46" y="717" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Ressincronizar o mapa de comportamentos</text><text x="46" y="739" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">após cada diff não vazio</text><circle cx="32" cy="656" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="32" y="660.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">5</text>
<path d="M512 708H600V300H512" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#hbl-arrow-flow)" /><rect x="568" y="492" width="64" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="600" y="508.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 11px;">ressincronizar</text>
<path d="M32 800h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="826" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 12.5px;">Ordem de autoridade: o mapa de comportamentos, depois o código-fonte candidato e, por fim, o repositório ativo.</text>
<text x="32" y="848" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Um diff não vazio ressincroniza o mapa; o pedido seguinte usa entradas atualizadas.</text>
</svg>
