<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hcl-title hcl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hcl-title">Uma alteração de desconto através do loop de controlo do harness</title>
  <desc id="hcl-desc">Sete etapas levam uma edição do checkout desde o contexto compilado, passando por uma proposta do modelo, autorização, execução no runtime, testes de aceitação, uma decisão baseada em evidências e um trace. Os testes falhados devolvem evidências ao modelo; só evidências aprovadas e registadas podem ser aceites.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="552" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="38">ALTERAÇÃO DE DESCONTO — UMA ITERAÇÃO CONTROLADA</text>
  <text class="note" x="48" y="60">Nada chega à máquina, nem é considerado concluído, até o harness o determinar.</text>
  <circle cx="62" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="62" y="99" text-anchor="middle">1</text>
  <circle cx="286" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="286" y="99" text-anchor="middle">2</text>
  <circle cx="510" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="510" y="99" text-anchor="middle">3</text>
  <circle cx="734" cy="94" r="14" fill="#17211B" /><text class="marker-num" x="734" y="99" text-anchor="middle">4</text>
  <rect class="box" x="48" y="122" width="188" height="96" rx="10" /><text class="kind" x="68" y="156">CONTEXTO</text><text class="name" x="68" y="184">Compilar tarefa</text>
  <rect class="box" x="272" y="122" width="188" height="96" rx="10" /><text class="kind" x="292" y="156">MODELO</text><text class="name" x="292" y="184">Propor edição</text>
  <rect class="box" x="496" y="122" width="188" height="96" rx="10" /><text class="kind" x="516" y="156">FRONTEIRA</text><text class="name" x="516" y="184">Autorizar chamada</text>
  <rect class="box" x="720" y="122" width="188" height="96" rx="10" /><text class="kind" x="740" y="156">RUNTIME</text><text class="name" x="740" y="184">Aplicar edição</text>
  <path class="edge" d="M236 170h28" marker-end="url(#hcl-arrow)" /><path class="edge" d="M460 170h28" marker-end="url(#hcl-arrow)" /><path class="edge" d="M684 170h28" marker-end="url(#hcl-arrow)" />
  <path class="edge" d="M814 218v76" marker-end="url(#hcl-arrow)" />
  <circle cx="734" cy="266" r="14" fill="#17211B" /><text class="marker-num" x="734" y="271" text-anchor="middle">5</text>
  <circle cx="510" cy="266" r="14" fill="#17211B" /><text class="marker-num" x="510" y="271" text-anchor="middle">6</text>
  <circle cx="286" cy="266" r="14" fill="#17211B" /><text class="marker-num" x="286" y="271" text-anchor="middle">7</text>
  <rect x="720" y="294" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="740" y="328" fill="#C50E72">FOCO</text><text class="name" x="740" y="356" fill="#C50E72">Executar ambos os testes</text><text class="note" x="740" y="376">pytest + Playwright</text>
  <path d="M590 294 684 342 590 390 496 342Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><text class="kind" x="590" y="327" text-anchor="middle">DECISÃO</text><text class="name" x="590" y="354" text-anchor="middle">Evidências suficientes?</text>
  <rect class="box" x="272" y="294" width="188" height="96" rx="10" fill="#F2F2F5" /><text class="kind" x="292" y="328">TRACE</text><text class="name" x="292" y="356">Registar evidências</text><text class="note" x="292" y="376">comandos · códigos de saída · commit</text>
  <path class="edge" d="M720 342h-28" marker-end="url(#hcl-arrow)" /><path class="edge" d="M496 342h-28" marker-end="url(#hcl-arrow)" />
  <path d="M590 390v46a12 12 0 0 1-12 12H378a12 12 0 0 1-12-12V382" class="edge" marker-end="url(#hcl-arrow)" /><rect x="434" y="425" width="108" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="488" y="442" text-anchor="middle">sim → registar</text>
  <path d="M814 390v86a12 12 0 0 1-12 12H366a12 12 0 0 1-12-12V218" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#hcl-arrow-signal)" /><rect x="560" y="476" width="166" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="643" y="493" text-anchor="middle" fill="#C50E72">falha → evidências para o modelo</text>
  <path class="edge" d="M272 342H138a12 12 0 0 0-12 12v70" marker-end="url(#hcl-arrow)" /><text class="kind" x="48" y="450">ACEITAR</text><text class="name" x="48" y="478">Resultado verificado</text><text class="note" x="48" y="502">Ambas as verificações passaram no commit registado.</text>
  <path d="M48 516h864" stroke="#D8DDD9" stroke-width="1" /><text class="note" x="48" y="538">O modelo propõe. O harness controla a autorização e a conclusão.</text>
  <defs><marker id="hcl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="hcl-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
