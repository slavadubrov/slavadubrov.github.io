<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hal-title">Um teste de ablação emparelhado do handoff de progresso</title><desc id="hal-desc">Um modelo, conjunto de tarefas, ambiente, avaliador e orçamento total fixos alimentam duas execuções emparelhadas a partir do mesmo checkpoint de migração de pagamentos, com seed. O controlo desativa o handoff de progresso e o tratamento focado ativa apenas esse handoff. A comparação mede ações duplicadas de ferramentas após a retoma, e o componente só é mantido quando o ganho compensa o respetivo custo.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hal-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="hal-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1040" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Uma ablação emparelhada do handoff de progresso</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Falha observada: as migrações de pagamentos retomadas repetem trabalho que a sessão anterior já</tspan><tspan x="32" dy="1.2em">concluiu.</tspan></text>
