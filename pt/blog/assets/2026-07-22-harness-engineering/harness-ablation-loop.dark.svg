<path d="M32 936h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="962" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">Um componente só merece ser mantido quando o ganho do tratamento na métrica-alvo compensa o custo adicional.</text>
<text x="32" y="984" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Executar uma ablação por hipótese; não acumular guards sem medição.</text>
