<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hald-title hald-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hald-title">Uma ablação emparelhada da passagem de progresso</title>
  <desc id="hald-desc">Um modelo, conjunto de tarefas, ambiente, avaliador, orçamento e checkpoint de migração de pagamentos fixos alimentam duas variantes emparelhadas. O controlo desativa a passagem de progresso e o tratamento ativa apenas essa passagem. As ações duplicadas após a retoma são comparadas, e o componente só é mantido se o ganho compensar o custo.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="704" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">ABLAÇÃO EMPARELHADA — MOVE-SE UMA VARIÁVEL</text><text class="note" x="48" y="60">Falha observada: as migrações de pagamentos retomadas repetem trabalho que a sessão anterior já concluiu.</text>
  <rect class="store" x="48" y="80" width="864" height="62" rx="10" /><text class="kind" x="68" y="105">FIXO</text><text class="name" x="154" y="106">Modelo · tarefas · ambiente · avaliador · orçamento total</text><path class="edge" d="M480 142v32" marker-end="url(#hald-arrow)" />
  <rect class="store" x="368" y="182" width="224" height="62" rx="10" /><text class="kind" x="388" y="207">INÍCIO</text><text class="name" x="388" y="228">Mesmo checkpoint</text>
  <path class="edge" d="M480 244v24a12 12 0 0 1-12 12H284v28" marker-end="url(#hald-arrow)" /><path class="edge" d="M480 244v24a12 12 0 0 0 12 12h184v28" marker-end="url(#hald-arrow)" />
  <rect class="box" x="144" y="316" width="280" height="96" rx="10" /><text class="kind" x="164" y="350">CONTROLO</text><text class="name" x="164" y="378">Passagem desativada</text><text class="note" x="164" y="398">workspace + conversa</text>
  <rect x="536" y="316" width="280" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="556" y="350" fill="#FF6FB6">FOCO · TRATAMENTO</text><text class="name" x="556" y="378" fill="#FF6FB6">Passagem ativada</text><text class="note" x="556" y="398">apenas este componente muda</text>
  <path class="edge" d="M284 412v24a12 12 0 0 0 12 12h172v28" marker-end="url(#hald-arrow)" /><path class="edge" d="M676 412v24a12 12 0 0 1-12 12H492v28" marker-end="url(#hald-arrow)" />
  <rect class="box" x="340" y="484" width="280" height="96" rx="10" /><text class="kind" x="360" y="518">MEDIÇÃO</text><text class="name" x="360" y="546" style="font-size: 15px;">Comparar execuções emparelhadas</text><text class="note" x="360" y="566">ações duplicadas · custo · tempo</text><path class="edge" d="M480 580v16" marker-end="url(#hald-arrow)" />
  <path d="M480 604 590 638 480 672 370 638Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="480" y="624" text-anchor="middle">DECISÃO</text><text class="name" x="480" y="646" text-anchor="middle">O ganho compensa o custo?</text><text class="note" x="154" y="680" text-anchor="middle">NÃO → REMOVER</text><text class="note" x="806" y="680" text-anchor="middle">SIM → MANTER</text><path class="edge" d="M370 638H154" marker-end="url(#hald-arrow)" /><path class="edge" d="M590 638h216" marker-end="url(#hald-arrow)" />
  <defs><marker id="hald-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
