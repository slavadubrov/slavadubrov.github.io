<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 718" width="1120" height="718" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Onde se enquadra cada parte da série Engineering the Agentic Stack</title>
  <desc>Uma stack de quatro camadas. O modelo propõe uma ação. O reasoning loop da Parte 1 define a ordem e o número de propostas. O harness reúne o contexto a partir da memória da Parte 2, disponibiliza as tools da Parte 3, aplica as regras de permissões da Parte 4 e executa as verificações de aceitação e os traces da Parte 6. O runtime da Parte 5 executa os tool calls aceites e mantém o estado da sessão, do sandbox, do checkpoint e do trace. Os resultados regressam do runtime ao modelo como contexto para o turno seguinte.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="718" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Onde se enquadra cada parte da série</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Uma execução de um agent, de cima para baixo: o que decide, o que autoriza e o que executa.</text>

  <!-- Model -->
  <rect x="110" y="110" width="962" height="62" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="130" y="136" font-size="14" font-weight="700" fill="#0f172a">Modelo</text>
  <text x="130" y="156" font-size="11" fill="#64748b">Propõe texto, um tool call ou uma resposta final. Não decide se o call é executado.</text>

  <path d="M 591 172 L 591 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />

  <!-- Reasoning loop -->
  <rect x="110" y="202" width="962" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="130" y="228" font-size="14" font-weight="700" fill="#0f172a">Reasoning loop<tspan font-size="11" font-weight="400" fill="#1d4ed8" dx="10">Parte 1</tspan></text>
  <text x="130" y="248" font-size="11" fill="#64748b">Define a ordem e o número de propostas antes de estas chegarem ao harness.</text>

  <path d="M 591 264 L 591 292" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="283" font-size="11" fill="#64748b">call proposto</text>

  <!-- Harness -->
  <rect x="110" y="294" width="962" height="218" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="130" y="322" font-size="14" font-weight="700" fill="#0f172a">Harness<tspan font-size="11" font-weight="400" fill="#9a3412" dx="10">Partes 2, 3, 4 e 6</tspan></text>
  <text x="130" y="340" font-size="11" fill="#64748b">O programa de controlo entre o modelo e a máquina. As Partes 2, 3, 4 e 6 são as quatro caixas abaixo, executadas como etapas de um único turno.</text>

  <rect x="130" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="376" font-size="13" font-weight="600" fill="#0f172a">Contexto</text>
  <rect x="146" y="384" width="112" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="202" y="396" font-size="10" fill="#64748b" text-anchor="middle">Parte 2 — memória</text>
  <text x="146" y="418" font-size="11" fill="#64748b">Que estado anterior entra neste prompt:</text>
  <text x="146" y="432" font-size="11" fill="#64748b">recall, documentos, handoff.</text>

  <rect x="442" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="458" y="376" font-size="13" font-weight="600" fill="#0f172a">Contrato da tool</text>
  <rect x="458" y="384" width="116" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="516" y="396" font-size="10" fill="#64748b" text-anchor="middle">Parte 3 — tool use</text>
  <text x="458" y="418" font-size="11" fill="#64748b">Que ações existem e qual o aspeto de um</text>
  <text x="458" y="432" font-size="11" fill="#64748b">resultado validado.</text>

  <rect x="754" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="770" y="376" font-size="13" font-weight="600" fill="#0f172a">Permissão</text>
  <rect x="770" y="384" width="118" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="829" y="396" font-size="10" fill="#64748b" text-anchor="middle">Parte 4 — segurança</text>
  <text x="770" y="418" font-size="11" fill="#64748b">Se este call específico está</text>
  <text x="770" y="432" font-size="11" fill="#64748b">autorizado a ser executado agora, sem supervisão.</text>

  <rect x="130" y="454" width="922" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="146" y="472" font-size="13" font-weight="600" fill="#0f172a">Verificações de aceitação, traces, retries e handoffs<tspan font-size="11" font-weight="400" fill="#166534" dx="10">Parte 6</tspan></text>
  <text x="146" y="489" font-size="11" fill="#64748b">Lê a evidência e decide se a execução terminou, continua ou é escalada. O modelo não participa nessa decisão.</text>

  <path d="M 591 512 L 591 540" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="531" font-size="11" fill="#64748b">call aceite</text>

  <!-- Runtime -->
  <rect x="110" y="542" width="962" height="128" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="130" y="570" font-size="14" font-weight="700" fill="#0f172a">Runtime<tspan font-size="11" font-weight="400" fill="#334155" dx="10">Parte 5</tspan></text>
  <text x="130" y="588" font-size="11" fill="#64748b">Executa os calls aceites e mantém o estado ativo fora do processo worker. Estas quatro primitivas armazenam e isolam; nunca decidem.</text>

  <rect x="130" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="622" font-size="13" font-weight="600" fill="#0f172a">Sessão</text>
  <text x="146" y="640" font-size="11" fill="#64748b">Registo de execução apenas para append</text>

  <rect x="364" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="380" y="622" font-size="13" font-weight="600" fill="#0f172a">Sandbox</text>
  <text x="380" y="640" font-size="11" fill="#64748b">Execução isolada</text>

  <rect x="598" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="614" y="622" font-size="13" font-weight="600" fill="#0f172a">Checkpoint</text>
  <text x="614" y="640" font-size="11" fill="#64748b">Ponto de retoma</text>

  <rect x="832" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="848" y="622" font-size="13" font-weight="600" fill="#0f172a">Trace</text>
  <text x="848" y="640" font-size="11" fill="#64748b">Evidência recolhida posteriormente</text>

  <!-- Return path -->
  <path d="M 110 606 L 76 606 L 76 141 L 106 141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="62" y="374" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 62 374)">os resultados e os traces tornam-se o contexto do turno seguinte</text>
</svg>
