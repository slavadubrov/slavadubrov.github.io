<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 736" width="1120" height="736" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Uma iteração de um agent loop escrito manualmente e o fluxo de eventos que produz</title>
  <desc>Um único passo do loop, da esquerda para a direita. O modelo envia chunks em streaming através de chat completions. Os fragmentos de um tool call chegam apenas com um campo de índice em cada fragmento, pelo que o loop os acumula em calls completas, indexadas por esse índice. Cada call montado passa por JSON.parse e, depois, pela validação do Zod; uma falha em qualquer dos passos torna-se numa tool message que descreve o erro, em vez de gerar uma exceção, e o loop continua. Uma call válida executa a tool e o resultado é acrescentado ao array de mensagens como tool message antes do passo seguinte. O loop produz valores AgentEvent tipados a partir de um gerador assíncrono. Uma resposta sem tool calls emite done com stopReason stop. Atingir max_steps emite done com stopReason max_steps, que é concluído mas truncado. A rota HTTP consome o gerador, emite frames de Server-Sent Events, acumula o texto e escreve o texto final no armazenamento depois do stream. A rota apresentada persiste ambos os resultados concluídos normalmente como succeeded; por isso, em código de produção, max_steps deve ser classificado como truncated ou partial quando essa distinção for relevante. Os testes consomem o gerador separadamente e recolhem os respetivos eventos.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="736" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Um passo do loop e o que produz</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Tudo dentro do limite tracejado é código que um framework escreve por si. O fluxo de eventos é o que permite testá-lo.</text>

  <!-- Boundary of the hand-written loop -->
  <rect x="48" y="104" width="1024" height="368" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="68" y="130" font-size="14" font-weight="700" fill="#0f172a">runAgent — um passo</text>
  <text x="68" y="148" font-size="11" fill="#64748b">packages/agent-core/src/loop.ts</text>

  <!-- Model -->
  <rect x="68" y="168" width="182" height="94" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="86" y="194" font-size="13" font-weight="600" fill="#0f172a">Modelo</text>
  <text x="86" y="214" font-size="11" fill="#64748b">POST /chat/completions</text>
  <text x="86" y="230" font-size="11" fill="#64748b">stream: true</text>
  <text x="86" y="250" font-size="11" fill="#5b21b6">OpenAI, vLLM, Ollama</text>

  <path d="M 250 215 L 292 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="256" y="205" font-size="10" fill="#64748b">chunks</text>

  <!-- Accumulate -->
  <rect x="300" y="168" width="212" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="318" y="194" font-size="13" font-weight="600" fill="#0f172a">Acumular por índice</text>
  <text x="318" y="214" font-size="11" fill="#64748b">id e name chegam uma vez;</text>
  <text x="318" y="230" font-size="11" fill="#64748b">os argumentos chegam por partes</text>
  <text x="318" y="250" font-size="11" fill="#1d4ed8">Apenas o índice está presente em cada fragmento</text>

  <path d="M 512 215 L 554 215" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="533" y="203" text-anchor="middle" font-size="10" fill="#64748b">call</text>

  <!-- Validate -->
  <rect x="562" y="168" width="204" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="580" y="194" font-size="13" font-weight="600" fill="#0f172a">JSON.parse, depois Zod</text>
  <text x="580" y="214" font-size="11" fill="#64748b">Os modelos produzem JSON malformado</text>
  <text x="580" y="230" font-size="11" fill="#64748b">e argumentos fora do intervalo válido</text>
  <text x="580" y="250" font-size="11" fill="#1d4ed8">Ambos são esperados, não excecionais</text>

  <!-- Execute -->
  <path d="M 766 200 L 812 200" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <text x="770" y="192" font-size="10" fill="#166534">válido</text>
  <rect x="820" y="168" width="232" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="838" y="192" font-size="13" font-weight="600" fill="#0f172a">Executar a tool</text>
  <text x="838" y="212" font-size="11" fill="#166534">O resultado é convertido em string numa tool message</text>

  <!-- Repair path -->
  <path d="M 664 262 L 664 300 L 812 300" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <text x="676" y="292" font-size="10" fill="#991b1b">inválido</text>
  <rect x="820" y="268" width="232" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="838" y="292" font-size="13" font-weight="600" fill="#0f172a">Descrever a falha</text>
  <text x="838" y="312" font-size="11" fill="#991b1b">O modelo lê a mensagem e tenta novamente</text>

  <!-- Append + loop back -->
  <rect x="300" y="348" width="466" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="318" y="372" font-size="13" font-weight="600" fill="#0f172a">Acrescentar mensagens assistant + tool e repetir</text>
  <text x="318" y="392" font-size="11" fill="#64748b">O array de mensagens é a memória completa do agent durante esta execução</text>

  <path d="M 850 228 L 850 244 L 792 244 L 792 378 L 774 378" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a-ok)" />
  <path d="M 936 328 L 936 378 L 800 378" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#a-bad)" />
  <path d="M 292 378 L 200 378 L 200 270" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <text x="204" y="336" font-size="10" fill="#64748b">passo seguinte</text>

  <text x="68" y="440" font-size="11" fill="#64748b">Sem tool calls, emite done(stop); ao atingir max_steps, emite done(max_steps).</text>
  <text x="68" y="458" font-size="11" fill="#64748b">O gerador termina em ambos os casos. A rota apresentada persiste ambos como succeeded, pelo que o código de produção deve marcar max_steps como truncated ou partial.</text>

  <!-- Event stream -->
  <rect x="48" y="496" width="1024" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="68" y="522" font-size="14" font-weight="700" fill="#0f172a">yield: AgentEvent</text>
  <text x="68" y="542" font-size="11" fill="#64748b">Uma união discriminada produzida por um gerador assíncrono — a forma equivalente ao async def com yield do Python.</text>
  <text x="68" y="560" font-size="11" font-family="SFMono-Regular, Consolas, monospace" fill="#1d4ed8">text | tool_call | tool_result | done | error</text>

  <path d="M 240 572 L 240 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <path d="M 560 572 L 560 608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />

  <rect x="88" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="108" y="640" font-size="13" font-weight="600" fill="#0f172a">Rota HTTP</text>
  <text x="108" y="660" font-size="11" fill="#64748b">Um frame SSE por evento</text>
  <text x="108" y="676" font-size="11" fill="#64748b">apps/api/src/app.ts</text>

  <rect x="408" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="428" y="640" font-size="13" font-weight="600" fill="#0f172a">Teste</text>
  <text x="428" y="660" font-size="11" fill="#64748b">Recolhe os eventos num array</text>
  <text x="428" y="676" font-size="11" fill="#64748b">Sem rede, sem API key</text>

  <rect x="728" y="616" width="304" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="748" y="640" font-size="13" font-weight="600" fill="#0f172a">Armazenamento</text>
  <text x="748" y="660" font-size="11" fill="#64748b">Escreve o texto final uma vez</text>
  <text x="748" y="676" font-size="11" fill="#64748b">Chamado pela rota depois do stream</text>

  <path d="M 240 688 L 240 712 L 880 712 L 880 688" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)" />
  <rect x="493" y="702" width="134" height="18" rx="9" fill="#f8fafc" />
  <text x="560" y="715" text-anchor="middle" font-size="10" fill="#64748b">texto final depois do stream</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>
</svg>
