<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workspace-title workspace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="workspace-title">Um schema Zod chega a três consumidores virados para o modelo</title>
  <desc id="workspace-desc">O pacote focado de schemas de agentes envia uma declaração EstimateKvCacheInput para um loop escrito manualmente, o adaptador Vercel AI SDK e o publicador de tools MCP. As duas implementações do loop servem a API Hono; o publicador serve o processo MCP. A API escreve linhas de execução no Postgres, e o worker assume essas linhas.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #a8b8af; }
    .box { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .store { fill: #1b2621; stroke: #edf5f0; stroke-width: 1.5; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="744" rx="14" fill="#0c1210" />
  <text class="name" x="48" y="44">Um schema, três consumidores</text>
  <text class="note" x="48" y="68">A declaração partilhada muda de forma em cada adaptador; as aplicações mantêm-se independentes entre si.</text>

  <rect x="48" y="96" width="864" height="304" rx="12" fill="none" stroke="#2b3b33" />
  <text class="section" x="68" y="120">PACOTES · BIBLIOTECAS PARTILHADAS</text>

  <rect x="68" y="144" width="256" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="88" y="178" fill="#ff6fb6">FOCO · SCHEMA</text>
  <text class="name" x="88" y="206" fill="#ff6fb6">EstimateKvCacheInput</text>

  <path class="edge" d="M196 240v24h568M196 264v24M480 264v24M764 264v24" />
  <rect x="280" y="248" width="400" height="24" rx="6" fill="#0c1210" />
  <text class="note" x="480" y="265" text-anchor="middle">a mesma declaração Zod, três formatos de fronteira</text>

  <rect class="box" x="68" y="296" width="256" height="96" rx="10" />
  <text class="kind" x="88" y="330">ADAPTADOR</text><text class="name" x="88" y="358">Loop escrito manualmente</text>
  <rect class="box" x="352" y="296" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="330">ADAPTADOR</text><text class="name" x="372" y="358">Vercel AI SDK</text>
  <rect class="box" x="636" y="296" width="256" height="96" rx="10" />
  <text class="kind" x="656" y="330">PUBLICADOR</text><text class="name" x="656" y="358">Tool MCP</text>

  <rect x="48" y="432" width="864" height="264" rx="12" fill="none" stroke="#2b3b33" />
  <text class="section" x="68" y="456">APLICAÇÕES · PROCESSOS IMPLEMENTADOS</text>

  <path class="edge" d="M196 392v16h128M480 392v16H324v56" marker-end="url(#workspace-arrow)" />
  <rect x="100" y="412" width="192" height="24" rx="6" fill="#0c1210" />
  <text class="note" x="196" y="429" text-anchor="middle">escolher um loop</text>
  <path class="edge" d="M764 392v72" marker-end="url(#workspace-arrow)" />

  <rect class="box" x="68" y="472" width="512" height="96" rx="10" />
  <text class="kind" x="88" y="506">PROCESSO · APPS/API</text><text class="name" x="88" y="534">Hono HTTP + SSE</text>
  <rect class="box" x="636" y="472" width="256" height="96" rx="10" />
  <text class="kind" x="656" y="506">PROCESSO · APPS/MCP</text><text class="name" x="656" y="534">Servidor MCP</text>

  <path class="edge" d="M324 568v32" marker-end="url(#workspace-arrow)" />
  <rect x="344" y="576" width="152" height="24" rx="6" fill="#0c1210" />
  <text class="note" x="420" y="593" text-anchor="middle">inserir execução em fila</text>
  <rect class="store" x="68" y="608" width="512" height="62" rx="10" />
  <text class="kind" x="88" y="632">ARMAZENAMENTO</text><text class="name" x="188" y="648">Tabela de execuções do Postgres</text>

  <rect class="box" x="636" y="608" width="256" height="62" rx="10" />
  <text class="kind" x="656" y="632">PROCESSO</text><text class="name" x="744" y="648">Worker da fila</text>
  <path class="edge" d="M580 639h48" marker-end="url(#workspace-arrow)" />
  <rect x="560" y="616" width="96" height="20" rx="6" fill="#0c1210" />
  <text class="note" x="608" y="631" text-anchor="middle">assumir linha</text>

  <text class="note" x="48" y="724">O processo MCP não toca em HTTP nem no Postgres; a observabilidade mantém-se numa biblioteca sidecar utilizada quando necessário.</text>
  <defs><marker id="workspace-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a8b8af" /></marker></defs>
</svg>
