  <rect x="48" y="528" width="864" height="168" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="signal-kind" x="68" y="558">FOCO · TRÊS ARMADILHAS SEMÂNTICAS</text>
  <text class="signal-name" x="68" y="584">Estas substituições alteram o modelo de operação</text>
  <path d="M68 604h824" stroke="#ff6fb6" fill="none" /><path d="M336 620v56M624 620v56" stroke="#ff6fb6" fill="none" opacity="0.45" />
  <text class="signal-kind" x="68" y="636">VALIDAÇÃO</text><text class="signal-name" x="68" y="660">Pydantic → Zod</text><text class="note signal-note" x="68" y="680">schema primeiro, tipo inferido</text>
  <text class="signal-kind" x="356" y="636">FILA DE TAREFAS</text><text class="signal-name" x="356" y="660">Celery + Redis → SQL</text><text class="note signal-note" x="356" y="680">broker substituído por linhas</text>
  <text class="signal-kind" x="644" y="636">VERIFICAÇÃO DE TIPOS</text><text class="signal-name" x="644" y="660">mypy → tsc --noEmit</text><text class="note signal-note" x="644" y="680">os dados em runtime continuam sem verificação</text>
  <text class="note" x="48" y="724">Use os scripts do pnpm como interface do serviço; Node, tsx e tsc são executados por detrás desses nomes.</text>
  <defs><marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a8b8af" /></marker></defs>
