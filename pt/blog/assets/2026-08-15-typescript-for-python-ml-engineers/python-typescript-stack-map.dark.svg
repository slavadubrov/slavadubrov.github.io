  <text class="kind" x="68" y="174">MANIFESTO</text><text class="name" x="68" y="198">pyproject.toml</text>
  <text class="kind" x="524" y="174">MANIFESTO</text><text class="name" x="524" y="198">package.json</text><path class="edge" d="M464 184h32" marker-end="url(#stack-arrow)" />
  <path d="M68 216h368M524 216h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="236">PACOTES</text><text class="name" x="68" y="260">uv</text>
  <text class="kind" x="524" y="236">PACOTES</text><text class="name" x="524" y="260">pnpm</text><path class="edge" d="M464 246h32" marker-end="url(#stack-arrow)" />
  <path d="M68 278h368M524 278h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="298">HTTP</text><text class="name" x="68" y="322">FastAPI</text>
  <text class="kind" x="524" y="298">HTTP</text><text class="name" x="524" y="322">Hono</text><path class="edge" d="M464 308h32" marker-end="url(#stack-arrow)" />
  <path d="M68 340h368M524 340h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="360">SQL</text><text class="name" x="68" y="384">SQLAlchemy + Alembic</text>
  <text class="kind" x="524" y="360">SQL</text><text class="name" x="524" y="384">Drizzle + drizzle-kit</text><path class="edge" d="M464 370h32" marker-end="url(#stack-arrow)" />
  <path d="M68 402h368M524 402h368" stroke="#2b3b33" fill="none" />
  <text class="kind" x="68" y="422">TESTES</text><text class="name" x="68" y="446">pytest</text>
  <text class="kind" x="524" y="422">TESTES</text><text class="name" x="524" y="446">Vitest</text><path class="edge" d="M464 432h32" marker-end="url(#stack-arrow)" />
  <path d="M68 464h368M524 464h368" stroke="#2b3b33" fill="none" />
