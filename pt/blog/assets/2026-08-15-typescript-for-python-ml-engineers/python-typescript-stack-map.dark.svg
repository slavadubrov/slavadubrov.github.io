<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="stack-title">Ferramentas de serviço Python mapeadas para TypeScript</title>
  <desc id="stack-desc">Seis substituições de rotina mapeiam ferramentas de projeto, pacotes, HTTP, SQL, testes e linting de Python para equivalentes em TypeScript. Um painel focado destaca as três substituições que alteram a semântica: Pydantic por Zod, Celery e Redis por uma fila em Postgres e mypy pelo compilador de TypeScript.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .signal-kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #ff6fb6; }
    .signal-name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #ff6fb6; }
    .signal-note { fill: #ff6fb6; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="744" rx="14" fill="#0c1210" />
  <text class="name" x="48" y="44">O que substitui o quê</text>
  <text class="note" x="48" y="68">A maioria das ferramentas ocupa o mesmo lugar. É no painel focado que a intuição de Python deixa de ser transferida sem problemas.</text>
  <rect x="48" y="96" width="408" height="400" rx="12" fill="#141d19" stroke="#2b3b33" />
  <rect x="504" y="96" width="408" height="400" rx="12" fill="#141d19" stroke="#2b3b33" />
  <text class="kind" x="68" y="124">SERVIÇO PYTHON</text><text class="kind" x="524" y="124">SERVIÇO TYPESCRIPT</text>
