<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="trace-title trace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="trace-title">Traces de produção tornam-se testes de regressão e versões mais seguras</title><desc id="trace-desc">Um pedido de produção gera um trace com privacidade controlada. A triagem transforma uma falha revista num caso de regressão etiquetado, que um gate de avaliação compara com a versão atual antes de uma entrega faseada. O resultado monitorizado fecha o ciclo de volta à produção.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="trace-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="trace-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="460" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Os traces fecham o ciclo de volta à produção</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Uma falha revista torna-se um caso etiquetado e, depois, numa decisão de release.</text>
<path d="M42 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PRODUÇÃO</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Executar pedido</text><circle cx="32" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M204 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M204 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="208" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TRACE</text><text x="208" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0" style="font-size: 11px;">Capturar com segurança</text><circle cx="194" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="194" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M366 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M366 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="370" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">TRIAGEM</text><text x="370" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Rever falha</text><circle cx="356" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="356" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M528 112h130a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M528 112h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="532" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">CASO DE REGRESSÃO</text><text x="532" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Etiquetar o caso</text><circle cx="518" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="518" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M182 148h12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M344 148h12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M506 148h12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M593 184v32H512v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M366 248h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M366 248h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="370" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">GATE DE AVALIAÇÃO</text><text x="370" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Comparar a alteração candidata</text><text x="370" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">com a versão atual</text>
<path d="M42 248h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 248h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ENTREGA</text><text x="46" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Fazer o rollout faseado</text><text x="46" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">rollout monitorizado, não um passo final</text>
<path d="M356 300h-12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trace-arrow-flow)" />
<path d="M188 248v-32H107v-32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#trace-arrow-flow)" /><rect x="17.5" y="204" width="261" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="148" y="220.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">o resultado monitorizado fecha o ciclo</text>
<path d="M32 384h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="410" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Um thumbs-up não é ground truth; os casos com impacto significativo continuam a precisar de etiquetas</tspan><tspan x="32" dy="1.2em">atribuídas por especialistas.</tspan></text>
</svg>
