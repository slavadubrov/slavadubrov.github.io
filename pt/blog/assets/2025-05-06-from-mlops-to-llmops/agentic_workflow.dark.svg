<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="trace-dark-title trace-dark-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="trace-dark-title">Traces de produção tornam-se testes de regressão e permitem lançamentos mais seguros</title>
  <desc id="trace-dark-desc">Um pedido em produção gera um trace com privacidade controlada. A triagem transforma uma falha revista num caso de regressão etiquetado. O caso entra num gate de comparação offline; depois, um lançamento faseado devolve a alteração monitorizada à produção.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; } .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="408" rx="14" fill="#0C1210" /><text class="kind" x="48" y="44">CICLO OPERACIONAL — TRANSFORMAR FALHAS OBSERVADAS EM EVIDÊNCIA</text>
  <circle cx="62" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="81" text-anchor="middle">1</text><circle cx="326" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="326" y="81" text-anchor="middle">2</text><circle cx="590" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="590" y="81" text-anchor="middle">3</text><circle cx="854" cy="76" r="14" fill="#EDF5F0" /><text class="marker-num" x="854" y="81" text-anchor="middle">4</text>
  <rect class="box" x="48" y="104" width="216" height="96" rx="10" /><text class="kind" x="68" y="138">PRODUÇÃO</text><text class="name" x="68" y="166">Executar pedido</text>
  <rect class="store" x="312" y="104" width="216" height="96" rx="10" /><text class="kind" x="332" y="138">TRACE</text><text class="name" x="332" y="166">Capturar com segurança</text>
  <rect class="box" x="576" y="104" width="216" height="96" rx="10" /><text class="kind" x="596" y="138">TRIAGEM</text><text class="name" x="596" y="166">Rever falha</text>
  <rect class="store" x="840" y="104" width="232" height="96" rx="10" /><text class="kind" x="860" y="138">CASO DE REGRESSÃO</text><text class="name" x="860" y="166"><tspan x="860">Etiquetar resultado</tspan><tspan x="860" dy="1.2em">esperado</tspan></text>
  <path class="edge" d="M264 152h40" marker-end="url(#trace-dark-arrow)" /><path class="edge" d="M528 152h40" marker-end="url(#trace-dark-arrow)" /><path class="edge" d="M792 152h40" marker-end="url(#trace-dark-arrow)" />
  <circle cx="590" cy="244" r="14" fill="#EDF5F0" /><text class="marker-num" x="590" y="249" text-anchor="middle">5</text><circle cx="326" cy="244" r="14" fill="#EDF5F0" /><text class="marker-num" x="326" y="249" text-anchor="middle">6</text>
  <rect x="576" y="272" width="216" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="596" y="306" fill="#FF6FB6">GATE DE AVALIAÇÃO</text><text class="name" x="596" y="334" fill="#FF6FB6">Comparar candidato</text>
  <rect class="box" x="312" y="272" width="216" height="96" rx="10" /><text class="kind" x="332" y="306">ENTREGA</text><text class="name" x="332" y="334">Fasear lançamento</text>
  <path class="edge" d="M956 200v120H800" marker-end="url(#trace-dark-arrow)" /><path class="edge" d="M576 320h-40" marker-end="url(#trace-dark-arrow)" /><path class="edge" d="M312 320H156a12 12 0 0 1-12-12V208" marker-end="url(#trace-dark-arrow)" />
  <rect x="48" y="296" width="216" height="24" rx="6" fill="#0C1210" /><text class="note" x="156" y="313" text-anchor="middle" style="font-size: 12px;">o resultado monitorizado fecha o ciclo</text>
  <defs><marker id="trace-dark-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
