<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="manifest-title manifest-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="manifest-title">A unidade de release expande-se de um serviço de modelo para um manifesto do sistema</title><desc id="manifest-desc">Um núcleo MLOps convencional de código, dados e modelo junta cinco extensões que evoluem de forma independente: prompts e schema, estado de retrieval, ferramentas e permissões, routing e orçamento, e política de segurança. Um único manifesto identifica a release completa.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="manifest-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="manifest-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="700" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">A unidade de release passa a ser um manifesto do sistema</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Um núcleo MLOps convencional junta cinco extensões que evoluem de forma independente.</text>
<rect x="32" y="104" width="656" height="128" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">MLOPS CONVENCIONAL</text>
