<text x="32" y="538" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Todas as rotas — alojada, self-hosted ou de fallback — passam pelo mesmo evaluation gate antes da promoção.</text>
</svg>
