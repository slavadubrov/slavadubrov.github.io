<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="mlopsloop-title mlopsloop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mlopsloop-title">O ciclo de controlo de MLOps de que os sistemas baseados em modelos fundacionais continuam a precisar</title><desc id="mlopsloop-desc">A lineage alimenta um build reproduzível, um release gate offline, uma entrega faseada e a observabilidade. A evidência de incidentes regressa ao release gate, enquanto a identidade imutável, a governação e o rollback abrangem todo o ciclo.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mlopsloop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="mlopsloop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="450" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">O ciclo de controlo de MLOps continua a aplicar-se</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">O comportamento muda; a disciplina que o governa, não.</text>
