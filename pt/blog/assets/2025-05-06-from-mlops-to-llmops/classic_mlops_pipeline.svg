<text x="32" y="382" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A identidade imutável, a governação e o rollback abrangem todo o ciclo.</text>
<text x="32" y="404" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A evidência de incidentes regressa ao release gate antes da próxima promoção.</text>
