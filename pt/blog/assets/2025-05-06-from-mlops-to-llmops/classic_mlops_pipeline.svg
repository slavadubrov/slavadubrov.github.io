<path d="M258 248h180a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-180a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M258 248h180a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-200a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="262" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">OPERATIONS</text><text x="262" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Observar SLOs</text><circle cx="248" cy="248" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="248" y="252.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">5</text>
