<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rag-title">Percursos de ingestão, serving e avaliação de RAG</title>
  <desc id="rag-desc">Uma fonte versionada é analisada e transformada em embeddings num índice vetorial. Durante o serving, a query de um tenant é autorizada e obtém evidência ordenada por relevância. A qualidade da recuperação é verificada antes da montagem do contexto e da geração; a qualidade da resposta é verificada separadamente.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="488" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">INGESTÃO — CRIAR UM PRODUTO DE DADOS VERSIONADO</text>

  <rect class="store" x="48" y="72" width="232" height="96" rx="10" />
  <text class="kind" x="68" y="106">FONTE</text><text class="name" x="68" y="134">Snapshot + estado de ACL</text>
  <rect class="box" x="320" y="72" width="232" height="96" rx="10" />
  <text class="kind" x="340" y="106">PIPELINE</text><text class="name" x="340" y="134">Analisar + dividir em chunks + criar embeddings</text>
  <rect class="store" x="592" y="72" width="232" height="96" rx="10" />
  <text class="kind" x="612" y="106">ÍNDICE</text><text class="name" x="612" y="134">Vetores versionados</text>
  <path class="edge" d="M280 120h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M552 120h32" marker-end="url(#rag-arrow)" />

  <text class="kind" x="48" y="228">SERVING — AVALIAR A RECUPERAÇÃO ANTES DA GERAÇÃO</text>
  <rect class="box" x="48" y="256" width="192" height="96" rx="10" />
  <text class="kind" x="68" y="290">PEDIDO</text><text class="name" x="68" y="318">Query + tenant</text>
  <rect class="box" x="280" y="256" width="232" height="96" rx="10" />
  <text class="kind" x="300" y="290">RECUPERAÇÃO</text><text class="name" x="300" y="318">Autorizar + ordenar</text>
  <rect x="552" y="256" width="208" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="572" y="290" fill="#C50E72">GATE DE RECUPERAÇÃO</text><text class="name" x="572" y="318" fill="#C50E72">A evidência é utilizável?</text>
  <rect class="box" x="800" y="256" width="272" height="96" rx="10" />
  <text class="kind" x="820" y="290">GERAÇÃO</text><text class="name" x="820" y="318">Montar + responder</text>
  <path class="edge" d="M240 304h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M512 304h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M760 304h32" marker-end="url(#rag-arrow)" />
  <path class="edge" d="M708 168v40H396v40" stroke-dasharray="2 6" marker-end="url(#rag-arrow)" />
  <rect x="504" y="196" width="168" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="588" y="213" text-anchor="middle">versão do índice selecionada</text>

  <path d="M800 408h272" stroke="#D8DDD9" />
  <text class="kind" x="800" y="400">GATE DA RESPOSTA</text>
  <text class="note" x="800" y="432">suporte · citação · sucesso da tarefa</text>

  <defs><marker id="rag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
