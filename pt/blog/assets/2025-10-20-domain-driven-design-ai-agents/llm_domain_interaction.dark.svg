<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="did-title did-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="did-title">Uma proposta do modelo atravessa fronteiras de domínio determinísticas</title>
  <desc id="did-desc">Um modelo externo emite um AddTaskProposal não fiável. A aplicação analisa-o e normaliza-o, autoriza o interveniente, invoca o aggregate destacado para impor invariantes de negócio e, em seguida, confirma o estado e um evento de outbox.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; fill: #141D19; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1120" height="408" rx="14" fill="#0C1210" />
  <circle cx="62" cy="64" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="69" text-anchor="middle">1</text>
  <circle cx="278" cy="64" r="14" fill="#EDF5F0" /><text class="marker-num" x="278" y="69" text-anchor="middle">2</text>
  <circle cx="494" cy="64" r="14" fill="#EDF5F0" /><text class="marker-num" x="494" y="69" text-anchor="middle">3</text>
  <circle cx="710" cy="64" r="14" fill="#EDF5F0" /><text class="marker-num" x="710" y="69" text-anchor="middle">4</text>
  <circle cx="926" cy="64" r="14" fill="#EDF5F0" /><text class="marker-num" x="926" y="69" text-anchor="middle">5</text>
  <rect x="48" y="92" width="160" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="124">EXTERNO · MODELO</text>
  <text class="name" x="68" y="150">AddTaskProposal</text>
  <text class="note" x="68" y="174">valores não fiáveis</text>
  <rect class="box" x="264" y="92" width="160" height="96" rx="10" />
  <text class="kind" x="284" y="124">APLICAÇÃO</text>
  <text class="name" x="284" y="150">Analisar + normalizar</text>
  <text class="note" x="284" y="174">estrutura · data · unidades</text>
  <rect class="box" x="480" y="92" width="160" height="96" rx="10" />
  <text class="kind" x="500" y="124">POLÍTICA</text>
  <text class="name" x="500" y="150">Autorizar interveniente</text>
  <text class="note" x="500" y="174">proprietário · operação</text>
  <rect x="696" y="92" width="160" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="716" y="124" fill="#FF6FB6">FOCO · DOMÍNIO</text>
  <text class="name" x="716" y="150" fill="#FF6FB6">Impor invariante</text>
  <text class="note" x="716" y="174" fill="#FF6FB6">emitir evento de domínio</text>
  <rect class="box" x="912" y="92" width="160" height="96" rx="10" fill="#1B2621" />
  <text class="kind" x="932" y="124">ARMAZENAMENTO</text>
  <text class="name" x="932" y="150">Confirmação atómica</text>
  <text class="note" x="932" y="174">estado + outbox</text>
  <path class="edge" d="M208 140h48" marker-end="url(#did-arrow)" />
  <path class="edge" d="M424 140h48" marker-end="url(#did-arrow)" />
  <path class="edge" d="M640 140h48" marker-end="url(#did-arrow)" />
  <path class="edge" d="M856 140h48" marker-end="url(#did-arrow)" />
  <path class="edge" d="M344 188v60M560 188v60M776 188v60M992 188v60" stroke-dasharray="7 6" />
  <path class="edge" d="M344 248h648" stroke-dasharray="7 6" />
  <path class="edge" d="M560 248v24" stroke-dasharray="7 6" marker-end="url(#did-arrow)" />
  <rect x="224" y="272" width="672" height="62" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="244" y="297">REJEITAR ANTES DA PERSISTÊNCIA</text>
  <text class="name" x="244" y="320">Inválido · contexto em falta · não autorizado · conflito · atualização concorrente</text>
  <text class="note" x="48" y="376">Um schema controla a representação. O aggregate controla o significado de negócio.</text>
