<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Fluxo ilustrativo pretendido, do output do modelo até um comando de domínio</title>
  <desc id="desc">Um modelo emite uma proposta tipada não fiável. Uma fronteira da aplicação analisa-a e normaliza-a, autoriza o interveniente, invoca um agregado e deve guardar o estado aceite com um evento outbox numa única transação. Cada etapa rejeitada devolve uma falha distinta.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="480" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Uma proposta tipada ainda não é uma operação de negócio válida</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(25 120)"><rect width="155" height="125" rx="14" fill="#5b21b6" stroke="#2563eb" stroke-width="2" /><text x="77" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Adaptador do modelo</text><text x="77" y="70" text-anchor="middle" font-size="12" fill="#c4b5fd">AddTaskProposal</text><text x="77" y="94" text-anchor="middle" font-size="12" fill="#94a3b8">valores não fiáveis</text></g>
    <text x="202" y="192" text-anchor="middle" font-size="25" fill="#94a3b8">→</text>
    <g transform="translate(225 120)"><rect width="155" height="125" rx="14" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="77" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Analisar + normalizar</text><text x="77" y="70" text-anchor="middle" font-size="12" fill="#93c5fd">estrutura, data, unidades</text><text x="77" y="94" text-anchor="middle" font-size="12" fill="#94a3b8">contexto fiável</text></g>
    <text x="402" y="192" text-anchor="middle" font-size="25" fill="#94a3b8">→</text>
    <g transform="translate(425 120)"><rect width="155" height="125" rx="14" fill="#9a3412" stroke="#ea580c" stroke-width="2" /><text x="77" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fdba74">Autorizar</text><text x="77" y="70" text-anchor="middle" font-size="12" fill="#fdba74">interveniente + proprietário</text><text x="77" y="94" text-anchor="middle" font-size="12" fill="#94a3b8">âmbito da operação</text></g>
    <text x="602" y="192" text-anchor="middle" font-size="25" fill="#94a3b8">→</text>
    <g transform="translate(625 120)"><rect width="155" height="125" rx="14" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="77" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Agregado</text><text x="77" y="70" text-anchor="middle" font-size="12" fill="#93c5fd">garantir a invariante</text><text x="77" y="94" text-anchor="middle" font-size="12" fill="#94a3b8">emitir evento de domínio</text></g>
    <text x="802" y="192" text-anchor="middle" font-size="25" fill="#94a3b8">→</text>
    <g transform="translate(825 120)"><rect width="150" height="125" rx="14" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="75" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Persistir destino</text><text x="75" y="70" text-anchor="middle" font-size="12" fill="#93c5fd">estado + outbox</text><text x="75" y="94" text-anchor="middle" font-size="12" fill="#94a3b8">uma única transação</text></g>

    <rect x="100" y="320" width="800" height="85" rx="14" fill="#991b1b" stroke="#dc2626" />
    <text x="500" y="351" text-anchor="middle" font-size="16" font-weight="700" fill="#fca5a5">Rejeitar com uma falha específica antes da persistência</text>
    <text x="500" y="382" text-anchor="middle" font-size="13" fill="#fca5a5">proposta inválida • contexto em falta • interveniente não autorizado • conflito de domínio • atualização concorrente</text>
    <text x="500" y="447" text-anchor="middle" font-size="13" fill="#94a3b8">A validação do Schema controla a representação. O agregado controla o significado de negócio.</text>
  </g>
</svg>
