<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="bc-title bc-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="bc-title">A palavra produto tem três significados delimitados</title>
  <desc id="bc-desc">A Gestão de Encomendas, a Faturação e o Inventário mantêm modelos Product separados. Um contrato de tradução destacado mapeia identificadores e termos entre os contextos, sem impor um único objeto partilhado.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { stroke: #17211B; stroke-width: 1.5; fill: #FFFFFF; }
    .group { stroke: #D8DDD9; stroke-width: 1.5; fill: none; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="440" rx="14" fill="#F7F7F4" />
  <rect class="group" x="48" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="68" y="78">CONTEXTO DELIMITADO</text>
  <text class="name" x="68" y="104">Gestão de Encomendas</text>
  <rect class="box" x="72" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="92" y="158">MODELO</text>
  <text class="name" x="92" y="184"><tspan x="92">Product = linha da</tspan><tspan x="92" dy="1.2em">encomenda</tspan></text>
  <text class="note" x="72" y="252">quantidade · compromisso · estado</text>
  <rect class="group" x="352" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="372" y="78">CONTEXTO DELIMITADO</text>
  <text class="name" x="372" y="104">Faturação</text>
  <rect class="box" x="376" y="128" width="208" height="96" rx="10" fill="#F2F2F5" />
  <text class="kind" x="396" y="158">MODELO</text>
  <text class="name" x="396" y="184"><tspan x="396">Product = linha com</tspan><tspan x="396" dy="1.2em">preço</tspan></text>
  <text class="note" x="376" y="252">imposto · desconto · liquidação</text>
  <rect class="group" x="656" y="48" width="256" height="240" rx="12" />
  <text class="kind" x="676" y="78">CONTEXTO DELIMITADO</text>
  <text class="name" x="676" y="104">Inventário</text>
  <rect class="box" x="680" y="128" width="208" height="96" rx="10" />
  <text class="kind" x="700" y="158">MODELO</text>
  <text class="name" x="700" y="184"><tspan x="700">Product = artigo em</tspan><tspan x="700" dy="1.2em">stock</tspan></text>
  <text class="note" x="680" y="252">SKU · localização · quantidade</text>
  <path class="edge" d="M176 288v32M480 288v32M784 288v32" />
  <path class="edge" d="M176 320h608" />
  <path class="edge" d="M480 320v16" marker-end="url(#bc-arrow)" />
  <rect x="256" y="336" width="448" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="276" y="361" fill="#C50E72">FOCO · CONTRATO PUBLICADO</text>
  <text class="name" x="276" y="384" fill="#C50E72">Traduzir termos e identificadores</text>
  <text class="note" x="48" y="424">Cada contexto mantém o seu próprio modelo; a tradução ocorre na fronteira.</text>
  <defs>
    <marker id="bc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
