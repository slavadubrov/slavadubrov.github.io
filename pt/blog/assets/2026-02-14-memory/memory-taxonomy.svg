<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mt-title mt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mt-title">Seis tipos de memória de agentes agrupados em três níveis de armazenamento</title>
  <desc id="mt-desc">A memória quente contém a memória de trabalho e de curto prazo; a memória fria contém a memória episódica e semântica; e a memória documental armazena o conhecimento do projeto. A memória procedural fica fora dos níveis de armazenamento, nas instruções do sistema e nas definições das ferramentas. A memória de trabalho é destacada como o contexto que o modelo pode usar agora.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">NÍVEL QUENTE · THREAD ATUAL</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">FOCO · TRABALHO</text>
  <text class="name focus-text" x="92" y="174">Contexto atual</text>
  <text class="note" x="92" y="194">um passo do modelo · não persistente</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">ARMAZENAR · CURTO PRAZO</text>
  <text class="name" x="92" y="310">Checkpoint da thread</text>
  <text class="note" x="92" y="330">minutos–horas · pausar e retomar</text>
  <text class="note" x="72" y="408"><tspan x="72">Utilizável agora; os checkpoints permitem</tspan><tspan x="72" dy="1.2em">recuperá-la.</tspan></text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">NÍVEL FRIO · ENTRE THREADS</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">ARMAZENAR · EPISÓDICA</text>
  <text class="name" x="444" y="174">Interações anteriores</text>
  <text class="note" x="444" y="194">dias–meses · eventos e histórico</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">ARMAZENAR · SEMÂNTICA</text>
  <text class="name" x="444" y="310">Factos e preferências</text>
  <text class="note" x="444" y="330">meses–permanente · vectorial ou KV</text>
  <text class="note" x="424" y="408"><tspan x="424">Recuperação por significado ou chave na</tspan><tspan x="424" dy="1.2em">thread seguinte.</tspan></text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94"><tspan x="776">NÍVEL DOCUMENTAL · CONHECIMENTO DO</tspan><tspan x="776" dy="1.2em">PROJETO</tspan></text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">ARMAZENAR · DOCUMENTAL</text>
  <text class="name" x="796" y="174">Ficheiros inspecionáveis</text>
  <text class="note" x="796" y="194">notas · investigação · padrões aprendidos</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#D8DDD9" stroke-width="1.5" />
  <text class="kind" x="800" y="246">FICHEIROS</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Legível, editável e versionado.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">EXTERNO · PROCEDURAL</text>
  <text class="name" x="420" y="520">System prompt e ferramentas</text>
  <text class="note" x="420" y="544"><tspan x="420">Incluído com o agente; não é um nível</tspan><tspan x="420" dy="1.2em">recuperado.</tspan></text>
</svg>
