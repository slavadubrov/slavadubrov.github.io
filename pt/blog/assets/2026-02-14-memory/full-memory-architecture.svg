<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fa-title fa-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fa-title">Memória hot, cold e documental ligadas a um único agente</title>
  <desc id="fa-desc">Um pedido do utilizador entra no agente. O agente escreve e restaura checkpoints hot, lê memórias cold relevantes antes do planeamento e atualiza-as de forma assíncrona, e carrega a memória documental a partir de ficheiros locais, adiando as escritas. Os caminhos contínuos correspondem a execução ou recuperação; os caminhos tracejados correspondem a atualizações em background.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .external { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
    .async { stroke-dasharray: 2 6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#F7F7F4" />

  <rect class="external" x="440" y="48" width="240" height="62" rx="10" />
  <text class="kind" x="460" y="72">EXTERNO · UTILIZADOR</text>
  <text class="name" x="460" y="96">Pedido e resposta</text>

  <rect class="focus" x="400" y="160" width="320" height="96" rx="10" />
  <text class="kind focus-text" x="420" y="194">FOCO · HARNESS DO AGENTE</text>
  <text class="name focus-text" x="420" y="222">Construir o contexto do modelo</text>
  <text class="note" x="420" y="242">raciocinar · planear · chamar tools</text>

  <path class="edge" d="M536 110v42" marker-end="url(#fa-arrow)" />
  <path class="edge" d="M584 160v-42" stroke-dasharray="7 6" marker-end="url(#fa-arrow)" />
  <text class="note" x="476" y="140">pedido</text>
  <text class="note" x="598" y="140">resposta</text>

  <text class="kind" x="48" y="372">CAMINHO HOT · THREAD ATUAL</text>
  <rect class="store" x="48" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="426">STORE · CHECKPOINT</text>
  <text class="name" x="68" y="454">PostgreSQL ou Redis</text>
  <text class="note" x="68" y="474">a cada super-step · retomar em 1–5 ms</text>

  <text class="kind" x="424" y="372">CAMINHO COLD · ENTRE THREADS</text>
  <rect class="store" x="424" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="426">STORE · LONGO PRAZO</text>
  <text class="name" x="444" y="454">Vector ou key-value</text>
  <text class="note" x="444" y="474">factos relevantes · 100–300 ms</text>

  <text class="kind" x="800" y="372">CAMINHO DOCUMENTAL · PROJETO</text>
  <rect class="store" x="800" y="392" width="272" height="96" rx="10" />
  <text class="kind" x="820" y="426">STORE · FICHEIROS</text>
  <text class="name" x="820" y="454">Markdown e JSON</text>
  <text class="note" x="820" y="474">convenções e notas · 1–5 ms</text>

  <path class="edge" d="M400 184H120V384" marker-end="url(#fa-arrow)" />
  <rect x="176" y="172" width="126" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="239" y="186" text-anchor="middle">escrever checkpoint</text>
  <path class="edge" d="M248 392V232H392" marker-end="url(#fa-arrow)" />
  <rect x="279" y="220" width="82" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="320" y="234" text-anchor="middle">restaurar</text>

  <path class="edge" d="M512 392V264" marker-end="url(#fa-arrow)" />
  <rect x="432" y="304" width="78" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="471" y="318" text-anchor="middle">recuperar</text>
  <path class="edge async" d="M624 256v128" marker-end="url(#fa-arrow)" />
  <rect x="630" y="304" width="148" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="704" y="318" text-anchor="middle">atualização em background</text>

  <path class="edge" d="M936 392V232H728" marker-end="url(#fa-arrow)" />
  <rect x="783" y="220" width="98" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="832" y="234" text-anchor="middle">leitura no arranque</text>
  <path class="edge async" d="M720 184h280v200" marker-end="url(#fa-arrow)" />
  <rect x="828" y="172" width="100" height="20" rx="6" fill="#F7F7F4" />
  <text class="note" x="878" y="186" text-anchor="middle">escrita adiada</text>

  <path class="edge" d="M48 544h64" marker-end="url(#fa-arrow)" />
  <text class="note" x="128" y="549">caminho de execução ou recuperação</text>
  <path class="edge async" d="M392 544h64" marker-end="url(#fa-arrow)" />
  <text class="note" x="472" y="549">atualização assíncrona</text>
  <text class="note" x="48" y="580">O harness — e não os stores — decide o que chega à janela de contexto limitada do modelo.</text>

  <defs>
    <marker id="fa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
