<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="hotckpt-title hotckpt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hotckpt-title">A recuperação usa o checkpoint persistido mais recente, não uma linha de código arbitrária nem um passo concluído não persistido.</title><desc id="hotckpt-desc">O LangGraph cria checkpoints nos limites de cada super-step. A durabilidade assíncrona pode sobrepor a persistência ao passo seguinte; a durabilidade síncrona aguarda a escrita. Um worker que falhe recupera a partir do checkpoint persistido mais recente, que pode estar atrasado em relação à execução concluída.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hotckpt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="hotckpt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="568" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Um checkpoint por super-step</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A recuperação após uma falha usa o checkpoint persistido mais recente; as escritas assíncronas podem ficar atrasadas.</text>
<path d="M42 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESSO · SUPER-STEP</text><text x="46" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Nó concluído</text><text x="46" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">mensagens · plano</text><text x="46" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">dados recolhidos</text><circle cx="32" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M266 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M266 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="270" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCO · CHECKPOINT</text><text x="270" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Persistir checkpoint</text><text x="270" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">síncrono aguarda;</text><text x="270" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">assíncrono sobrepõe</text><circle cx="256" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="256" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M490 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M490 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="494" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PROCESSO · GRAFO</text><text x="494" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Entrar no nó seguinte</text><text x="494" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">um limite de retoma</text><text x="494" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ao nível do grafo</text><circle cx="480" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="480" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M240 180h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" />
<path d="M464 180h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" />
<path d="M386 344h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M386 344h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="390" y="361.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">ARMAZENAMENTO · CHECKPOINT</text><text x="390" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Estado persistido</text><text x="390" y="417" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11.5px;">checkpoint guardado mais recente</text><text x="390" y="437" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Postgres ou Redis</text>
<path d="M360 232v40h120v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hotckpt-arrow-flow)" /><rect x="355" y="260" width="130" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="420" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">serializar o estado</text>
<path d="M584 344v-112" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#hotckpt-arrow-flow)" /><rect x="522.5" y="292" width="123" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="584" y="308.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 12.5px;">carregar ao retomar</text>
<path d="M32 488h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Um reinício ou uma retoma aprovada carrega o checkpoint persistido mais recente.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A persistência assíncrona pode ficar atrasada em relação à execução; a síncrona aguarda a escrita antes do passo seguinte.</text>
</svg>
