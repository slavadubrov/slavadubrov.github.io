<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rpd-title rpd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rpd-title">Comparação de backends de checkpoints Redis e PostgreSQL</title>
  <desc id="rpd-desc">Comparação alinhada entre Redis e PostgreSQL em tempo de acesso, durabilidade, histórico, modelo de consulta e adequação operacional. O PostgreSQL é destacado como opção durável por predefinição; o Redis é a opção orientada para latência quando é possível recuperar de perdas de estado recente.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
    .rule { stroke: #2B3B33; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">ARMAZENAMENTO · LATÊNCIA PRIMEIRO</text>
  <text class="name" x="92" y="136">Checkpoint saver Redis</text>
  <text class="note" x="92" y="156" style="font-size: 11.5px;">Escolha quando a latência de retoma for o principal bottleneck.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">FOCO · PREDEFINIÇÃO DURÁVEL</text>
  <text class="name focus-text" x="540" y="136">Checkpoint saver PostgreSQL</text>
  <text class="note" x="540" y="156">Escolha quando for inaceitável perder trabalho concluído.</text>

  <text class="kind" x="72" y="206">TEMPO DE ACESSO</text>
  <text class="value" x="72" y="230">Inferior a um milissegundo</text>
  <text class="note" x="72" y="250">leituras e escritas em memória</text>
  <text class="kind" x="520" y="206">TEMPO DE ACESSO</text>
  <text class="value" x="520" y="230">Poucos milissegundos</text>
  <text class="note" x="520" y="250">escrita na base de dados em cada fronteira</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">DURABILIDADE</text>
  <text class="value" x="72" y="318">Configurado com AOF ou RDB</text>
  <text class="note" x="72" y="338">as escritas recentes podem perder-se ou ser expulsas</text>
  <text class="kind" x="520" y="294">DURABILIDADE</text>
  <text class="value" x="520" y="318">Transações ACID e WAL</text>
  <text class="note" x="520" y="338">o checkpoint sobrevive a uma escrita confirmada</text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">HISTÓRICO · MODELO DE CONSULTA</text>
  <text class="value" x="72" y="406">Retenção e índices de chaves/pesquisa</text>
  <text class="note" x="72" y="426">o histórico depende do saver e da política de eviction</text>
  <text class="kind" x="520" y="382">HISTÓRICO · MODELO DE CONSULTA</text>
  <text class="value" x="520" y="406">Histórico durável com SQL e JSONB</text>
  <text class="note" x="520" y="426">retoma, inspeção e debugging com time travel</text>

  <text class="note" x="72" y="462"><tspan x="72">Mais adequado para: estado de sessão recuperável e sensível à</tspan><tspan x="72" dy="1.2em">latência.</tspan></text>
  <text class="note" x="520" y="462">Mais adequado para: tarefas longas e recuperação reprodutível.</text>
  <text class="note" x="48" y="510"><tspan x="48">Faça benchmark do tamanho do estado serializado e da frequência de escrita; benchmarks genéricos de bases de dados não preveem o custo dos</tspan><tspan x="48" dy="1.2em">checkpoints.</tspan></text>
</svg>
