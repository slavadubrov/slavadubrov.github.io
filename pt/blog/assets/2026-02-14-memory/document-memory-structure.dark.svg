<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13px;">README.md explica o diretório a uma pessoa; PROGRESS.md transmite o trabalho inacabado à sessão seguinte do modelo.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">O Git regista todas as alterações feitas pelo agente aqui — uma aprendizagem incorreta fica a um revert de</tspan><tspan x="32" dy="1.2em">desaparecer.</tspan></text>
