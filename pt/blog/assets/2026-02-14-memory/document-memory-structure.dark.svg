<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">O diretório de memória de documentos contém quatro pastas temáticas sob uma raiz partilhada, e quatro operações — ler, escrever, listar e pesquisar — abrangem todas elas.</title><desc id="docmem-desc">O diretório .agent-memory partilhado contém user-profiles, research, conventions e learnings como ficheiros Markdown. Uma pequena interface de file-memory disponibiliza quatro operações, que resolvem o caminho de destino dentro dessa mesma raiz: read devolve o conteúdo de um documento, write cria ou substitui um documento, list encontra caminhos através de um padrão glob e search devolve os parágrafos que correspondem a uma palavra-chave.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
