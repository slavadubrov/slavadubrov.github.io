<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mtd-title mtd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mtd-title">Seis tipos de memória de agentes agrupados em três níveis de armazenamento</title>
  <desc id="mtd-desc">A memória quente contém memória de trabalho e de curto prazo; a memória fria contém memória episódica e semântica; e a memória documental armazena conhecimento do projeto. A memória procedural fica fora dos níveis de armazenamento, nas instruções do sistema e nas definições de ferramentas. A memória de trabalho é destacada como o contexto que o modelo pode utilizar agora.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">NÍVEL QUENTE · THREAD ATUAL</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">FOCO · TRABALHO</text>
  <text class="name focus-text" x="92" y="174">Contexto atual</text>
  <text class="note" x="92" y="194">um passo do modelo · não persistido</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">ARMAZENAR · CURTO PRAZO</text>
  <text class="name" x="92" y="310">Checkpoint da thread</text>
  <text class="note" x="92" y="330">minutos–horas · pausar e retomar</text>
  <text class="note" x="72" y="408">Utilizável agora; os checkpoints permitem a recuperação.</text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">NÍVEL FRIO · ENTRE THREADS</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">ARMAZENAR · EPISÓDICA</text>
  <text class="name" x="444" y="174">Interações anteriores</text>
  <text class="note" x="444" y="194">dias–meses · eventos e histórico</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">ARMAZENAR · SEMÂNTICA</text>
  <text class="name" x="444" y="310">Factos e preferências</text>
  <text class="note" x="444" y="330">meses–permanente · vetor ou KV</text>
  <text class="note" x="424" y="408">Recuperação por significado ou chave na thread seguinte.</text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94">NÍVEL DOCUMENTAL · CONHECIMENTO DO PROJETO</text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">ARMAZENAR · DOCUMENTO</text>
  <text class="name" x="796" y="174">Ficheiros inspecionáveis</text>
  <text class="note" x="796" y="194">notas · investigação · padrões aprendidos</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="800" y="246">FICHEIROS</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Legível, editável e versionado.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">EXTERNO · PROCEDURAL</text>
  <text class="name" x="420" y="520">System prompt e ferramentas</text>
  <text class="note" x="420" y="544">Distribuído com o agente; não é um nível recuperado.</text>
</svg>
