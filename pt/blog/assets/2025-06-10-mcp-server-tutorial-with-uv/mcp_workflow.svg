<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="mcpflow-title mcpflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="mcpflow-title">Uma consulta de features é executada em seis passos: o cliente descobre as ferramentas do servidor uma vez, no arranque, e cada pergunta seguinte atravessa o limite MCP como um novo pedido tools/call.</title><desc id="mcpflow-desc">No arranque, o cliente MCP do Claude Desktop descobre as ferramentas do servidor e o host expõe os respetivos schemas ao Claude, que pode então pedir get_feature. Quando uma pergunta necessita de dados do feature store, o cliente envia esse pedido ao FeatureStoreLite como uma mensagem tools/call, o servidor executa get_feature sobre o SQLite e o resultado regressa através do host ao Claude, para a resposta final.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="mcpflow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="mcpflow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="548" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Seis passos numa consulta de features</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A descoberta é executada uma vez; cada consulta posterior repete os últimos três passos.</text>
<text x="32" y="104" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ARRANQUE · DESCOBRIR AS FERRAMENTAS</text>
