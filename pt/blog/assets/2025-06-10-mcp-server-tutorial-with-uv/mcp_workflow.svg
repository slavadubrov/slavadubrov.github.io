<text x="32" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A descoberta é executada uma vez, no arranque — nessa altura, o cliente já conhece os tool schemas.</text>
<text x="32" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Cada consulta cruza o limite cliente-servidor MCP num novo pedido tools/call.</text>
