<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="patterns-title patterns-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="patterns-title">Três padrões de reasoning guiados por schema</title>
  <desc id="patterns-desc">Cascade regista uma sequência ordenada, routing seleciona um ramo da união e cycle emite uma lista limitada. Os três impõem estrutura, mas nenhum comprova a correção factual.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="464" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">PADRÕES · TRÊS FORMAS DE ESTRUTURAR UMA RESPOSTA</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="106">PADRÃO · CASCADE</text>
  <text class="name" x="68" y="135">Campos ordenados</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="106">PADRÃO · ROUTING</text>
  <text class="name" x="372" y="135">Um ramo da união</text>
  <rect class="box" x="656" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="106">PADRÃO · CYCLE</text>
  <text class="name" x="676" y="135">Lista limitada</text>

  <circle cx="70" cy="226" r="14" fill="#EDF5F0" /><text class="marker-num" x="70" y="231" text-anchor="middle">1</text>
  <text class="note" x="92" y="231">resumir</text>
  <path class="edge" d="M70 240v24" marker-end="url(#patterns-arrow)" />
  <circle cx="70" cy="286" r="14" fill="#EDF5F0" /><text class="marker-num" x="70" y="291" text-anchor="middle">2</text>
  <text class="note" x="92" y="291">avaliar</text>
  <path class="edge" d="M70 300v24" marker-end="url(#patterns-arrow)" />
  <circle cx="70" cy="346" r="14" fill="#EDF5F0" /><text class="marker-num" x="70" y="351" text-anchor="middle">3</text>
  <text class="note" x="92" y="351">decidir</text>

  <path class="box" d="M480 196 544 244 480 292 416 244Z" />
  <text class="name" x="480" y="241" text-anchor="middle" font-size="15">qual</text>
  <text class="name" x="480" y="260" text-anchor="middle" font-size="15">rota?</text>
  <path class="edge" d="M432 276l-40 54" />
  <path class="edge" d="M528 276l40 54" />
  <text class="kind" x="368" y="354">OBTER</text>
  <text class="kind" x="544" y="354">RESPONDER</text>

  <path d="M692 212v116m0-116h12m-12 116h12M876 212v116m0-116h-12m12 116h-12" fill="none" stroke="#2B3B33" />
  <text class="name" x="720" y="244" font-size="16">Risco 1</text>
  <text class="note" x="720" y="273">…</text>
  <text class="name" x="720" y="304" font-size="16">Risco N</text>
  <text class="kind" x="720" y="338">2 ≤ N ≤ 4</text>

  <rect x="48" y="378" width="864" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="68" y="404" fill="#FF6FB6">FOCO · FRONTEIRA PARTILHADA</text>
  <text class="name" x="68" y="427" fill="#FF6FB6">A estrutura é imposta; a correção factual não.</text>
  <defs>
    <marker id="patterns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
