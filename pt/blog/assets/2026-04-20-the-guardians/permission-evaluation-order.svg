<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Separate Claude Code CLI and Claude Agent SDK permission flows" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Fluxos de permissões do Claude Code CLI e do Agent SDK</title>
  <desc>Dois caminhos de permissões separados: o Claude Code avalia regras deny, ask e allow, com um hook PreToolUse como controlo lateral de bloqueio; o Claude Agent SDK avalia hooks, deny, ask, mode, allow e canUseTool antes de executar ou bloquear uma ferramenta.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="790" rx="14" fill="#f8fafc" />
  <text x="560" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">A avaliação de permissões tem dois caminhos</text>
  <text x="560" y="58" text-anchor="middle" font-size="12" fill="#64748b">As regras do Claude Code CLI e o callback do Claude Agent SDK são controlos relacionados, não um pipeline universal.</text>

  <!-- CLI flow -->
  <rect x="48" y="84" width="500" height="620" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="72" y="118" font-size="16" font-weight="700" fill="#1d4ed8">Claude Code CLI</text>
  <text x="72" y="140" font-size="11" fill="#64748b">A primeira regra correspondente prevalece: deny → ask → allow.</text>

  <rect x="76" y="164" width="300" height="42" rx="8" fill="#7c3aed" />
  <text x="226" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Pedido de ferramenta do CLI</text>

  <line x1="226" y1="206" x2="226" y2="219" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="219" width="300" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="92" y="243" font-size="12" font-weight="700" fill="#991b1b">1 · regras deny</text>
  <text x="92" y="262" font-size="11" fill="#334155">primeira correspondência → bloquear</text>

  <line x1="226" y1="277" x2="226" y2="299" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="299" width="300" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="92" y="323" font-size="12" font-weight="700" fill="#9a3412">2 · regras ask</text>
  <text x="92" y="342" font-size="11" fill="#334155">primeira correspondência → pedir confirmação</text>

  <line x1="226" y1="357" x2="226" y2="379" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="379" width="300" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="92" y="403" font-size="12" font-weight="700" fill="#166534">3 · regras allow</text>
  <text x="92" y="422" font-size="11" fill="#334155">primeira correspondência → permitir</text>

  <line x1="226" y1="437" x2="226" y2="461" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="461" width="300" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="92" y="485" font-size="12" font-weight="700" fill="#9a3412">Nenhuma regra correspondente</text>
  <text x="92" y="504" font-size="11" fill="#334155">o modo de permissões ativo trata do pedido</text>

  <rect x="76" y="548" width="300" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="226" y="570" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Resultado do CLI</text>
  <text x="226" y="586" text-anchor="middle" font-size="10" fill="#64748b">pedir confirmação ou executar</text>

  <!-- Hook side note: it is deliberately outside the CLI rule path. -->
  <rect x="402" y="216" width="122" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="414" y="239" font-size="10.5" font-weight="700" fill="#1d4ed8">Hook PreToolUse</text>
  <text x="414" y="255" font-size="9" fill="#64748b">nota sobre bloqueio lateral</text>
  <text x="414" y="281" font-size="10" fill="#334155">É executado antes</text>
  <text x="414" y="296" font-size="10" fill="#334155">do pedido de confirmação.</text>
  <text x="414" y="321" font-size="10" fill="#334155">Pode bloquear uma</text>
  <text x="414" y="336" font-size="10" fill="#334155">chamada, mas não</text>
  <text x="414" y="351" font-size="10" fill="#334155">contorna uma regra</text>
  <text x="414" y="366" font-size="10" fill="#334155">deny ou ask</text>
  <text x="414" y="381" font-size="10" fill="#334155">correspondente.</text>
  <line x1="402" y1="318" x2="376" y2="318" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- SDK flow -->
  <rect x="572" y="84" width="500" height="620" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="596" y="118" font-size="16" font-weight="700" fill="#5b21b6">Claude Agent SDK</text>
  <text x="596" y="140" font-size="11" fill="#64748b">Um caminho de callback separado termina num bloqueio ou numa execução explícitos.</text>

  <rect x="600" y="164" width="444" height="42" rx="8" fill="#7c3aed" />
  <text x="822" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Pedido de ferramenta do SDK</text>

  <line x1="822" y1="206" x2="822" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="220" width="444" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="616" y="241" font-size="12" font-weight="700" fill="#1d4ed8">1 · hooks</text>
  <text x="616" y="257" font-size="10.5" fill="#334155">Os hooks PreToolUse podem bloquear o pedido.</text>

  <line x1="822" y1="268" x2="822" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="282" width="444" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="616" y="303" font-size="12" font-weight="700" fill="#991b1b">2 · regras deny</text>
  <text x="616" y="319" font-size="10.5" fill="#334155">Regra deny correspondente → bloquear.</text>

  <line x1="822" y1="330" x2="822" y2="344" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="344" width="444" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="616" y="365" font-size="12" font-weight="700" fill="#9a3412">3 · regras ask</text>
  <text x="616" y="381" font-size="10.5" fill="#334155">Regra ask correspondente → pedir confirmação.</text>

  <line x1="822" y1="392" x2="822" y2="406" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="406" width="444" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="616" y="427" font-size="12" font-weight="700" fill="#9a3412">4 · modo de permissões</text>
  <text x="616" y="443" font-size="10.5" fill="#334155">Um pedido não resolvido usa o modo ativo.</text>

  <line x1="822" y1="454" x2="822" y2="468" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="468" width="444" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="616" y="489" font-size="12" font-weight="700" fill="#166534">5 · regras allow</text>
  <text x="616" y="505" font-size="10.5" fill="#334155">Regra allow correspondente → permitir.</text>

  <line x1="822" y1="516" x2="822" y2="530" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="530" width="444" height="54" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="616" y="553" font-size="12" font-weight="700" fill="#5b21b6">6 · canUseTool</text>
  <text x="616" y="570" font-size="10.5" fill="#334155">O callback do SDK toma a decisão final.</text>

  <path d="M 822 584 V 602 H 705 V 620" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 822 602 H 939 V 620" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="620" width="210" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="705" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">bloquear</text>
  <text x="705" y="657" text-anchor="middle" font-size="10" fill="#334155">a ferramenta não é executada</text>
  <rect x="834" y="620" width="210" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="939" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">executar</text>
  <text x="939" y="657" text-anchor="middle" font-size="10" fill="#334155">a ferramenta é executada</text>

  <text x="560" y="744" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Fonte: code.claude.com/docs/en/permissions · code.claude.com/docs/en/agent-sdk/permissions</text>
  <text x="560" y="767" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">As permissões são infraestrutura, não um prompt.</text>
</svg>
