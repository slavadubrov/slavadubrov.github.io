<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asi-title asi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asi-title">OWASP ASI Top 10 agrupado pelo limite de controlo necessário</title>
  <desc id="asi-desc">O sequestro do objetivo e o envenenamento da memória são as duas categorias em que os filtros de conteúdo podem contribuir. As outras oito categorias exigem controlos do sistema para ferramentas, execução, identidade, comunicação, cadeia de fornecimento, falhas em cascata, confiança humana e agentes maliciosos.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#0C1210" />

  <rect x="48" y="56" width="280" height="424" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="72" y="88">ADJACENTE AO CONTEÚDO · 2 EM 10</text>
  <text class="note" x="72" y="112">Os filtros podem contribuir aqui.</text>

  <rect x="72" y="144" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="176">ASI01</text>
  <text class="name" x="92" y="204" style="font-size: 13.5px;">Sequestro do objetivo do agente</text>
  <text class="note" x="92" y="224">redirecionamento de instruções</text>

  <rect x="72" y="280" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="312">ASI06</text>
  <text class="name" x="92" y="340" style="font-size: 15.5px;">Envenenamento da memória</text>
  <text class="note" x="92" y="360">RAG e contexto persistente</text>

  <text class="note" x="72" y="432">Continua a exigir autorização e</text>
  <text class="note" x="72" y="452">imposição no runtime a jusante.</text>

  <rect x="368" y="56" width="544" height="424" rx="12" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="392" y="88" fill="#FF6FB6">FOCO · CONTROLOS DO SISTEMA · 8 EM 10</text>
  <text class="note" x="392" y="112" fill="#FF6FB6"><tspan x="392">Controlos de identidade, políticas, isolamento, monitorização e cadeia de</tspan><tspan x="392" dy="1.2em">fornecimento.</tspan></text>

  <rect class="box" x="392" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="176">ASI02 + ASI05</text>
  <text class="name" x="412" y="204" style="font-size: 15.5px;">Uso indevido de ferramentas</text>
  <text class="note" x="412" y="224">execução inesperada de código</text>

  <rect class="box" x="656" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="176">ASI03 + ASI07</text>
  <text class="name" x="676" y="204">Abuso de identidade</text>
  <text class="note" x="676" y="224">canais de agentes inseguros</text>

  <rect class="box" x="392" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="312">ASI04 + ASI08</text>
  <text class="name" x="412" y="340">Cadeia de fornecimento</text>
  <text class="note" x="412" y="360">falhas em cascata dos agentes</text>

  <rect class="box" x="656" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="312">ASI09 + ASI10</text>
  <text class="name" x="676" y="340">Confiança humana</text>
  <text class="note" x="676" y="360" style="font-size: 11px;">agentes maliciosos e deriva do objetivo</text>

  <text class="note" x="392" y="432">Estas classes de falha estão para além de um único</text>
  <text class="note" x="392" y="452">limite de entrada ou saída do modelo.</text>

  <text class="note" x="48" y="528">OWASP Agentic Security Initiative Top 10 para 2026 · publicado em 9 de dezembro de 2025</text>
</svg>
