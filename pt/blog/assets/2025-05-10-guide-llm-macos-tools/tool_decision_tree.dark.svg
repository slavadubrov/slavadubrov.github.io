<text x="32" y="554" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Nenhuma das quatro é universalmente mais rápida — quem decide é o benchmark, não a ferramenta.</text>
