<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="memory-title memory-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="memory-title">Orçamento de memória unificada do Apple Silicon para inferência local</title>
  <desc id="memory-desc">A memória unificada instalada tem de acomodar o macOS e as aplicações, os pesos do modelo, o KV cache, o espaço de trabalho do runtime e os componentes multimodais, mantendo margem suficiente para evitar swap contínuo.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.6px; fill: #a8b8af; }
    .kind { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: #edf5f0; }
    .note { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #a8b8af; }
    .box { stroke: #edf5f0; stroke-width: 1.5; }
    .focus-kind, .focus-name { fill: #ff6fb6; }
  </style>
  <rect width="960" height="488" rx="14" fill="#0c1210" />

  <text class="section" x="48" y="40">MEMÓRIA UNIFICADA INSTALADA — PICO DE UTILIZAÇÃO + MARGEM</text>

  <rect class="box" x="48" y="64" width="412" height="96" rx="10" fill="#141d19" />
  <text class="kind" x="68" y="98">SISTEMA</text>
  <text class="name" x="68" y="126">macOS + aplicações</text>

  <rect class="box" x="500" y="64" width="412" height="96" rx="10" fill="#1b2621" />
  <text class="kind" x="520" y="98">ARTEFACTO</text>
  <text class="name" x="520" y="126">Pesos do modelo</text>

  <rect class="box" x="48" y="200" width="412" height="96" rx="10" fill="#1b2621" />
  <text class="kind" x="68" y="234">ESTADO</text>
  <text class="name" x="68" y="262">KV cache</text>

  <rect class="box" x="500" y="200" width="412" height="96" rx="10" fill="#141d19" />
  <text class="kind" x="520" y="234">RUNTIME</text>
  <text class="name" x="520" y="262">Espaço de trabalho + buffers temporários</text>

  <rect class="box" x="48" y="336" width="412" height="96" rx="10" fill="#1b2621" />
  <text class="kind" x="68" y="370">COMPONENTES</text>
  <text class="name" x="68" y="398">Componentes multimodais</text>

  <rect x="500" y="336" width="412" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind focus-kind" x="520" y="370">FOCO</text>
  <text class="name focus-name" x="520" y="398">Manter margem utilizável</text>

  <text class="note" x="48" y="464">O carregamento é apenas o primeiro obstáculo. Meça a pressão máxima no contexto e no número de pedidos pretendidos.</text>
</svg>
