<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 586" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="macostools-title macostools-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="macostools-title">Escolha uma ferramenta LLM local para macOS com base no workflow e, depois, faça benchmark de todos os candidatos da mesma forma.</title><desc id="macostools-desc">Partindo de uma tarefa e de um checkpoint fixos, escolha Ollama para um serviço local gerido, LM Studio para explorar modelos no desktop, llama.cpp para controlo direto de GGUF ou MLX-LM para Python nativo da Apple — e, depois, aplique uma disciplina comum: faça benchmark com o mesmo checkpoint, a mesma quantização e o mesmo conjunto de prompts antes de comparar.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="macostools-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="macostools-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="586" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Escolha a superfície de controlo e faça benchmark</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Escolha pelo workflow; converja para uma disciplina única de benchmark.</text>
