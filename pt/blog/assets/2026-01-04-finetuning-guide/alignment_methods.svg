<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Alignment Methods" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Três designs de otimização de preferências</title>
  <desc>O RLHF baseado em PPO usa fine-tuning supervisionado, um reward model e otimização on-policy; o DPO otimiza pares offline face a uma referência; o ORPO combina perdas supervisionadas e de odds ratio sem um modelo de referência.</desc>
  <defs>



    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F2F2F5" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F2F2F5" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="420" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="30" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#17211B">Designs de otimização de preferências</text>

  <!-- Traditional RLHF -->
  <text x="60" y="65" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">RLHF baseado em PPO:</text>

  <rect x="60" y="80" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="125" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1. SFT</text>
  <text x="125" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Aprender a tarefa</text>

  <path d="M 190 102 L 220 102" stroke="#59645E" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <rect x="230" y="80" width="130" height="45" rx="6" fill="#F2F2F5" class="visual-focus" />
  <text x="295" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2. Reward Model</text>
  <text x="295" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Aprender preferências</text>

  <path d="M 360 102 L 390 102" stroke="#59645E" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <rect x="400" y="80" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="465" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3. PPO (RL)</text>
  <text x="465" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Otimizar a policy</text>

  <text x="560" y="98" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Amostras on-policy</text>
  <text x="560" y="112" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Verificações do reward model</text>

  <!-- Divider -->
  <line x1="60" y1="150" x2="850" y2="150" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Modern DPO -->
  <text x="60" y="175" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">DPO:</text>

  <rect x="60" y="190" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="125" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1. SFT</text>
  <text x="125" y="228" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Aprender a tarefa</text>

  <path d="M 190 212 L 220 212" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />

  <rect x="230" y="190" width="130" height="45" rx="6" fill="#F2F2F5" />
  <text x="295" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2. DPO</text>
  <text x="295" y="228" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Preferência direta</text>

  <text x="395" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Pares offline</text>
  <text x="395" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Policy de referência</text>
  <text x="395" y="235" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Sem reward model aprendido</text>

  <!-- Divider -->
  <line x1="60" y1="260" x2="850" y2="260" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Newest ORPO -->
  <text x="60" y="285" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">ORPO:</text>

  <rect x="60" y="300" width="200" height="50" rx="6" fill="#F2F2F5" />
  <text x="160" y="322" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">ORPO (uma etapa)</text>
  <text x="160" y="340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">SFT + alinhamento combinado</text>

  <text x="290" y="315" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">SFT + perda de odds ratio</text>
  <text x="290" y="330" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Sem modelo de referência</text>
  <text x="290" y="345" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">Um único caminho acoplado de checkpoints</text>

  <!-- Recommendation Box -->
  <rect x="530" y="280" width="310" height="80" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="685" y="305" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#17211B">Regra de seleção</text>
  <text x="685" y="325" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Adequar o objetivo aos dados</text>
  <text x="685" y="340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Manter uma baseline apenas com SFT</text>
  <text x="685" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Medir métricas da tarefa e de preferências</text>

  <!-- Legend -->
  <rect x="60" y="375" width="780" height="35" rx="4" fill="#FFFFFF" />
  <text x="80" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B">Legenda:</text>
  <text x="115" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">SFT = Supervised Fine-Tuning</text>
  <text x="300" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">DPO = Direct Preference Optimization</text>
  <text x="530" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B">ORPO = Odds-Ratio Preference Optimization</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
