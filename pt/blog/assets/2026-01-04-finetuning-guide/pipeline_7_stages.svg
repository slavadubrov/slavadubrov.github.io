<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="7-Stage Pipeline" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Ciclo de vida do fine-tuning em sete etapas</title>
  <desc>A preparação dos dados, a seleção do modelo, a configuração do treino, o fine-tuning, a avaliação, a implementação e a monitorização formam um ciclo de vida iterativo de release.</desc>
  <defs>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="500" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="35" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle" fill="#17211B">O ciclo de vida do fine-tuning em 7 etapas</text>

  <!-- Stage boxes - Row 1 -->
  <g transform="translate(50, 70)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#17211B">1. Preparação dos dados</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B"><tspan x="80">Limpar, remover</tspan><tspan x="80" dy="1.2em">duplicados, formatar</tspan></text>
  </g>

  <path d="M 210 102 L 240 102" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(250, 70)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">2. Seleção do modelo</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B"><tspan x="80">Escolher o modelo base,</tspan><tspan x="80" dy="1.2em">carregar</tspan></text>
  </g>

  <path d="M 410 102 L 440 102" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(450, 70)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">3. Configuração do treino</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B"><tspan x="80">Configurar hardware,</tspan><tspan x="80" dy="1.2em">parâmetros</tspan></text>
  </g>

  <path d="M 610 102 L 640 102" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(650, 70)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">4. Fine-tuning</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">SFT, DPO ou ORPO</text>
  </g>

  <!-- Arrow down -->
  <path d="M 730 135 L 730 170" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <!-- Stage boxes - Row 2 -->
  <g transform="translate(650, 180)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">5. Avaliação</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Executar benchmark, validar</text>
  </g>

  <path d="M 650 212 L 620 212" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(450, 180)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">6. Implementação</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Exportar, servir o modelo</text>
  </g>

  <path d="M 450 212 L 420 212" stroke="#17211B" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />

  <g transform="translate(250, 180)">
    <rect width="160" height="65" rx="8" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
    <text x="80" y="28" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">7. Monitorização</text>
    <text x="80" y="46" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Acompanhar, manter, iterar</text>
  </g>

  <!-- Feedback loop -->
  <path d="M 250 212 L 32 212 L 32 102 L 42 102" stroke="#59645E" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrowhead-orange)" />
  <text x="145" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#17211B">Iterar</text>

  <!-- Key insight box -->
  <rect x="50" y="290" width="800" height="90" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="70" y="320" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#17211B">Começar pelo contrato de avaliação</text>
  <text x="70" y="345" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#17211B">• Dividir os dados reservados antes do treino e protegê-los contra leakage de quase-duplicados</text>
  <text x="70" y="365" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#17211B">• Publicar o modelo, o tokenizer, o template, o adapter, a versão dos dados e o relatório de avaliação em conjunto</text>

  <!-- Stage highlight -->
  <rect x="46" y="66" width="168" height="73" rx="10" fill="none" stroke="#F2148E" stroke-width="2.5" stroke-dasharray="4,2" />
  <text x="130" y="155" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#17211B">DEFINIR PRIMEIRO AS DIVISÕES</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
