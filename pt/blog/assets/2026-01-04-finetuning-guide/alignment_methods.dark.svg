<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Alignment Methods" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Três designs de otimização de preferências</title>
  <desc>O RLHF baseado em PPO usa SFT, um modelo de recompensa e otimização on-policy; o DPO otimiza pares offline face a uma referência; o ORPO combina perdas supervisionadas e de odds ratio sem um modelo de referência.</desc>
  <defs>



    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B2621" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1B2621" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="420" fill="#0C1210" />

  <!-- Title -->
  <text x="450" y="30" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#EDF5F0">Designs de otimização de preferências</text>

  <!-- Traditional RLHF -->
  <text x="60" y="65" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">RLHF baseado em PPO:</text>

  <rect x="60" y="80" width="130" height="45" rx="6" fill="#1B2621" />
  <text x="125" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">1. SFT</text>
  <text x="125" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Aprender a tarefa</text>

  <path d="M 190 102 L 220 102" stroke="#A8B8AF" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <rect x="230" y="80" width="130" height="45" rx="6" fill="#1B2621" class="visual-focus" />
  <text x="295" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">2. Modelo de recompensa</text>
  <text x="295" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Aprender preferências</text>

  <path d="M 360 102 L 390 102" stroke="#A8B8AF" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <rect x="400" y="80" width="130" height="45" rx="6" fill="#1B2621" />
  <text x="465" y="105" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">3. PPO (RL)</text>
  <text x="465" y="118" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Otimizar a policy</text>

  <text x="560" y="98" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Amostras on-policy</text>
  <text x="560" y="112" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Verificações do modelo de recompensa</text>

  <!-- Divider -->
  <line x1="60" y1="150" x2="850" y2="150" stroke="#2B3B33" stroke-width="1.5" />

  <!-- Modern DPO -->
  <text x="60" y="175" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">DPO:</text>

  <rect x="60" y="190" width="130" height="45" rx="6" fill="#1B2621" />
  <text x="125" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">1. SFT</text>
  <text x="125" y="228" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Aprender a tarefa</text>

  <path d="M 190 212 L 220 212" stroke="#EDF5F0" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" />

  <rect x="230" y="190" width="130" height="45" rx="6" fill="#1B2621" />
  <text x="295" y="215" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#141D19">2. DPO</text>
  <text x="295" y="228" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Preferência direta</text>

  <text x="395" y="205" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Pares offline</text>
  <text x="395" y="220" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Policy de referência</text>
  <text x="395" y="235" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Sem modelo de recompensa aprendido</text>

  <!-- Divider -->
  <line x1="60" y1="260" x2="850" y2="260" stroke="#2B3B33" stroke-width="1.5" />

  <!-- Newest ORPO -->
  <text x="60" y="285" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">ORPO:</text>

  <rect x="60" y="300" width="200" height="50" rx="6" fill="#1B2621" />
  <text x="160" y="322" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#141D19">ORPO (uma etapa)</text>
  <text x="160" y="340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">SFT + alinhamento combinado</text>

  <text x="290" y="315" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">SFT + perda de odds ratio</text>
  <text x="290" y="330" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Sem modelo de referência</text>
  <text x="290" y="345" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">Um único percurso acoplado de checkpoints</text>

  <!-- Recommendation Box -->
  <rect x="530" y="280" width="310" height="80" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="685" y="305" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#EDF5F0">Regra de seleção</text>
  <text x="685" y="325" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Alinhar o objetivo com os dados</text>
  <text x="685" y="340" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Manter uma baseline apenas com SFT</text>
  <text x="685" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#EDF5F0">Medir métricas da tarefa e de preferências</text>

  <!-- Legend -->
  <rect x="60" y="375" width="780" height="35" rx="4" fill="#141D19" />
  <text x="80" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#EDF5F0">Legenda:</text>
  <text x="115" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">SFT = Supervised Fine-Tuning</text>
  <text x="300" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">DPO = Direct Preference Optimization</text>
  <text x="530" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#EDF5F0">ORPO = Odds-Ratio Preference Optimization</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
