<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Output Formats" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Opções de artefactos de modelos com fine-tuning</title>
  <desc>Um adaptador LoRA pequeno depende do modelo base; um checkpoint fundido é autónomo e tem o tamanho do modelo completo; e GGUF destina-se à inferência local ou edge, com uma quantização escolhida.</desc>
  <defs>




  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="380" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">Comparação de formatos de saída</text>

  <!-- LoRA Adapter -->
  <rect x="40" y="70" width="260" height="290" rx="16" fill="#F2F2F5" stroke="#F2148E" stroke-width="2.5" class="visual-focus" />
  <text x="170" y="110" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold">Adaptador LoRA</text>

  <rect x="55" y="130" width="230" height="210" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />

  <text x="70" y="160" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">TAMANHO</text>
  <text x="70" y="180" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14">Depende do rank/módulo</text>

  <text x="70" y="210" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">COMANDO</text>
  <text x="70" y="228" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">uv run finetune</text>

  <text x="70" y="258" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">IDEAL PARA</text>
  <text x="70" y="278" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Desenvolvimento e testes</text>
  <text x="70" y="295" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Vários adaptadores</text>
  <text x="70" y="312" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Eficiência de armazenamento</text>
  <text x="70" y="329" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Controlo de versões</text>

  <!-- Merged Model -->
  <rect x="320" y="70" width="260" height="290" rx="16" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="450" y="110" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold">Modelo fundido</text>

  <rect x="335" y="130" width="230" height="210" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />

  <text x="350" y="160" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">TAMANHO</text>
  <text x="350" y="180" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" style="font-size: 13.5px;">Tamanho do checkpoint completo</text>

  <text x="350" y="210" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">COMANDO</text>
  <text x="350" y="228" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">uv run finetune --merge</text>

  <text x="350" y="258" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">IDEAL PARA</text>
  <text x="350" y="278" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Partilha com outras pessoas</text>
  <text x="350" y="295" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Engines que requerem um único modelo</text>
  <text x="350" y="312" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Deployment de um único artefacto</text>
  <text x="350" y="329" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Hugging Face Hub</text>

  <!-- GGUF -->
  <rect x="600" y="70" width="260" height="290" rx="16" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text x="730" y="110" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="bold">Formato GGUF</text>

  <rect x="615" y="130" width="230" height="210" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />

  <text x="630" y="160" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">TAMANHO</text>
  <text x="630" y="180" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" style="font-size: 12px;">Depende do modelo e da quantização</text>

  <text x="630" y="210" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">COMANDO</text>
  <text x="630" y="228" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">uv run finetune --gguf q4_k_m</text>

  <text x="630" y="258" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">IDEAL PARA</text>
  <text x="630" y="278" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Inferência em CPU</text>
  <text x="630" y="295" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Ollama / llama.cpp</text>
  <text x="630" y="312" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Deployment edge</text>
  <text x="630" y="329" fill="#17211B" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">• Sistemas com poucos recursos</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
