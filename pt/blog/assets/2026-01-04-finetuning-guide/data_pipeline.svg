<text x="32" y="1058" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;">A política de dados sensíveis é mais rigorosa do que a deteção de PII — a proveniência, o consentimento, a retenção e a eliminação continuam a aplicar-se.</text>
<text x="32" y="1080" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Cobertura antes do volume: adicionar exemplos para modos de falha distintos, não repetições do caso</tspan><tspan x="32" dy="1.2em">maioritário fácil.</tspan></text>
</svg>
