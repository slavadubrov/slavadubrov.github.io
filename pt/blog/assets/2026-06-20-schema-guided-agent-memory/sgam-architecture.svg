<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="sgam-title sgam-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="sgam-title">Percursos de escrita e leitura em torno de um arquivo de memória de agentes orientado por schema</title>
  <desc id="sgam-desc">Duas lanes da esquerda para a direita partilham um arquivo de memória com âmbito de tenant. O percurso de escrita transforma um episódio bruto num delta de memória validado e altera o arquivo. O percurso de leitura define o âmbito de uma pergunta do utilizador, consulta o mesmo arquivo e reúne contexto atual ou histórico com citações.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #59645e; }
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .focus-kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #c50e72; }
    .focus-name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #c50e72; }
    .process { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .external { fill: #ffffff; stroke: #59645e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { fill: none; stroke: #59645e; stroke-width: 1.5; }
  </style>

  <rect width="1120" height="664" rx="14" fill="#f7f7f4" />

  <rect x="48" y="48" width="1024" height="208" rx="12" fill="none" stroke="#d8ddd9" />
  <text class="section" x="72" y="82">PERCURSO DE ESCRITA — ALTERA O ESTADO</text>
  <line x1="72" y1="96" x2="1048" y2="96" stroke="#d8ddd9" />

  <rect class="external" x="72" y="120" width="176" height="96" rx="10" />
  <text class="kind" x="92" y="154">EXTERNO</text>
  <text class="name" x="92" y="182">Episódio bruto</text>

  <rect class="process" x="288" y="120" width="176" height="96" rx="10" />
  <text class="kind" x="308" y="154">PROCESSAMENTO</text>
  <text class="name" x="308" y="182">Extração tipada</text>

  <rect class="process" x="504" y="120" width="176" height="96" rx="10" />
  <text class="kind" x="524" y="154">PROCESSAMENTO</text>
  <text class="name" x="524" y="182">Validar + reconciliar</text>

  <path class="edge" d="M248 168h32" marker-end="url(#sgam-arrow)" />
  <path class="edge" d="M464 168h32" marker-end="url(#sgam-arrow)" />
  <path class="edge" d="M680 168h112v112" marker-end="url(#sgam-arrow)" />
  <text class="note" x="808" y="250">escrita validada</text>
  <text class="note" x="72" y="242">Apenas esta lane pode criar, substituir ou fechar um registo.</text>

  <rect x="704" y="288" width="176" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="focus-kind" x="724" y="322">FOCO · ARQUIVO</text>
  <text class="focus-name" x="724" y="350">Registos SGAM</text>

  <rect x="48" y="400" width="1024" height="216" rx="12" fill="none" stroke="#d8ddd9" />
  <text class="section" x="72" y="434">PERCURSO DE LEITURA — SELECIONA O ESTADO</text>
  <line x1="72" y1="448" x2="1048" y2="448" stroke="#d8ddd9" />

  <rect class="external" x="72" y="472" width="176" height="96" rx="10" />
  <text class="kind" x="92" y="506">EXTERNO</text>
  <text class="name" x="92" y="534"><tspan x="92">Pergunta do</tspan><tspan x="92" dy="1.2em">utilizador</tspan></text>

  <rect class="process" x="288" y="472" width="176" height="96" rx="10" />
  <text class="kind" x="308" y="506">PROCESSAMENTO</text>
  <text class="name" x="308" y="534"><tspan x="308">Pesquisa do estado</tspan><tspan x="308" dy="1.2em">com âmbito</tspan></text>

  <rect class="process" x="920" y="472" width="152" height="96" rx="10" />
  <text class="kind" x="940" y="506">PROCESSAMENTO</text>
  <text class="name" x="940" y="534"><tspan x="940">Contexto com</tspan><tspan x="940" dy="1.2em">citações</tspan></text>

  <path class="edge" d="M248 520h32" marker-end="url(#sgam-arrow)" />
  <path class="edge" d="M464 520h328V392" marker-end="url(#sgam-arrow)" />
  <rect x="552" y="508" width="104" height="24" rx="6" fill="#f7f7f4" />
  <text class="note" x="604" y="525" text-anchor="middle" style="font-size: 11px;">consulta com âmbito</text>

  <path class="edge" d="M880 336h116v128" marker-end="url(#sgam-arrow)" />
  <rect x="884" y="390" width="112" height="40" rx="6" fill="#f7f7f4" />
  <text class="note" x="892" y="406">atual ou histórico</text>
  <text class="note" x="892" y="423" style="font-size: 11px;">registos + proveniência</text>
  <text class="note" x="72" y="596">O tenant, o tipo, o sujeito, o atributo e a janela de validade são aplicados antes da expansão fuzzy.</text>

  <defs>
    <marker id="sgam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
