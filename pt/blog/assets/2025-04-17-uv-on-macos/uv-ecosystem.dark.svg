<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="uveco-title uveco-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="uveco-title">Um executável uv gere quatro ciclos de vida separados.</title><desc id="uveco-desc">O uv mantém as instalações de interpretadores, o estado dos projetos, os scripts PEP 723 autocontidos e as ferramentas de linha de comandos isoladas como quatro ciclos de vida separados e elimináveis de forma independente, sob um único executável. O Homebrew e o macOS continuam a gerir as aplicações anfitriãs e as bibliotecas nativas fora deste limite.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="uveco-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="uveco-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="536" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Um executável, quatro ciclos de vida</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Python gerido, projetos, scripts e ferramentas permanecem em limites separados.</text>
<path d="M290 112h220a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-220a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M290 112h220a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-240a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="294" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCO · RUNTIME</text><text x="294" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Executável uv</text><text x="294" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Um binário, quatro ciclos de vida</text>
