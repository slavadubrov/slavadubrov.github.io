<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uve-title uve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uve-title">As quatro fronteiras do workflow do uv</title>
  <desc id="uve-desc">Um único executável uv gere quatro ciclos de vida distintos: instalações de interpretadores, estado do projeto, scripts autónomos e ferramentas de linha de comandos isoladas. O Homebrew e o macOS continuam a gerir as aplicações do sistema anfitrião e as bibliotecas nativas.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0C1210" />

  <text class="section" x="48" y="36">UM EXECUTÁVEL · QUATRO FRONTEIRAS DE GESTÃO</text>

  <rect x="336" y="56" width="288" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="356" y="80" fill="#FF6FB6">FOCO · RUNTIME</text>
  <text class="name" x="356" y="103" fill="#FF6FB6">Executável uv</text>

  <path class="edge" d="M480 118v24H254v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142h226v30" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 142v142H254v24" marker-end="url(#uve-arrow)" />
  <path class="edge" d="M480 284h226v24" marker-end="url(#uve-arrow)" />

  <rect class="store" x="48" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="210">PYTHON GERIDO · ARMAZÉM</text>
  <text class="name" x="68" y="238">Instalações de interpretadores</text>
  <text class="note" x="68" y="258">diretório de dados · instalar, fixar, detetar</text>

  <rect class="store" x="500" y="176" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="210">PROJETO · ARMAZÉM</text>
  <text class="name" x="520" y="238">Declarações, lock, ambiente</text>
  <text class="note" x="520" y="258">ciclo de vida do repositório · .venv local</text>

  <rect class="store" x="48" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="346">SCRIPT PEP 723 · ARMAZÉM</text>
  <text class="name" x="68" y="374">Unidade de release num único ficheiro</text>
  <text class="note" x="68" y="394">metadados inline · cache isolada</text>

  <rect class="store" x="500" y="312" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="346">FERRAMENTA CLI · ARMAZÉM</text>
  <text class="name" x="520" y="374">Comando efémero ou instalado</text>
  <text class="note" x="520" y="394">cache do uvx · PATH apenas por opção</text>

  <path d="M48 438h24" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="84" y="443">Fora desta fronteira: o Homebrew e o macOS gerem as aplicações do sistema anfitrião e as bibliotecas nativas.</text>

  <defs>
    <marker id="uve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
