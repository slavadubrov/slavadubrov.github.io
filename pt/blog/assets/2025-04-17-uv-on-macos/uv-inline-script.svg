<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 752" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="uvscript-title uvscript-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="uvscript-title">uv run lê um bloco de metadados PEP 723 antes de executar fetch.py.</title><desc id="uvscript-desc">fetch.py contém um bloco de comentários PEP 723 dedicado, que declara a versão do Python e as dependências, junto ao código normal. uv run lê esses metadados, cria um ambiente isolado em cache e pode criar um fetch.py.lock adjacente quando é solicitado um lock. O comando python fetch.py executa o código, mas ignora os metadados.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="uvscript-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="uvscript-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="752" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Um ficheiro contém o código e as próprias dependências</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">uv run lê o bloco de metadados antes de executar; python não.</text>
<rect x="32" y="104" width="656" height="176" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">FICHEIRO · FETCH.PY</text>
<path d="M58 148h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M58 148h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="62" y="165.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCO · METADADOS</text><text x="62" y="199" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Bloco de comentários PEP 723</text><text x="62" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">requires-python ≥3.12</text><text x="62" y="241" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">httpx ≥0.27,&lt;1</text>
<path d="M382 148h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M382 148h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="386" y="165.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">CÓDIGO</text><text x="386" y="209" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Importação + chamada HTTP</text><text x="386" y="231" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Python normal válido</text>
<path d="M198 252v36H360v36" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvscript-arrow-flow)" />
<path d="M522 252v36H360v36" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvscript-arrow-flow)" />
<path d="M214 324h292a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-292a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M214 324h292a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-312a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="218" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">EXECUTOR</text><text x="218" y="385" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">uv run fetch.py</text><text x="218" y="407" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Lê os metadados antes de executar</text>
<path d="M360 428v36H214v36" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvscript-arrow-flow)" />
<path d="M360 428v36H506v36" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#uvscript-arrow-flow)" /><rect x="382.5" y="452" width="101" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="433" y="468.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 11px;">quando existe lock</text>
<path d="M94 500h240a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-240a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M94 500h240a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-260a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="98" y="517.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">AMBIENTE</text><text x="98" y="561" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Cache isolada</text><text x="98" y="583" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Interpretador + pacotes resolvidos</text>
<path d="M386 500h240a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-240a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M386 500h240a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-260a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="390" y="517.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">LOCK OPCIONAL</text><text x="390" y="561" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">fetch.py.lock</text><text x="390" y="583" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Apenas com uv lock --script</text>
<path d="M32 644h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="670" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">O comando python fetch.py executa o código, mas ignora o bloco de comentários.</text>
<text x="32" y="692" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">É um executor compatível, como uv, que permite aos metadados terem efeito.</text>
</svg>
