<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Escolher entre uv run, uvx ou uv tool install</title><desc id="desc">As três colunas encaminham ferramentas acopladas ao projeto para uv run, ferramentas isoladas ad hoc para uvx e executáveis que têm de permanecer no PATH para uv tool install.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="590" rx="28" fill="#0f172a" />
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Escolha o ambiente da ferramenta pelo que esta tem de conseguir ver</text>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(55 135)"><rect width="340" height="340" rx="22" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="170" y="52" fill="#93c5fd" font-size="23" font-weight="700">uv run</text><text x="170" y="92" fill="#93c5fd" font-size="17">acoplada ao projeto</text><text x="170" y="145" fill="#e2e8f0" font-size="15">importa código do projeto</text><text x="170" y="178" fill="#e2e8f0" font-size="15">usa grupos bloqueados e plugins</text><text x="170" y="211" fill="#e2e8f0" font-size="15">o ciclo de vida segue o repositório</text><rect x="35" y="260" width="270" height="50" rx="12" fill="#1d4ed8" /><text x="170" y="291" fill="#93c5fd" font-size="15">uv run --group test pytest</text></g>
    <g transform="translate(430 135)"><rect width="340" height="340" rx="22" fill="#5b21b6" /><text x="170" y="52" fill="#93c5fd" font-size="23" font-weight="700">uvx</text><text x="170" y="92" fill="#c4b5fd" font-size="17">ad hoc + isolada</text><text x="170" y="145" fill="#e2e8f0" font-size="15">não vê as importações do projeto</text><text x="170" y="178" fill="#e2e8f0" font-size="15">o ambiente reside na cache</text><text x="170" y="211" fill="#e2e8f0" font-size="15">fixe a versão para garantir a reprodutibilidade</text><rect x="35" y="260" width="270" height="50" rx="12" fill="#5b21b6" /><text x="170" y="291" fill="#93c5fd" font-size="15">uvx ruff@0.12.0 check .</text></g>
    <g transform="translate(805 135)"><rect width="340" height="340" rx="22" fill="#166534" /><text x="170" y="52" fill="#93c5fd" font-size="23" font-weight="700">uv tool install</text><text x="170" y="92" fill="#93c5fd" font-size="17">persistente + no PATH</text><text x="170" y="145" fill="#e2e8f0" font-size="15">ambiente dedicado à ferramenta</text><text x="170" y="178" fill="#e2e8f0" font-size="15">disponível para outros programas</text><text x="170" y="211" fill="#e2e8f0" font-size="15">ciclo de vida de atualização explícito</text><rect x="35" y="260" width="270" height="50" rx="12" fill="#166534" /><text x="170" y="291" fill="#86efac" font-size="15">uv tool install 'ruff==0.12.0'</text></g>
    <rect x="245" y="515" width="710" height="42" rx="14" fill="#1e293b" /><text x="600" y="542" fill="#cbd5e1" font-size="16">O isolamento é uma funcionalidade; escolha intencionalmente a visibilidade do projeto.</text>
  </g>
</svg>
