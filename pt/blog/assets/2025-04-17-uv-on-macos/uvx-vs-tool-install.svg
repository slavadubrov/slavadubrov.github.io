<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uvt-title uvt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvt-title">Escolher entre uv run, uvx ou uv tool install</title>
  <desc id="uvt-desc">Escolha o ambiente em função da visibilidade e da duração. Use uv run para ferramentas que precisam do estado do projeto, uvx para um comando isolado e pontual, e uv tool install quando um executável isolado tiver de permanecer no PATH.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="408" rx="14" fill="#F7F7F4" />

  <rect x="248" y="48" width="464" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="268" y="72" fill="#C50E72">FOCO · ESCOLHA</text>
  <text class="name" x="268" y="95" fill="#C50E72">O que tem de ver a ferramenta e durante quanto tempo?</text>

  <path class="edge" d="M480 110v42H180v52" marker-end="url(#uvt-arrow)" />
  <path class="edge" d="M480 152v52" marker-end="url(#uvt-arrow)" />
  <path class="edge" d="M480 152h308v52" marker-end="url(#uvt-arrow)" />

  <rect x="100" y="140" width="160" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="180" y="157" text-anchor="middle">imports do projeto + lock</text>
  <rect x="408" y="140" width="144" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="157" text-anchor="middle">nada local</text>
  <rect x="700" y="140" width="176" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="788" y="157" text-anchor="middle">tem de permanecer no PATH</text>

  <rect class="process" x="48" y="208" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="242">PROJETO · PROCESSO</text>
  <text class="name" x="68" y="270">uv run</text>
  <text class="note" x="68" y="290">ciclo de vida do repositório · vê plugins</text>

  <rect class="process" x="352" y="208" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="242">EFÉMERO · PROCESSO</text>
  <text class="name" x="372" y="270">uvx</text>
  <text class="note" x="372" y="290">cache isolada · fixar para CI</text>

  <rect class="store" x="656" y="208" width="264" height="96" rx="10" />
  <text class="kind" x="676" y="242">PERSISTENTE · ARMAZENAMENTO</text>
  <text class="name" x="676" y="270">uv tool install</text>
  <text class="note" x="676" y="290">ambiente isolado · no PATH</text>

  <path d="M48 350h24" stroke="#D8DDD9" />
  <text class="note" x="84" y="355">O isolamento é deliberado: apenas o ramo associado ao projeto pode importar código do projeto.</text>

  <defs>
    <marker id="uvt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
