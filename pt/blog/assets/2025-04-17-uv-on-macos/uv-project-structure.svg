<path d="M360 416v36H214v36" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvproj-arrow-flow)" />
<path d="M360 416v36H506v36" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvproj-arrow-flow)" />
<path d="M94 488h240a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-240a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M94 488h240a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-260a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="98" y="505.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">CACHE</text><text x="98" y="539" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Cache</text><text x="98" y="561" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Transferências + builds,</text><text x="98" y="581" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">reutilizável, não autoritativa</text>
<path d="M386 488h240a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-240a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M386 488h240a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-260a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="390" y="505.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">AMBIENTE</text><text x="390" y="539" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">.venv</text><text x="390" y="561" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Ambiente instalado,</text><text x="390" y="581" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">este SO + arquitetura</text>
<path d="M32 632h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Registe pyproject.toml, o código-fonte e os testes, e um .python-version intencional.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">O uv.lock resolve-os; a cache e o .venv são ambos derivados e descartáveis.</text>
