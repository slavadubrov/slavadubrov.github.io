<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="uvproj-title uvproj-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="uvproj-title">O repositório regista três entradas; o uv resolve e deriva o restante.</title><desc id="uvproj-desc">pyproject.toml, código-fonte e testes, e .python-version são entradas registadas. O uv resolve-as no uv.lock focado, um grafo de dependências multiplataforma, e usa depois esse lock para criar um .venv local descartável e uma cache de transferências descartável.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="uvproj-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="uvproj-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="736" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">O que regista, e o que o uv deriva</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">O lock e o pedido Python produzem um ambiente descartável; a cache também é descartável.</text>
