<path d="M210 112h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M210 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="214" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">SGR · ROUTE</text><text x="214" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 15px;">Encaminhar pedido</text>
<path d="M378 112h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M378 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="382" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CARACTERÍSTICAS</text><text x="382" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Obter contexto</text>
<path d="M546 112h132a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-132a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M546 112h132a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-152a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="550" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">SGR · PROPOSE</text><text x="550" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Oferta tipada</text>
