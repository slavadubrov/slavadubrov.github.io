<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="wf-title wf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="wf-title">Fluxo de trabalho de um agente de preços com gate de política determinístico</title><desc id="wf-desc">Um pedido do utilizador é encaminhado através de uma tool call orientada por schema. Um pedido de preços obtém contexto e produz uma proposta com schema-constrained output, que tem de ser aprovada por uma verificação de política focada no código da aplicação antes de ser enviada uma resposta de template; uma proposta rejeitada segue para um fallback. Um pedido geral ignora os preços e chega diretamente ao mesmo passo de resposta de template.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="wf-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="wf-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="568" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Validação de schema e um gate de política determinístico</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O schema permite ao código analisar a proposta; só a política a pode aprovar.</text>
