<text x="32" y="496" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Vercel: 17 tools passaram a 2 meta-tools; -37% tokens médios.</text>
<text x="32" y="518" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A Anthropic reportou uma redução de 98,7% nos tokens num workflow de Drive para Salesforce.</text>
