<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ce-title ce-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ce-title">As chamadas de ferramentas tradicionais repetem-se no contexto; a execução de código devolve um único resumo</title>
  <desc id="ce-desc">Nas chamadas tradicionais, cada resultado de ferramenta regressa ao contexto do modelo antes da chamada seguinte, repetindo-se durante 20 ou mais passagens no exemplo das despesas. Com a execução de código, o modelo escreve um programa, uma sandbox executa as chamadas e mantém os dados intermédios, e apenas o resumo final regressa ao contexto.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="40">TRADICIONAL · CADA RESULTADO VOLTA A ENTRAR NO CONTEXTO</text>

  <rect class="box" x="48" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="96">MODELO</text><text class="name" x="68" y="124"><tspan x="68">Escolher uma</tspan><tspan x="68" dy="1.2em">chamada</tspan></text>
  <rect x="272" y="64" width="188" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="292" y="96">EXTERNO</text><text class="name" x="292" y="124">Ferramenta ou API</text>
  <rect class="store" x="496" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="96">CONTEXTO</text><text class="name" x="516" y="124"><tspan x="516">O resultado bruto</tspan><tspan x="516" dy="1.2em">regressa</tspan></text>
  <rect class="box" x="720" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="740" y="96">PROCESSO</text><text class="name" x="740" y="124"><tspan x="740">Repetir 20+</tspan><tspan x="740" dy="1.2em">passagens</tspan></text>
  <path class="edge" d="M236 112H264" marker-end="url(#ce-arrow)" />
  <path class="edge" d="M460 112H488" marker-end="url(#ce-arrow)" />
  <path class="edge" d="M684 112H712" marker-end="url(#ce-arrow)" />
  <path class="edge" d="M814 160V192H142V160" stroke-dasharray="7 6" marker-end="url(#ce-arrow)" />
  <rect x="386" y="180" width="188" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="197" text-anchor="middle" style="font-size: 11px;">pessoa seguinte · inferência seguinte</text>

  <path d="M48 224H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="kind" x="48" y="252">EXECUÇÃO DE CÓDIGO · OS DADOS INTERMÉDIOS FICAM NA SANDBOX</text>
  <rect class="box" x="48" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="308">MODELO</text><text class="name" x="68" y="336"><tspan x="68">Escrever um</tspan><tspan x="68" dy="1.2em">programa</tspan></text>
  <rect class="box" x="272" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="292" y="308">SANDBOX</text><text class="name" x="292" y="336"><tspan x="292">Executar ciclos +</tspan><tspan x="292" dy="1.2em">chamadas</tspan></text>
  <rect class="store" x="496" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="308">ESTADO LOCAL</text><text class="name" x="516" y="336"><tspan x="516">Processar mais de 2</tspan><tspan x="516" dy="1.2em">000 linhas</tspan></text>
  <rect x="720" y="276" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="740" y="308" fill="#C50E72">FOCO · CONTEXTO</text><text class="name" x="740" y="336" fill="#C50E72"><tspan x="740">Devolver um</tspan><tspan x="740" dy="1.2em">resultado de ~1 KB</tspan></text>
  <path class="edge" d="M236 324H264" marker-end="url(#ce-arrow)" />
  <path class="edge" d="M460 324H488" marker-end="url(#ce-arrow)" />
  <path class="edge" d="M684 324H712" marker-end="url(#ce-arrow)" />

  <text class="note" x="48" y="424">Exemplo de análise de despesas: cerca de 200 KB de linhas brutas são processados localmente; apenas o resultado entra no contexto do modelo.</text>
  <defs>
    <marker id="ce-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
