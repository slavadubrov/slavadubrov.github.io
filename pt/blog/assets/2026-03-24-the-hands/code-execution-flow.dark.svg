<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ced-title ced-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ced-title">As tool calls tradicionais repetem-se no contexto; a execução de código devolve um único resumo</title>
  <desc id="ced-desc">Na chamada tradicional, cada resultado de uma ferramenta regressa ao contexto do modelo antes da chamada seguinte, repetindo-se durante 20 ou mais passagens no exemplo das despesas. Com a execução de código, o modelo escreve um programa, uma sandbox executa as chamadas e mantém os dados intermédios, e apenas o resumo final regressa ao contexto.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="40">TRADICIONAL · TODOS OS RESULTADOS VOLTAM A ENTRAR NO CONTEXTO</text>
  <rect class="box" x="48" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="96">MODELO</text><text class="name" x="68" y="124">Escolher uma chamada</text>
  <rect x="272" y="64" width="188" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="292" y="96">EXTERNO</text><text class="name" x="292" y="124">Ferramenta ou API</text>
  <rect class="store" x="496" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="96">CONTEXTO</text><text class="name" x="516" y="124">O resultado bruto regressa</text>
  <rect class="box" x="720" y="64" width="188" height="96" rx="10" />
  <text class="kind" x="740" y="96">PROCESSO</text><text class="name" x="740" y="124">Repetir mais de 20 passagens</text>
  <path class="edge" d="M236 112H264" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M460 112H488" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M684 112H712" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M814 160V192H142V160" stroke-dasharray="7 6" marker-end="url(#ced-arrow)" />
  <rect x="386" y="180" width="188" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="480" y="197" text-anchor="middle">pessoa seguinte · inferência seguinte</text>
  <path d="M48 224H912" stroke="#2B3B33" stroke-width="1" />
  <text class="kind" x="48" y="252">EXECUÇÃO DE CÓDIGO · OS DADOS INTERMÉDIOS FICAM NA SANDBOX</text>
  <rect class="box" x="48" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="308">MODELO</text><text class="name" x="68" y="336">Escrever um programa</text>
  <rect class="box" x="272" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="292" y="308">SANDBOX</text><text class="name" x="292" y="336">Executar ciclos + chamadas</text>
  <rect class="store" x="496" y="276" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="308">ESTADO LOCAL</text><text class="name" x="516" y="336">Processar mais de 2 000 linhas</text>
  <rect x="720" y="276" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="740" y="308" fill="#FF6FB6">FOCO · CONTEXTO</text><text class="name" x="740" y="336" fill="#FF6FB6">Devolver um resultado de ~1 KB</text>
  <path class="edge" d="M236 324H264" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M460 324H488" marker-end="url(#ced-arrow)" />
  <path class="edge" d="M684 324H712" marker-end="url(#ced-arrow)" />
  <text class="note" x="48" y="424">Exemplo de análise de despesas: cerca de 200 KB de linhas brutas são processados localmente; apenas o resultado entra no contexto do modelo.</text>
  <defs>
    <marker id="ced-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
