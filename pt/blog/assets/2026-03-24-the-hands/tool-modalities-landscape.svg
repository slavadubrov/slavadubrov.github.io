<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tm-title tm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tm-title">Cinco interfaces para tool use por agentes</title>
  <desc id="tm-desc">Uma comparação entre JSON tool calling, MCP, Skills, ferramentas de linha de comandos e execução de código, com base no que cada interface transporta, onde se enquadra e qual o seu overhead de contexto típico. A execução de código é destacada para orquestração multi-agent.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="44">MAPA DE INTERFACES — ESCOLHA PELA FORMA DO TRABALHO</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">CHAMADAS ATÓMICAS</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150">Pedido/resposta tipados · 550–1 400 tokens de schema por ferramenta</text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">INTEGRAÇÃO PARTILHADA</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150">Descoberta + transporte · carregue apenas as ferramentas de que a tarefa necessita</text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">PROCEDIMENTO</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Instruções a pedido · cerca de 100 tokens de metadados no arranque</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">OPERAÇÃO LOCAL</text>
  <text class="name" x="520" y="262">CLI e shell</text>
  <text class="note" x="520" y="286">Comandos composáveis · baixo overhead de schema</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#C50E72">FOCO · TRABALHO MULTI-STEP</text>
  <text class="name" x="294" y="398" fill="#C50E72">Execução de código</text>
  <text class="note" x="294" y="422">Ciclos e condicionais · o resumo final regressa ao contexto</text>
  <path d="M48 472H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="48" y="490">O protocolo não define a policy: a autenticação, a autorização, o logging e o sandboxing continuam a ser da responsabilidade do harness.</text>
</svg>
