<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tod-title tod-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tod-title">As definições de tools podem consumir o contexto antes de o trabalho começar</title>
  <desc id="tod-desc">Os exemplos reportados indicam 143 000 tokens para uma configuração MCP de grande dimensão e 55 000 para cerca de 40 tools MCP. Estima-se que dez JSON tool schemas correspondam a 5 500–14 000 tokens. Os metadados de arranque de uma skill ocupam cerca de 100 tokens. A execução de código usa um pequeno número de meta-tools, mas não é indicado nenhum valor comparável.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .grid { stroke: #2B3B33; stroke-width: 1; }
  </style>
  <rect width="960" height="512" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="44">OVERHEAD DE DEFINIÇÃO ANTES DA TAREFA</text>
  <text class="note" x="48" y="68">Exemplos reportados, não um benchmark controlado · escala horizontal em milhares de tokens</text>
  <path class="grid" d="M300 88V424M493 88V424M687 88V424M880 88V424" />
  <text class="kind" x="300" y="84" text-anchor="middle">0</text>
  <text class="kind" x="493" y="84" text-anchor="middle">50K</text>
  <text class="kind" x="687" y="84" text-anchor="middle">100K</text>
  <text class="kind" x="880" y="84" text-anchor="middle">150K</text>
  <text class="kind" x="48" y="124" fill="#FF6FB6">FOCO · MCP</text>
  <text class="name" x="48" y="148" fill="#FF6FB6">Configuração de grande dimensão</text>
  <rect x="300" y="116" width="553" height="32" rx="6" fill="#FF6FB6" />
  <text class="name" x="840" y="139" text-anchor="end" fill="#0C1210">143K</text>
  <text class="note" x="300" y="170">72% de uma janela de contexto de 200K na configuração reportada</text>
  <text class="kind" x="48" y="212">MCP</text>
  <text class="name" x="48" y="236">Cerca de 40 tools</text>
  <rect x="300" y="204" width="213" height="32" rx="6" fill="#EDF5F0" />
  <text class="name" x="525" y="227">55K</text>
  <text class="note" x="300" y="258">Schemas carregados antes de o utilizador fazer uma pergunta</text>
  <text class="kind" x="48" y="300">JSON SCHEMAS</text>
  <text class="name" x="48" y="324">Dez tools</text>
  <path d="M321 308H354" stroke="#EDF5F0" stroke-width="8" />
  <circle cx="321" cy="308" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <circle cx="354" cy="308" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="372" y="314">5,5–14K</text>
  <text class="note" x="300" y="346">Intervalo calculado a partir de 550–1 400 tokens por definição</text>
  <text class="kind" x="48" y="388">CARREGAMENTO PROGRESSIVO</text>
  <text class="name" x="48" y="412">Metadados da skill</text>
  <circle cx="301" cy="396" r="7" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="name" x="320" y="402">~100 tokens</text>
  <text class="note" x="300" y="434">As instruções completas só são carregadas quando a skill está ativa</text>
  <path d="M48 456H912" stroke="#2B3B33" stroke-width="1" />
  <text class="source" x="48" y="478">Fontes: Apideck para as observações de 55K e 143K; estimativa de um artigo para dez JSON schemas; orientações sobre progressive disclosure para Skills.</text>
  <text class="source" x="48" y="496">A execução de código substitui muitos schemas por algumas meta-tools, mas o seu overhead de definição depende do harness e não é representado no gráfico.</text>
</svg>
