<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="ACI Design Principles" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Princípios de design da ACI</title>
  <defs>
    <filter id="shadowA" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Title -->
  <text y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" x="500">Princípios de design da interface agente-computador (ACI)</text>
  <text y="50" text-anchor="middle" font-size="11" fill="#64748b" x="500">Do SWE-agent (Yang et al., NeurIPS 2024) — 18,0% com SWE-agent vs 7,3% apenas com shell, sem demonstração, na ablação do SWE-bench Lite com 300 tarefas</text>

  <!-- Central circle: Agent -->
  <circle cx="500" cy="200" r="55" fill="#7c3aed" filter="url(#shadowA)" />
  <text y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" x="500">LLM</text>
  <text y="212" text-anchor="middle" font-size="11" fill="#ffffff" opacity="0.85" x="500">Agente</text>

  <!-- Principle 1: Simple Actions (top-left) -->
  <line x1="455" y1="160" x2="240" y2="100" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowA)" />
  <rect x="30" y="65" width="220" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadowA)" />
  <text y="90" font-size="12" font-weight="700" fill="#1d4ed8" x="50">1</text>
  <circle cx="50" cy="86" r="12" fill="none" stroke="#2563eb" stroke-width="2" />
  <text y="90" font-size="12" font-weight="600" fill="#1d4ed8" x="76">Ações simples</text>
  <text y="112" text-anchor="middle" font-size="10" fill="#334155" x="140">Poucas opções, documentação concisa</text>
  <text y="126" text-anchor="middle" font-size="10" fill="#334155" x="140">Uma ação, não três</text>
  <text y="148" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="140">schedule_event, não</text>
  <text y="160" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="140">list_users + list_events + create_event</text>

  <!-- Principle 2: Compact and Efficient (top-right) -->
  <line x1="545" y1="160" x2="760" y2="100" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowA)" />
  <rect x="750" y="65" width="220" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadowA)" />
  <text y="90" font-size="12" font-weight="700" fill="#9a3412" x="770">2</text>
  <circle cx="770" cy="86" r="12" fill="none" stroke="#ea580c" stroke-width="2" />
  <text y="90" font-size="12" font-weight="600" fill="#9a3412" x="796">Compacto e eficiente</text>
  <text y="112" text-anchor="middle" font-size="10" fill="#334155" x="860">Consolidar operações</text>
  <text y="126" text-anchor="middle" font-size="10" fill="#334155" x="860">Minimizar round-trips</text>
  <text y="148" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="860">get_stock_snapshot, não chamadas separadas para</text>
  <text y="160" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="860">price + volume + PE</text>

  <!-- Principle 3: Informative Feedback (bottom-left) -->
  <line x1="455" y1="240" x2="240" y2="320" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowA)" />
  <rect x="30" y="290" width="220" height="100" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2" filter="url(#shadowA)" />
  <text y="315" font-size="12" font-weight="700" fill="#166534" x="50">3</text>
  <circle cx="50" cy="311" r="12" fill="none" stroke="#166534" stroke-width="2" />
  <text y="315" font-size="12" font-weight="600" fill="#166534" x="76">Feedback conciso</text>
  <text y="337" text-anchor="middle" font-size="10" fill="#334155" x="140">Substantivo, não prolixo</text>
  <text y="351" text-anchor="middle" font-size="10" fill="#334155" x="140">Output legível por máquinas</text>
  <text y="373" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="140">Devolver IDs semânticos, não</text>
  <text y="385" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="140">HTML bruto ou payloads completos</text>

  <!-- Principle 4: Error Guardrails (bottom-right) -->
  <line x1="545" y1="240" x2="760" y2="320" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowA)" />
  <rect x="750" y="290" width="220" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowA)" />
  <text y="315" font-size="12" font-weight="700" fill="#991b1b" x="770">4</text>
  <circle cx="770" cy="311" r="12" fill="none" stroke="#dc2626" stroke-width="2" />
  <text y="315" font-size="12" font-weight="600" fill="#991b1b" x="796">Guardrails contra erros</text>
  <text y="337" text-anchor="middle" font-size="10" fill="#334155" x="860">Detetar erros automaticamente</text>
  <text y="351" text-anchor="middle" font-size="10" fill="#334155" x="860">Impedir a propagação de erros</text>
  <text y="373" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="860">O linter rejeitou ≥1 edição em</text>
  <text y="385" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b" x="860">51,7% das execuções (SWE-agent)</text>

  <!-- Bottom result bar -->
  <rect x="100" y="440" width="800" height="55" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadowA)" />
  <text y="463" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6" x="500">Impacto: 18,0% com SWE-agent vs 7,3% apenas com shell, sem demonstração</text>
  <text y="483" text-anchor="middle" font-size="11" fill="#334155" x="500">Mais 10,7 pontos percentuais nesta configuração; as condições da interface e da demonstração são diferentes.</text>

  <!-- Connection labels -->
  <text y="120" text-anchor="middle" font-size="9" fill="#5b21b6" x="340" transform="rotate(-15, 340, 120)">utiliza ferramentas</text>
  <text y="120" text-anchor="middle" font-size="9" fill="#5b21b6" x="660" transform="rotate(15, 660, 120)">lê o output</text>
  <text y="300" text-anchor="middle" font-size="9" fill="#5b21b6" x="340" transform="rotate(15, 340, 300)">recebe feedback</text>
  <text y="300" text-anchor="middle" font-size="9" fill="#5b21b6" x="660" transform="rotate(-15, 660, 300)">recuperação de erros</text>

  <!-- Source -->
  <text y="530" text-anchor="middle" font-size="9" fill="#64748b" x="500">Fonte: Yang, Jimenez et al., "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering" (arXiv:2405.15793, NeurIPS 2024)</text>
  <text y="545" text-anchor="middle" font-size="9" fill="#64748b" x="500">Princípios adotados pela Anthropic em "Building Effective Agents" (dez. 2024)</text>
</svg>
