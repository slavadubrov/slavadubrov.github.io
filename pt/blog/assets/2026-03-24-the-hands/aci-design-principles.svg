<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="aci-title aci-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="aci-title">Quatro princípios para uma interface agente-computador</title>
  <desc id="aci-desc">Conceba a ação, torne-a compacta, devolva feedback conciso e valide antes que os erros se propaguem. Uma falha de validação devolve evidência à conceção da ação. A validação é o ponto de controlo destacado.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="344" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="40">ACI LOOP — TORNE A PRÓXIMA AÇÃO FÁCIL DE ESCOLHER E DE CORRIGIR</text>

  <circle cx="62" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="62" y="77" text-anchor="middle">1</text>
  <circle cx="286" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="286" y="77" text-anchor="middle">2</text>
  <circle cx="510" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="510" y="77" text-anchor="middle">3</text>
  <circle cx="734" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="734" y="77" text-anchor="middle">4</text>

  <rect class="box" x="48" y="88" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="120">AÇÃO</text><text class="name" x="68" y="148">Ações simples</text>
  <rect class="box" x="272" y="88" width="188" height="96" rx="10" />
  <text class="kind" x="292" y="120">EFICIÊNCIA</text><text class="name" x="292" y="148">tool calls compactos</text>
  <rect class="box" x="496" y="88" width="188" height="96" rx="10" />
  <text class="kind" x="516" y="120">FEEDBACK</text><text class="name" x="516" y="148">Resultados concisos</text>
  <rect x="720" y="88" width="188" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="740" y="120" fill="#C50E72">FOCO · VALIDAÇÃO</text><text class="name" x="740" y="148" fill="#C50E72" style="font-size: 13.5px;">Impedir estados inválidos</text>

  <path class="edge" d="M236 136H264" marker-end="url(#aci-arrow)" />
  <path class="edge" d="M460 136H488" marker-end="url(#aci-arrow)" />
  <path class="edge" d="M684 136H712" marker-end="url(#aci-arrow)" />

  <text class="note" x="68" y="170">Uma operação por intenção</text>
  <text class="note" x="292" y="170">Menos round trips</text>
  <text class="note" x="516" y="170" style="font-size: 12.5px;">Output semântico e limitado</text>
  <text class="note" x="740" y="170" fill="#C50E72">Rejeitar I/O malformado</text>

  <path d="M814 184V248H142V184" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#aci-signal-arrow)" />
  <rect x="392" y="236" width="176" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="253" text-anchor="middle" fill="#C50E72" style="font-size: 12.5px;">inválido → devolver evidência</text>

  <text class="note" x="48" y="292">Na ablation do SWE-bench Lite: SWE-agent ACI completo 18,0% vs apenas shell sem demonstração 7,3%.</text>
  <text class="source" x="48" y="320">Fonte: Yang, Jimenez et al., “SWE-agent” (NeurIPS 2024). As condições diferem para além da interface.</text>
  <defs>
    <marker id="aci-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
    <marker id="aci-signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#F2148E" />
    </marker>
  </defs>
</svg>
