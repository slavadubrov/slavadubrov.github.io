<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-label="RAG Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Arquitetura RAG</title>
  <desc>O pipeline offline analisa os documentos, divide o texto limpo em chunks, gera embeddings dos chunks e armazena os vetores. O pipeline online transforma a query quando necessário, encaminha qualquer um dos percursos da query pelo mesmo embedder, recupera e faz reranking da evidência e, em seguida, fornece o contexto a um modelo generativo.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #59645E; stroke-width: 2; rx: 8; }
      .data-box { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 8; }
      .model { fill: #FFFFFF; stroke: #59645E; stroke-width: 2; rx: 8; }
      .db { fill: #FFFFFF; stroke: #59645E; stroke-width: 2; rx: 16; }
      .search { fill: #FFFFFF; stroke: #17211B; stroke-width: 2; rx: 8; }
      .qtrans { fill: #FFFFFF; stroke: #59645E; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #17211B; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-dashed { fill: none; stroke: #17211B; stroke-width: 2; stroke-dasharray: 6,4; marker-end: url(#arrowhead); }
      .text { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #59645E; text-anchor: middle; }
      .text-small { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: rgb(71, 85, 105); text-anchor: middle; }
      .text-bold { font-weight: 600; }
      .title { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #59645E; text-anchor: middle; }
      .subtitle { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: start; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="100%" height="100%" fill="#F7F7F4" />

  <text x="525" y="30" class="title">Arquitetura RAG em produção</text>

  <!-- Data Ingestion Flow (Top) -->
  <text x="20" y="50" class="subtitle">Ingestão de dados (offline)</text>

  <!-- Col 1 -->
  <rect x="15" y="65" width="110" height="50" class="data-box" />
  <text x="70" y="94" class="text text-bold">Documentos</text>

  <path d="M 125,90 H 157" class="arrow" />

  <!-- Col 2 -->
  <rect x="160" y="65" width="110" height="50" class="box" />
  <text x="215" y="86" class="text text-bold" style="font-size: 11px;">Analisar + dividir em chunks</text>
  <text x="215" y="104" class="text-small" style="font-size: 11px;">Limpar o texto e dividi-lo</text>

  <path d="M 270,90 H 302" class="arrow" />

  <!-- Col 3 -->
  <rect x="305" y="65" width="110" height="50" class="model" />
  <text x="360" y="86" class="text text-bold">Embedder</text>
  <text x="360" y="104" class="text-small">Vetores densos</text>

  <path d="M 415,90 H 442" class="arrow" />

  <!-- Col 4 -->
  <rect x="445" y="55" width="120" height="70" class="db visual-focus" />
  <text x="505" y="86" class="text text-bold" style="font-size: 11px;">Base de dados vetorial</text>
  <text x="505" y="104" class="text-small">HNSW / Graph</text>

  <!-- Divider -->
  <line x1="20" y1="155" x2="1030" y2="155" stroke="#59645E" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Retrieval & Generation Flow (Bottom) -->
  <text x="20" y="185" class="subtitle">Fluxo da query (online)</text>

  <!-- Col 2 -->
  <rect x="160" y="205" width="110" height="50" class="box" />
  <text x="215" y="235" class="text text-bold"><tspan x="215">Query do</tspan><tspan x="215" dy="1.2em">utilizador</tspan></text>

  <path d="M 270,230 H 302" class="arrow" />
  <!-- Arrow to Query Transform -->
  <path d="M 215,255 V 294 Q 215,300 221,300 H 302" class="arrow-dashed" />
  <text x="260" y="290" class="text-small">opcional</text>

  <!-- Col 3 Top -->
  <rect x="305" y="205" width="110" height="50" class="model" />
  <text x="360" y="226" class="text text-bold">Embedder</text>
  <text x="360" y="244" class="text-small">Mesmo modelo</text>

  <path d="M 415,230 H 442" class="arrow" />

  <!-- Col 3 Bottom -->
  <rect x="305" y="275" width="110" height="50" class="qtrans" />
  <text x="360" y="296" class="text text-bold">Query</text>
  <text x="360" y="314" class="text text-bold">transformação</text>

  <path d="M 360,275 V 258" class="arrow-dashed" />
  <!-- Vector DB to Hybrid Search -->
  <path d="M 505,125 V 197" class="arrow-dashed" />

  <!-- Col 4 -->
  <rect x="445" y="200" width="120" height="60" class="search" />
  <text x="505" y="226" class="text text-bold">Pesquisa híbrida</text>
  <text x="505" y="244" class="text-small">Denso + BM25</text>

  <path d="M 565,230 H 612" class="arrow" />
  <text x="588" y="220" class="text-small">Top-K</text>

  <!-- Col 5 -->
  <rect x="615" y="200" width="110" height="60" class="model" />
  <text x="670" y="226" class="text text-bold">Reranker</text>
  <text x="670" y="244" class="text-small">Cross-encoder</text>

  <path d="M 725,230 H 772" class="arrow" />
  <text x="748" y="220" class="text-small">Top-N</text>

  <!-- Col 6 -->
  <rect x="775" y="200" width="120" height="60" class="model" />
  <text x="835" y="226" class="text text-bold">LLM generativo</text>
  <text x="835" y="244" class="text-small">Contexto + prompt</text>

  <path d="M 895,230 H 925" class="arrow" />

  <!-- Col 7 -->
  <text x="935" y="235" class="text" font-weight="600" style="text-anchor: start;">Resposta</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
