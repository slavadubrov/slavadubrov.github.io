<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Opções de otimização de inference</title>
  <desc>As opções de kernel, quantização, memória, scheduling, caching, speculation e paralelismo podem ser selecionadas de forma independente, tendo como referência um bottleneck comum de hardware e workload medido, bem como objetivos ao nível da aplicação.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#F7F7F4" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Opções de otimização de inference</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#17211B">Selecionar de forma independente face ao bottleneck medido e ao SLO pretendido</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#17211B">Base de hardware</text>
  <text x="80" y="468" font-size="11" fill="#17211B">Hierarquia de memória da GPU: a largura de banda HBM e a reutilização on-chip variam consoante a GPU</text>
  <text x="80" y="483" font-size="11" fill="#17211B">Medir o bottleneck de computação, memória e comunicação na GPU de destino</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#17211B">Otimizações de kernel</text>
  <text x="70" y="373" font-size="11" fill="#17211B">FlashAttention (tiling em SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#17211B">Kernels fundidos (reduzem round-trips à HBM)</text>
  <text x="70" y="398" font-size="11" fill="#17211B">Avaliar a utilização no grafo deployed</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#17211B">Quantização</text>
  <text x="470" y="373" font-size="11" fill="#17211B">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#17211B">Pesos de 8 bits: cerca de 50% menos armazenamento bruto do que 16 bits</text>
  <text x="470" y="400" font-size="11" fill="#17211B">4 bits: cerca de 75% menos antes do overhead de scale e metadata</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#17211B">Gestão de memória</text>
  <text x="70" y="283" font-size="11" fill="#17211B">PagedAttention (alocação de KV baseada em blocos)</text>
  <text x="70" y="298" font-size="11" fill="#17211B">GQA/MQA (redução de 8–16× no KV cache)</text>
  <text x="70" y="308" font-size="11" fill="#17211B">Os ganhos publicados dependem do workload e do harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#17211B">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#17211B">Continuous batching (ao nível da iteração)</text>
  <text x="470" y="298" font-size="11" fill="#17211B">Chunked prefill (protege a latência de decode)</text>
  <text x="470" y="308" font-size="11" fill="#17211B">Ajustar para obter o goodput no SLO pretendido</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#17211B">Caching</text>
  <text x="70" y="193" font-size="11" fill="#17211B">Prefix caching (medir a hit rate)</text>
  <text x="70" y="208" font-size="11" fill="#17211B">RadixAttention (reutilização de KV baseada em árvores)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#17211B">Speculation</text>
  <text x="340" y="193" font-size="11" fill="#17211B">Speculative decoding (verificar os drafts)</text>
  <text x="340" y="208" font-size="11" fill="#17211B">A acceptance rate controla o ganho</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#17211B">Paralelismo</text>
  <text x="620" y="193" font-size="11" fill="#17211B">TP (intra-node, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#17211B">PP (inter-node) + DP (scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#17211B">Camada da aplicação</text>
  <text x="80" y="113" font-size="11" fill="#17211B">Model routing · Rate limiting consciente dos tokens · Monitoring (goodput, utilização de KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="11" fill="#17211B">Combinar técnicas apenas depois de medir os seus efeitos na qualidade, latência e custo</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
