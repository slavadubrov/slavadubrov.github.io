<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Opções de otimização de inference</title>
  <desc>As opções de kernels, quantização, memória, scheduling, caching, especulação e paralelismo podem ser selecionadas de forma independente, tendo em conta um bottleneck partilhado de hardware e workload medido, bem como objetivos ao nível da aplicação.</desc>
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Opções de otimização de inference</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#334155">Selecione de forma independente com base no bottleneck medido e no SLO-alvo</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#1d4ed8">Base de hardware</text>
  <text x="80" y="468" font-size="11" fill="#0f172a">Hierarquia de memória da GPU: a largura de banda HBM e a reutilização on-chip variam consoante a GPU</text>
  <text x="80" y="483" font-size="10" fill="#334155">Meça o bottleneck de computação, memória e comunicação na GPU-alvo</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#166534">Otimizações de kernels</text>
  <text x="70" y="373" font-size="11" fill="#0f172a">FlashAttention (tiling em SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#0f172a">Kernels fundidos (reduzem as viagens de ida e volta à HBM)</text>
  <text x="70" y="398" font-size="10" fill="#334155">Analise a utilização no grafo em produção</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#9a3412">Quantização</text>
  <text x="470" y="373" font-size="11" fill="#0f172a">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#0f172a">Pesos de 8 bits: cerca de 50% menos armazenamento bruto do que 16 bits</text>
  <text x="470" y="400" font-size="10" fill="#334155">4 bits: cerca de 75% menos antes do overhead de scales e metadados</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Gestão de memória</text>
  <text x="70" y="283" font-size="11" fill="#0f172a">PagedAttention (alocação de KV baseada em blocos)</text>
  <text x="70" y="298" font-size="11" fill="#0f172a">GQA/MQA (redução de 8–16× no KV cache)</text>
  <text x="70" y="308" font-size="10" fill="#334155">Os ganhos publicados dependem do workload e do harness</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Scheduling</text>
  <text x="470" y="283" font-size="11" fill="#0f172a">Continuous batching (ao nível da iteração)</text>
  <text x="470" y="298" font-size="11" fill="#0f172a">Chunked prefill (protege a latência de decode)</text>
  <text x="470" y="308" font-size="10" fill="#334155">Otimize o goodput para o SLO-alvo</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Caching</text>
  <text x="70" y="193" font-size="11" fill="#0f172a">Caching de prefixos (meça a taxa de acerto)</text>
  <text x="70" y="208" font-size="11" fill="#0f172a">RadixAttention (reutilização de KV baseada em árvores)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Especulação</text>
  <text x="340" y="193" font-size="11" fill="#0f172a">Speculative decoding (verifique os drafts)</text>
  <text x="340" y="208" font-size="11" fill="#0f172a">A taxa de aceitação controla o ganho</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Paralelismo</text>
  <text x="620" y="193" font-size="11" fill="#0f172a">TP (intra-node, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#0f172a">PP (inter-node) + DP (scaling)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#991b1b">Camada da aplicação</text>
  <text x="80" y="113" font-size="11" fill="#0f172a">Model routing · Rate limiting com consciência dos tokens · Monitorização (goodput, utilização de KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="10" fill="#334155">Combine técnicas apenas depois de medir os seus efeitos na qualidade, latência e custo</text>

</svg>
