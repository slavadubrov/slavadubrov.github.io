<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="LLM training pipeline from pretraining to alignment and distillation" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">pipeline de treino de LLM</title>
  <desc>O pretraining produz um modelo base, o fine-tuning supervisionado adapta-o e o alinhamento otimiza preferências ou recompensas verificáveis. Um teacher alinhado também pode gerar exemplos filtrados para um student mais pequeno, obtido por distillation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFFFFF" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="500" fill="#F7F7F4" rx="14" />
  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17211B">pipeline de treino de LLM</text>
  <text x="560" y="64" text-anchor="middle" font-size="13" fill="#17211B">Cada etapa altera um artefacto diferente e requer a sua própria avaliação</text>

  <rect x="48" y="92" width="280" height="178" rx="12" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="72" y="124" font-size="17" font-weight="700" fill="#17211B">1. Pretraining</text>
  <text x="72" y="154" font-size="13" fill="#17211B">Artefacto: pesos do modelo base</text>
  <text x="72" y="178" font-size="13" fill="#17211B">Sinal: previsão do token seguinte</text>
  <text x="72" y="202" font-size="13" fill="#17211B">Dados: grande corpus não anotado</text>
  <text x="72" y="226" font-size="13" fill="#17211B">Sistemas: ZeRO, FSDP, precisão mista</text>
  <text x="72" y="250" font-size="12" font-weight="600" fill="#17211B">Medir a loss, a qualidade dos dados e a utilização</text>

  <line x1="328" y1="181" x2="410" y2="181" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="420" y="92" width="280" height="178" rx="12" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
  <text x="444" y="124" font-size="17" font-weight="700" fill="#17211B">2. Fine-tuning supervisionado</text>
  <text x="444" y="154" font-size="13" fill="#17211B">Artefacto: pesos adaptados ou adaptador LoRA</text>
  <text x="444" y="178" font-size="13" fill="#17211B">Sinal: respostas-alvo anotadas</text>
  <text x="444" y="202" font-size="13" fill="#17211B">Opção: atualização completa, LoRA ou QLoRA</text>
  <text x="444" y="226" font-size="13" fill="#17211B">A memória depende do rank e do optimizer</text>
  <text x="444" y="250" font-size="12" font-weight="600" fill="#17211B">Comparar a qualidade na tarefa com o modelo base</text>

  <line x1="700" y1="181" x2="782" y2="181" stroke="#17211B" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="792" y="92" width="280" height="178" rx="12" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="816" y="124" font-size="17" font-weight="700" fill="#17211B">3. Alinhamento</text>
  <text x="816" y="154" font-size="13" fill="#17211B">PPO: reward model e critic</text>
  <text x="816" y="178" font-size="13" fill="#17211B">DPO: loss offline de pares de preferências</text>
  <text x="816" y="202" font-size="13" fill="#17211B">GRPO: baseline de recompensa relativa ao grupo</text>
  <text x="816" y="226" font-size="13" fill="#17211B">RLVR: testes ou outras recompensas verificáveis</text>
  <text x="816" y="250" font-size="12" font-weight="600" fill="#17211B">Testar a qualidade da tarefa e exploits da recompensa</text>

  <path d="M932 270 V300 H188 V340" fill="none" stroke="#17211B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  <text x="560" y="320" text-anchor="middle" font-size="12" fill="#17211B">Um teacher alinhado pode gerar dados de treino</text>

  <rect x="48" y="340" width="1024" height="120" rx="12" fill="#FFFFFF" stroke="#59645E" stroke-width="2" class="visual-focus" />
  <text x="72" y="372" font-size="17" font-weight="700" fill="#17211B">Distillation e dados sintéticos</text>

  <rect x="80" y="390" width="220" height="50" rx="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="190" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Teacher de grande dimensão</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#17211B">DeepSeek-R1 (671B)</text>

  <line x1="300" y1="415" x2="420" y2="415" stroke="#17211B" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="430" y="390" width="260" height="50" rx="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="560" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Gerar, filtrar e acompanhar a lineage</text>
  <text x="560" y="430" text-anchor="middle" font-size="12" fill="#17211B">O DeepSeek-R1 reporta 800K exemplos</text>

  <line x1="690" y1="415" x2="810" y2="415" stroke="#17211B" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="820" y="390" width="220" height="50" rx="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="930" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Student compacto</text>
  <text x="930" y="430" text-anchor="middle" font-size="12" fill="#17211B">1.5B a 70B no artigo</text>

  <text x="560" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Reavaliar o student na tarefa-alvo e com o orçamento de serving</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
