<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="LLM training pipeline from pretraining to alignment and distillation" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Pipeline de treino de LLM</title>
  <desc>O pretraining produz um modelo base, o fine-tuning supervisionado adapta-o e o alignment otimiza recompensas de preferência ou verificáveis. Um teacher alinhado também pode gerar exemplos filtrados para um student mais pequeno, obtido por distillation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#166534" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="500" fill="#f8fafc" rx="14" />
  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Pipeline de treino de LLM</text>
  <text x="560" y="64" text-anchor="middle" font-size="13" fill="#64748b">Cada etapa altera um artefacto diferente e requer a sua própria avaliação</text>

  <rect x="48" y="92" width="280" height="178" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text x="72" y="124" font-size="17" font-weight="700" fill="#1d4ed8">1. Pretraining</text>
  <text x="72" y="154" font-size="13" fill="#0f172a">Artefacto: pesos do modelo base</text>
  <text x="72" y="178" font-size="13" fill="#0f172a">Sinal: previsão do token seguinte</text>
  <text x="72" y="202" font-size="13" fill="#0f172a">Dados: corpus grande não anotado</text>
  <text x="72" y="226" font-size="13" fill="#0f172a">Sistemas: ZeRO, FSDP, precisão mista</text>
  <text x="72" y="250" font-size="12" font-weight="600" fill="#1d4ed8">Medir a loss, a qualidade dos dados e a utilização</text>

  <line x1="328" y1="181" x2="410" y2="181" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="420" y="92" width="280" height="178" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
  <text x="444" y="124" font-size="17" font-weight="700" fill="#9a3412">2. Fine-tuning supervisionado</text>
  <text x="444" y="154" font-size="13" fill="#0f172a">Artefacto: pesos adaptados ou adaptador LoRA</text>
  <text x="444" y="178" font-size="13" fill="#0f172a">Sinal: respostas-alvo anotadas</text>
  <text x="444" y="202" font-size="13" fill="#0f172a">Escolha: atualização completa, LoRA ou QLoRA</text>
  <text x="444" y="226" font-size="13" fill="#0f172a">A memória depende do rank e do optimizer</text>
  <text x="444" y="250" font-size="12" font-weight="600" fill="#9a3412">Comparar a qualidade na tarefa com o modelo base</text>

  <line x1="700" y1="181" x2="782" y2="181" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="792" y="92" width="280" height="178" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" />
  <text x="816" y="124" font-size="17" font-weight="700" fill="#5b21b6">3. Alignment</text>
  <text x="816" y="154" font-size="13" fill="#0f172a">PPO: reward model e critic</text>
  <text x="816" y="178" font-size="13" fill="#0f172a">DPO: loss offline de pares de preferências</text>
  <text x="816" y="202" font-size="13" fill="#0f172a">GRPO: baseline de recompensa relativa ao grupo</text>
  <text x="816" y="226" font-size="13" fill="#0f172a">RLVR: testes ou outras recompensas verificáveis</text>
  <text x="816" y="250" font-size="12" font-weight="600" fill="#5b21b6">Testar a qualidade na tarefa e os exploits da recompensa</text>

  <path d="M932 270 V300 H188 V340" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  <text x="560" y="320" text-anchor="middle" font-size="12" fill="#166534">Um teacher alinhado pode gerar dados de treino</text>

  <rect x="48" y="340" width="1024" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
  <text x="72" y="372" font-size="17" font-weight="700" fill="#166534">Distillation e dados sintéticos</text>

  <rect x="80" y="390" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="190" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Teacher de grande dimensão</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#0f172a">DeepSeek-R1 (671B)</text>

  <line x1="300" y1="415" x2="420" y2="415" stroke="#166534" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="430" y="390" width="260" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="560" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Gerar, filtrar e acompanhar a lineage</text>
  <text x="560" y="430" text-anchor="middle" font-size="12" fill="#0f172a">O DeepSeek-R1 reporta 800K exemplos</text>

  <line x1="690" y1="415" x2="810" y2="415" stroke="#166534" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="820" y="390" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="930" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Student compacto</text>
  <text x="930" y="430" text-anchor="middle" font-size="12" fill="#0f172a">1.5B a 70B no artigo</text>

  <text x="560" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Reavaliar o student na tarefa-alvo e com o orçamento de serving</text>
</svg>
