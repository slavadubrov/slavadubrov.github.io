<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rag-title rag-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rag-title">RAG separa um caminho de ingestão offline de um caminho online de pesquisa, reranking e geração.</title><desc id="rag-desc">O pipeline offline analisa os documentos brutos em texto limpo, divide-o em chunks, gera o embedding de cada chunk e armazena os vetores. No momento da consulta, o mesmo embedder — após uma transformação opcional da consulta, como HyDE ou expansão multi-query — alimenta uma pesquisa híbrida densa + BM25 nesse vector store; um reranker pontua os candidatos recuperados face à consulta; e o modelo generativo responde usando o contexto reordenado.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rag-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="rag-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="500" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">A ingestão corre offline; a recuperação e a geração correm por consulta</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O mesmo embedder gera o embedding da consulta, salvo transformação prévia.</text>
