<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Execução orientada por etapas e em pipeline</title>
  <desc id="desc">Linha temporal conceptual que mostra como a sobreposição da entrada, do trabalho da CPU e da inferência na GPU pode reduzir os períodos de inatividade.</desc>
  <defs>
    <style>
      .t-box { opacity: 0; animation: slideInFade 0.5s ease-out forwards; }
      @keyframes slideInFade {
        from { opacity: 0; transform: translateX(-15px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .st-b1 { animation-delay: 0.5s; }
      .st-b2 { animation-delay: 1.0s; }
      .st-b3 { animation-delay: 1.5s; }
      .st-b4 { animation-delay: 2.0s; }
      .st-b5 { animation-delay: 2.5s; }
      .st-b6 { animation-delay: 3.0s; }
      .st-b7 { animation-delay: 3.5s; }
      .st-b8 { animation-delay: 4.0s; }
      .st-b9 { animation-delay: 4.5s; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="500" rx="12" fill="#0C1210" stroke="#2B3B33" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#EDF5F0">Execução sequencial e em pipeline</text>

  <!-- TOP: Stage-based (Spark) -->
  <rect x="25" y="50" width="850" height="190" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="50" y="75" font-size="14" font-weight="bold" fill="#EDF5F0">Percurso conceptual orientado por etapas</text>

  <!-- Timeline labels -->
  <text x="50" y="110" font-size="11" font-weight="bold" fill="#EDF5F0">Núcleo 1 da CPU</text>
  <text x="50" y="148" font-size="11" font-weight="bold" fill="#EDF5F0">Núcleo 2 da CPU</text>
  <text x="50" y="186" font-size="11" font-weight="bold" fill="#EDF5F0">GPU</text>

  <!-- Time axis -->
  <line x1="145" y1="205" x2="730" y2="205" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="440" y="222" text-anchor="middle" font-size="11" fill="#EDF5F0">Tempo →</text>

  <!-- Stage 1 label -->
  <g class="t-box st-b1">
    <text x="310" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#EDF5F0">Etapa 1 (CPU)</text>
  </g>

  <!-- CPU Core 1: Download+Parse Partition 1 -->
  <g class="t-box st-b1">
    <rect x="150" y="97" width="250" height="22" rx="4" fill="#1B2621" class="visual-focus" />
    <text x="275" y="112" text-anchor="middle" font-size="11" fill="#141D19">Transferir + analisar partição 1</text>
  </g>

  <!-- CPU Core 2: Download+Parse Partition 2 (simultaneously) -->
  <g class="t-box st-b1">
    <rect x="150" y="135" width="250" height="22" rx="4" fill="#1B2621" />
    <text x="275" y="150" text-anchor="middle" font-size="11" fill="#141D19">Transferir + analisar partição 2</text>
  </g>

  <!-- GPU idle during Stage 1 -->
  <g class="t-box st-b1">
    <rect x="150" y="173" width="250" height="22" rx="4" fill="#1B2621" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="275" y="188" text-anchor="middle" font-size="11" fill="#EDF5F0">Inativo (à espera da CPU)</text>
  </g>

  <!-- Stage barrier -->
  <g class="t-box st-b4">
    <line x1="410" y1="88" x2="410" y2="200" stroke="#EDF5F0" stroke-width="2" stroke-dasharray="5,3" />
    <text x="413" y="84" font-size="11" fill="#EDF5F0">barreira</text>
  </g>

  <!-- Stage 2 label -->
  <g class="t-box st-b5">
    <text x="545" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#EDF5F0">Etapa 2 (GPU)</text>
  </g>

  <!-- CPU Core 1 idle during Stage 2 -->
  <g class="t-box st-b5">
    <rect x="420" y="97" width="200" height="22" rx="4" fill="#1B2621" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="520" y="112" text-anchor="middle" font-size="11" fill="#EDF5F0">Inativo</text>
  </g>

  <!-- CPU Core 2 idle during Stage 2 -->
  <g class="t-box st-b5">
    <rect x="420" y="135" width="200" height="22" rx="4" fill="#1B2621" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="520" y="150" text-anchor="middle" font-size="11" fill="#EDF5F0">Inativo</text>
  </g>

  <!-- GPU active during Stage 2 -->
  <g class="t-box st-b5">
    <rect x="420" y="173" width="200" height="22" rx="4" fill="#1B2621" />
    <text x="520" y="188" text-anchor="middle" font-size="11" fill="#141D19">Gerar embeddings de P1 + P2</text>
  </g>

  <g class="t-box st-b7">
    <rect x="770" y="168" width="95" height="30" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="818" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#EDF5F0">GPU à espera</text>
  </g>

  <!-- BOTTOM: Pipelined (Daft/Ray) -->
  <rect x="25" y="270" width="850" height="195" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="50" y="295" font-size="14" font-weight="bold" fill="#EDF5F0">Streaming em pipeline (Daft / Ray Data)</text>

  <!-- Timeline labels -->
  <text x="50" y="328" font-size="11" font-weight="bold" fill="#EDF5F0">Núcleo 1 da CPU</text>
  <text x="50" y="366" font-size="11" font-weight="bold" fill="#EDF5F0">Núcleo 2 da CPU</text>
  <text x="50" y="404" font-size="11" font-weight="bold" fill="#EDF5F0">GPU</text>

  <line x1="145" y1="425" x2="730" y2="425" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="440" y="442" text-anchor="middle" font-size="11" fill="#EDF5F0">Tempo →</text>

  <g class="t-box st-b1">
    <rect x="150" y="315" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="205" y="330" text-anchor="middle" font-size="11" fill="#141D19">Transferir B1</text>
  </g>
  <g class="t-box st-b3">
    <rect x="265" y="315" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="320" y="330" text-anchor="middle" font-size="11" fill="#141D19">Transferir B3</text>
  </g>
  <g class="t-box st-b5">
    <rect x="380" y="315" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="435" y="330" text-anchor="middle" font-size="11" fill="#141D19">Transferir B5</text>
  </g>
  <g class="t-box st-b7">
    <rect x="495" y="315" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="550" y="330" text-anchor="middle" font-size="11" fill="#141D19">Transferir B7</text>
  </g>
  <g class="t-box st-b9">
    <rect x="610" y="315" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="665" y="330" text-anchor="middle" font-size="11" fill="#141D19">Transferir B9</text>
  </g>

  <g class="t-box st-b2">
    <rect x="205" y="353" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="260" y="368" text-anchor="middle" font-size="11" fill="#141D19">Analisar B1</text>
  </g>
  <g class="t-box st-b4">
    <rect x="320" y="353" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="375" y="368" text-anchor="middle" font-size="11" fill="#141D19">Analisar B2</text>
  </g>
  <g class="t-box st-b6">
    <rect x="435" y="353" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="490" y="368" text-anchor="middle" font-size="11" fill="#141D19">Analisar B3</text>
  </g>
  <g class="t-box st-b8">
    <rect x="550" y="353" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="605" y="368" text-anchor="middle" font-size="11" fill="#141D19">Analisar B4</text>
  </g>
  <g class="t-box st-b9">
    <rect x="665" y="353" width="55" height="22" rx="4" fill="#1B2621" />
    <text x="692" y="368" text-anchor="middle" font-size="11" fill="#141D19">B5</text>
  </g>

  <g class="t-box st-b3">
    <rect x="265" y="391" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="320" y="406" text-anchor="middle" font-size="11" fill="#141D19">Gerar embedding de B1</text>
  </g>
  <g class="t-box st-b5">
    <rect x="380" y="391" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="435" y="406" text-anchor="middle" font-size="11" fill="#141D19">Gerar embedding de B2</text>
  </g>
  <g class="t-box st-b7">
    <rect x="495" y="391" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="550" y="406" text-anchor="middle" font-size="11" fill="#141D19">Gerar embedding de B3</text>
  </g>
  <g class="t-box st-b9">
    <rect x="610" y="391" width="110" height="22" rx="4" fill="#1B2621" />
    <text x="665" y="406" text-anchor="middle" font-size="11" fill="#141D19">Gerar embedding de B4</text>
  </g>

  <rect x="770" y="385" width="95" height="30" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="818" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#EDF5F0">Maior sobreposição</text>

  <!-- Bottom summary -->
  <rect x="150" y="475" width="600" height="22" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="450" y="491" text-anchor="middle" font-size="11" font-weight="bold" fill="#EDF5F0">A sobreposição pode reduzir o tempo de inatividade quando as etapas estão equilibradas.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
