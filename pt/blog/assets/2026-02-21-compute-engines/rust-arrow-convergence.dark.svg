<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rustarrow-title rustarrow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rustarrow-title">Execução nativa e troca compatível com Arrow</title><desc id="rustarrow-desc">Quatro engines — Polars, DataFusion, Daft, Ray Data — assentam numa base partilhada de componentes nativos em Rust e no formato colunar Apache Arrow, que em conjunto permitem não ter um garbage collector de tracing, uma troca zero-copy mais económica através da interface PyCapsule e concorrência verificada em tempo de compilação. O comportamento exato do runtime e das cópias varia consoante a engine e o operador.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rustarrow-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="rustarrow-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
