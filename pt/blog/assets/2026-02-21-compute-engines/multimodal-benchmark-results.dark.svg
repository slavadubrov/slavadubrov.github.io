<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Resultados do benchmark de processamento de imagens</title>
  <desc id="desc">Resultados de tempo para o teste do artigo com 500 imagens, usando Pandas com Pillow, Daft e uma implementação em Rust.</desc>
  <defs>
    <style>
      .bar { transform-origin: left; }
      .bar-text { font-size: 12px; fill: #A8B8AF; font-weight: bold; }
      @keyframes scaleIn { from { transform: scaleX(0); opacity: 1; } to { transform: scaleX(1); opacity: 1; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .g-pandas .bar { fill: #1B2621; animation-delay: 0.1s; } .g-pandas .bar-text { animation-delay: 1.1s; }
      .g-daft .bar { fill: #1B2621; animation-delay: 0.2s; } .g-daft .bar-text { animation-delay: 1.2s; }
      .g-rust .bar { fill: #1B2621; animation-delay: 0.3s; } .g-rust .bar-text { animation-delay: 1.3s; }
      .axis-label { font-size: 13px; font-weight: bold; fill: #A8B8AF; text-anchor: end; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="170" rx="12" fill="#0C1210" stroke="#2B3B33" stroke-width="1.5" />
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#EDF5F0">Desempenho multimodal num único nó</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#EDF5F0">Tempo de execução em segundos (quanto menor, melhor) | 500 imagens Food-101</text>

  <!-- Chart Area -->
  <g transform="translate(150, 70)">
    <!-- Base Grid X -->
    <line x1="0" y1="0" x2="0" y2="50" stroke="#A8B8AF" stroke-width="2" />
    <line x1="0" y1="50" x2="650" y2="50" stroke="#A8B8AF" stroke-width="2" />
    <text x="0" y="70" text-anchor="middle" font-size="11" fill="#EDF5F0">0.0s</text>
    <line x1="150" y1="0" x2="150" y2="50" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4" /><text x="150" y="70" text-anchor="middle" font-size="11" fill="#EDF5F0">0.25s</text>
    <line x1="300" y1="0" x2="300" y2="50" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4" /><text x="300" y="70" text-anchor="middle" font-size="11" fill="#EDF5F0">0.50s</text>
    <line x1="450" y1="0" x2="450" y2="50" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4" /><text x="450" y="70" text-anchor="middle" font-size="11" fill="#EDF5F0">0.75s</text>
    <line x1="600" y1="0" x2="600" y2="50" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4" /><text x="600" y="70" text-anchor="middle" font-size="11" fill="#EDF5F0">1.00s</text>

    <!-- Row 1: Total Pipeline -->
    <g transform="translate(0, 5)">
      <g class="g-pandas"><text class="bar-label" x="-15" y="9" text-anchor="end">Pandas + Pillow</text><rect class="bar" x="0" y="0" width="606" height="10" /><text class="bar-text" x="611" y="9">1.01s</text></g>
      <g class="g-daft"><text class="bar-label" x="-15" y="23" text-anchor="end">Daft</text><rect class="bar" x="0" y="14" width="168" height="10" /><text class="bar-text" x="173" y="23">0.28s</text></g>
      <g class="g-rust"><text class="bar-label" x="-15" y="37" text-anchor="end">Rust</text><rect class="bar visual-focus" x="0" y="28" width="144" height="10" /><text class="bar-text" x="149" y="37">0.24s</text></g>
    </g>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
    .bar-label { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #EDF5F0; }
    .bar:not(.visual-focus) { fill: #1B2621 !important; stroke: #A8B8AF !important; stroke-width: 1.5 !important; }
  </style>
</svg>
