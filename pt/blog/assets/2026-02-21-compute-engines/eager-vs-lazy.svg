<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Execução eager e lazy</title>
  <desc id="desc">Um pipeline eager executa cada operação em sequência, enquanto um motor lazy começa por criar e otimizar um plano de consulta.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFFFFF" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="480" rx="12" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1.5" />
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Execução Eager vs. Lazy</text>

  <!-- TOP: Eager (Pandas) -->
  <rect x="25" y="50" width="850" height="170" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="50" y="75" font-size="15" font-weight="bold" fill="#17211B">Pipeline DataFrame eager típico</text>

  <!-- Step 1: Read ALL -->
  <g class="seq-item eager-1">
    <rect x="50" y="92" width="130" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <text x="115" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">read_parquet()</text>
    <text x="115" y="128" text-anchor="middle" font-size="11" fill="#17211B">TODAS as colunas</text>
    <line x1="185" y1="117" x2="210" y2="117" stroke="#17211B" stroke-width="1.5" marker-end="url(#arr)" />
  </g>

  <!-- Step 2: Full copy -->
  <g class="seq-item eager-2">
    <rect x="215" y="92" width="120" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <text x="275" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">filter()</text>
    <text x="275" y="128" text-anchor="middle" font-size="11" fill="#17211B">Cópia completa na RAM</text>
    <line x1="340" y1="117" x2="365" y2="117" stroke="#17211B" stroke-width="1.5" marker-end="url(#arr)" />
  </g>

  <!-- Step 3: Another copy -->
  <g class="seq-item eager-3">
    <rect x="370" y="92" width="120" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <text x="430" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">groupby()</text>
    <text x="430" y="128" text-anchor="middle" font-size="11" fill="#17211B">Outra cópia</text>
    <line x1="495" y1="117" x2="520" y2="117" stroke="#17211B" stroke-width="1.5" marker-end="url(#arr)" />
  </g>

  <!-- Result -->
  <g class="seq-item eager-4">
    <rect x="525" y="92" width="100" height="50" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
    <text x="575" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Resultado</text>
  </g>

  <!-- CPU indicator -->
  <rect x="670" y="92" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="715" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">Plano limitado</text>
  <rect x="682" y="118" width="12" height="12" rx="2" fill="#F2F2F5" />
  <rect x="698" y="118" width="12" height="12" rx="2" fill="#F2F2F5" />
  <rect x="714" y="118" width="12" height="12" rx="2" fill="#F2F2F5" />
  <rect x="730" y="118" width="12" height="12" rx="2" fill="#F2F2F5" />

  <!-- Memory bar -->
  <text x="50" y="168" font-size="11" fill="#17211B">RAM:</text>
  <rect x="90" y="157" width="530" height="14" rx="3" fill="#F2F2F5" />
  <g class="seq-item eager-1"><rect x="90" y="157" width="180" height="14" rx="3" fill="#17211B" /></g>
  <g class="seq-item eager-2"><rect x="270" y="157" width="120" height="14" rx="3" fill="#17211B" /></g>
  <g class="seq-item eager-3"><rect x="390" y="157" width="80" height="14" rx="3" fill="#17211B" /></g>
  <text x="640" y="169" font-size="11" fill="#17211B">2–3x o tamanho do dataset</text>

  <!-- Labels under memory bar -->
  <g class="seq-item eager-1"><text x="180" y="186" text-anchor="middle" font-size="11" fill="#17211B">Ficheiro completo carregado</text></g>
  <g class="seq-item eager-2"><text x="330" y="186" text-anchor="middle" font-size="11" fill="#17211B">+ cópia filtrada</text></g>
  <g class="seq-item eager-3"><text x="430" y="186" text-anchor="middle" font-size="11" fill="#17211B">+ cópia agregada</text></g>

  <!-- BOTTOM: Lazy (Polars) -->
  <rect x="25" y="245" width="850" height="185" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="50" y="270" font-size="15" font-weight="bold" fill="#17211B">Plano de consulta lazy do Polars</text>

  <!-- Phase 1: Build Plan -->
  <g class="seq-item lazy-1">
    <rect x="50" y="285" width="110" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <text x="105" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">scan_parquet()</text>
    <text x="105" y="322" text-anchor="middle" font-size="11" fill="#17211B">Apenas o schema</text>
    <line x1="165" y1="310" x2="185" y2="310" stroke="#17211B" stroke-width="1.5" marker-end="url(#arr)" />
  </g>

  <g class="seq-item lazy-2">
    <rect x="190" y="285" width="90" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <text x="235" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">.filter()</text>
    <text x="235" y="322" text-anchor="middle" font-size="11" fill="#17211B">Planeado</text>
    <line x1="285" y1="310" x2="305" y2="310" stroke="#17211B" stroke-width="1.5" marker-end="url(#arr)" />
  </g>

  <g class="seq-item lazy-3">
    <rect x="310" y="285" width="90" height="50" rx="6" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
    <text x="355" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">.group_by()</text>
    <text x="355" y="322" text-anchor="middle" font-size="11" fill="#17211B">Planeado</text>
    <line x1="405" y1="310" x2="435" y2="310" stroke="#17211B" stroke-width="2" marker-end="url(#arr)" />
  </g>

  <!-- Optimizer -->
  <g class="seq-item lazy-4">
    <rect x="440" y="280" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text x="515" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#17211B">Otimizador de consultas</text>
    <text x="515" y="318" text-anchor="middle" font-size="11" fill="#17211B">Predicate Pushdown</text>
    <text x="515" y="332" text-anchor="middle" font-size="11" fill="#17211B">Column Pruning</text>
    <line x1="595" y1="310" x2="625" y2="310" stroke="#17211B" stroke-width="2" marker-end="url(#arr)" />
  </g>

  <!-- Result -->
  <g class="seq-item lazy-5">
    <rect x="630" y="285" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text x="675" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">.collect()</text>
    <text x="675" y="322" text-anchor="middle" font-size="11" fill="#17211B">Executar!</text>
  </g>

  <!-- CPU indicator: all cores -->
  <rect x="760" y="285" width="90" height="50" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="805" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">Operações paralelas</text>
  <rect x="772" y="313" width="12" height="12" rx="2" fill="#FFFFFF" />
  <rect x="788" y="313" width="12" height="12" rx="2" fill="#FFFFFF" />
  <rect x="804" y="313" width="12" height="12" rx="2" fill="#FFFFFF" />
  <rect x="820" y="313" width="12" height="12" rx="2" fill="#FFFFFF" />

  <!-- Memory bar -->
  <text x="50" y="362" font-size="11" fill="#17211B">RAM:</text>
  <rect x="90" y="351" width="530" height="14" rx="3" fill="#F2F2F5" />
  <g class="seq-item lazy-5"><rect x="90" y="351" width="80" height="14" rx="3" fill="#17211B" /></g>
  <text x="640" y="363" font-size="11" fill="#17211B">Batches em streaming</text>

  <text x="50" y="382" font-size="11" fill="#17211B">O pushdown pode evitar colunas, linhas e resultados intermédios não utilizados.</text>

  <!-- Bottom comparison -->
  <rect x="50" y="435" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="235" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#17211B">Pandas: ~365 s (PDS-H SF-10)</text>
  <text x="235" y="468" text-anchor="middle" font-size="11" fill="#17211B">Baseline eager em memória</text>

  <rect x="480" y="435" width="370" height="38" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="665" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#17211B">Polars: ~3,89 s (PDS-H SF-10)</text>
  <text x="665" y="468" text-anchor="middle" font-size="11" fill="#17211B">Multi-threaded, lazy, em streaming</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
