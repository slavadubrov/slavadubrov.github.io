<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Seis camadas independentes num artefacto de modelo open-weight</title>
  <desc id="layers-desc">Seis nós alinhados separam a família e a revisão, o papel no treino, a arquitetura, a representação numérica, o contentor e o layout, e o runtime e hardware. O contentor e o layout são o foco, porque o nome de um formato é apenas uma camada do artefacto.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#0C1210" />

  <text class="section" x="48" y="48">ARTEFACTO DO MODELO — LEIA CADA CAMADA SEPARADAMENTE</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="114">CAMADA 1</text>
  <text class="name" x="68" y="142">Família + revisão</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="114">CAMADA 2</text>
  <text class="name" x="364" y="142">Papel no treino</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="114">CAMADA 3</text>
  <text class="name" x="660" y="142">Arquitetura</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="250">CAMADA 4</text>
  <text class="name" x="68" y="278">Representação numérica</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="364" y="250" fill="#FF6FB6">FOCO · CAMADA 5</text>
  <text class="name" x="364" y="278" fill="#FF6FB6">Contentor + layout</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="250">CAMADA 6</text>
  <text class="name" x="660" y="278">Runtime + hardware</text>

  <path d="M48 360H912" stroke="#2B3B33" stroke-width="1" />
  <text class="kind" x="48" y="392">EXEMPLOS</text>
  <text class="note" x="48" y="420">GPTQ e AWQ descrevem a quantização. GGUF e Safetensors descrevem o packaging.</text>
  <text class="note" x="48" y="448">MoE descreve a estrutura de execução. llama.cpp, vLLM e Transformers executam artefactos compatíveis.</text>
  <text class="note" x="48" y="476">Um sufixo familiar não comprova a qualidade, o ajuste à memória nem a velocidade de serving.</text>
</svg>
