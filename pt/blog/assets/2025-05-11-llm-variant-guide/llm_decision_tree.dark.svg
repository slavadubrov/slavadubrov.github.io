<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ldt-title ldt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ldt-title">Fluxo de seleção de checkpoint, runtime e quantização</title><desc id="ldt-desc">Um fluxo de seis passos fixa o contrato da tarefa, seleciona um checkpoint exato, verifica um runtime suportado, estabelece um orçamento de memória medido, escolhe uma representação e faz o benchmark da unidade de release. O benchmark de release é o foco; alterar qualquer passo cria uma nova unidade de release para testar.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ldt-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ldt-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="496" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Um fluxo de seleção que resiste a novos formatos</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Seis passos, por ordem. Alterar qualquer um cria uma nova unidade de release para benchmark.</text>
