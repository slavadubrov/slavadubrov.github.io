<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" data-visual-system="evidence-plate-v1" font-family="Inter, system-ui, sans-serif">
  <title id="title">Escolha um contentor de modelo com uma verificação de compatibilidade orientada pelo runtime</title>
  <desc id="desc">Mapa de decisão empilhado, orientado pelo runtime, para ecrãs estreitos e largos. O caminho llama.cpp usa uma conversão GGUF suportada. Um loader ao estilo Transformers ou um servidor GPU usa o artefacto documentado do repositório. Um runtime para edge ou dispositivos móveis usa a exportação suportada. Todos os caminhos passam por verificações de compatibilidade e benchmark.</desc>
  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .stage { font-size: 21px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .copy { font-size: 18px; fill: #64748b; }
      .chip { font-size: 18px; font-weight: 600; }
      .note { font-size: 18px; fill: #166534; font-weight: 600; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="960" height="1040" rx="14" fill="#f8fafc" />
  <text x="48" y="54" class="title">Escolha primeiro o runtime, depois o contentor</text>
  <text x="48" y="86" class="subtitle">O hardware condiciona os backends e os kernels. Por si só, não seleciona um formato.</text>

  <rect x="144" y="118" width="672" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="480" y="149" text-anchor="middle" class="stage">Que runtime suporta a arquitetura</text>
  <text x="480" y="176" text-anchor="middle" class="copy">e a interface de serving necessária?</text>

  <path d="M480 194 V226" class="arrow" />

  <rect x="96" y="236" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="124" y="270" class="label">Caminho 1 · executor llama.cpp / ggml</text>
  <rect x="124" y="288" width="104" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="176" y="312" text-anchor="middle" class="chip">GGUF</text>
  <text x="124" y="348" class="copy">Use uma conversão para a arquitetura exata. Registe as revisões da origem e do conversor.</text>

  <path d="M480 378 V410" class="arrow" />
  <rect x="96" y="420" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="124" y="454" class="label">Caminho 2 · loader ao estilo Transformers ou servidor GPU</text>
  <rect x="124" y="472" width="326" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="287" y="496" text-anchor="middle" class="chip">Artefacto documentado do repositório</text>
  <text x="124" y="532" class="copy">Use os ficheiros, a configuração, o método de quantização e os kernels documentados.</text>

  <path d="M480 562 V594" class="arrow" />
  <rect x="96" y="604" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="124" y="638" class="label">Caminho 3 · runtime para edge ou dispositivos móveis</text>
  <rect x="124" y="656" width="286" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="267" y="680" text-anchor="middle" class="chip">Exportação suportada pelo runtime</text>
  <text x="124" y="716" class="copy">Use operadores, dtypes e quantização suportados. Meça no dispositivo-alvo.</text>

  <path d="M480 746 V778" class="arrow" />

  <rect x="96" y="788" width="768" height="126" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="124" y="824" class="stage">Verificação de compatibilidade</text>
  <text x="124" y="856" class="copy">Verifique a arquitetura, a versão do loader, os kernels, o hardware, a revisão do modelo,</text>
  <text x="124" y="884" class="copy">e a proveniência da conversão. Uma extensão correspondente não é suficiente.</text>

  <path d="M480 914 V946" class="arrow" />
  <rect x="132" y="956" width="696" height="46" rx="23" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="480" y="985" text-anchor="middle" class="note">Faça benchmark da qualidade da tarefa, throughput, latência e memória máxima</text>
</svg>
