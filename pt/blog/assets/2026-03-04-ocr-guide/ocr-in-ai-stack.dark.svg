<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-stack-title ocr-stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-stack-title">A qualidade do OCR condiciona todos os sistemas documentais a jusante</title>
  <desc id="ocr-stack-desc">Os documentos passam por uma etapa dedicada à qualidade da extração, dando origem a um registo persistente de texto e esquema de página. A recuperação, as decisões dos agentes e os fluxos de trabalho do domínio só podem usar as evidências preservadas pela extração.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="488" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">A FRONTEIRA DA EXTRAÇÃO</text>

  <rect x="48" y="80" width="232" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="114">EXTERNO</text>
  <text class="name" x="68" y="142">Documentos e imagens</text>

  <rect x="364" y="80" width="232" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="384" y="114" fill="#FF6FB6">FOCO</text>
  <text class="name" x="384" y="142" fill="#FF6FB6">Qualidade da extração</text>

  <rect x="680" y="80" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="700" y="114">ARMAZENAMENTO</text>
  <text class="name" x="700" y="142"><tspan x="700">Evidências de texto +</tspan><tspan x="700" dy="1.2em">esquema de página</tspan></text>

  <path class="edge" d="M280 128h76" marker-end="url(#ocr-stack-arrow)" />
  <path class="edge" d="M596 128h76" marker-end="url(#ocr-stack-arrow)" />

  <path class="edge" d="M796 176v48H164v32" />
  <path class="edge" d="M480 224v32" marker-end="url(#ocr-stack-arrow)" />
  <path class="edge" d="M796 224v32" marker-end="url(#ocr-stack-arrow)" />
  <path class="edge" d="M164 224v32" marker-end="url(#ocr-stack-arrow)" />

  <rect class="box" x="48" y="264" width="232" height="96" rx="10" />
  <text class="kind" x="68" y="298">PROCESSO</text>
  <text class="name" x="68" y="326">Recuperar e responder</text>

  <rect class="box" x="364" y="264" width="232" height="96" rx="10" />
  <text class="kind" x="384" y="298">PROCESSO</text>
  <text class="name" x="384" y="326">Decisões dos agentes</text>

  <rect class="box" x="680" y="264" width="232" height="96" rx="10" />
  <text class="kind" x="700" y="298">PROCESSO</text>
  <text class="name" x="700" y="326"><tspan x="700">Fluxos de trabalho do</tspan><tspan x="700" dy="1.2em">domínio</tspan></text>

  <path d="M48 408h864" stroke="#2B3B33" stroke-width="1" />
  <text class="kind" x="48" y="436">RESTRIÇÃO</text>
  <text class="note" x="176" y="436">O texto ou a estrutura perdidos deixam de fornecer evidências para recuperação, geração ou ação.</text>

  <defs>
    <marker id="ocr-stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
