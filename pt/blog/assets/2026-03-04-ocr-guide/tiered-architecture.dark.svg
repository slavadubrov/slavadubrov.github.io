<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1216" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="tieredarch-title tieredarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tieredarch-title">Em produção, o OCR encaminha os documentos por níveis de fallback calibrados, passando do texto nativo para OCR rápido e depois para um modelo mais robusto, reservando a revisão humana para campos não resolvidos ou de alto risco.</title><desc id="tieredarch-desc">Primeiro, os documentos são verificados quanto à existência de uma camada de texto nativo utilizável; se não existir, passam por OCR local rápido e por uma verificação de confiança calibrada, escalando depois para um modelo especializado ou geral mais robusto quando a verificação falha. As rotas aprovadas convergem para o pós-processamento e o structured output. Apenas os campos não resolvidos ou de alto risco chegam à revisão humana, e os resultados revistos alimentam o mesmo structured output.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tieredarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="tieredarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1216" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Escalar apenas quando uma verificação falha</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O texto nativo e as verificações de confiança aprovadas avançam diretamente para o structured output.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Apenas os campos não resolvidos ou de alto risco chegam a uma pessoa.</text>
<path d="M234 112h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M234 112h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="238" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXTERNO · ENTRADA</text><text x="238" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Documentos</text><text x="238" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">PDFs, digitalizações, fotografias</text>
