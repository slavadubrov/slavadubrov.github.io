<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1184" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="tieredarch-title tieredarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="tieredarch-title">Em produção, o OCR encaminha os documentos por níveis de fallback calibrados, passando do texto nativo para OCR rápido e depois para um modelo mais robusto, reservando a revisão humana para campos não resolvidos ou de alto risco.</title><desc id="tieredarch-desc">Primeiro, os documentos são verificados quanto à existência de uma camada de texto nativo utilizável; caso contrário, passam por OCR local rápido, condicionado por um limiar de confiança calibrado, e depois escalam para um modelo especializado ou geral mais robusto quando o limiar falha. Os percursos aprovados convergem no pós-processamento e no structured output. Apenas os campos não resolvidos ou de alto risco chegam à revisão humana, e os resultados revistos regressam ao mesmo structured output.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="tieredarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="tieredarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1184" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Escalar apenas quando um limiar falhar</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12px;">Texto nativo e confiança aprovada vão para structured output; só campos incertos ou de alto risco chegam a uma pessoa.</text>
<path d="M234 112h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M234 112h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="238" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">EXTERNO · ENTRADA</text><text x="238" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Documentos</text><text x="238" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">PDFs, digitalizações, fotografias</text>
<path d="M360 216v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" />
<rect x="224" y="248" width="272" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="360" y="288" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">DECISÃO</text><text x="360" y="312" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Texto nativo utilizável?</text>
<path d="M360 344v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><text x="380" y="360.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="start">não</text>
<path d="M224 296h-124v564h180v12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><rect x="111.5" y="284" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="162" y="300.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">texto nativo</text>
<path d="M234 368h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M234 368h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="238" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">NÍVEL 1 · OCR RÁPIDO</text><text x="238" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">OCR local rápido</text><text x="238" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="238">Em seguida, limiar de confiança</tspan><tspan x="238" dy="1.2em">calibrado</tspan></text>
<path d="M360 472v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" />
<rect x="224" y="496" width="272" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="360" y="536" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">DECISÃO</text><text x="360" y="560" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">O limiar é aprovado?</text>
<path d="M360 592v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><text x="380" y="608.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="start">não</text>
<path d="M224 544h-144v316h360v12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><rect x="101.5" y="532" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="152" y="548.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">limiar aprovado</text>
<path d="M234 616h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M234 616h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="238" y="633.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">NÍVEL 2 · ESCALAR</text><text x="238" y="677" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Modelo mais robusto</text><text x="238" y="699" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">VLM especializado ou geral</text>
<path d="M360 720v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" />
<path d="M234 744h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M234 744h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="238" y="761.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCO · ÚLTIMO RECURSO</text><text x="238" y="805" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Revisão humana</text><text x="238" y="827" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Campos não resolvidos ou de alto risco</text>
<path d="M360 848v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" /><text x="396" y="866.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="start">revistos</text>
<path d="M234 872h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M234 872h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="238" y="889.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PÓS-PROCESSAMENTO</text><text x="238" y="927" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Fundir e estruturar</text>
<path d="M360 944v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tieredarch-arrow-flow)" />
<path d="M234 968h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M234 968h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="238" y="985.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ARMAZENAR</text><text x="238" y="1029" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Structured output</text><text x="238" y="1051" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Alimenta sistemas de retrieval e RAG</text>
<path d="M32 1104h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="1130" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Calibre cada limiar por classe de documento, criticidade do campo e resultados anotados.</text>
<text x="32" y="1152" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">A revisão humana é o nível mais dispendioso — reserve-a para o que os limiares do modelo não</tspan><tspan x="32" dy="1.2em">conseguem resolver.</tspan></text>
</svg>
