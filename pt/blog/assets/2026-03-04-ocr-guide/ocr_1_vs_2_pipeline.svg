<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Comparação entre a abordagem modular OCR-1.0 de pipeline (detetar, reconhecer, pós-processamento) e a abordagem unificada OCR-2.0 de VLM (um único modelo que lida com todas as fases)</title>
  <desc id="artifact-desc">Comparação entre a abordagem modular OCR-1.0 de pipeline (detetar, reconhecer, pós-processamento) e a abordagem unificada OCR-2.0 de VLM (um único modelo que lida com todas as fases)</desc>
  <defs>
