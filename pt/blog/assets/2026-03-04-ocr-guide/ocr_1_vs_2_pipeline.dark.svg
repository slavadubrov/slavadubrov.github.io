<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 768" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ocrpipe-title ocrpipe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ocrpipe-title">O OCR modular executa três etapas sequenciais, enquanto um percurso de visão-linguagem end-to-end pode combinar deteção e reconhecimento; ainda assim, a rasterização e a análise do output envolvem ambos os percursos.</title><desc id="ocrpipe-desc">Um pipeline modular de OCR-1.0 deteta regiões de texto, reconhece caracteres e limpa o output em três etapas sequenciais, antes de armazenar texto simples. O painel da direita mostra um percurso de visão-linguagem end-to-end que pode combinar deteção e reconhecimento numa única passagem de inferência, armazenando conjuntamente texto e estrutura. A rasterização, a normalização da imagem e a análise do output permanecem fora do modelo em ambos os percursos.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ocrpipe-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ocrpipe-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="768" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Um percurso VLM mais curto, com o mesmo pipeline envolvente</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Um percurso end-to-end pode unificar a inferência do modelo, mas não todo o pipeline documental.</text>
<rect x="32" y="128" width="304" height="400" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">OCR-1.0 · PIPELINE MODULAR</text>
<rect x="384" y="128" width="304" height="384" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="400" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">PERCURSO VLM END-TO-END</text>
<path d="M58 164h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 164h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="181.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">1 · DETETAR</text><text x="62" y="219" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Detetar regiões de texto</text>
<path d="M58 252h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 252h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="269.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">2 · RECONHECER</text><text x="62" y="307" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Reconhecer caracteres</text>
<path d="M58 340h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 340h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="357.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">3 · PÓS-PROCESSAR</text><text x="62" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Limpar o output</text>
<path d="M58 428h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 428h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="445.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ARMAZENAR</text><text x="62" y="483" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Texto simples</text>
<path d="M184 236v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ocrpipe-arrow-flow)" />
<path d="M184 324v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ocrpipe-arrow-flow)" />
<path d="M184 412v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ocrpipe-arrow-flow)" />
<path d="M410 172h252a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M410 172h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">INPUT</text><text x="414" y="227" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#A8B8AF">Imagem do documento</text>
<path d="M410 260h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M410 260h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="414" y="277.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">VLM · PERCURSO END-TO-END</text><text x="414" y="311" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 15px;">Passagem de inferência combinada</text><text x="414" y="333" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Pode combinar a deteção</text><text x="414" y="353" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">+ reconhecimento</text>
<path d="M410 380h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M410 380h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="414" y="397.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ARMAZENAR</text><text x="414" y="441" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Texto + estrutura</text><text x="414" y="463" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Layout, tabelas, ordem de leitura</text>
<path d="M536 244v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ocrpipe-arrow-flow)" />
<path d="M536 364v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ocrpipe-arrow-flow)" />
<path d="M42 552h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 552h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="569.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCO · AINDA ENVOLVE O MODELO</text><text x="46" y="613" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">A rasterização e a análise do output continuam a envolvê-lo</text><text x="46" y="635" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O modelo ficou mais curto; o pipeline não desapareceu</text>
<path d="M32 688h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="714" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Cada etapa pode propagar um erro — meça tanto os caracteres como os campos a jusante.</text>
<text x="32" y="736" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Um VLM end-to-end pode encurtar a inferência; a rasterização, a normalização e a análise do output</tspan><tspan x="32" dy="1.2em">permanecem.</tspan></text>
</svg>
