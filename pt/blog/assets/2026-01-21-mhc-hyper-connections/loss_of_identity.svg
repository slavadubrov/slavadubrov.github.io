<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" style="background-color: #F7F7F4; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Comportamento composto do mapa residual</title>
  <desc id="desc">Mapas residuais sem restrições podem amplificar ou atenuar direções alinhadas, enquanto um atalho de identidade transmite o estado residual inalterado.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Marker -->
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#F2F2F5" />
    </marker>
    <marker id="arrowEmerald" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#FFFFFF" />
    </marker>

    <!-- Shadows -->




    <!-- Glows -->


  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="520" fill="#F7F7F4" />

  <!-- Background layer -->
  <rect width="1000" height="520" fill="#F7F7F4" />

  <!-- Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#17211B">A causa principal: perda da identidade</text>
  <text x="40" y="80" font-size="16" fill="#17211B">Produtos de mapas sem restrições podem amplificar ou atenuar sinais.</text>

  <!-- LEFT SIDE: Unconstrained (Exploding) -->
  <g transform="translate(60, 130)">

    <text x="140" y="0" text-anchor="middle" font-size="20" font-weight="700" fill="#17211B">Matriz sem restrições (HC)</text>

    <!-- Unconstrained Matrix Data Box -->
    <rect x="0" y="25" width="280" height="190" rx="12" fill="#ffffff" stroke="#17211B" stroke-width="2.5" class="visual-focus" />

    <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18">
      <!-- Row 1 -->
      <text x="40" y="65" text-anchor="middle" fill="#17211B" font-weight="700">-5.2</text>
      <text x="106" y="65" text-anchor="middle" fill="#17211B" font-weight="700">14.1</text>
      <text x="173" y="65" text-anchor="middle" fill="#17211B">0.01</text>
      <text x="240" y="65" text-anchor="middle" fill="#17211B">1.1</text>

      <!-- Row 2 -->
      <text x="40" y="105" text-anchor="middle" fill="#17211B" font-weight="700">8.7</text>
      <text x="106" y="105" text-anchor="middle" fill="#17211B" font-weight="700">-2.3</text>
      <text x="173" y="105" text-anchor="middle" fill="#17211B" font-weight="700">10.5</text>
      <text x="240" y="105" text-anchor="middle" fill="#17211B">0.2</text>

      <!-- Row 3 -->
      <text x="40" y="145" text-anchor="middle" fill="#17211B" font-weight="700">12.0</text>
      <text x="106" y="145" text-anchor="middle" fill="#17211B">0.05</text>
      <text x="173" y="145" text-anchor="middle" fill="#17211B" font-weight="700">-7.8</text>
      <text x="240" y="145" text-anchor="middle" fill="#17211B" font-weight="700">15.2</text>

      <!-- Row 4 -->
      <text x="40" y="185" text-anchor="middle" fill="#17211B" font-weight="700">-1.0</text>
      <text x="106" y="185" text-anchor="middle" fill="#17211B">3.4</text>
      <text x="173" y="185" text-anchor="middle" fill="#17211B" font-weight="700">11.1</text>
      <text x="240" y="185" text-anchor="middle" fill="#17211B" font-weight="700">-0.03</text>
    </g>

    <!-- Signal Particle Entering and Exploding/Scattering -->
    <!-- Input stream -->

    <!-- Output explosion (multiple glowing red particles bursting downwards/outwards) -->
    <g>

    </g>

    <!-- Downward Arrow indicating flow -->
    <path d="M 140 220 L 140 270" stroke="#17211B" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowRed)" fill="none" />

    <!-- Outcome Box -->
    <rect x="-10" y="285" width="300" height="45" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
    <text x="140" y="313" text-anchor="middle" fill="#17211B" font-size="16" font-weight="800">Resultado: o ganho pode ser ilimitado</text>

  </g>

  <!-- CENTER: The core question connecting the two concepts -->
  <g transform="translate(420, 220)">
    <circle cx="50" cy="50" r="50" fill="#F2F2F5" />
    <text x="50" y="70" text-anchor="middle" fill="#ffffff" font-size="55" font-weight="800">?</text>

    <text x="50" y="135" text-anchor="middle" fill="#17211B" font-size="16" font-weight="700">Como podemos</text>
    <text x="50" y="155" text-anchor="middle" fill="#17211B" font-size="14" font-weight="600">restringi-lo?</text>
  </g>

  <!-- RIGHT SIDE: Constrained (Identity-like) -->
  <g transform="translate(620, 130)">

    <text x="140" y="0" text-anchor="middle" font-size="20" font-weight="700" fill="#17211B">Comportamento pretendido da matriz</text>

    <!-- Constrained Matrix Data Box -->
    <rect x="0" y="25" width="280" height="190" rx="12" fill="#ffffff" stroke="#59645E" stroke-width="2.5" />

    <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18">
      <!-- Row 1 -->
      <text x="40" y="65" text-anchor="middle" fill="#17211B" font-weight="800">1.0</text>
      <text x="106" y="65" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="173" y="65" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="240" y="65" text-anchor="middle" fill="#17211B">0.0</text>

      <!-- Row 2 -->
      <text x="40" y="105" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="106" y="105" text-anchor="middle" fill="#17211B" font-weight="800">1.0</text>
      <text x="173" y="105" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="240" y="105" text-anchor="middle" fill="#17211B">0.0</text>

      <!-- Row 3 -->
      <text x="40" y="145" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="106" y="145" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="173" y="145" text-anchor="middle" fill="#17211B" font-weight="800">1.0</text>
      <text x="240" y="145" text-anchor="middle" fill="#17211B">0.0</text>

      <!-- Row 4 -->
      <text x="40" y="185" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="106" y="185" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="173" y="185" text-anchor="middle" fill="#17211B">0.0</text>
      <text x="240" y="185" text-anchor="middle" fill="#17211B" font-weight="800">1.0</text>
    </g>

    <!-- Signal Particle Entering and Safely Exiting -->

    <!-- Output safe steady stream -->
    <g>

    </g>

    <!-- Downward Arrow indicating stable flow -->
    <path d="M 140 215 L 140 270" stroke="#59645E" stroke-width="4" marker-end="url(#arrowEmerald)" fill="none" />

    <!-- Outcome Box -->
    <rect x="-30" y="285" width="340" height="45" rx="8" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
    <text x="140" y="313" text-anchor="middle" fill="#17211B" font-size="16" font-weight="800">Resultado: caminho de identidade inalterado</text>

  </g>

  <!-- Bottom Final Takeaway Banner -->
  <rect x="90" y="470" width="820" height="40" rx="8" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="500" y="495" text-anchor="middle" fill="#17211B" font-size="15" font-weight="600">Para estabilizar o treino, precisamos que as matrizes de routing apresentem, por natureza, propriedades bem comportadas semelhantes às da identidade.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
