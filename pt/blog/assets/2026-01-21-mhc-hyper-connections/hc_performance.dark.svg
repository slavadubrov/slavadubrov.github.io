<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Resultado do artigo Hyper-Connections</title>
  <desc id="desc">Esquema dos 1,8× de convergência mais rápida reportados no artigo para a configuração OLMoE-1B-7B DHC ×4.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Marker for arrow -->
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>

    <!-- Shadows -->


    <!-- Glows for animated particles -->


  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="600" fill="#0C1210" />

  <!-- Background grid layer -->
  <rect width="1000" height="600" fill="#0C1210" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#EDF5F0">A promessa de desempenho</text>
  <text x="40" y="80" font-size="16" fill="#EDF5F0">Fonte: Hyper-Connections (2024)</text>

  <!-- Left Side: Plot Area -->
  <g transform="translate(60, 140)">

    <!-- Plot Background -->
    <rect x="0" y="0" width="460" height="380" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus" />

    <text x="240" y="28" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="600">Métrica de validação (esquema do artigo)</text>

    <!-- Y-axis lines and ticks -->
    <g stroke="#A8B8AF" stroke-width="1.5" fill="none">
      <line x1="60" y1="50" x2="420" y2="50" />
      <line x1="60" y1="120" x2="420" y2="120" />
      <line x1="60" y1="190" x2="420" y2="190" />
      <line x1="60" y1="260" x2="420" y2="260" />
    </g>

    <!-- Base X and Y axis lines drawn thicker -->
    <path d="M 60 40 L 60 330 L 430 330" fill="none" stroke="#EDF5F0" stroke-width="2" />

    <!-- X-axis label -->
    <text x="240" y="370" text-anchor="middle" fill="#EDF5F0" font-size="14" font-weight="600">Passos de treino</text>

    <!-- SVG paths for the curves -->
    <!-- ResNet Line -->
    <path id="pathResNetFast" d="M 60 320 Q 120 280 180 230 Q 240 180 300 150 Q 360 130 420 120" fill="none" stroke="#A8B8AF" stroke-width="3" stroke-dasharray="6,4" />

    <!-- Hyper-Connections Line -->
    <path id="pathHCFast" d="M 60 320 Q 90 240 135 170 Q 180 110 240 85 Q 310 70 420 65" fill="none" stroke="#EDF5F0" stroke-width="3" />

    <!-- HC Curve Annotation -->
    <rect x="290" y="35" width="135" height="26" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
    <text x="357" y="53" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="700">Hyper-Connections</text>

    <!-- ResNet Curve Annotation (Hidden) -->
    <!-- <rect x="290" y="145" width="130" height="26" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5"/> -->
    <!-- <text x="355" y="163" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="700">Baseline ResNet</text> -->

    <!-- Gap Arrow "1.8x Faster" -->
    <!-- Drawing arrow between early parts of the convergence to show the speed gap -->
    <line x1="220" y1="95" x2="220" y2="200" stroke="#A8B8AF" stroke-width="2" />
    <polygon points="220,95 215,105 225,105" fill="#1B2621" />
    <polygon points="220,200 215,190 225,190" fill="#1B2621" />

    <rect x="115" y="130" width="95" height="40" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="162" y="146" text-anchor="middle" fill="#EDF5F0" font-size="13" font-weight="800">1,8× nesta execução</text>
    <text x="162" y="162" text-anchor="middle" fill="#EDF5F0" font-size="11" font-weight="600">Convergência</text>

    <!-- Animated Particles Tracing Curves -->

    <!-- HC particle is significantly faster (dur=2.2s vs 4.0s) -->

  </g>

  <!-- Right Side: Explanation Cards -->
  <g transform="translate(560, 140)">

    <!-- Title Card -->
    <rect x="0" y="0" width="400" height="240" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
    <text x="200" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="#EDF5F0">Mapeamentos estáticos vs. dinâmicos</text>
    <line x1="20" y1="50" x2="380" y2="50" stroke="#2B3B33" stroke-width="2" />

    <!-- Static Explanation -->
    <g transform="translate(20, 75)">
      <text x="0" y="0" font-size="15" font-weight="700" fill="#EDF5F0">Estático (ResNet padrão):</text>
      <text x="0" y="24" font-size="14" fill="#EDF5F0">O coeficiente do atalho residual é fixo em um.</text>
      <text x="0" y="46" font-size="14" fill="#EDF5F0">A topologia do atalho não depende da entrada.</text>
    </g>

    <!-- Dynamic Explanation -->
    <g transform="translate(20, 155)">
      <text x="0" y="0" font-size="15" font-weight="700" fill="#EDF5F0">Dinâmico (Hyper-Connections):</text>
      <text x="0" y="24" font-size="14" fill="#EDF5F0">Os pesos são condicionados pelo vetor de características de entrada.</text>
      <text x="0" y="46" font-size="14" fill="#EDF5F0">O HC dinâmico pode condicionar os seus mapas de leitura, escrita e residuais</text>
      <text x="0" y="68" font-size="14" fill="#EDF5F0">à entrada atual.</text>
    </g>

  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
