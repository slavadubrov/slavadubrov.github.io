<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" style="background-color: #0C1210; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif;" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">A restrição do mapa residual mHC</title>
  <desc id="desc">Uma matriz de routing residual é projetada para o politopo de Birkhoff: entradas não negativas, com a soma de cada linha e coluna igual a um.</desc>
  <defs>
    <!-- Background grid -->


    <!-- Markers for arrows -->
    <marker id="arrowEmerald" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#141D19" />
    </marker>
    <marker id="arrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#1B2621" />
    </marker>

    <!-- Glow & Shadow -->

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1000" height="520" fill="#0C1210" />

  <!-- Background grid layer -->
  <rect width="1000" height="520" fill="#0C1210" />

  <!-- Top Title -->
  <text x="40" y="50" font-size="28" font-weight="800" fill="#EDF5F0">Solução mHC: Estruturação com restrições na variedade</text>
  <text x="40" y="80" font-size="16" fill="#EDF5F0">Projetar o mapa de routing residual para o politopo de Birkhoff.</text>

  <!-- Main Container -->
  <g transform="translate(60, 120)">

    <!-- Left Background Block (Constraints List) -->
    <rect x="0" y="0" width="300" height="280" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />

    <text x="20" y="40" font-size="20" font-weight="800" fill="#EDF5F0">Condições de Birkhoff</text>
    <line x1="20" y1="55" x2="280" y2="55" stroke="#2B3B33" stroke-width="2" />

    <!-- Constraint 1 -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
      <text x="10" y="15" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">1</text>
      <text x="35" y="16" font-size="16" font-weight="700" fill="#EDF5F0">Regra da positividade</text>
      <text x="35" y="38" font-size="13" fill="#EDF5F0">Todas as entradas são não negativas,</text>
      <text x="35" y="56" font-size="13" fill="#EDF5F0">evitando o cancelamento de sinais.</text>
    </g>

    <!-- Constraint 2 -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
      <text x="10" y="15" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">2</text>
      <text x="35" y="16" font-size="16" font-weight="700" fill="#EDF5F0">Normalização das linhas</text>
      <text x="35" y="38" font-size="13" fill="#EDF5F0">A soma total de cada linha é igual a 1.0,</text>
      <text x="35" y="56" font-size="13" fill="#EDF5F0">fixando a escala dos canais de saída.</text>
    </g>

    <!-- Constraint 3 -->
    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
      <text x="10" y="15" text-anchor="middle" font-size="13" font-weight="700" fill="#EDF5F0">3</text>
      <text x="35" y="16" font-size="16" font-weight="700" fill="#EDF5F0">Normalização das colunas</text>
      <text x="35" y="38" font-size="13" fill="#EDF5F0" style="font-size: 12.5px;">A soma total de cada coluna é igual a 1.0,</text>
      <text x="35" y="56" font-size="13" fill="#EDF5F0">conservando a média global.</text>
    </g>

    <!-- Connecting Arrow to Matrix -->
    <line x1="315" y1="140" x2="350" y2="140" stroke="#A8B8AF" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowSlate)" />

    <!-- Center Matrix Display -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="480" height="280" rx="12" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
      <text x="240" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#EDF5F0">A matriz duplamente estocástica pretendida</text>

      <g transform="translate(65, 70)">

        <!-- Grid Structure -->
        <path d="M 0 0 L 300 0 L 300 160 L 0 160 Z" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
        <!-- Inner lines -->
        <g stroke="#A8B8AF" stroke-width="1.5">
          <line x1="75" y1="0" x2="75" y2="160" />
          <line x1="150" y1="0" x2="150" y2="160" />
          <line x1="225" y1="0" x2="225" y2="160" />
          <line x1="0" y1="40" x2="300" y2="40" />
          <line x1="0" y1="80" x2="300" y2="80" />
          <line x1="0" y1="120" x2="300" y2="120" />
        </g>

        <!-- Values representing Doubly Stochastic Structure -->
        <g fill="#A8B8AF" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
          <!-- Row 1 -->
          <text x="37" y="27">.15</text>  <text x="112" y="27">.35</text>  <text x="187" y="27">.40</text>  <text x="262" y="27">.10</text>
          <!-- Row 2 -->
          <text x="37" y="67">.45</text>  <text x="112" y="67">.10</text>  <text x="187" y="67">.25</text>  <text x="262" y="67">.20</text>
          <!-- Row 3 -->
          <text x="37" y="107">.30</text> <text x="112" y="107">.25</text> <text x="187" y="107">.15</text> <text x="262" y="107">.30</text>
          <!-- Row 4 -->
          <text x="37" y="147">.10</text> <text x="112" y="147">.30</text> <text x="187" y="147">.20</text> <text x="262" y="147">.40</text>
        </g>

        <!-- Constraint Highlighting / Animation setup -->
        <!-- Highlight Row sum -->
        <text id="rowSumText" x="315" y="26" text-anchor="start" fill="#EDF5F0" font-size="14" font-weight="800">→ Σ = 1.0</text>

        <!-- Highlight Col sum -->
        <g text-anchor="middle" fill="#A8B8AF" font-size="14" font-weight="800">
          <text x="37" y="180">↓</text>
          <text id="colSumText" x="37" y="195">Σ = 1.0</text>
        </g>

        <!-- Animation block indicating scanning validation matrix -->

        <!-- Static Indicators (Remaining rows) -->
        <g font-size="14" font-weight="800" fill="#A8B8AF">
          <text x="315" y="66">→ Σ = 1.0</text>
          <text x="315" y="106">→ Σ = 1.0</text>
          <text x="315" y="146">→ Σ = 1.0</text>
        </g>

        <!-- Static Indicators (Remaining cols) -->
        <g font-size="14" font-weight="800" fill="#A8B8AF" text-anchor="middle">
          <text x="112" y="180">↓</text> <text x="112" y="195">Σ = 1.0</text>
          <text x="187" y="180">↓</text> <text x="187" y="195">Σ = 1.0</text>
          <text x="262" y="180">↓</text> <text x="262" y="195">Σ = 1.0</text>
        </g>

        <rect x="0" y="0" width="300" height="160" fill="none" stroke="#FF6FB6" stroke-width="2.5" />
        <text x="150" y="-12" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Condição 1: entradas ≥ 0</text>

      </g>
    </g>
  </g>

  <!-- Bottom Outcome Strip -->
  <rect x="60" y="425" width="850" height="50" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
  <text x="485" y="456" text-anchor="middle" font-size="18" font-weight="800" fill="#EDF5F0">Resultado: média conservada; amplificação limitada.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
