<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Three levels of agent evaluation with their metrics" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Três níveis de avaliação de agentes e respetivas métricas</title>
  <defs>
    <marker id="arrLvl" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#334155" />
    </marker>
    <filter id="shadowLvl" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Três níveis de avaliação de agentes</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">O resultado diz-lhe O QUE correu mal · a trajetória diz-lhe ONDE · o componente diz-lhe PORQUÊ</text>

  <!-- Level 1: end-to-end -->
  <rect x="30" y="80" width="1120" height="150" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="106" font-size="14" font-weight="700" fill="#166534" x="55">Nível 1 · Resultado (caixa-preta)</text>
  <text y="124" font-size="10" fill="#166534" x="55">Pergunta: a tarefa foi concluída?</text>

  <rect x="55" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="225">Conclusão da tarefa</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="225">Alinhamento com o objetivo avaliado por LLM, sem referência</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="225">utilizável online — não requer output de referência</text>

  <rect x="415" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="585">Avaliação do resultado / estado</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="585">comparar o estado final do ambiente com o estado objetivo</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="585">robusto face a trajetórias alternativas criativas (tau-bench)</text>

  <rect x="775" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="945">Fiabilidade: pass^k</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="945">todas as k de k tentativas são bem-sucedidas</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="945">se as execuções fossem independentes: 90% por execução → 43% em k=8</text>

  <line x1="590" y1="234" x2="590" y2="268" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="256" font-size="10" fill="#64748b" font-style="italic" x="700">a tarefa falhou — mas onde?</text>

  <!-- Level 2: trajectory -->
  <rect x="30" y="275" width="1120" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="301" font-size="14" font-weight="700" fill="#5b21b6" x="55">Nível 2 · Trajetória (caixa de vidro)</text>
  <text y="319" font-size="10" fill="#5b21b6" x="55">Pergunta: o percurso foi sólido e eficiente?</text>

  <rect x="55" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="182">Correção das tools</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="182">determinístico, sem necessidade de juiz</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="182">correspondência exata / pela ordem / em qualquer ordem</text>

  <rect x="330" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="457">Correção dos argumentos</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="457">tool correta, parâmetros errados</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="457">% de pares chave-valor preenchidos corretamente</text>

  <rect x="605" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="732">Eficiência e loops</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="732">tool calls redundantes · convergência do percurso</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="732">tool calls idênticos repetidos = beco sem saída</text>

  <rect x="880" y="335" width="235" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="997">Qualidade / adesão ao plano</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="997">bom plano, execução desviada</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="997">fidelidade multi-turno entre turnos</text>

  <line x1="590" y1="429" x2="590" y2="463" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="451" font-size="10" fill="#64748b" font-style="italic" x="700">o percurso falhou no passo 3 — mas porquê?</text>

  <!-- Level 3: component -->
  <rect x="30" y="470" width="1120" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="496" font-size="14" font-weight="700" fill="#9a3412" x="55">Nível 3 · Componente (caixa branca)</text>
  <text y="514" font-size="10" fill="#9a3412" x="55">Pergunta: que decisão, tool, retriever ou subagente falhou?</text>

  <rect x="55" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="225">Métricas por span</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="225">associar pontuações a spans individuais de tool / retrieval</text>

  <rect x="415" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="585">Interpretação do output da tool</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="585">resposta válida, leitura errada — corrompe o processamento a jusante</text>

  <rect x="775" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="945">Atribuição da falha</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="945">a falha visível está geralmente a jusante do bug real</text>
</svg>
