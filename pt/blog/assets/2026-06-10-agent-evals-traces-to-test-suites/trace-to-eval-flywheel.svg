<path d="M270 304h176a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-176a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M270 304h176a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-196a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="274" y="321.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">FOCO · CI</text><text x="274" y="365" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 12px;">Executar testes do lançamento</text><text x="274" y="387" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">bloqueia o merge</text><circle cx="260" cy="304" r="13" fill="#17211B" stroke="#F7F7F4" stroke-width="2" /><text x="260" y="308.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#F7F7F4" text-anchor="middle">6</text>
