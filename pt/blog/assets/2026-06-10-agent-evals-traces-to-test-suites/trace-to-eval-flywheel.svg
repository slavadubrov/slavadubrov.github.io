<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="flywheel-title flywheel-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="flywheel-title">O ciclo trace-to-eval</title><desc id="flywheel-desc">As falhas de produção amostradas são etiquetadas e agrupadas. Os casos golden revistos mantêm variantes com resultados esperados diferentes, são versionados e executados em CI antes do lançamento. O agente disponibilizado produz os próximos traces a analisar.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="flywheel-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="flywheel-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="552" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">O ciclo trace-to-eval</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Transforme execuções falhadas em testes.</text>
<rect x="32" y="120" width="656" height="304" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="146" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">TRANSFORMAR EXECUÇÕES FALHADAS EM TESTES</text>
