<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="The trace-to-eval flywheel" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">O ciclo trace-to-eval</title>
  <defs>
    <marker id="arrFly" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrFlyBack" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a" />
    </marker>
    <filter id="shadowFly" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" x="590">O ciclo Trace-to-Eval</text>
  <text y="57" text-anchor="middle" font-size="12" fill="#334155" x="590">Cada falha de produção diagnosticada torna-se um trace, um rótulo, uma linha do dataset e um scorer que bloqueia a CI</text>

  <!-- Stage 1: Production agent -->
  <rect x="40" y="110" width="200" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="140">1 · Agent de produção</text>
  <text y="164" text-anchor="middle" font-size="10" fill="#334155" x="140">instrumentado com OTel</text>
  <text y="179" text-anchor="middle" font-size="10" fill="#334155" x="140">Spans GenAI semconv:</text>
  <text y="196" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="140">invoke_agent → chat → execute_tool</text>

  <line x1="240" y1="165" x2="295" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrFly)" />

  <!-- Stage 2: Trace store -->
  <rect x="300" y="110" width="200" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="400">2 · Armazém de traces</text>
  <text y="164" text-anchor="middle" font-size="10" fill="#334155" x="400">Langfuse / Phoenix /</text>
  <text y="179" text-anchor="middle" font-size="10" fill="#334155" x="400">LangSmith / Braintrust</text>
  <text y="196" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="400">(ou um ficheiro JSONL para começar)</text>

  <line x1="500" y1="165" x2="555" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrFly)" />

  <!-- Stage 3: Mine failures -->
  <rect x="560" y="110" width="200" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="660">3 · Extrair falhas</text>
  <text y="164" text-anchor="middle" font-size="10" fill="#334155" x="660">pontuações baixas · reclamações dos utilizadores</text>
  <text y="179" text-anchor="middle" font-size="10" fill="#334155" x="660">regras determinísticas · avaliadores</text>
  <text y="196" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="660">codificação aberta: ler 30–50 traces</text>

  <line x1="760" y1="165" x2="815" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrFly)" />

  <!-- Stage 4: Cluster + label -->
  <rect x="820" y="110" width="200" height="110" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="920">4 · Agrupar + rotular</text>
  <text y="164" text-anchor="middle" font-size="10" fill="#334155" x="920">codificação axial em 5–6 modos de falha</text>
  <text y="179" text-anchor="middle" font-size="10" fill="#334155" x="920">com nomes específicos</text>
  <text y="196" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="920">"erro de formatação de data", não "problemas temporais"</text>

  <line x1="920" y1="220" x2="920" y2="285" stroke="#2563eb" stroke-width="2" marker-end="url(#arrFly)" />

  <!-- Stage 5: Dedupe / goldens -->
  <rect x="820" y="290" width="200" height="110" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="920">5 · Eliminar duplicados</text>
  <text y="344" text-anchor="middle" font-size="10" fill="#334155" x="920">um golden representativo</text>
  <text y="359" text-anchor="middle" font-size="10" fill="#334155" x="920">por grupo, com IDs dos spans mantidos</text>
  <text y="376" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="920">nos metadados para rastreabilidade</text>

  <line x1="820" y1="345" x2="765" y2="345" stroke="#2563eb" stroke-width="2" marker-end="url(#arrFly)" />

  <!-- Stage 6: Versioned dataset -->
  <rect x="560" y="290" width="200" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412" x="660">6 · Dataset versionado</text>
  <text y="344" text-anchor="middle" font-size="10" fill="#334155" x="660">goldens-v1.json · v2 · v3 …</text>
  <text y="359" text-anchor="middle" font-size="10" fill="#334155" x="660">ferramentas esperadas + critérios</text>
  <text y="376" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="660">fixados para execuções reproduzíveis</text>

  <line x1="560" y1="345" x2="505" y2="345" stroke="#2563eb" stroke-width="2" marker-end="url(#arrFly)" />

  <!-- Stage 7: CI gate -->
  <rect x="300" y="290" width="200" height="110" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.6" filter="url(#shadowFly)" />
  <text y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#166534" x="400">7 · Gate da CI</text>
  <text y="344" text-anchor="middle" font-size="10" fill="#334155" x="400">voltar a executar o agent em cada PR</text>
  <text y="359" text-anchor="middle" font-size="10" fill="#334155" x="400">métrica falhada → build falhada</text>
  <text y="376" text-anchor="middle" font-size="10" font-style="italic" fill="#334155" x="400">regressões bloqueadas antes do deploy</text>

  <!-- feedback arrow back to production -->
  <path d="M 300 345 L 140 345 L 140 225" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrFlyBack)" />
  <text y="290" font-size="10.5" font-weight="700" fill="#166534" x="148">a correção é enviada em segurança;</text>
  <text y="305" font-size="10.5" font-weight="700" fill="#166534" x="148">o novo tráfego alimenta</text>
  <text y="320" font-size="10.5" font-weight="700" fill="#166534" x="148">o ciclo seguinte</text>

  <!-- Online lane note -->
  <rect x="40" y="450" width="1100" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4" filter="url(#shadowFly)" />
  <text y="480" font-size="13" font-weight="700" fill="#5b21b6" x="65">A decorrer em paralelo com o ciclo: evals online</text>
  <text y="503" font-size="11" fill="#334155" x="65">• Recolher uma amostra do tráfego real e pontuá-la de forma assíncrona com métricas sem referência (conclusão da tarefa, avaliadores personalizados) — latência adicional zero</text>
  <text y="524" font-size="11" fill="#334155" x="65">• Alertar quando o limite inferior do intervalo de confiança da pontuação ultrapassar um limiar — novos padrões de falha entram no ciclo na etapa 3</text>
  <text y="545" font-size="11" fill="#334155" x="65">• Manter as guardrails separadas: inline, determinísticas, bloqueantes (ms) — as evals medem, as guardrails protegem</text>
  <text y="578" font-size="10.5" font-style="italic" fill="#64748b" x="65">O resultado: uma falha diagnosticada torna-se uma armadilha que a próxima versão do agent tem de ultrapassar antes de poder ser enviada.</text>
</svg>
