<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="gve-title gve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="gve-title">Guardrails vs avaliações online</title>
  <desc id="gve-desc">Um guardrail fica inline entre o agent e a resposta e pode bloqueá-la. Um trace amostrado segue para uma avaliação online assíncrona, alertas e o dataset de regressão seguinte, sem atrasar o utilizador.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="40">DUAS VIAS · POSICIONAMENTO, LATÊNCIA E EFEITO DIFERENTES</text>

  <rect x="48" y="64" width="864" height="176" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="68" y="92">CAMINHO DO PEDIDO · MILISSEGUNDOS · PODE BLOQUEAR</text>
  <rect class="box" x="68" y="120" width="160" height="96" rx="10" />
  <text class="kind" x="88" y="154">ENTRADA</text><text class="name" x="88" y="182"><tspan x="88">Pedido do</tspan><tspan x="88" dy="1.2em">utilizador</tspan></text>
  <rect class="box" x="284" y="120" width="160" height="96" rx="10" />
  <text class="kind" x="304" y="154">PROCESSAMENTO</text><text class="name" x="304" y="182"><tspan x="304">Execução do</tspan><tspan x="304" dy="1.2em">agent</tspan></text>
  <rect x="500" y="120" width="176" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="520" y="154" fill="#FF6FB6">FOCO · INLINE</text><text class="name" x="520" y="182" fill="#FF6FB6">Guardrail</text>
  <rect class="box" x="732" y="120" width="160" height="96" rx="10" />
  <text class="kind" x="752" y="154">SAÍDA</text><text class="name" x="752" y="182">Resposta</text>
  <path class="edge" d="M228 168h48" marker-end="url(#gve-arrow)" /><path class="edge" d="M444 168h48" marker-end="url(#gve-arrow)" /><path class="edge" d="M676 168h48" marker-end="url(#gve-arrow)" />

  <rect x="48" y="280" width="864" height="176" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="68" y="308">CAMINHO DE OBSERVAÇÃO · SEGUNDOS A MINUTOS · NUNCA BLOQUEIA</text>
  <rect class="box" x="284" y="336" width="176" height="96" rx="10" />
  <text class="kind" x="304" y="370">AVALIAÇÃO ASSÍNCRONA</text><text class="name" x="304" y="398">Pontuar trace</text>
  <rect class="box" x="516" y="336" width="160" height="96" rx="10" />
  <text class="kind" x="536" y="370">MONITORIZAÇÃO</text><text class="name" x="536" y="398">Cluster de alertas</text>
  <rect class="store" x="732" y="336" width="160" height="96" rx="10" />
  <text class="kind" x="752" y="370">DATASET</text><text class="name" x="752" y="398"><tspan x="752">Adicionar</tspan><tspan x="752" dy="1.2em">exemplo golden</tspan></text>
  <path class="edge" d="M364 216v72h8v40" stroke-dasharray="2 6" marker-end="url(#gve-arrow)" />
  <rect x="376" y="264" width="116" height="24" rx="6" fill="#0C1210" /><text class="note" x="434" y="281" text-anchor="middle">trace amostrado</text>
  <path class="edge" d="M460 384h48" marker-end="url(#gve-arrow)" /><path class="edge" d="M676 384h48" marker-end="url(#gve-arrow)" />
  <text class="note" x="48" y="484">Os guardrails protegem antes da entrega; as avaliações online medem depois da entrega e alimentam a release seguinte.</text>
  <defs><marker id="gve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
