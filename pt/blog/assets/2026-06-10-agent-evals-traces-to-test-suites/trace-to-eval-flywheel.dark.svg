<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tef-title tef-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tef-title">O flywheel de traces para avaliação</title>
  <desc id="tef-desc">Uma trace de produção amostrada é anotada, agrupada, reduzida a um golden representativo, versionada e executada como gate de CI. O agent lançado produz as traces de produção seguintes.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #141D19; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="40">A EVIDÊNCIA DE PRODUÇÃO TORNA-SE UM GATE DE RELEASE</text>

  <g><circle cx="62" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="77" text-anchor="middle">1</text></g>
  <rect class="box" x="48" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="68" y="130">PRODUÇÃO</text><text class="name" x="68" y="158">Trace amostrada</text>
  <g><circle cx="286" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="77" text-anchor="middle">2</text></g>
  <rect class="box" x="272" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="292" y="130">REVISÃO</text><text class="name" x="292" y="158">Anotar falha</text>
  <g><circle cx="510" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="77" text-anchor="middle">3</text></g>
  <rect class="box" x="496" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="516" y="130">ANÁLISE</text><text class="name" x="516" y="158">Agrupar casos</text>
  <g><circle cx="734" cy="72" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="77" text-anchor="middle">4</text></g>
  <rect class="store" x="720" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="740" y="130">GOLDEN</text><text class="name" x="740" y="158">Manter um caso</text>
  <path class="edge" d="M240 144h24" marker-end="url(#tef-arrow)" /><path class="edge" d="M464 144h24" marker-end="url(#tef-arrow)" /><path class="edge" d="M688 144h24" marker-end="url(#tef-arrow)" />

  <path class="edge" d="M816 192v56" marker-end="url(#tef-arrow)" />
  <g><circle cx="734" cy="224" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="229" text-anchor="middle">5</text></g>
  <rect class="store" x="720" y="256" width="192" height="96" rx="10" />
  <text class="kind" x="740" y="290">DATASET</text><text class="name" x="740" y="318">Versionar goldens</text>
  <g><circle cx="510" cy="224" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="229" text-anchor="middle">6</text></g>
  <rect x="496" y="256" width="192" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="516" y="290" fill="#FF6FB6">FOCO · CI</text><text class="name" x="516" y="318" fill="#FF6FB6">Bloquear regressões</text>
  <g><circle cx="286" cy="224" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="229" text-anchor="middle">7</text></g>
  <rect class="box" x="272" y="256" width="192" height="96" rx="10" />
  <text class="kind" x="292" y="290">RELEASE</text><text class="name" x="292" y="318">Lançar agent</text>
  <path class="edge" d="M720 304h-24" marker-end="url(#tef-arrow)" /><path class="edge" d="M496 304h-24" marker-end="url(#tef-arrow)" />
  <path class="edge" d="M368 352v32H144V200" stroke-dasharray="2 6" marker-end="url(#tef-arrow)" />
  <rect x="156" y="372" width="176" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="244" y="389" text-anchor="middle">novo tráfego · ciclo seguinte</text>
  <text class="note" x="48" y="424">Uma falha diagnosticada só fica resolvida quando a versão seguinte do agent é obrigada a ultrapassá-la.</text>
  <defs><marker id="tef-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
