<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 632" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="stack-title">Onde se enquadra cada parte da série Engineering the Agentic Stack</title>
  <desc id="stack-desc">Um modelo propõe ações através do reasoning loop da Parte 1. O harness reúne contexto, disponibiliza tools, verifica permissões e avalia evidências. O runtime executa os tool calls aceites e persiste o estado. Os resultados regressam ao modelo para o turno seguinte.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
    .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="1120" height="632" rx="14" />
  <text class="section" x="48" y="44">UM TURNO — DA PROPOSTA À EVIDÊNCIA</text>
  <rect class="process" x="184" y="64" width="752" height="62" rx="10" /><text class="kind" x="208" y="88">MODELO</text><text class="name" x="208" y="111">Propor a ação seguinte</text>
  <path class="edge" d="M560 126v32" marker-end="url(#stack-arrow)" />
  <rect class="focus" x="184" y="168" width="752" height="62" rx="10" /><text class="kind focus-kind" x="208" y="192">FOCO · PARTE 1</text><text class="name focus-name" x="208" y="215">O reasoning loop define a ordem das propostas</text>
  <path class="edge" d="M560 230v32" marker-end="url(#stack-arrow)" /><rect class="canvas" x="577" y="240" width="98" height="24" rx="6" /><text class="note" x="626" y="257" text-anchor="middle" style="font-size: 12px;">tool call proposto</text>
  <rect class="group" x="48" y="272" width="1024" height="176" rx="12" /><text class="section" x="72" y="300">HARNESS · PARTES 2, 3, 4, 6 — AUTORIZAR UM TURNO</text>
  <rect class="process" x="72" y="320" width="220" height="96" rx="10" /><text class="kind" x="92" y="350">PARTE 2 · CONTEXTO</text><text class="name" x="92" y="378">Reunir memória</text><text class="note" x="92" y="399">recall · documentos · handoff</text>
  <rect class="process" x="316" y="320" width="220" height="96" rx="10" /><text class="kind" x="336" y="350">PARTE 3 · CONTRATO</text><text class="name" x="336" y="378">Disponibilizar tools</text><text class="note" x="336" y="399">ações · schemas · resultados</text>
  <rect class="process" x="560" y="320" width="220" height="96" rx="10" /><text class="kind" x="580" y="350">PARTE 4 · POLÍTICA</text><text class="name" x="580" y="378">Verificar permissões</text><text class="note" x="580" y="399" style="font-size: 12px;">permitido · agora · sem supervisão</text>
  <rect class="process" x="804" y="320" width="244" height="96" rx="10" /><text class="kind" x="824" y="350">PARTE 6 · EVIDÊNCIA</text><text class="name" x="824" y="378">Avaliar conclusão</text><text class="note" x="824" y="399">aceitar · repetir · fazer handoff</text>
  <path class="edge" d="M292 368h16" marker-end="url(#stack-arrow)" /><path class="edge" d="M536 368h16" marker-end="url(#stack-arrow)" /><path class="edge" d="M780 368h16" marker-end="url(#stack-arrow)" />
  <path class="edge" d="M560 448v32" marker-end="url(#stack-arrow)" /><rect class="canvas" x="577" y="458" width="94" height="24" rx="6" /><text class="note" x="624" y="475" text-anchor="middle">tool call aceite</text>
  <rect class="store" x="184" y="490" width="752" height="96" rx="10" /><text class="kind" x="208" y="520">PARTE 5 · ARMAZENAMENTO DO RUNTIME</text><text class="name" x="208" y="548">Executar e persistir fora do worker</text><text class="note" x="208" y="569">registo da sessão · sandbox · checkpoint · trace</text>
  <path class="edge" d="M184 538H48a24 24 0 0 1-24-24V95a24 24 0 0 1 24-24h128" marker-end="url(#stack-arrow)" /><text class="note" x="16" y="300" text-anchor="middle" transform="rotate(-90 16 300)">os resultados tornam-se contexto para o turno seguinte</text>
  <text class="note" x="48" y="614">O loop decide o que propor. O harness autoriza. O runtime executa.</text>
  <defs><marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
