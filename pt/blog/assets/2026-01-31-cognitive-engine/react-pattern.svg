<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="react-title react-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="react-title">O ReAct lê cada resultado de tool antes de escolher a ação seguinte</title>
  <desc id="react-desc">Um loop da esquerda para a direita executa pensamento, ação e observação. A observação é destacada porque regressa ao pensamento seguinte e permite ao agente mudar de direção após cada tool call.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="960" height="360" rx="14" />
  <text class="note" x="48" y="42">Uma chamada ao modelo escolhe um movimento. Novas evidências podem alterar o movimento seguinte.</text>
  <rect class="process" x="48" y="88" width="240" height="96" rx="10" /><text class="kind" x="68" y="122">MODELO · PENSAMENTO</text><text class="name" x="68" y="150">Escolher o movimento seguinte</text><text class="note" x="68" y="169">raciocinar a partir do histórico atual</text>
  <rect class="process" x="360" y="88" width="240" height="96" rx="10" /><text class="kind" x="380" y="122">TOOL · AÇÃO</text><text class="name" x="380" y="150">Executar uma chamada</text><text class="note" x="380" y="169">agir antes de continuar o planeamento</text>
  <rect class="focus" x="672" y="88" width="240" height="96" rx="10" /><text class="kind focus-kind" x="692" y="122">FOCO · OBSERVAÇÃO</text><text class="name focus-name" x="692" y="150">Ler o resultado real</text><text class="note" x="692" y="169">fundamentar o pensamento seguinte</text>
  <path class="edge" d="M288 136h64" marker-end="url(#react-arrow)" /><path class="edge" d="M600 136h64" marker-end="url(#react-arrow)" />
  <path class="edge conditional" d="M792 184v56a16 16 0 0 1-16 16H184a16 16 0 0 1-16-16v-48" marker-end="url(#react-arrow)" />
  <rect class="canvas" x="373" y="244" width="214" height="24" rx="6" /><text class="note" x="480" y="261" text-anchor="middle">ainda não terminou → repetir com evidências</text>
  <text class="note" x="48" y="328">Trade-off: cada loop volta a processar o histórico crescente, aumentando a latência e o custo em tokens.</text>
  <defs><marker id="react-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
