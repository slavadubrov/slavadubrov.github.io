<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">Um router envia uma pergunta de mercado para um de dois reasoning loops que escrevem no mesmo estado tipado.</title><desc id="planexecarch-desc">Um router classifica uma pergunta de mercado como deep research ou flash briefing. O deep research executa Plan-and-Execute: um planner escreve 4–6 passos, um executor executa cada um como um ReAct loop e um reporter redige o relatório. O flash briefing executa ReWOO: um planner escreve um grafo de dependências de ferramentas, um worker executa-o e um solver sintetiza um resultado. O reporter e o solver ReWOO escrevem ambos num único objeto de estado tipado partilhado, embora apenas a rota de deep research passe pelo reporter — o solver ReWOO escreve diretamente no estado.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="planexecarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="planexecarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1080" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Um router, dois reasoning loops, um estado</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">O solver ReWOO escreve diretamente no estado; apenas o deep research passa por um reporter.</text>
