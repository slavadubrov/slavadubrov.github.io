<text x="32" y="1026" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13px;">O schema do estado não se divide por padrão — o routing é código de conversão, não três schemas separados.</text>
<text x="32" y="1048" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Um avaliador com contexto novo e um human-in-the-loop de aprovação situam-se a jusante de ambas as</tspan><tspan x="32" dy="1.2em">rotas, mas foram omitidos para manter os dois loops legíveis.</tspan></text>
