<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rewoo-title rewoo-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rewoo-title">ReWOO planeia o grafo de dependências antes da execução das ferramentas</title>
  <desc id="rewoo-desc">Uma única chamada do planner cria um grafo completo de dependências das ferramentas. Um worker que não é um modelo executa as chamadas independentes E1 e E2 em paralelo e, depois, a chamada dependente E3. Uma única chamada do solver sintetiza todos os resultados.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; stroke-dasharray: 6 5; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .async { stroke-dasharray: 2 6; } .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="960" height="464" rx="14" /><text class="note" x="48" y="42">O reasoning ocorre antes da execução; os workers preenchem placeholders sem chamar o modelo.</text>
  <rect class="focus" x="48" y="72" width="240" height="96" rx="10" /><text class="kind focus-kind" x="68" y="106">FOCO · PLANNER</text><text class="name focus-name" x="68" y="134">Escrever o grafo completo</text><text class="note" x="68" y="153">uma chamada LLM · #E1, #E2, #E3</text>
  <path class="edge" d="M288 120h56v72" marker-end="url(#rewoo-arrow)" />
  <rect class="group" x="344" y="72" width="568" height="232" rx="12" /><text class="kind" x="368" y="100">WORKER · EXECUTOR NÃO-LLM</text>
  <rect class="process" x="368" y="120" width="160" height="62" rx="10" /><text class="kind" x="388" y="144">FERRAMENTA · #E1</text><text class="name" x="388" y="168">Dados de preços</text>
  <rect class="process" x="728" y="120" width="160" height="62" rx="10" /><text class="kind" x="748" y="144">FERRAMENTA · #E2</text><text class="name" x="748" y="168">Notícias recentes</text>
  <rect class="store" x="548" y="218" width="160" height="62" rx="10" /><text class="kind" x="568" y="242">FERRAMENTA · #E3</text><text class="name" x="568" y="266" style="font-size: 15.5px;">Comparar #E1, #E2</text>
  <path class="edge async" d="M448 182v24a16 16 0 0 0 16 16h76" marker-end="url(#rewoo-arrow)" /><path class="edge async" d="M808 182v24a16 16 0 0 1-16 16h-76" marker-end="url(#rewoo-arrow)" />
  <path class="edge" d="M628 280v52" marker-end="url(#rewoo-arrow)" />
  <rect class="process" x="508" y="340" width="240" height="96" rx="10" /><text class="kind" x="528" y="374">MODELO · SOLVER</text><text class="name" x="528" y="402">Sintetizar resultados</text><text class="note" x="528" y="421">uma chamada LLM final</text>
  <text class="note" x="48" y="350">Rápido quando o grafo se mantém válido.</text><text class="note" x="48" y="374">Frágil quando uma ferramenta altera o plano.</text>
  <defs><marker id="rewoo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
