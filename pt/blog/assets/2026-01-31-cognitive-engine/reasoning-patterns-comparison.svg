<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 544" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="compare-title compare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="compare-title">ReAct, ReWOO e Plan-and-Execute diferem no momento em que a evidência pode alterar o plano</title>
  <desc id="compare-desc">Três faixas alinhadas comparam o fluxo de controlo e o timing do plano. ReAct decide após cada observação. ReWOO fixa o grafo completo de dependências antes da execução. Plan-and-Execute fixa um plano geral, mas pode revê-lo nos checkpoints de cada passo.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; } .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="1120" height="544" rx="14" /><text class="section" x="48" y="44">AS MESMAS FERRAMENTAS, DIFERENTE PONTO DE COMPROMISSO</text>
  <rect class="group" x="48" y="64" width="320" height="296" rx="12" /><rect class="group" x="400" y="64" width="320" height="296" rx="12" /><rect class="group" x="752" y="64" width="320" height="296" rx="12" />
  <rect class="process" x="72" y="88" width="272" height="96" rx="10" /><text class="kind" x="92" y="122">PADRÃO · INTERATIVO</text><text class="name" x="92" y="150">ReAct</text><text class="note" x="92" y="169">pensamento → ação → observação ↺</text>
  <rect class="process" x="424" y="88" width="272" height="96" rx="10" /><text class="kind" x="444" y="122">PADRÃO · DESACOPLADO</text><text class="name" x="444" y="150">ReWOO</text><text class="note" x="444" y="169">planner → grafo de workers → solver</text>
  <rect class="process" x="776" y="88" width="272" height="96" rx="10" /><text class="kind" x="796" y="122">PADRÃO · HIERÁRQUICO</text><text class="name" x="796" y="150">Plan-and-Execute</text><text class="note" x="796" y="169">planner → ciclos por passo → replanner</text>
  <path class="edge" d="M208 184v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M560 184v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M912 184v32" marker-end="url(#compare-arrow)" />
  <rect class="store" x="72" y="224" width="272" height="96" rx="10" /><text class="kind" x="92" y="258">TIMING DO PLANO</text><text class="name" x="92" y="286">Um passo de cada vez</text><text class="note" x="92" y="305">maior adaptabilidade · chamadas repetidas</text>
  <rect class="store" x="424" y="224" width="272" height="96" rx="10" /><text class="kind" x="444" y="258">TIMING DO PLANO</text><text class="name" x="444" y="286">Grafo completo à partida</text><text class="note" x="444" y="305">menor adaptabilidade · menos chamadas</text>
  <rect class="store" x="776" y="224" width="272" height="96" rx="10" /><text class="kind" x="796" y="258">TIMING DO PLANO</text><text class="name" x="796" y="286">Plano, depois checkpoints</text><text class="note" x="796" y="305">adaptabilidade média · mais estado</text>
  <rect class="focus" x="48" y="400" width="1024" height="96" rx="10" /><text class="kind focus-kind" x="72" y="430">FOCO · ONDE PODE A EVIDÊNCIA ALTERAR O PLANO?</text><text class="name focus-name" x="72" y="462">ReAct: todos os resultados</text><text class="name focus-name" x="400" y="462">ReWOO: apenas lógica de fallback</text><text class="name focus-name" x="776" y="462">Plan-and-Execute: checkpoints</text><text class="note" x="72" y="484">Escolha com base no ponto em que é provável que uma suposição errada venha ao de cima; depois meça o custo e a latência nas suas próprias tarefas.</text>
  <path class="edge" d="M208 360v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M560 360v32" marker-end="url(#compare-arrow)" /><path class="edge" d="M912 360v32" marker-end="url(#compare-arrow)" />
  <defs><marker id="compare-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
