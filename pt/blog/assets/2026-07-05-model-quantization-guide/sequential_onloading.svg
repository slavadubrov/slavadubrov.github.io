<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="100%" data-visual-system="byte-diagram-v1" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" aria-labelledby="artifact-title artifact-desc">
  <title id="artifact-title">Offline Quantization vs. Online Serving Memory Mechanics</title>
  <desc id="artifact-desc">Offline Quantization vs. Online Serving Memory Mechanics.</desc>
  <defs>
    <!-- Drop Shadow Filter -->

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="850" height="520" fill="#F7F7F4" rx="12" />

  <!-- Title -->
  <text y="40" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B" x="30">
    Offline Quantization vs. Online Serving Memory Mechanics
  </text>
  <text y="60" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#17211B" x="30">
    How sequential layer onloading allows single-GPU offline calibration for massive models
  </text>

  <!-- Divider Line -->
  <line x1="425" y1="90" x2="425" y2="490" stroke="#59645E" stroke-dasharray="5,5" stroke-width="2" />

  <!-- SECTION 1: OFFLINE QUANTIZATION -->
  <g>
    <!-- Subtitle -->
    <rect x="30" y="90" width="365" height="30" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="6" />
    <text y="110" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#17211B" x="212.5">
      A. Offline Quantization (Sequential Onloading)
    </text>
    <text y="142" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="212.5">
      Transient process: quantizes one transformer block at a time
    </text>

    <!-- System RAM / Disk -->
    <rect x="50" y="165" width="140" height="150" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8" />
    <text y="185" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="120">System Host RAM</text>

    <!-- Full model layers -->
    <rect x="60" y="195" width="120" height="20" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="3" />
    <text y="208" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="120">Layers 1..i-1 (Quantized)</text>

    <rect x="60" y="222" width="120" height="24" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="3" />
    <text y="237" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" x="120">Layer i (BF16)</text>

    <rect x="60" y="253" width="120" height="20" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="3" />
    <text y="266" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="120">Layers i+1..L (BF16)</text>

    <!-- RAM to VRAM Transfer Arrow -->
    <path d="M 195 234 C 215 234, 215 200, 235 200" fill="none" stroke="#17211B" stroke-width="2" marker-end="url(#arrow-blue)" />
    <text y="190" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" font-weight="600" x="215">Onload Layer i</text>

    <!-- GPU VRAM -->
    <rect x="250" y="165" width="140" height="150" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8" />
    <text y="185" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="320">GPU VRAM (HBM)</text>

    <!-- VRAM layer content -->
    <rect x="260" y="195" width="120" height="24" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="3" />
    <text y="210" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" x="320">Active Layer i (BF16)</text>

    <rect x="260" y="226" width="120" height="35" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="3" />
    <text y="238" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="320">Hessian Buffers</text>
    <text y="249" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="320">Used for rounding</text>

    <rect x="260" y="268" width="120" height="22" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" rx="3" />
    <text y="282" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B" x="320">Calibration Acts</text>

    <!-- VRAM to RAM Transfer Arrow (offload) -->
    <path d="M 250 290 C 230 290, 230 305, 195 305" fill="none" stroke="#59645E" stroke-width="2" marker-end="url(#arrow-green)" />
    <text y="322" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" font-weight="600" x="215">Offload Quantized</text>

  <!-- Sizing Callout -->
  <rect x="50" y="335" width="340" height="155" fill="#FFFFFF" rx="6" stroke="#17211B"  class="visual-focus"/>
  <text class="kind-tag" y="352" text-anchor="middle" font-size="11" fill="#59645E" x="220">FOCUS</text>
  <text y="371" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="220">Transient Memory Footprint</text>
  <text y="391" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      Peak VRAM ≈ active layer (BF16) + Hessian + acts
    </text>
  <text y="411" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      • Allows quantizing 70B models on 1x 80GB GPU.
    </text>
  <text y="431" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      • CPU RAM stores the full source weights.
    </text>
  <text y="451" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      • High disk/RAM bandwidth avoids execution bottlenecks.
    </text>
  <text y="481" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B" x="220">Run time scales with model parameters, not VRAM peak.</text>
  </g>

  <!-- SECTION 2: ONLINE SERVING -->
  <g transform="translate(425, 0)">
    <!-- Subtitle -->
    <rect x="30" y="90" width="365" height="30" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" rx="6" />
    <text y="110" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#17211B" x="212.5">
      B. Online Serving (Persistent Residence)
    </text>
    <text y="142" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="212.5">
      Runtime serving: all model weights must reside in VRAM
    </text>

    <!-- GPU VRAM Serving -->
    <rect x="50" y="165" width="340" height="150" fill="#ffffff" stroke="#59645E" stroke-width="1.5" rx="8" />
    <text y="185" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="220">GPU VRAM (HBM) during Serving</text>

    <!-- All weights stacked -->
    <rect x="65" y="195" width="310" height="40" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="213" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" x="220">All Quantized Weights (Layers 1 to L)</text>
    <text y="226" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">Stored permanently (e.g. 35 GB / 70 GB)</text>

    <!-- KV cache dynamic -->
    <rect x="65" y="242" width="310" height="35" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="256" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" x="220">KV Cache (PagedAttention)</text>
    <text y="268" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">Scales with context and batch size</text>

    <!-- Engine overhead -->
    <rect x="65" y="283" width="310" height="24" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" rx="4" />
    <text y="298" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" x="220">Engine activations + CUDA context</text>

    <!-- Sizing Callout -->
    <rect x="50" y="335" width="340" height="155" fill="#FFFFFF" rx="6" stroke="#17211B" />
    <text y="355" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17211B" x="220">Serving Memory Footprint</text>
    <text y="375" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      Total GPU target ≈ weights + KV cache + overhead + buffer
    </text>
    <text y="395" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      • Must hold all model weights in fast memory concurrently.
    </text>
    <text y="415" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      • KV cache scales dynamically and can easily exceed weights.
    </text>
    <text y="435" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17211B" x="220">
      • OOM occurs if concurrency * context size exhausts VRAM.
    </text>
    <text y="465" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#17211B" x="220">Serving is memory-bandwidth-bound during decode.</text>
  </g>

  <!-- Markers -->
  <defs>



    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F2F2F5" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F2F2F5" />
    </marker>
  </defs>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
