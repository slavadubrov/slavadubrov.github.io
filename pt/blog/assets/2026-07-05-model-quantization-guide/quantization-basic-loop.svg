<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Como a quantização mapeia valores de alta precisão para buckets de baixa precisão</title>
  <desc id="desc">Diagrama da esquerda para a direita que mostra valores de precisão total, seleção da escala, buckets inteiros, valores desquantizados e o orçamento de erro.</desc>
  <defs>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M1,2 L7,5 L1,8 Z" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
    <style>
      .bg { fill: #F7F7F4; }
      .card { fill: #ffffff; stroke: #D8DDD9; stroke-width: 1.5; filter: url(#shadow); }
      .title { font-style: normal; font-weight: 700; font-size: 24px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
      .subtitle { font-style: normal; font-weight: 400; font-size: 15px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #FFFFFF; }
      .label { font-style: normal; font-weight: 700; font-size: 16px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
      .text { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
      .code-bg { fill: #F7F7F4; stroke: #59645E; stroke-width: 1.5; }
      .mono { font-style: normal; font-weight: 600; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #FFFFFF; }
      .mono-red { font-style: normal; font-weight: 700; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #F2F2F5; }
      .mono-blue { font-style: normal; font-weight: 700; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #F2F2F5; }
      .mono-green { font-style: normal; font-weight: 700; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #FFFFFF; }
      .mono-purple { font-style: normal; font-weight: 700; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #F2F2F5; }
      .mono-orange { font-style: normal; font-weight: 700; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #F2F2F5; }
      .blue-header { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
      .orange-header { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; }
      .purple-header { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
      .green-header { fill: #FFFFFF; stroke: #59645E; stroke-width: 1.5; }
      .red-header { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
      .arrow { stroke: #17211B; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 4 2; }
      .border-highlight { stroke: #17211B; stroke-width: 2; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1120" height="640" rx="12" />

  <!-- Title and Subtitle -->
  <text class="title" y="52" x="48">O loop de quantização-desquantização</text>
  <text class="subtitle" y="78" x="48">Rastrear como os valores de alta precisão são mapeados para buckets de baixa precisão e reconstruídos durante a inferência.</text>

  <!-- 1. Original Weights (BF16) -->
  <g transform="translate(48 115)">
    <rect class="card" width="230" height="300" rx="8" />
    <rect class="blue-header" x="1" y="1" width="228" height="42" rx="7 7 0 0" />
    <text class="label" y="27" x="16">1. Pesos originais</text>
    <text class="text" y="70" x="16">Os pesos começam como floats BF16 ou</text>
    <text class="text" y="88" x="16">FP32 em disco.</text>

    <!-- Visual Tensor representation -->
    <rect class="code-bg" x="16" y="115" width="198" height="120" rx="6" />
    <text class="mono" y="140" x="28">Tensor FP32/BF16:</text>
    <text class="mono-blue" y="165" x="28">[ 2.10,  -1.20,</text>
    <text class="mono-orange" y="190" x="44">0.40<tspan fill="#59645E" font-weight="normal">,  -0.80 ]</tspan></text>
    <text class="text" y="260" x="16">Acompanhar valor <tspan font-weight="bold" fill="#59645E">0.40</tspan> as it</text>
    <text class="text" y="278" x="16">passa pelo loop.</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path class="arrow" d="M288 265 L318 265" />

  <!-- 2. Calculate Scale (s) -->
  <g transform="translate(328 115)">
    <rect class="card" width="230" height="300" rx="8" />
    <rect class="orange-header" x="1" y="1" width="228" height="42" rx="7 7 0 0" />
    <text class="label" y="27" x="16">2. Calcular a escala</text>
    <text class="text" y="70" x="16">Calcular a escala <tspan font-style="italic" font-weight="bold">s</tspan> to map</text>
    <text class="text" y="88" x="16">dos pesos para o intervalo de 4 bits</text>
    <text class="text" y="106" x="16">de <tspan font-weight="bold">[-7, 7]</tspan> (signed INT4).</text>

    <!-- Scale Calculation Box -->
    <rect class="code-bg" x="16" y="135" width="198" height="100" rx="6" />
    <text class="mono" y="160" x="28">s = max(|x|) / q_max</text>
    <text class="mono" y="185" x="28">s = 2.10 / 7</text>
    <text class="mono-orange" y="212" x="28">s = 0.30</text>

    <text class="text" y="260" x="16">A escala é armazenada juntamente com os</text>
    <text class="text" y="278" x="16">pesos quantizados.</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path class="arrow" d="M568 265 L598 265" />

  <!-- 3. Quantize & Store -->
  <g transform="translate(608 115)">
    <rect class="card" width="230" height="300" rx="8" />
    <rect class="purple-header" x="1" y="1" width="228" height="42" rx="7 7 0 0" />
    <text class="label" y="27" x="16">3. Quantizar e armazenar</text>
    <text class="text" y="70" x="16">Dividir pela escala, arredondar para o</text>
    <text class="text" y="88" x="16">inteiro mais próximo e armazenar.</text>

    <!-- Quantized Tensor Box -->
    <rect class="code-bg" x="16" y="115" width="198" height="120" rx="6" />
    <text class="mono" y="138" x="28">x_q = round(x / s)</text>
    <text class="mono-purple" y="162" x="28">[ 7,  -4,  1,  -3 ]</text>

    <line x1="28" y1="178" x2="200" y2="178" stroke="#59645E" stroke-width="1.5" />

    <!-- Tracking 0.40 rounding details -->
    <text class="mono" y="196" x="28">Para 0.40:</text>
    <text class="mono" y="214" x="28">0.40 / 0.3 = 1.33 <tspan fill="#59645E" font-weight="bold">→ 1</tspan></text>

    <text class="text" y="260" x="16">Os pesos passam a ser armazenados em</text>
    <text class="text" y="278" x="16">4 bits (75% mais pequenos!).</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path class="arrow" d="M848 265 L878 265" />

  <!-- 4. Dequantize & GEMM -->
  <g transform="translate(888 115)">
    <rect class="card" width="184" height="300" rx="8" />
    <rect class="green-header" x="1" y="1" width="182" height="42" rx="7 7 0 0" />
    <text class="label" y="27" x="16">4. Desquantizar e GEMM</text>
    <text class="text" y="70" x="16">Converter novamente para BF16 para a</text>
    <text class="text" y="88" x="16">multiplicação de matrizes.</text>

    <!-- Dequantized representation -->
    <rect class="code-bg" x="16" y="115" width="152" height="120" rx="6" />
    <text class="mono" y="140" x="24">Desquantizado:</text>
    <text class="mono-green" y="165" x="24">[ 2.1, -1.2, </text>
    <text class="mono-green" y="190" x="24">  0.3, -0.9 ]</text>
    <text class="text" y="215" x="24"><tspan font-weight="bold" fill="#59645E">0.40 → 0.30</tspan></text>

    <!-- GEMM Box -->
    <rect x="16" y="247" width="152" height="40" rx="6" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" class="visual-focus" />
    <text class="mono" y="272" fill="#ffffff" x="26">Multiplicação de matrizes GEMM</text>
  </g>

  <!-- Bottom: The Error Budget Card -->
  <g transform="translate(48 440)">
    <rect class="card" width="1024" height="175" rx="8" />
    <rect class="red-header" x="1" y="1" width="1022" height="42" rx="7 7 0 0" />
    <text class="label" y="27" x="24">Compreender o orçamento de erro e o GEMM</text>

    <!-- Columns inside error budget -->
    <text class="mono" y="70" x="24">Ruído de arredondamento:</text>
    <text class="text" y="92" x="24">Arredondar pesos contínuos para buckets inteiros discretos introduz</text>
    <text class="text" y="110" x="24">pequenos erros matemáticos (por exemplo, <tspan fill="#59645E" font-weight="bold">0.40 → 0.30</tspan>).</text>
    <text class="text" y="128" x="24">Fórmulas simétricas: <tspan font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">x_q = clip(round(x/s))</tspan> and <tspan font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">x_approx = x_q × s</tspan>.</text>
    <text class="text" y="146" x="24">Algoritmos como <tspan font-weight="bold">AWQ</tspan> and <tspan font-weight="bold">GPTQ</tspan> optimize scales to minimize this error.</text>

    <line x1="590" y1="50" x2="590" y2="162" stroke="#D8DDD9" stroke-width="1.5" />

    <text class="mono" y="70" x="614">O que é GEMM?</text>
    <text class="text" y="92" x="614"><tspan font-weight="bold">GEMM</tspan> stands for <tspan font-weight="bold">Multiplicação geral de matrizes</tspan>. It is the</text>
    <text class="text" y="110" x="614">operação matemática central das redes neuronais</text>
    <text class="text" y="128" x="614">(<tspan font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">Saída = Ativações × Pesos</tspan>).</text>
    <text class="text" y="146" x="614">Os modelos quantizados executam GEMM utilizando pesos desquantizados on-the-fly.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
