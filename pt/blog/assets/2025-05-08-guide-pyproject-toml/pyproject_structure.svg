<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Quatro fronteiras de responsabilidade em pyproject.toml</title>
  <desc id="desc">Quatro cartões distinguem build-system, para o backend de build; project, para metadados publicados; dependency-groups, para ambientes não publicados; e namespaces tool, para definições específicas de cada ferramenta.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="650" rx="28" fill="#0f172a" />
  <text x="600" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="31" font-weight="700">Um ficheiro, quatro responsáveis</text>
  <text x="600" y="104" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">Classifique uma definição pelo consumidor antes de escolher uma tabela</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(70 155)"><rect width="500" height="185" rx="20" fill="#1d4ed8" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[build-system]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Responsável: frontend e backend de build</text><text x="30" y="124" fill="#93c5fd" font-size="16">identidade do backend • requisitos de build isolados</text><text x="30" y="154" fill="#93c5fd" font-size="16">árvore de código → sdist e wheel</text></g>
    <g transform="translate(630 155)"><rect width="500" height="185" rx="20" fill="#5b21b6" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[project]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Responsável: consumidores do pacote</text><text x="30" y="124" fill="#c4b5fd" font-size="16">identidade • requisitos de runtime • extras</text><text x="30" y="154" fill="#c4b5fd" font-size="16">publicado como metadados da distribuição</text></g>
    <g transform="translate(70 385)"><rect width="500" height="185" rx="20" fill="#166534" /><text x="30" y="48" fill="#93c5fd" font-size="23" font-weight="700">[dependency-groups]</text><text x="30" y="88" fill="#93c5fd" font-size="18">Responsável: fluxo de trabalho local</text><text x="30" y="124" fill="#93c5fd" font-size="16">testes • lint • documentação • ambientes que não são de pacotes</text><text x="30" y="154" fill="#93c5fd" font-size="16">não publicado nos metadados do pacote</text></g>
    <g transform="translate(630 385)"><rect width="500" height="185" rx="20" fill="#9a3412" /><text x="30" y="48" fill="#fdba74" font-size="23" font-weight="700">[tool.*]</text><text x="30" y="88" fill="#fdba74" font-size="18">Responsável: a ferramenta indicada</text><text x="30" y="124" fill="#fdba74" font-size="16">chaves e semântica definidas pela ferramenta</text><text x="30" y="154" fill="#fdba74" font-size="16">não existe um schema partilhado entre namespaces</text></g>
  </g>
</svg>
