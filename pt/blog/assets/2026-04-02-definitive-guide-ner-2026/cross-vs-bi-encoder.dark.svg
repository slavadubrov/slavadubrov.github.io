<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="cb-title cb-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="cb-title">Trabalho necessário com cross-encoder e bi-encoder para um inventário de labels reutilizável</title>
  <desc id="cb-desc">Um cross-encoder re-encoda conjuntamente os labels com cada documento. Um bi-encoder codifica separadamente os labels e o texto, permitindo colocar em cache e reutilizar os embeddings dos labels. O foco é o cache reutilizável.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .metric { font: 600 15px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="608" rx="14" fill="#0C1210" />
  <defs><marker id="cb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <rect class="group" x="48" y="48" width="412" height="512" rx="12" /><rect class="group" x="500" y="48" width="412" height="512" rx="12" />
  <text class="section" x="72" y="80">CROSS-ENCODER · TRABALHO REPETIDO</text><text class="section" x="524" y="80">BI-ENCODER · REUTILIZAÇÃO DO TRABALHO</text>
  <path class="edge" d="M254 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M254 252v40" marker-end="url(#cb-arrow)" /><path class="edge" d="M594 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M818 158v32" marker-end="url(#cb-arrow)" /><path class="edge" d="M594 252v40" marker-end="url(#cb-arrow)" /><path class="edge" d="M818 252v16h86v142h-86v18" marker-end="url(#cb-arrow)" /><path class="edge" d="M706 388v40" marker-end="url(#cb-arrow)" />
  <rect class="box" x="72" y="96" width="364" height="62" rx="10" fill="#1B2621" /><text class="kind" x="92" y="121">ENTRADA</text><text class="name" x="92" y="146">Labels + texto numa sequência</text>
  <rect class="box" x="72" y="190" width="364" height="62" rx="10" fill="#141D19" /><text class="kind" x="92" y="215">PROCESSAMENTO</text><text class="name" x="92" y="240">Atenção conjunta sobre ambos</text>
  <rect class="box" x="72" y="292" width="364" height="96" rx="10" fill="#141D19" /><text class="kind" x="92" y="326">PROCESSAMENTO</text><text class="name" x="92" y="354">Pontuação span × tipo</text><text class="note" x="92" y="376">Cada documento repete a codificação dos labels.</text>
  <text class="kind" x="72" y="448">COM 1 024 TIPOS</text><text class="metric" x="72" y="478">10,7 → 0,14 exemplos/s</text><text class="note" x="72" y="504">gliner_small-v2.5 · redução de 98,7%</text><text class="note" x="72" y="530">Um H100 · batch 1 · condições do artigo</text>
  <rect class="box" x="524" y="96" width="140" height="62" rx="10" fill="#1B2621" /><text class="kind" x="544" y="121">LABELS</text><text class="name" x="544" y="146">Lista de tipos</text>
  <rect class="box" x="748" y="96" width="140" height="62" rx="10" fill="#1B2621" /><text class="kind" x="768" y="121">TEXTO</text><text class="name" x="768" y="146">Documento</text>
  <rect class="box" x="524" y="190" width="140" height="62" rx="10" fill="#141D19" /><text class="kind" x="544" y="215">PROCESSAMENTO</text><text class="name" x="544" y="240">Encoder de labels</text>
  <rect class="box" x="748" y="190" width="140" height="62" rx="10" fill="#141D19" /><text class="kind" x="768" y="215">PROCESSAMENTO</text><text class="name" x="768" y="240">Encoder de texto</text>
  <rect x="524" y="292" width="364" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="548" y="326" fill="#FF6FB6">FOCO · ARMAZENAR</text><text class="name" x="548" y="354" fill="#FF6FB6">Embeddings de labels em cache</text><text class="note" x="548" y="376" fill="#FF6FB6">Pré-calcular uma vez; reutilizar em vários documentos.</text>
  <rect class="box" x="524" y="428" width="364" height="62" rx="10" fill="#141D19" /><text class="kind" x="548" y="453">PROCESSAMENTO</text><text class="name" x="548" y="478">Pontuação tardia span × tipo</text>
  <text class="kind" x="524" y="524">COM 1 024 TIPOS</text><text class="metric" x="524" y="550">19,3 → 18,3 exemplos/s · redução de 5,2%</text><text class="note" x="524" y="578">gliner-bi-edge-v2.0 pré-calculado · até 130× no artigo</text>
</svg>
