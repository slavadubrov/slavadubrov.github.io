<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tt-title tt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tt-title">Encaminhamento NER em três níveis por tipo de tarefa de extração</title>
  <desc id="tt-desc">Um pedido de extração é encaminhado pelo tipo de tarefa. Os spans explícitos vão para encoders, as tarefas conjuntas e as relações vão para GLiNER2 ou GLiNER-Relex, e o trabalho intensivo em raciocínio ou mapeamento de ontologias vai para LLMs com schema condicionado. Os casos de LLM registados alimentam o próximo dataset de treino dos encoders.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="552" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="tt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
  </defs>
  <path class="edge" d="M256 96h40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40H168v40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v80" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40h312v40" marker-end="url(#tt-arrow)" />
  <rect x="48" y="48" width="208" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="72" y="82">PEDIDO</text><text class="name" x="72" y="110">Tarefa de extração</text><text class="note" x="72" y="132">Texto + schema necessário.</text>
  <rect x="296" y="48" width="368" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="320" y="82" fill="#C50E72">FOCO · ROUTER</text><text class="name" x="320" y="110" fill="#C50E72">Encaminhar pelo tipo de tarefa</text>
  <text class="note" x="320" y="132" fill="#C50E72" style="font-size: 12.5px;">Não classifique modelos uma única vez para cada pedido.</text>
  <rect class="group" x="48" y="200" width="240" height="264" rx="12" /><rect class="group" x="360" y="200" width="240" height="264" rx="12" /><rect class="group" x="672" y="200" width="240" height="264" rx="12" />
  <rect class="box" x="72" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="92" y="258">NÍVEL 1 · PROCESSO</text><text class="name" x="92" y="286">Modelos encoder</text><text class="note" x="92" y="308">Spans de texto explícitos.</text>
  <text class="kind" x="72" y="356">ESCOLHER PELO CONJUNTO DE LABELS</text><text class="note" x="72" y="382" style="font-size: 12.5px;">Cross-encoder · inventário reduzido</text><text class="note" x="72" y="406">Bi-encoder · inventário reutilizável</text><text class="note" x="72" y="430"><tspan x="72">Modelo com fine-tuning · domínio</tspan><tspan x="72" dy="1.2em">estável</tspan></text>
  <rect class="box" x="384" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="404" y="258">NÍVEL 2 · PROCESSO</text><text class="name" x="404" y="286">Extração conjunta</text><text class="note" x="404" y="308">Várias tarefas ligadas.</text>
  <text class="kind" x="384" y="356">TESTAR A COMPOSIÇÃO</text><text class="note" x="384" y="382">GLiNER2 · NER + campos + classe</text><text class="note" x="384" y="406">GLiNER-Relex · spans + relações</text><text class="note" x="384" y="430"><tspan x="384">Avaliar cada resultado</tspan><tspan x="384" dy="1.2em">separadamente</tspan></text>
  <rect x="696" y="224" width="192" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="716" y="258">NÍVEL 3 · EXTERNO</text><text class="name" x="716" y="286">LLM estruturado</text><text class="note" x="716" y="308">Inferência ou mapeamento.</text>
  <text class="kind" x="696" y="356">CONDICIONAR O OUTPUT</text><text class="note" x="696" y="382">Schema nativo · Instructor</text><text class="note" x="696" y="406">Outlines · geração local</text><text class="note" x="696" y="430"><tspan x="696">Aterrar ou alojar localmente</tspan><tspan x="696" dy="1.2em">conforme necessário</tspan></text>
  <path class="edge" d="M792 464v32H168v-32" stroke-dasharray="2 6" marker-end="url(#tt-arrow)" />
  <rect x="338" y="484" width="284" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="501" text-anchor="middle" style="font-size: 11px;">casos registados → próximo dataset de treino do Nível 1</text>
  <text class="note" x="48" y="534">Meça a divisão do tráfego em produção; os níveis descrevem o trabalho, não uma percentagem fixa de pedidos.</text>
</svg>
