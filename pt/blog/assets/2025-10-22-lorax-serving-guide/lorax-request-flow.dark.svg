<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lrf-title lrf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="lrf-title">Percurso de pedidos do LoRAX: da autorização do adapter à geração</title>
  <desc id="lrf-desc">Cinco passos ordenados. Um gateway autentica o tenant e autoriza o ID do adapter. O LoRAX resolve o adapter, forma um batch heterogéneo, aplica cada adapter sobre o modelo base partilhado e faz streaming dos tokens de saída. IDs não autorizados, artefactos incompatíveis e falhas no carregamento interrompem o processo antes do scheduling.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #a8b8af; }
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .marker-num { font-style: normal; font-weight: 600; font-size: 13px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; fill: #141d19; }
    .box { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .focus { fill: #2b1622; stroke: #ff6fb6; stroke-width: 2.5; }
    .edge { fill: none; stroke: #a8b8af; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#0c1210" />

  <text class="section" x="48" y="44">PERCURSO DO PEDIDO · ID DO ADAPTER AUTORIZADO → TOKENS DE SAÍDA</text>

  <circle cx="62" cy="76" r="14" fill="#edf5f0" />
  <text class="marker-num" x="62" y="81" text-anchor="middle">1</text>
  <rect class="focus" x="48" y="104" width="240" height="96" rx="10" />
  <text class="kind" x="68" y="138" fill="#ff6fb6">GATEWAY · FOCO</text>
  <text class="name" x="68" y="166" fill="#ff6fb6">Autorizar ID do adapter</text>

  <circle cx="374" cy="76" r="14" fill="#edf5f0" />
  <text class="marker-num" x="374" y="81" text-anchor="middle">2</text>
  <rect class="box" x="360" y="104" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="138">RESOLVER</text>
  <text class="name" x="380" y="166">Resolver residência</text>

  <circle cx="686" cy="76" r="14" fill="#edf5f0" />
  <text class="marker-num" x="686" y="81" text-anchor="middle">3</text>
  <rect class="box" x="672" y="104" width="240" height="96" rx="10" />
  <text class="kind" x="692" y="138">SCHEDULER</text>
  <text class="name" x="692" y="166">Formar batch misto</text>

  <path class="edge" d="M288 152h64" marker-end="url(#lrf-arrow)" />
  <path class="edge" d="M600 152h64" marker-end="url(#lrf-arrow)" />

  <circle cx="218" cy="252" r="14" fill="#edf5f0" />
  <text class="marker-num" x="218" y="257" text-anchor="middle">4</text>
  <rect class="box" x="204" y="280" width="240" height="96" rx="10" />
  <text class="kind" x="224" y="314">GPU INFERENCE</text>
  <text class="name" x="224" y="342">Aplicar cada adapter</text>

  <circle cx="530" cy="252" r="14" fill="#edf5f0" />
  <text class="marker-num" x="530" y="257" text-anchor="middle">5</text>
  <rect class="box" x="516" y="280" width="240" height="96" rx="10" />
  <text class="kind" x="536" y="314">STREAM</text>
  <text class="name" x="536" y="342">Devolver tokens de saída</text>

  <path class="edge" d="M792 200v24H324v48" marker-end="url(#lrf-arrow)" />
  <text class="note" x="788" y="218" text-anchor="end">batch misto pronto</text>
  <path class="edge" d="M444 328h64" marker-end="url(#lrf-arrow)" />

  <path d="M48 416h864" stroke="#2b3b33" stroke-width="1" />
  <text class="note" x="48" y="440">Parar antes do scheduling: ID não autorizado · artefacto incompatível · falha no carregamento do adapter</text>

  <defs>
    <marker id="lrf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
