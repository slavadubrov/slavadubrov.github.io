<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Funil de ranking multi-etapa</title>
  <desc id="desc">Um funil conceptual desde a recuperação do corpus até ao pré-ranking, ranking completo e combinação final, com uma medição para cada saída.</desc>
  <defs>
    <marker id="arrowFunnel" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="520" fill="#0C1210" />

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">O Funil de Ranking Multi-etapa</text>

  <!-- Corpus -->
  <rect x="200" y="55" width="400" height="52" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="400" y="77" text-anchor="middle" font-size="13" font-weight="600" fill="#EDF5F0">Corpus completo</text>
  <text x="400" y="95" text-anchor="middle" font-size="11" fill="#EDF5F0">O tamanho depende do produto e do índice</text>

  <!-- Arrow -->
  <line x1="400" y1="107" x2="400" y2="130" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowFunnel)" />

  <!-- Stage 1: Retrieval -->
  <rect x="160" y="133" width="480" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="180" y="155" font-size="11" font-weight="700" fill="#EDF5F0">ETAPA 1: RECUPERAÇÃO</text>
  <text x="180" y="172" font-size="12" font-weight="600" fill="#EDF5F0">BM25 + Dense Bi-Encoder + Hybrid RRF Fusion</text>
  <text x="180" y="190" font-size="11" fill="#EDF5F0">Saída: recall no limite de candidatos</text>
  <text x="590" y="172" text-anchor="end" font-size="16" font-weight="700" fill="#EDF5F0">Conjunto abrangente</text>
  <text x="590" y="190" text-anchor="end" font-size="11" fill="#EDF5F0">limite do benchmark</text>

  <!-- Arrow -->
  <line x1="400" y1="208" x2="400" y2="231" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowFunnel)" />
  <text x="416" y="224" font-size="11" fill="#EDF5F0">o número de candidatos diminui</text>

  <!-- Stage 2: Pre-Ranking -->
  <rect x="180" y="234" width="440" height="68" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="200" y="256" font-size="11" font-weight="700" fill="#EDF5F0">ETAPA 2: PRÉ-RANKING</text>
  <text x="200" y="273" font-size="12" font-weight="600" fill="#EDF5F0">Modelos Two-Tower + Interaction Features</text>
  <text x="200" y="289" font-size="11" fill="#EDF5F0">Saída: recall retido por milissegundo</text>
  <text x="575" y="273" text-anchor="end" font-size="16" font-weight="700" fill="#EDF5F0">Conjunto filtrado</text>
  <text x="575" y="289" text-anchor="end" font-size="11" fill="#EDF5F0">etapa opcional</text>

  <!-- Arrow -->
  <line x1="400" y1="302" x2="400" y2="325" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowFunnel)" />
  <text x="416" y="318" font-size="11" fill="#EDF5F0">shortlist</text>

  <!-- Stage 3: Full Ranking -->
  <rect x="200" y="328" width="400" height="68" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="220" y="350" font-size="11" font-weight="700" fill="#EDF5F0">ETAPA 3: RANKING COMPLETO</text>
  <text x="220" y="367" font-size="12" font-weight="600" fill="#EDF5F0">Cross-Encoders + LLM Rerankers</text>
  <text x="220" y="383" font-size="11" fill="#EDF5F0">Saída: NDCG/MRR, latência e custo</text>
  <text x="560" y="367" text-anchor="end" font-size="16" font-weight="700" fill="#EDF5F0">Shortlist</text>
  <text x="560" y="383" text-anchor="end" font-size="11" fill="#EDF5F0">limite medido</text>

  <!-- Arrow -->
  <line x1="400" y1="396" x2="400" y2="419" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowFunnel)" />

  <!-- Stage 4: Blending -->
  <rect x="240" y="422" width="320" height="68" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="260" y="444" font-size="11" font-weight="700" fill="#EDF5F0">ETAPA 4: COMBINAÇÃO</text>
  <text x="260" y="461" font-size="12" font-weight="600" fill="#EDF5F0">Diversidade + Regras de negócio</text>
  <text x="260" y="477" font-size="11" fill="#EDF5F0">Saída: guardrails de política e diversidade</text>

  <!-- Cost gradient label on right -->
  <text x="690" y="145" font-size="11" fill="#EDF5F0" text-anchor="start">Custo baixo</text>
  <text x="690" y="160" font-size="11" fill="#EDF5F0" text-anchor="start">Velocidade elevada</text>
  <line x1="680" y1="140" x2="680" y2="385" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="4" />
  <text x="690" y="380" font-size="11" fill="#EDF5F0" text-anchor="start">Custo elevado</text>
  <text x="690" y="395" font-size="11" fill="#EDF5F0" text-anchor="start">Precisão elevada</text>
  <!-- Arrow for gradient -->
  <line x1="680" y1="165" x2="680" y2="370" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowFunnel)" />

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
