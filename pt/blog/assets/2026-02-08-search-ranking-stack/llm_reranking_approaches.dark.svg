<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Reranking pointwise e listwise com LLM</title>
  <desc id="desc">O ranking pointwise atribui pontuações aos candidatos de forma independente, enquanto o ranking listwise compara um pequeno conjunto num único prompt e devolve uma ordenação.</desc>
  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="400" fill="#0C1210" />

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Reranking com LLM: Pointwise vs. Listwise</text>

  <!-- Left: Pointwise -->
  <rect x="30" y="50" width="340" height="330" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" class="visual-focus" />
  <text x="200" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#EDF5F0">Pontuação pointwise</text>
  <text x="200" y="96" text-anchor="middle" font-size="11" fill="#EDF5F0"><tspan x="200">Atribuir uma pontuação a cada documento de forma</tspan><tspan x="200" dy="1.2em">independente</tspan></text>

  <!-- Three scoring boxes -->
  <rect x="55" y="115" width="290" height="42" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="70" y="133" font-size="11" fill="#EDF5F0">Query + Doc A</text>
  <text x="70" y="148" font-size="11" fill="#EDF5F0">Chamada ao LLM 1</text>
  <text x="320" y="141" text-anchor="end" font-size="14" font-weight="700" fill="#EDF5F0">0.8</text>

  <rect x="55" y="167" width="290" height="42" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="70" y="185" font-size="11" fill="#EDF5F0">Query + Doc B</text>
  <text x="70" y="200" font-size="11" fill="#EDF5F0">Chamada ao LLM 2</text>
  <text x="320" y="193" text-anchor="end" font-size="14" font-weight="700" fill="#EDF5F0">0.3</text>

  <rect x="55" y="219" width="290" height="42" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="70" y="237" font-size="11" fill="#EDF5F0">Query + Doc C</text>
  <text x="70" y="252" font-size="11" fill="#EDF5F0">Chamada ao LLM 3</text>
  <text x="320" y="245" text-anchor="end" font-size="14" font-weight="700" fill="#EDF5F0">0.9</text>

  <!-- Sort arrow -->
  <line x1="200" y1="268" x2="200" y2="295" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowL)" />
  <text x="220" y="287" font-size="11" fill="#EDF5F0">Ordenar por pontuação</text>

  <!-- Result -->
  <rect x="100" y="300" width="200" height="30" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="200" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">C (0.9) &gt; A (0.8) &gt; B (0.3)</text>

  <!-- Pros/cons -->
  <text x="55" y="355" font-size="11" fill="#EDF5F0">+ Paralelizável, simples</text>
  <text x="55" y="370" font-size="11" fill="#EDF5F0">- Sem contexto comparativo entre documentos</text>

  <!-- Right: Listwise -->
  <rect x="420" y="50" width="350" height="330" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="595" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#EDF5F0">Ranking listwise</text>
  <text x="595" y="96" text-anchor="middle" font-size="11" fill="#EDF5F0">Comparar todos os documentos em simultâneo</text>

  <!-- Single LLM call box -->
  <rect x="445" y="115" width="300" height="130" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="460" y="137" font-size="11" font-weight="600" fill="#EDF5F0">Uma única chamada ao LLM</text>
  <text x="460" y="158" font-size="11" fill="#EDF5F0">Query + [Doc A, Doc B, Doc C]</text>
  <rect x="460" y="168" width="270" height="22" rx="4" fill="#141D19" stroke="#EDF5F0" stroke-width="0.8" />
  <text x="595" y="184" text-anchor="middle" font-size="11" fill="#EDF5F0">O LLM compara todos os documentos entre si</text>
  <text x="460" y="210" font-size="11" fill="#EDF5F0">Resultado:</text>
  <text x="510" y="210" font-size="12" font-weight="700" fill="#EDF5F0">[3], [1], [2]</text>
  <text x="590" y="210" font-size="11" fill="#EDF5F0">(C é o melhor, A segue-se, B fica em último)</text>
  <text x="460" y="232" font-size="11" fill="#EDF5F0">Prompt ao estilo RankGPT</text>

  <!-- Arrow to result -->
  <line x1="595" y1="252" x2="595" y2="295" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrowL)" />

  <!-- Result -->
  <rect x="490" y="300" width="210" height="30" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="595" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#EDF5F0">C &gt; A &gt; B (ordenação global)</text>

  <!-- Pros/cons -->
  <text x="445" y="355" font-size="11" fill="#EDF5F0">+ Pode melhorar a eficácia nas tarefas avaliadas</text>
  <text x="445" y="370" font-size="11" fill="#EDF5F0">- Limitações da janela de contexto, enviesamento posicional</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
