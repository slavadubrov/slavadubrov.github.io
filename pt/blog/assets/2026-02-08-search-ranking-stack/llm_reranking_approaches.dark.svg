<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="llmrerank-title llmrerank-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="llmrerank-title">Reordenação pointwise versus listwise com LLM</title><desc id="llmrerank-desc">A pontuação pointwise chama o LLM uma vez por documento e ordena depois pela pontuação, sem contexto comparativo entre candidatos. A ordenação listwise faz uma chamada com todos os candidatos e pede diretamente uma ordem, o que requer mais contexto, mas permite ver os candidatos em conjunto.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="llmrerank-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="llmrerank-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="680" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Pontuar cada documento isoladamente ou ordená-los em conjunto</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">A demonstração usa ordenação listwise, inspirada no RankGPT.</text>
<rect x="32" y="128" width="312" height="424" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">PONTUAÇÃO POINTWISE</text>
<rect x="376" y="128" width="312" height="424" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="392" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ORDENAÇÃO LISTWISE</text>
<path d="M58 172h260a10 10 0 0 1 10 10v44a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-44a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 172h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CHAMADA LLM 1</text><text x="62" y="223" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Doc A → 0,8</text>
<path d="M188 236v10" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M58 246h260a10 10 0 0 1 10 10v44a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-44a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 246h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="263.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CHAMADA LLM 2</text><text x="62" y="297" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Doc B → 0,3</text>
<path d="M188 310v10" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M58 320h260a10 10 0 0 1 10 10v44a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-44a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 320h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="337.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">CHAMADA LLM 3</text><text x="62" y="371" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Doc C → 0,9</text>
<path d="M188 384v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#llmrerank-arrow-flow)" />
<path d="M58 400h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 400h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="188" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">ORDENAR POR PONTUAÇÃO</text><text x="188" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" text-anchor="middle">C &gt; A &gt; B</text>
<text x="48" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">+ Paralelizável, simples de executar</text>
<text x="48" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">− Sem contexto comparativo entre candidatos</text>
<path d="M410 172h244a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-244a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M410 172h244a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-264a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">FOCO · UMA CHAMADA</text><text x="414" y="233" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Todos os docs, um prompt</text><text x="414" y="255" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Vê todos os candidatos em conjunto</text>
<path d="M532 276v124" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#llmrerank-arrow-flow)" />
<path d="M410 400h244a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-244a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M410 400h244a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-264a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="532" y="417.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">O MODELO DEVOLVE A ORDEM</text><text x="532" y="455" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDF5F0" text-anchor="middle">[3], [1], [2] → C, A, B</text>
<text x="400" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">+ Vê a ordem relativa numa só chamada</text>
<text x="400" y="522" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="400">− Limites da janela de contexto, viés de</tspan><tspan x="400" dy="1.2em">posição</tspan></text>
<path d="M32 588h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="614" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">O parser da demonstração aceita identificadores incompletos ou duplicados; trate o resultado listwise como</text>
<text x="32" y="636" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ilustrativo, e não como uma ordenação validada.</text>
</svg>
