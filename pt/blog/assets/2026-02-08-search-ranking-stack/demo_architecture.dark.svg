<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1060" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="demoarch-title demoarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="demoarch-title">O pipeline de demonstração em cinco etapas</title><desc id="demoarch-desc">Uma consulta alimenta, em paralelo, a recuperação esparsa BM25 e a recuperação densa com bi-encoder; ambas são combinadas com reciprocal rank fusion, depois reordenadas por um cross-encoder e, opcionalmente, por um LLM listwise, antes dos resultados finais top-10.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="demoarch-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="demoarch-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1060" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Cinco etapas, uma consulta</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Os passos 1–3 maximizam o recall; os passos 4–5 maximizam a precisão.</text>
