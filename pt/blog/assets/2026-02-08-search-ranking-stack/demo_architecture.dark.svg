<path d="M360 656v56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#demoarch-arrow-flow)" /><rect x="368.5" y="672" width="79" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="408" y="688.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">opcional</text>
