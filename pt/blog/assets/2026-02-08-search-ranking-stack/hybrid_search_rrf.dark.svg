<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 636" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="rrf-title rrf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="rrf-title">Pesquisa híbrida com fusão de reciprocal rank</title><desc id="rrf-desc">BM25 e a recuperação densa devolvem, cada um, uma lista ordenada com pontuações em escalas diferentes. A reciprocal rank fusion descarta as pontuações brutas e combina apenas as posições no ranking, evitando calibrar as escalas de pontuação entre os dois métodos.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="rrf-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="rrf-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="636" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Fusão de duas listas ordenadas pela posição, não pela pontuação</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">BM25 e a recuperação densa atribuem pontuações em escalas diferentes; a RRF não as compara</tspan><tspan x="32" dy="1.2em">diretamente.</tspan></text>
