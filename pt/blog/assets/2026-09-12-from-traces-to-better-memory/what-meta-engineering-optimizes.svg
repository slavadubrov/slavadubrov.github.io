<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 744" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="what-meta-engineering-optimizes-title what-meta-engineering-optimizes-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="what-meta-engineering-optimizes-title">A meta-engineering otimiza o sistema completo</title><desc id="what-meta-engineering-optimizes-desc">A meta-engineering escolhe experiências que podem variar a formulação do prompt, a montagem do contexto, a configuração do loop e a estrutura do grafo. As quatro áreas fazem parte de um único sistema candidato. A avaliação mede os resultados desse sistema e devolve evidência para a experiência seguinte. As quatro áreas são escolhas de design sobrepostas, não etapas históricas.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="what-meta-engineering-optimizes-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="what-meta-engineering-optimizes-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="744" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">A meta-engineering otimiza o sistema completo</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">As escolhas de prompt, contexto, loop e grafo partilham um único processo de experimentação.</text>
<path d="M210 120h380a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-380a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M210 120h380a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-400a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="214" y="137.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">PROCESSO DE EXPERIMENTAÇÃO</text><text x="214" y="171" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Meta-engineering</text><text x="214" y="193" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Escolher uma alteração · testá-la · usar o resultado</text><text x="214" y="213" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Manter objetivos, orçamentos e aprovação explícitos</text>
