<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 810" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="enrichguard-title enrichguard-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="enrichguard-title">Os API enrichers injetam sugestões não bloqueantes, e uma camada independente de guard decide se a ação proposta pode avançar.</title><desc id="enrichguard-desc">Uma resposta de uma API externa é analisada por mais de vinte enrichers, que injetam sugestões de função e paginação no contexto. Uma pesquisa híbrida no wiki da empresa, que combina streams de regex, semânticos e de palavras-chave, alimenta o mesmo agente de reasoning. O agente escolhe uma ação, e o guard hierárquico focado decide entre hard block, soft block ou soft hint antes de a ação avançar.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="enrichguard-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="enrichguard-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="810" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B" style="font-size: 18.5px;">Os API enrichers orientam o agente antes de os guards hierárquicos decidirem</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">A equipa J8Gvbi separou as sugestões não bloqueantes de um guard independente com três modos.</text>
