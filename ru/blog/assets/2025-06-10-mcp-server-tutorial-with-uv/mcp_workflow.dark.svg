<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mw-title mw-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="mw-title">Шесть шагов поиска через инструмент FeatureStoreLite</title>
  <desc id="mw-desc">При запуске MCP-клиент обнаруживает инструменты сервера, и Claude получает их схемы. Для поиска Claude запрашивает get_feature, клиент отправляет tools call через границу MCP, FeatureStoreLite выполняет запрос к SQLite, а результат возвращается через хост для финального ответа Claude.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .marker-num { font-weight: 600; font-size: 13px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0c1210; }
    .box { stroke: #edf5f0; stroke-width: 1.5; fill: #141d19; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0c1210" />

  <text class="kind" x="48" y="40">ЗАПУСК · ОБНАРУЖЕНИЕ ИНСТРУМЕНТА</text>

  <circle cx="62" cy="68" r="14" fill="#edf5f0" />
  <text class="marker-num" x="62" y="73" text-anchor="middle">1</text>
  <circle cx="366" cy="68" r="14" fill="#edf5f0" />
  <text class="marker-num" x="366" y="73" text-anchor="middle">2</text>
  <circle cx="670" cy="68" r="14" fill="#edf5f0" />
  <text class="marker-num" x="670" y="73" text-anchor="middle">3</text>

  <rect class="box" x="48" y="96" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="126">ПРОЦЕСС</text>
  <text class="name" x="68" y="154">Обнаружить инструменты сервера</text>
  <text class="note" x="68" y="176">Claude Desktop · MCP-клиент</text>

  <rect class="box" x="352" y="96" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="126">ПРОЦЕСС</text>
  <text class="name" x="372" y="154">Предоставить схемы инструментов</text>
  <text class="note" x="372" y="176">Хост → Claude</text>

  <rect class="box" x="656" y="96" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="126">ПРОЦЕСС</text>
  <text class="name" x="676" y="154">Запросить get_feature</text>
  <text class="note" x="676" y="176">Claude → хост</text>

  <path class="edge" d="M312 144h32" marker-end="url(#mw-arrow)" />
  <path class="edge" d="M616 144h32" marker-end="url(#mw-arrow)" />

  <text class="kind" x="48" y="244">ЭТАП ВОПРОСА · ВЫПОЛНЕНИЕ ПОИСКА</text>

  <circle cx="670" cy="272" r="14" fill="#edf5f0" />
  <text class="marker-num" x="670" y="277" text-anchor="middle">4</text>
  <circle cx="366" cy="272" r="14" fill="#edf5f0" />
  <text class="marker-num" x="366" y="277" text-anchor="middle">5</text>
  <circle cx="62" cy="272" r="14" fill="#edf5f0" />
  <text class="marker-num" x="62" y="277" text-anchor="middle">6</text>

  <rect x="656" y="300" width="256" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="676" y="330" fill="#ff6fb6">ФОКУС</text>
  <text class="name" x="676" y="358" fill="#ff6fb6">Отправить tools/call</text>
  <text class="note" x="676" y="380">MCP-клиент → FeatureStoreLite</text>

  <rect class="box" x="352" y="300" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="330">ПРОЦЕСС</text>
  <text class="name" x="372" y="358">Выполнить get_feature</text>
  <text class="note" x="372" y="380">FeatureStoreLite ↔ features.db</text>

  <rect class="box" x="48" y="300" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="330">ПРОЦЕСС</text>
  <text class="name" x="68" y="358">Вернуть финальный ответ</text>
  <text class="note" x="68" y="380">JSON → хост → Claude</text>

  <path class="edge" d="M784 192v100" marker-end="url(#mw-arrow)" />
  <path class="edge" d="M656 348h-32" marker-end="url(#mw-arrow)" />
  <path class="edge" d="M352 348h-32" marker-end="url(#mw-arrow)" />

  <text class="note" x="48" y="444">Обнаружение выполняется при запуске. Каждый поиск пересекает границу между MCP-клиентом и сервером в виде запроса tools/call.</text>

  <defs>
    <marker id="mw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
