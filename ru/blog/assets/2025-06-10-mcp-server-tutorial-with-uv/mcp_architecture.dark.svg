<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 336" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ma-title ma-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="ma-title">Архитектура FeatureStoreLite MCP</title>
  <desc id="ma-desc">Запрос пользователя поступает в Claude Desktop, где работает выделенный MCP-клиент. Клиент отправляет MCP-сообщения через локальные стандартные потоки ввода и вывода на FastMCP-сервер FeatureStoreLite. Сервер читает векторы признаков из локальной базы данных SQLite и записывает их в неё.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .owner { font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #a8b8af; }
    .box { stroke: #edf5f0; stroke-width: 1.5; fill: #141d19; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="1120" height="336" rx="14" fill="#0c1210" />

  <rect x="248" y="48" width="400" height="240" rx="12" fill="none" stroke="#2b3b33" />
  <text class="owner" x="272" y="78">MCP-ХОСТ · CLAUDE DESKTOP</text>

  <rect x="48" y="112" width="160" height="96" rx="10" fill="#141d19" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="146">ВНЕШНИЙ МИР</text>
  <text class="name" x="68" y="174">Запрос пользователя</text>
  <text class="note" x="68" y="194">Спросить Claude</text>

  <rect class="box" x="272" y="112" width="152" height="96" rx="10" />
  <text class="kind" x="292" y="146">ПРОЦЕСС</text>
  <text class="name" x="292" y="174">Claude Desktop</text>
  <text class="note" x="292" y="194">Хост-приложение</text>

  <rect class="box" x="464" y="112" width="160" height="96" rx="10" />
  <text class="kind" x="484" y="146">ПРОЦЕСС</text>
  <text class="name" x="484" y="174">Клиент для каждого сервера</text>
  <text class="note" x="484" y="194">Сообщения протокола</text>

  <rect x="688" y="112" width="184" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="708" y="146" fill="#ff6fb6">ФОКУС</text>
  <text class="name" x="708" y="174" fill="#ff6fb6">FeatureStoreLite</text>
  <text class="note" x="708" y="194">FastMCP-сервер</text>

  <rect x="912" y="112" width="160" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="932" y="146">ХРАНИЛИЩЕ</text>
  <text class="name" x="932" y="174">features.db</text>
  <text class="note" x="932" y="194">Строки SQLite</text>

  <path class="edge" d="M208 160h56" marker-end="url(#ma-arrow)" />
  <path class="edge" d="M424 160h32" marker-end="url(#ma-arrow)" />
  <path class="edge" d="M624 160h56" marker-end="url(#ma-arrow)" />
  <path class="edge" d="M872 160h32" marker-end="url(#ma-arrow)" />

  <text class="note" x="240" y="240" text-anchor="middle">Промпт на естественном языке</text>
  <text class="note" x="444" y="240" text-anchor="middle">Запрос tool</text>
  <text class="note" x="656" y="240" text-anchor="middle">MCP через локальные stdio</text>
  <text class="note" x="892" y="240" text-anchor="middle">SQL</text>

  <defs>
    <marker id="ma-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
