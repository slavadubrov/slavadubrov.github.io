<path d="M32 452h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Обнаружение — разово при старте: клиент знает схемы инструментов.</text>
<text x="32" y="500" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Каждый поиск проходит MCP-границу новым запросом tools/call.</text>
</svg>
