<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="eg-title eg-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="eg-title">API-энричеры направляют агента до того, как уровневые гардрейлы примут решение</title>
  <desc id="eg-desc">Ответ API проходит через более чем двадцать энричеров, которые сохраняют операционные подсказки. Гибридный поиск по wiki подбирает правила. Оба источника передают данные агенту, а предложенный им результат проверяется режимами гардрейлов: жёсткая блокировка, мягкая блокировка или мягкая подсказка.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="440" rx="14" fill="#0C1210" />
  <rect class="external" x="48" y="64" width="188" height="96" rx="10" /><text class="kind" x="68" y="98">ВНЕШНИЕ ИСТОЧНИКИ</text><text class="name" x="68" y="126">Ответ API</text>
  <rect class="box" x="272" y="64" width="188" height="96" rx="10" /><text class="kind" x="292" y="98">ЭНР‌ИЧЕРЫ · 20+</text><text class="name" x="292" y="126">Проверить результат</text>
  <rect class="store" x="496" y="64" width="188" height="96" rx="10" /><text class="kind" x="516" y="98">КОНТЕКСТНЫЕ ПОДСКАЗКИ</text><text class="name" x="516" y="126">Роль + пагинация</text>
  <path class="edge" d="M236 112h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M460 112h28" marker-end="url(#eg-arrow)" />
  <rect class="store" x="48" y="256" width="188" height="96" rx="10" /><text class="kind" x="68" y="290">ХРАНИЛИЩЕ WIKI</text><text class="name" x="68" y="318">Правила компании</text>
  <rect class="box" x="272" y="256" width="188" height="96" rx="10" /><text class="kind" x="292" y="290">ГИБРИДНЫЙ ПОИСК</text><text class="name" x="292" y="318">Regex + семантический</text>
  <rect class="box" x="496" y="256" width="188" height="96" rx="10" /><text class="kind" x="516" y="290">SGR-АГЕНТ</text><text class="name" x="516" y="318">Выбрать действие</text>
  <rect x="720" y="256" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="740" y="290">УРОВНЕВОЙ ГАРДРЕЙЛ</text><text class="name-focus" x="740" y="318">Блокировка или подсказка</text>
  <path class="edge" d="M236 304h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M460 304h28" marker-end="url(#eg-arrow)" /><path class="edge" d="M684 304h28" marker-end="url(#eg-arrow)" />
  <path class="edge" d="M590 160v88" marker-end="url(#eg-arrow)" /><text class="note" x="604" y="210">внедрить подсказки</text>
  <text class="note" x="720" y="384">жёсткая блокировка · мягкая блокировка · мягкая подсказка</text><path d="M720 394h188" stroke="#2B3B33" />
  <text class="note" x="48" y="416">Энричеры добавляют рекомендации, не блокируя выполнение; гардрейлы отдельно решают, можно ли продолжить выполнение результата.</text>
  <defs><marker id="eg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
