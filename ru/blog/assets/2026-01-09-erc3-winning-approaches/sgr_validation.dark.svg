<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="sgr-title sgr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="sgr-title">Проверяйте каждый шаг по схеме до выполнения</title>
  <desc id="sgr-desc">Модель ризонинга предлагает шаг по схеме. StepValidator либо принимает его к выполнению, либо отклоняет с комментариями для доработки. Результат API становится наблюдением для следующего шага.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .kind-focus { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #FF6FB6; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .name-focus { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #FF6FB6; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="360" rx="14" fill="#0C1210" />
  <rect class="box" x="48" y="72" width="188" height="96" rx="10" /><text class="kind" x="68" y="106">РИЗОНЁР</text><text class="name" x="68" y="134">Предложить шаг</text>
  <rect x="272" y="72" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind-focus" x="292" y="106">ВАЛИДАТОР ШАГА</text><text class="name-focus" x="292" y="134">Проверить действие</text>
  <rect class="box" x="496" y="72" width="188" height="96" rx="10" /><text class="kind" x="516" y="106">РАНТАЙМ</text><text class="name" x="516" y="134">Выполнить tool</text>
  <rect class="store" x="720" y="72" width="188" height="96" rx="10" /><text class="kind" x="740" y="106">НАБЛЮДЕНИЕ</text><text class="name" x="740" y="134">Результат API</text>
  <path class="edge" d="M236 120h28" marker-end="url(#sgr-arrow)" /><path class="edge" d="M460 120h28" marker-end="url(#sgr-arrow)" /><text class="note" x="478" y="62" text-anchor="middle">принять</text><path class="edge" d="M684 120h28" marker-end="url(#sgr-arrow)" />
  <path d="M366 168v52a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-52" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#sgr-signal)" /><rect x="202" y="220" width="108" height="24" rx="6" fill="#0C1210" /><text class="note" x="256" y="237" text-anchor="middle" fill="#FF6FB6">отклонить + комментарии</text>
  <path class="edge" d="M814 168v96a12 12 0 0 1-12 12H154a12 12 0 0 1-12-12v-24" stroke-dasharray="7 6" marker-end="url(#sgr-arrow)" /><rect x="418" y="264" width="124" height="24" rx="6" fill="#0C1210" /><text class="note" x="480" y="281" text-anchor="middle">следующий шаг</text>
  <text class="note" x="48" y="332">Отклонённая работа дорабатывается до того, как станет tool call; принятые результаты передаются в следующий ход ризонинга.</text>
  <defs><marker id="sgr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="sgr-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
