<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="readermap-title readermap-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="readermap-title">Шесть боттлнеков сервинга ведут к шести разным отправным точкам квантизации</title><desc id="readermap-desc">Дефицит памяти под веса начинается с weight-only квантизации W4A16; пропускная способность при упоре в вычисления — с FP8 или INT8 W8A8; длинный контекст или высокая конкурентность — с квантизации KV cache; локальный или edge-инференс — с GGUF; файн-тюнинг адаптеров — с NF4 и QLoRA; для diffusion-пайплайнов нужны специализированные методы INT4 или FP8. Перед деплоем каждый путь всё равно требует калибровки и эвала на целевом рантайме.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="readermap-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="readermap-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="712" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Начните с боттлнека</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Одинаковая разрядность может быть правильной или неправильной — всё зависит от железа,</tspan><tspan x="32" dy="1.2em">рантайма, кэша и эвала.</tspan></text>
<path d="M42 128h308a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 128h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ПАМЯТЬ ПОД ВЕСА</text><text x="46" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">W4A16 GPTQ / AWQ</text><text x="46" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Упор в decode — см. §1, §4</text>
<path d="M386 128h308a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M386 128h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="390" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ПРОПУСКНАЯ СПОСОБНОСТЬ</text><text x="390" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">FP8 или INT8 W8A8</text><text x="390" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Упор в вычисления — см. §3, §4</text>
<path d="M42 248h308a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 248h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ДЛИННЫЙ КОНТЕКСТ</text><text x="46" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Квантизация KV cache</text><text x="46" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Кэш занимает большую часть VRAM — §6</text>
<path d="M386 248h308a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M386 248h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="390" y="265.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ЛОКАЛЬНЫЙ / EDGE</text><text x="390" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">GGUF Q4_K_M / Q5_K_M</text><text x="390" y="331" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">CPU, Apple, десктоп — §7</text>
<path d="M42 368h308a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 368h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ФАЙН-ТЮНИНГ</text><text x="46" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">NF4 с QLoRA</text><text x="46" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Обучение адаптера, одна GPU — §2</text>
<path d="M386 368h308a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-308a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M386 368h308a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-328a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="390" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">DIFFUSION</text><text x="390" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">INT4 / FP8 для diffusion</text><text x="390" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Отдельная работа с активациями — §10</text>
<path d="M42 504h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 504h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="521.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ПЕРЕД ДЕПЛОЕМ</text><text x="46" y="565" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Затем проверьте на целевом рантайме</text><text x="46" y="587" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Перплексия, точность задач, проверки длинного контекста, load tests — §8</text>
<path d="M32 632h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">Эта карта — только отправная точка: железо, рантайм и калибровочные данные могут изменить выбор.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Каждый путь всё равно заканчивается одним и тем же deploy gate.</text>
</svg>
