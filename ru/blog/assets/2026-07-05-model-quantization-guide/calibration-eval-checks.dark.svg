<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="calibration-title calibration-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="calibration-title">Проверки калибровки и эвала для квантизированных моделей</title>
  <desc id="calibration-desc">Репрезентативные production-сэмплы поступают на калибровку, квантизацию и тест сервинга в целевом рантайме. Затем deployment gate проверяет качество, работу с длинным контекстом, скорость и память.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="calibration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>

  <rect width="960" height="520" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">КВАНТИЗАЦИЯ · ВАЛИДАЦИЯ ДЕПЛОЯ</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Загрузившийся чекпоинт ещё не прошёл deployment gate</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Калибруйте и тестируйте на целевом workload, рантайме и железе.</text>

  <path d="M240 200H272" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />
  <path d="M464 200H496" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />
  <path d="M688 200H720" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />
  <path d="M816 248V300a20 20 0 0 1-20 20H480v32" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#calibration-arrow)" />

  <rect x="48" y="152" width="192" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · НАБОР TRAFFIC</text>
  <text x="68" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Сэмплы traffic</text>
  <text x="68" y="236" fill="#a8b8af" font-size="13">RAG · SQL · код · чат</text>

  <rect x="272" y="152" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="292" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ОБРАБОТКА · КАЛИБРОВКА</text>
  <text x="292" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Калибровка диапазонов</text>
  <text x="292" y="236" fill="#a8b8af" font-size="13">Редактированные данные · выровненные длины</text>

  <rect x="496" y="152" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="516" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ОБРАБОТКА · КВАНТИЗАЦИЯ</text>
  <text x="516" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Выбор точности</text>
  <text x="516" y="236" fill="#a8b8af" font-size="13">GPTQ · AWQ · FP8 · INT8</text>

  <rect x="720" y="152" width="192" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="740" y="184" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ОБРАБОТКА · ТЕСТ СЕРВИНГА</text>
  <text x="740" y="214" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Целевой рантайм</text>
  <text x="740" y="236" fill="#a8b8af" font-size="13">Железо · форма workload</text>

  <text x="160" y="334" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ПРИНИМАТЬ ТОЛЬКО ПОСЛЕ ПРОХОЖДЕНИЯ ОБЕИХ ГРУПП ПРОВЕРОК</text>
  <rect x="160" y="352" width="640" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="184" y="384" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ФОКУС · DEPLOY GATE</text>
  <text x="184" y="414" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Качество · задачи · длинный контекст</text>
  <text x="512" y="414" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Throughput · TTFT · ITL · память</text>
  <text x="184" y="436" fill="#a8b8af" font-size="13">Дельта perplexity · регрессии · сэмплы генерации</text>
</svg>
