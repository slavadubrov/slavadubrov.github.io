<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Путь запроса LoRAX: от разрешения адаптера до генерации</title>
  <desc id="desc">Аутентифицированный запрос передаёт ID адаптера из allowlist. LoRAX определяет резидентность, при необходимости загружает адаптер, объединяет совместимые задачи в батч, применяет адаптер к общей базовой модели и стримит токены. Отклонённые идентификаторы и артефакты переходят по ветке ошибки.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="500" rx="22" fill="#0f172a" />
  <text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Путь запроса LoRAX</text>
  <text x="500" y="77" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">Идентификатор адаптера — авторизованный вход для роутинга, а не произвольный публичный ввод</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(25 125)"><rect width="150" height="110" rx="14" fill="#1e293b" stroke="#64748b" /><text x="75" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Шлюз</text><text x="75" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">аутентифицировать арендатора</text><text x="75" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">проверить адаптер по allowlist</text></g>
    <text x="197" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(220 125)"><rect width="165" height="110" rx="14" fill="#5b21b6" stroke="#2563eb" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Резолвер</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">проверить резидентность</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">загрузить при отсутствии</text></g>
    <text x="407" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(430 125)"><rect width="165" height="110" rx="14" fill="#9a3412" stroke="#ea580c" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#fdba74">Планировщик</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">поставить в очередь по готовности</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">сформировать смешанный батч</text></g>
    <text x="617" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(640 125)"><rect width="165" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="82" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">GPU-инференс</text><text x="82" y="66" text-anchor="middle" font-size="12" fill="#cbd5e1">общая базовая модель</text><text x="82" y="87" text-anchor="middle" font-size="12" fill="#94a3b8">адаптер для запроса</text></g>
    <text x="827" y="188" text-anchor="middle" font-size="24" fill="#94a3b8">→</text>
    <g transform="translate(850 125)"><rect width="125" height="110" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="62" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Стрим</text><text x="62" y="75" text-anchor="middle" font-size="12" fill="#93c5fd">выходные токены</text></g>

    <g transform="translate(220 315)"><rect width="585" height="105" rx="14" fill="#1d4ed8" stroke="#2563eb" /><text x="292" y="33" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Отслеживайте путь резидентности каждого запроса</text><text x="45" y="66" font-size="13" fill="#cbd5e1">попадание в GPU</text><text x="160" y="66" font-size="13" fill="#cbd5e1">попадание в CPU</text><text x="275" y="66" font-size="13" fill="#cbd5e1">попадание в артефакт</text><text x="410" y="66" font-size="13" fill="#cbd5e1">промах на удалённом источнике</text><text x="45" y="88" font-size="12" fill="#94a3b8">Фиксируйте время в очереди, загрузки, до первого токена, общую латентность и причину сбоя.</text></g>
    <text x="500" y="465" text-anchor="middle" font-size="13" fill="#fca5a5">Неавторизованный адаптер, несовместимый артефакт или ошибка загрузки → отклонить либо использовать явный fallback</text>
  </g>
</svg>
