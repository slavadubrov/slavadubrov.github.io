<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lmh-title lmh-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="lmh-title">Хранилище артефактов адаптеров и резидентность в рантайме LoRAX</title>
  <desc id="lmh-desc">Адаптер перемещается из внешнего реестра в локальный кэш данных, затем в пул адаптеров на CPU и, наконец, в активный рабочий набор на GPU. Скачивание, материализация и перенос — отдельные переходы. В памяти GPU также размещаются общая базовая модель, KV cache, рабочая область батча и рантайм-ядра.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #a8b8af; }
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .box { stroke: #edf5f0; stroke-width: 1.5; }
    .external { fill: #141d19; stroke: #a8b8af; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .store { fill: #1b2621; }
    .focus { fill: #2b1622; stroke: #ff6fb6; stroke-width: 2.5; }
    .edge { fill: none; stroke: #a8b8af; stroke-width: 1.5; }
  </style>
  <rect width="960" height="336" rx="14" fill="#0c1210" />

  <text class="section" x="48" y="44">ПУТЬ АДАПТЕРА · РАЗМЕР КАТАЛОГА ≠ АКТИВНЫЙ РАБОЧИЙ НАБОР</text>

  <rect class="external" x="48" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="68" y="122">ВНЕШНИЙ</text>
  <text class="name" x="68" y="150">Реестр артефактов</text>

  <rect class="box store" x="272" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="292" y="122">ХРАНИЛИЩЕ · ДИСК</text>
  <text class="name" x="292" y="150">Локальный кэш /data</text>

  <rect class="box store" x="496" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="516" y="122">ХРАНИЛИЩЕ · CPU</text>
  <text class="name" x="516" y="150">Выгруженные адаптеры</text>

  <rect class="focus" x="720" y="88" width="184" height="96" rx="10" />
  <text class="kind" x="740" y="122" fill="#ff6fb6">GPU · ФОКУС</text>
  <text class="name" x="740" y="150" fill="#ff6fb6">Активные адаптеры</text>

  <path class="edge" d="M232 136h32" marker-end="url(#lmh-arrow)" />
  <path class="edge" d="M456 136h32" marker-end="url(#lmh-arrow)" />
  <path class="edge" d="M680 136h32" marker-end="url(#lmh-arrow)" />

  <text class="note" x="252" y="218" text-anchor="middle">скачивание</text>
  <text class="note" x="476" y="218" text-anchor="middle">материализация</text>
  <text class="note" x="700" y="218" text-anchor="middle">перенос</text>

  <path d="M48 248h864" stroke="#2b3b33" stroke-width="1" />
  <text class="kind" x="48" y="278">БЮДЖЕТ GPU</text>
  <text class="note" x="48" y="302">Общая базовая модель · активные адаптеры · KV cache · рабочая область батча · рантайм-ядра</text>
  <text class="note" x="48" y="324">Измеряйте попадания в GPU, попадания в CPU, попадания в артефактное хранилище и промахи во внешнем хранилище как отдельные пути латентности.</text>

  <defs>
    <marker id="lmh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
