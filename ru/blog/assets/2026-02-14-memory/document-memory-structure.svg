<text x="32" y="658" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11.5px;">README.md объясняет человеку назначение каталога, а PROGRESS.md передаёт незавершённую работу следующей сессии модели.</text>
<text x="32" y="680" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Git фиксирует каждое изменение, которое ИИ-агент вносит здесь, — неудачное знание можно удалить одним</tspan><tspan x="32" dy="1.2em">revert.</tspan></text>
