<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 712" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="docmem-title docmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="docmem-title">Каталог document-memory содержит четыре тематические папки в одном общем корне, а четыре операции — read, write, list и search — работают со всеми ними.</title><desc id="docmem-desc">Общий каталог .agent-memory содержит user-profiles, research, conventions и learnings в виде Markdown-файлов. Небольшой интерфейс file-memory предоставляет четыре операции, каждая из которых разрешает целевой путь внутри того же корня: read возвращает содержимое документа, write создаёт или заменяет его, list сопоставляет пути по glob-шаблону, а search возвращает абзацы, соответствующие ключевому слову.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="docmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="docmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="800" height="712" rx="14" fill="#F7F7F4" />
