<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="mtd-title mtd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="mtd-title">Шесть типов памяти ИИ-агента, объединённых в три уровня хранения</title>
  <desc id="mtd-desc">Горячая память содержит рабочую и краткосрочную память, холодная — эпизодическую и семантическую, а документная память хранит знания проекта. Процедурная память находится вне уровней хранения — в системных промптах и определениях инструментов. Рабочая память выделена как контекст, доступный модели прямо сейчас.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; }
    .focus-text { fill: #FF6FB6; }
  </style>
  <rect width="1120" height="600" rx="14" fill="#0C1210" />

  <rect class="group" x="48" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="72" y="94">ГОРЯЧИЙ УРОВЕНЬ · ТЕКУЩИЙ ТРЕД</text>
  <rect class="focus" x="72" y="112" width="272" height="96" rx="10" />
  <text class="kind focus-text" x="92" y="146">ФОКУС · РАБОЧАЯ</text>
  <text class="name focus-text" x="92" y="174">Текущий контекст</text>
  <text class="note" x="92" y="194">один шаг модели · не сохраняется</text>
  <rect class="store" x="72" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="92" y="282">ХРАНЕНИЕ · КРАТКОСРОЧНАЯ</text>
  <text class="name" x="92" y="310">Чекпоинт треда</text>
  <text class="note" x="92" y="330">минуты–часы · пауза и возобновление</text>
  <text class="note" x="72" y="408">Доступна сейчас; чекпоинты обеспечивают восстановление.</text>

  <rect class="group" x="400" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="424" y="94">ХОЛОДНЫЙ УРОВЕНЬ · МЕЖДУ ТРЕДАМИ</text>
  <rect class="store" x="424" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="146">ХРАНЕНИЕ · ЭПИЗОДИЧЕСКАЯ</text>
  <text class="name" x="444" y="174">Прошлые взаимодействия</text>
  <text class="note" x="444" y="194">дни–месяцы · события и история</text>
  <rect class="store" x="424" y="248" width="272" height="96" rx="10" />
  <text class="kind" x="444" y="282">ХРАНЕНИЕ · СЕМАНТИЧЕСКАЯ</text>
  <text class="name" x="444" y="310">Факты и предпочтения</text>
  <text class="note" x="444" y="330">месяцы–постоянно · векторная или KV</text>
  <text class="note" x="424" y="408">Воспроизведение по смыслу или ключу в следующем треде.</text>

  <rect class="group" x="752" y="64" width="320" height="376" rx="12" />
  <text class="kind" x="776" y="94">ДОКУМЕНТНЫЙ УРОВЕНЬ · ЗНАНИЯ ПРОЕКТА</text>
  <rect class="store" x="776" y="112" width="272" height="96" rx="10" />
  <text class="kind" x="796" y="146">ХРАНЕНИЕ · ДОКУМЕНТНАЯ</text>
  <text class="name" x="796" y="174">Файлы для просмотра</text>
  <text class="note" x="796" y="194">заметки · исследования · выученные паттерны</text>
  <path d="M800 256h224M800 288h224M800 320h160" fill="none" stroke="#2B3B33" stroke-width="1.5" />
  <text class="kind" x="800" y="246">ФАЙЛЫ</text>
  <text class="note" x="800" y="278">conventions/analysis-format.md</text>
  <text class="note" x="800" y="310">research/NVDA-2026-02.md</text>
  <text class="note" x="800" y="342">learnings/common-errors.md</text>
  <text class="note" x="776" y="408">Читаема человеком, редактируема и версионируема.</text>

  <rect class="external" x="400" y="472" width="320" height="96" rx="10" />
  <text class="kind" x="420" y="496">ВНЕШНЯЯ · ПРОЦЕДУРНАЯ</text>
  <text class="name" x="420" y="520">Системный промпт и инструменты</text>
  <text class="note" x="420" y="544">Поставляется вместе с ИИ-агентом; не является уровнем retrieval.</text>
</svg>
