<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rp-title rp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rp-title">Сравнение Redis и PostgreSQL как бэкендов чекпоинтов</title>
  <desc id="rp-desc">Сопоставление Redis и PostgreSQL по времени доступа, надёжности хранения, истории, модели запросов и эксплуатационной пригодности. PostgreSQL выделен как надёжный вариант по умолчанию; Redis — вариант с приоритетом латентности, когда потерю недавнего состояния можно восстановить.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .value { font: 600 14px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; }
    .focus-text { fill: #C50E72; }
    .rule { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4" />

  <rect class="group" x="48" y="48" width="416" height="432" rx="12" />
  <rect class="group" x="496" y="48" width="416" height="432" rx="12" />

  <rect class="store" x="72" y="72" width="368" height="96" rx="10" />
  <text class="kind" x="92" y="106">ХРАНИЛИЩЕ · ПРИОРИТЕТ ЛАТЕНТНОСТИ</text>
  <text class="name" x="92" y="136">Сейвер чекпоинтов Redis</text>
  <text class="note" x="92" y="156" style="font-size: 11px;">Выбирайте, когда боттлнеком является латентность возобновления.</text>

  <rect class="focus" x="520" y="72" width="368" height="96" rx="10" />
  <text class="kind focus-text" x="540" y="106">ФОКУС · НАДЁЖНЫЙ ВАРИАНТ ПО УМОЛЧАНИЮ</text>
  <text class="name focus-text" x="540" y="136">Сейвер чекпоинтов PostgreSQL</text>
  <text class="note" x="540" y="156" style="font-size: 11px;">Выбирайте, когда потеря завершённой работы недопустима.</text>

  <text class="kind" x="72" y="206">ВРЕМЯ ДОСТУПА</text>
  <text class="value" x="72" y="230">Менее миллисекунды</text>
  <text class="note" x="72" y="250">чтение и запись в памяти</text>
  <text class="kind" x="520" y="206">ВРЕМЯ ДОСТУПА</text>
  <text class="value" x="520" y="230">Единицы миллисекунд</text>
  <text class="note" x="520" y="250">запись в БД на каждой границе</text>
  <path class="rule" d="M72 268h368M520 268h368" />

  <text class="kind" x="72" y="294">НАДЁЖНОСТЬ ХРАНЕНИЯ</text>
  <text class="value" x="72" y="318">Настраивается через AOF или RDB</text>
  <text class="note" x="72" y="338">недавние записи могут быть потеряны или вытеснены</text>
  <text class="kind" x="520" y="294">НАДЁЖНОСТЬ ХРАНЕНИЯ</text>
  <text class="value" x="520" y="318">ACID-транзакции и WAL</text>
  <text class="note" x="520" y="338">чекпоинт сохраняется после подтверждённой записи</text>
  <path class="rule" d="M72 356h368M520 356h368" />

  <text class="kind" x="72" y="382">ИСТОРИЯ · МОДЕЛЬ ЗАПРОСОВ</text>
  <text class="value" x="72" y="406">Ретенция и индексы по ключам/поиску</text>
  <text class="note" x="72" y="426">история зависит от сейвера и политики вытеснения</text>
  <text class="kind" x="520" y="382">ИСТОРИЯ · МОДЕЛЬ ЗАПРОСОВ</text>
  <text class="value" x="520" y="406">Надёжная история, SQL и JSONB</text>
  <text class="note" x="520" y="426"><tspan x="520">возобновление, инспекция и отладка с перемоткой во</tspan><tspan x="520" dy="1.2em">времени</tspan></text>

  <text class="note" x="72" y="462"><tspan x="72">Лучше всего подходит: восстанавливаемое состояние</tspan><tspan x="72" dy="1.2em">сессии, чувствительное к латентности.</tspan></text>
  <text class="note" x="520" y="462"><tspan x="520">Лучше всего подходит: длительные задачи и</tspan><tspan x="520" dy="1.2em">воспроизводимое восстановление.</tspan></text>
  <text class="note" x="48" y="510">Бенчмарк состояния после сериализации и частоты записей; общие бенчмарки БД не позволяют предсказать стоимость чекпоинтов.</text>
</svg>
