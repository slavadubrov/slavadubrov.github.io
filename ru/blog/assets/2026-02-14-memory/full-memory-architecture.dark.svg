<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="fullmem-title fullmem-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="fullmem-title">Горячая, холодная и документная память подключаются к одному харнессу агента через пути, которые либо синхронны с запросом, либо выполняются в фоне.</title><desc id="fullmem-desc">Запрос пользователя поступает в харнесс агента: на горячем пути он записывает и восстанавливает чекпоинты, синхронно извлекает долгосрочные факты перед планированием, откладывая запись новых фактов в фоновую задачу, а также читает документную память при каждом вызове планировщика, тоже откладывая новые записи. Сплошные рёбра относятся к пути выполнения или восстановления; пунктирные — к фоновым обновлениям, которые не должны блокировать цикл ризонинга.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="fullmem-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="fullmem-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Три пути памяти, один харнесс</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Харнесс решает, что попадёт в модель; хранилища лишь хранят состояние до этого момента.</text>
<path d="M42 128h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 128h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ВНЕШНИЙ · ПОЛЬЗОВАТЕЛЬ</text><text x="46" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Запрос пользователя</text><text x="46" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ответ возвращается сюда</text>
<path d="M374 128h304a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-304a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M374 128h304a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-324a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="378" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ХАРНЕСС АГЕНТА</text><text x="378" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Собрать контекст модели</text><text x="378" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="378">ризонинг · планирование · вызов</tspan><tspan x="378" dy="1.2em">инструментов</tspan></text>
<path d="M240 180h124" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullmem-arrow-flow)" /><rect x="266" y="168" width="72" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="302" y="184.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">запрос</text>
<path d="M42 360h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 360h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="377.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ХРАНИЛИЩЕ · ЧЕКПОИНТЫ</text><text x="46" y="421" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Postgres или Redis</text><text x="46" y="443" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">на каждом super-step</text>
<path d="M266 360h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M266 360h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="270" y="377.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ХРАНИЛИЩЕ · ДОЛГ.</text><text x="270" y="421" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Vector или KV</text><text x="270" y="443" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">только релевантные факты</text>
<path d="M490 360h188a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-188a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M490 360h188a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-208a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="494" y="377.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ХРАНИЛИЩЕ · ФАЙЛЫ</text><text x="494" y="421" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Markdown и JSON</text><text x="494" y="443" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">соглашения · заметки</text>
<path d="M420 232v24h-284v104" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullmem-arrow-flow)" /><rect x="209.5" y="244" width="137" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="278" y="260.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">записать чекпоинт</text>
<path d="M200 360v-80h240v-48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullmem-arrow-flow)" /><rect x="284" y="268" width="72" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="320" y="284.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">откатить</text>
<path d="M480 232v80h-120v48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullmem-arrow-flow)" /><rect x="369.5" y="300" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="420" y="316.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 11px;">запросить факты</text>
<path d="M500 232v104h-140v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#fullmem-arrow-flow)" /><rect x="379.5" y="324" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="430" y="340.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 12.5px;">записать факты</text>
<path d="M580 232v128" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fullmem-arrow-flow)" /><rect x="526" y="284" width="108" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="580" y="300.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">чтение планера</text>
<path d="M650 232v40h-40v88" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#fullmem-arrow-flow)" /><rect x="579.5" y="260" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="630" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 12px;">записать файлы</text>
<path d="M32 504h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12px;">Извлечение данных из холодной памяти блокирует планирование; извлечение и сохранение новых фактов — нет.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Именно харнесс, а не какое-либо отдельное хранилище, решает, что фактически попадёт в</tspan><tspan x="32" dy="1.2em">контекстное окно модели.</tspan></text>
</svg>
