<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 968" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="memtax-title memtax-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="memtax-title">Иллюстративные типы памяти соответствуют вариантам хранения, которые формируют рабочий контекст.</title><desc id="memtax-desc">Краткосрочная память становится горячей памятью — чекпоинтом текущего треда. Эпизодическая и семантическая память становятся холодной памятью — позволяют вспоминать данные между тредами. Документная память хранит знания проекта в файлах. Процедуры могут поставляться как инструкции или извлекаться из файлов и других хранилищ. Рабочая память, отнесённая к горячему уровню, — главный элемент рисунка: это ограниченное контекстное окно, в которое в итоге загружает данные каждый уровень.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="memtax-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="memtax-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="968" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Шесть типов памяти, три уровня хранения</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Рабочая память — боттлнек, в который в итоге загружает данные каждый уровень.</text>
<rect x="32" y="120" width="656" height="176" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="146" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ГОРЯЧИЙ УРОВЕНЬ · ТЕКУЩИЙ ТРЕД</text>
<path d="M58 176h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M58 176h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="62" y="193.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ФОКУС · РАБОЧАЯ ПАМЯТЬ</text><text x="62" y="237" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Текущий контекст</text><text x="62" y="259" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">активная работа · не сохраняется надолго</text>
<path d="M374 176h272a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-272a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M374 176h272a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-292a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="378" y="193.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ХРАНИЛИЩЕ · КРАТКОСРОЧНАЯ ПАМЯТЬ</text><text x="378" y="237" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Чекпоинт треда</text><text x="378" y="259" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">сохранённое состояние · пауза и возобновление</text>
<rect x="32" y="328" width="656" height="176" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="354" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ХОЛОДНЫЙ УРОВЕНЬ · МЕЖДУ ТРЕДАМИ</text>
<path d="M58 384h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 384h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ХРАНИЛИЩЕ · ЭПИЗОДИЧЕСКАЯ ПАМЯТЬ</text><text x="62" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Прошлые взаимодействия</text><text x="62" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">хранение по политике</text>
<path d="M374 384h272a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-272a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M374 384h272a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-292a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="378" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ХРАНИЛИЩЕ · СЕМАНТИЧЕСКАЯ ПАМЯТЬ</text><text x="378" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Факты и предпочтения</text><text x="378" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">актуальность и политика хранения</text>
<rect x="32" y="536" width="656" height="176" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="562" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">ДОКУМЕНТНЫЙ УРОВЕНЬ · ЗНАНИЯ ПРОЕКТА</text>
<path d="M58 592h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M58 592h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="62" y="609.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ХРАНИЛИЩЕ · ДОКУМЕНТЫ</text><text x="62" y="653" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Проверяемые файлы</text><text x="62" y="675" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">заметки · исследования · выявленные паттерны</text>
<path d="M42 744h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M42 744h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="46" y="761.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ВНЕШНИЙ УРОВЕНЬ · ПРОЦЕДУРЫ</text><text x="46" y="805" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E">Системный промпт и инструменты</text><text x="46" y="827" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">встроенные инструкции или извлечённые процедуры</text>
<path d="M32 888h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="914" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Эти уровни — варианты реализации; процедуры также можно хранить и извлекать.</text>
<text x="32" y="936" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Рабочая память — боттлнек: каждый уровень нужен, чтобы в нужный момент передать в неё правильные факты.</text>
</svg>
