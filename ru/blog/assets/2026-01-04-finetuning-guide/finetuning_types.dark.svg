<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Fine-Tuning Types" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>Три формата датасетов для файн-тюнинга</title>
  <desc>Continued pre-training использует сырой доменный текст, task-specific supervised fine-tuning — пары входных и выходных данных, а instruction tuning — широкий набор инструкций и ответов.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="800" height="520" fill="#0C1210" />

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">Типы файн-тюнинга</text>

  <!-- Base Model (center top) -->
  <rect x="300" y="70" width="200" height="45" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text x="400" y="98" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Предобученная базовая модель</text>

  <!-- Arrows from base model -->
  <path d="M400 115 L400 140 L150 140 L150 160" stroke="#A8B8AF" stroke-width="2" fill="none" />
  <path d="M400 115 L400 160" stroke="#A8B8AF" stroke-width="2" fill="none" />
  <path d="M400 115 L400 140 L650 140 L650 160" stroke="#A8B8AF" stroke-width="2" fill="none" />

  <!-- Unsupervised / Continued Pre-training (left) -->
  <rect x="50" y="165" width="200" height="55" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="150" y="190" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Continued Pre-training</text>
  <text x="150" y="208" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(Без учителя)</text>

  <!-- SFT (center) -->
  <rect x="300" y="165" width="200" height="55" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="400" y="190" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Supervised Fine-Tuning</text>
  <text x="400" y="208" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(SFT)</text>

  <!-- Instruction Tuning (right) -->
  <rect x="550" y="165" width="200" height="55" rx="8" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="650" y="190" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">Instruction Tuning</text>
  <text x="650" y="208" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">(частный случай SFT)</text>

  <!-- Descriptions boxes -->

  <!-- Unsupervised description -->
  <rect x="50" y="240" width="200" height="130" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="65" y="265" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Данные:</text>
  <text x="65" y="283" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Сырой текст (без меток)</text>
  <text x="65" y="305" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Цель:</text>
  <text x="65" y="323" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Знания о домене</text>
  <text x="65" y="345" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Пример:</text>
  <text x="65" y="363" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Медицинские статьи, юридические документы</text>

  <!-- SFT description -->
  <rect x="300" y="240" width="200" height="130" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="315" y="265" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Данные:</text>
  <text x="315" y="283" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Пары (вход, выход)</text>
  <text x="315" y="305" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Цель:</text>
  <text x="315" y="323" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Поведение для конкретной задачи</text>
  <text x="315" y="345" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Пример:</text>
  <text x="315" y="363" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Текст → SQL, суммаризация</text>

  <!-- Instruction Tuning description -->
  <rect x="550" y="240" width="200" height="130" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="565" y="265" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Данные:</text>
  <text x="565" y="283" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Пары (инструкция, ответ)</text>
  <text x="565" y="305" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Цель:</text>
  <text x="565" y="323" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Следование разнообразным инструкциям</text>
  <text x="565" y="345" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Пример:</text>
  <text x="565" y="363" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Широкий набор диалогов для чат-ассистента</text>

  <!-- When to use section -->
  <rect x="50" y="390" width="700" height="110" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="400" y="415" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">КОГДА ЧТО ИСПОЛЬЗОВАТЬ</text>

  <text x="80" y="445" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Continued Pre-training:</text>
  <text x="230" y="445" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Модели не хватает доменной лексики (например, медицинской, юридической или кодовой)</text>

  <text x="80" y="465" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">SFT:</text>
  <text x="130" y="465" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Конкретная задача с известным форматом входа и выхода (например, Text-to-SQL)</text>

  <text x="80" y="485" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Instruction:</text>
  <text x="180" y="485" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Поведение универсального чат-ассистента</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
