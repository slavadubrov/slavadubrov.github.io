<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ftdecide-title ftdecide-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ftdecide-title">Четыре вопроса направляют задачу к retrieval, промптингу, constrained decoding или файн-тюнингу.</title><desc id="ftdecide-desc">Задача с меняющимися фактами направляется к retrieval, задача на стиль или формат — к промптингу, проблема синтаксиса вывода — к constrained decoding, а подтверждённый измерениями разрыв относительно базовой модели без тюнинга — к файн-тюнингу с LoRA или QLoRA; без измеренного разрыва используется базовая модель.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ftdecide-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ftdecide-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="920" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Выбирайте механизм, а не вариант по умолчанию</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">На каждый следующий вопрос ответить дешевле, чем на предыдущий.</text>
<rect x="32" y="112" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="192" y="141" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">РЕШЕНИЕ</text><text x="192" y="165" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle" style="font-size: 15.5px;">Нужны данные в реальном времени или</text><text x="192" y="187" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">меняющиеся факты?</text>
<path d="M426 108h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M426 108h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="430" y="125.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="430" y="159" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Retrieval (RAG)</text><text x="430" y="181" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Мгновенные обновления</text><text x="430" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">при появлении новых документов</text>
<path d="M352 160h64" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="148" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="384" y="164.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">да</text>
<path d="M192 208v48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="220" width="35" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="192" y="236.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">нет</text>
<rect x="32" y="256" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="192" y="285" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">РЕШЕНИЕ</text><text x="192" y="309" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Нужна простая правка стиля или</text><text x="192" y="331" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">формата?</text>
<path d="M426 252h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M426 252h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="430" y="269.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="430" y="303" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Промпт-инжиниринг</text><text x="430" y="325" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Few-shot-примеры,</text><text x="430" y="345" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">быстрые итерации</text>
<path d="M352 304h64" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="292" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="384" y="308.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">да</text>
<path d="M192 352v48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="364" width="35" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="192" y="380.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">нет</text>
<rect x="32" y="400" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="192" y="429" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">РЕШЕНИЕ</text><text x="192" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Неверен только синтаксис</text><text x="192" y="475" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">вывода?</text>
<path d="M426 396h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M426 396h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="430" y="413.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="430" y="447" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Constrained decoding</text><text x="430" y="469" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">xgrammar / outlines —</text><text x="430" y="489" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">валидный синтаксис, не истинность</text>
<path d="M352 448h64" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="436" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="384" y="452.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">да</text>
<path d="M192 496v48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="508" width="35" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="192" y="524.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">нет</text>
<rect x="32" y="544" width="320" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="192" y="573" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">РЕШЕНИЕ</text><text x="192" y="597" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">Есть измеренный разрыв относительно</text><text x="192" y="619" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">базовой модели без тюнинга?</text>
<path d="M426 540h252a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-252a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M426 540h252a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-272a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="430" y="557.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС</text><text x="430" y="591" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Файн-тюнинг (LoRA/QLoRA)</text><text x="430" y="613" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Только после исключения</text><text x="430" y="633" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">промптинга и decoding</text>
<path d="M352 592h64" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="363" y="580" width="42" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="384" y="596.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">да</text>
<path d="M192 640v48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftdecide-arrow-flow)" /><rect x="174.5" y="652" width="35" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="192" y="668.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">нет</text>
<path d="M42 688h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 688h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="705.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="46" y="739" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Оставить базовую модель</text><text x="46" y="761" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Подтверждённого случая пока нет —</text><text x="46" y="781" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11.5px;">вернитесь к вопросу после появления новых данных</text>
<path d="M32 840h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="866" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Каждый шаг выше по цепочке дешевле тестировать, чем следующий.</text>
<text x="32" y="888" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Переходите к файн-тюнингу только после исключения более дешёвых механизмов и</tspan><tspan x="32" dy="1.2em">подтверждения реального разрыва на базовой модели.</tspan></text>
</svg>
