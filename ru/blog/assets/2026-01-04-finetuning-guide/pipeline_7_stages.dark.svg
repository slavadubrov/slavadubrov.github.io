<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1120" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="ftpipe7-title ftpipe7-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="ftpipe7-title">Семь этапов пайплайна проводят файн-тюнинг от данных до релиза под мониторингом, а затем запускают цикл заново.</title><desc id="ftpipe7-desc">Подготовка данных, выбор модели, настройка обучения, файн-тюнинг, эвал, деплой и мониторинг образуют последовательный пайплайн; результаты мониторинга возвращаются в подготовку данных. Подготовка данных отмечена как этап, где возникает большинство сбоев.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="ftpipe7-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="ftpipe7-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="1120" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Файн-тюнинг — это пайплайн, а не команда</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Мониторинг возвращает результаты в подготовку данных.</text>
<path d="M42 112h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 112h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ПОДГОТОВКА ДАННЫХ</text><text x="46" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Определите единицу эвала, затем очистите данные</text><text x="46" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Систематические дефекты данных сразу попадают в обучение</text><circle cx="32" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M42 240h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 240h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="257.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ВЫБОР МОДЕЛИ</text><text x="46" y="301" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Выберите базовую модель, загрузите веса</text><text x="46" y="323" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Лицензия, токенизатор, соответствие контекстному окну</text><circle cx="32" cy="240" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="244.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M42 368h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 368h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="385.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">НАСТРОЙКА ОБУЧЕНИЯ</text><text x="46" y="429" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Аппаратное обеспечение и гиперпараметры</text><text x="46" y="451" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Оптимизатор, точность, размер батча</text><circle cx="32" cy="368" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="372.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M42 496h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 496h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="513.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФАЙН-ТЮНИНГ</text><text x="46" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Запустите SFT, DPO или ORPO</text><text x="46" y="579" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Согласуйте objective с данными</text><circle cx="32" cy="496" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="500.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M42 624h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 624h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="641.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЭВАЛ</text><text x="46" y="685" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Проверьте качество на бенчмарке и провалидируйте его</text><text x="46" y="707" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Целевые метрики, регрессии, безопасность, ops</text><circle cx="32" cy="624" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="628.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">5</text>
<path d="M42 752h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 752h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="769.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ДЕПЛОЙ</text><text x="46" y="813" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Экспортируйте модель и запустите сервинг</text><text x="46" y="835" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Адаптер, merged-модель или GGUF</text><circle cx="32" cy="752" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="756.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">6</text>
<path d="M42 880h580a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-580a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 880h580a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-600a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="897.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">МОНИТОРИНГ</text><text x="46" y="941" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Отслеживайте, поддерживайте, итерируйте</text><text x="46" y="963" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Возвращает результаты на этап 1</text><circle cx="32" cy="880" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="884.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">7</text>
<path d="M360 216v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftpipe7-arrow-flow)" />
<path d="M360 344v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftpipe7-arrow-flow)" />
<path d="M360 472v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftpipe7-arrow-flow)" />
<path d="M360 600v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftpipe7-arrow-flow)" />
<path d="M360 728v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftpipe7-arrow-flow)" />
<path d="M360 856v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ftpipe7-arrow-flow)" />
<path d="M632 932h40v-768h-40" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 6" marker-end="url(#ftpipe7-arrow-flow)" /><rect x="636" y="536" width="72" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="672" y="552.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">итерация</text>
<path d="M32 1032h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="1058" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Пропуск этапа не устраняет его режимы отказа — он лишь меняет место их обнаружения.</text>
<text x="32" y="1080" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">До настройки оптимизатора проверьте лейблы, утечки, покрытие и соответствие политикам.</text>
</svg>
