<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="LoRA Architecture" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title>низкоранговое обновление весов LoRA</title>
  <desc>Замороженная матрица весов получает масштабированное обновление ранга r, сформированное умножением двух небольших обучаемых матриц; доля обучаемых параметров зависит от размерностей слоя и целевых модулей.</desc>
  <defs>





  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" fill="#0C1210" />

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold">LoRA: архитектура низкоранговой адаптации</text>

  <!-- Frozen Weight Matrix (Left) -->
  <rect x="50" y="100" width="180" height="250" rx="12" fill="#141D19" stroke="#EDF5F0" stroke-width="3" />
  <text x="140" y="135" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="bold">Замороженные веса</text>
  <text x="140" y="160" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14">W₀</text>
  <text x="140" y="185" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12">(матрица d × d)</text>

  <!-- Grid representing frozen weights -->
  <g opacity="0.6">
    <rect x="70" y="210" width="140" height="120" rx="4" fill="#141D19" />
    <line x1="105" y1="210" x2="105" y2="330" stroke="#A8B8AF" stroke-width="1.5" />
    <line x1="140" y1="210" x2="140" y2="330" stroke="#A8B8AF" stroke-width="1.5" />
    <line x1="175" y1="210" x2="175" y2="330" stroke="#A8B8AF" stroke-width="1.5" />
    <line x1="70" y1="240" x2="210" y2="240" stroke="#A8B8AF" stroke-width="1.5" />
    <line x1="70" y1="270" x2="210" y2="270" stroke="#A8B8AF" stroke-width="1.5" />
    <line x1="70" y1="300" x2="210" y2="300" stroke="#A8B8AF" stroke-width="1.5" />
  </g>
  <text x="140" y="370" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Базовая матрица остаётся замороженной</text>

  <!-- Plus sign -->
  <text x="265" y="230" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="bold">+</text>

  <!-- LoRA Adapters (Center) -->
  <g>
    <!-- Matrix B (up-projection) -->
    <rect x="310" y="120" width="60" height="130" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="340" y="180" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="bold">B</text>
    <text x="340" y="200" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">d × r</text>

    <!-- Multiplication sign -->
    <text x="390" y="185" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20">×</text>

    <!-- Matrix A (down-projection) -->
    <rect x="420" y="150" width="130" height="60" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
    <text x="485" y="185" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="bold">A</text>
    <text x="485" y="200" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">r × d</text>
  </g>

  <!-- LoRA label -->
  <rect x="320" y="270" width="210" height="80" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
  <text x="425" y="295" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="bold">LoRA-адаптер</text>
  <text x="425" y="315" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12">ΔW = (α/r) B × A</text>
  <text x="425" y="335" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">r(dᵢₙ + dₒᵤₜ) обучаемых значений</text>

  <!-- Rank label -->
  <rect x="350" y="80" width="100" height="30" rx="15" fill="#1B2621" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="400" y="100" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">ранг r = 16</text>

  <!-- Equals sign -->
  <text x="580" y="230" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="bold">=</text>

  <!-- Output (Right) -->
  <rect x="620" y="100" width="150" height="250" rx="12" fill="#1B2621" />
  <text x="695" y="135" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="bold">Адаптированные</text>
  <text x="695" y="165" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14">W' = W₀ + ΔW</text>

  <!-- Grid representing output -->
  <g opacity="0.8">
    <rect x="640" y="190" width="110" height="90" rx="4" fill="#141D19" class="visual-focus" />
    <line x1="676" y1="190" x2="676" y2="280" stroke="#EDF5F0" stroke-width="1.5" />
    <line x1="713" y1="190" x2="713" y2="280" stroke="#EDF5F0" stroke-width="1.5" />
    <line x1="640" y1="220" x2="750" y2="220" stroke="#EDF5F0" stroke-width="1.5" />
    <line x1="640" y1="250" x2="750" y2="250" stroke="#EDF5F0" stroke-width="1.5" />
  </g>

  <text x="695" y="310" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12">Сравнить с</text>
  <text x="695" y="328" text-anchor="middle" fill="#141D19" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12">базовой моделью и полным FT</text>

  <!-- Bottom explanation -->
  <rect x="50" y="395" width="700" height="45" rx="8" fill="#141D19" />
  <text x="400" y="414" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="bold">LoRA сокращает объём обучаемого состояния; QLoRA также квантизирует замороженную базовую модель</text>
  <text x="400" y="432" text-anchor="middle" fill="#EDF5F0" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="11">Память также зависит от активаций, длины последовательности, батча, точности, ядер и оптимизатора</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
