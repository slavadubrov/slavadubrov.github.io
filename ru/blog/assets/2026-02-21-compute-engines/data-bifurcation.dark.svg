<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="bifurc-title bifurc-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="bifurc-title">Два типа нагрузки</title><desc id="bifurc-desc">Табличные нагрузки фильтруют, соединяют и агрегируют строки. Мультимодальные пайплайны могут преобразовывать входные данные в чанки и эмбеддинги; пропускную способность ограничивают чтение, декодирование на CPU или инференс на GPU. Перед выбором масштаба или движка протестируйте репрезентативные данные.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="bifurc-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="bifurc-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="540" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Два типа нагрузки</text>
<rect x="32" y="96" width="312" height="352" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">СТРУКТУРИРОВАННЫЕ ДАННЫЕ</text>
<rect x="376" y="96" width="312" height="352" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="392" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">МУЛЬТИМОДАЛЬНЫЙ AI</text>
<path d="M58 140h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 140h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ТАБЛИЧНЫЕ ДАННЫЕ</text><text x="62" y="195" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Строки и столбцы</text>
<path d="M402 140h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M402 140h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="406" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">СМЕШАННЫЕ РЕСУРСЫ</text><text x="406" y="195" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Изображения, видео, текст</text>
<text x="48" y="244" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Фильтры, соединения, агрегации.</text>
<text x="48" y="268" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">Одного мощного узла может быть достаточно;</text>
<text x="48" y="290" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">сначала измерьте память и I/O.</text>
<text x="392" y="244" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Чтение, декодирование, инференс на GPU:</text>
<text x="392" y="268" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Самый медленный этап задаёт throughput.</text>
<text x="392" y="290" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="392">Один вход может породить множество</tspan><tspan x="392" dy="1.2em">чанков.</tspan></text>
<path d="M58 324h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 324h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="62" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ЛОКАЛЬНЫЕ КАНДИДАТЫ</text><text x="62" y="379" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Polars / DuckDB / DataFusion</text>
<path d="M402 324h260a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M402 324h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="406" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">КАНДИДАТЫ ДЛЯ ПАЙПЛАЙНА</text><text x="406" y="379" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Ray Data / Daft</text>
<path d="M32 476h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="502" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Выбирайте по результатам сквозного теста на репрезентативных данных.</text>
</svg>
