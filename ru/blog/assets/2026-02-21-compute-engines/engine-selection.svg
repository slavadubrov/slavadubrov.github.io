<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Картина данных</title>
  <desc id="desc">Картина данных.</desc>
  <defs>
    <!-- Background Grid Pattern -->


    <!-- Fading Mask for Grid -->



    <!-- Card Gradients -->












    <!-- Card Shadow -->


    <!-- Floating Animations -->
    <style>
      .card-float {
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
      }
      .card-float:hover {
        transform: scale(1.05) translateY(-5px);
      }

      .c-bl { animation: float-1 5s ease-in-out infinite; transform-origin: 290px 330px; }
      .c-br { animation: float-2 6s ease-in-out infinite; transform-origin: 640px 330px; }
      .c-tl { animation: float-3 5.5s ease-in-out infinite; transform-origin: 290px 145px; }
      .c-tr { animation: float-4 6.5s ease-in-out infinite; transform-origin: 640px 145px; }

      @keyframes float-1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes float-2 { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
      @keyframes float-3 { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-5px); } }
      @keyframes float-4 { 0%, 100% { transform: translateY(-2px); } 50% { transform: translateY(6px); } }

      /* Overriding animation on hover requires high specificity or wrapping, we rely on the transition */
      .card-float:hover { animation-play-state: paused; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="480" rx="12" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1.5" />
  <rect width="900" height="480" rx="12" fill="#F7F7F4" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Картина данных</text>

  <!-- Y-Axis (Complexity) -->
  <line x1="120" y1="430" x2="120" y2="40" stroke="#59645E" stroke-width="2" />
  <polygon points="115,48 120,38 125,48" fill="#F2F2F5" />

  <text x="25" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B" transform="rotate(-90 25 235)">Сложность конвейера</text>

  <text x="105" y="390" text-anchor="end" font-size="12" fill="#17211B">Табличный</text>
  <text x="105" y="235" text-anchor="end" font-size="12" fill="#17211B">Смешанные типы</text>
  <text x="105" y="80" text-anchor="end" font-size="12" fill="#17211B" style="font-size: 11.5px;">мультимодальный</text>

  <line x1="115" y1="386" x2="125" y2="386" stroke="#59645E" stroke-width="2" />
  <line x1="115" y1="231" x2="125" y2="231" stroke="#59645E" stroke-width="2" />
  <line x1="115" y1="76" x2="125" y2="76" stroke="#59645E" stroke-width="2" />

  <!-- X-Axis (Volume) -->
  <line x1="120" y1="430" x2="860" y2="430" stroke="#59645E" stroke-width="2" />
  <polygon points="852,425 862,430 852,435" fill="#F2F2F5" />

  <text x="490" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#17211B">Объем данных</text>

  <text x="210" y="452" text-anchor="middle" font-size="12" fill="#17211B">Мегабайты</text>
  <text x="380" y="452" text-anchor="middle" font-size="12" fill="#17211B">гигабайты</text>
  <text x="560" y="452" text-anchor="middle" font-size="12" fill="#17211B">Терабайты</text>
  <text x="740" y="452" text-anchor="middle" font-size="12" fill="#17211B">Петабайты</text>

  <line x1="210" y1="425" x2="210" y2="435" stroke="#59645E" stroke-width="2" />
  <line x1="380" y1="425" x2="380" y2="435" stroke="#59645E" stroke-width="2" />
  <line x1="560" y1="425" x2="560" y2="435" stroke="#59645E" stroke-width="2" />
  <line x1="740" y1="425" x2="740" y2="435" stroke="#59645E" stroke-width="2" />

  <!-- CARD: Bottom-Left = Polars/DuckDB -->
  <g class="card-float c-bl">
    <rect x="150" y="270" width="280" height="120" rx="16" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />

    <!-- Decorative badge -->
    <rect x="170" y="255" width="85" height="22" rx="11" fill="#F2F2F5" />
    <text x="212" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Скорость &gt; Масштаб</text>

    <text x="290" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Polars / DuckDB</text>
    <text x="290" y="340" text-anchor="middle" font-size="12" fill="#17211B">Таблицевые данные с одним узлом</text>
    <text x="290" y="360" text-anchor="middle" font-size="12" fill="#17211B">Мгновенный ад-хок анализ данных</text>
  </g>

  <!-- CARD: Bottom-Right = Spark/Dask -->
  <g class="card-float c-br">
    <rect x="500" y="270" width="280" height="120" rx="16" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />

    <rect x="520" y="255" width="112" height="22" rx="11" fill="#FFFFFF" />
    <text x="576" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Надежность &gt; Скорость</text>

    <text x="640" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Spark / Dask</text>
    <text x="640" y="340" text-anchor="middle" font-size="12" fill="#17211B">Распределённый SQL в масштабе петабайтов</text>
    <text x="640" y="360" text-anchor="middle" font-size="12" fill="#17211B">Мощные и надежные пайплайны ETL</text>
  </g>

  <!-- CARD: Top-Left = DataFusion -->
  <g class="card-float c-tl">
    <rect x="150" y="85" width="280" height="120" rx="16" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />

    <rect x="163" y="70" width="162" height="22" rx="11" fill="#F2F2F5" class="visual-focus" />
    <text x="244" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Расширяемость &gt; Экосистема</text>

    <text x="290" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Слияние данных</text>
    <text x="290" y="155" text-anchor="middle" font-size="12" fill="#17211B" style="font-size: 11px;">Встраиваемый движок запросов к потоковым данным</text>
    <text x="290" y="175" text-anchor="middle" font-size="12" fill="#17211B"><tspan x="290">Создание собственных платформ для</tspan><tspan x="290" dy="1.2em">обработки данных</tspan></text>
  </g>

  <!-- CARD: Top-Right = Ray/Daft -->
  <g class="card-float c-tr">
    <rect x="500" y="85" width="280" height="120" rx="16" fill="#F2F2F5" stroke="#59645E" stroke-width="1.5" />

    <rect x="520" y="70" width="128" height="22" rx="11" fill="#F2F2F5" />
    <text x="584" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Использование GPU &gt; Функции ETL</text>

    <text x="640" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Луч / Daft</text>
    <text x="640" y="155" text-anchor="middle" font-size="12" fill="#17211B" style="font-size: 11px;">Распределённая логика мультимодальных ИИ-систем</text>
    <text x="640" y="175" text-anchor="middle" font-size="12" fill="#17211B"><tspan x="640">Обучение и инференс с использованием</tspan><tspan x="640" dy="1.2em">GPU на этапе «последней мили»</tspan></text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
