<path d="M58 392h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 392h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2" style="font-size: 11px;">СКАНИРОВАНИЕ</text><text x="62" y="439" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#17211B">scan_parquet()</text>
