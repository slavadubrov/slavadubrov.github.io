<text x="32" y="632" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Polars: ~3,89 с на PDS-H SF-10 (многопоточный, lazy, потоковый режим).</text>
</svg>
