<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="eagerlazy-title eagerlazy-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="eagerlazy-title">Э eager- и lazy-исполнение</title><desc id="eagerlazy-desc">Eager-пайплайн читает все столбцы, а затем на каждом этапе — filter, groupby и result — создаёт полную копию в RAM, используя в памяти 2–3 размера датасета. Lazy-движок строит план запроса из scan, filter и group_by; оптимизатор применяет predicate pushdown и column pruning, после чего collect() один раз выполняется параллельно потоковыми батчами. Pandas работает около 365 секунд на бенчмарке PDS-H SF-10; Polars — около 3,89 секунды.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="eagerlazy-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="eagerlazy-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
