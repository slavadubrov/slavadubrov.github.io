<text x="48" y="236" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="48">RAM: 2–3 размера датасета — весь файл загружен, затем + копия после фильтрации, затем</tspan><tspan x="48" dy="1.2em">+ копия агрегации.</tspan></text>
