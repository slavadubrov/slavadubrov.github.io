<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Мультидвижковый пайплайн</title>
  <desc id="desc">Опциональный relay через передачу Parquet-файлов между этапами табличной трансформации, мультимодальной обработки и локального анализа. Поддержка Delta зависит от движка и коннектора.</desc>
  <defs>
    <!-- Arrow marker for regular paths -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
    <!-- Animations -->
    <style>
      .flow { opacity: 0; animation: flowMove 6s infinite; }
      @keyframes flowMove {
        0% { opacity: 0; stroke-dashoffset: 400; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { opacity: 0; stroke-dashoffset: 0; }
      }
      .path-line { stroke-dasharray: 400; }
      .p1 { animation-delay: 0s; stroke: #59645E; }
      .p2-top { animation-delay: 2s; stroke: #59645E; }
      .p2-bot { animation-delay: 2s; stroke: #17211B; }
    </style>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="400" rx="12" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1.5" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#17211B">Один из вариантов мультидвижкового relay</text>
  <text x="450" y="52" text-anchor="middle" font-size="13" fill="#17211B">Добавляйте движок только если граница этапа оправдывает операционные затраты.</text>

  <!-- Node 1: Data Lake -->
  <rect x="50" y="160" width="160" height="130" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="130" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Data Lake</text>
  <text x="130" y="225" text-anchor="middle" font-size="12" fill="#17211B">Сырые логи</text>
  <text x="130" y="245" text-anchor="middle" font-size="12" fill="#17211B">JSON / CSV</text>
  <text x="130" y="265" text-anchor="middle" font-size="12" fill="#17211B">Неструктурированные файлы</text>

  <!-- Path 1: Lake -> Spark -->
  <path id="path1" d="M 210 225 L 340 225" fill="none" class="path-line p1 flow" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="210" y1="225" x2="335" y2="225" stroke="#17211B" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Node 2: Spark / Dask -->
  <rect x="350" y="160" width="180" height="130" rx="10" fill="#ffffff" stroke="#59645E" stroke-width="2" class="visual-focus" />
  <text x="440" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Spark / Dask</text>
  <text x="440" y="225" text-anchor="middle" font-size="12" fill="#17211B">Проверенный ETL и очистка</text>
  <text x="440" y="245" text-anchor="middle" font-size="12" fill="#17211B">Распределённые join-операции</text>
  <rect x="390" y="260" width="100" height="20" rx="4" fill="#FFFFFF" />
  <text x="440" y="274" text-anchor="middle" font-size="11" fill="#ffffff">Выходной Parquet</text>

  <!-- Path 2 Top: Spark -> Ray/Daft -->
  <path id="path2top" d="M 530 195 C 600 195, 600 135, 660 135" fill="none" class="path-line p2-top flow" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 530 195 C 600 195, 600 135, 655 135" fill="none" stroke="#59645E" stroke-width="3" stroke-dasharray="6,4" />

  <rect x="535" y="140" width="100" height="24" rx="4" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="585" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">Передача Parquet</text>

  <!-- Node 3 Top: Ray / Daft -->
  <rect x="670" y="70" width="180" height="130" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
  <text x="760" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Ray / Daft</text>
  <text x="760" y="135" text-anchor="middle" font-size="12" fill="#17211B">Смешанные CPU/GPU-задачи</text>
  <text x="760" y="155" text-anchor="middle" font-size="12" fill="#17211B">Мультимодальный инференс</text>
  <text x="760" y="175" text-anchor="middle" font-size="12" fill="#17211B">Обучение ML</text>

  <!-- Path 2 Bottom: Spark -> Polars/DuckDB -->
  <path id="path2bot" d="M 530 255 C 600 255, 600 315, 660 315" fill="none" class="path-line p2-bot flow" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 530 255 C 600 255, 600 315, 655 315" fill="none" stroke="#17211B" stroke-width="3" stroke-dasharray="6,4" />

  <rect x="535" y="286" width="100" height="24" rx="4" fill="#ffffff" stroke="#17211B" stroke-width="1.5" />
  <text x="585" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#17211B">Передача Parquet</text>

  <!-- Node 3 Bottom: Polars / DuckDB -->
  <rect x="670" y="250" width="180" height="130" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="760" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Polars / DuckDB</text>
  <text x="760" y="315" text-anchor="middle" font-size="12" fill="#17211B">Ad-Hoc-анализ</text>
  <text x="760" y="335" text-anchor="middle" font-size="12" fill="#17211B">Локальная разработка и EDA</text>
  <text x="760" y="355" text-anchor="middle" font-size="12" fill="#17211B">Интерактивные запросы</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
