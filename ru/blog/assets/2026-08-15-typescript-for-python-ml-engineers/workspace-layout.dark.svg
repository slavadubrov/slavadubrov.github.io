<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ПАКЕТЫ · ОБЩИЕ БИБЛИОТЕКИ</text>
