<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="workspace-title workspace-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="workspace-title">Одна Zod-схема достигает трёх потребителей, взаимодействующих с моделью</title><desc id="workspace-desc">Выделенная схема EstimateKvCacheInput в packages/schemas питает самописный цикл, адаптер Vercel AI SDK и паблишер MCP-инструмента. Два адаптера цикла обслуживают Hono API; паблишер — MCP-сервер. API записывает данные в таблицу runs в Postgres, а воркер забирает из неё строки.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="workspace-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="workspace-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="840" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Одна схема, три потребителя</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Общее объявление принимает разную форму в каждом адаптере; приложения остаются</tspan><tspan x="32" dy="1.2em">независимыми друг от друга.</tspan></text>
