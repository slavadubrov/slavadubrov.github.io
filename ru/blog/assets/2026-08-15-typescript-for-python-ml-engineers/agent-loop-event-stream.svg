<path d="M32 736h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="762" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">Тесты напрямую собирают события; HTTP-роут оформляет их как SSE и сохраняет результат только после</text>
<text x="32" y="784" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;">стриминг завершён. Без tool call: done(stop); при лимите шагов: done(max_steps),</text>
<text x="32" y="806" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">то есть выполнение завершено, но результат усечён.</text>
</svg>
