<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="loop-title">Ручной агентный цикл предоставляет типизированный поток событий</title><desc id="loop-desc">Модель стримит чанки в буфер фрагментов. Цикл собирает вызовы, парсит и валидирует их, запускает валидные tool и добавляет tool-сообщения в историю сообщений перед следующим шагом. Невалидный ввод становится tool-ошибкой в той же истории, а не завершает цикл. Специализированный асинхронный генератор AgentEvent передаёт события HTTP-роуту и тестам. После стриминга HTTP-роут записывает финальный результат запуска.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="loop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="loop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="840" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Один шаг цикла — затем стабильный интерфейс</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Ремонт выполняется внутри цикла. Потребители видят типизированные события вместо чанков</tspan><tspan x="32" dy="1.2em">провайдера модели.</tspan></text>
<rect x="32" y="104" width="656" height="272" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">RUNAGENT · ОДИН ШАГ</text>
