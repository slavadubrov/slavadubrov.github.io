<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 768" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="loop-title loop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="loop-title">Написанный вручную агентный цикл предоставляет типизированный поток событий</title>
  <desc id="loop-desc">Модель стримит чанки в буфер фрагментов. Цикл собирает вызовы, парсит и валидирует их, запускает валидные инструменты и добавляет сообщения инструментов в историю сообщений перед следующим шагом. Невалидный ввод становится ошибкой инструмента в той же истории, а не прерывает цикл. Специализированный async-генератор AgentEvent подаёт события HTTP-маршруту и тестам. После стриминга HTTP-маршрут записывает финальный результат запуска.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #a8b8af; }
    .box { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .store { fill: #1b2621; stroke: #edf5f0; stroke-width: 1.5; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="768" rx="14" fill="#0c1210" />
  <text class="name" x="48" y="44">Один шаг цикла — затем стабильный интерфейс</text>
  <text class="note" x="48" y="68">Исправление остаётся внутри цикла. Потребители получают типизированные события, а не чанки провайдера модели.</text>

  <rect x="48" y="96" width="864" height="336" rx="12" fill="none" stroke="#2b3b33" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="section" x="68" y="120">RUNAGENT · ОДИН ШАГ</text>

  <rect x="68" y="144" width="160" height="96" rx="10" fill="#141d19" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="88" y="178">ВНЕШНИЙ КОНТУР</text><text class="name" x="88" y="206" fill="#a8b8af">Поток модели</text>
  <rect class="store" x="268" y="144" width="176" height="96" rx="10" />
  <text class="kind" x="288" y="178">ХРАНЕНИЕ</text><text class="name" x="288" y="206">Фрагменты вызова</text>
  <rect class="box" x="484" y="144" width="176" height="96" rx="10" />
  <text class="kind" x="504" y="178">ОБРАБОТКА</text><text class="name" x="504" y="206">Парсинг + валидация</text>
  <rect class="box" x="700" y="144" width="192" height="96" rx="10" />
  <text class="kind" x="720" y="178">ОБРАБОТКА</text><text class="name" x="720" y="206">Запуск валидного инструмента</text>

  <path class="edge" d="M228 192h32" marker-end="url(#loop-arrow)" />
  <rect x="220" y="164" width="48" height="20" rx="6" fill="#0c1210" /><text class="note" x="244" y="179" text-anchor="middle">чанки</text>
  <path class="edge" d="M444 192h32" marker-end="url(#loop-arrow)" />
  <rect x="444" y="164" width="40" height="20" rx="6" fill="#0c1210" /><text class="note" x="464" y="179" text-anchor="middle">индекс</text>
  <path class="edge" d="M660 192h32" marker-end="url(#loop-arrow)" />
  <rect x="656" y="164" width="40" height="20" rx="6" fill="#0c1210" /><text class="note" x="676" y="179" text-anchor="middle">валидно</text>

  <rect class="store" x="268" y="304" width="392" height="96" rx="10" />
  <text class="kind" x="288" y="338">ХРАНЕНИЕ</text><text class="name" x="288" y="366">История сообщений ассистента и инструментов</text>
  <path class="edge" d="M796 240v112H668" marker-end="url(#loop-arrow)" />
  <rect x="700" y="324" width="104" height="20" rx="6" fill="#0c1210" /><text class="note" x="752" y="339" text-anchor="middle">результат инструмента</text>
  <path class="edge" d="M572 240v40H464v16" stroke-dasharray="7 6" marker-end="url(#loop-arrow)" />
  <rect x="476" y="260" width="176" height="24" rx="6" fill="#0c1210" /><text class="note" x="564" y="277" text-anchor="middle">невалидно → ошибка инструмента</text>
  <path class="edge" d="M268 352H148V248" marker-end="url(#loop-arrow)" />
  <rect x="144" y="320" width="88" height="20" rx="6" fill="#0c1210" /><text class="note" x="188" y="335" text-anchor="middle">следующий шаг</text>
  <text class="note" x="68" y="416">Отсутствие tool call даёт done(stop); лимит шагов даёт done(max_steps) — завершённый, но усечённый результат.</text>

  <path class="edge" d="M464 400v64" stroke-dasharray="2 6" marker-end="url(#loop-arrow)" />
  <rect x="376" y="432" width="176" height="24" rx="6" fill="#0c1210" /><text class="note" x="464" y="449" text-anchor="middle">генерация после каждого изменения</text>
  <rect x="260" y="472" width="440" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="280" y="506" fill="#ff6fb6">ФОКУС · ASYNC-ГЕНЕРАТОР</text>
  <text class="name" x="280" y="534" fill="#ff6fb6">Поток AgentEvent</text>
  <text class="note" x="448" y="534" fill="#ff6fb6">text · tool_call · tool_result · done · error</text>

  <path class="edge" d="M480 568v40H196v24M480 608v24" />
  <rect x="356" y="592" width="248" height="24" rx="6" fill="#0c1210" /><text class="note" x="480" y="609" text-anchor="middle">одни события, два потребителя</text>
  <rect class="box" x="68" y="640" width="256" height="62" rx="10" />
  <text class="kind" x="88" y="664">ОБРАБОТКА</text><text class="name" x="176" y="680">HTTP-маршрут</text>
  <rect class="box" x="352" y="640" width="256" height="62" rx="10" />
  <text class="kind" x="372" y="664">ОБРАБОТКА</text><text class="name" x="460" y="680">Тестовый харнесс</text>
  <rect class="store" x="636" y="640" width="256" height="62" rx="10" />
  <text class="kind" x="656" y="664">ХРАНЕНИЕ</text><text class="name" x="720" y="680">Результат запуска</text>

  <path class="edge" d="M196 702v24h568v-16" marker-end="url(#loop-arrow)" />
  <rect x="366" y="710" width="228" height="24" rx="6" fill="#0c1210" /><text class="note" x="480" y="727" text-anchor="middle">финальный текст после потока</text>
  <text class="note" x="48" y="752">Тесты напрямую собирают события; HTTP-маршрут оформляет их как SSE и сохраняет результат только после завершения стриминга.</text>

  <defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a8b8af" /></marker></defs>
</svg>
