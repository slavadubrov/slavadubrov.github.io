<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="decision-title decision-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="decision-title">Путь выбора локального workflow для генерации изображений в macOS</title>
  <desc id="decision-desc">Выберите нативное приложение, инспектируемый граф или существующий интерфейс в зависимости от состояния, которое должно сохраняться. Проверьте поддержку точной модели и стека macOS. Неподдерживаемые варианты возвращаются к выбору; поддерживаемые переходят к репрезентативному приёмочному тесту.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #17211b; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #59645e; }
    .edge { stroke: #59645e; stroke-width: 1.5; fill: none; }
    .process { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
    .decision { fill: #ffffff; stroke: #17211b; stroke-width: 1.5; }
  </style>
  <rect width="960" height="672" rx="14" fill="#f7f7f4" />
  <text class="kind" x="48" y="40">КАРТА РЕШЕНИЙ · ВЫБОР ПО УПРАВЛЯЕМОМУ СОСТОЯНИЮ</text>

  <path class="decision" d="M480 64 608 112 480 160 352 112Z" />
  <text class="kind" x="480" y="105" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="480" y="130" text-anchor="middle">Какое состояние должно сохраняться?</text>

  <path class="edge" d="M480 160v24M176 184h608" />
  <path class="edge" d="M176 184v16" marker-end="url(#decision-arrow)" />
  <path class="edge" d="M480 184v16" marker-end="url(#decision-arrow)" />
  <path class="edge" d="M784 184v16" marker-end="url(#decision-arrow)" />

  <rect class="process" x="48" y="208" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="242">ВЗАИМОДЕЙСТВИЕ</text>
  <text class="name" x="68" y="270">Нативное приложение</text>
  <text class="note" x="48" y="330">Draw Things · DiffusionBee</text>

  <rect class="process" x="352" y="208" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="242">ПАЙПЛАЙН</text>
  <text class="name" x="372" y="270">Инспектируемый граф</text>
  <text class="note" x="352" y="330">ComfyUI</text>

  <rect class="process" x="656" y="208" width="256" height="96" rx="10" />
  <text class="kind" x="676" y="242">СОВМЕСТИМОСТЬ</text>
  <text class="name" x="676" y="270">Существующий интерфейс</text>
  <text class="note" x="656" y="330">AUTOMATIC1111 · Fooocus</text>

  <path class="edge" d="M272 304v40M480 304v40M880 304v40M272 344h608M480 344v24" marker-end="url(#decision-arrow)" />

  <path class="decision" d="M480 376 624 424 480 472 336 424Z" />
  <text class="kind" x="480" y="417" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="480" y="442" text-anchor="middle">Точный стек поддерживается?</text>

  <path class="edge" d="M480 472v40" marker-end="url(#decision-arrow)" />
  <rect x="494" y="481" width="40" height="22" rx="6" fill="#f7f7f4" />
  <text class="note" x="514" y="497" text-anchor="middle">да</text>

  <path class="edge" d="M336 424H24V112h320" stroke-dasharray="7 6" marker-end="url(#decision-arrow)" />
  <rect x="48" y="411" width="174" height="24" rx="6" fill="#f7f7f4" />
  <text class="note" x="135" y="428" text-anchor="middle">нет · выберите другой путь</text>

  <rect x="304" y="520" width="352" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="324" y="554" fill="#c50e72">ФОКУС</text>
  <text class="name" x="324" y="582" fill="#c50e72">Репрезентативный приёмочный тест</text>
  <text class="note" x="304" y="646">Измерьте · перезапустите · воспроизведите · зафиксируйте релизную единицу</text>

  <defs>
    <marker id="decision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
</svg>
