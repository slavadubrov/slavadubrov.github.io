<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="workflow-title">Записи, делающие локальный image-пайплайн воспроизводимым</title>
  <desc id="workflow-desc">Воспроизводимая единица релиза содержит пять постоянных записей: версию приложения, компоненты модели, настройки генерации, зависимости пайплайна и свидетельства результата. Файл модели — лишь одна часть этого пакета.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .store { fill: #1b2621; stroke: #edf5f0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0c1210" />

  <rect x="48" y="64" width="864" height="344" rx="12" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="72" y="94" fill="#ff6fb6">ФОКУС</text>
  <text class="name" x="148" y="94">Воспроизводимая единица релиза</text>

  <rect class="store" x="80" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="100" y="162">РАНТАЙМ</text>
  <text class="name" x="100" y="190">Версия приложения</text>

  <rect class="store" x="360" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="380" y="162">МАНИФЕСТ</text>
  <text class="name" x="380" y="190">Компоненты модели</text>

  <rect class="store" x="640" y="128" width="240" height="96" rx="10" />
  <text class="kind" x="660" y="162">ПАРАМЕТРЫ</text>
  <text class="name" x="660" y="190">Настройки генерации</text>

  <rect class="store" x="220" y="264" width="240" height="96" rx="10" />
  <text class="kind" x="240" y="298">ЗАВИСИМОСТИ</text>
  <text class="name" x="240" y="326">Граф пайплайна</text>

  <rect class="store" x="500" y="264" width="240" height="96" rx="10" />
  <text class="kind" x="520" y="298">СВИДЕТЕЛЬСТВА</text>
  <text class="name" x="520" y="326">Запись о результате</text>

  <path d="M48 440h48" fill="none" stroke="#2b3b33" stroke-width="1.5" />
  <text class="note" x="112" y="445">Зафиксируйте идентичность всех компонентов; одного чекпоинта недостаточно для воспроизведения результата.</text>
</svg>
