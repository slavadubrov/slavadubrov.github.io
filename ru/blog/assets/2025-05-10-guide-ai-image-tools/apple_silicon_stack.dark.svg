<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="memstack-title memstack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="memstack-title">Единый пул памяти Apple Silicon — общий, но не безграничный: его одновременно используют пять компонентов.</title><desc id="memstack-desc">Системные накладные расходы macOS и других приложений, компоненты весов модели, рабочее пространство рантайма и опционально загруженные адаптеры используют один общий пул памяти. Рабочий запас памяти — это объём, который должен оставаться до того, как генерация начнёт стабильно обращаться к swap.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="memstack-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="memstack-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="848" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Один общий пул, пять потребителей</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Концептуальная схема, не в масштабе — Apple документирует единый пул, но не формулу расчёта</tspan><tspan x="32" dy="1.2em">объёма.</tspan></text>
<rect x="32" y="104" width="656" height="656" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="130" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ЕДИНЫЙ ПУЛ ПАМЯТИ</text>
<path d="M58 152h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 152h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="62" y="169.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">СИСТЕМА</text><text x="62" y="213" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">macOS и приложения</text><text x="62" y="235" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Меняется во время работы.</text>
<path d="M58 272h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 272h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="289.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ВЕСА</text><text x="62" y="333" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Компоненты модели</text><text x="62" y="355" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Чекпоинт, энкодеры, VAE.</text>
<path d="M58 392h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 392h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="409.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">РАБОЧЕЕ ПРОСТРАНСТВО</text><text x="62" y="453" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Активации и рантайм</text><text x="62" y="475" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Аттеншн, промежуточное состояние.</text>
<path d="M58 512h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 512h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="529.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ОПЦИОНАЛЬНАЯ ЗАГРУЗКА</text><text x="62" y="573" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Адаптеры и управляющие модули</text><text x="62" y="595" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">LoRA, ControlNet, апскейлер.</text>
<path d="M58 632h604a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-604a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M58 632h604a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-624a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="62" y="649.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЗАПАС</text><text x="62" y="693" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Рабочий запас памяти</text><text x="62" y="715" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Оставьте запас до стабильного обращения к swap.</text>
<path d="M32 792h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="818" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Разрешение, размер батча, архитектура, точность и загруженные этапы меняют нагрузку каждого</tspan><tspan x="32" dy="1.2em">компонента.</tspan></text>
</svg>
