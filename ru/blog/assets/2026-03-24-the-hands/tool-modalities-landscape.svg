<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Tool Modalities Landscape" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Ландшафт модальностей инструментов</title>
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Title -->
  <text y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" x="550">Пять модальностей инструментов для ИИ-агентов</text>
  <text y="50" text-anchor="middle" font-size="11" fill="#64748b" x="550">Сравнение пяти интерфейсов по токенным накладным расходам и оптимальным сценариям применения</text>

  <!-- Central Agent Node -->
  <rect x="460" y="70" width="180" height="50" rx="25" fill="#7c3aed" filter="url(#shadow)" />
  <text y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" x="550">ИИ-агент</text>

  <!-- Connecting lines from agent to each modality -->
  <line x1="480" y1="120" x2="140" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="510" y1="120" x2="345" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="550" y1="120" x2="525" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="590" y1="120" x2="705" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="620" y1="120" x2="935" y2="175" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 1. JSON Tool Calling -->
  <rect x="30" y="175" width="200" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8" x="130">Вызов инструментов через JSON</text>
  <line x1="50" y1="210" x2="210" y2="210" stroke="#2563eb" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="130">550–1 400 токенов/инструмент</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="130">Последовательные вызовы 1:1</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="130">Структурированный I/O</text>
  <rect x="55" y="275" width="150" height="20" rx="4" fill="#2563eb" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8" x="130">Высокие накладные расходы</text>

  <!-- 2. MCP -->
  <rect x="240" y="175" width="200" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b" x="340">MCP-серверы</text>
  <line x1="260" y1="210" x2="420" y2="210" stroke="#dc2626" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="340">55K+ токенов для ~40 инструментов</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="340">10K+ серверов, 50 отслеживаемых уязвимостей</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="340">Кросс-вендорный стандарт</text>
  <rect x="265" y="275" width="150" height="20" rx="4" fill="#dc2626" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b" x="340">Очень высокие накладные расходы</text>

  <!-- 3. Skills (SKILL.md) -->
  <rect x="450" y="175" width="200" height="130" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6" x="550">Skills (SKILL.md)</text>
  <line x1="470" y1="210" x2="630" y2="210" stroke="#7c3aed" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="550">~100 токенов метаданных</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="550">Экспертиза, а не выполнение</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="550">Принято на 8+ платформах</text>
  <rect x="475" y="275" width="150" height="20" rx="4" fill="#7c3aed" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#5b21b6" x="550">Очень низкие накладные расходы</text>

  <!-- 4. CLI/Bash -->
  <rect x="660" y="175" width="200" height="130" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#166534" x="760">CLI / Bash-инструменты</text>
  <line x1="680" y1="210" x2="840" y2="210" stroke="#166534" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="760">Почти нулевые метаданные</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="760">Нативная беглость модели</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="760">Пайпы, композируемость</text>
  <rect x="685" y="275" width="150" height="20" rx="4" fill="#166534" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#166534" x="760">Почти нулевые накладные расходы</text>

  <!-- 5. Code Execution (PTC) -->
  <rect x="870" y="175" width="200" height="130" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
  <text y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412" x="970">Выполнение кода</text>
  <line x1="890" y1="210" x2="1050" y2="210" stroke="#ea580c" stroke-width="0.5" opacity="0.3" />
  <text y="228" text-anchor="middle" font-size="10" fill="#334155" x="970">98,7% в одном пайплайне</text>
  <text y="244" text-anchor="middle" font-size="10" fill="#334155" x="970">До +20% к успешности задач</text>
  <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="970">Циклы, условные конструкции</text>
  <rect x="895" y="275" width="150" height="20" rx="4" fill="#ea580c" opacity="0.15" />
  <text y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412" x="970">Низкие накладные расходы</text>

  <!-- Bottom spectrum bar -->
  <text y="340" font-size="10" font-weight="600" fill="#64748b" x="30">ТОКЕННЫЕ НАКЛАДНЫЕ РАСХОДЫ (от высоких → к низким)</text>
  <rect x="30" y="350" width="1040" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <!-- Gradient fill segments — ordered highest to lowest overhead -->
  <rect x="31" y="351" width="208" height="22" rx="31" fill="#fef2f2" opacity="0.7" />
  <rect x="239" y="351" width="207" height="22" rx="239" fill="#eff6ff" opacity="0.7" />
  <rect x="446" y="351" width="208" height="22" rx="446" fill="#fff7ed" opacity="0.7" />
  <rect x="654" y="351" width="207" height="22" rx="654" fill="#faf5ff" opacity="0.7" />
  <rect x="861" y="351" width="208" height="22" rx="861" fill="#f0fdf4" opacity="0.7" />

  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b" x="135">MCP: 55K+ токенов</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8" x="342">JSON: 550–1 400/инструмент</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#9a3412" x="550">Выполнение кода: 2 мета-инструмента</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6" x="758">Skills: ~100 токенов</text>
  <text y="367" text-anchor="middle" font-size="9" font-weight="600" fill="#166534" x="965">CLI: почти ноль</text>

  <!-- Best-for labels -->
  <text y="405" font-size="10" font-weight="600" fill="#64748b" x="30">ОПТИМАЛЬНО ДЛЯ</text>
  <rect x="30" y="415" width="200" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#1d4ed8" x="130">Простых одиночных действий</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#1d4ed8" x="130">Вызовов API</text>

  <rect x="240" y="415" width="200" height="45" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#991b1b" x="340">Кросс-вендорной SaaS</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#991b1b" x="340">интеграции</text>

  <rect x="450" y="415" width="200" height="45" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#5b21b6" x="550">Доменных знаний</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#5b21b6" x="550">передачи</text>

  <rect x="660" y="415" width="200" height="45" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#166534" x="760">Dev-воркфлоу,</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#166534" x="760">локальных операций</text>

  <rect x="870" y="415" width="200" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1" />
  <text y="434" text-anchor="middle" font-size="9" fill="#9a3412" x="970">Многошаговой</text>
  <text y="448" text-anchor="middle" font-size="9" fill="#9a3412" x="970">оркестрации</text>

  <!-- Legend -->
  <text y="495" font-size="10" fill="#64748b" x="30">Ни одна модальность не выигрывает безоговорочно: накладные расходы — лишь одна из осей; см. сравнительную таблицу по безопасности, латентности и композируемости</text>

  <!-- Sources -->
  <text y="540" font-size="9" fill="#64748b" x="30">Источники: данные о токенах MCP — Apideck (apideck.com/blog); 50 отслеживаемых уязвимостей — vulnerablemcp.info; +20% для CodeAct — Wang et al. (arXiv:2402.01030, ICML 2024);</text>
  <text y="552" font-size="9" fill="#64748b" x="30">Снижение на 98,7% — Anthropic «Code execution with MCP»; ~100 токенов для Skills — прогрессивное раскрытие SKILL.md</text>
</svg>
