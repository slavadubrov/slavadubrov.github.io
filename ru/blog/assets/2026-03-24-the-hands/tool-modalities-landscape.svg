<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tm-title tm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tm-title">Пять интерфейсов для tool use ИИ-агента</title>
  <desc id="tm-desc">Сравнение JSON tool calling, MCP, Skills, инструментов командной строки и code execution по тому, какие данные передаёт каждый интерфейс, где он уместен и какие типичные накладные расходы на контекст создаёт. Code execution выделен для мультиагентной оркестрации.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="44">КАРТА ИНТЕРФЕЙСОВ — ВЫБИРАЙТЕ ПО СТРУКТУРЕ ЗАДАЧИ</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">АТОМАРНЫЕ ВЫЗОВЫ</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150">Типизированный запрос/ответ · 550–1 400 токенов схемы на инструмент</text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">ОБЩАЯ ИНТЕГРАЦИЯ</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150">Обнаружение + транспорт · загружайте только инструменты, нужные задаче</text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">ПРОЦЕДУРА</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286">Инструкции по запросу · около 100 токенов стартовых метаданных</text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">ЛОКАЛЬНАЯ ОПЕРАЦИЯ</text>
  <text class="name" x="520" y="262">CLI и shell</text>
  <text class="note" x="520" y="286">Комбинируемые команды · низкие накладные расходы на схему</text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#C50E72">ФОКУС · МНОГОШАГОВАЯ РАБОТА</text>
  <text class="name" x="294" y="398" fill="#C50E72">Code execution</text>
  <text class="note" x="294" y="422">Циклы и условные операторы · итоговое резюме возвращается в контекст</text>
  <path d="M48 472H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="note" x="48" y="490">Протокол не задаёт политики: аутентификация, авторизация, логирование и сэндбоксинг по-прежнему относятся к харнессу.</text>
</svg>
