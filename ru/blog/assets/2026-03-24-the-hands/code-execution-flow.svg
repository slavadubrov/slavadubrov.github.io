<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="codeexec-title codeexec-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="codeexec-title">Традиционный tool calling повторно пропускает каждый результат через контекст; code execution возвращает одно резюме.</title><desc id="codeexec-desc">При традиционном вызове каждый результат отправляется из контекста обратно модели перед следующим вызовом. Code execution записывает один скрипт, который выполняет вызовы и обрабатывает строки внутри сэндбокса, а затем возвращает модели только итоговое резюме.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="codeexec-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="codeexec-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="560" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Повторять каждый результат или возвращать одно резюме</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">При традиционном вызове каждый результат возвращается через контекст перед следующим вызовом.</text>
<text x="32" y="100" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Code execution выполняет вызовы в сэндбоксе и возвращает только итоговое резюме.</text>
<text x="32" y="120" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ТРАДИЦИОННЫЙ ПОДХОД · ПОВТОР ЧЕРЕЗ КОНТЕКСТ</text>
<path d="M42 136h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">МОДЕЛЬ</text><text x="46" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 15px;">Выбрать один вызов</text>
<path d="M230 136h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M230 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="234" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">ВНЕШНИЕ СИСТЕМЫ</text><text x="234" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#59645E" style="font-size: 15.5px;">Инструмент или API</text>
<path d="M418 136h152a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M418 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="422" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">КОНТЕКСТ</text><text x="422" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 12.5px;">Результат возвращается</text>
<path d="M204 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#codeexec-arrow-flow)" />
<path d="M392 172h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#codeexec-arrow-flow)" />
<path d="M494 208v40H118v-40" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#codeexec-arrow-flow)" /><rect x="186" y="236" width="240" height="24" rx="6" fill="#F7F7F4" stroke="#D8DDD9" stroke-width="1" /><text x="306" y="252.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#59645E" text-anchor="middle" style="font-size: 11px;">результат снова в контексте</text>
<text x="32" y="300" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">CODE EXECUTION · ОДНО РЕЗЮМЕ</text>
<path d="M42 316h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M42 316h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="46" y="333.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">МОДЕЛЬ</text><text x="46" y="367" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Написать скрипт</text><text x="46" y="389" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Одна программа,</text><text x="46" y="409" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13px;">а не множество вызовов</text>
<path d="M230 316h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M230 316h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="234" y="333.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">СЭНДБОКС</text><text x="234" y="367" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B" style="font-size: 12.5px;">Выполнить и обработать</text><text x="234" y="389" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Множество вызовов,</text><text x="234" y="409" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">обработка в циклах</text>
<path d="M418 316h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M418 316h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="422" y="333.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ФОКУС · ВОЗВРАТ</text><text x="422" y="367" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Одно резюме</text><text x="422" y="389" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 13.5px;">Остальное остаётся вне</text><text x="422" y="409" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">контекста модели</text>
<path d="M204 368h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#codeexec-arrow-flow)" />
<path d="M392 368h16" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#codeexec-arrow-flow)" />
<path d="M32 470h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="496" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Редизайн Vercel: 17 инструментов → 2 мета-инструмента, токены −37%</text>
<text x="32" y="518" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Anthropic сообщила о сокращении числа токенов на 98,7% в одном workflow от Drive до Salesforce.</text>
</svg>
