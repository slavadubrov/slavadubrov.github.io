<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tmd-title tmd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tmd-title">Пять интерфейсов для tool use ИИ-агента</title>
  <desc id="tmd-desc">Сравнение JSON tool calling, MCP, Skills, инструментов командной строки и code execution по тому, какие данные передаёт каждый интерфейс, где он уместен и какие типичные накладные расходы на контекст создаёт. Code execution выделен для мультиагентной оркестрации.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="44">КАРТА ИНТЕРФЕЙСОВ — ВЫБИРАЙТЕ ПО СТРУКТУРЕ ЗАДАЧИ</text>
  <rect class="box" x="48" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="100">АТОМАРНЫЕ ВЫЗОВЫ</text>
  <text class="name" x="68" y="126">JSON tool calling</text>
  <text class="note" x="68" y="150"><tspan x="68">Типизированный запрос/ответ · 550–1 400 токенов схемы</tspan><tspan x="68" dy="1.2em">на инструмент</tspan></text>
  <rect class="box" x="500" y="72" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="100">ОБЩАЯ ИНТЕГРАЦИЯ</text>
  <text class="name" x="520" y="126">MCP</text>
  <text class="note" x="520" y="150"><tspan x="520">Обнаружение + транспорт · загружайте только</tspan><tspan x="520" dy="1.2em">инструменты, нужные задаче</tspan></text>
  <rect class="box" x="48" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="68" y="236">ПРОЦЕДУРА</text>
  <text class="name" x="68" y="262">Skills</text>
  <text class="note" x="68" y="286"><tspan x="68">Инструкции по запросу · около 100 токенов стартовых</tspan><tspan x="68" dy="1.2em">метаданных</tspan></text>
  <rect class="box" x="500" y="208" width="412" height="96" rx="10" />
  <text class="kind" x="520" y="236">ЛОКАЛЬНАЯ ОПЕРАЦИЯ</text>
  <text class="name" x="520" y="262">CLI и shell</text>
  <text class="note" x="520" y="286"><tspan x="520">Комбинируемые команды · низкие накладные расходы на</tspan><tspan x="520" dy="1.2em">схему</tspan></text>
  <rect x="274" y="344" width="412" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="294" y="372" fill="#FF6FB6">ФОКУС · МНОГОШАГОВАЯ РАБОТА</text>
  <text class="name" x="294" y="398" fill="#FF6FB6">Code execution</text>
  <text class="note" x="294" y="422"><tspan x="294">Циклы и условные операторы · итоговое резюме</tspan><tspan x="294" dy="1.2em">возвращается в контекст</tspan></text>
  <path d="M48 472H912" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="48" y="490">Протокол не задаёт политики: аутентификация, авторизация, логирование и сэндбоксинг по-прежнему относятся к харнессу.</text>
</svg>
