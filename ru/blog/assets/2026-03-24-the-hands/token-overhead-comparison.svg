<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="to-title to-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="to-title">Определения инструментов могут занимать контекст ещё до начала работы</title>
  <desc id="to-desc">Приведённые примеры показывают 143 000 токенов для одной крупной MCP-конфигурации и 55 000 — примерно для 40 MCP-инструментов. Для десяти JSON Schema оценивается от 5 500 до 14 000 токенов. Метаданные запуска скилла занимают около 100 токенов. Выполнение кода использует небольшое число метаинструментов, но сопоставимая оценка не приводится.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .source { font: 400 11px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .grid { stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="512" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">НАКЛАДНЫЕ РАСХОДЫ НА ОПРЕДЕЛЕНИЯ ДО ЗАДАЧИ</text>
  <text class="note" x="48" y="68">Приведённые примеры, а не единый контролируемый бенчмарк · горизонтальная шкала — в тысячах токенов</text>

  <path class="grid" d="M300 88V424M493 88V424M687 88V424M880 88V424" />
  <text class="kind" x="300" y="84" text-anchor="middle">0</text>
  <text class="kind" x="493" y="84" text-anchor="middle">50K</text>
  <text class="kind" x="687" y="84" text-anchor="middle">100K</text>
  <text class="kind" x="880" y="84" text-anchor="middle">150K</text>

  <text class="kind" x="48" y="124" fill="#C50E72">ФОКУС · MCP</text>
  <text class="name" x="48" y="148" fill="#C50E72">Крупная конфигурация</text>
  <rect x="300" y="116" width="553" height="32" rx="6" fill="#F2148E" />
  <text class="name" x="840" y="139" text-anchor="end" fill="#17211B">143K</text>
  <text class="note" x="300" y="170">72% контекстного окна на 200K в приведённой конфигурации</text>

  <text class="kind" x="48" y="212">MCP</text>
  <text class="name" x="48" y="236">Около 40 инструментов</text>
  <rect x="300" y="204" width="213" height="32" rx="6" fill="#17211B" />
  <text class="name" x="525" y="227">55K</text>
  <text class="note" x="300" y="258">Схемы загружаются до того, как пользователь задаёт вопрос</text>

  <text class="kind" x="48" y="300">JSON SCHEMAS</text>
  <text class="name" x="48" y="324">Десять инструментов</text>
  <path d="M321 308H354" stroke="#17211B" stroke-width="8" />
  <circle cx="321" cy="308" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <circle cx="354" cy="308" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="372" y="314">5,5–14K</text>
  <text class="note" x="300" y="346">Диапазон рассчитан из 550–1 400 токенов на определение</text>

  <text class="kind" x="48" y="388">ПРОГРЕССИВНАЯ ЗАГРУЗКА</text>
  <text class="name" x="48" y="412">Метаданные скилла</text>
  <circle cx="301" cy="396" r="7" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="name" x="320" y="402">~100 токенов</text>
  <text class="note" x="300" y="434">Полные инструкции загружаются только при активации скилла</text>

  <path d="M48 456H912" stroke="#D8DDD9" stroke-width="1" />
  <text class="source" x="48" y="478">Источники: Apideck для значений 55K и 143K; оценка из статьи для десяти JSON Schema; рекомендации Skills по прогрессивному раскрытию.</text>
  <text class="source" x="48" y="496"><tspan x="48">Выполнение кода заменяет множество схем несколькими метаинструментами, но накладные расходы на их определения зависят от харнесса и на графике не</tspan><tspan x="48" dy="1.2em">показаны.</tspan></text>
</svg>
