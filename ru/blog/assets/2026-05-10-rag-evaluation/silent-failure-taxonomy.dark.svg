<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="silentfailure-title silentfailure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="silentfailure-title">Четырёхэтапный пайплайн связывает каждый тихий сбой с метрикой, которая его выявляет.</title><desc id="silentfailure-desc">Доказательства проходят от исходного корпуса через множество подходящих документов, ранжированный контекст и сгенерированный ответ. В центре внимания — множество подходящих документов: жёсткий фильтр может удалить эталонный документ ещё до ранжирования. Каждый этап связан с метрикой, выявляющей сбой на этом этапе: метрики парсинга, Recall@k и доля ложного исключения, метрики позиции и дистракторов, а также Faithfulness с precision и recall цитирования.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="silentfailure-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="silentfailure-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="520" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Найдите этап, на котором исчезли доказательства</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Первое разорванное звено ограничивает все метрики справа от него.</text>
<path d="M42 136h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 136h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="153.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ИСТОЧНИК</text><text x="46" y="197" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Исходный корпус</text><text x="46" y="219" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="46">парсинг, чанкинг,</tspan><tspan x="46" dy="1.2em">индексация</tspan></text><circle cx="32" cy="136" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="140.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M204 188h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#silentfailure-arrow-flow)" />
