<text x="32" y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Recall@k выявляет отсутствующий эталонный документ.</text>
<text x="32" y="464" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Метрика ложного исключения выявляет фильтр как причину; Faithfulness не может диагностировать этот сбой.</text>
