<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rag-pipeline-title rag-pipeline-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="rag-pipeline-title">RAG-пайплайн и метрики для диагностики каждого этапа</title>
  <desc id="rag-pipeline-desc">Три сгруппированных участка пайплайна связывают ingestion, query time и генерацию ответа с наборами диагностических метрик. Метрики query time выделены, поскольку rewriting и filtering могут удалить evidence до ранжирования.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="rag-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
  <rect width="960" height="600" rx="14" fill="#0c1210" />
  <text x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">RAG-ПАЙПЛАЙН · МЕТРИКИ ЭТАПОВ</text>
  <text x="48" y="78" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Разместите диагностическую метрику рядом с каждым этапом</text>
  <text x="48" y="102" fill="#a8b8af" font-size="13">Релиз решают сквозные гейты; метрики этапов объясняют сбой.</text>

  <rect x="48" y="136" width="400" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ПРОЦЕСС · ПУТЬ INGESTION</text>
  <text x="68" y="196" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Парсинг → очистка → чанкинг → обогащение</text>
  <text x="68" y="218" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Эмбеддинг → индексация</text>
  <path d="M448 184H504" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="136" width="400" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="532" y="168" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · ЭВАЛЫ INGESTION</text>
  <text x="532" y="196" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">CER/WER · TEDS · F1 сущностей</text>
  <text x="532" y="218" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall ANN · задержка свежести</text>

  <path d="M248 232V264" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="48" y="272" width="400" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="304" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ПРОЦЕСС · ПУТЬ QUERY</text>
  <text x="68" y="332" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Рерайтинг → фильтрация → retrieval</text>
  <text x="68" y="354" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Реранкинг → сборка контекста</text>
  <path d="M448 320H504" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="272" width="400" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text x="532" y="304" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ФОКУС · ЭВАЛЫ QUERY</text>
  <text x="532" y="332" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k · доля ошибочного исключения</text>
  <text x="532" y="354" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">ΔnDCG · утилизация контекста</text>

  <path d="M248 368V400" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="48" y="408" width="400" height="96" rx="10" fill="#141d19" stroke="#edf5f0" stroke-width="1.5" />
  <text x="68" y="440" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ПРОЦЕСС · ПУТЬ ОТВЕТА</text>
  <text x="68" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" style="font-size: 14px;">Генерация → проверка утверждений → цитирование</text>
  <text x="68" y="490" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Возврат → наблюдение за трафиком</text>
  <path d="M448 456H504" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#rag-pipeline-arrow)" />
  <rect x="512" y="408" width="400" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text x="532" y="440" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · ЭВАЛЫ ОТВЕТА</text>
  <text x="532" y="468" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Faithfulness · P/R цитат</text>
  <text x="532" y="490" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Дрейф · стоимость/query · p95</text>

  <path d="M48 544H912" fill="none" stroke="#2b3b33" stroke-width="1" />
  <text x="48" y="574" fill="#a8b8af" font-size="13">Этап без метрики может незаметно дать сбой, пока система продолжает возвращать ответ.</text>
</svg>
