<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Three places where a RAG system can lose evidence: ingestion, query time, and the answer or production environment" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Три места, где RAG-система может потерять доказательства</title>
  <defs>
    <marker id="arrLayer" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b" />
    </marker>
    <filter id="shadowL" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="660" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">Три места, где RAG-система может потерять доказательства</text>
  <text y="56" text-anchor="middle" font-size="12" fill="#64748b" x="590">Ингест · пайплайн во время запроса · качество ответов и поведение в продакшене</text>

  <!-- =============== Layer 1: Ingestion =============== -->
  <rect x="30" y="80" width="1120" height="160" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadowL)" />
  <text y="106" font-size="14" font-weight="700" fill="#1d4ed8" x="55">Слой 1 · ингест</text>
  <text y="124" font-size="11" fill="#1d4ed8" x="55">Вопрос: сохранили ли корпус и индекс исходные данные?</text>

  <!-- Sub-cards -->
  <rect x="55" y="140" width="240" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="175">Готовность корпуса</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="175">доля успешного парсинга · CER/WER</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="175">TEDS · покрытие метаданных</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="175">актуальность · дедупликация</text>

  <rect x="305" y="140" width="240" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="425">Чанкинг</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="425">покрытие фрагмента ответа</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="425">доля нарушений границ</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="425">избыточность перекрытий</text>

  <rect x="555" y="140" width="240" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="675">Эмбеддинг · индекс</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="675">доменный nDCG@10</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="675">полнота ANN относительно flat</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="675">базовый уровень дрейфа</text>

  <rect x="805" y="140" width="320" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8" x="965">Обогащение (NER · EL · теги)</text>
  <text y="178" text-anchor="middle" font-size="11" fill="#64748b" x="965">EL F1 · обработка NIL · покрытие алиасов</text>
  <text y="193" text-anchor="middle" font-size="11" fill="#64748b" x="965">иерархический F1 · доля осиротевших тегов</text>
  <text y="208" text-anchor="middle" font-size="11" fill="#64748b" x="965">валидность схемы при публикации</text>

  <!-- Arrow down to Layer 2 -->
  <line x1="590" y1="244" x2="590" y2="280" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLayer)" />
  <text y="265" font-size="11" fill="#64748b" font-style="italic" x="700">задаёт потолок полноты для всех нижележащих этапов</text>

  <!-- =============== Layer 2: Query time =============== -->
  <rect x="30" y="290" width="1120" height="160" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowL)" />
  <text y="316" font-size="14" font-weight="700" fill="#9a3412" x="55">Слой 2 · во время запроса</text>
  <text y="334" font-size="11" fill="#9a3412" x="55">Вопрос: нашёл и собрал ли пайплайн правильные доказательства?</text>

  <rect x="55" y="350" width="240" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="175">Понимание запроса</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#64748b" x="175">выигрыш/потери от rewrite</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#64748b" x="175">точность роутинга</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#64748b" x="175">покрытие декомпозиции</text>

  <rect x="305" y="350" width="240" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="425">Retrieval</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#64748b" x="425">Recall@k · MRR · nDCG · MAP</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#64748b" x="425">точность/полнота контекста</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#64748b" x="425">прирост hybrid относительно каждого канала</text>

  <rect x="555" y="350" width="240" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" x="675">Фильтрация (горячая зона)</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#991b1b" x="675">доля ложного исключения фильтром</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#991b1b" x="675">точность/полнота предиката</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#991b1b" x="675">Δ shadow-retrieval</text>

  <rect x="805" y="350" width="320" height="80" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="370" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="965">Реранкинг · сборка контекста</text>
  <text y="388" text-anchor="middle" font-size="11" fill="#64748b" x="965">ΔnDCG · ΔMRR относительно no-rerank</text>
  <text y="403" text-anchor="middle" font-size="11" fill="#64748b" x="965">утилизация контекста · lost-in-middle</text>
  <text y="418" text-anchor="middle" font-size="11" fill="#64748b" x="965">устойчивость к дистракторам (RGB)</text>

  <!-- Arrow down to Layer 3 -->
  <line x1="590" y1="454" x2="590" y2="490" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLayer)" />
  <text y="475" font-size="11" fill="#64748b" font-style="italic" x="700">передаёт в генерацию проверенный контекст</text>

  <!-- =============== Layer 3: Answer and production =============== -->
  <rect x="30" y="500" width="1120" height="135" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowL)" />
  <text y="526" font-size="14" font-weight="700" fill="#166534" x="55">Слой 3 · ответ и продакшен</text>
  <text y="544" font-size="11" fill="#166534" x="55">Вопрос: использовал ли ответ доказательства и сохраняется ли качество под live-трафиком?</text>

  <rect x="55" y="558" width="240" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="175">Фактуальность</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="175">RAGAS · HHEM · FActScore</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="175">NLI-верификатор · self-consistency</text>

  <rect x="305" y="558" width="240" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="425">Цитаты и структура</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="425">точность/полнота цитирования</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="425">валидность схемы · соответствие словарю</text>

  <rect x="555" y="558" width="240" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="675">Неявный + явный сигнал</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="675">доля регенераций · dwell · CTR по цитатам</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="675">лайки/дизлайки · звёзды · inline-правки</text>

  <rect x="805" y="558" width="320" height="68" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="965">Дрейф · стоимость · латентность · HITL</text>
  <text y="595" text-anchor="middle" font-size="11" fill="#64748b" x="965">дрейф запроса/эмбеддинга · p95 латентности · $/запрос</text>
  <text y="610" text-anchor="middle" font-size="11" fill="#64748b" x="965">shadow eval · очередь проверки ответов с низкой уверенностью</text>
</svg>
