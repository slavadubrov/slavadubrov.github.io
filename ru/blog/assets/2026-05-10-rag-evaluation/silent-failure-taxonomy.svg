<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Silent failure taxonomy with the metric that catches each mode" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Таксономия тихих сбоев и метрика, которая выявляет каждый тип</title>
  <defs>
    <filter id="shadowSF" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1180" height="720" fill="#f8fafc" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" x="590">Таксономия тихих сбоев</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#0f172a" x="590">Каждый тип сбоя связан с метрикой, которая его выявляет. Без метрики баг невидим.</text>

  <!-- Root -->
  <rect x="475" y="78" width="230" height="44" rx="22" fill="#dc2626" filter="url(#shadowSF)" />
  <text y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" x="590">Тихий сбой (RAG)</text>

  <!-- Trunk: 4 main branches -->
  <line x1="540" y1="122" x2="170" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="570" y1="122" x2="450" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="610" y1="122" x2="730" y2="170" stroke="#94a3b8" stroke-width="1.4" />
  <line x1="640" y1="122" x2="1010" y2="170" stroke="#94a3b8" stroke-width="1.4" />

  <!-- ====== Branch A: Ingestion ====== -->
  <rect x="40" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="170">Сбои ingestion</text>

  <!-- A1: Parse loss -->
  <rect x="40" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Потеря при парсинге</text>
  <text y="261" font-size="11" fill="#0f172a" x="50">таблицы разрушаются · сноски</text>
  <text y="275" font-size="11" fill="#0f172a" x="50">теряются · OCR искажает цифры</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="50">выявляется по: CER/WER, TEDS</text>

  <!-- A2: Chunk break -->
  <rect x="40" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Разрыв чанка</text>
  <text y="336" font-size="11" fill="#0f172a" x="50">фрагмент ответа разделён между двумя</text>
  <text y="350" font-size="11" fill="#0f172a" x="50">чанками; ни в одном нет полного доказательства</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="50">выявляется по: containment фрагмента ответа</text>

  <!-- A3: Dedup miss -->
  <rect x="40" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Ошибка дедупликации</text>
  <text y="411" font-size="11" fill="#0f172a" x="50">ложное слияние искажает ответ;</text>
  <text y="425" font-size="11" fill="#0f172a" x="50">ложное сохранение прячет нужный документ</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="50">выявляется по: precision/recall дублей</text>

  <!-- A4: Normalization -->
  <rect x="40" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="50">Дрейф нормализации</text>
  <text y="486" font-size="11" fill="#0f172a" x="50">несовпадение NFC и NFKC ломает</text>
  <text y="500" font-size="11" fill="#0f172a" x="50">разрешение алиасов по exact match</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="50">выявляется по: паритету NFC/NFKC, покрытию алиасов</text>

  <!-- ====== Branch B: Embedding/Index ====== -->
  <rect x="320" y="170" width="260" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" x="450">Эмбеддинги и индекс</text>

  <!-- B1: Embedding miss -->
  <rect x="320" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Промах эмбеддинга</text>
  <text y="261" font-size="11" fill="#0f172a" x="330">доменный термин находится за пределами</text>
  <text y="275" font-size="11" fill="#0f172a" x="330">обучающего распределения модели</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="330">выявляется по: domain Recall@k относительно baseline</text>

  <!-- B2: ANN drop -->
  <rect x="320" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Падение из-за приближения ANN</text>
  <text y="336" font-size="11" fill="#0f172a" x="330">слишком низкий efSearch в HNSW; gold</text>
  <text y="350" font-size="11" fill="#0f172a" x="330">вектор существует, но до него не доходят</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="330">выявляется по: recall ANN относительно flat</text>

  <!-- B3: Embedding drift -->
  <rect x="320" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Дрейф эмбеддингов</text>
  <text y="411" font-size="11" fill="#0f172a" x="330">обновление версии модели провайдера;</text>
  <text y="425" font-size="11" fill="#0f172a" x="330">старые векторы больше не согласованы</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="330">выявляется по: стабильности NN на probe set</text>

  <!-- B4: Stale index -->
  <rect x="320" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#1d4ed8" x="330">Устаревший индекс</text>
  <text y="486" font-size="11" fill="#0f172a" x="330">задержка обновления; запросы выполняются</text>
  <text y="500" font-size="11" fill="#0f172a" x="330">по данным прошлой недели</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="330">выявляется по: freshness lag p99, %-stale</text>

  <!-- ====== Branch C: Online retrieval (HOT — silent killers) ====== -->
  <rect x="600" y="170" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b" x="730">Онлайн-retrieval</text>

  <!-- C1: Filter exclude (highlighted) -->
  <rect x="600" y="225" width="260" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#991b1b" x="610">Ложное исключение фильтром</text>
  <text y="261" font-size="11" fill="#0f172a" x="610">жёсткий предикат исключает gold-документ;</text>
  <text y="275" font-size="11" fill="#0f172a" x="610">Recall@k падает, но причина неизвестна</text>
  <text y="285" font-size="11" font-style="italic" fill="#991b1b" x="610">выявляется по: доле ложных исключений фильтром</text>

  <!-- C2: Rerank miss -->
  <rect x="600" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#991b1b" x="610">Промах реранкера</text>
  <text y="336" font-size="11" fill="#0f172a" x="610">cross-encoder опускает нужный</text>
  <text y="350" font-size="11" fill="#0f172a" x="610">документ ниже правдоподобных отвлекающих документов</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="610">выявляется по: ΔnDCG, устойчивости к distractor</text>

  <!-- C3: Lost in middle -->
  <rect x="600" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#991b1b" x="610">Потеря в середине</text>
  <text y="411" font-size="11" fill="#0f172a" x="610">gold-чанк есть в контексте, но находится</text>
  <text y="425" font-size="11" fill="#0f172a" x="610">на позиции 7/10; модель его игнорирует</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="610">выявляется по: эвалу с разбивкой по позициям</text>

  <!-- C4: Bad rewrite -->
  <rect x="600" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#991b1b" x="610">Регрессия rewrite запроса</text>
  <text y="486" font-size="11" fill="#0f172a" x="610">HyDE галлюцинирует сущность, которая</text>
  <text y="500" font-size="11" fill="#0f172a" x="610">смещает retrieval в неверную сторону</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="610">выявляется по: A/B rewrite gain/loss</text>

  <!-- ====== Branch D: Generation/Citation ====== -->
  <rect x="880" y="170" width="260" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
  <text y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6" x="1010">Генерация</text>

  <!-- D1: Hallucination -->
  <rect x="880" y="225" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="245" font-size="11" font-weight="700" fill="#5b21b6" x="890">Галлюцинация</text>
  <text y="261" font-size="11" fill="#0f172a" x="890">неподтверждённое утверждение, часто</text>
  <text y="275" font-size="11" fill="#0f172a" x="890">сущность, отсутствующая в контексте</text>
  <text y="285" font-size="11" font-style="italic" fill="#64748b" x="890">выявляется по: faithfulness, HHEM, FActScore</text>

  <!-- D2: No citation -->
  <rect x="880" y="300" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="320" font-size="11" font-weight="700" fill="#5b21b6" x="890">Театр цитирования</text>
  <text y="336" font-size="11" fill="#0f172a" x="890">процитированный фрагмент на самом деле</text>
  <text y="350" font-size="11" fill="#0f172a" x="890">не подтверждает расположенное рядом утверждение</text>
  <text y="360" font-size="11" font-style="italic" fill="#64748b" x="890">выявляется по: citation P/R (TREC)</text>

  <!-- D3: Wrong refusal -->
  <rect x="880" y="375" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="395" font-size="11" font-weight="700" fill="#5b21b6" x="890">Неверное воздержание</text>
  <text y="411" font-size="11" fill="#0f172a" x="890">«Я не знаю», когда ответ</text>
  <text y="425" font-size="11" fill="#0f172a" x="890">есть в контексте (или наоборот)</text>
  <text y="435" font-size="11" font-style="italic" fill="#64748b" x="890">выявляется по: NoMIRACL, точности воздержания</text>

  <!-- D4: Schema break -->
  <rect x="880" y="450" width="260" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadowSF)" />
  <text y="470" font-size="11" font-weight="700" fill="#5b21b6" x="890">Ошибка схемы/словаря</text>
  <text y="486" font-size="11" fill="#0f172a" x="890">синтаксически корректный вывод выбирает</text>
  <text y="500" font-size="11" fill="#0f172a" x="890">неверный, но допустимый ID онтологии</text>
  <text y="510" font-size="11" font-style="italic" fill="#64748b" x="890">выявляется по: соответствию словарю</text>

  <!-- Footer band -->
  <rect x="40" y="555" width="1100" height="68" rx="8" fill="#f0fdf4" stroke="#ea580c" stroke-width="1.2" />
  <text y="578" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="590">Как читать диаграмму</text>
  <text y="598" text-anchor="middle" font-size="11" fill="#9a3412" x="590">Без соответствующей метрики каждый сбой остаётся тихим. Одна лишь стандартная «корректность ответа» показывает, что что-то сломалось, — но не где.</text>
  <text y="614" text-anchor="middle" font-size="11" fill="#9a3412" x="590">Красная ветка охватывает проверки фильтра, реранкинга, позиции в контексте и rewrite. Инструментируйте этапы, которые могут удалить доказательства.</text>

  <!-- Visual cue: the 'red' propagation -->
  <rect x="40" y="640" width="1100" height="62" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1" />
  <text y="662" font-size="11" font-weight="600" fill="#0f172a" x="60">Правило распространения:</text>
  <text y="682" font-size="11" fill="#0f172a" x="60">Сбой слева задаёт потолок recall для всего справа. Плохой парсинг ограничивает чанкинг. Плохой чанкинг ограничивает retrieval.</text>
  <text y="696" font-size="11" fill="#0f172a" x="60">Плохой retrieval ограничивает реранкинг. Плохой реранкинг ограничивает генерацию. Faithfulness измеряет только последнее звено — он не видит разрыв в цепочке.</text>
</svg>
