<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="silent-failure-title silent-failure-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="silent-failure-title">Тихие сбои RAG и метрика, выявляющая каждый источник</title>
  <desc id="silent-failure-desc">Доказательства проходят из исходного корпуса через множество допустимых кандидатов и ранжированный контекст в подтверждённый ответ. Каждому этапу соответствует диагностическая метрика. Множество допустимых кандидатов выделено, поскольку жёсткий фильтр может удалить gold-документ до retrieval.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="silent-failure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>
  <rect width="960" height="568" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">ТИХИЙ СБОЙ · ОТ ИСТОЧНИКА К МЕТРИКЕ</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Найдите этап, на котором исчезли доказательства</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Первое нарушенное звено ограничивает все метрики справа от него.</text>

  <rect x="48" y="136" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="64" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · ИСТОЧНИК</text>
  <text x="64" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Артефакты корпуса</text>
  <text x="64" y="218" fill="#59645e" font-size="13">парсинг · чанкинг · индексация</text>
  <path d="M232 184H264" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="136" width="184" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text x="288" y="168" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ФОКУС · ФИЛЬТР</text>
  <text x="288" y="198" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Допустимые документы</text>
  <text x="288" y="218" fill="#59645e" font-size="13">gold-документ может быть удалён</text>
  <path d="M456 184H488" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="136" width="184" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="512" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ОБРАБОТКА · РЕРАНКЕР</text>
  <text x="512" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Ранжированный контекст</text>
  <text x="512" y="218" fill="#59645e" font-size="13">понижение позиции · потеря в середине</text>
  <path d="M680 184H712" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="136" width="192" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="736" y="168" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ОБРАБОТКА · ГЕНЕРАТОР</text>
  <text x="736" y="198" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Подтверждённый ответ</text>
  <text x="736" y="218" fill="#59645e" font-size="13">утверждения · цитаты</text>

  <path d="M140 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="48" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="64" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · МЕТРИКА</text>
  <text x="64" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">CER/WER · TEDS</text>
  <text x="64" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recall ANN · актуальность</text>
  <path d="M364 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="272" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="288" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · МЕТРИКА</text>
  <text x="288" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Recall@k</text>
  <text x="288" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Доля ложного исключения</text>
  <path d="M588 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="496" y="336" width="184" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="512" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · МЕТРИКА</text>
  <text x="512" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">ΔnDCG · дистракторы</text>
  <text x="512" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Тест позиции</text>
  <path d="M816 232V328" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#silent-failure-arrow)" />
  <rect x="720" y="336" width="192" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="736" y="368" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНЕНИЕ · МЕТРИКА</text>
  <text x="736" y="396" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Faithfulness</text>
  <text x="736" y="418" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Точность/полнота цитирования</text>

  <path d="M48 472H912" fill="none" stroke="#d8ddd9" stroke-width="1" />
  <text x="48" y="502" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Recall@k выявляет отсутствующий gold-документ.</text>
  <text x="48" y="528" fill="#59645e" font-size="13">Доля ложного исключения выявляет предикат фильтра как причину; faithfulness — нет.</text>
  <rect x="42" y="262" width="352" height="20" fill="#F7F7F4" />
  <text x="48" y="276" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">МЕТРИКА, АТРИБУТИРУЮЩАЯ КАЖДЫЙ СБОЙ</text>
</svg>
