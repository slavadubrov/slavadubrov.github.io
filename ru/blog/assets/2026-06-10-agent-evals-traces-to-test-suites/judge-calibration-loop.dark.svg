<path d="M260 356h-16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" />
<path d="M146 304v-72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgecal-arrow-flow)" /><text x="146" y="276.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">перекалибровать</text>
<path d="M32 456h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Для продвижения нужны согласованные с человеческими разметками трейсы, а не только вердикт, валидный по схеме.</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Изменение модели джаджа или промпта возвращает цикл к перекалибровке.</text>
</svg>
