<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="gve-title gve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="gve-title">Гардрейлы и online-эвалуации</title>
  <desc id="gve-desc">Гардрейл встроен между агентом и ответом и может его заблокировать. Выбранный трейс отправляется в асинхронный online-эвал, систему алертов и следующий регрессионный датасет, не задерживая пользователя.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="40">ДВА КОНТУРА · РАЗНОЕ РАЗМЕЩЕНИЕ, ВРЕМЯ ОТВЕТА И ЭФФЕКТ</text>

  <rect x="48" y="64" width="864" height="176" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="68" y="92">ПУТЬ ЗАПРОСА · МИЛЛИСЕКУНДЫ · МОЖЕТ БЛОКИРОВАТЬ</text>
  <rect class="box" x="68" y="120" width="160" height="96" rx="10" />
  <text class="kind" x="88" y="154">ВХОД</text><text class="name" x="88" y="182"><tspan x="88">Запрос</tspan><tspan x="88" dy="1.2em">пользователя</tspan></text>
  <rect class="box" x="284" y="120" width="160" height="96" rx="10" />
  <text class="kind" x="304" y="154">ОБРАБОТКА</text><text class="name" x="304" y="182">Запуск агента</text>
  <rect x="500" y="120" width="176" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="520" y="154" fill="#C50E72">ФОКУС · INLINE</text><text class="name" x="520" y="182" fill="#C50E72">Гардрейл</text>
  <rect class="box" x="732" y="120" width="160" height="96" rx="10" />
  <text class="kind" x="752" y="154">ВЫХОД</text><text class="name" x="752" y="182">Ответ</text>
  <path class="edge" d="M228 168h48" marker-end="url(#gve-arrow)" /><path class="edge" d="M444 168h48" marker-end="url(#gve-arrow)" /><path class="edge" d="M676 168h48" marker-end="url(#gve-arrow)" />

  <rect x="48" y="280" width="864" height="176" rx="12" fill="none" stroke="#D8DDD9" />
  <text class="kind" x="68" y="308">ПУТЬ НАБЛЮДЕНИЯ · ОТ СЕКУНД ДО МИНУТ · НИКОГДА НЕ БЛОКИРУЕТ</text>
  <rect class="box" x="284" y="336" width="176" height="96" rx="10" />
  <text class="kind" x="304" y="370">ASYNC ЭВАЛ</text><text class="name" x="304" y="398">Оценка трейса</text>
  <rect class="box" x="516" y="336" width="160" height="96" rx="10" />
  <text class="kind" x="536" y="370">МОНИТОРИНГ</text><text class="name" x="536" y="398">Кластер алертов</text>
  <rect class="store" x="732" y="336" width="160" height="96" rx="10" />
  <text class="kind" x="752" y="370">ДАТАСЕТ</text><text class="name" x="752" y="398"><tspan x="752">Добавить</tspan><tspan x="752" dy="1.2em">эталонный</tspan></text>
  <path class="edge" d="M364 216v72h8v40" stroke-dasharray="2 6" marker-end="url(#gve-arrow)" />
  <rect x="376" y="264" width="116" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="434" y="281" text-anchor="middle">выбранный трейс</text>
  <path class="edge" d="M460 384h48" marker-end="url(#gve-arrow)" /><path class="edge" d="M676 384h48" marker-end="url(#gve-arrow)" />
  <text class="note" x="48" y="484">Гардрейлы защищают до выдачи ответа; online-эвалуации измеряют качество после выдачи и улучшают следующий релиз.</text>
  <defs><marker id="gve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
