<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tef-title tef-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tef-title">Маховик trace → eval</title>
  <desc id="tef-desc">Выборочный production trace размечают, кластеризуют, сводят к репрезентативному golden-кейсу, версионируют и запускают как CI-гейт. Выпущенный агент генерирует следующие production traces.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="40">PRODUCTION-ДАННЫЕ СТАНОВЯТСЯ ГЕЙТОМ РЕЛИЗА</text>

  <g><circle cx="62" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="62" y="77" text-anchor="middle">1</text></g>
  <rect class="box" x="48" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="68" y="130">PRODUCTION</text><text class="name" x="68" y="158">Выборочный trace</text>
  <g><circle cx="286" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="286" y="77" text-anchor="middle">2</text></g>
  <rect class="box" x="272" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="292" y="130">REVIEW</text><text class="name" x="292" y="158">Разметить сбой</text>
  <g><circle cx="510" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="510" y="77" text-anchor="middle">3</text></g>
  <rect class="box" x="496" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="516" y="130">АНАЛИЗ</text><text class="name" x="516" y="158">Кластеризовать кейсы</text>
  <g><circle cx="734" cy="72" r="14" fill="#17211B" /><text class="marker-num" x="734" y="77" text-anchor="middle">4</text></g>
  <rect class="store" x="720" y="96" width="192" height="96" rx="10" />
  <text class="kind" x="740" y="130">GOLDEN</text><text class="name" x="740" y="158">Оставить один кейс</text>
  <path class="edge" d="M240 144h24" marker-end="url(#tef-arrow)" /><path class="edge" d="M464 144h24" marker-end="url(#tef-arrow)" /><path class="edge" d="M688 144h24" marker-end="url(#tef-arrow)" />

  <path class="edge" d="M816 192v56" marker-end="url(#tef-arrow)" />
  <g><circle cx="734" cy="224" r="14" fill="#17211B" /><text class="marker-num" x="734" y="229" text-anchor="middle">5</text></g>
  <rect class="store" x="720" y="256" width="192" height="96" rx="10" />
  <text class="kind" x="740" y="290">ДАТАСЕТ</text><text class="name" x="740" y="318">Версионировать goldens</text>
  <g><circle cx="510" cy="224" r="14" fill="#17211B" /><text class="marker-num" x="510" y="229" text-anchor="middle">6</text></g>
  <rect x="496" y="256" width="192" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="516" y="290" fill="#C50E72">ФОКУС · CI</text><text class="name" x="516" y="318" fill="#C50E72">Блокировать регрессии</text>
  <g><circle cx="286" cy="224" r="14" fill="#17211B" /><text class="marker-num" x="286" y="229" text-anchor="middle">7</text></g>
  <rect class="box" x="272" y="256" width="192" height="96" rx="10" />
  <text class="kind" x="292" y="290">РЕЛИЗ</text><text class="name" x="292" y="318">Выпустить агента</text>
  <path class="edge" d="M720 304h-24" marker-end="url(#tef-arrow)" /><path class="edge" d="M496 304h-24" marker-end="url(#tef-arrow)" />
  <path class="edge" d="M368 352v32H144V200" stroke-dasharray="2 6" marker-end="url(#tef-arrow)" />
  <rect x="156" y="372" width="176" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="244" y="389" text-anchor="middle">новый трафик · следующий цикл</text>
  <text class="note" x="48" y="424">Диагностированный сбой не считается закрытым, пока следующая версия агента не пройдет его.</text>
  <defs><marker id="tef-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
