<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Three levels of agent evaluation with their metrics" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Три уровня эвала ИИ-агентов и их метрики</title>
  <defs>
    <marker id="arrLvl" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#334155" />
    </marker>
    <filter id="shadowLvl" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" x="590">Три уровня эвала ИИ-агентов</text>
  <text y="54" text-anchor="middle" font-size="12" fill="#334155" x="590">Результат показывает, ЧТО пошло не так · траектория — ГДЕ · компонент — ПОЧЕМУ</text>

  <!-- Level 1: end-to-end -->
  <rect x="30" y="80" width="1120" height="150" rx="12" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="106" font-size="14" font-weight="700" fill="#166534" x="55">Уровень 1 · Результат (чёрный ящик)</text>
  <text y="124" font-size="10" fill="#166534" x="55">Вопрос: задача выполнена?</text>

  <rect x="55" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="225">Выполнение задачи</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="225">Оценка соответствия цели с помощью LLM, без эталона</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="225">подходит для онлайна — эталонный результат не нужен</text>

  <rect x="415" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="585">Оценка результата / состояния</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="585">сравнить итоговое состояние среды с целевым</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="585">устойчиво к альтернативным креативным путям (tau-bench)</text>

  <rect x="775" y="140" width="340" height="72" rx="8" fill="#ffffff" stroke="#166534" stroke-width="1" />
  <text y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" x="945">Надёжность: pass^k</text>
  <text y="180" text-anchor="middle" font-size="10" fill="#334155" x="945">успешны все k из k попыток</text>
  <text y="195" text-anchor="middle" font-size="10" fill="#334155" x="945">при независимых запусках: 90% на запуск → 43% при k=8</text>

  <line x1="590" y1="234" x2="590" y2="268" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="256" font-size="10" fill="#64748b" font-style="italic" x="700">задача не выполнена — но где?</text>

  <!-- Level 2: trajectory -->
  <rect x="30" y="275" width="1120" height="150" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="301" font-size="14" font-weight="700" fill="#5b21b6" x="55">Уровень 2 · Траектория (стеклянный ящик)</text>
  <text y="319" font-size="10" fill="#5b21b6" x="55">Вопрос: путь был корректным и эффективным?</text>

  <rect x="55" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="182">Корректность tool call</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="182">детерминированно, джадж не нужен</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="182">точное / последовательное / в любом порядке совпадение</text>

  <rect x="330" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="457">Корректность аргументов</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="457">правильный инструмент, неверные параметры</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="457">% корректно заполненных пар ключ–значение</text>

  <rect x="605" y="335" width="255" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="732">Эффективность и циклы</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="732">избыточные вызовы · сходимость пути</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="732">повторяющиеся одинаковые вызовы = тупик</text>

  <rect x="880" y="335" width="235" height="72" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" x="997">Качество плана / следование плану</text>
  <text y="375" text-anchor="middle" font-size="10" fill="#334155" x="997">план хороший, исполнение отклоняется</text>
  <text y="390" text-anchor="middle" font-size="10" fill="#334155" x="997">согласованность между ходами в multi-turn диалоге</text>

  <line x1="590" y1="429" x2="590" y2="463" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrLvl)" />
  <text y="451" font-size="10" fill="#64748b" font-style="italic" x="700">путь сломался на шаге 3 — но почему?</text>

  <!-- Level 3: component -->
  <rect x="30" y="470" width="1120" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadowLvl)" />
  <text y="496" font-size="14" font-weight="700" fill="#9a3412" x="55">Уровень 3 · Компонент (белый ящик)</text>
  <text y="514" font-size="10" fill="#9a3412" x="55">Вопрос: какое решение, tool call, retrieval или субагент сломался?</text>

  <rect x="55" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="225">Метрики на уровне спана</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="225">назначать оценки отдельным спанам tool call / retrieval</text>

  <rect x="415" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="585">Интерпретация вывода инструмента</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="585">ответ корректный, интерпретация неверная — ломает последующие шаги</text>

  <rect x="775" y="525" width="340" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1" />
  <text y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412" x="945">Атрибуция сбоя</text>
  <text y="563" text-anchor="middle" font-size="10" fill="#334155" x="945">видимый сбой обычно вызван реальным багом на последующем этапе</text>
</svg>
