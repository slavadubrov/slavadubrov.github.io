<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pmf-title pmf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="pmf-title">Миграция в pyproject.toml с приоритетом верификации</title>
  <desc id="pmf-desc">Пять упорядоченных шагов: инвентаризация текущей конфигурации, классификация ответственности, перенос в таблицы pyproject, проверка артефактов и поведения, удаление только подтверждённых дубликатов. При расхождении результатов проверки условный путь возвращает процесс к классификации.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 17px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .marker-num { font-style: normal; font-weight: 600; font-size: 13px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; fill: #0c1210; }
    .box { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #a8b8af; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#0c1210" />

  <path class="edge" d="M288 96h32" marker-end="url(#pmf-arrow)" />
  <path class="edge" d="M568 96h32" marker-end="url(#pmf-arrow)" />
  <path class="edge" d="M848 96v72a16 16 0 0 1-16 16h-24v40" marker-end="url(#pmf-arrow)" />
  <path class="edge" d="M672 280h-96" marker-end="url(#pmf-arrow)" />

  <circle cx="62" cy="32" r="14" fill="#edf5f0" /><text class="marker-num" x="62" y="37" text-anchor="middle">1</text>
  <circle cx="342" cy="32" r="14" fill="#edf5f0" /><text class="marker-num" x="342" y="37" text-anchor="middle">2</text>
  <circle cx="622" cy="32" r="14" fill="#edf5f0" /><text class="marker-num" x="622" y="37" text-anchor="middle">3</text>
  <circle cx="686" cy="216" r="14" fill="#edf5f0" /><text class="marker-num" x="686" y="221" text-anchor="middle">4</text>
  <circle cx="342" cy="216" r="14" fill="#edf5f0" /><text class="marker-num" x="342" y="221" text-anchor="middle">5</text>

  <rect class="box" x="48" y="48" width="240" height="96" rx="10" />
  <text class="kind" x="68" y="82">ИНВЕНТАРИЗАЦИЯ</text>
  <text class="name" x="68" y="112">Текущая конфигурация</text>

  <rect class="box" x="328" y="48" width="240" height="96" rx="10" fill="#1b2621" />
  <text class="kind" x="348" y="82">КЛАССИФИКАЦИЯ</text>
  <text class="name" x="348" y="112"><tspan x="348">Ответственность и</tspan><tspan x="348" dy="1.2em">семантика</tspan></text>

  <rect class="box" x="608" y="48" width="240" height="96" rx="10" />
  <text class="kind" x="628" y="82">ПЕРЕНОС</text>
  <text class="name" x="628" y="112">Таблицы pyproject</text>

  <rect x="672" y="232" width="240" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="692" y="266" fill="#ff6fb6">ПРОВЕРКА</text>
  <text class="name" x="692" y="296" fill="#ff6fb6">Артефакты и поведение</text>

  <rect class="box" x="328" y="232" width="240" height="96" rx="10" fill="#1b2621" />
  <text class="kind" x="348" y="266">УДАЛЕНИЕ</text>
  <text class="name" x="348" y="296"><tspan x="348">Подтверждённые</tspan><tspan x="348" dy="1.2em">дубликаты</tspan></text>

  <path class="edge" d="M832 328v64a16 16 0 0 1-16 16H320a16 16 0 0 1-16-16V136a16 16 0 0 1 16-16h8" stroke-dasharray="7 6" marker-end="url(#pmf-arrow)" />
  <rect x="468" y="396" width="184" height="24" rx="6" fill="#0c1210" />
  <text class="note" x="560" y="413" text-anchor="middle" style="font-size: 11px;">артефакт или поведение различаются</text>

  <text class="note" x="48" y="464">Удаляйте старые файлы только после того, как собранный артефакт и путь деплоя совпадут в чистом окружении.</text>
  <defs>
    <marker id="pmf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
