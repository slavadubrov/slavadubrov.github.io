<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="pmf-title pmf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="pmf-title">Миграция на pyproject.toml с приоритетом верификации</title><desc id="pmf-desc">Пять последовательных шагов переносят существующую конфигурацию в pyproject.toml: инвентаризация существующих файлов, классификация их владельцев, описание таблиц pyproject, затем верификация собранных артефактов и поведения рантайма — основной фокус этой миграции. Только после успешной верификации поток удаляет старую дублирующую конфигурацию; если артефакты или поведение отличаются, верификация возвращает работу к классификации, а не позволяет продолжить.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="pmf-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="pmf-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="340" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Мигрируйте через верификацию, а не удаление</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Именно верификация определяет, что удалить, а не порядок написания шагов.</text>
<path d="M42 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ОПИСЬ</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0" style="font-size: 11px;"><tspan x="46">Старая</tspan><tspan x="46" dy="1.2em">конфигурация</tspan></text><circle cx="32" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M176 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M176 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="180" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11.5px;">КЛАССИФИКАЦИЯ</text><text x="180" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Владелец</text><circle cx="166" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="166" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M310 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M310 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="314" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ОПИСАНИЕ</text><text x="314" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Таблицы</text><circle cx="300" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="300" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M444 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M444 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="448" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ВЕРИФИКАЦИЯ</text><text x="448" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0">Артефакты</text><circle cx="434" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="434" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M578 112h100a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M578 112h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="582" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">УДАЛЕНИЕ</text><text x="582" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#EDF5F0" style="font-size: 14px;">Старые файлы</text><circle cx="568" cy="112" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="568" y="116.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">5</text>
<path d="M152 148h14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M286 148h14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M420 148h14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M554 148h14" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pmf-arrow-flow)" />
<path d="M494 184v40H226v-40" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#pmf-arrow-flow)" /><rect x="258.5" y="212" width="203" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="360" y="228.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 11px;">артефакты/поведение отличаются</text>
<path d="M32 256h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="282" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Удаляйте старую конфигурацию только после совпадения артефактов и поведения.</text>
<text x="32" y="304" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Модернизация переносит владение между файлами; удаление файлов не является целью.</text>
</svg>
