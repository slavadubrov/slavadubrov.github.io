<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="classic-title classic-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="classic-title">Контур управления MLOps, который всё ещё нужен системам на базовых моделях</title>
  <desc id="classic-desc">Линеаж обеспечивает воспроизводимую сборку, офлайн-гейт релиза, поэтапный деплой и наблюдаемость. Данные об инцидентах возвращаются в гейт релиза, а неизменяемая идентичность и откат охватывают весь контур.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="400" rx="14" fill="#F7F7F4" />

  <text class="kind" x="48" y="44">КОНТУР УПРАВЛЕНИЯ — ПОВЕДЕНИЕ МЕНЯЕТСЯ, ДИСЦИПЛИНА — НЕТ</text>

  <circle cx="62" cy="76" r="14" fill="#17211B" /><text class="marker-num" x="62" y="81" text-anchor="middle">1</text>
  <circle cx="278" cy="76" r="14" fill="#17211B" /><text class="marker-num" x="278" y="81" text-anchor="middle">2</text>
  <circle cx="494" cy="76" r="14" fill="#17211B" /><text class="marker-num" x="494" y="81" text-anchor="middle">3</text>
  <circle cx="710" cy="76" r="14" fill="#17211B" /><text class="marker-num" x="710" y="81" text-anchor="middle">4</text>
  <circle cx="926" cy="76" r="14" fill="#17211B" /><text class="marker-num" x="926" y="81" text-anchor="middle">5</text>

  <rect class="box" x="48" y="104" width="176" height="96" rx="10" />
  <text class="kind" x="68" y="138">ЛИНЕАЖ</text><text class="name" x="68" y="166" style="font-size: 11.5px;">Идентифицировать входы</text>

  <rect class="box" x="264" y="104" width="176" height="96" rx="10" />
  <text class="kind" x="284" y="138">СБОРКА</text><text class="name" x="284" y="166">Воспроизвести</text>

  <rect x="480" y="104" width="176" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="500" y="138" fill="#C50E72">ГЕЙТ РЕЛИЗА</text><text class="name" x="500" y="166" fill="#C50E72">Проверить офлайн</text>

  <rect class="box" x="696" y="104" width="176" height="96" rx="10" />
  <text class="kind" x="716" y="138">ДОСТАВКА</text><text class="name" x="716" y="166">Поэтапный деплой</text>

  <rect class="box" x="912" y="104" width="160" height="96" rx="10" />
  <text class="kind" x="932" y="138">ЭКСПЛУАТАЦИЯ</text><text class="name" x="932" y="166">Отслеживать SLO</text>

  <path class="edge" d="M224 152h32" marker-end="url(#classic-arrow)" />
  <path class="edge" d="M440 152h32" marker-end="url(#classic-arrow)" />
  <path class="edge" d="M656 152h32" marker-end="url(#classic-arrow)" />
  <path class="edge" d="M872 152h32" marker-end="url(#classic-arrow)" />

  <path class="edge" d="M992 200v40a12 12 0 0 1-12 12H580a12 12 0 0 1-12-12v-32" marker-end="url(#classic-arrow)" />
  <rect x="700" y="240" width="196" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="798" y="257" text-anchor="middle" style="font-size: 11px;">данные об инцидентах возвращаются</text>

  <rect x="264" y="296" width="608" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="284" y="321">ПЛОСКОСТЬ УПРАВЛЕНИЯ</text>
  <text class="name" x="284" y="346">Неизменяемая идентичность · управление · откат</text>

  <defs>
    <marker id="classic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
