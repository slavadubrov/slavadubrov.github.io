<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Контекст собирается через retrieval по заданной области, бюджетирование, выполнение и валидацию</title>
  <desc id="desc">Доверенное состояние запроса проходит через выбор решения, авторизованный retrieval, бюджетирование на основе полезности, предложение модели, детерминированные валидацию и выполнение, а затем запись provenance и результата.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#0C1210" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">Сборка контекста — жизненный цикл каждого решения</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Доверенный запрос</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">актор, тенант, задача</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">локаль + время</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Выбрать решение</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">спланировать, получить данные, выполнить действие</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">или ответить</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Определить область + выполнить retrieval</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">сначала авторизовать</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">ранжировать свидетельства</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#141D19" stroke="#A8B8AF" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Рассчитать бюджет + собрать</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">полезность, свежесть</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">границы доверия</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#EDF5F0">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#141D19" stroke="#EDF5F0" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#EDF5F0">Предложить → валидировать → выполнить действие</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#EDF5F0">типизированный вывод + политика</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#EDF5F0">постусловия tool</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#EDF5F0">Записать манифест, provenance, валидацию и результат задачи</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#EDF5F0">Следующее решение получает новый рабочий набор, а не наследует всё содержимое.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#EDF5F0">Вызов модели — один из этапов контекстной политики, а не сама политика.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
