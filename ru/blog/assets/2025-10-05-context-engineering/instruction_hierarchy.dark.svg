<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">Приоритет инструкций зависит от провайдера, поэтому универсальная иерархия ролей — ошибка; общий рубеж принудительного контроля — код приложения.</title><desc id="instr-desc">Model Spec OpenAI ранжирует инструкции платформы или системы, разработчика и пользователя по уровню полномочий. Anthropic Messages API предоставляет параметр верхнего уровня system и сообщения user и assistant без эквивалентной роли developer. Независимо от названий ролей у провайдера, код приложения авторизует инструменты, доступ к данным и побочные эффекты.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="instr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="instr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
