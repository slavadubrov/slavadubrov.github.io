<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Контекст собирается через scoped retrieval, бюджетирование, выполнение и валидацию</title>
  <desc id="desc">Доверенное состояние запроса проходит через выбор решения, авторизованный retrieval, бюджетирование на основе utility, предложение модели, детерминированные валидацию и выполнение, затем — запись provenance и результата.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="460" rx="22" fill="#F7F7F4" />
  <text x="500" y="46" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">Сборка контекста — lifecycle для каждого решения</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(25 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Доверенный запрос</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">актор, тенант, задача</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">локаль + время</text></g><text x="192" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(210 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Выбрать решение</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">спланировать, выполнить retrieval, совершить действие</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">или ответить</text></g><text x="377" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(395 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Определить scope + выполнить retrieval</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">сначала авторизовать</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">ранжировать evidence</text></g><text x="562" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(580 115)"><rect width="150" height="110" rx="14" fill="#FFFFFF" stroke="#59645E" /><text x="75" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Спланировать бюджет + собрать</text><text x="75" y="63" text-anchor="middle" font-size="11" fill="#17211B">utility, freshness</text><text x="75" y="84" text-anchor="middle" font-size="11" fill="#17211B">границы доверия</text></g><text x="747" y="180" text-anchor="middle" font-size="22" fill="#17211B">→</text>
    <g transform="translate(765 115)"><rect width="210" height="110" rx="14" fill="#FFFFFF" stroke="#17211B" /><text x="105" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#17211B">Предложить → валидировать → выполнить</text><text x="105" y="63" text-anchor="middle" font-size="11" fill="#17211B">типизированный output + policy</text><text x="105" y="84" text-anchor="middle" font-size="11" fill="#17211B">постусловия tool</text></g>
    <rect x="120" y="300" width="760" height="85" rx="14" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="500" y="331" text-anchor="middle" font-size="16" font-weight="700" fill="#17211B">Записать манифест, provenance, валидацию и результат задачи</text><text x="500" y="360" text-anchor="middle" font-size="12" fill="#17211B">Следующее решение получает новый working set, а не наследует всё содержимое.</text>
    <text x="500" y="425" text-anchor="middle" font-size="13" fill="#17211B">Вызов модели — один из этапов внутри context policy, а не сама policy.</text>
  </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
