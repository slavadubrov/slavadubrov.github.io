<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Context Window Composition" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Состав окна контекста</title>
  <desc>Состав окна контекста.</desc>
    <style>
        .bg { fill: #0C1210; }
        .container { fill: #141D19; stroke: #A8B8AF; stroke-width: 2; rx: 8; ry: 8; }
        .block { stroke-width: 2; rx: 6; ry: 6; }
        .block-text { fill: #EDF5F0; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
        .block-subtext { fill: #1B2621; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
        .label { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: start; }
        .title { fill: #EDF5F0; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
        .arrow { stroke: #A8B8AF; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        .limit-line { stroke: #EDF5F0; stroke-width: 2; stroke-dasharray: 5 5; }
        .limit-text { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: bold; }
    </style>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#1B2621" />
        </marker>






    </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

    <rect width="100%" height="100%" class="bg" />

    <text y="40" class="title" x="400">Состав окна контекста</text>

    <g transform="translate(200, 80)">

        <rect x="0" y="0" width="400" height="480" class="container visual-focus" />

        <g transform="translate(20, 20)">
            <rect x="0" y="0" width="360" height="70" class="block" style="fill:#1B2621; stroke: #A8B8AF;" />
            <text y="30" class="block-text" x="180">1. Инструкции по работе с системой</text>
            <text y="50" class="block-subtext" x="180">Персона, ограничения, формат вывода</text>
        </g>

        <g transform="translate(20, 100)">
            <rect x="0" y="0" width="360" height="70" class="block" style="fill:#1B2621; stroke: #A8B8AF;" />
            <text y="30" class="block-text" x="180" style="font-size: 14px;">2. Примеры с небольшим количеством примеров</text>
            <text y="50" class="block-subtext" x="180">Шаблоны входа -&gt; выхода (статические или динамические)</text>
        </g>

        <g transform="translate(20, 180)">
            <rect x="0" y="0" width="360" height="90" class="block" style="fill:#1B2621; stroke: #A8B8AF;" />
            <text y="35" class="block-text" x="180">3. Полученный контекст (RAG)</text>
            <text y="55" class="block-subtext" x="180" style="font-size: 11px;">Соответствующие документы, результаты работы базы данных</text>
            <text y="70" class="block-subtext" style="font-size: 12px; fill: #A8B8AF;" x="180">Вставляется динамически в зависимости от запроса</text>
        </g>

        <g transform="translate(20, 280)">
            <rect x="0" y="0" width="360" height="80" class="block" style="fill:#1B2621; stroke: #A8B8AF;" />
            <text y="35" class="block-text" x="180">4. История разговора</text>
            <text y="55" class="block-subtext" x="180">Предыдущие ходы пользователя/ассистента</text>
        </g>

        <g transform="translate(20, 370)">
            <rect x="0" y="0" width="360" height="90" class="block" style="fill:#1B2621; stroke: #A8B8AF;" />
            <text y="35" class="block-text" x="180">5. Запрос текущего пользователя</text>
            <text y="55" class="block-subtext" x="180">Фактический запрос для ответа</text>
        </g>
    </g>

    <g transform="translate(620, 100)">
        <text y="0" class="label" style="font-weight: bold; fill: #A8B8AF;" x="0">Поток обработки</text>
        <path d="M 20 20 L 20 400" class="arrow" marker-end="url(#arrow)" />
        <text y="200" class="label" x="35" transform="rotate(90, 35, 200)">Модель считывает данные сверху вниз</text>
    </g>

    <g transform="translate(150, 50)">
        <line x1="50" y1="0" x2="450" y2="0" class="limit-line" />
        <text y="5" class="limit-text" x="460">Начало окна контекста (0)</text>
    </g>

    <g transform="translate(150, 580)">
        <line x1="50" y1="0" x2="450" y2="0" class="limit-line" />
        <text y="5" class="limit-text" x="460">Максимальный лимит контекста (N)</text>
    </g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
