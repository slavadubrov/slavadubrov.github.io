<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Выберите оптимизацию для измеренного боттлнека контекста</title>
  <desc id="artifact-desc">Четыре техники работы с контекстом, привязанные к разным боттленекам и метрикам: компакция для растущей истории, маскирование наблюдений для многословного вывода инструментов, prompt caching для повторяющихся префиксов и разбиение решений при избытке свидетельств или возможностей.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
    <style>
        .bg { fill: #0C1210; }
        .title { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 24px; font-weight: bold; text-anchor: middle; }
        .subtitle { fill: #1B2621; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; text-anchor: middle; }
        .card { rx: 12; ry: 12; }
        .card-title { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
        .card-desc { fill: #1B2621; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
        .metric { fill: #141D19; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
        .metric-box { fill: #141D19; rx: 6; ry: 6; }
        .use-case { fill: #1B2621; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; font-style: italic; }
        .section-label { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: start; }
        .result-box { fill: #141D19; stroke: #A8B8AF; stroke-width: 2; rx: 10; ry: 10; }
        .result-text { fill: #A8B8AF; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
        .flow-line { stroke: #A8B8AF; stroke-width: 2; stroke-dasharray: 5 5; }
        .number { fill: #141D19; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: bold; }
    </style>

    <rect width="100%" height="100%" class="bg" />

    <!-- Title -->
    <text y="35" class="title" x="450">Техники оптимизации контекста</text>
    <text y="58" class="subtitle" x="450">Начните с источника нагрузки. Каждая техника меняет свою метрику.</text>

    <!-- Horizontal flow line -->
    <line x1="50" y1="260" x2="850" y2="260" class="flow-line" />

    <!-- Technique 1: Compaction -->
    <g transform="translate(30, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#1B2621" />
        <text y="30" class="number" text-anchor="middle" x="25">1</text>
        <text y="30" class="card-title" x="105">Компакция</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#EDF5F0" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Суммируйте контекст при</text>
        <text y="83" class="card-desc" x="97">приближении к лимитам окна</text>
        <text y="98" class="card-desc" x="97"><tspan x="97">Храните каноническое</tspan><tspan x="97" dy="1.2em">состояние вне окна</tspan></text>
        <rect x="25" y="110" width="145" height="28" class="metric-box visual-focus" stroke="#EDF5F0" stroke-width="1.5" />
        <text y="129" class="metric" x="97" style="font-size: 11px;">Успешность продолжения</text>
    </g>

    <!-- Technique 2: Observation Masking -->
    <g transform="translate(245, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#1B2621" />
        <text y="30" class="number" text-anchor="middle" x="25">2</text>
        <text y="30" class="card-title" x="112"><tspan x="112">Маскирование</tspan><tspan x="112" dy="1.2em">наблюдений</tspan></text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#EDF5F0" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Заменяйте вывод инструментов</text>
        <text y="83" class="card-desc" x="97">компактными ссылками</text>
        <text y="98" class="card-desc" x="97"><tspan x="97">Сохраняйте полные ссылки</tspan><tspan x="97" dy="1.2em">на артефакты</tspan></text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#EDF5F0" stroke-width="1.5" />
        <text y="129" class="metric" x="97" style="font-size: 11px;">Число повторных запросов</text>
    </g>

    <!-- Technique 3: KV-Cache -->
    <g transform="translate(460, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#1B2621" />
        <text y="30" class="number" text-anchor="middle" x="25">3</text>
        <text y="30" class="card-title" x="112">Prompt caching</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#A8B8AF" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97" style="font-size: 11px;">Повторно используйте стабильный префикс</text>
        <text y="83" class="card-desc" x="97">для снижения повторных затрат</text>
        <text y="98" class="card-desc" x="97"><tspan x="97">Размещайте стабильный</tspan><tspan x="97" dy="1.2em">контент первым</tspan></text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#A8B8AF" stroke-width="1.5" />
        <text y="129" class="metric" x="97">Окно не изменилось</text>
    </g>

    <!-- Technique 4: Partitioning -->
    <g transform="translate(675, 90)">
        <rect x="0" y="0" width="195" height="150" class="card" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
        <circle cx="25" cy="25" r="15" fill="#1B2621" />
        <text y="30" class="number" text-anchor="middle" x="25">4</text>
        <text y="30" class="card-title" x="112">Разбиение решений</text>
        <line x1="15" y1="45" x2="180" y2="45" stroke="#A8B8AF" stroke-width="1.5" opacity="0.4" />
        <text y="68" class="card-desc" x="97">Разделяйте работу между</text>
        <text y="83" class="card-desc" x="97">шагами по решению и</text>
        <text y="98" class="card-desc" x="97">доступным возможностям</text>
        <rect x="25" y="110" width="145" height="28" class="metric-box" stroke="#A8B8AF" stroke-width="1.5" />
        <text y="129" class="metric" x="97" style="font-size: 12.5px;">Ошибки при передаче</text>
    </g>

    <!-- When to apply section -->
    <text y="295" class="section-label" x="50">КОГДА ПРИМЕНЯТЬ:</text>

    <g transform="translate(30, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #A8B8AF;" x="97">Используйте для:</text>
        <text y="40" class="card-desc" x="97" style="font-size: 11px;"><tspan x="97">История сообщений</tspan><tspan x="97" dy="1.2em">становится большой</tspan></text>
    </g>

    <g transform="translate(245, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #A8B8AF;" x="97">Используйте для:</text>
        <text y="40" class="card-desc" x="97" style="font-size: 11px;"><tspan x="97">Вывод инструментов</tspan><tspan x="97" dy="1.2em">доминирует в контексте</tspan></text>
    </g>

    <g transform="translate(460, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #A8B8AF;" x="97">Используйте для:</text>
        <text y="40" class="card-desc" x="97">Стабильные промпты / шаблоны</text>
    </g>

    <g transform="translate(675, 310)">
        <rect x="0" y="0" width="195" height="55" rx="8" ry="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
        <text y="22" class="card-desc" style="fill: #A8B8AF;" x="97">Используйте для:</text>
        <text y="40" class="card-desc" x="97" style="font-size: 11px;"><tspan x="97">Шагам нужны разные</tspan><tspan x="97" dy="1.2em">входные данные</tspan></text>
    </g>

    <!-- Result box -->
    <g transform="translate(250, 395)">
        <rect x="0" y="0" width="400" height="55" class="result-box" />
        <text y="25" class="result-text" x="200">Сопоставляйте технику с измеренным боттлнеком</text>
        <text y="45" class="card-desc" style="fill: #A8B8AF;" x="200">Универсальной экономии или комбинированного множителя нет</text>
    </g>

    <!-- Target metrics at bottom -->
    <text y="480" class="section-label" x="50">ОЦЕНИВАЙТЕ:</text>
    <text y="480" class="card-desc" x="250">Успешность задачи и ошибочные действия</text>
    <text y="480" class="card-desc" x="500">Латентность, общее число токенов и повторные запросы</text>
    <text y="480" class="card-desc" x="750">Чтения из кэша и раскрытие возможностей</text>

    <text y="520" class="card-desc" x="450">Возможности и пороги провайдеров различаются. Проверяйте актуальную документацию.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
