<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Компрессия контекста с учётом потерь и раздельными индексами канонического состояния и артефактов</title>
  <desc id="desc">Диалог и наблюдения суммируются в компактный рабочий набор, а каноническое состояние задачи, ссылки на доказательства и история артефактов хранятся отдельно для точного восстановления.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0f172a" /><text x="500" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Сжимайте текст; сохраняйте восстанавливаемое состояние</text>
  <g font-family="Inter, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#1e293b" stroke="#64748b" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Растущий контекст</text><text x="30" y="83" font-size="13" fill="#cbd5e1">ходы диалога</text><text x="30" y="116" font-size="13" fill="#cbd5e1">сырые наблюдения инструментов</text><text x="30" y="149" font-size="13" fill="#cbd5e1">извлечённые фрагменты</text><text x="30" y="182" font-size="13" fill="#cbd5e1">повторяющийся шаблонный текст</text></g><text x="325" y="225" font-size="25" fill="#94a3b8">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Компактный рабочий набор</text><text x="30" y="83" font-size="13" fill="#93c5fd">решения + следующее действие</text><text x="30" y="116" font-size="13" fill="#93c5fd">типизированные результаты инструментов</text><text x="30" y="149" font-size="13" fill="#93c5fd">источник + ссылки на артефакты</text><text x="30" y="182" font-size="13" fill="#93c5fd">нерешённые вопросы</text></g><text x="665" y="225" font-size="25" fill="#94a3b8">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#1d4ed8" stroke="#2563eb" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#93c5fd">Канонические хранилища</text><text x="30" y="83" font-size="13" fill="#93c5fd">состояние задачи</text><text x="30" y="116" font-size="13" fill="#93c5fd">индекс файлов и артефактов</text><text x="30" y="149" font-size="13" fill="#93c5fd">полные результаты инструментов</text><text x="30" y="182" font-size="13" fill="#93c5fd">версии доказательств</text><text x="30" y="225" font-size="12" fill="#93c5fd">Повторно извлекайте точные детали</text><text x="30" y="247" font-size="12" fill="#93c5fd">когда они нужны задаче.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#94a3b8">Оптимизируйте общее число токенов на успешно выполненную задачу, включая повторное извлечение и восстановление.</text></g>
</svg>
