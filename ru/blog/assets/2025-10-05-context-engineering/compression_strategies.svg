<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Компрессия контекста с учётом потерь: отдельные каноническое состояние и индексы артефактов</title>
  <desc id="desc">Диалог и наблюдения сворачиваются в компактный рабочий набор, а каноническое состояние задачи, ссылки на доказательства и история артефактов хранятся отдельно для точного восстановления.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#F7F7F4" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#17211B">Сжимайте текст; сохраняйте восстанавливаемое состояние</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Растущий контекст</text><text x="30" y="83" font-size="13" fill="#17211B">ходы диалога</text><text x="30" y="116" font-size="13" fill="#17211B">сырые наблюдения инструментов</text><text x="30" y="149" font-size="13" fill="#17211B">извлечённые фрагменты</text><text x="30" y="182" font-size="13" fill="#17211B">повторяющийся шаблонный текст</text></g><text x="325" y="225" font-size="25" fill="#17211B">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#FFFFFF" stroke="#17211B" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Компактный рабочий набор</text><text x="30" y="83" font-size="13" fill="#17211B">решения + следующее действие</text><text x="30" y="116" font-size="13" fill="#17211B">типизированные результаты инструментов</text><text x="30" y="149" font-size="13" fill="#17211B">ссылки на источники и артефакты</text><text x="30" y="182" font-size="13" fill="#17211B">нерешённые вопросы</text></g><text x="665" y="225" font-size="25" fill="#17211B">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#FFFFFF" stroke="#17211B" class="visual-focus" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#17211B">Канонические хранилища</text><text x="30" y="83" font-size="13" fill="#17211B">состояние задачи</text><text x="30" y="116" font-size="13" fill="#17211B">индекс файлов и артефактов</text><text x="30" y="149" font-size="13" fill="#17211B">полные результаты инструментов</text><text x="30" y="182" font-size="13" fill="#17211B">версии доказательств</text><text x="30" y="225" font-size="12" fill="#17211B">Повторно получать точные детали</text><text x="30" y="247" font-size="12" fill="#17211B">когда они нужны задаче.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#17211B">Оптимизируйте общее число токенов на успешно выполненную задачу, включая повторное получение данных и восстановление.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
