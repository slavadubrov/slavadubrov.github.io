<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Компрессия контекста с учётом потерь: отдельные каноническое состояние и индексы артефактов</title>
  <desc id="desc">Диалог и наблюдения сворачиваются в компактный рабочий набор, а каноническое состояние задачи, ссылки на доказательства и история артефактов хранятся отдельно для точного восстановления.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="440" rx="22" fill="#0C1210" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">Сжимайте текст; сохраняйте восстанавливаемое состояние</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(35 105)"><rect width="260" height="230" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Растущий контекст</text><text x="30" y="83" font-size="13" fill="#EDF5F0">ходы диалога</text><text x="30" y="116" font-size="13" fill="#EDF5F0">сырые наблюдения инструментов</text><text x="30" y="149" font-size="13" fill="#EDF5F0">извлечённые фрагменты</text><text x="30" y="182" font-size="13" fill="#EDF5F0">повторяющийся шаблонный текст</text></g><text x="325" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(365 105)"><rect width="270" height="230" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="135" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Компактный рабочий набор</text><text x="30" y="83" font-size="13" fill="#EDF5F0">решения + следующее действие</text><text x="30" y="116" font-size="13" fill="#EDF5F0"><tspan x="30">типизированные результаты</tspan><tspan x="30" dy="1.2em">инструментов</tspan></text><text x="30" y="149" font-size="13" fill="#EDF5F0">ссылки на источники и артефакты</text><text x="30" y="182" font-size="13" fill="#EDF5F0">нерешённые вопросы</text></g><text x="665" y="225" font-size="25" fill="#EDF5F0">+</text>
  <g transform="translate(705 85)"><rect width="260" height="270" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="130" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Канонические хранилища</text><text x="30" y="83" font-size="13" fill="#EDF5F0">состояние задачи</text><text x="30" y="116" font-size="13" fill="#EDF5F0">индекс файлов и артефактов</text><text x="30" y="149" font-size="13" fill="#EDF5F0">полные результаты инструментов</text><text x="30" y="182" font-size="13" fill="#EDF5F0">версии доказательств</text><text x="30" y="225" font-size="12" fill="#EDF5F0">Повторно получать точные детали</text><text x="30" y="247" font-size="12" fill="#EDF5F0">когда они нужны задаче.</text></g><text x="500" y="400" text-anchor="middle" font-size="13" fill="#EDF5F0">Оптимизируйте общее число токенов на успешно выполненную задачу, включая повторное получение данных и восстановление.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
