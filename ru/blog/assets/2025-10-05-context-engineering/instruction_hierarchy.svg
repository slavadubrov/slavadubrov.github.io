<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="instr-title instr-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="instr-title">Приоритет инструкций зависит от провайдера, поэтому универсальная иерархия ролей — ошибка; общий рубеж принудительного контроля — код приложения.</title><desc id="instr-desc">Model Spec OpenAI ранжирует инструкции платформы или системы, разработчика и пользователя по уровню полномочий. Anthropic Messages API предоставляет параметр верхнего уровня system и сообщения user и assistant без эквивалентной роли developer. Независимо от названий ролей у провайдера, код приложения авторизует инструменты, доступ к данным и побочные эффекты.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="instr-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="instr-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="670" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Приоритет инструкций зависит от провайдера</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Названия ролей различаются у провайдеров; контроль обеспечивается архитектурой, а не текстом.</text>
