<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="title">Память выбирается по субъекту, назначению, актуальности и релевантности</title>
  <desc id="desc">Кандидаты в память проходят проверки субъекта и области tenant, назначения, актуальности и релевантности. В контекст попадают только выбранные записи; отклонённые остаются за его пределами.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1000" height="420" rx="22" fill="#0C1210" /><text x="500" y="48" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EDF5F0">Извлечение памяти — это решение на основе политик</text>
  <g font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"><g transform="translate(40 110)"><rect width="220" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="110" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Хранилище памяти</text><text x="28" y="82" font-size="13" fill="#EDF5F0">явные факты о пользователе</text><text x="28" y="112" font-size="13" fill="#EDF5F0">выведенные гипотезы</text><text x="28" y="142" font-size="13" fill="#EDF5F0">эпизодические записи</text><text x="28" y="172" font-size="13" fill="#EDF5F0"><tspan x="28">происхождение + жизненный</tspan><tspan x="28" dy="1.2em">цикл</tspan></text></g><text x="290" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(330 95)"><rect width="330" height="240" rx="16" fill="#141D19" stroke="#EDF5F0" class="visual-focus" /><text x="165" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0">Гейты отбора</text><text x="35" y="82" font-size="13" fill="#EDF5F0">1. аутентифицированные субъект + tenant</text><text x="35" y="116" font-size="13" fill="#EDF5F0">2. разрешённое назначение</text><text x="35" y="150" font-size="13" fill="#EDF5F0">3. актуальность и статус ревью</text><text x="35" y="184" font-size="13" fill="#EDF5F0">4. релевантность и авторитетность</text><text x="35" y="218" font-size="12" fill="#EDF5F0"><tspan x="35">Нет пройденного гейта → нет включения в</tspan><tspan x="35" dy="1.2em">контекст</tspan></text></g><text x="690" y="225" font-size="25" fill="#EDF5F0">→</text>
  <g transform="translate(730 110)"><rect width="230" height="210" rx="16" fill="#141D19" stroke="#EDF5F0" /><text x="115" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#EDF5F0"><tspan x="115">Выбранный рабочий</tspan><tspan x="115" dy="1.2em">набор</tspan></text><text x="30" y="84" font-size="13" fill="#EDF5F0">минимум полезных фактов</text><text x="30" y="116" font-size="13" fill="#EDF5F0">источник сохранён</text><text x="30" y="148" font-size="13" fill="#EDF5F0">срок действия сохранён</text><text x="30" y="180" font-size="13" fill="#EDF5F0">удаление остаётся возможным</text></g><text x="500" y="382" text-anchor="middle" font-size="13" fill="#EDF5F0">Воспоминания, выведенные моделью, остаются гипотезами, пока авторитетный источник не подтвердит их.</text></g>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
