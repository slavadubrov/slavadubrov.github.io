<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Прогрессивное раскрытие контекста</title>
  <desc id="artifact-desc">Поток для каждого решения начинается с доверенного состояния задачи, маршрутизирует решение, загружает только релевантные доказательства, память и схемы инструментов, а затем валидирует предложение модели. При eager-подходе нерелевантные материалы загружаются до того, как понадобятся решению.</desc>
    <style>
        .bg { fill: #F7F7F4; }
        .title { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
        .box { rx: 8; ry: 8; }
        .box-title { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
        .box-text { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
        .arrow { stroke: #59645E; stroke-width: 2; fill: none; marker-end: url(#arrow); }
        .flow-text { fill: #59645E; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; }
    </style>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#F2F2F5" />
        </marker>
    </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

    <rect width="100%" height="100%" class="bg" />

    <text y="30" class="title" x="400">Прогрессивное раскрытие для одного решения</text>

    <!-- Step 1: Initial Load -->
    <g transform="translate(50, 70)">
        <rect x="0" y="0" width="140" height="80" class="box" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
        <text y="25" class="box-title" x="70">1. Начать с малого</text>
        <text y="45" class="box-text" x="70" style="font-size: 11px;">Доверенные инструкции</text>
        <text y="58" class="box-text" x="70" style="font-size: 11px;">Текущее состояние задачи</text>
        <text y="71" class="box-text" x="70" style="font-size: 11px;">Стабильные идентификаторы</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 190 110 L 240 110" class="arrow" />
    <text y="100" class="flow-text" x="215">query</text>

    <!-- Step 2: Route -->
    <g transform="translate(250, 70)">
        <rect x="0" y="0" width="140" height="80" class="box" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
        <text y="25" class="box-title" x="70">2. Маршрутизировать</text>
        <text y="45" class="box-text" x="70">Нужен retrieval?</text>
        <text y="58" class="box-text" x="70">Нужна память?</text>
        <text y="71" class="box-text" x="70">Какие инструменты?</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 390 110 L 440 110" class="arrow" />
    <text y="100" class="flow-text" x="415">выбрано</text>

    <!-- Step 3: Load -->
    <g transform="translate(450, 70)">
        <rect x="0" y="0" width="140" height="80" class="box" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
        <text y="25" class="box-title" x="70" style="font-size: 11px;">3. Загрузить только нужное</text>
        <text y="45" class="box-text" x="70" style="font-size: 11px;">Релевантные доказательства</text>
        <text y="58" class="box-text" x="70">Релевантная память</text>
        <text y="71" class="box-text" x="70" style="font-size: 11px;">Разрешённые схемы инструментов</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 590 110 L 640 110" class="arrow" />
    <text y="100" class="flow-text" x="615">proposal</text>

    <!-- Step 4: Respond -->
    <g transform="translate(650, 70)">
        <rect x="0" y="0" width="100" height="80" class="box" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
        <text y="25" class="box-title" x="50" style="font-size: 11.5px;">4. Валидировать</text>
        <text y="50" class="box-text" x="50" style="font-size: 11px;">Проверить proposal</text>
        <text y="63" class="box-text" x="50" style="font-size: 11.5px;">затем выполнить</text>
    </g>

    <!-- Contrast: Naive approach -->
    <g transform="translate(50, 180)">
        <rect x="0" y="0" width="700" height="60" class="box visual-focus" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
        <text y="20" class="box-title" style="fill: #59645E;" x="350">Eager loading: копировать каждый источник в каждый вызов модели</text>
        <text y="40" class="box-text" x="350"><tspan x="350">Нерелевантные материалы увеличивают стоимость и поверхность атаки на входе. Измеряйте их влияние на</tspan><tspan x="350" dy="1.2em">успешность задачи.</tspan></text>
    </g>

    <!-- Insight -->
    <rect x="125" y="255" width="550" height="42" rx="8" ry="8" fill="#FFFFFF" stroke="#59645E" />
    <text y="280" class="box-text" style="fill: #59645E;font-weight:600;" x="400"><tspan x="400">Сохраняйте стабильные идентификаторы. Загружайте авторизованные детали для</tspan><tspan x="400" dy="1.2em">текущего решения.</tspan></text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
