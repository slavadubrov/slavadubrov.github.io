<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Separate Claude Code CLI and Claude Agent SDK permission flows" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Потоки разрешений Claude Code CLI и Agent SDK</title>
  <desc>Два отдельных пути проверки разрешений: Claude Code проверяет правила deny, ask и allow, а хук PreToolUse служит дополнительным механизмом блокировки; Claude Agent SDK перед выполнением или блокировкой tool проверяет hooks, deny, ask, mode, allow и canUseTool.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="790" rx="14" fill="#f8fafc" />
  <text x="560" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Проверка разрешений выполняется по двум путям</text>
  <text x="560" y="58" text-anchor="middle" font-size="12" fill="#64748b">Правила Claude Code CLI и callback Claude Agent SDK — связанные механизмы, а не единый универсальный пайплайн.</text>

  <!-- CLI flow -->
  <rect x="48" y="84" width="500" height="620" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="72" y="118" font-size="16" font-weight="700" fill="#1d4ed8">Claude Code CLI</text>
  <text x="72" y="140" font-size="11" fill="#64748b">Побеждает первое совпавшее правило: deny → ask → allow.</text>

  <rect x="76" y="164" width="300" height="42" rx="8" fill="#7c3aed" />
  <text x="226" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Запрос tool из CLI</text>

  <line x1="226" y1="206" x2="226" y2="219" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="219" width="300" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="92" y="243" font-size="12" font-weight="700" fill="#991b1b">1 · deny-правила</text>
  <text x="92" y="262" font-size="11" fill="#334155">первое совпадение → блокировка</text>

  <line x1="226" y1="277" x2="226" y2="299" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="299" width="300" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="92" y="323" font-size="12" font-weight="700" fill="#9a3412">2 · ask-правила</text>
  <text x="92" y="342" font-size="11" fill="#334155">первое совпадение → промпт</text>

  <line x1="226" y1="357" x2="226" y2="379" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="379" width="300" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="92" y="403" font-size="12" font-weight="700" fill="#166534">3 · allow-правила</text>
  <text x="92" y="422" font-size="11" fill="#334155">первое совпадение → разрешение</text>

  <line x1="226" y1="437" x2="226" y2="461" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76" y="461" width="300" height="58" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="92" y="485" font-size="12" font-weight="700" fill="#9a3412">Нет совпавшего правила</text>
  <text x="92" y="504" font-size="11" fill="#334155">обрабатывается активным режимом разрешений</text>

  <rect x="76" y="548" width="300" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="226" y="570" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Результат CLI</text>
  <text x="226" y="586" text-anchor="middle" font-size="10" fill="#64748b">промпт или выполнение</text>

  <!-- Hook side note: it is deliberately outside the CLI rule path. -->
  <rect x="402" y="216" width="122" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="414" y="239" font-size="10.5" font-weight="700" fill="#1d4ed8">Хук PreToolUse</text>
  <text x="414" y="255" font-size="9" fill="#64748b">дополнительная блокировка</text>
  <text x="414" y="281" font-size="10" fill="#334155">Срабатывает до</text>
  <text x="414" y="296" font-size="10" fill="#334155">показа промпта.</text>
  <text x="414" y="321" font-size="10" fill="#334155">Может заблокировать</text>
  <text x="414" y="336" font-size="10" fill="#334155">call, но не</text>
  <text x="414" y="351" font-size="10" fill="#334155">отменяет совпавшее</text>
  <text x="414" y="366" font-size="10" fill="#334155">deny- или ask-</text>
  <text x="414" y="381" font-size="10" fill="#334155">правило.</text>
  <line x1="402" y1="318" x2="376" y2="318" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- SDK flow -->
  <rect x="572" y="84" width="500" height="620" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="596" y="118" font-size="16" font-weight="700" fill="#5b21b6">Claude Agent SDK</text>
  <text x="596" y="140" font-size="11" fill="#64748b">Отдельный путь через callback завершается явной блокировкой или выполнением.</text>

  <rect x="600" y="164" width="444" height="42" rx="8" fill="#7c3aed" />
  <text x="822" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Запрос tool из SDK</text>

  <line x1="822" y1="206" x2="822" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="220" width="444" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="616" y="241" font-size="12" font-weight="700" fill="#1d4ed8">1 · hooks</text>
  <text x="616" y="257" font-size="10.5" fill="#334155">Хуки PreToolUse могут заблокировать запрос.</text>

  <line x1="822" y1="268" x2="822" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="282" width="444" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="616" y="303" font-size="12" font-weight="700" fill="#991b1b">2 · deny-правила</text>
  <text x="616" y="319" font-size="10.5" fill="#334155">Совпавшее deny-правило → блокировка.</text>

  <line x1="822" y1="330" x2="822" y2="344" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="344" width="444" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="616" y="365" font-size="12" font-weight="700" fill="#9a3412">3 · ask-правила</text>
  <text x="616" y="381" font-size="10.5" fill="#334155">Совпавшее ask-правило → промпт.</text>

  <line x1="822" y1="392" x2="822" y2="406" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="406" width="444" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="616" y="427" font-size="12" font-weight="700" fill="#9a3412">4 · режим разрешений</text>
  <text x="616" y="443" font-size="10.5" fill="#334155">Неразрешённый запрос обрабатывается активным режимом.</text>

  <line x1="822" y1="454" x2="822" y2="468" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="468" width="444" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="616" y="489" font-size="12" font-weight="700" fill="#166534">5 · allow-правила</text>
  <text x="616" y="505" font-size="10.5" fill="#334155">Совпавшее allow-правило → разрешение.</text>

  <line x1="822" y1="516" x2="822" y2="530" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="530" width="444" height="54" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="616" y="553" font-size="12" font-weight="700" fill="#5b21b6">6 · canUseTool</text>
  <text x="616" y="570" font-size="10.5" fill="#334155">Callback SDK принимает финальное решение.</text>

  <path d="M 822 584 V 602 H 705 V 620" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 822 602 H 939 V 620" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="600" y="620" width="210" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="705" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">блокировка</text>
  <text x="705" y="657" text-anchor="middle" font-size="10" fill="#334155">tool не выполняется</text>
  <rect x="834" y="620" width="210" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="939" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">выполнение</text>
  <text x="939" y="657" text-anchor="middle" font-size="10" fill="#334155">tool выполняется</text>

  <text x="560" y="744" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Источник: code.claude.com/docs/en/permissions · code.claude.com/docs/en/agent-sdk/permissions</text>
  <text x="560" y="767" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Разрешения — это инфраструктура, а не промпт.</text>
</svg>
