<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asi-title asi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asi-title">OWASP ASI Top 10 по необходимой границе контроля</title>
  <desc id="asi-desc">Перехват цели и отравление памяти — две категории, где могут помочь контент-фильтры. Для остальных восьми категорий нужны системные контроли инструментов, исполнения, идентичности, коммуникации, цепочки поставок, каскадных сбоев, доверия людей и rogue agents.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="560" rx="14" fill="#0C1210" />

  <rect x="48" y="56" width="280" height="424" rx="12" fill="none" stroke="#2B3B33" />
  <text class="kind" x="72" y="88">СВЯЗАНО С КОНТЕНТОМ · 2 ИЗ 10</text>
  <text class="note" x="72" y="112">Здесь могут помочь фильтры.</text>

  <rect x="72" y="144" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="176">ASI01</text>
  <text class="name" x="92" y="204">Перехват цели агента</text>
  <text class="note" x="92" y="224">перенаправление инструкций</text>

  <rect x="72" y="280" width="232" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="92" y="312">ASI06</text>
  <text class="name" x="92" y="340">Отравление памяти</text>
  <text class="note" x="92" y="360">RAG и постоянный контекст</text>

  <text class="note" x="72" y="432">Всё равно нужны авторизация и</text>
  <text class="note" x="72" y="452"><tspan x="72">контроль исполнения на нижнем</tspan><tspan x="72" dy="1.2em">уровне.</tspan></text>

  <rect x="368" y="56" width="544" height="424" rx="12" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="392" y="88" fill="#FF6FB6">ФОКУС · СИСТЕМНЫЕ КОНТРОЛИ · 8 ИЗ 10</text>
  <text class="note" x="392" y="112" fill="#FF6FB6">Контроли идентичности, политик, изоляции, мониторинга и цепочки поставок.</text>

  <rect class="box" x="392" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="176">ASI02 + ASI05</text>
  <text class="name" x="412" y="204" style="font-size: 11px;">Неправомерное использование инструментов</text>
  <text class="note" x="412" y="224" style="font-size: 11px;">непредусмотренное исполнение кода</text>

  <rect class="box" x="656" y="144" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="176">ASI03 + ASI07</text>
  <text class="name" x="676" y="204" style="font-size: 12px;">Злоупотребление идентичностью</text>
  <text class="note" x="676" y="224">небезопасные каналы агентов</text>

  <rect class="box" x="392" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="412" y="312">ASI04 + ASI08</text>
  <text class="name" x="412" y="340">Цепочка поставок</text>
  <text class="note" x="412" y="360">каскадные сбои агентов</text>

  <rect class="box" x="656" y="280" width="232" height="96" rx="10" />
  <text class="kind" x="676" y="312">ASI09 + ASI10</text>
  <text class="name" x="676" y="340">Доверие людей</text>
  <text class="note" x="676" y="360">rogue agents и дрейф цели</text>

  <text class="note" x="392" y="432">Эти классы сбоев выходят за пределы одной</text>
  <text class="note" x="392" y="452">границы ввода или вывода модели.</text>

  <text class="note" x="48" y="528">OWASP Agentic Security Initiative Top 10 на 2026 год · опубликовано 9 декабря 2025 года</text>
</svg>
