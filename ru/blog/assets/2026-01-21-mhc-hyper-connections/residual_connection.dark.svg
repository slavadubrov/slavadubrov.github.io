<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="resid-title resid-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="resid-title">Остаточный блок добавляет обученную функцию F(x) к shortcut identity.</title><desc id="resid-desc">Вход x разделяется на остаточную ветвь F(x), реализованную двумя слоями весов с ReLU между ними, и shortcut identity, полностью обходящий ветвь; затем пути суммируются, формируя выход блока x + F(x).</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="resid-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="resid-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="442" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Остаточное соединение: shortcut identity плюс F(x)</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Shortcut без изменений передаёт x дальше; F(x) нужно выучить только разницу.</text>
<path d="M42 148h100a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-100a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 148h100a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-120a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="165.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ВХОД</text><text x="46" y="209" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">xₗ</text><text x="46" y="231" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">вход слоя</text>
<path d="M152 200h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#resid-arrow-flow)" />
<path d="M178 148h280a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-280a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M178 148h280a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-300a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="182" y="165.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ОСТАТОЧНАЯ ВЕТВЬ F(x)</text><text x="182" y="209" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Вес → ReLU → Вес</text><text x="182" y="231" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">учит остаток, а не identity</text>
<path d="M468 200h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#resid-arrow-flow)" />
<path d="M494 148h184a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-184a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M494 148h184a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-204a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="498" y="165.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ВЫХОД</text><text x="498" y="209" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">xₗ + F(x)</text><text x="498" y="231" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="498">F(x)→0 ⇒ сквозная</tspan><tspan x="498" dy="1.2em">передача</tspan></text>
<path d="M92 252v56H586v-56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#resid-arrow-flow)" /><rect x="266.5" y="296" width="145" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="339" y="312.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">shortcut identity</text>
<path d="M32 372h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="398" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Остаточный блок учит отличие от identity, а не прямое отображение.</text>
<text x="32" y="420" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Когда F(x) приближается к нулю, один shortcut передаёт сигнал дальше.</text>
</svg>
