<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="lossid-title lossid-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="lossid-title">Неограниченное residual-преобразование может давать неограниченное усиление; doubly stochastic-преобразование сохраняет среднее и ограничивает усиление единицей.</title><desc id="lossid-desc">Сравнение residual mixing matrix без ограничений, произвольные положительные и отрицательные элементы которой могут без ограничений компенсироваться или усиливать друг друга, с целевой матрицей mHC: doubly stochastic-матрицей с неотрицательными элементами, сумма которых в каждой строке и каждом столбце равна единице; она сохраняет среднее между потоками и ограничивает усиление единицей.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="lossid-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="lossid-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="434" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Ограничение residual-преобразования меняет его возможности</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Та же роль n×n, но другие гарантии для элементов.</text>
<path d="M42 140h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 140h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">H^res · БЕЗ ОГРАНИЧЕНИЙ</text><text x="46" y="201" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17.5px;">Произвольные знаки и величины</text><text x="46" y="223" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;"><tspan x="46">элементы могут свободно компенсироваться или</tspan><tspan x="46" dy="1.2em">усиливать друг друга</tspan></text>
<path d="M184 244v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lossid-arrow-flow)" />
<path d="M42 260h284a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 260h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="277.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="46" y="315" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 14.5px;">Усиление может быть неограниченным</text>
<path d="M394 140h284a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M394 140h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="398" y="157.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">H^res · ЦЕЛЬ MHC</text><text x="398" y="201" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Doubly stochastic</text><text x="398" y="223" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="398">неотрицательные; сумма в каждой</tspan><tspan x="398" dy="1.2em">строке и столбце равна 1</tspan></text>
<path d="M536 244v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lossid-arrow-flow)" />
<path d="M394 260h284a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-284a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M394 260h284a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-304a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="398" y="277.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="398" y="315" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 16.5px;">Среднее сохраняется; усиление ≤ 1</text>
<path d="M32 364h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="390" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Цель уже, чем принудительно задать identity: разрешить смешивание, но ограничить</text>
<text x="32" y="412" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">амплификацию при композиции преобразований по глубине.</text>
</svg>
