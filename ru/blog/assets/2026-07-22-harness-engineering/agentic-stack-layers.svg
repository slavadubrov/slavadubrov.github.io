<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 694" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="asl-title asl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="asl-title">Где находится каждая часть агентного стека</title>
  <desc id="asl-desc">Модель предлагает, а цикл ризонинга выбирает следующий шаг. Внутри харнесса память предоставляет контекст, tool use задаёт контракт, безопасность управляет разрешениями, а Part 6 отвечает за гейт приёмки. Рантайм выполняет принятые вызовы и сохраняет состояние сессии, сэндбокса, чекпоинта и трейсов. Результаты возвращаются как контекст для следующего шага.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="694" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="38">ОДИН ШАГ — ОТ ПРЕДЛОЖЕНИЯ ДО ВЫПОЛНЕНИЯ</text>

  <rect class="box" x="48" y="64" width="1024" height="62" rx="10" />
  <text class="kind" x="68" y="89">МОДЕЛЬ</text><text class="name" x="168" y="90">Предложить текст, tool call или финальный ответ</text>
  <path class="edge" d="M560 126v32" marker-end="url(#asl-arrow)" />

  <rect class="box" x="48" y="166" width="1024" height="62" rx="10" />
  <text class="kind" x="68" y="191">PART 1</text><text class="name" x="168" y="192">Цикл ризонинга выбирает следующий шаг</text>
  <path class="edge" d="M560 228v32" marker-end="url(#asl-arrow)" /><text class="note" x="576" y="250">предложенный вызов</text>

  <rect x="48" y="268" width="1024" height="200" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" />
  <text class="kind" x="68" y="296">ХАРНЕСС — ОДНА ПРОГРАММА, ЧЕТЫРЕ ЗАДАЧИ</text>
  <rect class="store" x="68" y="320" width="216" height="96" rx="10" /><text class="kind" x="88" y="354">PART 2 · ПАМЯТЬ</text><text class="name" x="88" y="382">Сформировать контекст</text>
  <rect class="box" x="324" y="320" width="216" height="96" rx="10" /><text class="kind" x="344" y="354">PART 3 · ИНСТРУМЕНТЫ</text><text class="name" x="344" y="382">Задать контракт</text>
  <rect class="box" x="580" y="320" width="216" height="96" rx="10" /><text class="kind" x="600" y="354">PART 4 · БЕЗОПАСНОСТЬ</text><text class="name" x="600" y="382">Управлять разрешениями</text>
  <rect x="836" y="320" width="216" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="856" y="354" fill="#C50E72">ФОКУС · PART 6</text><text class="name" x="856" y="382" fill="#C50E72">Принять подтверждения</text>
  <path class="edge" d="M284 368h32" marker-end="url(#asl-arrow)" /><path class="edge" d="M540 368h32" marker-end="url(#asl-arrow)" /><path class="edge" d="M796 368h32" marker-end="url(#asl-arrow)" />
  <text class="note" x="68" y="448">Контекст поступает сюда; контракты и разрешения регулируют предложение; только гейт приёмки может завершить запуск.</text>
  <path class="edge" d="M944 468v32" marker-end="url(#asl-arrow)" /><text class="note" x="960" y="490">принятый вызов</text>

  <rect x="48" y="508" width="1024" height="136" rx="12" fill="none" stroke="#D8DDD9" stroke-width="1.5" />
  <text class="kind" x="68" y="536">PART 5 · РАНТАЙМ</text>
  <rect class="box" x="68" y="556" width="472" height="62" rx="10" /><text class="kind" x="88" y="581">ПРОЦЕСС</text><text class="name" x="198" y="582">Выполнить принятые вызовы</text>
  <rect class="store" x="580" y="556" width="472" height="62" rx="10" /><text class="kind" x="600" y="581">ХРАНИЛИЩЕ</text><text class="name" x="680" y="582">Сессия · сэндбокс · чекпоинт · трейс</text>
  <path class="edge" d="M540 587h32" marker-end="url(#asl-arrow)" />

  <path class="edge" d="M68 587H24V95h16" marker-end="url(#asl-arrow)" />
  <rect x="12" y="286" width="24" height="196" rx="6" fill="#F7F7F4" />
  <text class="note" x="28" y="384" text-anchor="middle" transform="rotate(-90 28 384)">результаты и трейсы становятся контекстом следующего шага</text>
  <path d="M48 658h1024" stroke="#D8DDD9" stroke-width="1" /><text class="note" x="48" y="680">Рантайм выполняет и сохраняет. Решение принимает харнесс.</text>
  <defs><marker id="asl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
