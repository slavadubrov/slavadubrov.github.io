<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hal-title">Парный абляционный тест передачи прогресса</title>
  <desc id="hal-desc">Фиксированные модель, набор задач, окружение, грейдер, бюджет и чекпоинт миграции платежа подаются на вход двум парным вариантам. В контроле передача прогресса отключена, а в тестовом варианте включена только она. Сравниваются дублирующиеся действия после возобновления, и компонент оставляется только в том случае, если прирост окупает его стоимость.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="704" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="38">ПАРНЫЙ АБЛЯЦИОННЫЙ ТЕСТ — МЕНЯЕТСЯ ОДНА ПЕРЕМЕННАЯ</text><text class="note" x="48" y="60">Наблюдаемая проблема: после возобновления миграции платежей повторяют работу, уже выполненную предыдущей сессией.</text>

  <rect class="store" x="48" y="80" width="864" height="62" rx="10" /><text class="kind" x="68" y="105">ФИКСИРОВАНО</text><text class="name" x="154" y="106">Модель · задачи · окружение · грейдер · общий бюджет</text>
  <path class="edge" d="M480 142v32" marker-end="url(#hal-arrow)" />
  <rect class="store" x="368" y="182" width="224" height="62" rx="10" /><text class="kind" x="388" y="207">СТАРТ</text><text class="name" x="388" y="228">Один и тот же чекпоинт</text>

  <path class="edge" d="M480 244v24a12 12 0 0 1-12 12H284v28" marker-end="url(#hal-arrow)" /><path class="edge" d="M480 244v24a12 12 0 0 0 12 12h184v28" marker-end="url(#hal-arrow)" />
  <rect class="box" x="144" y="316" width="280" height="96" rx="10" /><text class="kind" x="164" y="350">КОНТРОЛЬ</text><text class="name" x="164" y="378">Передача прогресса отключена</text><text class="note" x="164" y="398">воркспейс + диалог</text>
  <rect x="536" y="316" width="280" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="556" y="350" fill="#C50E72">ФОКУС · ТЕСТОВЫЙ ВАРИАНТ</text><text class="name" x="556" y="378" fill="#C50E72">Передача прогресса включена</text><text class="note" x="556" y="398">меняется только этот компонент</text>

  <path class="edge" d="M284 412v24a12 12 0 0 0 12 12h172v28" marker-end="url(#hal-arrow)" /><path class="edge" d="M676 412v24a12 12 0 0 1-12 12H492v28" marker-end="url(#hal-arrow)" />
  <rect class="box" x="340" y="484" width="280" height="96" rx="10" /><text class="kind" x="360" y="518">ИЗМЕРЕНИЕ</text><text class="name" x="360" y="546">Сравнить парные прогоны</text><text class="note" x="360" y="566">дублирующиеся действия · стоимость · время</text>
  <path class="edge" d="M480 580v16" marker-end="url(#hal-arrow)" />

  <path d="M480 604 590 638 480 672 370 638Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="480" y="624" text-anchor="middle">РЕШЕНИЕ</text><text class="name" x="480" y="646" text-anchor="middle">Прирост окупает стоимость?</text>
  <text class="note" x="154" y="680" text-anchor="middle">НЕТ → УДАЛИТЬ</text><text class="note" x="806" y="680" text-anchor="middle">ДА → ОСТАВИТЬ</text>
  <path class="edge" d="M370 638H154" marker-end="url(#hal-arrow)" /><path class="edge" d="M590 638h216" marker-end="url(#hal-arrow)" />
  <defs><marker id="hal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
