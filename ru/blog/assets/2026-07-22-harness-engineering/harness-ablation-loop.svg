<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1040" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="hal-title hal-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="hal-title">Парный абляционный тест передачи прогресса</title><desc id="hal-desc">Фиксированные модель, набор задач, окружение, грейдер и общий бюджет подают на вход два парных запуска из одного и того же чекпоинта миграции платежей с фиксированным seed. В контроле передача прогресса отключена, а в целевом варианте включена только она. Сравнение измеряет дублирующиеся действия инструментов после возобновления; компонент оставляют только тогда, когда прирост окупает его стоимость.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="hal-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="hal-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="1040" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Парная абляция передачи прогресса</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Наблюдаемая проблема: возобновлённые миграции платежей повторяют работу, уже</tspan><tspan x="32" dy="1.2em">завершённую предыдущей сессией.</tspan></text>
<path d="M42 112h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M42 112h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">ФИКСИРОВАНО</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#17211B">Модель · задачи · окружение · грейдер · общий бюджет</text>
<path d="M360 184v32" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" />
<path d="M258 216h204a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-204a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#0B6B45" stroke-width="1.5" /><path d="M258 216h204a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-224a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#0B6B45" /><text x="262" y="233.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">СТАРТ</text><text x="262" y="271" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#17211B">Один и тот же чекпоинт</text>
<path d="M360 288v24a12 12 0 0 1-12 12H172v28" fill="none" stroke="#17211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" />
