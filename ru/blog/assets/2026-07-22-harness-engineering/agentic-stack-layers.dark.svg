<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="asl-title asl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="asl-title">Где находится каждая часть серии в рамках одного хода</title><desc id="asl-desc">Модель предлагает вариант, а reasoning loop выбирает следующий шаг. Внутри харнесса память формирует контекст, tool use задаёт контракт, безопасность управляет разрешениями, а сфокусированный этап acceptance решает, завершает ли прогон полученное evidence. Рантайм выполняет одобренные вызовы и сохраняет состояние сессии, сэндбокса, чекпоинта и трейса; результаты становятся контекстом следующего хода.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="asl-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="asl-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="850" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Где находится каждая часть серии</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Один ход, четыре ответственности внутри харнесса.</text>
<path d="M42 112h716a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">МОДЕЛЬ</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Предложить текст, tool call или финальный ответ</text>
<path d="M400 184v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M42 216h716a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 216h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="233.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЧАСТЬ 1 · ЦИКЛ RЕASONING</text><text x="46" y="271" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Выбрать следующий шаг из доступного контекста</text>
<path d="M400 288v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" /><text x="416" y="310.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="start">предложенный вызов</text>
<rect x="32" y="336" width="736" height="168" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="362" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ХАРНЕСС — ОДНА ПРОГРАММА, ЧЕТЫРЕ ОТВЕТСТВЕННОСТИ</text>
<path d="M58 384h144a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-144a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 384h144a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-164a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЧАСТЬ 2 · ПАМЯТЬ</text><text x="62" y="445" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 12px;">Сформировать контекст</text><text x="62" y="467" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">для промпта</text>
<path d="M238 384h144a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-144a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M238 384h144a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-164a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="242" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЧАСТЬ 3 · TOOLS</text><text x="242" y="434" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Задать</text><text x="242" y="456" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">контракт</text><text x="242" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">проверить аргументы</text>
<path d="M418 384h144a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-144a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 384h144a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-164a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">Ч. 4 · БЕЗОП.</text><text x="422" y="434" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Управлять</text><text x="422" y="456" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">разрешением</text><text x="422" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">одобрить или отклонить</text>
<path d="M598 384h144a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-144a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M598 384h144a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-164a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="602" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ЧАСТЬ 6</text><text x="602" y="434" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Принять</text><text x="602" y="456" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">evidence</text><text x="602" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">завершает прогон</text>
<path d="M212 436h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M392 436h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M572 436h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M670 504v56" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" /><text x="686" y="532.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="start" style="font-size: 11.5px;">одобренный вызов</text>
<rect x="32" y="576" width="736" height="128" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="602" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ЧАСТЬ 5 · РАНТАЙМ</text>
<path d="M58 616h228a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-228a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 616h228a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-248a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="633.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ВЫПОЛНЕНИЕ</text><text x="62" y="671" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 14px;">Выполнить одобренные вызовы</text>
<path d="M322 616h420a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-420a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M322 616h420a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-440a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="326" y="633.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">СОХРАНЕНИЕ</text><text x="326" y="671" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Сессия · сэндбокс · чекпоинт · трейс</text>
<path d="M296 652h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M48 652H16V148H32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asl-arrow-flow)" />
<path d="M32 744h736" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="770" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Контекст поступает через память; контракты и разрешения управляют предложением.</text>
<text x="32" y="792" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Только acceptance gate может завершить прогон — рантайм выполняет и сохраняет данные, а результаты</tspan><tspan x="32" dy="1.2em">становятся контекстом следующего хода.</tspan></text>
</svg>
