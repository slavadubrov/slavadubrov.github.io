<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 352" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hbld-title hbld-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hbld-title">Проведение изменения поведения через руководство по харнессу</title>
  <desc id="hbld-desc">Запрос только на изменение поведения поступает в руководство, которое направляет поиск от общего обзора системы через этап выполнения к записям с привязкой к исходному коду. Каждый кандидат на локатор проверяется по актуальному репозиторию до применения плана правок. Непустой diff повторно синхронизирует руководство для следующего запроса.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="1120" height="352" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">ЛОКАЛИЗАЦИЯ ПОВЕДЕНИЯ — МАРШРУТИЗАЦИЯ, ПРОВЕРКА, ИЗМЕНЕНИЕ, СИНХРОНИЗАЦИЯ</text><text class="note" x="48" y="60">Руководство сужает область поиска. Актуальный репозиторий определяет, что существует на самом деле.</text>
  <rect class="box" x="48" y="96" width="160" height="96" rx="10" /><text class="kind" x="68" y="130">ЗАПРОС</text><text class="name" x="68" y="158" style="font-size: 12px;">Маскировать секреты</text><text class="note" x="68" y="178">поведение, без файла</text>
  <rect class="store" x="248" y="96" width="160" height="96" rx="10" /><text class="kind" x="268" y="130">РУКОВОДСТВО</text><text class="name" x="268" y="158" style="font-size: 11px;">Маршрутизация поиска</text><text class="note" x="268" y="178">обзор → этап</text>
  <rect x="448" y="96" width="160" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="468" y="130" fill="#FF6FB6">ФОКУС</text><text class="name" x="468" y="158" fill="#FF6FB6" style="font-size: 13px;">Проверить локаторы</text><text class="note" x="468" y="178" style="font-size: 11px;">актуальные функции + файлы</text>
  <rect class="box" x="648" y="96" width="160" height="96" rx="10" /><text class="kind" x="668" y="130">ПРОЦЕСС</text><text class="name" x="668" y="158" style="font-size: 11px;">Применить план правок</text><text class="note" x="668" y="178" style="font-size: 11px;">только проверенные места</text>
  <rect class="store" x="848" y="96" width="160" height="96" rx="10" /><text class="kind" x="868" y="130">ХРАНИЛИЩЕ</text><text class="name" x="868" y="158" style="font-size: 11px;">Синхронизировать карту</text><text class="note" x="868" y="178">после каждого diff</text>
  <path class="edge" d="M208 144h32" marker-end="url(#hbld-arrow)" /><path class="edge" d="M408 144h32" marker-end="url(#hbld-arrow)" /><path class="edge" d="M608 144h32" marker-end="url(#hbld-arrow)" /><path class="edge" d="M808 144h32" marker-end="url(#hbld-arrow)" />
  <path d="M928 192v56a12 12 0 0 1-12 12H340a12 12 0 0 1-12-12v-48" class="edge" stroke-dasharray="7 6" marker-end="url(#hbld-arrow)" /><rect x="532" y="248" width="204" height="24" rx="6" fill="#0C1210" /><text class="note" x="634" y="265" text-anchor="middle" style="font-size: 11px;">следующий запрос использует актуальные записи</text>
  <path d="M48 292h1024" stroke="#2B3B33" stroke-width="1" /><text class="kind" x="48" y="320">ПОРЯДОК АВТОРИТЕТНОСТИ</text><text class="name" x="194" y="321">Карта поведения → кандидат в исходном коде → актуальный репозиторий</text><text class="note" x="48" y="342">Заморозьте устаревшую запись; никогда не выдумывайте ей замену.</text>
  <defs><marker id="hbld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
</svg>
