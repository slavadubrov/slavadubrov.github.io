<path d="M42 352h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 352h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="369.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">КОНТРОЛЬ</text><text x="46" y="413" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Передача отключена</text><text x="46" y="435" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">рабочее пространство + диалог</text>
<path d="M418 352h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M418 352h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="422" y="369.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ЦЕЛЕВОЙ ВАРИАНТ</text><text x="422" y="413" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Передача включена</text><text x="422" y="435" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">меняется только этот компонент</text>
<path d="M172 456v24a12 12 0 0 0 12 12H348v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" />
<path d="M548 456v24a12 12 0 0 1-12 12H372v28" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" />
<path d="M230 520h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M230 520h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="234" y="537.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ИЗМЕРЕНИЕ</text><text x="234" y="581" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Сравнить парные запуски</text><text x="234" y="603" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="234">дублирующиеся действия ·</tspan><tspan x="234" dy="1.2em">стоимость · время</tspan></text>
<path d="M360 624v32" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" />
<rect x="220" y="656" width="280" height="96" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="360" y="696" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">РЕШЕНИЕ</text><text x="360" y="720" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" text-anchor="middle">Прирост окупает стоимость?</text>
<path d="M360 752v16a12 12 0 0 1-12 12H172v12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" /><text x="266" y="778.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">нет</text>
<path d="M360 752v16a12 12 0 0 0 12 12H548v12" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hal-arrow-flow)" /><text x="454" y="778.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">да</text>
<path d="M42 792h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 792h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="46" y="809.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">УДАЛИТЬ</text><text x="46" y="853" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Убрать передачу</text><text x="46" y="875" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">прирост не окупил стоимость</text>
<path d="M418 792h260a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-260a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 792h260a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-280a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="422" y="809.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ОСТАВИТЬ</text><text x="422" y="853" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Выпустить передачу</text><text x="422" y="875" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">прирост окупил стоимость</text>
<path d="M32 936h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="962" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Компонент нужен, если прирост целевой метрики окупает его добавленную стоимость.</text>
<text x="32" y="984" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Проводите одну абляцию на каждую гипотезу; не накапливайте непроверенные гардрейлы.</text>
</svg>
