<text x="32" y="426" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Обе проверки прошли на зафиксированном коммите.</text>
<text x="32" y="448" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Модель предлагает. Харнесс управляет разрешениями и завершением.</text>
