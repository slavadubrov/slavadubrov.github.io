<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="hcld-title hcld-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="hcld-title">Изменение скидки через контрольный цикл харнесса</title>
  <desc id="hcld-desc">Семь этапов проводят правку checkout от собранного контекста через предложение модели, авторизацию, выполнение в рантайме, приёмочные тесты, решение по доказательствам и трейс. Проваленные тесты возвращают доказательства модели; принять можно только зафиксированные пройденные проверки.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="552" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="38">ИЗМЕНЕНИЕ СКИДКИ — ОДИН КОНТРОЛИРУЕМЫЙ ЦИКЛ</text>
  <text class="note" x="48" y="60">Ничего не попадает на машину и не считается завершённым, пока харнесс не даст разрешение.</text>
  <circle cx="62" cy="94" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="99" text-anchor="middle">1</text><circle cx="286" cy="94" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="99" text-anchor="middle">2</text><circle cx="510" cy="94" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="99" text-anchor="middle">3</text><circle cx="734" cy="94" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="99" text-anchor="middle">4</text>
  <rect class="box" x="48" y="122" width="188" height="96" rx="10" /><text class="kind" x="68" y="156">КОНТЕКСТ</text><text class="name" x="68" y="184">Собрать задачу</text>
  <rect class="box" x="272" y="122" width="188" height="96" rx="10" /><text class="kind" x="292" y="156">МОДЕЛЬ</text><text class="name" x="292" y="184">Предложить правку</text>
  <rect class="box" x="496" y="122" width="188" height="96" rx="10" /><text class="kind" x="516" y="156">ГРАНИЦА</text><text class="name" x="516" y="184">Авторизовать вызов</text>
  <rect class="box" x="720" y="122" width="188" height="96" rx="10" /><text class="kind" x="740" y="156">РАНТАЙМ</text><text class="name" x="740" y="184">Применить правку</text>
  <path class="edge" d="M236 170h28" marker-end="url(#hcld-arrow)" /><path class="edge" d="M460 170h28" marker-end="url(#hcld-arrow)" /><path class="edge" d="M684 170h28" marker-end="url(#hcld-arrow)" />  <path class="edge" d="M814 218v100" marker-end="url(#hcld-arrow)" />
  <circle cx="734" cy="290" r="14" fill="#EDF5F0" /><text class="marker-num" x="734" y="295" text-anchor="middle">5</text><circle cx="510" cy="290" r="14" fill="#EDF5F0" /><text class="marker-num" x="510" y="295" text-anchor="middle">6</text><circle cx="286" cy="290" r="14" fill="#EDF5F0" /><text class="marker-num" x="286" y="295" text-anchor="middle">7</text>
  <rect x="720" y="318" width="188" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="740" y="352" fill="#FF6FB6">ФОКУС</text><text class="name" x="740" y="380" fill="#FF6FB6">Запустить оба теста</text><text class="note" x="740" y="400">pytest + Playwright</text>
  <path d="M590 318 684 366 590 414 496 366Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><text class="kind" x="590" y="351" text-anchor="middle">РЕШЕНИЕ</text><text class="name" x="590" y="378" text-anchor="middle"><tspan x="590">Доказательств</tspan><tspan x="590" dy="1.2em">достаточно?</tspan></text>
  <rect class="box" x="272" y="318" width="188" height="96" rx="10" fill="#1B2621" /><text class="kind" x="292" y="352">ТРЕЙС</text><text class="name" x="292" y="380" style="font-size: 11px;">Зафиксировать доказательства</text><text class="note" x="292" y="400" style="font-size: 11px;">команды · коды завершения · коммит</text>
  <path class="edge" d="M720 366h-28" marker-end="url(#hcld-arrow)" /><path class="edge" d="M496 366h-28" marker-end="url(#hcld-arrow)" /><text class="note" x="478" y="355" text-anchor="middle">да</text>
  <path d="M590 318v-58a12 12 0 0 0-12-12H378a12 12 0 0 1-12-12v-18" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#hcld-arrow-signal)" /><rect x="390" y="236" width="176" height="24" rx="6" fill="#0C1210" /><text class="note" x="478" y="253" text-anchor="middle" fill="#FF6FB6" style="font-size: 11px;">ошибка → доказательства модели</text>
  <path class="edge" d="M272 366H138a12 12 0 0 0-12 12v46" marker-end="url(#hcld-arrow)" /><text class="kind" x="48" y="450">ПРИНЯТЬ</text><text class="name" x="48" y="478">Проверенный результат</text><text class="note" x="48" y="502">Обе проверки пройдены на зафиксированном коммите.</text>
  <path d="M48 516h864" stroke="#2B3B33" stroke-width="1" /><text class="note" x="48" y="538">Модель предлагает. Харнесс владеет правами и подтверждает завершение.</text>
  <defs><marker id="hcld-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="hcld-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
