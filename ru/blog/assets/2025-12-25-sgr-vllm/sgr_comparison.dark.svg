<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="comparison-title comparison-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="comparison-title">Сравнение промпт-инжиниринга, chain-of-thought и reasoning по схеме</title>
  <desc id="comparison-desc">Три выровненные колонки сравнивают форму вывода, механизм контроля и применимость. Reasoning по схеме выделен, потому что constrained decoding блокирует вывод, невалидный по схеме, но семантические ошибки всё ещё требуют валидации.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="448" rx="14" fill="#0C1210" />
  <text class="kind" x="48" y="48">СРАВНЕНИЕ · ОДИН ЗАПРОС, РАЗНЫЙ КОНТРОЛЬ</text>

  <rect class="box" x="48" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="68" y="106">ПОДХОД · ПРОМПТ</text>
  <text class="name" x="68" y="135">Промпт-инжиниринг</text>
  <rect class="box" x="352" y="72" width="256" height="96" rx="10" />
  <text class="kind" x="372" y="106">ПОДХОД · COT</text>
  <text class="name" x="372" y="135">Chain-of-thought</text>
  <rect x="656" y="72" width="256" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="676" y="106" fill="#FF6FB6">ФОКУС · SGR</text>
  <text class="name" x="676" y="135" fill="#FF6FB6">По схеме</text>

  <text class="kind" x="48" y="216">ФОРМА ВЫВОДА</text>
  <text class="note" x="48" y="244">переменный текст</text>
  <text class="note" x="352" y="244">свободный текст ризонинга</text>
  <text class="note" x="656" y="244">жёсткий JSON / Pydantic</text>
  <path d="M48 264h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="300">КОНТРОЛЬ</text>
  <text class="note" x="48" y="328">семантическое убеждение</text>
  <text class="note" x="352" y="328">эвристические шаги в промпте</text>
  <text class="note" x="656" y="328">грамматическая маска для каждого токена</text>
  <path d="M48 348h864" stroke="#2B3B33" />

  <text class="kind" x="48" y="384">ПРИМЕНИМОСТЬ</text>
  <text class="note" x="48" y="412">парсер должен восстановить поля</text>
  <text class="note" x="352" y="412">читатель должен интерпретировать текст</text>
  <text class="note" x="656" y="412">поля валидируются; смысл всё ещё проверяется</text>
</svg>
