<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="workflow-title">Воркфлоу ценового ИИ-агента с детерминированным гардрейлом политики</title>
  <desc id="workflow-desc">Запрос пользователя маршрутизируется. Для ценовых запросов извлекаются признаки и формируется предложение по схеме, которое приложение должно одобрить согласно политике до возврата ответа. Общие запросы обходят ценовой контур, а отклонённые предложения направляются в безопасный fallback.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="528" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="48">ВОРКФЛОУ · КОНТРОЛЬ СХЕМЫ И ПОЛИТИКА ПРИЛОЖЕНИЯ</text>

  <rect x="48" y="80" width="192" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="114">ВНЕШНИЙ · ВХОД</text>
  <text class="name" x="68" y="143" fill="#59645E">Запрос пользователя</text>
  <path class="edge" d="M240 128h24" marker-end="url(#workflow-arrow)" />
  <rect class="box" x="272" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="292" y="114">ПРОЦЕСС · SGR</text>
  <text class="name" x="292" y="143"><tspan x="292">Маршрутизировать</tspan><tspan x="292" dy="1.2em">запрос</tspan></text>
  <path class="edge" d="M464 128h24" marker-end="url(#workflow-arrow)" />
  <rect class="store" x="496" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="516" y="114">ХРАНИЛИЩЕ · ПРИЗНАКИ</text>
  <text class="name" x="516" y="143">Извлечь контекст</text>
  <path class="edge" d="M688 128h24" marker-end="url(#workflow-arrow)" />
  <rect class="box" x="720" y="80" width="192" height="96" rx="10" />
  <text class="kind" x="740" y="114">ПРОЦЕСС · SGR</text>
  <text class="name" x="740" y="143"><tspan x="740">Типизированное</tspan><tspan x="740" dy="1.2em">предложение</tspan></text>

  <path class="edge" d="M816 176v56" marker-end="url(#workflow-arrow)" />
  <rect x="720" y="248" width="192" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="740" y="282" fill="#C50E72">ФОКУС · КОД</text>
  <text class="name" x="740" y="311" fill="#C50E72">Проверка политики</text>
  <path class="edge" d="M720 296h-24" marker-end="url(#workflow-arrow)" />
  <text class="note" x="704" y="288" text-anchor="middle">одобрить</text>
  <rect class="box" x="496" y="248" width="192" height="96" rx="10" />
  <text class="kind" x="516" y="282">ПРОЦЕСС · РЕЗУЛЬТАТ</text>
  <text class="name" x="516" y="311">Ответ по шаблону</text>

  <path class="edge" d="M368 176v108a12 12 0 0 0 12 12h108" stroke-dasharray="7 6" marker-end="url(#workflow-arrow)" />
  <text class="note" x="446" y="288" text-anchor="middle">общий ответ</text>

  <path d="M816 344v40" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#workflow-arrow-signal)" />
  <rect x="824" y="352" width="56" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="852" y="369" text-anchor="middle" fill="#C50E72" style="font-size: 11px;">отклонить</text>
  <rect class="box" x="720" y="400" width="192" height="62" rx="10" />
  <text class="kind" x="740" y="426">ПРОЦЕСС · FALLBACK</text>
  <text class="name" x="740" y="449" style="font-size: 11.5px;">Отклонить или эскалировать</text>

  <path d="M48 480h640" stroke="#D8DDD9" />
  <text class="note" x="48" y="508">Валидность схемы позволяет коду проверить предложение; только гардрейл политики может авторизовать оффер.</text>
  <defs>
    <marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
    <marker id="workflow-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker>
  </defs>
</svg>
