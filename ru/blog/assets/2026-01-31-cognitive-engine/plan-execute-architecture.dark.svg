<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 576" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="arch-title arch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="arch-title">ИИ-агент Market Analyst направляет один запрос в два цикла ризонинга с общей state</title>
  <desc id="arch-desc">Роутер отправляет глубокое исследование планировщику и ReAct-экзекьютору либо быстрый брифинг планировщику, worker и solver в ReWOO. Оба маршрута сходятся в reporter и обновляют одну и ту же типизированную state ИИ-агента.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; } .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .external { fill: #141D19; stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; } .decision { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; } .focus { fill: #2B1622; stroke: #FF6FB6; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #FF6FB6; }
    .group { fill: none; stroke: #2B3B33; stroke-width: 1; } .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .async { stroke-dasharray: 2 6; } .canvas { fill: #0C1210; } .arrow { fill: #A8B8AF; }
  </style>
  <rect class="canvas" width="1120" height="576" rx="14" /><text class="section" x="48" y="44">ОДИН LANGGRAPH · ДВА РОУТИРУЕМЫХ РЕЖИМА · ОДНА СХЕМА STATE</text>
  <rect class="external" x="48" y="88" width="176" height="62" rx="10" /><text class="kind" x="68" y="112">ВНЕШНИЙ · ЗАПРОС</text><text class="name" x="68" y="136">Вопрос о рынке</text>
  <path class="edge" d="M224 119h40" marker-end="url(#arch-arrow)" />
  <path class="decision" d="M328 71 400 119 328 167 256 119Z" /><text class="kind" x="328" y="110" text-anchor="middle">РОУТЕР</text><text class="name" x="328" y="134" text-anchor="middle">какой цикл?</text>
  <rect class="group" x="432" y="64" width="640" height="176" rx="12" /><text class="section" x="456" y="92">ГЛУБОКОЕ ИССЛЕДОВАНИЕ · ПЛАНИРОВАНИЕ И ВЫПОЛНЕНИЕ</text>
  <rect class="process" x="456" y="112" width="176" height="96" rx="10" /><text class="kind" x="476" y="146"><tspan x="476">МОДЕЛЬ ·</tspan><tspan x="476" dy="1.2em">ПЛАНИРОВЩИК</tspan></text><text class="name" x="476" y="174" style="font-size: 11px;">Составить план исследования</text><text class="note" x="476" y="193" style="font-size: 11.5px;">4–6 упорядоченных шагов</text>
  <rect class="process" x="664" y="112" width="176" height="96" rx="10" /><text class="kind" x="684" y="146">ПРОЦЕСС · ЭКЗЕКЬЮТОР</text><text class="name" x="684" y="174" style="font-size: 14px;">Запустить цикл шагов</text><text class="note" x="684" y="193">ReAct для каждого шага</text>
  <path class="edge conditional" d="M378 103 448 144" marker-end="url(#arch-arrow)" /><rect class="canvas" x="390" y="107" width="52" height="24" rx="6" /><text class="note" x="416" y="124" text-anchor="middle" style="font-size: 11.5px;">глубокий</text><path class="edge" d="M632 160h32" marker-end="url(#arch-arrow)" />
  <rect class="group" x="432" y="272" width="640" height="176" rx="12" /><text class="section" x="456" y="300">БЫСТРЫЙ БРИФИНГ · REWOO</text>
  <rect class="process" x="456" y="320" width="176" height="96" rx="10" /><text class="kind" x="476" y="354"><tspan x="476">МОДЕЛЬ ·</tspan><tspan x="476" dy="1.2em">ПЛАНИРОВЩИК</tspan></text><text class="name" x="476" y="382" style="font-size: 11px;">Составить граф инструментов</text><text class="note" x="476" y="401">#E1 · #E2 · зависимости</text>
  <rect class="process" x="664" y="320" width="176" height="96" rx="10" /><text class="kind" x="684" y="354">ПРОЦЕСС · WORKER</text><text class="name" x="684" y="382">Запустить граф</text><text class="note" x="684" y="401" style="font-size: 11px;"><tspan x="684">параллельно, когда</tspan><tspan x="684" dy="1.2em">возможно</tspan></text>
  <rect class="process" x="872" y="320" width="176" height="96" rx="10" /><text class="kind" x="892" y="354">МОДЕЛЬ · SOLVER</text><text class="name" x="892" y="382" style="font-size: 11.5px;">Синтезировать результат</text><text class="note" x="892" y="401">один финальный вызов</text>
  <path class="edge conditional" d="M328 167v201h120" marker-end="url(#arch-arrow)" /><rect class="canvas" x="341" y="252" width="54" height="24" rx="6" /><text class="note" x="368" y="269" text-anchor="middle" style="font-size: 12.5px;">быстрый</text><path class="edge" d="M632 368h32" marker-end="url(#arch-arrow)" /><path class="edge" d="M840 368h32" marker-end="url(#arch-arrow)" />
  <rect class="process" x="872" y="112" width="176" height="96" rx="10" /><text class="kind" x="892" y="146">ПРОЦЕСС · REPORTER</text><text class="name" x="892" y="174">Подготовить отчёт</text><text class="note" x="892" y="193">общий путь вывода</text>
  <path class="edge" d="M840 160h32" marker-end="url(#arch-arrow)" /><path class="edge" d="M960 320V216" marker-end="url(#arch-arrow)" />
  <rect class="focus" x="256" y="480" width="792" height="62" rx="10" /><text class="kind focus-kind" x="280" y="504">ФОКУС · ОБЩАЯ ТИПИЗИРОВАННАЯ STATE</text><text class="name focus-name" x="280" y="528">messages · execution_mode · plan · rewoo_plan · research_data · draft_report</text>
  <path class="edge async" d="M544 416v56" marker-end="url(#arch-arrow)" /><path class="edge async" d="M752 416v56" marker-end="url(#arch-arrow)" /><path class="edge async" d="M972 208v264" marker-end="url(#arch-arrow)" />
  <defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
