<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="planexecarch-title planexecarch-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecarch-title">Роутер направляет рыночный вопрос в один из двух циклов ризонинга, которые записывают данные в одно типизированное состояние.</title><desc id="planexecarch-desc">Роутер классифицирует рыночный вопрос как глубокое исследование или флеш-брифинг. Глубокое исследование использует Plan-and-Execute: планировщик записывает 4–6 шагов, экзекьютор выполняет каждый шаг в ReAct-цикле, а репортёр составляет отчёт. Флеш-брифинг использует ReWOO: планировщик записывает граф зависимостей инструментов, воркер выполняет его, а солвер синтезирует один результат. Репортёр и солвер ReWOO записывают данные в один общий объект типизированного состояния, но через репортёра проходит только маршрут глубокого исследования — солвер ReWOO записывает состояние напрямую.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
