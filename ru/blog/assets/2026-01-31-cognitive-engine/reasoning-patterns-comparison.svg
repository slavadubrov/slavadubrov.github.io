<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Reasoning Patterns Comparison" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Сравнение паттернов ризонинга</title>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
    <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #2563eb" />
      <stop offset="100%" style="stop-color: #2563eb" />
    </linearGradient>
    <linearGradient id="rewooGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #2563eb" />
      <stop offset="100%" style="stop-color: #7c3aed" />
    </linearGradient>
    <linearGradient id="planexecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #16a34a" />
      <stop offset="100%" style="stop-color: #166534" />
    </linearGradient>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- ReAct Section -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="260" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8" x="130">ReAct</text>
    <text y="48" text-anchor="middle" font-size="11" fill="#334155" x="130">(Рассуждение + действие)</text>

    <!-- ReAct Flow -->
    <rect x="85" y="65" width="90" height="32" rx="6" fill="url(#reactGrad)" />
    <text y="85" text-anchor="middle" font-size="12" fill="#ffffff" x="130">Рассуждение</text>

    <line x1="130" y1="97" x2="130" y2="115" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="85" y="120" width="90" height="32" rx="6" fill="url(#reactGrad)" />
    <text y="140" text-anchor="middle" font-size="12" fill="#ffffff" x="130">Действие</text>

    <line x1="130" y1="152" x2="130" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="85" y="175" width="90" height="32" rx="6" fill="url(#reactGrad)" />
    <text y="195" text-anchor="middle" font-size="12" fill="#ffffff" x="130">Наблюдение</text>

    <!-- Loop arrow -->
    <path d="M175 191 Q 210 191 210 130 Q 210 81 175 81" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
    <text y="140" font-size="10" fill="#2563eb" x="225">Цикл</text>

    <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="130">⚡ Гибкий, адаптивный</text>
    <text y="275" text-anchor="middle" font-size="10" fill="#334155" x="130">⚠️ Высокая латентность и расход токенов</text>
    <text y="290" text-anchor="middle" font-size="10" fill="#334155" x="130">Лучше всего для: исследования</text>
  </g>

  <!-- ReWOO Section -->
  <g transform="translate(310, 20)">
    <rect x="0" y="0" width="260" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6" x="130">ReWOO</text>
    <text y="48" text-anchor="middle" font-size="11" fill="#334155" x="130">(Ризонинг без наблюдений)</text>

    <!-- ReWOO Flow -->
    <rect x="85" y="65" width="90" height="32" rx="6" fill="url(#rewooGrad)" />
    <text y="85" text-anchor="middle" font-size="12" fill="#ffffff" x="130">Планировщик</text>

    <line x1="130" y1="97" x2="130" y2="108" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="20" y="112" width="220" height="60" rx="8" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" />

    <rect x="30" y="120" width="60" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
    <text y="138" text-anchor="middle" font-size="10" fill="#5b21b6" x="60">#E1</text>
    <rect x="100" y="120" width="60" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
    <text y="138" text-anchor="middle" font-size="10" fill="#5b21b6" x="130">#E2</text>
    <rect x="170" y="120" width="60" height="28" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
    <text y="138" text-anchor="middle" font-size="10" fill="#5b21b6" x="200">#E3</text>

    <text y="165" text-anchor="middle" font-size="10" fill="#2563eb" x="130">Воркер: параллельное выполнение</text>

    <line x1="130" y1="176" x2="130" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="85" y="192" width="90" height="32" rx="6" fill="url(#rewooGrad)" />
    <text y="212" text-anchor="middle" font-size="12" fill="#ffffff" x="130">Решатель</text>

    <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="130">⚡ Быстрый, экономно расходует токены</text>
    <text y="275" text-anchor="middle" font-size="10" fill="#334155" x="130">⚠️ Жёсткий, хрупкий</text>
    <text y="290" text-anchor="middle" font-size="10" fill="#334155" x="130">Лучше всего для: повторяемых процессов</text>
  </g>

  <!-- Plan-and-Execute Section -->
  <g transform="translate(600, 20)">
    <rect x="0" y="0" width="280" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534" x="140">Plan-and-Execute</text>
    <text y="48" text-anchor="middle" font-size="11" fill="#334155" x="140">(Иерархический)</text>

    <!-- Plan-and-Execute Flow -->
    <rect x="95" y="65" width="90" height="32" rx="6" fill="url(#planexecGrad)" />
    <text y="85" text-anchor="middle" font-size="12" fill="#ffffff" x="140">Планировщик</text>

    <line x1="140" y1="97" x2="140" y2="112" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <!-- Executor box with internal ReAct -->
    <rect x="50" y="117" width="180" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1" />
    <text y="133" text-anchor="middle" font-size="11" font-weight="500" fill="#166534" x="140">Экзекьютор (ReAct-агент)</text>
    <rect x="65" y="143" width="50" height="22" rx="4" fill="url(#planexecGrad)" />
    <text y="158" text-anchor="middle" font-size="9" fill="#ffffff" x="90">Шаг 1</text>
    <rect x="125" y="143" width="50" height="22" rx="4" fill="url(#planexecGrad)" />
    <text y="158" text-anchor="middle" font-size="9" fill="#ffffff" x="150">Шаг 2</text>
    <text y="158" font-size="12" fill="#166534" x="195">...</text>

    <line x1="140" y1="187" x2="140" y2="202" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <rect x="95" y="207" width="90" height="32" rx="6" fill="url(#planexecGrad)" />
    <text y="227" text-anchor="middle" font-size="12" fill="#ffffff" x="140">Перепланировщик</text>

    <!-- Loop back from Replanner to Executor - fixed with proper arrow marker -->
    <path d="M185 223 Q 240 223 240 150 Q 240 117 210 117" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowheadGreen)" />

    <text y="260" text-anchor="middle" font-size="10" fill="#334155" x="140">⚡ Адаптируется на каждом шаге, планирует в целом</text>
    <text y="275" text-anchor="middle" font-size="10" fill="#334155" x="140">⚠️ Последовательный, больше состояния</text>
    <text y="290" text-anchor="middle" font-size="10" fill="#334155" x="140">Лучше всего для: сложного анализа</text>
  </g>
</svg>
