<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="planexecpattern-title planexecpattern-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="planexecpattern-title">Plan-and-Execute сохраняет общий план, а каждый шаг реагирует на факты; перепланирование происходит только при нарушении плана.</title><desc id="planexecpattern-desc">Планировщик формирует многошаговый план и сохраняет следующий ожидающий шаг. Экзекьютор выполняет один шаг как небольшой цикл ReAct, затем сохраняет результат в чекпоинте. Решение проверяет, остаётся ли план актуальным: «да» возвращает к экзекьютору для следующего шага, «нет» — к репланировщику, который изменяет оставшиеся шаги и передаёт план обратно.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="planexecpattern-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="planexecpattern-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="610" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Plan-and-Execute: декомпозиция, затем локальный ризонинг</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Спланировать задачу один раз; реагировать на факты внутри каждого шага.</text>
<path d="M42 128h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 128h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">МОДЕЛЬ · ПЛАНИРОВЩИК</text><text x="46" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 12px;">Декомпозировать задачу</text><text x="46" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="46">сформировать 4–6</tspan><tspan x="46" dy="1.2em">шагов</tspan></text><circle cx="32" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="32" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">1</text>
<path d="M230 128h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M230 128h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="234" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ХРАНИЛИЩЕ · ПЛАН</text><text x="234" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Следующий шаг</text><text x="234" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="234">стабильное</tspan><tspan x="234" dy="1.2em">направление</tspan></text><circle cx="220" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="220" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">2</text>
<path d="M418 128h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 128h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">ОБРАБОТКА · ЭКЗЕКЬЮТОР</text><text x="422" y="179" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 14.5px;">Запустить цикл ReAct</text><text x="422" y="201" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">мысль · tool ·</text><text x="422" y="221" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">наблюдение</text><circle cx="408" cy="128" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="408" y="132.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">3</text>
<path d="M204 180h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" />
<path d="M392 180h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" />
<path d="M418 256h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M418 256h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="422" y="273.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ЧЕКПОИНТ</text><text x="422" y="307" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 13.5px;">Сохранить факты шага</text><text x="422" y="329" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">продолжить после</text><text x="422" y="349" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">этой границы</text><circle cx="408" cy="256" r="13" fill="#EDF5F0" stroke="#0C1210" stroke-width="2" /><text x="408" y="260.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#0C1210" text-anchor="middle">4</text>
<path d="M494 232v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" />
<rect x="408" y="384" width="172" height="104" rx="24" fill="#141D19" stroke="#EDF5F0" stroke-width="2" /><text x="494" y="417" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" text-anchor="middle" letter-spacing="1.2">РЕШЕНИЕ</text><text x="494" y="441" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">план всё ещё</text><text x="494" y="463" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" text-anchor="middle">актуален?</text>
<path d="M494 360v24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" />
<path d="M230 384h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M230 384h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="234" y="401.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2" style="font-size: 11px;">МОДЕЛЬ · РЕПЛАНИРОВЩИК</text><text x="234" y="434" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 14px;">Изменить оставшиеся</text><text x="234" y="456" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">шаги</text><text x="234" y="478" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">нет → перепланировать</text>
<path d="M408 436h-16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" />
<path d="M306 384v-152" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" /><rect x="230" y="296" width="152" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="306" y="312.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">replan → шаг</text>
<path d="M580 436h40v-256h-40" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planexecpattern-arrow-flow)" /><rect x="589" y="296" width="130" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="654" y="312.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle" style="font-size: 12px;">да → следующий шаг</text>
<path d="M32 536h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="562" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Общий план достаточно стабилен, чтобы координировать работу, но не настолько жёсткий, чтобы</tspan><tspan x="32" dy="1.2em">игнорировать плохие факты.</tspan></text>
</svg>
