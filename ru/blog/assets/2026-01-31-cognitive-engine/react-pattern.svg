<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="react-title react-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="react-title">ReAct читает каждый результат tool call перед выбором следующего действия</title>
  <desc id="react-desc">Цикл слева направо выполняет ризонинг, действие и наблюдение. Наблюдение выделено, потому что возвращается в следующий шаг ризонинга и позволяет агенту менять направление после каждого tool call.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="960" height="360" rx="14" />
  <text class="note" x="48" y="42">Один вызов модели выбирает один шаг. Новые данные могут изменить следующий шаг.</text>
  <rect class="process" x="48" y="88" width="240" height="96" rx="10" /><text class="kind" x="68" y="122">MODEL · THOUGHT</text><text class="name" x="68" y="150">Выбрать следующий шаг</text><text class="note" x="68" y="169">исходить из текущей истории</text>
  <rect class="process" x="360" y="88" width="240" height="96" rx="10" /><text class="kind" x="380" y="122">TOOL · ACTION</text><text class="name" x="380" y="150">Выполнить один вызов</text><text class="note" x="380" y="169" style="font-size: 11px;"><tspan x="380">действовать до дальнейшего</tspan><tspan x="380" dy="1.2em">планирования</tspan></text>
  <rect class="focus" x="672" y="88" width="240" height="96" rx="10" /><text class="kind focus-kind" x="692" y="122">FOCUS · OBSERVATION</text><text class="name focus-name" x="692" y="150" style="font-size: 13.5px;">Прочитать реальный результат</text><text class="note" x="692" y="169" style="font-size: 11px;"><tspan x="692">использовать его для следующего</tspan><tspan x="692" dy="1.2em">шага ризонинга</tspan></text>
  <path class="edge" d="M288 136h64" marker-end="url(#react-arrow)" /><path class="edge" d="M600 136h64" marker-end="url(#react-arrow)" />
  <path class="edge conditional" d="M792 184v56a16 16 0 0 1-16 16H184a16 16 0 0 1-16-16v-48" marker-end="url(#react-arrow)" />
  <rect class="canvas" x="373" y="244" width="214" height="24" rx="6" /><text class="note" x="480" y="261" text-anchor="middle" style="font-size: 11px;">не завершено → повторить с учётом данных</text>
  <text class="note" x="48" y="328">Компромисс: каждый цикл повторно обрабатывает растущую историю, увеличивая латентность и расход токенов.</text>
  <defs><marker id="react-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
