<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pe-title pe-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="pe-title">Plan-and-Execute сохраняет общий план, а каждый шаг использует обратную связь</title>
  <desc id="pe-desc">Планировщик составляет многошаговый план. Экзекьютор выполняет один шаг как небольшой цикл ReAct, сохраняет результат в чекпоинте, а затем либо переходит к следующему шагу, либо перепланирует, если результат нарушает план.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; } .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; } .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; } .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .decision { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; } .conditional { stroke-dasharray: 7 6; } .signal-edge { fill: none; stroke: #F2148E; stroke-width: 1.5; }
    .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; } .signal-arrow { fill: #F2148E; }
  </style>
  <rect class="canvas" width="960" height="496" rx="14" /><text class="note" x="48" y="42">Спланировать на уровне задачи; реагировать на данные внутри каждого шага.</text>
  <rect class="process" x="48" y="72" width="208" height="96" rx="10" /><text class="kind" x="68" y="106">MODEL · ПЛАНИРОВЩИК</text><text class="name" x="68" y="134">Декомпозировать задачу</text><text class="note" x="68" y="153">записать 4–6 упорядоченных шагов</text>
  <rect class="store" x="296" y="72" width="208" height="96" rx="10" /><text class="kind" x="316" y="106">STORE · ПЛАН</text><text class="name" x="316" y="134">Следующий незавершённый шаг</text><text class="note" x="316" y="153">стабильное общее направление</text>
  <rect class="process" x="544" y="72" width="208" height="96" rx="10" /><text class="kind" x="564" y="106">PROCESS · ЭКЗЕКЬЮТОР</text><text class="name" x="564" y="134">Запустить небольшой цикл ReAct</text><text class="note" x="564" y="153">мысль · инструмент · наблюдение</text>
  <path class="edge" d="M256 120h32" marker-end="url(#pe-arrow)" /><path class="edge" d="M504 120h32" marker-end="url(#pe-arrow)" />
  <rect class="focus" x="704" y="224" width="208" height="96" rx="10" /><text class="kind focus-kind" x="724" y="258">FOCUS · ЧЕКПОИНТ</text><text class="name focus-name" x="724" y="286">Сохранить данные шага</text><text class="note" x="724" y="305">возобновить после этой границы</text>
  <path class="edge" d="M648 168v48a16 16 0 0 0 16 16h32" marker-end="url(#pe-arrow)" />
  <path class="decision" d="M480 216 584 272 480 328 376 272Z" /><text class="kind" x="480" y="263" text-anchor="middle">РЕШЕНИЕ</text><text class="name" x="480" y="287" text-anchor="middle">план всё ещё актуален?</text>
  <path class="edge conditional" d="M704 272H592" marker-end="url(#pe-arrow)" />
  <path class="edge conditional" d="M480 216v-32a16 16 0 0 1 16-16h40" marker-end="url(#pe-arrow)" /><rect class="canvas" x="489" y="181" width="106" height="24" rx="6" /><text class="note" x="542" y="198" text-anchor="middle">да → следующий шаг</text>
  <rect class="process" x="272" y="368" width="208" height="62" rx="10" /><text class="kind" x="292" y="392">MODEL · РЕПЛАНИРОВЩИК</text><text class="name" x="292" y="416">Пересмотреть оставшиеся шаги</text>
  <path class="signal-edge" d="M428 300 380 360" marker-end="url(#pe-signal-arrow)" /><rect class="canvas" x="351" y="319" width="82" height="24" rx="6" /><text class="note focus-kind" x="392" y="336" text-anchor="middle">нет → перепланировать</text>
  <path class="edge" d="M272 399H152a16 16 0 0 1-16-16V176" marker-end="url(#pe-arrow)" /><text class="note" x="48" y="470">Общий план остаётся фиксированным достаточно долго, чтобы координировать работу, но не настолько, чтобы игнорировать плохие данные.</text>
  <defs><marker id="pe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker><marker id="pe-signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="signal-arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
