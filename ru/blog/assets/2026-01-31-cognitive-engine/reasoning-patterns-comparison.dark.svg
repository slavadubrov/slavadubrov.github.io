<path d="M42 432h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 432h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="449.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · ГДЕ ДОКАЗАТЕЛЬСТВА МЕНЯЮТ ПЛАН</text><text x="46" y="483" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Различается только точка фиксации</text><text x="46" y="505" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">ReAct: после каждого результата · ReWOO: только fallback-логика,</text><text x="46" y="525" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Plan-and-Execute: на чекпоинтах шагов</text>
<path d="M32 576h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="602" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Выбирайте подход по тому, где вероятнее всего проявится ошибочное допущение, затем измеряйте</tspan><tspan x="32" dy="1.2em">стоимость и латентность на собственных задачах.</tspan></text>
</svg>
