<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 718" width="1120" height="718" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1">
  <title>Где находится каждая часть серии «AI-инжиниринг агентного стека»</title>
  <desc>Стек из четырёх слоёв. Модель предлагает действие. Цикл ризонинга из части 1 задаёт порядок и число предложений. Харнесс собирает контекст из памяти части 2, предоставляет инструменты из части 3, применяет правила разрешений из части 4 и выполняет проверки приёмки и трейсинг из части 6. Рантайм из части 5 выполняет принятые вызовы и хранит состояние сессии, сэндбокса, чекпоинта и трейса. Результаты возвращаются из рантайма в модель как контекст для следующего хода.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="1120" height="718" rx="14" fill="#f8fafc" />

  <text x="48" y="58" font-size="24" font-weight="700" fill="#0f172a">Где находится каждая часть серии</text>
  <text x="48" y="82" font-size="12" fill="#64748b">Один запуск агента, сверху вниз: что принимает решение, что авторизует и что выполняет.</text>

  <!-- Model -->
  <rect x="110" y="110" width="962" height="62" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" />
  <text x="130" y="136" font-size="14" font-weight="700" fill="#0f172a">Модель</text>
  <text x="130" y="156" font-size="11" fill="#64748b">Предлагает текст, tool call или финальный ответ. Она не решает, будет ли вызов выполнен.</text>

  <path d="M 591 172 L 591 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />

  <!-- Reasoning loop -->
  <rect x="110" y="202" width="962" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="130" y="228" font-size="14" font-weight="700" fill="#0f172a">Цикл ризонинга<tspan font-size="11" font-weight="400" fill="#1d4ed8" dx="10">Часть 1</tspan></text>
  <text x="130" y="248" font-size="11" fill="#64748b">Задаёт порядок и число предложений: ReAct, ReWOO или Plan-and-Execute.</text>

  <path d="M 591 264 L 591 292" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="283" font-size="11" fill="#64748b">предложенный вызов</text>

  <!-- Harness -->
  <rect x="110" y="294" width="962" height="218" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="130" y="322" font-size="14" font-weight="700" fill="#0f172a">Харнесс<tspan font-size="11" font-weight="400" fill="#9a3412" dx="10">Части 2, 3, 4 и 6</tspan></text>
  <text x="130" y="340" font-size="11" fill="#64748b">Управляющая программа между моделью и машиной. Части 2, 3, 4 и 6 — четыре блока ниже, выполняемые как этапы одного хода.</text>

  <rect x="130" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="376" font-size="13" font-weight="600" fill="#0f172a">Контекст</text>
  <rect x="146" y="384" width="112" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="202" y="396" font-size="10" fill="#64748b" text-anchor="middle">Часть 2 — память</text>
  <text x="146" y="418" font-size="11" fill="#64748b">Какое предыдущее состояние входит в этот промпт:</text>
  <text x="146" y="432" font-size="11" fill="#64748b">воспоминания, документы, передача.</text>

  <rect x="442" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="458" y="376" font-size="13" font-weight="600" fill="#0f172a">Контракт инструмента</text>
  <rect x="458" y="384" width="116" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="516" y="396" font-size="10" fill="#64748b" text-anchor="middle">Часть 3 — tool use</text>
  <text x="458" y="418" font-size="11" fill="#64748b">Какие действия доступны и как выглядит</text>
  <text x="458" y="432" font-size="11" fill="#64748b">проверенный результат.</text>

  <rect x="754" y="354" width="296" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="770" y="376" font-size="13" font-weight="600" fill="#0f172a">Разрешение</text>
  <rect x="770" y="384" width="118" height="17" rx="8.5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="829" y="396" font-size="10" fill="#64748b" text-anchor="middle">Часть 4 — безопасность</text>
  <text x="770" y="418" font-size="11" fill="#64748b">Разрешено ли выполнить этот конкретный вызов</text>
  <text x="770" y="432" font-size="11" fill="#64748b">сейчас и без участия человека.</text>

  <rect x="130" y="454" width="922" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="146" y="472" font-size="13" font-weight="600" fill="#0f172a">Проверки приёмки, трейсы, ретраи и передача<tspan font-size="11" font-weight="400" fill="#166534" dx="10">Часть 6</tspan></text>
  <text x="146" y="489" font-size="11" fill="#64748b">Читает свидетельства и решает, завершён ли запуск, продолжается ли он или требуется эскалация. Модель не участвует в этом решении.</text>

  <path d="M 591 512 L 591 540" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="605" y="531" font-size="11" fill="#64748b">принятый вызов</text>

  <!-- Runtime -->
  <rect x="110" y="542" width="962" height="128" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="130" y="570" font-size="14" font-weight="700" fill="#0f172a">Рантайм<tspan font-size="11" font-weight="400" fill="#334155" dx="10">Часть 5</tspan></text>
  <text x="130" y="588" font-size="11" fill="#64748b">Выполняет принятые вызовы и сохраняет состояние за пределами воркер-процесса. Эти четыре примитива хранят и изолируют, но никогда не принимают решения.</text>

  <rect x="130" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="146" y="622" font-size="13" font-weight="600" fill="#0f172a">Сессия</text>
  <text x="146" y="640" font-size="11" fill="#64748b">Лог запуска только для добавления</text>

  <rect x="364" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="380" y="622" font-size="13" font-weight="600" fill="#0f172a">Сэндбокс</text>
  <text x="380" y="640" font-size="11" fill="#64748b">Изолированное выполнение</text>

  <rect x="598" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="614" y="622" font-size="13" font-weight="600" fill="#0f172a">Чекпоинт</text>
  <text x="614" y="640" font-size="11" fill="#64748b">Точка возобновления</text>

  <rect x="832" y="600" width="220" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="848" y="622" font-size="13" font-weight="600" fill="#0f172a">Трейс</text>
  <text x="848" y="640" font-size="11" fill="#64748b">Свидетельства постфактум</text>

  <!-- Return path -->
  <path d="M 110 606 L 76 606 L 76 141 L 106 141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)" />
  <text x="62" y="374" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(-90 62 374)">результаты и трейсы становятся контекстом следующего хода</text>
</svg>
