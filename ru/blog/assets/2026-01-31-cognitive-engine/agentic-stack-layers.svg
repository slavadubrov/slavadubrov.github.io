<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 632" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="stack-title stack-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="stack-title">Где находится каждая часть серии «AI-инжиниринг агентного стека»</title>
  <desc id="stack-desc">Модель предлагает действия через цикл ризонинга из части 1. Харнесс собирает контекст, предоставляет инструменты, проверяет разрешения и оценивает свидетельства. Рантайм выполняет одобренные вызовы и сохраняет состояние. Результаты возвращаются в модель для следующего хода.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; } path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .process { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; } .store { fill: #F2F2F5; stroke: #17211B; stroke-width: 1.5; }
    .focus { fill: #FDECF5; stroke: #F2148E; stroke-width: 2.5; } .focus-kind, .focus-name { fill: #C50E72; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; } .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
    .canvas { fill: #F7F7F4; } .arrow { fill: #59645E; }
  </style>
  <rect class="canvas" width="1120" height="632" rx="14" />
  <text class="section" x="48" y="44">ОДИН ХОД — ОТ ПРЕДЛОЖЕНИЯ К СВИДЕТЕЛЬСТВАМ</text>
  <rect class="process" x="184" y="64" width="752" height="62" rx="10" /><text class="kind" x="208" y="88">МОДЕЛЬ</text><text class="name" x="208" y="111">Предложить следующее действие</text>
  <path class="edge" d="M560 126v32" marker-end="url(#stack-arrow)" />
  <rect class="focus" x="184" y="168" width="752" height="62" rx="10" /><text class="kind focus-kind" x="208" y="192">ФОКУС · ЧАСТЬ 1</text><text class="name focus-name" x="208" y="215">Цикл ризонинга задаёт порядок предложений</text>
  <path class="edge" d="M560 230v32" marker-end="url(#stack-arrow)" /><rect class="canvas" x="577" y="240" width="98" height="24" rx="6" /><text class="note" x="626" y="257" text-anchor="middle" style="font-size: 11px;">предложенный вызов</text>
  <rect class="group" x="48" y="272" width="1024" height="176" rx="12" /><text class="section" x="72" y="300">ХАРНЕСС · ЧАСТИ 2, 3, 4, 6 — АВТОРИЗОВАТЬ ОДИН ХОД</text>
  <rect class="process" x="72" y="320" width="220" height="96" rx="10" /><text class="kind" x="92" y="350">ЧАСТЬ 2 · КОНТЕКСТ</text><text class="name" x="92" y="378">Собрать память</text><text class="note" x="92" y="399" style="font-size: 11.5px;">вспомнить · документы · передача</text>
  <rect class="process" x="316" y="320" width="220" height="96" rx="10" /><text class="kind" x="336" y="350">ЧАСТЬ 3 · КОНТРАКТ</text><text class="name" x="336" y="378" style="font-size: 14px;">Предоставить инструменты</text><text class="note" x="336" y="399">действия · схемы · результаты</text>
  <rect class="process" x="560" y="320" width="220" height="96" rx="10" /><text class="kind" x="580" y="350">ЧАСТЬ 4 · ПОЛИТИКА</text><text class="name" x="580" y="378">Проверить разрешение</text><text class="note" x="580" y="399" style="font-size: 11px;"><tspan x="580">разрешено · сейчас · без</tspan><tspan x="580" dy="1.2em">присмотра</tspan></text>
  <rect class="process" x="804" y="320" width="244" height="96" rx="10" /><text class="kind" x="824" y="350">ЧАСТЬ 6 · СВИДЕТЕЛЬСТВА</text><text class="name" x="824" y="378">Оценить завершённость</text><text class="note" x="824" y="399">принять · повторить · передать</text>
  <path class="edge" d="M292 368h16" marker-end="url(#stack-arrow)" /><path class="edge" d="M536 368h16" marker-end="url(#stack-arrow)" /><path class="edge" d="M780 368h16" marker-end="url(#stack-arrow)" />
  <path class="edge" d="M560 448v32" marker-end="url(#stack-arrow)" /><rect class="canvas" x="577" y="458" width="94" height="24" rx="6" /><text class="note" x="624" y="475" text-anchor="middle" style="font-size: 11px;">одобренный вызов</text>
  <rect class="store" x="184" y="490" width="752" height="96" rx="10" /><text class="kind" x="208" y="520">ЧАСТЬ 5 · ХРАНИЛИЩЕ РАНТАЙМА</text><text class="name" x="208" y="548">Выполнить и сохранить вне воркера</text><text class="note" x="208" y="569">журнал сессии · сэндбокс · чекпоинт · трейс</text>
  <path class="edge" d="M184 538H48a24 24 0 0 1-24-24V95a24 24 0 0 1 24-24h128" marker-end="url(#stack-arrow)" /><text class="note" x="16" y="300" text-anchor="middle" transform="rotate(-90 16 300)">результаты становятся контекстом для следующего хода</text>
  <text class="note" x="48" y="614">Цикл выбирает, что предложить. Харнесс авторизует это. Рантайм выполняет это.</text>
  <defs><marker id="stack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 10 5 0 10Z" /></marker></defs>
</svg>
