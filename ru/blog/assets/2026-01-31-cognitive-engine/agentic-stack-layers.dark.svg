<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="stacklayers-title stacklayers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="stacklayers-title">Модель предлагает действие, харнесс авторизует его по четырём частям, а рантайм выполняет и сохраняет его вне воркера.</title><desc id="stacklayers-desc">Модель предлагает действие через цикл ризонинга в Part 1. Харнесс собирает контекст (Part 2), предоставляет инструменты (Part 3), проверяет разрешение (Part 4) и оценивает завершение (Part 6), прежде чем принять вызов. Рантайм (Part 5) выполняет принятый вызов и сохраняет состояние вне воркера. Результаты становятся контекстом для следующего хода.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="stacklayers-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="stacklayers-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="800" height="800" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Один ход, три слоя</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Цикл предлагает; харнесс авторизует; рантайм выполняет и сохраняет.</text>
<path d="M250 128h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M250 128h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="254" y="145.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · PART 1 · МОДЕЛЬ</text><text x="254" y="189" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Предложить следующее действие</text><text x="254" y="211" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="254">цикл ризонинга задаёт порядок</tspan><tspan x="254" dy="1.2em">предложений</tspan></text>
<path d="M400 232v52" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stacklayers-arrow-flow)" /><text x="400" y="266.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">предложенный вызов</text>
<rect x="32" y="284" width="736" height="156" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="310" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ХАРНесс · PARTS 2, 3, 4, 6 — АВТОРИЗОВАТЬ ОДИН ХОД</text>
<path d="M42 324h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 324h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PART 2 · КОНТЕКСТ</text><text x="46" y="375" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Собрать память</text><text x="46" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13.5px;">вспомнить · документы,</text><text x="46" y="417" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">передача</text>
<path d="M230 324h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M230 324h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="234" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PART 3 · КОНТРАКТ</text><text x="234" y="375" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0">Дать tools</text><text x="234" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">действия · схемы,</text><text x="234" y="417" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">результаты</text>
<path d="M418 324h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M418 324h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="422" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PART 4 · ПОЛИТИКА</text><text x="422" y="375" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 13px;">Проверить разрешение</text><text x="422" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">разрешено · сейчас,</text><text x="422" y="417" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">без присмотра</text>
<path d="M606 324h152a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-152a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M606 324h152a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-172a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="610" y="341.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">PART 6 · ФАКТЫ</text><text x="610" y="375" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#EDF5F0" style="font-size: 14.5px;">Оценить завершение</text><text x="610" y="397" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">принять · повторить,</text><text x="610" y="417" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">передать</text>
<path d="M400 440v84" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stacklayers-arrow-flow)" /><rect x="342.5" y="470" width="115" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="400" y="486.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">принятый вызов</text>
<path d="M42 524h716a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-716a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M42 524h716a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-736a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="46" y="541.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ХРАНЕНИЕ · PART 5 · РАНТАЙМ</text><text x="46" y="585" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Выполнить и сохранить вне воркера</text><text x="46" y="607" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">лог сессии · сэндбокс · чекпоинт · трейс</text>
<path d="M32 680h736" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="706" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Цикл выбирает, что предложить. Харнесс авторизует это. Рантайм выполняет это.</text>
<text x="32" y="728" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Результаты, возвращённые рантаймом, становятся контекстом для следующего хода.</text>
</svg>
