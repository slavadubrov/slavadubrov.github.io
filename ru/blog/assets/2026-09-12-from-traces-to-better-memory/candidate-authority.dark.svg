<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="candidate-authority-title candidate-authority-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="candidate-authority-title">Тестировать изменённые настройки памяти на тех же историях</title><desc id="candidate-authority-desc">Агент замечает неудачные запросы по городам и через ответ SGR предлагает фильтры по тематике и датам. Python проверяет предложение, прогоняет 20 историй и сравнивает ответы и правила работы с данными. Результат возвращается агенту; ревью перед релизом выполняется отдельно.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="candidate-authority-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="candidate-authority-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="750" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Тестировать изменение на тех же историях</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Пример: включить фильтрацию по тематике и датам.</text>
<path d="M210 112h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M210 112h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="214" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ВНЕШНИЕ</text><text x="214" y="173" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#A8B8AF">Неудачные запросы по городам</text><text x="214" y="195" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Базовый результат: пройдено 13/20</text>
<path d="M360 216v72" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#candidate-authority-arrow-flow)" />
<path d="M210 288h300a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-300a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M210 288h300a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-320a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="214" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС</text><text x="214" y="349" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Агент предлагает два фильтра</text><text x="214" y="371" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Тематика + дата действия</text>
<rect x="32" y="432" width="656" height="224" rx="12" fill="none" stroke="#2B3B33" stroke-width="1.5" stroke-dasharray="6 5" />
<text x="48" y="458" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">PYTHON ЗАПУСКАЕТ ТЕ ЖЕ ТЕСТЫ</text>
<path d="M58 480h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M58 480h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="62" y="497.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ПРОЦЕСС</text><text x="62" y="541" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 16.5px;">Проверить настройки</text><text x="62" y="563" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="62">Только разрешённые</tspan><tspan x="62" dy="1.2em">значения</tspan></text>
<path d="M274 480h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M274 480h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="278" y="497.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ПРОЦЕСС</text><text x="278" y="541" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 17px;">Прогнать 20 историй</text><text x="278" y="563" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="278">Память очищается</tspan><tspan x="278" dy="1.2em">каждый раз</tspan></text>
<path d="M490 480h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M490 480h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="494" y="497.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ПРОЦЕСС</text><text x="494" y="541" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Сравнить ответы</text><text x="494" y="563" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 11px;"><tspan x="494">Также проверить правила</tspan><tspan x="494" dy="1.2em">работы с данными</tspan></text>
<path d="M360 392v72H144v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#candidate-authority-arrow-flow)" />
<path d="M240 532h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#candidate-authority-arrow-flow)" />
<path d="M456 532h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#candidate-authority-arrow-flow)" />
<text x="48" y="636" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="48">Изоляция пользователей, удаление и ограничения на запись применяются к каждой</tspan><tspan x="48" dy="1.2em">конфигурации.</tspan></text>
<path d="M32 684h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="710" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Агент предлагает настройки; Python решает, можно ли тестировать изменение.</text>
<text x="32" y="732" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Следующий вызов модели получает результат, включая отклонения при валидации.</text>
</svg>
