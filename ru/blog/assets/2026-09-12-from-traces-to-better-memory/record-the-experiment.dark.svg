<path d="M456 204h24" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#record-experiment-arrow-flow)" />
<path d="M490 360h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M490 360h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="494" y="377.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЦЕЛЬ + ЭВАЛУАТОР</text><text x="494" y="411" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 11.5px;">Тестировать правила памяти</text><text x="494" y="433" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">20 историй один раз</text><text x="494" y="453" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">LLM не нужен</text>
<path d="M576 256v104" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#record-experiment-arrow-flow)" /><rect x="525.5" y="296" width="101" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="576" y="312.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">валидный патч</text>
<path d="M480 228H468V332H208V360" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#record-experiment-arrow-flow)" /><rect x="320.5" y="320" width="79" height="24" rx="6" fill="#0C1210" stroke="#2B3B33" stroke-width="1" /><text x="360" y="336.5" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" text-anchor="middle">отклонено</text>
<path d="M274 360h172a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-172a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M274 360h172a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-192a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="278" y="377.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ТОЛЬКО ЭКСПЕРИМЕНТ</text><text x="278" y="411" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0" style="font-size: 16.5px;">Сравнить результаты</text><text x="278" y="433" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 13px;">Оценка + проверки данных</text><text x="278" y="453" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Выбрать родителя</text>
