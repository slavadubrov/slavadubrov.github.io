<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="zsf-title zsf-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="zsf-title">Порядок обработки startup-файлов Zsh</title>
  <desc id="zsf-desc">Нумерованная последовательность показывает: zshenv — при каждом запуске Zsh, zprofile — для login-shell, zshrc — для интерактивных shell, zlogin — для login-shell после zshrc, а zlogout — позднее, при штатном завершении login-shell. Файлы, условия которых не выполняются, пропускаются.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="472" rx="14" fill="#0c1210" />
  <text class="section" x="48" y="44" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">ПОРЯДОК ЗАПУСКА — У КАЖДОГО ФАЙЛА СВОЁ УСЛОВИЕ</text>

  <circle cx="94" cy="76" r="14" fill="#edf5f0" /><text class="marker-num" x="94" y="81" text-anchor="middle" fill="#0c1210" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">1</text>
  <circle cx="374" cy="76" r="14" fill="#edf5f0" /><text class="marker-num" x="374" y="81" text-anchor="middle" fill="#0c1210" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">2</text>
  <circle cx="654" cy="76" r="14" fill="#edf5f0" /><text class="marker-num" x="654" y="81" text-anchor="middle" fill="#0c1210" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">3</text>

  <rect class="store" x="80" y="96" width="240" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="100" y="126" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">КАЖДЫЙ ZSH</text>
  <text class="name" x="100" y="153" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zshenv</text>
  <text class="note" x="100" y="176" fill="#a8b8af" font-size="13" style="font-size: 11.5px;">Читается первым; не выводите ничего</text>

  <rect class="store" x="360" y="96" width="240" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="380" y="126" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ТОЛЬКО LOGIN</text>
  <text class="name" x="380" y="153" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zprofile</text>
  <text class="note" x="380" y="176" fill="#a8b8af" font-size="13" style="font-size: 11px;">До настройки интерактивного режима</text>

  <rect x="640" y="96" width="240" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind" x="660" y="126" fill="#ff6fb6" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ФОКУС · ИНТЕРАКТИВНЫЙ РЕЖИМ</text>
  <text class="name" x="660" y="153" fill="#ff6fb6" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zshrc</text>
  <text class="note" x="660" y="176" fill="#ff6fb6" font-size="13">Промпт, автодополнение, хуки</text>

  <path class="edge" d="M320 144h32" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#zsf-arrow)" />
  <path class="edge" d="M600 144h32" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#zsf-arrow)" />
  <path class="edge" d="M760 192v72" fill="none" stroke="#a8b8af" stroke-width="1.5" marker-end="url(#zsf-arrow)" />

  <circle cx="654" cy="252" r="14" fill="#edf5f0" /><text class="marker-num" x="654" y="257" text-anchor="middle" fill="#0c1210" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">4</text>
  <circle cx="374" cy="252" r="14" fill="#edf5f0" /><text class="marker-num" x="374" y="257" text-anchor="middle" fill="#0c1210" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600">5</text>

  <rect class="store" x="640" y="272" width="240" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="660" y="302" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ТОЛЬКО LOGIN</text>
  <text class="name" x="660" y="329" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zlogin</text>
  <text class="note" x="660" y="352" fill="#a8b8af" font-size="13" style="font-size: 11px;"><tspan x="660">После .zshrc, если применимы оба</tspan><tspan x="660" dy="1.2em">условия</tspan></text>

  <rect class="store" x="360" y="272" width="240" height="96" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="380" y="302" fill="#a8b8af" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ЗАВЕРШЕНИЕ LOGIN</text>
  <text class="name" x="380" y="329" fill="#edf5f0" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">.zlogout</text>
  <text class="note" x="380" y="352" fill="#a8b8af" font-size="13">Только штатное завершение</text>

  <path d="M640 320h-32" fill="none" stroke="#a8b8af" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#zsf-arrow)" />

  <path d="M48 408h864" stroke="#2b3b33" stroke-width="1" />
  <text class="note" x="48" y="436" fill="#a8b8af" font-size="13">Zsh сохраняет этот порядок, но пропускает файлы, если их условия для login или интерактивного режима не выполняются.</text>

  <defs>
    <marker id="zsf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
