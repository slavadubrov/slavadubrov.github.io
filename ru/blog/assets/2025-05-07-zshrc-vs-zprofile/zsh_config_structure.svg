<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="zcs-title zcs-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="zcs-title">Файлы запуска Zsh в зависимости от режимов login и interactive</title>
  <desc id="zcs-desc">Матрица 2×2 сопоставляет независимые флаги login и interactive с файлами запуска, которые читает Zsh. Login-интерактивные оболочки читают zshenv, zprofile, zshrc и zlogin; login-неинтерактивные не читают zshrc; не-login-интерактивные читают zshenv и zshrc; оболочки без обоих флагов читают только zshenv.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="960" height="440" rx="14" fill="#f7f7f4" />

  <text class="section" x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">ДВА ФЛАГА — ЧЕТЫРЕ НАБОРА ЗАПУСКА</text>
  <text class="axis" x="168" y="84" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ИНТЕРАКТИВНАЯ</text>
  <text class="axis" x="560" y="84" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">НЕИНТЕРАКТИВНАЯ</text>

  <text class="axis" x="48" y="142" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">LOGIN</text>
  <text class="note" x="48" y="166" fill="#59645e" font-size="13">флаг включён</text>
  <text class="axis" x="48" y="278" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">НЕ-LOGIN</text>
  <text class="note" x="48" y="302" fill="#59645e" font-size="13">флаг выключен</text>

  <rect class="mode" x="168" y="104" width="352" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="188" y="134" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">РЕЖИМ</text>
  <text class="name" x="188" y="161" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Login + интерактивный</text>
  <text class="note" x="188" y="184" fill="#59645e" font-size="13">.zshenv → .zprofile → .zshrc → .zlogin</text>

  <rect class="mode" x="560" y="104" width="352" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="580" y="134" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">РЕЖИМ</text>
  <text class="name" x="580" y="161" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Login + неинтерактивный</text>
  <text class="note" x="580" y="184" fill="#59645e" font-size="13">.zshenv → .zprofile → .zlogin</text>

  <rect x="168" y="240" width="352" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind" x="188" y="270" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ФОКУС-РЕЖИМ</text>
  <text class="name" x="188" y="297" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Не-login + интерактивный</text>
  <text class="note" x="188" y="320" fill="#c50e72" font-size="13">.zshenv → .zshrc</text>

  <rect class="mode" x="560" y="240" width="352" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text class="kind" x="580" y="270" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">РЕЖИМ</text>
  <text class="name" x="580" y="297" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600">Не-login + неинтерактивный</text>
  <text class="note" x="580" y="320" fill="#59645e" font-size="13">Только .zshenv</text>

  <path d="M48 376h864" stroke="#d8ddd9" stroke-width="1" />
  <text class="note" x="48" y="404" fill="#59645e" font-size="13">Вложенная интерактивная Zsh также читает .zshrc; ей не обязательно быть login-оболочкой.</text>
</svg>
