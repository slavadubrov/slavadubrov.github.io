<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 664" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="sgam-title sgam-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="sgam-title">Пути записи и чтения вокруг одного хранилища памяти Schema-Guided Agent</title>
  <desc id="sgam-desc">Два потока слева направо используют общее хранилище памяти в рамках tenant. Путь записи превращает сырой эпизод в проверенный memory delta и изменяет хранилище. Путь чтения задаёт область действия пользовательского вопроса, запрашивает то же хранилище и собирает цитируемый текущий или исторический контекст.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.6px; fill: #a8b8af; }
    .kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #edf5f0; }
    .note { font-style: normal; font-weight: 400; font-size: 13px; font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; fill: #a8b8af; }
    .focus-kind { font-style: normal; font-weight: 600; font-size: 11px; font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.3px; fill: #ff6fb6; }
    .focus-name { font-style: normal; font-weight: 600; font-size: 16px; font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; fill: #ff6fb6; }
    .process { fill: #141d19; stroke: #edf5f0; stroke-width: 1.5; }
    .external { fill: #141d19; stroke: #a8b8af; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { fill: none; stroke: #a8b8af; stroke-width: 1.5; }
  </style>

  <rect width="1120" height="664" rx="14" fill="#0c1210" />

  <rect x="48" y="48" width="1024" height="208" rx="12" fill="none" stroke="#2b3b33" />
  <text class="section" x="72" y="82">ПУТЬ ЗАПИСИ — ИЗМЕНЯЕТ СОСТОЯНИЕ</text>
  <line x1="72" y1="96" x2="1048" y2="96" stroke="#2b3b33" />

  <rect class="external" x="72" y="120" width="176" height="96" rx="10" />
  <text class="kind" x="92" y="154">ВНЕШНИЙ КОНТУР</text>
  <text class="name" x="92" y="182">Сырой эпизод</text>

  <rect class="process" x="288" y="120" width="176" height="96" rx="10" />
  <text class="kind" x="308" y="154">ПРОЦЕСС</text>
  <text class="name" x="308" y="182"><tspan x="308">Типизированное</tspan><tspan x="308" dy="1.2em">извлечение</tspan></text>

  <rect class="process" x="504" y="120" width="176" height="96" rx="10" />
  <text class="kind" x="524" y="154">ПРОЦЕСС</text>
  <text class="name" x="524" y="182"><tspan x="524">Проверка и</tspan><tspan x="524" dy="1.2em">согласование</tspan></text>

  <path class="edge" d="M248 168h32" marker-end="url(#sgam-arrow)" />
  <path class="edge" d="M464 168h32" marker-end="url(#sgam-arrow)" />
  <path class="edge" d="M680 168h112v112" marker-end="url(#sgam-arrow)" />
  <text class="note" x="808" y="250">проверенная запись</text>
  <text class="note" x="72" y="242">Только этот поток может создавать, замещать или закрывать запись.</text>

  <rect x="704" y="288" width="176" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="focus-kind" x="724" y="322">ФОКУС · ХРАНИЛИЩЕ</text>
  <text class="focus-name" x="724" y="350">Записи SGAM</text>

  <rect x="48" y="400" width="1024" height="216" rx="12" fill="none" stroke="#2b3b33" />
  <text class="section" x="72" y="434">ПУТЬ ЧТЕНИЯ — ВЫБИРАЕТ СОСТОЯНИЕ</text>
  <line x1="72" y1="448" x2="1048" y2="448" stroke="#2b3b33" />

  <rect class="external" x="72" y="472" width="176" height="96" rx="10" />
  <text class="kind" x="92" y="506">ВНЕШНИЙ КОНТУР</text>
  <text class="name" x="92" y="534" style="font-size: 11.5px;">Пользовательский вопрос</text>

  <rect class="process" x="288" y="472" width="176" height="96" rx="10" />
  <text class="kind" x="308" y="506">ПРОЦЕСС</text>
  <text class="name" x="308" y="534"><tspan x="308">Поиск состояния в</tspan><tspan x="308" dy="1.2em">заданной области</tspan></text>

  <rect class="process" x="920" y="472" width="152" height="96" rx="10" />
  <text class="kind" x="940" y="506">ПРОЦЕСС</text>
  <text class="name" x="940" y="534"><tspan x="940">Контекст с</tspan><tspan x="940" dy="1.2em">цитатами</tspan></text>

  <path class="edge" d="M248 520h32" marker-end="url(#sgam-arrow)" />
  <path class="edge" d="M464 520h328V392" marker-end="url(#sgam-arrow)" />
  <rect x="552" y="508" width="104" height="24" rx="6" fill="#0c1210" />
  <text class="note" x="604" y="525" text-anchor="middle" style="font-size: 11px;">запрос с заданной областью</text>

  <path class="edge" d="M880 336h116v128" marker-end="url(#sgam-arrow)" />
  <rect x="884" y="390" width="112" height="40" rx="6" fill="#0c1210" />
  <text class="note" x="892" y="406" style="font-size: 11px;">текущие или исторические</text>
  <text class="note" x="892" y="423" style="font-size: 11px;">записи + provenance</text>
  <text class="note" x="72" y="596">Tenant, тип, субъект, атрибут и окно валидности применяются до нечеткого расширения.</text>

  <defs>
    <marker id="sgam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
