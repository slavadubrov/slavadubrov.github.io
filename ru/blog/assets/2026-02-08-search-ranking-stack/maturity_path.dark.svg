<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Последовательность экспериментов для ранжирования поиска</title>
  <desc id="desc">Последовательность от измеренного бейзлайна к проверке recall кандидатов, точности ранжирования, адаптации к домену и опционального дорогого слоя.</desc>
  <defs>
    <marker id="arrowM" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#141D19" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="260" fill="#0C1210" />

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#EDF5F0">Последовательность экспериментов для ранжирования поиска</text>

  <!-- Connecting arrow line -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#A8B8AF" stroke-width="3" />

  <!-- Level 1 -->
  <rect x="30" y="60" width="160" height="120" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <circle cx="110" cy="60" r="14" fill="#1B2621" />
  <text x="110" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">1</text>
  <text x="110" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Бейзлайн</text>
  <text x="110" y="108" text-anchor="middle" font-size="12" fill="#EDF5F0">Лексическая система</text>
  <text x="110" y="122" text-anchor="middle" font-size="12" fill="#EDF5F0" style="font-size: 11px;">Размеченный набор запросов</text>
  <text x="110" y="136" text-anchor="middle" font-size="12" fill="#EDF5F0">Срезы ошибок</text>
  <text x="110" y="168" text-anchor="middle" font-size="11" fill="#EDF5F0">Затраты: низкие</text>

  <!-- Arrow -->
  <line x1="195" y1="120" x2="225" y2="120" stroke="#A8B8AF" stroke-width="2" marker-end="url(#arrowM)" />

  <!-- Level 2 (highlighted - biggest ROI) -->
  <rect x="220" y="55" width="160" height="130" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="2.5" class="visual-focus" />
  <circle cx="300" cy="55" r="14" fill="#1B2621" />
  <text x="300" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">2</text>
  <text x="300" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Recall кандидатов</text>
  <text x="300" y="103" text-anchor="middle" font-size="12" fill="#EDF5F0">Проверить dense retrieval</text>
  <text x="300" y="117" text-anchor="middle" font-size="12" fill="#EDF5F0">Проверить fusion</text>
  <text x="300" y="131" text-anchor="middle" font-size="12" fill="#EDF5F0">Настроить cutoff</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#EDF5F0">ТОЛЬКО ЕСЛИ НЕ УДАЁТСЯ ДОСТИЧЬ НУЖНОГО RECALL</text>
  <text x="300" y="173" text-anchor="middle" font-size="11" fill="#EDF5F0">Затраты: низкие—средние</text>

  <!-- Arrow -->
  <line x1="385" y1="120" x2="415" y2="120" stroke="#A8B8AF" stroke-width="2" marker-end="url(#arrowM)" />

  <!-- Level 3 -->
  <rect x="410" y="60" width="160" height="120" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <circle cx="490" cy="60" r="14" fill="#1B2621" />
  <text x="490" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">3</text>
  <text x="490" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Точность ранжирования</text>
  <text x="490" y="108" text-anchor="middle" font-size="12" fill="#EDF5F0">Проверить cross-encoder</text>
  <text x="490" y="122" text-anchor="middle" font-size="12" fill="#EDF5F0">Настроить размер shortlist</text>
  <text x="490" y="136" text-anchor="middle" font-size="12" fill="#EDF5F0">Измерить латентность</text>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="#EDF5F0">Затраты: средние—высокие</text>

  <!-- Arrow -->
  <line x1="575" y1="120" x2="605" y2="120" stroke="#A8B8AF" stroke-width="2" marker-end="url(#arrowM)" />

  <!-- Level 4 -->
  <rect x="600" y="60" width="170" height="120" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <circle cx="685" cy="60" r="14" fill="#141D19" />
  <text x="685" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#141D19">4</text>
  <text x="685" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#EDF5F0">Опциональные слои</text>
  <text x="685" y="108" text-anchor="middle" font-size="12" fill="#EDF5F0">Адаптация к домену</text>
  <text x="685" y="122" text-anchor="middle" font-size="12" fill="#EDF5F0">Реранкинг с помощью LLM</text>
  <text x="685" y="136" text-anchor="middle" font-size="12" fill="#EDF5F0">Персонализация</text>
  <text x="685" y="168" text-anchor="middle" font-size="11" fill="#EDF5F0">Затраты: высокие</text>

  <!-- Bottom label -->
  <text x="400" y="245" text-anchor="middle" font-size="11" fill="#EDF5F0">Переходите дальше только если предыдущие измерения выявили стабильную ошибку.</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
