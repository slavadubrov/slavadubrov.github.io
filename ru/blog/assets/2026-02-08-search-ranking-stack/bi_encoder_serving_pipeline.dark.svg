<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="biserve-title biserve-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="biserve-title">Офлайн-индексация bi-encoder против онлайн-сервинга запросов</title><desc id="biserve-desc">Офлайн документы один раз кодируются пакетно и сохраняются в vector index. Онлайн один запрос кодируется и ищется в этом индексе. Латентность зависит от энкодера, железа, индекса, фильтров и целевого recall, поэтому профилируйте шаги encode и search отдельно.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="biserve-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="biserve-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="590" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Офлайн-индексация, онлайн-запрос</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Эмбеддинги документов вычисляются один раз и сохраняются; кодирование запроса и поиск</tspan><tspan x="32" dy="1.2em">выполняются при каждом запросе.</tspan></text>
<rect x="32" y="96" width="656" height="180" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="124" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ОФЛАЙН · ВРЕМЯ ИНДЕКСАЦИИ</text>
<path d="M58 144h120a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-120a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M58 144h120a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-140a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="62" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">КОРПУС</text><text x="62" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">N документов</text>
<path d="M214 144h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M214 144h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="218" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ENCODE</text><text x="218" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#EDF5F0">Батч-энкодинг</text>
<path d="M340 144h150a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-150a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M340 144h150a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-170a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="344" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ЭМБЕДДИНГИ</text><text x="344" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">Матрица N × D</text>
<path d="M526 144h130a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#71D6A8" stroke-width="1.5" /><path d="M526 144h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#71D6A8" /><text x="530" y="161.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ИНДЕКС</text><text x="530" y="191" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">HNSW / IVF</text>
<path d="M188 172h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M314 172h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M500 172h16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="48" y="236" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="48">Выполняется один раз, хранится на диске. 8 500 × 384 ≈ 13 MB в демо; 1B × 768 ≈ 3 TiB в</tspan><tspan x="48" dy="1.2em">масштабе.</tspan></text>
<rect x="32" y="300" width="656" height="180" rx="12" fill="#141D19" stroke="#2B3B33" stroke-width="1" />
<text x="48" y="328" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.6">ОНЛАЙН · ВРЕМЯ ЗАПРОСА</text>
<path d="M58 348h120a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-120a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#0C1210" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 348h120a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-140a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#2B3B33" /><text x="62" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">ЗАПРОС</text><text x="62" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#A8B8AF" style="font-size: 11px;">Запрос пользователя</text>
<path d="M214 348h150a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-150a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M214 348h150a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-170a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="218" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ENCODE</text><text x="218" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0" style="font-size: 11px;">Однократное кодирование</text>
<path d="M400 348h130a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-130a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M400 348h130a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-150a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="404" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ПОИСК</text><text x="404" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#EDF5F0">ANN-поиск</text>
<path d="M566 348h90a10 10 0 0 1 10 10v36a10 10 0 0 1 -10 10h-90a10 10 0 0 1 -10 -10v-36a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M566 348h90a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-110a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#1B2621" /><text x="570" y="365.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#A8B8AF" letter-spacing="1.2">РЕЗУЛЬТАТ</text><text x="570" y="395" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#EDF5F0">Top-K</text>
