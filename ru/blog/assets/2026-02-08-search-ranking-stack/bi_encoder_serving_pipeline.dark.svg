<text x="48" y="440" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="48">Профилируйте шаги encode и search отдельно; оба добавляют задержку запроса от начала</tspan><tspan x="48" dy="1.2em">до конца.</tspan></text>
<path d="M32 508h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="534" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Разделение на офлайн и онлайн — архитектурное преимущество: эмбеддинги документов не нужно</text>
<text x="32" y="556" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">пересчитывать во время запроса.</text>
