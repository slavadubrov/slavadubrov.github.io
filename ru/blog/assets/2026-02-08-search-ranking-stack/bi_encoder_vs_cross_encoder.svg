<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'IBM Plex Sans', system-ui, -apple-system, sans-serif" role="img" aria-labelledby="title desc" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Сравнение bi-encoder и cross-encoder</title>
  <desc id="desc">Bi-encoder выполняет retrieval с независимыми векторами; cross-encoder совместно оценивает каждую пару «запрос—документ» в шорт-листе.</desc>
  <defs>
    <marker id="arrowBvC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FFFFFF" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="380" fill="#F7F7F4" />

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#17211B">Bi-Encoder vs. Cross-Encoder</text>

  <!-- Left: Bi-Encoder -->
  <rect x="30" y="50" width="350" height="310" rx="10" fill="#ffffff" stroke="#59645E" stroke-width="1.5" class="visual-focus" />
  <text x="205" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#17211B">Bi-Encoder (Retrieval)</text>
  <text x="205" y="93" text-anchor="middle" font-size="11" fill="#17211B">Независимое кодирование для retrieval</text>

  <!-- Query path -->
  <rect x="60" y="115" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="120" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Запрос</text>
  <line x1="120" y1="149" x2="120" y2="172" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="60" y="175" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="120" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">Энкодер</text>
  <line x1="120" y1="209" x2="120" y2="232" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="55" y="235" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#17211B">Эмбеддинг запроса</text>

  <!-- Doc path -->
  <rect x="230" y="115" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="290" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">Документ</text>
  <line x1="290" y1="149" x2="290" y2="172" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="230" y="175" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="290" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">Энкодер</text>
  <line x1="290" y1="209" x2="290" y2="232" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="225" y="235" width="130" height="28" rx="6" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" />
  <text x="290" y="254" text-anchor="middle" font-size="11" fill="#17211B">Эмбеддинг документа</text>

  <!-- Dot product -->
  <line x1="120" y1="263" x2="180" y2="293" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <line x1="290" y1="263" x2="230" y2="293" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />
  <rect x="160" y="290" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="205" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#17211B">Скалярное произведение</text>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#17211B">Одно кодирование запроса и vector search</text>

  <!-- No cross-attention label -->
  <line x1="180" y1="190" x2="230" y2="190" stroke="#17211B" stroke-width="1.5" stroke-dasharray="4" />
  <text x="205" y="168" text-anchor="middle" font-size="11" fill="#17211B">Без взаимодействия</text>

  <!-- Right: Cross-Encoder -->
  <rect x="420" y="50" width="350" height="310" rx="10" fill="#ffffff" stroke="#59645E" stroke-width="1.5" />
  <text x="595" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#17211B">Cross-Encoder (Реранкинг)</text>
  <text x="595" y="93" text-anchor="middle" font-size="11" fill="#17211B">Совместное кодирование для реранкинга</text>

  <!-- Concatenated input -->
  <rect x="455" y="115" width="280" height="34" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="595" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B">[CLS] Запрос [SEP] Документ [SEP]</text>

  <line x1="595" y1="149" x2="595" y2="172" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />

  <!-- Transformer block -->
  <rect x="475" y="175" width="240" height="75" rx="8" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="595" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#17211B">Трансформер</text>
  <text x="595" y="218" text-anchor="middle" font-size="11" fill="#17211B">Полный cross-attention</text>
  <text x="595" y="236" text-anchor="middle" font-size="11" fill="#17211B">Каждый токен запроса взаимодействует с каждым токеном документа</text>

  <line x1="595" y1="250" x2="595" y2="283" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrowBvC)" />

  <!-- Score output -->
  <rect x="530" y="286" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="595" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#17211B" style="font-size: 11px;">Оценка релевантности</text>
  <text x="595" y="340" text-anchor="middle" font-size="11" fill="#17211B">Одна оценка модели для каждой пары кандидатов</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
