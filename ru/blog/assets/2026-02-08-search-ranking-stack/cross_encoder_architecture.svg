<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="attnmatrix-title attnmatrix-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="attnmatrix-title">Матрица аттеншна: bi-encoder и cross-encoder</title><desc id="attnmatrix-desc">Аттеншн bi-encoder имеет блочно-диагональную структуру: токены запроса взаимодействуют только с токенами запроса, а токены документа — только с токенами документа. cross-encoder вычисляет полную матрицу аттеншна, поэтому токены запроса также взаимодействуют с токенами документа, и наоборот.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="attnmatrix-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="attnmatrix-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="540" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Блочно-диагональный и полный аттеншн</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Блоки Q·D и D·Q в cross-encoder — это те блоки, которые bi-encoder никогда не вычисляет.</text>
<rect x="32" y="128" width="304" height="300" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="48" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">BI-ENCODER</text>
<rect x="384" y="128" width="304" height="300" rx="12" fill="#FFFFFF" stroke="#D8DDD9" stroke-width="1" />
<text x="400" y="156" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.6">CROSS-ENCODER</text>
<path d="M58 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M58 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="62" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">Q · Q</text><text x="62" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">активен</text><text x="62" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">self-attention</text>
<path d="M200 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M200 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="204" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">Q · D</text><text x="204" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">заблокирован</text><text x="204" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">нет пересечения</text>
<path d="M58 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#F7F7F4" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" /><path d="M58 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#D8DDD9" /><text x="62" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#59645E" letter-spacing="1.2">D · Q</text><text x="62" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#59645E">заблокирован</text><text x="62" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">нет пересечения</text>
<path d="M200 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M200 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="204" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">D · D</text><text x="204" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">активен</text><text x="204" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">self-attention</text>
<path d="M410 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M410 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="414" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">Q · Q</text><text x="414" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">активен</text><text x="414" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">self-attention</text>
<path d="M552 172h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><path d="M552 172h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#F2148E" /><text x="556" y="189.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#FFFFFF" letter-spacing="1.2">Q · D</text><text x="556" y="229" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B" style="font-size: 13.5px;">взаимодействие</text><text x="556" y="251" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">в обе стороны</text>
<path d="M410 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M410 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="414" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">D · Q</text><text x="414" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B" style="font-size: 13.5px;">взаимодействие</text><text x="414" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">в обе стороны</text>
<path d="M552 280h110a10 10 0 0 1 10 10v76a10 10 0 0 1 -10 10h-110a10 10 0 0 1 -10 -10v-76a10 10 0 0 1 10 -10Z" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" /><path d="M552 280h110a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-130a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#17211B" /><text x="556" y="297.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#F7F7F4" letter-spacing="1.2">D · D</text><text x="556" y="337" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#17211B">активен</text><text x="556" y="359" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">self-attention</text>
<path d="M32 456h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="482" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">В bi-encoder ни один токен запроса не взаимодействует с токеном документа; два вектора встречаются только</text>
<text x="32" y="504" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">позже — при вычислении скалярного произведения.</text>
</svg>
