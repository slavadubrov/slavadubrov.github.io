<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uvi-title uvi-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvi-title">Анатомия скрипта PEP 723</title>
  <desc id="uvi-desc">Файл fetch.py содержит встроенный Python-код и метаданные зависимостей рядом с обычным кодом. uv run читает метаданные и создаёт изолированное окружение в кэше. Необязательный соседний fetch.py.lock может задавать точное разрешение зависимостей. Обычный Python игнорирует метаданные.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />

  <rect x="48" y="48" width="400" height="368" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="72" y="76">ФАЙЛ · FETCH.PY</text>

  <rect x="72" y="96" width="352" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="92" y="130" fill="#FF6FB6">ФОКУС · МЕТАДАННЫЕ PEP 723</text>
  <text class="name" x="92" y="158" fill="#FF6FB6">Python + зависимости</text>
  <text class="note" x="92" y="178" fill="#FF6FB6">requires-python ≥3.12 · httpx ≥0.27,&lt;1</text>

  <rect class="process" x="72" y="232" width="352" height="96" rx="10" />
  <text class="kind" x="92" y="266">КОД · ПРОЦЕСС</text>
  <text class="name" x="92" y="294">Импорт + HTTP-запрос</text>
  <text class="note" x="92" y="314">обычный корректный синтаксис Python</text>

  <path d="M72 368h24" stroke="#2B3B33" />
  <text class="note" x="108" y="373">Блок комментариев и код поставляются вместе.</text>

  <rect class="process" x="560" y="96" width="352" height="96" rx="10" />
  <text class="kind" x="580" y="130">РАННЕР · ПРОЦЕСС</text>
  <text class="name" x="580" y="158">uv run fetch.py</text>
  <text class="note" x="580" y="178">читает метаданные перед выполнением</text>

  <rect class="store" x="560" y="232" width="352" height="96" rx="10" />
  <text class="kind" x="580" y="266">ОКРУЖЕНИЕ · ХРАНИЛИЩЕ</text>
  <text class="name" x="580" y="294">Изолированный кэш</text>
  <text class="note" x="580" y="314">разрешённый интерпретатор + пакеты</text>

  <rect class="store" x="560" y="368" width="352" height="62" rx="10" />
  <text class="kind" x="580" y="392">НЕОБЯЗАТЕЛЬНЫЙ LOCK · ХРАНИЛИЩЕ</text>
  <text class="name" x="580" y="415">fetch.py.lock</text>

  <path class="edge" d="M424 144h128" marker-end="url(#uvi-arrow)" />
  <path class="edge" d="M736 192v32" marker-end="url(#uvi-arrow)" />
  <path class="edge" d="M912 399h16V144h-12" stroke-dasharray="7 6" marker-end="url(#uvi-arrow)" />
  <rect x="840" y="204" width="88" height="24" rx="6" fill="#0C1210" />
  <text class="note" x="884" y="221" text-anchor="middle" style="font-size: 11px;">при наличии lock-файла</text>

  <path d="M48 462h24" stroke="#2B3B33" />
  <text class="note" x="84" y="467">Обычный python fetch.py игнорирует метаданные; эту границу контролирует совместимый раннер.</text>

  <defs>
    <marker id="uvi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
