<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Выбор между uv run, uvx и uv tool install</title><desc id="desc">Три колонки направляют инструменты, связанные с проектом, в uv run; разовые изолированные инструменты — в uvx; исполняемые файлы, которые должны постоянно быть в PATH, — в uv tool install.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="590" rx="28" fill="#0f172a" />
  <text x="600" y="62" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Выбирайте окружение инструмента по тому, что он должен видеть</text>
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(55 135)"><rect width="340" height="340" rx="22" fill="#1d4ed8" stroke="#2563eb" stroke-width="2" /><text x="170" y="52" fill="#93c5fd" font-size="23" font-weight="700">uv run</text><text x="170" y="92" fill="#93c5fd" font-size="17">связан с проектом</text><text x="170" y="145" fill="#e2e8f0" font-size="15">импортирует код проекта</text><text x="170" y="178" fill="#e2e8f0" font-size="15">использует зафиксированные группы и плагины</text><text x="170" y="211" fill="#e2e8f0" font-size="15">жизненный цикл следует за репозиторием</text><rect x="35" y="260" width="270" height="50" rx="12" fill="#1d4ed8" /><text x="170" y="291" fill="#93c5fd" font-size="15">uv run --group test pytest</text></g>
    <g transform="translate(430 135)"><rect width="340" height="340" rx="22" fill="#5b21b6" /><text x="170" y="52" fill="#93c5fd" font-size="23" font-weight="700">uvx</text><text x="170" y="92" fill="#c4b5fd" font-size="17">разовый + изолированный</text><text x="170" y="145" fill="#e2e8f0" font-size="15">не видит импорты проекта</text><text x="170" y="178" fill="#e2e8f0" font-size="15">окружение хранится в кэше</text><text x="170" y="211" fill="#e2e8f0" font-size="15">зафиксируйте версию для воспроизводимости</text><rect x="35" y="260" width="270" height="50" rx="12" fill="#5b21b6" /><text x="170" y="291" fill="#93c5fd" font-size="15">uvx ruff@0.12.0 check .</text></g>
    <g transform="translate(805 135)"><rect width="340" height="340" rx="22" fill="#166534" /><text x="170" y="52" fill="#93c5fd" font-size="23" font-weight="700">uv tool install</text><text x="170" y="92" fill="#93c5fd" font-size="17">постоянный + доступен в PATH</text><text x="170" y="145" fill="#e2e8f0" font-size="15">выделенное окружение инструмента</text><text x="170" y="178" fill="#e2e8f0" font-size="15">доступен другим программам</text><text x="170" y="211" fill="#e2e8f0" font-size="15">явный жизненный цикл обновлений</text><rect x="35" y="260" width="270" height="50" rx="12" fill="#166534" /><text x="170" y="291" fill="#86efac" font-size="15">uv tool install 'ruff==0.12.0'</text></g>
    <rect x="245" y="515" width="710" height="42" rx="14" fill="#1e293b" /><text x="600" y="542" fill="#cbd5e1" font-size="16">Изоляция — это преимущество; намеренно выбирайте видимость проекта.</text>
  </g>
</svg>
