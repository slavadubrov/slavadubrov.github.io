<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="title">Четыре границы workflow в uv</title><desc id="desc">Управляемые Python, проекты, скрипты и CLI-инструменты — четыре отдельных жизненных цикла под управлением uv. Системные библиотеки и приложения остаются вне uv и управляются системным пакетным менеджером.</desc>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="650" rx="28" fill="#0f172a" />
  <text x="600" y="64" text-anchor="middle" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Один исполняемый файл, отдельные жизненные циклы</text>
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(70 140)"><rect width="500" height="180" rx="20" fill="#1d4ed8" /><text x="30" y="47" fill="#93c5fd" font-size="23" font-weight="700">Управляемый Python</text><text x="30" y="86" fill="#93c5fd" font-size="17">uv python install / pin / list</text><text x="30" y="123" fill="#93c5fd" font-size="15">дистрибутивы интерпретатора в каталоге данных uv</text><text x="30" y="151" fill="#93c5fd" font-size="15">доступны для обнаружения наряду с внешними интерпретаторами</text></g>
    <g transform="translate(630 140)"><rect width="500" height="180" rx="20" fill="#5b21b6" /><text x="30" y="47" fill="#93c5fd" font-size="23" font-weight="700">Проект</text><text x="30" y="86" fill="#93c5fd" font-size="17">pyproject.toml + uv.lock → .venv</text><text x="30" y="123" fill="#c4b5fd" font-size="15">общие декларации и разрешение зависимостей</text><text x="30" y="151" fill="#c4b5fd" font-size="15">одноразовое установленное окружение</text></g>
    <g transform="translate(70 365)"><rect width="500" height="180" rx="20" fill="#9a3412" /><text x="30" y="47" fill="#fdba74" font-size="23" font-weight="700">Скрипт PEP 723</text><text x="30" y="86" fill="#fdba74" font-size="17">встроенные метаданные + опциональный соседний lock-файл</text><text x="30" y="123" fill="#fdba74" font-size="15">единица релиза в одном файле</text><text x="30" y="151" fill="#fdba74" font-size="15">изолированное кэшированное окружение выполнения</text></g>
    <g transform="translate(630 365)"><rect width="500" height="180" rx="20" fill="#166534" /><text x="30" y="47" fill="#93c5fd" font-size="23" font-weight="700">CLI-инструмент</text><text x="30" y="86" fill="#93c5fd" font-size="17">кэш uvx или постоянное окружение инструмента</text><text x="30" y="123" fill="#93c5fd" font-size="15">изолирован от импортов проекта</text><text x="30" y="151" fill="#93c5fd" font-size="15">добавляется в PATH только при явной установке</text></g>
    <rect x="250" y="585" width="700" height="42" rx="14" fill="#1e293b" /><text x="600" y="612" text-anchor="middle" fill="#cbd5e1" font-size="16">Homebrew или macOS по-прежнему управляют системными приложениями и нативными библиотеками.</text>
  </g>
</svg>
