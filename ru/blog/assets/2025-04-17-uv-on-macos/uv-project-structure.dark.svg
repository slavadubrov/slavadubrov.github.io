<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="uvp-title uvp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="uvp-title">Зафиксированное и производное состояние в проекте uv</title>
  <desc id="uvp-desc">В репозитории зафиксированы декларации проекта, исходный код и тесты, требуемая версия Python и разрешённый uv lock. lock-файл и запрос версии Python создают локальное виртуальное окружение, которое можно удалить. Кэш также является производным и может быть удалён.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .process { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="456" rx="14" fill="#0C1210" />

  <rect x="48" y="48" width="472" height="320" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="72" y="76">КОММИТ · ЕДИНЫЙ ИСТОЧНИК ИСТИНЫ</text>

  <rect class="process" x="72" y="96" width="200" height="96" rx="10" />
  <text class="kind" x="92" y="130">ДЕКЛАРАЦИЯ · ПРОЦЕСС</text>
  <text class="name" x="92" y="158">pyproject.toml</text>
  <text class="note" x="92" y="178">зависимости · группы</text>

  <rect class="store" x="296" y="96" width="200" height="96" rx="10" />
  <text class="kind" x="316" y="130">РЕПОЗИТОРИЙ · ХРАНИЛИЩЕ</text>
  <text class="name" x="316" y="158">Исходный код + тесты</text>
  <text class="note" x="316" y="178">поведение проекта</text>

  <rect class="store" x="72" y="232" width="200" height="96" rx="10" />
  <text class="kind" x="92" y="266">ЗАПРОС · ХРАНИЛИЩЕ</text>
  <text class="name" x="92" y="294">.python-version</text>
  <text class="note" x="92" y="314">выбор интерпретатора</text>

  <rect x="296" y="232" width="200" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="316" y="266" fill="#FF6FB6">ФОКУС · РАЗРЕШЕНИЕ</text>
  <text class="name" x="316" y="294" fill="#FF6FB6">uv.lock</text>
  <text class="note" x="316" y="314" fill="#FF6FB6" style="font-size: 12.5px;">мультиплатформенный граф</text>

  <rect x="560" y="48" width="352" height="320" rx="12" fill="none" stroke="#2B3B33" />
  <text class="section" x="584" y="76">ПРОИЗВОДНОЕ · ПЕРЕСОБИРАЕТСЯ ЛОКАЛЬНО</text>

  <rect class="store" x="584" y="96" width="304" height="96" rx="10" />
  <text class="kind" x="604" y="130">КЭШ · ХРАНИЛИЩЕ</text>
  <text class="name" x="604" y="158">Загрузки + сборки</text>
  <text class="note" x="604" y="178" style="font-size: 11px;">повторно используется, но не является источником истины</text>

  <rect class="store" x="584" y="232" width="304" height="96" rx="10" />
  <text class="kind" x="604" y="266">ОКРУЖЕНИЕ · ХРАНИЛИЩЕ</text>
  <text class="name" x="604" y="294">.venv</text>
  <text class="note" x="604" y="314">установлено для этой ОС + архитектуры</text>

  <path class="edge" d="M172 192v16h224v20" marker-end="url(#uvp-arrow)" />
  <path class="edge" d="M496 280h80" marker-end="url(#uvp-arrow)" />
  <path class="edge" d="M172 328v24h404v-56" marker-end="url(#uvp-arrow)" />

  <path d="M48 406h24" stroke="#2B3B33" />
  <text class="note" x="84" y="411">Намерение коммита и разрешение зависимостей. Игнорируйте .venv и кэш: оба можно пересобрать.</text>

  <defs>
    <marker id="uvp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
