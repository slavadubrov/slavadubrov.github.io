<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="layers-title layers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="layers-title">Шесть независимых слоёв артефакта модели с открытыми весами</title>
  <desc id="layers-desc">Шесть согласованных узлов разделяют семейство и ревизию, роль в обучении, архитектуру, числовое представление, контейнер и раскладку, а также рантайм и железо. В фокусе — контейнер и раскладка, поскольку название формата — лишь один слой артефакта.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
  </style>
  <rect width="960" height="496" rx="14" fill="#0C1210" />

  <text class="section" x="48" y="48">АРТЕФАКТ МОДЕЛИ — ЧИТАЙТЕ КАЖДЫЙ СЛОЙ ОТДЕЛЬНО</text>

  <rect class="box" x="48" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="114">СЛОЙ 1</text>
  <text class="name" x="68" y="142">Семейство + ревизия</text>

  <rect class="box" x="344" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="114">СЛОЙ 2</text>
  <text class="name" x="364" y="142">Роль в обучении</text>

  <rect class="box" x="640" y="80" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="114">СЛОЙ 3</text>
  <text class="name" x="660" y="142">Архитектура</text>

  <rect class="box" x="48" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="250">СЛОЙ 4</text>
  <text class="name" x="68" y="278">Числовое представление</text>

  <rect x="344" y="216" width="272" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="364" y="250" fill="#FF6FB6">ФОКУС · СЛОЙ 5</text>
  <text class="name" x="364" y="278" fill="#FF6FB6">Контейнер + раскладка</text>

  <rect class="box" x="640" y="216" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="250">СЛОЙ 6</text>
  <text class="name" x="660" y="278">Рантайм + железо</text>

  <path d="M48 360H912" stroke="#2B3B33" stroke-width="1" />
  <text class="kind" x="48" y="392">ПРИМЕРЫ</text>
  <text class="note" x="48" y="420">GPTQ и AWQ описывают квантизацию. GGUF и Safetensors описывают упаковку.</text>
  <text class="note" x="48" y="448">MoE описывает структуру исполнения. llama.cpp, vLLM и Transformers исполняют поддерживаемые артефакты.</text>
  <text class="note" x="48" y="476">Знакомый суффикс не подтверждает качество, соответствие объёму памяти или скорость сервинга.</text>
</svg>
