<text x="32" y="442" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Проводите бенчмарк точного чекпоинта, конвертации, рантайма и оборудования вместе.</text>
<text x="32" y="464" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Изменение любого из них создаёт новую релизную единицу для тестирования.</text>
