<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="format-title format-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="format-title">Выберите контейнер модели через runtime-first шлюз совместимости</title>
  <desc id="format-desc">Решение по runtime ведёт к llama.cpp, GPU-серверу или edge/mobile runtime. Каждый runtime приводит к поддерживаемому артефакту: конвертации в GGUF, документированному артефакту репозитория или поддерживаемому экспорту. Все пути сходятся в одном шлюзе совместимости.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="688" rx="14" fill="#0C1210" />

  <path class="box" d="M480 64 600 112 480 160 360 112Z" />
  <text class="kind" x="480" y="106" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="480" y="130" text-anchor="middle">Какой runtime?</text>

  <path class="edge" d="M480 160v16H184v24" marker-end="url(#format-arrow)" />
  <path class="edge" d="M480 160v40" marker-end="url(#format-arrow)" />
  <path class="edge" d="M480 160v16h296v24" marker-end="url(#format-arrow)" />

  <rect class="box" x="48" y="200" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="234">RUNTIME</text>
  <text class="name" x="68" y="262">llama.cpp</text>
  <rect class="box" x="344" y="200" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="234">RUNTIME</text>
  <text class="name" x="364" y="262">GPU-сервер / загрузчик</text>
  <rect class="box" x="640" y="200" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="234">RUNTIME</text>
  <text class="name" x="660" y="262">Edge / mobile</text>

  <path class="edge" d="M184 296v40" marker-end="url(#format-arrow)" />
  <path class="edge" d="M480 296v40" marker-end="url(#format-arrow)" />
  <path class="edge" d="M776 296v40" marker-end="url(#format-arrow)" />

  <rect class="store" x="48" y="344" width="272" height="96" rx="10" />
  <text class="kind" x="68" y="378">АРТЕФАКТ</text>
  <text class="name" x="68" y="406">Конвертация в GGUF</text>
  <rect class="store" x="344" y="344" width="272" height="96" rx="10" />
  <text class="kind" x="364" y="378">АРТЕФАКТ</text>
  <text class="name" x="364" y="406">Артефакт репозитория</text>
  <rect class="store" x="640" y="344" width="272" height="96" rx="10" />
  <text class="kind" x="660" y="378">АРТЕФАКТ</text>
  <text class="name" x="660" y="406">Поддерживаемый экспорт</text>

  <path class="edge" d="M184 440v32h296" />
  <path class="edge" d="M776 440v32H480" />
  <path class="edge" d="M480 440v56" marker-end="url(#format-arrow)" />

  <rect x="272" y="504" width="416" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="292" y="538" fill="#FF6FB6">ФОКУС · ШЛЮЗ СОВМЕСТИМОСТИ</text>
  <text class="name" x="292" y="566" fill="#FF6FB6">Проверьте точный путь исполнения</text>

  <text class="note" x="48" y="640">Проверьте архитектуру, версию загрузчика, kernels, hardware, ревизию модели и происхождение конвертации.</text>
  <text class="note" x="48" y="668">Затем измерьте качество задачи, throughput, latency и пиковое потребление памяти на целевом устройстве.</text>

  <defs>
    <marker id="format-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
