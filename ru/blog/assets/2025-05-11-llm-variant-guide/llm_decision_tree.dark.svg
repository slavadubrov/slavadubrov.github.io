<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="workflow-title workflow-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="workflow-title">Воркфлоу выбора чекпоинта, рантайма и квантизации</title>
  <desc id="workflow-desc">Шесть шагов snake flow фиксируют контракт задачи, выбирают точный чекпоинт, проверяют поддерживаемый рантайм, оценивают бюджет памяти, выбирают представление и бенчмаркают полный релизный юнит. В центре внимания — релизный бенчмарк.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .detail { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .store { fill: #1B2621; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="504" rx="14" fill="#0C1210" />

  <circle cx="62" cy="60" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="65" text-anchor="middle">1</text>
  <circle cx="370" cy="60" r="14" fill="#EDF5F0" /><text class="marker-num" x="370" y="65" text-anchor="middle">2</text>
  <circle cx="678" cy="60" r="14" fill="#EDF5F0" /><text class="marker-num" x="678" y="65" text-anchor="middle">3</text>

  <rect class="box" x="48" y="88" width="248" height="96" rx="10" />
  <text class="kind" x="68" y="116">ЗАДАЧА</text>
  <text class="name" x="68" y="142">Контракт задачи</text>
  <text class="detail" x="68" y="166">качество · лицензия · контекст</text>
  <rect class="box" x="356" y="88" width="248" height="96" rx="10" />
  <text class="kind" x="376" y="116">ЧЕКПОИНТ</text>
  <text class="name" x="376" y="142">Точная ревизия</text>
  <text class="detail" x="376" y="166">модель · токенизатор · шаблон</text>
  <rect class="box" x="664" y="88" width="248" height="96" rx="10" />
  <text class="kind" x="684" y="116">РАНТАЙМ</text>
  <text class="name" x="684" y="142">Поддерживаемый экзекьютор</text>
  <text class="detail" x="684" y="166">архитектура · ядра</text>

  <path class="edge" d="M296 136h52" marker-end="url(#workflow-arrow)" />
  <path class="edge" d="M604 136h52" marker-end="url(#workflow-arrow)" />
  <path class="edge" d="M788 184v88" marker-end="url(#workflow-arrow)" />

  <circle cx="678" cy="252" r="14" fill="#EDF5F0" /><text class="marker-num" x="678" y="257" text-anchor="middle">4</text>
  <circle cx="370" cy="252" r="14" fill="#EDF5F0" /><text class="marker-num" x="370" y="257" text-anchor="middle">5</text>
  <circle cx="62" cy="252" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="257" text-anchor="middle">6</text>

  <rect class="store" x="664" y="280" width="248" height="96" rx="10" />
  <text class="kind" x="684" y="308">БЮДЖЕТ</text>
  <text class="name" x="684" y="334">Измеренная память</text>
  <text class="detail" x="684" y="358">веса · KV · запас</text>
  <rect class="store" x="356" y="280" width="248" height="96" rx="10" />
  <text class="kind" x="376" y="308">АРТЕФАКТ</text>
  <text class="name" x="376" y="334">Представление</text>
  <text class="detail" x="376" y="358">точность · quant · происхождение</text>
  <rect x="48" y="280" width="248" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="68" y="308" fill="#FF6FB6">ФОКУС · РЕЛИЗ</text>
  <text class="name" x="68" y="334" fill="#FF6FB6">Релизный бенчмарк</text>
  <text class="detail" x="68" y="358" fill="#FF6FB6">качество · латентность · пиковое потребление памяти</text>

  <path class="edge" d="M664 328h-52" marker-end="url(#workflow-arrow)" />
  <path class="edge" d="M356 328h-52" marker-end="url(#workflow-arrow)" />

  <path d="M48 416H912" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="48" y="452">Бенчмаркайте точный чекпоинт, конвертацию, рантайм и железо вместе.</text>
  <text class="note" x="48" y="480">Изменение любого из них создаёт новый релизный юнит для тестирования.</text>

  <defs>
    <marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
