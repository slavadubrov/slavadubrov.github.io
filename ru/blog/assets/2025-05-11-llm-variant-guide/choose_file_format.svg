<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" data-visual-system="evidence-plate-v1" font-family="Inter, system-ui, sans-serif">
  <title id="title">Выберите контейнер модели с гейтом совместимости, ориентированным на рантайм</title>
  <desc id="desc">Многоуровневая карта решений с приоритетом рантайма для узких и широких экранов. В ветке llama.cpp используется поддерживаемая конвертация в GGUF. Лоадер в стиле Transformers или GPU-сервер использует задокументированный артефакт репозитория. Периферийный или мобильный рантайм использует поддерживаемый экспорт. Каждая ветка проходит гейты совместимости и бенчмаркинга.</desc>
  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .stage { font-size: 21px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 700; }
      .copy { font-size: 18px; fill: #64748b; }
      .chip { font-size: 18px; font-weight: 600; }
      .note { font-size: 18px; fill: #166534; font-weight: 600; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="960" height="1040" rx="14" fill="#f8fafc" />
  <text x="48" y="54" class="title">Сначала выберите рантайм, затем контейнер</text>
  <text x="48" y="86" class="subtitle">Аппаратное обеспечение ограничивает бэкенды и ядра. Само по себе оно не выбирает формат.</text>

  <rect x="144" y="118" width="672" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="480" y="149" text-anchor="middle" class="stage">Какой рантайм поддерживает архитектуру</text>
  <text x="480" y="176" text-anchor="middle" class="copy">и нужный интерфейс сервинга?</text>

  <path d="M480 194 V226" class="arrow" />

  <rect x="96" y="236" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="124" y="270" class="label">Ветка 1 · экзекьютор llama.cpp / ggml</text>
  <rect x="124" y="288" width="104" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="176" y="312" text-anchor="middle" class="chip">GGUF</text>
  <text x="124" y="348" class="copy">Используйте конвертацию для точной архитектуры. Зафиксируйте ревизии исходника и конвертера.</text>

  <path d="M480 378 V410" class="arrow" />
  <rect x="96" y="420" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="124" y="454" class="label">Ветка 2 · лоадер в стиле Transformers или GPU-сервер</text>
  <rect x="124" y="472" width="326" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="287" y="496" text-anchor="middle" class="chip">Задокументированный артефакт репозитория</text>
  <text x="124" y="532" class="copy">Используйте задокументированные файлы, конфигурацию, метод квантизации и ядра.</text>

  <path d="M480 562 V594" class="arrow" />
  <rect x="96" y="604" width="768" height="142" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="124" y="638" class="label">Ветка 3 · периферийный или мобильный рантайм</text>
  <rect x="124" y="656" width="286" height="34" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="267" y="680" text-anchor="middle" class="chip">Экспорт, поддерживаемый рантаймом</text>
  <text x="124" y="716" class="copy">Используйте поддерживаемые операторы, dtypes и квантизацию. Измеряйте на целевом устройстве.</text>

  <path d="M480 746 V778" class="arrow" />

  <rect x="96" y="788" width="768" height="126" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
  <text x="124" y="824" class="stage">Гейт совместимости</text>
  <text x="124" y="856" class="copy">Проверьте архитектуру, версию лоадера, ядра, аппаратное обеспечение, ревизию модели</text>
  <text x="124" y="884" class="copy">и происхождение конвертации. Совпадающего расширения недостаточно.</text>

  <path d="M480 914 V946" class="arrow" />
  <rect x="132" y="956" width="696" height="46" rx="23" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
  <text x="480" y="985" text-anchor="middle" class="note">Оцените качество на задаче, throughput, латентность и пиковое потребление памяти</text>
</svg>
