<path d="M32 640h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="666" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Дисбаланс нагрузки в этом батче: от 9 до 42 токенов на четырёх экспертов.</text>
<text x="32" y="688" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF"><tspan x="32">Отслеживайте число токенов на эксперта, переполнение ёмкости, энтропию роутинга и время</tspan><tspan x="32" dy="1.2em">all-to-all.</tspan></text>
