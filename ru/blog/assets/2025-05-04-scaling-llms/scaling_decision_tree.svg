<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="sd-title sd-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="sd-title">Workflow распределённого масштабирования: сначала ограничения</title>
  <desc id="sd-desc">Профилируйте одну рабочую нагрузку, определите её лимитирующее ограничение, сопоставьте требуемые коммуникации с топологией оборудования, проведите бенчмарк допустимых mesh-конфигураций и выбирайте layout только при соответствии ограничениям и лучшей измеренной производительности.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .num { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="592" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">WORKFLOW: СНАЧАЛА ОГРАНИЧЕНИЯ</text>

  <g>
    <circle cx="62" cy="76" r="14" fill="#17211B" /><text class="num" x="62" y="81" text-anchor="middle">1</text>
    <circle cx="286" cy="76" r="14" fill="#17211B" /><text class="num" x="286" y="81" text-anchor="middle">2</text>
    <circle cx="510" cy="76" r="14" fill="#17211B" /><text class="num" x="510" y="81" text-anchor="middle">3</text>
    <circle cx="734" cy="76" r="14" fill="#17211B" /><text class="num" x="734" y="81" text-anchor="middle">4</text>
  </g>
  <g>
    <rect class="box" x="48" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="68" y="138">ПРОФИЛИРОВАНИЕ</text><text class="name" x="68" y="166"><tspan x="68">Измерить рабочую</tspan><tspan x="68" dy="1.2em">нагрузку</tspan></text>
    <rect class="box" x="272" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="292" y="138">КЛАССИФИКАЦИЯ</text><text class="name" x="292" y="166"><tspan x="292">Лимитирующее</tspan><tspan x="292" dy="1.2em">ограничение</tspan></text>
    <rect class="box" x="496" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="516" y="138">ТОПОЛОГИЯ</text><text class="name" x="516" y="166"><tspan x="516">Разместить</tspan><tspan x="516" dy="1.2em">collective-операции</tspan></text>
    <rect class="box" x="720" y="104" width="192" height="96" rx="10" />
    <text class="kind" x="740" y="138">БЕНЧМАРК</text><text class="name" x="740" y="166" style="font-size: 11px;"><tspan x="740">Запустить допустимые</tspan><tspan x="740" dy="1.2em">mesh-конфигурации</tspan></text>
  </g>
  <path class="edge" d="M240 152h24" marker-end="url(#sd-arrow)" /><path class="edge" d="M464 152h24" marker-end="url(#sd-arrow)" /><path class="edge" d="M688 152h24" marker-end="url(#sd-arrow)" />

  <path class="box" d="M480 248 592 320 480 392 368 320Z" />
  <text class="kind" x="480" y="304" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="480" y="332" text-anchor="middle"><tspan x="480">Соответствует и</tspan><tspan x="480" dy="1.2em">выигрывает?</tspan></text>
  <path class="edge" d="M816 200v120H600" marker-end="url(#sd-arrow)" />
  <rect x="680" y="272" width="56" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="708" y="289" text-anchor="middle" style="font-size: 11px;">результаты</text>

  <path class="edge" stroke-dasharray="7 6" d="M368 320H144V208" marker-end="url(#sd-arrow)" />
  <rect x="232" y="308" width="72" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="268" y="325" text-anchor="middle" style="font-size: 11px;">нет · пересмотреть</text>
  <path d="M480 392v40" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#sd-arrow-signal)" />
  <rect x="352" y="440" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="372" y="474" fill="#C50E72">ИЗМЕРЕННЫЙ ЛИДЕР</text>
  <text class="name" x="372" y="502" fill="#C50E72">Готовый к деплою layout</text>
  <rect x="492" y="400" width="48" height="24" rx="6" fill="#F7F7F4" /><text class="note" x="516" y="417" text-anchor="middle" fill="#C50E72">да</text>

  <path class="edge" d="M48 560h864" stroke="#D8DDD9" />
  <text class="note" x="48" y="576">Состояние → FSDP · математика слоёв → TP · глубина → PP · последовательность → CP · эксперты → EP</text>
  <defs>
    <marker id="sd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
    <marker id="sd-arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker>
  </defs>
</svg>
