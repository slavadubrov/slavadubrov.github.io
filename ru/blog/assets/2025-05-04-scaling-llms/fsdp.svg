<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fsdp-title fsdp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fsdp-title">Полностью шардированное data parallel-исполнение</title>
  <desc id="fsdp-desc">Четыре rank’а хранят шарды параметров, градиентов и оптимизатора. Группа слоёв временно собирается для вычислений, после чего её градиенты reduce-scatter’ятся обратно владельцам шардов.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="600" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">ПОСТОЯННЫЕ ШАРДЫ · ВРЕМЕННОЕ ПРЕДСТАВЛЕНИЕ СЛОЯ</text>

  <g>
    <rect class="box" x="48" y="64" width="192" height="96" rx="10" fill="#F2F2F5" />
    <text class="kind" x="68" y="98">RANK 0 · ХРАНЕНИЕ</text><text class="name" x="68" y="126">P₀ · G₀ · O₀</text>
    <rect class="box" x="272" y="64" width="192" height="96" rx="10" fill="#F2F2F5" />
    <text class="kind" x="292" y="98">RANK 1 · ХРАНЕНИЕ</text><text class="name" x="292" y="126">P₁ · G₁ · O₁</text>
    <rect class="box" x="496" y="64" width="192" height="96" rx="10" fill="#F2F2F5" />
    <text class="kind" x="516" y="98">RANK 2 · ХРАНЕНИЕ</text><text class="name" x="516" y="126">P₂ · G₂ · O₂</text>
    <rect class="box" x="720" y="64" width="192" height="96" rx="10" fill="#F2F2F5" />
    <text class="kind" x="740" y="98">RANK 3 · ХРАНЕНИЕ</text><text class="name" x="740" y="126">P₃ · G₃ · O₃</text>
  </g>
  <path class="edge" d="M144 160v40h336v40M368 160v40M592 160v40H480M816 160v40H480" />
  <path class="edge" d="M480 200v32" marker-end="url(#fsdp-arrow)" />

  <rect x="352" y="240" width="256" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="372" y="274" fill="#C50E72">КОЛЛЕКТИВНАЯ ОПЕРАЦИЯ</text>
  <text class="name" x="372" y="302" fill="#C50E72">All-gather группы слоёв</text>
  <path class="edge" d="M480 336v40" marker-end="url(#fsdp-arrow)" />

  <rect class="box" x="352" y="384" width="256" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="372" y="408">ОБРАБОТКА</text><text class="name" x="372" y="432">Прямой и обратный проходы</text>
  <path class="edge" d="M480 446v40" marker-end="url(#fsdp-arrow)" />

  <rect class="box" x="352" y="494" width="256" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="372" y="518">КОЛЛЕКТИВНАЯ ОПЕРАЦИЯ</text><text class="name" x="372" y="542">Reduce-scatter градиентов</text>
  <path class="edge" stroke-dasharray="7 6" d="M352 525H160a16 16 0 0 1-16-16V168" marker-end="url(#fsdp-arrow)" />
  <text class="note" x="48" y="584" style="font-size: 12.5px;">Группировка слоёв позволяет балансировать пиковое потребление памяти, размер коллективных операций и их перекрытие с вычислениями.</text>
  <defs><marker id="fsdp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker></defs>
</svg>
