<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="pp-title pp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="pp-title">Стадии pipeline parallelism и микробатчи</title>
  <desc id="pp-desc">Четыре строки стадий содержат разные группы слоёв. Три микробатча продвигаются по диагонали во времени. Пустые слоты на старте и при завершении создают пузырь пайплайна, описанный ниже расписания.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645E; }
    .name { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #17211B; }
    .note { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645E; }
    .tick { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #17211B; }
    .row { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .slot { fill: #F2F2F5; stroke: #D8DDD9; stroke-width: 1; }
  </style>
  <rect width="960" height="536" rx="14" fill="#F7F7F4" />
  <text class="kind" x="48" y="44">РАЗБИЕНИЕ ПО ГЛУБИНЕ · РАСПИСАНИЕ ВО ВРЕМЕНИ</text>
  <text class="note" x="808" y="44">время →</text>

  <g>
    <rect class="row" x="48" y="72" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="96">СТАДИЯ 0</text><text class="name" x="68" y="120">Слои 0–7</text>
    <rect class="row" x="48" y="158" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="182">СТАДИЯ 1</text><text class="name" x="68" y="206">Слои 8–15</text>
    <rect class="row" x="48" y="244" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="268">СТАДИЯ 2</text><text class="name" x="68" y="292">Слои 16–23</text>
    <rect class="row" x="48" y="330" width="168" height="62" rx="10" />
    <text class="kind" x="68" y="354">СТАДИЯ 3</text><text class="name" x="68" y="378">Слои 24–31</text>
  </g>

  <g>
    <rect class="slot" x="248" y="72" width="88" height="62" rx="6" /><rect class="slot" x="352" y="72" width="88" height="62" rx="6" /><rect class="slot" x="456" y="72" width="88" height="62" rx="6" />
    <rect class="slot" x="352" y="158" width="88" height="62" rx="6" /><rect class="slot" x="456" y="158" width="88" height="62" rx="6" /><rect class="slot" x="560" y="158" width="88" height="62" rx="6" />
    <rect class="slot" x="456" y="244" width="88" height="62" rx="6" /><rect class="slot" x="560" y="244" width="88" height="62" rx="6" /><rect class="slot" x="664" y="244" width="88" height="62" rx="6" />
    <rect class="slot" x="560" y="330" width="88" height="62" rx="6" /><rect class="slot" x="664" y="330" width="88" height="62" rx="6" /><rect class="slot" x="768" y="330" width="88" height="62" rx="6" />
    <g class="tick" text-anchor="middle">
      <text x="292" y="109">μ0</text><text x="396" y="109">μ1</text><text x="500" y="109">μ2</text>
      <text x="396" y="195">μ0</text><text x="500" y="195">μ1</text><text x="604" y="195">μ2</text>
      <text x="500" y="281">μ0</text><text x="604" y="281">μ1</text><text x="708" y="281">μ2</text>
      <text x="604" y="367">μ0</text><text x="708" y="367">μ1</text><text x="812" y="367">μ2</text>
    </g>
  </g>
  <path d="M248 144h88M352 230h88M456 316h88" fill="none" stroke="#F2148E" stroke-width="2.5" stroke-dasharray="7 6" />
  <text class="note" x="248" y="414" fill="#C50E72">пустые слоты на старте</text>

  <rect x="248" y="440" width="608" height="62" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="268" y="464" fill="#C50E72">ФОКУС · ПУЗЫРЬ</text>
  <text class="name" x="268" y="488" fill="#C50E72">(стадии − 1) / (микробатчи + стадии − 1)</text>
  <text class="note" x="48" y="520">Неравное время выполнения стадий создаёт больше простоев, чем идеализированное расписание.</text>
</svg>
