<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="pp-title pp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="pp-title">Стадии pipeline parallelism и микробатчи</title><desc id="pp-desc">Четыре стадии содержат разные группы слоёв и последовательно передают активации вперёд. После заполнения пайплайна микробатчи поддерживают стадии занятыми, но запуск и опустошение оставляют стадии простаивать, формируя bubble пайплайна.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="pp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="pp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
<rect width="720" height="704" rx="14" fill="#0C1210" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#EDF5F0">Стадии pipeline parallelism и микробатчи</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Три микробатча проходят стадии по очереди; при запуске и опустошении стадии простаивают.</text>
<path d="M42 112h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 112h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="129.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STAGE 0</text><text x="46" y="167" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Слои 0–7</text>
<path d="M360 184v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pp-arrow-flow)" />
<path d="M42 200h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 200h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="217.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STAGE 1</text><text x="46" y="255" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Слои 8–15</text>
<path d="M360 272v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pp-arrow-flow)" />
<path d="M42 288h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 288h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="305.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STAGE 2</text><text x="46" y="343" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Слои 16–23</text>
<path d="M360 360v16" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pp-arrow-flow)" />
<path d="M42 376h636a10 10 0 0 1 10 10v52a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-52a10 10 0 0 1 10 -10Z" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" /><path d="M42 376h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#EDF5F0" /><text x="46" y="393.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">STAGE 3</text><text x="46" y="431" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Слои 24–31</text>
<path d="M360 448v48" fill="none" stroke="#EDF5F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pp-arrow-flow)" />
<path d="M42 496h636a10 10 0 0 1 10 10v84a10 10 0 0 1 -10 10h-636a10 10 0 0 1 -10 -10v-84a10 10 0 0 1 10 -10Z" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><path d="M42 496h636a10 10 0 0 1 10 10v16a0 0 0 0 1 -0 0h-656a0 0 0 0 1 -0 -0v-16a10 10 0 0 1 10 -10Z" fill="#FF6FB6" /><text x="46" y="513.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#0C1210" letter-spacing="1.2">ФОКУС · BUBBLE</text><text x="46" y="557" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#EDF5F0">Простои при запуске и опустошении</text><text x="46" y="579" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">(стадии − 1) / (микробатчи + стадии − 1)</text>
<path d="M32 624h656" stroke="#2B3B33" stroke-width="1" />
<text x="32" y="650" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF" style="font-size: 12.5px;">Доля bubble рассчитана для сбалансированного расписания в стиле GPipe с p стадиями и m микробатчами.</text>
<text x="32" y="672" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Неравномерное время стадий создаёт больше простоев, чем предсказывает формула.</text>
</svg>
