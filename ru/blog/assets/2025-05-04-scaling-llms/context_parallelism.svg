<path d="M32 504h656" stroke="#D8DDD9" stroke-width="1" />
<text x="32" y="530" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11.5px;">Память под активации уменьшается для длинных последовательностей; коммуникация attention становится критичной.</text>
<text x="32" y="552" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Веса остаются реплицированными во всей группе параллелизма по контексту.</text>
