<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="cp-title cp-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="cp-title">Обмен состояниями attention при параллелизме по контексту</title><desc id="cp-desc">Длинная последовательность разбивается на четыре чанка токенов — по одному на каждый rank, при этом каждый rank реплицирует полные веса модели. Attention обменивается состояниями ключей и значений между rank, поэтому результат по-прежнему учитывает весь контекст.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="cp-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="cp-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
<rect width="720" height="584" rx="14" fill="#F7F7F4" />
<text x="32" y="56" font-family="Space Grotesk, IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#17211B">Обмен состояниями attention при параллелизме по контексту</text>
<text x="32" y="80" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E"><tspan x="32">Каждый rank владеет чанком последовательности и реплицирует веса для обмена состояниями</tspan><tspan x="32" dy="1.2em">attention.</tspan></text>
