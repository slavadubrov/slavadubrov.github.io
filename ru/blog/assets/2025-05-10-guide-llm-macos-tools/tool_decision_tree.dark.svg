<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tools-title tools-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="tools-title">Воркфлоу выбора локального LLM-инструмента для macOS</title>
  <desc id="tools-desc">Начните с одной задачи и зафиксируйте базовый чекпоинт. Выберите Ollama для управляемого сервиса, LM Studio для исследования на десктопе, llama.cpp для прямого контроля GGUF или MLX-LM для Python под Apple, затем проведите бенчмарк на одной и той же нагрузке.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.6px; fill: #a8b8af; }
    .kind { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #a8b8af; }
    .name { font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #edf5f0; }
    .note { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #a8b8af; }
    .box { stroke: #edf5f0; stroke-width: 1.5; fill: #141d19; }
    .edge { stroke: #a8b8af; stroke-width: 1.5; fill: none; }
    .conditional { stroke-dasharray: 7 6; }
    .focus-kind, .focus-name { fill: #ff6fb6; }
  </style>
  <rect width="960" height="520" rx="14" fill="#0c1210" />

  <text class="section" x="48" y="40">ВЫБЕРИТЕ УРОВЕНЬ КОНТРОЛЯ, ЗАТЕМ ПРОВЕДИТЕ БЕНЧМАРК</text>

  <rect x="296" y="64" width="368" height="62" rx="10" fill="#1b2621" stroke="#edf5f0" stroke-width="1.5" />
  <text class="kind" x="316" y="88">БАЗОВАЯ ЛИНИЯ</text>
  <text class="name" x="316" y="111">Задача + чекпоинт</text>

  <path class="edge conditional" d="M480 126v26H142v32" marker-end="url(#tools-arrow)" />
  <path class="edge conditional" d="M480 152H370v32" marker-end="url(#tools-arrow)" />
  <path class="edge conditional" d="M480 152H598v32" marker-end="url(#tools-arrow)" />
  <path class="edge conditional" d="M480 152H826v32" marker-end="url(#tools-arrow)" />

  <rect class="box" x="48" y="184" width="188" height="96" rx="10" />
  <text class="kind" x="68" y="218">УПРАВЛЯЕМЫЙ СЕРВИС</text>
  <text class="name" x="68" y="246">Ollama</text>

  <rect class="box" x="276" y="184" width="188" height="96" rx="10" />
  <text class="kind" x="296" y="218">ДЕСКТОП + APIs</text>
  <text class="name" x="296" y="246">LM Studio</text>

  <rect class="box" x="504" y="184" width="188" height="96" rx="10" />
  <text class="kind" x="524" y="218">ПРЯМОЙ GGUF</text>
  <text class="name" x="524" y="246">llama.cpp</text>

  <rect class="box" x="732" y="184" width="180" height="96" rx="10" />
  <text class="kind" x="752" y="218">PYTHON ПОД APPLE</text>
  <text class="name" x="752" y="246">MLX-LM</text>

  <path class="edge" d="M142 280v48h338" />
  <path class="edge" d="M370 280v48h110" />
  <path class="edge" d="M598 280v48H480" />
  <path class="edge" d="M822 280v48H480" />
  <path class="edge" d="M480 328v32" marker-end="url(#tools-arrow)" />

  <rect x="240" y="360" width="480" height="96" rx="10" fill="#2b1622" stroke="#ff6fb6" stroke-width="2.5" />
  <text class="kind focus-kind" x="260" y="394">ФОКУС</text>
  <text class="name focus-name" x="260" y="422">Проведите бенчмарк на одной и той же нагрузке</text>

  <text class="note" x="48" y="496">Одинаковые промпты · одинаковый контекст · сопоставимая точность · измеренный пик потребления памяти</text>

  <defs>
    <marker id="tools-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a8b8af" />
    </marker>
  </defs>
</svg>
