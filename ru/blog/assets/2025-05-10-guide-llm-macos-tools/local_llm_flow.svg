<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="memory-title memory-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="memory-title">Бюджет унифицированной памяти Apple Silicon для локального инференса</title>
  <desc id="memory-desc">Установленная унифицированная память должна вместить macOS и приложения, веса модели, KV cache, рабочую область рантайма и мультимодальные компоненты, сохранив достаточный запас, чтобы избежать постоянного свопинга.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <style>
    .section { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.6px; fill: #59645e; }
    .kind { font-family: IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; letter-spacing: 1.3px; fill: #59645e; }
    .name { font-family: Space Grotesk, ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: #17211b; }
    .note { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #59645e; }
    .box { stroke: #17211b; stroke-width: 1.5; }
    .focus-kind, .focus-name { fill: #c50e72; }
  </style>
  <rect width="960" height="488" rx="14" fill="#f7f7f4" />

  <text class="section" x="48" y="40">УСТАНОВЛЕННАЯ УНИФИЦИРОВАННАЯ ПАМЯТЬ — ПИКОВОЕ ИСПОЛЬЗОВАНИЕ + ЗАПАС</text>

  <rect class="box" x="48" y="64" width="412" height="96" rx="10" fill="#ffffff" />
  <text class="kind" x="68" y="98">СИСТЕМА</text>
  <text class="name" x="68" y="126">macOS + приложения</text>

  <rect class="box" x="500" y="64" width="412" height="96" rx="10" fill="#f2f2f5" />
  <text class="kind" x="520" y="98">АРТЕФАКТ</text>
  <text class="name" x="520" y="126">Веса модели</text>

  <rect class="box" x="48" y="200" width="412" height="96" rx="10" fill="#f2f2f5" />
  <text class="kind" x="68" y="234">СОСТОЯНИЕ</text>
  <text class="name" x="68" y="262">KV cache</text>

  <rect class="box" x="500" y="200" width="412" height="96" rx="10" fill="#ffffff" />
  <text class="kind" x="520" y="234">РАНТАЙМ</text>
  <text class="name" x="520" y="262">Рабочая область + временные буферы</text>

  <rect class="box" x="48" y="336" width="412" height="96" rx="10" fill="#f2f2f5" />
  <text class="kind" x="68" y="370">КОМПОНЕНТЫ</text>
  <text class="name" x="68" y="398">Мультимодальные компоненты</text>

  <rect x="500" y="336" width="412" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text class="kind focus-kind" x="520" y="370">ФОКУС</text>
  <text class="name focus-name" x="520" y="398">Сохраняйте рабочий запас памяти</text>

  <text class="note" x="48" y="464">Загрузка — лишь первый барьер. Измеряйте пиковую нагрузку на целевых размере контекстного окна и количестве запросов.</text>
</svg>
