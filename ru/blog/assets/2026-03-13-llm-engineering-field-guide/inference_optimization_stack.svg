<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Варианты оптимизации инференса</title>
  <desc>Варианты оптимизации ядер, квантизации, памяти, планирования, кэширования, спекуляции и параллелизма можно выбирать независимо, ориентируясь на общий измеренный боттлнек аппаратуры и нагрузки, а также на целевые показатели уровня приложения.</desc>
  <defs>
    <filter id="shadow1" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Варианты оптимизации инференса</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#334155">Выбирайте независимо с учётом измеренного боттлнека и целевого SLO</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#1d4ed8">Аппаратная основа</text>
  <text x="80" y="468" font-size="11" fill="#0f172a">Иерархия памяти GPU: пропускная способность HBM и повторное использование данных на чипе зависят от GPU</text>
  <text x="80" y="483" font-size="10" fill="#334155">Измерьте боттлнек вычислений, памяти и коммуникаций на целевом GPU</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#166534">Оптимизация ядер</text>
  <text x="70" y="373" font-size="11" fill="#0f172a">FlashAttention (тайлинг в SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#0f172a">Фьюзинг ядер (меньше обращений к HBM)</text>
  <text x="70" y="398" font-size="10" fill="#334155">Профилируйте утилизацию развёрнутого графа</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#9a3412">Квантизация</text>
  <text x="470" y="373" font-size="11" fill="#0f172a">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#0f172a">Веса в 8 бит: примерно на 50% меньше исходного объёма хранения, чем в 16 бит</text>
  <text x="470" y="400" font-size="10" fill="#334155">4 бита: примерно на 75% меньше до учёта накладных расходов на scale и метаданные</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Управление памятью</text>
  <text x="70" y="283" font-size="11" fill="#0f172a">PagedAttention (блочное выделение KV)</text>
  <text x="70" y="298" font-size="11" fill="#0f172a">GQA/MQA (сокращение KV cache в 8–16 раз)</text>
  <text x="70" y="308" font-size="10" fill="#334155">Опубликованный прирост зависит от нагрузки и харнесса</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#5b21b6">Планирование</text>
  <text x="470" y="283" font-size="11" fill="#0f172a">Continuous batching (на уровне итераций)</text>
  <text x="470" y="298" font-size="11" fill="#0f172a">Чанкинг префилла (защищает латентность декодирования)</text>
  <text x="470" y="308" font-size="10" fill="#334155">Настройте goodput под целевой SLO</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Кэширование</text>
  <text x="70" y="193" font-size="11" fill="#0f172a">Prefix caching (измеряйте hit rate)</text>
  <text x="70" y="208" font-size="11" fill="#0f172a">RadixAttention (повторное использование KV на основе дерева)</text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Спекуляция</text>
  <text x="340" y="193" font-size="11" fill="#0f172a">Спекулятивное декодирование (проверяйте черновики)</text>
  <text x="340" y="208" font-size="11" fill="#0f172a">Прирост определяется acceptance rate</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#1d4ed8">Параллелизм</text>
  <text x="620" y="193" font-size="11" fill="#0f172a">TP (внутри узла, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#0f172a">PP (между узлами) + DP (масштабирование)</text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow1)" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#991b1b">Уровень приложения</text>
  <text x="80" y="113" font-size="11" fill="#0f172a">Роутинг моделей · rate limiting с учётом токенов · мониторинг (goodput, утилизация KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="10" fill="#334155">Объединяйте техники только после измерения их влияния на качество, латентность и стоимость</text>

</svg>
