<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Inference optimization choices" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Варианты оптимизации инференса</title>
  <desc>Варианты оптимизации kernel, квантизации, памяти, планирования, кэширования, спекуляции и параллелизма выбираются независимо с учётом общего измеренного боттлнека оборудования и нагрузки, а также целевых показателей на уровне приложения.</desc>
  <defs>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Background -->
  <rect width="900" height="520" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0">Варианты оптимизации инференса</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#EDF5F0">Выбирайте независимо с учётом измеренного боттлнека и целевого SLO</text>

  <!-- Layer 1: Hardware Foundation -->
  <rect x="50" y="420" width="800" height="70" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" class="visual-focus" />
  <text x="80" y="448" font-size="13" font-weight="bold" fill="#EDF5F0">Аппаратная основа</text>
  <text x="80" y="468" font-size="11" fill="#EDF5F0">Иерархия памяти GPU: пропускная способность HBM и повторное использование данных on-chip зависят от GPU</text>
  <text x="80" y="483" font-size="11" fill="#EDF5F0">Измерьте боттлнек вычислений, памяти и коммуникаций на целевом GPU</text>

  <!-- Layer 2: Kernel Optimizations -->
  <rect x="50" y="330" width="380" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="70" y="355" font-size="13" font-weight="bold" fill="#EDF5F0">Оптимизация kernel</text>
  <text x="70" y="373" font-size="11" fill="#EDF5F0">FlashAttention (тайлинг в SRAM)</text>
  <text x="70" y="388" font-size="11" fill="#EDF5F0">Fused kernels (меньше обращений к HBM)</text>
  <text x="70" y="398" font-size="11" fill="#EDF5F0">Профилируйте утилизацию в задеплоенном графе</text>

  <rect x="450" y="330" width="400" height="75" rx="8" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text x="470" y="355" font-size="13" font-weight="bold" fill="#EDF5F0">Квантизация</text>
  <text x="470" y="373" font-size="11" fill="#EDF5F0">FP8, INT8, INT4 (AWQ/GPTQ)</text>
  <text x="470" y="388" font-size="11" fill="#EDF5F0">Веса в 8 бит: примерно на 50% меньше raw storage, чем в 16 бит</text>
  <text x="470" y="400" font-size="11" fill="#EDF5F0">4 бита: примерно на 75% меньше до учёта overhead на scale и метаданные</text>

  <!-- Layer 3: Memory Management -->
  <rect x="50" y="240" width="380" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="70" y="265" font-size="13" font-weight="bold" fill="#EDF5F0">Управление памятью</text>
  <text x="70" y="283" font-size="11" fill="#EDF5F0">PagedAttention (блочное выделение KV)</text>
  <text x="70" y="298" font-size="11" fill="#EDF5F0">GQA/MQA (сокращение KV cache в 8–16 раз)</text>
  <text x="70" y="308" font-size="11" fill="#EDF5F0">Опубликованный прирост зависит от нагрузки и харнесса</text>

  <rect x="450" y="240" width="400" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="470" y="265" font-size="13" font-weight="bold" fill="#EDF5F0">Планирование</text>
  <text x="470" y="283" font-size="11" fill="#EDF5F0">Continuous batching (на уровне итераций)</text>
  <text x="470" y="298" font-size="11" fill="#EDF5F0">Chunked prefill (защищает латентность decode)</text>
  <text x="470" y="308" font-size="11" fill="#EDF5F0">Настройте goodput под целевой SLO</text>

  <!-- Layer 4: Serving Strategies -->
  <rect x="50" y="150" width="250" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="70" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Кэширование</text>
  <text x="70" y="193" font-size="11" fill="#EDF5F0">Prefix caching (измеряйте hit rate)</text>
  <text x="70" y="208" font-size="11" fill="#EDF5F0"><tspan x="70">RadixAttention (повторное</tspan><tspan x="70" dy="1.2em">использование KV на основе дерева)</tspan></text>

  <rect x="320" y="150" width="260" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="340" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Спекуляция</text>
  <text x="340" y="193" font-size="11" fill="#EDF5F0">Speculative decoding (проверяйте черновики)</text>
  <text x="340" y="208" font-size="11" fill="#EDF5F0">Прирост определяется acceptance rate</text>

  <rect x="600" y="150" width="250" height="75" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="620" y="175" font-size="13" font-weight="bold" fill="#EDF5F0">Параллелизм</text>
  <text x="620" y="193" font-size="11" fill="#EDF5F0">TP (внутри узла, NVLink)</text>
  <text x="620" y="208" font-size="11" fill="#EDF5F0"><tspan x="620">PP (между узлами) + DP</tspan><tspan x="620" dy="1.2em">(масштабирование)</tspan></text>

  <!-- Layer 5: Application Layer -->
  <rect x="50" y="70" width="800" height="65" rx="8" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text x="80" y="95" font-size="13" font-weight="bold" fill="#EDF5F0">Уровень приложения</text>
  <text x="80" y="113" font-size="11" fill="#EDF5F0">Роутинг моделей · Rate limiting с учётом токенов · Мониторинг (goodput, утилизация KV, TTFT/TPOT)</text>
  <text x="80" y="128" font-size="11" fill="#EDF5F0">Комбинируйте техники только после измерения их влияния на качество, латентность и стоимость</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
