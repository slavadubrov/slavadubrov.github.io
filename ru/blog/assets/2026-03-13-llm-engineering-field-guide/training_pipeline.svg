<text x="32" y="542" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E" style="font-size: 11px;">DeepSeek-R1 дистиллировала Qwen и Llama 1.5B–70B на teacher-модели 671B</text>
<text x="32" y="564" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#59645E">Повторно оценить student-модель на целевой задаче с учётом бюджета сервинга.</text>
