<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="LLM training pipeline from pretraining to alignment and distillation" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Пайплайн обучения LLM</title>
  <desc>Претрейнинг создаёт базовую модель, supervised fine-tuning адаптирует её, а alignment оптимизирует предпочтения или проверяемые награды. Выровненный учитель также может генерировать отфильтрованные примеры для меньшей дистиллированной модели-ученика.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#166534" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.08" />
    </filter>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1120" height="500" fill="#f8fafc" rx="14" />
  <text x="560" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Пайплайн обучения LLM</text>
  <text x="560" y="64" text-anchor="middle" font-size="13" fill="#64748b">Каждый этап изменяет свой артефакт и требует собственной эвалуации</text>

  <rect x="48" y="92" width="280" height="178" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text x="72" y="124" font-size="17" font-weight="700" fill="#1d4ed8">1. Претрейнинг</text>
  <text x="72" y="154" font-size="13" fill="#0f172a">Артефакт: веса базовой модели</text>
  <text x="72" y="178" font-size="13" fill="#0f172a">Сигнал: предсказание токена</text>
  <text x="72" y="202" font-size="13" fill="#0f172a">Данные: неразмеченный корпус</text>
  <text x="72" y="226" font-size="13" fill="#0f172a">Системы: ZeRO, FSDP, mixed precision</text>
  <text x="72" y="250" font-size="12" font-weight="600" fill="#1d4ed8">Метрики: loss, данные, утилизация</text>

  <line x1="328" y1="181" x2="410" y2="181" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="420" y="92" width="280" height="178" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
  <text x="444" y="124" font-size="17" font-weight="700" fill="#9a3412">2. Supervised fine-tuning</text>
  <text x="444" y="154" font-size="13" fill="#0f172a">Артефакт: веса или LoRA-адаптер</text>
  <text x="444" y="178" font-size="13" fill="#0f172a">Сигнал: размеченные целевые ответы</text>
  <text x="444" y="202" font-size="13" fill="#0f172a">Выбор: full update, LoRA или QLoRA</text>
  <text x="444" y="226" font-size="13" fill="#0f172a">Память: rank и оптимизатор</text>
  <text x="444" y="250" font-size="12" font-weight="600" fill="#9a3412">Сравнивайте с базовой моделью</text>

  <line x1="700" y1="181" x2="782" y2="181" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="792" y="92" width="280" height="178" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" />
  <text x="816" y="124" font-size="17" font-weight="700" fill="#5b21b6">3. Alignment</text>
  <text x="816" y="154" font-size="13" fill="#0f172a">PPO: reward model и critic</text>
  <text x="816" y="178" font-size="13" fill="#0f172a">DPO: loss на парах предпочтений</text>
  <text x="816" y="202" font-size="13" fill="#0f172a">GRPO: group-relative reward baseline</text>
  <text x="816" y="226" font-size="13" fill="#0f172a">RLVR: проверяемые награды</text>
  <text x="816" y="250" font-size="12" font-weight="600" fill="#5b21b6">Проверяйте качество и reward exploits</text>

  <path d="M932 270 V300 H188 V340" fill="none" stroke="#166534" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)" />
  <text x="560" y="320" text-anchor="middle" font-size="12" fill="#166534">Выровненный учитель может генерировать обучающие данные</text>

  <rect x="48" y="340" width="1024" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
  <text x="72" y="372" font-size="17" font-weight="700" fill="#166534">Дистилляция и синтетические данные</text>

  <rect x="80" y="390" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="190" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Большая модель-учитель</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#0f172a">DeepSeek-R1 (671B)</text>

  <line x1="300" y1="415" x2="420" y2="415" stroke="#166534" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="430" y="390" width="260" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="560" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Генерация, фильтрация, lineage</text>
  <text x="560" y="430" text-anchor="middle" font-size="12" fill="#0f172a">DeepSeek-R1: 800K примеров</text>

  <line x1="690" y1="415" x2="810" y2="415" stroke="#166534" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="820" y="390" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <text x="930" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Компактная модель-ученик</text>
  <text x="930" y="430" text-anchor="middle" font-size="12" fill="#0f172a">От 1.5B до 70B в статье</text>

  <text x="560" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Повторно оцените ученика на целевой задаче и при заданном бюджете сервинга</text>
</svg>
