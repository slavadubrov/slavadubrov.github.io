<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Parallelism Strategies" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Стратегии параллелизма</title>
  <desc>Четыре панели сравнивают тензорный, конвейерный, дата- и экспертный параллелизм, показывая, какой компонент модели распределяет каждая стратегия между GPU.</desc>
  <defs>
    <marker id="arrow4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FFFFFF" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="520" fill="#F7F7F4" rx="8" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#17211B">Четыре формы параллелизма</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#17211B">Как распределять вычисления LLM между несколькими GPU</text>

  <!-- TP: Tensor Parallelism -->
  <rect x="30" y="75" width="410" height="190" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="235" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Тензорный параллелизм (TP)</text>
  <text x="235" y="118" text-anchor="middle" font-size="11" fill="#17211B">Разделить матрицы весов между GPU</text>

  <!-- Weight matrix split -->
  <rect x="60" y="130" width="160" height="50" rx="4" fill="#F2F2F5" class="visual-focus" />
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#ffffff">Матрица весов W</text>
  <line x1="220" y1="155" x2="250" y2="155" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrow4)" />
  <!-- Split parts -->
  <rect x="250" y="130" width="80" height="24" rx="3" fill="#F2F2F5" />
  <text x="290" y="147" text-anchor="middle" font-size="11" fill="#ffffff">W₁ → GPU 0</text>
  <rect x="250" y="157" width="80" height="24" rx="3" fill="#F2F2F5" />
  <text x="290" y="174" text-anchor="middle" font-size="11" fill="#ffffff">W₂ → GPU 1</text>

  <text x="60" y="205" font-size="11" fill="#17211B">• All-reduce после каждого слоя</text>
  <text x="60" y="220" font-size="11" fill="#17211B">• Требует быстрых соединений (H100 NVLink: 900 GB/s)</text>
  <text x="60" y="235" font-size="11" fill="#17211B">• Обычно используется внутри узла с быстрыми соединениями</text>
  <text x="60" y="250" font-size="11" fill="#17211B" font-weight="bold"><tspan x="60">• Обменивает коммуникации на меньшую нагрузку на</tspan><tspan x="60" dy="1.2em">устройства</tspan></text>

  <!-- PP: Pipeline Parallelism -->
  <rect x="460" y="75" width="410" height="190" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="665" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Конвейерный параллелизм (PP)</text>
  <text x="665" y="118" text-anchor="middle" font-size="11" fill="#17211B">Последовательно разделить слои между GPU</text>

  <!-- Pipeline stages -->
  <rect x="490" y="132" width="75" height="40" rx="4" fill="#FFFFFF" />
  <text x="527" y="147" text-anchor="middle" font-size="11" fill="#ffffff">Слои 1–20</text>
  <text x="527" y="160" text-anchor="middle" font-size="11" fill="#ffffff">GPU 0</text>
  <line x1="565" y1="152" x2="585" y2="152" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrow4)" />
  <rect x="585" y="132" width="75" height="40" rx="4" fill="#FFFFFF" />
  <text x="622" y="147" text-anchor="middle" font-size="11" fill="#ffffff">Слои 21–40</text>
  <text x="622" y="160" text-anchor="middle" font-size="11" fill="#ffffff">GPU 1</text>
  <line x1="660" y1="152" x2="680" y2="152" stroke="#59645E" stroke-width="1.5" marker-end="url(#arrow4)" />
  <rect x="680" y="132" width="75" height="40" rx="4" fill="#FFFFFF" />
  <text x="717" y="147" text-anchor="middle" font-size="11" fill="#ffffff">Слои 41–60</text>
  <text x="717" y="160" text-anchor="middle" font-size="11" fill="#ffffff">GPU 2</text>

  <text x="490" y="200" font-size="11" fill="#17211B">• Передаёт активации между стадиями</text>
  <text x="490" y="215" font-size="11" fill="#17211B">• Может охватывать несколько узлов; профилируйте трафик активаций</text>
  <text x="490" y="230" font-size="11" fill="#17211B">• Пузырьки пайплайна (простой GPU)</text>
  <text x="490" y="245" font-size="11" fill="#17211B" font-weight="bold">• Часто комбинируется с TP внутри каждого узла</text>

  <!-- DP: Data Parallelism -->
  <rect x="30" y="285" width="410" height="190" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="2" />
  <text x="235" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Параллелизм по данным (DP)</text>
  <text x="235" y="328" text-anchor="middle" font-size="11" fill="#17211B">Реплицировать полную модель на каждом GPU</text>

  <!-- Replicated models -->
  <rect x="70" y="342" width="90" height="45" rx="4" fill="#FFFFFF" stroke="#59645E" />
  <text x="115" y="362" text-anchor="middle" font-size="11" fill="#17211B">Полная модель</text>
  <text x="115" y="378" text-anchor="middle" font-size="11" fill="#17211B">GPU 0 → батч A</text>
  <rect x="175" y="342" width="90" height="45" rx="4" fill="#FFFFFF" stroke="#59645E" />
  <text x="220" y="362" text-anchor="middle" font-size="11" fill="#17211B">Полная модель</text>
  <text x="220" y="378" text-anchor="middle" font-size="11" fill="#17211B">GPU 1 → батч B</text>
  <rect x="280" y="342" width="90" height="45" rx="4" fill="#FFFFFF" stroke="#59645E" />
  <text x="325" y="362" text-anchor="middle" font-size="11" fill="#17211B">Полная модель</text>
  <text x="325" y="378" text-anchor="middle" font-size="11" fill="#17211B">GPU 2 → батч C</text>

  <text x="60" y="413" font-size="11" fill="#17211B">• Нулевая коммуникация между GPU (инференс)</text>
  <text x="60" y="428" font-size="11" fill="#17211B">• Эффективен, если модель помещается в каждую реплику</text>
  <text x="60" y="443" font-size="11" fill="#17211B">• Для обучения: комбинируется с шардированием ZeRO</text>
  <text x="60" y="458" font-size="11" fill="#17211B" font-weight="bold">• Измеряйте баланс нагрузки и утилизацию реплик</text>

  <!-- EP: Expert Parallelism -->
  <rect x="460" y="285" width="410" height="190" rx="10" fill="#FFFFFF" stroke="#17211B" stroke-width="2" />
  <text x="665" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#17211B">Экспертный параллелизм (EP)</text>
  <text x="665" y="328" text-anchor="middle" font-size="11" fill="#17211B">Распределить экспертов MoE между GPU</text>

  <!-- Router + experts -->
  <rect x="575" y="340" width="80" height="30" rx="4" fill="#F2F2F5" />
  <text x="615" y="360" text-anchor="middle" font-size="11" fill="#ffffff">Роутер</text>

  <!-- Expert boxes -->
  <line x1="593" y1="370" x2="517" y2="385" stroke="#17211B" stroke-width="1.5" />
  <line x1="605" y1="370" x2="582" y2="385" stroke="#17211B" stroke-width="1.5" />
  <line x1="625" y1="370" x2="707" y2="385" stroke="#17211B" stroke-width="1.5" />
  <line x1="637" y1="370" x2="772" y2="385" stroke="#17211B" stroke-width="1.5" />

  <rect x="490" y="385" width="55" height="24" rx="3" fill="#F2F2F5" />
  <text x="517" y="401" text-anchor="middle" font-size="11" fill="#ffffff">E1 GPU0</text>
  <rect x="555" y="385" width="55" height="24" rx="3" fill="#F2F2F5" />
  <text x="582" y="401" text-anchor="middle" font-size="11" fill="#ffffff">E2 GPU0</text>
  <rect x="680" y="385" width="55" height="24" rx="3" fill="#F2F2F5" />
  <text x="707" y="401" text-anchor="middle" font-size="11" fill="#ffffff">E3 GPU1</text>
  <rect x="745" y="385" width="55" height="24" rx="3" fill="#F2F2F5" />
  <text x="772" y="401" text-anchor="middle" font-size="11" fill="#ffffff">E4 GPU1</text>

  <text x="490" y="433" font-size="11" fill="#17211B">• Коммуникация all-to-all для роутинга токенов</text>
  <text x="490" y="448" font-size="11" fill="#17211B">• Чувствителен к балансу экспертов и топологии</text>
  <text x="490" y="463" font-size="11" fill="#17211B" font-weight="bold">• Профилируйте трафик all-to-all при реальном роутинге</text>

  <!-- Decision framework at bottom -->
  <rect x="30" y="488" width="840" height="25" rx="5" fill="#FFFFFF" stroke="#17211B" stroke-width="1.5" />
  <text x="450" y="505" text-anchor="middle" font-size="11" fill="#17211B" font-weight="bold">Только стартовая эвристика: проверьте память, коммуникации, throughput и латентность на целевом кластере</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #17211B !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #F7F7F4; }
    marker polygon, marker path { fill: #59645E !important; stroke: none !important; }
    .visual-focus { fill: #FDECF5 !important; stroke: #F2148E !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #C50E72 !important; }
  </style>
</svg>
