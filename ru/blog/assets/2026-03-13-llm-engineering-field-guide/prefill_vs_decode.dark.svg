<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Prefill and decode phases" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="artifact-title">Фазы префилла и декода</title>
  <desc>Префилл обрабатывает токены промпта параллельно и заполняет KV cache. Длинные или хорошо сбатченные префиллы часто упираются в вычисления, а короткие могут ограничиваться трафиком памяти или накладными расходами на запуск. Декод при batch-one или низкой интенсивности генерирует по одному токену за раз и упирается в память.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#141D19" />
    </marker>
    <marker id="arrow2b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B2621" />
    </marker>

  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="900" height="400" fill="#0C1210" rx="8" />

  <!-- Title -->
  <text y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#EDF5F0" x="450">Префилл и декод: две фазы, разные боттлнеки</text>

  <!-- Prefill Phase -->
  <rect x="40" y="55" width="390" height="300" rx="10" fill="#141D19" stroke="#EDF5F0" stroke-width="2" />
  <text y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#EDF5F0" x="235">Фаза префилла</text>

  <!-- Input prompt tokens -->
  <rect x="70" y="100" width="330" height="40" rx="5" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" />
  <text y="125" text-anchor="middle" font-size="12" fill="#EDF5F0" x="235">Входной промпт: «Объясни квантовые вычисления…»</text>

  <!-- Parallel processing arrows -->
  <g transform="translate(70, 155)">
    <rect width="60" height="30" rx="4" fill="#1B2621" />
    <text y="20" text-anchor="middle" font-size="11" fill="#141D19" x="30">Токен 1</text>
  </g>
  <g transform="translate(140, 155)">
    <rect width="60" height="30" rx="4" fill="#1B2621" />
    <text y="20" text-anchor="middle" font-size="11" fill="#141D19" x="30">Токен 2</text>
  </g>
  <g transform="translate(210, 155)">
    <rect width="60" height="30" rx="4" fill="#1B2621" />
    <text y="20" text-anchor="middle" font-size="11" fill="#141D19" x="30">Токен 3</text>
  </g>
  <g transform="translate(280, 155)">
    <rect width="50" height="30" rx="4" fill="#1B2621" />
    <text y="20" text-anchor="middle" font-size="11" fill="#141D19" x="25">…</text>
  </g>
  <g transform="translate(340, 155)">
    <rect width="60" height="30" rx="4" fill="#1B2621" />
    <text y="20" text-anchor="middle" font-size="11" fill="#141D19" x="30">Токен N</text>
  </g>
  <text y="205" text-anchor="middle" font-size="11" fill="#EDF5F0" font-weight="bold" x="235">Все токены обрабатываются параллельно</text>

  <!-- Properties -->
  <rect x="70" y="220" width="330" height="120" rx="6" fill="#141D19" stroke="#EDF5F0" stroke-width="1.5" opacity="0.7" />
  <text y="245" font-size="12" font-weight="bold" fill="#EDF5F0" x="90" style="font-size: 11px;">ЧАСТО УПИРАЕТСЯ В ВЫЧИСЛЕНИЯ ПРИ БОЛЬШОМ РАЗМЕРЕ</text>
  <text y="265" font-size="11" fill="#EDF5F0" x="90">• Батченные GEMM повторно используют веса модели</text>
  <text y="282" font-size="11" fill="#EDF5F0" x="90">• Короткие задачи могут упираться в пропускную способность или запуск</text>
  <text y="299" font-size="11" fill="#EDF5F0" x="90">• Вносит вклад в TTFT от начала до конца</text>
  <text y="316" font-size="11" fill="#EDF5F0" x="90">• Профилируйте длину промпта и размер батча</text>
  <text y="333" font-size="11" fill="#EDF5F0" font-weight="bold" x="90">• Оптимизируйте измеренный боттлнек</text>

  <!-- Arrow between phases -->
  <line x1="430" y1="200" x2="438" y2="200" stroke="#EDF5F0" stroke-width="2" />
  <line x1="462" y1="200" x2="470" y2="200" stroke="#EDF5F0" stroke-width="2" marker-end="url(#arrow2)" />
  <rect x="440" y="136" width="20" height="128" rx="3" fill="#141D19" />
  <text y="200" text-anchor="middle" font-size="11" fill="#EDF5F0" x="450" transform="rotate(-90 450 200)">KV cache заполнен</text>

  <!-- Decode Phase -->
  <rect x="470" y="55" width="390" height="300" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="2" />
  <text y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#EDF5F0" x="665">Фаза декода</text>

  <!-- Sequential token generation -->
  <rect x="500" y="100" width="330" height="40" rx="5" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" />
  <text y="125" text-anchor="middle" font-size="12" fill="#EDF5F0" x="665">Выход: токен → токен → токен → …</text>

  <!-- Sequential arrows -->
  <g transform="translate(540, 155)">
    <rect width="60" height="30" rx="4" fill="#141D19" stroke="#A8B8AF" />
    <text y="20" text-anchor="middle" font-size="11" fill="#EDF5F0" x="30">t₁</text>
  </g>
  <line x1="600" y1="170" x2="630" y2="170" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrow2b)" />
  <g transform="translate(630, 155)">
    <rect width="60" height="30" rx="4" fill="#141D19" stroke="#A8B8AF" />
    <text y="20" text-anchor="middle" font-size="11" fill="#EDF5F0" x="30">t₂</text>
  </g>
  <line x1="690" y1="170" x2="720" y2="170" stroke="#A8B8AF" stroke-width="1.5" marker-end="url(#arrow2b)" />
  <g transform="translate(720, 155)">
    <rect width="60" height="30" rx="4" fill="#141D19" stroke="#A8B8AF" />
    <text y="20" text-anchor="middle" font-size="11" fill="#EDF5F0" x="30">t₃</text>
  </g>
  <text y="205" text-anchor="middle" font-size="11" fill="#EDF5F0" font-weight="bold" x="665">По одному токену за раз, последовательно</text>

  <!-- Properties -->
  <rect x="500" y="215" width="330" height="130" rx="6" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" opacity="0.7" />
  <text font-size="11" font-weight="bold" fill="#EDF5F0" x="520">
    <tspan x="520" y="238">BATCH-ONE / НИЗКАЯ ИНТЕНСИВНОСТЬ</tspan>
    <tspan x="520" y="252">ДЕКОД УПИРАЕТСЯ В ПАМЯТЬ</tspan>
  </text>
  <text y="269" font-size="11" fill="#EDF5F0" x="520">• Умножение матрицы на вектор или небольшой GEMM</text>
  <text y="286" font-size="11" fill="#EDF5F0" x="520">• Читает все веса + KV cache из HBM</text>
  <text y="303" font-size="11" fill="#EDF5F0" x="520">• Интенсивность при batch-one ≈ 1</text>
  <text y="320" font-size="11" fill="#EDF5F0" x="520">• Определяет TPOT</text>
  <text y="337" font-size="11" fill="#EDF5F0" font-weight="bold" x="520">• Оптимизация: GQA, квантизация KV, батчинг, пропускная способность</text>

  <!-- Timeline bar at bottom -->
  <rect x="40" y="370" width="820" height="20" rx="3" fill="#141D19" />
  <rect x="40" y="370" width="280" height="20" rx="3" fill="#1B2621" opacity="0.3" />
  <rect x="320" y="370" width="540" height="20" rx="3" fill="#1B2621" opacity="0.3" class="visual-focus" />
  <text y="384" text-anchor="middle" font-size="11" fill="#EDF5F0" font-weight="bold" x="180">TTFT</text>
  <text y="384" text-anchor="middle" font-size="11" fill="#EDF5F0" font-weight="bold" x="590">TPOT × (токены выхода − 1)</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
