<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Speculative decoding" data-visual-system="byte-diagram-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="artifact-title">Speculative decoding</title>
  <desc>Draft-модель предлагает четыре токена. Целевая модель оценивает их параллельно, вероятностно принимает первые два, отклоняет третий, отбрасывает четвёртый и выбирает коррекцию из остаточного распределения целевой модели.</desc>
  <defs>
    <style>
      .draft-model { fill: #1B2621; stroke: #EDF5F0; stroke-width: 2; rx: 8; }
      .target-model { fill: #141D19; stroke: #EDF5F0; stroke-width: 2; rx: 8; }
      .token { fill: #141D19; stroke: #A8B8AF; stroke-width: 2; rx: 4; }
      .token-accepted { fill: #141D19; stroke: #A8B8AF; stroke-width: 2; rx: 4; }
      .token-rejected { fill: #141D19; stroke: #EDF5F0; stroke-width: 2; rx: 4; }
      .token-discard { fill: #141D19; stroke: #A8B8AF; stroke-width: 2; stroke-dasharray: 4,4; rx: 4; }
      .arrow { stroke: #EDF5F0; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-red { stroke: #EDF5F0; stroke-width: 2; marker-end: url(#arrowhead-red); }
      .text { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 14px; text-anchor: middle; fill: #A8B8AF; font-weight: bold; }
      .desc { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 12px; text-anchor: middle; fill: #141D19; }
      .title { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; fill: #A8B8AF; }
      .subtitle { font-family: IBM Plex Sans, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #141D19; text-anchor: start; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#141D19" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1B2621" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="100%" height="100%" fill="#0C1210" />
  <text x="500" y="30" class="title">Speculative decoding</text>

  <!-- Step 1: Draft Model -->
  <text x="40" y="75" class="subtitle">1. Генерация draft (последовательная, упирается в память)</text>

  <rect x="50" y="95" width="140" height="60" class="draft-model" />
  <text x="120" y="120" class="text" style="fill: #141D19">Draft-модель</text>
  <text x="120" y="140" class="desc" style="fill: #141D19">Меньшая draft-модель</text>

  <line x1="190" y1="125" x2="230" y2="125" class="arrow" />

  <!-- Draft Tokens -->
  <rect x="250" y="105" width="50" height="40" class="token" />
  <text x="275" y="130" class="text">T₁</text>

  <line x1="300" y1="125" x2="330" y2="125" class="arrow" />

  <rect x="340" y="105" width="50" height="40" class="token" />
  <text x="365" y="130" class="text">T₂</text>

  <line x1="390" y1="125" x2="420" y2="125" class="arrow" />

  <rect x="430" y="105" width="50" height="40" class="token" />
  <text x="455" y="130" class="text">T₃</text>

  <line x1="480" y1="125" x2="510" y2="125" class="arrow" />

  <rect x="520" y="105" width="50" height="40" class="token" />
  <text x="545" y="130" class="text">T₄</text>

  <!-- Bracket for Candidate Tokens -->
  <line x1="250" y1="155" x2="250" y2="170" stroke="#EDF5F0" stroke-width="2" />
  <line x1="570" y1="155" x2="570" y2="170" stroke="#EDF5F0" stroke-width="2" />
  <line x1="250" y1="170" x2="570" y2="170" stroke="#EDF5F0" stroke-width="2" />

  <text x="410" y="195" class="subtitle" text-anchor="middle">K=4 токена-кандидата</text>
  <line x1="410" y1="205" x2="410" y2="245" class="arrow" />

  <!-- Step 2: Verification -->
  <text x="40" y="235" class="subtitle">2. Оценка целевой моделью и скорректированная выборка</text>

  <rect x="50" y="255" width="140" height="60" class="target-model" />
  <text x="120" y="280" class="text">Целевая модель</text>
  <text x="120" y="300" class="desc">Более крупная целевая модель</text>

  <line x1="190" y1="285" x2="230" y2="285" class="arrow" />

  <!-- Verification Block -->
  <rect x="230" y="255" width="340" height="60" fill="#141D19" stroke="#A8B8AF" stroke-width="2" stroke-dasharray="4,4" class="visual-focus" />
  <text x="400" y="280" class="text">Оценивает все K позиций за один проход целевой модели</text>
  <text x="400" y="300" class="desc">Принимает слева направо с вероятностью min(1, p(token) / q(token))</text>

  <line x1="570" y1="285" x2="610" y2="285" class="arrow" />

  <!-- Result Tokens Space Increased! -->
  <rect x="600" y="265" width="50" height="40" class="token-accepted" />
  <text x="625" y="290" class="text">T₁</text>

  <rect x="670" y="265" width="50" height="40" class="token-accepted" />
  <text x="695" y="290" class="text">T₂</text>

  <!-- Rejected token -->
  <rect x="740" y="265" width="50" height="40" class="token-rejected" />
  <text x="765" y="290" class="text">T₃</text>

  <!-- Discarded token -->
  <rect x="810" y="265" width="50" height="40" class="token-discard" />
  <text x="835" y="290" class="text" fill="#EDF5F0">T₄</text>

  <!-- Correction sampled after the first rejection -->
  <path d="M765 265 V250 H925 V255" fill="none" class="arrow-red" />
  <rect x="900" y="265" width="50" height="40" class="token-accepted" />
  <text x="925" y="290" class="text">C₃</text>

  <!-- Result Text safely spaced apart -->
  <text x="660" y="330" class="desc" fill="#EDF5F0" font-weight="bold">Принят</text>
  <text x="765" y="330" class="desc" fill="#EDF5F0" font-weight="bold">Отклонён</text>
  <text x="835" y="330" class="desc" fill="#EDF5F0" font-weight="bold">Отброшен</text>
  <text x="925" y="326" class="desc" fill="#EDF5F0" font-weight="bold">Остаточное распределение</text>
  <text x="925" y="342" class="desc" fill="#EDF5F0" font-weight="bold">выборка</text>
  <text x="770" y="235" class="desc" fill="#EDF5F0">После отклонения: выбрать C₃ из нормированного max(0, p − q)</text>

  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif !important; fill: #EDF5F0 !important; }
    text[class*="kind"], text[class*="section"], text[class*="tag"], text[class*="step"], text[class*="axis"] { font-family: "IBM Plex Mono", ui-monospace, monospace !important; font-weight: 600; letter-spacing: 1.1px; }
    text[class*="title"], text[class*="heading"], text[class*="name"] { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif !important; font-weight: 600; }
    svg { background: #0C1210; }
    marker polygon, marker path { fill: #A8B8AF !important; stroke: none !important; }
    .visual-focus { fill: #2B1622 !important; stroke: #FF6FB6 !important; stroke-width: 2.5 !important; }
    .visual-focus text { fill: #FF6FB6 !important; }
  </style>
</svg>
