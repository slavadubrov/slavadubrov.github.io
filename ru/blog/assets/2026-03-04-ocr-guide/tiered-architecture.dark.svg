<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-routing-title ocr-routing-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-routing-title">Продакшеновый OCR направляет документы через откалиброванные уровни fallback</title>
  <desc id="ocr-routing-desc">Входящие документы сначала проверяют нативный текст. При сбое проверки они проходят через быстрый OCR и более мощную модель. Успешные маршруты сходятся на постобработке и structured output; неразрешённые поля с высоким риском передаются на ручную проверку.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .branch { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.1px; fill: #A8B8AF; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="688" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">ПРОДАКШЕНОВЫЙ РОУТЕР · ЭСКАЛАЦИЯ ТОЛЬКО ПРИ СБОЕ GATE</text>

  <rect x="48" y="88" width="152" height="96" rx="10" fill="#141D19" stroke="#A8B8AF" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="68" y="122">ВНЕШНИЕ ДАННЫЕ</text><text class="name" x="68" y="150">Документы</text>

  <path class="box" d="M336 88 432 136 336 184 240 136Z" />
  <text class="kind" x="336" y="128" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="336" y="151" text-anchor="middle">Текст пригоден?</text>
  <path class="edge" d="M200 136h32" marker-end="url(#ocr-routing-arrow)" />

  <rect class="box" x="176" y="240" width="248" height="96" rx="10" />
  <text class="kind" x="196" y="274">ОБРАБОТКА</text><text class="name" x="196" y="302">Быстрый локальный OCR</text>
  <text class="note" x="196" y="322" style="font-size: 11px;">Растеризация · нормализация · извлечение</text>
  <path class="edge" d="M336 184v24h-36v24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="348" y="208">НЕТ</text>

  <path class="box" d="M560 240 656 288 560 336 464 288Z" />
  <text class="kind" x="560" y="280" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="560" y="303" text-anchor="middle">Gate пройден?</text>
  <path class="edge" d="M424 288h32" marker-end="url(#ocr-routing-arrow)" />

  <rect class="box" x="176" y="392" width="248" height="96" rx="10" />
  <text class="kind" x="196" y="426">ОБРАБОТКА</text><text class="name" x="196" y="454">Более мощная модель</text>
  <text class="note" x="196" y="474" style="font-size: 11px;">Разметка · повреждённые страницы · поля</text>
  <path class="edge" d="M560 336v24H300v24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="572" y="360">НЕТ</text>

  <path class="box" d="M560 392 656 440 560 488 464 440Z" />
  <text class="kind" x="560" y="432" text-anchor="middle">РЕШЕНИЕ</text>
  <text class="name" x="560" y="455" text-anchor="middle">Gate пройден?</text>
  <path class="edge" d="M424 440h32" marker-end="url(#ocr-routing-arrow)" />

  <rect x="448" y="544" width="224" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="468" y="578" fill="#FF6FB6">ФОКУС</text>
  <text class="name" x="468" y="606" fill="#FF6FB6">Ручная проверка</text>
  <text class="note" x="468" y="626" style="font-size: 11px;">Неразрешённые поля или поля с высоким риском</text>
  <path class="edge" d="M560 488v48" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="572" y="520">НЕТ</text>

  <rect class="box" x="736" y="88" width="176" height="96" rx="10" />
  <text class="kind" x="756" y="122">ОБРАБОТКА</text><text class="name" x="756" y="150">Постобработка</text>
  <path class="edge" d="M432 136h296" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="448" y="124">ДА · НАТИВНЫЙ ТЕКСТ</text>

  <rect x="736" y="240" width="176" height="96" rx="10" fill="#1B2621" stroke="#EDF5F0" stroke-width="1.5" />
  <text class="kind" x="756" y="274">СОХРАНЕНИЕ</text><text class="name" x="756" y="302">Structured output</text>
  <path class="edge" d="M824 184v48" marker-end="url(#ocr-routing-arrow)" />

  <path class="edge" d="M656 288h48M656 440h48M672 592h32M704 592V136h24" marker-end="url(#ocr-routing-arrow)" />
  <text class="branch" x="672" y="276">ДА</text>
  <text class="branch" x="672" y="428">ДА</text>
  <text class="branch" x="688" y="580">ПРОВЕРЕНО</text>

  <path d="M48 656h864" stroke="#2B3B33" stroke-width="1" />
  <text class="note" x="48" y="680">Калибруйте каждый gate с учётом класса документа, критичности поля и размеченных результатов.</text>

  <defs>
    <marker id="ocr-routing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
