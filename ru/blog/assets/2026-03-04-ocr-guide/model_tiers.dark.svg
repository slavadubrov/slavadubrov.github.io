<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-tiers-title ocr-tiers-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-tiers-title">Сравнение трёх семейств OCR-моделей по соответствию нагрузке</title>
  <desc id="ocr-tiers-desc">Традиционный OCR, специализированные модели документов и универсальные VLM охватывают всё более широкий спектр задач, но режим деплоя зависит от продукта. Все три варианта следует тестировать на одной и той же размеченной нагрузке.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #A8B8AF; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .box { fill: #141D19; stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #A8B8AF; stroke-width: 1.5; }
  </style>
  <rect width="960" height="464" rx="14" fill="#0C1210" />
  <text class="section" x="48" y="48">СРАВНЕНИЕ СЕМЕЙСТВ МОДЕЛЕЙ</text>

  <rect class="box" x="48" y="72" width="264" height="96" rx="10" />
  <text class="kind" x="68" y="106">СЕМЕЙСТВО</text><text class="name" x="68" y="134">Традиционный OCR</text>
  <rect class="box" x="352" y="72" width="264" height="96" rx="10" />
  <text class="kind" x="372" y="106">СЕМЕЙСТВО</text><text class="name" x="372" y="134"><tspan x="372">Специализированные</tspan><tspan x="372" dy="1.2em">модели</tspan></text>
  <rect class="box" x="656" y="72" width="264" height="96" rx="10" />
  <text class="kind" x="676" y="106">СЕМЕЙСТВО</text><text class="name" x="676" y="134">Универсальные VLM</text>

  <rect class="box" x="48" y="188" width="264" height="64" rx="10" />
  <text class="kind" x="68" y="212">ШИРОТА ЗАДАЧ</text>
  <text class="note" x="68" y="238" style="font-size: 11px;">Чистая печать · ограниченный набор скриптов</text>
  <rect class="box" x="352" y="188" width="264" height="64" rx="10" />
  <text class="kind" x="372" y="212">ШИРОТА ЗАДАЧ</text>
  <text class="note" x="372" y="238">Лэйаут · таблицы · формулы</text>
  <rect class="box" x="656" y="188" width="264" height="64" rx="10" />
  <text class="kind" x="676" y="212">ШИРОТА ЗАДАЧ</text>
  <text class="note" x="676" y="238">Извлечение · VQA · ризонинг</text>

  <rect class="box" x="48" y="272" width="264" height="64" rx="10" />
  <text class="kind" x="68" y="296">ДЕПЛОЙ</text>
  <text class="note" x="68" y="322">Локальный CPU или self-hosted</text>
  <rect class="box" x="352" y="272" width="264" height="64" rx="10" />
  <text class="kind" x="372" y="296">ДЕПЛОЙ</text>
  <text class="note" x="372" y="322">Self-hosted GPU или API</text>
  <rect class="box" x="656" y="272" width="264" height="64" rx="10" />
  <text class="kind" x="676" y="296">ДЕПЛОЙ</text>
  <text class="note" x="676" y="322">Hosted API или открытые веса</text>

  <path class="edge" d="M180 336v16h304" />
  <path class="edge" d="M484 336v16" />
  <path class="edge" d="M788 336v16H484" />
  <path class="edge" d="M484 352v16" marker-end="url(#ocr-tiers-arrow)" />

  <rect x="240" y="376" width="480" height="62" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="260" y="400" fill="#FF6FB6">ФОКУС</text>
  <text class="name" x="260" y="424" fill="#FF6FB6">Тестировать одну и ту же размеченную нагрузку</text>

  <defs>
    <marker id="ocr-tiers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF" />
    </marker>
  </defs>
</svg>
