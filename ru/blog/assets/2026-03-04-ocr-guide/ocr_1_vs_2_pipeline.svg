<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ocr-compare-title ocr-compare-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ocr-compare-title">Модульный OCR в сравнении с совместным vision-language инференсом</title>
  <desc id="ocr-compare-desc">Модульный путь последовательно выполняет детекцию, распознавание и постобработку, а затем сохраняет обычный текст. Совместный vision-language путь объединяет инференс и сохраняет текст вместе со структурой, тогда как растеризация и парсинг вывода остаются за пределами модели.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .box { fill: #FFFFFF; stroke: #17211B; stroke-width: 1.5; }
    .edge { fill: none; stroke: #59645E; stroke-width: 1.5; }
  </style>
  <rect width="960" height="424" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="48">МОДУЛЬНЫЙ OCR · ТРИ ПОСЛЕДОВАТЕЛЬНЫХ ЭТАПА</text>

  <rect x="48" y="80" width="128" height="62" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="64" y="104">ВНЕШНИЙ КОНТУР</text><text class="name" x="64" y="128">Документ</text>
  <rect class="box" x="216" y="80" width="144" height="62" rx="10" />
  <text class="kind" x="232" y="104">ПРОЦЕСС</text><text class="name" x="232" y="128" style="font-size: 13px;">Детекция областей</text>
  <rect class="box" x="400" y="80" width="144" height="62" rx="10" />
  <text class="kind" x="416" y="104">ПРОЦЕСС</text><text class="name" x="416" y="128">Чтение текста</text>
  <rect class="box" x="584" y="80" width="144" height="62" rx="10" />
  <text class="kind" x="600" y="104">ПРОЦЕСС</text><text class="name" x="600" y="128">Постобработка</text>
  <rect x="768" y="80" width="144" height="62" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="784" y="104">СОХРАНЕНИЕ</text><text class="name" x="784" y="128">Обычный текст</text>

  <path class="edge" d="M176 111h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M360 111h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M544 111h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M728 111h32" marker-end="url(#ocr-compare-arrow)" />
  <text class="note" x="48" y="174">Каждый этап может передать ошибку дальше; оценивайте и символы, и downstream-поля.</text>

  <path d="M48 208h864" stroke="#D8DDD9" stroke-width="1" />
  <text class="section" x="48" y="248">JOINT VLM · ОДИН ЭТАП ИНФЕРЕНСА</text>

  <rect x="48" y="280" width="128" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="64" y="314">ВНЕШНИЙ КОНТУР</text><text class="name" x="64" y="342">Документ</text>
  <rect x="216" y="280" width="328" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="236" y="314" fill="#C50E72">ФОКУС</text><text class="name" x="236" y="342" fill="#C50E72">Vision + language инференс</text>
  <rect x="584" y="280" width="328" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="604" y="314">СОХРАНЕНИЕ</text><text class="name" x="604" y="342">Текст + структура</text>
  <path class="edge" d="M176 328h32" marker-end="url(#ocr-compare-arrow)" />
  <path class="edge" d="M544 328h32" marker-end="url(#ocr-compare-arrow)" />
  <text class="note" x="48" y="408">Растеризация, нормализация и парсинг вывода по-прежнему окружают модель.</text>

  <defs>
    <marker id="ocr-compare-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
</svg>
