      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff" />
      <text x="38" y="37" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">MAIL</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">
        <tspan x="76" y="14">Электронные письма</tspan>
        <tspan x="76" y="29">и вложения</tspan>
      </text>
      <text x="76" y="47" font-size="11" fill="#64748b">
        <tspan x="76" y="46">Встроенные изображения,</tspan>
        <tspan x="76" y="59">PDF-файлы</tspan>
      </text>
    </g>
  </g>
  <line x1="288" y1="296" x2="350" y2="296" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)" />
  <g transform="translate(360 108)">
