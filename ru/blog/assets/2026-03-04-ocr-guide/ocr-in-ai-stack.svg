      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">Tesseract, PaddleOCR</text>
    </g>
    <g transform="translate(14 150)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">VLMs</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">Gemini, Claude, GPT</text>
    </g>
    <g transform="translate(14 206)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Специализированный Модели</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">dots.ocr, Qwen3-VL</text>
    </g>
    <g transform="translate(14 262)">
      <rect width="212" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="106" y="20" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Анализ разметки</text>
      <text x="106" y="38" font-size="11" fill="#64748b" text-anchor="middle">Tables, headers, lists</text>
    </g>
    <line x1="120" y1="313" x2="120" y2="320" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)" />
    <rect x="24" y="328" width="192" height="54" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <text x="120" y="347" font-size="11" font-weight="600" fill="#9a3412" text-anchor="middle">
      <tspan x="120" y="339">Результат: очищенный текст,</tspan>
      <tspan x="120" y="354">таблицы.</tspan>
    </text>
    <text x="120" y="374" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">структура и метаданные</text>
  </g>
  <line x1="600" y1="296" x2="662" y2="296" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)" />
  <g transform="translate(672 108)">
    <rect width="240" height="38" rx="8" fill="#7c3aed" />
    <text x="120" y="25" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Системы нижнего уровня</text>
    <g transform="translate(0 50)">
      <rect width="240" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="120" y="26" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">RAG Пайплайны</text>
      <text x="120" y="48" font-size="11" fill="#64748b" text-anchor="middle">Chunk → Embed → Vector DB</text>
      <text x="120" y="65" font-size="12" fill="#64748b" text-anchor="middle">→ Retrieve → LLM Answer</text>
    </g>
    <g transform="translate(0 138)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="120" y="27" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">ИИ-агенты</text>
      <text x="120" y="48" font-size="11" fill="#64748b" text-anchor="middle">
        <tspan x="120" y="43">Чтение документов, заполнение</tspan>
        <tspan x="120" y="58">форм</tspan>
      </text>
    </g>
    <g transform="translate(0 212)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="120" y="27" font-size="11" font-weight="600" fill="#5b21b6" text-anchor="middle" textLength="216" lengthAdjust="spacingAndGlyphs">корпоративное тестирование качества</text>
      <text x="120" y="48" font-size="11" fill="#64748b" text-anchor="middle">
        <tspan x="120" y="43">Поиск контрактов, соблюдение</tspan>
        <tspan x="120" y="58">нормативов, базы знаний</tspan>
      </text>
    </g>
    <g transform="translate(0 286)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="120" y="27" font-size="15" font-weight="600" fill="#5b21b6" text-anchor="middle">Применения в домене</text>
      <text x="120" y="48" font-size="11" fill="#64748b" text-anchor="middle">
        <tspan x="120" y="43">медицинский, юридический,</tspan>
        <tspan x="120" y="58">финансовый</tspan>
      </text>
    </g>
  </g>
  <g transform="translate(144 494)">
    <rect width="672" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
    <text x="336" y="21" font-size="13.8" font-weight="600" fill="#9a3412" text-anchor="middle">Отсутствие текста или нарушение структуры снижают качество последующей обработки</text>
    <text x="336" y="39" font-size="12" fill="#64748b" text-anchor="middle">Оценивайте процесс извлечения перед retrieval, генерацией и принятием решений агентом.</text>
