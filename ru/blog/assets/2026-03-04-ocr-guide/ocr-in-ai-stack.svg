      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff" />
      <text x="38" y="37" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">PDF</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">
        <tspan x="76" y="14">файлы PDF и</tspan>
        <tspan x="76" y="29">документы Word</tspan>
      </text>
      <text x="76" y="47" font-size="11" fill="#64748b">
        <tspan x="76" y="46">Контракты, отчеты,</tspan>
        <tspan x="76" y="59">руководства</tspan>
      </text>
    </g>
    <g transform="translate(0 124)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff" />
      <text x="38" y="37" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">SCAN</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">
        <tspan x="76" y="14">Отсканированные</tspan>
        <tspan x="76" y="29">документы</tspan>
      </text>
      <text x="76" y="47" font-size="11" fill="#64748b">
        <tspan x="76" y="46">счета-фактуры,</tspan>
        <tspan x="76" y="59">квитанции, формы</tspan>
      </text>
    </g>
    <g transform="translate(0 198)">
      <rect width="240" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="14" y="15" width="48" height="34" rx="6" fill="#eff6ff" />
      <text x="38" y="37" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">PHOTO</text>
      <text x="76" y="27" font-size="14" font-weight="600" fill="#0f172a">
        <tspan x="76" y="14">Фотографии и</tspan>
        <tspan x="76" y="29">скриншоты</tspan>
      </text>
      <text x="76" y="47" font-size="11" fill="#64748b">
        <tspan x="76" y="46">доски для записей,</tspan>
        <tspan x="76" y="59" textLength="150" lengthAdjust="spacingAndGlyphs">знаки, интерфейс пользователя</tspan>
      </text>
    </g>
    <g transform="translate(0 272)">
