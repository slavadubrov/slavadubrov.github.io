<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Трехуровневая схема модель, демонстрирующая традиционные движки (Tesseract, PaddleOCR, EasyOCR), специализированные решения VLMs (dots.ocr, GOT-OCR, DeepSeek-OCR) и передовые модели VLMs (Gemini, Claude, GPT) с учётом баланса между точностью и затратами</title>
