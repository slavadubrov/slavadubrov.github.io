<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="100%" height="100%" role="img" aria-labelledby="artifact-title artifact-desc" data-visual-system="evidence-plate-v1" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="Inter, system-ui, sans-serif">
  <title id="artifact-title">Архитектура производственного уровня с иерархией обработки на основе уровня уверенности роутинг: документы проходят предварительную обработку, затем обрабатываются на уровне 1 (PaddleOCR/Tesseract); результаты с низким уровнем уверенности передаются на уровень 2 (Qwen3-VL и др. ocr), а затем — на уровень 3 (Gemini Pro/GPT-5.2), после чего происходит постобработка и проверка человеком</title>
  <desc id="artifact-desc">Архитектура производственного уровня с иерархией обработки на основе уровня уверенности роутинг: документы проходят предварительную обработку, затем обрабатываются на уровне 1 (PaddleOCR/Tesseract); результаты с низким уровнем уверенности передаются на уровень 2 (Qwen3-VL и др. ocr), а затем — на уровень 3 (Gemini Pro/GPT-5.2), после чего происходит постобработка и проверка человеком</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" />
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1120" height="720" rx="14" fill="#f8fafc" />
  <text x="48" y="48" font-size="24" font-weight="700" fill="#0f172a">Производственная среда OCR: многоуровневая роутинг</text>
  <text x="48" y="74" font-size="14" fill="#64748b">Калибровать каждый контрольный этап качества для классов документов с метками</text>
  <g transform="translate(48 280)">
    <rect width="142" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
    <text x="71" y="34" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">Входящий</text>
    <text x="71" y="55" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">документация</text>
    <text x="71" y="79" font-size="12.9" fill="#64748b" text-anchor="middle">PDF, изображения</text>
  </g>
  <line x1="190" y1="330" x2="218" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#blue-arrow)" />
  <g transform="translate(230 270)">
    <rect width="170" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="85" y="30" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Предобработка</text>
    <text x="85" y="56" font-size="11" fill="#64748b" text-anchor="middle">
      <tspan x="85" y="49">Устранение смещения,</tspan>
      <tspan x="85" y="64">бинаризация</tspan>
    </text>
    <text x="85" y="82" font-size="13" fill="#64748b" text-anchor="middle">Нормализация DPI</text>
    <text x="85" y="104" font-size="13" fill="#64748b" text-anchor="middle">работники CPU</text>
  </g>
  <g transform="translate(454 98)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#2563eb" />
    <text x="135" y="27" font-size="12.9" font-weight="700" fill="#ffffff" text-anchor="middle">Уровень 1: быстрый локальный путь</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">PaddleOCR / Tesseract</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">CPU-only</text>
    <text x="135" y="116" font-size="13" fill="#64748b" text-anchor="middle">
      <tspan x="135" y="116">Очистка отпечатанных документов</tspan>
    </text>
    <text x="135" y="145" font-size="12.2" font-weight="600" fill="#166534" text-anchor="middle">Измерение процента успешных тестов</text>
  </g>
  <g transform="translate(454 276)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" />
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#ea580c" />
    <text x="135" y="27" font-size="14.1" font-weight="700" fill="#ffffff" text-anchor="middle">Уровень 2: более мощный модель</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Qwen3-VL / dots.ocr</text>
    <text x="135" y="94" font-size="13" fill="#64748b" text-anchor="middle">or Gemini 3 Flash</text>
    <text x="135" y="116" font-size="11" fill="#64748b" text-anchor="middle">
      <tspan x="135" y="108">Разметка и изображения с сниженным</tspan>
      <tspan x="135" y="124">качеством</tspan>
    </text>
    <text x="135" y="145" font-size="12.2" font-weight="600" fill="#9a3412" text-anchor="middle">Измерение процента успешных тестов</text>
  </g>
  <g transform="translate(454 454)">
    <rect width="270" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" />
    <path d="M 8 0 H 262 A 8 8 0 0 1 270 8 V 42 H 0 V 8 A 8 8 0 0 1 8 0 Z" fill="#7c3aed" />
    <text x="135" y="27" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Уровень 3: путь ревью</text>
    <text x="135" y="70" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Gemini 3 Pro / GPT-5.2</text>
    <text x="135" y="94" font-size="11.5" fill="#64748b" text-anchor="middle" textLength="240" lengthAdjust="spacingAndGlyphs">Размещённый на VLM или втором модель</text>
    <text x="135" y="116" font-size="13" fill="#64748b" text-anchor="middle">
      <tspan x="135" y="116">Сложные макеты, рукописный ввод</tspan>
    </text>
    <text x="135" y="145" font-size="13" font-weight="600" fill="#5b21b6" text-anchor="middle">Измерение коэффициента обзоров</text>
  </g>
  <path d="M 400 330 H 426 V 173 H 454" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)" />
  <line x1="724" y1="173" x2="758" y2="173" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)" />
  <g transform="translate(770 125)">
    <rect width="132" height="96" rx="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="66" y="40" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">шлюз качества</text>
    <text x="66" y="61" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">проходят?</text>
  </g>
  <path d="M 902 173 H 910 V 206 H 920" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)" />
  <text x="910" y="160" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Да</text>
  <path d="M 836 221 V 254 H 426 V 351 H 454" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)" />
  <text x="850" y="244" font-size="13" font-weight="700" fill="#dc2626">Нет</text>
  <line x1="724" y1="351" x2="758" y2="351" stroke="#ea580c" stroke-width="2" marker-end="url(#orange-arrow)" />
  <g transform="translate(770 303)">
    <rect width="132" height="96" rx="48" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="66" y="40" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">шлюз качества</text>
    <text x="66" y="61" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">проходят?</text>
  </g>
  <path d="M 902 351 H 910 V 336 H 920" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#green-arrow)" />
  <text x="910" y="338" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">Да</text>
  <path d="M 836 399 V 432 H 426 V 529 H 454" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)" />
  <text x="850" y="422" font-size="13" font-weight="700" fill="#dc2626">Нет</text>
  <path d="M 724 529 H 900 V 490 H 920" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple-arrow)" />
  <g transform="translate(920 104)">
    <rect width="164" height="500" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <text x="82" y="44" font-size="17" font-weight="700" fill="#166534" text-anchor="middle">постобработка</text>
    <text x="82" y="76" font-size="13" fill="#0f172a" text-anchor="middle">
      <tspan x="82" y="80">Проверка схемы</tspan>
    </text>
    <text x="82" y="116" font-size="12.5" fill="#0f172a" text-anchor="middle">
      <tspan x="82" y="112">Фильтрация по</tspan>
      <tspan x="82" y="128">уровню уверенности</tspan>
    </text>
    <text x="82" y="156" font-size="13" fill="#0f172a" text-anchor="middle">
      <tspan x="82" y="152">Проверка</tspan>
      <tspan x="82" y="168">орфографии / LM</tspan>
    </text>
    <line x1="30" y1="190" x2="134" y2="190" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="82" y="226" font-size="13.4" font-weight="700" fill="#166534" text-anchor="middle">структурированный</text>
    <text x="82" y="248" font-size="15.2" font-weight="700" fill="#166534" text-anchor="middle">Выходные данные</text>
    <text x="82" y="276" font-size="13" fill="#0f172a" text-anchor="middle">JSON / Markdown</text>
    <line x1="30" y1="304" x2="134" y2="304" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="82" y="340" font-size="13" fill="#991b1b" text-anchor="middle">нерешённые или</text>
    <text x="82" y="361" font-size="11" fill="#991b1b" text-anchor="middle">
      <tspan x="82" y="354">области с высоким</tspan>
      <tspan x="82" y="370">уровнем риска:</tspan>
    </text>
    <rect x="18" y="400" width="128" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
    <text x="82" y="426" font-size="11.1" font-weight="700" fill="#991b1b" text-anchor="middle">Проверка человеком</text>
    <text x="82" y="464" font-size="11" fill="#64748b" text-anchor="middle">
      <tspan x="82" y="456">Запись журнала</tspan>
      <tspan x="82" y="472">аудита сохранена</tspan>
    </text>
  </g>
  <g transform="translate(48 650)">
    <rect width="1036" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="130" y="35" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">
      <tspan x="130" y="35">Отслеживание стоимости CPU</tspan>
    </text>
    <text x="390" y="35" font-size="13" font-weight="600" fill="#9a3412" text-anchor="middle">
