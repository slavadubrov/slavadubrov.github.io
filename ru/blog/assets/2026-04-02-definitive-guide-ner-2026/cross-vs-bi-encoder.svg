<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="cb-title cb-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="cb-title">Для переиспользуемого инвентаря меток нужны cross-encoder и bi-encoder</title>
  <desc id="cb-desc">Cross-encoder совместно пере-кодирует метки с каждым документом. Bi-encoder отдельно кодирует метки и текст, поэтому эмбеддинги меток можно кэшировать и переиспользовать. Фокус — на переиспользуемом кэше.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .section { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.6px; fill: #59645E; }
    .metric { font: 600 15px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="608" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="cb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645E" />
    </marker>
  </defs>
  <rect class="group" x="48" y="48" width="412" height="512" rx="12" />
  <rect class="group" x="500" y="48" width="412" height="512" rx="12" />
  <text class="section" x="72" y="80">CROSS-ENCODER · ПОВТОРНАЯ РАБОТА</text>
  <text class="section" x="524" y="80">BI-ENCODER · ПОВТОРНОЕ ИСПОЛЬЗОВАНИЕ</text>
  <path class="edge" d="M254 158v32" marker-end="url(#cb-arrow)" />
  <path class="edge" d="M254 252v40" marker-end="url(#cb-arrow)" />
  <path class="edge" d="M594 158v32" marker-end="url(#cb-arrow)" />
  <path class="edge" d="M818 158v32" marker-end="url(#cb-arrow)" />
  <path class="edge" d="M594 252v40" marker-end="url(#cb-arrow)" />
  <path class="edge" d="M818 252v16h86v142h-86v18" marker-end="url(#cb-arrow)" />
  <path class="edge" d="M706 388v40" marker-end="url(#cb-arrow)" />
  <rect class="box" x="72" y="96" width="364" height="62" rx="10" fill="#F2F2F5" />
  <text class="kind" x="92" y="121">ВХОД</text><text class="name" x="92" y="146">Метки + текст в одной последовательности</text>
  <rect class="box" x="72" y="190" width="364" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="92" y="215">ПРОЦЕСС</text><text class="name" x="92" y="240">Совместный аттеншн по обоим</text>
  <rect class="box" x="72" y="292" width="364" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="92" y="326">ПРОЦЕСС</text><text class="name" x="92" y="354">Оценка span × типа</text>
  <text class="note" x="92" y="376">Для каждого документа кодирование меток повторяется.</text>
  <text class="kind" x="72" y="448">ПРИ 1 024 ТИПАХ</text><text class="metric" x="72" y="478">10,7 → 0,14 примера/с</text>
  <text class="note" x="72" y="504">gliner_small-v2.5 · снижение на 98,7%</text><text class="note" x="72" y="530">Один H100 · batch 1 · условия из статьи</text>
  <rect class="box" x="524" y="96" width="140" height="62" rx="10" fill="#F2F2F5" />
  <text class="kind" x="544" y="121">МЕТКИ</text><text class="name" x="544" y="146">Список типов</text>
  <rect class="box" x="748" y="96" width="140" height="62" rx="10" fill="#F2F2F5" />
  <text class="kind" x="768" y="121">ТЕКСТ</text><text class="name" x="768" y="146">Документ</text>
  <rect class="box" x="524" y="190" width="140" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="544" y="215">ПРОЦЕСС</text><text class="name" x="544" y="240">Энкодер меток</text>
  <rect class="box" x="748" y="190" width="140" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="768" y="215">ПРОЦЕСС</text><text class="name" x="768" y="240">Энкодер текста</text>
  <rect x="524" y="292" width="364" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="548" y="326" fill="#C50E72">ФОКУС · ХРАНЕНИЕ</text><text class="name" x="548" y="354" fill="#C50E72">Кэшированные эмбеддинги меток</text>
  <text class="note" x="548" y="376" fill="#C50E72">Вычислить один раз; переиспользовать для разных документов.</text>
  <rect class="box" x="524" y="428" width="364" height="62" rx="10" fill="#FFFFFF" />
  <text class="kind" x="548" y="453">ПРОЦЕСС</text><text class="name" x="548" y="478">Поздняя оценка span × типа</text>
  <text class="kind" x="524" y="524">ПРИ 1 024 ТИПАХ</text><text class="metric" x="524" y="550">19,3 → 18,3 примера/с · снижение на 5,2%</text>
  <text class="note" x="524" y="578">Предвычисленный gliner-bi-edge-v2.0 · до 130× в статье</text>
</svg>
