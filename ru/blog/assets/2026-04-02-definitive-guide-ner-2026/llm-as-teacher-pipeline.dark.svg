<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="lt-title lt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="lt-title">От NER-меток, сгенерированных LLM, к готовому к деплою энкодеру</title>
  <desc id="lt-desc">Шесть последовательных шагов: от сырых заголовков через разметку LLM, проверку человеком и файн-тюнинг энкодера. Отложенный контроль качества и полной стоимости определяет, деплоить ли энкодер.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .marker-num { font: 600 13px "IBM Plex Mono", ui-monospace, monospace; fill: #0C1210; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .external { stroke: #A8B8AF; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="536" rx="14" fill="#0C1210" />
  <defs><marker id="lt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <path class="edge" d="M288 112h72" marker-end="url(#lt-arrow)" /><path class="edge" d="M600 112h72" marker-end="url(#lt-arrow)" /><path class="edge" d="M792 160v40" marker-end="url(#lt-arrow)" /><path class="edge" d="M672 248h-72" marker-end="url(#lt-arrow)" /><path class="edge" d="M360 248h-72" marker-end="url(#lt-arrow)" />
  <circle cx="62" cy="48" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="53" text-anchor="middle">1</text><circle cx="374" cy="48" r="14" fill="#EDF5F0" /><text class="marker-num" x="374" y="53" text-anchor="middle">2</text><circle cx="686" cy="48" r="14" fill="#EDF5F0" /><text class="marker-num" x="686" y="53" text-anchor="middle">3</text>
  <circle cx="686" cy="184" r="14" fill="#EDF5F0" /><text class="marker-num" x="686" y="189" text-anchor="middle">4</text><circle cx="374" cy="184" r="14" fill="#EDF5F0" /><text class="marker-num" x="374" y="189" text-anchor="middle">5</text><circle cx="62" cy="184" r="14" fill="#EDF5F0" /><text class="marker-num" x="62" y="189" text-anchor="middle">6</text>
  <rect class="box" x="48" y="64" width="240" height="96" rx="10" fill="#1B2621" /><text class="kind" x="72" y="98">ХРАНЕНИЕ · ИСТОЧНИК</text><text class="name" x="72" y="126">~900K заголовков</text><text class="note" x="72" y="148" style="font-size: 11px;">Неразмеченные финансовые новости.</text>
  <rect class="external" x="360" y="64" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="384" y="98">ВНЕШНИЙ · УЧИТЕЛЬ</text><text class="name" x="384" y="126">Метки Llama 3.1-70B</text><text class="note" x="384" y="148">Кейс: ~8 часов · ~$70.</text>
  <rect class="box" x="672" y="64" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="696" y="98">ПРОЦЕСС · ПРОВЕРКА</text><text class="name" x="696" y="126">Проверить 2 714 сэмплов</text><text class="note" x="696" y="148">Argilla · около 8 часов.</text>
  <rect class="box" x="672" y="200" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="696" y="234">ПРОЦЕСС · ОБУЧЕНИЕ</text><text class="name" x="696" y="262">Файн-тюнинг энкодера</text><text class="note" x="696" y="284">В кейсе — GLiNER-medium.</text>
  <rect x="360" y="200" width="240" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="384" y="234" fill="#FF6FB6">ФОКУС · КОНТРОЛЬ КАЧЕСТВА</text><text class="name" x="384" y="262" fill="#FF6FB6" style="font-size: 11px;">F1 на отложенной выборке + полная стоимость</text><text class="note" x="384" y="284" fill="#FF6FB6" style="font-size: 11px;">Принимать только измеримый прирост.</text>
  <rect class="box" x="48" y="200" width="240" height="96" rx="10" fill="#141D19" /><text class="kind" x="72" y="234">ПРОЦЕСС · ДЕПЛОЙ</text><text class="name" x="72" y="262">Сервинг на CPU</text><text class="note" x="72" y="284">Заявлено: 93,4% F1 · $0,10/ч.</text>
  <path d="M48 352h864" stroke="#2B3B33" stroke-width="1" /><text class="kind" x="48" y="388">СРАВНЕНИЕ В КЕЙСЕ · НЕ УНИВЕРСАЛЬНОЕ СООТНОШЕНИЕ СТОИМОСТИ</text>
  <text class="name" x="48" y="424">Учитель: 92,7% F1 · заявленная стоимость инстанса $8/ч</text><text class="name" x="48" y="458">Энкодер: 93,4% F1 · заявленная стоимость CPU-инстанса $0,10/ч</text><text class="note" x="48" y="496">В ваш гейт должны входить разметка, проверка, сервинг, переобучение и качество на конкретном домене.</text>
</svg>
