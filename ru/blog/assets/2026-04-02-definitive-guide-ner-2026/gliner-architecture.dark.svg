<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="ga-title ga-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="ga-title">Как GLiNER превращает метку и текстовый спан в единый скор сущности</title>
  <desc id="ga-desc">Метки и текст поступают в один энкодер DeBERTa. Модель строит эмбеддинги типов сущностей и представления кандидатных спанов, затем сравнивает каждую пару через скалярное произведение и sigmoid. На схеме в центре внимания — этот скор.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .formula { font: 600 16px "IBM Plex Mono", ui-monospace, monospace; fill: #FF6FB6; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="566" rx="14" fill="#0C1210" />
  <defs><marker id="ga-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker></defs>
  <path class="edge" d="M480 144v32" marker-end="url(#ga-arrow)" /><path class="edge" d="M480 238v24H232v32" marker-end="url(#ga-arrow)" /><path class="edge" d="M480 238v24h248v32" marker-end="url(#ga-arrow)" /><path class="edge" d="M232 390v24h248v32" marker-end="url(#ga-arrow)" /><path class="edge" d="M728 390v24H480v32" marker-end="url(#ga-arrow)" />
  <rect class="box" x="48" y="48" width="864" height="96" rx="10" fill="#1B2621" />
  <text class="kind" x="72" y="82">ВХОДНАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ</text><text class="name" x="72" y="111">[ENT] person · [ENT] organization · [SEP] Bill Gates founded Microsoft</text><text class="note" x="72" y="132">Метки и текст используют единый двунаправленный контекст.</text>
  <rect class="box" x="296" y="176" width="368" height="62" rx="10" fill="#141D19" />
  <text class="kind" x="320" y="201">ОБРАБОТКА</text><text class="name" x="320" y="226">Совместное кодирование DeBERTa</text>
  <rect class="box" x="48" y="294" width="368" height="96" rx="10" fill="#1B2621" />
  <text class="kind" x="72" y="328">ТИПЫ СУЩНОСТЕЙ</text><text class="name" x="72" y="356">Эмбеддинги типов q<tspan baseline-shift="sub" font-size="12">t</tspan></text><text class="note" x="72" y="378">Извлекаются из позиции каждого токена [ENT].</text>
  <rect class="box" x="544" y="294" width="368" height="96" rx="10" fill="#141D19" />
  <text class="kind" x="568" y="328">КАНДИДАТНЫЕ СПАНЫ</text><text class="name" x="568" y="356">Векторы спанов S<tspan baseline-shift="sub" font-size="12">ij</tspan></text><text class="note" x="568" y="378">FFN начального и конечного векторов; ширина ≤ 12.</text>
  <rect x="296" y="446" width="368" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" />
  <text class="kind" x="320" y="480" fill="#FF6FB6">ФОКУС · СКОР СОВПАДЕНИЯ</text><text class="formula" x="320" y="509">φ(i,j,t) = σ(S<tspan baseline-shift="sub" font-size="12">ij</tspan> · q<tspan baseline-shift="sub" font-size="12">t</tspan>)</text><text class="note" x="320" y="531" fill="#FF6FB6">Оставьте пары «спан–тип» выше порога.</text>
</svg>
