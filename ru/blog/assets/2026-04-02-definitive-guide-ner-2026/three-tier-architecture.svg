<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="tt-title tt-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="tt-title">Трёхуровневый роутинг NER по форме задачи извлечения</title>
  <desc id="tt-desc">Запрос на извлечение направляется по форме задачи. Явные спаны — к энкодерам, совместные задачи и отношения — к GLiNER2 или GLiNER-Relex, а задачи с интенсивным ризонингом или маппингом на онтологию — к LLM со схемой и constrained decoding. Залогированные случаи с LLM пополняют следующий датасет для обучения энкодеров.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #59645E; }
    .name { font: 600 16px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #17211B; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #59645E; }
    .group { fill: none; stroke: #D8DDD9; stroke-width: 1; }
    .box { stroke: #17211B; stroke-width: 1.5; }
    .edge { stroke: #59645E; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="552" rx="14" fill="#F7F7F4" />
  <defs>
    <marker id="tt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker>
  </defs>
  <path class="edge" d="M256 96h40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40H168v40" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v80" marker-end="url(#tt-arrow)" />
  <path class="edge" d="M480 144v40h312v40" marker-end="url(#tt-arrow)" />
  <rect x="48" y="48" width="208" height="96" rx="10" fill="#F2F2F5" stroke="#17211B" stroke-width="1.5" />
  <text class="kind" x="72" y="82">ЗАПРОС</text><text class="name" x="72" y="110">Задача извлечения</text><text class="note" x="72" y="132">Текст + требуемая схема.</text>
  <rect x="296" y="48" width="368" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" />
  <text class="kind" x="320" y="82" fill="#C50E72">ФОКУС · РОУТЕР</text><text class="name" x="320" y="110" fill="#C50E72">Роутинг по форме задачи</text>
  <text class="note" x="320" y="132" fill="#C50E72">Не ранжируйте модели заново для каждого запроса.</text>
  <rect class="group" x="48" y="200" width="240" height="264" rx="12" /><rect class="group" x="360" y="200" width="240" height="264" rx="12" /><rect class="group" x="672" y="200" width="240" height="264" rx="12" />
  <rect class="box" x="72" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="92" y="258">УРОВЕНЬ 1 · ОБРАБОТКА</text><text class="name" x="92" y="286">Энкодерные модели</text><text class="note" x="92" y="308">Явные текстовые спаны.</text>
  <text class="kind" x="72" y="356">ВЫБОР ПО НАБОРУ ЛЕЙБЛОВ</text><text class="note" x="72" y="382">Cross-encoder · небольшой набор</text><text class="note" x="72" y="406">Bi-encoder · переиспользуемый набор</text><text class="note" x="72" y="430">Файн-тюненная модель · стабильный домен</text>
  <rect class="box" x="384" y="224" width="192" height="96" rx="10" fill="#FFFFFF" />
  <text class="kind" x="404" y="258">УРОВЕНЬ 2 · ОБРАБОТКА</text><text class="name" x="404" y="286">Совместное извлечение</text><text class="note" x="404" y="308">Несколько связанных задач.</text>
  <text class="kind" x="384" y="356">ПРОВЕРЬТЕ КОМПОЗИЦИЮ</text><text class="note" x="384" y="382">GLiNER2 · NER + поля + класс</text><text class="note" x="384" y="406">GLiNER-Relex · спаны + отношения</text><text class="note" x="384" y="430">Оценивайте каждый выход отдельно</text>
  <rect x="696" y="224" width="192" height="96" rx="10" fill="#FFFFFF" stroke="#59645E" stroke-width="1.5" stroke-dasharray="6 5" />
  <text class="kind" x="716" y="258">УРОВЕНЬ 3 · ВНЕШНИЙ</text><text class="name" x="716" y="286">Структурированный LLM</text><text class="note" x="716" y="308">Инференс или маппинг.</text>
  <text class="kind" x="696" y="356">ОГРАНИЧЬТЕ ВЫХОД</text><text class="note" x="696" y="382">Нативная схема · Instructor</text><text class="note" x="696" y="406">Outlines · локальная генерация</text><text class="note" x="696" y="430">Добавляйте граундинг или разворачивайте on-premise по необходимости</text>
  <path class="edge" d="M792 464v32H168v-32" stroke-dasharray="2 6" marker-end="url(#tt-arrow)" />
  <rect x="338" y="484" width="284" height="24" rx="6" fill="#F7F7F4" />
  <text class="note" x="480" y="501" text-anchor="middle">залогированные случаи → следующий датасет для обучения уровня 1</text>
  <text class="note" x="48" y="534">Измеряйте распределение production-трафика; уровни описывают тип работы, а не фиксированный процент запросов.</text>
</svg>
