<text x="32" y="634" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Зависимости направлены к доменной политике; инфраструктура предоставляет реализации.</text>
