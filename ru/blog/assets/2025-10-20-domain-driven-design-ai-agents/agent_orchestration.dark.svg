<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" role="img"
     preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1"
     aria-labelledby="aod-title aod-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="aod-title">An orchestrator coordinates agents without owning their contexts</title>
  <desc id="aod-desc">A highlighted research orchestrator delegates to Trends, Compliance, and Cost agents. Each specialist retains a distinct bounded context, vocabulary, and rule owner.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .kind { font: 600 11px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 1.3px; fill: #A8B8AF; }
    .name { font: 600 17px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; fill: #EDF5F0; }
    .note { font: 400 13px "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; fill: #A8B8AF; }
    .box { stroke: #EDF5F0; stroke-width: 1.5; fill: #141D19; }
    .group { stroke: #2B3B33; stroke-width: 1.5; fill: none; }
    .edge { stroke: #A8B8AF; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="960" height="408" rx="14" fill="#0C1210"/>
  <rect x="336" y="40" width="288" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5"/>
  <text class="kind" x="356" y="72" fill="#FF6FB6">FOCUS · ORCHESTRATOR</text>
  <text class="name" x="356" y="100" fill="#FF6FB6">Coordinate research</text>
  <text class="note" x="356" y="122" fill="#FF6FB6">route work · combine results</text>
  <path class="edge" d="M480 136v48M480 160H176v24M480 160h304v24"/>
  <path class="edge" d="M176 184v24" marker-end="url(#aod-arrow)"/>
  <path class="edge" d="M480 184v24" marker-end="url(#aod-arrow)"/>
  <path class="edge" d="M784 184v24" marker-end="url(#aod-arrow)"/>
  <rect class="group" x="48" y="208" width="256" height="136" rx="12"/>
  <rect class="box" x="72" y="228" width="208" height="96" rx="10"/>
  <text class="kind" x="92" y="258">MARKET CONTEXT</text>
  <text class="name" x="92" y="284">Trends agent</text>
  <text class="note" x="92" y="308">trend · volume</text>
  <rect class="group" x="352" y="208" width="256" height="136" rx="12"/>
  <rect class="box" x="376" y="228" width="208" height="96" rx="10" fill="#1B2621"/>
  <text class="kind" x="396" y="258">POLICY CONTEXT</text>
  <text class="name" x="396" y="284">Compliance agent</text>
  <text class="note" x="396" y="308">risk · audit</text>
  <rect class="group" x="656" y="208" width="256" height="136" rx="12"/>
  <rect class="box" x="680" y="228" width="208" height="96" rx="10"/>
  <text class="kind" x="700" y="258">ESTIMATION CONTEXT</text>
  <text class="name" x="700" y="284">Cost agent</text>
  <text class="note" x="700" y="308">budget · OpEx</text>
  <text class="note" x="48" y="376">Coordination is an application concern; domain ownership stays with each context.</text>
  <defs>
    <marker id="aod-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#A8B8AF"/>
    </marker>
  </defs>
</svg>
