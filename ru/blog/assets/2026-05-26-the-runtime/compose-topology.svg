<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="compose-title compose-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif">
  <title id="compose-title">Эталонная топология Docker Compose</title>
  <desc id="compose-desc">Выделенный агентный воркер получает задания из очереди Redis, записывает чекпоинты в Postgres, извлекает память из Qdrant, вызывает инструменты через MCP-сайдкар, отправляет трейсы через OpenTelemetry и вызывает внешний API модели.</desc>
  <style data-visual-system="byte-diagram-v1">
    * { animation: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="compose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#59645e" />
    </marker>
  </defs>

  <rect width="960" height="620" rx="14" fill="#f7f7f4" />
  <text x="48" y="44" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">ЭТАЛОННЫЙ СТЕК · DOCKER COMPOSE</text>
  <text x="48" y="78" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">Один воркер владеет запуском; сервисы предоставляют персистентные возможности</text>
  <text x="48" y="102" fill="#59645e" font-size="13">Ядро сервисов использует внутреннюю сеть; MCP и observability подключаются опциональными профилями.</text>

  <rect x="48" y="126" width="864" height="374" rx="12" fill="none" stroke="#d8ddd9" stroke-width="1" stroke-dasharray="6 5" />
  <text x="68" y="150" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ГРАНИЦА · ВНУТРЕННЯЯ СЕТЬ</text>

  <!-- Edges sit behind nodes. -->
  <path d="M480 230V250" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M344 290H296" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M368 332 296 390" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M616 290H664" fill="none" stroke="#59645e" stroke-width="1.5" marker-end="url(#compose-arrow)" />
  <path d="M480 346V378" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#compose-arrow)" />
  <path d="M592 426H664" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="2 6" marker-end="url(#compose-arrow)" />
  <path d="M480 474V526" fill="none" stroke="#59645e" stroke-width="1.5" stroke-dasharray="7 6" marker-end="url(#compose-arrow)" />

  <rect x="368" y="168" width="224" height="62" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="388" y="194" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНИЛИЩЕ · ОЧЕРЕДЬ</text>
  <text x="388" y="218" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Redis</text>

  <rect x="344" y="250" width="272" height="96" rx="10" fill="#fdecf5" stroke="#f2148e" stroke-width="2.5" />
  <text x="364" y="282" fill="#c50e72" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ФОКУС · ВЛАДЕЛЕЦ ЗАПУСКА</text>
  <text x="364" y="312" fill="#c50e72" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Агентный воркер LangGraph</text>
  <text x="364" y="334" fill="#59645e" font-size="13">Харнесс · отдельный workspace для каждого thread_id</text>

  <rect x="72" y="250" width="224" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="92" y="282" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНИЛИЩЕ · ЧЕКПОИНТЫ</text>
  <text x="92" y="312" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Postgres</text>
  <text x="92" y="334" fill="#59645e" font-size="13">PostgresSaver · pgdata</text>

  <rect x="72" y="378" width="224" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="92" y="410" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНИЛИЩЕ · RETRIEVAL</text>
  <text x="92" y="440" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Qdrant</text>
  <text x="92" y="462" fill="#59645e" font-size="13">Холодная память · эмбеддинги</text>

  <rect x="664" y="250" width="224" height="96" rx="10" fill="#ffffff" stroke="#59645e" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="684" y="282" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ВНЕШНИЕ · ИНСТРУМЕНТЫ</text>
  <text x="684" y="312" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">MCP-сайдкар</text>
  <text x="684" y="334" fill="#59645e" font-size="13">OAuth-токены изолированы от воркера</text>

  <rect x="368" y="378" width="224" height="96" rx="10" fill="#ffffff" stroke="#17211b" stroke-width="1.5" />
  <text x="388" y="410" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ОБРАБОТКА · ТЕЛЕМЕТРИЯ</text>
  <text x="388" y="440" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Коллектор OpenTelemetry</text>
  <text x="388" y="462" fill="#59645e" font-size="13">Трейсы · метрики · логи</text>

  <rect x="664" y="378" width="224" height="96" rx="10" fill="#f2f2f5" stroke="#17211b" stroke-width="1.5" />
  <text x="684" y="410" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ХРАНИЛИЩЕ · OBSERVABILITY</text>
  <text x="684" y="440" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Tempo · Prometheus</text>
  <text x="684" y="462" fill="#59645e" font-size="13">Loki · Grafana</text>

  <rect x="368" y="526" width="224" height="62" rx="10" fill="#ffffff" stroke="#59645e" stroke-width="1.5" stroke-dasharray="6 5" />
  <text x="388" y="552" fill="#59645e" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.3">ВНЕШНИЙ · API МОДЕЛИ</text>
  <text x="388" y="576" fill="#17211b" font-family="Space Grotesk, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">Claude</text>

  <rect x="303" y="258" width="38" height="18" fill="#f7f7f4" />
  <text x="322" y="271" text-anchor="middle" fill="#59645e" font-size="11">состояние</text>
  <rect x="619" y="258" width="42" height="18" fill="#f7f7f4" />
  <text x="640" y="271" text-anchor="middle" fill="#59645e" font-size="11">инструменты</text>
  <rect x="486" y="354" width="42" height="18" fill="#f7f7f4" />
  <text x="507" y="367" text-anchor="middle" fill="#59645e" font-size="11">спаны</text>
  <rect x="606" y="394" width="44" height="18" fill="#f7f7f4" />
  <text x="628" y="407" text-anchor="middle" fill="#59645e" font-size="11">экспорт</text>
  <rect x="486" y="492" width="68" height="18" fill="#f7f7f4" />
  <text x="520" y="505" text-anchor="middle" fill="#59645e" font-size="11">вызов модели</text>
</svg>
