<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="light" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">Эталонный стек Docker Compose включает один worker в роли харнесса, три хранилища в его прямом управлении и три opt-in сервиса, включаемых флагами профилей.</title><desc id="composetop-desc">Worker на LangGraph выступает владельцем запуска и харнессом: получает задачи из очереди Redis, записывает чекпоинты в Postgres и читает холодную память из Qdrant. MCP sidecar изолирует креды инструментов от worker, коллектор OpenTelemetry собирает трейсы и метрики, а observability-стек хранит их — все три компонента включаются opt-in профилями Compose. Claude — внешний API модели, который worker вызывает напрямую.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="composetop-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#17211B" /></marker><marker id="composetop-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
