<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">В штатном агентном цикле pending intent сохраняется до dispatch, затем записывается outcome, создаётся checkpoint и выполняется eval; новый worker сначала reconciles pending intent.</title><desc id="runlife-desc">Этот иллюстративный сценарий показывает одну скоординированную операцию с побочным эффектом: boot, plan, сохранение pending intent и idempotency key, dispatch, сохранение outcome, checkpoint и eval. Независимые read-only или idempotent-вызовы могут выполняться параллельно с отдельными надёжно сохраняемыми записями и детерминированной агрегацией. Если worker падает после dispatch, но до записи outcome, он запускается с тем же session ID, reconciles pending intent и только затем продолжает работу. При провале eval выполнение возвращается к planning; при успешном eval завершается штатно.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
<defs><marker id="runlife-arrow-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#EDF5F0" /></marker><marker id="runlife-arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
