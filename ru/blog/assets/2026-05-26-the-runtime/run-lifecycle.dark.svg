<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="rl-title rl-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="rl-title">Жизненный цикл восстанавливаемого запуска агента</title>
  <desc id="rl-desc">Запуск загружается, планирует, выполняет действия, сохраняет чекпоинты и проходит эвал. При неуспешной эвалуации или подключении нового воркера выполнение продолжается с выделенного чекпоинта, а не начинается заново.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#A8B8AF}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#EDF5F0}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#A8B8AF}.num{font:600 13px "IBM Plex Mono",ui-monospace,monospace;fill:#141D19}.box{stroke:#EDF5F0;stroke-width:1.5;fill:#141D19}.edge{stroke:#A8B8AF;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="480" rx="14" fill="#0C1210" />
  <g><circle cx="62" cy="68" r="14" fill="#EDF5F0" /><text class="num" x="62" y="73" text-anchor="middle">1</text><circle cx="238" cy="68" r="14" fill="#EDF5F0" /><text class="num" x="238" y="73" text-anchor="middle">2</text><circle cx="414" cy="68" r="14" fill="#EDF5F0" /><text class="num" x="414" y="73" text-anchor="middle">3</text><circle cx="590" cy="68" r="14" fill="#EDF5F0" /><text class="num" x="590" y="73" text-anchor="middle">4</text><circle cx="766" cy="68" r="14" fill="#EDF5F0" /><text class="num" x="766" y="73" text-anchor="middle">5</text></g>
  <rect class="box" x="48" y="96" width="144" height="96" rx="10" /><text class="kind" x="68" y="130">ПРОЦЕСС</text><text class="name" x="68" y="158">Загрузка</text><text class="note" x="68" y="178">загрузить состояние</text>
  <rect class="box" x="224" y="96" width="144" height="96" rx="10" /><text class="kind" x="244" y="130">ПРОЦЕСС</text><text class="name" x="244" y="158">Планирование</text><text class="note" x="244" y="178">определить критерий готовности</text>
  <rect class="box" x="400" y="96" width="144" height="96" rx="10" /><text class="kind" x="420" y="130">ПРОЦЕСС</text><text class="name" x="420" y="158">Выполнение</text><text class="note" x="420" y="178">один tool call</text>
  <rect x="576" y="96" width="144" height="96" rx="10" fill="#2B1622" stroke="#FF6FB6" stroke-width="2.5" /><text class="kind" x="596" y="130" fill="#A8B8AF">ФОКУС</text><text class="name" x="596" y="158" fill="#A8B8AF">Чекпоинт</text><text class="note" x="596" y="178" fill="#A8B8AF">зафиксировать состояние</text>
  <path class="box" d="M824 96 912 144 824 192 736 144Z" /><text class="kind" x="824" y="136" text-anchor="middle">РЕШЕНИЕ</text><text class="name" x="824" y="160" text-anchor="middle">готово?</text>
  <path class="edge" d="M192 144h24" marker-end="url(#rl-arrow)" /><path class="edge" d="M368 144h24" marker-end="url(#rl-arrow)" /><path class="edge" d="M544 144h24" marker-end="url(#rl-arrow)" />  <path class="edge" d="M720 144h16" marker-end="url(#rl-arrow)" />
  <text class="note" x="865" y="222">да → выход</text><path class="edge" d="M824 192v36" marker-end="url(#rl-arrow)" />
  <path d="M760 157v103a20 20 0 0 1-20 20H472a20 20 0 0 1-20-20v-60" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#rl-signal)" /><text class="note" x="628" y="306" text-anchor="middle" fill="#A8B8AF">нет → продолжить с чекпоинта</text>
  <rect class="box" x="176" y="344" width="240" height="96" rx="10" stroke-dasharray="6 5" stroke="#A8B8AF" /><text class="kind" x="196" y="378">ВНЕШНЕЕ · НОВЫЙ ВОРКЕР</text><text class="name" x="196" y="406">Сбой или повторный деплой</text><text class="note" x="196" y="426">тот же ID сессии</text>
  <path d="M416 392h232a20 20 0 0 0 20-20V200" fill="none" stroke="#FF6FB6" stroke-width="1.5" marker-end="url(#rl-signal)" /><text class="note" x="492" y="382" fill="#A8B8AF">восстановить последнее корректное состояние</text>
  <text class="note" x="48" y="462">Каждый завершённый шаг сохраняется до начала следующего; теряется только незавершённая работа.</text>
  <defs><marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#A8B8AF" /></marker><marker id="rl-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#FF6FB6" /></marker></defs>
</svg>
