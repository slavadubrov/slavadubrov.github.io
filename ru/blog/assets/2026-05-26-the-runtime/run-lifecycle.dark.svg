<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 956" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="runlife-title runlife-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="runlife-title">В штатном запуске агент сохраняет незавершённое намерение до dispatch, записывает результат, затем создаёт чекпоинт и выполняет эвал; новый воркер сначала сверяет незавершённое намерение.</title><desc id="runlife-desc">Этот иллюстративный сценарий показывает одну скоординированную операцию с побочным эффектом: запуск, планирование, сохранение незавершённого намерения и ключа идемпотентности, dispatch, сохранение результата, создание чекпоинта и эвал. Независимые вызовы только для чтения или идемпотентные вызовы могут выполняться параллельно с отдельными долговечными записями и детерминированной агрегацией. Если воркер падает после dispatch, но до записи результата, он возобновляет работу с тем же ID сессии, сверяет незавершённое намерение и только затем продолжает. После неуспешного эвала выполнение возобновляется с планирования; после успешного эвала процесс корректно завершается.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
