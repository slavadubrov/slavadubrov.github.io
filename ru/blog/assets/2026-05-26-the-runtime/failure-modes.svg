<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="Inter, system-ui, sans-serif" data-visual-system="evidence-plate-v1" role="img" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" aria-labelledby="artifact-title artifact-desc">
  <title id="artifact-title">Сценарии отказа, которые должен пережить долгоживущий агент</title>
  <desc id="artifact-desc">Сценарии отказа, которые должен пережить долгоживущий агент.</desc>
  <defs>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.08" />
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>
  <style data-visual-system="evidence-plate-v1">
    * { animation: none !important; }
    .anim-box, .bar, .bar-text, .seq-item, .t-box, .flow { opacity: 1 !important; transform: none !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="940" height="600" fill="#f8fafc" />

  <text y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" x="470">Сценарии отказа, которые должен пережить долгоживущий агент</text>
  <text y="56" text-anchor="middle" font-size="13" fill="#334155" x="470">Слева: отказ. Справа: митигация и место в рантайме.</text>

  <!-- Column headers -->
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" letter-spacing="0.6" x="200">СЦЕНАРИЙ ОТКАЗА</text>
  <text y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.6" x="740">МИТИГАЦИЯ · ХУК РАНТАЙМА</text>

  <!-- Rows -->
  <!-- Row 1: Premature completion -->
  <g filter="url(#ds2)">
    <rect x="40" y="110" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#991b1b" x="56">Преждевременное завершение</text>
    <text y="152" font-size="11" fill="#334155" x="56">Агент объявляет победу после одного цикла</text>
  </g>
  <path d="M360 138 L 540 138" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="110" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="132" font-size="13" font-weight="700" fill="#166534" x="556">Независимый ревьюер со своим контекстом</text>
    <text y="152" font-size="11" fill="#334155" x="556">Инструменты только для чтения · каждая проверка по умолчанию FAIL</text>
  </g>

  <!-- Row 2: Feature amnesia -->
  <g filter="url(#ds2)">
    <rect x="40" y="178" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#991b1b" x="56">Амнезия признаков</text>
    <text y="220" font-size="11" fill="#334155" x="56">Каждый холодный старт забывает прошлый прогресс</text>
  </g>
  <path d="M360 206 L 540 206" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="178" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="200" font-size="13" font-weight="700" fill="#166534" x="556">Инициализатор перечитывает файлы прогресса при старте</text>
    <text y="220" font-size="11" fill="#334155" x="556">PROGRESS.md, feature-list.json · до первого вызова модели</text>
  </g>

  <!-- Row 3: Duplicated work -->
  <g filter="url(#ds2)">
    <rect x="40" y="246" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#991b1b" x="56">Повтор работы после сброса</text>
    <text y="288" font-size="11" fill="#334155" x="56">Тот же шаг запускается снова после рестарта процесса</text>
  </g>
  <path d="M360 274 L 540 274" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="246" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="268" font-size="13" font-weight="700" fill="#166534" x="556">Чекпоинт в Postgres + handoff-файл</text>
    <text y="288" font-size="11" fill="#334155" x="556">Журнал только для добавления · продолжение с последнего завершённого узла</text>
  </g>

  <!-- Row 4: Context anxiety -->
  <g filter="url(#ds2)">
    <rect x="40" y="314" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#991b1b" x="56">Тревога из-за контекста</text>
    <text y="356" font-size="11" fill="#334155" x="56">Модель завершает работу раньше, когда заполняется окно</text>
  </g>
  <path d="M360 342 L 540 342" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="314" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="336" font-size="13" font-weight="700" fill="#166534" x="556">Sonnet 4.5: ограничить использование 200k</text>
    <text y="356" font-size="11" fill="#334155" x="556">В контекстном окне на 1M токенов; сбросить и продолжить</text>
  </g>

  <!-- Row 5: Stuck loops -->
  <g filter="url(#ds2)">
    <rect x="40" y="382" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#991b1b" x="56">Зависшие циклы · штормы ретраев</text>
    <text y="424" font-size="11" fill="#334155" x="56">Один и тот же tool call повторяется бесконечно</text>
  </g>
  <path d="M360 410 L 540 410" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="382" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="404" font-size="13" font-weight="700" fill="#166534" x="556">Ограничить итерации · backoff · circuit breaker</text>
    <text y="424" font-size="11" fill="#334155" x="556">Декоратор tool call · Temporal RetryPolicy</text>
  </g>

  <!-- Row 6: Workspace drift -->
  <g filter="url(#ds2)">
    <rect x="40" y="450" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#991b1b" x="56">Дрейф рабочего пространства</text>
    <text y="492" font-size="11" fill="#334155" x="56">Агент редактирует файлы вне своей задачи</text>
  </g>
  <path d="M360 478 L 540 478" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="450" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="472" font-size="13" font-weight="700" fill="#166534" x="556">Рабочее пространство на сессию, доступ к путям ограничен областью</text>
    <text y="492" font-size="11" fill="#334155" x="556">Deep Agents middleware или форк Daytona/Runloop</text>
  </g>

  <!-- Row 7: Runaway cost / lost work -->
  <g filter="url(#ds2)">
    <rect x="40" y="518" width="320" height="56" rx="8" ry="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#991b1b" x="56">Неконтролируемые расходы · потеря работы при падении</text>
    <text y="560" font-size="11" fill="#334155" x="56">Расход бюджета · процесс или сэндбокс завершается</text>
  </g>
  <path d="M360 546 L 540 546" stroke="#94a3b8" stroke-width="1.4" fill="none" marker-end="url(#arr2)" />
  <g filter="url(#ds2)">
    <rect x="540" y="518" width="360" height="56" rx="8" ry="8" fill="#f0fdf4" stroke="#166534" stroke-width="1.4" />
    <text y="540" font-size="13" font-weight="700" fill="#166534" x="556">Бюджет токенов · kill switch · логирование вне процесса</text>
    <text y="560" font-size="11" fill="#334155" x="556">Счётчики gen_ai.usage · wake(sessionId) для продолжения</text>
  </g>
</svg>
