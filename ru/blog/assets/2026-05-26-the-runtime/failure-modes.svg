<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v1" aria-labelledby="fm-title fm-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="fm-title">Четыре класса сбоев и runtime-контроли, которые их сдерживают</title>
  <desc id="fm-desc">Сбои качества, стоимости, состояния и контекста сходятся на runtime-контролях. Гейт приёмки выделен, поскольку не позволяет агенту объявить незавершённую работу выполненной.</desc>
  <style data-visual-system="byte-diagram-v1">* { animation: none !important; }path,line{stroke-linecap:round;stroke-linejoin:round}.kind{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.3px;fill:#59645E}.name{font:600 16px "Space Grotesk",ui-sans-serif,system-ui,sans-serif;fill:#17211B}.note{font:400 13px "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;fill:#59645E}.section{font:600 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:1.6px;fill:#59645E}.box{stroke:#17211B;stroke-width:1.5;fill:#FFFFFF}.edge{stroke:#59645E;stroke-width:1.5;fill:none}</style>
  <rect width="960" height="560" rx="14" fill="#F7F7F4" />
  <text class="section" x="48" y="48">КЛАСС СБОЯ</text><text class="section" x="584" y="48">МЕХАНИЗМ СДЕРЖИВАНИЯ</text>
  <rect class="box" x="48" y="72" width="280" height="96" rx="10" /><text class="kind" x="68" y="106">СБОЙ · КАЧЕСТВО</text><text class="name" x="68" y="134">Преждевременное завершение</text><text class="note" x="68" y="154">забывание фич</text>
  <rect class="box" x="48" y="192" width="280" height="96" rx="10" /><text class="kind" x="68" y="226">СБОЙ · СТОИМОСТЬ</text><text class="name" x="68" y="254">Шторма ретраев</text><text class="note" x="68" y="274">неконтролируемый расход токенов</text>
  <rect class="box" x="48" y="312" width="280" height="96" rx="10" /><text class="kind" x="68" y="346">СБОЙ · СОСТОЯНИЕ</text><text class="name" x="68" y="374">Дублирование побочных эффектов</text><text class="note" x="68" y="394">дрейф воркспейса · потеря при падении</text>
  <rect class="box" x="48" y="432" width="280" height="80" rx="10" /><text class="kind" x="68" y="462">СБОЙ · КОНТЕКСТ</text><text class="name" x="68" y="490">Сброс теряет намерение</text>

  <rect x="584" y="72" width="328" height="96" rx="10" fill="#FDECF5" stroke="#F2148E" stroke-width="2.5" /><text class="kind" x="604" y="106" fill="#C50E72">ФОКУС · ГЕЙТ ПРИЁМКИ</text><text class="name" x="604" y="134" fill="#C50E72">Новый ревьюер отклоняет при сомнении</text>
  <rect class="box" x="584" y="192" width="328" height="96" rx="10" /><text class="kind" x="604" y="226">КОНТРОЛЬ · БЮДЖЕТ</text><text class="name" x="604" y="254">Лимиты · backoff · kill switch</text>
  <rect class="box" x="584" y="312" width="328" height="96" rx="10" /><text class="kind" x="604" y="346">КОНТРОЛЬ · СОХРАННОСТЬ</text><text class="name" x="604" y="374">Лог · чекпоинт · изоляция</text>
  <rect class="box" x="584" y="432" width="328" height="80" rx="10" /><text class="kind" x="604" y="462">КОНТРОЛЬ · ХОЛОДНЫЙ СТАРТ</text><text class="name" x="604" y="490">Перезагрузить артефакты прогресса</text>
  <path d="M328 120H576" fill="none" stroke="#F2148E" stroke-width="1.5" marker-end="url(#fm-signal)" /><text class="note" x="408" y="110" fill="#C50E72">проверить артефакты</text>
  <path class="edge" d="M328 240H576" marker-end="url(#fm-arrow)" /><text class="note" x="420" y="230">ограничить работу</text>
  <path class="edge" d="M328 360H576" marker-end="url(#fm-arrow)" /><text class="note" x="414" y="350">безопасно возобновить</text>
  <path class="edge" d="M328 472H576" marker-end="url(#fm-arrow)" /><text class="note" x="412" y="462">восстановить намерение</text>
  <text class="note" x="48" y="544">Митигации находятся вне памяти модели, поэтому те же контроли сохраняются после перезапуска воркера.</text>
  <defs><marker id="fm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#59645E" /></marker><marker id="fm-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#F2148E" /></marker></defs>
</svg>
