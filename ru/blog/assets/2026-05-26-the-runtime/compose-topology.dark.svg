<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 574" role="img" preserveAspectRatio="xMidYMid meet" data-visual-system="byte-diagram-v2" data-direction="B" data-theme="dark" aria-labelledby="composetop-title composetop-desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title id="composetop-title">Референсный стек Docker Compose включает один воркер в роли харнесса, три хранилища под его непосредственным управлением и три опциональных сервиса, включаемых флагами профилей.</title><desc id="composetop-desc">Воркер LangGraph выступает владельцем запуска и харнессом: забирает задачи из очереди Redis, записывает чекпоинты в Postgres и читает холодную память из Qdrant. В этом локальном Compose-демо используется только PostgresSaver; для сессии, приближенной к production, также нужна отдельно записываемая схема событий для интентов и результатов tool call. В локальном Compose воркер и MCP-сайдкар читают общий .env: воркер хранит креды для прямого вызова Claude API и может читать те же креды инструментов, что и сайдкар. Коллектор OpenTelemetry собирает трейсы и метрики, а observability-стек их хранит — все три компонента включаются опциональными профилями Compose.</desc>
<style data-visual-system="byte-diagram-v2">* { animation: none !important; }</style>
