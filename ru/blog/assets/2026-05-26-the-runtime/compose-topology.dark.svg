<text x="32" y="514" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Это локальное демо показывает PostgresSaver; в production записывается отдельная схема событий.</text>
<text x="32" y="536" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Локальный Compose использует общий .env: воркер хранит аутентификацию модели и может читать креды инструментов.</text>
<text x="32" y="558" font-family="IBM Plex Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A8B8AF">Для брокера кредов нужна новая маршрутизация воркера; здесь она не реализована.</text>
